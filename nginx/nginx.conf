map $arg_v $asset_cache_control {
    default                         "no-cache";
    "~^[A-Za-z0-9._-]{8,64}$"      "public, max-age=31536000, immutable";
}

resolver 127.0.0.11 valid=10s ipv6=off;
upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
    keepalive 16;
}

# Trust forwarding data only from a same-host reverse proxy. Compose maps this
# name to Docker's host gateway; arbitrary direct clients remain untrusted.
set_real_ip_from host.docker.internal;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server_tokens off;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    etag on;
    include /etc/nginx/security-headers.conf;

    error_page 404 /404.html;

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Deterministically query-versioned assets may be cached forever. Requests
    # without a valid version continue to revalidate, avoiding stale filenames.
    location ~* \.(?:css|js|wasm)$ {
        add_header Cache-Control $asset_cache_control always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Feedback UUIDs are bearer capabilities, so this location is intentionally
    # excluded from access logs. nginx replaces forwarded headers to prevent a
    # client from spoofing the one proxy hop trusted by Flask.
    location /api/ {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    include /etc/nginx/tool-redirects.conf;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
