services:
  edge:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    ports:
      - "${VT_WEB_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../runtime/edge:/etc/nginx/active-upstream:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/edge-health]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 4
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

networks:
  edge:
    name: virt-tools-edge
    external: true
