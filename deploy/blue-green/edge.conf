resolver 127.0.0.11 valid=10s ipv6=off;
include /etc/nginx/active-upstream/upstream.conf;

# Docker maps host-origin traffic to host.docker.internal. Trust only that
# explicitly supplied address so a same-host TLS proxy can restore the real
# client address; direct clients cannot spoof X-Forwarded-For.
set_real_ip_from host.docker.internal;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server_tokens off;

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    location = /edge-health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"check":"edge"}\n';
    }

    # Route feedback directly to the active API. This preserves the real client
    # address for privacy-preserving rate limiting and avoids logging UUID paths.
    location /api/ {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://active_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header Server;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://active_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Server;
    }
}
