<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.sc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.sc h1{font-size:2rem;margin-bottom:.5rem}
.sc .sub{color:#888;margin-bottom:1.5rem}
.sc label{font-size:14px;display:block;margin-bottom:4px}
.sc input,select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:1rem}
.sc .results{margin-top:1.5rem}
.sc .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.sc .card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.sc .card .big{font-size:1.5rem;font-weight:700;color:var(--accent)}
.sc .card .lbl{color:#888;font-size:12px;margin-bottom:4px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="sc">
<h1>💼 Salary Converter</h1>
<p class="sub">Convert between hourly, daily, weekly, monthly, and annual salary.</p>
<label for="amount">Amount:</label>
<input type="number" id="amount" value="25" min="0" step="0.01" oninput="calc()">
<label for="type">Input type:</label>
<select id="type" onchange="calc()">
<option value="hourly">Hourly</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
<option value="annual">Annual</option>
</select>
<label for="hours">Hours per week:</label>
<input type="number" id="hours" value="40" min="1" max="80" oninput="calc()">
<label for="weeks">Weeks worked per year:</label>
<input type="number" id="weeks" value="52" min="1" max="52" oninput="calc()">
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const amt=parseFloat(document.getElementById('amount').value)||0;
  const type=document.getElementById('type').value;
  const hrs=parseFloat(document.getElementById('hours').value)||40;
  const wks=parseFloat(document.getElementById('weeks').value)||52;
  let annual;
  switch(type){
    case'hourly':annual=amt*hrs*wks;break;
    case'daily':annual=amt*(wks/52)*5;break;
    case'weekly':annual=amt*wks;break;
    case'monthly':annual=amt*12;break;
    case'annual':annual=amt;break;
  }
  const hourly=annual/(hrs*wks);
  const daily=annual/(wks/52*5);
  const weekly=annual/wks;
  const monthly=annual/12;
  const fmt=v=>'$'+v.toLocaleString('en-US',{maximumFractionDigits:2});
  document.getElementById('results').innerHTML=
    '<div class="grid">'+
    '<div class="card"><div class="lbl">Hourly</div><div class="big">'+fmt(hourly)+'</div></div>'+
    '<div class="card"><div class="lbl">Daily (8h)</div><div class="big">'+fmt(daily)+'</div></div>'+
    '<div class="card"><div class="lbl">Weekly</div><div class="big">'+fmt(weekly)+'</div></div>'+
    '<div class="card"><div class="lbl">Monthly</div><div class="big">'+fmt(monthly)+'</div></div>'+
    '<div class="card" style="grid-column:1/-1"><div class="lbl">Annual</div><div class="big" style="font-size:2rem">'+fmt(annual)+'</div></div>'+
    '<div class="card" style="grid-column:1/-1"><div class="lbl">After ~22% tax (estimate)</div><div class="big" style="font-size:1.5rem;color:#e67e22">'+fmt(annual*0.78)+'/yr</div></div>'+
    '</div>';
}
calc();
</script>
</body>
</html>
