<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.mc{max-width:640px;margin:0 auto;padding:2rem 1rem}
.mc h1{font-size:2rem;margin-bottom:.5rem}
.mc .sub{color:#888;margin-bottom:1.5rem}
.mc label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.mc input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.mc .row{display:flex;gap:1rem}
.mc .row>div{flex:1}
.mc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.mc .results{margin-top:2rem}
.mc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.mc .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.mc .res-card .lbl{color:#888;font-size:13px}
.mc .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="mc">
<h1>🏠 Mortgage Calculator</h1>
<p class="sub">Calculate monthly mortgage payments with down payment, PMI, property tax, and insurance.</p>
<div class="row">
<div><label for="price">Home price ($):</label>
<input type="number" id="price" value="400000" min="0" oninput="calc()"></div>
<div><label for="down">Down payment ($):</label>
<input type="number" id="down" value="80000" min="0" oninput="calc()"></div>
</div>
<div class="row">
<div><label for="rate">Interest rate (%):</label>
<input type="number" id="rate" value="6.5" min="0" step="0.01" oninput="calc()"></div>
<div><label for="years">Term (years):</label>
<input type="number" id="years" value="30" min="1" oninput="calc()"></div>
</div>
<div class="row">
<div><label for="tax">Annual property tax ($):</label>
<input type="number" id="tax" value="4800" min="0" oninput="calc()"></div>
<div><label for="ins">Annual insurance ($):</label>
<input type="number" id="ins" value="1200" min="0" oninput="calc()"></div>
</div>
<label for="pmi">PMI rate (%/year, if down < 20%):</label>
<input type="number" id="pmi" value="0.5" min="0" step="0.01" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const price=parseFloat(document.getElementById('price').value)||0;
  const down=parseFloat(document.getElementById('down').value)||0;
  const principal=price-down;
  const rate=(parseFloat(document.getElementById('rate').value)||0)/100/12;
  const n=(parseFloat(document.getElementById('years').value)||1)*12;
  const tax=(parseFloat(document.getElementById('tax').value)||0)/12;
  const ins=(parseFloat(document.getElementById('ins').value)||0)/12;
  const downPct=price>0?down/price*100:100;
  const pmiRate=downPct<20?(parseFloat(document.getElementById('pmi').value)||0)/100/12*principal:0;
  let monthly;
  if(rate===0)monthly=principal/n;
  else monthly=principal*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1);
  const totalMonthly=monthly+tax+ins+pmiRate;
  const totalInterest=monthly*n-principal;
  let html='<div class="grid3">';
  html+='<div class="res-card"><div class="lbl">Principal & Interest</div><div class="big">$'+monthly.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">+ Tax / Insurance / PMI</div><div class="big">$'+(tax+ins+pmiRate).toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Monthly</div><div class="big" style="color:#27ae60">$'+totalMonthly.toFixed(2)+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Loan Amount</div><div class="big">$'+principal.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Interest Paid</div><div class="big" style="color:#e74c3c">$'+totalInterest.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Cost (P&I)</div><div class="big">$'+(principal+totalInterest).toFixed(2)+'</div></div>';
  if(downPct<20)html+='<div class="res-card"><div class="lbl">Down Payment % (PMI applies)</div><div class="big">'+downPct.toFixed(1)+'%</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
