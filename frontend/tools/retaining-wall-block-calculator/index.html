<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Retaining Wall Block Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Retaining Wall Block Calculator</h1>
<p>Calculate the number of retaining wall blocks needed from wall length, height, and block dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wl">Wall length</label><input type="text" id="in-wl" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-wh">Wall height</label><input type="text" id="in-wh" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-bl">Block length</label><input type="text" id="in-bl" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.4"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-bh">Block height</label><input type="text" id="in-bh" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.2"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall and block dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wlEl=document.getElementById("in-wl"),whEl=document.getElementById("in-wh"),blEl=document.getElementById("in-bl"),bhEl=document.getElementById("in-bh"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var WL=pn(wlEl.value),WH=pn(whEl.value),BL=pn(blEl.value),BH=pn(bhEl.value);
if(WL==null||WH==null||BL==null||BH==null){return}
if(!isFinite(WL)||!isFinite(WH)||!isFinite(BL)||!isFinite(BH)||WL<=0||WH<=0||BL<=0||BH<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var perRow=Math.ceil(WL/BL);
var rows=Math.ceil(WH/BH);
var total=perRow*rows;
var html='<div class="big">'+total+' blocks</div>';
html+=row("Blocks per row",perRow);
html+=row("Rows",rows);
html+=row("Total blocks",total);
html+=row("Wall area",rnd(WL*WH,2)+" m²");
out.innerHTML=html;
}
[wlEl,whEl,blEl,bhEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
