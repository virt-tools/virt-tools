<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Foot Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Board Foot Calculator</h1>
<p class="subtitle">Calculate board feet, cost, and waste for lumber projects.</p>
<div class="input-section">
<label>Thickness (inches)</label>
<input type="number" id="thick" value="1.5" min="0.25" step="0.125" aria-label="Thick">
<label>Width (inches)</label>
<input type="number" id="width" value="5.5" min="0.25" step="0.125" aria-label="Width">
<label>Length (feet)</label>
<input type="number" id="length" value="8" min="0.5" step="0.5" aria-label="Length">
<label>Quantity</label>
<input type="number" id="qty" value="10" min="1" aria-label="Qty">
<label>Price per Board Foot ($)</label>
<input type="number" id="price" value="3.50" min="0" step="0.01" aria-label="Price">
<label>Waste Allowance (%)</label>
<input type="number" id="waste" value="10" min="0" max="50" aria-label="Waste">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const t=parseFloat(document.getElementById('thick').value)||0;
const w=parseFloat(document.getElementById('width').value)||0;
const l=parseFloat(document.getElementById('length').value)||0;
const q=parseInt(document.getElementById('qty').value)||1;
const p=parseFloat(document.getElementById('price').value)||0;
const waste=parseFloat(document.getElementById('waste').value)||0;
const bfEach=(t*w*l)/12;
const bfTotal=bfEach*q;
const bfWithWaste=bfTotal*(1+waste/100);
const cost=bfWithWaste*p;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Board Feet Each:</span><span>${bfEach.toFixed(3)} bf</span></div>
<div class="result-row"><span>Total Board Feet:</span><span>${bfTotal.toFixed(3)} bf</span></div>
<div class="result-row"><span>With ${waste}% Waste:</span><span>${bfWithWaste.toFixed(3)} bf</span></div>
<div class="result-row"><span>Total Cost:</span><span>$${cost.toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
