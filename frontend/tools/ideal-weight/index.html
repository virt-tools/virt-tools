<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideal Weight Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Ideal Weight Calculator</h1>
<p class="subtitle">Multiple formula estimates: Devine, Robinson, Miller, Hamwi.</p>

<div class="input-section">
  <label>Gender</label>
  <select id="gender" aria-label="Gender"><option value="male">Male</option><option value="female">Female</option></select>

  <label>Height (cm)</label>
  <input type="number" id="height" value="175" min="120" max="230" step="0.5" aria-label="Height">

  <label>Frame size</label>
  <select id="frame" aria-label="Frame"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option></select>

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const gender = document.getElementById('gender').value;
    const h = parseFloat(document.getElementById('height').value) || 0;
    const frame = document.getElementById('frame').value;
    if (h <= 0) return;

    const heightIn = h / 2.54;
    const over60 = heightIn - 60;

    const devine = gender === 'male' ? 50 + 2.3 * over60 : 45.5 + 2.3 * over60;
    const robinson = gender === 'male' ? 52 + 1.9 * over60 : 49 + 1.7 * over60;
    const miller = gender === 'male' ? 56.2 + 1.41 * over60 : 53.1 + 1.36 * over60;
    const hamwi = gender === 'male' ? 48 + 2.7 * over60 : 45.5 + 2.2 * over60;

    let adj = 1;
    if (frame === 'small') adj = 0.9;
    if (frame === 'large') adj = 1.1;

    const bmiMin = 18.5 * (h/100) ** 2;
    const bmiMax = 25 * (h/100) ** 2;

    document.getElementById('bigResult').textContent = `Devine: ${devine.toFixed(1)} kg`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Robinson:</span><span>${robinson.toFixed(1)} kg</span></div>
      <div class="result-row"><span>Miller:</span><span>${miller.toFixed(1)} kg</span></div>
      <div class="result-row"><span>Hamwi:</span><span>${hamwi.toFixed(1)} kg</span></div>
      <div class="result-row"><span>Devine (adjusted):</span><span>${(devine * adj).toFixed(1)} kg</span></div>
      <div class="result-row"><span>BMI healthy range:</span><span>${bmiMin.toFixed(1)} – ${bmiMax.toFixed(1)} kg</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
