<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tree Stake Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tree Stake Calculator</h1>
<p>Calculate stake height, guy wire length, and number of stakes for tree support from tree height and canopy spread. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Tree height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-r">Anchor radius</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),rEl=document.getElementById("in-r"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),R=pn(rEl.value);
if(H==null||R==null)return;
if(!isFinite(H)||!isFinite(R)||H<=0||R<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var stakeH=Math.ceil(H*0.6);
var numStakes=3;
var guyLen=Math.sqrt(H*H*0.36+R*R);
var totalWire=guyLen*numStakes;
var html='<div class="big">'+stakeH+' ft</div>';
html+=row("Tree height",rnd(H,0)+' ft');
html+=row("Stake height",stakeH+' ft');
html+=row("Number of stakes",numStakes);
html+=row("Guy wire per stake",rnd(guyLen,1)+' ft');
html+=row("Total guy wire",rnd(totalWire,0)+' ft');
out.innerHTML=html;
}
[hEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
