<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Collage Maker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Collage Maker</h1>
<p class="subtitle">Combine multiple images into a grid collage. Adjustable columns and gap. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Upload Images: <input type="file" id="files" accept="image/*" multiple></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Columns: <input type="number" id="cols" value="3" min="1" max="10" style="width:60px"></label>
<label>Gap (px): <input type="number" id="gap" value="10" min="0" max="50" style="width:60px"></label>
<label>Tile size: <input type="number" id="tile" value="200" min="50" max="500" style="width:60px"></label>
<button onclick="makeCollage()" type="button">Create</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var imgs=[];
document.getElementById('files').addEventListener('change',function(){
imgs=[];for(var f of this.files){var im=new Image();im.src=URL.createObjectURL(f);imgs.push(im);}
});
function makeCollage(){
if(!imgs.length)return;
var c=parseInt(document.getElementById('cols').value),g=parseInt(document.getElementById('gap').value),t=parseInt(document.getElementById('tile').value);
var rows=Math.ceil(imgs.length/c);
var W=c*t+(c-1)*g,H=rows*t+(rows-1)*g;
var cv=document.getElementById('canvas');cv.width=W;cv.height=H;
var ctx=cv.getContext('2d');ctx.fillStyle='#222';ctx.fillRect(0,0,W,H);
var n=0;
var check=function(){for(var i=0;i<imgs.length;i++)if(!imgs[i].complete)return false;return true;};
var render=function(){
for(var i=0;i<imgs.length;i++){
var r=Math.floor(i/c),col=i%c;
var x=col*(t+g),y=r*(t+g);
var iw=imgs[i].naturalWidth,ih=imgs[i].naturalHeight,s=Math.min(t/iw,t/ih);
var dw=iw*s,dh=ih*s;ctx.drawImage(imgs[i],x+(t-dw)/2,y+(t-dh)/2,dw,dh);
}
};
if(check())render();else imgs.forEach(function(im){im.onload=render;});
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='collage.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
