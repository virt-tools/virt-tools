<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Suspension Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Suspension Logging Calculator</h1>
<p>Calculate P-wave and S-wave velocities from suspension logger receiver spacing and travel time. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sp">Receiver spacing</label><input type="text" id="in-sp" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-tp">P-wave time</label><input type="text" id="in-tp" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">ms</div></div>
<div class="field"><label class="f" for="in-ts">S-wave time</label><input type="text" id="in-ts" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">ms</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var spE=document.getElementById("in-sp"),tpE=document.getElementById("in-tp"),tsE=document.getElementById("in-ts"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var sp=parseFloat(spE.value),tp=parseFloat(tpE.value),ts=parseFloat(tsE.value);
if(isNaN(sp)||isNaN(tp)||isNaN(ts))return;
if(tp<=0||ts<=0||sp<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var vp=sp/(tp/1000),vs=sp/(ts/1000);
if(vp<=vs){err.textContent="Vp must be greater than Vs — check the P-wave and S-wave times.";return}
var poisson=(vp*vp-2*vs*vs)/(2*(vp*vp-vs*vs));
var html='<div class="big">Vp='+Math.round(vp)+' m/s</div>';
html+=row("P-wave velocity Vp",Math.round(vp)+' m/s');
html+=row("S-wave velocity Vs",Math.round(vs)+' m/s');
html+=row("Poisson's ratio (est.)",Math.round(poisson*100)/100);
out.innerHTML=html;
}
[spE,tpE,tsE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
