<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wind Turbine Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wind Turbine Spacing Calculator</h1>
<p>Calculate optimal wind turbine spacing, row distance, and farm footprint from rotor diameter and number of turbines. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Rotor diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 90"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-num">Number of turbines</label><input type="text" id="in-num" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">units</div></div>
<div class="field"><label class="f" for="in-rows">Number of rows</label><input type="text" id="in-rows" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">rows</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),nE=document.getElementById("in-num"),rE=document.getElementById("in-rows"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var d=pn(dE.value),n=pn(nE.value),r=pn(rE.value);
if(d==null||n==null||r==null)return;
if(!isFinite(d)||d<=0||!isFinite(n)||n<0){err.textContent="Enter a valid rotor diameter and turbine count.";return}
if(!isFinite(r)||r<=0){err.textContent="Number of rows must be at least 1.";return}
err.textContent="";
var crossSpacing=d*5;
var rowSpacing=d*8;
var perRow=n/r;
var farmWidth=perRow*crossSpacing;
var farmLength=r*rowSpacing;
var area=farmWidth*farmLength/1000000;
var html='<div class="big">'+(Math.round(crossSpacing))+' m</div>';
html+=row("Cross-wind spacing",Math.round(crossSpacing)+' m');
html+=row("Downwind spacing",Math.round(rowSpacing)+' m');
html+=row("Farm footprint",Math.round(area*100)/100+' km²');
out.innerHTML=html;
}
[dE,nE,rE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
