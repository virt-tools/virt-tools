<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Shuffler — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>List Shuffler</h1>
<p class="subtitle">Shuffle lines randomly using Fisher-Yates. Copy the result with one click.</p>
<div class="input-section">
<label>Enter items (one per line)</label>
<textarea id="items" rows="12" placeholder="Item 1&#10;Item 2&#10;Item 3" aria-label="Item 1&#10;Item 2&#10;Item 3"></textarea>
<button id="shuffle" class="primary-btn" type="button">Shuffle</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}
document.getElementById('shuffle').addEventListener('click',()=>{
const lines=document.getElementById('items').value.split('\n').filter(s=>s.trim().length>0);
if(lines.length===0){document.getElementById('result').innerHTML='<p class="warning">Enter some items first.</p>';document.getElementById('result').style.display='block';return;}
const shuffled=shuffle([...lines]);
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap">'+shuffled.join('\n')+'</pre>';
document.getElementById('result').style.display='block';
window._shuffled=shuffled.join('\n');
});
document.getElementById('copy').addEventListener('click',()=>{
if(window._shuffled)navigator.clipboard.writeText(window._shuffled);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
