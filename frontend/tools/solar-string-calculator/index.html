<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Solar String Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Solar String Calculator</h1>
<p>Calculate max panels per string, string voltage, and total power from panel Voc, inverter max voltage, and panel wattage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-voc">Panel Voc</label><input type="text" id="in-voc" inputmode="decimal" autocomplete="off" placeholder="e.g. 49.8"><div class="unit">volts</div></div>
<div class="field"><label class="f" for="in-vmax">Inverter max V</label><input type="text" id="in-vmax" inputmode="decimal" autocomplete="off" placeholder="e.g. 600"><div class="unit">volts</div></div>
<div class="field"><label class="f" for="in-pw">Panel wattage</label><input type="text" id="in-pw" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">watts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vEl=document.getElementById("in-voc"),mEl=document.getElementById("in-vmax"),pEl=document.getElementById("in-pw"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Voc=pn(vEl.value),Vmax=pn(mEl.value),Pw=pn(pEl.value);
if(Voc==null||Vmax==null||Pw==null)return;
if(!isFinite(Voc)||Voc<=0||!isFinite(Vmax)||Vmax<=0||!isFinite(Pw)||Pw<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var maxPanels=Math.floor(Vmax/(Voc*1.2));
var stringV=maxPanels*Voc;
var totalW=maxPanels*Pw;
var html='<div class="big">'+maxPanels+' panels/string</div>';
html+=row("Max panels per string",maxPanels);
html+=row("String voltage (STC)",rnd(stringV,1)+' V');
html+=row("String power",rnd(totalW,0)+' W');
html+=row("String power",rnd(totalW/1000,2)+' kW');
html+=row("Safety factor","1.2× Voc");
out.innerHTML=html;
}
[vEl,mEl,pEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
