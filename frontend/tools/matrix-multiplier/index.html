<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Multiplier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Matrix Multiplication Calculator</h1>
<p class="subtitle">Multiply two matrices and display the result with step-by-step computation.</p>
<div class="input-section">
<h3>Matrix A</h3>
<label>Rows</label>
<input type="number" id="aRows" value="2" min="1" max="6" style="width:60px;display:inline" aria-label="A Rows">
<label>Cols</label>
<input type="number" id="aCols" value="2" min="1" max="6" style="width:60px;display:inline" aria-label="A Cols">
<div id="matrixA" style="margin:10px 0"></div>
<h3>Matrix B</h3>
<label>Rows (must = A cols)</label>
<input type="number" id="bRows" value="2" min="1" max="6" style="width:60px;display:inline" aria-label="B Rows">
<label>Cols</label>
<input type="number" id="bCols" value="2" min="1" max="6" style="width:60px;display:inline" aria-label="B Cols">
<div id="matrixB" style="margin:10px 0"></div>
<button id="calc" class="primary-btn" type="button">Multiply</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function buildMatrix(id,rows,cols){
const c=document.getElementById(id);
c.innerHTML='';
for(let i=0;i<rows;i++){
let row='<div style="display:flex;gap:5px;margin:3px 0">';
for(let j=0;j<cols;j++){
const v=(i+j)%2===0?1:2;
row+=`<input type="number" id="${id}_${i}_${j}" value="${v}" style="width:50px" step="any" aria-label="${Id} ${I} ${J}">`;
}
row+='</div>';
c.innerHTML+=row;
}
}
function getMatrix(id,rows,cols){
let m=[];
for(let i=0;i<rows;i++){let row=[];for(let j=0;j<cols;j++)row.push(parseFloat(document.getElementById(id+'_'+i+'_'+j).value)||0);m.push(row);}
return m;
}
function multiply(A,B){
let result=[];
for(let i=0;i<A.length;i++){
let row=[];
for(let j=0;j<B[0].length;j++){
let sum=0;
for(let k=0;k<B.length;k++)sum+=A[i][k]*B[k][j];
row.push(sum);
}
result.push(row);
}
return result;
}
document.addEventListener('DOMContentLoaded',()=>{
function rebuild(){buildMatrix('matrixA',parseInt(document.getElementById('aRows').value),parseInt(document.getElementById('aCols').value));buildMatrix('matrixB',parseInt(document.getElementById('bRows').value),parseInt(document.getElementById('bCols').value));}
rebuild();
['aRows','aCols','bRows','bCols'].forEach(id=>document.getElementById(id).addEventListener('change',rebuild));
document.getElementById('calc').addEventListener('click',()=>{
const ar=parseInt(document.getElementById('aRows').value),ac=parseInt(document.getElementById('aCols').value);
const br=parseInt(document.getElementById('bRows').value),bc=parseInt(document.getElementById('bCols').value);
if(ac!==br){document.getElementById('result').innerHTML='<p class="warning">A columns must equal B rows.</p>';document.getElementById('result').style.display='block';return;}
const A=getMatrix('matrixA',ar,ac),B=getMatrix('matrixB',br,bc);
const C=multiply(A,B);
let html='<h3>Result (A × B):</h3><table class="result-table">';
C.forEach(row=>{html+='<tr>';row.forEach(v=>html+=`<td>${v.toFixed(4)}</td>`);html+='</tr>';});
html+='</table>';
html+=`<div class="result-row"><span>Result dimensions:</span><span>${ar}×${bc}</span></div>`;
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
