<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Irrigation Timer Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Irrigation Timer Calculator</h1>
<p>Calculate irrigation run time per zone from water need, flow rate, and zone area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Water depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-gpm">Zone flow</label><input type="text" id="in-gpm" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">gpm</div></div>
<div class="field"><label class="f" for="in-area">Zone area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">sq ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var depthEl=document.getElementById("in-depth"),gpmEl=document.getElementById("in-gpm"),areaEl=document.getElementById("in-area"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Depth=pn(depthEl.value),Gpm=pn(gpmEl.value),Area=pn(areaEl.value);
if(Depth==null||Gpm==null||Area==null)return;
if(!isFinite(Depth)||!isFinite(Gpm)||!isFinite(Area)||Depth<=0||Gpm<=0||Area<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var galNeeded=Depth*0.623*Area;
var runMin=galNeeded/Gpm;
var html='<div class="big">'+rnd(runMin,0)+' min</div>';
html+=row("Water needed",rnd(galNeeded,0)+' gal');
html+=row("Zone flow",rnd(Gpm,1)+' gpm');
html+=row("Run time",rnd(runMin,0)+' min');
html+=row("Weekly (×3)",rnd(runMin*3,0)+' min');
out.innerHTML=html;
}
[depthEl,gpmEl,areaEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
