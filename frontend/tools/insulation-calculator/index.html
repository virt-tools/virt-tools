<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insulation Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Insulation Calculator</h1>
<p class="subtitle">Estimate insulation batts, rolls, and R-value coverage for walls and attic.</p>
<div class="input-section">
<label>Area Type</label>
<select id="type" aria-label="Type"><option value="wall">Wall</option><option value="attic">Attic Floor</option></select>
<label>Length (ft)</label>
<input type="number" id="len" value="40" min="0" aria-label="Len">
<label>Height/Width (ft)</label>
<input type="number" id="hei" value="8" min="0" aria-label="Hei">
<label>Stud Spacing (in)</label>
<select id="stud" aria-label="Stud"><option value="16">16"</option><option value="24">24"</option></select>
<label>R-Value</label>
<select id="rval" aria-label="Rval"><option value="13">R-13</option><option value="15">R-15</option><option value="19">R-19</option><option value="21">R-21</option><option value="30">R-30</option><option value="38">R-38</option><option value="49">R-49</option></select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const T=document.getElementById('type').value;
const L=parseFloat(document.getElementById('len').value)||0;
const H=parseFloat(document.getElementById('hei').value)||0;
const S=parseInt(document.getElementById('stud').value);
const R=parseInt(document.getElementById('rval').value);
const area=L*H;
const battWidth=S/12;
const battArea=battWidth*8;
const batts=Math.ceil(area/battArea);
const bags=Math.ceil(area/40);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Total Area:</span><span>${area.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>Insulation Batt/Roll:</span><span>${batts} pieces (8ft × ${(S/12).toFixed(2)}ft)</span></div>
<div class="result-row"><span>Blown Bags:</span><span>${bags} bags (covers ~40 sq ft at R-${R})</span></div>
<div class="result-row"><span>R-Value:</span><span>R-${R}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
