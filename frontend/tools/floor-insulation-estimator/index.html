<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Floor Insulation Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Floor Insulation Estimator</h1>
<p>Estimate floor insulation material quantity, cost, and R-value from floor area, thickness, and material type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Floor area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-thick">Insulation thickness</label><input type="text" id="in-thick" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-rper">R-value per inch</label><input type="text" id="in-rper" inputmode="decimal" autocomplete="off" placeholder="e.g. 3.5"><div class="unit">per 2.54 cm</div></div>
<div class="field"><label class="f" for="in-cost">Cost per m²</label><input type="text" id="in-cost" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">$</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter floor area.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-area"),tEl=document.getElementById("in-thick"),rEl=document.getElementById("in-rper"),cEl=document.getElementById("in-cost"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),T=pn(tEl.value),R=pn(rEl.value),C=pn(cEl.value);
if(A==null){return}
T=T==null?0.1:T;R=R==null?3.5:R;C=C==null?15:C;
if(!isFinite(A)||!isFinite(T)||A<=0||T<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vol=A*T;
var rVal=T/0.0254*R;
var totalCost=A*C;
var html='<div class="big">'+rnd(vol,2)+' m³</div>';
html+=row("Floor area",rnd(A,0)+" m²");
html+=row("Insulation thickness",rnd(T*100,1)+" cm");
html+=row("Material volume",rnd(vol,2)+" m³");
html+=row("Total R-value",rnd(rVal,1));
html+=row("Cost per m²","$"+rnd(C,2));
html+=row("Total cost","$"+rnd(totalCost,0));
out.innerHTML=html;
}
[aEl,tEl,rEl,cEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
