<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Area Converter</h1>
<p class="subtitle">Convert between m², ft², acres, hectares, square miles, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Square Meter (m²)</option>
<option value="0.0001">Square Centimeter (cm²)</option>
<option value="0.000001">Square Millimeter (mm²)</option>
<option value="10000">Hectare (ha)</option>
<option value="1000000">Square Kilometer (km²)</option>
<option value="0.09290304">Square Foot (ft²)</option>
<option value="0.00064516">Square Inch (in²)</option>
<option value="0.83612736">Square Yard (yd²)</option>
<option value="2589988.11">Square Mile (mi²)</option>
<option value="4046.85642">Acre (ac)</option>
<option value="0.404686">Acre (survey)</option>
<option value="100">Are (a)</option>
<option value="4046.8726">Acre (US survey)</option>
<option value="10000">Hectare</option>
<option value="0.00089675">Square Rod</option>
<option value="2529.28526">Morgen</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Square Meter (m²)',1],['Square Kilometer (km²)',1e6],['Square Centimeter (cm²)',0.0001],['Square Millimeter (mm²)',1e-6],['Hectare (ha)',1e4],['Are (a)',100],['Square Foot (ft²)',0.09290304],['Square Inch (in²)',0.00064516],['Square Yard (yd²)',0.83612736],['Acre (ac)',4046.85642],['Square Mile (mi²)',2589988.11],['Square Rod',25.29285],['Morgen',2529.285],['Township',93239572],['Section (1 mi²)',2589988.11]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const m2=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=m2/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
