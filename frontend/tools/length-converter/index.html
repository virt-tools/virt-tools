<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Length Converter</h1>
<p class="subtitle">Convert between any length units — metric, imperial, nautical, astronomical.</p>
<div class="input-section">
<label for="value">Value</label>
<input type="number" id="value" value="1" step="any">
<label for="from">From unit</label>
<select id="from"></select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" role="status" style="display:none;"></div>
<p class="note">Picas and points use computer typography (6 picas or 72 points per inch). Feet and chains use the international foot. Astronomical units are approximate here.</p>
<script>
const UNITS=[['Meter (m)',1],['Kilometer (km)',1000],['Centimeter (cm)',0.01],['Millimeter (mm)',0.001],['Micrometer (µm)',1e-6],['Nanometer (nm)',1e-9],['Inch (in)',0.0254],['Foot (ft)',0.3048],['Yard (yd)',0.9144],['Mile (mi)',1609.344],['Nautical Mile (nmi)',1852],['Light Year (ly)',9.461e15],['Astronomical Unit (AU)',1.496e11],['Parsec (pc)',3.086e16],['Fathom',1.8288],['Chain',20.1168],['Rod',5.0292],['Furlong',201.168],['Pica (computer)',0.0254/6],['Point (computer)',0.0254/72],['Angstrom (Å)',1e-10]];
document.addEventListener('DOMContentLoaded',()=>{
const input=document.getElementById('value'),select=document.getElementById('from'),result=document.getElementById('result');
UNITS.forEach(([name,factor])=>{const option=document.createElement('option');option.textContent=name;option.value=String(factor);select.append(option);});
[input,select].forEach(control=>control.addEventListener('input',()=>{result.replaceChildren();result.style.display='none';input.removeAttribute('aria-invalid');}));
document.getElementById('calc').addEventListener('click',()=>{
const v=Number(input.value),f=Number(select.value);
result.replaceChildren();result.style.display='block';
if(!input.value.trim()||!Number.isFinite(v)){result.textContent='Enter a finite number.';input.setAttribute('aria-invalid','true');return;}
const meters=v*f;
const values=UNITS.map(([,factor])=>factor===f?v:meters/factor);
if(!values.every(Number.isFinite)){result.textContent='Result is outside the supported numeric range.';return;}
UNITS.forEach(([name],index)=>{const row=document.createElement('div');row.className='result-row';const label=document.createElement('span'),output=document.createElement('span');label.textContent=name;const r=values[index];output.textContent=r!==0&&(Math.abs(r)<1e-6||Math.abs(r)>=1e12)?r.toExponential(10):r.toLocaleString(undefined,{maximumSignificantDigits:12});row.append(label,output);result.append(row);});
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
