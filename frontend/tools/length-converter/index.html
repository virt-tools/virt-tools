<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Length Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Length Converter</h1>
<p class="subtitle">Convert between any length units — metric, imperial, nautical, astronomical.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Meter (m)</option>
<option value="0.001">Millimeter (mm)</option>
<option value="0.01">Centimeter (cm)</option>
<option value="0.000001">Micrometer (µm)</option>
<option value="1e-9">Nanometer (nm)</option>
<option value="1000">Kilometer (km)</option>
<option value="9.461e15">Light Year (ly)</option>
<option value="1.496e11">AU</option>
<option value="3.086e16">Parsec (pc)</option>
<option value="0.3048">Foot (ft)</option>
<option value="0.0254">Inch (in)</option>
<option value="0.9144">Yard (yd)</option>
<option value="201.168">Furlong</option>
<option value="1609.344">Mile (mi)</option>
<option value="1852">Nautical Mile (nmi)</option>
<option value="0.000823">Pica</option>
<option value="0.000175">Point (pt)</option>
<option value="5.0292">Chain</option>
<option value="20.1168">Chain (Gunter)</option>
<option value="1.8288">Fathom</option>
<option value="0.0000001">Angstrom (Å)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Meter (m)',1],['Kilometer (km)',1000],['Centimeter (cm)',0.01],['Millimeter (mm)',0.001],['Micrometer (µm)',1e-6],['Nanometer (nm)',1e-9],['Inch (in)',0.0254],['Foot (ft)',0.3048],['Yard (yd)',0.9144],['Mile (mi)',1609.344],['Nautical Mile (nmi)',1852],['Light Year (ly)',9.461e15],['Astronomical Unit (AU)',1.496e11],['Parsec (pc)',3.086e16],['Fathom',1.8288],['Chain',20.1168],['Furlong',201.168],['Pica',0.000823],['Point (pt)',0.000175],['Angstrom (Å)',1e-10]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const meters=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=meters/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
