<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Pivot Table — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Pivot Table</h1>
<p class="subtitle">Create pivot tables from CSV data — group by rows and columns, aggregate values. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="region,product,sales&#10;North,Apple,100&#10;South,Apple,50&#10;North,Banana,80" aria-label="Region,Product,Sales&#10;North,Apple,100&#10;South,Apple,50&#10;North,Banana,80"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Rows:</label><select id="rowCol" aria-label="Row Col"></select>
<label>Cols:</label><select id="colCol" aria-label="Col Col"></select>
<label>Value:</label><select id="valCol" aria-label="Val Col"></select>
<select id="aggFunc" aria-label="Agg Func"><option value="sum">Sum</option><option value="avg">Avg</option><option value="count">Count</option><option value="max">Max</option><option value="min">Min</option></select>
<button id="run" class="primary-btn" type="button">Pivot</button>
</div>
</div>
<div id="result" style="margin-top:1em;overflow-x:auto;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
const input=document.getElementById('input');
const rowSel=document.getElementById('rowCol');
const colSel=document.getElementById('colCol');
const valSel=document.getElementById('valCol');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){
const opts=rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join('');
rowSel.innerHTML=opts;colSel.innerHTML=opts;valSel.innerHTML=opts;
}
});
document.getElementById('run').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];const data=rows.slice(1);
const rIdx=parseInt(rowSel.value);
const cIdx=parseInt(colSel.value);
const vIdx=parseInt(valSel.value);
const func=document.getElementById('aggFunc').value;
const rowKeys=new Set();const colKeys=new Set();
const cells={};
data.forEach(r=>{
const rk=r[rIdx]||'';const ck=r[cIdx]||'';
const v=parseFloat(r[vIdx])||0;
rowKeys.add(rk);colKeys.add(ck);
if(!cells[rk])cells[rk]={};
if(!cells[rk][ck])cells[rk][ck]=[];
cells[rk][ck].push(v);
});
function agg(vals){
if(func==='sum')return vals.reduce((a,b)=>a+b,0);
if(func==='avg')return vals.reduce((a,b)=>a+b,0)/vals.length;
if(func==='count')return vals.length;
if(func==='max')return Math.max(...vals);
if(func==='min')return Math.min(...vals);
return 0;
}
const sortedRows=[...rowKeys].sort();
const sortedCols=[...colKeys].sort();
let html='<table style="border-collapse:collapse;width:100%;"><thead><tr><th style="border:1px solid #ddd;padding:4px 8px;">'+header[rIdx]+'</th>';
sortedCols.forEach(c=>html+='<th style="border:1px solid #ddd;padding:4px 8px;">'+c+'</th>');
html+='</tr></thead><tbody>';
sortedRows.forEach(rk=>{
html+='<tr><td style="border:1px solid #ddd;padding:4px 8px;font-weight:bold;">'+rk+'</td>';
sortedCols.forEach(ck=>{
const v=cells[rk]&&cells[rk][ck]?agg(cells[rk][ck]):'';
html+='<td style="border:1px solid #ddd;padding:4px 8px;text-align:right;">'+(v!==''?Math.round(v*10000)/10000:'')+'</td>';
});
html+='</tr>';
});
html+='</tbody></table>';
document.getElementById('result').innerHTML=html;
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
