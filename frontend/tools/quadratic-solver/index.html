<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadratic Equation Solver — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Quadratic Equation Solver</h1>
<p class="subtitle">Solve ax² + bx + c = 0 with the quadratic formula and discriminant analysis.</p>
<div class="input-section">
<label>a</label>
<input type="number" id="a" value="1" step="any" aria-label="A">
<label>b</label>
<input type="number" id="b" value="-5" step="any" aria-label="B">
<label>c</label>
<input type="number" id="c" value="6" step="any" aria-label="C">
<button id="calc" class="primary-btn" type="button">Solve</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const a=parseFloat(document.getElementById('a').value)||0;
const b=parseFloat(document.getElementById('b').value)||0;
const c=parseFloat(document.getElementById('c').value)||0;
if(a===0){document.getElementById('result').innerHTML='<p class="warning">a must not be 0 (not quadratic).</p>';document.getElementById('result').style.display='block';return;}
const disc=b*b-4*a*c;
let html=`<div class="result-row"><span>Equation:</span><span>${a}x² + (${b})x + (${c}) = 0</span></div>`;
html+=`<div class="result-row"><span>Discriminant:</span><span>${disc.toFixed(4)}</span></div>`;
if(disc>0){
const x1=(-b+Math.sqrt(disc))/(2*a),x2=(-b-Math.sqrt(disc))/(2*a);
html+=`<div class="result-row"><span>Roots:</span><span>x₁ = ${x1.toFixed(6)}, x₂ = ${x2.toFixed(6)}</span></div>`;
html+=`<p class="hint">Two real roots (discriminant > 0)</p>`;
}else if(disc===0){
const x=-b/(2*a);
html+=`<div class="result-row"><span>Root:</span><span>x = ${x.toFixed(6)} (double root)</span></div>`;
html+=`<p class="hint">One real root (discriminant = 0)</p>`;
}else{
const re=(-b/(2*a)).toFixed(6),im=(Math.sqrt(-disc)/(2*a)).toFixed(6);
html+=`<div class="result-row"><span>Roots:</span><span>x₁ = ${re} + ${im}i, x₂ = ${re} − ${im}i</span></div>`;
html+=`<p class="hint">Two complex conjugate roots (discriminant < 0)</p>`;
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
