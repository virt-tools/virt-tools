<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Ground Rod Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Ground Rod Spacing Calculator</h1>
<p>Calculate minimum recommended spacing between ground rods based on rod length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rod">Rod length</label><input type="text" id="in-rod" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-num">Number of rods</label><input type="text" id="in-num" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">rods</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter rod length and number of rods.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rodEl=document.getElementById("in-rod"),numEl=document.getElementById("in-num"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(rodEl.value),N=pn(numEl.value);
if(L==null||N==null)return;
if(!isFinite(L)||!isFinite(N)||L<=0||N<1){err.textContent="Enter valid positive values.";return}
err.textContent="";
var minSpacing=Math.max(L,6);
var totalSpan=(N-1)*minSpacing;
var html='<div class="big">'+rnd(minSpacing,1)+' ft</div>';
html+=row("Rod length",rnd(L,1)+" ft");
html+=row("Number of rods",N);
html+=row("Min spacing (≥ rod length, ≥6 ft)",rnd(minSpacing,1)+" ft");
html+=row("Total span",rnd(totalSpan,1)+" ft");
html+=row("Bonding conductor","6 AWG Cu min");
out.innerHTML=html;
}
[rodEl,numEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
