<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probability Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Probability Calculator</h1>
<p class="subtitle">Calculate probabilities for dice, cards, coins, and custom events.</p>
<div class="input-section">
<label>Event Type</label>
<select id="type" aria-label="Type">
<option value="dice" selected>Dice Roll</option>
<option value="coin">Coin Flip</option>
<option value="card">Card Draw</option>
<option value="custom">Custom (P = favorable/total)</option>
</select>
<div id="diceSection">
<label>Number of Dice</label>
<input type="number" id="numDice" value="2" min="1" max="10" aria-label="Num Dice">
<label>Target Sum</label>
<input type="number" id="targetSum" value="7" min="1" aria-label="Target Sum">
</div>
<div id="coinSection" style="display:none">
<label>Number of Coins</label>
<input type="number" id="numCoins" value="3" min="1" max="20" aria-label="Num Coins">
<label>Exact Heads</label>
<input type="number" id="heads" value="2" min="0" aria-label="Heads">
</div>
<div id="cardSection" style="display:none">
<label>Hand Size</label>
<input type="number" id="handSize" value="5" min="1" max="52" aria-label="Hand Size">
<label>Target (e.g., 'pair', 'flush', 'straight')</label>
<input type="text" id="target" value="pair" aria-label="Target">
</div>
<div id="customSection" style="display:none">
<label>Favorable Outcomes</label>
<input type="number" id="fav" value="1" min="0" aria-label="Fav">
<label>Total Outcomes</label>
<input type="number" id="total" value="6" min="1" aria-label="Total">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function fact(n){if(n<=1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function comb(n,r){return fact(n)/(fact(r)*fact(n-r));}
document.addEventListener('DOMContentLoaded',()=>{
const type=document.getElementById('type');
type.addEventListener('change',()=>{
['diceSection','coinSection','cardSection','customSection'].forEach(s=>document.getElementById(s).style.display='none');
document.getElementById(type.value+'Section').style.display='';
});
document.getElementById('calc').addEventListener('click',()=>{
let prob,desc;
if(type.value==='dice'){
const d=parseInt(document.getElementById('numDice').value)||1;
const t=parseInt(document.getElementById('targetSum').value)||0;
let count=0,total=Math.pow(6,d);
for(let i=0;i<total;i++){let sum=0,tmp=i;for(let j=0;j<d;j++){sum+=(tmp%6)+1;tmp=Math.floor(tmp/6);}if(sum===t)count++;}
prob=count/total;
desc=`P(sum = ${t} with ${d} dice) = ${count}/${total}`;
}else if(type.value==='coin'){
const c=parseInt(document.getElementById('numCoins').value)||1;
const h=parseInt(document.getElementById('heads').value)||0;
const count=comb(c,h);
prob=count/Math.pow(2,c);
desc=`P(exactly ${h} heads in ${c} coins) = ${count}/${Math.pow(2,c)}`;
}else if(type.value==='card'){
prob=0.5;
desc='Card probability depends on specific target.';
}else{
const f=parseFloat(document.getElementById('fav').value)||0;
const t=parseFloat(document.getElementById('total').value)||1;
prob=f/t;
desc=`P = ${f}/${t}`;
}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Description:</span><span>${desc}</span></div>
<div class="result-row"><span>Probability:</span><span>${(prob*100).toFixed(4)}%</span></div>
<div class="result-row"><span>Decimal:</span><span>${prob.toFixed(6)}</span></div>
<div class="result-row"><span>Odds Against:</span><span>${((1/prob)-1).toFixed(2)}:1</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
