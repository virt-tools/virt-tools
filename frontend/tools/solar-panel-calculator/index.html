<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Panel Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Solar Panel Calculator</h1>
<p class="subtitle">Estimate solar panel system size, output, and savings.</p>

<div class="input-section">
  <label>Daily Energy Use (kWh)</label>
  <input type="number" id="usage" value="30" min="1" aria-label="Usage">
  <label>Sun Hours / Day</label>
  <input type="number" id="sun" value="5" min="1" step="0.5" aria-label="Sun">
  <label>Panel Wattage (W)</label>
  <input type="number" id="pw" value="400" min="100" aria-label="Pw">
  <label>System Efficiency (%)</label>
  <input type="number" id="eff" value="80" min="50" max="100" aria-label="Eff">
  <label>Electricity Rate ($/kWh)</label>
  <input type="number" id="rate" value="0.15" min="0" step="0.01" aria-label="Rate">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const usage = parseFloat(document.getElementById('usage').value) || 0;
    const sun = parseFloat(document.getElementById('sun').value) || 0;
    const pw = parseFloat(document.getElementById('pw').value) || 0;
    const eff = (parseFloat(document.getElementById('eff').value) || 0) / 100;
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    const dailyWh = usage * 1000;
    const systemW = dailyWh / (sun * eff);
    const panels = Math.ceil(systemW / pw);
    const totalSystemW = panels * pw;
    const dailyOutput = (totalSystemW * sun * eff) / 1000;
    const yearlyOutput = dailyOutput * 365;
    const yearlySavings = yearlyOutput * rate;
    document.getElementById('bigResult').textContent = `${panels} panels`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>System size:</span><span>${(totalSystemW/1000).toFixed(2)} kW</span></div>
      <div class="result-row"><span>Panels needed:</span><span>${panels} × ${pw}W</span></div>
      <div class="result-row"><span>Daily output:</span><span>${dailyOutput.toFixed(1)} kWh</span></div>
      <div class="result-row"><span>Yearly output:</span><span>${yearlyOutput.toFixed(0)} kWh</span></div>
      <div class="result-row"><span>Yearly savings:</span><span>$${yearlySavings.toFixed(0)}</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
