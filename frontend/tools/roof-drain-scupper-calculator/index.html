<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Roof Drain Scupper Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Roof Drain Scupper Calculator</h1>
<p>Calculate scupper size, count, and overflow capacity from roof area, rainfall rate, and head height. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ra">Roof area</label><input type="text" id="in-ra" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-rr">Rainfall rate</label><input type="text" id="in-rr" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in/hr</div></div>
<div class="field"><label class="f" for="in-hh">Head height</label><input type="text" id="in-hh" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var raEl=document.getElementById("in-ra"),rrEl=document.getElementById("in-rr"),hhEl=document.getElementById("in-hh"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RA=pn(raEl.value),RR=pn(rrEl.value),HH=pn(hhEl.value);
if(RA==null||RR==null||HH==null)return;
if(!isFinite(RA)||!isFinite(RR)||!isFinite(HH)||RA<=0||RR<=0||HH<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var q=RA*RR/12/3600*448.8;
var scupperW=q*231/60/(0.67*HH*Math.sqrt(2*32.2*HH/12)*12);
var count=Math.max(1,Math.ceil(scupperW/12));
var eachW=Math.ceil(scupperW/count);
var html='<div class="big">'+rnd(q,0)+' gpm</div>';
html+=row("Roof area",rnd(RA,0)+' sq ft');
html+=row("Rainfall",rnd(RR,1)+' in/hr');
html+=row("Head height",rnd(HH,1)+' in');
html+=row("Flow rate",rnd(q,0)+' gpm');
html+=row("Scupper count",rnd(count,0));
html+=row("Each width",rnd(eachW,0)+' in');
out.innerHTML=html;
}
[raEl,rrEl,hhEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
