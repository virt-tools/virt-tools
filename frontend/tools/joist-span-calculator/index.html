<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Joist Span Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Joist Span Calculator</h1>
<p>Estimate maximum allowable joist span based on wood species, joist size, and spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-size">Joist size</label><input type="text" id="in-size" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">mm depth</div></div>
<div class="field"><label class="f" for="in-oc">Spacing</label><input type="text" id="in-oc" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-grade">Wood grade factor</label><input type="text" id="in-grade" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.0"><div class="unit">multiplier</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter joist size.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sEl=document.getElementById("in-size"),oEl=document.getElementById("in-oc"),gEl=document.getElementById("in-grade"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var S=pn(sEl.value),O=pn(oEl.value),G=pn(gEl.value);
if(S==null){return}
O=O==null?400:O;G=G==null?1:G;
if(!isFinite(S)||!isFinite(O)||S<=0||O<=0||G<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var span=S*0.016*G*Math.sqrt(600/O);
var html='<div class="big">'+rnd(span,2)+' m</div>';
html+=row("Joist depth",rnd(S,0)+" mm");
html+=row("Spacing",rnd(O,0)+" mm");
html+=row("Grade factor",rnd(G,2));
html+=row("Max allowable span",rnd(span,2)+" m");
out.innerHTML=html;
}
[sEl,oEl,gEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
