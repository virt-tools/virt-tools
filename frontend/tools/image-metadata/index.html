<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Metadata Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Metadata Viewer</h1>
<p class="subtitle">View EXIF metadata, dimensions, file size, and type of any image. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div id="results" style="margin-top:15px"></div>
<img id="preview" style="max-width:300px;margin-top:10px;display:none">
<script>
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
var out=document.getElementById('results');
var url=URL.createObjectURL(f);
var img=new Image();img.onload=function(){
var d=[];
d.push(['File name',f.name]);
d.push(['File size',(f.size/1024).toFixed(2)+' KB']);
d.push(['File type',f.type]);
d.push(['Last modified',new Date(f.lastModified).toLocaleString()]);
d.push(['Width',img.naturalWidth+' px']);
d.push(['Height',img.naturalHeight+' px']);
d.push(['Aspect ratio',(img.naturalWidth/img.naturalHeight).toFixed(3)]);
var mp=(img.naturalWidth*img.naturalHeight/1000000).toFixed(2);
d.push(['Megapixels',mp+' MP']);
var html='<table style="border-collapse:collapse;width:100%"><tbody>';
d.forEach(function(r){
html+='<tr><td style="border:1px solid #444;padding:6px;font-weight:bold">'+r[0]+'</td><td style="border:1px solid #444;padding:6px">'+r[1]+'</td></tr>';
});
html+='</tbody></table>';
out.innerHTML=html;
var p=document.getElementById('preview');p.src=url;p.style.display='block';
};
img.src=url;
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
