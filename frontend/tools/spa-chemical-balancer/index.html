<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Spa Chemical Balancer — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Spa Chemical Balancer</h1>
<p>Balance spa pH, total alkalinity, and calcium hardness. Get dosing recommendations for your hot tub or spa. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vol">Spa volume</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">gallons</div></div>
<div class="field"><label class="f" for="in-ph">Current pH</label><input type="text" id="in-ph" inputmode="decimal" autocomplete="off" placeholder="e.g. 7.0"><div class="unit">0-14</div></div>
<div class="field"><label class="f" for="in-ta">Total alkalinity</label><input type="text" id="in-ta" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">ppm</div></div>
<div class="field"><label class="f" for="in-ch">Calcium hardness</label><input type="text" id="in-ch" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ppm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var volEl=document.getElementById("in-vol"),phEl=document.getElementById("in-ph"),taEl=document.getElementById("in-ta"),chEl=document.getElementById("in-ch"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(volEl.value),PH=pn(phEl.value),TA=pn(taEl.value),CH=pn(chEl.value);
if(V==null||PH==null||TA==null||CH==null)return;
if(!isFinite(V)||!isFinite(PH)||!isFinite(TA)||!isFinite(CH)||V<=0||PH<0||PH>14||TA<0||CH<0){err.textContent="Enter valid values.";return}
err.textContent="";
var pHAdj="",pHOz=0;
if(PH<7.2){pHAdj="Add pH Up (soda ash)";pHOz=(7.4-PH)*V/1000;}
else if(PH>7.8){pHAdj="Add pH Down (muriatic)";pHOz=(PH-7.6)*V/1000;}
else{pHAdj="pH is balanced";}
var taAdj="",taOz=0;
if(TA<80){taAdj="Add baking soda";taOz=(80-TA)*V/10000*1.5;}
else if(TA>120){taAdj="Add muriatic acid";taOz=(TA-120)*V/10000;}
else{taAdj="TA is balanced";}
var chAdj="",chOz=0;
if(CH<150){chAdj="Add calcium chloride";chOz=(150-CH)*V/10000*0.13;}
else if(CH>250){chAdj="Dilute with fresh water";chOz=0;}
else{chAdj="CH is balanced";}
var html='<div class="big">'+rnd(pHOz+taOz+chOz,1)+' oz total</div>';
html+=row("pH status",pHAdj);
html+=row("pH dose",rnd(pHOz,1)+' oz');
html+=row("TA status",taAdj);
html+=row("TA dose",rnd(taOz,1)+' oz');
html+=row("CH status",chAdj);
html+=row("CH dose",rnd(chOz,1)+' oz');
out.innerHTML=html;
}
[volEl,phEl,taEl,chEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
