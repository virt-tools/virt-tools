<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Concrete Curing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select,.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Concrete Curing Calculator</h1>
<p>Estimate concrete cure time and strength gain based on mix type, ambient temperature, and humidity. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Ambient temp</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 70"><div class="unit">°F</div></div>
<div class="field"><label class="f" for="in-m">Mix type</label><select id="in-m"><option value="">Select…</option><option value="standard">Standard (Type I)</option><option value="rapid">Rapid-set (Type III)</option><option value="lowheat">Low-heat (Type IV)</option></select><div class="unit">cement</div></div>
<div class="field"><label class="f" for="in-h">Humidity</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tEl=document.getElementById("in-t"),mEl=document.getElementById("in-m"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var T=pn(tEl.value),M=mEl.value,H=pn(hEl.value);
if(T==null||!M||H==null)return;
if(!isFinite(T)||T<-20||T>120||!isFinite(H)||H<0||H>100){err.textContent="Enter valid values.";return}
err.textContent="";
var baseDays={standard:7,rapid:3,lowheat:14};
var base=baseDays[M];
var tempFactor=70/Math.max(T,32);
var humFactor=H<50?1.3:1.0;
var cureDays=base*tempFactor*humFactor;
var strength7d=M==="rapid"?0.85:M==="lowheat"?0.40:0.65;
var strength28d=M==="rapid"?1.0:M==="lowheat"?0.85:1.0;
var html='<div class="big">'+rnd(cureDays,1)+' days</div>';
html+=row("Est. cure time",rnd(cureDays,1)+' days');
html+=row("7-day strength",rnd(strength7d*100,0)+'% of 28d');
html+=row("28-day strength","100%");
html+=row("Temp factor",rnd(tempFactor,2)+'×');
html+=row("Humidity factor",rnd(humFactor,2)+'×');
out.innerHTML=html;
}
[tEl,mEl,hEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
