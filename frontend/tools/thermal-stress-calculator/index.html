<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Thermal Stress Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Thermal Stress Calculator</h1>
<p>Calculate thermal stress, strain, and expansion from temperature change, material expansion coefficient, and member length. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dt">Temp change</label><input type="text" id="in-dt" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">°F</div></div>
<div class="field"><label class="f" for="in-a">Expansion coeff</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 6.5e-6"><div class="unit">1/°F</div></div>
<div class="field"><label class="f" for="in-l">Member length</label><input type="text" id="in-l" inputmode="numeric" autocomplete="off" placeholder="e.g. 240"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-e">Elastic modulus</label><input type="text" id="in-e" inputmode="numeric" autocomplete="off" placeholder="e.g. 29000000"><div class="unit">psi</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dtEl=document.getElementById("in-dt"),aEl=document.getElementById("in-a"),lEl=document.getElementById("in-l"),eEl=document.getElementById("in-e"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var DT=parseFloat(dtEl.value),A=parseFloat(aEl.value),L=parseInt(lEl.value),E=parseInt(eEl.value);
if(isNaN(DT)||isNaN(A)||isNaN(L)||isNaN(E))return;
if(DT<=0||A<=0||L<=0||E<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var strain=A*DT;
var stress=E*strain;
var expansion=strain*L;
var html='<div class="big">'+Math.round(stress)+' psi</div>';
html+=row("Thermal strain",strain.toExponential(4));
html+=row("Thermal stress",Math.round(stress)+' psi');
html+=row("Free expansion",Math.round(expansion*10000)/10000+' in');
html+=row("Stress if restrained",Math.round(stress/1000)+' ksi');
out.innerHTML=html;
}
[dtEl,aEl,lEl,eEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
