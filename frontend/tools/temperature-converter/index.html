<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Temperature Converter</h1>
<p class="subtitle">Convert between Celsius, Fahrenheit, Kelvin, Rankine, Delisle, Newton, Réaumur, and Rømer.</p>
<div class="input-section">
<label for="value">Value</label>
<input type="number" id="value" value="25" step="any">
<label for="from">From unit</label>
<select id="from">
<option value="C" selected>Celsius (°C)</option>
<option value="F">Fahrenheit (°F)</option>
<option value="K">Kelvin (K)</option>
<option value="R">Rankine (°R)</option>
<option value="De">Delisle (°De)</option>
<option value="N">Newton (°N)</option>
<option value="Re">Réaumur (°Ré)</option>
<option value="Ro">Rømer (°Rø)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" role="status" style="display:none;"></div>
<p class="note">Converts absolute temperatures, not temperature differences. Values below absolute zero are not supported.</p>
<script>
function toC(v,from){
switch(from){
case 'C':return v;
case 'F':return(v-32)*5/9;
case 'K':return v-273.15;
case 'R':return(v-491.67)*5/9;
case 'De':return 100-v*2/3;
case 'N':return v*100/33;
case 'Re':return v*5/4;
case 'Ro':return(v-7.5)*40/21;
}
}
function fromC(c,to){
switch(to){
case 'C':return c;
case 'F':return c*9/5+32;
case 'K':return c+273.15;
case 'R':return(c+273.15)*9/5;
case 'De':return(100-c)*3/2;
case 'N':return c*33/100;
case 'Re':return c*4/5;
case 'Ro':return c*21/40+7.5;
}
}
document.addEventListener('DOMContentLoaded',()=>{
const result=document.getElementById('result');
['value','from'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{result.replaceChildren();result.style.display='none';}));
document.getElementById('calc').addEventListener('click',()=>{
const raw=document.getElementById('value').value;
const v=Number(raw);
result.replaceChildren();result.style.display='block';
if(!raw.trim()||!Number.isFinite(v)){result.textContent='Enter a finite number.';return;}
const f=document.getElementById('from').value;
const c=toC(v,f);
if(c < -273.1500000001){result.textContent='Temperature cannot be below absolute zero.';return;}
const units=[['C','°C'],['F','°F'],['K','K'],['R','°R'],['De','°De'],['N','°N'],['Re','°Ré'],['Ro','°Rø']];
const values=units.map(([code])=>code===f?v:fromC(c,code));
if(!values.every(Number.isFinite)){result.textContent='Result is outside the supported numeric range.';return;}
units.forEach(([,sym],index)=>{const row=document.createElement('div');row.className='result-row';const label=document.createElement('span'),output=document.createElement('span');label.textContent=sym;output.textContent=values[index].toLocaleString(undefined,{maximumSignificantDigits:12});row.append(label,output);result.append(row);});
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
