<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Temperature Converter</h1>
<p class="subtitle">Convert between Celsius, Fahrenheit, Kelvin, Rankine, Delisle, Newton, Réaumur, and Rømer.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="25" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="C" selected>Celsius (°C)</option>
<option value="F">Fahrenheit (°F)</option>
<option value="K">Kelvin (K)</option>
<option value="R">Rankine (°R)</option>
<option value="De">Delisle (°De)</option>
<option value="N">Newton (°N)</option>
<option value="Re">Réaumur (°Ré)</option>
<option value="Ro">Rømer (°Rø)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function toC(v,from){
switch(from){
case 'C':return v;
case 'F':return(v-32)*5/9;
case 'K':return v-273.15;
case 'R':return(v-491.67)*5/9;
case 'De':return 100-v*2/3;
case 'N':return v*100/33;
case 'Re':return v*5/4;
case 'Ro':return(v-7.5)*40/21;
}
}
function fromC(c,to){
switch(to){
case 'C':return c;
case 'F':return c*9/5+32;
case 'K':return c+273.15;
case 'R':return(c+273.15)*9/5;
case 'De':return(100-c)*3/2;
case 'N':return c*33/100;
case 'Re':return c*4/5;
case 'Ro':return c*21/40+7.5;
}
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=document.getElementById('from').value;
const c=toC(v,f);
const units=[['C','°C'],['F','°F'],['K','K'],['R','°R'],['De','°De'],['N','°N'],['Re','°Ré'],['Ro','°Rø']];
let html='';
units.forEach(([code,sym])=>{
const r=fromC(c,code);
html+=`<div class="result-row"><span>${sym}:</span><span>${r.toFixed(4)}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
