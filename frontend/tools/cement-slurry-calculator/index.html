<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cement Slurry Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cement Slurry Calculator</h1>
<p>Calculate cement slurry volume, yield, and water requirement for well cementing operations. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Cement weight</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 94"><div class="unit">lbs/sack</div></div>
<div class="field"><label class="f" for="in-wr">Water ratio</label><input type="text" id="in-wr" inputmode="decimal" autocomplete="off" placeholder="e.g. 5.2"><div class="unit">gal/sack</div></div>
<div class="field"><label class="f" for="in-sg">Specific gravity</label><input type="text" id="in-sg" inputmode="decimal" autocomplete="off" placeholder="e.g. 3.14"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wE=document.getElementById("in-w"),wrE=document.getElementById("in-wr"),sgE=document.getElementById("in-sg"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var w=parseFloat(wE.value),wr=parseFloat(wrE.value),sg=parseFloat(sgE.value);
if(isNaN(w)||isNaN(wr)||isNaN(sg))return;
if(sg<=0){err.textContent="Enter valid specific gravity.";return}
err.textContent="";
var volCement=w/(sg*8.34);
var volWater=wr;
var totalVol=volCement+volWater;
var totalWt=w+wr*8.34;
var slurryWt=totalWt/totalVol;
var yield=totalVol/7.48;
var html='<div class="big">'+Math.round(slurryWt*100)/100+' lb/gal</div>';
html+=row("Slurry density",Math.round(slurryWt*100)/100+' lb/gal');
html+=row("Slurry yield",Math.round(yield*100)/100+' ft³/sack');
html+=row("Total volume",Math.round(totalVol*100)/100+' gal/sack');
out.innerHTML=html;
}
[wE,wrE,sgE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
