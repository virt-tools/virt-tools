<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Mortar Mix Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Mortar Mix Calculator</h1>
<p>Calculate cement and sand quantities for a mortar mix based on volume and mix ratio. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">Volume needed</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">cu ft</div></div>
<div class="field"><label class="f" for="in-r">Mix ratio (cement:sand)</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 1:3"><div class="unit">ratio</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vEl=document.getElementById("in-v"),rEl=document.getElementById("in-r"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(vEl.value);
var R=String(rEl.value||"").trim();
if(V==null)return;
if(!isFinite(V)||V<=0){err.textContent="Enter valid positive volume.";return}
var parts=R.split(":");
if(parts.length!=2){err.textContent="Enter ratio as cement:sand (e.g. 1:3).";return}
var c=Number(parts[0]),s=Number(parts[1]);
if(!isFinite(c)||c<=0||!isFinite(s)||s<=0){err.textContent="Enter valid ratio numbers.";return}
err.textContent="";
var dryVol=V*1.3;
var totalParts=c+s;
var cementVol=dryVol*(c/totalParts);
var sandVol=dryVol*(s/totalParts);
var cementLb=cementVol*94/1;
var sandLb=sandVol*100;
var html='<div class="big">'+rnd(cementLb,0)+' lb cement</div>';
html+=row("Cement",rnd(cementLb,0)+' lb ('+rnd(cementVol,2)+' cu ft)');
html+=row("Sand",rnd(sandLb,0)+' lb ('+rnd(sandVol,2)+' cu ft)');
html+=row("Dry volume",rnd(dryVol,2)+' cu ft');
html+=row("Wet volume",rnd(V,2)+' cu ft');
html+=row("Mix ratio",R);
out.innerHTML=html;
}
[vEl,rEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
