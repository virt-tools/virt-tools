<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antenna Length Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Antenna Length Calculator</h1>
<p class="subtitle">Calculate dipole and monopole antenna dimensions for any frequency.</p>
<div class="input-section">
<label>Frequency (MHz)</label>
<input type="number" id="freq" value="146" min="0.1" step="0.001" aria-label="Freq">
<label>Antenna Type</label>
<select id="type" aria-label="Type">
<option value="dipole" selected>Half-Wave Dipole</option>
<option value="monopole">Quarter-Wave Monopole</option>
<option value="fullwave">Full-Wave Loop</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const f=parseFloat(document.getElementById('freq').value)||0;
const type=document.getElementById('type').value;
const wavelength=299.792458/f;
const halfWave=wavelength/2;
const quarterWave=wavelength/4;
const fullWave=wavelength;
let lengthM, legM, desc;
if(type==='dipole'){lengthM=halfWave;legM=halfWave/2;desc='Each leg is 1/4 wavelength';}
else if(type==='monopole'){lengthM=quarterWave;legM=quarterWave;desc='Single vertical element';}
else{lengthM=fullWave;legM=fullWave/4;desc='Loop circumference is 1 wavelength';}
const lengthFt=lengthM*3.28084;
const legFt=legM*3.28084;
const lengthIn=lengthFt*12;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Frequency:</span><span>${f} MHz</span></div>
<div class="result-row"><span>Wavelength:</span><span>${wavelength.toFixed(4)} m (${(wavelength*3.28084).toFixed(2)} ft)</span></div>
<div class="result-row"><span>Total Length:</span><span>${lengthM.toFixed(4)} m (${lengthFt.toFixed(2)} ft)</span></div>
<div class="result-row"><span>Each Section:</span><span>${legM.toFixed(4)} m (${legFt.toFixed(2)} ft)</span></div>
<p class="hint">${desc}</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
