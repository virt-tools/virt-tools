<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractions Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Fractions Calculator</h1>
<p class="subtitle">Add, subtract, multiply, divide, and simplify fractions with step-by-step working.</p>
<div class="input-section">
<label>First Fraction</label>
<input type="number" id="n1" value="1" style="width:60px;display:inline" aria-label="N1"> /
<input type="number" id="d1" value="2" style="width:60px;display:inline" aria-label="D1">
<label>Operation</label>
<select id="op" aria-label="Op">
<option value="+">Add (+)</option>
<option value="-">Subtract (−)</option>
<option value="*">Multiply (×)</option>
<option value="/">Divide (÷)</option>
</select>
<label>Second Fraction</label>
<input type="number" id="n2" value="3" style="width:60px;display:inline" aria-label="N2"> /
<input type="number" id="d2" value="4" style="width:60px;display:inline" aria-label="D2">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function simplify(n,d){const g=gcd(n,d);return[n/g,d/g];}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const n1=parseInt(document.getElementById('n1').value)||0,d1=parseInt(document.getElementById('d1').value)||1;
const n2=parseInt(document.getElementById('n2').value)||0,d2=parseInt(document.getElementById('d2').value)||1;
const op=document.getElementById('op').value;
let rn,rd,steps;
if(op==='+'){rn=n1*d2+n2*d1;rd=d1*d2;steps=`${n1}/${d1} + ${n2}/${d2} = (${n1}×${d2}+${n2}×${d1})/(${d1}×${d2}) = ${rn}/${rd}`;}
else if(op==='-'){rn=n1*d2-n2*d1;rd=d1*d2;steps=`${n1}/${d1} − ${n2}/${d2} = (${n1}×${d2}−${n2}×${d1})/(${d1}×${d2}) = ${rn}/${rd}`;}
else if(op==='*'){rn=n1*n2;rd=d1*d2;steps=`${n1}/${d1} × ${n2}/${d2} = (${n1}×${n2})/(${d1}×${d2}) = ${rn}/${rd}`;}
else{rn=n1*d2;rd=d1*n2;steps=`${n1}/${d1} ÷ ${n2}/${d2} = (${n1}×${d2})/(${d1}×${n2}) = ${rn}/${rd}`;}
const[sn,sd]=simplify(rn,rd);
const decimal=(sn/sd).toFixed(6);
document.getElementById('result').innerHTML=`
<p class="hint">${steps}</p>
<div class="result-row"><span>Result:</span><span>${sn}/${sd}</span></div>
<div class="result-row"><span>Simplified:</span><span>${sn}/${sd}</span></div>
<div class="result-row"><span>Decimal:</span><span>${decimal}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
