<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sod Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Sod Calculator</h1>
<p class="subtitle">Estimate sod pallets, rolls, and cost for your lawn.</p>
<div class="input-section">
<label>Lawn Length (ft)</label>
<input type="number" id="len" value="50" min="0" aria-label="Len">
<label>Lawn Width (ft)</label>
<input type="number" id="wid" value="30" min="0" aria-label="Wid">
<label>Price per sq ft ($)</label>
<input type="number" id="price" value="0.50" min="0" step="0.01" aria-label="Price">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const P=parseFloat(document.getElementById('price').value)||0;
const area=L*W;
const waste=area*0.05;
const total=area+waste;
const rolls=Math.ceil(total/9);
const pallets=Math.ceil(rolls/50);
const cost=total*P;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Lawn Area:</span><span>${area.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>With 5% Waste:</span><span>${total.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>Sod Rolls (9 sq ft):</span><span>${rolls}</span></div>
<div class="result-row"><span>Pallets (50 rolls):</span><span>${pallets}</span></div>
<div class="result-row"><span>Estimated Cost:</span><span>$${cost.toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
