<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Permeability Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Permeability Calculator</h1>
<p>Calculate hydraulic conductivity (k) from constant-head permeability test flow rate, head, and specimen dimensions. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-q">Flow rate</label><input type="text" id="in-q" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">cm³/s</div></div>
<div class="field"><label class="f" for="in-l">Length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">cm</div></div>
<div class="field"><label class="f" for="in-a">Area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">cm²</div></div>
<div class="field"><label class="f" for="in-h">Head loss</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">cm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var qE=document.getElementById("in-q"),lE=document.getElementById("in-l"),aE=document.getElementById("in-a"),hE=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Q=parseFloat(qE.value),L=parseFloat(lE.value),A=parseFloat(aE.value),H=parseFloat(hE.value);
if(isNaN(Q)||isNaN(L)||isNaN(A)||isNaN(H))return;
if(L<=0||A<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var k=Q*L/(A*H);
if(!isFinite(k)||!isFinite(Q/A*1e6)||!isFinite(H/L*1000)){err.textContent="Values are too large.";return}
var html='<div class="big">'+k.toExponential(3)+'</div>';
html+=row("Hydraulic conductivity (k)",k.toExponential(3)+' cm/s');
html+=row("Darcy velocity (q)",Math.round(Q/A*1e6)/1e6+' cm/s');
html+=row("Hydraulic gradient",Math.round(H/L*1000)/1000);
out.innerHTML=html;
}
[qE,lE,aE,hE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
