<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gutter Guard Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gutter Guard Estimator</h1>
<p>Estimate gutter guard material needed from roof perimeter and guard width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-perim">Gutter length</label><input type="text" id="in-perim" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-width">Guard width</label><input type="text" id="in-width" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-price">Price per ft</label><input type="text" id="in-price" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5"><div class="unit">$</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-perim"),wEl=document.getElementById("in-width"),prEl=document.getElementById("in-price"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(pEl.value),W=pn(wEl.value),P=pn(prEl.value);
if(L==null||W==null||P==null)return;
if(!isFinite(L)||!isFinite(W)||!isFinite(P)||L<=0||W<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var totalL=L*1.1;
var cost=totalL*P;
var html='<div class="big">'+rnd(totalL,0)+' ft</div>';
html+=row("Gutter length",rnd(L,0)+" ft");
html+=row("Guard needed (10% waste)",rnd(totalL,0)+" ft");
html+=row("Guard width",rnd(W,1)+" in");
html+=row("Estimated cost","$"+rnd(cost,2));
out.innerHTML=html;
}
[pEl,wEl,prEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
