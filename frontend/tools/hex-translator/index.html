<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Translator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Hex Translator</h1>
<p class="subtitle">Convert text to hexadecimal and hex to text. Supports space-separated or continuous hex.</p>
<div class="input-section">
<label>Input: <textarea id="input" rows="4" placeholder="Type text or hex (e.g. 48 65 6c 6c 6f)"></textarea></label>
<button id="toHex" class="primary-btn" type="button">Text → Hex</button>
<button id="fromHex" class="btn" type="button">Hex → Text</button>
<button id="copy" class="btn" type="button">Copy Result</button>
</div>
<div class="output-section">
<label>Result: <textarea id="result" rows="4" readonly></textarea></label>
</div>
<script>
document.getElementById('toHex').addEventListener('click',()=>{
const t=document.getElementById('input').value;
document.getElementById('result').value=[...t].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join(' ');
});
document.getElementById('fromHex').addEventListener('click',()=>{
const t=document.getElementById('input').value.trim().split(/\s+/);
document.getElementById('result').value=t.map(h=>String.fromCharCode(parseInt(h,16))).join('');
});
document.getElementById('copy').addEventListener('click',()=>{const r=document.getElementById('result');r.select();document.execCommand('copy');});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
