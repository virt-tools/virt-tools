<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Format Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Format Converter</h1>
<p class="subtitle">Convert images between PNG, JPEG, and WebP formats. 100% client-side via canvas.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Format:
<select id="fmt">
<option value="png">PNG</option>
<option value="jpeg">JPEG</option>
<option value="webp">WebP</option>
</select></label>
<label>Quality (JPEG/WebP): <input type="range" id="q" min="10" max="100" value="80"></label>
<button onclick="convert()" type="button">Convert</button>
<button onclick="download()" type="button">Download</button>
</div>
<div id="info" style="margin-top:10px"></div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
img=new Image();img.onload=function(){
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
};img.src=URL.createObjectURL(f);
});
function convert(){
if(!img)return;
var fmt=document.getElementById('fmt').value;
var q=parseInt(document.getElementById('q').value)/100;
var mt='image/'+fmt;
canvas.toBlob(function(b){
document.getElementById('info').innerHTML='<p>Converted: '+(b.size/1024).toFixed(1)+' KB ('+fmt.toUpperCase()+')</p>';
window._blob=b;
},mt,fmt==='png'?undefined:q);
}
function download(){
if(!window._blob)return;
var ext=document.getElementById('fmt').value==='jpeg'?'jpg':document.getElementById('fmt').value;
var a=document.createElement('a');a.href=URL.createObjectURL(window._blob);a.download='converted.'+ext;a.click();
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
