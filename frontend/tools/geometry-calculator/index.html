<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Geometry Calculator</h1>
<p class="subtitle">Calculate area, perimeter, and volume for common 2D and 3D shapes.</p>
<div class="input-section">
<label>Shape</label>
<select id="shape" aria-label="Shape">
<option value="circle" selected>Circle</option>
<option value="square">Square</option>
<option value="rectangle">Rectangle</option>
<option value="triangle">Triangle</option>
<option value="trapezoid">Trapezoid</option>
<option value="sphere">Sphere</option>
<option value="cube">Cube</option>
<option value="cylinder">Cylinder</option>
<option value="cone">Cone</option>
<option value="pyramid">Pyramid</option>
</select>
<div id="inputs" style="margin:15px 0"></div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const SHAPES={
circle:{fields:[['radius','r','10']],area:r=>Math.PI*r*r,perim:r=>2*Math.PI*r,vol:null,labels:['r']},
square:{fields:[['side','s','10']],area:s=>s*s,perim:s=>4*s,vol:null,labels:['s']},
rectangle:{fields:[['width','w','10'],['height','h','5']],area:(w,h)=>w*h,perim:(w,h)=>2*(w+h),vol:null,labels:['w','h']},
triangle:{fields:[['base','b','10'],['height','h','8']],area:(b,h)=>0.5*b*h,perim:(b,h)=>b+2*Math.sqrt((b/2)**2+h**2),vol:null,labels:['b','h']},
trapezoid:{fields:[['a','a','6'],['b','b','10'],['height','h','5']],area:(a,b,h)=>0.5*(a+b)*h,perim:(a,b,h)=>a+b+2*Math.sqrt(((b-a)/2)**2+h**2),vol:null,labels:['a','b','h']},
sphere:{fields:[['radius','r','10']],area:r=>4*Math.PI*r*r,perim:null,vol:r=>(4/3)*Math.PI*r**3,labels:['r']},
cube:{fields:[['side','s','10']],area:s=>6*s*s,perim:null,vol:s=>s**3,labels:['s']},
cylinder:{fields:[['radius','r','5'],['height','h','10']],area:(r,h)=>2*Math.PI*r*(r+h),perim:null,vol:(r,h)=>Math.PI*r*r*h,labels:['r','h']},
cone:{fields:[['radius','r','5'],['height','h','10']],area:(r,h)=>Math.PI*r*(r+Math.sqrt(r*r+h*h)),perim:null,vol:(r,h)=>(1/3)*Math.PI*r*r*h,labels:['r','h']},
pyramid:{fields:[['base','b','10'],['height','h','10']],area:(b,h)=>b*b+2*b*Math.sqrt((b/2)**2+h**2),perim:null,vol:(b,h)=>(1/3)*b*b*h,labels:['b','h']},
};
function buildInputs(){
const shape=document.getElementById('shape').value;
const s=SHAPES[shape];
const c=document.getElementById('inputs');
c.innerHTML='';
s.fields.forEach(([name,label,def])=>{c.innerHTML+=`<label>${label}</label><input type="number" id="${name}" value="${def}" step="any" aria-label="${Name}">`;});
}
document.addEventListener('DOMContentLoaded',()=>{
buildInputs();
document.getElementById('shape').addEventListener('change',buildInputs);
document.getElementById('calc').addEventListener('click',()=>{
const shape=document.getElementById('shape').value;
const s=SHAPES[shape];
const vals=s.fields.map(([name])=>parseFloat(document.getElementById(name).value)||0);
let html='';
if(s.area){html+=`<div class="result-row"><span>Area:</span><span>${s.area(...vals).toFixed(6)}</span></div>`;}
if(s.perim){html+=`<div class="result-row"><span>Perimeter:</span><span>${s.perim(...vals).toFixed(6)}</span></div>`;}
if(s.vol){html+=`<div class="result-row"><span>Volume:</span><span>${s.vol(...vals).toFixed(6)}</span></div>`;}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
