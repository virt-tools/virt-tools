<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wire Ampacity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wire Ampacity Calculator</h1>
<p>Estimate minimum AWG wire gauge for a given current load and length, with voltage drop check. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cur">Current</label><input type="text" id="in-cur" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">amps</div></div>
<div class="field"><label class="f" for="in-len">Wire length (one-way)</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">meters</div></div>
<div class="field"><label class="f" for="in-vol">System voltage</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter current, length, and voltage.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var curEl=document.getElementById("in-cur"),lenEl=document.getElementById("in-len"),volEl=document.getElementById("in-vol"),err=document.getElementById("err"),out=document.getElementById("out");
var awgTable=[
{awg:14,amp:15,res:8.286},{awg:12,amp:20,res:5.211},{awg:10,amp:30,res:3.277},
{awg:8,amp:55,res:2.061},{awg:6,amp:75,res:1.296},{awg:4,amp:95,res:0.809},
{awg:2,amp:130,res:0.513},{awg:"1/0",amp:150,res:0.324},{awg:"2/0",amp:175,res:0.2563}
];
function calc(){
var I=pn(curEl.value),L=pn(lenEl.value),V=pn(volEl.value);
if(I==null||L==null||V==null){return}
if(!isFinite(I)||!isFinite(L)||!isFinite(V)||I<=0||L<=0||V<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var chosen=null;
for(var i=0;i<awgTable.length;i++){if(awgTable[i].amp>=I){chosen=awgTable[i];break}}
if(!chosen){chosen=awgTable[awgTable.length-1]}
var vdrop=2*chosen.res*L*I/1000;
var vdropPct=vdrop/V*100;
var html='<div class="big">AWG '+chosen.awg+'</div>';
html+=row("Current",rnd(I,1)+" A");
html+=row("Wire length (one-way)",rnd(L,1)+" m");
html+=row("Round-trip length",rnd(2*L,1)+" m");
html+=row("System voltage",rnd(V,0)+" V");
html+=row("Recommended AWG","AWG "+chosen.awg);
html+=row("Ampacity",chosen.amp+" A");
html+=row("Resistance",rnd(chosen.res,3)+" Ω/km");
html+=row("Voltage drop",rnd(vdrop,2)+" V");
html+=row("Voltage drop %",rnd(vdropPct,2)+"%");
out.innerHTML=html;
}
[curEl,lenEl,volEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
