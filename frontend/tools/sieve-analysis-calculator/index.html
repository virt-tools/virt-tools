<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sieve Analysis Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sieve Analysis Calculator</h1>
<p>Calculate percent passing, cumulative retained, and fineness modulus from sieve stack masses. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-tm">Total mass</label><input type="text" id="in-tm" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s1">#4 retained</label><input type="text" id="in-s1" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s2">#8 retained</label><input type="text" id="in-s2" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s3">#16 retained</label><input type="text" id="in-s3" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s4">#30 retained</label><input type="text" id="in-s4" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s5">#50 retained</label><input type="text" id="in-s5" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-s6">#100 retained</label><input type="text" id="in-s6" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-pan">Pan</label><input type="text" id="in-pan" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">g</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tmE=document.getElementById("in-tm"),sE=[document.getElementById("in-s1"),document.getElementById("in-s2"),document.getElementById("in-s3"),document.getElementById("in-s4"),document.getElementById("in-s5"),document.getElementById("in-s6"),document.getElementById("in-pan")],err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var TM=parseFloat(tmE.value);
if(isNaN(TM)||TM<=0)return;
var sieves=["#4","#8","#16","#30","#50","#100","Pan"];
var cumR=0, fmSum=0, rows="";
sE.forEach(function(el,i){
var v=parseFloat(el.value);
if(isNaN(v))v=0;
cumR+=v;
var pctR=v/TM*100;
var pctP=(TM-cumR)/TM*100;
rows+=row(sieves[i]+" passing",Math.round(pctP*10)/10+"% / retained "+Math.round(pctR*10)/10+"%");
if(i<6) fmSum+=cumR/TM*100;
});
err.textContent="";
var fm=fmSum/100;
var html='<div class="big">FM '+Math.round(fm*100)/100+'</div>';
html+=row("Fineness modulus",Math.round(fm*100)/100);
html+=rows;
out.innerHTML=html;
}
[tmE].concat(sE).forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
