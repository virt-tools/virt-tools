<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rack U Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rack U Spacing Calculator</h1>
<p>Calculate total rack height needed from equipment U counts, including spacing for cable management and airflow. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-u">Total equipment U</label><input type="text" id="in-u" inputmode="numeric" autocomplete="off" placeholder="e.g. 30"><div class="unit">U</div></div>
<div class="field"><label class="f" for="in-s">Spacing per gap</label><input type="text" id="in-s" inputmode="numeric" autocomplete="off" placeholder="e.g. 1"><div class="unit">U</div></div>
<div class="field"><label class="f" for="in-n">Number of gaps</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 5"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var uEl=document.getElementById("in-u"),sEl=document.getElementById("in-s"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var U=parseInt(uEl.value),S=parseInt(sEl.value),N=parseInt(nEl.value);
if(isNaN(U)||isNaN(S)||isNaN(N))return;
if(U<=0||S<0||N<0){err.textContent="Values must be non-negative, U must be positive.";return}
err.textContent="";
var spacing=S*N;
var total=U+spacing;
var rackSize=total<=24?24:total<=42?42:total<=48?48:Math.ceil(total/6)*6;
var remaining=rackSize-total;
var html='<div class="big">'+total+' U</div>';
html+=row("Equipment U",U+" U");
html+=row("Spacing total",spacing+" U ("+N+" gaps × "+S+" U)");
html+=row("Total needed",total+" U");
html+=row("Recommended rack",rackSize+" U");
html+=row("Remaining space",remaining+" U");
out.innerHTML=html;
}
[uEl,sEl,nEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
