<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scytale Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.sc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.sc h1{font-size:2rem;margin-bottom:.5rem}
.sc .sub{color:#888;margin-bottom:1.5rem}
.sc textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.sc input{width:80px;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.sc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.sc .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.sc .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.sc label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="sc">
<h1>📜 Scytale Cipher</h1>
<p class="sub">Ancient Spartan transposition cipher — wrap text around a cylinder; the diameter (number of rows) is the key.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">HELLO WORLD FROM SPARTA</textarea>
<label for="rows">Rows (key):</label>
<input type="number" id="rows" value="4" min="2" max="50" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function clean(t){return t.toUpperCase().replace(/[^A-Z]/g,' ');}
function scytale(text,rows){
  text=text.replace(/ /g,'');
  const cols=Math.ceil(text.length/rows);
  while(text.length<rows*cols)text+='X';
  let result='';
  for(let c=0;c<cols;c++){
    for(let r=0;r<rows;r++){result+=text[r*cols+c];}
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const rows=parseInt(document.getElementById('rows').value)||4;
  document.getElementById('output').textContent=scytale(text,rows);
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
