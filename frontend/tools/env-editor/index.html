<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.env Editor & Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>.env Editor & Validator</h1>
<p class="subtitle">Edit, validate, and convert .env files to JSON. Detect duplicate keys, missing values, and security issues. 100% client-side.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;">
<div>
<label style="font-weight:bold;">.env Input</label>
<textarea id="input" rows="20" style="width:100%;font-family:monospace;font-size:.85rem;padding:.5rem;border:2px solid #ddd;border-radius:8px;" placeholder="APP_NAME=MyApp
DB_HOST=localhost
DB_PORT=5432
DB_USER=admin
DB_PASS=secret
DEBUG=true" aria-label="App Name=My App
Db Host=Localhost
Db Port=5432
Db User=Admin
Db Pass=Secret
Debug=True"></textarea>
<button id="validate" style="margin-top:.5rem;padding:.5rem 1.5rem;border:none;border-radius:8px;cursor:pointer;font-weight:bold;background:#2563eb;color:#fff;" type="button">Validate</button>
<button id="toJson" style="margin-top:.5rem;margin-left:.5rem;padding:.5rem 1.5rem;border:2px solid #2563eb;border-radius:8px;cursor:pointer;font-weight:bold;background:#fff;color:#2563eb;" type="button">To JSON</button>
</div>
<div>
<label style="font-weight:bold;">Output</label>
<div id="results" style="margin-bottom:.5rem;"></div>
<textarea id="output" rows="20" readonly style="width:100%;font-family:monospace;font-size:.85rem;padding:.5rem;border:2px solid #ddd;border-radius:8px;background:#f9fafb;" placeholder="Results..." aria-label="Results..."></textarea>
</div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const output=document.getElementById('output');
const results=document.getElementById('results');

function parseEnv(text){
  const lines=text.split('\n');
  const entries=[];
  const seen={};
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line||line.startsWith('#'))continue;
    const eqIdx=line.indexOf('=');
    if(eqIdx===-1){entries.push({line:i+1,issue:'No = sign',key:line});continue;}
    const key=line.substring(0,eqIdx).trim();
    let val=line.substring(eqIdx+1).trim();
    if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'")))val=val.substring(1,val.length-1);
    const issues=[];
    if(seen[key])issues.push('Duplicate key');
    if(!val)issues.push('Empty value');
    if(/PASS|PASSWORD|SECRET|TOKEN|KEY/i.test(key)&&val.length<8&&val)issues.push('Weak secret');
    if(val&&!isNaN(val)&&val.length>1)issues.push('Numeric value (type may need conversion)');
    seen[key]=true;
    entries.push({line:i+1,key,val,issues});
  }
  return entries;
}

document.getElementById('validate').addEventListener('click',function(){
  const entries=parseEnv(input.value);
  let html='';
  let total=entries.length;
  let warnings=entries.filter(e=>e.issues&&e.issues.length).length;
  let ok=total-warnings;
  if(total===0){results.innerHTML='<div style="padding:.5rem;border-radius:8px;background:#fef3c7;color:#92400e;font-weight:bold;">No entries found.</div>';return;}
  results.innerHTML='<div style="padding:.5rem;border-radius:8px;background:'+(warnings===0?'#dcfce7':'#fef3c7')+';color:'+(warnings===0?'#166534':'#92400e')+';font-weight:bold;margin-bottom:.5rem;">'+ok+' valid, '+warnings+' with issues, '+total+' total</div>';
  let out='';
  entries.forEach(e=>{
    out+=(e.issues&&e.issues.length?'⚠ ':'✓ ')+'Line '+e.line+': '+(e.key||'UNKNOWN')+' = '+(e.val||'(empty)');
    if(e.issues&&e.issues.length)out+=' ['+e.issues.join(', ')+']';
    out+='\n';
  });
  output.value=out;
});

document.getElementById('toJson').addEventListener('click',function(){
  const entries=parseEnv(input.value);
  const obj={};
  entries.forEach(e=>{
    if(!e.key)return;
    let v=e.val;
    if(v==='true')v=true;
    else if(v==='false')v=false;
    else if(v==='null')v=null;
    else if(!isNaN(v)&&v!=='')v=Number(v);
    obj[e.key]=v;
  });
  output.value=JSON.stringify(obj,null,2);
  results.innerHTML='<div style="padding:.5rem;border-radius:8px;background:#dcfce7;color:#166534;font-weight:bold;margin-bottom:.5rem;">Converted '+Object.keys(obj).length+' keys to JSON.</div>';
});
})();
</script>
</body>
</html>
