<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Post Tension Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Post Tension Calculator</h1>
<p>Calculate post-tensioning force, elongation, and tendon stress based on strand area and jack pressure. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Strand area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.153"><div class="unit">sq in</div></div>
<div class="field"><label class="f" for="in-l">Tendon length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-p">Jacking stress</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">ksi</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),lEl=document.getElementById("in-l"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),L=pn(lEl.value),P=pn(pEl.value);
if(A==null||L==null||P==null)return;
if(!isFinite(A)||A<=0||!isFinite(L)||L<=0||!isFinite(P)||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var force=A*P*1000;
var Es=28000;
var strain=P*1000/Es;
var elongation=strain*L*12;
var finalForce=force*0.93;
var html='<div class="big">'+rnd(force,0)+' lb</div>';
html+=row("Jacking force",rnd(force,0)+' lb');
html+=row("Elongation",rnd(elongation,2)+' in');
html+=row("Final force (after losses)",rnd(finalForce,0)+' lb');
html+=row("Strand area",A+' sq in');
html+=row("Jacking stress",P+' ksi');
out.innerHTML=html;
}
[aEl,lEl,pEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
