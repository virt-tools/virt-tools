<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cement Displacement Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cement Displacement Calculator</h1>
<p>Calculate displacement volume and pump strokes needed to displace cement to the desired depth. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vol">Cement volume</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">bbl</div></div>
<div class="field"><label class="f" for="in-spb">Strokes per barrel</label><input type="text" id="in-spb" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">strokes/bbl</div></div>
<div class="field"><label class="f" for="in-spm">Pump rate</label><input type="text" id="in-spm" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">SPM</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var volE=document.getElementById("in-vol"),spbE=document.getElementById("in-spb"),spmE=document.getElementById("in-spm"),out=document.getElementById("out");
function calc(){
var vol=parseFloat(volE.value),spb=parseFloat(spbE.value),spm=parseFloat(spmE.value);
if(isNaN(vol)||isNaN(spb)||isNaN(spm))return;
var strokes=vol/spb;
var time=strokes/spm;
var html='<div class="big">'+Math.round(strokes)+' strokes</div>';
html+=row("Displacement strokes",Math.round(strokes));
html+=row("Displacement time",Math.round(time*10)/10+' min');
html+=row("Displacement volume",vol+' bbl');
out.innerHTML=html;
}
[volE,spbE,spmE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
