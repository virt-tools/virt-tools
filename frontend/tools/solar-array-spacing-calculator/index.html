<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Solar Array Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Solar Array Spacing Calculator</h1>
<p>Calculate minimum row-to-row spacing for ground-mount solar arrays to avoid shading at lowest sun angle. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ph">Panel height</label><input type="text" id="in-ph" inputmode="decimal" autocomplete="off" placeholder="e.g. 65"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-tilt">Tilt angle</label><input type="text" id="in-tilt" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">degrees</div></div>
<div class="field"><label class="f" for="in-la">Sun altitude</label><input type="text" id="in-la" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">degrees</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-ph"),tEl=document.getElementById("in-tilt"),aEl=document.getElementById("in-la"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Ph=pn(hEl.value),Tt=pn(tEl.value),Sa=pn(aEl.value);
if(Ph==null||Tt==null||Sa==null)return;
if(!isFinite(Ph)||Ph<=0||!isFinite(Tt)||Tt<0||!isFinite(Sa)||Sa<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var projH=Ph*Math.sin(Tt*Math.PI/180);
var shadowLen=projH/Math.tan(Sa*Math.PI/180);
var spacing=shadowLen+Ph*Math.cos(Tt*Math.PI/180);
var html='<div class="big">'+rnd(spacing/12,1)+' ft spacing</div>';
html+=row("Min row spacing",rnd(spacing/12,1)+' ft');
html+=row("Shadow length",rnd(shadowLen/12,1)+' ft');
html+=row("Panel projected height",rnd(projH/12,1)+' ft');
html+=row("Panel height",Ph+' in');
html+=row("Tilt angle",Tt+' deg');
out.innerHTML=html;
}
[hEl,tEl,aEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
