<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wall Tile Trim Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wall Tile Trim Calculator</h1>
<p>Calculate the length of tile trim needed for wall edges, corners, and openings. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Wall width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-h">Wall height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.4"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-doors">Door openings</label><input type="text" id="in-doors" inputmode="decimal" autocomplete="off" placeholder="0"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),drEl=document.getElementById("in-doors"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),DR=pn(drEl.value),WS=pn(wsEl.value);
if(W==null||H==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter wall dimensions.</span>';return}
DR=DR==null?0:DR;WS=WS==null?10:WS;
if(!isFinite(W)||!isFinite(H)||!isFinite(DR)||!isFinite(WS)||W<=0||H<=0||DR<0||WS<0){err.textContent="Enter valid values.";return}
err.textContent="";
var perimeter=2*(W+H);
var openings=DR*2;
var trimLen=perimeter-openings*0.9;
if(trimLen<0){err.textContent="Too many door openings for this wall size.";out.textContent="Check inputs.";return}
var total=trimLen*(1+WS/100);
var html='<div class="big">'+rnd(total,1)+' m</div>';
html+=row("Wall perimeter",rnd(perimeter,1)+" m");
html+=row("Door openings",DR);
html+=row("Trim length (net)",rnd(trimLen,1)+" m");
html+=row("With "+rnd(WS,0)+"% waste",rnd(total,1)+" m");
out.innerHTML=html;
}
[wEl,hEl,drEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
