<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.bc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.bc h1{font-size:2rem;margin-bottom:.5rem}
.bc .sub{color:#888;margin-bottom:1.5rem}
.bc label{font-size:14px;display:block;margin-bottom:4px;margin-top:.75rem}
.bc input{width:100%;font-size:15px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.bc .sec{font-weight:700;margin-top:1.5rem;margin-bottom:.5rem;color:var(--accent)}
.bc .results{margin-top:2rem}
.bc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.bc .res-card .big{font-size:2rem;font-weight:700}
.bc .bar{height:24px;border-radius:12px;overflow:hidden;margin:.5rem 0;background:var(--border)}
.bc .bar-fill{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
.bc .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px}
.bc .row .pct{color:#888}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="bc">
<h1>💰 Budget Calculator</h1>
<p class="sub">50/30/20 budget breakdown — needs, wants, and savings.</p>
<label for="income">Monthly after-tax income ($):</label>
<input type="number" id="income" value="5000" min="0" oninput="calc()">
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const income=parseFloat(document.getElementById('income').value)||0;
  const needs=income*0.5;
  const wants=income*0.3;
  const savings=income*0.2;
  const cats=[['Needs (50%)',needs,0.5,'#e74c3c'],['Wants (30%)',wants,0.3,'#f39c12'],['Savings (20%)',savings,0.2,'#27ae60']];
  let html='<div class="res-card"><div style="color:#888;font-size:13px">Monthly Income</div><div class="big" style="color:var(--accent)">$'+income.toLocaleString()+'</div></div>';
  cats.forEach(([name,val,pct,color])=>{
    html+='<div class="res-card"><div style="color:#888;font-size:13px">'+name+'</div><div class="big" style="color:'+color+'">$'+val.toLocaleString(undefined,{maximumFractionDigits:0})+'</div>';
    html+='<div class="bar"><div class="bar-fill" style="width:'+pct*100+'%;background:'+color+'">'+pct*100+'%</div></div>';
    html+='</div>';
  });
  html+='<div class="res-card"><div style="color:#888;font-size:13px;margin-bottom:.5rem">Suggested Allocation</div>';
  html+='<div class="row"><span>Rent/Mortgage (≤30%)</span><span>$'+(income*0.3).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Groceries (≈12%)</span><span>$'+(income*0.12).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Utilities (≈6%)</span><span>$'+(income*0.06).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Transportation (≈10%)</span><span>$'+(income*0.10).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Entertainment (≈10%)</span><span>$'+(income*0.10).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Dining Out (≈10%)</span><span>$'+(income*0.10).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Emergency Fund (≈10%)</span><span>$'+(income*0.10).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='<div class="row"><span>Retirement (≈10%)</span><span>$'+(income*0.10).toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
  html+='</div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
