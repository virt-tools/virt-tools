<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Shutter Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Shutter Estimator</h1>
<p>Estimate shutter count and size from window width and shutter style. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Window width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-n">Windows</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),N=pn(nEl.value);
if(W==null||N==null)return;
if(!isFinite(W)||!isFinite(N)||W<=0||N<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var shutterW=W*0.4;
var total=N*2;
var html='<div class="big">'+total+' shutters</div>';
html+=row("Window width",rnd(W,0)+" in");
html+=row("Shutter width (each)",rnd(shutterW,1)+" in");
html+=row("Windows",rnd(N,0));
html+=row("Total shutters",total);
out.innerHTML=html;
}
[wEl,nEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
