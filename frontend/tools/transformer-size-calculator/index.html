<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Transformer Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Transformer Size Calculator</h1>
<p>Calculate required transformer kVA from load and power factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 15000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-pf">Power factor</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.8"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter load and power factor.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var loadEl=document.getElementById("in-load"),pfEl=document.getElementById("in-pf"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(loadEl.value),pf=pn(pfEl.value);
if(W==null||pf==null)return;
if(!isFinite(W)||!isFinite(pf)||W<=0||pf<=0||pf>1){err.textContent="Enter valid load (W) and PF (0–1).";return}
err.textContent="";
var kva=W/(1000*pf);
var amps=kva*1000/230;
var html='<div class="big">'+rnd(kva,1)+' kVA</div>';
html+=row("Load",rnd(W,0)+" W");
html+=row("Power factor",rnd(pf,2));
html+=row("Required kVA",rnd(kva,1)+" kVA");
html+=row("Est. current @230V",rnd(amps,1)+" A");
html+=row("Recommended size",rnd(Math.ceil(kva*1.25/5)*5,0)+" kVA (125%)");
out.innerHTML=html;
}
[loadEl,pfEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
