<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Stone Veneer Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Stone Veneer Calculator</h1>
<p>Calculate stone veneer quantity, mortar, and scratch coat needed for a wall area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Wall area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-c">Coverage per box</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">sq ft/box</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
var ph='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var A=pn(aEl.value),C=pn(cEl.value);
if(A==null||C==null){err.textContent="";out.innerHTML=ph;return}
if(!isFinite(A)||A<=0||!isFinite(C)||C<=0){err.textContent="Enter valid positive values.";out.innerHTML=ph;return}
err.textContent="";
var wasteFactor=1.1;
var totalArea=A*wasteFactor;
var boxes=Math.ceil(totalArea/C);
var mortar=Math.ceil(totalArea*0.25);
var scratchCoat=Math.ceil(totalArea*0.1);
var html='<div class="big">'+boxes+' boxes</div>';
html+=row("Boxes needed",boxes);
html+=row("Stone area (w/ waste)",rnd(totalArea,1)+' sq ft');
html+=row("Mortar bags",mortar);
html+=row("Scratch coat bags",scratchCoat);
html+=row("Waste factor","10%");
out.innerHTML=html;
}
[aEl,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
