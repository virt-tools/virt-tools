<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Tax Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.st{max-width:500px;margin:0 auto;padding:2rem 1rem}
.st h1{font-size:2rem;margin-bottom:.5rem}
.st .sub{color:#888;margin-bottom:1.5rem}
.st label{font-size:14px;display:block;margin-bottom:4px}
.st input,select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:1rem}
.st .res{margin-top:1rem;padding:1.5rem;border:1px solid var(--border);border-radius:12px;text-align:center}
.st .big{font-size:2rem;font-weight:700;color:var(--accent)}
.st .lbl{color:#888;font-size:12px}
.st .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.st .card{padding:1rem;border:1px solid var(--border);border-radius:12px;text-align:center}
.st pre{text-align:left;font-size:12px;color:#888;margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;overflow-x:auto}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="st">
<h1>🧾 Sales Tax Calculator</h1>
<p class="sub">Calculate sales tax for any US state or custom rate.</p>
<label>Price before tax:</label>
<input type="number" id="price" value="100" step="0.01" oninput="calc()" aria-label="Price">
<label>State:</label>
<select id="state" onchange="setRate();calc()" aria-label="State">
<option value="0">Custom rate</option>
<option value="7.25">California (7.25%)</option>
<option value="8.875">New York (8.875%)</option>
<option value="6.25">Texas (6.25%)</option>
<option value="6.25">Massachusetts (6.25%)</option>
<option value="7">Florida (7%)</option>
<option value="6.25">Illinois (6.25%)</option>
<option value="5.75">Washington (5.75%)</option>
<option value="0">Oregon (0%)</option>
<option value="0">Montana (0%)</option>
<option value="0">New Hampshire (0%)</option>
<option value="0">Delaware (0%)</option>
<option value="7.25">Tennessee (7.25%)</option>
<option value="4.45">Louisiana (4.45%)</option>
<option value="7.5">Arkansas (7.5%)</option>
<option value="5">Wisconsin (5%)</option>
<option value="6.85">Ohio (6.85%)</option>
<option value="6">Pennsylvania (6%)</option>
<option value="5.3">Arizona (5.3%)</option>
<option value="6.6">Colorado (6.6%)</option>
<option value="6.85">Nevada (6.85%)</option>
</select>
<label>Custom tax rate (%):</label>
<input type="number" id="rate" value="7.25" step="0.01" oninput="calc()" aria-label="Rate">
<div class="res">
<div class="lbl">Total with tax</div>
<div class="big" id="total">$0.00</div>
</div>
<div class="grid">
<div class="card"><div class="lbl">Tax amount</div><div style="font-size:1.3rem;font-weight:700" id="tax">$0.00</div></div>
<div class="card"><div class="lbl">Effective rate</div><div style="font-size:1.3rem;font-weight:700" id="effRate">0%</div></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function setRate(){document.getElementById('rate').value=document.getElementById('state').value;}
function calc(){
  const p=parseFloat(document.getElementById('price').value)||0;
  const r=parseFloat(document.getElementById('rate').value)||0;
  const tax=p*r/100;
  const total=p+tax;
  document.getElementById('total').textContent='$'+total.toFixed(2);
  document.getElementById('tax').textContent='$'+tax.toFixed(2);
  document.getElementById('effRate').textContent=r.toFixed(2)+'%';
}
calc();
</script>
</body>
</html>
