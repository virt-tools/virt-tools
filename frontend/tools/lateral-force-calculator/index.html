<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Lateral Force Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Lateral Force Calculator</h1>
<p>Calculate wind lateral force, overturning moment, and base shear from wind pressure, building height, and width. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p">Wind pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">psf</div></div>
<div class="field"><label class="f" for="in-h">Building height</label><input type="text" id="in-h" inputmode="numeric" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Building width</label><input type="text" id="in-w" inputmode="numeric" autocomplete="off" placeholder="e.g. 40"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-p"),hEl=document.getElementById("in-h"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var P=parseFloat(pEl.value),H=parseInt(hEl.value),W=parseInt(wEl.value);
if(isNaN(P)||isNaN(H)||isNaN(W))return;
if(P<=0||H<=0||W<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var area=H*W;
var F=P*area;
var M=F*H/2;
var v=F/(W);
var html='<div class="big">'+Math.round(F)+' lb</div>';
html+=row("Tributary area",area+' ft²');
html+=row("Lateral force",Math.round(F)+' lb');
html+=row("Overturning moment",Math.round(M/1000*10)/10+' kip-ft');
html+=row("Base shear per ft",Math.round(v)+' lb/ft');
out.innerHTML=html;
}
[pEl,hEl,wEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
