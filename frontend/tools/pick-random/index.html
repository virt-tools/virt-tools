<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Picker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Random Picker</h1>
<p class="subtitle">Pick random items from a list — great for giveaways, decisions, or classroom use.</p>
<div class="input-section">
<label>Enter items (one per line)</label>
<textarea id="items" rows="10" placeholder="Alice&#10;Bob&#10;Charlie" aria-label="Alice&#10;Bob&#10;Charlie"></textarea>
<label>How Many to Pick</label>
<input type="number" id="pick" value="1" min="1" step="1" aria-label="Pick">
<label>Unique Only</label>
<select id="unique" aria-label="Unique"><option value="yes" selected>Yes</option><option value="no">No (with repeats)</option></select>
<button id="pickBtn" class="primary-btn" type="button">Pick!</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('pickBtn').addEventListener('click',()=>{
const lines=document.getElementById('items').value.split('\n').map(s=>s.trim()).filter(s=>s.length>0);
const n=parseInt(document.getElementById('pick').value)||1;
const uniq=document.getElementById('unique').value==='yes';
if(lines.length===0){document.getElementById('result').innerHTML='<p class="warning">Enter some items first.</p>';document.getElementById('result').style.display='block';return;}
let picked=[];
if(uniq){
if(n>lines.length){document.getElementById('result').innerHTML='<p class="warning">Cannot pick '+n+' unique from '+lines.length+' items.</p>';document.getElementById('result').style.display='block';return;}
const pool=[...lines];
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
picked=pool.slice(0,n);
}else{
for(let i=0;i<n;i++)picked.push(lines[Math.floor(Math.random()*lines.length)]);
}
document.getElementById('result').innerHTML='<h3>Picked '+picked.length+' of '+lines.length+'</h3><ul style="font-size:1.2em">'+picked.map((p,i)=>'<li><strong>'+(i+1)+'.</strong> '+p+'</li>').join('')+'</ul>';
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
