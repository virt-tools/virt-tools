<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paycheck &amp; Payroll Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Paycheck &amp; Payroll Calculator</h1>
<p class="subtitle">Estimate your net (take-home) pay after federal taxes, state tax, and deductions. Fully client-side.</p>
<div class="tool-layout">
<div class="controls">
<h3>Input</h3>
<label>Pay Rate ($/hr) <input type="number" id="rate" value="25.00" step="0.01" min="0"></label>
<label>Hours per Week <input type="number" id="hours" value="40" step="0.5" min="0" max="168"></label>
<label>Pay Frequency
<select id="freq">
<option value="52">Weekly</option>
<option value="26">Bi-weekly</option>
<option value="24">Semi-monthly</option>
<option value="12" selected>Monthly</option>
<option value="1">Annually</option>
</select></label>
<label>Filing Status
<select id="status">
<option value="single" selected>Single</option>
<option value="married">Married Filing Jointly</option>
<option value="hoh">Head of Household</option>
</select></label>
<label>State Tax Rate (%) <input type="number" id="stateTax" value="5" step="0.1" min="0" max="100"></label>
<label>Pre-tax Deductions ($/yr) <input type="number" id="pretax" value="3000" step="100" min="0"></label>
<label>Post-tax Deductions ($/yr) <input type="number" id="posttax" value="0" step="100" min="0"></label>
</div>
<div class="results" id="results"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const rate=document.getElementById('rate'),hours=document.getElementById('hours'),freq=document.getElementById('freq'),status=document.getElementById('status'),stateTax=document.getElementById('stateTax'),pretax=document.getElementById('pretax'),posttax=document.getElementById('posttax');
const results=document.getElementById('results');
const brackets={
single:[[0,0.10],[11600,0.12],[47150,0.22],[100525,0.24],[191950,0.32],[243725,0.35],[609350,0.37]],
married:[[0,0.10],[23200,0.12],[94300,0.22],[201050,0.24],[383900,0.32],[487450,0.35],[731200,0.37]],
hoh:[[0,0.10],[16550,0.12],[63100,0.22],[100500,0.24],[191950,0.32],[243700,0.35],[609350,0.37]]
};
function calc(){
const r=parseFloat(rate.value)||0,h=parseFloat(hours.value)||0,f=parseInt(freq.value),st=parseFloat(stateTax.value)||0,pt=parseFloat(pretax.value)||0,po=parseFloat(posttax.value)||0;
const grossAnnual=r*h*52;
const taxable=Math.max(0,grossAnnual-pt);
const br=brackets[status.value];
let fedTax=0;
for(let i=0;i<br.length;i++){
  if(i<br.length-1&&taxable>br[i+1][0]){fedTax+=(br[i+1][0]-br[i][0])*br[i][1];}
  else{fedTax+=(taxable-br[i][0])*br[i][1];break;}
}
const sTax=taxable*(st/100);
const netAnnual=grossAnnual-fedTax-sTax-po;
const perPay=netAnnual/f;
const grossPerPay=grossAnnual/f;
results.innerHTML='<h3>Results</h3>'+
'<div class="stat-row"><span>Gross Annual</span><span>$'+grossAnnual.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>Federal Tax</span><span>-$'+fedTax.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>State Tax ('+st+'%)</span><span>-$'+sTax.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>Pre-tax Deductions</span><span>-$'+pt.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>Post-tax Deductions</span><span>-$'+po.toFixed(2)+'</span></div>'+
'<div class="stat-row highlight"><span>Net Annual</span><span>$'+netAnnual.toFixed(2)+'</span></div>'+
'<div class="stat-row highlight"><span>Net Per Paycheck</span><span>$'+perPay.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>Gross Per Paycheck</span><span>$'+grossPerPay.toFixed(2)+'</span></div>'+
'<div class="stat-row"><span>Effective Tax Rate</span><span>'+((1-netAnnual/grossAnnual)*100).toFixed(1)+'%</span></div>'+
'<p style="font-size:.8rem;opacity:.6;margin-top:1rem;">Estimate only — uses 2025 federal brackets, no credits/deductions beyond standard pre-tax. Consult a tax professional.</p>';
}
[rate,hours,freq,status,stateTax,pretax,posttax].forEach(el=>el.addEventListener('input',calc));
calc();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:280px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.controls input,.controls select{padding:.5rem;border:1px solid #ddd;border-radius:8px;font-size:1rem;}
.results{flex:1;min-width:300px;}
.stat-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #eee;font-size:1.05rem;}
.stat-row.highlight{font-weight:bold;font-size:1.2rem;border-bottom:2px solid #00d4ff;padding:.75rem 0;}
</style>
</body>
</html>
