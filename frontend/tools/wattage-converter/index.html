<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wattage Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Wattage Converter</h1>
<p class="subtitle">Convert between watts, kilowatts, megawatts, horsepower, BTU/hr, and more.</p>

<div class="input-section">
  <label>Value</label>
  <input type="number" id="val" value="1000" min="0" aria-label="Val">
  <label>From Unit</label>
  <select id="from" aria-label="From">
    <option value="1">Watts (W)</option>
    <option value="0.001" selected>Kilowatts (kW)</option>
    <option value="0.000001">Megawatts (MW)</option>
    <option value="745.699872">Horsepower (hp)</option>
    <option value="0.29307107">BTU/hr</option>
    <option value="0.000163">Tons of refrigeration</option>
  </select>
</div>

<div class="result-section">
  <div class="result-row"><span>Watts:</span><span id="r-w"></span></div>
  <div class="result-row"><span>Kilowatts:</span><span id="r-kw"></span></div>
  <div class="result-row"><span>Megawatts:</span><span id="r-mw"></span></div>
  <div class="result-row"><span>Horsepower:</span><span id="r-hp"></span></div>
  <div class="result-row"><span>BTU/hr:</span><span id="r-btu"></span></div>
  <div class="result-row"><span>Tons refrig:</span><span id="r-ton"></span></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('val'), sel = document.getElementById('from');
  function update(){
    const watts = (parseFloat(el.value)||0) * parseFloat(sel.value);
    document.getElementById('r-w').textContent = watts.toFixed(2) + ' W';
    document.getElementById('r-kw').textContent = (watts/1000).toFixed(4) + ' kW';
    document.getElementById('r-mw').textContent = (watts/1000000).toFixed(6) + ' MW';
    document.getElementById('r-hp').textContent = (watts/745.699872).toFixed(4) + ' hp';
    document.getElementById('r-btu').textContent = (watts/0.29307107).toFixed(2) + ' BTU/hr';
    document.getElementById('r-ton').textContent = (watts/0.000163).toFixed(4) + ' TR';
  }
  el.addEventListener('input', update);
  sel.addEventListener('change', update);
  update();
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
