<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Antenna Gain Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Antenna Gain Calculator</h1>
<p>Calculate antenna gain in dBi from effective aperture and wavelength. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ae">Effective aperture</label><input type="text" id="in-ae" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-f">Frequency</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 2400"><div class="unit">MHz</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aeE=document.getElementById("in-ae"),fE=document.getElementById("in-f"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var ae=parseFloat(aeE.value),f=parseFloat(fE.value);
err.textContent="";
if(isNaN(ae)||isNaN(f)){reset();return}
if(!isFinite(ae)||!isFinite(f)||ae<=0||f<=0){err.textContent="Aperture and frequency must be positive numbers.";reset();return}
var wl=300/f;
var gain=4*Math.PI*ae/(wl*wl);
var dBi=10*Math.log10(gain);
var html='<div class="big">'+(Math.round(dBi*100)/100)+' dBi</div>';
html+=row("Gain",Math.round(dBi*100)/100+' dBi');
html+=row("Wavelength",(Math.round(wl*1000)/1000)+' m');
html+=row("Linear gain",Math.round(gain*100)/100);
out.innerHTML=html;
}
[aeE,fE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
