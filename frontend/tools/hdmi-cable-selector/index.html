<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>HDMI Cable Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-2824399c.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>HDMI Cable Selector</h1>
<p>Determine the recommended HDMI cable type and max length for your resolution, refresh rate, and run distance. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Resolution</label><input type="text" id="in-r" list="res-list" autocomplete="off" placeholder="e.g. 4K"><div class="unit">1080p / 4K / 8K</div></div>
<div class="field"><label class="f" for="in-h">Refresh rate</label><input type="text" id="in-h" inputmode="numeric" autocomplete="off" placeholder="e.g. 60"><div class="unit">Hz</div></div>
<div class="field"><label class="f" for="in-d">Cable length</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
</div>
<datalist id="res-list"><option value="1080p"><option value="4K"><option value="8K"></datalist>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rEl=document.getElementById("in-r"),hEl=document.getElementById("in-h"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=String(rEl.value||"").trim().toUpperCase(),H=pn(hEl.value),D=pn(dEl.value);
if(!R||H==null||D==null)return;
if(!isFinite(H)||H<=0||!isFinite(D)||D<=0){err.textContent="Refresh rate and length must be positive numbers.";return}
err.textContent="";
var cableType,activeNeed=false;
if(R==="8K"||H>=120){cableType="Ultra High Speed (48G)";if(D>3)activeNeed=true}
else if(R==="4K"||H>=60){cableType="Premium High Speed (18G)";if(D>5)activeNeed=true}
else{cableType="High Speed (10.2G)";if(D>10)activeNeed=true}
var html='<div class="big">'+cableType+'</div>';
html+=row("Cable type",cableType);
html+=row("Active/optical needed",activeNeed?"Yes (for "+D+" m)":"No");
html+=row("Resolution",R);
html+=row("Refresh rate",H+" Hz");
html+=row("Cable length",D+" m");
out.innerHTML=html;
}
[rEl,hEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
