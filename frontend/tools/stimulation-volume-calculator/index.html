<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Stimulation Volume Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Stimulation Volume Calculator</h1>
<p>Calculate treatment volume, pad volume, and slurry concentration for well stimulation jobs. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-th">Thickness</label><input type="text" id="in-th" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-pv">Pad volume fraction</label><input type="text" id="in-pv" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">fraction</div></div>
<div class="field"><label class="f" for="in-sc">Slurry concentration</label><input type="text" id="in-sc" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">lb/gal</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var thE=document.getElementById("in-th"),pvE=document.getElementById("in-pv"),scE=document.getElementById("in-sc"),out=document.getElementById("out");
function calc(){
var th=parseFloat(thE.value),pv=parseFloat(pvE.value),sc=parseFloat(scE.value);
if(isNaN(th)||isNaN(pv)||isNaN(sc))return;
var totalVol=th*100;
var padVol=totalVol*pv;
var propWeight=totalVol*(1-pv)*sc*42;
var html='<div class="big">'+Math.round(totalVol)+' bbl</div>';
html+=row("Total treatment volume",Math.round(totalVol)+' bbl');
html+=row("Pad volume",Math.round(padVol)+' bbl');
html+=row("Proppant weight",Math.round(propWeight).toLocaleString()+' lb');
out.innerHTML=html;
}
[thE,pvE,scE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
