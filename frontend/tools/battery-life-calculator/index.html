<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Life Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Battery Life Calculator</h1>
<p class="subtitle">Estimate how long a battery will last based on capacity and device draw.</p>
<div class="input-section">
<label>Battery Capacity (mAh)</label>
<input type="number" id="capacity" value="3000" min="1" aria-label="Capacity">
<label>Battery Voltage (V)</label>
<input type="number" id="voltage" value="3.7" min="0.1" step="0.1" aria-label="Voltage">
<label>Device Current Draw (mA)</label>
<input type="number" id="draw" value="500" min="1" aria-label="Draw">
<label>Efficiency (%)</label>
<input type="number" id="efficiency" value="85" min="1" max="100" aria-label="Efficiency">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const C=parseFloat(document.getElementById('capacity').value)||0;
const V=parseFloat(document.getElementById('voltage').value)||0;
const D=parseFloat(document.getElementById('draw').value)||0;
const E=parseFloat(document.getElementById('efficiency').value)||100;
const hours=(C*E/100)/D;
const wh=(C*V)/1000;
const mins=hours*60;
const days=hours/24;
let timeStr=hours>=24?`${days.toFixed(1)} days`:hours>=1?`${hours.toFixed(1)} hours`:`${mins.toFixed(0)} minutes`;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Battery Capacity:</span><span>${C} mAh (${wh.toFixed(2)} Wh)</span></div>
<div class="result-row"><span>Voltage:</span><span>${V} V</span></div>
<div class="result-row"><span>Current Draw:</span><span>${D} mA</span></div>
<div class="result-row"><span>Efficiency:</span><span>${E}%</span></div>
<div class="result-row"><span>Estimated Runtime:</span><span>${timeStr}</span></div>
<div class="result-row"><span>Runtime (hours):</span><span>${hours.toFixed(2)} hrs</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
