<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Solar Farm Inverter Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Solar Farm Inverter Selector</h1>
<p>Select inverter capacity, quantity, and DC/AC ratio for a solar farm from panel array wattage and inverter unit size. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dc">Total DC capacity</label><input type="text" id="in-dc" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-unit">Inverter unit size</label><input type="text" id="in-unit" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-ratio">Target DC/AC ratio</label><input type="text" id="in-ratio" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">ratio</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dc"),uE=document.getElementById("in-unit"),rE=document.getElementById("in-ratio"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var dc=parseFloat(dE.value),u=parseFloat(uE.value),r=parseFloat(rE.value);
if(isNaN(dc)||isNaN(u)||isNaN(r))return;
if(dc<=0||u<=0||r<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var acCap=dc/r;
var count=Math.ceil(acCap/u);
var actualRatio=dc/(count*u);
var html='<div class="big">'+count+' units</div>';
html+=row("Required AC capacity",Math.round(acCap)+' kW');
html+=row("Inverter count",count+' units');
html+=row("Actual DC/AC ratio",Math.round(actualRatio*100)/100);
out.innerHTML=html;
}
[dE,uE,rE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
