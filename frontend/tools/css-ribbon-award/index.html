<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Ribbon Award Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:280px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎀 CSS Ribbon Award Generator</h1>
<p>Create CSS award ribbon/medal with tails, adjustable color/size/number. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Ribbon Color</label><input type="color" id="rc" value="#e63946"></div>
<div class="ctrl-row"><label>Medal Color</label><input type="color" id="mc" value="#ffd700"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="60" max="140" step="5" value="90" style="width:200px"></div>
<div class="ctrl-row"><label>Position</label><select id="pos"><option value="1st">1st</option><option value="2nd">2nd</option><option value="3rd">3rd</option></select></div>
<div class="ctrl-row"><label>Tails</label><select id="tails"><option value="long">Long</option><option value="short">Short</option><option value="none">None</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var rc=document.getElementById('rc').value;
var mc=document.getElementById('mc').value;
var sz=document.getElementById('sz').value;
var pos=document.getElementById('pos').value;
var tails=document.getElementById('tails').value;
var medalS=sz,tailH=tails==='long'?sz*0.7:tails==='short'?sz*0.35:0;
var html='<div class="ribbon">\n  <div class="medal"><span>'+pos+'</span></div>\n'+(tails!=='none'?'  <div class="tail left"></div>\n  <div class="tail right"></div>\n':'')+'</div>';
var css='.ribbon{display:flex;flex-direction:column;align-items:center;position:relative}\n';
css+='.medal{width:'+medalS+'px;height:'+medalS+'px;background:radial-gradient(circle at 30% 30%,'+mc+'ee,'+mc+' 70%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:Georgia,serif;font-size:'+(medalS*0.22)+'px;color:#5a3a00;box-shadow:0 4px 8px rgba(0,0,0,0.3);position:relative;z-index:2}\n';
css+='.medal::after{content:"";position:absolute;inset:5px;border:3px solid '+mc+'aa;border-radius:50%;opacity:0.5}\n';
if(tails!=='none')css+='.tail{position:absolute;top:'+(medalS*0.5)+'px;width:'+(medalS*0.25)+'px;height:'+tailH+'px;background:'+rc+';z-index:1;box-shadow:inset 0 0 4px rgba(0,0,0,0.2)}\n.tail.left{left:'+(medalS*0.2)+'px;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}\n.tail.right{right:'+(medalS*0.2)+'px;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['rc','mc','sz','pos','tails'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
