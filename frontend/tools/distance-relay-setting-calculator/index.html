<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Distance Relay Setting Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Distance Relay Setting Calculator</h1>
<p>Calculate distance relay zone reach, impedance setting, and time delay for transmission line protection. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">System voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 138000"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-z">Line impedance</label><input type="text" id="in-z" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-ct">CT ratio</label><input type="text" id="in-ct" inputmode="decimal" autocomplete="off" placeholder="e.g. 1200"><div class="unit">:5</div></div>
<div class="field"><label class="f" for="in-pt">PT ratio</label><input type="text" id="in-pt" inputmode="decimal" autocomplete="off" placeholder="e.g. 1380"><div class="unit">:1</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vE=document.getElementById("in-v"),zE=document.getElementById("in-z"),cE=document.getElementById("in-ct"),pE=document.getElementById("in-pt"),out=document.getElementById("out");
function calc(){
var v=parseFloat(vE.value),z=parseFloat(zE.value),c=parseFloat(cE.value),p=parseFloat(pE.value);
if(isNaN(v)||isNaN(z)||isNaN(c)||isNaN(p))return;
var zSecondary=z*c*5/(v/ p*5);
var zone1=0.8*zSecondary;
var zone2=1.2*zSecondary;
var html='<div class="big">'+(Math.round(zone1*100)/100)+' Ω</div>';
html+=row("Zone 1 reach (80%)",Math.round(zone1*100)/100+' Ω sec');
html+=row("Zone 2 reach (120%)",Math.round(zone2*100)/100+' Ω sec');
html+=row("Zone 1 delay","Instantaneous");
html+=row("Zone 2 delay","0.3–0.5 s");
out.innerHTML=html;
}
[vE,zE,cE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
