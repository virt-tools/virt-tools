<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Plastic Limit Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Plastic Limit Calculator</h1>
<p>Calculate plastic limit from wet and dry soil mass at the crumbling threshold (1/8 inch thread). Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wc">Wet can + soil</label><input type="text" id="in-wc" inputmode="decimal" autocomplete="off" placeholder="e.g. 25.5"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-dc">Dry can + soil</label><input type="text" id="in-dc" inputmode="decimal" autocomplete="off" placeholder="e.g. 23.8"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-c">Can weight</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 10.2"><div class="unit">g</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wcE=document.getElementById("in-wc"),dcE=document.getElementById("in-dc"),cE=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var WC=parseFloat(wcE.value),DC=parseFloat(dcE.value),C=parseFloat(cE.value);
if(isNaN(WC)||isNaN(DC)||isNaN(C))return;
if(WC<=0||DC<=0||C<0||DC>WC||DC<=C){err.textContent="Enter valid values.";return}
err.textContent="";
var water=WC-DC;
var dry=DC-C;
var pl=water/dry*100;
var html='<div class="big">'+Math.round(pl*10)/10+'%</div>';
html+=row("Plastic limit (PL)",Math.round(pl*10)/10+'%');
html+=row("Water mass",Math.round(water*100)/100+' g');
html+=row("Dry soil mass",Math.round(dry*100)/100+' g');
out.innerHTML=html;
}
[wcE,dcE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
