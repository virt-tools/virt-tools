<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Direct Shear Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Direct Shear Calculator</h1>
<p>Calculate shear strength, cohesion, and friction angle from direct shear test normal and shear stresses. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n1">Normal 1</label><input type="text" id="in-n1" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-s1">Shear 1</label><input type="text" id="in-s1" inputmode="decimal" autocomplete="off" placeholder="e.g. 35"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-n2">Normal 2</label><input type="text" id="in-n2" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-s2">Shear 2</label><input type="text" id="in-s2" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-n3">Normal 3</label><input type="text" id="in-n3" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-s3">Shear 3</label><input type="text" id="in-s3" inputmode="decimal" autocomplete="off" placeholder="e.g. 85"><div class="unit">kPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var n1E=document.getElementById("in-n1"),s1E=document.getElementById("in-s1"),n2E=document.getElementById("in-n2"),s2E=document.getElementById("in-s2"),n3E=document.getElementById("in-n3"),s3E=document.getElementById("in-s3"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var pts=[];
[{n:n1E,s:s1E},{n:n2E,s:s2E},{n:n3E,s:s3E}].forEach(function(p){
var N=parseFloat(p.n.value),S=parseFloat(p.s.value);
if(!isNaN(N)&&!isNaN(S)) pts.push({N:N,S:S});
});
if(pts.length<2)return;
err.textContent="";
var n=pts.length,sumX=0,sumY=0,sumXY=0,sumX2=0;
pts.forEach(function(p){sumX+=p.N;sumY+=p.S;sumXY+=p.N*p.S;sumX2+=p.N*p.N});
var slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX*sumX);
var intercept=(sumY-slope*sumX)/n;
var phi=Math.atan(slope)*180/Math.PI;
var html='<div class="big">φ='+Math.round(phi*10)/10+'°</div>';
html+=row("Friction angle (φ)",Math.round(phi*10)/10+'°');
html+=row("Cohesion (c)",Math.round(intercept*10)/10+' kPa');
html+=row("Shear strength",Math.round(intercept*10)/10+' + '+Math.round(slope*1000)/1000+'σ');
out.innerHTML=html;
}
[n1E,s1E,n2E,s2E,n3E,s3E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
