<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Patch Panel Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Patch Panel Calculator</h1>
<p>Calculate the number of patch panels, rack U space, and port utilization from total ports needed and panel density. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p">Total ports needed</label><input type="text" id="in-p" inputmode="numeric" autocomplete="off" placeholder="e.g. 96"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-d">Ports per panel</label><input type="text" id="in-d" inputmode="numeric" autocomplete="off" placeholder="e.g. 24"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-p"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var P=parseInt(pEl.value),D=parseInt(dEl.value);
if(isNaN(P)||isNaN(D))return;
if(P<=0||D<=0){err.textContent="Values must be positive integers.";return}
err.textContent="";
var panels=Math.ceil(P/D);
var totalPorts=panels*D;
var util=P/totalPorts*100;
var uSpace=panels; // 1U per panel typically
var html='<div class="big">'+panels+' panels</div>';
html+=row("Panels needed",panels);
html+=row("Ports per panel",D);
html+=row("Total port capacity",totalPorts);
html+=row("Ports used",P);
html+=row("Utilization",Math.round(util)+"%");
html+=row("Rack space",uSpace+" U");
out.innerHTML=html;
}
[pEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
