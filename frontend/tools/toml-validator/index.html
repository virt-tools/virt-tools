<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOML Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>TOML Validator</h1>
<p class="subtitle">Validate TOML syntax and convert to JSON for inspection. Reports line numbers on errors. 100% client-side.</p>
<div class="input-section">
<label>Paste TOML</label>
<textarea id="input" rows="10" placeholder='[server]\nhost = "localhost"\nport = 8080' aria-label="[Server]\Nhost ="></textarea>
<button id="validate" class="primary-btn" type="button">Validate</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseTOML(text){
const result={};let current=result;const lines=text.split('\n');
for(let i=0;i<lines.length;i++){
const line=lines[i];
if(!line.trim()||line.trim().startsWith('#'))continue;
if(line.trim().startsWith('[')){
const section=line.trim().slice(1,-1);
if(!section)throw new Error(`Line ${i+1}: Empty section name`);
const parts=section.split('.');
let obj=result;
for(const p of parts){obj[p]=obj[p]||{};obj=obj[p];}
current=obj;
continue;
}
const eqIdx=line.indexOf('=');
if(eqIdx===-1)throw new Error(`Line ${i+1}: Missing = in "${line.trim()}"`);
const key=line.slice(0,eqIdx).trim();
let val=line.slice(eqIdx+1).trim();
if((val.startsWith('"')&&val.endsWith('"'))){val=val.slice(1,-1);}
else if(val==='true')val=true;
else if(val==='false')val=false;
else if(/^-?\d+$/.test(val))val=parseInt(val,10);
else if(/^-?\d*\.\d+$/.test(val))val=parseFloat(val);
current[key]=val;
}
return result;
}
document.getElementById('validate').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
try{
const obj=parseTOML(input);
const jsonStr=JSON.stringify(obj,null,2);
document.getElementById('result').innerHTML=`<div style="color:#4caf50"><h3>✓ Valid TOML</h3></div><pre style="background:#1a1a2e;padding:1em;border-radius:4px;overflow:auto;margin-top:8px">${jsonStr.replace(/</g,'&lt;')}</pre>`;
}catch(e){
document.getElementById('result').innerHTML=`<div style="color:#f44336"><h3>✗ Invalid TOML</h3><p>${e.message}</p></div>`;
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
