<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Grid Tie Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Grid Tie Calculator</h1>
<p>Calculate grid-tie interconnection capacity, transformer size, and breaker rating from generation output and grid voltage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-gen">Generation output</label><input type="text" id="in-gen" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-volt">Grid voltage</label><input type="text" id="in-volt" inputmode="decimal" autocomplete="off" placeholder="e.g. 480"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-pf">Power factor</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.95"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var gE=document.getElementById("in-gen"),vE=document.getElementById("in-volt"),pE=document.getElementById("in-pf"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var g=parseFloat(gE.value),v=parseFloat(vE.value),p=parseFloat(pE.value);
if(isNaN(g)||isNaN(v)||isNaN(p))return;
if(g<=0||v<=0||p<=0||p>1){err.textContent="Power factor must be between 0 and 1; power and voltage must be positive.";return}
err.textContent="";
var current=g*1000/(Math.sqrt(3)*v*p);
var transformer=g*1.25;
var breaker=Math.ceil(current*1.25/100)*100;
var html='<div class="big">'+(Math.round(current))+' A</div>';
html+=row("Interconnection current",Math.round(current)+' A');
html+=row("Transformer size",Math.round(transformer)+' kVA');
html+=row("Breaker rating",Math.round(breaker)+' A');
out.innerHTML=html;
}
[gE,vE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
