<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Solar Panel Tilt Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Solar Panel Tilt Calculator</h1>
<p>Calculate optimal solar panel tilt angle from latitude and season. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-lat">Latitude</label><input type="text" id="in-lat" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">degrees</div></div>
<div class="field"><label class="f" for="in-season">Season</label>
<select id="in-season" style="width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none">
<option value="summer">Summer</option>
<option value="winter">Winter</option>
<option value="year">Year-round</option>
</select><div class="unit">select</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter latitude to calculate tilt.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var latEl=document.getElementById("in-lat"),seaEl=document.getElementById("in-season"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var lat=pn(latEl.value);
if(lat==null){return}
if(!isFinite(lat)||lat<0||lat>90){err.textContent="Enter latitude 0–90.";return}
err.textContent="";
var season=seaEl.value;
var tilt;
if(season==="summer"){tilt=lat*0.87-3.1}
else if(season==="winter"){tilt=lat*0.87+7}
else{tilt=lat*0.87+3.1}
if(tilt<0)tilt=0;
html='<div class="big">'+rnd(tilt,1)+'°</div>';
html+=row("Latitude",rnd(lat,1)+"°");
html+=row("Season",season);
html+=row("Optimal tilt angle",rnd(tilt,1)+"°");
out.innerHTML=html;
}
[latEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
seaEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
