<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Size Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Data Size Converter</h1>
<p class="subtitle">Convert between bits, bytes, KB, MB, GB, TB, PB and more — binary (1024) and decimal (1000).</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Byte (B)</option>
<option value="8">Bit (b)</option>
<option value="1024">Kibibyte (KiB)</option>
<option value="1048576">Mebibyte (MiB)</option>
<option value="1073741824">Gibibyte (GiB)</option>
<option value="1099511627776">Tebibyte (TiB)</option>
<option value="1125899906842624">Pebibyte (PiB)</option>
<option value="1000">Kilobyte (KB)</option>
<option value="1000000">Megabyte (MB)</option>
<option value="1000000000">Gigabyte (GB)</option>
<option value="1000000000000">Terabyte (TB)</option>
<option value="1000000000000000">Petabyte (PB)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Bit (b)',0.125],['Byte (B)',1],['Kilobyte (KB)',1000],['Megabyte (MB)',1e6],['Gigabyte (GB)',1e9],['Terabyte (TB)',1e12],['Petabyte (PB)',1e15],['Kibibyte (KiB)',1024],['Mebibyte (MiB)',1024**2],['Gibibyte (GiB)',1024**3],['Tebibyte (TiB)',1024**4],['Pebibyte (PiB)',1024**5],['Kibit (Kib)',1024*0.125],['Mibit (Mib)',1024**2*0.125],['Gibit (Gib)',1024**3*0.125]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const bytes=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=bytes/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:6})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
