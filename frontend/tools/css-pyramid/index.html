<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D Pyramid Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;overflow:hidden;height:300px;position:relative;display:flex;align-items:center;justify-content:center;perspective:600px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔺 CSS 3D Pyramid Generator</h1>
<p>Create CSS 3D pyramid with rotation animation. 4 styles, adjustable sides/size/speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="solid" selected>Solid</option><option value="wireframe">Wireframe</option><option value="gradient">Gradient</option><option value="glass">Glass</option></select></div>
<div class="ctrl-row"><label>Sides</label><select id="sides"><option value="3">Triangle (3)</option><option value="4" selected>Square (4)</option><option value="5">Pentagon (5)</option><option value="6">Hexagon (6)</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="number" id="size" value="120" min="60" max="200" style="width:80px"></div>
<div class="ctrl-row"><label>Rotation Speed</label><input type="number" id="speed" value="10" min="0" max="60" style="width:80px">s</div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color1" value="#667eea" style="width:60px;height:34px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var sides=parseInt(document.getElementById('sides').value);
var size=parseInt(document.getElementById('size').value);
var speed=parseInt(document.getElementById('speed').value);
var c=document.getElementById('color1').value;
var h=size, w=size;
var faces='';
for(var i=0;i<sides;i++){
var angle=(360/sides)*i;
var bg=style==='wireframe'?'transparent':style==='gradient'?'linear-gradient('+angle+'deg,'+c+',#000)':style==='glass'?'rgba(102,126,234,0.3)':c;
var border=style==='wireframe'?'2px solid '+c:style==='glass'?'1px solid rgba(255,255,255,0.4)':'none';
faces+='\t<div class="face" style="transform:rotateY('+angle+'deg) translateZ('+(w/2)+'px) rotateX(0deg)"></div>\n';
}
var html='<div class="pyramid-scene">\n  <div class="pyramid">\n'+faces+'  </div>\n</div>';
var css='.pyramid-scene{width:100%;height:300px;display:flex;align-items:center;justify-content:center;perspective:800px}\n';
css+='.pyramid{position:relative;width:'+w+'px;height:'+h+'px;transform-style:preserve-3d;animation:pyr-rot '+speed+'s linear infinite}\n';
css+='@keyframes pyr-rot{from{transform:rotateX(-20deg) rotateY(0deg)}to{transform:rotateX(-20deg) rotateY(360deg)}}\n';
css+='.face{position:absolute;width:'+w+'px;height:'+h+'px;background:'+bg+';border:'+border+';opacity:0.85}\n';
if(style==='gradient'||style==='glass'){css+='.face{backdrop-filter:blur(4px)}'}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','sides','size','speed','color1'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
