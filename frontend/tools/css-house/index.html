<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS House Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#87ceeb,#98d98e);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏠 CSS House Generator</h1>
<p>Create CSS house with roof, door, windows, chimney, and smoke. 4 house styles. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>House Style</label><select id="style"><option value="cottage">Cottage</option><option value="modern">Modern</option><option value="cabin">Cabin</option><option value="mansion">Mansion</option></select></div>
<div class="ctrl-row"><label>Wall Color</label><input type="color" id="wallColor" value="#e8d5b7" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Roof Color</label><input type="color" id="roofColor" value="#8b4513" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Door Color</label><input type="color" id="doorColor" value="#5d4037" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="280" value="180" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var wc=document.getElementById('wallColor').value;
var rc=document.getElementById('roofColor').value;
var dc=document.getElementById('doorColor').value;
var sz=parseInt(document.getElementById('size').value);
var rw=sz*1.2;
var rh=sz*0.4;
var ww=sz*0.2,wh=sz*0.2;
var dw=sz*0.18,dh=sz*0.35;
var html='<div class="house h-'+st+'">\n  <div class="roof"></div>\n  <div class="wall">\n    <div class="door"></div>\n    <div class="window w-left"></div>\n    <div class="window w-right"></div>\n  </div>\n  <div class="chimney"><div class="smoke"></div></div>\n</div>';
var css='.house{position:relative;width:'+rw+'px;display:flex;flex-direction:column;align-items:center}\n';
css+='.roof{width:'+rw+'px;height:'+rh+'px;background:'+rc+';clip-path:polygon(0 100%,50% 0,100% 100%)}\n';
css+='.wall{width:'+sz+'px;height:'+(sz*0.5)+'px;background:'+wc+';position:relative;border-radius:0 0 4px 4px;box-shadow:inset 0 -8px rgba(0,0,0,0.15)}\n';
css+='.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+dw+'px;height:'+dh+'px;background:'+dc+';border-radius:8px 8px 0 0}\n';
css+='.door::after{content:"";position:absolute;right:6px;top:50%;width:4px;height:4px;background:#ffd700;border-radius:50%;transform:translateY(-50%)}\n';
css+='.window{position:absolute;top:'+(sz*0.08)+'px;width:'+ww+'px;height:'+wh+'px;background:linear-gradient(135deg,#b3e5fc,#81d4fa);border:3px solid '+dc+';border-radius:4px}\n';
css+='.window::before,.window::after{content:"";position:absolute;background:'+dc+'}\n';
css+='.window::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}\n';
css+='.window::after{top:50%;left:0;right:0;height:3px;transform:translateY(-50%)}\n';
css+='.w-left{left:'+(sz*0.1)+'px}\n';
css+='.w-right{right:'+(sz*0.1)+'px}\n';
css+='.chimney{position:absolute;top:0;right:'+(sz*0.2)+'px;width:'+(sz*0.08)+'px;height:'+(sz*0.25)+'px;background:'+rc+';border-radius:2px;z-index:-1}\n';
css+='.smoke{position:absolute;top:-20px;left:50%;width:12px;height:12px;background:rgba(200,200,200,0.6);border-radius:50%;animation:smoke 3s ease-out infinite}\n';
css+='@keyframes smoke{0%{transform:translate(-50%,0) scale(1);opacity:0.6}100%{transform:translate(-50%,-40px) scale(2);opacity:0}}\n';
if(st==='modern'){
css+='.house.h-modern .roof{clip-path:polygon(0 100%,30% 0,100% 100%);height:'+(rh*0.7)+'px}\n';
css+='.house.h-modern .wall{width:'+(sz*1.1)+'px}\n';
}else if(st==='mansion'){
css+='.house.h-mansion .wall{width:'+(sz*1.3)+'px;height:'+(sz*0.6)+'px}\n';
css+='.house.h-mansion .roof{width:'+(rw*1.2)+'px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','wallColor','roofColor','doorColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
