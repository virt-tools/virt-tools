<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Bocce Court Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Bocce Court Calculator</h1>
<p>Calculate surface material, border lumber, and total area for a bocce court from court dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Court length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Court width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value);
if(L==null||W==null)return;
if(!isFinite(L)||!isFinite(W)||L<=0||W<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=L*W;
var perim=2*(L+W);
var surfaceDepth=0.25;
var surfaceVol=area*surfaceDepth;
var html='<div class="big">'+rnd(area,0)+' sq ft</div>';
html+=row("Court dimensions",rnd(L,0)+'×'+rnd(W,0)+' ft');
html+=row("Total area",rnd(area,0)+' sq ft');
html+=row("Surface material",rnd(surfaceVol,1)+' cu ft');
html+=row("Border lumber",rnd(perim,0)+' ft');
out.innerHTML=html;
}
[lEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
