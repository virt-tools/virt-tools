<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Inverter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Inverter</h1>
<p class="subtitle">Invert colors of any image. Toggle between original and inverted. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
<button onclick="invert()" type="button">Invert</button>
<button onclick="reset()" type="button">Reset</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var origData=null;
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;var im=new Image();im.src=URL.createObjectURL(f);
im.onload=function(){var cv=document.getElementById('canvas');var ctx=cv.getContext('2d');
cv.width=im.naturalWidth;cv.height=im.naturalHeight;ctx.drawImage(im,0,0);
origData=ctx.getImageData(0,0,cv.width,cv.height);};
});
function invert(){
if(!origData)return;var cv=document.getElementById('canvas');var ctx=cv.getContext('2d');
var d=ctx.createImageData(origData);for(var i=0;i<origData.data.length;i+=4){
d.data[i]=255-origData.data[i];d.data[i+1]=255-origData.data[i+1];d.data[i+2]=255-origData.data[i+2];d.data[i+3]=origData.data[i+3];
}ctx.putImageData(d,0,0);
}
function reset(){
if(!origData)return;var cv=document.getElementById('canvas');var ctx=cv.getContext('2d');ctx.putImageData(origData,0,0);
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='inverted.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
