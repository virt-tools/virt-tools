<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Sundial Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>CSS Sundial Generator</h1>
<p class="subtitle">Create a CSS sundial with rotating gnomon shadow based on time. Adjustable dial color, hour markers, and shadow angle.</p>
<div class="tool-layout">
<div class="controls">
<label>Dial Color <input type="color" id="dialColor" value="#d4a050"></label>
<label>Shadow Color <input type="color" id="shadowColor" value="#5c3d10"></label>
<label>Dial Size <input type="range" id="dialSize" min="200" max="400" value="300"></label>
<label>Hour (shadow angle) <input type="range" id="hourAngle" min="0" max="360" value="135"></label>
<label>Show Numbers <input type="checkbox" id="showNumbers" checked></label>
<button id="copyBtn" class="btn" type="button">Copy HTML+CSS</button>
</div>
<div class="preview" id="preview"></div>
</div>
<div class="code-output"><h3>Generated Code</h3><textarea id="codeOutput" readonly rows="20" aria-label="Code Output"></textarea></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const preview=document.getElementById('preview'),codeOutput=document.getElementById('codeOutput');
const dialColor=document.getElementById('dialColor'),shadowColor=document.getElementById('shadowColor'),dialSize=document.getElementById('dialSize'),hourAngle=document.getElementById('hourAngle'),showNumbers=document.getElementById('showNumbers');
function build(){
const dc=dialColor.value,sc=shadowColor.value,ds=dialSize.value,ha=hourAngle.value,sn=showNumbers.checked;
let markers='';
for(let i=0;i<12;i++){const ang=(i*30-90)*Math.PI/180;const r=ds*0.42;const x=Math.cos(ang)*r,y=Math.sin(ang)*r;markers+='<div style="position:absolute;top:50%;left:50%;transform:translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px));font-size:'+(ds*0.05)+'px;color:#5c3d10;font-weight:bold;">'+(sn?(i===0?12:i):'•')+'</div>';}
preview.innerHTML='<div style="width:'+ds+'px;height:'+ds+'px;border-radius:50%;background:'+dc+';position:relative;box-shadow:0 4px 20px rgba(0,0,0,.3);border:3px solid '+sc+';">'+markers+'<div style="position:absolute;top:50%;left:50%;width:'+(ds*0.04)+'px;height:'+(ds*0.38)+'px;background:'+sc+';transform-origin:bottom center;transform:translate(-50%,-100%) rotate('+ha+'deg);border-radius:4px;"></div><div style="position:absolute;top:50%;left:50%;width:'+(ds*0.06)+'px;height:'+(ds*0.06)+'px;background:'+sc+';border-radius:50%;transform:translate(-50%,-50%);"></div></div>';
codeOutput.value='<style>\n.sundial{width:'+ds+'px;height:'+ds+'px;border-radius:50%;background:'+dc+';position:relative;box-shadow:0 4px 20px rgba(0,0,0,.3);border:3px solid '+sc+';}\n.gnomon{position:absolute;top:50%;left:50%;width:'+(ds*0.04)+'px;height:'+(ds*0.38)+'px;background:'+sc+';transform-origin:bottom center;transform:translate(-50%,-100%) rotate('+ha+'deg);border-radius:4px;}\n.center{position:absolute;top:50%;left:50%;width:'+(ds*0.06)+'px;height:'+(ds*0.06)+'px;background:'+sc+';border-radius:50%;transform:translate(-50%,-50%);}\n.hour{position:absolute;top:50%;left:50%;font-size:'+(ds*0.05)+'px;color:'+sc+';font-weight:bold;}\n</style>\n\n<div class="sundial">\n  '+markers.replace(/position:absolute;top:50%;left:50%;/g,'').replace(/<div style="/g,'<div class="hour" style="')+('\n  <div class="gnomon"></div>\n  <div class="center"></div>\n</div>');
}
[dialColor,shadowColor,dialSize,hourAngle,showNumbers].forEach(el=>el.addEventListener('input',build));
document.getElementById('copyBtn').addEventListener('click',function(){codeOutput.select();document.execCommand('copy');});
build();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:250px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.preview{flex:1;min-height:400px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt,#f0f0f0);border-radius:12px;padding:2rem;}
.code-output{margin-top:2rem;}
.code-output textarea{width:100%;font-family:monospace;font-size:13px;padding:1rem;border-radius:8px;border:1px solid #ddd;background:#fafafa;}
.btn{padding:.5rem 1rem;background:#d4a050;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;}
.btn:hover{background:#b8862e;}
</style>
</body>
</html>
