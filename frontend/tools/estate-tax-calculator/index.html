<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estate Tax Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
.note{font-size:.85rem;color:var(--text-muted);margin-top:.25rem}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Estate Tax Calculator</h1>
<div class="calc-wrap">
<h2>Estate Tax Calculator 📜</h2>
<p>Estimate US federal estate tax based on 2024 exemption thresholds.</p>
<div class="input-group">
<label>Gross estate value ($)</label>
<input type="number" id="estate" value="15000000" min="0" aria-label="Estate">
</div>
<div class="input-group">
<label>Filing status</label>
<select id="filing" style="width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box" aria-label="Filing">
<option value="single">Single</option>
<option value="married">Married (portability)</option>
</select>
</div>
<div class="input-group">
<label>Deductions (debts, charitable, etc.) ($)</label>
<input type="number" id="deductions" value="0" min="0" aria-label="Deductions">
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
const EXEMPTION_2024_SINGLE=13610000;
const EXEMPTION_2024_MARRIED=27220000;
const TOP_RATE=40;
function calc(){
  const estate=v('estate'),ded=v('deductions');
  const filing=document.getElementById('filing').value;
  const exemption=filing==='married'?EXEMPTION_2024_MARRIED:EXEMPTION_2024_SINGLE;
  const taxable=Math.max(0,estate-ded-exemption);
  let tax=0;
  if(taxable>0){
    const brackets=[[0,1000000,18],[1000000,2000000,20],[2000000,3000000,22],[3000000,4000000,24],[4000000,5000000,26],[5000000,6000000,28],[6000000,7000000,30],[7000000,8000000,32],[8000000,9000000,34],[9000000,10000000,37],[10000000,Infinity,40]];
    let prev=0;
    for(const [lo,hi,pct] of brackets){
      if(taxable>lo){
        const amt=Math.min(taxable,hi)-lo;
        tax+=amt*(pct/100);
      }
    }
  }
  const net=estate-ded-tax;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Estate Tax Estimate</h3>'+
    '<div class="result-row"><span>Taxable estate</span><span>$'+Math.max(0,estate-ded).toLocaleString()+'</span></div>'+
    '<div class="result-row"><span>2024 exemption ('+filing+')</span><span>$'+exemption.toLocaleString()+'</span></div>'+
    '<div class="result-row"><span>Taxable above exemption</span><span>$'+taxable.toLocaleString()+'</span></div>'+
    '<div class="result-row"><span>Estimated estate tax</span><span>$'+tax.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Net to heirs</span><span>$'+net.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    (taxable===0?'<p style="margin-top:.5rem;color:var(--text-muted)">Estate is under exemption — no federal estate tax owed.</p>':'');
}
</script>
</body>
</html>
