<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Drainage Pipe Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Drainage Pipe Calculator</h1>
<p>Calculate drainage pipe length, slope, and fall from distance and gradient ratio. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Pipe length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-g">Gradient</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-dia">Pipe diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 110"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="5"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter pipe length.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),gEl=document.getElementById("in-g"),diaEl=document.getElementById("in-dia"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),G=pn(gEl.value),DIA=pn(diaEl.value),WS=pn(wsEl.value);
if(L==null){return}
G=G==null?1:G;WS=WS==null?5:WS;
if(!isFinite(L)||!isFinite(G)||!isFinite(WS)||L<=0||G<0||WS<0){err.textContent="Enter valid values.";return}
err.textContent="";
var fall=L*G/100;
var totalLen=L*(1+WS/100);
var html='<div class="big">'+rnd(totalLen,1)+' m</div>';
html+=row("Pipe length",rnd(L,1)+" m");
html+=row("Gradient",rnd(G,2)+"%");
html+=row("Fall (elevation drop)",rnd(fall,2)+" m");
if(DIA!=null&&isFinite(DIA)&&DIA>0){
  html+=row("Pipe diameter",rnd(DIA,0)+" mm");
}
html+=row("Total to order (+"+rnd(WS,0)+"% waste)",rnd(totalLen,1)+" m");
out.innerHTML=html;
}
[lEl,gEl,diaEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
