<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Annular Pressure Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Annular Pressure Calculator</h1>
<p>Calculate annular pressure from mud weight, TVD, and annular fluid density. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-mw">Mud weight</label><input type="text" id="in-mw" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ppg</div></div>
<div class="field"><label class="f" for="in-tvd">TVD</label><input type="text" id="in-tvd" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-surf">Surface pressure</label><input type="text" id="in-surf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0"><div class="unit">psi</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var mwE=document.getElementById("in-mw"),tvdE=document.getElementById("in-tvd"),surfE=document.getElementById("in-surf"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var mw=parseFloat(mwE.value),tvd=parseFloat(tvdE.value),surf=parseFloat(surfE.value);
if(isNaN(mw)||isNaN(tvd)||isNaN(surf))return;
err.textContent="";
var annular=mw*0.052*tvd+surf;
var html='<div class="big">'+Math.round(annular).toLocaleString()+' psi</div>';
html+=row("Annular pressure",Math.round(annular).toLocaleString()+' psi');
html+=row("Hydrostatic pressure",Math.round(mw*0.052*tvd).toLocaleString()+' psi');
html+=row("Surface pressure",Math.round(surf)+' psi');
out.innerHTML=html;
}
[mwE,tvdE,surfE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
