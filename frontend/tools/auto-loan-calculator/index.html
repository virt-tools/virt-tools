<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Loan Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.al{max-width:600px;margin:0 auto;padding:2rem 1rem}
.al h1{font-size:2rem;margin-bottom:.5rem}
.al .sub{color:#888;margin-bottom:1.5rem}
.al label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.al input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.al .row{display:flex;gap:1rem}
.al .row>div{flex:1}
.al .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.al .results{margin-top:2rem}
.al .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.al .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.al .res-card .lbl{color:#888;font-size:13px}
.al .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.al table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.al th,.al td{border:1px solid var(--border);padding:6px 10px;text-align:right}
.al th{background:var(--accent);color:#fff;text-align:left}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="al">
<h1>🚗 Auto Loan Calculator</h1>
<p class="sub">Calculate monthly car payments with trade-in, sales tax, and fees.</p>
<div class="row">
<div><label for="price">Vehicle price ($):</label>
<input type="number" id="price" value="35000" min="0" oninput="calc()"></div>
<div><label for="trade">Trade-in / down payment ($):</label>
<input type="number" id="trade" value="5000" min="0" oninput="calc()"></div>
</div>
<div class="row">
<div><label for="rate">Interest rate (%):</label>
<input type="number" id="rate" value="6.9" min="0" step="0.01" oninput="calc()"></div>
<div><label for="months">Term (months):</label>
<select id="months" onchange="calc()" style="width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box">
<option value="36">36</option><option value="48">48</option><option value="60" selected>60</option><option value="72">72</option><option value="84">84</option></select></div>
</div>
<div class="row">
<div><label for="tax">Sales tax (%):</label>
<input type="number" id="tax" value="7.25" min="0" step="0.01" oninput="calc()"></div>
<div><label for="fees">Fees ($):</label>
<input type="number" id="fees" value="500" min="0" oninput="calc()"></div>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const price=parseFloat(document.getElementById('price').value)||0;
  const trade=parseFloat(document.getElementById('trade').value)||0;
  const rate=(parseFloat(document.getElementById('rate').value)||0)/100/12;
  const n=parseInt(document.getElementById('months').value)||60;
  const taxPct=(parseFloat(document.getElementById('tax').value)||0)/100;
  const fees=parseFloat(document.getElementById('fees').value)||0;
  const taxedPrice=price*(1+taxPct);
  const principal=taxedPrice-trade+fees;
  let monthly;
  if(rate===0)monthly=principal/n;
  else monthly=principal*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1);
  const totalInterest=monthly*n-principal;
  const totalPaid=principal+totalInterest;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Monthly Payment</div><div class="big" style="color:#27ae60">$'+monthly.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Interest</div><div class="big" style="color:#e74c3c">$'+totalInterest.toFixed(2)+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Loan Amount (incl. tax & fees)</div><div class="big">$'+principal.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Cost</div><div class="big">$'+totalPaid.toFixed(2)+'</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
