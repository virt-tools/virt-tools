<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Projector Throw Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Projector Throw Calculator</h1>
<p>Calculate projector placement distance from throw ratio and desired screen width. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Throw ratio</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">TR</div></div>
<div class="field"><label class="f" for="in-w">Screen width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-h">Screen height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 56"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tEl=document.getElementById("in-t"),wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var T=pn(tEl.value),W=pn(wEl.value),H=pn(hEl.value);
if(T==null||W==null||H==null)return;
if(!isFinite(T)||T<=0||!isFinite(W)||W<=0||!isFinite(H)||H<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var throwDist=T*W;
var diag=Math.sqrt(W*W+H*H);
var html='<div class="big">'+rnd(throwDist,1)+' in</div>';
html+=row("Throw distance",rnd(throwDist,1)+" in ("+rnd(throwDist/12,2)+" ft)");
html+=row("Throw ratio",T+":1");
html+=row("Screen diagonal",rnd(diag,1)+" in");
html+=row("Screen width",W+" in");
html+=row("Screen height",H+" in");
out.innerHTML=html;
}
[tEl,wEl,hEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
