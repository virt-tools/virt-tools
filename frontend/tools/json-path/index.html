<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Path Finder — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Path Finder</h1>
<p class="subtitle">Find the path to any key or value in a JSON object. 100% client-side.</p>
<div class="input-section">
<label>JSON Data</label>
<textarea id="json" rows="8" placeholder='{"user":{"name":"Alice","age":30}}' aria-label="{"></textarea>
<label>Search Key</label>
<input type="text" id="key" placeholder="e.g. name" aria-label="E.G. Name">
<label>Search Value</label>
<input type="text" id="value" placeholder="e.g. Alice" aria-label="E.G. Alice">
<button id="find" class="primary-btn" type="button">Find Paths</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('find').addEventListener('click',()=>{
const result=document.getElementById('result');
try{
const data=JSON.parse(document.getElementById('json').value);
const key=document.getElementById('key').value.trim();
const val=document.getElementById('value').value.trim();
const paths=[];
function search(obj,path){
if(obj===null||obj===undefined)return;
if(typeof obj==='object'){
for(const k in obj){
const np=path?path+'.'+k:k;
if(!key&&val!==''&&String(obj[k])===val)paths.push(np);
if(key&&k===key){if(val===''||String(obj[k])===val)paths.push(np+' = '+JSON.stringify(obj[k]));}
search(obj[k],np);
}
}
}
search(data,'');
if(paths.length===0)result.innerHTML='<p>No matches found.</p>';
else result.innerHTML='<h3>Found '+paths.length+' path(s):</h3><ul>'+paths.map(p=>'<li><code>'+p.replace(/</g,'&lt;')+'</code></li>').join('')+'</ul>';
}catch(e){result.innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
