<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Ice Cream Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🍦 CSS Ice Cream Generator</h1>
<p>Create CSS ice cream cone with scoops, 3 flavors, adjustable scoop count/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Flavor 1</label><input type="color" id="f1" value="#f8b4c8" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Flavor 2</label><input type="color" id="f2" value="#d4a574" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Flavor 3</label><input type="color" id="f3" value="#a8d8b9" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Scoops</label><input type="range" id="scoops" min="1" max="4" step="1" value="3" style="width:200px"></div>
<div class="ctrl-row"><label>Cone Style</label><select id="cone"><option value="waffle">Waffle</option><option value="sugar">Sugar</option><option value="cup">Cup</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var colors=[document.getElementById('f1').value,document.getElementById('f2').value,document.getElementById('f3').value];
var scoops=parseInt(document.getElementById('scoops').value);
var cone=document.getElementById('cone').value;
var html='<div class="ice-cream">\n';
for(var i=0;i<scoops;i++)html+='  <div class="scoop scoop-'+(i+1)+'"></div>\n';
if(cone!=='cup')html+='  <div class="cone"></div>\n';else html+='  <div class="cup"></div>\n';
html+='</div>';
var css='.ice-cream{display:flex;flex-direction:column;align-items:center}\n';
var scoopSz=100,baseTop=scoops*scoopSz*0.55;
for(var i=0;i<scoops;i++){var c=colors[i%3];css+='.scoop-'+(i+1)+'{width:'+scoopSz+'px;height:'+scoopSz+'px;background:'+c+';border-radius:50% 50% 45% 45%;margin-top:-'+(scoopSz*0.3)+'px;box-shadow:inset 0 -8px 12px rgba(0,0,0,0.1);position:relative;z-index:'+(scoops-i)+'}\n'}
if(cone==='waffle'){css+='.cone{width:90px;height:140px;background:linear-gradient(135deg,#d4a574,#c9985e);clip-path:polygon(50% 100%,0 0,100% 0);position:relative;z-index:0;box-shadow:inset 0 -10px 20px rgba(0,0,0,0.2)}\n'}
else if(cone==='sugar'){css+='.cone{width:80px;height:130px;background:#e8d5b8;clip-path:polygon(50% 100%,0 0,100% 0);position:relative;z-index:0}\n'}
else{css+='.cup{width:100px;height:80px;background:#ddd;border-radius:0 0 50px 50px;border:2px solid #ccc;position:relative;z-index:0}\n'}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['f1','f2','f3','scoops','cone'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
