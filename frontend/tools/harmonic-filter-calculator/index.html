<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Harmonic Filter Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Harmonic Filter Calculator</h1>
<p>Calculate tuned harmonic filter capacitor and reactor values for a target harmonic order and system voltage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">System voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 480"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-q">Reactive power</label><input type="text" id="in-q" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kVAR</div></div>
<div class="field"><label class="f" for="in-h">Harmonic order</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">nth</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vE=document.getElementById("in-v"),qE=document.getElementById("in-q"),hE=document.getElementById("in-h"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var v=parseFloat(vE.value),q=parseFloat(qE.value),h=parseFloat(hE.value);
if(isNaN(v)||isNaN(q)||isNaN(h))return;
if(v<=0||q<=0||h<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var V=v;
var C=q*1000/(2*Math.PI*60*V*V);
var L=1/(Math.pow(h,2)*Math.pow(2*Math.PI*60,2)*C);
var html='<div class="big">'+h+'</div>';
html+=row("Capacitor",Math.round(C*Math.pow(10,6)*10)/10+' µF');
html+=row("Reactor",Math.round(L*1000*100)/100+' mH');
html+=row("Tuned order",h);
out.innerHTML=html;
}
[vE,qE,hE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
