function render(){
  const q=search.value.toLowerCase();
  const rows=entities.filter(e=>!q||e[2].toLowerCase().includes(q)||e[0].includes(q)||e[1].includes(q)||e[3].includes(q)||e[4].includes(q));

    '<div style="display:grid;grid-template-columns:60px 60px 1fr 80px 80px 100px;gap:.3rem;padding:.3rem .4rem;border-bottom:1px solid #eee;font-size:.85rem;align-items:center;">'+

    '<div style="font-family:monospace;">&#'+e[3]+';</div>'+
    '<div style="font-family:monospace;">&#x'+e[4]+';</div>'+
    '<div><button onclick="navigator.clipboard.writeText(\''+e[0]+'\')" style="padding:.2rem .5rem;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-size:.75rem;" type="button">Copy</button></div>'+
    '</div>'
  )).join('');
  if(!rows.length)tbl.innerHTML+='<p style="color:#999;padding:1rem;">No matching entities.</p>';
}
