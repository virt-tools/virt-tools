<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tc{max-width:500px;margin:0 auto;padding:2rem 1rem}
.tc h1{font-size:2rem;margin-bottom:.5rem}
.tc .sub{color:#888;margin-bottom:1.5rem}
.tc label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.tc input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.tc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.tc .results{margin-top:2rem}
.tc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.tc .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.tc .res-card .lbl{color:#888;font-size:13px}
.tc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.tc .pct-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tc .pct-btns button{padding:8px 16px;border:2px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:14px}
.tc .pct-btns button.active{border-color:var(--accent);background:var(--accent);color:#fff}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="tc">
<h1>💵 Tip Calculator</h1>
<p class="sub">Calculate tip and total per person.</p>
<label for="bill">Bill amount ($):</label>
<input type="number" id="bill" value="50" min="0" step="0.01" oninput="calc()">
<label>Tip percentage:</label>
<div class="pct-btns" id="pctBtns">
<button data-pct="10" onclick="setPct(this)" type="button">10%</button>
<button data-pct="15" onclick="setPct(this)" type="button">15%</button>
<button data-pct="18" onclick="setPct(this)" class="active" type="button">18%</button>
<button data-pct="20" onclick="setPct(this)" type="button">20%</button>
<button data-pct="25" onclick="setPct(this)" type="button">25%</button>
</div>
<label for="customPct">Custom (%):</label>
<input type="number" id="customPct" value="18" min="0" step="0.5" oninput="calc()">
<label for="people">Number of people:</label>
<input type="number" id="people" value="1" min="1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let activePct=18;
function setPct(btn){
  document.querySelectorAll('#pctBtns button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activePct=parseFloat(btn.dataset.pct);
  document.getElementById('customPct').value=activePct;
  calc();
}
function calc(){
  const bill=parseFloat(document.getElementById('bill').value)||0;
  const pct=parseFloat(document.getElementById('customPct').value)||0;
  const people=parseInt(document.getElementById('people').value)||1;
  const tip=bill*pct/100;
  const total=bill+tip;
  const perPerson=total/people;
  const tipPerPerson=tip/people;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Tip Amount</div><div class="big" style="color:#27ae60">$'+tip.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total</div><div class="big" style="color:#27ae60">$'+total.toFixed(2)+'</div></div>';
  html+='</div>';
  if(people>1){
    html+='<div class="grid2">';
    html+='<div class="res-card"><div class="lbl">Tip per Person</div><div class="big">$'+tipPerPerson.toFixed(2)+'</div></div>';
    html+='<div class="res-card"><div class="lbl">Total per Person</div><div class="big">$'+perPerson.toFixed(2)+'</div></div>';
    html+='</div>';
  }
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
