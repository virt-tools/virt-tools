<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limit Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Limit Calculator</h1>
<p class="subtitle">Numerically estimate the limit of a function as x approaches a value.</p>
<div class="input-section">
<label>f(x) =</label>
<input type="text" id="expr" value="(x^2 - 1) / (x - 1)" style="width:100%;font-family:monospace" aria-label="Expr">
<label>x approaches</label>
<input type="number" id="approach" value="1" step="any" aria-label="Approach">
<label>Direction</label>
<select id="dir" aria-label="Dir">
<option value="both" selected>Both sides</option>
<option value="left">Left (x → a⁻)</option>
<option value="right">Right (x → a⁺)</option>
</select>
<button id="calc" class="primary-btn" type="button">Estimate Limit</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function evalExpr(expr,x){
try{expr=expr.replace(/\^/g,'**').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/exp\(/g,'Math.exp(').replace(/pi/g,'Math.PI').replace(/(?<!\w)e(?!\w)/g,'Math.E');return Function('"use strict";x=arguments[0];return '+expr)(x);}catch(e){return NaN;}}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const a=parseFloat(document.getElementById('approach').value);
const dir=document.getElementById('dir').value;
const deltas=[0.1,0.01,0.001,0.0001,0.00001,0.000001];
let html='<table class="result-table"><tr><th>Δx</th><th>x</th><th>f(x)</th></tr>';
let leftVals=[],rightVals=[];
deltas.forEach(d=>{
const xr=a+d;const xl=a-d;
const fr=evalExpr(expr,xr);const fl=evalExpr(expr,xl);
if(dir!=='left')rightVals.push(fr);
if(dir!=='right')leftVals.push(fl);
if(dir==='both')html+=`<tr><td>${d}</td><td>${xl.toFixed(7)}</td><td>${isFinite(fl)?fl.toFixed(8):'undefined'}</td></tr><tr><td>${d}</td><td>${xr.toFixed(7)}</td><td>${isFinite(fr)?fr.toFixed(8):'undefined'}</td></tr>`;
else if(dir==='left')html+=`<tr><td>-${d}</td><td>${xl.toFixed(7)}</td><td>${isFinite(fl)?fl.toFixed(8):'undefined'}</td></tr>`;
else html+=`<tr><td>+${d}</td><td>${xr.toFixed(7)}</td><td>${isFinite(fr)?fr.toFixed(8):'undefined'}</td></tr>`;
});
html+='</table>';
const lAvg=leftVals.filter(isFinite).slice(-3);const rAvg=rightVals.filter(isFinite).slice(-3);
const lEst=lAvg.length?lAvg.reduce((a,b)=>a+b,0)/lAvg.length:null;
const rEst=rAvg.length?rAvg.reduce((a,b)=>a+b,0)/rAvg.length:null;
let limit;
if(dir==='both'&&lEst!==null&&rEst!==null&&Math.abs(lEst-rEst)<0.01)limit=lEst;
else if(dir==='left')limit=lEst;
else if(dir==='right')limit=rEst;
html+=`<div class="result-row"><span>Left limit:</span><span>${lEst!==null?lEst.toFixed(8):'undefined'}</span></div><div class="result-row"><span>Right limit:</span><span>${rEst!==null?rEst.toFixed(8):'undefined'}</span></div><div class="result-row"><span>Estimated limit:</span><span>${limit!==null&&limit!==undefined?limit.toFixed(8):'does not exist'}</span></div>`;
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
