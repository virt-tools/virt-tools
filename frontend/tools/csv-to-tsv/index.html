<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to TSV Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to TSV Converter</h1>
<p class="subtitle">Convert comma-separated values to tab-separated values. Handles quoted fields.</p>
<div class="input-section">
<label>CSV Input</label>
<textarea id="input" rows="8" placeholder="col1,col2&#10;val1,val2" aria-label="Col1,Col2&#10;Val1,Val2"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value){const result=document.getElementById('result'),output=document.createElement('textarea'),copy=document.createElement('button');output.rows=8;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label','TSV output');output.value=value;copy.type='button';copy.textContent='Copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));result.replaceChildren(output,copy);}
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);
const tsv=rows.map(r=>r.join('\t')).join('\n');
renderOutput(tsv);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
