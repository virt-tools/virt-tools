<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Battery Charger Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Battery Charger Size Calculator</h1>
<p>Calculate required battery charger output current from continuous load, recharge time, and efficiency. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Continuous load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-ah">Battery capacity</label><input type="text" id="in-ah" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">Ah</div></div>
<div class="field"><label class="f" for="in-t">Recharge time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">h</div></div>
<div class="field"><label class="f" for="in-eff">Charger efficiency</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 90"><div class="unit">%</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lE=document.getElementById("in-load"),aE=document.getElementById("in-ah"),tE=document.getElementById("in-t"),eE=document.getElementById("in-eff"),out=document.getElementById("out");
function calc(){
var l=parseFloat(lE.value),a=parseFloat(aE.value),t=parseFloat(tE.value),e=parseFloat(eE.value);
if(isNaN(l)||isNaN(a)||isNaN(t)||isNaN(e)){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter load, capacity, recharge time, and efficiency.</span>';return}
if(l<0||a<=0||t<=0||e<=0||e>100){out.innerHTML='<span style="color:var(--bad,#f87171)">Enter a positive battery capacity, recharge time, and efficiency (0–100%), and a non-negative load.</span>';return}
var rechargeI=a*1.25/t;
var totalI=l+rechargeI;
var chargerSize=totalI/(e/100);
var html='<div class="big">'+(Math.round(chargerSize*10)/10)+' A</div>';
html+=row("Charger output",Math.round(chargerSize*10)/10+' A');
html+=row("Continuous load",l+' A');
html+=row("Recharge current",Math.round(rechargeI*10)/10+' A');
out.innerHTML=html;
}
[lE,aE,tE,eE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
