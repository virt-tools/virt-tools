<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Perforated Pipe Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Perforated Pipe Calculator</h1>
<p>Calculate perforated drain pipe length, trench volume, and gravel fill from trench length, width, and depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Trench length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-w">Trench width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-d">Trench depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="5"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter trench dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value),WS=pn(wsEl.value);
if(L==null||W==null||D==null){return}
WS=WS==null?5:WS;
if(!isFinite(L)||!isFinite(W)||!isFinite(D)||!isFinite(WS)||L<=0||W<=0||D<=0||WS<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var trenchVol=L*W*D;
var pipeLen=L*(1+WS/100);
var gravelVol=trenchVol*0.7*(1+WS/100);
var html='<div class="big">'+rnd(pipeLen,1)+' m</div>';
html+=row("Trench length",rnd(L,1)+" m");
html+=row("Trench volume",rnd(trenchVol,2)+" m³");
html+=row("Pipe length (+"+rnd(WS,0)+"% waste)",rnd(pipeLen,1)+" m");
html+=row("Gravel fill (est.)",rnd(gravelVol,2)+" m³");
out.innerHTML=html;
}
[lEl,wEl,dEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
