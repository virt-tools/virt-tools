<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Consolidation Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Consolidation Test Calculator</h1>
<p>Calculate compression index (Cc) and preconsolidation pressure from one-dimensional consolidation test data. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-e1">Void ratio 1</label><input type="text" id="in-e1" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.85"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-p1">Pressure 1</label><input type="text" id="in-p1" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-e2">Void ratio 2</label><input type="text" id="in-e2" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.65"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-p2">Pressure 2</label><input type="text" id="in-p2" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">kPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var e1E=document.getElementById("in-e1"),p1E=document.getElementById("in-p1"),e2E=document.getElementById("in-e2"),p2E=document.getElementById("in-p2"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var e1=parseFloat(e1E.value),p1=parseFloat(p1E.value),e2=parseFloat(e2E.value),p2=parseFloat(p2E.value);
if(isNaN(e1)||isNaN(p1)||isNaN(e2)||isNaN(p2))return;
if(p1<=0||p2<=0||p1===p2){err.textContent="Enter valid pressures.";return}
err.textContent="";
var Cc=(e1-e2)/Math.log10(p2/p1);
var html='<div class="big">Cc='+Math.round(Cc*1000)/1000+'</div>';
html+=row("Compression index (Cc)",Math.round(Cc*1000)/1000);
html+=row("Recompression index (Cr)",Math.round(Cc/6*1000)/1000+' (approx)');
html+=row("Strain",Math.round((e1-e2)/(1+e1)*10000)/100+'%');
out.innerHTML=html;
}
[e1E,p1E,e2E,p2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
