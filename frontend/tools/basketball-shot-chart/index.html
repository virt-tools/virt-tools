<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Basketball Shot Chart — Virtual Tools</title>
<meta name="description" content="Record made and missed basketball field goals by court zone, then see shooting percentages, points and effective field-goal percentage on a local shot chart.">
<link rel="stylesheet" href="/assets/style.css">
<style>
[hidden]{display:none!important}.shot-tool{max-width:900px;margin:0 auto}.field{min-width:0;max-width:520px}.field label{display:block;font-size:13px;font-weight:650;margin:0 0 5px}.field select{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:inherit}.field select:focus{outline:3px solid color-mix(in srgb,var(--accent,#6ea8fe) 35%,transparent);border-color:var(--accent,#6ea8fe)}.field small{display:block;color:var(--text-dim,#9aa3b2);font-size:11px;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{min-height:44px;padding:9px 16px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:transparent;color:var(--text,#e6e6e6);font:inherit;font-weight:650;cursor:pointer}.actions button.primary{border-color:var(--accent,#6ea8fe);background:var(--accent,#6ea8fe);color:#0b1017}.actions button.missed{border-color:var(--bad,#f87171);color:var(--text,#e6e6e6)}.actions button:hover{filter:brightness(1.08)}.actions button:focus-visible{outline:3px solid var(--accent,#6ea8fe);outline-offset:2px}.actions button:disabled{opacity:.5;cursor:default}.status{min-height:1.5em;margin:12px 0 0;font-size:13px;color:var(--text-dim,#9aa3b2)}.status.error{color:var(--bad,#f87171)}.out{margin-top:18px}.out h2{font-size:16px;margin:0 0 12px}.out h3{font-size:14px;margin:18px 0 9px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,125px),1fr));gap:9px}.metric{padding:10px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);min-width:0}.metric strong{display:block;font:700 1.1rem ui-monospace,monospace}.metric span{display:block;margin-top:3px;color:var(--text-dim,#9aa3b2);font-size:11px}.chart-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:18px}.chart-shell{min-width:0}.court{display:block;width:100%;height:auto;max-height:510px}.court-line{fill:none;stroke:var(--text-dim,#9aa3b2);stroke-width:2}.zone-marker{fill:var(--bg,#14181f);stroke:var(--border,#2a2f3a);stroke-width:2}.court-zone.selected .zone-marker{fill:color-mix(in srgb,var(--accent,#6ea8fe) 20%,var(--bg,#14181f));stroke:var(--accent,#6ea8fe);stroke-width:4}.zone-name{fill:var(--text,#e6e6e6);font:650 14px system-ui,sans-serif;text-anchor:middle;pointer-events:none}.zone-count{fill:var(--text-dim,#9aa3b2);font:700 13px ui-monospace,monospace;text-anchor:middle;pointer-events:none}.court-zone.selected .zone-count{fill:var(--text,#e6e6e6)}.zone-list{display:grid;gap:8px}.zone-row{box-sizing:border-box;min-width:0;padding:9px 11px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f)}.zone-row strong{display:block;font-size:13px;overflow-wrap:anywhere}.zone-row span{display:block;margin-top:3px;color:var(--text-dim,#9aa3b2);font:12px/1.4 ui-monospace,monospace}.empty{color:var(--text-dim,#9aa3b2);font-size:13px}.copy-text{box-sizing:border-box;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:12px/1.5 ui-monospace,monospace;resize:vertical}
@media(max-width:680px){.chart-layout{grid-template-columns:minmax(0,1fr)}.chart-shell{max-width:480px;margin:0 auto;width:100%}}@media(max-width:420px){.actions button{flex:1 1 125px}.field{max-width:none}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header"><a class="back" href="/">← All tools</a><h1>Basketball Shot Chart</h1><p>Track field goals by court zone and see where your points come from.</p></div>
<section class="panel shot-tool" aria-label="Record basketball shots">
<div class="field"><label for="zone">Shot zone</label><select id="zone"><option value="rim">Restricted area — 2 points</option><option value="paint">Paint, outside restricted area — 2 points</option><option value="midrange">Mid-range — 2 points</option><option value="left-corner-3">Left corner 3 — 3 points</option><option value="left-wing-3">Left wing 3 — 3 points</option><option value="top-3">Top 3 — 3 points</option><option value="right-wing-3">Right wing 3 — 3 points</option><option value="right-corner-3">Right corner 3 — 3 points</option></select><small>Choose the zone yourself; free throws are not included.</small></div>
<div class="actions"><button id="made" class="primary" type="button">Made shot</button><button id="missed" class="missed" type="button">Missed shot</button><button id="undo" type="button" disabled>Undo last</button><button id="clear" type="button" disabled>Clear shots</button><button id="example" type="button">Load example</button><button id="copy" type="button" disabled>Copy summary</button></div>
<p id="status" class="status" role="status" aria-live="polite">Choose a zone, then record a made or missed field goal.</p>
</section>
<section class="panel shot-tool out" aria-labelledby="result-title">
<h2 id="result-title">Shot summary</h2>
<div id="metrics" class="metrics" aria-live="polite" aria-atomic="true"></div>
<div class="chart-layout">
<div class="chart-shell">
<svg id="court" class="court" viewBox="0 0 500 460" role="img" aria-labelledby="court-title court-desc">
<title id="court-title">Basketball half-court shot chart</title><desc id="court-desc">Each labelled marker shows made shots over attempts in that zone. The selected zone is highlighted.</desc>
<rect class="court-line" x="15" y="15" width="470" height="430" rx="2"/>
<path class="court-line" d="M190 15V195H310V15M190 195A60 60 0 0 0 310 195M55 15V105A235 235 0 0 0 445 105V15M210 50H290"/>
<circle class="court-line" cx="250" cy="70" r="11"/><path class="court-line" d="M250 15V50"/>
<g class="court-zone" data-zone="left-corner-3"><circle class="zone-marker" cx="62" cy="76" r="35"/><text class="zone-name" x="62" y="72">L corner</text><text class="zone-count" x="62" y="91">0 / 0</text></g>
<g class="court-zone" data-zone="rim"><circle class="zone-marker" cx="250" cy="103" r="35"/><text class="zone-name" x="250" y="99">Rim</text><text class="zone-count" x="250" y="118">0 / 0</text></g>
<g class="court-zone" data-zone="right-corner-3"><circle class="zone-marker" cx="438" cy="76" r="35"/><text class="zone-name" x="438" y="72">R corner</text><text class="zone-count" x="438" y="91">0 / 0</text></g>
<g class="court-zone" data-zone="paint"><circle class="zone-marker" cx="250" cy="177" r="35"/><text class="zone-name" x="250" y="173">Paint</text><text class="zone-count" x="250" y="192">0 / 0</text></g>
<g class="court-zone" data-zone="left-wing-3"><circle class="zone-marker" cx="112" cy="257" r="35"/><text class="zone-name" x="112" y="253">L wing</text><text class="zone-count" x="112" y="272">0 / 0</text></g>
<g class="court-zone" data-zone="midrange"><circle class="zone-marker" cx="250" cy="286" r="35"/><text class="zone-name" x="250" y="282">Mid 2</text><text class="zone-count" x="250" y="301">0 / 0</text></g>
<g class="court-zone" data-zone="right-wing-3"><circle class="zone-marker" cx="388" cy="257" r="35"/><text class="zone-name" x="388" y="253">R wing</text><text class="zone-count" x="388" y="272">0 / 0</text></g>
<g class="court-zone" data-zone="top-3"><circle class="zone-marker" cx="250" cy="400" r="35"/><text class="zone-name" x="250" y="396">Top 3</text><text class="zone-count" x="250" y="415">0 / 0</text></g>
</svg>
</div>
<div><h3>By zone</h3><div id="zone-summary" class="zone-list"><p class="empty">Recorded zones will appear here.</p></div></div>
</div>
<textarea id="summary" class="copy-text" readonly rows="8" aria-label="Copyable basketball shot summary" hidden></textarea>
</section>
</main>
<script src="/assets/app.js"></script>
<script>
/* basketball-shot-chart-core:start */
var BasketballShotChartCore = (function(){
  "use strict";
  var MAX_SHOTS = 500;
  var ZONES = [
    {id:"rim",name:"Restricted area",shortName:"Rim",points:2},
    {id:"paint",name:"Paint (outside restricted area)",shortName:"Paint",points:2},
    {id:"midrange",name:"Mid-range",shortName:"Mid-range",points:2},
    {id:"left-corner-3",name:"Left corner 3",shortName:"Left corner 3",points:3},
    {id:"left-wing-3",name:"Left wing 3",shortName:"Left wing 3",points:3},
    {id:"top-3",name:"Top 3",shortName:"Top 3",points:3},
    {id:"right-wing-3",name:"Right wing 3",shortName:"Right wing 3",points:3},
    {id:"right-corner-3",name:"Right corner 3",shortName:"Right corner 3",points:3}
  ];
  function fail(message){ throw new Error(message); }
  function makeState(){ return {shots:[]}; }
  function checkState(state){
    if(!state || !Array.isArray(state.shots)) fail("Shot chart state is invalid.");
    return state;
  }
  function zoneFor(id){
    var key = String(id == null ? "" : id);
    for(var index=0;index<ZONES.length;index+=1) if(ZONES[index].id === key) return ZONES[index];
    fail("Choose a valid court zone.");
  }
  function addShot(state,zoneId,made){
    checkState(state);
    var zone = zoneFor(zoneId);
    if(typeof made !== "boolean") fail("Shot result must be made (true) or missed (false).");
    if(state.shots.length >= MAX_SHOTS) fail("Keep at most 500 shots in one chart.");
    var shot = {zone:zone.id,made:made};
    state.shots.push(shot);
    return shot;
  }
  function undo(state){ checkState(state); return state.shots.length ? state.shots.pop() : null; }
  function reset(state){ checkState(state); state.shots=[]; return state; }
  function percent(made,attempts){ return attempts ? made/attempts*100 : null; }
  function summarize(state){
    checkState(state);
    var byId = {};
    var zones = ZONES.map(function(zone){
      var summary = {id:zone.id,name:zone.name,shortName:zone.shortName,pointValue:zone.points,makes:0,misses:0,attempts:0,points:0,fgPct:null};
      byId[zone.id] = summary;
      return summary;
    });
    state.shots.forEach(function(shot){
      var zone = byId[zoneFor(shot.zone).id];
      if(typeof shot.made !== "boolean") fail("Shot result must be made (true) or missed (false).");
      zone.attempts += 1;
      if(shot.made){ zone.makes += 1; zone.points += zone.pointValue; }
      else zone.misses += 1;
    });
    var result = {attempts:0,makes:0,misses:0,points:0,twoAttempts:0,twoMakes:0,twoPoints:0,threeAttempts:0,threeMakes:0,threePoints:0,zones:zones};
    zones.forEach(function(zone){
      zone.fgPct = percent(zone.makes,zone.attempts);
      result.attempts += zone.attempts;
      result.makes += zone.makes;
      result.misses += zone.misses;
      result.points += zone.points;
      if(zone.pointValue === 2){
        result.twoAttempts += zone.attempts; result.twoMakes += zone.makes; result.twoPoints += zone.points;
      } else {
        result.threeAttempts += zone.attempts; result.threeMakes += zone.makes; result.threePoints += zone.points;
      }
    });
    result.fgPct = percent(result.makes,result.attempts);
    result.efgPct = result.attempts ? (result.makes + 0.5*result.threeMakes)/result.attempts*100 : null;
    return result;
  }
  function fixedPercent(value){ return value == null ? "—" : value.toFixed(1) + "%"; }
  function copyText(summary){
    if(!summary.attempts) return "No field goals recorded.";
    var lines = [
      "Basketball shot chart",
      "Field goals: " + summary.makes + "/" + summary.attempts + " (" + fixedPercent(summary.fgPct) + ")",
      "Points from field goals: " + summary.points,
      "Effective FG%: " + fixedPercent(summary.efgPct),
      "2PT: " + summary.twoMakes + "/" + summary.twoAttempts + ", " + summary.twoPoints + " points",
      "3PT: " + summary.threeMakes + "/" + summary.threeAttempts + ", " + summary.threePoints + " points",
      ""
    ];
    summary.zones.forEach(function(zone){
      if(zone.attempts) lines.push(zone.name + ": " + zone.makes + "/" + zone.attempts + " (" + fixedPercent(zone.fgPct) + "), " + zone.points + " points");
    });
    return lines.join("\n");
  }
  function getZones(){ return ZONES.map(function(zone){ return {id:zone.id,name:zone.name,shortName:zone.shortName,points:zone.points}; }); }
  return {makeState:makeState,addShot:addShot,undo:undo,reset:reset,summarize:summarize,copyText:copyText,getZones:getZones};
})();
/* basketball-shot-chart-core:end */
(function(){
"use strict";
var C = BasketballShotChartCore;
var state = C.makeState();
var zoneEl = document.getElementById("zone");
var metricsEl = document.getElementById("metrics");
var zoneSummaryEl = document.getElementById("zone-summary");
var statusEl = document.getElementById("status");
var summaryEl = document.getElementById("summary");
var undoButton = document.getElementById("undo");
var clearButton = document.getElementById("clear");
var copyButton = document.getElementById("copy");
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function node(tag,className,text){ var element=document.createElement(tag); if(className) element.className=className; if(text!=null) element.textContent=text; return element; }
function metric(label,value){ var item=node("div","metric"); item.appendChild(node("strong",null,value)); item.appendChild(node("span",null,label)); return item; }
function percent(value){ return value == null ? "—" : value.toFixed(1) + "%"; }
function render(){
  var summary = C.summarize(state);
  clear(metricsEl);
  metricsEl.appendChild(metric("field goals",summary.makes + " / " + summary.attempts));
  metricsEl.appendChild(metric("field-goal percentage",percent(summary.fgPct)));
  metricsEl.appendChild(metric("points from field goals",String(summary.points)));
  metricsEl.appendChild(metric("effective field-goal percentage",percent(summary.efgPct)));
  var byId = {};
  summary.zones.forEach(function(zone){ byId[zone.id]=zone; });
  document.querySelectorAll(".court-zone").forEach(function(element){
    var id = element.getAttribute("data-zone");
    var zone = byId[id];
    element.querySelector(".zone-count").textContent=zone.makes+" / "+zone.attempts;
    if(id === zoneEl.value) element.setAttribute("class","court-zone selected");
    else element.setAttribute("class","court-zone");
  });
  clear(zoneSummaryEl);
  var attempted = summary.zones.filter(function(zone){ return zone.attempts > 0; });
  if(!attempted.length) zoneSummaryEl.appendChild(node("p","empty","Recorded zones will appear here."));
  attempted.forEach(function(zone){
    var row=node("div","zone-row");
    row.appendChild(node("strong",null,zone.name));
    row.appendChild(node("span",null,zone.makes+"/"+zone.attempts+" · "+percent(zone.fgPct)+" · "+zone.points+" pts"));
    zoneSummaryEl.appendChild(row);
  });
  summaryEl.value=C.copyText(summary);
  undoButton.disabled=!summary.attempts;
  clearButton.disabled=!summary.attempts;
  copyButton.disabled=!summary.attempts;
  if(!summary.attempts) summaryEl.hidden=true;
}
function record(made){
  try {
    var shot=C.addShot(state,zoneEl.value,made);
    render();
    var summary=C.summarize(state);
    statusEl.classList.remove("error");
    statusEl.textContent=(made?"Made ":"Missed ")+C.getZones().filter(function(zone){ return zone.id===shot.zone; })[0].name+" recorded. "+summary.makes+" of "+summary.attempts+" field goals made.";
  } catch(error){ statusEl.classList.add("error"); statusEl.textContent=error.message; }
}
document.getElementById("made").addEventListener("click",function(){ record(true); });
document.getElementById("missed").addEventListener("click",function(){ record(false); });
zoneEl.addEventListener("change",render);
undoButton.addEventListener("click",function(){ var removed=C.undo(state); render(); statusEl.classList.remove("error"); statusEl.textContent=removed?"Last shot removed.":"No shot to undo."; });
clearButton.addEventListener("click",function(){ C.reset(state); render(); statusEl.classList.remove("error"); statusEl.textContent="Shot chart cleared."; });
document.getElementById("example").addEventListener("click",function(){
  C.reset(state);
  [["rim",true],["paint",false],["midrange",true],["left-corner-3",true],["right-wing-3",false],["top-3",true]].forEach(function(shot){ C.addShot(state,shot[0],shot[1]); });
  render(); statusEl.classList.remove("error"); statusEl.textContent="Example shots loaded.";
});
copyButton.addEventListener("click",function(){
  if(!summaryEl.value) return;
  navigator.clipboard.writeText(summaryEl.value).then(function(){ statusEl.classList.remove("error"); statusEl.textContent="Shot summary copied."; },function(){ summaryEl.hidden=false; summaryEl.focus(); summaryEl.select(); statusEl.textContent="Select and copy the highlighted summary."; });
});
render();
})();
</script>
</body>
</html>
