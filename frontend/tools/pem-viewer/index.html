<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/assets/theme-init.js"></script>
<title>PEM Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>PEM Viewer</h1>
<p class="subtitle">Inspect PEM labels, decoded bytes, and SHA-256 fingerprints locally. This does not verify certificates, signatures, or key validity.</p>
<form class="input-section" id="pem-form">
<label for="input">PEM text</label>
<textarea id="input" rows="8" maxlength="1048576" spellcheck="false" placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"></textarea>
<div class="row"><button type="submit">Inspect</button><button id="clear" type="button" class="secondary">Clear</button></div>
</form>
<div id="out" aria-live="polite"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
  'use strict';
  const input=document.getElementById('input'),out=document.getElementById('out');
  let revision=0;
  function clear(){revision++;out.replaceChildren();}
  document.getElementById('clear').onclick=()=>{input.value='';clear();input.focus();};
  input.addEventListener('input',clear);
  document.getElementById('pem-form').addEventListener('submit',async event=>{
    event.preventDefault();clear();const token=revision,text=input.value.trim();
    try {
      if(!text||new Blob([text]).size>1048576)throw new Error('Enter PEM text up to 1 MiB.');
      const pattern=/-----BEGIN ([A-Z0-9 ][A-Z0-9 -]*)-----([\s\S]*?)-----END \1-----/g;
      const blocks=[...text.matchAll(pattern)];
      if(!blocks.length||blocks.length>100)throw new Error('Enter 1–100 matching PEM blocks.');
      const decoded=blocks.map(block=>{
        const base64=block[2].replace(/\s/g,'');
        if(!base64||!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(base64))throw new Error('A PEM block has empty or invalid Base64 data.');
        return {label:block[1],bytes:Uint8Array.from(atob(base64),char=>char.charCodeAt(0))};
      });
      for(const block of decoded){
        const panel=document.createElement('section');panel.className='result-section';
        const heading=document.createElement('h2');heading.textContent=block.label;panel.append(heading);
        function row(label,value){const line=document.createElement('div');line.className='result-row';const name=document.createElement('span'),detail=document.createElement('span');name.textContent=label;detail.textContent=value;line.append(name,detail);panel.append(line);return detail;}
        row('Decoded size',block.bytes.length+' bytes');
        row('First byte (tag only)','0x'+block.bytes[0].toString(16).padStart(2,'0'));
        row('First 32 bytes',Array.from(block.bytes.slice(0,32),byte=>byte.toString(16).padStart(2,'0')).join(' '));
        const hash=row('SHA-256',crypto.subtle?'Computing…':'Unavailable: use HTTPS or localhost.');
        out.append(panel);
        if(crypto.subtle){
          const digest=await crypto.subtle.digest('SHA-256',block.bytes);
          if(token!==revision)return;
          hash.textContent=Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
        }
      }
    }catch(error){if(token===revision)out.textContent=error.message;}
  });
})();
</script>
</body>
</html>
