<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cost of Living Comparison — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:700px;margin:1rem auto;padding:1.5rem}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
.compare-col{border:2px solid var(--border);border-radius:12px;padding:1rem}
.compare-col h3{text-align:center;margin-top:0}
.input-group{margin:.5rem 0}
.input-group label{display:block;font-size:.85rem;margin-bottom:.25rem;color:var(--text-muted)}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1rem 0;padding:1rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-box h3{text-align:center;margin-top:0}
.big-result{text-align:center;font-size:2rem;font-weight:bold;margin:.5rem 0}
.neg{color:#f44336}.pos{color:#4caf50}
.breakdown{font-size:.9rem}
.breakdown-row{display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid var(--border)}
.breakdown-row:last-child{border:none}
.cat-sel{display:flex;flex-wrap:wrap;gap:.25rem;justify-content:center;margin:.5rem 0}
.cat-sel button{padding:.3rem .6rem;border:1px solid var(--border);background:var(--card-bg);color:var(--text);border-radius:4px;cursor:pointer;font-size:.8rem}
.cat-sel button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.city-input{text-align:center}
.note{text-align:center;color:var(--text-muted);font-size:.85rem;margin:1rem 0}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Cost of Living Comparison</h1>
<div class="calc-wrap">
<h2>Cost of Living Comparison 🏙️</h2>
<p>Compare cost of living between two cities. All percentages are approximate and based on general data.</p>

<div class="cat-sel" id="catSel"></div>

<div class="compare-grid">
<div class="compare-col">
<h3>City A</h3>
<div class="input-group city-input"><input type="text" id="cityA" placeholder="City name" value="New York" aria-label="City Name"></div>
<div class="input-group"><label>Monthly income</label><input type="number" id="incomeA" value="5000" min="0" aria-label="Income A"></div>
<div class="input-group"><label>Rent (%)</label><input type="number" id="rentA" value="100" min="0" aria-label="Rent A"></div>
<div class="input-group"><label>Groceries (%)</label><input type="number" id="groceryA" value="100" min="0" aria-label="Grocery A"></div>
<div class="input-group"><label>Utilities (%)</label><input type="number" id="utilA" value="100" min="0" aria-label="Util A"></div>
<div class="input-group"><label>Transport (%)</label><input type="number" id="transA" value="100" min="0" aria-label="Trans A"></div>
<div class="input-group"><label>Healthcare (%)</label><input type="number" id="healthA" value="100" min="0" aria-label="Health A"></div>
</div>
<div class="compare-col">
<h3>City B</h3>
<div class="input-group city-input"><input type="text" id="cityB" placeholder="City name" value="Austin" aria-label="City Name"></div>
<div class="input-group"><label>Monthly income</label><input type="number" id="incomeB" value="5000" min="0" aria-label="Income B"></div>
<div class="input-group"><label>Rent (%)</label><input type="number" id="rentB" value="70" min="0" aria-label="Rent B"></div>
<div class="input-group"><label>Groceries (%)</label><input type="number" id="groceryB" value="85" min="0" aria-label="Grocery B"></div>
<div class="input-group"><label>Utilities (%)</label><input type="number" id="utilB" value="90" min="0" aria-label="Util B"></div>
<div class="input-group"><label>Transport (%)</label><input type="number" id="transB" value="95" min="0" aria-label="Trans B"></div>
<div class="input-group"><label>Healthcare (%)</label><input type="number" id="healthB" value="100" min="0" aria-label="Health B"></div>
</div>
</div>

<button class="btn" id="compareBtn" type="button">Compare</button>

<div class="result-box" id="result" style="display:none">
<h3 id="resultTitle"></h3>
<div class="big-result" id="bigResult"></div>
<div class="breakdown" id="breakdown"></div>
</div>
<p class="note">Index values are relative (100 = baseline). Enter your City A baseline and set City B's percentages relative to City A.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
const CATS=[
  {id:'rent',label:'Rent',weight:0.35},
  {id:'grocery',label:'Groceries',weight:0.15},
  {id:'util',label:'Utilities',weight:0.10},
  {id:'trans',label:'Transport',weight:0.15},
  {id:'health',label:'Healthcare',weight:0.25}
];
const visible=new Set(CATS.map(c=>c.id));
function renderCats(){
  const sel=document.getElementById('catSel');
  sel.innerHTML='';
  CATS.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c.label;
    if(visible.has(c.id))b.classList.add('active');
    b.onclick=()=>{visible.has(c.id)?visible.delete(c.id):visible.add(c.id);renderCats()};
    sel.appendChild(b);
  });
}
renderCats();
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const a={rent:v('rentA'),grocery:v('groceryA'),util:v('utilA'),trans:v('transA'),health:v('healthA')};
  const b={rent:v('rentB'),grocery:v('groceryB'),util:v('utilB'),trans:v('transB'),health:v('healthB')};
  let wt=0,aIdx=0,bIdx=0;
  CATS.forEach(c=>{
    if(visible.has(c.id)){wt+=c.weight;aIdx+=a[c.id]*c.weight;bIdx+=b[c.id]*c.weight}
  });
  if(wt>0){aIdx/=wt;bIdx/=wt}else{aIdx=100;bIdx=100}
  const incA=v('incomeA'),incB=v('incomeB');
  const cityA=document.getElementById('cityA').value||'City A';
  const cityB=document.getElementById('cityB').value||'City B';
  const pctDiff=((bIdx-aIdx)/aIdx*100).toFixed(1);
  const realA=incA/incA*100;
  const realB=incB/incA*100;
  const purchasingB=(incB/bIdx*100).toFixed(1);
  const purchasingA=(incA/aIdx*100).toFixed(1);
  const r=document.getElementById('result');
  r.style.display='';
  document.getElementById('resultTitle').textContent=cityA+' vs '+cityB;
  const br=document.getElementById('bigResult');
  if(bIdx>aIdx){br.className='big-result neg';br.textContent='City B is '+pctDiff+'% more expensive'}
  else{br.className='big-result pos';br.textContent='City B is '+Math.abs(pctDiff)+'% cheaper'}
  const bd=document.getElementById('breakdown');
  bd.innerHTML='';
  CATS.filter(c=>visible.has(c.id)).forEach(c=>{
    const d=((b[c.id]-a[c.id])/a[c.id]*100).toFixed(1);
    const row=document.createElement('div');
    row.className='breakdown-row';
    row.innerHTML='<span>'+c.label+'</span><span class="'+(b[c.id]>a[c.id]?'neg':'pos')+'">'+(b[c.id]>a[c.id]?'+':'')+d+'%</span>';
    bd.appendChild(row);
  });
  const row=document.createElement('div');
  row.className='breakdown-row';
  row.innerHTML='<span>Purchasing power (B vs A)</span><span class="'+(purchasingB>purchasingA?'pos':'neg')+'">'+((purchasingB/purchasingA-1)*100).toFixed(1)+'%</span>';
  bd.appendChild(row);
}
document.getElementById('compareBtn').onclick=calc;
</script>
</body>
</html>
