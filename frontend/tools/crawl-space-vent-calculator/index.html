<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Crawl Space Vent Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Crawl Space Vent Calculator</h1>
<p>Calculate required crawl space ventilation area from floor area and vent size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Crawl space floor area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 80"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-vent">Single vent area</label><input type="text" id="in-vent" inputmode="decimal" autocomplete="off" placeholder="e.g. 65"><div class="unit">cm²</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter crawl space area.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-area"),vEl=document.getElementById("in-vent"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),V=pn(vEl.value);
if(A==null){return}
V=V==null?65:V;
if(!isFinite(A)||!isFinite(V)||A<=0||V<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var needArea=A/150*10000;
var count=Math.ceil(needArea/V);
var html='<div class="big">'+rnd(count,0)+' vents</div>';
html+=row("Crawl space area",rnd(A,0)+" m²");
html+=row("Vent area needed",rnd(needArea,0)+" cm²");
html+=row("Single vent area",rnd(V,0)+" cm²");
html+=row("Vents required",rnd(count,0));
out.innerHTML=html;
}
[aEl,vEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
