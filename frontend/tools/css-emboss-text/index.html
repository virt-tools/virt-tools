<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Emboss/3D Layer Text Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#0a0a1a;border-radius:12px;overflow:hidden;height:200px;position:relative;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🧱 CSS Emboss/3D Layer Text Generator</h1>
<p>Create CSS embossed/3D layered text effects with depth. 6 presets, adjustable depth/color/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="emboss" selected>Emboss</option><option value="deboss">Deboss</option><option value="layer3d">3D Layers</option><option value="retro">Retro</option><option value="neon-3d">Neon 3D</option><option value="gold">Gold</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="virt.tools" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Depth</label><input type="range" id="depth" value="6" min="2" max="12" style="width:120px" aria-label="Depth"><span id="depthVal">6</span></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color1" value="#667eea" style="width:60px;height:34px" aria-label="Color1"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#0a0a1a" style="width:60px;height:34px" aria-label="Bg Color"></div>
<div class="ctrl-row"><label>Font Size</label><input type="number" id="fontSize" value="64" min="20" max="120" style="width:80px" aria-label="Font Size"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var text=document.getElementById('text').value||'virt.tools';
var depth=parseInt(document.getElementById('depth').value);
var c=document.getElementById('color1').value;
var bg=document.getElementById('bgColor').value;
var fs=parseInt(document.getElementById('fontSize').value);
document.getElementById('depthVal').textContent=depth;
var shadows=[];
if(preset==='emboss'){
for(var i=1;i<=depth;i++){shadows.push((-i)+'px '+(-i)+'px 0 rgba(255,255,255,'+(0.15-i*0.01)+')');shadows.push(i+'px '+i+'px 0 rgba(0,0,0,'+(0.2+i*0.03)+')')}
}else if(preset==='deboss'){
for(var i=1;i<=depth;i++){shadows.push(i+'px '+i+'px 0 rgba(255,255,255,'+(0.15-i*0.01)+')');shadows.push((-i)+'px '+(-i)+'px 0 rgba(0,0,0,'+(0.2+i*0.03)+')')}
}else if(preset==='layer3d'){
for(var i=1;i<=depth;i++){shadows.push(i+'px '+i+'px 0 '+c)}
}else if(preset==='retro'){
for(var i=1;i<=depth;i++){shadows.push((i*2)+'px '+i+'px 0 hsl('+(i*30)+',70%,50%)')}
}else if(preset==='neon-3d'){
for(var i=1;i<=depth;i++){shadows.push(i+'px '+i+'px 0 '+c)}
shadows.push('0 0 10px '+c+',0 0 20px '+c+',0 0 40px '+c);
}else if(preset==='gold'){
for(var i=1;i<=depth;i++){shadows.push(i+'px '+i+'px 0 '+(i%2===0?'#b8860b':'#daa520'))}
shadows.push('0 0 5px #ffd700,0 0 15px #ffaa00');
}
var html='<div class="emboss-text">'+escapeHTML(text)+'</div>';
var css='.emboss-text{box-sizing:border-box;font-size:'+fs+'px;font-weight:900;font-family:Arial,sans-serif;color:'+c+';text-shadow:'+shadows.join(', ')+';background:'+bg+';padding:40px;display:flex;align-items:center;justify-content:center;width:100%;height:200px;text-align:center}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function escapeHTML(value){return value.replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function copyText(id){var t=document.getElementById(id);navigator.clipboard.writeText(t.value).catch(function(){t.select();document.execCommand('copy')})}
['preset','text','depth','color1','bgColor','fontSize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
