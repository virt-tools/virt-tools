<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Dot Walker Loader Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#0a0a1a;border-radius:12px;overflow:hidden;height:200px;position:relative;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🚶 CSS Dot Walker Loader Generator</h1>
<p>Create CSS animated dot walker/progress loader. 5 styles, adjustable dots/speed/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="walk" selected>Walker</option><option value="bounce">Bounce</option><option value="pulse">Pulse</option><option value="stretch">Stretch</option><option value="chase">Chase</option></select></div>
<div class="ctrl-row"><label>Dots</label><input type="number" id="dots" value="5" min="3" max="8" style="width:80px" aria-label="Dots"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed" aria-label="Speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Dot Color</label><input type="color" id="dotColor" value="#667eea" style="width:60px;height:34px" aria-label="Dot Color"></div>
<div class="ctrl-row"><label>Size</label><input type="number" id="dotSize" value="14" min="6" max="30" style="width:80px" aria-label="Dot Size"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var dots=parseInt(document.getElementById('dots').value);
var speed=document.getElementById('speed').value;
var c=document.getElementById('dotColor').value;
var size=parseInt(document.getElementById('dotSize').value);
var dur=speed==='slow'?'1.2s':speed==='fast'?'0.3s':'0.6s';
var html='<div class="walker">\n';
for(var i=0;i<dots;i++){
var delay=(i*dur/dots).toFixed(2)+'s';
html+='  <div class="dot" style="animation-delay:-'+delay+'"></div>\n';
}
html+='</div>';
var css='.walker{display:flex;gap:8px;align-items:center;justify-content:center}\n';
css+='.dot{width:'+size+'px;height:'+size+'px;background:'+c+';border-radius:50%;animation:'+style+' '+dur+' ease-in-out infinite}\n';
if(style==='walk'){css+='@keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}\n'}
if(style==='bounce'){css+='@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}\n'}
if(style==='pulse'){css+='@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1;box-shadow:0 0 15px '+c+'}\n'}
if(style==='stretch'){css+='@keyframes stretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}\n'}
if(style==='chase'){css+='@keyframes chase{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}\n'}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','dots','speed','dotColor','dotSize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
