<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt Payoff Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.dp{max-width:600px;margin:0 auto;padding:2rem 1rem}
.dp h1{font-size:2rem;margin-bottom:.5rem}
.dp .sub{color:#888;margin-bottom:1.5rem}
.dp label{font-size:14px;display:block;margin-bottom:4px}
.dp input,select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:1rem}
.dp .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.dp .res{margin-top:1.5rem;padding:1.2rem;border:1px solid var(--border);border-radius:12px;background:var(--bg)}
.dp .res .big{font-size:1.5rem;font-weight:700;color:var(--accent)}
.dp .res .lbl{color:#888;font-size:12px}
.dp table{width:100%;border-collapse:collapse;margin-top:1rem}
.dp th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border)}
.dp th{text-align:left;color:#888;font-size:12px}
.dp .toggle{display:flex;gap:1rem;margin-bottom:1rem}
.dp .toggle button{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
.dp .toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="dp">
<h1>💳 Debt Payoff Calculator</h1>
<p class="sub">Snowball (smallest balance first) or Avalanche (highest rate first) strategy.</p>
<div class="toggle">
<button class="active" id="snowballBtn" onclick="setMode('snowball')" type="button">Snowball</button>
<button id="avalancheBtn" onclick="setMode('avalanche')" type="button">Avalanche</button>
</div>
<div id="debts"></div>
<button onclick="addDebt()" style="width:100%;padding:12px;border:1px dashed var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;margin-bottom:1rem" type="button">+ Add Debt</button>
<label>Extra monthly payment:</label>
<input type="number" id="extra" value="100" min="0" step="50" oninput="calc()" aria-label="Extra">
<div class="res" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let mode='snowball';
let debts=[{name:'Card 1',balance:2000,rate:18,min:50},{name:'Card 2',balance:5000,rate:22,min:120},{name:'Loan',balance:8000,rate:6,min:150}];
function setMode(m){mode=m;document.getElementById('snowballBtn').className=m==='snowball'?'active':'';document.getElementById('avalancheBtn').className=m==='avalanche'?'active':'';calc();}
function render(){
  const c=document.getElementById('debts');
  c.innerHTML='';
  debts.forEach((d,i)=>{
    const div=document.createElement('div');
    div.style.cssText='border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px';
    div.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><input value="${d.name}" style="flex:1;margin-right:8px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)" oninput="debts[${i}].name=this.value;calc()" aria-label="Input">
    <button onclick="debts.splice(${i},1);render();calc()" style="padding:8px;border:none;background:#c62828;color:#fff;border-radius:6px;cursor:pointer" type="button">✕</button></div>
    <div class="row" style="margin-top:8px">
    <div><label style="font-size:11px">Balance</label><input type="number" value="${d.balance}" oninput="debts[${i}].balance=parseFloat(this.value)||0;calc()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)" aria-label="Input"></div>
    <div><label style="font-size:11px">Rate %</label><input type="number" value="${d.rate}" oninput="debts[${i}].rate=parseFloat(this.value)||0;calc()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)" aria-label="Input"></div>
    <div><label style="font-size:11px">Min Payment</label><input type="number" value="${d.min}" oninput="debts[${i}].min=parseFloat(this.value)||0;calc()" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)" aria-label="Input"></div>
    </div>`;
    c.appendChild(div);
  });
}
function addDebt(){debts.push({name:'New Debt',balance:1000,rate:10,min:30});render();calc();}
function calc(){
  let d=debts.map(x=>({...x})).filter(x=>x.balance>0);
  if(d.length===0){document.getElementById('results').innerHTML='Add some debts to calculate.';return;}
  d.sort((a,b)=>mode==='snowball'?a.balance-b.balance:b.rate-a.rate);
  let extra=parseFloat(document.getElementById('extra').value)||0;
  let totalMin=d.reduce((s,x)=>s+x.min,0);
  let month=0,totalInterest=0,log=[];
  while(d.some(x=>x.balance>0)&&month<600){
    month++;
    let avail=totalMin+extra;
    for(let i=d.length-1;i>=0;i--){
      if(d[i].balance<=0)continue;
      let pay=Math.min(d[i].min,avail);
      avail-=d[i].min;
    }
    avail=extra;
    for(let item of d){
      let interest=item.balance*(item.rate/100/12);
      totalInterest+=interest;
      item.balance+=interest;
      let pay=Math.min(item.min+avail,item.balance);
      item.balance-=pay;
      if(pay>item.min)avail-=(pay-item.min);
    }
    d=d.filter(x=>x.balance>0.01);
    d.sort((a,b)=>mode==='snowball'?a.balance-b.balance:b.rate-a.rate);
  }
  const fmt=x=>'$'+Math.round(x).toLocaleString();
  document.getElementById('results').innerHTML=
    `<div class="row"><div><div class="lbl">Months to debt-free</div><div class="big">${month}</div></div>
    <div><div class="lbl">Total interest paid</div><div class="big" style="color:#c62828">${fmt(totalInterest)}</div></div></div>
    <div style="margin-top:8px"><div class="lbl">Strategy: ${mode==='snowball'?'Snowball (smallest first)':'Avalanche (highest rate first)'}</div></div>`;
}
render();calc();
</script>
</body>
</html>
