<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readability Checker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="site-header"></div>
<main class="tool-page">
<h1>📖 Readability Checker</h1>
<p class="subtitle">Analyze text readability with Flesch-Kincaid, Gunning Fog, SMOG, and ARI scores.</p>
<textarea id="input" placeholder="Paste your text here..." style="width:100%;min-height:200px;font-family:monospace;padding:12px;border-radius:8px;border:1px solid #ccc" aria-label="Paste Your Text Here..."></textarea>
<div style="margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px" id="results"></div>
<div style="margin-top:24px" id="stats"></div>
</main>
<script src="/assets/tools.js"></script>
<script src="/assets/app.js"></script>
<script>
const input=document.getElementById('input'),results=document.getElementById('results'),stats=document.getElementById('stats');

function countSyllables(word){
  word=word.toLowerCase().replace(/[^a-z]/g,'');
  if(!word)return 0;
  if(word.length<=3)return 1;
  word=word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'').replace(/^y/,'');
  const m=word.match(/[aeiouy]{1,2}/g);
  return m?m.length:1;
}

function analyze(){
  const text=input.value.trim();
  if(!text){results.innerHTML='';stats.innerHTML='';return;}
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim());
  const words=text.split(/\s+/).filter(w=>w.replace(/[^a-zA-Z]/g,''));
  const syllables=words.reduce((s,w)=>s+countSyllables(w),0);
  const characters=words.reduce((s,w)=>s+w.replace(/[^a-zA-Z0-9]/g,'').length,0);
  const complex=words.filter(w=>countSyllables(w)>=3);
  const sen=sentences.length||1,wn=words.length||1;
  const avgS=syllables/wn,avgW=wn/sen,pctComplex=(complex.length/wn)*100;
  const fk=206.835-(1.015*avgW)-(84.6*avgS);
  const fkGrade=(0.39*avgW)+(11.8*avgS)-15.59;
  const fog=0.4*((wn/sen)+pctComplex);
  const smog=1.0430*Math.sqrt(complex.length*(30/sen))+3.1291;
  const ari=4.71*(characters/wn)+0.5*avgW-21.43;
  const scales=[
    {n:'Flesch Reading Ease',v:fk.toFixed(1),lvl:fk>=90?'Very Easy':fk>=80?'Easy':fk>=70?'Fairly Easy':fk>=60?'Standard':fk>=50?'Fairly Difficult':fk>=30?'Difficult':'Very Confusing'},
    {n:'Flesch-Kincaid Grade',v:fkGrade.toFixed(1),lvl:'Grade '+Math.round(fkGrade)},
    {n:'Gunning Fog',v:fog.toFixed(1),lvl:'Grade '+Math.round(fog)},
    {n:'SMOG Index',v:smog.toFixed(1),lvl:'Grade '+Math.round(smog)},
    {n:'ARI',v:ari.toFixed(1),lvl:'Grade '+Math.max(1,Math.round(ari))}
  ];
  results.innerHTML=scales.map(s=>`<div style="padding:16px;border-radius:8px;background:var(--bg-card,#f5f5f5);border:1px solid #ddd"><div style="font-weight:600;font-size:14px">${s.n}</div><div style="font-size:28px;margin:8px 0">${s.v}</div><div style="color:#666">${s.lvl}</div></div>`).join('');
  stats.innerHTML=`<h3>Text Statistics</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">`+
    [`<div>Words: <b>${wn}</b></div>`,`<div>Sentences: <b>${sen}</b></div>`,`<div>Syllables: <b>${syllables}</b></div>`,`<div>Avg word length: <b>${(avgS).toFixed(2)}</b> syllables</div>`,`<div>Avg sentence: <b>${avgW.toFixed(1)}</b> words</div>`,`<div>Complex words: <b>${complex.length}</b> (${pctComplex.toFixed(1)}%)</div>`].map(x=>`<div style="padding:8px;background:var(--bg-card,#f5f5f5);border-radius:6px">${x}</div>`).join('')+`</div>`;
}

input.addEventListener('input',analyze);
</script>
</body>
</html>
