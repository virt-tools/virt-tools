<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gravel Pack Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gravel Pack Calculator</h1>
<p>Calculate gravel pack volume, annular capacity, and screen size from hole diameter, screen OD, and pack length. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-hd">Hole diameter</label><input type="text" id="in-hd" inputmode="decimal" autocomplete="off" placeholder="e.g. 8.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-sod">Screen OD</label><input type="text" id="in-sod" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-len">Pack length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hdE=document.getElementById("in-hd"),sodE=document.getElementById("in-sod"),lenE=document.getElementById("in-len"),out=document.getElementById("out");
function calc(){
var hd=parseFloat(hdE.value),sod=parseFloat(sodE.value),len=parseFloat(lenE.value);
if(isNaN(hd)||isNaN(sod)||isNaN(len))return;
var annArea=Math.PI*(Math.pow(hd/2,2)-Math.pow(sod/2,2))/144;
var vol=annArea*len*7.48;
var html='<div class="big">'+Math.round(vol*10)/10+' gal</div>';
html+=row("Gravel pack volume",Math.round(vol*10)/10+' gal');
html+=row("Annular area",Math.round(annArea*1000)/1000+' ft²');
html+=row("Pack length",len+' ft');
out.innerHTML=html;
}
[hdE,sodE,lenE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
