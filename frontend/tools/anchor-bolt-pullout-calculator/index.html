<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Anchor Bolt Pullout Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Anchor Bolt Pullout Calculator</h1>
<p>Estimate pullout capacity of a cast-in anchor bolt based on diameter, embedment, and concrete strength. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Bolt diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 16"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-h">Embedment depth</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 125"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-fc">Concrete strength</label><input type="text" id="in-fc" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">MPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter bolt diameter.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),hEl=document.getElementById("in-h"),fcEl=document.getElementById("in-fc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),H=pn(hEl.value),FC=pn(fcEl.value);
if(D==null){return}
H=H==null?125:H;FC=FC==null?25:FC;
if(!isFinite(D)||!isFinite(H)||!isFinite(FC)||D<=0||H<=0||FC<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var Abrg=Math.PI*(D+25)*(D+25)/4-Math.PI*D*D/4;
var Np=8*9.81*Abrg*Math.sqrt(FC)*H/1000/1000;
var Ncb=0.7*Math.PI*Math.pow(H,1.5)*Math.sqrt(FC)/1000;
var html='<div class="big">'+rnd(Np,1)+' kN</div>';
html+=row("Bolt diameter",rnd(D,1)+" mm");
html+=row("Embedment",rnd(H,0)+" mm");
html+=row("Concrete strength",rnd(FC,1)+" MPa");
html+=row("Bearing area",rnd(Abrg,0)+" mm²");
html+=row("Pullout capacity",rnd(Np,1)+" kN");
html+=row("Concrete cone",rnd(Ncb,1)+" kN");
out.innerHTML=html;
}
[dEl,hEl,fcEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
