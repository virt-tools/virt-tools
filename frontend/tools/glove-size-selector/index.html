<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Glove Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Glove Size Selector</h1>
<p>Find your glove size from hand circumference and hand length measurements. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-c">Hand circumference</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 9"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-l">Hand length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 7.5"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function sizeFromCirc(c){
if(c<6.5)return"XS";
if(c<7.5)return"S";
if(c<8.5)return"M";
if(c<9.5)return"L";
if(c<10.5)return"XL";
if(c<11.5)return"XXL";
return"XXXL";
}
function sizeFromLen(l){
if(l<6.5)return"XS";
if(l<7.0)return"S";
if(l<7.5)return"M";
if(l<8.0)return"L";
if(l<8.5)return"XL";
if(l<9.0)return"XXL";
return"XXXL";
}
var cEl=document.getElementById("in-c"),lEl=document.getElementById("in-l"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(cEl.value),L=pn(lEl.value);
if(C==null||L==null)return;
if(!isFinite(C)||!isFinite(L)||C<=0||L<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var sC=sizeFromCirc(C),sL=sizeFromLen(L);
var order=["XS","S","M","L","XL","XXL","XXXL"];
var idx=Math.max(order.indexOf(sC),order.indexOf(sL));
var rec=order[idx];
var html='<div class="big">'+rec+'</div>';
html+=row("Hand circumference",rnd(C,1)+' in → '+sC);
html+=row("Hand length",rnd(L,1)+' in → '+sL);
html+=row("Recommended size",rec);
out.innerHTML=html;
}
[cEl,lEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
