<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Aggregator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Aggregator</h1>
<p class="subtitle">Group and aggregate CSV data — sum, average, count, min, max. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="product,qty,price&#10;Apple,10,2.50&#10;Apple,5,2.50&#10;Banana,8,1.00" aria-label="Product,Qty,Price&#10;Apple,10,2.50&#10;Apple,5,2.50&#10;Banana,8,1.00"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Group by:</label><select id="groupCol" aria-label="Group Col"></select>
<label>Aggregate:</label><select id="aggCol" aria-label="Agg Col"></select>
<select id="aggFunc" aria-label="Agg Func"><option value="sum">Sum</option><option value="avg">Average</option><option value="count">Count</option><option value="min">Min</option><option value="max">Max</option></select>
<button id="run" class="primary-btn" type="button">Aggregate</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
const input=document.getElementById('input');
const groupSel=document.getElementById('groupCol');
const aggSel=document.getElementById('aggCol');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){
const opts=rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join('');
groupSel.innerHTML=opts;aggSel.innerHTML=opts;
}
});
document.getElementById('run').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];const data=rows.slice(1);
const gIdx=parseInt(groupSel.value);
const aIdx=parseInt(aggSel.value);
const func=document.getElementById('aggFunc').value;
const groups={};
data.forEach(r=>{
const key=r[gIdx]||'';
if(!groups[key])groups[key]=[];
groups[key].push(parseFloat(r[aIdx])||0);
});
const out=[[header[gIdx],func+'('+header[aIdx]+')']];
Object.keys(groups).sort().forEach(k=>{
const vals=groups[k];let res;
if(func==='sum')res=vals.reduce((a,b)=>a+b,0);
else if(func==='avg')res=vals.reduce((a,b)=>a+b,0)/vals.length;
else if(func==='count')res=vals.length;
else if(func==='min')res=Math.min(...vals);
else if(func==='max')res=Math.max(...vals);
out.push([k,Math.round(res*10000)/10000]);
});
const ta=document.createElement('textarea');ta.value=toCSV(out);ta.rows=8;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>'+Object.keys(groups).length+' groups.</p>';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
