<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Rotator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Text Rotator</h1>
<p class="subtitle">Rotate text by N positions (ROT-N). Includes ROT13, ROT47, and custom rotation.</p>
<div class="input-section">
<label>Input Text</label>
<textarea id="input" rows="6" placeholder="Enter text to rotate..." aria-label="Enter Text To Rotate..."></textarea>
<label>Rotation Amount</label>
<input type="number" id="shift" value="13" min="0" max="94" style="width:80px" aria-label="Shift">
<div class="btn-row">
<button id="rot13" class="primary-btn" type="button">ROT13</button>
<button id="rot47" class="primary-btn" type="button">ROT47</button>
<button id="custom" class="primary-btn" type="button">Rotate</button>
</div>
</div>
<label>Output</label>
<textarea id="output" rows="6" readonly aria-label="Output"></textarea>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function rot(s,n,alpha){
return s.split('').map(c=>{
const i=alpha.indexOf(c);
return i>=0?alpha[(i+n+alpha.length)%alpha.length]:c;
}).join('');
}
const upper='ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower='abcdefghijklmnopqrstuvwxyz';
const printable='!"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~';
function rot13(s){return rot(s,13,upper)+rot(s,13,lower).slice(s.length);}
document.getElementById('rot13').addEventListener('click',()=>{
const v=document.getElementById('input').value;
document.getElementById('output').value=v.split('').map(c=>{
if(c>='A'&&c<='Z')return upper[(upper.indexOf(c)+13)%26];
if(c>='a'&&c<='z')return lower[(lower.indexOf(c)+13)%26];
return c;
}).join('');
});
document.getElementById('rot47').addEventListener('click',()=>{
const v=document.getElementById('input').value;
document.getElementById('output').value=v.split('').map(c=>{
const code=c.charCodeAt(0);
if(code>=33&&code<=126)return String.fromCharCode(33+((code-33+47)%94));
return c;
}).join('');
});
document.getElementById('custom').addEventListener('click',()=>{
const v=document.getElementById('input').value;
const n=parseInt(document.getElementById('shift').value)||0;
document.getElementById('output').value=v.split('').map(c=>{
if(c>='A'&&c<='Z')return upper[(upper.indexOf(c)+n%26+26)%26];
if(c>='a'&&c<='z')return lower[(lower.indexOf(c)+n%26+26)%26];
return c;
}).join('');
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
