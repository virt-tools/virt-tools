<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Downspout Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Downspout Size Calculator</h1>
<p>Determine the recommended downspout size and number needed based on roof area and rainfall intensity. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ra">Roof area</label><input type="text" id="in-ra" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-ri">Rainfall intensity</label><input type="text" id="in-ri" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">mm/hr</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter roof area and rainfall.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var raEl=document.getElementById("in-ra"),riEl=document.getElementById("in-ri"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RA=pn(raEl.value),RI=pn(riEl.value);
if(RA==null||RI==null){return}
if(!isFinite(RA)||!isFinite(RI)||RA<=0||RI<=0){err.textContent="Values must be positive.";return}
err.textContent="";
var flow=RA*(RI/1000)/3600*1000;
var sizes=[{d:75,cap:1.5},{d:100,cap:3.0},{d:125,cap:5.0},{d:150,cap:8.0}];
var chosen=sizes[0];
for(var i=0;i<sizes.length;i++){if(sizes[i].cap>=flow){chosen=sizes[i];break}chosen=sizes[i]}
var count=Math.ceil(flow/chosen.cap);
var html='<div class="big">'+chosen.d+' mm</div>';
html+=row("Recommended size",chosen.d+" mm diameter");
html+=row("Flow rate",rnd(flow,1)+" L/s");
html+=row("Capacity per downspout",rnd(chosen.cap,1)+" L/s");
html+=row("Downspouts needed",count);
out.innerHTML=html;
}
[raEl,riEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
