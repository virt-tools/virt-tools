<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gazebo Roof Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gazebo Roof Calculator</h1>
<p>Calculate hip roof area, rafter length, and shingle bundles for a square gazebo from side length and roof pitch. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-s">Side length</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-p">Roof pitch</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in/ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sEl=document.getElementById("in-s"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var S=pn(sEl.value),P=pn(pEl.value);
if(S==null||P==null)return;
if(!isFinite(S)||!isFinite(P)||S<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var pitchFt=P/12;
var halfSpan=S/2;
var rafterLen=Math.sqrt(halfSpan*halfSpan+pitchFt*halfSpan*pitchFt*halfSpan);
var roofArea=4*rafterLen*halfSpan;
var shingleBundles=Math.ceil(roofArea/33.3);
var html='<div class="big">'+rnd(roofArea,0)+' sq ft</div>';
html+=row("Side length",rnd(S,1)+' ft');
html+=row("Roof pitch",rnd(P,0)+':12');
html+=row("Common rafter",rnd(rafterLen,1)+' ft');
html+=row("Total roof area",rnd(roofArea,0)+' sq ft');
html+=row("Shingle bundles",shingleBundles);
out.innerHTML=html;
}
[sEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
