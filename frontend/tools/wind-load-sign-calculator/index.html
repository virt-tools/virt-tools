<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wind Load Sign Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wind Load Sign Calculator</h1>
<p>Calculate wind pressure and total force on a sign from wind speed and sign dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ws">Wind speed</label><input type="text" id="in-ws" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m/s</div></div>
<div class="field"><label class="f" for="in-w">Sign width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">meters</div></div>
<div class="field"><label class="f" for="in-h">Sign height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">meters</div></div>
<div class="field"><label class="f" for="in-cd">Drag coefficient</label><input type="text" id="in-cd" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate wind load.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wsEl=document.getElementById("in-ws"),wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),cdEl=document.getElementById("in-cd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var WS=pn(wsEl.value),W=pn(wEl.value),H=pn(hEl.value),Cd=pn(cdEl.value);
if(WS==null||W==null||H==null||Cd==null){return}
if(!isFinite(WS)||!isFinite(W)||!isFinite(H)||!isFinite(Cd)||WS<=0||W<=0||H<=0||Cd<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var rho=1.225;
var q=0.5*rho*WS*WS;
var A=W*H;
var F=q*Cd*A;
var html='<div class="big">'+rnd(F,1)+' N</div>';
html+=row("Wind speed",rnd(WS,1)+" m/s");
html+=row("Sign width",rnd(W,2)+" m");
html+=row("Sign height",rnd(H,2)+" m");
html+=row("Sign area",rnd(A,2)+" m²");
html+=row("Drag coefficient",rnd(Cd,2));
html+=row("Wind pressure (q)",rnd(q,2)+" Pa");
html+=row("Total wind force",rnd(F,1)+" N");
out.innerHTML=html;
}
[wsEl,wEl,hEl,cdEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
