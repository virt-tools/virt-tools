<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pipe Collar Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pipe Collar Calculator</h1>
<p>Calculate pipe collar size and sealant from pipe diameter and roof thickness. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Pipe diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-t">Roof thickness</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),T=pn(tEl.value);
if(D==null||T==null)return;
if(!isFinite(D)||!isFinite(T)||D<=0||T<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var collarD=D+3;
var collarH=T+4;
var sealant=Math.PI*D*collarH*0.25/231;
var html='<div class="big">'+rnd(collarD,0)+' in</div>';
html+=row("Pipe diameter",rnd(D,1)+" in");
html+=row("Collar diameter",rnd(collarD,0)+" in");
html+=row("Collar height",rnd(collarH,1)+" in");
html+=row("Sealant needed",rnd(sealant,2)+" gal");
out.innerHTML=html;
}
[dEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
