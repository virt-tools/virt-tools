<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Zigbee Mesh Planner — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Zigbee Mesh Planner</h1>
<p>Plan Zigbee mesh network coverage: calculate number of routers needed and repeater placement for a given area. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Area to cover</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-r">Router range</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-d">Devices</label><input type="text" id="in-d" inputmode="numeric" autocomplete="off" placeholder="e.g. 30"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),rEl=document.getElementById("in-r"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),R=pn(rEl.value),D=pn(dEl.value);
if(A==null||R==null||D==null)return;
if(!isFinite(A)||A<=0||!isFinite(R)||R<=0||!isFinite(D)||D<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var circleArea=Math.PI*R*R;
var routers=Math.ceil(A/circleArea*0.6);
routers=Math.max(1,routers);
var maxHops=Math.ceil(Math.log2(D/routers));
var html='<div class="big">'+routers+' routers</div>';
html+=row("Routers needed",routers);
html+=row("Coverage per router",rnd(circleArea,1)+" m²");
html+=row("Max mesh hops",Math.max(1,maxHops));
html+=row("Devices per router",rnd(D/routers,1));
html+=row("Total area",A+" m²");
out.innerHTML=html;
}
[aEl,rEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
