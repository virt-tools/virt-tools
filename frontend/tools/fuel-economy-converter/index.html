<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Economy Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Fuel Economy Converter</h1>
<p class="subtitle">Convert between MPG, L/100km, km/L, and imperial units.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="30" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="0.425144" selected>US MPG</option>
<option value="0.354006">UK MPG</option>
<option value="100">L/100km (lower=better)</option>
<option value="1">km/L</option>
<option value="1">L/100km</option>
<option value="100">L/100km (metric)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const kmlPerMpgUS=0.425144;
const kmlPerMpgUK=0.354006;
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const unit=document.getElementById('from').value;
let kml;
if(unit==='0.425144')kml=v*kmlPerMpgUS;
else if(unit==='0.354006')kml=v*kmlPerMpgUK;
else if(unit==='100')kml=v>0?100/v:0;
else kml=v;
const usMpg=kml/kmlPerMpgUS;
const ukMpg=kml/kmlPerMpgUK;
const l100km=kml>0?100/kml:0;
const kmL=kml;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>US MPG:</span><span>${usMpg.toFixed(2)} mpg</span></div>
<div class="result-row"><span>UK MPG:</span><span>${ukMpg.toFixed(2)} mpg</span></div>
<div class="result-row"><span>L/100km:</span><span>${l100km.toFixed(2)} L/100km</span></div>
<div class="result-row"><span>km/L:</span><span>${kmL.toFixed(2)} km/L</span></div>
<div class="result-row"><span>mi/L (US):</span><span>${(kmL*0.621371).toFixed(2)} mi/L</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
