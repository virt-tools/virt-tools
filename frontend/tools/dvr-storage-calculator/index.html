<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>DVR Storage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>DVR Storage Calculator</h1>
<p>Estimate the hard drive storage needed for N cameras at a given bitrate and retention period. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n">Number of cameras</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 8"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-b">Bitrate per camera</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 4096"><div class="unit">kbps</div></div>
<div class="field"><label class="f" for="in-h">Retention period</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">days</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nEl=document.getElementById("in-n"),bEl=document.getElementById("in-b"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var N=pn(nEl.value),B=pn(bEl.value),H=pn(hEl.value);
if(N==null||B==null||H==null)return;
if(!isFinite(N)||N<=0||!isFinite(B)||B<=0||!isFinite(H)||H<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var bps=N*B*1000;
var bytesPerSec=bps/8;
var totalBytes=bytesPerSec*H*86400;
var tb=totalBytes/1e12;
var gb=totalBytes/1e9;
var html='<div class="big">'+rnd(tb,2)+' TB</div>';
html+=row("Storage needed",rnd(gb,1)+" GB");
html+=row("In TB",rnd(tb,2)+" TB");
html+=row("Total bitrate",rnd(N*B/1000,1)+" Mbps");
html+=row("Cameras",N);
html+=row("Retention",H+" days");
out.innerHTML=html;
}
[nEl,bEl,hEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
