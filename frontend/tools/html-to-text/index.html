<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to Text Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
textarea{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;width:100%;box-sizing:border-box;resize:vertical}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:#58a6ff}
button.primary{background:#1e3a5f;border-color:#58a6ff}
.opts{display:flex;gap:16px;align-items:center;margin:8px 0;color:#8b949e;font-size:.85em}
.opts label{display:flex;align-items:center;gap:4px;margin:0}
.stats{color:#8b949e;font-size:.8em;margin:6px 0}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>HTML to Text Converter</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Strip HTML tags and convert to plain text. Handles entities, scripts, styles. 100% client-side.</p>
<label>Input HTML</label>
<textarea id="input" rows="10" placeholder="Paste HTML here..." aria-label="Paste Html Here...">&lt;h1&gt;Hello&lt;/h1&gt;
&lt;p&gt;This is &lt;b&gt;bold&lt;/b&gt; text.&lt;/p&gt;
&lt;script&gt;alert('xss');&lt;/script&gt;
&lt;style&gt;body{color:red}&lt;/style&gt;</textarea>
<div class="opts">
<label><input type="checkbox" id="rmScripts" checked> Remove scripts</label>
<label><input type="checkbox" id="rmStyles" checked> Remove styles</label>
<label><input type="checkbox" id="decodeEntities" checked> Decode entities</label>
<label><input type="checkbox" id="preserveLinks"> Preserve links as [text](url)</label>
</div>
<button class="primary" onclick="convert()" type="button">Convert</button>
<button onclick="copy()" type="button">Copy result</button>
<div class="stats" id="stats"></div>
<label>Plain text output</label>
<textarea id="output" rows="6" readonly aria-label="Output"></textarea>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function convert(){
  let html=document.getElementById('input').value;
  const rmS=document.getElementById('rmScripts').checked;
  const rmSt=document.getElementById('rmStyles').checked;
  const dec=document.getElementById('decodeEntities').checked;
  const links=document.getElementById('preserveLinks').checked;
  if(rmS)html=html.replace(/<script[\s\S]*?<\/script>/gi,'');
  if(rmSt)html=html.replace(/<style[\s\S]*?<\/style>/gi,'');
  if(links){
    html=html.replace(/<a\s+[^>]*href=["']([^"']*)["'][^>]*>([\s\S]*?)<\/a>/gi,'[$2]($1)');
  }
  html=html.replace(/<br\s*\/?>/gi,'\n');
  html=html.replace(/<\/p>/gi,'\n\n');
  html=html.replace(/<\/div>/gi,'\n');
  html=html.replace(/<li>/gi,'• ');
  html=html.replace(/<\/li>/gi,'\n');
  html=html.replace(/<h[1-6][^>]*>/gi,'\n');
  html=html.replace(/<\/h[1-6]>/gi,'\n');
  html=html.replace(/<[^>]+>/g,'');
  if(dec){
    const ta=document.createElement('textarea');
    ta.innerHTML=html;
    html=ta.value;
  }
  html=html.replace(/\n{3,}/g,'\n\n').trim();
  document.getElementById('output').value=html;
  document.getElementById('stats').textContent=html.length+' chars, '+html.split(/\s+/).filter(w=>w).length+' words';
}
function copy(){
  const out=document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value);
}
convert();
</script>
</body>
</html>
