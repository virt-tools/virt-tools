<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Inverter Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Inverter Size Selector</h1>
<p>Calculate required inverter wattage from continuous load and surge factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cont">Continuous load</label><input type="text" id="in-cont" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-surge">Surge factor</label><input type="text" id="in-surge" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">× continuous</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter continuous load and surge factor.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var contEl=document.getElementById("in-cont"),surgeEl=document.getElementById("in-surge"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(contEl.value),S=pn(surgeEl.value);
if(C==null||S==null)return;
if(!isFinite(C)||!isFinite(S)||C<=0||S<1){err.textContent="Enter valid values (S ≥ 1).";return}
err.textContent="";
var surgeW=C*S;
var reqW=C*1.25;
var reqSurge=surgeW*1.25;
var html='<div class="big">'+rnd(Math.ceil(reqSurge/500)*500,0)+' W</div>';
html+=row("Continuous load",rnd(C,0)+" W");
html+=row("Surge factor",rnd(S,1)+"×");
html+=row("Surge watts",rnd(surgeW,0)+" W");
html+=row("Required continuous (125%)",rnd(reqW,0)+" W");
html+=row("Required surge (125%)",rnd(reqSurge,0)+" W");
html+=row("Recommended inverter",rnd(Math.ceil(reqSurge/500)*500,0)+" W");
html+=row("Type",C>2000?"Pure sine wave":"Modified sine OK");
out.innerHTML=html;
}
[contEl,surgeEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
