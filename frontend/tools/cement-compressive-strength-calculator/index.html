<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cement Compressive Strength Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cement Compressive Strength Calculator</h1>
<p>Estimate cement compressive strength development over time at a given curing temperature. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Curing time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">hours</div></div>
<div class="field"><label class="f" for="in-temp">Curing temperature</label><input type="text" id="in-temp" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">°F</div></div>
<div class="field"><label class="f" for="in-class">Cement class</label><input type="text" id="in-class" inputmode="decimal" autocomplete="off" placeholder="e.g. 1 (G=1, H=1.1)"><div class="unit">factor</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tE=document.getElementById("in-t"),tempE=document.getElementById("in-temp"),clsE=document.getElementById("in-class"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var t=parseFloat(tE.value),temp=parseFloat(tempE.value),cls=parseFloat(clsE.value)||1;
if(isNaN(t)||isNaN(temp))return;
if(t<=0){err.textContent="Enter valid curing time.";return}
err.textContent="";
var tempFactor=0.5+temp/200;
var strength=cls*tempFactor*500*Math.pow(t/24,0.5);
var html='<div class="big">'+Math.round(strength)+' psi</div>';
html+=row("Compressive strength",Math.round(strength)+' psi');
html+=row("Temperature factor",Math.round(tempFactor*100)/100);
html+=row("Curing time",t+' hours');
out.innerHTML=html;
}
[tE,tempE,clsE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
