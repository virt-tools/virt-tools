<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pallet Configurator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pallet Configurator</h1>
<p>Calculate deck board count, stringer count, and total lumber needed for a custom pallet. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 1200"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-wid">Width</label><input type="text" id="in-wid" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-db">Deck boards</label><input type="text" id="in-db" inputmode="decimal" autocomplete="off" placeholder="e.g. 7"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter pallet dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenEl=document.getElementById("in-len"),widEl=document.getElementById("in-wid"),dbEl=document.getElementById("in-db"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lenEl.value),W=pn(widEl.value),DB=pn(dbEl.value);
if(L==null||W==null){return}
DB=DB==null?7:DB;
if(!isFinite(L)||!isFinite(W)||!isFinite(DB)||L<=0||W<=0||DB<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var bdThk=22,bdWid=100,strThk=38,strHt=100;
var topBd=Math.ceil(DB),botBd=Math.ceil(DB);
var strCount=3;
var totalBdL=(topBd+botBd)*W;
var strL=strCount*L;
var totalL=(totalBdL+strL)/1000;
var html='<div class="big">'+rnd(totalL,1)+' m</div>';
html+=row("Top deck boards",topBd);
html+=row("Bottom deck boards",botBd);
html+=row("Stringers",strCount);
html+=row("Total lumber",rnd(totalL,1)+" m");
out.innerHTML=html;
}
[lenEl,widEl,dbEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
