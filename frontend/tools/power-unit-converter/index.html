<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Power Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Power Unit Converter</h1><p class="subtitle">Convert between all supported power units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Power","units":[{"slug":"milliwatts","name":"Milliwatts","symbol":"mW","scale":0.001,"offset":0},{"slug":"watts","name":"Watts","symbol":"W","scale":1,"offset":0},{"slug":"kilowatts","name":"Kilowatts","symbol":"kW","scale":1000,"offset":0},{"slug":"megawatts","name":"Megawatts","symbol":"MW","scale":1000000.0,"offset":0},{"slug":"gigawatts","name":"Gigawatts","symbol":"GW","scale":1000000000.0,"offset":0},{"slug":"horsepower-mechanical","name":"Mechanical horsepower","symbol":"hp","scale":745.6998715822702,"offset":0},{"slug":"horsepower-metric","name":"Metric horsepower","symbol":"PS","scale":735.49875,"offset":0},{"slug":"btu-per-hour","name":"BTU per hour","symbol":"BTU/h","scale":0.2930710701722222,"offset":0},{"slug":"foot-pounds-per-second","name":"Foot-pounds per second","symbol":"ft·lbf/s","scale":1.3558179483314,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
