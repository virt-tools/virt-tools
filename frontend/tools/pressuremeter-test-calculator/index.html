<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pressuremeter Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pressuremeter Test Calculator</h1>
<p>Calculate limit pressure, modulus of deformation, and creep pressure from pressuremeter test data. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p1">Pressure P1</label><input type="text" id="in-p1" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-p2">Pressure P2</label><input type="text" id="in-p2" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-v1">Volume V1</label><input type="text" id="in-v1" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">cm³</div></div>
<div class="field"><label class="f" for="in-v2">Volume V2</label><input type="text" id="in-v2" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">cm³</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var p1E=document.getElementById("in-p1"),p2E=document.getElementById("in-p2"),v1E=document.getElementById("in-v1"),v2E=document.getElementById("in-v2"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var p1=parseFloat(p1E.value),p2=parseFloat(p2E.value),v1=parseFloat(v1E.value),v2=parseFloat(v2E.value);
if(isNaN(p1)||isNaN(p2)||isNaN(v1)||isNaN(v2))return;
if(v2<=v1){err.textContent="V2 must exceed V1.";return}
err.textContent="";
var dp=p2-p1,dv=v2-v1;
var E=2*(v1+v2)/2*dp/dv;
var pl=p2+dp*(v2/(dv));
var html='<div class="big">'+Math.round(E)+' kPa</div>';
html+=row("Modulus of deformation",Math.round(E)+' kPa');
html+=row("Limit pressure (est.)",Math.round(pl)+' kPa');
html+=row("Pressure range",Math.round(dp)+' kPa');
out.innerHTML=html;
}
[p1E,p2E,v1E,v2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
