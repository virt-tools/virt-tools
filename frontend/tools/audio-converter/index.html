<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Format Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Format Converter</h1>
<p class="subtitle">Convert audio files between WAV, MP3, and WebM using the Web Audio API. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Output: <select id="format"><option value="audio/wav">WAV</option><option value="audio/webm">WebM</option></select></label>
<button id="convert" class="primary-btn" type="button">Convert</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
<audio id="player" controls style="display:none;margin-top:1em;width:100%;"></audio>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('convert').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const fmt=document.getElementById('format').value;
const status=document.getElementById('status');
const player=document.getElementById('player');
status.textContent='Converting...';
const arr=await file.arrayBuffer();
const ctx=new AudioContext();
const audio=await ctx.decodeAudioData(arr);
const offline=new OfflineAudioContext(audio.numberOfChannels,audio.length,audio.sampleRate);
const src=offline.createBufferSource();
src.buffer=audio;src.connect(offline.destination);
src.start();
const rendered=await offline.startRendering();
if(fmt==='audio/wav'){
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const url=URL.createObjectURL(blob);
player.src=url;player.style.display='block';
const a=document.createElement('a');a.href=url;a.download='converted.wav';a.click();
}
status.textContent='Done! File downloaded.';
});
function audioBufferToWav(buffer){
const numCh=buffer.numberOfChannels;
const len=buffer.length*numCh*2+44;
const arr=new ArrayBuffer(len);
const view=new DataView(arr);
const chs=[];for(let i=0;i<numCh;i++)chs.push(buffer.getChannelData(i));
let off=0;
const writeStr=s=>{for(let j=0;j<s.length;j++)view.setUint8(off++,s.charCodeAt(j));};
writeStr('RIFF');view.setUint32(off,36+len-44,true);off+=4;writeStr('WAVE');
writeStr('fmt ');view.setUint32(off,16,true);off+=4;
view.setUint16(off,1,true);off+=2;view.setUint16(off,numCh,true);off+=2;
view.setUint32(off,buffer.sampleRate,true);off+=4;
view.setUint32(off,buffer.sampleRate*numCh*2,true);off+=4;
view.setUint16(off,numCh*2,true);off+=2;view.setUint16(off,16,true);off+=2;
writeStr('data');view.setUint32(off,len-44,true);off+=4;
for(let i=0;i<buffer.length;i++){
for(let c=0;c<numCh;c++){
let s=Math.max(-1,Math.min(1,chs[c][i]));
view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
}
}
return arr;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
