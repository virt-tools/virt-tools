<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Radial Equalizer Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⭕ CSS Radial Equalizer Generator</h1>
<p>Create CSS circular audio equalizer / radial bar chart. 4 color schemes, adjustable bar count. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Color Scheme</label><select id="scheme"><option value="rainbow" selected>Rainbow</option><option value="gradient">Gradient</option><option value="mono">Monochrome</option><option value="neon">Neon</option></select></div>
<div class="ctrl-row"><label>Bar Count</label><input type="number" id="bars" value="32" min="8" max="64" style="width:80px"></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="200" selected>Medium</option><option value="150">Small</option><option value="300">Large</option></select></div>
<div class="ctrl-row"><label>Bar Width</label><input type="range" id="barW" min="2" max="10" value="4" style="width:200px"></div>
<div class="ctrl-row"><label>Bar Gap</label><input type="range" id="gap" min="0" max="10" value="2" style="width:200px"></div>
<div class="ctrl-row"><label>Speed</label><input type="range" id="speed" min="0.5" max="3" step="0.1" value="1" style="width:200px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function hsl(h,s,l){return 'hsl('+h+','+s+'%,'+l+'%)'}
function update(){
var scheme=document.getElementById('scheme').value;
var bars=parseInt(document.getElementById('bars').value)||32;
var size=parseInt(document.getElementById('size').value);
var barW=parseInt(document.getElementById('barW').value);
var gap=parseInt(document.getElementById('gap').value);
var speed=parseFloat(document.getElementById('speed').value);
var center=size/2;
var barLen=size*0.32;
var html='<div class="radial-eq" style="width:'+size+'px;height:'+size+'px">\n';
for(var i=0;i<bars;i++){
var ang=(i/bars)*360;
var c;
if(scheme==='rainbow'){c=hsl(i*(360/bars),70,55)}
else if(scheme==='gradient'){c=hsl(200+i*2,70,55)}
else if(scheme==='mono'){c=hsl(220,50,65)}
else{c=hsl(i*15%360,90,55)}
var delay=(i*0.05).toFixed(2);
html+='  <div class="rbar" style="background:'+c+';transform:translate(-50%,-100%) rotate('+ang+'deg);animation-delay:'+delay+'s;animation-duration:'+(1/speed).toFixed(2)+'s"></div>\n';
}
html+='</div>';
var css='.radial-eq{position:relative;display:flex;align-items:center;justify-content:center}\n';
css+='.rbar{position:absolute;left:50%;top:50%;transform-origin:bottom center;width:'+barW+'px;height:'+barLen+'px;border-radius:'+(barW/2)+'px;margin-top:-'+(size*0.22)+'px;animation:rbarGrow '+speed+'s ease-in-out infinite alternate}\n';
css+='@keyframes rbarGrow{0%{height:'+(barLen*0.3)+'px}100%{height:'+barLen+'px}}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['scheme','bars','size','barW','gap','speed'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
