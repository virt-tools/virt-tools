<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wainscoting Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wainscoting Calculator</h1>
<p>Calculate panel count, rail length, and stiles for wainscoting a wall section. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wl">Wall length</label><input type="text" id="in-wl" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-wh">Wainscot height</label><input type="text" id="in-wh" inputmode="decimal" autocomplete="off" placeholder="e.g. 900"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-pw">Panel width</label><input type="text" id="in-pw" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wlEl=document.getElementById("in-wl"),whEl=document.getElementById("in-wh"),pwEl=document.getElementById("in-pw"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var WL=pn(wlEl.value),WH=pn(whEl.value),PW=pn(pwEl.value);
if(WL==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter wall dimensions.</span>';return}
WH=WH==null?900:WH;PW=PW==null?300:PW;
if(!isFinite(WL)||!isFinite(WH)||!isFinite(PW)||WL<=0||WH<=0||PW<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var panels=Math.ceil(WL/PW);
var topRail=Math.round(WH/4);
var bottomRail=Math.round(WH/4);
var stileWidth=Math.round(PW/10);
var totalRail=WL*2;
var totalStile=(panels+1)*WH;
var totalLF=(totalRail+totalStile)/304.8;
var html='<div class="big">'+panels+' panels</div>';
html+=row("Wall length",rnd(WL,0)+" mm");
html+=row("Wainscot height",rnd(WH,0)+" mm");
html+=row("Panel width",rnd(PW,0)+" mm");
html+=row("Top rail height",rnd(topRail,0)+" mm");
html+=row("Bottom rail height",rnd(bottomRail,0)+" mm");
html+=row("Stile width",rnd(stileWidth,0)+" mm");
html+=row("Total rail length",rnd(totalRail,0)+" mm");
html+=row("Total stile length",rnd(totalStile,0)+" mm");
out.innerHTML=html;
}
[wlEl,whEl,pwEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
