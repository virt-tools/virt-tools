<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Density Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Density Logging Calculator</h1>
<p>Calculate bulk density, density porosity, and caliper correction from density log readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rhob">Bulk density</label><input type="text" id="in-rhob" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.4"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-rhoma">Matrix density</label><input type="text" id="in-rhoma" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.65"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-rhof">Fluid density</label><input type="text" id="in-rhof" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.0"><div class="unit">g/cm³</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rhobE=document.getElementById("in-rhob"),rhomaE=document.getElementById("in-rhoma"),rhofE=document.getElementById("in-rhof"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var rhob=parseFloat(rhobE.value),rhoma=parseFloat(rhomaE.value),rhof=parseFloat(rhofE.value);
if(isNaN(rhob)||isNaN(rhoma)||isNaN(rhof))return;
if(rhoma<=rhof){err.textContent="Matrix density must exceed fluid density.";return}
err.textContent="";
var porosity=(rhoma-rhob)/(rhoma-rhof);
var html='<div class="big">'+Math.round(porosity*10000)/100+' %</div>';
html+=row("Density porosity",Math.round(porosity*10000)/100+' %');
html+=row("Bulk density",rhob+' g/cm³');
html+=row("Matrix density",rhoma+' g/cm³');
out.innerHTML=html;
}
[rhobE,rhomaE,rhofE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
