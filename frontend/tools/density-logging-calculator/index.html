<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Density Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Density Logging Calculator</h1>
<p>Calculate density porosity from bulk density, matrix density, and fluid density log values. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rhob">Bulk density</label><input type="text" id="in-rhob" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.4"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-rhoma">Matrix density</label><input type="text" id="in-rhoma" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.65"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-rhof">Fluid density</label><input type="text" id="in-rhof" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.0"><div class="unit">g/cm³</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rhobE=document.getElementById("in-rhob"),rhomaE=document.getElementById("in-rhoma"),rhofE=document.getElementById("in-rhof"),err=document.getElementById("err"),out=document.getElementById("out");
var PROMPT='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var rhob=parseFloat(rhobE.value),rhoma=parseFloat(rhomaE.value),rhof=parseFloat(rhofE.value);
if(isNaN(rhob)||isNaN(rhoma)||isNaN(rhof)){err.textContent="";out.innerHTML=PROMPT;return}
if(rhoma<=rhof){err.textContent="Matrix density must exceed fluid density.";out.innerHTML=PROMPT;return}
if(rhob<rhof||rhob>rhoma){err.textContent="Bulk density must lie between fluid and matrix density (otherwise the density-porosity equation is not valid).";out.innerHTML=PROMPT;return}
err.textContent="";
var porosity=(rhoma-rhob)/(rhoma-rhof);
var html='<div class="big">'+Math.round(porosity*10000)/100+' %</div>';
html+=row("Density porosity",Math.round(porosity*10000)/100+' %');
html+=row("Bulk density",rhob+' g/cm³');
html+=row("Matrix density",rhoma+' g/cm³');
out.innerHTML=html;
}
[rhobE,rhomaE,rhofE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
