<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Radiometric Survey Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Radiometric Survey Calculator</h1>
<p>Calculate count rate, exposure rate, and minimum detectable activity for gamma-ray radiometric surveys. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cps">Count rate</label><input type="text" id="in-cps" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">cps</div></div>
<div class="field"><label class="f" for="in-eff">Detector efficiency</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">fraction</div></div>
<div class="field"><label class="f" for="in-bg">Background</label><input type="text" id="in-bg" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">cps</div></div>
<div class="field"><label class="f" for="in-t">Count time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cpsE=document.getElementById("in-cps"),effE=document.getElementById("in-eff"),bgE=document.getElementById("in-bg"),tE=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var cps=parseFloat(cpsE.value),eff=parseFloat(effE.value),bg=parseFloat(bgE.value),t=parseFloat(tE.value);
if(isNaN(cps)||isNaN(eff)||isNaN(bg)||isNaN(t))return;
if(eff<=0||t<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var net=cps-bg;
var activity=net/eff;
var mda=3*Math.sqrt(bg*t)/(eff*t);
var snr=net/Math.sqrt(cps*t+bg*t);
var html='<div class="big">'+Math.round(net)+' cps</div>';
html+=row("Net count rate",Math.round(net)+' cps');
html+=row("Estimated activity",Math.round(activity)+' Bq');
html+=row("MDA (3σ)",Math.round(mda)+' Bq');
html+=row("SNR",Math.round(snr*100)/100);
out.innerHTML=html;
}
[cpsE,effE,bgE,tE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
