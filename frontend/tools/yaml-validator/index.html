<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>YAML Validator</h1>
<p class="subtitle">Validate YAML syntax and convert to JSON for inspection. Reports line numbers on errors. 100% client-side.</p>
<div class="input-section">
<label for="input">Paste YAML</label>
<textarea id="input" rows="10" placeholder="key: value&#10;list:&#10;  - item1&#10;  - item2"></textarea>
<button id="validate" class="primary-btn" type="button">Validate</button>
</div>
<div id="result" style="margin-top:1em;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function findColon(s){
for(let k=0;k<s.length;k++){
if(s[k]==='"'||s[k]==="'")return -1;
if(s[k]===':')return(k===s.length-1||s[k+1]===' ')?k:-1;
}
return -1;
}
function stripComment(v){
if(v.startsWith('"')||v.startsWith("'")){
const q=v[0],end=v.indexOf(q,1);
if(end>-1)return v.slice(0,end+1);
return v;
}
return v.replace(/\s+#.*$/,'');
}
function parseVal(v){
v=v.trim();
if(v.startsWith('"')&&v.endsWith('"'))return v.slice(1,-1);
if(v.startsWith("'")&&v.endsWith("'"))return v.slice(1,-1);
if(v==='true')return true;
if(v==='false')return false;
if(v==='null'||v==='~')return null;
if(v.startsWith('[')){try{return JSON.parse(v.replace(/'/g,'"'));}catch(e){return [];}}
if(v.startsWith('{')){try{return JSON.parse(v.replace(/'/g,'"'));}catch(e){return {};}}
if(!isNaN(v)&&v!=='')return Number(v);
return v;
}
function parseYAML(text){
const lines=[];
const rawLines=text.split('\n');
for(let n=0;n<rawLines.length;n++){
const line=rawLines[n].replace(/\s+$/,'');
if(!line.trim()||line.trim().startsWith('#'))continue;
lines.push({indent:line.match(/^\s*/)[0].length,content:line.trim(),num:n+1});
}
let i=0;
function isItem(l){return l.content==='-'||l.content.startsWith('- ');}
function parseBlock(){
const first=lines[i];
if(isItem(first))return parseList(first.indent);
if(findColon(first.content)>0)return parseMap(first.indent,first.content);
i++;
return parseVal(stripComment(first.content));
}
function parseList(indent){
const arr=[];
while(i<lines.length&&lines[i].indent===indent&&isItem(lines[i])){
const rest=lines[i].content==='-'?'':lines[i].content.slice(2).trim();
i++;
if(!rest){
if(i<lines.length&&lines[i].indent>indent)arr.push(parseBlock());
else arr.push(null);
}else if(findColon(rest)>0){
arr.push(parseMap(indent+2,rest));
}else{
arr.push(parseVal(stripComment(rest)));
}
}
return arr;
}
function parseMap(indent,firstContent){
const obj={};
let content=firstContent;
for(;;){
const ci=findColon(content);
const key=content.slice(0,ci).trim().replace(/^"|"$/g,'');
const val=content.slice(ci+1).trim();
if(val){
obj[key]=parseVal(stripComment(val));
}else if(i<lines.length&&lines[i].indent>indent){
obj[key]=parseBlock();
}else if(i<lines.length&&lines[i].indent===indent&&isItem(lines[i])){
obj[key]=parseList(indent);
}else{
obj[key]={};
}
if(i<lines.length&&lines[i].indent===indent&&findColon(lines[i].content)>0){content=lines[i].content;i++;continue;}
break;
}
return obj;
}
if(!lines.length)return {};
const data=parseBlock();
if(i<lines.length)throw new Error('Line '+lines[i].num+': could not parse "'+lines[i].content+'" — check indentation or a missing ":"');
return data;
}
document.getElementById('validate').addEventListener('click',()=>{
const input=document.getElementById('input').value;
const result=document.getElementById('result');
if(!input.trim()){result.innerHTML='<p style="color:var(--warn)">No input.</p>';return;}
try{
const obj=parseYAML(input);
const size=new Blob([input]).size;
const jsonStr=JSON.stringify(obj,null,2);
result.innerHTML='<div style="color:var(--ok)"><h3>✓ Valid YAML</h3><p><strong>Size:</strong> '+size+' bytes</p></div><pre style="background:var(--bg-elev-2);border:1px solid var(--border);padding:1em;border-radius:4px;overflow:auto;margin-top:8px">'+jsonStr.replace(/</g,'&lt;')+'</pre>';
}catch(e){
result.innerHTML='<div style="color:var(--bad)"><h3>✗ Invalid YAML</h3><p>'+esc(e.message)+'</p></div>';
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
