<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>YAML Validator</h1>
<p class="subtitle">Validate YAML syntax and convert to JSON for inspection. Reports line numbers on errors. 100% client-side.</p>
<div class="input-section">
<label>Paste YAML</label>
<textarea id="input" rows="10" placeholder="key: value&#10;list:&#10;  - item1&#10;  - item2" aria-label="Key: Value&#10;List:&#10;    Item1&#10;    Item2"></textarea>
<button id="validate" class="primary-btn" type="button">Validate</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseYAML(text){
const lines=text.split('\n');
const result={};
const stack=[{indent:-1,obj:result}];
for(let i=0;i<lines.length;i++){
const line=lines[i];
if(!line.trim()||line.trim().startsWith('#'))continue;
const indent=line.length-line.trimStart().length;
while(stack.length>1&&stack[stack.length-1].indent>=indent)stack.pop();
const trimmed=line.trim();
const colonIdx=trimmed.indexOf(':');
if(colonIdx===-1)throw new Error(`Line ${i+1}: Missing colon in "${trimmed}"`);
const key=trimmed.slice(0,colonIdx).trim();
let val=trimmed.slice(colonIdx+1).trim();
if(!val){
key; // placeholder - nested
const child={};
stack[stack.length-1].obj[key]=child;
stack.push({indent:indent+2,obj:child});
}else{
if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'")))val=val.slice(1,-1);
else if(val==='null')val=null;
else if(val==='true')val=true;
else if(val==='false')val=false;
else if(/^-?\d+$/.test(val))val=parseInt(val,10);
else if(/^-?\d*\.\d+$/.test(val))val=parseFloat(val);
stack[stack.length-1].obj[key]=val;
}
}
return result;
}
document.getElementById('validate').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
try{
const obj=parseYAML(input);
const size=new Blob([input]).size;
const jsonStr=JSON.stringify(obj,null,2);
document.getElementById('result').innerHTML=`<div style="color:#4caf50"><h3>✓ Valid YAML</h3><p><strong>Size:</strong> ${size} bytes</p></div><pre style="background:#1a1a2e;padding:1em;border-radius:4px;overflow:auto;margin-top:8px">${jsonStr.replace(/</g,'&lt;')}</pre>`;
}catch(e){
document.getElementById('result').innerHTML=`<div style="color:#f44336"><h3>✗ Invalid YAML</h3><p>${e.message}</p></div>`;
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
