<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Neutron Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Neutron Logging Calculator</h1>
<p>Compare neutron and density porosity to estimate average porosity and gas or shale effects. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-nphi">Neutron porosity</label><input type="text" id="in-nphi" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.15"><div class="unit">fraction</div></div>
<div class="field"><label class="f" for="in-dphi">Density porosity</label><input type="text" id="in-dphi" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.10"><div class="unit">fraction</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nphiE=document.getElementById("in-nphi"),dphiE=document.getElementById("in-dphi"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var nphi=parseFloat(nphiE.value),dphi=parseFloat(dphiE.value);
if(isNaN(nphi)||isNaN(dphi))return;
err.textContent="";
var shaleImpact=nphi-dphi;
var gasIndicator=nphi-dphi;
var avgPorosity=(nphi+dphi)/2;
if(!isFinite(avgPorosity*10000)){err.textContent="Values are too large.";return}
var html='<div class="big">'+Math.round(avgPorosity*10000)/100+' %</div>';
html+=row("Average porosity",Math.round(avgPorosity*10000)/100+' %');
html+=row("N-D difference",Math.round(shaleImpact*10000)/100+' %');
html+=row("Gas indicator",gasIndicator<-0.05?'Possible gas':(gasIndicator>0.03?'Shale effect':'Water-wet'));
out.innerHTML=html;
}
[nphiE,dphiE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
