<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Rate Zone Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Heart Rate Zone Calculator</h1>
<p class="subtitle">Find your target heart rate zones for effective training.</p>

<div class="input-section">
  <label>Age</label>
  <input type="number" id="age" value="30" step="1" min="10" max="100" aria-label="Age">

  <label>Resting heart rate (optional)</label>
  <input type="number" id="resting" value="60" step="1" min="30" max="120" placeholder="Optional — for Karvonen method" aria-label="Optional — For Karvonen Method">

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="result-row"><span>Max Heart Rate:</span><span id="mhr"></span></div>
  <div id="zones"></div>
</div>

<style>
.zone-bar { height:30px; border-radius:6px; margin:6px 0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:bold; }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const age = parseInt(document.getElementById('age').value) || 30;
    const resting = parseInt(document.getElementById('resting').value) || 0;
    const mhr = 220 - age;

    document.getElementById('mhr').textContent = mhr + ' bpm';

    const zones = [
      { name: 'Zone 1 — Recovery', min: 0.50, max: 0.60, color: '#3498db' },
      { name: 'Zone 2 — Fat Burn', min: 0.60, max: 0.70, color: '#2ecc71' },
      { name: 'Zone 3 — Aerobic', min: 0.70, max: 0.80, color: '#f39c12' },
      { name: 'Zone 4 — Anaerobic', min: 0.80, max: 0.90, color: '#e67e22' },
      { name: 'Zone 5 — Max Effort', min: 0.90, max: 1.00, color: '#e74c3c' },
    ];

    const container = document.getElementById('zones');
    container.innerHTML = '';

    zones.forEach(z => {
      let lo, hi;
      if (resting >= 30) {
        // Karvonen
        lo = Math.round(((mhr - resting) * z.min) + resting);
        hi = Math.round(((mhr - resting) * z.max) + resting);
      } else {
        lo = Math.round(mhr * z.min);
        hi = Math.round(mhr * z.max);
      }

      const div = document.createElement('div');
      div.className = 'zone-bar';
      div.style.background = z.color;
      div.textContent = `${z.name}: ${lo}-${hi} bpm`;
      container.appendChild(div);
    });

    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
