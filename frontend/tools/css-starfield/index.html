<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Starfield Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:0;background:#0a0a12;border-radius:12px;overflow:hidden;height:300px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>✨ CSS Starfield Generator</h1>
<p>Create CSS twinkling starfield background animation. 4 presets, adjustable count/speed/size/color. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="night" selected>Night Sky</option><option value="galaxy">Galaxy</option><option value="aurora">Aurora</option><option value="warp">Warp Speed</option></select></div>
<div class="ctrl-row"><label>Star Count</label><input type="number" id="count" value="80" min="10" max="200" style="width:80px"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Star Color</label><input type="color" id="color" value="#ffffff" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#000011" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Max Size (px)</label><input type="number" id="maxSize" value="3" min="1" max="10" style="width:80px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var count=parseInt(document.getElementById('count').value);
var speed=document.getElementById('speed').value;
var color=document.getElementById('color').value;
var bgColor=document.getElementById('bgColor').value;
var maxSize=parseInt(document.getElementById('maxSize').value);
var dur=speed==='slow'?'4s':speed==='fast'?'1s':'2s';
var animName=preset==='warp'?'star-warp':'twinkle';
var html='<div class="starfield">\n';
var css='.starfield{width:100%;height:300px;background:'+bgColor+';position:relative;overflow:hidden}\n.star{position:absolute;background:'+color+';border-radius:50%;animation:'+animName+' '+dur+' ease-in-out infinite}\n';
for(var i=0;i<count;i++){
var left=Math.floor(Math.random()*100);
var top=Math.floor(Math.random()*100);
var size=Math.floor(1+Math.random()*maxSize);
var delay=(Math.random()*3).toFixed(2)+'s';
var dur2=(parseFloat(dur)+Math.random()*2).toFixed(2)+'s';
var extra='';
if(preset==='warp'){extra='animation:star-warp '+(parseFloat(dur)+Math.random()*3).toFixed(2)+'s linear infinite;left:50%;top:50%'}
else{extra='left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;animation-delay:'+delay+';animation-duration:'+dur2+'s'}
html+='<div class="star" style="'+extra+'"></div>\n';
}
html+='</div>';
if(preset==='warp'){
css+='@keyframes star-warp{0%{transform:translate(0,0) scale(0);opacity:0}10%{opacity:1}100%{transform:translate('+(Math.random()>0.5?'300':'-300')+'px,'+(Math.random()>0.5?'300':'-300')+'px) scale(2);opacity:0}}';
}else{
css+='@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','count','speed','color','bgColor','maxSize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
