<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.lc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.lc h1{font-size:2rem;margin-bottom:.5rem}
.lc .sub{color:#888;margin-bottom:1.5rem}
.lc label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.lc input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.lc select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.lc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.lc .results{margin-top:2rem}
.lc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.lc .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.lc .res-card .lbl{color:#888;font-size:13px}
.lc table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.lc th,.lc td{padding:8px;text-align:right;border-bottom:1px solid var(--border)}
.lc th{text-align:left}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="lc">
<h1>🏦 Loan Calculator</h1>
<p class="sub">Calculate monthly payments, total interest, and full amortization schedule.</p>
<label for="amount">Loan amount ($):</label>
<input type="number" id="amount" value="250000" min="0" oninput="calc()">
<label for="rate">Annual interest rate (%):</label>
<input type="number" id="rate" value="6.5" min="0" step="0.01" oninput="calc()">
<label for="years">Loan term (years):</label>
<input type="number" id="years" value="30" min="1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const P=parseFloat(document.getElementById('amount').value)||0;
  const r=(parseFloat(document.getElementById('rate').value)||0)/100/12;
  const n=(parseFloat(document.getElementById('years').value)||1)*12;
  let monthly,totalInterest,totalPaid;
  if(r===0){monthly=P/n;totalPaid=P;totalInterest=0;}
  else{monthly=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);totalPaid=monthly*n;totalInterest=totalPaid-P;}
  let html='<div class="res-card"><div class="lbl">Monthly Payment</div><div class="big">$'+monthly.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Interest</div><div class="big">$'+totalInterest.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Paid</div><div class="big">$'+totalPaid.toFixed(2)+'</div></div>';
  let bal=P;let rows='';
  for(let i=1;i<=Math.min(n,360);i++){
    const intPart=bal*r;const princPart=monthly-intPart;bal-=princPart;
    if(bal<0)bal=0;
    rows+='<tr><td>'+i+'</td><td>'+monthly.toFixed(2)+'</td><td>'+princPart.toFixed(2)+'</td><td>'+intPart.toFixed(2)+'</td><td>'+bal.toFixed(2)+'</td></tr>';
  }
  html+='<h3>Amortization Schedule</h3><table><tr><th>#</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>'+rows+'</table>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
