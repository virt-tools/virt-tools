<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregnancy Due Date Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pregnancy Due Date Calculator</h1>
<p class="subtitle">Estimate your due date and track key pregnancy milestones.</p>

<div class="input-section">
  <label>First day of last period (LMP)</label>
  <input type="date" id="lmp" aria-label="Lmp">

  <label>Or average cycle length (days)</label>
  <input type="number" id="cycle" value="28" step="1" min="20" max="45" aria-label="Cycle">

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="due-date"></div>
  <div class="result-row"><span>Estimated conception:</span><span id="conception"></span></div>
  <div class="result-row"><span>End of first trimester:</span><span id="tri1"></span></div>
  <div class="result-row"><span>End of second trimester:</span><span id="tri2"></span></div>
  <div class="result-row"><span>Current week:</span><span id="current-week"></span></div>
  <div class="result-row"><span>Days remaining:</span><span id="days-remaining"></span></div>
</div>

<style>
.big-result { font-size:1.6em; font-weight:bold; color:var(--accent); text-align:center; padding:12px; }
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('lmp').value = today;

  document.getElementById('calc').addEventListener('click', () => {
    const lmp = new Date(document.getElementById('lmp').value);
    const cycle = parseInt(document.getElementById('cycle').value) || 28;
    const cycleAdjust = cycle - 28;

    const conception = new Date(lmp);
    conception.setDate(conception.getDate() + 14 + cycleAdjust);

    const due = new Date(lmp);
    due.setDate(due.getDate() + 280 + cycleAdjust);

    const tri1 = new Date(lmp); tri1.setDate(tri1.getDate() + 91 + cycleAdjust);
    const tri2 = new Date(lmp); tri2.setDate(tri2.getDate() + 182 + cycleAdjust);

    const now = new Date();
    const daysSince = Math.floor((now - lmp) / 86400000);
    const weeks = Math.floor(daysSince / 7);
    const daysRem = 280 + cycleAdjust - daysSince;

    const fmt = d => d.toLocaleDateString('en-US', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

    document.getElementById('due-date').textContent = fmt(due);
    document.getElementById('conception').textContent = fmt(conception);
    document.getElementById('tri1').textContent = fmt(tri1);
    document.getElementById('tri2').textContent = fmt(tri2);
    document.getElementById('current-week').textContent = Math.max(0, weeks) + ' weeks' + (daysSince >= 0 ? '' : ' (not yet)');
    document.getElementById('days-remaining').textContent = Math.max(0, daysRem) + ' days';
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
