<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sealant Bead Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sealant Bead Calculator</h1>
<p>Calculate sealant bead volume, tube count, and joint fill from joint length, width, and depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Joint length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Joint width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-d">Joint depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value);
if(L==null||W==null||D==null)return;
if(!isFinite(L)||!isFinite(W)||!isFinite(D)||L<=0||W<=0||D<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var volIn3=L*12*W*D;
var volOz=volIn3/1.805;
var tubes=Math.ceil(volOz/10);
var html='<div class="big">'+rnd(volOz,1)+' fl oz</div>';
html+=row("Joint length",rnd(L,0)+' ft');
html+=row("Joint width",rnd(W,3)+' in');
html+=row("Joint depth",rnd(D,3)+' in');
html+=row("Sealant volume",rnd(volOz,1)+' fl oz');
html+=row("10 oz tubes",rnd(tubes,0)+' tubes');
out.innerHTML=html;
}
[lEl,wEl,dEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
