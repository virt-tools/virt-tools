<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fresnel Zone Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fresnel Zone Calculator</h1>
<p>Calculate the first Fresnel zone radius for a radio link at a given distance and frequency. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-f">Frequency</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 2400"><div class="unit">MHz</div></div>
<div class="field"><label class="f" for="in-d1">Distance from A</label><input type="text" id="in-d1" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">km</div></div>
<div class="field"><label class="f" for="in-d2">Distance from B</label><input type="text" id="in-d2" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">km</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fE=document.getElementById("in-f"),d1E=document.getElementById("in-d1"),d2E=document.getElementById("in-d2"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var f=parseFloat(fE.value),d1=parseFloat(d1E.value),d2=parseFloat(d2E.value);
err.textContent="";
if(isNaN(f)||isNaN(d1)||isNaN(d2)){reset();return}
if(!isFinite(f)||!isFinite(d1)||!isFinite(d2)||f<=0||d1<0||d2<0||d1+d2===0){err.textContent="Frequency must be positive and distances zero or positive.";reset();return}
var lam=300/f;
var r=Math.sqrt(lam*d1*d2*1000/(d1+d2));
var r60=0.6*r;
var html='<div class="big">'+(Math.round(r*100)/100)+' m</div>';
html+=row("1st Fresnel zone radius",Math.round(r*100)/100+' m');
html+=row("60% clearance radius",Math.round(r60*100)/100+' m');
html+=row("Frequency",f+' MHz');
html+=row("Total distance",(d1+d2)+' km');
out.innerHTML=html;
}
[fE,d1E,d2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
