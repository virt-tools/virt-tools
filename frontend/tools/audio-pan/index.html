<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Panner — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Panner</h1>
<p class="subtitle">Adjust stereo pan of audio files. Export as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Pan: <input type="range" id="pan" min="-1" max="1" value="0" step="0.1"><span id="panv">0</span></label>
<button id="process" class="primary-btn" type="button">Process & Download</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const pan=document.getElementById('pan');
document.getElementById('panv').textContent=pan.value;
pan.oninput=()=>document.getElementById('panv').textContent=pan.value;
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const audioCtx=new AudioContext();
const arr=await file.arrayBuffer();
const buf=await audioCtx.decodeAudioData(arr);
const panner=audioCtx.createStereoPanner();
panner.pan.value=+pan.value;
const dest=audioCtx.createMediaStreamDestination();
const src=audioCtx.createBufferSource();
src.buffer=buf;src.connect(panner);panner.connect(dest);
const rec=new MediaRecorder(dest.stream);
const chunks=[];
rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{
const blob=new Blob(chunks,{type:'audio/webm'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='panned.webm';a.click();
audioCtx.close();
};
rec.start();src.start();
setTimeout(()=>{src.stop();rec.stop();},buf.duration*1000+200);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
