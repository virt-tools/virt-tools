<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roofing Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Roofing Calculator</h1>
<p class="subtitle">Estimate shingle bundles, underlayment rolls, and nails for your roof.</p>

<div class="input-section">
  <label>Roof Length (ft)</label>
  <input type="number" id="length" value="40" min="0" aria-label="Length">
  <label>Roof Width (ft)</label>
  <input type="number" id="width" value="30" min="0" aria-label="Width">
  <label>Pitch (rise per 12)</label>
  <input type="number" id="pitch" value="6" min="0" step="0.5" aria-label="Pitch">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const L = parseFloat(document.getElementById('length').value) || 0;
    const W = parseFloat(document.getElementById('width').value) || 0;
    const P = parseFloat(document.getElementById('pitch').value) || 0;
    const pitchFactor = Math.sqrt(1 + Math.pow(P/12, 2));
    const area = L * W * pitchFactor;
    const bundles = Math.ceil(area / 33);
    const rolls = Math.ceil(area / 400);
    const nails = Math.ceil(area / 4);
    document.getElementById('result').innerHTML = `
      <div class="result-row"><span>Roof Area:</span><span>${area.toFixed(1)} sq ft</span></div>
      <div class="result-row"><span>Shingle Bundles:</span><span>${bundles} (covers ~33 sq ft each)</span></div>
      <div class="result-row"><span>Underlayment Rolls:</span><span>${rolls} (covers ~400 sq ft each)</span></div>
      <div class="result-row"><span>Nail Boxes:</span><span>${nails} (1 lb per ~4 sq ft)</span></div>
      <div class="result-row"><span>Waste (10%):</span><span>${(area*0.1).toFixed(1)} sq ft extra</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
