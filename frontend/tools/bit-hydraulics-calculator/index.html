<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Bit Hydraulics Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Bit Hydraulics Calculator</h1>
<p>Calculate bit nozzle velocity, hydraulic horsepower, and impact force from flow rate and nozzle area. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-q">Flow rate</label><input type="text" id="in-q" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">gpm</div></div>
<div class="field"><label class="f" for="in-na">Nozzle area</label><input type="text" id="in-na" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">in²</div></div>
<div class="field"><label class="f" for="in-mw">Mud weight</label><input type="text" id="in-mw" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ppg</div></div>
</div>
<div class="err" id="err" role-live="polite" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var qE=document.getElementById("in-q"),naE=document.getElementById("in-na"),mwE=document.getElementById("in-mw"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var q=parseFloat(qE.value),na=parseFloat(naE.value),mw=parseFloat(mwE.value);
if(isNaN(q)||isNaN(na)||isNaN(mw))return;
if(na<=0){err.textContent="Enter valid nozzle area.";return}
err.textContent="";
var nv=q/na*0.32;
var hhp=(mw*q*q)/(1303*na);
var impact=(mw*q*Math.sqrt(nv))/(1.27*1000);
var html='<div class="big">'+Math.round(nv)+' ft/s</div>';
html+=row("Nozzle velocity",Math.round(nv)+' ft/s');
html+=row("Hydraulic horsepower",Math.round(hhp*10)/10+' hp');
html+=row("Impact force",Math.round(impact*10)/10+' lbf');
out.innerHTML=html;
}
[qE,naE,mwE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
