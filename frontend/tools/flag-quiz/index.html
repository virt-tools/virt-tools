<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Quiz — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.quiz-wrap{max-width:700px;margin:1rem auto;padding:1.5rem}
.flag-display{text-align:center;margin:1rem 0}
.flag-display .flag{font-size:6rem;line-height:1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:1rem 0}
.choice{padding:.75rem 1rem;border:2px solid var(--border);background:var(--card-bg);border-radius:8px;cursor:pointer;font-size:1rem;transition:all .15s}
.choice:hover{border-color:var(--accent)}
.choice.correct{background:#2d5a2d;border-color:#4caf50;color:#fff}
.choice.wrong{background:#5a2d2d;border-color:#f44336;color:#fff}
.choice:disabled{cursor:default}
.stats{display:flex;gap:1rem;justify-content:center;margin:1rem 0;font-size:.9rem;color:var(--text-muted)}
.score-bar{font-size:1.2rem;font-weight:bold;text-align:center;margin:.5rem 0}
.streak{color:#ff9800}
.btn{display:block;margin:1rem auto;padding:.6rem 2rem}
.feedback{font-style:italic;color:var(--text-muted);text-align:center;min-height:1.5rem}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Flag Quiz</h1>
<div class="quiz-wrap">
<h2>Flag Quiz 🏴</h2>
<p>Can you identify the country from its flag? 10 questions, 4 choices each.</p>
<div class="stats"><span>Question <span id="qNum">1</span>/10</span><span>Score: <span id="score">0</span></span><span class="streak" id="streakDisp" style="display:none">🔥 <span id="streak">0</span></span></div>
<div class="flag-display"><div class="flag" id="flag">🏳️</div></div>
<div class="feedback" id="feedback"></div>
<div class="choices" id="choices"></div>
<button class="btn" id="restart" style="display:none" type="button">Restart</button>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
const FLAGS=[
  ["🇺🇸","United States"],["🇬🇧","United Kingdom"],["🇫🇷","France"],["🇩🇪","Germany"],
  ["🇮🇹","Italy"],["🇪🇸","Spain"],["🇨🇦","Canada"],["🇦🇺","Australia"],
  ["🇯🇵","Japan"],["🇨🇳","China"],["🇮🇳","India"],["🇧🇷","Brazil"],
  ["🇲🇽","Mexico"],["🇷🇺","Russia"],["🇰🇷","South Korea"],["🇳🇱","Netherlands"],
  ["🇸🇪","Sweden"],["🇳🇴","Norway"],["🇫🇮","Finland"],["🇩🇰","Denmark"],
  ["🇵🇹","Portugal"],["🇬🇷","Greece"],["🇹🇷","Turkey"],["🇪🇬","Egypt"],
  ["🇿🇦","South Africa"],["🇳🇬","Nigeria"],["🇰🇪","Kenya"],["🇲🇦","Morocco"],
  ["🇸🇦","Saudi Arabia"],["🇮🇱","Israel"],["🇮🇷","Iran"],["🇹🇭","Thailand"],
  ["🇻🇳","Vietnam"],["🇮🇩","Indonesia"],["🇵🇭","Philippines"],["🇲🇾","Malaysia"],
  ["🇸🇬","Singapore"],["🇵🇰","Pakistan"],["🇧🇩","Bangladesh"],["🇱🇰","Sri Lanka"],
  ["🇦🇷","Argentina"],["🇨🇱","Chile"],["🇨🇴","Colombia"],["🇵🇪","Peru"],
  ["🇻🇪","Venezuela"],["🇨🇺","Cuba"],["🇯🇲","Jamaica"],["🇭🇳","Honduras"],
  ["🇺🇦","Ukraine"],["🇵🇱","Poland"],["🇨🇿","Czechia"],["🇭🇺","Hungary"],
  ["🇷🇴","Romania"],["🇧🇬","Bulgaria"],["🇷🇸","Serbia"],["🇭🇷","Croatia"],
  ["🇸🇰","Slovakia"],["🇦🇹","Austria"],["🇧🇪","Belgium"],["🇮🇪","Ireland"],
  ["🇨🇭","Switzerland"],["🇸🇮","Slovenia"],["🇱🇻","Latvia"],["🇱🇹","Lithuania"],
  ["🇪🇪","Estonia"],["🇮🇸","Iceland"],["🇮🇶","Iraq"],["🇯🇴","Jordan"],
  ["🇱🇧","Lebanon"],["🇸🇾","Syria"],["🇦🇫","Afghanistan"],["🇰🇿","Kazakhstan"],
  ["🇺🇿","Uzbekistan"],["🇪🇹","Ethiopia"],["🇬🇭","Ghana"],["🇩🇿","Algeria"],
  ["🇹🇳","Tunisia"],["🇱🇾","Libya"],["🇨🇩","DR Congo"],["🇨🇲","Cameroon"],
  ["🇸🇳","Senegal"],["🇨🇮"  ,"Ivory Coast"],["🇿🇼","Zimbabwe"],["🇳🇿","New Zealand"],
  ["🇵🇬","Papua New Guinea"],["🇫🇯","Fiji"],["🇲🇳","Mongolia"],["🇰🇭","Cambodia"],
  ["🇲🇲","Myanmar"],["🇱🇦","Laos"],["🇳🇵","Nepal"],["🇧🇹","Bhutan"],
  ["🇾🇪","Yemen"],["🇴🇲","Oman"],["🇶🇦","Qatar"],["🇧🇭","Bahrain"],
  ["🇰🇼","Kuwait"],["🇦🇪","UAE"],["🇨🇷","Costa Rica"],["🇵🇦","Panama"],
  ["🇬🇹","Guatemala"],["🇩🇴","Dominican Republic"],["🇧🇴","Bolivia"],["🇵🇾","Paraguay"],
  ["🇺🇾","Uruguay"],["🇪🇨","Ecuador"],["🇻🇮","US Virgin Islands"],["🇧🇧","Barbados"],
];
let quiz=[],qi=0,score=0,streak=0;
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function buildQuiz(){
  const pool=shuffle(FLAGS).slice(0,10);
  quiz=pool.map(([flag,answer])=>{
    const wrongs=shuffle(FLAGS.filter(f=>f[1]!==answer)).slice(0,3).map(f=>f[1]);
    return{flag,answer,choices:shuffle([answer,...wrongs])};
  });
}
function renderQ(){
  const q=quiz[qi];
  document.getElementById('flag').textContent=q.flag;
  document.getElementById('qNum').textContent=qi+1;
  document.getElementById('feedback').textContent='';
  const ch=document.getElementById('choices');
  ch.innerHTML='';
  q.choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice';b.textContent=c;
    b.onclick=()=>pick(b,c,q.answer);
    ch.appendChild(b);
  });
}
function pick(btn,val,ans){
  const all=document.querySelectorAll('.choice');
  all.forEach(b=>b.disabled=true);
  if(val===ans){
    btn.classList.add('correct');
    score++;streak++;
    document.getElementById('feedback').textContent='✅ Correct!';
  }else{
    btn.classList.add('wrong');streak=0;
    document.getElementById('feedback').textContent='❌ The answer was '+ans;
    all.forEach(b=>{if(b.textContent===ans)b.classList.add('correct')});
  }
  document.getElementById('score').textContent=score;
  if(streak>=2){document.getElementById('streakDisp').style.display='';document.getElementById('streak').textContent=streak}
  else{document.getElementById('streakDisp').style.display='none'}
  setTimeout(()=>{qi++;if(qi<quiz.length)renderQ();else endGame()},1500);
}
function endGame(){
  document.querySelector('.flag-display').style.display='none';
  document.getElementById('choices').innerHTML='';
  document.getElementById('feedback').textContent='';
  const scoreBar=document.createElement('div');
  scoreBar.className='score-bar';
  scoreBar.innerHTML='Quiz complete! You scored '+score+' / '+quiz.length+' ('+Math.round(score/quiz.length*100)+'%)';
  document.querySelector('.quiz-wrap').insertBefore(scoreBar,document.getElementById('choices'));
  document.getElementById('restart').style.display='block';
}
document.getElementById('restart').onclick=()=>{
  document.querySelector('.score-bar')?.remove();
  document.querySelector('.flag-display').style.display='';
  document.getElementById('restart').style.display='none';
  qi=0;score=0;streak=0;
  document.getElementById('score').textContent=0;
  document.getElementById('streakDisp').style.display='none';
  buildQuiz();renderQ();
};
buildQuiz();renderQ();
</script>
</body>
</html>
