<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Smart Light Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Smart Light Load Calculator</h1>
<p>Calculate total wattage load for smart bulb setups and verify switch/dimmer capacity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n">Number of bulbs</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 6"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-w">Wattage per bulb</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 9"><div class="unit">W</div></div>
<div class="field"><label class="f" for="in-c">Switch max load</label><input type="text" id="in-c" inputmode="numeric" autocomplete="off" placeholder="e.g. 150"><div class="unit">W</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nEl=document.getElementById("in-n"),wEl=document.getElementById("in-w"),cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var N=pn(nEl.value),W=pn(wEl.value),C=pn(cEl.value);
if(N==null||W==null||C==null)return;
if(!isFinite(N)||N<=0||!isFinite(W)||W<=0||!isFinite(C)||C<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var total=N*W;
var pct=total/C*100;
var ok=pct<=80;
var html='<div class="big" style="color:'+(ok?'var(--good,#4ade80)':'var(--bad,#f87171)')+'">'+(ok?'OK':'Overload')+'</div>';
html+=row("Total load",rnd(total,1)+" W");
html+=row("Switch capacity",C+" W");
html+=row("Load percentage",rnd(pct,1)+" %");
html+=row("Status",ok?"Within 80% limit":"Exceeds 80% limit");
html+=row("Bulbs",N+" x "+W+" W");
out.innerHTML=html;
}
[nEl,wEl,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
