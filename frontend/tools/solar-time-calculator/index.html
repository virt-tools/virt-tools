<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Time Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Solar Time Calculator</h1>
<p class="subtitle">Calculate solar noon, sunrise, and sunset for any date and longitude.</p>
<div class="input-section">
<label>Date</label>
<input type="date" id="date" aria-label="Date">
<label>Longitude (°, negative = West)</label>
<input type="number" id="lon" value="-74" step="0.1" aria-label="Lon">
<label>Latitude (°, negative = South)</label>
<input type="number" id="lat" value="40.7" step="0.1" aria-label="Lat">
<label>Timezone Offset (hours from UTC)</label>
<input type="number" id="tz" value="-5" step="0.5" aria-label="Tz">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('date').value=new Date().toISOString().split('T')[0];
document.getElementById('calc').addEventListener('click',()=>{
const d=new Date(document.getElementById('date').value);
const lon=parseFloat(document.getElementById('lon').value)||0;
const lat=parseFloat(document.getElementById('lat').value)||0;
const tz=parseFloat(document.getElementById('tz').value)||0;
const doy=Math.ceil((d-new Date(d.getFullYear(),0,1))/86400000)+1;
const B=(360/365)*(doy-81)*Math.PI/180;
const EoT=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
const solarNoon=12+tz-lon/15-EoT/60;
const decl=23.45*Math.sin(360/365*(doy-81)*Math.PI/180*Math.PI/180);
const ha=Math.acos(-Math.tan(lat*Math.PI/180)*Math.tan(decl*Math.PI/180))*180/Math.PI;
const sunrise=solarNoon-ha/15;
const sunset=solarNoon+ha/15;
const fmt=h=>{const H=Math.floor(h);const M=Math.round((h-H)*60);return `${(H+24)%24}:${M<10?'0'+M:M}`;};
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Date:</span><span>${d.toDateString()}</span></div>
<div class="result-row"><span>Day of Year:</span><span>${doy}</span></div>
<div class="result-row"><span>Equation of Time:</span><span>${EoT.toFixed(2)} min</span></div>
<div class="result-row"><span>Solar Noon:</span><span>${fmt(solarNoon)} local time</span></div>
<div class="result-row"><span>Sunrise (approx):</span><span>${fmt(sunrise)}</span></div>
<div class="result-row"><span>Sunset (approx):</span><span>${fmt(sunset)}</span></div>
<div class="result-row"><span>Daylight:</span><span>${(sunset-sunrise).toFixed(1)} hours</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
