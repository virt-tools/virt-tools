<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whitespace Remover — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Whitespace Remover</h1>
<p class="subtitle">Trim, collapse, or remove all whitespace from text. Multiple modes in one tool.</p>
<div class="input-section">
<label>Input text</label>
<textarea id="input" rows="10" placeholder="Paste text here..." aria-label="Paste Text Here..."></textarea>
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="trim">Trim leading/trailing</option>
<option value="collapse">Collapse multiple spaces</option>
<option value="remove-all">Remove all whitespace</option>
<option value="remove-empty">Remove empty lines</option>
<option value="trim-lines">Trim each line</option>
</select>
<button id="process" class="primary-btn" type="button">Process</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',()=>{
const input=document.getElementById('input').value;
const mode=document.getElementById('mode').value;
let result;
if(mode==='trim')result=input.trim();
else if(mode==='collapse')result=input.replace(/[^\S\n]+/g,' ').trim();
else if(mode==='remove-all')result=input.replace(/\s+/g,'');
else if(mode==='remove-empty')result=input.split('\n').filter(l=>l.trim().length>0).join('\n');
else if(mode==='trim-lines')result=input.split('\n').map(l=>l.trim()).join('\n');
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+result.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=result;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
