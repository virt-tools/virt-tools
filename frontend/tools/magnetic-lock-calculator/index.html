<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Magnetic Lock Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Magnetic Lock Calculator</h1>
<p>Calculate electromagnetic lock (maglock) holding force, power, and release device requirements for a door. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-door">Door width</label><input type="text" id="in-door" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-w">Door weight</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">lbs</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-door"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Wd=pn(dEl.value),Wt=pn(wEl.value);
if(Wd==null||Wt==null)return;
if(!isFinite(Wd)||Wd<=0||!isFinite(Wt)||Wt<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var minForce=Wt*5;
var recForce=Math.max(1200,Math.ceil(minForce/100)*100);
var releaseDevices=Wd>48?2:1;
var html='<div class="big">'+recForce+' lbs holding force</div>';
html+=row("Min holding force",rnd(minForce,0)+' lbs');
html+=row("Recommended maglock",recForce+' lbs');
html+=row("Release devices",releaseDevices);
html+=row("Power (typical)","12–24 VDC, 0.4 A");
out.innerHTML=html;
}
[dEl,wEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
