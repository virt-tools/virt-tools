<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cement Bond Quality Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cement Bond Quality Calculator</h1>
<p>Estimate cement bond quality index from acoustic impedance, compressive strength, and annular coverage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ai">Acoustic impedance</label><input type="text" id="in-ai" inputmode="decimal" autocomplete="off" placeholder="e.g. 5.0"><div class="unit">MRayl</div></div>
<div class="field"><label class="f" for="in-cs">Comp. strength</label><input type="text" id="in-cs" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-cov">Annular coverage</label><input type="text" id="in-cov" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.9"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aiE=document.getElementById("in-ai"),csE=document.getElementById("in-cs"),covE=document.getElementById("in-cov"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var ai=parseFloat(aiE.value),cs=parseFloat(csE.value),cov=parseFloat(covE.value);
if(isNaN(ai)||isNaN(cs)||isNaN(cov))return;
err.textContent="";
var bi=(ai/6.0)*0.5+(cs/5000)*0.3+cov*0.2;
var rating=bi>=0.8?"Good":bi>=0.5?"Fair":"Poor";
var html='<div class="big">'+Math.round(bi*100)+'%</div>';
html+=row("Bond index",Math.round(bi*100)+'%');
html+=row("Quality rating",rating);
out.innerHTML=html;
}
[aiE,csE,covE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
