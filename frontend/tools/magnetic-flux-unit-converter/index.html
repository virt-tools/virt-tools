<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Magnetic flux Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Magnetic flux Unit Converter</h1><p class="subtitle">Convert between all supported magnetic flux units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Magnetic flux","units":[{"slug":"webers","name":"Webers","symbol":"Wb","scale":1,"offset":0},{"slug":"milliwebers","name":"Milliwebers","symbol":"mWb","scale":0.001,"offset":0},{"slug":"microwebers","name":"Microwebers","symbol":"µWb","scale":1e-06,"offset":0},{"slug":"nanowebers","name":"Nanowebers","symbol":"nWb","scale":1e-09,"offset":0},{"slug":"maxwells","name":"Maxwells","symbol":"Mx","scale":1e-08,"offset":0},{"slug":"volt-seconds","name":"Volt-seconds","symbol":"V·s","scale":1,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
