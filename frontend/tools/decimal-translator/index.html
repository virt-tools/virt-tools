<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decimal ASCII Translator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Decimal ASCII Translator</h1>
<p class="subtitle">Convert text to decimal ASCII codes and back. Space-separated numbers.</p>
<div class="input-section">
<label>Input: <textarea id="input" rows="4" placeholder="Type text or decimal (e.g. 72 101 108)"></textarea></label>
<button id="toDec" class="primary-btn" type="button">Text → Decimal</button>
<button id="fromDec" class="btn" type="button">Decimal → Text</button>
<button id="copy" class="btn" type="button">Copy Result</button>
</div>
<div class="output-section">
<label>Result: <textarea id="result" rows="4" readonly></textarea></label>
</div>
<script>
document.getElementById('toDec').addEventListener('click',()=>{
const t=document.getElementById('input').value;
document.getElementById('result').value=[...t].map(c=>c.charCodeAt(0)).join(' ');
});
document.getElementById('fromDec').addEventListener('click',()=>{
const t=document.getElementById('input').value.trim().split(/\s+/);
document.getElementById('result').value=t.map(d=>String.fromCharCode(parseInt(d,10))).join('');
});
document.getElementById('copy').addEventListener('click',()=>{const r=document.getElementById('result');r.select();document.execCommand('copy');});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
