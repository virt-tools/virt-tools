<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Burger Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🍔 CSS Burger Generator</h1>
<p>Create CSS burger with customizable layers: bun, lettuce, tomato, cheese, patty. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Bun Color</label><input type="color" id="bun" value="#d49a4e" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Lettuce</label><select id="lettuce"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Tomato</label><select id="tomato"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Cheese</label><select id="cheese"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Patties</label><input type="range" id="patties" min="1" max="3" step="1" value="1" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var bun=document.getElementById('bun').value;
var lettuce=document.getElementById('lettuce').value;
var tomato=document.getElementById('tomato').value;
var cheese=document.getElementById('cheese').value;
var patties=parseInt(document.getElementById('patties').value);
var html='<div class="burger">\n  <div class="top-bun"></div>\n';
if(lettuce==='yes')html+='  <div class="lettuce"></div>\n';
if(tomato==='yes')html+='  <div class="tomato"></div>\n';
if(cheese==='yes')html+='  <div class="cheese"></div>\n';
for(var i=0;i<patties;i++)html+='  <div class="patty"></div>\n';
html+='  <div class="bottom-bun"></div>\n</div>';
var css='.burger{display:flex;flex-direction:column;align-items:center;width:200px}\n';
css+='.top-bun{width:200px;height:70px;background:'+bun+';border-radius:100px 100px 8px 8px;box-shadow:inset 0 -6px 12px rgba(0,0,0,0.15);position:relative}\n';
css+='.top-bun::after{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:#b8862e;border-radius:50%;box-shadow:-40px 4px #b8862e,40px 4px #b8862e}\n';
css+='.bottom-bun{width:200px;height:30px;background:'+bun+';border-radius:8px 8px 16px 16px;box-shadow:inset 0 6px 12px rgba(0,0,0,0.15)}\n';
if(lettuce==='yes')css+='.lettuce{width:210px;height:14px;background:#6fb84f;border-radius:8px;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.1)}\n';
if(tomato==='yes')css+='.tomato{width:195px;height:16px;background:#e0593b;border-radius:8px}\n';
if(cheese==='yes')css+='.cheese{width:205px;height:14px;background:#ffba3e;clip-path:polygon(0 0,100% 0,95% 100%,90% 0,85% 100%,80% 0,75% 100%,70% 0,65% 100%,60% 0,55% 100%,50% 0,45% 100%,40% 0,35% 100%,30% 0,25% 100%,20% 0,15% 100%,10% 0,5% 100%)}\n';
css+='.patty{width:200px;height:22px;background:#6b3a1a;border-radius:8px;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.2)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['bun','lettuce','tomato','cheese','patties'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
