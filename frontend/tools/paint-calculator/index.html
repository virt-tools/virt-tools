<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint Coverage Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Paint Coverage Calculator</h1>
<p class="subtitle">Estimate how much paint you need for any room.</p>

<div class="input-section">
  <label>Room width (ft)</label>
  <input type="number" id="width" value="12" min="1" step="0.5" aria-label="Width">
  <label>Room length (ft)</label>
  <input type="number" id="length" value="12" min="1" step="0.5" aria-label="Length">
  <label>Wall height (ft)</label>
  <input type="number" id="height" value="8" min="1" step="0.5" aria-label="Height">
  <label>Number of doors</label>
  <input type="number" id="doors" value="1" min="0" aria-label="Doors">
  <label>Number of windows</label>
  <input type="number" id="windows" value="2" min="0" aria-label="Windows">
  <label>Coats</label>
  <input type="number" id="coats" value="2" min="1" max="5" aria-label="Coats">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const w = parseFloat(document.getElementById('width').value) || 0;
    const l = parseFloat(document.getElementById('length').value) || 0;
    const h = parseFloat(document.getElementById('height').value) || 0;
    const doors = parseInt(document.getElementById('doors').value) || 0;
    const windows = parseInt(document.getElementById('windows').value) || 0;
    const coats = parseInt(document.getElementById('coats').value) || 1;
    const perimeter = 2 * (w + l);
    const wallArea = perimeter * h;
    const doorArea = doors * 21;
    const windowArea = windows * 15;
    const paintableArea = wallArea - doorArea - windowArea;
    const totalArea = paintableArea * coats;
    const coveragePerGallon = 350;
    const gallons = Math.ceil(totalArea / coveragePerGallon);
    document.getElementById('bigResult').textContent = `${gallons} gallon${gallons > 1 ? 's' : ''} needed`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Wall area:</span><span>${wallArea.toFixed(0)} sq ft</span></div>
      <div class="result-row"><span>Paintable area:</span><span>${paintableArea.toFixed(0)} sq ft</span></div>
      <div class="result-row"><span>With ${coats} coat${coats > 1 ? 's' : ''}:</span><span>${totalArea.toFixed(0)} sq ft</span></div>
      <div class="result-row"><span>Ceiling area:</span><span>${(w * l).toFixed(0)} sq ft (separate)</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
