<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Drill Pipe Velocity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Drill Pipe Velocity Calculator</h1>
<p>Calculate fluid velocity inside drill pipe from flow rate and pipe inner diameter. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-q">Flow rate</label><input type="text" id="in-q" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">gpm</div></div>
<div class="field"><label class="f" for="in-id">Pipe ID</label><input type="text" id="in-id" inputmode="decimal" autocomplete="off" placeholder="e.g. 4.276"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var qE=document.getElementById("in-q"),idE=document.getElementById("in-id"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var q=parseFloat(qE.value),id=parseFloat(idE.value);
if(isNaN(q)||isNaN(id))return;
if(id<=0){err.textContent="Enter valid pipe ID.";return}
err.textContent="";
var area=0.7854*id*id;
var vel=q*24.5/area;
var html='<div class="big">'+Math.round(vel*10)/10+' ft/min</div>';
html+=row("Pipe velocity",Math.round(vel*10)/10+' ft/min');
html+=row("Cross-sectional area",Math.round(area*100)/100+' in²');
out.innerHTML=html;
}
[qE,idE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
