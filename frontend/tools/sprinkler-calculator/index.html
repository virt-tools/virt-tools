<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprinkler Water Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Sprinkler Water Calculator</h1>
<p class="subtitle">Calculate water usage and costs for your lawn irrigation.</p>
<div class="input-section">
<label>Sprinkler Flow Rate (GPM)</label>
<input type="number" id="gpm" value="5" min="0" step="0.5" aria-label="Gpm">
<label>Number of Zones</label>
<input type="number" id="zones" value="4" min="1" aria-label="Zones">
<label>Minutes per Zone</label>
<input type="number" id="mins" value="20" min="0" aria-label="Mins">
<label>Days per Week</label>
<input type="number" id="days" value="3" min="0" max="7" aria-label="Days">
<label>Water Cost ($/1000 gal)</label>
<input type="number" id="cost" value="4" min="0" step="0.5" aria-label="Cost">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const g=parseFloat(document.getElementById('gpm').value)||0;
const z=parseInt(document.getElementById('zones').value)||0;
const m=parseFloat(document.getElementById('mins').value)||0;
const d=parseInt(document.getElementById('days').value)||0;
const c=parseFloat(document.getElementById('cost').value)||0;
const galPerRun=g*z*m;
const galPerWeek=galPerRun*d;
const galPerMonth=galPerWeek*4.33;
const galPerYear=galPerWeek*52;
const costYear=galPerYear/1000*c;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Per Watering:</span><span>${galPerRun.toLocaleString(undefined,{maximumFractionDigits:0})} gal</span></div>
<div class="result-row"><span>Per Week:</span><span>${galPerWeek.toLocaleString(undefined,{maximumFractionDigits:0})} gal</span></div>
<div class="result-row"><span>Per Month:</span><span>${galPerMonth.toLocaleString(undefined,{maximumFractionDigits:0})} gal</span></div>
<div class="result-row"><span>Per Year:</span><span>${galPerYear.toLocaleString(undefined,{maximumFractionDigits:0})} gal</span></div>
<div class="result-row"><span>Yearly Cost:</span><span>$${costYear.toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
