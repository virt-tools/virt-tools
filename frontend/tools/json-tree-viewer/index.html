<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Tree Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:var(--bg,#0d1117);color:var(--text,#c9d1d9);font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:var(--accent,#58a6ff);font-size:1.6em}
.back{color:var(--text-dim,#8b949e);text-decoration:none;font-size:.85em}
.back:hover{color:var(--accent,#58a6ff)}
textarea{background:var(--bg-elev,#161b22);color:var(--text,#c9d1d9);border:1px solid var(--border,#30363d);border-radius:6px;padding:12px;font-family:monospace;font-size:13px;width:100%;box-sizing:border-box}
label{display:block;color:var(--text-dim,#8b949e);font-size:.85em;margin:12px 0 4px}
button{background:var(--bg-elev,#21262d);color:var(--text,#c9d1d9);border:1px solid var(--border,#30363d);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:var(--accent,#58a6ff)}
button.primary{background:var(--accent,#1e3a5f);color:var(--on-accent,#fff);border-color:var(--accent,#58a6ff)}
.err{color:var(--bad,#f85149);font-size:.85em}
.tree{margin-top:12px;font-family:monospace;font-size:13px;line-height:1.6}
.tree ul{list-style:none;padding-left:20px;border-left:1px solid var(--border,#30363d)}
.tree li{position:relative}
.tree .key{color:var(--accent,#79c0ff)}
.tree .str{color:var(--accent-2,#a5d6ff)}
.tree .num{color:var(--warn,#f0883e)}
.tree .bool{color:var(--bad,#f85149)}
.tree .null{color:var(--text-dim,#8b949e)}
.tree .toggle{cursor:pointer;color:var(--accent,#58a6ff);user-select:none;margin-right:4px}
.tree .toggle:focus-visible{outline:2px solid var(--accent,#58a6ff);outline-offset:2px}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>JSON Tree Viewer</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:var(--text-dim,#8b949e);font-size:.9em">Paste JSON to view it as an expandable tree. Collapsible nodes, type-colored values, copy paths. 100% client-side.</p>
<label>JSON input</label>
<textarea id="input" rows="8" placeholder='{"name":"Alice","age":30,"tags":["js","web"],"meta":{"active":true,"score":null}}' aria-label="JSON input">{"name":"Alice","age":30,"tags":["js","web"],"meta":{"active":true,"score":null}}</textarea>
<button class="primary" onclick="render()" type="button">Render Tree</button>
<div class="err" id="err" aria-live="polite"></div>
<div class="tree" id="tree" aria-live="polite"></div>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function render(){
  document.getElementById('err').textContent='';
  try{
    let data=JSON.parse(document.getElementById('input').value);
    document.getElementById('tree').innerHTML='';
    document.getElementById('tree').appendChild(buildNode(data,'root',0));
  }catch(e){
    document.getElementById('err').textContent='Error: '+e.message;
  }
}
function buildNode(data,path,depth){
  let div=document.createElement('div');
  if(data===null){div.innerHTML='<span class="null">null</span>';return div;}
  if(typeof data==='boolean'){div.innerHTML='<span class="bool">'+data+'</span>';return div;}
  if(typeof data==='number'){div.innerHTML='<span class="num">'+data+'</span>';return div;}
  if(typeof data==='string'){div.innerHTML='<span class="str">"'+esc(data)+'"</span>';return div;}
  // array or object
  let entries=Array.isArray(data)?data.map((v,i)=>[i,v]):Object.entries(data);
  let ul=document.createElement('ul');
  entries.forEach(([k,v])=>{
    let li=document.createElement('li');
    let isObj=v!==null&&typeof v==='object';
    let keySpan=document.createElement('span');
    keySpan.className='key';
    keySpan.textContent=(Array.isArray(data)?'['+k+']':'"'+k+'":');
    keySpan.style.marginRight='4px';
    if(isObj){
      let toggle=document.createElement('span');
      toggle.className='toggle';
      toggle.textContent='▼';
      toggle.setAttribute('role','button');
      toggle.setAttribute('tabindex','0');
      toggle.setAttribute('aria-label','Toggle node');
      toggle.onclick=function(){let c=li.querySelector('ul');if(c){c.style.display=c.style.display==='none'?'':'none';toggle.textContent=c.style.display==='none'?'▶':'▼';}};
      toggle.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle.click();}};
      li.appendChild(toggle);
      li.appendChild(keySpan);
      li.appendChild(buildNode(v,path+(Array.isArray(data)?'['+k+']':'.'+k),depth+1));
    }else{
      li.appendChild(keySpan);
      li.appendChild(buildNode(v,path+(Array.isArray(data)?'['+k+']':'.'+k),depth+1));
    }
    ul.appendChild(li);
  });
  div.appendChild(ul);
  return div;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
render();
</script>
</body>
</html>
