<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Snow Guard Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Snow Guard Spacing Calculator</h1>
<p>Calculate snow guard spacing and count for metal roofs from roof width and snow load. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Roof width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-psf">Snow load</label><input type="text" id="in-psf" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">psf</div></div>
<div class="field"><label class="f" for="in-cap">Guard capacity</label><input type="text" id="in-cap" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">lbf</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),pEl=document.getElementById("in-psf"),cEl=document.getElementById("in-cap"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),P=pn(pEl.value),C=pn(cEl.value);
if(W==null||P==null||C==null)return;
if(!isFinite(W)||!isFinite(P)||!isFinite(C)||W<=0||P<=0||C<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var totalLoad=W*P;
var guards=Math.ceil(totalLoad/C);
var spacing=W/guards;
var html='<div class="big">'+guards+' guards</div>';
html+=row("Total snow load",rnd(totalLoad,0)+" lbf");
html+=row("Guards needed",guards);
html+=row("Spacing",rnd(spacing,1)+" ft");
html+=row("Rows (min 2)",Math.max(2,Math.ceil(guards/3)));
out.innerHTML=html;
}
[wEl,pEl,cEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
