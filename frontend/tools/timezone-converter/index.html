<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timezone Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
label{display:block;color:#8b949e;font-size:.85em;margin:10px 0 4px}
input,select{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px;width:100%;box-sizing:border-box;font-size:14px}
button{background:#1e3a5f;color:#c9d1d9;border:1px solid #58a6ff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.9em;margin-top:12px}
button:hover{background:#264f7d}
.result{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;margin-top:14px;font-family:monospace;font-size:15px}
.note{color:#8b949e;font-size:.8em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.multi{margin-top:16px}
.multi div{padding:6px 0;border-bottom:1px solid #21262d;font-size:14px}
.multi div span{color:#8b949e;font-size:.85em;margin-left:8px}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Timezone Converter</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Convert times between timezones. 100% client-side using your browser's Intl API.</p>
<div class="grid">
<div>
<label>From Timezone</label>
<select id="fromTz" aria-label="From Tz"></select>
</div>
<div>
<label>To Timezone</label>
<select id="toTz" aria-label="To Tz"></select>
</div>
</div>
<label>Date & Time (in From timezone)</label>
<input type="datetime-local" id="dt" step="1" aria-label="Dt">
<button onclick="convert()" type="button">Convert</button>
<div class="result" id="result">—</div>
<div class="multi" id="multi"></div>
<p class="note">All processing happens in your browser.</p>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
const tzs=Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):['UTC','America/New_York','America/Los_Angeles','Europe/London','Europe/Paris','Asia/Tokyo','Asia/Shanghai','Australia/Sydney','Pacific/Auckland'];
const f=document.getElementById('fromTz'),t=document.getElementById('toTz');
tzs.forEach(z=>{f.add(new Option(z,z));t.add(new Option(z,z));});
f.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
t.value='UTC';
function nowLocal(){const d=new Date();d.setSeconds(d.getSeconds()-(d.getTimezoneOffset()*-60));return new Date(d.getTime()-(d.getTimezoneOffset()*60000)).toISOString().slice(0,19);}
document.getElementById('dt').value=nowLocal();
function convert(){
  const v=document.getElementById('dt').value;
  if(!v)return;
  const d=new Date(v);
  const fromTz=f.value,toTz=t.value;
  const fmt=(tz)=>new Intl.DateTimeFormat('en-US',{timeZone:tz,dateStyle:'full',timeStyle:'long'}).format(d);
  document.getElementById('result').textContent=fmt(toTz);
  const major=['UTC','America/New_York','America/Los_Angeles','America/Chicago','Europe/London','Europe/Paris','Europe/Berlin','Asia/Tokyo','Asia/Shanghai','Asia/Kolkata','Australia/Sydney','Pacific/Auckland'];
  document.getElementById('multi').innerHTML=major.map(z=>`<div>${fmt(z)}<span>${z}</span></div>`).join('');
}
convert();
</script>
</body>
</html>
