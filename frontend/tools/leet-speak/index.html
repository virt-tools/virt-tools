<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leet Speak Translator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Leet Speak Translator</h1>
<p class="subtitle">Convert text to leet speak (1337) and back. Choose from basic, advanced, and ultra substitution levels.</p>

<div style="max-width:600px;margin:0 auto;display:grid;gap:1rem;">
  <div>
    <label style="font-weight:bold;">Input:</label>
    <textarea id="input" rows="4" style="width:100%;font-family:monospace;font-size:.9rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" placeholder="Type text..." aria-label="Type Text..."></textarea>
  </div>
  <div style="display:flex;gap:.5rem;align-items:center;">
    <label style="font-weight:bold;">Level:</label>
    <select id="level" style="padding:.3rem;border:2px solid #ddd;border-radius:6px;" aria-label="Level">
      <option value="basic">Basic</option>
      <option value="advanced">Advanced</option>
      <option value="ultra">Ultra</option>
    </select>
    <button id="toLeet" style="padding:.6rem 1.2rem;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;" type="button">To Leet →</button>
    <button id="toText" style="padding:.6rem 1.2rem;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;" type="button">← To Text</button>
  </div>
  <div>
    <label style="font-weight:bold;">Output:</label>
    <textarea id="output" rows="4" style="width:100%;font-family:monospace;font-size:.9rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" placeholder="Leet output..." readonly aria-label="Leet Output..."></textarea>
  </div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
    <button id="copy" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Copy</button>
    <button id="clear" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Clear</button>
  </div>
  <div id="stats" style="font-size:.85rem;color:#666;"></div>
  <details style="margin-top:1rem;border:2px solid #eee;border-radius:6px;padding:.5rem 1rem;">
    <summary style="cursor:pointer;font-weight:bold;">Substitution Maps</summary>
    <div id="refTable" style="margin-top:.5rem;font-size:.85rem;"></div>
  </details>
</div>

<script src="/assets/app.js"></script>
<script>
(function(){
const BASIC={A:'4',E:'3',I:'1',O:'0',S:'5',T:'7',B:'8',G:'9'};
const ADVANCED=Object.assign({},BASIC,{
  A:'4',B:'8',C:'(',D:'|)',E:'3',F:'|=',G:'6',H:'#',I:'1',J:'_|',K:'|<',
  L:'1',M:'/\\/\\',N:'|\\|',O:'0',P:'|*',Q:'0,',R:'|2',S:'5',T:'7',U:'|_|',
  V:'\\/',W:'\\/\\/',X:'><',Y:'`/',Z:'2'
});
const ULTRA=Object.assign({},ADVANCED,{
  A:'@',B:'|3',C:'[',D:')',E:'&',F:'ph',G:'gee',H:'|-|',I:'!',
  J:'_|',K:'|<',L:'|_',M:'/V\\',N:'/\\/',O:'()',P:'|D',Q:'(,)',
  R:'|2',S:'$',T:'+]+[',U:'|_|',V:'\\/',W:'\\V/',X:'><',Y:'`/',Z:'2'});

const maps={basic:BASIC,advanced:ADVANCED,ultra:ULTRA};
const reverseMaps={};
Object.keys(maps).forEach(k=>{
  reverseMaps[k]={};
  Object.entries(maps[k]).forEach(([letter,sub])=>{
    reverseMaps[k][sub]=letter;
  });
});

const input=document.getElementById('input');
const output=document.getElementById('output');
const level=document.getElementById('level');
const stats=document.getElementById('stats');

function toLeet(text,lvl){
  const map=maps[lvl];
  return text.toUpperCase().split('').map(ch=>{
    if(ch===' ')return ' ';
    return map[ch]||ch;
  }).join('');
}
function fromLeet(text,lvl){
  const map=reverseMaps[lvl];
  let result=text;
  Object.entries(map).sort((a,b)=>b[0].length-a[0].length).forEach(([sub,letter])=>{
    result=result.split(sub).join(letter);
  });
  return result;
}

document.getElementById('toLeet').addEventListener('click',()=>{
  output.value=toLeet(input.value,level.value);
  stats.textContent='Converted '+input.value.length+' chars to '+level.value+' leet.';
});
document.getElementById('toText').addEventListener('click',()=>{
  output.value=fromLeet(input.value,level.value);
  stats.textContent='Decoded from leet.';
});
document.getElementById('copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(output.value);stats.textContent='Copied.';}
  catch(e){output.select();document.execCommand('copy');stats.textContent='Copied.';}
});
document.getElementById('clear').addEventListener('click',()=>{
  input.value='';output.value='';stats.textContent='';
});
input.addEventListener('input',()=>{
  output.value=toLeet(input.value,level.value);
});

const ref=document.getElementById('refTable');
const basicEntries=Object.entries(BASIC);
ref.innerHTML=basicEntries.map(([k,v])=>'<b>'+k+'</b>→'+v).join(' | ');
})();
</script>
</body>
</html>
