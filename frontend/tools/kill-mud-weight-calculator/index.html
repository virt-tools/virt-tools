<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Kill Mud Weight Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Kill Mud Weight Calculator</h1>
<p>Calculate kill mud weight from SIDPP, original mud weight, and well TVD using the Driller's Method formula. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sidpp">SIDPP</label><input type="text" id="in-sidpp" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-omw">Original mud weight</label><input type="text" id="in-omw" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ppg</div></div>
<div class="field"><label class="f" for="in-tvd">Well TVD</label><input type="text" id="in-tvd" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sidppE=document.getElementById("in-sidpp"),omwE=document.getElementById("in-omw"),tvdE=document.getElementById("in-tvd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var sidpp=parseFloat(sidppE.value),omw=parseFloat(omwE.value),tvd=parseFloat(tvdE.value);
if(isNaN(sidpp)||isNaN(omw)||isNaN(tvd))return;
err.textContent="";
var kmw=omw+sidpp/(0.052*tvd);
var html='<div class="big">'+Math.round(kmw*100)/100+' ppg</div>';
html+=row("Kill mud weight",Math.round(kmw*100)/100+' ppg');
html+=row("Pressure increase",Math.round(sidpp)+' psi');
html+=row("Mud weight increase",Math.round((kmw-omw)*100)/100+' ppg');
out.innerHTML=html;
}
[sidppE,omwE,tvdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
