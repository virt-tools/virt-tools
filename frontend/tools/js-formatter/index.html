<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Formatter & Beautifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>JavaScript Formatter & Beautifier</h1>
<p class="subtitle">Beautify or minify JavaScript. 100% client-side — your code never leaves the browser.</p>
<div style="display:flex;gap:.5rem;margin-top:1.5rem;flex-wrap:wrap;">
<label style="font-size:.9rem;">Indent:
<select id="indent" style="padding:.3rem;">
<option value="2">2 spaces</option>
<option value="4">4 spaces</option>
<option value="tab">Tab</option>
</select>
</label>
<button id="beautify" style="padding:.5rem 1rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;" type="button">Beautify</button>
<button id="minify" style="padding:.5rem 1rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;" type="button">Minify</button>
<button id="clear" style="padding:.5rem 1rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;" type="button">Clear</button>
<button id="copy" style="padding:.5rem 1rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;" type="button">Copy</button>
</div>
<div style="display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap;">
<div style="flex:1;min-width:300px;">
<h3 style="margin-bottom:.3rem;">Input</h3>
<textarea id="input" placeholder="Paste JavaScript here..." style="width:100%;height:400px;font-family:monospace;font-size:.85rem;padding:.8rem;border:2px solid #ddd;border-radius:8px;resize:vertical;" aria-label="Paste Java Script Here...">const foo=function(a,b){return a+b;};const bar=(x)=>{if(x>0){return x*2;}else{return -x;}};var obj={key1:"val1",key2:[1,2,3],fn:function(){return this.key1;}};</textarea>
</div>
<div style="flex:1;min-width:300px;">
<h3 style="margin-bottom:.3rem;">Output</h3>
<textarea id="output" readonly style="width:100%;height:400px;font-family:monospace;font-size:.85rem;padding:.8rem;border:2px solid #ddd;border-radius:8px;resize:vertical;background:#f9f9f9;" aria-label="Output"></textarea>
</div>
</div>
<div id="stats" style="margin-top:.5rem;font-size:.85rem;color:#666;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const output=document.getElementById('output');
const stats=document.getElementById('stats');
const indentSel=document.getElementById('indent');

function getIndent(){
  const v = indentSel.value;
  return v === 'tab' ? '\t' : ' '.repeat(parseInt(v));
}

function beautify(code){
  let result = '';
  let depth = 0;
  let inString = false;
  let stringChar = '';
  let inComment = false;
  let inLineComment = false;
  let i = 0;
  const ind = getIndent();

  function addNewline(){
    result += '\n' + ind.repeat(depth);
  }

  while(i < code.length){
    const ch = code[i];
    const next = code[i+1];

    if(inLineComment){
      result += ch;
      if(ch === '\n'){ inLineComment = false; }
      i++;
      continue;
    }
    if(inComment){
      result += ch;
      if(ch === '*' && next === '/'){ result += '/'; inComment = false; i += 2; continue; }
      i++;
      continue;
    }
    if(inString){
      result += ch;
      if(ch === '\\'){ result += next || ''; i += 2; continue; }
      if(ch === stringChar){ inString = false; }
      i++;
      continue;
    }

    if(ch === '/' && next === '/'){ inLineComment = true; result += ch; i++; continue; }
    if(ch === '/' && next === '*'){ inComment = true; result += ch+next; i += 2; continue; }
    if(ch === '"' || ch === "'" || ch === '`'){ inString = true; stringChar = ch; result += ch; i++; continue; }

    if(ch === '{'){
      result += ch;
      if(code[i+1] !== '}'){
        depth++;
        addNewline();
      }
      i++;
      continue;
    }
    if(ch === '}'){
      depth = Math.max(0, depth - 1);
      result = result.replace(/\s*$/, '');
      if(result.endsWith('\n' + ind.repeat(depth))){
        result += ch;
      } else {
        addNewline();
        result += ch;
      }
      if(code[i+1] !== ';' && code[i+1] !== ',' && code[i+1] !== ')' && code[i+1] !== '}' && code[i+1] !== '\n' && code[i+1] !== undefined){
        addNewline();
      }
      i++;
      continue;
    }
    if(ch === ';'){
      result += ch;
      if(code[i+1] !== '}' && code[i+1] !== '\n' && code[i+1] !== undefined){
        addNewline();
      }
      i++;
      continue;
    }

    result += ch;
    i++;
  }

  return result.replace(/\n\s*\n/g, '\n').trim();
}

function minify(code){
  let result = '';
  let inString = false;
  let stringChar = '';
  let inComment = false;
  let inLineComment = false;
  let i = 0;
  while(i < code.length){
    const ch = code[i];
    const next = code[i+1];
    if(inLineComment){ if(ch === '\n'){ inLineComment = false; } i++; continue; }
    if(inComment){ if(ch === '*' && next === '/'){ inComment = false; i += 2; continue; } i++; continue; }
    if(inString){ result += ch; if(ch === '\\'){ result += next || ''; i += 2; continue; } if(ch === stringChar){ inString = false; } i++; continue; }
    if(ch === '/' && next === '/'){ inLineComment = true; i += 2; continue; }
    if(ch === '/' && next === '*'){ inComment = true; i += 2; continue; }
    if(ch === '"' || ch === "'" || ch === '`'){ inString = true; stringChar = ch; result += ch; i++; continue; }
    if(ch === ' ' || ch === '\t' || ch === '\n' || ch === '\r'){ i++; continue; }
    result += ch; i++;
  }
  return result;
}

document.getElementById('beautify').onclick = function(){
  try {
    output.value = beautify(input.value);
    const before = input.value.length, after = output.value.length;
    stats.textContent = 'Beautified: ' + before + ' → ' + after + ' bytes';
  } catch(e){ stats.textContent = 'Error: ' + e.message; }
};
document.getElementById('minify').onclick = function(){
  try {
    output.value = minify(input.value);
    const before = input.value.length, after = output.value.length;
    stats.textContent = 'Minified: ' + before + ' → ' + after + ' bytes (' + Math.round((1 - after/before) * 100) + '% smaller)';
  } catch(e){ stats.textContent = 'Error: ' + e.message; }
};
document.getElementById('clear').onclick = function(){ input.value=''; output.value=''; stats.textContent=''; };
document.getElementById('copy').onclick = function(){
  if(output.value){ navigator.clipboard.writeText(output.value).catch(()=>{}); }
};
})();
</script>
</body>
</html>
