<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to Data URI — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image to Data URI</h1>
<p class="subtitle">Convert any image file to a CSS-ready data URI for inline embedding. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div class="output-section">
<label>Data URI: <textarea id="result" rows="4" readonly placeholder="Upload an image..."></textarea></label>
<button id="copy" class="primary-btn" type="button">Copy</button>
<button id="css" class="btn" type="button">Copy CSS background</button>
</div>
<div style="margin-top:10px">
<img id="preview" style="max-width:300px;display:none">
</div>
<script>
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){
document.getElementById('result').value=r.result;
var p=document.getElementById('preview');p.src=r.result;p.style.display='block';
};r.readAsDataURL(f);
});
document.getElementById('copy').addEventListener('click',function(){
var r=document.getElementById('result');r.select();document.execCommand('copy');
});
document.getElementById('css').addEventListener('click',function(){
var r=document.getElementById('result');
var css='background-image: url('+r.value+');';
navigator.clipboard.writeText(css).then(function(){alert('CSS copied!');});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
