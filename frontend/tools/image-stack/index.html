<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Stack & Blend — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Stack &amp; Blend</h1>
<p class="subtitle">Stack two images with adjustable blend mode and opacity. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Base Image: <input type="file" id="base" accept="image/*"></label>
<label>Overlay: <input type="file" id="overlay" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Blend: <select id="blend">
<option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option>
<option value="overlay">Overlay</option><option value="darken">Darken</option><option value="lighten">Lighten</option>
<option value="color-dodge">Dodge</option><option value="color-burn">Burn</option><option value="hard-light">Hard Light</option>
<option value="soft-light">Soft Light</option><option value="difference">Difference</option><option value="exclusion">Exclusion</option>
</select></label>
<label>Opacity: <input type="range" id="op" min="0" max="1" step="0.05" value="1" oninput="document.getElementById('opl').textContent=this.value"></label>
<span id="opl">1</span>
<button onclick="render()" type="button">Apply</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var b,o;
document.getElementById('base').addEventListener('change',function(){b=new Image();b.src=URL.createObjectURL(this.files[0]);b.onload=render;});
document.getElementById('overlay').addEventListener('change',function(){o=new Image();o.src=URL.createObjectURL(this.files[0]);o.onload=render;});
function render(){
if(!b)return;var cv=document.getElementById('canvas');cv.width=b.naturalWidth;cv.height=b.naturalHeight;
var ctx=cv.getContext('2d');ctx.globalCompositeOperation='source-over';ctx.drawImage(b,0,0);
if(o){ctx.globalCompositeOperation=document.getElementById('blend').value;ctx.globalAlpha=parseFloat(document.getElementById('op').value);ctx.drawImage(o,0,0,b.naturalWidth,b.naturalHeight);}
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='blended.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
