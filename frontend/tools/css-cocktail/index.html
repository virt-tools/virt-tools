<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Cocktail Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🍹 CSS Cocktail Generator</h1>
<p>Create CSS cocktail glass with liquid, garnish, straw. 3 glass types. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Glass</label><select id="glass" aria-label="Glass"><option value="martini">Martini</option><option value="hurricane">Hurricane</option><option value="highball">Highball</option></select></div>
<div class="ctrl-row"><label>Liquid Color</label><input type="color" id="liquidColor" value="#ff6b9d" style="width:60px;height:36px" aria-label="Liquid Color"></div>
<div class="ctrl-row"><label>Fill %</label><input type="range" id="fill" min="20" max="95" value="80" style="width:200px" aria-label="Fill"></div>
<div class="ctrl-row"><label>Garnish</label><select id="garnish" aria-label="Garnish"><option value="none">None</option><option value="cherry">Cherry</option><option value="lime">Lime</option><option value="olive">Olive</option></select></div>
<div class="ctrl-row"><label>Straw</label><select id="straw" aria-label="Straw"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var glass=document.getElementById('glass').value;
var lc=document.getElementById('liquidColor').value;
var fill=parseInt(document.getElementById('fill').value);
var garnish=document.getElementById('garnish').value;
var straw=document.getElementById('straw').value;
var html='<div class="cocktail">\n  <div class="glass g-'+glass+'"><div class="liquid" style="height:'+fill+'%"></div>';
if(straw==='yes')html+='<div class="straw"></div>';
if(garnish!=='none')html+='<div class="garnish gar-'+garnish+'"></div>';
html+='</div>\n  <div class="stem"></div>\n  <div class="base"></div>\n</div>';
var css='.cocktail{display:flex;flex-direction:column;align-items:center}\n';
if(glass==='martini'){
  css+='.glass.g-martini{width:140px;height:80px;clip-path:polygon(0 0,100% 0,50% 100%);position:relative;overflow:hidden;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2)}\n';
}else if(glass==='hurricane'){
  css+='.glass.g-hurricane{width:120px;height:140px;border-radius:50% 50% 30% 30%;position:relative;overflow:hidden;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2)}\n';
}else{
  css+='.glass.g-highball{width:80px;height:140px;border-radius:8px 8px 4px 4px;position:relative;overflow:hidden;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2)}\n';
}
css+='.liquid{position:absolute;bottom:0;left:0;width:100%;background:'+lc+';opacity:0.85}\n';
css+='.stem{width:8px;height:50px;background:rgba(255,255,255,0.15)}\n';
css+='.base{width:100px;height:8px;background:rgba(255,255,255,0.15);border-radius:50%}\n';
if(straw==='yes')css+='.straw{position:absolute;top:-20px;right:20px;width:6px;height:120px;background:#e44;transform:rotate(15deg);z-index:3}\n';
if(garnish==='cherry')css+='.gar-cherry{position:absolute;top:5px;left:50%;width:16px;height:16px;background:#e22;border-radius:50%;transform:translateX(-50%);z-index:2}\n';
if(garnish==='lime')css+='.gar-lime{position:absolute;top:-8px;right:10px;width:24px;height:24px;background:#4c4;border-radius:50%;z-index:2}\n';
if(garnish==='olive')css+='.gar-olive{position:absolute;top:10px;left:50%;width:14px;height:14px;background:#3a5;border-radius:50%;transform:translateX(-50%);z-index:2}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['glass','liquidColor','fill','garnish','straw'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
