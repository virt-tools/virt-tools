<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Material Storage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Material Storage Calculator</h1>
<p>Calculate the storage area needed for construction materials based on volume and stacking height. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">Material volume</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">cubic feet</div></div>
<div class="field"><label class="f" for="in-h">Stack height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">feet</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vEl=document.getElementById("in-v"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(vEl.value),H=pn(hEl.value);
if(V==null||H==null)return;
if(!isFinite(V)||V<=0||!isFinite(H)||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=V/H;
var aisleArea=area*0.3;
var total=area+aisleArea;
var html='<div class="big">'+rnd(total,0)+' sq ft</div>';
html+=row("Storage area",rnd(area,0)+' sq ft');
html+=row("Aisle area (30%)",rnd(aisleArea,0)+' sq ft');
html+=row("Total area",rnd(total,0)+' sq ft');
html+=row("Stack height",rnd(H,1)+' ft');
out.innerHTML=html;
}
[vEl,hEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
