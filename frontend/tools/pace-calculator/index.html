<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Pace Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Running Pace Calculator</h1>
<p class="subtitle">Calculate pace, time, or distance — fill in any two.</p>

<div class="input-section">
  <label>Distance</label>
  <div style="display:flex;gap:8px;">
    <input type="number" id="distance" value="5" step="0.01" style="flex:1;" aria-label="Distance">
    <select id="distUnit" aria-label="Dist Unit"><option value="km">km</option><option value="mi">miles</option><option value="m">meters</option></select>
  </div>

  <label>Time (hh:mm:ss)</label>
  <div style="display:flex;gap:4px;">
    <input type="number" id="hh" value="0" min="0" style="flex:1;" placeholder="hh" aria-label="Hh">
    <input type="number" id="mm" value="25" min="0" max="59" style="flex:1;" placeholder="mm" aria-label="Mm">
    <input type="number" id="ss" value="0" min="0" max="59" style="flex:1;" placeholder="ss" aria-label="Ss">
  </div>

  <label>Pace (mm:ss per km/mi)</label>
  <div style="display:flex;gap:4px;">
    <input type="number" id="paceM" value="5" min="0" style="flex:1;" placeholder="min" aria-label="Min">
    <input type="number" id="paceS" value="0" min="0" max="59" style="flex:1;" placeholder="sec" aria-label="Sec">
  </div>

  <button id="calcPace" class="primary-btn" type="button">Calculate Pace</button>
  <button id="calcTime" class="primary-btn" type="button">Calculate Time</button>
  <button id="calcDist" class="primary-btn" type="button">Calculate Distance</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<style>
.big-result { font-size:1.5em; font-weight:bold; color:var(--accent); text-align:center; padding:12px; }
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  function getDist() {
    const d = parseFloat(document.getElementById('distance').value) || 0;
    const u = document.getElementById('distUnit').value;
    if (u === 'mi') return d * 1.60934;
    if (u === 'm') return d / 1000;
    return d;
  }
  function getTotalSec() {
    const h = parseInt(document.getElementById('hh').value) || 0;
    const m = parseInt(document.getElementById('mm').value) || 0;
    const s = parseInt(document.getElementById('ss').value) || 0;
    return h * 3600 + m * 60 + s;
  }
  function getPaceSec() {
    const m = parseInt(document.getElementById('paceM').value) || 0;
    const s = parseInt(document.getElementById('paceS').value) || 0;
    return m * 60 + s;
  }
  function fmtTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.round(sec % 60);
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }

  document.getElementById('calcPace').addEventListener('click', () => {
    const d = getDist(); const t = getTotalSec();
    if (d <= 0 || t <= 0) return;
    const paceSec = t / d;
    const pm = Math.floor(paceSec / 60); const ps = Math.round(paceSec % 60);
    document.getElementById('bigResult').textContent = `Pace: ${pm}:${String(ps).padStart(2,'0')} /km`;
    document.getElementById('extras').innerHTML = `<div class="result-row"><span>Speed:</span><span>${(d / (t/3600)).toFixed(1)} km/h</span></div>`;
    document.getElementById('result').style.display = 'block';
  });

  document.getElementById('calcTime').addEventListener('click', () => {
    const d = getDist(); const p = getPaceSec();
    if (d <= 0 || p <= 0) return;
    const totalSec = d * p;
    document.getElementById('bigResult').textContent = `Time: ${fmtTime(totalSec)}`;
    document.getElementById('extras').innerHTML = `<div class="result-row"><span>Speed:</span><span>${(d / (totalSec/3600)).toFixed(1)} km/h</span></div>`;
    document.getElementById('result').style.display = 'block';
  });

  document.getElementById('calcDist').addEventListener('click', () => {
    const t = getTotalSec(); const p = getPaceSec();
    if (t <= 0 || p <= 0) return;
    const d = t / p;
    const u = document.getElementById('distUnit').value;
    let disp = d;
    if (u === 'mi') disp = d / 1.60934;
    if (u === 'm') disp = d * 1000;
    document.getElementById('bigResult').textContent = `Distance: ${disp.toFixed(2)} ${u}`;
    document.getElementById('extras').innerHTML = `<div class="result-row"><span>Speed:</span><span>${(d / (t/3600)).toFixed(1)} km/h</span></div>`;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
