<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Optimizer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>SVG Optimizer</h1>
<p class="subtitle">Clean and optimize SVG markup by removing comments, metadata, and redundant attributes. 100% client-side.</p>
<div class="input-section">
<label>Paste SVG: <textarea id="input" rows="8" placeholder="<svg>...</svg>"></textarea></label>
</div>
<button id="optimize" class="primary-btn" type="button">Optimize</button>
<div class="output-section">
<label>Optimized SVG: <textarea id="output" rows="8" readonly></textarea></label>
<button id="copy" class="btn" type="button">Copy</button>
</div>
<div id="stats" style="margin-top:10px;color:#aaa"></div>
<script>
document.getElementById('optimize').addEventListener('click',function(){
var s=document.getElementById('input').value;
var orig=s.length;
s=s.replace(/<!--[\s\S]*?-->/g,'');
s=s.replace(/<\?xml[^>]*\?>/g,'');
s=s.replace(/<!DOCTYPE[^>]*>/g,'');
s=s.replace(/\s+xmlns:[a-z]+="[^"]*"/g,function(m){return m;});
s=s.replace(/\s+id="([^"]*)"/g,function(m,id){
if(s.indexOf('url(#'+id+')')===-1&&s.indexOf('"#'+id+'"')===-1)return'';
return m;
});
s=s.replace(/\s+/g,' ');
s=s.replace(/>\s+</g,'><');
s=s.replace(/\s+\/>/g,'/>');
s=s.trim();
var opt=s.length;
document.getElementById('output').value=s;
document.getElementById('stats').textContent='Original: '+orig+' bytes | Optimized: '+opt+' bytes | Saved: '+(orig-opt)+' ('+((1-opt/orig)*100).toFixed(1)+'%)';
});
document.getElementById('copy').addEventListener('click',function(){
var t=document.getElementById('output');t.select();document.execCommand('copy');
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
