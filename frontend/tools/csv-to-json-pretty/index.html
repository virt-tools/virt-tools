<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to JSON (Pretty) — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to JSON (Pretty Print)</h1>
<p class="subtitle">Convert CSV to beautifully formatted JSON with 2-space indentation and type inference.</p>
<div class="input-section">
<label>CSV Input</label>
<textarea id="input" rows="8" placeholder="name,age,active&#10;Alice,30,true" aria-label="Name,Age,Active&#10;Alice,30,True"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function inferType(v){
if(v==='')return null;
if(!isNaN(v)&&v.trim()!=='')return Number(v);
if(v==='true')return true;
if(v==='false')return false;
return v;
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);
const headers=rows[0];
const json=rows.slice(1).map(r=>{
const o={};headers.forEach((h,i)=>o[h]=inferType(r[i]||''));return o;
});
const r=document.getElementById('result');
r.innerHTML='<textarea rows="10" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+JSON.stringify(json,null,2)+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
