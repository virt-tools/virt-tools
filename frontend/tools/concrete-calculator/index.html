<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concrete Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Concrete Calculator</h1>
<p class="subtitle">Estimate cubic yards of concrete and bags needed for slabs, footings, or columns.</p>

<div class="input-section">
  <label>Project type</label>
  <select id="type" aria-label="Type">
    <option value="slab">Slab</option>
    <option value="round">Round Column</option>
    <option value="wall">Wall</option>
  </select>
  <div id="slabFields">
    <label>Length (ft)</label>
    <input type="number" id="length" value="10" min="0" step="0.5" aria-label="Length">
    <label>Width (ft)</label>
    <input type="number" id="width" value="10" min="0" step="0.5" aria-label="Width">
  </div>
  <div id="roundFields" style="display:none;">
    <label>Diameter (in)</label>
    <input type="number" id="diameter" value="12" min="1" aria-label="Diameter">
  </div>
  <label>Depth/Thickness (in)</label>
  <input type="number" id="depth" value="4" min="1" aria-label="Depth">
  <label>Bag size</label>
  <select id="bagSize" aria-label="Bag Size">
    <option value="0.6">60 lb (0.45 cu ft)</option>
    <option value="0.45">80 lb (0.6 cu ft)</option>
  </select>
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const typeSel = document.getElementById('type');
  const slabFields = document.getElementById('slabFields');
  const roundFields = document.getElementById('roundFields');
  typeSel.addEventListener('change', () => {
    slabFields.style.display = typeSel.value === 'round' ? 'none' : 'block';
    roundFields.style.display = typeSel.value === 'round' ? 'block' : 'none';
  });

  document.getElementById('calc').addEventListener('click', () => {
    const depth = parseFloat(document.getElementById('depth').value) || 0;
    const bagVol = parseFloat(document.getElementById('bagSize').value);
    let area = 0, label = '';
    if (typeSel.value === 'round') {
      const dia = parseFloat(document.getElementById('diameter').value) || 0;
      area = Math.PI * (dia/2)**2 / 144;
      label = `Round column Ø${dia}"`;
    } else {
      const l = parseFloat(document.getElementById('length').value) || 0;
      const w = parseFloat(document.getElementById('width').value) || 0;
      area = l * w;
      label = `${l} × ${w} ft`;
    }
    const volCuFt = area * (depth / 12);
    const volCuYd = volCuFt / 27;
    const bags = Math.ceil(volCuFt / bagVol);
    document.getElementById('bigResult').textContent = `${volCuYd.toFixed(2)} cu yd`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Project:</span><span>${label}, ${depth}" thick</span></div>
      <div class="result-row"><span>Volume:</span><span>${volCuFt.toFixed(1)} cu ft</span></div>
      <div class="result-row"><span>In cubic yards:</span><span>${volCuYd.toFixed(2)} cu yd</span></div>
      <div class="result-row"><span>Bags needed:</span><span>${bags} (${bagVol > 0.5 ? '60 lb' : '80 lb'})</span></div>
      <div class="result-row"><span>Tip:</span><span>Order ${Math.ceil(volCuYd * 1.1 * 100)/100} cu yd (+10% margin)</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
