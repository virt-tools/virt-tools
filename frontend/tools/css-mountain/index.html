<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mountain Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏔️ CSS Mountain Generator</h1>
<p>Create CSS mountain landscape with snow caps, sun, and optional reflection. 4 scene types. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Scene</label><select id="scene"><option value="day">Day</option><option value="sunset">Sunset</option><option value="night">Night</option><option value="winter">Winter</option></select></div>
<div class="ctrl-row"><label>Mountain Color</label><input type="color" id="mtnColor" value="#5d6d7e" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Snow Cap</label><select id="snow"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Width</label><input type="range" id="width" min="200" max="600" value="400" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var sc=document.getElementById('scene').value;
var mc=document.getElementById('mtnColor').value;
var sn=document.getElementById('snow').value;
var w=parseInt(document.getElementById('width').value);
var h=w*0.4;
var bg={'day':'linear-gradient(180deg,#87ceeb 0%,#b0e0e6 60%,#98d98e 100%)','sunset':'linear-gradient(180deg,#ff7e5f 0%,#feb47b 40%,#ff8c42 100%)','night':'linear-gradient(180deg,#0a0a2a 0%,#1a1a4a 50%,#16213e 100%)','winter':'linear-gradient(180deg,#c9e4ec 0%,#e8f4f8 60%,#d4e6e9 100%)'}[sc];
var sunColor={'day':'#fff9c4','sunset':'#ff6b35','night':'#f4f4dc','winter':'#e8f4f8'}[sc];
var html='<div class="landscape s-'+sc+'">\n  <div class="sun"></div>\n  <div class="mountain m1"></div>\n  <div class="mountain m2"></div>\n  <div class="mountain m3"></div>\n</div>';
var css='.landscape{position:relative;width:'+w+'px;height:'+h+'px;background:'+bg+';overflow:hidden;border-radius:8px}\n';
css+='.sun{position:absolute;top:10%;right:10%;width:50px;height:50px;background:'+sunColor+';border-radius:50%;box-shadow:0 0 40px '+sunColor+'}\n';
css+='.mountain{position:absolute;bottom:0;clip-path:polygon(0 100%,50% 0,100% 100%);background:'+mc+'}\n';
css+='.m1{width:'+w*0.6+'px;height:'+(h*0.7)+'px;left:-5%;z-index:3}\n';
css+='.m2{width:'+w*0.5+'px;height:'+(h*0.55)+'px;left:25%;z-index:2;background:'+(sc==='night'?'#3a4a6a':mc)+';opacity:0.85}\n';
css+='.m3{width:'+w*0.45+'px;height:'+(h*0.45)+'px;left:55%;z-index:1;background:'+(sc==='night'?'#2a3a5a':mc)+';opacity:0.7}\n';
if(sn==='yes'){
css+='.m1::before,.m2::before{content:"";position:absolute;top:0;left:0;right:0;height:35%;clip-path:polygon(20% 100%,50% 0,80% 100%,70% 80%,50% 20%,30% 80%,20% 100%);background:#fff}\n';
}
if(sc==='night'){
css+='.sun{box-shadow:0 0 60px '+sunColor+',0 0 100px '+sunColor+'}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['scene','mtnColor','snow','width'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
