<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Force Converter</h1>
<p class="subtitle">Convert between Newtons, pounds-force, kilograms-force, dynes, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Newton (N)</option>
<option value="0.001">Millinewton (mN)</option>
<option value="0.000001">Micronewton (µN)</option>
<option value="1000">Kilonewton (kN)</option>
<option value="1000000">Meganewton (MN)</option>
<option value="4.44822162">Pound-force (lbf)</option>
<option value="4.44822162">Poundal (pdl)</option>
<option value="9.80665">Kilogram-force (kgf)</option>
<option value="0.01">Dyne (dyn)</option>
<option value="0.00980665">Gram-force (gf)</option>
<option value="8896.44323">Kip (kip)</option>
<option value="0.13825495">Ounce-force (ozf)</option>
<option value="0.00980665">Pond (p)</option>
<option value="1e-8">Tonne-force (tf)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Newton (N)',1],['Kilonewton (kN)',1000],['Meganewton (MN)',1e6],['Millinewton (mN)',0.001],['Micronewton (µN)',1e-6],['Pound-force (lbf)',4.44822162],['Poundal (pdl)',0.138255],['Kilogram-force (kgf)',9.80665],['Dyne (dyn)',1e-5],['Gram-force (gf)',0.00980665],['Kip (kip)',4448.22162],['Ounce-force (ozf)',0.27801385],['Pond (p)',0.00980665],['Tonne-force (tf)',9806.65]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const n=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=n/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
