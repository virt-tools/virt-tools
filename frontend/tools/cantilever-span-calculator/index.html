<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cantilever Span Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cantilever Span Calculator</h1>
<p>Calculate maximum cantilever length and deflection for a given beam, load, and material. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Uniform load</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">kN/m</div></div>
<div class="field"><label class="f" for="in-d">Beam depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-e">Modulus E</label><input type="text" id="in-e" inputmode="decimal" autocomplete="off" placeholder="e.g. 11000"><div class="unit">MPa</div></div>
<div class="field"><label class="f" for="in-i">Moment I</label><input type="text" id="in-i" inputmode="decimal" autocomplete="off" placeholder="e.g. 80"><div class="unit">×10⁶ mm⁴</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter uniform load.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),eEl=document.getElementById("in-e"),iEl=document.getElementById("in-i"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),D=pn(dEl.value),E=pn(eEl.value),I=pn(iEl.value);
if(W==null){return}
D=D==null?200:D;E=E==null?11000:E;I=I==null?80:I;
if(!isFinite(W)||!isFinite(D)||W<=0||D<=0||E<=0||I<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var maxLen=Math.sqrt(D*0.0015/W);
var defl=W*1000*Math.pow(maxLen*1000,4)/(8*E*I*1e6)/1000;
var moment=W*maxLen*maxLen/2;
var html='<div class="big">'+rnd(maxLen,2)+' m</div>';
html+=row("Uniform load",rnd(W,2)+" kN/m");
html+=row("Beam depth",rnd(D,0)+" mm");
html+=row("Max cantilever",rnd(maxLen,2)+" m");
html+=row("Max moment",rnd(moment,2)+" kN·m");
html+=row("Max deflection",rnd(defl,2)+" mm");
out.innerHTML=html;
}
[wEl,dEl,eEl,iEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
