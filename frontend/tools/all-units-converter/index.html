<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-in-One Unit Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>All-in-One Unit Converter</h1>
<p class="subtitle">Convert between length, mass, temperature, volume, area, speed, data, time, energy, pressure, and angle units.</p>
<div style="margin-bottom:1rem;">
<label>Category <select id="category"></select></label>
</div>
<div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem;">
<div>
<label>From</label><br>
<input type="number" id="value" value="1" style="font-size:1.1rem;padding:.5rem;width:150px;" aria-label="Value">
<select id="fromUnit" style="font-size:1rem;padding:.5rem;" aria-label="From Unit"></select>
</div>
<div style="font-size:1.5rem;padding:0 .5rem;">→</div>
<div>
<label>To</label><br>
<input type="text" id="result" readonly style="font-size:1.1rem;padding:.5rem;width:200px;background:#f0f8ff;" aria-label="Result">
<select id="toUnit" style="font-size:1rem;padding:.5rem;" aria-label="To Unit"></select>
</div>
</div>
<div id="formula" style="color:#666;font-style:italic;"></div>
<div style="margin-top:1rem;">
<button class="btn" id="swap" type="button">Swap Units</button>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const categories = {
  length: {
    name: 'Length', base: 'm',
    units: {
      mm: 0.001, cm: 0.01, m: 1, km: 1000,
      'in': 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344,
      'nmi': 1852, ly: 9.461e15
    }
  },
  mass: {
    name: 'Mass', base: 'kg',
    units: {
      mg: 1e-6, g: 0.001, kg: 1, t: 1000,
      oz: 0.0283495, lb: 0.453592, st: 6.35029, ton: 907.185
    }
  },
  temperature: {
    name: 'Temperature', base: 'C', custom: true,
    units: { C: 'Celsius', F: 'Fahrenheit', K: 'Kelvin', R: 'Rankine' }
  },
  volume: {
    name: 'Volume', base: 'L',
    units: {
      mL: 0.001, L: 1, 'm³': 1000, gal: 3.78541,
      qt: 0.946353, pt: 0.473176, cup: 0.236588,
      fl_oz: 0.0295735, tbsp: 0.0147868, tsp: 0.00492892
    }
  },
  area: {
    name: 'Area', base: 'm²',
    units: {
      'mm²': 0.000001, 'cm²': 0.0001, 'm²': 1, 'km²': 1000000,
      ha: 10000, 'in²': 0.00064516, 'ft²': 0.092903, 'ac': 4046.86, 'mi²': 2589988.5
    }
  },
  speed: {
    name: 'Speed', base: 'm/s',
    units: {
      'm/s': 1, 'km/h': 0.277778, 'mph': 0.44704,
      'ft/s': 0.3048, 'knot': 0.514444, 'Mach': 343
    }
  },
  data: {
    name: 'Data Size', base: 'B',
    units: {
      bit: 0.125, B: 1, KB: 1024, MB: 1048576,
      GB: 1073741824, TB: 1.0995116e12, PB: 1.1258999e15
    }
  },
  time: {
    name: 'Time', base: 's',
    units: {
      ms: 0.001, s: 1, min: 60, h: 3600, day: 86400,
      week: 604800, month: 2629800, year: 31557600
    }
  },
  energy: {
    name: 'Energy', base: 'J',
    units: {
      J: 1, kJ: 1000, cal: 4.184, kcal: 4184,
      Wh: 3600, kWh: 3600000, BTU: 1055.06, eV: 1.602e-19
    }
  },
  pressure: {
    name: 'Pressure', base: 'Pa',
    units: {
      Pa: 1, kPa: 1000, MPa: 1000000, bar: 100000,
      atm: 101325, psi: 6894.76, torr: 133.322
    }
  },
  angle: {
    name: 'Angle', base: 'deg',
    units: {
      deg: 1, rad: 57.2957795, grad: 0.9, turn: 360,
      arcmin: 0.0166667, arcsec: 0.000277778
    }
  }
};
const catEl = document.getElementById('category');
const fromEl = document.getElementById('fromUnit');
const toEl = document.getElementById('toUnit');
const valEl = document.getElementById('value');
const resEl = document.getElementById('result');
const formulaEl = document.getElementById('formula');
for (const key of Object.keys(categories)) {
  const opt = document.createElement('option');
  opt.value = key; opt.textContent = categories[key].name;
  catEl.appendChild(opt);
}
function populateUnits() {
  const cat = categories[catEl.value];
  fromEl.innerHTML = '';
  toEl.innerHTML = '';
  for (const u of Object.keys(cat.units)) {
    fromEl.appendChild(new Option(u, u));
    toEl.appendChild(new Option(u, u));
  }
  if (toEl.options.length > 1) toEl.selectedIndex = 1;
}
function convert() {
  const cat = categories[catEl.value];
  const val = parseFloat(valEl.value);
  if (isNaN(val)) { resEl.value = ''; return; }
  const from = fromEl.value, to = toEl.value;
  let result;
  if (cat.custom && catEl.value === 'temperature') {
    result = convertTemp(val, from, to);
  } else {
    const baseVal = val * cat.units[from];
    result = baseVal / cat.units[to];
  }
  const display = Math.abs(result) < 0.0001 && result !== 0
    ? result.toExponential(6)
    : parseFloat(result.toPrecision(8));
  resEl.value = display;
  formulaEl.textContent = val + ' ' + from + ' = ' + display + ' ' + to;
}
function convertTemp(val, from, to) {
  let c;
  if (from === 'C') c = val;
  else if (from === 'F') c = (val - 32) * 5/9;
  else if (from === 'K') c = val - 273.15;
  else if (from === 'R') c = (val - 491.67) * 5/9;
  if (to === 'C') return c;
  if (to === 'F') return c * 9/5 + 32;
  if (to === 'K') return c + 273.15;
  if (to === 'R') return (c + 273.15) * 9/5;
}
catEl.addEventListener('change', populateUnits);
fromEl.addEventListener('change', convert);
toEl.addEventListener('change', convert);
valEl.addEventListener('input', convert);
document.getElementById('swap').onclick = () => {
  const f = fromEl.value; fromEl.value = toEl.value; toEl.value = f;
  convert();
};
populateUnits();
convert();
})();
</script>
<style>
.btn{padding:.5rem 1rem;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-weight:600;}
.btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
select{border:1px solid #ddd;border-radius:8px;}
</style>
</body>
</html>
