<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Corner Rounder — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Corner Rounder</h1>
<p class="subtitle">Round or circle-crop image corners with adjustable radius. Download as PNG with transparency. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Radius: <input type="number" id="rad" value="50" min="0" max="500" style="width:70px">px</label>
<button onclick="render()" type="button">Apply</button>
<button onclick="circle()" type="button">Circle</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){img=new Image();img.src=URL.createObjectURL(this.files[0]);img.onload=render;});
function render(){
if(!img)return;var r=parseInt(document.getElementById('rad').value);
var cv=document.getElementById('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;
var ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
ctx.save();ctx.beginPath();ctx.roundRect(0,0,cv.width,cv.height,r);ctx.clip();ctx.drawImage(img,0,0);ctx.restore();
}
function circle(){
if(!img)return;var s=Math.min(img.naturalWidth,img.naturalHeight);
var cv=document.getElementById('canvas');cv.width=s;cv.height=s;
var ctx=cv.getContext('2d');ctx.clearRect(0,0,s,s);
ctx.save();ctx.beginPath();ctx.arc(s/2,s/2,s/2,0,Math.PI*2);ctx.clip();
ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,s,s);ctx.restore();
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='rounded.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
