<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency & Wavelength Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Frequency & Wavelength Calculator</h1>
<p class="subtitle">Convert between frequency, wavelength, period, and energy for electromagnetic waves.</p>
<div class="input-section">
<label>Enter any one value:</label>
<label>Frequency</label>
<input type="number" id="freq" value="100" min="0" step="any" aria-label="Freq">
<select id="freqUnit" aria-label="Freq Unit">
<option value="1" selected>Hz</option>
<option value="1000">kHz</option>
<option value="1000000">MHz</option>
<option value="1000000000">GHz</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const c=299792458;
const h=6.626e-34;
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const f=parseFloat(document.getElementById('freq').value)||0;
const u=parseFloat(document.getElementById('freqUnit').value);
const freqHz=f*u;
const wavelength=c/freqHz;
const period=1/freqHz;
const energy=h*freqHz;
const energyEV=energy/1.602e-19;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Frequency:</span><span>${(freqHz).toExponential(3)} Hz</span></div>
<div class="result-row"><span>Wavelength:</span><span>${(wavelength).toExponential(3)} m (${(wavelength*100).toExponential(3)} cm)</span></div>
<div class="result-row"><span>Period:</span><span>${(period).toExponential(3)} s</span></div>
<div class="result-row"><span>Photon Energy:</span><span>${(energy).toExponential(3)} J (${energyEV.toExponential(3)} eV)</span></div>
<div class="result-row"><span>Wavenumber:</span><span>${(2*Math.PI/wavelength).toExponential(3)} rad/m</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
