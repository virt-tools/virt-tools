<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degrees Celsius to Degrees Fahrenheit Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Degrees Celsius to Degrees Fahrenheit Converter</h1>
<p class="subtitle">Convert Degrees Celsius and Degrees Fahrenheit in either direction. Calculations run locally in your browser.</p>
<div class="input-section">
<label for="conversion-value">Value in <span id="conversion-from-label"></span></label>
<input id="conversion-value" type="number" value="1" step="any" inputmode="decimal">
<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">
<button id="conversion-swap" type="button" class="primary-btn">Swap direction</button>
<button id="conversion-copy" type="button">Copy result</button>
</div>
</div>
<section class="result-section" aria-live="polite">
<div class="result-row"><span id="conversion-to-label"></span><strong id="conversion-result"></strong></div>
<p id="conversion-equation"></p>
</section>
<script id="conversion-config" type="application/json">{"from":{"slug":"celsius","name":"Degrees Celsius","symbol":"°C","scale":1,"offset":273.15},"to":{"slug":"fahrenheit","name":"Degrees Fahrenheit","symbol":"°F","scale":0.5555555555555556,"offset":255.3722222222222}}</script>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/conversion-tool.js"></script>
</body>
</html>
