<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clothing Size Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Clothing Size Converter</h1>
<p class="subtitle">Convert between US, UK, EU, and international clothing sizes.</p>
<div class="input-section">
<label>Category</label>
<select id="category" aria-label="Category">
<option value="dress" selected>Women's Dress</option>
<option value="mens-suit">Men's Suit</option>
<option value="mens-shirt">Men's Shirt</option>
<option value="mens-shoe">Men's Shoe</option>
<option value="womens-shoe">Women's Shoe</option>
</select>
<label>Size</label>
<input type="number" id="size" value="8" step="0.5" aria-label="Size">
<label>From System</label>
<select id="from" aria-label="From">
<option value="us" selected>US</option>
<option value="uk">UK</option>
<option value="eu">EU</option>
<option value="intl">International</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const cat=document.getElementById('category').value;
const s=parseFloat(document.getElementById('size').value)||0;
const f=document.getElementById('from').value;
let us,uk,eu,intl;
if(cat==='dress'){
if(f==='us'){us=s;uk=s-2;eu=s+28;intl=s<=4?'XS':s<=8?'S':s<=12?'M':s<=16?'L':'XL';}
else if(f==='uk'){uk=s;us=s+2;eu=s+30;intl=s<=2?'XS':s<=6?'S':s<=10?'M':s<=14?'L':'XL';}
else if(f==='eu'){eu=s;uk=s-30;us=s-28;intl=s<=32?'XS':s<=36?'S':s<=40?'M':s<=44?'L':'XL';}
}else if(cat==='mens-suit'){
if(f==='us'){us=s;uk=s;eu=s+10;intl=s<=36?'S':s<=40?'M':s<=44?'L':'XL';}
else if(f==='eu'){eu=s;us=s-10;uk=s-10;intl=s<=46?'S':s<=50?'M':s<=54?'L':'XL';}
}else if(cat==='mens-shirt'){
const neck=s;
us=neck;uk=neck;eu=neck+2.54;intl=neck<=14?'S':neck<=16?'M':neck<=18?'L':'XL';
}else if(cat==='mens-shoe'){
if(f==='us'){us=s;uk=s-1;eu=s+33;intl=s;}
else if(f==='eu'){eu=s;us=s-33;uk=s-34;intl=s-33;}
}else if(cat==='womens-shoe'){
if(f==='us'){us=s;uk=s-2;eu=s+31;intl=s;}
else if(f==='eu'){eu=s;us=s-31;uk=s-33;intl=s-31;}
}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>US:</span><span>${us}</span></div>
<div class="result-row"><span>UK:</span><span>${uk}</span></div>
<div class="result-row"><span>EU:</span><span>${eu}</span></div>
<div class="result-row"><span>International:</span><span>${intl}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
