<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Modulation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Modulation Calculator</h1>
<p>Calculate spectral efficiency and required SNR for common modulation schemes. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-scheme">Modulation (BPSK,QPSK,16QAM,64QAM)</label><input type="text" id="in-scheme" autocomplete="off" placeholder="e.g. QPSK"><div class="unit">scheme</div></div>
<div class="field"><label class="f" for="in-code">Coding rate</label><input type="text" id="in-code" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">0–1</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sE=document.getElementById("in-scheme"),cE=document.getElementById("in-code"),out=document.getElementById("out");
var map={"BPSK":{bps:1,snr:7},"QPSK":{bps:2,snr:9},"16QAM":{bps:4,snr:16},"64QAM":{bps:6,snr:22}};
function msg(t){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">'+t+'</span>';}
function calc(){
var scheme=(sE.value||"").toUpperCase().trim();
var code=parseFloat(cE.value);
if(!scheme||!map[scheme]){msg("Enter a modulation scheme: BPSK, QPSK, 16QAM or 64QAM.");return;}
if(isNaN(code)||code<=0||code>1){msg("Enter a coding rate between 0 and 1.");return;}
var bps=map[scheme].bps;
var snr=map[scheme].snr;
var eff=bps*code;
var html='<div class="big">'+eff+' bits/s/Hz</div>';
html+=row("Spectral efficiency",eff+' bits/s/Hz');
html+=row("Bits per symbol",bps);
html+=row("Min SNR (approx)",snr+' dB');
html+=row("Effective data per symbol",(bps*code).toFixed(2)+' bits');
out.innerHTML=html;
}
[sE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
