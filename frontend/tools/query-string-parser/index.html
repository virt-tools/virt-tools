<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query String Parser — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
textarea,input{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;width:100%;box-sizing:border-box}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:#58a6ff}
button.primary{background:#1e3a5f;border-color:#58a6ff}
.err{color:#f85149;font-size:.85em;margin:4px 0}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #30363d;padding:8px 10px;text-align:left;font-size:.85em}
th{background:#21262d;color:#58a6ff}
td:first-child{color:#7ee787;font-family:monospace}
.copy{cursor:pointer;color:#58a6ff;font-size:.8em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Query String Parser & Builder</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Parse URL query strings into key-value pairs, or build query strings from key-value pairs. Handles arrays, encoding, and nested keys. 100% client-side.</p>
<label>URL or query string</label>
<textarea id="input" rows="3" placeholder="?name=Alice&age=30&tags=js&tags=web" aria-label="?Name=Alice&Age=30&Tags=Js&Tags=Web">?name=Alice&age=30&tags=js&tags=web&city=New%20York</textarea>
<button class="primary" onclick="parse()" type="button">Parse</button>
<button onclick="build()" type="button">Build</button>
<div class="err" id="err"></div>
<label>Parsed key-value pairs</label>
<div id="pairs"></div>
<label>JSON representation</label>
<textarea id="json" rows="5" readonly aria-label="Json"></textarea>
<label>Encoded query string</label>
<textarea id="output" rows="3" readonly aria-label="Output"></textarea>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function parse(){
  document.getElementById('err').textContent='';
  let raw=document.getElementById('input').value.trim();
  if(!raw)return;
  let qs=raw;
  if(raw.includes('?'))qs=raw.split('?').slice(1).join('?');
  let params=new URLSearchParams(qs);
  let obj={};
  for(let[k,v]of params){
    if(k in obj){
      if(!Array.isArray(obj[k]))obj[k]=[obj[k]];
      obj[k].push(v);
    }else obj[k]=v;
  }
  // render table
  let html='<table><tr><th>Key</th><th>Value</th><th>Encoded</th></tr>';
  for(let[k,v]of params){
    let val=Array.isArray(v)?v.join(', '):v;
    html+='<tr><td>'+esc(k)+'</td><td>'+esc(val)+'</td><td><span class="copy" onclick="copyText(\''+esc(k)+'='+esc(encodeURIComponent(val))+'\')">copy</span></td></tr>';
  }
  html+='</table>';
  document.getElementById('pairs').innerHTML=html;
  document.getElementById('json').value=JSON.stringify(obj,null,2);
  document.getElementById('output').value=qs;
}
function build(){
  document.getElementById('err').textContent='';
  let json=document.getElementById('json').value.trim();
  try{
    let obj=JSON.parse(json);
    let params=new URLSearchParams();
    Object.entries(obj).forEach(([k,v])=>{
      if(Array.isArray(v))v.forEach(x=>params.append(k,x));
      else params.append(k,String(v));
    });
    document.getElementById('output').value=params.toString();
    document.getElementById('input').value='?'+params.toString();
    // re-render table
    parse();
  }catch(e){
    document.getElementById('err').textContent='Error: '+e.message;
  }
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyText(t){navigator.clipboard.writeText(t);}
parse();
</script>
</body>
</html>
