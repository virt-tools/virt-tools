<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Valley Flashing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Valley Flashing Calculator</h1>
<p>Calculate valley flashing length and material from roof span and slope. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-span">Roof span</label><input type="text" id="in-span" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-slope">Roof slope</label><input type="text" id="in-slope" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in/12</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var spEl=document.getElementById("in-span"),slEl=document.getElementById("in-slope"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var SP=pn(spEl.value),SL=pn(slEl.value);
if(SP==null||SL==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return;}
if(!isFinite(SP)||!isFinite(SL)||SP<=0||SL<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var rise=SP/2*SL/12;
var rafter=Math.sqrt(rise*rise+(SP/2)*(SP/2));
var valley=Math.sqrt(rise*rise+2*(SP/2)*(SP/2));
var area=valley*2;
var html='<div class="big">'+rnd(valley,1)+' ft</div>';
html+=row("Roof span",rnd(SP,0)+" ft");
html+=row("Rafter length",rnd(rafter,1)+" ft");
html+=row("Valley length",rnd(valley,1)+" ft");
html+=row("Flashing area",rnd(area,2)+" sq ft");
out.innerHTML=html;
}
[spEl,slEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
