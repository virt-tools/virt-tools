<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Garden Kneeler Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Garden Kneeler Selector</h1>
<p>Recommend garden kneeler type (foam, bench, combo) from body weight and session length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wt">Body weight</label><input type="text" id="in-wt" inputmode="decimal" autocomplete="off" placeholder="e.g. 180"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-dur">Session length</label><input type="text" id="in-dur" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">min</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wtEl=document.getElementById("in-wt"),durEl=document.getElementById("in-dur"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Wt=pn(wtEl.value),Dur=pn(durEl.value);
if(Wt==null||Dur==null)return;
if(!isFinite(Wt)||!isFinite(Dur)||Wt<=0||Dur<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var type=Dur<15?"Foam pad":Dur<45?"Bench kneeler":"Combo bench+pad";
var minThick=Math.max(0.5,Math.ceil(Wt/120*10)/10);
var html='<div class="big">'+type+'</div>';
html+=row("Body weight",rnd(Wt,0)+' lb');
html+=row("Session",rnd(Dur,0)+' min');
html+=row("Type",type);
html+=row("Min pad thick",rnd(minThick,1)+' in');
html+=row("Weight cap",rnd(Math.ceil(Wt/50)*50,0)+' lb');
out.innerHTML=html;
}
[wtEl,durEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
