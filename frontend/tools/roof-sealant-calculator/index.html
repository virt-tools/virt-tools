<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Roof Sealant Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Roof Sealant Calculator</h1>
<p>Calculate roof sealant buckets needed from roof area, coverage rate, and bucket size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Roof area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-r">Coverage rate</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">sq ft/gal</div></div>
<div class="field"><label class="f" for="in-b">Bucket size</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">gal</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),rEl=document.getElementById("in-r"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),R=pn(rEl.value),B=pn(bEl.value);
if(A==null||R==null||B==null)return;
if(!isFinite(A)||!isFinite(R)||!isFinite(B)||A<=0||R<=0||B<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var gal=A/R;
var buckets=Math.ceil(gal/B);
var html='<div class="big">'+rnd(buckets,0)+' buckets</div>';
html+=row("Roof area",rnd(A,0)+' sq ft');
html+=row("Coverage rate",rnd(R,0)+' sq ft/gal');
html+=row("Total gallons",rnd(gal,1)+' gal');
html+=row("Bucket size",rnd(B,0)+' gal');
html+=row("Buckets needed",rnd(buckets,0)+' buckets');
out.innerHTML=html;
}
[aEl,rEl,bEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
