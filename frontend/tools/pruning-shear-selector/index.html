<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pruning Shear Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pruning Shear Selector</h1>
<p>Recommend pruning shear type (bypass, anvil, ratchet) from branch diameter and hand strength level. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Branch diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-str">Hand strength 1-3</label><input type="text" id="in-str" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit"></div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var diaEl=document.getElementById("in-dia"),strEl=document.getElementById("in-str"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Dia=pn(diaEl.value),Str=pn(strEl.value);
if(Dia==null||Str==null)return;
if(!isFinite(Dia)||!isFinite(Str)||Dia<=0||Str<1||Str>3){err.textContent="Enter valid values.";return}
err.textContent="";
var type=Dia<0.5?"Bypass":Dia<1?"(Str===3?Ratchet:Bypass)":"Ratchet";
if(Dia>=1)type="Ratchet";
else if(Str===3&&Dia>=0.75)type="Ratchet";
else type="Bypass";
var bladeLen=Math.max(1.5,Dia*2);
var html='<div class="big">'+type+'</div>';
html+=row("Branch dia",rnd(Dia,2)+' in ('+rnd(Dia*25.4,1)+' mm)');
html+=row("Hand strength",Str===1?"Light":Str===2?"Average":"Strong");
html+=row("Shear type",type);
html+=row("Blade length",rnd(bladeLen,1)+' in');
html+=row("Cut capacity",rnd(Dia*1.5,2)+' in max');
out.innerHTML=html;
}
[diaEl,strEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
