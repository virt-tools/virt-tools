<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aquarium Stocking Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Aquarium Stocking Calculator</h1>
<p class="subtitle">Estimate safe fish stocking levels using the inch-per-gallon rule.</p>
<div class="input-section">
<label>Tank Size (US gallons)</label>
<input type="number" id="gallons" value="55" min="1" aria-label="Gallons">
<label>Average Adult Fish Length (inches)</label>
<input type="number" id="fishLen" value="2" min="0.5" step="0.5" aria-label="Fish Len">
<label>Filter Type</label>
<select id="filter" aria-label="Filter">
<option value="1">Basic (HOB)</option>
<option value="1.5" selected>Standard (Sponge + HOB)</option>
<option value="2">Heavy (Canister)</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const G=parseFloat(document.getElementById('gallons').value)||0;
const L=parseFloat(document.getElementById('fishLen').value)||1;
const F=parseFloat(document.getElementById('filter').value);
const maxInches=G*F;
const maxFish=Math.floor(maxInches/L);
let note=G<10?'<p class="warning">⚠️ Tanks under 10 gal are sensitive — stock conservatively</p>':G<30?'<p class="warning">⚠️ Small tanks — follow species-specific limits</p>':'<p class="ok">✓ Good tank size for community fish</p>';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Tank Size:</span><span>${G} gallons</span></div>
<div class="result-row"><span>Filter Multiplier:</span><span>${F}×</span></div>
<div class="result-row"><span>Max Adult Inches:</span><span>${maxInches} inches</span></div>
<div class="result-row"><span>Max Fish (${L}" each):</span><span>${maxFish} fish</span></div>
${note}
<p class="hint">Rule of thumb only — always research species-specific needs.</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
