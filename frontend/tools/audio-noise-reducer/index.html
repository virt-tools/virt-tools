<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Noise Reducer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Noise Reducer</h1>
<p class="subtitle">Reduce background noise from audio using a high-pass and low-pass filter chain. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>High-pass (Hz): <input type="range" id="hp" min="20" max="1000" value="80" step="10"><span id="hpv">80</span></label>
<label>Low-pass (Hz): <input type="range" id="lp" min="2000" max="20000" value="12000" step="100"><span id="lpv">12000</span></label>
<button id="process" class="primary-btn" type="button">Process & Download</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const hp=document.getElementById('hp'),lp=document.getElementById('lp');
document.getElementById('hpv').textContent=hp.value;
document.getElementById('lpv').textContent=lp.value;
hp.oninput=()=>document.getElementById('hpv').textContent=hp.value;
lp.oninput=()=>document.getElementById('lpv').textContent=lp.value;
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const audioCtx=new AudioContext();
const arr=await file.arrayBuffer();
const buf=await audioCtx.decodeAudioData(arr);
const hpFilter=audioCtx.createBiquadFilter();
hpFilter.type='highpass';hpFilter.frequency.value=+hp.value;
const lpFilter=audioCtx.createBiquadFilter();
lpFilter.type='lowpass';lpFilter.frequency.value=+lp.value;
const dest=audioCtx.createMediaStreamDestination();
const src=audioCtx.createBufferSource();
src.buffer=buf;src.connect(hpFilter);hpFilter.connect(lpFilter);lpFilter.connect(dest);
const rec=new MediaRecorder(dest.stream);
const chunks=[];
rec.ondataavailable=e=>chunks.push(e.data);
rec.onstop=()=>{
const blob=new Blob(chunks,{type:'audio/webm'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='noise-reduced.webm';a.click();
audioCtx.close();
};
rec.start();src.start();
setTimeout(()=>{src.stop();rec.stop();},buf.duration*1000+200);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
