<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Concrete Yard Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Concrete Yard Calculator</h1>
<p>Calculate cubic yards of concrete needed from dimensions, with waste factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-w">Width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-d">Depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value);
if(L==null||W==null||D==null)return;
if(!isFinite(L)||L<=0||!isFinite(W)||W<=0||!isFinite(D)||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var cf=L*W*(D/12);
var cy=cf/27;
var wasteFactor=1.05;
var totalCy=cy*wasteFactor;
var bags80=Math.ceil(totalCy*45);
var html='<div class="big">'+rnd(totalCy,2)+' yd³</div>';
html+=row("Concrete needed",rnd(totalCy,2)+' yd³');
html+=row("Base volume",rnd(cy,2)+' yd³');
html+=row("Cubic feet",rnd(cf,1)+' ft³');
html+=row("Waste factor","5%");
html+=row("80lb bags",bags80);
out.innerHTML=html;
}
[lEl,wEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
