<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Voltage Regulator Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Voltage Regulator Selector</h1>
<p>Select voltage regulator size, tap range, and current rating from load and voltage conditions. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Load power</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-volt">Nominal voltage</label><input type="text" id="in-volt" inputmode="decimal" autocomplete="off" placeholder="e.g. 240"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-pf">Power factor</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.9"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lE=document.getElementById("in-load"),vE=document.getElementById("in-volt"),pE=document.getElementById("in-pf"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var l=pn(lE.value),v=pn(vE.value),p=pn(pE.value);
if(l==null||v==null||p==null)return;
if(!isFinite(l)||l<=0||!isFinite(v)||v<=0){err.textContent="Enter valid positive values.";return}
if(!isFinite(p)||p<=0||p>1){err.textContent="Power factor must be between 0 and 1.";return}
err.textContent="";
var current=l*1000/(v*p);
var kva=l/p*1.25;
var tapRange=10;
var html='<div class="big">'+(Math.round(current))+' A</div>';
html+=row("Current rating",Math.round(current)+' A');
html+=row("Regulator kVA",Math.round(kva)+' kVA');
html+=row("Tap range","±"+tapRange+"%");
out.innerHTML=html;
}
[lE,vE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
