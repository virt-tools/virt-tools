<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Percentage Calculator</h1>
<p class="subtitle">Calculate percentages, increases, decreases, and ratios.</p>
<form class="input-section" id="percentage-form" novalidate>
<label for="mode">Mode</label>
<select id="mode" aria-label="Mode">
<option value="basic" selected>What is X% of Y?</option>
<option value="pct">X is what % of Y?</option>
<option value="increase">% Increase/Decrease</option>
</select>
<div id="basicInput">
<label for="pct1">Percentage (X)</label>
<input type="number" id="pct1" value="20" step="any">
<label for="val1">Of value (Y)</label>
<input type="number" id="val1" value="50" step="any">
</div>
<div id="pctInput" style="display:none">
<label for="val2">Value (X)</label>
<input type="number" id="val2" value="10" step="any">
<label for="val3">Of total (Y)</label>
<input type="number" id="val3" value="50" step="any">
</div>
<div id="incInput" style="display:none">
<label for="val4">Original value</label>
<input type="number" id="val4" value="100" step="any">
<label for="val5">New value</label>
<input type="number" id="val5" value="120" step="any">
</div>
<button id="calc" class="primary-btn" type="submit">Calculate</button>
</form>
<div class="result-section" id="result" role="status" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
const result=document.getElementById('result');
const form=document.getElementById('percentage-form');
function clear(){result.replaceChildren();result.style.display='none';form.querySelectorAll('[aria-invalid]').forEach(input=>input.removeAttribute('aria-invalid'));}
mode.addEventListener('change',()=>{
['basicInput','pctInput','incInput'].forEach(s=>document.getElementById(s).style.display='none');
document.getElementById(({basic:'basicInput',pct:'pctInput',increase:'incInput'})[mode.value]).style.display='';
clear();
});
form.addEventListener('input',clear);
function read(id){const input=document.getElementById(id);const value=Number(input.value);if(!input.value.trim()||!Number.isFinite(value)){input.setAttribute('aria-invalid','true');input.focus();throw new Error('Enter a finite number for '+input.labels[0].textContent.toLowerCase()+'.');}return value;}
function format(value){if(!Number.isFinite(value))throw new Error('Result is outside the supported numeric range.');return new Intl.NumberFormat(undefined,{maximumSignificantDigits:12}).format(value);}
form.addEventListener('submit',event=>{
event.preventDefault();clear();
try{
if(mode.value==='basic'){
const p=read('pct1'),v=read('val1');
result.textContent=`${format(p)}% of ${format(v)} = ${format((p/100)*v)}`;
}else if(mode.value==='pct'){
const x=read('val2'),y=read('val3');
if(y===0)throw new Error('Total must be non-zero.');
result.textContent=`${format(x)} is ${format((x/y)*100)}% of ${format(y)}`;
}else{
const o=read('val4'),n=read('val5');
if(o<=0)throw new Error('Original value must be positive for percentage change.');
const diff=n-o,pct=(diff/o)*100;
result.textContent=`${pct>0?'Increase':pct<0?'Decrease':'No change'}: ${format(diff)} (${pct>0?'+':''}${format(pct)}%)`;
}
}catch(error){result.textContent=error.message;}
result.style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
