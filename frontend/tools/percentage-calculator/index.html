<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Percentage Calculator</h1>
<p class="subtitle">Calculate percentages, increases, decreases, and ratios.</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="basic" selected>What is X% of Y?</option>
<option value="pct">X is what % of Y?</option>
<option value="increase">% Increase/Decrease</option>
</select>
<div id="basicInput">
<label>Percentage (X)</label>
<input type="number" id="pct1" value="20" step="any" aria-label="Pct1">
<label>Of Value (Y)</label>
<input type="number" id="val1" value="50" step="any" aria-label="Val1">
</div>
<div id="pctInput" style="display:none">
<label>Value (X)</label>
<input type="number" id="val2" value="10" step="any" aria-label="Val2">
<label>Of Total (Y)</label>
<input type="number" id="val3" value="50" step="any" aria-label="Val3">
</div>
<div id="incInput" style="display:none">
<label>Original Value</label>
<input type="number" id="val4" value="100" step="any" aria-label="Val4">
<label>New Value</label>
<input type="number" id="val5" value="120" step="any" aria-label="Val5">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{
['basicInput','pctInput','incInput'].forEach(s=>document.getElementById(s).style.display='none');
document.getElementById(mode.value+'Input').style.display='';
});
document.getElementById('calc').addEventListener('click',()=>{
let html;
if(mode.value==='basic'){
const p=parseFloat(document.getElementById('pct1').value)||0;
const v=parseFloat(document.getElementById('val1').value)||0;
const r=(p/100)*v;
html=`<div class="result-row"><span>${p}% of ${v}:</span><span>${r}</span></div>`;
}else if(mode.value==='pct'){
const x=parseFloat(document.getElementById('val2').value)||0;
const y=parseFloat(document.getElementById('val3').value);
if(!Number.isFinite(y)||y===0){html='<div class="result-row"><span>Error:</span><span>Total must be a non-zero number.</span></div>';}
else{const r=(x/y)*100;html=`<div class="result-row"><span>${x} is:</span><span>${r.toFixed(4)}% of ${y}</span></div>`;}
}else{
const o=parseFloat(document.getElementById('val4').value)||0;
const n=parseFloat(document.getElementById('val5').value)||0;
const diff=n-o;
if(o===0){html='<div class="result-row"><span>Error:</span><span>Original value must be non-zero.</span></div>';}
else{const pct=(diff/o)*100;html=`<div class="result-row"><span>Change:</span><span>${diff.toFixed(4)} (${pct>=0?'+':''}${pct.toFixed(2)}%)</span></div>
	<div class="result-row"><span>Type:</span><span>${pct>0?'Increase':pct<0?'Decrease':'No change'}</span></div>`;}
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
