<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Perforation Density Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Perforation Density Calculator</h1>
<p>Calculate total perforations, shot density, and open area from interval length, shots per foot, and hole diameter. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Interval length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-spf">Shots per foot</label><input type="text" id="in-spf" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">shots/ft</div></div>
<div class="field"><label class="f" for="in-hd">Hole diameter</label><input type="text" id="in-hd" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.4"><div class="unit">in</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenE=document.getElementById("in-len"),spfE=document.getElementById("in-spf"),hdE=document.getElementById("in-hd"),out=document.getElementById("out");
function calc(){
var len=parseFloat(lenE.value),spf=parseFloat(spfE.value),hd=parseFloat(hdE.value);
if(isNaN(len)||isNaN(spf)||isNaN(hd))return;
var totalShots=len*spf;
var holeArea=Math.PI*Math.pow(hd/2,2)/144;
var totalArea=totalShots*holeArea;
var html='<div class="big">'+Math.round(totalShots)+' shots</div>';
html+=row("Total perforations",Math.round(totalShots));
html+=row("Total open area",Math.round(totalArea*1000)/1000+' ft²');
html+=row("Shots per foot",spf);
out.innerHTML=html;
}
[lenE,spfE,hdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
