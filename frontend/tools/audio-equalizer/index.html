<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Equalizer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Equalizer</h1>
<p class="subtitle">10-band equalizer for audio files. Adjust bass, mid, treble in real-time. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="play" class="primary-btn" type="button">Play</button>
<button id="stop" class="primary-btn" style="background:#666;" type="button">Stop</button>
</div>
<div id="bands" style="display:flex;flex-wrap:wrap;gap:1em;margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const bands=[60,170,310,600,1000,3000,6000,12000,14000,16000];
const sliders=[];
const bandDiv=document.getElementById('bands');
bands.forEach((f,i)=>{
const label=document.createElement('label');
label.style.textAlign='center';
label.innerHTML=f<1000?f+' Hz':(f/1000)+' kHz';
const sl=document.createElement('input');
sl.type='range';sl.min='-12';sl.max='12';sl.value='0';sl.step='1';
sl.style.width='80px';sl.style.display='block';sl.style.margin='4px auto';
sliders.push(sl);
label.appendChild(sl);
bandDiv.appendChild(label);
});
let audioCtx,source,filters=[],gainNode;
document.getElementById('play').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
audioCtx=new AudioContext();
const arr=await file.arrayBuffer();
const buf=await audioCtx.decodeAudioData(arr);
source=audioCtx.createBufferSource();
source.buffer=buf;
filters=bands.map((f,i)=>{
const eq=audioCtx.createBiquadFilter();
eq.type='peaking';eq.frequency.value=f;eq.Q.value=1;eq.gain.value=+sliders[i].value;
return eq;
});
sliders.forEach((sl,i)=>{sl.oninput=()=>{if(filters[i])filters[i].gain.value=+sl.value;};});
source.connect(filters[0]);
for(let i=0;i<filters.length-1;i++)filters[i].connect(filters[i+1]);
gainNode=audioCtx.createGain();
filters[filters.length-1].connect(gainNode);
gainNode.connect(audioCtx.destination);
source.start();
});
document.getElementById('stop').addEventListener('click',()=>{
if(source)try{source.stop();}catch(e){}
if(audioCtx)audioCtx.close();
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
