<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Overcurrent Relay Setting Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Overcurrent Relay Setting Calculator</h1>
<p>Calculate overcurrent relay pickup, time dial, and trip time using IEC inverse curves. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-fault">Fault current</label><input type="text" id="in-fault" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-pickup">Pickup</label><input type="text" id="in-pickup" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-td">Time dial</label><input type="text" id="in-td" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">TDS</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fE=document.getElementById("in-fault"),pE=document.getElementById("in-pickup"),tE=document.getElementById("in-td"),out=document.getElementById("out");
function calc(){
var f=parseFloat(fE.value),p=parseFloat(pE.value),t=parseFloat(tE.value);
if(isNaN(f)||isNaN(p)||isNaN(t))return;
var m=f/p;
var tripTime=0.14*t/(Math.pow(m,0.02)-1);
var html='<div class="big">'+(Math.round(tripTime*100)/100)+' s</div>';
html+=row("Trip time (IEC SI)",Math.round(tripTime*100)/100+' s');
html+=row("Multiples of pickup",Math.round(m*100)/100);
html+=row("Curve type","IEC Standard Inverse");
out.innerHTML=html;
}
[fE,pE,tE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
