<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICC Profile Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>ICC Color Profile Viewer</h1>
<p class="subtitle">Extract and display ICC color profile metadata embedded in images. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div id="results" style="margin-top:15px"></div>
<script>
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
var r=new FileReader();
r.onload=function(){
var bytes=new Uint8Array(r.result);
var meta=[];
meta.push(['File name',f.name]);
meta.push(['File size',(f.size/1024).toFixed(2)+' KB']);
meta.push(['File type',f.type]);
var w=new DataView(r.result);
if(bytes[0]===0xFF&&bytes[1]===0xD8){
var i=2;
while(i<bytes.length-1){
if(bytes[i]!==0xFF)break;
var m=bytes[i+1];
var len=w.getUint16(i+2);
if(m===0xE2){
meta.push(['ICC Profile chunk','Found at offset '+i]);
meta.push(['ICC chunk size',len+' bytes']);
break;
}
i+=2+len;
}
}
if(!meta.find(function(r){return r[0].startsWith('ICC');})){
meta.push(['ICC Profile','None found']);
}
var html='<table style="border-collapse:collapse;width:100%"><tbody>';
meta.forEach(function(r){
html+='<tr><td style="border:1px solid #444;padding:6px;font-weight:bold">'+r[0]+'</td><td style="border:1px solid #444;padding:6px">'+r[1]+'</td></tr>';
});
html+='</tbody></table>';
document.getElementById('results').innerHTML=html;
};
r.readAsArrayBuffer(f);
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
