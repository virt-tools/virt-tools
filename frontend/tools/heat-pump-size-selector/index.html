<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Heat Pump Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Heat Pump Size Selector</h1>
<p>Select heat pump size from heating load and climate zone COP. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Heating load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 36000"><div class="unit">BTU/hr</div></div>
<div class="field"><label class="f" for="in-cop">COP at design temp</label><input type="text" id="in-cop" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5"><div class="unit">ratio</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var loadEl=document.getElementById("in-load"),copEl=document.getElementById("in-cop"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(loadEl.value),C=pn(copEl.value);
if(L==null||C==null)return;
if(!isFinite(L)||!isFinite(C)||L<=0||C<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var inputBTU=L/C;
var tons=L/12000;
var kW=inputBTU/3412;
var html='<div class="big">'+rnd(tons,1)+' tons</div>';
html+=row("Design load",rnd(L,0)+" BTU/hr");
html+=row("Electrical input",rnd(kW,1)+" kW");
html+=row("Required capacity at design temp",rnd(L,0)+" BTU/hr");
html+=row("Recommended size",rnd(tons*1.15,1)+" tons (15% safety)");
out.innerHTML=html;
}
[loadEl,copEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
