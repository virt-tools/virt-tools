<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to HTML Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Markdown to HTML Converter</h1>
<p class="subtitle">Convert Markdown to clean HTML. Supports headings, bold, italic, links, lists, code blocks, and more. 100% client-side.</p>
<div class="input-section">
<label>Paste Markdown</label>
<textarea id="input" rows="12" placeholder="# Heading&#10;**bold** *italic* [link](url)&#10;- item" aria-label="# Heading&#10;**Bold** *Italic* [Link](Url)&#10;  Item"></textarea>
<button id="convert" class="primary-btn" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeUrl(value){
const url=String(value||'').trim();
if(/^(?:https?:|mailto:)/i.test(url)||/^(?:[#/?]|\.\.?\/)/.test(url))return url;
return '#';
}
function mdToHtml(md){
let h=md;
h=h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c.trim()+'</code></pre>');
h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
h=h.replace(/^###### (.+)$/gm,'<h6>$1</h6>');
h=h.replace(/^##### (.+)$/gm,'<h5>$1</h5>');
h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(match,label,url)=>'<a href="'+escapeAttr(safeUrl(url))+'" rel="noopener noreferrer">'+label+'</a>');
h=h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
h=h.replace(/^---+$/gm,'<hr>');
let lines=h.split('\n');let out=[];let inUl=false;let inOl=false;
for(let line of lines){
if(/^\s*[-*] (.+)$/.test(line)){
if(!inUl){out.push('<ul>');inUl=true;}
out.push('<li>'+line.replace(/^\s*[-*] /,'')+'</li>');
}else if(/^\s*\d+\. (.+)$/.test(line)){
if(!inOl){out.push('<ol>');inOl=true;}
out.push('<li>'+line.replace(/^\s*\d+\. /,'')+'</li>');
}else{
if(inUl){out.push('</ul>');inUl=false;}
if(inOl){out.push('</ol>');inOl=false;}
out.push(line);
}
}
if(inUl)out.push('</ul>');
if(inOl)out.push('</ol>');
return out.join('\n');
}
document.getElementById('convert').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){const result=document.getElementById('result');const note=document.createElement('p');note.style.color='#ff9800';note.textContent='No input.';result.replaceChildren(note);return;}
const html=mdToHtml(input);
const heading=document.createElement('h3');heading.textContent='HTML Output';
const ta=document.createElement('textarea');ta.value=html;ta.rows=12;ta.style.width='100%';ta.readOnly=true;ta.setAttribute('aria-label','HTML output');
const btn=document.createElement('button');btn.textContent='Copy HTML';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>navigator.clipboard.writeText(ta.value).then(()=>{btn.textContent='Copied!';}));
const previewLabel=document.createElement('h3');previewLabel.textContent='Sandboxed preview';
const prev=document.createElement('iframe');prev.title='Rendered HTML preview';prev.setAttribute('sandbox','');prev.referrerPolicy='no-referrer';prev.style.cssText='border:1px solid #444;width:100%;min-height:220px;margin-top:.5em;background:white;';prev.srcdoc=html;
const r=document.getElementById('result');r.replaceChildren(heading,ta,btn,previewLabel,prev);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
