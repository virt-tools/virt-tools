<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Worth Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.nw{max-width:600px;margin:0 auto;padding:2rem 1rem}
.nw h1{font-size:2rem;margin-bottom:.5rem}
.nw .sub{color:#888;margin-bottom:1.5rem}
.nw h3{font-size:1.1rem;margin-top:1.5rem;margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.nw label{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.nw input{width:100%;font-size:15px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:.5rem}
.nw .total{font-size:1.5rem;font-weight:700;padding:1rem;border-radius:12px;text-align:center;margin-top:1.5rem}
.nw .pos{background:#e8f5e9;color:#2e7d32}
.nw .neg{background:#ffebee;color:#c62828}
.nw .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.nw .card{padding:1rem;border:1px solid var(--border);border-radius:12px;text-align:center}
.nw .card .big{font-size:1.3rem;font-weight:700}
.nw .card .lbl{color:#888;font-size:12px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="nw">
<h1>💰 Net Worth Calculator</h1>
<p class="sub">Calculate your net worth — assets minus liabilities.</p>
<h3>Assets</h3>
<label>Cash & Bank Accounts <input type="number" id="cash" value="0" step="100" style="width:120px" oninput="calc()"></label>
<label>Investments & Retirement <input type="number" id="invest" value="0" step="1000" style="width:120px" oninput="calc()"></label>
<label>Real Estate (home value) <input type="number" id="realestate" value="0" step="5000" style="width:120px" oninput="calc()"></label>
<label>Vehicles <input type="number" id="vehicles" value="0" step="500" style="width:120px" oninput="calc()"></label>
<label>Other Assets <input type="number" id="otherAssets" value="0" step="500" style="width:120px" oninput="calc()"></label>
<h3>Liabilities</h3>
<label>Mortgage <input type="number" id="mortgage" value="0" step="5000" style="width:120px" oninput="calc()"></label>
<label>Car Loans <input type="number" id="carLoan" value="0" step="500" style="width:120px" oninput="calc()"></label>
<label>Student Loans <input type="number" id="studentLoan" value="0" step="500" style="width:120px" oninput="calc()"></label>
<label>Credit Card Debt <input type="number" id="ccDebt" value="0" step="100" style="width:120px" oninput="calc()"></label>
<label>Other Liabilities <input type="number" id="otherLiab" value="0" step="500" style="width:120px" oninput="calc()"></label>
<div class="grid">
<div class="card"><div class="lbl">Total Assets</div><div class="big" style="color:#2e7d32" id="totalAssets">$0</div></div>
<div class="card"><div class="lbl">Total Liabilities</div><div class="big" style="color:#c62828" id="totalLiab">$0</div></div>
</div>
<div class="total" id="netWorth">Net Worth: $0</div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const v=id=>parseFloat(document.getElementById(id).value)||0;
  const assets=v('cash')+v('invest')+v('realestate')+v('vehicles')+v('otherAssets');
  const liab=v('mortgage')+v('carLoan')+v('studentLoan')+v('ccDebt')+v('otherLiab');
  const nw=assets-liab;
  const fmt=x=>'$'+Math.round(x).toLocaleString();
  document.getElementById('totalAssets').textContent=fmt(assets);
  document.getElementById('totalLiab').textContent=fmt(liab);
  const el=document.getElementById('netWorth');
  el.textContent='Net Worth: '+fmt(nw);
  el.className='total '+(nw>=0?'pos':'neg');
}
calc();
</script>
</body>
</html>
