<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System of Equations Solver — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>System of Linear Equations Solver</h1>
<p class="subtitle">Solve 2×2 and 3×3 systems of linear equations using Cramer's rule.</p>
<div class="input-section">
<label>System Size</label>
<select id="size" aria-label="Size">
<option value="2" selected>2×2</option>
<option value="3">3×3</option>
</select>
<h3>Equations (a₁x + b₁y + c₁z = d₁)</h3>
<div id="coeffs"></div>
<button id="calc" class="primary-btn" type="button">Solve</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function buildInputs(){
const n=parseInt(document.getElementById('size').value);
const c=document.getElementById('coeffs');
c.innerHTML='';
const vars=n===2?['x','y']:['x','y','z'];
for(let i=0;i<n;i++){
let row='';
for(let j=0;j<n;j++){
row+=`<input type="number" id="a${i}${j}" value="${i===j?1:0}" style="width:50px;display:inline-block" aria-label="Equation ${i+1}, coefficient ${vars[j]}"> ${vars[j]} ${j<n-1?'+ ':''}`;
}
row+=`= <input type="number" id="d${i}" value="1" style="width:50px;display:inline-block" aria-label="Equation ${i+1}, right side">`;
c.innerHTML+=`<div style="margin:5px 0">${row}</div>`;
}
}
function det2(m){return m[0][0]*m[1][1]-m[0][1]*m[1][0];}
function det3(m){return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);}
document.addEventListener('DOMContentLoaded',()=>{
buildInputs();
document.getElementById('size').addEventListener('change',buildInputs);
document.getElementById('calc').addEventListener('click',()=>{
const n=parseInt(document.getElementById('size').value);
let A=[],D=[];
function read(id){const raw=document.getElementById(id).value;return raw.trim()?Number(raw):NaN;}
for(let i=0;i<n;i++){let row=[];for(let j=0;j<n;j++)row.push(read('a'+i+j));A.push(row);D.push(read('d'+i));}
const result=document.getElementById('result');result.style.display='block';
if(![...A.flat(),...D].every(Number.isFinite)){result.textContent='Enter finite coefficients and right-hand values.';return;}
const det=n===2?det2(A):det3(A);
if(!Number.isFinite(det)||det===0){result.textContent='No unique numeric solution at this precision. The system may be singular or outside the supported range.';return;}
let html=`<div class="result-row"><span>Determinant:</span><span>${det.toFixed(6)}</span></div>`;
const vars=n===2?['x','y','z']:['x','y','z'];
for(let col=0;col<n;col++){
let Amod=A.map((r,i)=>r.map((v,j)=>j===col?D[i]:v));
const detM=n===2?det2(Amod):det3(Amod);
const val=detM/det;
if(!Number.isFinite(val)){result.textContent='Solution exceeds the supported numeric range.';return;}
html+=`<div class="result-row"><span>${vars[col]} =</span><span>${val.toFixed(6)}</span></div>`;
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
