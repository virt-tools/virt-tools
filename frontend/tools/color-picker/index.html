<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Color Picker</h1>
<p class="subtitle">Pick any pixel from an image and get its color in HEX, RGB, HSL. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin:10px 0;display:flex;align-items:center;gap:10px">
<div id="swatch" style="width:48px;height:48px;border:1px solid #888;border-radius:4px;display:none"></div>
<span id="hex" style="font-family:monospace;font-size:1.1em"></span>
<span id="rgb" style="color:#aaa;font-family:monospace"></span>
<span id="hsl" style="color:#aaa;font-family:monospace"></span>
</div>
<canvas id="canvas" style="max-width:100%;border:1px solid #444;display:none;cursor:crosshair"></canvas>
<script>
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
var img=new Image();
img.onload=function(){
var c=document.getElementById('canvas');var ctx=c.getContext('2d');
c.width=img.naturalWidth;c.height=img.naturalHeight;
ctx.drawImage(img,0,0);
c.style.display='block';
c.onclick=function(e){
var rect=c.getBoundingClientRect();
var x=Math.round((e.clientX-rect.left)*(c.width/rect.width));
var y=Math.round((e.clientY-rect.top)*(c.height/rect.height));
var d=ctx.getImageData(x,y,1,1).data;
var r=d[0],g=d[1],b=d[2];
var hex='#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('').toUpperCase();
document.getElementById('swatch').style.background=hex;document.getElementById('swatch').style.display='block';
document.getElementById('hex').textContent=hex;
document.getElementById('rgb').textContent='RGB('+r+', '+g+', '+b+')';
var hsl=rgbToHsl(r,g,b);
document.getElementById('hsl').textContent='HSL('+hsl[0]+', '+hsl[1]+'%, '+hsl[2]+'%)';
};
};
img.src=URL.createObjectURL(f);
});
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b);var h,s,l=(max+min)/2;if(max===min){h=s=0;}else{var d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)];}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
