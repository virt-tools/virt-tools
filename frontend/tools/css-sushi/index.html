<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Sushi Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🍣 CSS Sushi Generator</h1>
<p>Create CSS sushi with nigiri (salmon/tuna/shrimp/egg) and maki rolls. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Type</label><select id="type"><option value="nigiri">Nigiri</option><option value="maki">Maki Roll</option></select></div>
<div class="ctrl-row"><label>Top Color</label><input type="color" id="topColor" value="#e85d4a" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Count</label><input type="range" id="cnt" min="1" max="6" step="1" value="3" style="width:200px"></div>
<div class="ctrl-row"><label>With Rice</label><select id="rice"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var type=document.getElementById('type').value;
var topColor=document.getElementById('topColor').value;
var cnt=parseInt(document.getElementById('cnt').value);
var rice=document.getElementById('rice').value;
var html='<div class="sushi-plate">\n';
for(var i=0;i<cnt;i++){
  if(type==='nigiri'){
    html+='  <div class="nigiri"><div class="nigiri-rice"></div><div class="nigiri-top"></div><div class="nigiri-band"></div></div>\n';
  }else{
    html+='  <div class="maki"><div class="maki-nori"></div><div class="maki-rice"></div><div class="maki-center"></div></div>\n';
  }
}
html+='</div>';
var css='.sushi-plate{display:flex;gap:16px;align-items:center;flex-wrap:wrap}\n';
if(type==='nigiri'){
  css+='.nigiri{position:relative;width:100px;height:60px}\n';
  css+='.nigiri-rice{position:absolute;bottom:0;width:100px;height:40px;background:#fff8e8;border-radius:50% 50% 12px 12px;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.08)}\n';
  css+='.nigiri-top{position:absolute;top:0;width:90px;height:28px;background:'+topColor+';border-radius:14px 14px 8px 8px;left:5px;box-shadow:inset 0 -3px 6px rgba(0,0,0,0.15)}\n';
  css+='.nigiri-band{position:absolute;top:24px;width:90px;height:8px;background:#1a1a1a;left:5px;border-radius:2px}\n';
}else{
  css+='.maki{position:relative;width:70px;height:70px;border-radius:50%}\n';
  css+='.maki-nori{position:absolute;width:100%;height:100%;border-radius:50%;background:#1a3a1a}\n';
  css+='.maki-rice{position:absolute;width:54px;height:54px;border-radius:50%;top:8px;left:8px;background:#fff8e8}\n';
  css+='.maki-center{position:absolute;width:24px;height:24px;border-radius:50%;top:23px;left:23px;background:'+topColor+'}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['type','topColor','cnt','rice'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
