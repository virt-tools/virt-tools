<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Nail Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Nail Spacing Calculator</h1>
<p>Calculate required soil nail spacing from nail capacity, wall height, soil unit weight, and lateral pressure coefficient. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cap">Nail capacity</label><input type="text" id="in-cap" inputmode="numeric" autocomplete="off" placeholder="e.g. 20000"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-h">Wall height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-g">Unit weight</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">pcf</div></div>
<div class="field"><label class="f" for="in-k">Lateral coeff</label><input type="text" id="in-k" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.33"><div class="unit">K</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var capEl=document.getElementById("in-cap"),hEl=document.getElementById("in-h"),gEl=document.getElementById("in-g"),kEl=document.getElementById("in-k"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CAP=parseInt(capEl.value),H=parseFloat(hEl.value),G=parseFloat(gEl.value),K=parseFloat(kEl.value);
if(isNaN(CAP)||isNaN(H)||isNaN(G)||isNaN(K))return;
if(CAP<=0||H<=0||G<=0||K<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var pmax=K*G*H;
var totalForce=pmax*H/2;
var nailsNeeded=totalForce/CAP;
var spacing=H/nailsNeeded;
var html='<div class="big">'+Math.round(spacing*10)/10+' ft</div>';
html+=row("Max pressure",Math.round(pmax)+' psf');
html+=row("Total lateral force",Math.round(totalForce)+' lb/ft');
html+=row("Nails needed",Math.ceil(nailsNeeded));
html+=row("Max spacing",Math.round(spacing*10)/10+' ft');
out.innerHTML=html;
}
[capEl,hEl,gEl,kEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
