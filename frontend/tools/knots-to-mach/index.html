<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knots to Mach (standard atmosphere) Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Knots to Mach (standard atmosphere) Converter</h1>
<p class="subtitle">Convert Knots and Mach (standard atmosphere) in either direction. Calculations run locally in your browser.</p>
<div class="input-section">
<label for="conversion-value">Value in <span id="conversion-from-label"></span></label>
<input id="conversion-value" type="number" value="1" step="any" inputmode="decimal">
<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">
<button id="conversion-swap" type="button" class="primary-btn">Swap direction</button>
<button id="conversion-copy" type="button">Copy result</button>
</div>
</div>
<section class="result-section" aria-live="polite">
<div class="result-row"><span id="conversion-to-label"></span><strong id="conversion-result"></strong></div>
<p id="conversion-equation"></p>
</section>
<script id="conversion-config" type="application/json">{"from":{"slug":"knots","name":"Knots","symbol":"kn","scale":0.5144444444444445,"offset":0},"to":{"slug":"mach","name":"Mach (standard atmosphere)","symbol":"Mach","scale":340.29,"offset":0}}</script>
</main>
<script src="/assets/app.js"></script>
<script src="/assets/conversion-tool.js"></script>
</body>
</html>
