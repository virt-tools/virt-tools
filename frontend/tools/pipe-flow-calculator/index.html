<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Flow Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pipe Flow Rate Calculator</h1>
<p class="subtitle">Calculate volumetric flow rate, velocity, and pressure drop in pipes.</p>
<div class="input-section">
<label>Pipe Inner Diameter (inches)</label>
<input type="number" id="dia" value="2" min="0.1" step="0.0625" aria-label="Dia">
<label>Flow Velocity (ft/s)</label>
<input type="number" id="vel" value="5" min="0.01" step="0.1" aria-label="Vel">
<label>Pipe Length (ft)</label>
<input type="number" id="len" value="100" min="1" aria-label="Len">
<label>Fluid</label>
<select id="fluid" aria-label="Fluid">
<option value="1" selected>Water (20°C)</option>
<option value="0.89">Water (60°C)</option>
<option value="0.8">Oil (light)</option>
<option value="1.5">Glycerin</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const d=parseFloat(document.getElementById('dia').value)||0;
const v=parseFloat(document.getElementById('vel').value)||0;
const L=parseFloat(document.getElementById('len').value)||0;
const visc=parseFloat(document.getElementById('fluid').value);
const r=d/2/12;
const areaFt=Math.PI*r*r;
const gpm=areaFt*v*448.83;
const gpmPerDay=gpm*60*24;
const Re=(v*d/12*6.31e4)/visc;
const f=64/Re;
const dP=f*(L/12)/(d/12)*v*v*1.94/2/144;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Pipe Diameter:</span><span>${d}"</span></div>
<div class="result-row"><span>Flow Velocity:</span><span>${v} ft/s</span></div>
<div class="result-row"><span>Flow Rate:</span><span>${gpm.toFixed(1)} GPM</span></div>
<div class="result-row"><span>Daily Volume:</span><span>${gpmPerDay.toLocaleString(undefined,{maximumFractionDigits:0})} gal/day</span></div>
<div class="result-row"><span>Reynolds Number:</span><span>${Re.toFixed(0)} ${Re<2300?'(laminar)':Re<4000?'(transitional)':'(turbulent)'}</span></div>
<div class="result-row"><span>Pressure Drop (approx):</span><span>${dP.toFixed(2)} psi</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
