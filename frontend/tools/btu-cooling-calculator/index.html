<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>BTU Cooling Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>BTU Cooling Calculator</h1>
<p>Calculate required cooling BTU from room size, occupants, and heat sources. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Room area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-occ">Occupants</label><input type="text" id="in-occ" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">people</div></div>
<div class="field"><label class="f" for="in-w">Appliance watts</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-sun">Sun exposure</label><input type="text" id="in-sun" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">factor</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var areaEl=document.getElementById("in-area"),occEl=document.getElementById("in-occ"),wEl=document.getElementById("in-w"),sunEl=document.getElementById("in-sun"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(areaEl.value),O=pn(occEl.value),W=pn(wEl.value),S=pn(sunEl.value);
if(A==null||O==null||W==null||S==null)return;
if(!isFinite(A)||!isFinite(O)||!isFinite(W)||!isFinite(S)||A<=0||O<0||W<0||S<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var baseCool=A*20*S;
var occCool=O*400;
var appCool=W*3.412;
var total=baseCool+occCool+appCool;
var html='<div class="big">'+rnd(total,0)+' BTU/hr</div>';
html+=row("Base cooling",rnd(baseCool,0)+" BTU/hr");
html+=row("Occupant heat",rnd(occCool,0)+" BTU/hr");
html+=row("Appliance heat",rnd(appCool,0)+" BTU/hr");
html+=row("Total cooling load",rnd(total,0)+" BTU/hr");
html+=row("Recommended AC",rnd(total*1.15,0)+" BTU/hr (15% safety)");
out.innerHTML=html;
}
[areaEl,occEl,wEl,sunEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
