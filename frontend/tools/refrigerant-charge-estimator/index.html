<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Refrigerant Charge Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Refrigerant Charge Estimator</h1>
<p>Estimate refrigerant charge from line length and diameter. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Line length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dia">Liquid line dia</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.375"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-suc">Suction line dia</label><input type="text" id="in-suc" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenEl=document.getElementById("in-len"),diaEl=document.getElementById("in-dia"),sucEl=document.getElementById("in-suc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lenEl.value),D=pn(diaEl.value),S=pn(sucEl.value);
if(L==null||D==null||S==null)return;
if(!isFinite(L)||!isFinite(D)||!isFinite(S)||L<=0||D<=0||S<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var liqVol=Math.PI*Math.pow(D/2,2)*L*12/231;
var sucVol=Math.PI*Math.pow(S/2,2)*L*12/231;
var liqCharge=liqVol*9;
var sucCharge=sucVol*0.2;
var total=liqCharge+sucCharge;
var html='<div class="big">'+rnd(total,1)+' lb</div>';
html+=row("Liquid line volume",rnd(liqVol,3)+" gal");
html+=row("Suction line volume",rnd(sucVol,3)+" gal");
html+=row("Liquid charge",rnd(liqCharge,1)+" lb");
html+=row("Vapor charge",rnd(sucCharge,1)+" lb");
html+=row("Total estimated charge",rnd(total,1)+" lb");
out.innerHTML=html;
}
[lenEl,diaEl,sucEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
