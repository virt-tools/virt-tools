<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Concrete Washout Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-2824399c.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Concrete Washout Calculator</h1>
<p>Calculate the size of a concrete washout area based on truck capacity and number of pours. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Truck capacity</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">cubic yards</div></div>
<div class="field"><label class="f" for="in-n">Number of pours</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">pours</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tEl=document.getElementById("in-t"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var T=pn(tEl.value),N=pn(nEl.value);
if(T==null||N==null)return;
if(!isFinite(T)||T<=0||!isFinite(N)||N<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var washoutPerPour=T*0.1;
var totalVol=washoutPerPour*N;
var areaSqFt=totalVol*27/1.5;
var html='<div class="big">'+rnd(areaSqFt,0)+' sq ft</div>';
html+=row("Washout per pour",rnd(washoutPerPour,2)+' cu yd');
html+=row("Total volume",rnd(totalVol,2)+' cu yd');
html+=row("Area (18in depth)",rnd(areaSqFt,0)+' sq ft');
out.innerHTML=html;
}
[tEl,nEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
