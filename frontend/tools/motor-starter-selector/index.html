<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Motor Starter Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Motor Starter Selector</h1>
<p>Select NEMA motor starter size from motor horsepower and voltage. Runs locally in yourpublisher.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-hp">Motor HP</label><input type="text" id="in-hp" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">horsepower</div></div>
<div class="field"><label class="f" for="in-vol">Voltage</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 230"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter horsepower and voltage.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hpEl=document.getElementById("in-hp"),volEl=document.getElementById("in-vol"),err=document.getElementById("err"),out=document.getElementById("out");
var nemaTable=[
{size:0,max10at230:1.5,max10at460:2},{size:1,max10at230:3,max10at460:5},
{size:2,max10at230:7.5,max10at460:10},{size:3,max10at230:15,max10at460:25},
{size:4,max10at230:25,max10at460:40},{size:5,max10at230:50,max10at460:75}
];
function calc(){
var hp=pn(hpEl.value),V=pn(volEl.value);
if(hp==null||V==null)return;
if(!isFinite(hp)||!isFinite(V)||hp<=0||V<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var use460=V>300;
var chosen=nemaTable[0];
for(var i=0;i<nemaTable.length;i++){
var cap=use460?nemaTable[i].max10at460:nemaTable[i].max10at230;
if(hp<=cap){chosen=nemaTable[i];break}
chosen=nemaTable[i];
}
var flc=hp*746/(V*0.85*0.88);
var html='<div class="big">NEMA Size '+chosen.size+'</div>';
html+=row("Motor HP",rnd(hp,1)+" hp");
html+=row("Voltage",rnd(V,0)+" V");
html+=row("Phase","3-phase");
html+=row("NEMA starter size",chosen.size);
html+=row("Max at this voltage",rnd(use460?chosen.max10at460:chosen.max10at230,1)+" hp");
html+=row("Est. full-load current",rnd(flc,1)+" A");
out.innerHTML=html;
}
[hpEl,volEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
