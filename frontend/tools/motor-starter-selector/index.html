<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Motor Starter Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Motor Starter Selector</h1>
<p>Select NEMA motor starter size from motor horsepower and voltage. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-hp">Motor HP</label><input type="text" id="in-hp" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">horsepower</div></div>
<div class="field"><label class="f" for="in-vol">Voltage</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 230"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter horsepower and voltage.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hpEl=document.getElementById("in-hp"),volEl=document.getElementById("in-vol"),err=document.getElementById("err"),out=document.getElementById("out");
var nemaTable=[
{size:"00",max10at230:1.5,max10at460:2},{size:"0",max10at230:3,max10at460:5},
{size:1,max10at230:7.5,max10at460:10},{size:2,max10at230:15,max10at460:25},
{size:3,max10at230:30,max10at460:50},{size:4,max10at230:50,max10at460:75},
{size:5,max10at230:100,max10at460:150},{size:6,max10at230:200,max10at460:300}
];
function calc(){
var hp=pn(hpEl.value),V=pn(volEl.value);
if(hp==null||V==null)return;
if(!isFinite(hp)||!isFinite(V)||hp<=0||V<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var use460=V>300;
var chosen=null;
for(var i=0;i<nemaTable.length;i++){
var cap=use460?nemaTable[i].max10at460:nemaTable[i].max10at230;
if(hp<=cap){chosen=nemaTable[i];break}
}
if(!chosen){err.textContent="Horsepower exceeds the largest listed NEMA starter size (Size 6).";return}
var flc=hp*746/(Math.sqrt(3)*V*0.85*0.88);
var html='<div class="big">NEMA Size '+chosen.size+'</div>';
html+=row("Motor HP",rnd(hp,1)+" hp");
html+=row("Voltage",rnd(V,0)+" V");
html+=row("Phase","3-phase");
html+=row("NEMA starter size",chosen.size);
html+=row("Max at this voltage",rnd(use460?chosen.max10at460:chosen.max10at230,1)+" hp");
html+=row("Est. full-load current",rnd(flc,1)+" A");
out.innerHTML=html;
}
[hpEl,volEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
