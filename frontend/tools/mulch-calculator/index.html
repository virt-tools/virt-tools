<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulch Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Mulch Calculator</h1>
<p class="subtitle">Estimate mulch bags or cubic yards needed for any garden bed.</p>
<div class="input-section">
<label>Bed Length (ft)</label>
<input type="number" id="len" value="20" min="0" aria-label="Len">
<label>Bed Width (ft)</label>
<input type="number" id="wid" value="10" min="0" aria-label="Wid">
<label>Desired Depth (in)</label>
<input type="number" id="dep" value="3" min="0" step="0.5" aria-label="Dep">
<label>Bag Size (cu ft)</label>
<select id="bag" aria-label="Bag"><option value="2">2 cu ft</option><option value="1.5">1.5 cu ft</option><option value="3">3 cu ft</option></select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const D=parseFloat(document.getElementById('dep').value)||0;
const B=parseFloat(document.getElementById('bag').value);
const area=L*W;
const cf=area*(D/12);
const cy=cf/27;
const bags=Math.ceil(cf/B);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Bed Area:</span><span>${area.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>Mulch Volume:</span><span>${cf.toFixed(1)} cu ft</span></div>
<div class="result-row"><span>Cubic Yards:</span><span>${cy.toFixed(2)} cu yd</span></div>
<div class="result-row"><span>Bagged (${B} cu ft):</span><span>${bags} bags</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
