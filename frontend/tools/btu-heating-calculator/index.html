<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>BTU Heating Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>BTU Heating Calculator</h1>
<p>Calculate required heating BTU from room size, insulation, and temperature difference. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Room area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-h">Ceiling height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dt">Temp difference</label><input type="text" id="in-dt" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">°F</div></div>
<div class="field"><label class="f" for="in-ins">Insulation factor</label><input type="text" id="in-ins" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">U-value</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var areaEl=document.getElementById("in-area"),hEl=document.getElementById("in-h"),dtEl=document.getElementById("in-dt"),insEl=document.getElementById("in-ins"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(areaEl.value),H=pn(hEl.value),DT=pn(dtEl.value),U=pn(insEl.value);
if(A==null||H==null||DT==null||U==null)return;
if(!isFinite(A)||!isFinite(H)||!isFinite(DT)||!isFinite(U)||A<=0||H<=0||DT<=0||U<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vol=A*H;
var envelopeArea=A+2*(A*Math.sqrt(1)+H*Math.sqrt(A));
var heatLoss=U*envelopeArea*DT;
var infiltration=0.018*vol*DT;
var total=heatLoss+infiltration;
var html='<div class="big">'+rnd(total,0)+' BTU/hr</div>';
html+=row("Room volume",rnd(vol,0)+" cu ft");
html+=row("Envelope heat loss",rnd(heatLoss,0)+" BTU/hr");
html+=row("Infiltration loss",rnd(infiltration,0)+" BTU/hr");
html+=row("Total heating load",rnd(total,0)+" BTU/hr");
html+=row("Recommended heater",rnd(total*1.3,0)+" BTU/hr (30% safety)");
out.innerHTML=html;
}
[areaEl,hEl,dtEl,insEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
