<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Noise Figure Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Noise Figure Calculator</h1>
<p>Calculate cascaded noise figure using Friis formula for two-stage receiver. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-nf1">Stage 1 NF</label><input type="text" id="in-nf1" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">dB</div></div>
<div class="field"><label class="f" for="in-g1">Stage 1 gain</label><input type="text" id="in-g1" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">dB</div></div>
<div class="field"><label class="f" for="in-nf2">Stage 2 NF</label><input type="text" id="in-nf2" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dB</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nf1E=document.getElementById("in-nf1"),g1E=document.getElementById("in-g1"),nf2E=document.getElementById("in-nf2"),out=document.getElementById("out");
function calc(){
var nf1=parseFloat(nf1E.value),g1=parseFloat(g1E.value),nf2=parseFloat(nf2E.value);
if(isNaN(nf1)||isNaN(g1)||isNaN(nf2))return;
var F1=Math.pow(10,nf1/10);
var G1=Math.pow(10,g1/10);
var F2=Math.pow(10,nf2/10);
var F=F1+(F2-1)/G1;
var NF=10*Math.log10(F);
var html='<div class="big">'+(Math.round(NF*100)/100)+' dB</div>';
html+=row("Cascaded NF",Math.round(NF*100)/100+' dB');
html+=row("Stage 1 contribution",nf1+' dB');
html+=row("Stage 2 contribution",(10*Math.log10((F2-1)/G1)).toFixed(2)+' dB');
out.innerHTML=html;
}
[nf1E,g1E,nf2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
