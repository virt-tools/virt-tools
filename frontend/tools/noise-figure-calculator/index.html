<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Noise Figure Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Noise Figure Calculator</h1>
<p>Calculate cascaded noise figure using Friis formula for two-stage receiver. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-nf1">Stage 1 NF</label><input type="text" id="in-nf1" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">dB</div></div>
<div class="field"><label class="f" for="in-g1">Stage 1 gain</label><input type="text" id="in-g1" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">dB</div></div>
<div class="field"><label class="f" for="in-nf2">Stage 2 NF</label><input type="text" id="in-nf2" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dB</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nf1E=document.getElementById("in-nf1"),g1E=document.getElementById("in-g1"),nf2E=document.getElementById("in-nf2"),out=document.getElementById("out");
function msg(t){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">'+t+'</span>';}
function calc(){
var nf1=parseFloat(nf1E.value),g1=parseFloat(g1E.value),nf2=parseFloat(nf2E.value);
if(isNaN(nf1)||isNaN(g1)||isNaN(nf2)){msg("Enter values to calculate.");return;}
if(!isFinite(nf1)||!isFinite(g1)||!isFinite(nf2)){msg("Values are too large.");return;}
if(nf1<0||nf2<0){msg("Noise figure cannot be negative (dB).");return;}
var F1=Math.pow(10,nf1/10);
var G1=Math.pow(10,g1/10);
var F2=Math.pow(10,nf2/10);
var F=F1+(F2-1)/G1;
var NF=10*Math.log10(F);
if(!isFinite(F)||!isFinite(NF)){msg("Values are too large.");return;}
var c2=(F2-1)/G1;
var html='<div class="big">'+(Math.round(NF*100)/100)+' dB</div>';
html+=row("Cascaded NF",Math.round(NF*100)/100+' dB');
html+=row("Stage 1 contribution",nf1+' dB');
html+=row("Stage 2 contribution",(c2>0?(10*Math.log10(c2)).toFixed(2):'-∞')+' dB');
out.innerHTML=html;
}
[nf1E,g1E,nf2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
