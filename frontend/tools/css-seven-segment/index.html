<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Seven-Segment Display Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔢 CSS Seven-Segment Display Generator</h1>
<p>Create CSS seven-segment LED digit display. Adjustable digits, colors, size. Copy HTML+CSS+JS.</p>
<div class="controls">
<div class="ctrl-row"><label>Value</label><input type="text" id="value" value="1234" style="width:200px" maxlength="6" aria-label="Value"></div>
<div class="ctrl-row"><label>On Color</label><input type="color" id="onColor" value="#ff3333" aria-label="On Color"></div>
<div class="ctrl-row"><label>Off Color</label><input type="color" id="offColor" value="#330000" aria-label="Off Color"></div>
<div class="ctrl-row"><label>Background</label><input type="color" id="bgColor" value="#1a0a0a" aria-label="Bg Color"></div>
<div class="ctrl-row"><label>Digit Size</label><select id="dsize" aria-label="Dsize"><option value="40">Small</option><option value="60" selected>Medium</option><option value="90">Large</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
<h2>JS</h2><div class="output-block"><textarea id="jsOut" readonly aria-label="Js Out"></textarea><button class="copy-btn" onclick="copyText('jsOut')" type="button">Copy JS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var SEG={
'0':'1111110','1':'0110000','2':'1101101','3':'1111001','4':'0110011',
'5':'1011011','6':'1011111','7':'1110000','8':'1111111','9':'1111011',
' ':'0000000','-':'0000001'
};
function update(){
var val=document.getElementById('value').value||'1234';
var oc=document.getElementById('onColor').value;
var fc=document.getElementById('offColor').value;
var bc=document.getElementById('bgColor').value;
var sz=parseInt(document.getElementById('dsize').value);
var w=sz; var h=sz*1.6;
var tw=Math.max(w*0.15,4); var th=Math.max(h*0.2,6);
var html='<div class="seven-seg" id="ss"></div>';
var css='.seven-seg{display:flex;gap:'+(w*0.1)+'px;background:'+bc+';padding:'+(w*0.2)+'px;border-radius:8px}\n';
css+='.ss-digit{position:relative;width:'+w+'px;height:'+h+'px}\n';
css+='.seg{position:absolute;background:'+fc+';opacity:0.15;border-radius:2px;transition:opacity 0.2s}\n';
css+='.seg.on{background:'+oc+';opacity:1;box-shadow:0 0 '+(tw*0.5)+'px '+oc+'}\n';
// horizontal segments (a,d,g)
css+='.seg-a{top:0;left:'+tw+'px;width:'+(w-2*tw)+'px;height:'+th+'px}\n';
css+='.seg-d{bottom:0;left:'+tw+'px;width:'+(w-2*tw)+'px;height:'+th+'px}\n';
css+='.seg-g{top:50%;left:'+tw+'px;width:'+(w-2*tw)+'px;height:'+th+'px;transform:translateY(-50%)}\n';
// vertical segments (b,c,e,f)
css+='.seg-b{top:'+th+'px;right:0;width:'+tw+'px;height:'+(h/2-1.5*th)+'px}\n';
css+='.seg-c{bottom:'+th+'px;right:0;width:'+tw+'px;height:'+(h/2-1.5*th)+'px}\n';
css+='.seg-e{bottom:'+th+'px;left:0;width:'+tw+'px;height:'+(h/2-1.5*th)+'px}\n';
css+='.seg-f{top:'+th+'px;left:0;width:'+tw+'px;height:'+(h/2-1.5*th)+'px}\n';
var js='var SEG='+JSON.stringify(SEG)+';\n';
js+='var val='+JSON.stringify(val)+';\n';
js+='var ss=document.getElementById("ss");\n';
js+='var segs=["a","b","c","d","e","f","g"];\n';
js+='val.split("").forEach(function(ch){\n';
js+='  var pat=SEG[ch]||SEG[" "];\n';
js+='  var d=document.createElement("div");\n';
js+='  d.className="ss-digit";\n';
js+='  for(var i=0;i<7;i++){\n';
js+='    var s=document.createElement("div");\n';
js+='    s.className="seg seg-"+segs[i]+(pat[i]==="1"?" on":"");\n';
js+='    d.appendChild(s);\n';
js+='  }\n';
js+='  ss.appendChild(d);\n';
js+='});';
// render preview
var pv=document.getElementById('preview');
pv.innerHTML='<style>'+css+'</style><div class="seven-seg" id="ss"></div>';
val.split('').forEach(function(ch){
var pat=SEG[ch]||SEG[' '];
var segs=['a','b','c','d','e','f','g'];
var d=document.createElement('div');d.className='ss-digit';
for(var i=0;i<7;i++){
var s=document.createElement('div');
s.className='seg seg-'+segs[i]+(pat[i]==='1'?' on':'');
d.appendChild(s);
}
pv.querySelector('#ss').appendChild(d);
});
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('jsOut').value=js;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['value','onColor','offColor','bgColor','dsize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
