<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Insulation Batt Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Insulation Batt Estimator</h1>
<p>Calculate the number of insulation batts needed from wall/ceiling area, stud spacing, and batt dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Wall/ceiling area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-bw">Batt width</label><input type="text" id="in-bw" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.6"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-bl">Batt length</label><input type="text" id="in-bl" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter area and batt size.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),bwEl=document.getElementById("in-bw"),blEl=document.getElementById("in-bl"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),BW=pn(bwEl.value),BL=pn(blEl.value),WS=pn(wsEl.value);
if(A==null||BW==null||BL==null){return}
if(!isFinite(A)||!isFinite(BW)||!isFinite(BL)||A<=0||BW<=0||BL<=0){err.textContent="All values must be positive.";return}
WS=WS==null?10:WS;
if(!isFinite(WS)||WS<0){err.textContent="Waste must be non-negative.";return}
err.textContent="";
var battArea=BW*BL;
var batts=Math.ceil(A/battArea);
var total=Math.ceil(batts*(1+WS/100));
var html='<div class="big">'+total+' batts</div>';
html+=row("Area to insulate",rnd(A,1)+" m²");
html+=row("Batt size",rnd(BW,2)+" × "+rnd(BL,2)+" m");
html+=row("Batts needed",batts);
html+=row("With "+rnd(WS,0)+"% waste",total);
out.innerHTML=html;
}
[aEl,bwEl,blEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
