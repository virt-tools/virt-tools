<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Tiler — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Tiler</h1>
<p class="subtitle">Tile an image into a seamless repeating pattern canvas. Adjustable rows and columns. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Rows: <input type="number" id="rows" value="3" min="1" max="20" style="width:60px"></label>
<label>Cols: <input type="number" id="cols" value="4" min="1" max="20" style="width:60px"></label>
<button onclick="render()" type="button">Create</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){img=new Image();img.src=URL.createObjectURL(this.files[0]);img.onload=render;});
function render(){
if(!img)return;var r=parseInt(document.getElementById('rows').value),c=parseInt(document.getElementById('cols').value);
var tw=img.naturalWidth,th=img.naturalHeight;
var cv=document.getElementById('canvas');cv.width=tw*c;cv.height=th*r;
var ctx=cv.getContext('2d');
for(var i=0;i<r*c;i++){var row=Math.floor(i/c),col=i%c;ctx.drawImage(img,col*tw,row*th,tw,th);}
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='tiled.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
