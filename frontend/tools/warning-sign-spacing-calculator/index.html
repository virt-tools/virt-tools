<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Warning Sign Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-ce7ea5a8.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Warning Sign Spacing Calculator</h1>
<p>Calculate advance warning sign placement distance before a work zone based on speed limit and road type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-s">Speed limit</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 55"><div class="unit">mph</div></div>
<div class="field"><label class="f" for="in-t">Road type</label><select id="in-t"><option value="">Select…</option><option value="urban">Urban ( congested)</option><option value="rural">Rural</option><option value="highway">Highway / freeway</option></select><div class="unit">road type</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sEl=document.getElementById("in-s"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var S=pn(sEl.value),T=tEl.value;
if(S==null||!T)return;
if(!isFinite(S)||S<=0){err.textContent="Enter valid speed.";return}
err.textContent="";
var dA,dB,dC;
if(T==="urban"){dA=100;dC=100}
else if(T==="rural"){dA=500;dC=500}
else{dA=1000;dC=1000}
var total=dA+dC;
var html='<div class="big">'+dA+' ft</div>';
html+=row("Sign A distance",dA+' ft');
html+=row("Sign C distance",dC+' ft');
html+=row("Total advance",total+' ft');
html+=row("Speed limit",S+' mph');
out.innerHTML=html;
}
[sEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
