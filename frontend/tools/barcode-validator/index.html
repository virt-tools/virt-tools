<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.barcode-validator{max-width:700px;margin:0 auto;padding:2rem 1rem}
.barcode-validator h1{font-size:2rem;margin-bottom:.5rem}
.barcode-validator .sub{color:#888;margin-bottom:1.5rem}
.barcode-validator input{width:100%;font-size:16px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.barcode-validator .btn{margin-top:1rem;padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.barcode-validator .result{margin-top:1.5rem;padding:1.5rem;border-radius:12px;border:2px solid var(--border)}
.barcode-validator .valid{border-color:#4ade80;background:rgba(74,222,128,.08)}
.barcode-validator .invalid{border-color:#f87171;background:rgba(248,113,113,.08)}
.barcode-validator .badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:8px}
.barcode-validator .badge.valid{background:#4ade80;color:#fff}
.barcode-validator .badge.invalid{background:#f87171;color:#fff}
.barcode-validator .info{font-size:14px;line-height:1.8}
.barcode-validator .info strong{display:inline-block;width:100px}
.barcode-validator .types{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.barcode-validator .type{padding:4px 10px;border-radius:6px;background:var(--card-bg);border:1px solid var(--border);font-size:12px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="barcode-validator">
<h1>📊 Barcode Validator</h1>
<p class="sub">Validate EAN-8, EAN-13, UPC-A, and GTIN-14 barcodes with check digit verification.</p>
<input id="input" placeholder="Enter barcode number (e.g. 4006381333931)" / aria-label="Enter Barcode Number (E.G. 4006381333931)">
<button class="btn" id="check" type="button">Validate</button>
<div class="result" id="result" style="display:none"></div>
<div class="types" style="margin-top:1rem">
<span class="type">EAN-8 (8 digits)</span>
<span class="type">EAN-13 (13 digits)</span>
<span class="type">UPC-A (12 digits)</span>
<span class="type">GTIN-14 (14 digits)</span>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const checkBtn=document.getElementById('check');
const result=document.getElementById('result');

function checkDigit12or13(digits){
  let sum=0;
  for(let i=0;i<digits.length-1;i++){
    const weight=(i%2===0)?3:1;
    sum+=digits[i]*weight;
  }
  const check=(10-(sum%10))%10;
  return check===digits[digits.length-1];
}
function checkDigit14(digits){
  let sum=0;
  for(let i=0;i<digits.length-1;i++){
    const weight=(i%2===0)?3:1;
    sum+=digits[i]*weight;
  }
  const check=(10-(sum%10))%10;
  return check===digits[digits.length-1];
}
function checkDigit8(digits){
  let sum=0;
  for(let i=0;i<digits.length-1;i++){
    const weight=(i%2===0)?3:1;
    sum+=digits[i]*weight;
  }
  const check=(10-(sum%10))%10;
  return check===digits[digits.length-1];
}

function validate(code){
  const cleaned=code.replace(/\D/g,'');
  if(!cleaned.length)return{valid:false,error:'Enter a barcode number'};
  const digits=cleaned.split('').map(Number);
  const len=digits.length;
  let type,valid=false;
  if(len===8){type='EAN-8';valid=checkDigit8(digits);}
  else if(len===12){type='UPC-A';valid=checkDigit12or13(digits);}
  else if(len===13){type='EAN-13';valid=checkDigit12or13(digits);}
  else if(len===14){type='GTIN-14';valid=checkDigit14(digits);}
  else return{valid:false,error:'Invalid length. Supported: 8, 12, 13, or 14 digits. Got '+len};
  return{valid,type,checkDigit:digits[digits.length-1],body:cleaned.slice(0,-1)};
}

checkBtn.addEventListener('click',()=>{
  const r=validate(input.value);
  result.style.display='block';
  if(r.valid){
    result.className='result valid';
    result.innerHTML='<span class="badge valid">VALID</span><div class="info"><strong>Type:</strong>'+r.type+'<br><strong>Body:</strong>'+r.body+'<br><strong>Check digit:</strong>'+r.checkDigit+'<br><strong>Full:</strong>'+input.value.replace(/\D/g,'')+'</div>';
  }else{
    result.className='result invalid';
    result.innerHTML='<span class="badge invalid">INVALID</span><div class="info">'+(r.error||'Check digit mismatch')+'</div>';
  }
});
input.addEventListener('keydown',e=>{if(e.key==='Enter')checkBtn.click();});
})();
</script>
</body>
</html>
