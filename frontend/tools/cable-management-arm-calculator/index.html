<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cable Management Arm Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cable Management Arm Calculator</h1>
<p>Calculate cable arm reach, minimum bend radius, and cable bundle capacity from rack depth and cable diameter. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rd">Rack depth</label><input type="text" id="in-rd" inputmode="decimal" autocomplete="off" placeholder="e.g. 42"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-sl">Slide length</label><input type="text" id="in-sl" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-cd">Cable diameter</label><input type="text" id="in-cd" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-cn">Cable count</label><input type="text" id="in-cn" inputmode="numeric" autocomplete="off" placeholder="e.g. 8"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rdEl=document.getElementById("in-rd"),slEl=document.getElementById("in-sl"),cdEl=document.getElementById("in-cd"),cnEl=document.getElementById("in-cn"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RD=parseFloat(rdEl.value),SL=parseFloat(slEl.value),CD=parseFloat(cdEl.value),CN=parseInt(cnEl.value);
if(isNaN(RD)||isNaN(SL)||isNaN(CD)||isNaN(CN))return;
if(RD<=0||SL<=0||CD<=0||CN<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var armReach=RD-SL;
var minBend=CD*8; // 8x diameter minimum bend radius
var bundleWidth=CD*Math.ceil(Math.sqrt(CN)); // approx bundle width
var html='<div class="big">'+Math.round(armReach*10)/10+' in</div>';
html+=row("Arm reach needed",Math.round(armReach*10)/10+" in");
html+=row("Min bend radius",Math.round(minBend*100)/100+" in");
html+=row("Min bend diameter",Math.round(minBend*2*100)/100+" in");
html+=row("Cable count",CN);
html+=row("Bundle width",Math.round(bundleWidth*100)/100+" in");
out.innerHTML=html;
}
[rdEl,slEl,cdEl,cnEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
