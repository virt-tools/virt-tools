<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Phoenix Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#4a1a0a,#1a0a0a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔥 CSS Phoenix Generator</h1>
<p>Create CSS phoenix with body, wings, tail feathers, and flame glow. 3 poses. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Pose</label><select id="pose" aria-label="Pose"><option value="rising">Rising</option><option value="perched">Perched</option><option value="soaring">Soaring</option></select></div>
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#ff6f00" style="width:60px;height:36px" aria-label="Body Color"></div>
<div class="ctrl-row"><label>Wing Color</label><input type="color" id="wingColor" value="#e65100" style="width:60px;height:36px" aria-label="Wing Color"></div>
<div class="ctrl-row"><label>Glow</label><select id="glow" aria-label="Glow"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="280" value="200" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var pose=document.getElementById('pose').value;
var bc=document.getElementById('bodyColor').value;
var wc=document.getElementById('wingColor').value;
var glow=document.getElementById('glow').value;
var sz=parseInt(document.getElementById('size').value);
var bw=sz*0.4,bh=sz*0.3,hd=sz*0.2;
var html='<div class="phoenix p-'+pose+'">\n  <div class="wing w-left"></div>\n  <div class="wing w-right"></div>\n  <div class="body"></div>\n  <div class="head"><div class="beak"></div><div class="crest"></div></div>\n  <div class="tail">\n    <div class="feather f1"></div><div class="feather f2"></div><div class="feather f3"></div>\n  </div>\n</div>';
var css='.phoenix{position:relative;display:flex;align-items:center;justify-content:center}\n';
if(glow==='on'){css+='.phoenix{filter:drop-shadow(0 0 20px '+bc+')}\n'}
var rot='0';
if(pose==='rising'){rot='-10deg'}else if(pose==='soaring'){rot='-25deg'}
css+='.phoenix.p-'+pose+'{transform:rotate('+rot+')}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:radial-gradient(ellipse at 40% 30%,'+bc+','+wc+');border-radius:50% 60% 50% 50%;position:relative;z-index:2}\n';
css+='.head{width:'+hd+'px;height:'+(hd*0.85)+'px;background:linear-gradient(135deg,'+bc+','+wc+');border-radius:50% 30% 40% 50%;position:absolute;left:-'+(hd*0.4)+'px;top:-'+(hd*0.25)+'px;z-index:3}\n';
css+='.beak{position:absolute;left:-'+(hd*0.2)+'px;top:35%;width:'+(hd*0.25)+'px;height:'+(hd*0.15)+'px;background:#ffc107;clip-path:polygon(0 50%,100% 0,100% 100%)}\n';
css+='.crest{position:absolute;top:-'+(hd*0.25)+'px;left:30%;width:'+(hd*0.12)+'px;height:'+(hd*0.3)+'px;background:'+bc+';clip-path:polygon(50% 0,0 100%,100% 100%)}\n';
css+='.wing{position:absolute;width:'+(sz*0.45)+'px;height:'+(sz*0.3)+'px;z-index:1;clip-path:polygon(0 50%,40% 0,100% 20%,85% 100%,20% 80%);background:linear-gradient(135deg,'+bc+','+wc+',#b71c1c)}\n';
css+='.w-left{left:-'+(sz*0.1)+'px;top:-'+(sz*0.08)+'px;transform:rotate(-30deg)}\n';
css+='.w-right{right:-'+(sz*0.1)+'px;top:-'+(sz*0.08)+'px;transform:rotate(30deg) scaleX(-1)}\n';
if(pose==='soaring'){css+='.w-left{transform:rotate(-60deg) translateY(-20px)}.w-right{transform:rotate(60deg) translateY(-20px) scaleX(-1)}\n'}
css+='.tail{position:absolute;right:-'+(sz*0.15)+'px;top:60%;width:'+(sz*0.2)+'px;height:'+(sz*0.15)+'px;z-index:1}\n';
css+='.feather{position:absolute;width:'+(sz*0.08)+'px;height:'+(sz*0.2)+'px;background:linear-gradient(180deg,'+bc+','+wc+');clip-path:polygon(50% 0,0 100%,100% 100%);top:0}\n';
css+='.f1{left:0;transform:rotate(-15deg)}.f2{left:30%}.f3{left:60%;transform:rotate(15deg)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['pose','bodyColor','wingColor','glow','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
