<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Tax Estimator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.it{max-width:550px;margin:0 auto;padding:2rem 1rem}
.it h1{font-size:2rem;margin-bottom:.5rem}
.it .sub{color:#888;margin-bottom:1.5rem}
.it label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.it select,.it input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.it .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.it .results{margin-top:2rem}
.it .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.it .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.it .res-card .lbl{color:#888;font-size:13px}
.it .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.it .disc{font-size:12px;color:#aaa;margin-top:1rem;line-height:1.5}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="it">
<h1>📊 Income Tax Estimator</h1>
<p class="sub">2024 US federal income tax estimate (single/married). Educational only, not financial advice.</p>
<label for="income">Annual gross income ($):</label>
<input type="number" id="income" value="75000" min="0" oninput="calc()">
<label for="status">Filing status:</label>
<select id="status" onchange="calc()">
<option value="single">Single</option>
<option value="married">Married Filing Jointly</option>
</select>
<label for="deductions">Standard deduction ($):</label>
<input type="number" id="deductions" value="14600" min="0" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Estimate</button>
<div class="results" id="results"></div>
<p class="disc">⚠️ Simplified estimate using 2024 federal brackets only. Excludes state tax, credits, FICA, and other adjustments. Not financial advice.</p>
</main>
<script src="/assets/app.js"></script>
<script>
const brackets2024={
  single:[[0,0.10,11600],[11600,0.12,47150],[47150,0.22,100525],[100525,0.24,191950],[191950,0.32,243725],[243725,0.35,609350],[609350,0.37,Infinity]],
  married:[[0,0.10,23200],[23200,0.12,94300],[94300,0.22,201050],[201050,0.24,383900],[383900,0.32,487450],[487450,0.35,731200],[731200,0.37,Infinity]]
};
function calc(){
  const income=parseFloat(document.getElementById('income').value)||0;
  const status=document.getElementById('status').value;
  const deductions=parseFloat(document.getElementById('deductions').value)||0;
  const taxable=Math.max(0,income-deductions);
  const brackets=brackets2024[status];
  let tax=0;
  for(const [lo,rate,hi] of brackets){
    if(taxable>lo){
      tax+=(Math.min(taxable,hi)-lo)*rate;
    }
  }
  const effectiveRate=income>0?(tax/income*100):0;
  const marginalRate=brackets.filter(b=>b[0]<taxable).pop()[1]*100;
  const takeHome=income-tax;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Taxable Income</div><div class="big" style="color:#27ae60">$'+taxable.toLocaleString()+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Federal Tax</div><div class="big" style="color:#e74c3c">$'+tax.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='</div>';
  html+='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Effective Rate</div><div class="big">'+effectiveRate.toFixed(2)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Marginal Rate</div><div class="big">'+marginalRate+'%</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Estimated Take-Home</div><div class="big" style="color:#27ae60">$'+takeHome.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
