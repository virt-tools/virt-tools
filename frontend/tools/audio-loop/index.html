<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Looper — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Looper</h1>
<p class="subtitle">Loop any audio file N times and export as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Loops: <input type="number" id="loops" value="3" min="1" max="100"></label>
<button id="process" class="primary-btn" type="button">Loop & Download</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const n=+document.getElementById('loops').value;
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const totalLen=Math.ceil(buf.length*n);
const out=audioCtx.createBuffer(buf.numberOfChannels,totalLen,buf.sampleRate);
for(let ch=0;ch<buf.numberOfChannels;ch++){
const sd=buf.getChannelData(ch);
const dd=out.getChannelData(ch);
for(let i=0;i<n;i++){dd.set(sd,i*buf.length);}
}
const wav=audioBufferToWav(out);
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));
a.download='looped.wav';a.click();
audioCtx.close();
function audioBufferToWav(buf){
const numCh=buf.numberOfChannels,sr=buf.sampleRate;
const len=buf.length*2*numCh;
const arr=new ArrayBuffer(44+len);
const v=new DataView(arr);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+len,true);ws(8,'WAVE');
ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
v.setUint16(22,numCh,true);v.setUint32(24,sr,true);
v.setUint32(28,sr*numCh*2,true);v.setUint16(32,numCh*2,true);
v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,len,true);
let off=44;
for(let i=0;i<buf.length;i++){
for(let ch=0;ch<numCh;ch++){
const s=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));
v.setInt16(off,s<0?s*32768:s*32767,true);off+=2;
}
}
return arr;
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
