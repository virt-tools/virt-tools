<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gate Latch Height Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gate Latch Height Calculator</h1>
<p>Determine gate latch mounting height from gate height and user type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-g">Gate height</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-u">User reach (1-3)</label><input type="text" id="in-u" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">1=child 3=adult</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var gEl=document.getElementById("in-g"),uEl=document.getElementById("in-u"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var G=pn(gEl.value),U=pn(uEl.value);
if(G==null||U==null)return;
if(!isFinite(G)||!isFinite(U)||G<=0||U<1||U>3){err.textContent="Enter valid values (user 1-3).";return}
err.textContent="";
var reachH=[36,48,60][Math.ceil(U)-1];
var latchH=Math.min(reachH,G*12-6);
if(latchH<=0){err.textContent="Gate is too short to mount a latch at a reachable height.";return}
var html='<div class="big">'+rnd(latchH,0)+' in</div>';
html+=row("Gate height",rnd(G,1)+' ft');
html+=row("User type",['Child','Teen','Adult'][Math.ceil(U)-1]);
html+=row("Reach height",reachH+' in');
html+=row("Latch height",rnd(latchH,0)+' in');
out.innerHTML=html;
}
[gEl,uEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
