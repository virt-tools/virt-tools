<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rod Stiffness Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rod Stiffness Calculator</h1>
<p>Calculate axial stiffness, deflection under load, and natural frequency for threaded rod hangers from rod diameter and length. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Rod diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-l">Rod length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-load">Applied load</label><input type="text" id="in-load" inputmode="numeric" autocomplete="off" placeholder="e.g. 200"><div class="unit">lb</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),loadEl=document.getElementById("in-load"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=parseFloat(dEl.value),L=parseFloat(lEl.value),LD=parseInt(loadEl.value);
if(isNaN(D)||isNaN(L)||isNaN(LD))return;
if(D<=0||L<=0||LD<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var E=29e6;
var area=Math.PI*D*D/4;
var stiffness=E*area/L;
var deflection=LD/stiffness;
var natFreq=Math.sqrt(stiffness/(LD/386))/(2*Math.PI);
var html='<div class="big">'+Math.round(stiffness)+' lb/in</div>';
html+=row("Axial stiffness",Math.round(stiffness)+" lb/in");
html+=row("Deflection",Math.round(deflection*10000)/10000+" in");
html+=row("Cross-section area",Math.round(area*10000)/10000+" in²");
html+=row("Natural freq",Math.round(natFreq*10)/10+" Hz");
out.innerHTML=html;
}
[dEl,lEl,loadEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
