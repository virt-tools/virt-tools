<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Shadow Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Shadow Generator</h1>
<p class="subtitle">Add drop shadows to images with adjustable blur, offset, and color. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Blur: <input type="number" id="blur" value="20" min="0" max="100" style="width:60px">px</label>
<label>X: <input type="number" id="ox" value="10" min="-100" max="100" style="width:50px">px</label>
<label>Y: <input type="number" id="oy" value="10" min="-100" max="100" style="width:50px">px</label>
<label>Color: <input type="color" id="sc" value="#000000"></label>
<label>Opacity: <input type="range" id="op" value="50" min="0" max="100" style="width:80px"></label>
<button onclick="render()" type="button">Apply</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){img=new Image();img.src=URL.createObjectURL(this.files[0]);img.onload=render;});
function render(){
if(!img)return;var b=parseInt(document.getElementById('blur').value),ox=parseInt(document.getElementById('ox').value),oy=parseInt(document.getElementById('oy').value),op=document.getElementById('op').value/100;
var pad=b+Math.max(0,ox)+Math.max(0,oy)+20;
var cv=document.getElementById('canvas');cv.width=img.naturalWidth+pad*2;cv.height=img.naturalHeight+pad*2;
var ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
ctx.save();ctx.shadowBlur=b;ctx.shadowOffsetX=ox;ctx.shadowOffsetY=oy;
ctx.shadowColor=document.getElementById('sc').value;ctx.globalAlpha=op;
ctx.drawImage(img,pad,pad);ctx.restore();
ctx.globalAlpha=1;ctx.drawImage(img,pad,pad);
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='shadowed.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
