<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appliance Energy Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Appliance Energy Calculator</h1>
<p class="subtitle">Estimate annual energy usage and cost for multiple appliances.</p>
<div class="input-section">
<h3>Add Appliances</h3>
<div id="appliances">
<div class="appliance-row">
<input type="text" placeholder="Name" class="name" value="Refrigerator" aria-label="Name">
<input type="number" placeholder="Watts" class="watts" value="150" min="0" aria-label="Watts">
<input type="number" placeholder="Hours/day" class="hours" value="24" min="0" step="0.5" aria-label="Hours/Day">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
<div class="appliance-row">
<input type="text" placeholder="Name" class="name" value="AC" aria-label="Name">
<input type="number" placeholder="Watts" class="watts" value="1000" min="0" aria-label="Watts">
<input type="number" placeholder="Hours/day" class="hours" value="8" min="0" step="0.5" aria-label="Hours/Day">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
</div>
<button id="addRow" class="secondary-btn" type="button">+ Add Appliance</button>
</div>
<div class="input-section">
<label>Electricity Rate ($/kWh)</label>
<input type="number" id="rate" value="0.12" min="0" step="0.01" aria-label="Rate">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('addRow').addEventListener('click',()=>{
const row=document.createElement('div');
row.className='appliance-row';
row.innerHTML=`<input type="text" placeholder="Name" class="name" aria-label="Name">
<input type="number" placeholder="Watts" class="watts" min="0" aria-label="Watts">
<input type="number" placeholder="Hours/day" class="hours" min="0" step="0.5" aria-label="Hours/Day">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>`;
document.getElementById('appliances').appendChild(row);
});
document.getElementById('calc').addEventListener('click',()=>{
const rate=parseFloat(document.getElementById('rate').value)||0;
const rows=document.querySelectorAll('.appliance-row');
let html='<table class="result-table"><tr><th>Appliance</th><th>Watts</th><th>hrs/day</th><th>kWh/yr</th><th>Cost/yr</th></tr>';
let totalKwh=0,totalCost=0;
rows.forEach(r=>{
const name=r.querySelector('.name').value||'';
const w=parseFloat(r.querySelector('.watts').value)||0;
const h=parseFloat(r.querySelector('.hours').value)||0;
const dailyKwh=(w*h)/1000;
const yearlyKwh=dailyKwh*365;
const yearlyCost=yearlyKwh*rate;
totalKwh+=yearlyKwh;totalCost+=yearlyCost;
html+=`<tr><td>${name}</td><td>${w}</td><td>${h}</td><td>${yearlyKwh.toFixed(0)}</td><td>$${yearlyCost.toFixed(2)}</td></tr>`;
});
html+=`<tr class="total-row"><td colspan="3">Total</td><td>${totalKwh.toFixed(0)} kWh</td><td>$${totalCost.toFixed(2)}</td></tr></table>`;
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
