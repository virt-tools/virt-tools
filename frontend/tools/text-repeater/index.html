<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Repeater — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Text Repeater</h1>
<p class="subtitle">Repeat text any number of times with optional separator. Great for testing and padding.</p>
<div class="input-section">
<label>Text to repeat</label>
<input type="text" id="text" placeholder="Hello" value="Hello" aria-label="Hello">
<label>Repeat count</label>
<input type="number" id="count" value="5" min="1" max="100000" aria-label="Count">
<label>Separator</label>
<select id="sep" aria-label="Sep">
<option value="none">None</option>
<option value="space" selected>Space</option>
<option value="newline">New line</option>
<option value="comma">Comma</option>
<option value="tab">Tab</option>
<option value="custom">Custom...</option>
</select>
<input type="text" id="custom-sep" placeholder="e.g. ---" style="display:none;" aria-label="E.G.">
<button id="process" class="primary-btn" type="button">Repeat</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('sep').addEventListener('change',e=>{document.getElementById('custom-sep').style.display=e.target.value==='custom'?'block':'none';});
document.getElementById('process').addEventListener('click',()=>{
const text=document.getElementById('text').value;
const count=parseInt(document.getElementById('count').value)||1;
const sepVal=document.getElementById('sep').value;
let sep='';
if(sepVal==='space')sep=' ';else if(sepVal==='newline')sep='\n';else if(sepVal==='comma')sep=', ';else if(sepVal==='tab')sep='\t';else if(sepVal==='custom')sep=document.getElementById('custom-sep').value;
const result=sep?Array(count).fill(text).join(sep):text.repeat(count);
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+result.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=result;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
