<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Data Center CFD Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Data Center CFD Calculator</h1>
<p>Estimate airflow distribution, hot/cold aisle pressure differential, and bypass airflow from rack CFM and aisle geometry. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rk">Racks per aisle</label><input type="text" id="in-rk" inputmode="numeric" autocomplete="off" placeholder="e.g. 10"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-cf">CFM per rack</label><input type="text" id="in-cf" inputmode="numeric" autocomplete="off" placeholder="e.g. 800"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-aw">Aisle width</label><input type="text" id="in-aw" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-ah">Aisle height</label><input type="text" id="in-ah" inputmode="decimal" autocomplete="off" placeholder="e.g. 9"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rkEl=document.getElementById("in-rk"),cfEl=document.getElementById("in-cf"),awEl=document.getElementById("in-aw"),ahEl=document.getElementById("in-ah"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RK=parseInt(rkEl.value),CF=parseInt(cfEl.value),AW=parseFloat(awEl.value),AH=parseFloat(ahEl.value);
if(isNaN(RK)||isNaN(CF)||isNaN(AW)||isNaN(AH))return;
if(RK<=0||CF<=0||AW<=0||AH<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var totalCFM=CF*RK;
var aisleArea=AW*AH;
var airVelocity=totalCFM/aisleArea; // ft/min: CFM ÷ ft²
var bypassPct=Math.max(0,(airVelocity-50)/50*10); // rough bypass estimate above 50 fpm
var html='<div class="big">'+totalCFM+' CFM</div>';
html+=row("Total airflow",totalCFM+" CFM");
html+=row("Aisle area",Math.round(aisleArea*10)/10+" ft²");
html+=row("Air velocity",Math.round(airVelocity)+" fpm");
html+=row("Bypass airflow",Math.round(bypassPct)+"%");
html+=row("Velocity status",airVelocity<300?"Good":"Check for bypass");
out.innerHTML=html;
}
[rkEl,cfEl,awEl,ahEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
