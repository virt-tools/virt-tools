<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Data Center CFD Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Data Center CFD Calculator</h1>
<p>Estimate airflow distribution, hot/cold aisle pressure differential, and bypass airflow from rack CFM and aisle geometry. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rk">Racks per aisle</label><input type="text" id="in-rk" inputmode="numeric" autocomplete="off" placeholder="e.g. 10"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-cf">CFM per rack</label><input type="text" id="in-cf" inputmode="numeric" autocomplete="off" placeholder="e.g. 800"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-aw">Aisle width</label><input type="text" id="in-aw" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-ah">Aisle height</label><input type="text" id="in-ah" inputmode="decimal" autocomplete="off" placeholder="e.g. 9"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rkEl=document.getElementById("in-rk"),cfEl=document.getElementById("in-cf"),awEl=document.getElementById("in-aw"),ahEl=document.getElementById("in-ah"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RK=parseInt(rkEl.value),CF=parseInt(cfEl.value),AW=parseFloat(awEl.value),AH=parseFloat(ahEl.value);
if(isNaN(RK)||isNaN(CF)||isNaN(AW)||isNaN(AH))return;
if(RK<=0||CF<=0||AW<=0||AH<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var totalCFM=CF*RK;
var aisleArea=AW*AH;
var airVelocity=totalCFM/(aisleArea*60); // ft/min
var bypassPct=Math.max(0,(airVelocity-50)/50*10); // rough bypass estimate above 50 fpm
var html='<div class="big">'+totalCFM+' CFM</div>';
html+=row("Total airflow",totalCFM+" CFM");
html+=row("Aisle area",Math.round(aisleArea*10)/10+" ft²");
html+=row("Air velocity",Math.round(airVelocity)+" fpm");
html+=row("Bypass airflow",Math.round(bypassPct)+"%");
html+=row("Velocity status",airVelocity<300?"Good":"Check for bypass");
out.innerHTML=html;
}
[rkEl,cfEl,awEl,ahEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
