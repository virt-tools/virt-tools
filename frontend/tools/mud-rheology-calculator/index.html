<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Mud Rheology Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Mud Rheology Calculator</h1>
<p>Calculate plastic viscosity, yield point, and apparent viscosity from viscometer readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r600">600 rpm reading</label><input type="text" id="in-r600" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">°</div></div>
<div class="field"><label class="f" for="in-r300">300 rpm reading</label><input type="text" id="in-r300" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">°</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var r600E=document.getElementById("in-r600"),r300E=document.getElementById("in-r300"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var r600=parseFloat(r600E.value),r300=parseFloat(r300E.value);
if(isNaN(r600)||isNaN(r300))return;
if(r600<r300){err.textContent="600 rpm must be ≥ 300 rpm.";return}
err.textContent="";
var pv=r600-r300;
var yp=r300-pv;
var av=r600/2;
var html='<div class="big">'+pv+' cP</div>';
html+=row("Plastic viscosity PV",pv+' cP');
html+=row("Yield point YP",yp+' lb/100ft²');
html+=row("Apparent viscosity AV",av+' cP');
out.innerHTML=html;
}
[r600E,r300E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
