<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cable Tray Fill Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cable Tray Fill Calculator</h1>
<p>Calculate cable tray fill ratio, cable cross-sectional area, and NEC compliance from cable diameters and tray dimensions. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-tw">Tray width</label><input type="text" id="in-tw" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-td">Tray depth</label><input type="text" id="in-td" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-cd">Cable diameter</label><input type="text" id="in-cd" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-n">Cable count</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 20"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var twEl=document.getElementById("in-tw"),tdEl=document.getElementById("in-td"),cdEl=document.getElementById("in-cd"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var TW=parseFloat(twEl.value),TD=parseFloat(tdEl.value),CD=parseFloat(cdEl.value),N=parseInt(nEl.value);
if(isNaN(TW)||isNaN(TD)||isNaN(CD)||isNaN(N))return;
if(TW<=0||TD<=0||CD<=0||N<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var cableArea=Math.PI*Math.pow(CD/2,2);
var totalCableArea=cableArea*N;
var trayArea=TW*TD;
var fillRatio=(totalCableArea/trayArea)*100;
var maxFill=50; // NEC max 50% for control/signal cables
var compliant=fillRatio<=maxFill;
var html='<div class="big">'+Math.round(fillRatio)+'%</div>';
html+=row("Cable cross-section",Math.round(cableArea*1000)/1000+" in²");
html+=row("Total cable area",Math.round(totalCableArea*100)/100+" in²");
html+=row("Tray area",Math.round(trayArea)+" in²");
html+=row("Fill ratio",Math.round(fillRatio)+"%");
html+=row("NEC max (50%)",compliant?"Compliant":"Over fill");
out.innerHTML=html;
}
[twEl,tdEl,cdEl,nEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
