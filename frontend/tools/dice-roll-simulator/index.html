<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roll Simulator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Dice Roll Simulator</h1>
<p class="subtitle">Roll any number of dice with any sides and track sum distribution.</p>
<div class="input-section">
<label>Number of Dice</label>
<input type="number" id="numDice" value="2" min="1" max="100" step="1" aria-label="Num Dice">
<label>Sides per Die</label>
<input type="number" id="sides" value="6" min="2" max="1000" step="1" aria-label="Sides">
<label>Number of Rolls</label>
<input type="number" id="rolls" value="10000" min="1" max="1000000" step="1" aria-label="Rolls">
<button id="roll" class="primary-btn" type="button">Roll Dice</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('roll').addEventListener('click',()=>{
const d=parseInt(document.getElementById('numDice').value)||1;
const s=parseInt(document.getElementById('sides').value)||6;
const r=parseInt(document.getElementById('rolls').value)||1;
const minSum=d,maxSum=d*s;
const dist=new Array(maxSum+1).fill(0);
let total=0,min=Infinity,max=-Infinity;
for(let i=0;i<r;i++){
let sum=0;
for(let j=0;j<d;j++)sum+=Math.floor(Math.random()*s)+1;
dist[sum]++;
total+=sum;
if(sum<min)min=sum;
if(sum>max)max=sum;
}
const avg=total/r;
let html=`<div class="result-row"><span>Total Rolls:</span><span>${r.toLocaleString()}</span></div>`;
html+=`<div class="result-row"><span>Roll Config:</span><span>${d}d${s}</span></div>`;
html+=`<div class="result-row"><span>Range:</span><span>${minSum} to ${maxSum}</span></div>`;
html+=`<div class="result-row"><span>Mean:</span><span>${avg.toFixed(4)} (expected: ${(d*(s+1)/2).toFixed(4)})</span></div>`;
html+=`<div class="result-row"><span>Observed Min/Max:</span><span>${min} / ${max}</span></div>`;
html+='<h3>Distribution</h3><table class="result-table"><tr><th>Sum</th><th>Count</th><th>%</th><th>Bar</th></tr>';
for(let i=minSum;i<=maxSum;i++){
const pct=(dist[i]/r*100).toFixed(2);
const bar='█'.repeat(Math.round(dist[i]/r*50));
html+=`<tr><td>${i}</td><td>${dist[i].toLocaleString()}</td><td>${pct}%</td><td style="font-family:monospace">${bar}</td></tr>`;
}
html+='</table>';
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
