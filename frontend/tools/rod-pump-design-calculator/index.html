<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rod Pump Design Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rod Pump Design Calculator</h1>
<p>Calculate pump displacement, stroke length, and PMR for sucker rod pumping from depth, rate, and pump diameter. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Pump diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-stroke">Stroke length</label><input type="text" id="in-stroke" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-spm">Strokes per min</label><input type="text" id="in-spm" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">spm</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),sE=document.getElementById("in-stroke"),spmE=document.getElementById("in-spm"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),s=parseFloat(sE.value),spm=parseFloat(spmE.value);
if(isNaN(d)||isNaN(s)||isNaN(spm))return;
var area=Math.PI*Math.pow(d/2,2);
var disp=area*s*0.000244*spm*1440;
var pmr=disp*0.6;
var html='<div class="big">'+Math.round(disp)+' bbl/day</div>';
html+=row("Pump displacement",Math.round(disp)+' bbl/day');
html+=row("Peak polished rod load",Math.round(pmr)+' lb');
out.innerHTML=html;
}
[dE,sE,spmE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
