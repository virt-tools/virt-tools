<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolt Torque Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Bolt Torque Calculator</h1>
<p class="subtitle">Calculate tightening torque, clamp force, and preload for threaded fasteners.</p>
<div class="input-section">
<label>Bolt Diameter (inches)</label>
<input type="number" id="dia" value="0.5" min="0.1" step="0.001" aria-label="Dia">
<label>TPI</label>
<input type="number" id="tpi" value="13" min="1" step="0.5" aria-label="Tpi">
<label>Target Clamp Force (lbs)</label>
<input type="number" id="force" value="5000" min="100" step="100" aria-label="Force">
<label>Friction Coefficient</label>
<input type="number" id="friction" value="0.2" min="0.05" max="0.5" step="0.01" aria-label="Friction">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const d=parseFloat(document.getElementById('dia').value)||0;
const tpi=parseFloat(document.getElementById('tpi').value)||1;
const F=parseFloat(document.getElementById('force').value)||0;
const mu=parseFloat(document.getElementById('friction').value)||0.2;
const pitch=1/tpi;
const dm=d-pitch*0.5;
const torque=F*(dm*Math.tan(Math.atan(pitch/(Math.PI*dm)))+mu*dm*0.577)/12;
const torqueNm=torque*1.35582;
const stress=F/(Math.PI*(d/2)**2);
const proofLoad=0.75*120000*Math.PI*(d/2)**2;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Bolt Diameter:</span><span>${d}" (${(d*25.4).toFixed(1)} mm)</span></div>
<div class="result-row"><span>Thread Pitch:</span><span>${pitch.toFixed(4)}" (1/${tpi})</span></div>
<div class="result-row"><span>Target Clamp Force:</span><span>${F.toLocaleString()} lbs (${(F*4.448).toFixed(0)} N)</span></div>
<div class="result-row"><span>Tightening Torque:</span><span>${torque.toFixed(1)} lb-ft (${torqueNm.toFixed(1)} N·m)</span></div>
<div class="result-row"><span>Tensile Stress:</span><span>${stress.toFixed(0)} psi</span></div>
<div class="result-row"><span>Friction Coefficient:</span><span>${mu}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
