<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Drip Edge Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Drip Edge Calculator</h1>
<p>Calculate drip edge length and pieces from roof eave and rake dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-eave">Eave length</label><input type="text" id="in-eave" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rake">Rake length (each side)</label><input type="text" id="in-rake" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">ft, both sides counted</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var eEl=document.getElementById("in-eave"),rEl=document.getElementById("in-rake"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var E=pn(eEl.value),R=pn(rEl.value);
if(E==null||R==null)return;
if(!isFinite(E)||!isFinite(R)||E<=0||R<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var total=E+R*2;
var waste=total*1.1;
var pieces=Math.ceil(waste/10);
var html='<div class="big">'+rnd(waste,0)+' ft</div>';
html+=row("Eave length",rnd(E,0)+" ft");
html+=row("Rake length (both)",rnd(R*2,0)+" ft");
html+=row("Total needed",rnd(total,0)+" ft");
html+=row("With 10% waste",rnd(waste,0)+" ft");
html+=row("Pieces (10ft)",pieces);
out.innerHTML=html;
}
[eEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
