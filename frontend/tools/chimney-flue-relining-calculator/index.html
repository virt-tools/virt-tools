<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Chimney Flue Relining Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Chimney Flue Relining Calculator</h1>
<p>Calculate stainless steel liner length and insulation material needed for relining a chimney flue. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Chimney height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-d">Liner diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),D=pn(dEl.value);
if(H==null||D==null)return;
if(!isFinite(H)||H<=0||!isFinite(D)||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var linerLength=H+2;
var insulationPerFt=0.5;
var totalInsulation=linerLength*insulationPerFt;
var html='<div class="big">'+rnd(linerLength,1)+' ft liner</div>';
html+=row("Liner length needed",rnd(linerLength,1)+' ft');
html+=row("Liner diameter",D+' in');
html+=row("Insulation mix",rnd(totalInsulation,1)+' bags');
html+=row("Chimney height",H+' ft');
html+=row("Extra for termination","2 ft");
out.innerHTML=html;
}
[hEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
