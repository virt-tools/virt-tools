<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Terminal Block Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Terminal Block Selector</h1>
<p>Select DIN rail terminal block type and current rating based on wire size and application. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-awg">Wire AWG</label><input type="text" id="in-awg" inputmode="numeric" autocomplete="off" placeholder="e.g. 12"><div class="unit">AWG</div></div>
<div class="field"><label class="f" for="in-cur">Max current</label><input type="text" id="in-cur" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">amps</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-awg"),cEl=document.getElementById("in-cur"),err=document.getElementById("err"),out=document.getElementById("out");
var ampTable={22:10,20:12,18:15,16:20,14:30,12:40,10:50,8:65,6:75,4:95,2:120,1:135,0:150,00:175,000:200,0000:230};
function calc(){
var Aw=pn(aEl.value),Cur=pn(cEl.value);
if(Aw==null||Cur==null)return;
if(!isFinite(Aw)||Aw<=0||!isFinite(Cur)||Cur<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var blockAmps=ampTable[Math.round(Aw)]||Math.ceil(Cur/10)*10;
var rated=Math.max(blockAmps,Math.ceil(Cur/10)*10);
var type=rated>100?"High-current screw terminal":"Screw or spring-cage terminal";
var html='<div class="big">'+rated+' A block</div>';
html+=row("Block rating",rated+' A');
html+=row("Block type",type);
html+=row("Wire size",Aw+' AWG');
html+=row("Max current",Cur+' A');
out.innerHTML=html;
}
[aEl,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
