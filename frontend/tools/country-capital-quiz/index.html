<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country & Capital Quiz — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
.quiz-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin-top:15px}
.question{font-size:1.3em;color:#c9d1d9;margin-bottom:15px}
.question strong{color:#58a6ff}
input[type="text"]{width:100%;background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-size:1em;box-sizing:border-box;margin-bottom:10px}
input:focus{outline:none;border-color:#58a6ff}
button{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:1em;cursor:pointer}
button:hover{background:#2ea043}
.score{font-size:.9em;color:#8b949e;margin-bottom:10px}
.feedback{padding:10px;border-radius:6px;margin:10px 0;display:none}
.correct{background:#0d2818;border:1px solid #238636;color:#3fb950}
.wrong{background:#160b0e;border:1px solid #f85149;color:#f85149}
.stat{display:inline-block;margin-right:20px;font-size:.85em}
.stat span{color:#58a6ff;font-weight:bold;font-size:1.2em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Country & Capital Quiz</h1>
<a class="back" href="/">← Back to all tools</a>
<div class="quiz-box" id="quizBox">
<div class="score">
<span class="stat">Score: <span id="score">0</span></span>
<span class="stat">Streak: <span id="streak">0</span></span>
<span class="stat">Question: <span id="qnum">1</span></span>
</div>
<div class="question" id="question">Loading...</div>
<input type="text" id="answerInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')checkAnswer()" aria-label="Type Your Answer...">
<div id="feedback" class="feedback"></div>
<button onclick="checkAnswer()" type="button">Submit</button> <button onclick="skipQuestion()" style="background:#30363d" type="button">Skip</button>
</div>
<div class="quiz-box" id="resultBox" style="display:none">
<h2 style="color:#58a6ff">Quiz Complete!</h2>
<p>Final Score: <strong id="finalScore" style="color:#3fb950">0</strong> / <span id="totalQ">10</span></p>
<p style="color:#8b949e">Accuracy: <span id="accuracy">0</span>%</p>
<button onclick="startQuiz()" type="button">Play Again</button>
</div>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
const COUNTRIES = [
["Afghanistan","Kabul"],["Albania","Tirana"],["Algeria","Algiers"],["Andorra","Andorra la Vella"],["Angola","Luanda"],
["Argentina","Buenos Aires"],["Armenia","Yerevan"],["Australia","Canberra"],["Austria","Vienna"],["Azerbaijan","Baku"],
["Bahamas","Nassau"],["Bahrain","Manama"],["Bangladesh","Dhaka"],["Barbados","Bridgetown"],["Belarus","Minsk"],
["Belgium","Brussels"],["Belize","Belmopan"],["Benin","Porto-Novo"],["Bhutan","Thimphu"],["Bolivia","Sucre"],
["Bosnia and Herzegovina","Sarajevo"],["Botswana","Gaborone"],["Brazil","Brasilia"],["Brunei","Bandar Seri Begawan"],["Bulgaria","Sofia"],
["Burkina Faso","Ouagadougou"],["Burundi","Gitega"],["Cambodia","Phnom Penh"],["Cameroon","Yaounde"],["Canada","Ottawa"],
["Chad","N'Djamena"],["Chile","Santiago"],["China","Beijing"],["Colombia","Bogota"],["Comoros","Moroni"],
["Congo","Brazzaville"],["Costa Rica","San Jose"],["Croatia","Zagreb"],["Cuba","Havana"],["Cyprus","Nicosia"],
["Czech Republic","Prague"],["Denmark","Copenhagen"],["Djibouti","Djibouti"],["Dominican Republic","Santo Domingo"],["Ecuador","Quito"],
["Egypt","Cairo"],["El Salvador","San Salvador"],["Eritrea","Asmara"],["Estonia","Tallinn"],["Eswatini","Mbabane"],
["Ethiopia","Addis Ababa"],["Fiji","Suva"],["Finland","Helsinki"],["France","Paris"],["Gabon","Libreville"],
["Gambia","Banjul"],["Georgia","Tbilisi"],["Germany","Berlin"],["Ghana","Accra"],["Greece","Athens"],
["Guatemala","Guatemala City"],["Guinea","Conakry"],["Guyana","Georgetown"],["Haiti","Port-au-Prince"],["Honduras","Tegucigalpa"],
["Hungary","Budapest"],["Iceland","Reykjavik"],["India","New Delhi"],["Indonesia","Jakarta"],["Iran","Tehran"],
["Iraq","Baghdad"],["Ireland","Dublin"],["Israel","Jerusalem"],["Italy","Rome"],["Jamaica","Kingston"],
["Japan","Tokyo"],["Jordan","Amman"],["Kazakhstan","Astana"],["Kenya","Nairobi"],["Kosovo","Pristina"],
["Kuwait","Kuwait City"],["Kyrgyzstan","Bishkek"],["Laos","Vientiane"],["Latvia","Riga"],["Lebanon","Beirut"],
["Lesotho","Maseru"],["Liberia","Monrovia"],["Libya","Tripoli"],["Liechtenstein","Vaduz"],["Lithuania","Vilnius"],
["Luxembourg","Luxembourg"],["Madagascar","Antananarivo"],["Malawi","Lilongwe"],["Malaysia","Kuala Lumpur"],["Maldives","Male"],
["Mali","Bamako"],["Malta","Valletta"],["Mauritania","Nouakchott"],["Mauritius","Port Louis"],["Mexico","Mexico City"],
["Moldova","Chisinau"],["Monaco","Monaco"],["Mongolia","Ulaanbaatar"],["Montenegro","Podgorica"],["Morocco","Rabat"],
["Mozambique","Maputo"],["Myanmar","Naypyidaw"],["Namibia","Windhoek"],["Nepal","Kathmandu"],["Netherlands","Amsterdam"],
["New Zealand","Wellington"],["Nicaragua","Managua"],["Niger","Niamey"],["Nigeria","Abuja"],["North Korea","Pyongyang"],
["North Macedonia","Skopje"],["Norway","Oslo"],["Oman","Muscat"],["Pakistan","Islamabad"],["Panama","Panama City"],
["Paraguay","Asuncion"],["Peru","Lima"],["Philippines","Manila"],["Poland","Warsaw"],["Portugal","Lisbon"],
["Qatar","Doha"],["Romania","Bucharest"],["Russia","Moscow"],["Rwanda","Kigali"],["Saudi Arabia","Riyadh"],
["Senegal","Dakar"],["Serbia","Belgrade"],["Seychelles","Victoria"],["Sierra Leone","Freetown"],["Singapore","Singapore"],
["Slovakia","Bratislava"],["Slovenia","Ljubljana"],["Somalia","Mogadishu"],["South Africa","Pretoria"],["South Korea","Seoul"],
["South Sudan","Juba"],["Spain","Madrid"],["Sri Lanka","Sri Jayawardenepura Kotte"],["Sudan","Khartoum"],["Sweden","Stockholm"],
["Switzerland","Bern"],["Syria","Damascus"],["Taiwan","Taipei"],["Tajikistan","Dushanbe"],["Tanzania","Dodoma"],
["Thailand","Bangkok"],["Togo","Lome"],["Trinidad and Tobago","Port of Spain"],["Tunisia","Tunis"],["Turkey","Ankara"],
["Turkmenistan","Ashgabat"],["Uganda","Kampala"],["Ukraine","Kyiv"],["United Arab Emirates","Abu Dhabi"],["United Kingdom","London"],
["United States","Washington D.C."],["Uruguay","Montevideo"],["Uzbekistan","Tashkent"],["Vatican City","Vatican City"],["Venezuela","Caracas"],
["Vietnam","Hanoi"],["Yemen","Sanaa"],["Zambia","Lusaka"],["Zimbabwe","Harare"]
];
let quiz=[],qIndex=0,score=0,streak=0,total=10;
function startQuiz(){
  quiz=[];qIndex=0;score=0;streak=0;
  const shuffled=[...COUNTRIES].sort(()=>Math.random()-0.5);
  quiz=shuffled.slice(0,total);
  document.getElementById('quizBox').style.display='block';
  document.getElementById('resultBox').style.display='none';
  nextQuestion();
}
function nextQuestion(){
  if(qIndex>=total){showResults();return;}
  document.getElementById('qnum').textContent=qIndex+1;
  document.getElementById('question').innerHTML='What is the capital of <strong>'+quiz[qIndex][0]+'</strong>?';
  document.getElementById('answerInput').value='';
  document.getElementById('answerInput').focus();
  document.getElementById('feedback').style.display='none';
}
function normalize(s){return s.toLowerCase().trim().replace(/[''`]/g,"'");}
function checkAnswer(){
  const ans=document.getElementById('answerInput').value;
  const fb=document.getElementById('feedback');
  if(!ans.trim())return;
  if(normalize(ans)===normalize(quiz[qIndex][1])){
    score++;streak++;
    fb.className='feedback correct';
    fb.innerHTML='✓ Correct! The capital of '+quiz[qIndex][0]+' is '+quiz[qIndex][1]+'.';
  }else{
    streak=0;
    fb.className='feedback wrong';
    fb.innerHTML='✗ The capital of '+quiz[qIndex][0]+' is <strong>'+quiz[qIndex][1]+'</strong>.';
  }
  fb.style.display='block';
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  qIndex++;
  setTimeout(nextQuestion,1800);
}
function skipQuestion(){
  streak=0;
  const fb=document.getElementById('feedback');
  fb.className='feedback wrong';
  fb.innerHTML='→ The capital of '+quiz[qIndex][0]+' is <strong>'+quiz[qIndex][1]+'</strong>.';
  fb.style.display='block';
  document.getElementById('streak').textContent=streak;
  qIndex++;
  setTimeout(nextQuestion,1800);
}
function showResults(){
  document.getElementById('quizBox').style.display='none';
  document.getElementById('resultBox').style.display='block';
  document.getElementById('finalScore').textContent=score;
  document.getElementById('totalQ').textContent=total;
  document.getElementById('accuracy').textContent=Math.round(score/total*100);
}
startQuiz();
</script>
</body>
</html>
