<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chain Length Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Chain Length Calculator</h1>
<p class="subtitle">Calculate bicycle chain length from chainring, cog, and chainstay length.</p>
<div class="input-section">
<label>Chainring Teeth</label>
<input type="number" id="chainring" value="52" min="1" aria-label="Chainring">
<label>Cog Teeth</label>
<input type="number" id="cog" value="16" min="1" aria-label="Cog">
<label>Chainstay Length (inches)</label>
<input type="number" id="cs" value="16.5" min="1" step="0.0625" aria-label="Cs">
<label>Chain Pitch (inches)</label>
<select id="pitch" aria-label="Pitch">
<option value="0.5" selected>1/2" (Standard)</option>
<option value="0.375">3/8" (BMX)</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const C=parseInt(document.getElementById('chainring').value)||1;
const R=parseInt(document.getElementById('cog').value)||1;
const L=parseFloat(document.getElementById('cs').value)||0;
const P=parseFloat(document.getElementById('pitch').value)||0.5;
const halfDiff=(C-R)/2;
const chainLen=2*L/P+(C+R)/2+((C-R)**2)/((4*Math.PI*L/P)**2);
const rounded=Math.ceil(chainLen);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Chainring:</span><span>${C} teeth</span></div>
<div class="result-row"><span>Rear Cog:</span><span>${R} teeth</span></div>
<div class="result-row"><span>Chainstay Length:</span><span>${L}"</span></div>
<div class="result-row"><span>Chain Pitch:</span><span>${P}"</span></div>
<div class="result-row"><span>Calculated Chain Length:</span><span>${chainLen.toFixed(1)} links</span></div>
<div class="result-row"><span>Recommended (rounded up):</span><span>${rounded} links</span></div>
<p class="hint">Standard derailleur setup. Add 2 links for master link if needed.</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
