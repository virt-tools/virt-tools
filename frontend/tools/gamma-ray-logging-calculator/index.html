<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gamma-Ray Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gamma-Ray Logging Calculator</h1>
<p>Calculate shale volume from gamma-ray log using linear and Larionov corrections. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-gr">GR reading</label><input type="text" id="in-gr" inputmode="decimal" autocomplete="off" placeholder="e.g. 75"><div class="unit">API</div></div>
<div class="field"><label class="f" for="in-grmin">GR min (clean sand)</label><input type="text" id="in-grmin" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">API</div></div>
<div class="field"><label class="f" for="in-grmax">GR max (shale)</label><input type="text" id="in-grmax" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">API</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var grE=document.getElementById("in-gr"),grminE=document.getElementById("in-grmin"),grmaxE=document.getElementById("in-grmax"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var gr=parseFloat(grE.value),grmin=parseFloat(grminE.value),grmax=parseFloat(grmaxE.value);
if(isNaN(gr)||isNaN(grmin)||isNaN(grmax))return;
if(grmax<=grmin){err.textContent="GR max must exceed GR min.";return}
err.textContent="";
var igr=(gr-grmin)/(grmax-grmin);
var vshLin=igr;
var vshLar=0.083*(Math.pow(2,3.7*igr)-1);
var html='<div class="big">'+Math.round(vshLin*10000)/100+' %</div>';
html+=row("GR index IGR",Math.round(igr*1000)/1000);
html+=row("Vsh (linear)",Math.round(vshLin*10000)/100+' %');
html+=row("Vsh (Larionov)",Math.round(vshLar*10000)/100+' %');
out.innerHTML=html;
}
[grE,grminE,grmaxE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
