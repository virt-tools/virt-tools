<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Lumen & Lux Calculator</h1>
<p class="subtitle">Calculate lumens needed for a room, or convert between lumens, lux, and watts.</p>
<div class="input-section">
<label>Room Type</label>
<select id="roomType" aria-label="Room Type">
<option value="living" data-lux="150">Living Room (150 lux)</option>
<option value="kitchen" data-lux="300">Kitchen (300 lux)</option>
<option value="bath" data-lux="500">Bathroom (500 lux)</option>
<option value="bed" data-lux="100">Bedroom (100 lux)</option>
<option value="office" data-lux="500">Office (500 lux)</option>
<option value="garage" data-lux="100">Garage (100 lux)</option>
<option value="hall" data-lux="50">Hallway (50 lux)</option>
</select>
<label>Room Area (sq ft)</label>
<input type="number" id="area" value="200" min="1" aria-label="Area">
<label>Ceiling Height (ft)</label>
<input type="number" id="height" value="9" min="7" step="0.5" aria-label="Height">
<label>LED Efficacy (lm/W)</label>
<input type="number" id="efficacy" value="90" min="40" max="200" step="5" aria-label="Efficacy">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const sel=document.getElementById('roomType');
const lux=parseInt(sel.selectedOptions[0].dataset.lux);
const A=parseFloat(document.getElementById('area').value)||0;
const H=parseFloat(document.getElementById('height').value)||8;
const E=parseFloat(document.getElementById('efficacy').value)||90;
const areaM2=A*0.092903;
const lumens=lux*areaM2;
const watts=lumens/E;
const numBulbs=Math.ceil(lumens/800);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Room:</span><span>${sel.selectedOptions[0].text}</span></div>
<div class="result-row"><span>Target Illuminance:</span><span>${lux} lux</span></div>
<div class="result-row"><span>Room Area:</span><span>${A} sq ft (${areaM2.toFixed(2)} m²)</span></div>
<div class="result-row"><span>Lumens Needed:</span><span>${Math.ceil(lumens)} lm</span></div>
<div class="result-row"><span>Watts Needed (LED):</span><span>${watts.toFixed(1)} W</span></div>
<div class="result-row"><span>Equivalent 800lm Bulbs:</span><span>${numBulbs} bulbs</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
