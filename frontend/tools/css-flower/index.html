<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flower Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌸 CSS Flower Generator</h1>
<p>Create CSS flower with adjustable petals, colors, center, stem, leaves. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Petals</label><input type="range" id="petals" min="3" max="16" value="6" style="width:200px" aria-label="Petals"></div>
<div class="ctrl-row"><label>Petal Color</label><input type="color" id="petalColor" value="#ff6b9d" style="width:60px;height:36px" aria-label="Petal Color"></div>
<div class="ctrl-row"><label>Center Color</label><input type="color" id="centerColor" value="#ffdd00" style="width:60px;height:36px" aria-label="Center Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="80" max="240" value="160" style="width:200px" aria-label="Size"></div>
<div class="ctrl-row"><label>Stem</label><select id="stem" aria-label="Stem"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var n=parseInt(document.getElementById('petals').value);
var pc=document.getElementById('petalColor').value;
var cc=document.getElementById('centerColor').value;
var sz=parseInt(document.getElementById('size').value);
var stem=document.getElementById('stem').value;
var html='<div class="flower-wrap">\n  <div class="flower">\n    <div class="center"></div>\n';
for(var i=0;i<n;i++)html+='    <div class="petal p'+i+'"></div>\n';
html+='  </div>\n';
if(stem==='yes')html+='  <div class="stem"></div>\n  <div class="leaf"></div>\n';
html+='</div>';
var css='.flower-wrap{display:flex;flex-direction:column;align-items:center}\n';
css+='.flower{position:relative;width:'+sz+'px;height:'+sz+'px}\n';
var half=sz/2;
css+='.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(half*0.7)+'px;height:'+(half*0.7)+'px;background:radial-gradient(circle,'+cc+' 0%,rgba(0,0,0,0.2) 100%);border-radius:50%;z-index:2}\n';
var angle=360/n;
var petalSize=sz*0.45;
for(var i=0;i<n;i++){
  css+='.petal.p'+i+'{position:absolute;top:50%;left:50%;width:'+petalSize+'px;height:'+petalSize+'px;background:'+pc+';border-radius:50% 50% 0 50%;transform:translate(-50%,-50%) rotate('+(i*angle)+'deg) translateY(-'+(half*0.55)+'px);opacity:0.9}\n';
}
if(stem==='yes'){
  css+='.stem{width:6px;height:80px;background:linear-gradient(90deg,#3a7a3a,#4a9a4a,#3a7a3a);margin-top:-4px}\n';
  css+='.leaf{position:relative;width:40px;height:20px;background:#4a9a4a;border-radius:0 100% 0 100%;margin-top:-50px;margin-left:30px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['petals','petalColor','centerColor','size','stem'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
