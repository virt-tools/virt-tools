<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Awning Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Awning Size Calculator</h1>
<p>Calculate awning width, projection, and fabric area from window or door dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Opening width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-p">Projection</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),P=pn(pEl.value);
if(W==null||P==null)return;
if(!isFinite(W)||!isFinite(P)||W<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var awningW=W+12;
var area=awningW*P/144;
var html='<div class="big">'+rnd(area,1)+' sq ft</div>';
html+=row("Opening width",rnd(W,0)+" in");
html+=row("Awning width",rnd(awningW,0)+" in");
html+=row("Projection",rnd(P,0)+" in");
html+=row("Fabric area",rnd(area,1)+" sq ft");
out.innerHTML=html;
}
[wEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
