<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trim & Molding Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Trim & Molding Calculator</h1>
<p class="subtitle">Estimate linear feet of baseboard, crown, and casing with waste allowance.</p>
<div class="input-section">
<label>Room Length (ft)</label>
<input type="number" id="rLen" value="16" min="1" aria-label="R Len">
<label>Room Width (ft)</label>
<input type="number" id="rWid" value="12" min="1" aria-label="R Wid">
<label>Number of Doors</label>
<input type="number" id="doors" value="2" min="0" aria-label="Doors">
<label>Door Width (inches)</label>
<input type="number" id="doorW" value="32" min="12" step="0.5" aria-label="Door W">
<label>Number of Windows</label>
<input type="number" id="windows" value="2" min="0" aria-label="Windows">
<label>Window Width (inches)</label>
<input type="number" id="winW" value="36" min="12" step="0.5" aria-label="Win W">
<label>Waste Allowance (%)</label>
<input type="number" id="waste" value="15" min="0" max="50" aria-label="Waste">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('rLen').value)||0;
const W=parseFloat(document.getElementById('rWid').value)||0;
const D=parseInt(document.getElementById('doors').value)||0;
const dW=parseFloat(document.getElementById('doorW').value)||0;
const N=parseInt(document.getElementById('windows').value)||0;
const wW=parseFloat(document.getElementById('winW').value)||0;
const ws=parseFloat(document.getElementById('waste').value)||0;
const perimeter=(L+W)*2;
const baseboard=perimeter-(D*dW/12);
const casing=D*(dW/12+1)*2+N*(wW/12+1)*2;
const crown=perimeter;
const bWaste=baseboard*(1+ws/100);
const cWaste=casing*(1+ws/100);
const caseWaste=casing*(1+ws/100);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Room Perimeter:</span><span>${perimeter} ft</span></div>
<div class="result-row"><span>Baseboard (net):</span><span>${baseboard.toFixed(1)} ft</span></div>
<div class="result-row"><span>Baseboard (with ${ws}% waste):</span><span>${bWaste.toFixed(1)} ft</span></div>
<div class="result-row"><span>Crown Molding (net):</span><span>${crown.toFixed(1)} ft</span></div>
<div class="result-row"><span>Crown Molding (with waste):</span><span>${cWaste.toFixed(1)} ft</span></div>
<div class="result-row"><span>Door/Window Casing (net):</span><span>${casing.toFixed(1)} ft</span></div>
<div class="result-row"><span>Casing (with waste):</span><span>${caseWaste.toFixed(1)} ft</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
