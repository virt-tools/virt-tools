<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Base Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
input[type="text"]{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:monospace;font-size:1em;width:100%;box-sizing:border-box}
select{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:1em}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
.output{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px;margin:8px 0;font-family:monospace;font-size:1em;word-break:break-all;min-height:20px}
.error{color:#f85149;font-size:.85em;margin:4px 0}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px}
button:hover{border-color:#58a6ff}
.base-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.base-item{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px}
.base-item .label{color:#8b949e;font-size:.75em;text-transform:uppercase}
.base-item .val{font-family:monospace;font-size:1em;word-break:break-all}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Number Base Converter</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Convert numbers between binary, octal, decimal, hexadecimal, and any base 2–36.</p>
<label>Input value</label>
<input type="text" id="input" value="255" oninput="convert()" aria-label="Input">
<label>From base</label>
<select id="fromBase" onchange="convert()" aria-label="From Base">
<option value="2">Binary (2)</option>
<option value="8">Octal (8)</option>
<option value="10 selected>Decimal (10)</option>
<option value="16">Hexadecimal (16)</option>
</select>
<div id="error" class="error"></div>
<div class="base-grid" id="results"></div>
<label>Custom base (2–36)</label>
<div style="display:flex;gap:8px">
<input type="number" id="customBase" value="36" min="2" max="36" style="width:80px" onchange="convertCustom()" aria-label="Custom Base">
<input type="text" id="customResult" class="output" style="flex-grow:1" readonly aria-label="Custom Result">
</div>
<button onclick="copyAll()" type="button">Copy all</button>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function convert(){
  const val=document.getElementById('input').value.trim();
  const base=parseInt(document.getElementById('fromBase').value);
  const err=document.getElementById('error');
  err.textContent='';
  if(!val){document.getElementById('results').innerHTML='';return;}
  if(!new RegExp('^[0-9a-'+(base>10?String.fromCharCode(86+base):'9')+']+$','i').test(val)){
    err.textContent='Invalid digit for base '+base;document.getElementById('results').innerHTML='';return;
  }
  const dec=parseInt(val,base);
  if(isNaN(dec)||dec>9007199254740992){err.textContent='Number too large';return;}
  const bases=[
    ['Binary',2],['Octal',8],['Decimal',10],['Hexadecimal',16]
  ];
  document.getElementById('results').innerHTML=bases.map(([n,b])=>
    '<div class="base-item"><div class="label">'+n+' (base '+b+')</div><div class="val">'+dec.toString(b).toUpperCase()+'</div></div>'
  ).join('');
  convertCustom(dec);
}
function convertCustom(dec){
  const cb=parseInt(document.getElementById('customBase').value);
  if(!dec)dec=parseInt(document.getElementById('input').value,parseInt(document.getElementById('fromBase').value));
  if(isNaN(dec)||isNaN(cb)||cb<2||cb>36){document.getElementById('customResult').value='';return;}
  document.getElementById('customResult').value=dec.toString(cb).toUpperCase();
}
function copyAll(){
  const items=document.querySelectorAll('.base-item .val');
  let txt='';document.querySelectorAll('.base-item').forEach(i=>{txt+=i.querySelector('.label').textContent+': '+i.querySelector('.val').textContent+'\n';});
  navigator.clipboard.writeText(txt);
}
convert();
</script>
</body>
</html>
