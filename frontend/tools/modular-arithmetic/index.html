<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modular Arithmetic Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Modular Arithmetic Calculator</h1>
<p class="subtitle">Calculate (a + b) mod n, (a × b) mod n, a^b mod n, and modular inverse.</p>
<div class="input-section">
<label>a</label>
<input type="number" id="a" value="17" step="any" aria-label="A">
<label>b</label>
<input type="number" id="b" value="5" step="any" aria-label="B">
<label>modulus (n)</label>
<input type="number" id="n" value="12" min="1" step="1" aria-label="N">
<label>Operation</label>
<select id="op" aria-label="Op">
<option value="add" selected>Add: (a + b) mod n</option>
<option value="sub">Subtract: (a − b) mod n</option>
<option value="mul">Multiply: (a × b) mod n</option>
<option value="pow">Power: a^b mod n</option>
<option value="inv">Modular Inverse: a⁻¹ mod n</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function modPow(base,exp,mod){
let result=1n;base=base%mod;
while(exp>0){if(exp%2n===1n)result=result*base%mod;exp=exp/2n;base=base*base%mod;}
return result;
}
function modInv(a,mod){
let[g,x]=egcd(((a%mod)+mod)%mod,mod);
if(g!==1n)return null;
return((x%mod)+mod)%mod;
}
function egcd(a,b){if(b===0n)return[a,1n,0n];const[g,x,y]=egcd(b,a%b);return[g,y,x-(a/b)*y];}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const a=BigInt(Math.floor(parseFloat(document.getElementById('a').value)||0));
const b=BigInt(Math.floor(parseFloat(document.getElementById('b').value)||0));
const n=BigInt(Math.floor(parseFloat(document.getElementById('n').value)||1));
const op=document.getElementById('op').value;
let html='';
if(n<=0n){document.getElementById('result').innerHTML='<p class="warning">Modulus must be positive.</p>';document.getElementById('result').style.display='block';return;}
if(op==='add')html=`<div class="result-row"><span>(${a} + ${b}) mod ${n}:</span><span>${((a+b)%n+n)%n}</span></div>`;
else if(op==='sub')html=`<div class="result-row"><span>(${a} − ${b}) mod ${n}:</span><span>${((a-b)%n+n)%n}</span></div>`;
else if(op==='mul')html=`<div class="result-row"><span>(${a} × ${b}) mod ${n}:</span><span>${((a*b)%n+n)%n}</span></div>`;
else if(op==='pow'){
if(b<0n){html='<p class="warning">Exponent must be non-negative for modular power.</p>';}
else html=`<div class="result-row"><span>${a}^${b} mod ${n}:</span><span>${modPow(((a%n)+n)%n,b,n)}</span></div>`;
}else if(op==='inv'){
const inv=modInv(a,n);
html=inv!==null?`<div class="result-row"><span>${a}⁻¹ mod ${n}:</span><span>${inv}</span></div><div class="result-row"><span>Verification:</span><span>(${a} × ${inv}) mod ${n} = ${(a*inv%n+n)%n}</span></div>`:'<p class="warning">No inverse exists (GCD ≠ 1).</p>';
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
