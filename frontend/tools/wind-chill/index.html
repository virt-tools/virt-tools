<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Chill & Heat Index — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Wind Chill & Heat Index</h1>
<p class="subtitle">Calculate how cold or hot it actually feels.</p>

<div class="input-section">
  <label>Temperature (°F)</label>
  <input type="number" id="temp" value="30" step="0.1" aria-label="Temp">
  <label>Wind Speed (mph)</label>
  <input type="number" id="wind" value="10" min="0" aria-label="Wind">
  <label>Relative Humidity (%)</label>
  <input type="number" id="hum" value="50" min="0" max="100" aria-label="Hum">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const T = parseFloat(document.getElementById('temp').value) || 0;
    const V = parseFloat(document.getElementById('wind').value) || 0;
    const H = parseFloat(document.getElementById('hum').value) || 0;
    let html = '';
    if (T <= 50 && V > 3) {
      const wc = 35.74 + 0.6215*T - 35.75*Math.pow(V,0.16) + 0.4275*T*Math.pow(V,0.16);
      html += `<div class="result-row"><span>Wind Chill:</span><span>${wc.toFixed(1)}°F</span></div>`;
    }
    if (T >= 80) {
      const hi = -42.379 + 2.04901523*T + 10.14333127*H - 0.22475541*T*H - 0.00683783*T*T - 0.05481717*H*H + 0.00122874*T*T*H + 0.00085282*T*H*H - 0.00000199*T*T*H*H;
      html += `<div class="result-row"><span>Heat Index:</span><span>${hi.toFixed(1)}°F</span></div>`;
    }
    if (!html) html = '<div class="result-row"><span>No wind chill or heat index applicable at these values.</span></div>';
    document.getElementById('bigResult').textContent = '';
    document.getElementById('extras').innerHTML = html;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
