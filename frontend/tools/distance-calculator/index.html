<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distance Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Distance Calculator</h1>
<p class="subtitle">Great-circle distance between two coordinates using the Haversine formula.</p>

<div class="input-section">
  <label>Point A — Latitude</label>
  <input type="number" id="lat1" value="40.7128" step="0.0001" aria-label="Lat1">
  <label>Point A — Longitude</label>
  <input type="number" id="lon1" value="-74.0060" step="0.0001" aria-label="Lon1">
  <label>Point B — Latitude</label>
  <input type="number" id="lat2" value="34.0522" step="0.0001" aria-label="Lat2">
  <label>Point B — Longitude</label>
  <input type="number" id="lon2" value="-118.2437" step="0.0001" aria-label="Lon2">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const lat1 = parseFloat(document.getElementById('lat1').value) * Math.PI/180;
    const lon1 = parseFloat(document.getElementById('lon1').value) * Math.PI/180;
    const lat2 = parseFloat(document.getElementById('lat2').value) * Math.PI/180;
    const lon2 = parseFloat(document.getElementById('lon2').value) * Math.PI/180;
    const R = 6371;
    const dLat = lat2 - lat1;
    const dLon = lon2 - lon1;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    const km = R * c;
    const mi = km * 0.621371;
    const nm = km * 0.539957;
    document.getElementById('bigResult').textContent = `${km.toFixed(1)} km`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Kilometers:</span><span>${km.toFixed(2)} km</span></div>
      <div class="result-row"><span>Miles:</span><span>${mi.toFixed(2)} mi</span></div>
      <div class="result-row"><span>Nautical miles:</span><span>${nm.toFixed(2)} nm</span></div>
      <div class="result-row"><span>Formula:</span><span>Haversine (R = 6371 km)</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
