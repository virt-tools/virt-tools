<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Splitter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Splitter</h1>
<p class="subtitle">Split an image into a grid of tiles. Choose rows and columns, download each tile. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Rows: <input type="number" id="rows" value="2" min="1" max="20" style="width:60px"></label>
<label>Cols: <input type="number" id="cols" value="2" min="1" max="20" style="width:60px"></label>
<button onclick="split()" type="button">Split</button>
</div>
<div id="results" style="margin-top:15px;display:grid;gap:8px"></div>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
img=new Image();img.src=URL.createObjectURL(f);
});
function split(){
if(!img)return;
var r=parseInt(document.getElementById('rows').value),c=parseInt(document.getElementById('cols').value);
var tw=Math.floor(img.naturalWidth/c),th=Math.floor(img.naturalHeight/r);
var cont=document.getElementById('results');cont.innerHTML='';
cont.style.gridTemplateColumns='repeat('+c+',1fr)';
for(var y=0;y<r;y++)for(var x=0;x<c;x++){
var cv=document.createElement('canvas');cv.width=tw;cv.height=th;
var cx=cv.getContext('2d');cx.drawImage(img,x*tw,y*th,tw,th,0,0,tw,th);
cv.style.cssText='border:1px solid #444;border-radius:4px;max-width:100%';
cv.onclick=function(){var a=document.createElement('a');a.href=this.toDataURL('image/png');a.download='tile.png';a.click();};
cv.title='Click to download';
cont.appendChild(cv);
}
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
