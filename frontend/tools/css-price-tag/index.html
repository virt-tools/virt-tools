<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Price Tag/Sale Badge Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:180px;display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏷️ CSS Price Tag/Sale Badge Generator</h1>
<p>Create CSS price tags and sale/discount badges. 6 styles, adjustable colors/size/text. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="classic" selected>Classic Tag</option><option value="ribbon">Ribbon</option><option value="circle">Circle Stamp</option><option value="folded">Folded Corner</option><option value="burst">Star Burst</option><option value="modern">Modern Pill</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="SALE" style="width:200px"></div>
<div class="ctrl-row"><label>Subtext</label><input type="text" id="subtext" value="-20%" style="width:200px"></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option></select></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#ff4444" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="textColor" value="#ffffff" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Rotated</label><input type="checkbox" id="rotated"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var text=document.getElementById('text').value;
var sub=document.getElementById('subtext').value;
var size=document.getElementById('size').value;
var c=document.getElementById('color').value;
var tc=document.getElementById('textColor').value;
var rot=document.getElementById('rotated').checked;
var sz={sm:60,md:80,lg:110}[size];
var rotDeg=rot?-8:0;
var html='',css='';
if(style==='classic'){
html='<div class="price-tag classic">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.classic{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:'+sz+'px;height:'+sz*0.7+'px;background:'+c+';color:'+tc+';font-weight:bold;font-size:'+Math.round(sz*0.2)+'px;border-radius:4px;transform:rotate('+rotDeg+'deg);padding:8px 16px 8px 24px}\n';
css+='.price-tag.classic::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:8px;height:8px;background:#1a1a3e;border-radius:50%}\n';
css+='.pt-text{font-size:'+Math.round(sz*0.22)+'px}\n.pt-sub{font-size:'+Math.round(sz*0.15)+'px;opacity:.85}\n';
}else if(style==='ribbon'){
html='<div class="price-tag ribbon">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.ribbon{position:relative;display:inline-flex;flex-direction:column;align-items:center;background:'+c+';color:'+tc+';font-weight:bold;padding:8px 24px;font-size:'+Math.round(sz*0.2)+'px;transform:rotate('+rotDeg+'deg)}\n';
css+='.price-tag.ribbon::before{content:"";position:absolute;left:-12px;top:0;border:12px solid '+c+';border-left-color:transparent;border-bottom-color:transparent}\n';
css+='.price-tag.ribbon::after{content:"";position:absolute;right:-12px;top:0;border:12px solid '+c+';border-right-color:transparent;border-bottom-color:transparent}\n';
css+='.pt-sub{font-size:'+Math.round(sz*0.15)+'px;opacity:.85}\n';
}else if(style==='circle'){
html='<div class="price-tag circle-stamp">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.circle-stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+';color:'+tc+';font-weight:bold;font-size:'+Math.round(sz*0.2)+'px;text-align:center;border:3px solid '+tc+';transform:rotate('+rotDeg+'deg)}\n';
css+='.pt-sub{font-size:'+Math.round(sz*0.14)+'px;opacity:.85}\n';
}else if(style==='folded'){
html='<div class="price-tag folded">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.folded{position:relative;display:inline-flex;flex-direction:column;align-items:center;background:'+c+';color:'+tc+';font-weight:bold;padding:10px 24px;font-size:'+Math.round(sz*0.2)+'px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);transform:rotate('+rotDeg+'deg)}\n';
css+='.pt-sub{font-size:'+Math.round(sz*0.15)+'px;opacity:.85}\n';
}else if(style==='burst'){
html='<div class="price-tag burst">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.burst{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:'+sz+'px;height:'+sz+'px;background:'+c+';color:'+tc+';font-weight:bold;font-size:'+Math.round(sz*0.18)+'px;text-align:center;clip-path:polygon(50% 0,61% 15%,79% 10%,75% 29%,95% 25%,85% 42%,100% 50%,85% 58%,95% 75%,75% 71%,79% 90%,61% 85%,50% 100%,39% 85%,21% 90%,25% 71%,5% 75%,15% 58%,0 50%,15% 42%,5% 25%,25% 29%,21% 10%,39% 15%);transform:rotate('+rotDeg+'deg)}\n';
css+='.pt-sub{font-size:'+Math.round(sz*0.13)+'px;opacity:.85}\n';
}else if(style==='modern'){
html='<div class="price-tag modern-pill">\n  <span class="pt-text">'+text+'</span>\n  '+(sub?'<span class="pt-sub">'+sub+'</span>':'')+'\n</div>';
css='.price-tag.modern-pill{display:inline-flex;flex-direction:column;align-items:center;background:'+c+';color:'+tc+';font-weight:bold;padding:8px 28px;font-size:'+Math.round(sz*0.2)+'px;border-radius:40px;box-shadow:0 4px 12px rgba(0,0,0,.3);transform:rotate('+rotDeg+'deg)}\n';
css+='.pt-sub{font-size:'+Math.round(sz*0.15)+'px;opacity:.85}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','text','subtext','size','color','textColor','rotated'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
