<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Backsplash Tile Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Backsplash Tile Calculator</h1>
<p>Calculate tile count, grout lines, and trim pieces for a kitchen backsplash area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Wall width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-h">Wall height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 600"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-tw">Tile width</label><input type="text" id="in-tw" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-th">Tile height</label><input type="text" id="in-th" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-g">Grout gap</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),twEl=document.getElementById("in-tw"),thEl=document.getElementById("in-th"),gEl=document.getElementById("in-g"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),TW=pn(twEl.value),TH=pn(thEl.value),G=pn(gEl.value);
if(W==null||H==null){return}
TW=TW==null?100:TW;TH=TH==null?100:TH;G=G==null?3:G;
if(!isFinite(W)||!isFinite(H)||!isFinite(TW)||!isFinite(TH)||!isFinite(G)||W<=0||H<=0||TW<=0||TH<=0||G<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var cols=Math.ceil(W/(TW+G));
var rowsN=Math.ceil(H/(TH+G));
var tiles=cols*rowsN;
var waste=Math.ceil(tiles*0.1);
var total=tiles+waste;
var area=W*H/1000000;
var html='<div class="big">'+total+' tiles</div>';
html+=row("Wall area",rnd(area,2)+" m²");
html+=row("Tiles per row",cols);
html+=row("Rows",rowsN);
html+=row("Tiles needed",tiles);
html+=row("10% waste",waste);
html+=row("Total to buy",total);
out.innerHTML=html;
}
[wEl,hEl,twEl,thEl,gEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
