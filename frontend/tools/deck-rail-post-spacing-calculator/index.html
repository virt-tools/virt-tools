<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Deck Rail Post Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Deck Rail Post Spacing Calculator</h1>
<p>Calculate deck railing post count and spacing from rail length and max post spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Rail length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 16"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-m">Max post spacing</label><input type="text" id="in-m" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),mEl=document.getElementById("in-m"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),M=pn(mEl.value);
if(L==null||M==null)return;
if(!isFinite(L)||!isFinite(M)||L<=0||M<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var posts=Math.ceil(L/M)+1;
var actualSp=L/(posts-1);
var html='<div class="big">'+posts+' posts</div>';
html+=row("Rail length",rnd(L,1)+' ft');
html+=row("Max spacing",rnd(M,1)+' ft');
html+=row("Post count",posts);
html+=row("Actual spacing",rnd(actualSp,2)+' ft');
out.innerHTML=html;
}
[lEl,mEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
