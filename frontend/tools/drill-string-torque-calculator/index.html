<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Drill String Torque Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Drill String Torque Calculator</h1>
<p>Calculate make-up torque for drill pipe connections from OD, wall thickness, and friction factor. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-od">Pipe OD</label><input type="text" id="in-od" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-wt">Wall thickness</label><input type="text" id="in-wt" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-ff">Friction factor</label><input type="text" id="in-ff" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.08"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-ys">Yield strength</label><input type="text" id="in-ys" inputmode="decimal" autocomplete="off" placeholder="e.g. 95000"><div class="unit">psi</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var odE=document.getElementById("in-od"),wtE=document.getElementById("in-wt"),ffE=document.getElementById("in-ff"),ysE=document.getElementById("in-ys"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var od=parseFloat(odE.value),wt=parseFloat(wtE.value),ff=parseFloat(ffE.value),ys=parseFloat(ysE.value);
if(isNaN(od)||isNaN(wt)||isNaN(ff)||isNaN(ys))return;
err.textContent="";
var id=od-2*wt;
var area=0.7854*(od*od-id*id);
var torsionalYield=0.096225*ys*Math.pow(od,1)*area*od/12;
var makeupTorque=torsionalYield*ff*10;
var html='<div class="big">'+Math.round(makeupTorque).toLocaleString()+' ft-lb</div>';
html+=row("Make-up torque",Math.round(makeupTorque).toLocaleString()+' ft-lb');
html+=row("Torsional yield",Math.round(torsionalYield).toLocaleString()+' ft-lb');
html+=row("Cross-section area",Math.round(area*100)/100+' in²');
out.innerHTML=html;
}
[odE,wtE,ffE,ysE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
