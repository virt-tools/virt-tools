<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cold Frame Builder — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cold Frame Builder</h1>
<p>Calculate cold frame dimensions, glazing angle, and material list from garden bed size and climate zone. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Bed width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Bed length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-zone">Climate zone 3-9</label><input type="text" id="in-zone" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit"></div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),zoneEl=document.getElementById("in-zone"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),Zone=pn(zoneEl.value);
if(W==null||L==null||Zone==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return}
if(!isFinite(W)||!isFinite(L)||!isFinite(Zone)||W<=0||L<=0||Zone<3||Zone>9){err.textContent="Enter valid values.";return}
err.textContent="";
var backH=Zone<=5?24:Zone<=7?18:14;
var frontH=backH-6;
var angle=Math.atan2(backH-frontH,W*12)*180/Math.PI;
var glazingArea=W*L/Math.cos(angle*Math.PI/180);
var lumberFt=Math.ceil((W*4+L*4+backH/12*4+frontH/12*4)*1.1);
var html='<div class="big">'+rnd(angle,0)+' deg</div>';
html+=row("Bed size",rnd(W,0)+' x '+rnd(L,0)+' ft');
html+=row("Back height",rnd(backH,0)+' in');
html+=row("Front height",rnd(frontH,0)+' in');
html+=row("Roof angle",rnd(angle,1)+' deg');
html+=row("Glazing area",rnd(glazingArea,1)+' sq ft');
html+=row("Lumber needed",lumberFt+' ft');
out.innerHTML=html;
}
[wEl,lEl,zoneEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
