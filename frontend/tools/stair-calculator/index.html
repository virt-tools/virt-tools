<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stair Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Stair Calculator</h1>
<p class="subtitle">Calculate stair dimensions — risers, treads, and stringer length.</p>
<div class="input-section">
<label>Total Rise (inches)</label>
<input type="number" id="rise" value="96" min="1" step="0.125" aria-label="Rise">
<label>Desired Riser Height (inches)</label>
<input type="number" id="riserH" value="7" min="4" max="9" step="0.125" aria-label="Riser H">
<label>Desired Tread Depth (inches)</label>
<input type="number" id="treadD" value="11" min="9" max="14" step="0.125" aria-label="Tread D">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const totalRise=parseFloat(document.getElementById('rise').value)||0;
const desiredRiser=parseFloat(document.getElementById('riserH').value)||7;
const treadDepth=parseFloat(document.getElementById('treadD').value)||11;
const numRisers=Math.ceil(totalRise/desiredRiser);
const actualRiser=totalRise/numRisers;
const numTreads=numRisers-1;
const totalRun=numTreads*treadDepth;
const stringerLen=Math.sqrt(totalRise**2+totalRun**2);
let code=actualRiser<=7.75?'<p class="ok">✓ Riser height within IRC max (7.75")</p>':'<p class="warning">⚠️ Riser exceeds IRC max of 7.75"</p>';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Number of Risers:</span><span>${numRisers}</span></div>
<div class="result-row"><span>Actual Riser Height:</span><span>${actualRiser.toFixed(3)}"</span></div>
<div class="result-row"><span>Number of Treads:</span><span>${numTreads}</span></div>
<div class="result-row"><span>Total Run:</span><span>${totalRun.toFixed(1)}"</span></div>
<div class="result-row"><span>Stringer Length:</span><span>${stringerLen.toFixed(1)}"</span></div>
${code}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
