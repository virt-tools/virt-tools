<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Deck Board Gap Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Deck Board Gap Calculator</h1>
<p>Calculate deck board gap, number of boards, and total linear feet from deck width and board width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Deck width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-b">Board width</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 5.5"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),B=pn(bEl.value);
if(W==null||B==null)return;
if(!isFinite(W)||!isFinite(B)||W<=0||B<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var gap=0.25;
var totalIn=W*12;
var boardPlusGap=B+gap;
var boards=Math.ceil(totalIn/boardPlusGap);
var totalLinFt=boards*W;
var html='<div class="big">'+boards+' boards</div>';
html+=row("Deck width",rnd(W,1)+' ft');
html+=row("Board width",rnd(B,1)+' in');
html+=row("Gap",gap+' in');
html+=row("Boards needed",boards);
html+=row("Total linear ft",rnd(totalLinFt,0)+' ft');
out.innerHTML=html;
}
[wEl,bEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
