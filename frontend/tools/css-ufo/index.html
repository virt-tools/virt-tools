<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS UFO Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(180deg,#0d0d2e,#1a1a4a 60%,#2a3a6a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🛸 CSS UFO Generator</h1>
<p>Create CSS UFO flying saucer with dome, lights, beam, and optional hover animation. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="classic">Classic</option><option value="retro">Retro</option><option value="futuristic">Futuristic</option></select></div>
<div class="ctrl-row"><label>Saucer Color</label><input type="color" id="saucerColor" value="#b0bec5" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Dome Color</label><input type="color" id="domeColor" value="#80d8ff" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Beam</label><select id="beam"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Hover Animation</label><select id="hover"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="180" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var sc=document.getElementById('saucerColor').value;
var dc=document.getElementById('domeColor').value;
var beam=document.getElementById('beam').value;
var hover=document.getElementById('hover').value;
var sz=parseInt(document.getElementById('size').value);
var sw=sz,dh=sz*0.3;
var html='<div class="ufo u-'+st+(hover==='on'?' hover':'')+'">\n  <div class="dome"></div>\n  <div class="saucer"><div class="lights"></div></div>'+(beam==='on'?'\n  <div class="beam"></div>':'')+'\n</div>';
var css='.ufo{position:relative;display:flex;flex-direction:column;align-items:center}\n';
if(hover==='on'){css+='.ufo.hover{animation:ufohover 3s ease-in-out infinite}\n@keyframes ufohover{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}\n'}
css+='.dome{width:'+(sz*0.5)+'px;height:'+dh+'px;background:linear-gradient(180deg,'+dc+',rgba('+dc.substr(1,2)+','+dc.substr(3,2)+','+dc.substr(5,2)+',0.5));border-radius:'+(sz*0.25)+'px '+(sz*0.25)+'px 0 0;position:relative;z-index:2}\n';
css+='.saucer{width:'+sw+'px;height:'+(sz*0.2)+'px;background:radial-gradient(ellipse at center,'+sc+' 0%,'+sc+' 40%,#555 100%);border-radius:50%;position:relative;z-index:3;box-shadow:0 4px 10px rgba(0,0,0,0.4)}\n';
css+='.lights{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:'+(sz*0.8)+'px;height:8px;background:repeating-linear-gradient(90deg,#ff0 0,#ff0 6px,transparent 6px,transparent 14px);border-radius:4px}\n';
css+='.lights{animation:lights 2s linear infinite}\n';
css+='@keyframes lights{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}\n';
if(beam==='on'){
css+='.beam{width:'+(sz*0.3)+'px;height:'+(sz*0.5)+'px;background:linear-gradient(180deg,rgba(255,255,150,0.4),transparent);clip-path:polygon(0 0,100% 0,75% 100%,25% 100%);position:relative;margin-top:-4px;z-index:1}\n';
}
if(st==='futuristic'){
css+='.u-ufo-futuristic .saucer{border-radius:30%}\n.u-ufo-futuristic .dome{background:linear-gradient(180deg,#80d8ff,transparent)}\n';
}else if(st==='retro'){
css+='.u-ufo-retro .saucer{border-radius:50% 50% 50% 50% / 60% 60% 40% 40%}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','saucerColor','domeColor','beam','hover','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
