<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Splitter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Splitter</h1>
<p class="subtitle">Split a large CSV into multiple files by row count. Downloads each chunk as a separate CSV.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="header1,header2&#10;row1val1,row1val2&#10;..." aria-label="Header1,Header2&#10;Row1Val1,Row1Val2&#10;..."></textarea>
<div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
<label>Rows per file:</label><input type="number" id="chunkSize" value="100" min="1" style="width:80px;" aria-label="Chunk Size">
<button id="run" class="primary-btn" type="button">Split</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
function download(filename,content){
const blob=new Blob([content],{type:'text/csv'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=filename;a.click();
URL.revokeObjectURL(url);
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];const data=rows.slice(1);
const size=parseInt(document.getElementById('chunkSize').value)||100;
const chunks=[];
for(let i=0;i<data.length;i+=size){chunks.push(data.slice(i,i+size));}
chunks.forEach((chunk,idx)=>{
const content=toCSV([header,...chunk]);
download('chunk_'+(idx+1)+'_of_'+chunks.length+'.csv',content);
});
const r=document.getElementById('result');
r.innerHTML='<p>Split '+data.length+' rows into '+chunks.length+' files ('+size+' rows each). Downloads started.</p>';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
