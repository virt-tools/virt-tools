<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Safety Glass Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Safety Glass Selector</h1>
<p>Choose the right eye protection for your task — from basic impact to chemical splash and UV. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-task">Task</label><select id="in-task"><option value="">Select…</option><option value="impact">Impact / flying debris</option><option value="splash">Chemical splash</option><option value="dust">Dust / particles</option><option value="uv">UV / welding flash</option><option value="laser">Laser / high-energy</option><option value="cutting">Cutting / grinding</option></select><div class="unit">task</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Select a task to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var specs={
impact:{rating:"ANSI Z87.1+",type:"Safety glasses with side shields",notes:"Polycarbonate lenses, impact rated"},
splash:{rating:"ANSI Z87.1 + D3",type:"Chemical splash goggles",notes:"Indirect ventilation, sealed around eyes"},
dust:{rating:"ANSI Z87.1 + D4",type:"Dust goggles",notes:"Direct-sealed, no ventilation gaps"},
uv:{rating:"ANSI Z87.1 + U6",type:"UV-filtering safety glasses",notes:"Shade 3–5 for welding, U6 for UV protection"},
laser:{rating:"ANSI Z136 + EN 207",type:"Laser safety glasses (wavelength-specific)",notes:"Match OD rating to laser wavelength"},
cutting:{rating:"ANSI Z87.1 + side shields",type:"Wraparound safety glasses + face shield",notes:"Face shield over glasses for grinding"}
};
var tEl=document.getElementById("in-task"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var t=tEl.value;
if(!t)return;
err.textContent="";
var s=specs[t];
var html='<div class="big">'+s.type+'</div>';
html+='<div class="row"><span class="k">Rating</span><span class="v">'+s.rating+'</span></div>';
html+='<div class="row"><span class="k">Notes</span><span class="v">'+s.notes+'</span></div>';
out.innerHTML=html;
}
tEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
