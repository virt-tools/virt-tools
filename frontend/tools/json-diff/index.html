<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Diff — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Diff</h1>
<p class="subtitle">Compare two JSON objects and highlight added, removed, and changed keys. 100% client-side.</p>
<div class="input-section">
<label>JSON A</label>
<textarea id="a" rows="5" placeholder='{"a":1,"b":2}' aria-label="{"></textarea>
<label>JSON B</label>
<textarea id="b" rows="5" placeholder='{"a":1,"c":3}' aria-label="{"></textarea>
<button id="compare" class="primary-btn" type="button">Compare</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function diff(a,b,prefix){
const changes=[];
const keys=new Set([...Object.keys(a),...Object.keys(b)]);
for(const k of keys){
const path=prefix?prefix+'.'+k:k;
if(!(k in a))changes.push({path,type:'added',value:b[k]});
else if(!(k in b))changes.push({path,type:'removed',value:a[k]});
else if(typeof a[k]==='object'&&a[k]!==null&&typeof b[k]==='object'&&b[k]!==null)changes.push(...diff(a[k],b[k],path));
else if(JSON.stringify(a[k])!==JSON.stringify(b[k]))changes.push({path,type:'changed',from:a[k],to:b[k]});
}
return changes;
}
document.getElementById('compare').addEventListener('click',()=>{
try{
const a=JSON.parse(document.getElementById('a').value);
const b=JSON.parse(document.getElementById('b').value);
const changes=diff(a,b,'');
if(!changes.length){document.getElementById('result').innerHTML='<p>Objects are identical.</p>';return;}
let html='<table style="width:100%;border-collapse:collapse;"><tr><th style="text-align:left;padding:4px;border:1px solid #444">Path</th><th style="text-align:left;padding:4px;border:1px solid #444">Change</th><th style="text-align:left;padding:4px;border:1px solid #444">Details</th></tr>';
for(const c of changes){
const color=c.type==='added'?'#4caf50':c.type==='removed'?'#f44336':'#ff9800';
html+=`<tr><td style="padding:4px;border:1px solid #444">${c.path}</td><td style="padding:4px;border:1px solid #444;color:${color}">${c.type}</td><td style="padding:4px;border:1px solid #444">${c.from!==undefined?'from: '+JSON.stringify(c.from)+' → ':''}to: ${JSON.stringify(c.value||c.to)}</td></tr>`;
}
html+='</table>';
document.getElementById('result').innerHTML=html;
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
