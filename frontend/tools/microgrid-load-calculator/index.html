<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Microgrid Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Microgrid Load Calculator</h1>
<p>Calculate microgrid total load, peak demand, and generation sizing from connected loads and diversity factor. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Total connected load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-div">Diversity factor</label><input type="text" id="in-div" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.7"><div class="unit">0–1</div></div>
<div class="field"><label class="f" for="in-growth">Annual growth rate</label><input type="text" id="in-growth" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lE=document.getElementById("in-load"),dE=document.getElementById("in-div"),gE=document.getElementById("in-growth"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var l=parseFloat(lE.value),d=parseFloat(dE.value),g=parseFloat(gE.value);
if(isNaN(l)||isNaN(d)||isNaN(g))return;
if(l<=0||d<=0||d>1){err.textContent="Load must be positive; diversity factor must be between 0 and 1.";return}
if(g<=-100){err.textContent="Growth rate must be greater than -100%.";return}
err.textContent="";
var peak=l*d;
var gen=peak*1.2;
var future=gen*Math.pow(1+g/100,5);
var html='<div class="big">'+(Math.round(peak))+' kW</div>';
html+=row("Peak demand",Math.round(peak)+' kW');
html+=row("Generation size",Math.round(gen)+' kW');
html+=row("5-year capacity",Math.round(future)+' kW');
out.innerHTML=html;
}
[lE,dE,gE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
