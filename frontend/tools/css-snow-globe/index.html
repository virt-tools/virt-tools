<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Snow Globe Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⛄ CSS Snow Globe Generator</h1>
<p>Create CSS animated snow globe with falling snow. Adjustable dome/base colors, snow count. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Dome Color</label><input type="color" id="dc" value="#87ceeb"></div>
<div class="ctrl-row"><label>Base Color</label><input type="color" id="bc" value="#8b4513"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="120" max="220" step="5" value="160" style="width:200px"></div>
<div class="ctrl-row"><label>Snowflakes</label><input type="range" id="sf" min="10" max="60" step="5" value="30" style="width:200px"></div>
<div class="ctrl-row"><label>Scene</label><select id="scene"><option value="snowman">Snowman</option><option value="tree">Tree</option><option value="house">House</option><option value="star">Star</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var dc=document.getElementById('dc').value;
var bc=document.getElementById('bc').value;
var sz=document.getElementById('sz').value;
var sf=parseInt(document.getElementById('sf').value);
var scene=document.getElementById('scene').value;
var baseH=sz*0.18;
var sceneHTML=scene==='snowman'?'<div class="snowman"></div>':scene==='tree'?'<div class="tree"></div>':scene==='house'?'<div class="house"></div>':'<div class="star"></div>';
var snowHTML='';
for(var i=0;i<sf;i++)snowHTML+='<div class="flake" style="left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*3)+'s;animation-duration:'+(3+Math.random()*4)+'s;width:'+(2+Math.random()*4)+'px;height:'+(2+Math.random()*4)+'px"></div>';
var html='<div class="snow-globe">\n  <div class="dome">'+sceneHTML+snowHTML+'</div>\n  <div class="base"></div>\n</div>';
var css='.snow-globe{display:flex;flex-direction:column;align-items:center}\n';
css+='.dome{width:'+sz+'px;height:'+sz+'px;background:radial-gradient(circle at 35% 30%,'+dc+'55,'+dc+'22 80%);border-radius:50% 50% 20% 20%;position:relative;overflow:hidden;border:2px solid '+dc+'88;box-shadow:inset 0 -10px 20px '+dc+'33}\n';
css+='.flake{position:absolute;top:-10px;background:#fff;border-radius:50%;animation:fall linear infinite;opacity:0.8}\n';
css+='@keyframes fall{0%{top:-10px;transform:translateX(0)}50%{transform:translateX(10px)}100%{top:'+(sz-baseH)+'px;transform:translateX(-10px)}}\n';
if(scene==='snowman'){css+='.snowman{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(sz*0.25)+'px;height:'+(sz*0.35)+'px;background:radial-gradient(circle,#fff,#eee);border-radius:50%;box-shadow:0 0 0 3px #ccc}\n'}
if(scene==='tree'){css+='.tree{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:'+(sz*0.12)+'px solid transparent;border-right:'+(sz*0.12)+'px solid transparent;border-bottom:'+(sz*0.3)+'px solid #2d8e2d}\n'}
if(scene==='house'){css+='.house{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(sz*0.2)+'px;height:'+(sz*0.2)+'px;background:#b88;border-bottom:2px solid #900}\n.house::before{content:"";position:absolute;top:-'+(sz*0.08)+'px;left:-'+(sz*0.04)+'px;width:0;height:0;border-left:'+(sz*0.14)+'px solid transparent;border-right:'+(sz*0.14)+'px solid transparent;border-bottom:'+(sz*0.08)+'px solid #a00}\n'}
if(scene==='star'){css+='.star{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);width:'+(sz*0.15)+'px;height:'+(sz*0.15)+'px;background:'+bc+';clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}\n'}
css+='.base{width:'+(sz*1.1)+'px;height:'+baseH+'px;background:radial-gradient(ellipse,'+bc+'cc,'+bc+' 70%);border-radius:0 0 50% 50%/0 0 100% 100%;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.3)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['dc','bc','sz','sf','scene'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
