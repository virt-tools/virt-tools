<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voltage Divider Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Voltage Divider Calculator</h1>
<p class="subtitle">Calculate output voltage, resistor values, and current for voltage divider circuits.</p>
<div class="input-section">
<label>Input Voltage (V)</label>
<input type="number" id="vin" value="12" min="0.1" step="0.1" aria-label="Vin">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="calcV" selected>Find Output Voltage</option>
<option value="calcR">Find R2 for Target Vout</option>
</select>
<div id="r1Section">
<label>R1 (Ω)</label>
<input type="number" id="r1" value="10000" min="1" step="any" aria-label="R1">
</div>
<div id="r2Section">
<label>R2 (Ω)</label>
<input type="number" id="r2" value="5000" min="1" step="any" aria-label="R2">
</div>
<div id="voutSection" style="display:none">
<label>Target Vout (V)</label>
<input type="number" id="targetVout" value="5" min="0" step="0.1" aria-label="Target Vout">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{
if(mode.value==='calcV'){
document.getElementById('r2Section').style.display='';
document.getElementById('voutSection').style.display='none';
}else{
document.getElementById('r2Section').style.display='none';
document.getElementById('voutSection').style.display='';
}
});
document.getElementById('calc').addEventListener('click',()=>{
const Vin=parseFloat(document.getElementById('vin').value)||0;
const R1=parseFloat(document.getElementById('r1').value)||1;
if(mode.value==='calcV'){
const R2=parseFloat(document.getElementById('r2').value)||1;
const Vout=Vin*R2/(R1+R2);
const I=Vin/(R1+R2);
const pR1=I*I*R1;
const pR2=I*I*R2;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Input Voltage:</span><span>${Vin} V</span></div>
<div class="result-row"><span>R1:</span><span>${R1} Ω</span></div>
<div class="result-row"><span>R2:</span><span>${R2} Ω</span></div>
<div class="result-row"><span>Output Voltage:</span><span>${Vout.toFixed(4)} V</span></div>
<div class="result-row"><span>Current:</span><span>${(I*1000).toFixed(4)} mA</span></div>
<div class="result-row"><span>Power (R1):</span><span>${pR1.toFixed(6)} W</span></div>
<div class="result-row"><span>Power (R2):</span><span>${pR2.toFixed(6)} W</span></div>`;
}else{
const Vout=parseFloat(document.getElementById('targetVout').value)||0;
const R2=R1*Vout/(Vin-Vout);
const I=Vin/(R1+R2);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Input Voltage:</span><span>${Vin} V</span></div>
<div class="result-row"><span>Target Vout:</span><span>${Vout} V</span></div>
<div class="result-row"><span>R1:</span><span>${R1} Ω</span></div>
<div class="result-row"><span>Required R2:</span><span>${R2.toFixed(2)} Ω</span></div>
<div class="result-row"><span>Current Draw:</span><span>${(I*1000).toFixed(4)} mA</span></div>`;
}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
