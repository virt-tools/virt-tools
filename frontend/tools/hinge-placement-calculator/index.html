<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hinge Placement Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hinge Placement Calculator</h1>
<p>Calculate hinge positions for cabinet doors given door height and number of hinges. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dh">Door height</label><input type="text" id="in-dh" inputmode="decimal" autocomplete="off" placeholder="e.g. 600"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-n">Hinges</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter door height.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dhEl=document.getElementById("in-dh"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var DH=pn(dhEl.value),N=pn(nEl.value);
if(DH==null){return}
N=N==null?3:N;
if(!isFinite(DH)||!isFinite(N)||DH<=0||N<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var offset=100;
if(offset>DH/4)offset=Math.round(DH/4);
var positions=[];
if(N==2){positions=[offset,DH-offset]}
else if(N==3){positions=[offset,Math.round(DH/2),DH-offset]}
else{positions=[offset];var mid=(DH-2*offset)/(N-2);for(var i=1;i<N-1;i++)positions.push(Math.round(offset+mid*i));positions.push(DH-offset)}
var html='<div class="big">'+N+' hinges</div>';
html+=row("Door height",rnd(DH,0)+" mm");
html+=row("Hinge count",N);
html+=row("Top offset",rnd(offset,0)+" mm");
positions.forEach(function(p,i){html+=row("Hinge "+(i+1)+" at",p+" mm")});
out.innerHTML=html;
}
[dhEl,nEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
