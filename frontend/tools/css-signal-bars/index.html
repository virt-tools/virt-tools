<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Signal/WiFi Strength Indicator Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:180px;display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📡 CSS Signal/WiFi Strength Indicator Generator</h1>
<p>Create CSS signal strength bars and WiFi indicators. 4 styles, adjustable strength/size/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="bars" selected>Bars</option><option value="wifi">WiFi Arc</option><option value="dot">Dot Rings</option><option value="gauge">Gauge</option></select></div>
<div class="ctrl-row"><label>Strength</label><input type="range" id="strength" value="3" min="0" max="4" style="width:200px"><span id="strengthVal">3/4</span></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option></select></div>
<div class="ctrl-row"><label>Active Color</label><input type="color" id="activeColor" value="#44ff44" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Inactive Color</label><input type="color" id="inactiveColor" value="#333" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Animated</label><input type="checkbox" id="animated"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var strength=parseInt(document.getElementById('strength').value);
document.getElementById('strengthVal').textContent=strength+'/4';
var size=document.getElementById('size').value;
var ac=document.getElementById('activeColor').value;
var ic=document.getElementById('inactiveColor').value;
var anim=document.getElementById('animated').checked;
var sz={sm:16,md:24,lg:36}[size];
var html='',css='';
if(style==='bars'){
html='<div class="signal-bars">\n';
for(var i=1;i<=4;i++)html+='  <div class="bar b'+i+(i<=strength?' active':'')+'"></div>\n';
html+='</div>';
css='.signal-bars{display:flex;align-items:flex-end;gap:3px}\n';
css+='.bar{width:'+Math.round(sz*0.4)+'px;background:'+ic+';border-radius:2px;transition:background .3s}\n';
for(var i=1;i<=4;i++)css+='.b'+i+'{height:'+Math.round(sz*i/4)+'px}\n';
css+='.bar.active{background:'+ac+(anim?';animation:bar-pulse 1s infinite':';')+'}\n';
css+='.bar.active.b'+strength+'{animation-delay:0s}\n';
if(anim)css+='@keyframes bar-pulse{0%,100%{opacity:1}50%{opacity:.5}}\n';
}else if(style==='wifi'){
html='<div class="signal-wifi">\n';
html+='  <div class="wifi-arc w1'+(strength>=1?' active':'')+'"></div>\n';
html+='  <div class="wifi-arc w2'+(strength>=2?' active':'')+'"></div>\n';
html+='  <div class="wifi-arc w3'+(strength>=3?' active':'')+'"></div>\n';
html+='  <div class="wifi-arc w4'+(strength>=4?' active':'')+'"></div>\n';
html+='  <div class="wifi-dot"></div>\n</div>';
css='.signal-wifi{position:relative;width:'+sz*2+'px;height:'+sz*2+'px}\n';
for(var i=1;i<=4;i++){
var r=sz*(i/4)*2;
css+='.w'+i+'{width:'+r+'px;height:'+r+'px;border:'+Math.max(2,sz/8)+'px solid '+(i<=strength?ac:ic)+';border-radius:50%;border-bottom-color:transparent;border-left-color:transparent;border-right-color:transparent;position:absolute;bottom:0;left:50%;transform:translateX(-50%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:border-color .3s}\n';
}
css+='.wifi-dot{width:'+Math.max(4,sz/6)+'px;height:'+Math.max(4,sz/6)+'px;background:'+ac+';border-radius:50%;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}\n';
if(anim)css+='.wifi-arc.active{animation:wifi-pulse 1.5s infinite}\n@keyframes wifi-pulse{0%,100%{opacity:1}50%{opacity:.4}}\n';
}else if(style==='dot'){
html='<div class="signal-dots">\n';
for(var i=1;i<=4;i++)html+='  <div class="dot-ring r'+i+(i<=strength?' active':'')+'"></div>\n';
html+='</div>';
css='.signal-dots{position:relative;width:'+(sz*2)+'px;height:'+(sz*2)+'px;display:flex;align-items:center;justify-content:center}\n';
for(var i=1;i<=4;i++){
var r=sz*(i/4)*2;
css+='.r'+i+'{width:'+r+'px;height:'+r+'px;border:2px solid '+(i<=strength?ac:ic)+';border-radius:50%;position:absolute;transition:border-color .3s'+(anim&&i<=strength?';animation:ring-pulse 2s infinite':'')+'}\n';
}
if(anim)css+='@keyframes ring-pulse{0%,100%{opacity:1}50%{opacity:.3}}\n';
}else if(style==='gauge'){
html='<div class="signal-gauge" style="--strength:'+strength+';--ac:'+ac+';--ic:'+ic+';--sz:'+(sz*2)+'px">\n  <span>'+strength+'/4</span>\n</div>';
css='.signal-gauge{width:var(--sz);height:calc(var(--sz)*0.5);border-radius:calc(var(--sz)*0.5) calc(var(--sz)*0.5) 0 0;background:conic-gradient(from 270deg,var(--ac) calc(var(--strength)*25%),var(--ic) 0);mask:radial-gradient(circle at 50% 100%,transparent calc(var(--sz)*0.35),black calc(var(--sz)*0.4));display:flex;align-items:flex-end;justify-content:center;font-size:calc(var(--sz)*0.2);font-weight:bold;color:var(--ac)}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','strength','size','activeColor','inactiveColor','animated'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
