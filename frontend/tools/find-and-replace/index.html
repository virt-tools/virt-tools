<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find & Replace — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Find & Replace</h1>
<p class="subtitle">Search and replace text with optional regex, case sensitivity, and global matching.</p>
<div class="input-section">
<label>Input text</label>
<textarea id="input" rows="10" placeholder="Paste text here..." aria-label="Paste Text Here..."></textarea>
<label>Find</label>
<input type="text" id="find" placeholder="Text or regex pattern" aria-label="Text Or Regex Pattern">
<label>Replace with</label>
<input type="text" id="replace" placeholder="Replacement text" aria-label="Replacement Text">
<div class="checkbox-group">
<label><input type="checkbox" id="regex"> Use regex</label>
<label><input type="checkbox" id="case-sensitive" checked> Case sensitive</label>
<label><input type="checkbox" id="global" checked> Replace all</label>
</div>
<button id="process" class="primary-btn" type="button">Replace</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',()=>{
const input=document.getElementById('input').value;
const find=document.getElementById('find').value;
const replace=document.getElementById('replace').value;
const isRegex=document.getElementById('regex').checked;
const isCase=document.getElementById('case-sensitive').checked;
const isGlobal=document.getElementById('global').checked;
let flags='';
if(!isCase)flags+='i';
if(isGlobal)flags+='g';
const pattern=isRegex?new RegExp(find,flags):new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),flags);
const result=input.replace(pattern,replace);
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+result.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=result;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
