<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Formation Damage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Formation Damage Calculator</h1>
<p>Calculate skin factor and damage ratio from permeability and damage radius (Hawkins formula, assumed well radius 0.328 ft). Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-k">Undamaged permeability</label><input type="text" id="in-k" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">md</div></div>
<div class="field"><label class="f" for="in-ks">Damaged permeability</label><input type="text" id="in-ks" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">md</div></div>
<div class="field"><label class="f" for="in-rs">Damage radius</label><input type="text" id="in-rs" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var kE=document.getElementById("in-k"),ksE=document.getElementById("in-ks"),rsE=document.getElementById("in-rs"),err=document.getElementById("err"),out=document.getElementById("out");
var PROMPT='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var k=parseFloat(kE.value),ks=parseFloat(ksE.value),rs=parseFloat(rsE.value);
if(isNaN(k)||isNaN(ks)||isNaN(rs)){err.textContent="";out.innerHTML=PROMPT;return}
if(k<=0||ks<=0){err.textContent="Enter valid positive permeabilities.";out.innerHTML=PROMPT;return}
var rw=0.328;
if(rs<=rw){err.textContent="Damage radius must exceed the assumed well radius ("+rw+" ft).";out.innerHTML=PROMPT;return}
err.textContent="";
var skin=(k/ks-1)*Math.log(rs/rw);
var damageRatio=k/ks;
var permReduction=(1-ks/k)*100;
var html='<div class="big">'+Math.round(skin*100)/100+'</div>';
html+=row("Skin factor",Math.round(skin*100)/100);
html+=row("Damage ratio",Math.round(damageRatio*100)/100);
html+=row("Permeability reduction",Math.round(permReduction)+'%');
html+=row("Assumed well radius rw",rw+' ft');
out.innerHTML=html;
}
[kE,ksE,rsE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
