<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Normalizer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Normalizer</h1>
<p class="subtitle">Normalize audio to a target peak level. Export as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="process" class="primary-btn" type="button">Normalize & Download</button>
</div>
<div class="controls">
<label>Target Peak (dB): <input type="range" id="target" min="-24" max="0" value="-1" step="0.5"><span id="tv">-1.0</span></label>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const el=document.getElementById('target');
const sp=document.getElementById('tv');
el.addEventListener('input',()=>sp.textContent=parseFloat(el.value).toFixed(1));
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const sr=buf.sampleRate;
const ch=buf.getChannelData(0);
let peak=0;
for(let i=0;i<ch.length;i++){const a=Math.abs(ch[i]);if(a>peak)peak=a;}
const targetDb=parseFloat(document.getElementById('target').value);
const targetPeak=Math.pow(10,targetDb/20);
const gain=peak>0?targetPeak/peak:1;
const out=new Float32Array(ch.length);
for(let i=0;i<ch.length;i++)out[i]=Math.max(-1,Math.min(1,ch[i]*gain));
const off=new OfflineAudioContext(1,out.length,sr);
const nb=off.createBuffer(1,out.length,sr);
nb.copyToChannel(out,0);
const src=off.createBufferSource();src.buffer=nb;
src.connect(off.destination);src.start();
const rendered=await off.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='normalized.wav';a.click();
st.textContent=`Done! Peak was ${(20*Math.log10(peak)).toFixed(1)}dB, gain ${gain.toFixed(2)}x`;
audioCtx.close();
});
function audioBufferToWav(b){
const n=b.length,sr=b.sampleRate;
const data=b.getChannelData(0);
const buf=new ArrayBuffer(44+n*2);
const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,data[i]*32767)),true);
return buf;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
