<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Watermark — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Watermark</h1>
<p class="subtitle">Add text watermarks to images with adjustable font size, opacity, position, and rotation. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Text: <input type="text" id="wmText" value="WATERMARK" style="width:150px"></label>
<label>Size: <input type="number" id="wmSize" value="48" min="8" max="200" style="width:60px"></label>
<label>Opacity: <input type="range" id="wmOpacity" min="10" max="100" value="50"></label>
<label>Pos:
<select id="wmPos">
<option value="tl">Top-Left</option>
<option value="tc">Top-Center</option>
<option value="tr">Top-Right</option>
<option value="cc" selected>Center</option>
<option value="bl">Bottom-Left</option>
<option value="bc">Bottom-Center</option>
<option value="br">Bottom-Right</option>
</select></label>
<button onclick="apply()" type="button">Apply</button>
<button onclick="download()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
img=new Image();img.onload=function(){
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
};img.src=URL.createObjectURL(f);
});
function apply(){
if(!img)return;
ctx.drawImage(img,0,0);
var t=document.getElementById('wmText').value;
var s=parseInt(document.getElementById('wmSize').value);
var o=parseInt(document.getElementById('wmOpacity').value)/100;
var pos=document.getElementById('wmPos').value;
ctx.font='bold '+s+'px sans-serif';
ctx.fillStyle='rgba(255,255,255,'+o+')';
ctx.strokeStyle='rgba(0,0,0,'+(o*0.5)+')';
ctx.lineWidth=2;
var m=ctx.measureText(t),w=canvas.width,h=canvas.height;
var x,y;
if(pos=='tl'){x=20;y=s+20;}
else if(pos=='tc'){x=(w-m.width)/2;y=s+20;}
else if(pos=='tr'){x=w-m.width-20;y=s+20;}
else if(pos=='cc'){x=(w-m.width)/2;y=h/2;}
else if(pos=='bl'){x=20;y=h-20;}
else if(pos=='bc'){x=(w-m.width)/2;y=h-20;}
else if(pos=='br'){x=w-m.width-20;y=h-20;}
ctx.strokeText(t,x,y);ctx.fillText(t,x,y);
}
function download(){
canvas.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='watermarked.png';a.click();});
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
