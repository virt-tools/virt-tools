<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Arbor Material Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Arbor Material Calculator</h1>
<p>Calculate lumber needed for a garden arbor from dimensions and post count. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Arbor width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-d">Arbor depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-h">Arbor height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),D=pn(dEl.value),H=pn(hEl.value);
if(W==null||D==null||H==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return}
if(!isFinite(W)||!isFinite(D)||!isFinite(H)||W<=0||D<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var posts=4;
var postLen=H;
var beams=2*(W+D);
var slats=Math.ceil(W*12/6);
var slatLen=D;
var totalLumber=posts*postLen+beams+slats*slatLen;
var html='<div class="big">'+rnd(totalLumber,0)+' ft</div>';
html+=row("Posts (4)",rnd(posts*postLen,0)+' ft');
html+=row("Beams (top frame)",rnd(beams,0)+' ft');
html+=row("Top slats",slats+' @ '+rnd(slatLen,0)+' ft');
html+=row("Total lumber",rnd(totalLumber,0)+' ft');
out.innerHTML=html;
}
[wEl,dEl,hEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
