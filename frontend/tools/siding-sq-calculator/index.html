<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Siding Squares Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Siding Squares Calculator</h1>
<p>Calculate siding squares, waste factor, and total material from wall area and waste %. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Wall area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 1200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-w">Waste factor</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),W=pn(wEl.value);
if(A==null||W==null)return;
if(!isFinite(A)||!isFinite(W)||A<=0||W<0){err.textContent="Enter valid values.";return}
err.textContent="";
var total=A*(1+W/100);
var squares=total/100;
var html='<div class="big">'+rnd(squares,1)+' squares</div>';
html+=row("Wall area",rnd(A,0)+" sq ft");
html+=row("Waste factor",rnd(W,0)+" %");
html+=row("Total area w/ waste",rnd(total,0)+" sq ft");
html+=row("Squares needed",rnd(squares,1));
out.innerHTML=html;
}
[aEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
