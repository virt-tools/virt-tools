<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to XML Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to XML Converter</h1>
<p class="subtitle">Convert CSV data to XML format with configurable root and row element names.</p>
<div class="input-section">
<label>CSV Input</label>
<textarea id="input" rows="8" placeholder="Name,Age,City&#10;Alice,30,NYC" aria-label="Name,Age,City&#10;Alice,30,Nyc"></textarea>
<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
<input id="root" value="data" style="width:100px;" placeholder="Root" aria-label="Root">
<input id="row" value="record" style="width:100px;" placeholder="Row" aria-label="Row">
<button id="run" class="primary-btn" type="button">Convert</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeTag(s){return s.replace(/[^a-zA-Z0-9_]/g,'_').replace(/^([0-9])/,'_$1')||'field';}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);
if(rows.length<2){return;}
const headers=rows[0].map(safeTag);
const root=document.getElementById('root').value||'data';
const rowName=document.getElementById('row').value||'record';
let xml='<?xml version="1.0" encoding="UTF-8"?>\n<'+root+'>\n';
for(let i=1;i<rows.length;i++){
xml+='  <'+rowName+'>\n';
for(let j=0;j<headers.length;j++){
xml+='    <'+headers[j]+'>'+esc(rows[i][j]||'')+'</'+headers[j]+'>\n';
}
xml+='  </'+rowName+'>\n';
}
xml+='</'+root+'>';
const r=document.getElementById('result');
r.innerHTML='<textarea rows="12" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+xml+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
