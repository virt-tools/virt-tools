<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Reflection Seismic Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Reflection Seismic Calculator</h1>
<p>Calculate RMS velocity and reflector depth from zero-offset and offset two-way travel times. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t0">Zero-offset TWT</label><input type="text" id="in-t0" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ms</div></div>
<div class="field"><label class="f" for="in-tx">Offset TWT</label><input type="text" id="in-tx" inputmode="decimal" autocomplete="off" placeholder="e.g. 105"><div class="unit">ms</div></div>
<div class="field"><label class="f" for="in-x">Offset distance</label><input type="text" id="in-x" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var t0E=document.getElementById("in-t0"),txE=document.getElementById("in-tx"),xE=document.getElementById("in-x"),err=document.getElementById("err"),out=document.getElementById("out");
var PH='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var t0=parseFloat(t0E.value),tx=parseFloat(txE.value),x=parseFloat(xE.value);
if(isNaN(t0)||isNaN(tx)||isNaN(x)){err.textContent="";return}
if(t0<=0||tx<=0||x<=0){err.textContent="Enter valid values.";out.innerHTML=PH;return}
if(tx<=t0){err.textContent="Offset TWT must exceed zero-offset TWT.";out.innerHTML=PH;return}
err.textContent="";
var dt2=tx*tx-t0*t0;
var v=x/Math.sqrt(dt2)*1000;
var depth=v*t0/2/1000;
var html='<div class="big">'+Math.round(v)+' m/s</div>';
html+=row("RMS velocity Vrms",Math.round(v)+' m/s');
html+=row("Reflector depth",Math.round(depth*100)/100+' m');
out.innerHTML=html;
}
[t0E,txE,xE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
