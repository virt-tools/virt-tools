<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Artificial Lift Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Artificial Lift Selector</h1>
<p>Select the best artificial lift method based on well depth, production rate, fluid properties, and well deviation. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Well depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rate">Production rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-dev">Deviation</label><input type="text" id="in-dev" inputmode="decimal" autocomplete="off" placeholder="e.g. 0"><div class="unit">deg</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var dE=document.getElementById("in-depth"),rE=document.getElementById("in-rate"),vE=document.getElementById("in-dev"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),r=parseFloat(rE.value),v=parseFloat(vE.value);
if(isNaN(d)||isNaN(r)||isNaN(v))return;
var method;
if(d<2000&&r>1000)method="ESP";
else if(d<8000&&r>200&&v<30)method="Rod Pump";
else if(v>60)method="PCP";
else if(d>8000)method="Gas Lift";
else if(r<100)method="Plunger Lift";
else method="ESP";
out.innerHTML='<div class="big">'+method+'</div>';
}
[dE,rE,vE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
