<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Screed Depth Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Screed Depth Calculator</h1>
<p>Calculate screed volume and material needed from floor area, screed depth, and mix ratio. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Floor area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-d">Screed depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="5"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter floor area and depth.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),dEl=document.getElementById("in-d"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),D=pn(dEl.value),WS=pn(wsEl.value);
if(A==null||D==null){return}
if(!isFinite(A)||!isFinite(D)||A<=0||D<=0){err.textContent="Area and depth must be positive.";return}
WS=WS==null?5:WS;
if(!isFinite(WS)||WS<0){err.textContent="Waste must be non-negative.";return}
err.textContent="";
var vol=A*D;
var total=vol*(1+WS/100);
var cement=total*0.2;
var sand=total*0.8;
var html='<div class="big">'+rnd(total,3)+' m³</div>';
html+=row("Screed volume",rnd(vol,3)+" m³");
html+=row("With "+rnd(WS,0)+"% waste",rnd(total,3)+" m³");
html+=row("Cement (1:4 mix)",rnd(cement,3)+" m³");
html+=row("Sand (1:4 mix)",rnd(sand,3)+" m³");
out.innerHTML=html;
}
[aEl,dEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
