<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Histogram — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Histogram</h1>
<p class="subtitle">View RGB and luminance histograms of any image. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div id="stats" style="margin:10px 0;color:#aaa;font-family:monospace"></div>
<canvas id="canvas" width="600" height="300" style="max-width:100%;border:1px solid #444;margin-top:10px;border-radius:6px"></canvas>
<script>
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
var img=new Image();
img.onload=function(){
var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
var ctx=c.getContext('2d');ctx.drawImage(img,0,0);
var d=ctx.getImageData(0,0,c.width,c.height).data;
var hR=[],hG=[],hB=[],hL=[];
for(var i=0;i<256;i++){hR[i]=hG[i]=hB[i]=hL[i]=0;}
for(var i=0;i<d.length;i+=4){
hR[d[i]]++;hG[d[i+1]]++;hB[d[i+2]]++;
var lum=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
hL[lum]++;
}
var maxVal=Math.max(Math.max.apply(null,hR),Math.max.apply(null,hG),Math.max.apply(null,hB));
var canvas=document.getElementById('canvas');var cctx=canvas.getContext('2d');
cctx.fillStyle='#111';cctx.fillRect(0,0,600,300);
function drawHist(hist,color,offset){
cctx.strokeStyle=color;cctx.lineWidth=1;
cctx.beginPath();
for(var i=0;i<256;i++){
var x=i*600/256;
var y=300-(hist[i]/maxVal*290);
if(i===0)cctx.moveTo(x,y);else cctx.lineTo(x,y);
}
cctx.stroke();
}
drawHist(hL,'rgba(255,255,255,0.4)',0);
drawHist(hR,'rgba(255,50,50,0.7)',0);
drawHist(hG,'rgba(50,255,50,0.7)',0);
drawHist(hB,'rgba(50,50,255,0.7)',0);
document.getElementById('stats').textContent='Image: '+img.naturalWidth+'x'+img.naturalHeight+' | Pixels: '+Math.round(d.length/4);
};
img.src=URL.createObjectURL(f);
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
