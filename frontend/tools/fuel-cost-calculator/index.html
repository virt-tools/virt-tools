<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Cost Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.fc{max-width:500px;margin:0 auto;padding:2rem 1rem}
.fc h1{font-size:2rem;margin-bottom:.5rem}
.fc .sub{color:#888;margin-bottom:1.5rem}
.fc label{font-size:14px;display:block;margin-bottom:4px}
.fc input,select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:1rem}
.fc .res{margin-top:1rem;padding:1.2rem;border:1px solid var(--border);border-radius:12px;text-align:center}
.fc .big{font-size:2rem;font-weight:700;color:var(--accent)}
.fc .lbl{color:#888;font-size:12px}
.fc .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.fc .card{padding:1rem;border:1px solid var(--border);border-radius:12px;text-align:center}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="fc">
<h1>⛽ Fuel Cost Calculator</h1>
<p class="sub">Calculate trip fuel cost and MPG.</p>
<label>Trip Distance:</label>
<input type="number" id="distance" value="300" min="0" oninput="calc()" aria-label="Distance">
<label>Unit:</label>
<select id="distUnit" onchange="calc()" aria-label="Dist Unit">
<option value="miles">Miles</option>
<option value="km">Kilometers</option>
</select>
<label>Vehicle Fuel Efficiency:</label>
<input type="number" id="mpg" value="30" min="1" oninput="calc()" aria-label="Mpg">
<select id="effUnit" onchange="calc()" aria-label="Eff Unit">
<option value="mpg">MPG (US)</option>
<option value="mpg-uk">MPG (UK)</option>
<option value="L/100km">L/100km</option>
</select>
<label>Fuel Price (per gallon/liter):</label>
<input type="number" id="price" value="3.50" step="0.01" min="0" oninput="calc()" aria-label="Price">
<select id="priceUnit" onchange="calc()" aria-label="Price Unit">
<option value="gallon">$/gallon (US)</option>
<option value="gallon-uk">£/gallon (UK)</option>
<option value="liter">$/liter</option>
</select>
<div class="grid">
<div class="card"><div class="lbl">Fuel needed</div><div class="big" id="fuel" style="font-size:1.3rem">0 gal</div></div>
<div class="card"><div class="lbl">Trip cost</div><div class="big" id="cost" style="font-size:1.3rem">$0.00</div></div>
</div>
<div class="card" style="margin-top:1rem"><div class="lbl">Cost per mile</div><div class="big" id="cpm" style="font-size:1.3rem">$0.00</div></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const dist=parseFloat(document.getElementById('distance').value)||0;
  const eff=parseFloat(document.getElementById('mpg').value)||1;
  const price=parseFloat(document.getElementById('price').value)||0;
  const effU=document.getElementById('effUnit').value;
  const pU=document.getElementById('priceUnit').value;
  let fuel,cost;
  if(effU==='mpg'){
    const gal=dist/eff;
    fuel=gal.toFixed(2)+' gal';
    cost=gal*price;
    document.getElementById('cpm').textContent='$'+(dist>0?(cost/dist).toFixed(2):'0.00');
  }else if(effU==='mpg-uk'){
    const gal=dist/eff;
    fuel=gal.toFixed(2)+' gal';
    cost=gal*price;
    document.getElementById('cpm').textContent='£'+(dist>0?(cost/dist).toFixed(2):'0.00');
  }else{
    const liters=dist*eff/100;
    fuel=liters.toFixed(1)+' L';
    cost=liters*price;
    document.getElementById('cpm').textContent='$'+(dist>0?(cost/dist).toFixed(2):'0.00');
  }
  const sym=pU==='gallon-uk'?'£':'$';
  document.getElementById('fuel').textContent=fuel;
  document.getElementById('cost').textContent=sym+cost.toFixed(2);
}
calc();
</script>
</body>
</html>
