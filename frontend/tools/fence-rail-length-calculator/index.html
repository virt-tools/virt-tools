<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fence Rail Length Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fence Rail Length Calculator</h1>
<p>Calculate fence rail length, total rail footage, and number of rails from fence run and post spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Fence run length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-r">Rails per section</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),rEl=document.getElementById("in-r"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),R=pn(rEl.value);
if(L==null||R==null)return;
if(!isFinite(L)||!isFinite(R)||L<=0||R<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var postSp=8;
var sections=Math.ceil(L/postSp);
var totalRail=L*R;
var html='<div class="big">'+rnd(totalRail,0)+' ft</div>';
html+=row("Fence run",rnd(L,0)+' ft');
html+=row("Post spacing",postSp+' ft');
html+=row("Sections",sections);
html+=row("Rails per section",rnd(R,0));
html+=row("Total rail footage",rnd(totalRail,0)+' ft');
out.innerHTML=html;
}
[lEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
