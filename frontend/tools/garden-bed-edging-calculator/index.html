<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Garden Bed Edging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Garden Bed Edging Calculator</h1>
<p>Calculate linear feet of edging material and stakes needed for a garden bed from side lengths. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-seg">Edging segment length</label><input type="text" id="in-seg" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),segEl=document.getElementById("in-seg"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),Seg=pn(segEl.value);
if(L==null||W==null||Seg==null)return;
if(!isFinite(L)||!isFinite(W)||!isFinite(Seg)||L<=0||W<=0||Seg<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var perim=2*(L+W);
var segs=Math.ceil(perim/Seg);
var stakes=Math.ceil(perim/4);
var html='<div class="big">'+rnd(perim,0)+' ft</div>';
html+=row("Bed dimensions",rnd(L,1)+'×'+rnd(W,1)+' ft');
html+=row("Perimeter",rnd(perim,0)+' ft');
html+=row("Edging segments",segs);
html+=row("Stakes needed",stakes);
out.innerHTML=html;
}
[lEl,wEl,segEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
