<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Battery Storage Sizing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Battery Storage Sizing Calculator</h1>
<p>Calculate battery storage capacity, power rating, and footprint from daily energy demand and discharge duration. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-demand">Daily energy demand</label><input type="text" id="in-demand" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">kWh</div></div>
<div class="field"><label class="f" for="in-dur">Discharge duration</label><input type="text" id="in-dur" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">hours</div></div>
<div class="field"><label class="f" for="in-dod">Depth of discharge</label><input type="text" id="in-dod" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.8"><div class="unit">0–1</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-demand"),durE=document.getElementById("in-dur"),dodE=document.getElementById("in-dod"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),dur=parseFloat(durE.value),dod=parseFloat(dodE.value);
if(isNaN(d)||isNaN(dur)||isNaN(dod)){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter demand, duration, and depth of discharge.</span>';return}
if(d<=0||dur<=0||dod<=0||dod>1){out.innerHTML='<span style="color:var(--bad,#f87171)">Enter positive demand and duration, and depth of discharge between 0 and 1.</span>';return}
var power=d/dur;
var capacity=power*dur/dod;
var footprint=capacity/20;
var html='<div class="big">'+(Math.round(capacity))+' kWh</div>';
html+=row("Battery capacity",Math.round(capacity)+' kWh');
html+=row("Power rating",Math.round(power)+' kW');
html+=row("Footprint",Math.round(footprint)+' m²');
out.innerHTML=html;
}
[dE,durE,dodE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
