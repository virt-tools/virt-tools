<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Battery Capacity Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Battery Capacity Selector</h1>
<p>Calculate required battery bank Ah from load, runtime, and system voltage. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Load</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-h">Runtime</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">hours</div></div>
<div class="field"><label class="f" for="in-v">System voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">volts</div></div>
<div class="field"><label class="f" for="in-d">Max depth of discharge</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.8"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter load, runtime, voltage, and DoD.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var WEl=document.getElementById("in-w"),HEl=document.getElementById("in-h"),VEl=document.getElementById("in-v"),DEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(WEl.value),H=pn(HEl.value),V=pn(VEl.value),D=pn(DEl.value);
if(W==null||H==null||V==null||D==null)return;
if(!isFinite(W)||!isFinite(H)||!isFinite(V)||!isFinite(D)||W<=0||H<=0||V<=0||D<=0||D>1){err.textContent="Enter valid values (DoD 0–1).";return}
err.textContent="";
var Wh=W*H;
var rawAh=Wh/V;
var reqAh=rawAh/D;
var html='<div class="big">'+rnd(reqAh,0)+' Ah</div>';
html+=row("Load",rnd(W,0)+" W");
html+=row("Runtime",rnd(H,1)+" hr");
html+=row("System voltage",rnd(V,0)+" V");
html+=row("Energy needed",rnd(Wh,0)+" Wh");
html+=row("Raw Ah",rnd(rawAh,1)+" Ah");
html+=row("Max DoD",rnd(D*100,0)+"%");
html+=row("Required capacity",rnd(reqAh,0)+" Ah");
html+=row("Recommended bank",rnd(Math.ceil(reqAh*1.25/50)*50,0)+" Ah");
out.innerHTML=html;
}
[WEl,HEl,VEl,DEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
