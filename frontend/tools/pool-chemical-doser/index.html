<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pool Chemical Doser — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pool Chemical Doser</h1>
<p>Calculate chlorine, pH adjuster, and algaecide doses from pool volume, current levels, and target. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vol">Pool volume</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 15000"><div class="unit">gallons</div></div>
<div class="field"><label class="f" for="in-cc">Current chlorine</label><input type="text" id="in-cc" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">ppm</div></div>
<div class="field"><label class="f" for="in-tc">Target chlorine</label><input type="text" id="in-tc" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ppm</div></div>
<div class="field"><label class="f" for="in-ph">Current pH</label><input type="text" id="in-ph" inputmode="decimal" autocomplete="off" placeholder="e.g. 7.2"><div class="unit">0-14</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var volEl=document.getElementById("in-vol"),ccEl=document.getElementById("in-cc"),tcEl=document.getElementById("in-tc"),phEl=document.getElementById("in-ph"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(volEl.value),CC=pn(ccEl.value),TC=pn(tcEl.value),PH=pn(phEl.value);
if(V==null||CC==null||TC==null||PH==null)return;
if(!isFinite(V)||!isFinite(CC)||!isFinite(TC)||!isFinite(PH)||V<=0||CC<0||TC<0||PH<0||PH>14){err.textContent="Enter valid values.";return}
err.textContent="";
var dCl=TC-CC;
var bleachOz=dCl*V/10000*128/0.06;
var pHAdj=PH<7.4?(7.4-PH)*V/10000*1.5:PH>7.6?(PH-7.6)*V/10000*0.8:0;
var algaeOz=V/5000;
var html='<div class="big">'+rnd(bleachOz,1)+' oz bleach</div>';
html+=row("Pool volume",rnd(V,0)+' gal');
html+=row("Chlorine change",rnd(dCl,1)+' ppm');
html+=row("6% Bleach needed",rnd(bleachOz,1)+' oz');
html+=row("pH adjuster",rnd(pHAdj,1)+' oz');
html+=row("Algaecide (weekly)",rnd(algaeOz,1)+' oz');
out.innerHTML=html;
}
[volEl,ccEl,tcEl,phEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
