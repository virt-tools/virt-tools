<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Cropper — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Cropper</h1>
<p class="subtitle">Crop images by dragging to select a region. Download the cropped result. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="position:relative;display:inline-block;margin-top:10px">
<canvas id="canvas" style="max-width:100%;border:1px solid #444;border-radius:6px;cursor:crosshair"></canvas>
<div id="selBox" style="position:absolute;border:2px dashed #fff;pointer-events:none;display:none"></div>
</div>
<div style="margin-top:10px">
<button onclick="crop()" id="cropBtn" style="display:none" type="button">Crop & Download</button>
</div>
<script>
var img,sx,sy,ex,ey,dragging=false;
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
var selBox=document.getElementById('selBox');
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
img=new Image();
img.onload=function(){
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
document.getElementById('cropBtn').style.display='inline-block';
};
img.src=URL.createObjectURL(f);
});
canvas.addEventListener('mousedown',function(e){dragging=true;var r=canvas.getBoundingClientRect();var s=canvas.width/r.width;sx=(e.clientX-r.left)*s;sy=(e.clientY-r.top)*s;});
canvas.addEventListener('mousemove',function(e){
if(!dragging)return;var r=canvas.getBoundingClientRect();var s=canvas.width/r.width;
ex=(e.clientX-r.left)*s;ey=(e.clientY-r.top)*s;
ctx.drawImage(img,0,0);ctx.strokeStyle='#fff';ctx.setLineDash([5,5]);
ctx.strokeRect(sx,sy,ex-sx,ey-sy);ctx.setLineDash([]);
});
canvas.addEventListener('mouseup',function(e){dragging=false;});
function crop(){
var w=ex-sx,h=ey-sy;if(w<5||h<5)return;
var c=document.createElement('canvas');c.width=Math.abs(w);c.height=Math.abs(h);
var cx=c.getContext('2d');cx.drawImage(img,Math.min(sx,ex),Math.min(sy,ey),Math.abs(w),Math.abs(h),0,0,Math.abs(w),Math.abs(h));
c.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cropped.png';a.click();});
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
