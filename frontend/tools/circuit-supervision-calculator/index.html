<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Circuit Supervision Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Circuit Supervision Calculator</h1>
<p>Calculate fire alarm circuit supervision requirements (Style A–D / Class A/B) from wire length and device count. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Wire length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dev">Devices on circuit</label><input type="text" id="in-dev" inputmode="numeric" autocomplete="off" placeholder="e.g. 25"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-len"),dEl=document.getElementById("in-dev"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),D=pn(dEl.value);
if(L==null||D==null)return;
if(!isFinite(L)||L<=0||!isFinite(D)||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var style;
if(D<=25&&L<=1000)style="Class B (Style B)";
else if(D<=50&&L<=2500)style="Class A (Style D)";
else if(D<=100&&L<=5000)style="Class A (Style D) with isolators";
else style="Class A (Style D) + zone isolators per 25 devices";
var html='<div class="big">'+style+'</div>';
html+=row("Circuit class",style);
html+=row("Wire length",L+' ft');
html+=row("Devices",D);
html+=row("Isolators needed",Math.ceil(D/25));
out.innerHTML=html;
}
[lEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
