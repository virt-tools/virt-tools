<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pressure Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pressure Converter</h1>
<p class="subtitle">Convert between Pascal, bar, psi, atm, mmHg, torr, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Pascal (Pa)</option>
<option value="100000">Bar (bar)</option>
<option value="1000">Kilopascal (kPa)</option>
<option value="1000000">Megapascal (MPa)</option>
<option value="6894.757">PSI (psi)</option>
<option value="101325">Atmosphere (atm)</option>
<option value="133.322">mmHg (torr)</option>
<option value="98066.5">kgf/cm²</option>
<option value="100">Hectopascal (hPa)</option>
<option value="3386.39">inHg</option>
<option value="249.0889">inH₂O</option>
<option value="9.80665">mmH₂O</option>
<option value="6894.757">ksi</option>
<option value="100000">dyn/cm²</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Pascal (Pa)',1],['Kilopascal (kPa)',1000],['Megapascal (MPa)',1e6],['Bar (bar)',1e5],['PSI (psi)',6894.757],['Atmosphere (atm)',101325],['mmHg (torr)',133.322],['inHg',3386.39],['inH₂O',249.0889],['mmH₂O',9.80665],['Hectopascal (hPa)',100],['kgf/cm²',98066.5],['dyn/cm²',0.1],['mbar',100]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const pa=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=pa/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
