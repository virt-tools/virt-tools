<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Data Center Cooling Tonnage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Data Center Cooling Tonnage Calculator</h1>
<p>Calculate cooling tonnage, CFM, and redundant unit count from IT heat load with N+1 redundancy. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ht">IT heat load</label><input type="text" id="in-ht" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-lt">Lighting load</label><input type="text" id="in-lt" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-un">Unit size</label><input type="text" id="in-un" inputmode="numeric" autocomplete="off" placeholder="e.g. 30"><div class="unit">tons</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var htEl=document.getElementById("in-ht"),ltEl=document.getElementById("in-lt"),unEl=document.getElementById("in-un"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var HT=parseFloat(htEl.value),LT=parseFloat(ltEl.value),UN=parseInt(unEl.value);
if(isNaN(HT)||isNaN(LT)||isNaN(UN))return;
if(HT<=0||LT<0||UN<=0){err.textContent="Heat load and unit size must be positive.";return}
err.textContent="";
var totalKw=HT+LT;
var totalBtu=totalKw*3412;
var tonsNeeded=totalBtu/12000;
var cfmNeeded=totalBtu/(1.08*20); // 20°F delta T
var unitsN1=Math.ceil(tonsNeeded/UN)+1;
var html='<div class="big">'+Math.round(tonsNeeded*10)/10+' tons</div>';
html+=row("Total heat load",totalKw+" kW ("+Math.round(totalBtu)+" BTU/h)");
html+=row("Cooling tons needed",Math.round(tonsNeeded*10)/10);
html+=row("Required CFM",Math.round(cfmNeeded)+" CFM");
html+=row("N+1 units ("+UN+"t each)",unitsN1);
html+=row("Total N+1 capacity",unitsN1*UN+" tons");
out.innerHTML=html;
}
[htEl,ltEl,unEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
