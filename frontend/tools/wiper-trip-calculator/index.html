<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wiper Trip Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wiper Trip Calculator</h1>
<p>Calculate wiper trip duration and circulation time from bit depth, tripping speed, and circulation rate. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Bit depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-spd">Trip speed</label><input type="text" id="in-spd" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">ft/min</div></div>
<div class="field"><label class="f" for="in-circ">Circulation time</label><input type="text" id="in-circ" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">min</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-depth"),spdE=document.getElementById("in-spd"),circE=document.getElementById("in-circ"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),spd=parseFloat(spdE.value),circ=parseFloat(circE.value);
if(isNaN(d)||isNaN(spd)||isNaN(circ))return;
var tripTime=(d/spd)*2;
var totalTime=tripTime+circ;
var html='<div class="big">'+Math.round(totalTime)+' min</div>';
html+=row("Total wiper trip time",Math.round(totalTime)+' min ('+Math.round(totalTime/60*100)/100+' hr)');
html+=row("Round trip time",Math.round(tripTime)+' min');
html+=row("Circulation time",circ+' min');
out.innerHTML=html;
}
[dE,spdE,circE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
