<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siding Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Siding Calculator</h1>
<p class="subtitle">Estimate siding squares, waste, and cost for any building.</p>
<div class="input-section">
<label>Building Length (ft)</label>
<input type="number" id="bLen" value="40" min="1" aria-label="B Len">
<label>Building Width (ft)</label>
<input type="number" id="bWid" value="30" min="1" aria-label="B Wid">
<label>Wall Height (ft)</label>
<input type="number" id="wallH" value="10" min="1" aria-label="Wall H">
<label>Gable Height (ft, 0 if none)</label>
<input type="number" id="gableH" value="6" min="0" step="0.5" aria-label="Gable H">
<label>Window/Door Area (sq ft)</label>
<input type="number" id="openings" value="120" min="0" aria-label="Openings">
<label>Cost per Square ($)</label>
<input type="number" id="cost" value="150" min="0" step="0.5" aria-label="Cost">
<label>Waste Allowance (%)</label>
<input type="number" id="waste" value="10" min="0" max="30" aria-label="Waste">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('bLen').value)||0;
const W=parseFloat(document.getElementById('bWid').value)||0;
const H=parseFloat(document.getElementById('wallH').value)||0;
const G=parseFloat(document.getElementById('gableH').value)||0;
const O=parseFloat(document.getElementById('openings').value)||0;
const C=parseFloat(document.getElementById('cost').value)||0;
const ws=parseFloat(document.getElementById('waste').value)||0;
const wallArea=2*(L+W)*H;
const gableArea=(L*G)/2*2;
const netArea=wallArea+gableArea-O;
const withWaste=netArea*(1+ws/100);
const squares=withWaste/100;
const totalCost=squares*C;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Wall Area:</span><span>${wallArea.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>Gable Area:</span><span>${gableArea.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>Net Area (after openings):</span><span>${netArea.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>With ${ws}% Waste:</span><span>${withWaste.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>Siding Squares:</span><span>${squares.toFixed(1)} squares</span></div>
<div class="result-row"><span>Total Cost:</span><span>$${totalCost.toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
