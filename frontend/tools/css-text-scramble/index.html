<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Decode/Scramble Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:2rem;background:#0a0a12;border-radius:12px;text-align:center}
.scramble-text{font-family:monospace;font-size:2rem;color:#667eea;letter-spacing:2px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:100px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔢 CSS Text Decode/Scramble Generator</h1>
<p>Create CSS text scramble/decode animation effects. 3 modes, adjustable speed/charset. Copy HTML+CSS+JS.</p>
<div class="controls">
<div class="ctrl-row"><label>Mode</label><select id="mode"><option value="hover" selected>On Hover</option><option value="load">On Load</option><option value="loop">Loop</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="DECODE ME" style="width:200px"></div>
<div class="ctrl-row"><label>Font Size (px)</label><input type="number" id="fs" value="32" min="12" max="80" style="width:80px"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#667eea" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Speed (ms/char)</label><input type="number" id="speed" value="40" min="10" max="200" style="width:80px"></div>
<div class="ctrl-row"><label>Iterations</label><input type="number" id="iter" value="3" min="1" max="10" style="width:80px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div class="scramble-text" id="demo">DECODE ME</div></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>JS</h2><div class="output-block"><textarea id="jsOut" readonly></textarea><button class="copy-btn" onclick="copyText('jsOut')">Copy JS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
function scramble(el,text,speed,iter){
var t=text.split('');var n=t.length;var step=0;
function tick(){
var out='';
for(var i=0;i<n;i++){
if(i<step)out+=t[i];
else out+=chars[Math.floor(Math.random()*chars.length)];
}
el.textContent=out;
step+=1;
if(step<=n)setTimeout(tick,speed);
else if(iter>1){iter--;setTimeout(function(){step=0;tick()},speed*2)}
}
tick();
}
function update(){
var mode=document.getElementById('mode').value;
var text=document.getElementById('text').value;
var fs=document.getElementById('fs').value;
var c=document.getElementById('color').value;
var speed=parseInt(document.getElementById('speed').value);
var iter=parseInt(document.getElementById('iter').value);
var css='.scramble-text{font-family:monospace;font-size:'+fs+'px;color:'+c+';letter-spacing:2px}';
var html='<div class="scramble-text" id="scramble">'+text+'</div>';
var js="var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*';\n"+
"function scramble(el,text,speed,iter){\n"+
"  var t=text.split(''),n=t.length,step=0;\n"+
"  function tick(){\n"+
"    var out='';\n"+
"    for(var i=0;i<n;i++){out+=i<step?t[i]:chars[Math.floor(Math.random()*chars.length)]}\n"+
"    el.textContent=out;step++;\n"+
"    if(step<=n)setTimeout(tick,speed);\n"+
"    else if(iter>1){iter--;setTimeout(function(){step=0;tick()},speed*2)}\n"+
"  }\n"+
"  tick();\n"+
"}\n";
if(mode==='hover'){
js+="var el=document.getElementById('scramble');\nel.addEventListener('mouseenter',function(){scramble(el,'"+text+"',"+speed+","+iter+")});";
}else if(mode==='load'){
js+="window.addEventListener('load',function(){scramble(document.getElementById('scramble'),'"+text+"',"+speed+","+iter+")});";
}else{
js+="var el=document.getElementById('scramble');\nsetInterval(function(){scramble(el,'"+text+"',"+speed+",1)},("+(speed*(text.length+2))+")*"+iter+");";
}
document.getElementById('cssOut').value=css;
document.getElementById('htmlOut').value=html;
document.getElementById('jsOut').value=js;
var demo=document.getElementById('demo');
demo.style.fontSize=fs+'px';demo.style.color=c;demo.textContent=text;
demo.onmouseenter=function(){scramble(demo,text,speed,iter)};
if(mode==='load'){scramble(demo,text,speed,iter)}
if(mode==='loop'){setInterval(function(){scramble(demo,text,speed,1)},(speed*(text.length+2))*iter)}
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['mode','text','fs','color','speed','iter'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
