<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Electrical Resistivity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Electrical Resistivity Calculator</h1>
<p>Calculate apparent resistivity from Wenner array voltage, current, and electrode spacing. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">Voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-i">Current</label><input type="text" id="in-i" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-a">Electrode spacing</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vE=document.getElementById("in-v"),iE=document.getElementById("in-i"),aE=document.getElementById("in-a"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=parseFloat(vE.value),I=parseFloat(iE.value),a=parseFloat(aE.value);
if(isNaN(V)||isNaN(I)||isNaN(a))return;
if(V<=0||I<=0||a<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var rho=2*Math.PI*a*V/I;
var html='<div class="big">'+Math.round(rho)+' Ω·m</div>';
html+=row("Apparent resistivity ρa",Math.round(rho)+' Ω·m');
html+=row("Resistance V/I",Math.round(V/I*1000)/1000+' Ω');
out.innerHTML=html;
}
[vE,iE,aE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
