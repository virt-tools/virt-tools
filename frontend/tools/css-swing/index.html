<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Swing/Pendulum Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:3rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎢 CSS Swing/Pendulum Generator</h1>
<p>Create CSS swing/pendulum/floating animations. 6 styles, adjustable amplitude, speed, origin. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="swing">Swing</option><option value="pendulum">Pendulum</option><option value="float">Float</option><option value="bob">Bob</option><option value="sway">Sway</option><option value="rocking">Rocking</option></select></div>
<div class="ctrl-row"><label>Amplitude</label><input type="range" id="amp" min="5" max="60" value="20" style="width:200px"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="0.5" max="8" step="0.5" value="2" style="width:200px"></div>
<div class="ctrl-row"><label>Origin</label><select id="origin"><option value="top">Top</option><option value="center">Center</option><option value="bottom">Bottom</option><option value="left">Left</option></select></div>
<div class="ctrl-row"><label>Element</label><select id="elem"><option value="box">Box</option><option value="text">Text</option><option value="circle">Circle</option></select></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#667eea"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="40" max="120" value="80" style="width:200px"></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var amp=parseInt(document.getElementById('amp').value);
var sp=parseFloat(document.getElementById('speed').value);
var orig=document.getElementById('origin').value;
var el=document.getElementById('elem').value;
var cl=document.getElementById('color').value;
var sz=parseInt(document.getElementById('size').value);
var origMap={top:'top center',center:'center',bottom:'bottom center',left:'left center'};
var html='';
if(el==='text'){html='<div class="swing-elem">Swing!</div>'}
else if(el==='circle'){html='<div class="swing-elem circle"></div>'}
else{html='<div class="swing-elem"></div>'}
var css='.swing-elem{width:'+(el==='text'?'auto':sz+'px')+';height:'+(el==='text'?'auto':sz+'px')+';background:'+(el==='text'?'transparent':cl)+';color:'+(el==='text'?cl:'#fff')+';border-radius:'+(el==='circle'?'50%':'8px')+';display:flex;align-items:center;justify-content:center;font-size:'+(sz/2)+'px;font-weight:700;transform-origin:'+origMap[orig]+';animation:swing-anim '+sp+'s ease-in-out infinite}\n';
if(st==='swing'){css+='@keyframes swing-anim{0%,100%{transform:rotate(-'+amp+'deg)}50%{transform:rotate('+amp+'deg)}}\n'}
else if(st==='pendulum'){css+='@keyframes swing-anim{0%{transform:rotate('+amp+'deg)}100%{transform:rotate(-'+amp+'deg)}}\n'}
else if(st==='float'){css+='@keyframes swing-anim{0%,100%{transform:translateY(-'+amp/2+'px)}50%{transform:translateY('+amp/2+'px)}}\n'}
else if(st==='bob'){css+='@keyframes swing-anim{0%,100%{transform:translateY(0)}50%{transform:translateY(-'+amp+'px)}}\n'}
else if(st==='sway'){css+='@keyframes swing-anim{0%,100%{transform:translateX(-'+amp/2+'px) rotate(-'+amp/4+'deg)}50%{transform:translateX('+amp/2+'px) rotate('+amp/4+'deg)}}\n'}
else if(st==='rocking'){css+='@keyframes swing-anim{0%,100%{transform:rotate(-'+amp+'deg) translateY(0)}25%{transform:rotate(0) translateY(-'+amp/2+'px)}50%{transform:rotate('+amp+'deg) translateY(0)}75%{transform:rotate(0) translateY('+amp/2+'px)}}\n'}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','amp','speed','origin','elem','color','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
