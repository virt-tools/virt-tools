<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pipe Hanger Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pipe Hanger Load Calculator</h1>
<p>Calculate hanger load per support, hanger spacing, and rod size for piping systems from pipe size and fluid density. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Pipe diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-sp">Hanger spacing</label><input type="text" id="in-sp" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dens">Fluid density</label><input type="text" id="in-dens" inputmode="decimal" autocomplete="off" placeholder="e.g. 62.4"><div class="unit">lb/ft³</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var diaEl=document.getElementById("in-dia"),spEl=document.getElementById("in-sp"),densEl=document.getElementById("in-dens"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var DIA=parseFloat(diaEl.value),SP=parseFloat(spEl.value),DENS=parseFloat(densEl.value);
if(isNaN(DIA)||isNaN(SP)||isNaN(DENS))return;
if(DIA<=0||SP<=0||DENS<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var pipeArea=Math.PI*Math.pow(DIA/12,2)/4;
var pipeWeight=pipeArea*SP*DENS+SP*DIA*0.5;
var rodSize=pipeWeight<50?'3/8"':pipeWeight<120?'1/2"':pipeWeight<300?'5/8"':pipeWeight<600?'3/4"':'7/8"';
var html='<div class="big">'+Math.round(pipeWeight)+' lb</div>';
html+=row("Load per hanger",Math.round(pipeWeight)+" lb");
html+=row("Hanger spacing",SP+" ft");
html+=row("Pipe area",Math.round(pipeArea*10000)/10000+" ft²");
html+=row("Recommended rod",rodSize+'"');
out.innerHTML=html;
}
[diaEl,spEl,densEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
