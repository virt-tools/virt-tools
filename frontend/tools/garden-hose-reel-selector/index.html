<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Garden Hose Reel Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Garden Hose Reel Selector</h1>
<p>Recommend hose reel capacity from hose length, diameter, and mounting type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Hose length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dia">Hose diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.625"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-mnt">1=wall,2=cart,3=auto</label><input type="text" id="in-mnt" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit"></div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenEl=document.getElementById("in-len"),diaEl=document.getElementById("in-dia"),mntEl=document.getElementById("in-mnt"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Len=pn(lenEl.value),Dia=pn(diaEl.value),Mnt=pn(mntEl.value);
if(Len==null||Dia==null||Mnt==null)return;
if(!isFinite(Len)||!isFinite(Dia)||!isFinite(Mnt)||Len<=0||Dia<=0||Mnt<1||Mnt>3){err.textContent="Enter valid values.";return}
err.textContent="";
var capFt=Math.ceil(Len*1.1);
var type=Mnt===1?"Wall-mount":Mnt===2?"Cart":"Auto-rewind";
var html='<div class="big">'+capFt+' ft</div>';
html+=row("Hose length",rnd(Len,0)+' ft');
html+=row("Hose diameter",rnd(Dia,3)+' in ('+rnd(Dia*25.4,0)+' mm)');
html+=row("Mount type",type);
html+=row("Min reel cap",capFt+' ft');
html+=row("Hose size",Dia<=0.5625?"1/2 in":Dia<=0.6875?"5/8 in":Dia<=0.8125?"3/4 in":"1 in");
out.innerHTML=html;
}
[lenEl,diaEl,mntEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
