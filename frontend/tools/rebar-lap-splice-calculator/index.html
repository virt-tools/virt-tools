<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rebar Lap Splice Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select,.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rebar Lap Splice Calculator</h1>
<p>Calculate required lap splice length for rebar based on bar size, concrete strength, and splice class. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Bar size</label><select id="in-d"><option value="">Select…</option><option value="3">#3 (3/8")</option><option value="4">#4 (1/2")</option><option value="5">#5 (5/8")</option><option value="6">#6 (3/4")</option><option value="7">#7 (7/8")</option><option value="8">#8 (1")</option><option value="9">#9 (1-1/8")</option><option value="10">#10 (1-1/4")</option><option value="11">#11 (1-3/8")</option></select><div class="unit">bar</div></div>
<div class="field"><label class="f" for="in-fc">Concrete strength</label><input type="text" id="in-fc" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-c">Splice class</label><select id="in-c"><option value="">Select…</option><option value="a">Class A (1.0×)</option><option value="b">Class B (1.3×)</option></select><div class="unit">tension</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),fcEl=document.getElementById("in-fc"),cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=dEl.value,fc=pn(fcEl.value),C=cEl.value;
if(!D||fc==null||!C)return;
if(!isFinite(fc)||fc<=0){err.textContent="Enter valid concrete strength.";return}
err.textContent="";
var db=Number(D)/8;
var fy=60000;
var baseLen=(fy/(Math.min(60,Math.max(fc,2500)/100)))*(db*0.02);
var ldc=Math.max(baseLen,12);
var classFactor=C==="a"?1.0:1.3;
var lapLength=ldc*classFactor;
lapLength=Math.max(lapLength,12);
var html='<div class="big">'+rnd(lapLength,1)+' in</div>';
html+=row("Lap splice length",rnd(lapLength,1)+' in');
html+=row("Bar diameter",rnd(db,3)+' in');
html+=row("Development length",rnd(ldc,1)+' in');
html+=row("Class factor",classFactor+'×');
html+=row("Min lap","12 in");
out.innerHTML=html;
}
[dEl,fcEl,cEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
