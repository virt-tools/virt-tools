<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Sound Wave Animation Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📈 CSS Sound Wave Animation Generator</h1>
<p>Create CSS animated sound wave / waveform visualizations. 4 styles, adjustable colors, speed, bar count. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="bars">Bars</option><option value="mirror">Mirror Bars</option><option value="line">Line Wave</option><option value="pulse">Pulse Ring</option></select></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="c1" value="#667eea" aria-label="C1"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="c2" value="#764ba2" aria-label="C2"></div>
<div class="ctrl-row"><label>Bar Count</label><input type="range" id="count" min="5" max="60" value="24" style="width:200px" aria-label="Count"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="0.3" max="3" step="0.1" value="1" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Bar Width</label><input type="range" id="width" min="2" max="20" value="6" style="width:200px" aria-label="Width"></div>
<div class="ctrl-row"><label>Max Height</label><input type="range" id="height" min="40" max="200" value="100" style="width:200px" aria-label="Height"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var c1=document.getElementById('c1').value;
var c2=document.getElementById('c2').value;
var n=parseInt(document.getElementById('count').value);
var sp=parseFloat(document.getElementById('speed').value);
var w=parseInt(document.getElementById('width').value);
var mh=parseInt(document.getElementById('height').value);
var html='<div class="sound-wave"></div>';
var css='.sound-wave{display:flex;align-items:center;justify-content:center;gap:2px;height:'+(mh+20)+'px}\n';
if(st==='bars'||st==='mirror'){
css+='.sound-wave .bar{width:'+w+'px;background:linear-gradient(to top,'+c1+','+c2+');border-radius:3px;\n';
if(st==='mirror'){css+='transform-origin:center;'}
css+='animation:sw-anim '+sp+'s ease-in-out infinite alternate}\n';
css+='@keyframes sw-anim{0%{height:10%}100%{height:100%}}\n';
}else if(st==='line'){
css+='.sound-wave{gap:0;position:relative;height:'+(mh+20)+'px}\n';
css+='.sound-wave .bar{width:3px;background:'+c1+';border-radius:2px;animation:sw-anim '+sp+'s ease-in-out infinite alternate;margin:0 1px}\n';
css+='@keyframes sw-anim{0%{height:5%;opacity:0.3}100%{height:100%;opacity:1}}\n';
}else if(st==='pulse'){
css+='.sound-wave{position:relative;width:'+(mh+20)+'px;height:'+(mh+20)+'px}\n';
for(var i=0;i<4;i++){
css+='.sound-wave .ring'+i+'{position:absolute;border:2px solid '+c1+';border-radius:50%;opacity:0;animation:sw-pulse '+sp+'s ease-out infinite;animation-delay:'+(i*sp/4)+'s}\n';
}
css+='@keyframes sw-pulse{0%{inset:40%;opacity:1}100%{inset:0;opacity:0}}\n';
}
var pv=document.getElementById('preview');
pv.innerHTML='<style>'+css+'</style><div class="sound-wave"></div>';
var sw=pv.querySelector('.sound-wave');
if(st==='pulse'){
for(var i=0;i<4;i++){var r=document.createElement('div');r.className='ring'+i;sw.appendChild(r)}
}else{
for(var i=0;i<n;i++){
var b=document.createElement('div');b.className='bar';
b.style.animationDelay=(Math.random()*sp)+'s';
b.style.height=(20+Math.random()*80)+'%';
sw.appendChild(b);
}
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','c1','c2','count','speed','width','height'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
