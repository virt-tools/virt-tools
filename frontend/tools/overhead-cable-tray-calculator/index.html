<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Overhead Cable Tray Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Overhead Cable Tray Calculator</h1>
<p>Calculate tray width, fill area, and weight capacity for overhead cable trays from cable diameter and count. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Cable diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-n">Cable count</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 20"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-wl">Weight per ft</label><input type="text" id="in-wl" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">lb/ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),nEl=document.getElementById("in-n"),wlEl=document.getElementById("in-wl"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=parseFloat(dEl.value),N=parseInt(nEl.value),WL=parseFloat(wlEl.value);
if(isNaN(D)||isNaN(N)||isNaN(WL))return;
if(D<=0||N<=0||WL<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var cablesPerRow=Math.floor(12/D);
if(cablesPerRow<1){err.textContent="Cable diameter must be 12 in or less to fit a standard tray row.";return}
var rowsNeeded=Math.ceil(N/cablesPerRow);
var minTrayWidth=cablesPerRow*D;
var fillArea=D*D*N*0.785;
var totalWeight=N*WL;
var html='<div class="big">'+minTrayWidth+'" min width</div>';
html+=row("Cables per row (12\")",cablesPerRow);
html+=row("Rows needed",rowsNeeded);
html+=row("Min tray width",Math.round(minTrayWidth*100)/100+'"');
html+=row("Fill area",Math.round(fillArea*100)/100+" in²");
html+=row("Total weight",Math.round(totalWeight*10)/10+" lb/ft");
out.innerHTML=html;
}
[dEl,nEl,wlEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
