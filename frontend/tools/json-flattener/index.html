<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Flattener — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Flattener & Unflattener</h1>
<p class="subtitle">Flatten nested JSON to dot-notation key-value pairs and back. 100% client-side.</p>
<div class="input-section">
<label>JSON Data</label>
<textarea id="json" rows="8" placeholder='{"user":{"name":"Alice","tags":["a","b"]}}' aria-label="{"></textarea>
<div class="btn-row">
<button id="flatten" class="primary-btn" type="button">Flatten</button>
<button id="unflatten" class="primary-btn" type="button">Unflatten</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function flatten(obj,prefix){
const result={};
for(const key in obj){
const path=prefix?prefix+'.'+key:key;
if(obj[key]!==null&&typeof obj[key]==='object'&&!Array.isArray(obj[key]))Object.assign(result,flatten(obj[key],path));
else result[path]=obj[key];
}
return result;
}
function unflatten(data){
const result={};
for(const path in data){
const parts=path.split('.');
let cur=result;
for(let i=0;i<parts.length-1;i++){
if(!cur[parts[i]]||typeof cur[parts[i]]!=='object')cur[parts[i]]={};
cur=cur[parts[i]];
}
cur[parts[parts.length-1]]=data[path];
}
return result;
}
document.getElementById('flatten').addEventListener('click',()=>{
try{
const data=JSON.parse(document.getElementById('json').value);
const flat=flatten(data);
document.getElementById('result').innerHTML='<h3>Flattened:</h3><pre>'+JSON.stringify(flat,null,2).replace(/</g,'&lt;')+'</pre>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
});
document.getElementById('unflatten').addEventListener('click',()=>{
try{
const data=JSON.parse(document.getElementById('json').value);
const nested=unflatten(data);
document.getElementById('result').innerHTML='<h3>Unflattened:</h3><pre>'+JSON.stringify(nested,null,2).replace(/</g,'&lt;')+'</pre>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
