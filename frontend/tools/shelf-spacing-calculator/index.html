<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Shelf Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Shelf Spacing Calculator</h1>
<p>Calculate even shelf spacing for a cabinet or bookcase given total height, number of shelves, and shelf thickness. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Total height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 1800"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-n">Shelves</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-t">Shelf thickness</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 18"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter height.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),nEl=document.getElementById("in-n"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),N=pn(nEl.value),T=pn(tEl.value);
if(H==null){return}
N=N==null?5:N;T=T==null?18:T;
if(!isFinite(H)||!isFinite(N)||!isFinite(T)||H<=0||N<=0||T<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var gaps=N+1;
var totalThk=N*T;
var avail=H-totalThk;
var gap=avail/gaps;
var html='<div class="big">'+rnd(gap,1)+' mm</div>';
html+=row("Total height",rnd(H,0)+" mm");
html+=row("Shelves",rnd(N,0));
html+=row("Shelf thickness",rnd(T,0)+" mm");
html+=row("Gaps",gaps);
html+=row("Gap spacing",rnd(gap,1)+" mm");
out.innerHTML=html;
}
[hEl,nEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
