<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fence Post Depth Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fence Post Depth Calculator</h1>
<p>Calculate fence post hole depth and concrete volume from fence height and soil frost line. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Fence height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-f">Frost line depth</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),fEl=document.getElementById("in-f"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),F=pn(fEl.value);
if(H==null||F==null)return;
if(!isFinite(H)||!isFinite(F)||H<=0||F<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var postDepth=Math.max(F/12+0.5,H/3);
var holeDia=12;
var concVol=Math.PI*holeDia*holeDia/4/144*postDepth;
var html='<div class="big">'+rnd(postDepth,1)+' ft</div>';
html+=row("Fence height",rnd(H,1)+' ft');
html+=row("Frost line",rnd(F,0)+' in');
html+=row("Post hole depth",rnd(postDepth,1)+' ft');
html+=row("Hole diameter",'12 in');
html+=row("Concrete per post",rnd(concVol,2)+' cu ft');
out.innerHTML=html;
}
[hEl,fEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
