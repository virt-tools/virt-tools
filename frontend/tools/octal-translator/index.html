<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octal Translator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Octal Translator</h1>
<p class="subtitle">Convert text to octal and octal to text. Space-separated 3-digit groups.</p>
<div class="input-section">
<label>Input: <textarea id="input" rows="4" placeholder="Type text or octal (e.g. 110 145 154)"></textarea></label>
<button id="toOct" class="primary-btn" type="button">Text → Octal</button>
<button id="fromOct" class="btn" type="button">Octal → Text</button>
<button id="copy" class="btn" type="button">Copy Result</button>
</div>
<div class="output-section">
<label>Result: <textarea id="result" rows="4" readonly></textarea></label>
</div>
<script>
document.getElementById('toOct').addEventListener('click',()=>{
const t=document.getElementById('input').value;
document.getElementById('result').value=[...t].map(c=>c.charCodeAt(0).toString(8).padStart(3,'0')).join(' ');
});
document.getElementById('fromOct').addEventListener('click',()=>{
const t=document.getElementById('input').value.trim().split(/\s+/);
document.getElementById('result').value=t.map(o=>String.fromCharCode(parseInt(o,8))).join('');
});
document.getElementById('copy').addEventListener('click',()=>{const r=document.getElementById('result');r.select();document.execCommand('copy');});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
