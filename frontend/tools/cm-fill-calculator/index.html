<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>CMU Fill Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>CMU Fill Calculator</h1>
<p>Calculate concrete fill volume needed for CMU block cores based on wall area and block type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Wall area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-f">Fill per block</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.07"><div class="unit">cu ft/block</div></div>
<div class="field"><label class="f" for="in-b">Blocks per sq ft</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.125"><div class="unit">blocks/sq ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),fEl=document.getElementById("in-f"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),F=pn(fEl.value),B=pn(bEl.value);
if(A==null||F==null||B==null)return;
if(!isFinite(A)||A<=0||!isFinite(F)||F<=0||!isFinite(B)||B<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var totalBlocks=A*B;
var fillVol=totalBlocks*F;
var wasteFactor=1.1;
var totalFill=fillVol*wasteFactor;
var cy=totalFill/27;
var html='<div class="big">'+rnd(cy,2)+' yd³</div>';
html+=row("Fill volume",rnd(cy,2)+' yd³');
html+=row("Total blocks",Math.ceil(totalBlocks));
html+=row("Fill per block",F+' cu ft');
html+=row("Cubic feet",rnd(totalFill,1)+' ft³');
html+=row("Waste factor","10%");
out.innerHTML=html;
}
[aEl,fEl,bEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
