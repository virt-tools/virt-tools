<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Robot Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#1a1a4a,#2a2a6a);border-radius:12px;overflow:hidden;position:relative;min-height:360px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🤖 CSS Robot Generator</h1>
<p>Create CSS robot with head, eyes, antenna, body, arms. 3 styles, adjustable color/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Robot Style</label><select id="style" aria-label="Style"><option value="classic">Classic</option><option value="retro">Retro</option><option value="modern">Modern</option></select></div>
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#90a4ae" style="width:60px;height:36px" aria-label="Body Color"></div>
<div class="ctrl-row"><label>Eye Color</label><input type="color" id="eyeColor" value="#00e676" style="width:60px;height:36px" aria-label="Eye Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="100" max="240" value="160" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var bc=document.getElementById('bodyColor').value;
var ec=document.getElementById('eyeColor').value;
var sz=parseInt(document.getElementById('size').value);
var hs=sz*0.45,bs=sz*0.55;
var html='<div class="robot r-'+st+'">\n  <div class="head"><div class="antenna"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div></div>\n  <div class="body"><div class="chest"></div><div class="arm a-left"></div><div class="arm a-right"></div></div>\n</div>';
var css='.robot{display:flex;flex-direction:column;align-items:center}\n';
css+='.head{width:'+hs+'px;height:'+hs+'px;background:'+bc+';border-radius:14px;position:relative;box-shadow:inset 0 -8px rgba(0,0,0,0.2)}\n';
css+='.antenna{position:absolute;top:-'+(sz*0.12)+'px;left:50%;width:3px;height:'+(sz*0.12)+'px;background:#555;transform:translateX(-50%)}\n';
css+='.antenna::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;background:'+ec+';border-radius:50%;transform:translateX(-50%);box-shadow:0 0 8px '+ec+'}\n';
css+='.eyes{display:flex;gap:'+(hs*0.12)+'px;justify-content:center;margin-top:'+(hs*0.25)+'px}\n';
css+='.eye{width:'+(hs*0.18)+'px;height:'+(hs*0.18)+'px;background:'+ec+';border-radius:50%;box-shadow:0 0 8px '+ec+'}\n';
css+='.mouth{width:'+(hs*0.4)+'px;height:'+(hs*0.06)+'px;background:#333;margin:'+(hs*0.12)+'px auto 0;border-radius:2px}\n';
css+='.body{width:'+bs+'px;height:'+(bs*0.8)+'px;background:'+bc+';border-radius:10px;position:relative;margin-top:4px;box-shadow:inset 0 -10px rgba(0,0,0,0.2)}\n';
css+='.chest{width:'+(bs*0.4)+'px;height:'+(bs*0.3)+'px;background:linear-gradient(135deg,#444,#666);margin:'+(bs*0.1)+'px auto 0;border-radius:6px;display:flex;align-items:center;justify-content:center}\n';
css+='.chest::after{content:"";width:12px;height:12px;background:'+ec+';border-radius:50%;box-shadow:0 0 6px '+ec+'}\n';
css+='.arm{position:absolute;top:'+(bs*0.15)+'px;width:'+(bs*0.12)+'px;height:'+(bs*0.55)+'px;background:'+bc+';border-radius:6px}\n';
css+='.a-left{left:-'+(bs*0.12)+'px}.a-right{right:-'+(bs*0.12)+'px}\n';
if(st==='retro'){
css+='.robot.r-retro .head{border-radius:0}\n.robot.r-retro .body{border-radius:0}\n';
css+='.robot.r-retro .eye{border-radius:0;height:'+(hs*0.1)+'px}\n';
}else if(st==='modern'){
css+='.robot.r-modern .head{border-radius:50%}\n';
css+='.robot.r-modern .body{border-radius:20px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','bodyColor','eyeColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
