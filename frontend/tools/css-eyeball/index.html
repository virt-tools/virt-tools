<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Eyeball Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>CSS Eyeball Generator</h1>
<p class="subtitle">Create a CSS animated eyeball that follows the cursor or looks around on its own. Adjustable iris color, pupil size, and look mode.</p>

<div class="tool-layout">
<div class="controls">
<label>Iris Color <input type="color" id="irisColor" value="#4169e1"></label>
<label>Pupil Size <input type="range" id="pupilSize" min="20" max="60" value="35"></label>
<label>Eye Size <input type="range" id="eyeSize" min="120" max="300" value="180"></label>
<label>Look Mode
<select id="lookMode">
<option value="cursor">Follow Cursor</option>
<option value="auto">Auto Wander</option>
<option value="static">Static</option>
</select></label>
<label>Sclera Color <input type="color" id="scleraColor" value="#ffffff"></label>
<button id="copyBtn" class="btn" type="button">Copy HTML+CSS</button>
</div>
<div class="preview" id="preview"></div>
</div>

<div class="code-output">
<h3>Generated Code</h3>
<textarea id="codeOutput" readonly rows="20" aria-label="Code Output"></textarea>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
  const preview=document.getElementById('preview');
  const codeOutput=document.getElementById('codeOutput');
  const irisColor=document.getElementById('irisColor');
  const pupilSize=document.getElementById('pupilSize');
  const eyeSize=document.getElementById('eyeSize');
  const lookMode=document.getElementById('lookMode');
  const scleraColor=document.getElementById('scleraColor');
  let autoTimer=null;
  let cursorHandler=null;

  function build(){
    if(autoTimer!==null){clearInterval(autoTimer);autoTimer=null;}
    if(cursorHandler){document.removeEventListener('mousemove',cursorHandler);cursorHandler=null;}
    const ic=irisColor.value, ps=pupilSize.value, es=eyeSize.value, lm=lookMode.value, sc=scleraColor.value;
    preview.innerHTML='<div class="eye-wrap" style="width:'+es+'px;height:'+es+'px"><div class="eyeball" style="background:'+sc+'"><div class="iris" style="background:'+ic+';width:'+(es*0.5)+'px;height:'+(es*0.5)+'px"><div class="pupil" style="width:'+(ps)+'px;height:'+(ps)+'px"></div></div></div></div>';
    const autoJs=lm==='cursor'?'document.addEventListener("mousemove",function(e){var r=el.getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;var dx=e.clientX-cx,dy=e.clientY-cy;var ang=Math.atan2(dy,dx);var max=r.width*0.15;el.style.setProperty("--lx",Math.cos(ang)*max+"px");el.style.setProperty("--ly",Math.sin(ang)*max+"px");});':lm==='auto'?'setInterval(function(){var ang=Math.random()*Math.PI*2;var max=el.offsetWidth*0.15;el.style.setProperty("--lx",Math.cos(ang)*max+"px");el.style.setProperty("--ly",Math.sin(ang)*max+"px");},2000);':'';
    const html='<div class="eyeball" style="width:'+es+'px;height:'+es+'px;background:'+sc+';border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.3);">\n  <div class="iris" style="width:'+(es*0.5)+'px;height:'+(es*0.5)+'px;background:'+ic+';border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(calc(-50% + var(--lx,0)),calc(-50% + var(--ly,0)));transition:transform .1s;">\n    <div class="pupil" style="width:'+ps+'px;height:'+ps+'px;background:#111;border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"></div>\n  </div>\n</div>';
    codeOutput.value=`<style>
.eyeball{border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.3);}
.iris{border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(calc(-50% + var(--lx,0)),calc(-50% + var(--ly,0)));transition:transform .1s;}
.pupil{border-radius:50%;background:#111;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
</style>

${html}

<script>
var el=document.querySelector(".eyeball");
${autoJs}
<\/script>`;
    const eyeball=preview.querySelector('.iris');
    if(lm==='cursor'){
      cursorHandler=function(e){var r=preview.querySelector('.eyeball').getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;var dx=e.clientX-cx,dy=e.clientY-cy;var ang=Math.atan2(dy,dx);var max=r.width*0.15;eyeball.style.transform='translate(calc(-50% + '+(Math.cos(ang)*max)+'px),calc(-50% + '+(Math.sin(ang)*max)+'px))';};
      document.addEventListener('mousemove',cursorHandler);
    } else if(lm==='auto'){
      autoTimer=setInterval(function(){var ang=Math.random()*Math.PI*2;var max=es*0.15;eyeball.style.transform='translate(calc(-50% + '+(Math.cos(ang)*max)+'px),calc(-50% + '+(Math.sin(ang)*max)+'px))';},2000);
    }
  }
  [irisColor,pupilSize,eyeSize,lookMode,scleraColor].forEach(el=>el.addEventListener('input',build));
  document.getElementById('copyBtn').addEventListener('click',function(){navigator.clipboard.writeText(codeOutput.value).catch(function(){codeOutput.select();document.execCommand('copy')});});
  build();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:250px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.preview{flex:1;min-height:300px;display:flex;align-items:center;justify-content:center;background:var(--bg-alt,#f0f0f0);border-radius:12px;padding:2rem;}
.eye-wrap{position:relative;}
.eyeball{border-radius:50%;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,.3);border:2px solid #ddd;}
.iris{border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:transform .1s;box-shadow:0 0 10px rgba(0,0,0,.3) inset;}
.pupil{border-radius:50%;background:#111;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 4px rgba(255,255,255,.2);}
.code-output{margin-top:2rem;}
.code-output textarea{width:100%;font-family:monospace;font-size:13px;padding:1rem;border-radius:8px;border:1px solid #ddd;background:#fafafa;}
.btn{padding:.5rem 1rem;background:#4169e1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;}
.btn:hover{background:#3651c4;}
</style>
</body>
</html>
