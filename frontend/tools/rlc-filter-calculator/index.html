<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC/RL/RLC Filter Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>RC/RL/RLC Filter Calculator</h1>
<p class="subtitle">Calculate cutoff frequency, quality factor, and bandwidth for passive filters.</p>
<div class="input-section">
<label>Filter Type</label>
<select id="type" aria-label="Type">
<option value="rc-low" selected>RC Low-Pass</option>
<option value="rc-high">RC High-Pass</option>
<option value="rl-low">RL Low-Pass</option>
<option value="rl-high">RL High-Pass</option>
<option value="rlc-series">RLC Series (Band-Pass)</option>
<option value="rlc-parallel">RLC Parallel (Notch)</option>
</select>
<label>Resistance (Ω)</label>
<input type="number" id="R" value="1000" min="0.1" step="any" aria-label="R">
<label>Inductance (mH)</label>
<input type="number" id="L" value="10" min="0" step="any" aria-label="L">
<label>Capacitance (µF)</label>
<input type="number" id="C" value="1" min="0" step="any" aria-label="C">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const t=document.getElementById('type').value;
const R=parseFloat(document.getElementById('R').value)||0;
const L=parseFloat(document.getElementById('L').value)||0;
const C=parseFloat(document.getElementById('C').value)||0;
const Lh=L/1000,Cf=C/1e6;
let fc,Q,BW;
if(t==='rc-low'||t==='rc-high'){fc=1/(2*Math.PI*R*Cf);document.getElementById('result').innerHTML=`<div class="result-row"><span>Filter Type:</span><span>${t==='rc-low'?'RC Low-Pass':'RC High-Pass'}</span></div><div class="result-row"><span>Cutoff Frequency:</span><span>${fc.toFixed(2)} Hz</span></div><div class="result-row"><span>Time Constant (τ):</span><span>${(R*Cf*1000).toFixed(4)} ms</span></div><div class="result-row"><span>Phase at fc:</span><span>45°</span></div>`;}
else if(t==='rl-low'||t==='rl-high'){fc=R/(2*Math.PI*Lh);document.getElementById('result').innerHTML=`<div class="result-row"><span>Filter Type:</span><span>${t==='rl-low'?'RL Low-Pass':'RL High-Pass'}</span></div><div class="result-row"><span>Cutoff Frequency:</span><span>${fc.toFixed(2)} Hz</span></div><div class="result-row"><span>Time Constant (τ):</span><span>${(Lh/R*1000).toFixed(4)} ms</span></div>`;}
else{fc=1/(2*Math.PI*Math.sqrt(Lh*Cf));Q=(1/R)*Math.sqrt(Lh/Cf);BW=fc/Q;document.getElementById('result').innerHTML=`<div class="result-row"><span>Filter Type:</span><span>${t==='rlc-series'?'RLC Series Band-Pass':'RLC Parallel Notch'}</span></div><div class="result-row"><span>Resonant Frequency:</span><span>${fc.toFixed(2)} Hz</span></div><div class="result-row"><span>Quality Factor (Q):</span><span>${Q.toFixed(3)}</span></div><div class="result-row"><span>Bandwidth:</span><span>${BW.toFixed(2)} Hz</span></div><div class="result-row"><span>Lower -3dB:</span><span>${(fc-BW/2).toFixed(2)} Hz</span></div><div class="result-row"><span>Upper -3dB:</span><span>${(fc+BW/2).toFixed(2)} Hz</span></div>`;}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
