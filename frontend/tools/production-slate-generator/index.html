<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Production Slate Generator — Virtual Tools</title>
<meta name="description" content="Create a clean production slate with scene, take, roll, crew, date, frame rate and sound details. Copy the text or download an SVG locally.">
<link rel="stylesheet" href="/assets/style.css">
<style>
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.field{min-width:0}.field label{display:block;font-size:13px;font-weight:650;margin:0 0 5px}.field input,.field select{box-sizing:border-box;width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:inherit}.field input:focus,.field select:focus{outline:3px solid color-mix(in srgb,var(--accent,#6ea8fe) 35%,transparent);border-color:var(--accent,#6ea8fe)}
.wide{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{min-height:44px;padding:9px 18px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:transparent;color:var(--text,#e6e6e6);font:inherit;font-weight:650;cursor:pointer}.actions button.primary{border-color:var(--accent,#6ea8fe);background:var(--accent,#6ea8fe);color:#0b1017}.actions button:hover{filter:brightness(1.08)}.actions button:focus-visible{outline:3px solid var(--accent,#6ea8fe);outline-offset:2px}.actions button:disabled{opacity:.5;cursor:default}
.status{min-height:1.5em;margin:12px 0 0;font-size:13px;color:var(--text-dim,#9aa3b2)}.status.error{color:var(--bad,#f87171)}
.preview-panel{margin-top:18px}.preview-panel h2{font-size:16px;margin:0 0 12px}.slate{box-sizing:border-box;width:100%;max-width:760px;margin:auto;background:#111;color:#fff;border:1px solid #3b3b3b;border-radius:8px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sticks{display:flex;height:42px;background:repeating-linear-gradient(125deg,#f4f4f4 0,#f4f4f4 46px,#171717 46px,#171717 92px);border-bottom:5px solid #f4f4f4}.slate-body{padding:20px}.production-name{min-height:1.2em;text-align:center;font-size:clamp(18px,5vw,32px);font-weight:800;line-height:1.2;overflow-wrap:anywhere;text-transform:uppercase}.big-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border:1px solid #777}.big-cell{padding:12px;min-width:0}.big-cell+.big-cell{border-left:1px solid #777}.slate-label{display:block;color:#ccc;font-size:11px;letter-spacing:.1em;margin-bottom:4px}.slate-value{display:block;font-size:clamp(22px,7vw,42px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}.slate-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:20px}.meta-item{min-width:0;border-bottom:1px solid #444;padding-bottom:7px}.meta-item .slate-value{font-size:14px;font-weight:650;line-height:1.35}.text-label{display:block;font-size:13px;font-weight:650;margin:16px 0 5px}.slate-text{box-sizing:border-box;width:100%;resize:vertical;min-height:170px;padding:12px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:13px/1.5 ui-monospace,monospace}
@media(max-width:420px){.slate-body{padding:14px}.sticks{height:30px}.slate-meta{grid-template-columns:1fr;gap:9px}.big-cell{padding:10px}.actions button{flex:1 1 130px}}
@media print{#site-header,.tool-header,.tool-breadcrumbs,.tool-shell-actions,.related-tools,.skip-link,form,.text-label,.slate-text,.actions,.status{display:none}.preview-panel{border:none;padding:0;margin:0}.slate{max-width:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header"><a class="back" href="/">← All tools</a><h1>Production Slate Generator</h1><p>Fill in the shot details, generate a slate, then copy its text or download the SVG.</p></div>
<section class="panel" aria-label="Production slate details">
<form id="slate-form" novalidate>
<div class="form-grid">
<div class="field wide"><label for="production">Production</label><input id="production" name="production" type="text" value="Untitled Production" maxlength="80" autocomplete="off" required></div>
<div class="field"><label for="scene">Scene</label><input id="scene" name="scene" type="text" value="1" maxlength="30" autocomplete="off" required></div>
<div class="field"><label for="take">Take</label><input id="take" name="take" type="number" value="1" min="1" max="999" step="1" inputmode="numeric" required></div>
<div class="field"><label for="roll">Roll / card</label><input id="roll" name="roll" type="text" value="A001" maxlength="30" autocomplete="off"></div>
<div class="field"><label for="director">Director</label><input id="director" name="director" type="text" maxlength="60" autocomplete="off"></div>
<div class="field"><label for="camera">Camera</label><input id="camera" name="camera" type="text" maxlength="60" autocomplete="off"></div>
<div class="field"><label for="date">Shoot date</label><input id="date" name="date" type="date" required></div>
<div class="field"><label for="fps">Frame rate</label><select id="fps" name="fps"><option>23.976</option><option selected>24</option><option>25</option><option>29.97</option><option>30</option><option>50</option><option>59.94</option><option>60</option></select></div>
<div class="field"><label for="sound">Sound</label><select id="sound" name="sound"><option selected>SYNC</option><option>MOS</option></select></div>
</div>
<div class="actions"><button class="primary" type="submit">Generate slate</button><button id="copy" type="button" disabled>Copy text</button><button id="download" type="button" disabled>Download SVG</button><button id="print" type="button" disabled>Print slate</button></div>
<p id="status" class="status" role="status" aria-live="polite">Enter the shot details and generate a slate.</p>
</form>
</section>
<section class="panel preview-panel" aria-labelledby="preview-title">
<h2 id="preview-title">Slate preview</h2>
<div class="slate" id="preview" role="img" aria-label="Generated production slate">
<div class="sticks" aria-hidden="true"></div>
<div class="slate-body">
<div class="production-name" id="view-production">Untitled Production</div>
<div class="big-grid"><div class="big-cell"><span class="slate-label">SCENE</span><span class="slate-value" id="view-scene">1</span></div><div class="big-cell"><span class="slate-label">TAKE</span><span class="slate-value" id="view-take">1</span></div></div>
<div class="slate-meta">
<div class="meta-item"><span class="slate-label">ROLL / CARD</span><span class="slate-value" id="view-roll">A001</span></div>
<div class="meta-item"><span class="slate-label">DATE</span><span class="slate-value" id="view-date">—</span></div>
<div class="meta-item"><span class="slate-label">DIRECTOR</span><span class="slate-value" id="view-director">—</span></div>
<div class="meta-item"><span class="slate-label">CAMERA</span><span class="slate-value" id="view-camera">—</span></div>
<div class="meta-item"><span class="slate-label">FRAME RATE</span><span class="slate-value" id="view-fps">24 fps</span></div>
<div class="meta-item"><span class="slate-label">SOUND</span><span class="slate-value" id="view-sound">SYNC</span></div>
</div>
</div>
</div>
<label class="text-label" for="slate-text">Plain-text slate</label><textarea class="slate-text" id="slate-text" readonly rows="9" aria-label="Generated plain-text production slate"></textarea>
</section>
</main>
<script src="/assets/app.js"></script>
<script>
/* production-slate-core:start */
var ProductionSlateCore = (function(){
  "use strict";
  function createSlate(input){
    var source = input || {};
    var definitions = [
      ["production", "Production", 80],
      ["scene", "Scene", 30],
      ["roll", "Roll / card", 30],
      ["director", "Director", 60],
      ["camera", "Camera", 60],
      ["date", "Shoot date", 10],
      ["fps", "Frame rate", 6],
      ["sound", "Sound", 6]
    ];
    var slate = {};
    definitions.forEach(function(definition){
      var field = definition[0], label = definition[1], maximum = definition[2];
      var value = String(source[field] == null ? "" : source[field]);
      if (/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/.test(value)) throw new Error(label + " contains an unsupported control character.");
      value = value.replace(/\s+/g, " ").trim();
      if (value.length > maximum) throw new Error(label + " must be at most " + maximum + " characters.");
      slate[field] = value;
    });
    if (!slate.production) throw new Error("Production is required.");
    if (!slate.scene) throw new Error("Scene is required.");
    var take = String(source.take == null ? "" : source.take).trim();
    if (!/^\d{1,3}$/.test(take) || Number(take) < 1) throw new Error("Take must be a whole number from 1 to 999.");
    slate.take = String(Number(take));
    var date = /^(\d{4})-(\d{2})-(\d{2})$/.exec(slate.date);
    var validDate = false;
    if (date){
      var year = Number(date[1]), month = Number(date[2]), day = Number(date[3]);
      var leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
      var days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      validDate = year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= days[month - 1];
    }
    if (!validDate) throw new Error("Shoot date must be a valid date in YYYY-MM-DD format.");
    if (["23.976", "24", "25", "29.97", "30", "50", "59.94", "60"].indexOf(slate.fps) === -1) throw new Error("Choose a supported frame rate.");
    if (slate.sound !== "SYNC" && slate.sound !== "MOS") throw new Error("Sound must be SYNC or MOS.");
    return slate;
  }
  function display(value){ return value || "—"; }
  function plainText(slate){
    return [
      "PRODUCTION: " + display(slate.production),
      "SCENE: " + display(slate.scene),
      "TAKE: " + display(slate.take),
      "ROLL: " + display(slate.roll),
      "DIRECTOR: " + display(slate.director),
      "CAMERA: " + display(slate.camera),
      "DATE: " + display(slate.date),
      "FRAME RATE: " + display(slate.fps) + " fps",
      "SOUND: " + display(slate.sound)
    ].join("\n");
  }
  function escapeXml(value){
    return String(value).replace(/[&<>"']/g, function(character){
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&apos;"}[character];
    });
  }
  function fittedSize(value, preferred, width){
    return Math.max(14, Math.min(preferred, Math.floor(width / Math.max(1, String(value).length * 0.62))));
  }
  function svgText(slate){
    function text(x, y, value, size, anchor, weight){
      return '<text x="' + x + '" y="' + y + '" fill="#ffffff" font-family="monospace" font-size="' + size + '" font-weight="' + (weight || 400) + '" text-anchor="' + (anchor || "start") + '">' + escapeXml(value) + "</text>";
    }
    function label(x, y, value){ return text(x, y, value, 18, "start", 400).replace('fill="#ffffff"', 'fill="#cccccc"').replace('font-size="18"', 'font-size="18" letter-spacing="2"'); }
    var production = display(slate.production);
    var scene = display(slate.scene), take = display(slate.take);
    var parts = [
      '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Production slate">',
      '<defs><pattern id="sticks" width="180" height="110" patternUnits="userSpaceOnUse"><rect width="180" height="110" fill="#f4f4f4"/><path d="M0 0H90L45 110H-45ZM90 0H180L135 110H45Z" fill="#171717"/></pattern></defs>',
      '<rect width="1200" height="675" rx="12" fill="#111111"/>',
      '<rect width="1200" height="110" fill="url(#sticks)"/><rect y="105" width="1200" height="10" fill="#f4f4f4"/>',
      text(600, 190, production, fittedSize(production, 52, 1060), "middle", 800),
      '<rect x="60" y="230" width="1080" height="150" fill="none" stroke="#777777" stroke-width="2"/><path d="M600 230V380" stroke="#777777" stroke-width="2"/>',
      label(90, 265, "SCENE"), label(630, 265, "TAKE"),
      text(90, 345, scene, fittedSize(scene, 64, 450), "start", 800),
      text(630, 345, take, fittedSize(take, 64, 450), "start", 800)
    ];
    var rows = [
      ["ROLL / CARD", display(slate.roll), "DATE", display(slate.date)],
      ["DIRECTOR", display(slate.director), "CAMERA", display(slate.camera)],
      ["FRAME RATE", display(slate.fps) + " fps", "SOUND", display(slate.sound)]
    ];
    rows.forEach(function(row, index){
      var y = 440 + index * 78;
      parts.push(label(60, y, row[0]), label(630, y, row[2]));
      parts.push(text(60, y + 38, row[1], fittedSize(row[1], 28, 500), "start", 650));
      parts.push(text(630, y + 38, row[3], fittedSize(row[3], 28, 500), "start", 650));
      parts.push('<path d="M60 ' + (y + 54) + 'H570M630 ' + (y + 54) + 'H1140" stroke="#444444"/>');
    });
    parts.push('</svg>');
    return parts.join("");
  }
  return {createSlate: createSlate, plainText: plainText, svgText: svgText};
})();
/* production-slate-core:end */
(function(){
"use strict";
var form = document.getElementById("slate-form");
var statusEl = document.getElementById("status");
var textEl = document.getElementById("slate-text");
var current = null;
var fields = ["production", "scene", "take", "roll", "director", "camera", "date", "fps", "sound"];
function setText(id, value){ document.getElementById(id).textContent = value || "—"; }
function render(slate){
  current = slate;
  fields.forEach(function(field){ setText("view-" + field, field === "fps" ? slate[field] + " fps" : slate[field]); });
  textEl.value = ProductionSlateCore.plainText(slate);
  document.getElementById("preview").setAttribute("aria-label", "Production slate for " + slate.production + ", scene " + slate.scene + ", take " + slate.take);
  ["copy", "download", "print"].forEach(function(id){ document.getElementById(id).disabled = false; });
  statusEl.classList.remove("error");
  statusEl.textContent = "Slate generated locally.";
}
form.addEventListener("submit", function(event){
  event.preventDefault();
  var input = {};
  fields.forEach(function(field){ input[field] = document.getElementById(field).value; });
  try { render(ProductionSlateCore.createSlate(input)); }
  catch(error){ current = null; statusEl.classList.add("error"); statusEl.textContent = error.message; }
});
document.getElementById("copy").addEventListener("click", function(){
  if (!current) return;
  navigator.clipboard.writeText(textEl.value).then(function(){ statusEl.textContent = "Plain-text slate copied."; }, function(){ textEl.focus(); textEl.select(); statusEl.textContent = "Select and copy the highlighted text."; });
});
document.getElementById("download").addEventListener("click", function(){
  if (!current) return;
  var blob = new Blob([ProductionSlateCore.svgText(current)], {type: "image/svg+xml;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = "production-slate.svg";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  statusEl.textContent = "SVG downloaded.";
});
document.getElementById("print").addEventListener("click", function(){ if (current) window.print(); });
var now = new Date();
document.getElementById("date").value = String(now.getFullYear()) + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
form.requestSubmit();
})();
</script>
</body>
</html>
