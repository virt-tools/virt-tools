<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Duct Static Pressure Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Duct Static Pressure Calculator</h1>
<p>Estimate total external static pressure from duct friction and fittings. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cfm">Airflow</label><input type="text" id="in-cfm" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-len">Duct length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dia">Duct diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-fit">Fitting equivalents</label><input type="text" id="in-fit" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cfmEl=document.getElementById("in-cfm"),lenEl=document.getElementById("in-len"),diaEl=document.getElementById("in-dia"),fitEl=document.getElementById("in-fit"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CFM=pn(cfmEl.value),L=pn(lenEl.value),D=pn(diaEl.value),F=pn(fitEl.value);
if(CFM==null||L==null||D==null||F==null)return;
if(!isFinite(CFM)||!isFinite(L)||!isFinite(D)||!isFinite(F)||CFM<=0||L<0||D<=0||F<0){err.textContent="Enter valid non-negative values.";return}
err.textContent="";
var vel=CFM/(Math.PI*Math.pow(D/24,2))/60;
var fp=Math.pow(vel/4005,2)*0.109*Math.pow(D,0.22)*L;
var fitLoss=F*0.3;
var total=fp+fitLoss;
var html='<div class="big">'+rnd(total,3)+' inWC</div>';
html+=row("Velocity",rnd(vel,0)+" fpm");
html+=row("Friction loss",rnd(fp,3)+" inWC");
html+=row("Fitting loss",rnd(fitLoss,2)+" inWC");
html+=row("Total static pressure",rnd(total,3)+" inWC");
out.innerHTML=html;
}
[cfmEl,lenEl,diaEl,fitEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
