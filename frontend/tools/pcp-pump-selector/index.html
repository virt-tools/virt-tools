<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>PCP Pump Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>PCP Pump Selector</h1>
<p>Calculate PCP pump displacement, rotor speed, and torque from pump geometry and target production. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Pump diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-pitch">Pitch</label><input type="text" id="in-pitch" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-rpm">RPM</label><input type="text" id="in-rpm" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">rpm</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),pE=document.getElementById("in-pitch"),rpmE=document.getElementById("in-rpm"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),p=parseFloat(pE.value),rpm=parseFloat(rpmE.value);
if(isNaN(d)||isNaN(p)||isNaN(rpm))return;
var area=Math.PI*Math.pow(d/2,2)*0.4;
var disp=area*p*0.0103*rpm*1440/1728;
var torque=disp*0.05;
var html='<div class="big">'+Math.round(disp)+' bbl/day</div>';
html+=row("Pump displacement",Math.round(disp)+' bbl/day');
html+=row("Required torque",Math.round(torque*10)/10+' ft-lb');
out.innerHTML=html;
}
[dE,pE,rpmE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
