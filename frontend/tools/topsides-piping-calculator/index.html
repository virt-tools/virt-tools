<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Topsides Piping Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Topsides Piping Calculator</h1>
<p>Calculate topsides pipe diameter, wall thickness, and support spacing from flow rate, pressure, and fluid density. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Flow rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-press">Design pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-dens">Fluid density</label><input type="text" id="in-dens" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">lb/ft³</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rate"),pE=document.getElementById("in-press"),dE=document.getElementById("in-dens"),out=document.getElementById("out");
function calc(){
var r=parseFloat(rE.value),p=parseFloat(pE.value),d=parseFloat(dE.value);
if(isNaN(r)||isNaN(p)||isNaN(d))return;
var dia=Math.sqrt(r/1000)*2.5;
var wt=(p*dia)/(2*20000*0.72);
var span=10-dia*0.3;
var html='<div class="big">'+(Math.round(dia*10)/10)+' in</div>';
html+=row("Pipe diameter",Math.round(dia*10)/10+' in');
html+=row("Wall thickness",Math.round(wt*100)/100+' in');
html+=row("Support spacing",Math.round(span*10)/10+' ft');
out.innerHTML=html;
}
[rE,pE,dE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
