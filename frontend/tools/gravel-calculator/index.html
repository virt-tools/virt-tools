<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravel & Mulch Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Gravel & Mulch Calculator</h1>
<p class="subtitle">Estimate how much material you need for your landscaping project.</p>

<div class="input-section">
  <label>Area length (ft)</label>
  <input type="number" id="length" value="10" min="0" step="0.5" aria-label="Length">
  <label>Area width (ft)</label>
  <input type="number" id="width" value="10" min="0" step="0.5" aria-label="Width">
  <label>Depth (inches)</label>
  <input type="number" id="depth" value="3" min="0.5" step="0.5" aria-label="Depth">
  <label>Material</label>
  <select id="material" aria-label="Material">
    <option value="1.4" data-name="Gravel">Gravel</option>
    <option value="0.8" data-name="Mulch">Mulch</option>
    <option value="1.2" data-name="Sand">Sand</option>
    <option value="1.5" data-name="Topsoil">Topsoil</option>
    <option value="1.0" data-name="River Rock">River Rock</option>
  </select>
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const l = parseFloat(document.getElementById('length').value) || 0;
    const w = parseFloat(document.getElementById('width').value) || 0;
    const d = parseFloat(document.getElementById('depth').value) || 0;
    const sel = document.getElementById('material');
    const density = parseFloat(sel.value);
    const name = sel.options[sel.selectedIndex].dataset.name;
    const areaSqFt = l * w;
    const areaSqYd = areaSqFt / 9;
    const depthFt = d / 12;
    const volumeCuFt = areaSqFt * depthFt;
    const volumeCuYd = volumeCuFt / 27;
    const weightTons = (volumeCuYd * density).toFixed(2);
    const bags = Math.ceil(volumeCuYd * 27 / 0.75);
    document.getElementById('bigResult').textContent = `${volumeCuYd.toFixed(2)} cubic yards`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Material:</span><span>${name}</span></div>
      <div class="result-row"><span>Area:</span><span>${areaSqFt.toFixed(0)} sq ft (${areaSqYd.toFixed(1)} sq yd)</span></div>
      <div class="result-row"><span>Volume:</span><span>${volumeCuFt.toFixed(1)} cu ft</span></div>
      <div class="result-row"><span>Weight:</span><span>~${weightTons} tons</span></div>
      <div class="result-row"><span>Bags (0.75 cu ft):</span><span>${bags}</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
