<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Plunger Lift Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Plunger Lift Calculator</h1>
<p>Calculate plunger lift cycle time, liquid slug size, and gas requirement from well depth and casing pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Well depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 6000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-cp">Casing pressure</label><input type="text" id="in-cp" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-tbg">Tubing size</label><input type="text" id="in-tbg" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">in</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-depth"),cpE=document.getElementById("in-cp"),tE=document.getElementById("in-tbg"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),cp=parseFloat(cpE.value),t=parseFloat(tE.value);
if(isNaN(d)||isNaN(cp)||isNaN(t))return;
var riseTime=d/1000;
var slugVol=0.5*Math.PI*Math.pow(t/24,2)*5;
var gasReq=cp*d*0.003;
var html='<div class="big">'+Math.round(riseTime*10)/10+' min</div>';
html+=row("Plunger rise time",Math.round(riseTime*10)/10+' min');
html+=row("Liquid slug per cycle",Math.round(slugVal*100)/100+' bbl');
html+=row("Gas per cycle",Math.round(gasReq)+' scf');
out.innerHTML=html;
}
[dE,cpE,tE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
