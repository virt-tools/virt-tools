<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Plunger Lift Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Plunger Lift Calculator</h1>
<p>Calculate plunger lift cycle time, liquid slug size, and gas requirement from well depth and casing pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Well depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 6000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-cp">Casing pressure</label><input type="text" id="in-cp" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-tbg">Tubing size</label><input type="text" id="in-tbg" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">in</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-depth"),cpE=document.getElementById("in-cp"),tE=document.getElementById("in-tbg"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),cp=parseFloat(cpE.value),t=parseFloat(tE.value);
if(isNaN(d)||isNaN(cp)||isNaN(t))return;
var riseTime=d/1000;
var slugVol=0.5*Math.PI*Math.pow(t/24,2)*5;
var gasReq=cp*d*0.003;
var html='<div class="big">'+Math.round(riseTime*10)/10+' min</div>';
html+=row("Plunger rise time",Math.round(riseTime*10)/10+' min');
html+=row("Liquid slug per cycle",Math.round(slugVal*100)/100+' bbl');
html+=row("Gas per cycle",Math.round(gasReq)+' scf');
out.innerHTML=html;
}
[dE,cpE,tE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
