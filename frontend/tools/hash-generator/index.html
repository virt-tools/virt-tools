<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
textarea{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px;width:100%;box-sizing:border-box;font-family:monospace;font-size:13px;min-height:100px}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:#58a6ff}
button.primary{background:#1e3a5f;border-color:#58a6ff}
.hash-row{display:flex;align-items:center;gap:8px;margin:8px 0;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px}
.hash-row label{min-width:80px;margin:0;font-weight:bold;color:#58a6ff}
.hash-row code{flex:1;font-family:monospace;font-size:12px;word-break:break-all;color:#c9d1d9}
.hash-row button{margin:0;padding:4px 8px;font-size:.75em}
.note{color:#8b949e;font-size:.8em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Hash Generator</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Generate cryptographic hashes (SHA-1, SHA-256, SHA-384, SHA-512) using the Web Crypto API. 100% client-side.</p>
<label>Input text</label>
<textarea id="input" placeholder="Enter text to hash..." aria-label="Enter Text To Hash..."></textarea>
<button class="primary" onclick="compute()" type="button">Generate Hashes</button>
<button onclick="clearAll()" type="button">Clear</button>
<div id="results" style="margin-top:12px;display:none">
<div class="hash-row"><label>SHA-1</label><code id="sha1"></code><button onclick="copyHash('sha1')" type="button">Copy</button></div>
<div class="hash-row"><label>SHA-256</label><code id="sha256"></code><button onclick="copyHash('sha256')" type="button">Copy</button></div>
<div class="hash-row"><label>SHA-384</label><code id="sha384"></code><button onclick="copyHash('sha384')" type="button">Copy</button></div>
<div class="hash-row"><label>SHA-512</label><code id="sha512"></code><button onclick="copyHash('sha512')" type="button">Copy</button></div>
</div>
<p class="note">All hashing happens in your browser via the Web Crypto API. No data is sent anywhere.</p>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
async function compute(){
  const text=document.getElementById('input').value;
  if(!text){alert('Enter some text first');return;}
  const enc=new TextEncoder().encode(text);
  const algos=['SHA-1','SHA-256','SHA-384','SHA-512'];
  const ids=['sha1','sha256','sha384','sha512'];
  for(let i=0;i<algos.length;i++){
    const buf=await crypto.subtle.digest(algos[i],enc);
    const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    document.getElementById(ids[i]).textContent=hex;
  }
  document.getElementById('results').style.display='block';
}
function copyHash(id){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{});}
function clearAll(){document.getElementById('input').value='';document.getElementById('results').style.display='none';}
document.getElementById('input').addEventListener('input',()=>{if(document.getElementById('results').style.display==='block')compute();});
</script>
</body>
</html>
