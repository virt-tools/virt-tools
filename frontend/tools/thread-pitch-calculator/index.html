<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thread Pitch Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Thread Pitch Calculator</h1>
<p class="subtitle">Convert between TPI, pitch, lead, and drill sizes for threaded fasteners.</p>
<div class="input-section">
<label>Thread Type</label>
<select id="threadType" aria-label="Thread Type">
<option value="unified" selected>Unified (UNC/UNF)</option>
<option value="metric">Metric (ISO)</option>
</select>
<label id="lbl1">TPI (threads per inch)</label>
<input type="number" id="tpi" value="20" min="1" step="0.5" aria-label="Tpi">
<label>Major Diameter (inches)</label>
<input type="number" id="major" value="0.25" min="0.01" step="0.001" aria-label="Major">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const type=document.getElementById('threadType').value;
const tpi=parseFloat(document.getElementById('tpi').value)||1;
const major=parseFloat(document.getElementById('major').value)||0;
let pitchIn,pitchMm,tapDrill,pitchDiam;
if(type==='unified'){
pitchIn=1/tpi;
pitchMm=pitchIn*25.4;
tapDrill=major-1/tpi;
pitchDiam=major-0.64952/tpi;
}else{
pitchMm=tpi;
pitchIn=pitchMm/25.4;
tapDrill=major-pitchMm/25.4;
pitchDiam=major-0.64952*pitchIn;
}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Major Diameter:</span><span>${major.toFixed(4)}" (${(major*25.4).toFixed(3)} mm)</span></div>
<div class="result-row"><span>Pitch:</span><span>${pitchIn.toFixed(5)}" (${pitchMm.toFixed(4)} mm)</span></div>
<div class="result-row"><span>TPI:</span><span>${type==='unified'?tpi:(25.4/pitchMm).toFixed(1)}</span></div>
<div class="result-row"><span>Pitch Diameter:</span><span>${pitchDiam.toFixed(4)}"</span></div>
<div class="result-row"><span>Tap Drill Size:</span><span>${tapDrill.toFixed(4)}" (${(tapDrill*25.4).toFixed(2)} mm)</span></div>
<div class="result-row"><span>Minor Diameter:</span><span>${(major-1.299/tpi).toFixed(4)}"</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
