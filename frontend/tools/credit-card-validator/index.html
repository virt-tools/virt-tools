<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Credit Card Validator</h1>
<p class="subtitle">Validate credit card numbers using the Luhn algorithm. Identifies card type (Visa, Mastercard, Amex, Discover, etc.). No data leaves your browser.</p>
<div style="max-width:600px;margin-top:1.5rem;">
<label style="font-weight:600;">Card Number</label>
<input type="text" id="cardInput" placeholder="4532 1234 5678 9012" style="width:100%;font-size:1.2rem;font-family:monospace;padding:.6rem;border:2px solid #ddd;border-radius:8px;margin-top:.4rem;letter-spacing:2px;" aria-label="4532 1234 5678 9012">
<div id="result" style="margin-top:1rem;padding:1rem;border-radius:8px;background:#f5f5f5;">
  <span style="color:#999;">Enter a card number to validate</span>
</div>
<div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
<button class="btn" id="copyFormatted" type="button">Copy formatted</button>
<button class="btn" id="copyMasked" type="button">Copy masked</button>
<button class="btn" id="generate" type="button">Generate test card</button>
</div>
<h3 style="margin-top:1.5rem;">Detected Card Type</h3>
<div id="cardType" style="font-size:1.5rem;">—</div>
<h3 style="margin-top:1rem;">Luhn Check</h3>
<div id="luhnDetail" style="font-family:monospace;background:#1e1e1e;color:#00ff41;padding:1rem;border-radius:8px;font-size:.85rem;white-space:pre-wrap;min-height:60px;">—</div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input = document.getElementById('cardInput');
const result = document.getElementById('result');
const typeEl = document.getElementById('cardType');
const luhnEl = document.getElementById('luhnDetail');
const CARD_TYPES = [
  {name:'Visa',pattern:/^4/},{name:'Mastercard',pattern:/^(5[1-5]|2[2-7])/},
  {name:'Amex',pattern:/^3[47]/},{name:'Discover',pattern:/^(6011|65|64[4-9])/},
  {name:'Diners Club',pattern:/^3[0689]/},{name:'JCB',pattern:/^35/},
  {name:'UnionPay',pattern:/^62/},{name:'Maestro',pattern:/^(50|6[7-9])/},
];
function detectType(digits){
  const c = CARD_TYPES.find(x => x.pattern.test(digits)); return c ? c.name : 'Unknown';
}
function luhnCheck(digits){
  let sum=0, alt=false, steps=[];
  for(let i=digits.length-1;i>=0;i--){
    const n = parseInt(digits[i]);
    let v = n;
    if(alt){
      v = n*2; if(v>9) v-=9;
      steps.push('  '+digits[i]+' ×2 = '+v);
    } else {
      steps.push('  '+digits[i]+'    = '+v);
    }
    sum += v; alt = !alt;
  }
  steps.push('Sum: '+sum);
  steps.push(sum % 10 === 0 ? '✓ Divisible by 10 → VALID' : '✗ Not divisible by 10 → INVALID');
  return {valid: sum % 10 === 0, detail: steps.join('\n')};
}
function formatCard(digits){
  if(digits.startsWith('34')||digits.startsWith('37')){
    return digits.slice(0,4)+' '+digits.slice(4,10)+' '+digits.slice(10,15);
  }
  return digits.replace(/(.{4})/g,'$1 ').trim();
}
function maskCard(digits){
  if(digits.length < 4) return digits;
  return '•••• •••• •••• '+digits.slice(-4);
}
function update(){
  const raw = input.value.replace(/\D/g,'');
  if(!raw){ result.innerHTML='<span style="color:#999;">Enter a card number to validate</span>'; typeEl.textContent='—'; luhnEl.textContent='—'; return; }
  const type = detectType(raw);
  const luhn = luhnCheck(raw);
  const lengthOk = raw.length >= 12 && raw.length <= 19;
  if(luhn.valid && lengthOk){
    result.style.background='#e8f8e8';
    result.innerHTML='✅ <strong>Valid</strong> '+type+' card ('+raw.length+' digits)';
  } else if(!luhn.valid){
    result.style.background='#fdf0f0';
    result.innerHTML='❌ <strong>Invalid</strong> — Luhn check failed';
  } else {
    result.style.background='#fdf8e8';
    result.innerHTML='⚠ Luhn passes but length ('+raw.length+') is unusual';
  }
  typeEl.textContent = type + ' ' + (CARD_TYPES.find(x=>x.name===type) ? '' : '');
  luhnEl.textContent = luhn.detail;
}
input.addEventListener('input', function(e){
  let v = e.target.value.replace(/\D/g,'').slice(0,19);
  e.target.value = v;
  update();
});
const TEST_CARDS = ['4532015112830366','5500005555555559','371449635398431','6011111111111117','3530111333300000'];
document.getElementById('generate').onclick = () => {
  const card = TEST_CARDS[Math.floor(Math.random()*TEST_CARDS.length)];
  input.value = card; update();
};
document.getElementById('copyFormatted').onclick = () => {
  const raw = input.value.replace(/\D/g,'');
  if(!raw) return;
  navigator.clipboard.writeText(formatCard(raw));
};
document.getElementById('copyMasked').onclick = () => {
  const raw = input.value.replace(/\D/g,'');
  if(!raw) return;
  navigator.clipboard.writeText(maskCard(raw));
};
})();
</script>
<style>
.btn{padding:.4rem .8rem;border:1px solid #ddd;border-radius:6px;background:#f5f5f5;cursor:pointer;font-weight:600;font-size:.9rem;}
.btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
</style>
</body>
</html>
