<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Planting Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Garden Planting Calculator</h1>
<p class="subtitle">Calculate plant spacing, number of plants, and planting dates for your garden.</p>
<div class="input-section">
<label>Garden Length (ft)</label>
<input type="number" id="gLen" value="10" min="0.5" step="0.5" aria-label="G Len">
<label>Garden Width (ft)</label>
<input type="number" id="gWid" value="4" min="0.5" step="0.5" aria-label="G Wid">
<label>Plant Type</label>
<select id="plant" aria-label="Plant">
<option value="6,6" data-days="60">Tomato (24" spacing)</option>
<option value="4,4" data-days="50">Lettuce (12" spacing)</option>
<option value="3,3" data-days="70">Carrot (4" spacing)</option>
<option value="12,12" data-days="90">Pumpkin (36" spacing)</option>
<option value="6,6" data-days="55">Pepper (18" spacing)</option>
<option value="2,2" data-days="40">Radish (2" spacing)</option>
<option value="6,6" data-days="50">Bean (3" spacing)</option>
<option value="4,4" data-days="65">Cucumber (12" spacing)</option>
</select>
<label>Last Frost Date</label>
<input type="date" id="frost" aria-label="Frost">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const PLANTS={
'6,6':{name:'Tomato',spacingIn:24,days:60,offset:-6},
'4,4':{name:'Lettuce',spacingIn:12,days:50,offset:-4},
'3,3':{name:'Carrot',spacingIn:4,days:70,offset:-2},
'12,12':{name:'Pumpkin',spacingIn:36,days:90,offset:-2},
'6,6b':{name:'Pepper',spacingIn:18,days:55,offset:-8},
'2,2':{name:'Radish',spacingIn:2,days:30,offset:0},
'6,6c':{name:'Bean',spacingIn:3,days:50,offset:0},
'4,4b':{name:'Cucumber',spacingIn:12,days:65,offset:-3}
};
document.addEventListener('DOMContentLoaded',()=>{
const today=new Date();
today.setMonth(today.getMonth()+1);
document.getElementById('frost').valueAsDate=today;
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('gLen').value)||0;
const W=parseFloat(document.getElementById('gWid').value)||0;
const key=document.getElementById('plant').value;
const p=PLANTS[key]||{name:'Plant',spacingIn:12,days:60,offset:-4};
const area=L*W;
const sqIn=area*144;
const plantsPerSqFt=144/(p.spacingIn*p.spacingIn);
const totalPlants=Math.floor(area*plantsPerSqFt);
const frostDate=new Date(document.getElementById('frost').value||new Date());
const plantDate=new Date(frostDate);
plantDate.setDate(plantDate.getDate()+p.offset);
const harvestDate=new Date(plantDate);
harvestDate.setDate(harvestDate.getDate()+p.days);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Plant Type:</span><span>${p.name}</span></div>
<div class="result-row"><span>Garden Area:</span><span>${area} sq ft</span></div>
<div class="result-row"><span>Spacing:</span><span>${p.spacingIn}" apart</span></div>
<div class="result-row"><span>Plants Needed:</span><span>${totalPlants} plants</span></div>
<div class="result-row"><span>Plant Indoors/Outdoors:</span><span>${plantDate.toDateString()}</span></div>
<div class="result-row"><span>Estimated Harvest:</span><span>${harvestDate.toDateString()}</span></div>
<div class="result-row"><span>Days to Harvest:</span><span>${p.days} days</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
