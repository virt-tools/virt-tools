<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Spontaneous Potential Logging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Spontaneous Potential Logging Calculator</h1>
<p>Calculate static SP and water saturation from SP log reading, mud filtrate and formation water resistivities. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sp">SP reading</label><input type="text" id="in-sp" inputmode="decimal" autocomplete="off" placeholder="e.g. -40"><div class="unit">mV</div></div>
<div class="field"><label class="f" for="in-rmf">Mud filtrate Rmf</label><input type="text" id="in-rmf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.2"><div class="unit">Ω·m</div></div>
<div class="field"><label class="f" for="in-rw">Formation water Rw</label><input type="text" id="in-rw" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">Ω·m</div></div>
<div class="field"><label class="f" for="in-temp">Temperature</label><input type="text" id="in-temp" inputmode="decimal" autocomplete="off" placeholder="e.g. 75"><div class="unit">°F</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var spE=document.getElementById("in-sp"),rmfE=document.getElementById("in-rmf"),rwE=document.getElementById("in-rw"),tempE=document.getElementById("in-temp"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var sp=parseFloat(spE.value),rmf=parseFloat(rmfE.value),rw=parseFloat(rwE.value),temp=parseFloat(tempE.value)||75;
if(isNaN(sp)||isNaN(rmf)||isNaN(rw))return;
if(rmf<=0||rw<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var ssp=-71*Math.log10(rmf/rw);
var spRatio=Math.abs(sp)/Math.abs(ssp);
var rwDerived=rmf/Math.pow(10,-sp/71);
var html='<div class="big">'+Math.round(ssp)+' mV</div>';
html+=row("Static SP (SSP)",Math.round(ssp)+' mV');
html+=row("SP/Rw derived",Math.round(rwDerived*1000)/1000+' Ω·m');
html+=row("SP quality",spRatio>0.9?'Good':(spRatio>0.5?'Fair':'Poor'));
out.innerHTML=html;
}
[spE,rmfE,rwE,tempE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
