<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Zoom on Hover Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:3rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔍 CSS Text Zoom on Hover Generator</h1>
<p>Create CSS text zoom/scale animations on hover. 6 styles, adjustable scale, duration, color. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="scale">Scale</option><option value="grow">Grow Up</option><option value="shrink">Shrink</option><option value="pulse">Pulse Zoom</option><option value="elastic">Elastic Zoom</option><option value="letter">Per-Letter Zoom</option></select></div>
<div class="ctrl-row"><label>Scale</label><input type="range" id="scale" min="1.1" max="3" step="0.1" value="1.5" style="width:200px" aria-label="Scale"></div>
<div class="ctrl-row"><label>Duration (s)</label><input type="range" id="dur" min="0.1" max="2" step="0.1" value="0.4" style="width:200px" aria-label="Dur"></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="Hover Me" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#667eea" aria-label="Color"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="16" max="60" value="32" style="width:200px" aria-label="Fsize"></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var sc=parseFloat(document.getElementById('scale').value);
var du=parseFloat(document.getElementById('dur').value);
var tx=document.getElementById('text').value;
var cl=document.getElementById('color').value;
var fs=parseInt(document.getElementById('fsize').value);
var html='',css='';
if(st==='letter'){
html='<div class="tz-wrap">'+tx.split('').map(function(c,i){return '<span class="tz-char" style="transition-delay:'+(i*0.05)+'s">'+c+'</span>'}).join('')+'</div>';
css='.tz-wrap{font-size:'+fs+'px;font-weight:700;cursor:pointer;display:flex}\n';
css+='.tz-char{color:'+cl+';display:inline-block;transition:transform '+du+'s ease}\n';
css+='.tz-wrap:hover .tz-char{transform:scale('+sc+')}\n';
}else{
html='<div class="tz-text">'+tx+'</div>';
css='.tz-text{font-size:'+fs+'px;font-weight:700;color:'+cl+';cursor:pointer;transition:all '+du+'s ease\n';
if(st==='scale'){css+='.tz-text:hover{transform:scale('+sc+')}\n'}
else if(st==='grow'){css+='.tz-text{transform-origin:bottom}\n.tz-text:hover{transform:scale('+sc+')}\n'}
else if(st==='shrink'){css+='.tz-text{transform:scale('+sc+');transition:all '+du+'s ease}\n.tz-text:hover{transform:scale(1)}\n'}
else if(st==='pulse'){css+='@keyframes tz-pulse{0%,100%{transform:scale(1)}50%{transform:scale('+sc+')}}\n.tz-text:hover{animation:tz-pulse '+du+'s ease infinite}\n'}
else if(st==='elastic'){css+='.tz-text:hover{transform:scale('+sc+');transition:transform '+du+'s cubic-bezier(0.68,-0.55,0.265,1.55)}\n'}
css+='}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','scale','dur','text','color','fsize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
