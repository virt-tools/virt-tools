<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Well Pump Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Well Pump Size Selector</h1>
<p>Calculate pump HP, flow rate (GPM), and pressure tank size from well depth, lift height, and household GPM demand. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Well depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Lift height</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-g">Demand GPM</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">gpm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),gEl=document.getElementById("in-g"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),L=pn(lEl.value),G=pn(gEl.value);
if(D==null||L==null||G==null)return;
if(!isFinite(D)||!isFinite(L)||!isFinite(G)||D<=0||L<=0||G<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var tdh=D+L+69; // + 30 psi house pressure converted to head: 30 psi × 2.31 ft/psi ≈ 69 ft
var hp=Math.ceil(G*tdh/3960/0.65*10)/10;
var tankSize=Math.ceil(G*4/10)*10;
var html='<div class="big">'+rnd(hp,1)+' HP</div>';
html+=row("Well depth",rnd(D,0)+' ft');
html+=row("Lift height",rnd(L,0)+' ft');
html+=row("Demand",rnd(G,0)+' gpm');
html+=row("Total dynamic head",rnd(tdh,0)+' ft');
html+=row("Pump HP",rnd(hp,1));
html+=row("Pressure tank",rnd(tankSize,0)+' gal');
out.innerHTML=html;
}
[dEl,lEl,gEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
