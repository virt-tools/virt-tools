<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Form Tie Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Form Tie Spacing Calculator</h1>
<p>Calculate form tie spacing based on concrete pressure, tie capacity, and pour rate. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p">Concrete pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">psf</div></div>
<div class="field"><label class="f" for="in-c">Tie capacity</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-w">Form width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">feet</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-p"),cEl=document.getElementById("in-c"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var P=pn(pEl.value),C=pn(cEl.value),W=pn(wEl.value);
if(P==null||C==null||W==null)return;
if(!isFinite(P)||P<=0||!isFinite(C)||C<=0||!isFinite(W)||W<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var loadPerTie=P*W*W;
var maxSpacingFt=C/(P*W);
var maxSpacingIn=maxSpacingFt*12;
var tiesPerRow=Math.ceil(W*12/maxSpacingIn)+1;
var html='<div class="big">'+rnd(maxSpacingIn,1)+' in</div>';
html+=row("Max tie spacing",rnd(maxSpacingIn,1)+' in');
html+=row("Load per tie",rnd(loadPerTie,0)+' lb');
html+=row("Tie capacity",C+' lb');
html+=row("Ties per row",tiesPerRow);
html+=row("Concrete pressure",P+' psf');
out.innerHTML=html;
}
[pEl,cEl,wEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
