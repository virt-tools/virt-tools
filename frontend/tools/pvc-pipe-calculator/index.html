<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVC Pipe Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>PVC Pipe Volume Calculator</h1>
<p class="subtitle">Calculate water volume, weight, and flow rate in PVC pipes.</p>
<div class="input-section">
<label>Pipe Diameter (inches)</label>
<input type="number" id="dia" value="2" min="0.25" step="0.125" aria-label="Dia">
<label>Pipe Length (feet)</label>
<input type="number" id="len" value="100" min="1" aria-label="Len">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const d=parseFloat(document.getElementById('dia').value)||0;
const l=parseFloat(document.getElementById('len').value)||0;
const r=d/2/12;
const lengthFt=l;
const cuFt=Math.PI*r*r*lengthFt;
const gal=cuFt*7.48052;
const weight=gal*8.34;
const cuIn=Math.PI*(d/2)**2*(l*12);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Pipe Volume:</span><span>${cuFt.toFixed(4)} cu ft</span></div>
<div class="result-row"><span>Water Volume:</span><span>${gal.toFixed(2)} gallons</span></div>
<div class="result-row"><span>Water Weight:</span><span>${weight.toFixed(2)} lbs</span></div>
<div class="result-row"><span>Internal Area:</span><span>${(Math.PI*(d/2)**2).toFixed(4)} sq in</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
