<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to CSV — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON to CSV Converter</h1>
<p class="subtitle">Convert JSON array of objects to CSV. Auto-detects columns, handles nested values. 100% client-side.</p>
<div class="input-section">
<label>Paste JSON array</label>
<textarea id="input" rows="8" placeholder='[{"name":"Alice","age":30},{"name":"Bob","age":25}]' aria-label="[{"></textarea>
<button id="convert" class="primary-btn" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function toCSV(arr){
if(!Array.isArray(arr)||!arr.length)return'';
const headers=[...new Set(arr.flatMap(o=>Object.keys(o)))];
let csv=headers.map(h=>`"${h.replace(/"/g,'""')}"`).join(',')+'\n';
for(const row of arr){
csv+=headers.map(h=>{const v=row[h];const s=v===null||v===undefined?'':typeof v==='object'?JSON.stringify(v):String(v);return`"${s.replace(/"/g,'""')}"`;}).join(',')+'\n';
}
return csv;
}
document.getElementById('convert').addEventListener('click',()=>{
try{
const data=JSON.parse(document.getElementById('input').value);
if(!Array.isArray(data)){document.getElementById('result').innerHTML='<p style="color:red">Input must be a JSON array.</p>';return;}
const csv=toCSV(data);
const ta=document.createElement('textarea');
ta.value=csv;ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
document.getElementById('result').innerHTML='';
document.getElementById('result').appendChild(ta);
document.getElementById('result').appendChild(btn);
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
