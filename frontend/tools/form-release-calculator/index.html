<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Form Release Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Form Release Calculator</h1>
<p>Calculate form release agent quantity based on form surface area and coverage rate. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Surface area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-c">Coverage rate</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">sq ft/gal</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),C=pn(cEl.value);
if(A==null||C==null)return;
if(!isFinite(A)||A<=0||!isFinite(C)||C<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var gal=A/C;
var qt=gal*4;
var wasteFactor=1.1;
var totalGal=gal*wasteFactor;
var html='<div class="big">'+rnd(totalGal,2)+' gal</div>';
html+=row("Release agent needed",rnd(totalGal,2)+' gal');
html+=row("Base amount",rnd(gal,2)+' gal');
html+=row("In quarts",rnd(qt,1)+' qt');
html+=row("Waste factor","10%");
html+=row("Coverage rate",C+' sq ft/gal');
out.innerHTML=html;
}
[aEl,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
