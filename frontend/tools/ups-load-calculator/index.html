<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>UPS Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>UPS Load Calculator</h1>
<p>Calculate required UPS VA rating and estimated runtime from total load wattage, power factor, and desired backup time. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Total load</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-pf">Power factor</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.8"><div class="unit">0–1</div></div>
<div class="field"><label class="f" for="in-min">Desired runtime</label><input type="text" id="in-min" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">minutes</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),pfEl=document.getElementById("in-pf"),minEl=document.getElementById("in-min"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=parseFloat(wEl.value),PF=parseFloat(pfEl.value),M=parseFloat(minEl.value);
if(isNaN(W)||isNaN(PF)||isNaN(M))return;
if(W<=0||PF<=0||PF>1||M<=0){err.textContent="Wattage and minutes must be positive; power factor 0–1.";return}
err.textContent="";
var va=W/PF;
var vaRounded=Math.ceil(va/100)*100; // round up to nearest 100
var whNeeded=W*(M/60);
var ahNeeded=whNeeded/12; // assuming 12V battery
var html='<div class="big">'+vaRounded+' VA</div>';
html+=row("Real power",Math.round(W)+" W");
html+=row("Apparent power",Math.round(va)+" VA");
html+=row("Recommended UPS",vaRounded+" VA");
html+=row("Energy needed",Math.round(whNeeded*10)/10+" Wh");
html+=row("Battery (12V)",Math.round(ahNeeded*10)/10+" Ah");
out.innerHTML=html;
}
[wEl,pfEl,minEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
