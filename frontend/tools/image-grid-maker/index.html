<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Grid Maker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Grid Maker</h1>
<p class="subtitle">Arrange multiple images into a grid with adjustable columns, gap, and background. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Images: <input type="file" id="file" accept="image/*" multiple></label>
<label>Columns: <input type="number" id="cols" value="3" min="1" max="10" style="width:50px"></label>
<label>Gap: <input type="number" id="gap" value="4" min="0" max="50" style="width:50px">px</label>
<label>BG: <input type="color" id="bg" value="#ffffff"></label>
<button onclick="build()" type="button">Build</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var imgs=[];
document.getElementById('file').addEventListener('change',function(){
imgs=[];var files=Array.from(this.files);var loaded=0;
files.forEach(function(f){var im=new Image();im.src=URL.createObjectURL(f);im.onload=function(){imgs.push(im);if(++loaded===files.length)build();};});
});
function build(){
if(!imgs.length)return;var cols=parseInt(document.getElementById('cols').value);var gap=parseInt(document.getElementById('gap').value);var bg=document.getElementById('bg').value;
var rows=Math.ceil(imgs.length/cols);var cellW=Math.max.apply(null,imgs.map(function(i){return i.naturalWidth}));var cellH=Math.max.apply(null,imgs.map(function(i){return i.naturalHeight}));
var cv=document.getElementById('canvas');cv.width=cols*cellW+(cols-1)*gap;cv.height=rows*cellH+(rows-1)*gap;
var ctx=cv.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
imgs.forEach(function(i,idx){var r=Math.floor(idx/cols);var c=idx%cols;var x=c*(cellW+gap);var y=r*(cellH+gap);
var scale=Math.min(cellW/i.naturalWidth,cellH/i.naturalHeight);var w=i.naturalWidth*scale;var h=i.naturalHeight*scale;
ctx.drawImage(i,x+(cellW-w)/2,y+(cellH-h)/2,w,h);
});
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='grid.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
