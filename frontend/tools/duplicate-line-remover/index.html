<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duplicate Line Remover — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Duplicate Line Remover</h1>
<p class="subtitle">Remove duplicate lines from a list. Optional case-insensitive mode and preserve-first occurrence.</p>
<div class="input-section">
<label>Enter text (one item per line)</label>
<textarea id="input" rows="12" placeholder="apple&#10;banana&#10;apple&#10;cherry" aria-label="Apple&#10;Banana&#10;Apple&#10;Cherry"></textarea>
<label>Case-insensitive</label>
<select id="ci" aria-label="Ci"><option value="no" selected>No</option><option value="yes">Yes</option></select>
<button id="process" class="primary-btn" type="button">Remove Duplicates</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',()=>{
const lines=document.getElementById('input').value.split('\n');
const ci=document.getElementById('ci').value==='yes';
const seen=new Set();
const out=[];
let removed=0;
for(const line of lines){
const key=ci?line.toLowerCase():line;
if(seen.has(key)){removed++;continue;}
seen.add(key);out.push(line);
}
document.getElementById('result').innerHTML='<p>Removed <strong>'+removed+'</strong> duplicate(s). '+out.length+' unique line(s) remaining.</p><pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;margin-top:1em">'+out.join('\n').replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=out.join('\n');
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
