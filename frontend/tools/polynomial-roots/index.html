<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Roots Finder — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Polynomial Roots Finder</h1>
<p class="subtitle">Find real and complex roots of polynomials using Durand-Kerner method.</p>
<div class="input-section">
<p class="hint">Enter coefficients from highest to lowest degree (e.g., 1 -5 8 -4 for x³−5x²+8x−4)</p>
<label>Coefficients (space separated)</label>
<input type="text" id="coeffs" value="1 -5 8 -4" style="width:100%;font-family:monospace" aria-label="Coeffs">
<button id="calc" class="primary-btn" type="button">Find Roots</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function durandKerner(coeffs,iter){
const n=coeffs.length-1;
if(n<=0)return[];
if(n===1)return[-coeffs[1]/coeffs[0]];
if(n===2){const a=coeffs[0],b=coeffs[1],c=coeffs[2];const d=b*b-4*a*c;return d>=0?[(-b+Math.sqrt(d))/(2*a),(-b-Math.sqrt(d))/(2*a)]:[complex(-b/(2*a),Math.sqrt(-d)/(2*a)),complex(-b/(2*a),-Math.sqrt(-d)/(2*a))];}
function complex(re,im){return{re,im};}
function cmul(a,b){return{re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re};}
function cdiv(a,b){const d=b.re*b.re+b.im*b.im;return{re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d};}
function cadd(a,b){return{re:a.re+b.re,im:a.im+b.im};}
function csub(a,b){return{re:a.re-b.re,im:a.im-b.im};}
function cabs(a){return Math.sqrt(a.re*a.re+a.im*a.im);}
function cpow(a,n){let r=Math.atan2(a.im,a.re),m=Math.sqrt(a.re*a.re+a.im*a.im);return{re:Math.pow(m,n)*Math.cos(n*r),im:Math.pow(m,n)*Math.sin(n*r)};}
function evalp(z){let r={re:0,im:0};for(let i=0;i<coeffs.length;i++){const c=complex(coeffs[i],0);const zPow=cpow(z,coeffs.length-1-i);const term=cmul(c,zPow);r=cadd(r,term);}return r;}
let roots=[];
const base=complex(0.4,0.9);
for(let i=0;i<n;i++)roots.push(cpow(base,i));
for(let it=0;it<iter;it++){
for(let i=0;i<n;i++){
let prod=complex(1,0);
for(let j=0;j<n;j++){if(j!==i)prod=cmul(prod,csub(roots[i],roots[j]));}
if(cabs(prod)<1e-15)continue;
const fz=evalp(roots[i]);
roots[i]=csub(roots[i],cdiv(fz,prod));
}}
return roots;
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const coeffs=document.getElementById('coeffs').value.split(/\s+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x));
if(coeffs.length<2){document.getElementById('result').innerHTML='<p class="warning">Enter at least 2 coefficients.</p>';document.getElementById('result').style.display='block';return;}
const roots=durandKerner(coeffs,200);
let html=`<div class="result-row"><span>Polynomial:</span><span>`;
coeffs.forEach((c,i)=>{if(i===0)html+=c===1?'x':c+'x';else if(i<coeffs.length-1)html+=(c>=0?'+ ':'')+c+'x';else html+=(c>=0?'+ ':'')+c;if(coeffs.length-1-i>1)html+='^'+(coeffs.length-1-i);else if(coeffs.length-1-i===1)html+='';else html+='';});
html+='</span></div>';
html+=`<div class="result-row"><span>Degree:</span><span>${coeffs.length-1}</span></div>`;
roots.forEach((r,i)=>{
if(Math.abs(r.im)<1e-6)html+=`<div class="result-row"><span>Root ${i+1}:</span><span>${r.re.toFixed(8)}</span></div>`;
else html+=`<div class="result-row"><span>Root ${i+1}:</span><span>${r.re.toFixed(8)} ${r.im>=0?'+':'−'} ${Math.abs(r.im).toFixed(8)}i</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
