<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricity Cost Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Electricity Cost Calculator</h1>
<p class="subtitle">Estimate the cost of running any appliance based on wattage, hours of use, and electricity rate.</p>

<div class="input-section">
  <label>Appliance Wattage (W)</label>
  <input type="number" id="watts" value="1500" step="0.1" min="0" aria-label="Watts">

  <label>Hours per day</label>
  <input type="number" id="hours" value="8" step="0.1" min="0" max="24" aria-label="Hours">

  <label>Days per month</label>
  <input type="number" id="days" value="30" step="1" min="0" max="31" aria-label="Days">

  <label>Electricity rate ($/kWh)</label>
  <input type="number" id="rate" value="0.15" step="0.001" min="0" aria-label="Rate">

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="result-row"><span>Daily cost:</span><span id="daily-cost"></span></div>
  <div class="result-row"><span>Monthly cost:</span><span id="monthly-cost"></span></div>
  <div class="result-row"><span>Yearly cost:</span><span id="yearly-cost"></span></div>
  <div class="result-row"><span>Daily usage:</span><span id="daily-kwh"></span></div>
  <div class="result-row"><span>Monthly usage:</span><span id="monthly-kwh"></span></div>
  <div class="result-row"><span>Yearly usage:</span><span id="yearly-kwh"></span></div>
</div>

<style>
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.result-row:first-child { font-size:1.1em; font-weight:bold; color:var(--accent); }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const watts = parseFloat(document.getElementById('watts').value) || 0;
    const hours = parseFloat(document.getElementById('hours').value) || 0;
    const days = parseFloat(document.getElementById('days').value) || 0;
    const rate = parseFloat(document.getElementById('rate').value) || 0;

    const dailyKwh = (watts / 1000) * hours;
    const monthlyKwh = dailyKwh * days;
    const yearlyKwh = dailyKwh * 365;

    const dailyCost = dailyKwh * rate;
    const monthlyCost = monthlyKwh * rate;
    const yearlyCost = yearlyKwh * rate;

    document.getElementById('daily-cost').textContent = '$' + dailyCost.toFixed(2);
    document.getElementById('monthly-cost').textContent = '$' + monthlyCost.toFixed(2);
    document.getElementById('yearly-cost').textContent = '$' + yearlyCost.toFixed(2);
    document.getElementById('daily-kwh').textContent = dailyKwh.toFixed(2) + ' kWh';
    document.getElementById('monthly-kwh').textContent = monthlyKwh.toFixed(2) + ' kWh';
    document.getElementById('yearly-kwh').textContent = yearlyKwh.toFixed(2) + ' kWh';
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
