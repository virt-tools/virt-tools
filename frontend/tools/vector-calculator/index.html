<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Vector Calculator</h1>
<p class="subtitle">Calculate dot product, cross product, magnitude, and angle between 2D/3D vectors.</p>
<div class="input-section">
<label>Dimension</label>
<select id="dim" aria-label="Dim">
<option value="2" selected>2D</option>
<option value="3">3D</option>
</select>
<h3>Vector A</h3>
<div id="vecA"></div>
<h3>Vector B</h3>
<div id="vecB"></div>
<label>Operation</label>
<select id="op" aria-label="Op">
<option value="dot" selected>Dot Product</option>
<option value="cross">Cross Product (3D only)</option>
<option value="mag">Magnitude</option>
<option value="angle">Angle Between</option>
<option value="add">Add (A+B)</option>
<option value="sub">Subtract (A−B)</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function buildVec(id,dim){
const c=document.getElementById(id);
const comps=['x','y','z'].slice(0,dim);
c.innerHTML=comps.map((l,i)=>`<input type="number" id="${id}_${l}" value="${i===0?3:i===1?4:5}" step="any" style="width:60px;display:inline" aria-label="${Id} ${L}"> ${l}`).join(' ');
}
function getVec(id,dim){
return['x','y','z'].slice(0,dim).map(l=>parseFloat(document.getElementById(id+'_'+l).value)||0);
}
document.addEventListener('DOMContentLoaded',()=>{
function rebuild(){const d=parseInt(document.getElementById('dim').value);buildVec('vecA',d);buildVec('vecB',d);}
rebuild();
document.getElementById('dim').addEventListener('change',rebuild);
document.getElementById('calc').addEventListener('click',()=>{
const d=parseInt(document.getElementById('dim').value);
const A=getVec('vecA',d),B=getVec('vecB',d);
const op=document.getElementById('op').value;
let html='';
const magA=Math.sqrt(A.reduce((s,x)=>s+x*x,0));
const magB=Math.sqrt(B.reduce((s,x)=>s+x*x,0));
if(op==='dot'){const dot=A.reduce((s,x,i)=>s+x*B[i],0);html=`<div class="result-row"><span>A · B:</span><span>${dot}</span></div><div class="result-row"><span>|A|:</span><span>${magA.toFixed(6)}</span></div><div class="result-row"><span>|B|:</span><span>${magB.toFixed(6)}</span></div>`;}
else if(op==='cross'&&d===3){const cx=A[1]*B[2]-A[2]*B[1],cy=A[2]*B[0]-A[0]*B[2],cz=A[0]*B[1]-A[1]*B[0];html=`<div class="result-row"><span>A × B:</span><span>[${cx.toFixed(4)}, ${cy.toFixed(4)}, ${cz.toFixed(4)}]</span></div><div class="result-row"><span>Magnitude:</span><span>${Math.sqrt(cx*cx+cy*cy+cz*cz).toFixed(6)}</span></div>`;}
else if(op==='mag'){html=`<div class="result-row"><span>|A|:</span><span>${magA.toFixed(6)}</span></div><div class="result-row"><span>|B|:</span><span>${magB.toFixed(6)}</span></div>`;}
else if(op==='angle'){const dot=A.reduce((s,x,i)=>s+x*B[i],0);const cos=Math.max(-1,Math.min(1,dot/(magA*magB)));html=`<div class="result-row"><span>cos θ:</span><span>${cos.toFixed(8)}</span></div><div class="result-row"><span>Angle:</span><span>${(Math.acos(cos)*180/Math.PI).toFixed(4)}°</span></div>`;}
else if(op==='add'||op==='sub'){const R=A.map((x,i)=>op==='add'?x+B[i]:x-B[i]);html=`<div class="result-row"><span>Result:</span><span>[${R.join(', ')}]</span></div><div class="result-row"><span>Magnitude:</span><span>${Math.sqrt(R.reduce((s,x)=>s+x*x,0)).toFixed(6)}</span></div>`;}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
