<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Image Encoder — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Base64 Image Encoder/Decoder</h1>
<p class="subtitle">Convert images to Base64 data URIs and decode Base64 back to images. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
<button id="encode" class="primary-btn" type="button">Encode to Base64</button>
</div>
<div class="output-section">
<label>Base64 Data URI: <textarea id="result" rows="4" readonly placeholder="Base64 output..."></textarea></label>
<img id="preview" style="max-width:300px;margin-top:10px;display:none">
</div>
<div class="input-section" style="margin-top:20px">
<label>Or paste Base64: <textarea id="b64input" rows="3" placeholder="data:image/png;base64,..."></textarea></label>
<button id="decode" class="btn" type="button">Decode to Image</button>
<img id="decodedPreview" style="max-width:300px;margin-top:10px;display:none">
</div>
<script>
document.getElementById('encode').addEventListener('click',()=>{
const f=document.getElementById('file').files[0];
if(!f)return;const r=new FileReader();r.onload=()=>{
document.getElementById('result').value=r.result;
const p=document.getElementById('preview');p.src=r.result;p.style.display='block';
};r.readAsDataURL(f);
});
document.getElementById('decode').addEventListener('click',()=>{
const b=document.getElementById('b64input').value.trim();
if(!b)return;const p=document.getElementById('decodedPreview');p.src=b;p.style.display='block';p.onerror=()=>alert('Invalid Base64 image data');
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
