<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Torn Paper Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input,.ctrl-row textarea{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📄 CSS Torn Paper Generator</h1>
<p>Create CSS torn/ripped paper edge effect using clip-path or SVG. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Paper Color</label><input type="color" id="pc" value="#f5f0e1" aria-label="Pc"></div>
<div class="ctrl-row"><label>Width</label><input type="range" id="w" min="200" max="400" step="10" value="300" style="width:200px" aria-label="W"></div>
<div class="ctrl-row"><label>Tear Edge</label><select id="edge" aria-label="Edge"><option value="top">Top</option><option value="bottom">Bottom</option><option value="both">Both</option></select></div>
<div class="ctrl-row"><label>Tear Severity</label><input type="range" id="sev" min="5" max="20" step="1" value="10" style="width:200px" aria-label="Sev"></div>
<div class="ctrl-row"><label>Content</label><textarea id="content" style="width:300px;height:60px" aria-label="Content">Ripped paper effect!</textarea></div>
<div class="ctrl-row"><label>Rotation</label><input type="range" id="rot" min="-5" max="5" step="1" value="2" style="width:200px" aria-label="Rot"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var pc=document.getElementById('pc').value;
var w=document.getElementById('w').value;
var edge=document.getElementById('edge').value;
var sev=parseInt(document.getElementById('sev').value);
var content=document.getElementById('content').value;
var rot=parseInt(document.getElementById('rot').value);
var pts=[];
for(var i=0;i<=100;i+=10){
var y=(i%20===0)?sev:0;
pts.push(i+'% '+y+'px');
}
var clipTop='polygon(0 0, '+pts.map(function(p){return p.replace(' ',' ')}).join(', ')+', 100% 0, 100% 100%, 0 100%)';
var html='<div class="torn-paper">\n  <p>'+content.replace(/\n/g,'<br>')+'</p>\n</div>';
var css='.torn-paper{width:'+w+'px;background:'+pc+';padding:30px 25px;box-shadow:2px 4px 12px rgba(0,0,0,0.2);transform:rotate('+rot+'deg);font-family:cursive;font-size:18px;color:#333;line-height:1.5;position:relative}\n';
if(edge==='top'||edge==='both')css+='.torn-paper{clip-path:polygon('+genClip(sev,'top')+');padding-top:'+(sev+20)+'px}\n';
if(edge==='bottom'||edge==='both')css+='.torn-paper{clip-path:polygon('+genClip(sev,edge==='both'?'both':'bottom')+');padding-bottom:'+(sev+20)+'px}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function genClip(sev,edge){
var top=[],bot=[];
for(var i=0;i<=100;i+=10){
var off=(i%20===0)?sev:0;
top.push(i+'% '+(edge==='bottom'||edge==='both'?0:off)+'px');
bot.push(i+'% '+(edge==='top'||edge==='both'?(100):100)+'%');
}
if(edge==='top')return top.join(', ')+', 100% '+sev+'px, 100% 100%, 0 100%';
if(edge==='bottom')return '0 0, 100% 0, '+bot.map(function(b){return b.replace(' ',(100-sev)+'px ')}).join(', ')+', 0 '+(100-sev)+'px';
return top.join(', ')+', 100% '+sev+'px, 100% '+(100-sev)+'px, '+bot.join(', ')+', 0 '+(100-sev)+'px';
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['pc','w','edge','sev','content','rot'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
