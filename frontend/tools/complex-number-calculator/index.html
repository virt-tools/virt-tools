<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complex Number Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Complex Number Calculator</h1>
<p class="subtitle">Add, subtract, multiply, divide, and convert complex numbers (rectangular ↔ polar).</p>
<div class="input-section">
<h3>First Number: a + bi</h3>
<label>Real (a)</label>
<input type="number" id="a1" value="3" step="any" aria-label="A1">
<label>Imaginary (b)</label>
<input type="number" id="b1" value="4" step="any" aria-label="B1">
<label>Operation</label>
<select id="op" aria-label="Op">
<option value="+" selected>Add (+)</option>
<option value="-">Subtract (−)</option>
<option value="*">Multiply (×)</option>
<option value="/">Divide (÷)</option>
<option value="polar">To Polar</option>
</select>
<div id="secondNum">
<h3>Second Number: c + di</h3>
<label>Real (c)</label>
<input type="number" id="a2" value="1" step="any" aria-label="A2">
<label>Imaginary (d)</label>
<input type="number" id="b2" value="2" step="any" aria-label="B2">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const op=document.getElementById('op');
op.addEventListener('change',()=>{document.getElementById('secondNum').style.display=op.value==='polar'?'none':'';});
document.getElementById('calc').addEventListener('click',()=>{
const a=parseFloat(document.getElementById('a1').value)||0;
const b=parseFloat(document.getElementById('b1').value)||0;
const o=op.value;
let rR,rI,html;
if(o==='polar'){
const mag=Math.sqrt(a*a+b*b);
const ang=Math.atan2(b,a)*180/Math.PI;
html=`<div class="result-row"><span>Rectangular:</span><span>${a} + ${b}i</span></div><div class="result-row"><span>Polar:</span><span>${mag.toFixed(6)} ∠ ${ang.toFixed(6)}°</span></div><div class="result-row"><span>Magnitude:</span><span>${mag.toFixed(6)}</span></div><div class="result-row"><span>Phase:</span><span>${ang.toFixed(6)}°</span></div>`;
}else{
const c=parseFloat(document.getElementById('a2').value)||0;
const d=parseFloat(document.getElementById('b2').value)||0;
if(o==='+'){rR=a+c;rI=b+d;}
else if(o==='-'){rR=a-c;rI=b-d;}
else if(o==='*'){rR=a*c-b*d;rI=a*d+b*c;}
else{const denom=c*c+d*d;rR=(a*c+b*d)/denom;rI=(b*c-a*d)/denom;}
html=`<div class="result-row"><span>Result:</span><span>${rR.toFixed(6)} ${rI>=0?'+':'−'} ${Math.abs(rI).toFixed(6)}i</span></div>
<div class="result-row"><span>Magnitude:</span><span>${Math.sqrt(rR*rR+rI*rI).toFixed(6)}</span></div>
<div class="result-row"><span>Phase:</span><span>${Math.atan2(rI,rR)*180/Math.PI.toFixed(6)}°</span></div>`;
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
