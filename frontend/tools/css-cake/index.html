<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Cake Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎂 CSS Cake Generator</h1>
<p>Create CSS birthday cake with layers, frosting, candles, and flames. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Layers</label><input type="range" id="layers" min="1" max="4" step="1" value="2" style="width:200px" aria-label="Layers"></div>
<div class="ctrl-row"><label>Cake Color</label><input type="color" id="cakeColor" value="#e8c8a0" style="width:60px;height:36px" aria-label="Cake Color"></div>
<div class="ctrl-row"><label>Frosting Color</label><input type="color" id="frostColor" value="#ff80c0" style="width:60px;height:36px" aria-label="Frost Color"></div>
<div class="ctrl-row"><label>Candles</label><input type="range" id="candles" min="0" max="8" step="1" value="3" style="width:200px" aria-label="Candles"></div>
<div class="ctrl-row"><label>Flame Anim</label><select id="flame" aria-label="Flame"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var layers=parseInt(document.getElementById('layers').value);
var cakeColor=document.getElementById('cakeColor').value;
var frostColor=document.getElementById('frostColor').value;
var candles=parseInt(document.getElementById('candles').value);
var flame=document.getElementById('flame').value;
var html='<div class="cake">\n';
if(candles>0){
  html+='  <div class="candles">\n';
  for(var i=0;i<candles;i++)html+='    <div class="candle"><div class="wick"></div><div class="flame"></div></div>\n';
  html+='  </div>\n';
}
for(var l=0;l<layers;l++){
  html+='  <div class="layer'+(l+1)+'"></div>\n';
  if(l<layers-1)html+='  <div class="frosting f'+(l+1)+'"></div>\n';
}
html+='  <div class="plate"></div>\n</div>';
var css='.cake{display:flex;flex-direction:column;align-items:center}\n';
var widths=[200,170,140];
for(var l=0;l<layers;l++){
  var w=widths[Math.min(l,2)]||120;
  css+='.layer'+(l+1)+'{width:'+w+'px;height:45px;background:'+cakeColor+';border-radius:4px;box-shadow:inset 0 -6px 10px rgba(0,0,0,0.1)}\n';
  if(l<layers-1){
    css+='.frosting.f'+(l+1)+'{width:'+(w+8)+'px;height:12px;background:'+frostColor+';border-radius:6px;clip-path:polygon(0 0,100% 0,95% 100%,90% 0,85% 100%,80% 0,75% 100%,70% 0,65% 100%,60% 0,55% 100%,50% 0,45% 100%,40% 0,35% 100%,30% 0,25% 100%,20% 0,15% 100%,10% 0,5% 100%)}\n';
  }
}
css+='.plate{width:240px;height:16px;background:#888;border-radius:50%/40%;margin-top:-4px}\n';
if(candles>0){
  css+='.candles{display:flex;gap:14px;margin-bottom:-2px;z-index:2}\n';
  css+='.candle{position:relative;width:10px;height:40px;background:#fff;border-radius:2px;background:linear-gradient(90deg,#fff 40%,#eee 40%,#eee 60%,#fff 60%)}\n';
  css+='.wick{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:2px;height:8px;background:#222}\n';
  css+='.flame{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:10px;height:16px;background:radial-gradient(ellipse at center bottom,#fff860 0%,#ff8800 60%,#ff4400 100%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}\n';
  if(flame==='yes'){
    css+='@keyframes flicker{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(0.9,1.1);opacity:0.85}}\n';
    css+='.flame{animation:flicker .6s ease-in-out infinite}\n';
  }
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['layers','cakeColor','frostColor','candles','flame'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
