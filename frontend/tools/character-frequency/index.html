<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Frequency Analyzer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Character Frequency Analyzer</h1>
<p class="subtitle">Count and visualize the frequency of each character in your text. Sort by count, alphabetical, or first appearance. Export as CSV.</p>
<textarea id="input" rows="8" style="width:100%;font-family:monospace;" placeholder="Paste text here..." aria-label="Paste Text Here...">The quick brown fox jumps over the lazy dog.</textarea>
<div class="controls" style="display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0;">
<label>Sort <select id="sort"><option value="count">By count (desc)</option><option value="alpha">Alphabetical</option><option value="appearance">First appearance</option></select></label>
<label><input type="checkbox" id="caseSensitive"> Case sensitive</label>
<label><input type="checkbox" id="includeSpaces" checked> Include spaces</label>
<label><input type="checkbox" id="includePunct" checked> Include punctuation</label>
</div>
<div id="stats" style="margin-bottom:1rem;"></div>
<div id="bars" style="margin-bottom:1rem;"></div>
<button class="btn" id="export" type="button">Export CSV</button>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input = document.getElementById('input');
const sortEl = document.getElementById('sort');
const caseEl = document.getElementById('caseSensitive');
const spacesEl = document.getElementById('includeSpaces');
const punctEl = document.getElementById('includePunct');
const statsEl = document.getElementById('stats');
const barsEl = document.getElementById('bars');
function analyze() {
  let text = input.value;
  if (!caseEl.checked) text = text.toLowerCase();
  const chars = [...text];
  const total = chars.length;
  const freq = {};
  const order = [];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (!spacesEl.checked && /\s/.test(ch)) continue;
    if (!punctEl.checked && /[^\w\s]|_/.test(ch) && !/\d/.test(ch) && !/[a-zA-Z]/.test(ch)) continue;
    if (!freq[ch]) { freq[ch] = 0; order.push(ch); }
    freq[ch]++;
  }
  let entries = Object.entries(freq);
  const sort = sortEl.value;
  if (sort === 'count') entries.sort((a,b) => b[1] - a[1]);
  else if (sort === 'alpha') entries.sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  else entries.sort((a,b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  const unique = entries.length;
  statsEl.innerHTML = '<strong>' + total + '</strong> total chars, <strong>' + unique + '</strong> unique chars' + (total > 0 ? ', entropy: <strong>' + entropy(entries, total).toFixed(2) + '</strong> bits' : '');
  let html = '<table style="width:100%;border-collapse:collapse;font-family:monospace;"><tbody>';
  const maxCount = entries.length ? entries[0][1] : 1;
  for (const [ch, count] of entries) {
    const pct = total > 0 ? (count / total * 100).toFixed(2) : '0.00';
    const barWidth = (count / maxCount * 100).toFixed(0);
    const display = ch === ' ' ? '␣' : ch === '\n' ? '↵' : ch === '\t' ? '⇥' : ch;
    html += '<tr><td style="width:40px;text-align:center;border-bottom:1px solid #eee;padding:4px;font-size:1.1em;">' + escapeHtml(display) + '</td><td style="width:60px;text-align:right;border-bottom:1px solid #eee;padding:4px;">' + count + '</td><td style="width:60px;text-align:right;border-bottom:1px solid #eee;padding:4px;color:#666;">' + pct + '%</td><td style="border-bottom:1px solid #eee;padding:4px;"><div style="background:linear-gradient(90deg,#00d4ff,#0096c7);height:18px;border-radius:4px;width:' + barWidth + '%;min-width:2px;"></div></td></tr>';
  }
  html += '</tbody></table>';
  barsEl.innerHTML = html;
}
function entropy(entries, total) {
  let e = 0;
  for (const [, count] of entries) {
    const p = count / total;
    if (p > 0) e -= p * Math.log2(p);
  }
  return e;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('export').onclick = () => {
  let csv = 'char,count,percent\n';
  let text = input.value;
  if (!caseEl.checked) text = text.toLowerCase();
  const chars = [...text];
  const freq = {};
  for (const ch of chars) {
    if (!spacesEl.checked && /\s/.test(ch)) continue;
    if (!punctEl.checked && /[^\w\s]|_/.test(ch) && !/\d/.test(ch) && !/[a-zA-Z]/.test(ch)) continue;
    freq[ch] = (freq[ch] || 0) + 1;
  }
  const entries = Object.entries(freq).sort((a,b) => b[1] - a[1]);
  for (const [ch, count] of entries) {
    const pct = (count / chars.length * 100).toFixed(2);
    csv += '"' + ch.replace(/"/g,'""') + '",' + count + ',' + pct + '\n';
  }
  const blob = new Blob([csv], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'character_frequency.csv';
  a.click();
};
input.addEventListener('input', analyze);
sortEl.addEventListener('change', analyze);
caseEl.addEventListener('change', analyze);
spacesEl.addEventListener('change', analyze);
punctEl.addEventListener('change', analyze);
analyze();
})();
</script>
<style>
.btn{padding:.5rem 1rem;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-weight:600;}
.btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
.controls label{display:inline-flex;align-items:center;gap:.25rem;font-size:.9rem;}
</style>
</body>
</html>
