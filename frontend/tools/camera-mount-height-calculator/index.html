<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Camera Mount Height Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Camera Mount Height Calculator</h1>
<p>Calculate recommended camera mount height and tilt angle for optimal facial recognition coverage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Distance to subject</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-t">Subject height</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.7"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),T=pn(tEl.value);
if(D==null||T==null)return;
if(!isFinite(D)||D<=0||!isFinite(T)||T<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var mountH=T+D*0.15;
var tilt=Math.atan2(mountH-T,D)*180/Math.PI;
var html='<div class="big">'+rnd(mountH,1)+' m</div>';
html+=row("Recommended mount height",rnd(mountH,2)+" m");
html+=row("Tilt angle down",rnd(tilt,1)+" deg");
html+=row("Subject height",T+" m");
html+=row("Distance to subject",D+" m");
out.innerHTML=html;
}
[dEl,tEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
