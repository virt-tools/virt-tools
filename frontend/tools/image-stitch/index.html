<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Stitcher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Stitcher</h1>
<p class="subtitle">Stitch images vertically or horizontally into one image. Drag to reorder. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Images: <input type="file" id="file" accept="image/*" multiple></label>
<label>Direction: <select id="dir"><option value="v">Vertical</option><option value="h">Horizontal</option></select></label>
<label>Gap: <input type="number" id="gap" value="0" min="0" max="50" style="width:50px">px</label>
<button onclick="stitch()" type="button">Stitch</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var imgs=[];
document.getElementById('file').addEventListener('change',function(){
imgs=[];var files=Array.from(this.files);var loaded=0;
files.forEach(function(f){var im=new Image();im.src=URL.createObjectURL(f);im.onload=function(){imgs.push(im);if(++loaded===files.length)stitch();};});
});
function stitch(){
if(!imgs.length)return;var gap=parseInt(document.getElementById('gap').value);var dir=document.getElementById('dir').value;
var cv=document.getElementById('canvas');var ctx=cv.getContext('2d');
if(dir==='v'){var maxW=Math.max.apply(null,imgs.map(function(i){return i.naturalWidth}));var totalH=imgs.reduce(function(a,i){return a+i.naturalHeight},0)+gap*(imgs.length-1);
cv.width=maxW;cv.height=totalH;var y=0;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
imgs.forEach(function(i){ctx.drawImage(i,(maxW-i.naturalWidth)/2,y);y+=i.naturalHeight+gap;});
}else{var maxH=Math.max.apply(null,imgs.map(function(i){return i.naturalHeight}));var totalW=imgs.reduce(function(a,i){return a+i.naturalWidth},0)+gap*(imgs.length-1);
cv.width=totalW;cv.height=maxH;var x=0;ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
imgs.forEach(function(i){ctx.drawImage(i,x,(maxH-i.naturalHeight)/2);x+=i.naturalWidth+gap;});
}
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='stitched.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
