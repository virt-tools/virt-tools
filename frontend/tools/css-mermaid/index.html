<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mermaid Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(180deg,#0a1a3a,#1a4a6a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🧜 CSS Mermaid Generator</h1>
<p>Create CSS mermaid with upper body, flowing hair, and scaled tail. 3 tail colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#ffcc80" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Hair Color</label><input type="color" id="hairColor" value="#ab47bc" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Tail Color</label><select id="tailColor"><option value="#26a69a">Teal</option><option value="#42a5f5">Blue</option><option value="#ec407a">Pink</option><option value="#66bb6a">Green</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="180" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var bc=document.getElementById('bodyColor').value;
var hc=document.getElementById('hairColor').value;
var tc=document.getElementById('tailColor').value;
var sz=parseInt(document.getElementById('size').value);
var bw=sz*0.25,bh=sz*0.2,tl=sz*0.5;
var html='<div class="mermaid">\n  <div class="hair"></div>\n  <div class="head"><div class="eye"></div></div>\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="tail">\n    <div class="scale s1"></div><div class="scale s2"></div><div class="scale s3"></div>\n    <div class="fin"></div>\n  </div>\n</div>';
var css='.mermaid{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.head{width:'+(sz*0.15)+'px;height:'+(sz*0.15)+'px;background:'+bc+';border-radius:50%;position:relative;z-index:3}\n';
css+='.eye{position:absolute;top:35%;right:25%;width:'+(sz*0.02)+'px;height:'+(sz*0.02)+'px;background:#333;border-radius:50%}\n';
css+='.hair{position:absolute;top:-'+(sz*0.03)+'px;width:'+(sz*0.2)+'px;height:'+(sz*0.12)+'px;background:'+hc+';border-radius:50% 50% 30% 30%;z-index:4}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:'+bc+';border-radius:50% 50% 40% 40%;position:relative;z-index:2}\n';
css+='.arm{position:absolute;width:'+(bw*0.3)+'px;height:'+(bh*0.6)+'px;background:'+bc+';border-radius:50%;z-index:1;top:'+(bh*0.1)+'px}\n';
css+='.a-left{left:-'+(bw*0.2)+'px;transform:rotate(-30deg)}.a-right{right:-'+(bw*0.2)+'px;transform:rotate(30deg)}\n';
css+='.tail{width:'+(tl*0.4)+'px;height:'+tl+'px;position:relative;z-index:1}\n';
css+='.tail::before{content:"";position:absolute;top:0;left:0;right:0;bottom:'+(tl*0.2)+'px;background:linear-gradient(180deg,'+tc+','+tc+' 60%,rgba(255,255,255,0.3) 61%,'+tc+' 62%);border-radius:50% 50% 10% 10%;clip-path:polygon(20% 0,80% 0,100% 30%,90% 100%,50% 85%,10% 100%,0 30%)}\n';
css+='.scale{position:absolute;width:'+(tl*0.08)+'px;height:'+(tl*0.08)+'px;background:rgba(255,255,255,0.25);border-radius:50%;top:'+(tl*0.05)+'px}\n';
css+='.s1{left:30%}.s2{left:45%;top:'+(tl*0.15)+'px}.s3{left:60%}\n';
css+='.fin{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(tl*0.35)+'px;height:'+(tl*0.25)+'px;background:'+tc+';clip-path:polygon(0 0,50% 100%,100% 0);opacity:0.7}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['bodyColor','hairColor','tailColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
