<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Columnar Transposition Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ct{max-width:600px;margin:0 auto;padding:2rem 1rem}
.ct h1{font-size:2rem;margin-bottom:.5rem}
.ct .sub{color:#888;margin-bottom:1.5rem}
.ct textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.ct input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.ct .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.ct .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.ct .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.ct label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
.ct .row{display:flex;gap:8px;margin-top:1rem}
.ct .mode{padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:14px}
.ct .mode.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="ct">
<h1>🔤 Columnar Transposition Cipher</h1>
<p class="sub">Encrypt and decrypt using columnar transposition — text written in rows, read off by columns in key order.</p>
<div class="row">
<button class="mode active" id="enc" onclick="setMode('enc')" type="button">Encrypt</button>
<button class="mode" id="dec" onclick="setMode('dec')" type="button">Decrypt</button>
</div>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">HELLO WORLD</textarea>
<label for="key">Key (word):</label>
<input type="text" id="key" value="ZEBRA" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let mode='enc';
function setMode(m){mode=m;document.getElementById('enc').classList.toggle('active',m==='enc');document.getElementById('dec').classList.toggle('active',m==='dec');convert();}
function getKeyOrder(key){
  const arr=[...key.toUpperCase().split('')].map((c,i)=>({c,i}));
  arr.sort((a,b)=>a.c<b.c?-1:a.c>b.c?1:a.i-b.i);
  return arr.map(a=>a.i);
}
function encrypt(text,key){
  const order=getKeyOrder(key);
  const cols=key.length;
  const rows=Math.ceil(text.length/cols);
  const padded=text.padEnd(rows*cols,'X');
  let grid=[];
  for(let r=0;r<rows;r++)grid.push(padded.slice(r*cols,(r+1)*cols).split(''));
  let result='';
  for(const col of order){
    for(let r=0;r<rows;r++)result+=grid[r][col];
  }
  return result;
}
function decrypt(text,key){
  const order=getKeyOrder(key);
  const cols=key.length;
  const rows=Math.ceil(text.length/cols);
  const colLen=Math.ceil(text.length/cols);
  let idx=0;
  let grid=Array.from({length:rows},()=>Array(cols).fill(''));
  for(const col of order){
    for(let r=0;r<rows&&idx<text.length;r++){grid[r][col]=text[idx++];}
  }
  let result='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)result+=grid[r][c];
  return result.replace(/X+$/,'');
}
function convert(){
  const text=document.getElementById('input').value.toUpperCase().replace(/[^A-Z]/g,'');
  const key=document.getElementById('key').value;
  if(!key){document.getElementById('output').textContent='Enter a key';return;}
  const out=mode==='enc'?encrypt(text,key):decrypt(text,key);
  document.getElementById('output').textContent=out;
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
