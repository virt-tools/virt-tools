<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Frequency Regulation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Frequency Regulation Calculator</h1>
<p>Calculate frequency regulation capacity, response time, and energy requirement from system frequency deviation and droop. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dev">Frequency deviation</label><input type="text" id="in-dev" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">Hz</div></div>
<div class="field"><label class="f" for="in-droop">Droop setting</label><input type="text" id="in-droop" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-cap">System capacity</label><input type="text" id="in-cap" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">MW</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dev"),drE=document.getElementById("in-droop"),cE=document.getElementById("in-cap"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var dev=parseFloat(dE.value),dr=parseFloat(drE.value),cap=parseFloat(cE.value);
if(isNaN(dev)||isNaN(dr)||isNaN(cap))return;
if(cap<=0||dr<=0){err.textContent="Capacity and droop must be positive numbers.";return}
err.textContent="";
var regCap=cap*dev/(50*dr/100);
var responseTime=10/dr;
var energy=regCap*0.25;
var html='<div class="big">'+(Math.round(regCap))+' MW</div>';
html+=row("Regulation capacity",Math.round(regCap)+' MW');
html+=row("Est. response time (heuristic)",Math.round(responseTime*100)/100+' s');
html+=row("Energy for 15 min",Math.round(energy)+' MWh');
out.innerHTML=html;
}
[dE,drE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
