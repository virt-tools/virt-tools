<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Ninja Character Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#1a2a1a,#0a1a0a);border-radius:12px;overflow:hidden;position:relative;min-height:360px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🥷 CSS Ninja Character Generator</h1>
<p>Create CSS ninja character with mask, headband, body, and sword. 4 suit colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Suit Color</label><select id="suitColor"><option value="#212121">Black</option><option value="#1a237e">Navy</option><option value="#b71c1c">Red</option><option value="#1b5e20">Green</option></select></div>
<div class="ctrl-row"><label>Headband Color</label><input type="color" id="headbandColor" value="#d32f2f" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Sword</label><select id="sword"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Eye Glow</label><select id="eyeGlow"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="180" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var sc=document.getElementById('suitColor').value;
var hc=document.getElementById('headbandColor').value;
var sw=document.getElementById('sword').value;
var eg=document.getElementById('eyeGlow').value;
var sz=parseInt(document.getElementById('size').value);
var hd=sz*0.15,bw=sz*0.25,bh=sz*0.25;
var html='<div class="ninja">\n  <div class="head">\n    <div class="mask"></div>\n    <div class="headband"></div>\n    <div class="eye"></div>\n  </div>\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="leg l-left"></div>\n  <div class="leg l-right"></div>\n'+(sw==='on'?'  <div class="sword"><div class="blade"></div><div class="hilt"></div></div>\n':'')+'</div>';
var css='.ninja{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.head{width:'+hd+'px;height:'+(hd*1.1)+'px;background:'+sc+';border-radius:40% 40% 30% 30%;position:relative;z-index:3}\n';
css+='.mask{position:absolute;top:0;left:0;width:100%;height:75%;background:'+sc+';border-radius:40% 40% 10% 10%}\n';
css+='.headband{position:absolute;top:'+(hd*0.25)+'px;left:-'+(hd*0.15)+'px;width:'+(hd*1.3)+'px;height:'+(hd*0.15)+'px;background:'+hc+';z-index:4}\n';
css+='.headband::before,.headband::after{content:"";position:absolute;top:-'+(hd*0.05)+'px;width:'+(hd*0.1)+'px;height:'+(hd*0.3)+'px;background:'+hc+';border-radius:0 0 50% 50%}\n';
css+='.headband::before{left:0;transform:rotate(-20deg)}.headband::after{right:0;transform:rotate(20deg)}\n';
css+='.eye{position:absolute;top:'+(hd*0.35)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.4)+'px;height:'+(hd*0.08)+'px;background:#fff;border-radius:2px;z-index:5}\n';
if(eg==='on'){css+='.eye{background:#00e5ff;box-shadow:0 0 8px #00e5ff}\n'}
css+='.body{width:'+bw+'px;height:'+bh+'px;background:'+sc+';border-radius:15% 15% 10% 10%;z-index:2;margin-top:-2px}\n';
css+='.arm{position:absolute;width:'+(bw*0.2)+'px;height:'+(bh*0.8)+'px;background:'+sc+';border-radius:50%;z-index:1;top:'+(sz*0.18)+'px}\n';
css+='.a-left{left:-'+(bw*0.1)+'px;transform:rotate(-20deg)}.a-right{right:-'+(bw*0.1)+'px;transform:rotate(20deg)}\n';
css+='.leg{position:absolute;width:'+(bw*0.2)+'px;height:'+(bh*0.5)+'px;background:'+sc+';border-radius:0 0 50% 50%;z-index:0;bottom:-'+(bh*0.4)+'px}\n';
css+='.l-left{left:'+(bw*0.15)+'px}.l-right{right:'+(bw*0.15)+'px}\n';
if(sw==='on'){
css+='.sword{position:absolute;right:-'+(sz*0.15)+'px;top:'+(sz*0.05)+'px;transform:rotate(25deg);z-index:6}\n';
css+='.blade{width:'+(sz*0.03)+'px;height:'+(sz*0.25)+'px;background:linear-gradient(180deg,#e0e0e0,#9e9e9e);border-radius:2px 2px 0 0}\n';
css+='.hilt{width:'+(sz*0.08)+'px;height:'+(sz*0.03)+'px;background:#5d4037;margin-left:-'+(sz*0.025)+'px;margin-top:-2px;border-radius:2px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['suitColor','headbandColor','sword','eyeGlow','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
