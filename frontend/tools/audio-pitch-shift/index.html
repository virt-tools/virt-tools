<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Pitch Shifter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Pitch Shifter</h1>
<p class="subtitle">Shift the pitch of audio without changing speed. Export as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Semitones: <input type="range" id="pitch" min="-12" max="12" step="1" value="0"></label>
<span id="pitchVal">0</span>
<button id="process" class="primary-btn" type="button">Process & Download</button>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const fileInput=document.getElementById('file');
const pitchSlider=document.getElementById('pitch');
const pitchVal=document.getElementById('pitchVal');
const status=document.getElementById('status');
pitchSlider.addEventListener('input',()=>{pitchVal.textContent=pitchSlider.value;});
document.getElementById('process').addEventListener('click',async()=>{
const file=fileInput.files[0];
if(!file){alert('Select a file first.');return;}
const semitones=parseInt(pitchSlider.value);
status.textContent='Processing...';
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const rate=Math.pow(2,semitones/12);
const newLen=Math.round(buf.length/rate);
const newBuf=audioCtx.createBuffer(buf.numberOfChannels,newLen,buf.sampleRate);
for(let ch=0;ch<buf.numberOfChannels;ch++){
const src=buf.getChannelData(ch);
const dst=newBuf.getChannelData(ch);
for(let i=0;i<newLen;i++){
const srcPos=i*rate;
const i0=Math.floor(srcPos);
const frac=srcPos-i0;
if(i0+1<src.length){
dst[i]=src[i0]*(1-frac)+src[i0+1]*frac;
}else{
dst[i]=src[i0]||0;
}
}
}
const wav=bufferToWav(newBuf);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='pitch-shifted.wav';
a.click();
status.textContent='Done! Download started.';
audioCtx.close();
});
function bufferToWav(buf){
const numCh=buf.numberOfChannels;
const len=buf.length*numCh*2+44;
const ab=new ArrayBuffer(len);
const v=new DataView(ab);
const w=44100;
let off=0;
function ws(s){for(let i=0;i<s.length;i++)v.setUint8(off++,s.charCodeAt(i));}
ws('RIFF');v.setUint32(off,36+len-44,true);off+=4;
ws('WAVE');ws('fmt ');v.setUint32(off,16,true);off+=4;
v.setUint16(off,1,true);off+=2;v.setUint16(off,numCh,true);off+=2;
v.setUint32(off,buf.sampleRate,true);off+=4;
v.setUint32(off,buf.sampleRate*numCh*2,true);off+=4;
v.setUint16(off,numCh*2,true);off+=2;v.setUint16(off,16,true);off+=2;
ws('data');v.setUint32(off,len-44,true);off+=4;
for(let i=0;i<buf.length;i++){
for(let ch=0;ch<numCh;ch++){
let s=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));
v.setInt16(off,s*0x7FFF,true);off+=2;
}
}
return ab;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
