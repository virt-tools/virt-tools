<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOR Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.xor{max-width:600px;margin:0 auto;padding:2rem 1rem}
.xor h1{font-size:2rem;margin-bottom:.5rem}
.xor .sub{color:#888;margin-bottom:1.5rem}
.xor textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.xor input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.xor .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.xor .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.xor .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.xor label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
.xor select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;margin-top:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="xor">
<h1>🔑 XOR Cipher</h1>
<p class="sub">Encrypt and decrypt text using XOR with a key. Self-inverse — same operation encrypts and decrypts.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">Hello, World!</textarea>
<label for="key">Key:</label>
<input type="text" id="key" value="secret" oninput="convert()">
<label for="format">Output format:</label>
<select id="format" onchange="convert()">
<option value="text">Text</option>
<option value="hex">Hex</option>
<option value="base64">Base64</option>
</select>
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function xorCipher(text,key){
  const result=[];
  for(let i=0;i<text.length;i++){
    result.push(text.charCodeAt(i)^key.charCodeAt(i%key.length));
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const key=document.getElementById('key').value;
  const fmt=document.getElementById('format').value;
  if(!key){document.getElementById('output').textContent='Enter a key';return;}
  const xored=xorCipher(text,key);
  let out;
  if(fmt==='hex')out=xored.map(b=>b.toString(16).padStart(2,'0')).join(' ');
  else if(fmt==='base64')out=btoa(String.fromCharCode(...xored));
  else out=xored.map(b=>String.fromCharCode(b)).join('');
  document.getElementById('output').textContent=out;
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
