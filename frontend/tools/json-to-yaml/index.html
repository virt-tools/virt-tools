<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to YAML Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON to YAML Converter</h1>
<p class="subtitle">Convert JSON to clean YAML with proper indentation and type formatting.</p>
<div class="input-section">
<label>JSON Input</label>
<textarea id="input" rows="8" placeholder='{"name":"Alice","tags":["a","b"]}' aria-label="{"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value){const result=document.getElementById('result'),output=document.createElement('textarea'),copy=document.createElement('button');output.rows=12;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label','YAML output');output.value=value;copy.type='button';copy.textContent='Copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));result.replaceChildren(output,copy);}
function renderError(message){const error=document.createElement('p');error.style.color='red';error.textContent='Error: '+message;document.getElementById('result').replaceChildren(error);}
function toYAML(obj,indent){
const pad=' '.repeat(indent);
if(obj===null)return pad+'null\n';
if(typeof obj==='boolean')return pad+(obj?'true':'false')+'\n';
if(typeof obj==='number')return pad+obj+'\n';
if(typeof obj==='string'){
if(obj===''||/[:#\-\[\]\{\},&\*!\|>'"%@`]/.test(obj)||/^\s|\s$/.test(obj)||/^(true|false|null|yes|no|~|\d)/.test(obj))
return pad+'"'+obj.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"\n';
return pad+obj+'\n';
}
if(Array.isArray(obj)){
if(obj.length===0)return pad+'[]\n';
let y='';
obj.forEach(v=>{y+=pad+'- '+toYAML(v,indent+2).trimStart()+'\n';});
return y;
}
if(typeof obj==='object'){
const keys=Object.keys(obj);
if(keys.length===0)return pad+'{}\n';
let y='';
for(const[k,v]of Object.entries(obj)){
const ks=/^[a-zA-Z0-9_]+$/.test(k)?k:'"'+k.replace(/"/g,'\\"')+'"';
if(v!==null&&typeof v==='object'){
y+=pad+ks+':\n'+toYAML(v,indent+2);
}else{
y+=pad+ks+': '+toYAML(v,0).trimStart()+'\n';
}
}
return y;
}
return pad+String(obj)+'\n';
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
if(!text.trim()){return;}
try{
const data=JSON.parse(text);
let yaml=toYAML(data,0);
renderOutput(yaml);
}catch(e){renderError(e.message);}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
