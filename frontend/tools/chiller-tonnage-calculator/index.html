<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Chiller Tonnage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Chiller Tonnage Calculator</h1>
<p>Calculate required chiller tonnage from heat load and fluid flow rate. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-gpm">Flow rate</label><input type="text" id="in-gpm" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">GPM</div></div>
<div class="field"><label class="f" for="in-dt">Temp difference</label><input type="text" id="in-dt" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">°F</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var gpmEl=document.getElementById("in-gpm"),dtEl=document.getElementById("in-dt"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var G=pn(gpmEl.value),DT=pn(dtEl.value);
if(G==null||DT==null)return;
if(!isFinite(G)||!isFinite(DT)||G<=0||DT<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var btuh=G*500*DT;
var tons=btuh/12000;
var html='<div class="big">'+rnd(tons,1)+' tons</div>';
html+=row("Heat load",rnd(btuh,0)+" BTU/hr");
html+=row("Chiller tonnage",rnd(tons,1)+" tons");
html+=row("Recommended chiller",rnd(tons*1.15,1)+" tons (15% safety)");
out.innerHTML=html;
}
[gpmEl,dtEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
