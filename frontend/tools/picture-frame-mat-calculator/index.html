<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Picture Frame Mat Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Picture Frame Mat Calculator</h1>
<p>Calculate mat opening size, border widths, and mat board dimensions for custom picture framing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-iw">Image width</label><input type="text" id="in-iw" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-ih">Image height</label><input type="text" id="in-ih" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-bw">Border width</label><input type="text" id="in-bw" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter image dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var iwEl=document.getElementById("in-iw"),ihEl=document.getElementById("in-ih"),bwEl=document.getElementById("in-bw"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var IW=pn(iwEl.value),IH=pn(ihEl.value),BW=pn(bwEl.value);
if(IW==null||IH==null){return}
BW=BW==null?50:BW;
if(!isFinite(IW)||!isFinite(IH)||!isFinite(BW)||IW<=0||IH<=0||BW<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var openingW=IW-4;
var openingH=IH-4;
var matW=IW+2*BW;
var matH=IH+2*BW;
var html='<div class="big">'+rnd(matW,0)+'×'+rnd(matH,0)+' mm</div>';
html+=row("Image size",rnd(IW,0)+"×"+rnd(IH,0)+" mm");
html+=row("Mat opening",rnd(openingW,0)+"×"+rnd(openingH,0)+" mm");
html+=row("Border width",rnd(BW,0)+" mm (each side)");
html+=row("Mat board size",rnd(matW,0)+"×"+rnd(matH,0)+" mm");
out.innerHTML=html;
}
[iwEl,ihEl,bwEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
