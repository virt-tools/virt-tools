<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Viewing Distance Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>TV Viewing Distance Calculator</h1>
<p class="subtitle">Find the optimal viewing distance and screen size for your TV.</p>
<div class="input-section">
<label>TV Size (inches, diagonal)</label>
<input type="number" id="tvSize" value="55" min="10" step="0.5" aria-label="Tv Size">
<label>Resolution</label>
<select id="res" aria-label="Res">
<option value="1.5">4K / 8K</option>
<option value="2.2" selected>1080p</option>
<option value="3">720p</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const S=parseFloat(document.getElementById('tvSize').value)||0;
const F=parseFloat(document.getElementById('res').value);
const minDist=S*F*0.75;
const optDist=S*F;
const maxDist=S*F*1.5;
const width=S*0.8715;
const height=S*0.4905;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>TV Size:</span><span>${S}" diagonal</span></div>
<div class="result-row"><span>Screen Width:</span><span>${width.toFixed(1)}"</span></div>
<div class="result-row"><span>Screen Height:</span><span>${height.toFixed(1)}"</span></div>
<div class="result-row"><span>Minimum Distance:</span><span>${minDist.toFixed(0)}" (${(minDist/12).toFixed(1)} ft)</span></div>
<div class="result-row"><span>Optimal Distance:</span><span>${optDist.toFixed(0)}" (${(optDist/12).toFixed(1)} ft)</span></div>
<div class="result-row"><span>Maximum Distance:</span><span>${maxDist.toFixed(0)}" (${(maxDist/12).toFixed(1)} ft)</span></div>
<div class="result-row"><span>Viewing Angle (at optimal):</span><span>${(2*Math.atan(S*0.5/(optDist))*180/Math.PI).toFixed(1)}°</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
