<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Brewing Ratio Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Coffee Brewing Ratio Calculator</h1>
<p class="subtitle">Find the perfect coffee-to-water ratio for your brew method.</p>

<div class="input-section">
  <label>Brew method</label>
  <select id="method" aria-label="Method">
    <option value="14" data-ratio="16.67">Drip / Pour-over</option>
    <option value="15" data-ratio="15">French Press</option>
    <option value="16" data-ratio="16.67">Espresso (1:2)</option>
    <option value="17" data-ratio="17">Cold Brew</option>
    <option value="18" data-ratio="18">AeroPress</option>
  </select>
  <label>Desired output (ml)</label>
  <input type="number" id="output" value="350" min="50" max="2000" step="10" aria-label="Output">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const sel = document.getElementById('method');
    const ratio = parseFloat(sel.options[sel.selectedIndex].dataset.ratio);
    const output = parseFloat(document.getElementById('output').value) || 0;
    if (output <= 0) return;
    const coffee = output / ratio;
    const water = output + coffee * 2;
    document.getElementById('bigResult').textContent = `${coffee.toFixed(1)} g coffee`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Water:</span><span>${output} ml</span></div>
      <div class="result-row"><span>Ratio:</span><span>1:${ratio}</span></div>
      <div class="result-row"><span>Coffee:</span><span>${coffee.toFixed(1)} g (${(coffee/15).toFixed(1)} tbsp)</span></div>
      <div class="result-row"><span>Grind:</span><span>${sel.options[sel.selectedIndex].textContent}</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
