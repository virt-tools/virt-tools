<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear Ratio Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Gear Ratio Calculator</h1>
<p class="subtitle">Calculate gear ratios, speed, and torque for bicycle and mechanical systems.</p>
<div class="input-section">
<label>Front Chainring (teeth)</label>
<input type="number" id="front" value="52" min="1" aria-label="Front">
<label>Rear Cog (teeth)</label>
<input type="number" id="rear" value="16" min="1" aria-label="Rear">
<label>Wheel Diameter (inches)</label>
<input type="number" id="wheel" value="27" min="1" aria-label="Wheel">
<label>Cadence (rpm)</label>
<input type="number" id="cadence" value="90" min="1" aria-label="Cadence">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
function readWhole(id){const raw=String(document.getElementById(id).value).trim();if(!/^\d+$/.test(raw)){return null;}const n=parseInt(raw,10);return n>=1?n:null;}
function readNum(id){const raw=String(document.getElementById(id).value).trim();const n=parseFloat(raw);return /^-?\d*\.?\d+$/.test(raw)&&isFinite(n)?n:null;}
const f=readWhole('front'),r=readWhole('rear');
const w=readNum('wheel'),c=readNum('cadence');
if(f===null||r===null){document.getElementById('result').textContent='Error: chainring and cog tooth counts must be whole numbers of at least 1.';document.getElementById('result').style.display='block';return;}
if(w===null||!(w>0)||c===null||!(c>=0)){document.getElementById('result').textContent='Error: wheel diameter must be a positive number and cadence must be non-negative.';document.getElementById('result').style.display='block';return;}
const ratio=f/r;
const gearInches=(f/r)*w;
const distPerRev=gearInches*Math.PI/12;
const speedMph=distPerRev*c*60/5280;
const speedKmh=speedMph*1.60934;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Gear Ratio:</span><span>${ratio.toFixed(3)}:1</span></div>
<div class="result-row"><span>Gear Inches:</span><span>${gearInches.toFixed(1)}"</span></div>
<div class="result-row"><span>Development:</span><span>${distPerRev.toFixed(2)} ft/rev</span></div>
<div class="result-row"><span>Speed at ${c} rpm:</span><span>${speedMph.toFixed(1)} mph (${speedKmh.toFixed(1)} km/h)</span></div>
<div class="result-row"><span>Front Chainring:</span><span>${f} teeth</span></div>
<div class="result-row"><span>Rear Cog:</span><span>${r} teeth</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
