<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Audio Equalizer Bars Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:2rem;background:#0a0a12;border-radius:12px;display:flex;justify-content:center;align-items:flex-end;min-height:200px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎵 CSS Audio Equalizer Bars Generator</h1>
<p>Create CSS animated audio equalizer bar visualizations. 4 styles, adjustable bar count/colors/speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="gradient" selected>Gradient</option><option value="solid">Solid</option><option value="mirror">Mirror</option><option value="rainbow">Rainbow</option></select></div>
<div class="ctrl-row"><label>Bar Count</label><input type="number" id="bars" value="20" min="5" max="50" style="width:80px"></div>
<div class="ctrl-row"><label>Bar Color</label><input type="color" id="barColor" value="#667eea" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="number" id="speed" value="1" min="0.3" max="5" step="0.1" style="width:80px"></div>
<div class="ctrl-row"><label>Max Height (px)</label><input type="number" id="maxH" value="120" min="40" max="300" style="width:80px"></div>
<div class="ctrl-row"><label>Bar Width (px)</label><input type="number" id="barW" value="8" min="2" max="30" style="width:80px"></div>
<div class="ctrl-row"><label>Gap (px)</label><input type="number" id="gap" value="4" min="0" max="20" style="width:80px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var n=parseInt(document.getElementById('bars').value);
var color=document.getElementById('barColor').value;
var speed=parseFloat(document.getElementById('speed').value);
var maxH=parseInt(document.getElementById('maxH').value);
var barW=parseInt(document.getElementById('barW').value);
var gap=parseInt(document.getElementById('gap').value);
var html='<div class="equalizer">\n';
for(var i=0;i<n;i++){
var delay=(Math.random()*speed).toFixed(2);
var dur=(speed+Math.random()*speed).toFixed(2);
var h=style==='mirror'?'':'';
var bg=style==='gradient'?'linear-gradient(to top,'+color+','+color+'88)':style==='rainbow'?'hsl('+Math.round(i/n*360)+',80%,55%)':style==='mirror'?'linear-gradient(to top,'+color+','+color+'44)':color;
html+='  <div class="eq-bar" style="animation-duration:'+dur+'s;animation-delay:'+delay+'s;width:'+barW+'px;margin-right:'+gap+'px;background:'+bg+';max-height:'+maxH+'px"></div>\n';
}
html+='</div>';
var css='.equalizer{display:flex;align-items:flex-end;height:'+maxH+'px}\n.eq-bar{height:100%;border-radius:4px 4px 0 0;animation:eq-bounce ease-in-out infinite alternate}\n@keyframes eq-bounce{0%{height:10%}100%{height:100%}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
var pv=document.getElementById('preview');
pv.innerHTML='<div class="equalizer" style="display:flex;align-items:flex-end;height:'+maxH+'px">';
var bars='';
for(var i=0;i<n;i++){
var delay=(Math.random()*speed).toFixed(2);
var dur=(speed+Math.random()*speed).toFixed(2);
var bg=style==='gradient'?'linear-gradient(to top,'+color+','+color+'88)':style==='rainbow'?'hsl('+Math.round(i/n*360)+',80%,55%)':style==='mirror'?'linear-gradient(to top,'+color+','+color+'44)':color;
bars+='<div style="height:100%;border-radius:4px 4px 0 0;animation:eq-b'+i+' '+dur+'s ease-in-out '+delay+'s infinite alternate;width:'+barW+'px;margin-right:'+gap+'px;background:'+bg+';max-height:'+maxH+'px"></div>';
}
pv.innerHTML='<style>@keyframes eq-a{0%{height:10%}100%{height:100%}}</style><div style="display:flex;align-items:flex-end;height:'+maxH+'px">'+bars.replace(/eq-b\d+/g,'eq-a')+'</div>';
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','bars','barColor','speed','maxH','barW','gap'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
