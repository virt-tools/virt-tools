<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Deduplicate — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Deduplicate</h1>
<p class="subtitle">Remove duplicate rows from CSV data. Match on specific columns or entire row. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="id,name&#10;1,Alice&#10;1,Alice&#10;2,Bob" aria-label="Paste CSV with headers"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Match on:</label><select id="matchMode" aria-label="Match Mode"><option value="all">Entire row</option><option value="cols">Specific columns</option></select>
<div id="colSelect" style="display:none;"><label>Columns:</label><div id="colList"></div></div>
<label>Keep:</label><select id="keepMode" aria-label="Keep Mode"><option value="first">First</option><option value="last">Last</option></select>
<button id="run" class="primary-btn" type="button">Deduplicate</button>
</div>
</div>
<div id="result" style="margin-top:1em;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
const input=document.getElementById('input');
const matchMode=document.getElementById('matchMode');
const colSelect=document.getElementById('colSelect');
const colList=document.getElementById('colList');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){
colList.innerHTML=rows[0].map((h,i)=>'<label><input type="checkbox" value="'+i+'" checked>'+h+'</label>').join(' ');
}
});
matchMode.addEventListener('change',()=>{colSelect.style.display=matchMode.value==='cols'?'block':'none';});
document.getElementById('run').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];
const keep=document.getElementById('keepMode').value;
const useCols=matchMode.value==='cols';
const checkedCols=useCols?[...colList.querySelectorAll('input:checked')].map(c=>parseInt(c.value)):[...Array(header.length).keys()];
const seen=new Map();
const out=[header];
for(let i=1;i<rows.length;i++){
const key=checkedCols.map(c=>rows[i][c]||'').join('\x00');
if(!seen.has(key)){seen.set(key,true);out.push(rows[i]);}
}
if(keep==='last'){
const seen2=new Map();
for(let i=1;i<rows.length;i++){
const key=checkedCols.map(c=>rows[i][c]||'').join('\x00');
seen2.set(key,i);
}
const out2=[header];
for(let i=1;i<rows.length;i++){
const key=checkedCols.map(c=>rows[i][c]||'').join('\x00');
if(seen2.get(key)===i)out2.push(rows[i]);
}
const ta=document.createElement('textarea');ta.value=toCSV(out2);ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.type='button';btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>'+(out2.length-1)+' rows (removed '+(rows.length-out2.length)+').</p>';r.appendChild(ta);r.appendChild(btn);
return;
}
const ta=document.createElement('textarea');ta.value=toCSV(out);ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.type='button';btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>'+(out.length-1)+' rows (removed '+(rows.length-out.length)+').</p>';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
