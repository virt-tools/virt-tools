<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stereo Splitter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Stereo Splitter</h1>
<p class="subtitle">Split a stereo audio file into separate left and right channel WAV files. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="process" class="primary-btn" type="button">Split & Download</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
if(buf.numberOfChannels<2){alert('File is not stereo.');audioCtx.close();return;}
const sr=buf.sampleRate;
const len=buf.length;
const left=audioCtx.createBuffer(1,len,sr);
const right=audioCtx.createBuffer(1,len,sr);
left.copyToChannel(buf.getChannelData(0),0);
right.copyToChannel(buf.getChannelData(1),0);
const lw=wav(left),rw=wav(right);
dl(lw,'left.wav');dl(rw,'right.wav');
audioCtx.close();
function wav(b){
const n=1,s=b.sampleRate,L=b.length*2;
const a=new ArrayBuffer(44+L),v=new DataView(a);
const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
w(0,'RIFF');v.setUint32(4,36+L,true);w(8,'WAVE');
w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
v.setUint16(22,1,true);v.setUint32(24,s,true);
v.setUint32(28,s*2,true);v.setUint16(32,2,true);
v.setUint16(34,16,true);w(36,'data');v.setUint32(40,L,true);
let o=44;const d=b.getChannelData(0);
for(let i=0;i<b.length;i++){
const x=Math.max(-1,Math.min(1,d[i]));
v.setInt16(o,x<0?x*32768:x*32767,true);o+=2;
}
return a;
}
function dl(buf,name){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
a.download=name;a.click();
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
