<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Transformer Calculator</h1>
<p class="subtitle">Calculate turns ratio, voltage, current, and impedance for transformers.</p>
<div class="input-section">
<label>Primary Voltage (V)</label>
<input type="number" id="vp" value="120" min="0.1" step="any" aria-label="Vp">
<label>Secondary Voltage (V)</label>
<input type="number" id="vs" value="12" min="0.1" step="any" aria-label="Vs">
<label>Primary Turns</label>
<input type="number" id="np" value="500" min="1" aria-label="Np">
<label>Primary Current (A)</label>
<input type="number" id="ip" value="2" min="0.1" step="any" aria-label="Ip">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const Vp=parseFloat(document.getElementById('vp').value)||0;
const Vs=parseFloat(document.getElementById('vs').value)||0;
const Np=parseInt(document.getElementById('np').value)||1;
const Ip=parseFloat(document.getElementById('ip').value)||0;
const ratio=Vp/Vs;
const Ns=Math.round(Np/ratio);
const Is=Ip*ratio;
const P=Vp*Ip;
const Zp=Vp/Ip;
const Zs=Vs/Is;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Turns Ratio:</span><span>${ratio.toFixed(3)}:1</span></div>
<div class="result-row"><span>Primary Turns:</span><span>${Np}</span></div>
<div class="result-row"><span>Secondary Turns:</span><span>${Ns}</span></div>
<div class="result-row"><span>Primary Voltage:</span><span>${Vp} V</span></div>
<div class="result-row"><span>Secondary Voltage:</span><span>${Vs} V</span></div>
<div class="result-row"><span>Primary Current:</span><span>${Ip} A</span></div>
<div class="result-row"><span>Secondary Current:</span><span>${Is.toFixed(3)} A</span></div>
<div class="result-row"><span>Apparent Power:</span><span>${P.toFixed(2)} VA</span></div>
<div class="result-row"><span>Primary Impedance:</span><span>${Zp.toFixed(2)} Ω</span></div>
<div class="result-row"><span>Secondary Impedance:</span><span>${Zs.toFixed(2)} Ω</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
