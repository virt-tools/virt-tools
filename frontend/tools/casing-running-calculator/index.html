<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Casing Running Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Casing Running Calculator</h1>
<p>Calculate casing running time, displacement, and annular capacity from casing depth and running speed. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Casing depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-spd">Running speed</label><input type="text" id="in-spd" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft/min</div></div>
<div class="field"><label class="f" for="in-id">Casing ID</label><input type="text" id="in-id" inputmode="decimal" autocomplete="off" placeholder="e.g. 8.5"><div class="unit">in</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-depth"),spdE=document.getElementById("in-spd"),idE=document.getElementById("in-id"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),spd=parseFloat(spdE.value),id=parseFloat(idE.value);
if(isNaN(d)||isNaN(spd)||isNaN(id))return;
var time=d/spd;
var cap=Math.PI*Math.pow(id/2/12,2)*d/5.6146;
var html='<div class="big">'+Math.round(time*10)/10+' min</div>';
html+=row("Running time",Math.round(time*10)/10+' min ('+Math.round(time/60*100)/100+' hr)');
html+=row("Internal capacity",Math.round(cap*10)/10+' bbl');
html+=row("Casing depth",d+' ft');
out.innerHTML=html;
}
[dE,spdE,idE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
