<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mandala Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:400px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌀 CSS Mandala Generator</h1>
<p>Create CSS mandala / radial symmetric geometric patterns. Adjustable symmetry, layers, colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Symmetry</label><input type="range" id="sym" min="3" max="16" step="1" value="8" style="width:200px"></div>
<div class="ctrl-row"><label>Layers</label><input type="range" id="layers" min="1" max="5" step="1" value="3" style="width:200px"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="150" max="350" step="10" value="250" style="width:200px"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="5" max="60" step="1" value="20" style="width:200px"></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="c1" value="#ff6b6b"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="c2" value="#4ecdc4"></div>
<div class="ctrl-row"><label>Color 3</label><input type="color" id="c3" value="#ffe66d"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#0a0a1a"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var sym=parseInt(document.getElementById('sym').value);
var lyr=parseInt(document.getElementById('layers').value);
var sz=parseInt(document.getElementById('size').value);
var sp=parseFloat(document.getElementById('speed').value);
var c1=document.getElementById('c1').value;var c2=document.getElementById('c2').value;var c3=document.getElementById('c3').value;
var bg=document.getElementById('bgcolor').value;
var cols=[c1,c2,c3];
var html='<div class="mandala">\n';
for(var l=0;l<lyr;l++){
var lSize=sz*(1-l*0.18);var lCol=cols[l%3];
for(var i=0;i<sym;i++){
var ang=(360/sym)*i;var delay=-(l*(sp/lyr)+i*(sp/sym));
html+='<div class="m-petal" style="width:'+lSize+'px;height:'+lSize+'px;border:2px solid '+lCol+';border-radius:50%;opacity:'+(0.8-l*0.15)+';transform:rotate('+ang+'deg);animation-delay:'+delay+'s;animation-duration:'+(sp+l*2)+'s"></div>';
}
}
html+='</div>';
var css='.mandala{position:relative;width:'+sz+'px;height:'+sz+'px;display:flex;align-items:center;justify-content:center;background:'+bg+';border-radius:50%;overflow:hidden}\n';
css+='.m-petal{position:absolute;border:2px solid;border-radius:50%;transform-origin:center;animation:mandala-spin var(--dur,'+sp+'s) linear infinite}\n';
css+='@keyframes mandala-spin{from{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(0.85)}to{transform:rotate(360deg) scale(1)}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['sym','layers','size','speed','c1','c2','c3','bgcolor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
