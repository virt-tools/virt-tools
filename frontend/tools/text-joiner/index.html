<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Joiner & Splitter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Text Joiner & Splitter</h1>
<p class="subtitle">Join lines into one or split text into lines by any delimiter.</p>
<div class="input-section">
<label>Input text</label>
<textarea id="input" rows="10" placeholder="One item per line..." aria-label="One Item Per Line..."></textarea>
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="join">Join lines into one</option>
<option value="split">Split by delimiter into lines</option>
</select>
<label>Delimiter</label>
<input type="text" id="delim" value=", " placeholder="e.g. , ; | -" aria-label="E.G. , ; |">
<button id="process" class="primary-btn" type="button">Process</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',()=>{
const input=document.getElementById('input').value;
const mode=document.getElementById('mode').value;
const delim=document.getElementById('delim').value;
let result;
if(mode==='join'){const lines=input.split('\n').filter(l=>l.length>0);result=lines.join(delim);}
else{result=input.split(delim).map(s=>s.trim()).join('\n');}
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+result.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=result;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
