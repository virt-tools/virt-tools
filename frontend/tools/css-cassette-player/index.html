<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Retro Cassette Player Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>CSS Retro Cassette Player Generator</h1>
<p class="subtitle">Create a CSS retro cassette player/tape deck with reels, label, and buttons. 4 color schemes. Adjustable size. Copy HTML+CSS.</p>
<div class="tool-layout">
<div class="controls">
<label>Scheme
<select id="scheme">
<option value="black">Classic Black</option>
<option value="red">Red Boombox</option>
<option value="blue">Blue Ocean</option>
<option value="wood">Wood Panel</option>
</select></label>
<label>Label Text <input type="text" id="labelText" value="My Mixtape" maxlength="30"></label>
<label>Size <input type="range" id="csize" min="250" max="500" value="350"></label>
<label>Show Reels Spinning <input type="checkbox" id="spinReels" checked></label>
<button id="copyBtn" class="btn" type="button">Copy HTML+CSS</button>
</div>
<div class="preview" id="preview"></div>
</div>
<div class="code-output"><h3>Generated Code</h3><textarea id="codeOutput" readonly rows="20" aria-label="Code Output"></textarea></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const preview=document.getElementById('preview'),codeOutput=document.getElementById('codeOutput');
const scheme=document.getElementById('scheme'),labelText=document.getElementById('labelText'),csize=document.getElementById('csize'),spinReels=document.getElementById('spinReels');
const schemes={black:{bg:'#222',body:'#333',label:'#f5f5f0',reels:'#555',accent:'#d4af37',btns:'#444'},red:{bg:'#8b0000',body:'#a01515',label:'#fff',reels:'#ddd',accent:'#ffd700',btns:'#660000'},blue:{bg:'#1a3a5c',body:'#2a5070',label:'#e0f0ff',reels:'#aad',accent:'#00ffff',btns:'#114455'},wood:{bg:'#5c3d10',body:'#7a5520',label:'#f4ecd8',reels:'#c4a050',accent:'#ffaa00',btns:'#3c2a08'}};
function build(){
const s=schemes[scheme.value],cs=csize.value,sp=spinReels.checked;
const reelSize=cs*0.12,wheelGap=cs*0.04;
const spinAnim=sp?'animation:spin 2s linear infinite;':'';
const reelHtml='<div style="width:'+(reelSize)+'px;height:'+(reelSize)+'px;border-radius:50%;background:'+s.reels+';border:3px solid '+s.accent+';position:relative;display:flex;align-items:center;justify-content:center;'+spinAnim+'"><div style="width:'+(reelSize*0.2)+'px;height:'+(reelSize*0.8)+'px;background:'+s.bg+';position:absolute;border-radius:2px;"></div><div style="width:'+(reelSize*0.8)+'px;height:'+(reelSize*0.2)+'px;background:'+s.bg+';position:absolute;border-radius:2px;"></div><div style="width:'+(reelSize*0.5)+'px;height:'+(reelSize*0.5)+'px;border-radius:50%;background:'+s.bg+';border:2px solid '+s.accent+';"></div></div>';
const btnHtml='<div style="display:flex;gap:'+reelSize*0.15+'px;margin-top:'+reelSize*0.3+'px;">'+['⏪','⏯','⏩','⏹'].map(b=>'<div style="width:'+(reelSize*0.6)+'px;height:'+(reelSize*0.5)+'px;background:'+s.btns+';border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:'+(reelSize*0.3)+'px;color:'+s.accent+';">'+b+'</div>').join('')+'</div>';
preview.innerHTML='<div style="width:'+cs+'px;background:'+s.body+';border-radius:12px;padding:'+(cs*0.05)+'px;box-shadow:0 8px 32px rgba(0,0,0,.4);border:2px solid '+s.accent+';">'+'<div style="background:'+s.bg+';border-radius:8px;padding:'+(cs*0.04)+'px;">'+'<div style="background:'+s.label+';border-radius:6px;padding:'+(cs*0.04)+'px;margin-bottom:'+(cs*0.04)+'px;text-align:center;font-size:'+(cs*0.06)+'px;color:#333;font-weight:bold;border:1px solid #ccc;">'+labelText.value+'</div>'+'<div style="display:flex;justify-content:center;gap:'+wheelGap+'px;margin-bottom:'+(cs*0.03)+'px;">'+reelHtml+reelHtml+'</div>'+'<div style="width:'+(cs*0.5)+'px;height:'+(cs*0.02)+'px;background:'+s.bg+';margin:0 auto '+(cs*0.03)+'px;border-radius:2px;border:1px solid '+s.accent+';"></div>'+btnHtml+'</div></div>';
const spinStyle=sp?'\n@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}':'';
codeOutput.value='<style>'+spinStyle+'\n.cassette{width:'+cs+'px;background:'+s.body+';border-radius:12px;padding:'+(cs*0.05)+'px;box-shadow:0 8px 32px rgba(0,0,0,.4);border:2px solid '+s.accent+';}\n.cassette-inner{background:'+s.bg+';border-radius:8px;padding:'+(cs*0.04)+'px;}\n.cassette-label{background:'+s.label+';border-radius:6px;padding:'+(cs*0.04)+'px;margin-bottom:'+(cs*0.04)+'px;text-align:center;font-size:'+(cs*0.06)+'px;color:#333;font-weight:bold;border:1px solid #ccc;}\n.reels{display:flex;justify-content:center;gap:'+wheelGap+'px;margin-bottom:'+(cs*0.03)+'px;}\n.reel{width:'+(reelSize)+'px;height:'+(reelSize)+'px;border-radius:50%;background:'+s.reels+';border:3px solid '+s.accent+';display:flex;align-items:center;justify-content:center;'+(sp?'animation:spin 2s linear infinite;':'')+'}\n.tape-window{width:'+(cs*0.5)+'px;height:'+(cs*0.02)+'px;background:'+s.bg+';margin:0 auto '+(cs*0.03)+'px;border-radius:2px;border:1px solid '+s.accent+';}\n.btns{display:flex;gap:'+reelSize*0.15+'px;margin-top:'+(reelSize*0.3)+'px;}\n.cassette-btn{width:'+(reelSize*0.6)+'px;height:'+(reelSize*0.5)+'px;background:'+s.btns+';border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:'+(reelSize*0.3)+'px;color:'+s.accent+';}\n</style>\n\n<div class="cassette">\n  <div class="cassette-inner">\n    <div class="cassette-label">'+labelText.value+'</div>\n    <div class="reels"><div class="reel"></div><div class="reel"></div></div>\n    <div class="tape-window"></div>\n    <div class="btns"><div class="cassette-btn">⏪</div><div class="cassette-btn">⏯</div><div class="cassette-btn">⏩</div><div class="cassette-btn">⏹</div></div>\n  </div>\n</div>';
}
[scheme,labelText,csize,spinReels].forEach(el=>el.addEventListener('input',build));
document.getElementById('copyBtn').addEventListener('click',function(){codeOutput.select();document.execCommand('copy');});
build();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:250px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.preview{flex:1;min-height:500px;display:flex;align-items:flex-start;justify-content:center;background:var(--bg-alt,#f0f0f0);border-radius:12px;padding:2rem;}
.code-output{margin-top:2rem;}
.code-output textarea{width:100%;font-family:monospace;font-size:13px;padding:1rem;border-radius:8px;border:1px solid #ddd;background:#fafafa;}
.btn{padding:.5rem 1rem;background:#d4af37;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:1rem;}
.btn:hover{background:#b8941f;}
</style>
</body>
</html>
