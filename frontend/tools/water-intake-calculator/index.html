<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Intake Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Water Intake Calculator</h1>
<p class="subtitle">Calculate your recommended daily water intake based on weight, activity, and climate.</p>

<div class="input-section">
  <label>Body weight</label>
  <div style="display:flex;gap:8px;align-items:center;">
    <input type="number" id="weight" value="70" step="0.1" min="0" style="flex:1;" aria-label="Weight">
    <select id="unit" aria-label="Unit"><option value="kg">kg</option><option value="lb">lb</option></select>
  </div>

  <label>Exercise duration (minutes/day)</label>
  <input type="number" id="exercise" value="30" step="5" min="0" aria-label="Exercise">

  <label>Climate</label>
  <select id="climate" aria-label="Climate">
    <option value="1">Cool / Temperate</option>
    <option value="1.1" selected>Mild</option>
    <option value="1.2">Hot / Humid</option>
    <option value="1.3">Very Hot</option>
  </select>

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="daily-amount"></div>
  <div class="result-row"><span>In ounces:</span><span id="oz-amount"></span></div>
  <div class="result-row"><span>In cups:</span><span id="cups-amount"></span></div>
  <div class="result-row"><span>Glasses (250ml):</span><span id="glasses"></span></div>
  <div class="result-row"><span>Base (weight):</span><span id="base-amount"></span></div>
  <div class="result-row"><span>Exercise bonus:</span><span id="exercise-amount"></span></div>
</div>

<style>
.big-result { font-size:2em; font-weight:bold; color:var(--accent); text-align:center; padding:12px; }
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    let weight = parseFloat(document.getElementById('weight').value) || 0;
    const unit = document.getElementById('unit').value;
    const exercise = parseFloat(document.getElementById('exercise').value) || 0;
    const climate = parseFloat(document.getElementById('climate').value);

    if (unit === 'lb') weight = weight * 0.453592;
    const baseMl = weight * 35;
    const exerciseMl = exercise * 12 * climate;
    const totalMl = baseMl * climate + exerciseMl;

    document.getElementById('daily-amount').textContent = (totalMl / 1000).toFixed(2) + ' L';
    document.getElementById('oz-amount').textContent = (totalMl * 0.033814).toFixed(1) + ' oz';
    document.getElementById('cups-amount').textContent = (totalMl / 240).toFixed(1) + ' cups';
    document.getElementById('glasses').textContent = Math.round(totalMl / 250) + ' glasses';
    document.getElementById('base-amount').textContent = (baseMl * climate / 1000).toFixed(2) + ' L';
    document.getElementById('exercise-amount').textContent = (exerciseMl / 1000).toFixed(2) + ' L';
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
