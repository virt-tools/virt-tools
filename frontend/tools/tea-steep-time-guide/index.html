<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tea Steep-Time Guide — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:16px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.out .note{font-size:13px;color:var(--text-dim,#9aa3b2);margin-top:10px}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tea Steep-Time Guide</h1>
<p>Look up the recommended water temperature and steep time for common teas — black, green, oolong, white, pu-erh, herbal, and more. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-tea">Tea type</label><select id="in-tea"></select></div>
<div class="field"><label class="f" for="in-unit">Temperature unit</label><select id="in-unit"><option value="c">Celsius</option><option value="f">Fahrenheit</option></select></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Pick a tea type.</span></div>
<p class="note">Reference values — adjust to taste. Everything runs locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
// [name, tempCmin, tempCmax, steepMin, steepMax, ratio(1g per X ml), notes]
var TEAS={
"black-orthodox":["Black tea (orthodox)",90,95,3,5,100,"Strong, full-bodied. Use 1 tsp per cup; resteep 2-3 times."],
"black-broken":["Black tea (CTC/broken)",95,100,3,5,100,"Strong, brisk. Common in tea bags; milk and sugar friendly."],
"green-chinese":["Green tea (Chinese)",75,85,2,3,120,"Delicate, vegetal. Lower temp avoids bitterness; resteep 2-3 times."],
"green-japanese":["Green tea (Japanese sencha)",70,80,1,2,100,"Sweet, grassy. Very short steeps; resteep 3-4 times."],
"green-japanese-gyokuro":["Gyokuro (shaded green)",50,60,2,3,30,"Rich umami. Very low temp; high leaf ratio; resteep 4-5 times."],
"oolong-light":["Oolong (light/green)",80,90,2,3,100,"Floral, fragrant. Gongfu style; resteep 4-6 times."],
"oolong-dark":["Oolong (dark/roasted)",90,95,2,4,100,"Toasty, complex. Resteep 4-6 times; longer each round."],
"white-silver-needle":["White tea (silver needle)",75,85,3,5,150,"Delicate, sweet. Long steeps tolerated; resteep 2-3 times."],
"white-pai-mu-tan":["White tea (pai mu tan)",80,90,2,4,120,"Mild, fruity. Resteep 2-3 times."],
"puerh-raw":["Pu-erh (raw / sheng)",90,95,0.25,0.5,100,"Astringent, bright. Short initial steeps (15-30s); extend each round; resteep 6-8 times."],
"puerh-ripe":["Pu-erh (ripe / shou)",95,100,0.5,1,100,"Earthy, smooth. Short steeps; resteep 6-8 times."],
"yellow-tea":["Yellow tea",75,80,2,3,120,"Mellow, sweet. Rare; treat like green tea with longer rest."],
"yellow-gold":["Yellow tea (junshan yinzhen)",80,85,3,5,100,"Rare, refined. Multiple short steeps."],
"herbal-chamomile":["Chamomile",90,100,5,7,150,"Floral, calming. Caffeine-free; long steeps are fine."],
"herbal-peppermint":["Peppermint",90,100,5,7,150,"Minty, refreshing. Caffeine-free."],
"herbal-rooibos":["Rooibos (red)",95,100,5,7,150,"Sweet, nutty. Caffeine-free; long steeps tolerated."],
"herbal-green-rooibos":["Rooibos (green)",90,95,5,7,150,"Lighter than red rooibos; caffeine-free."],
"herbal-hibiscus":["Hibiscus",90,100,5,7,150,"Tart, ruby-red. Caffeine-free; often blended."],
"herbal-lemon-balm":["Lemon balm",90,100,5,7,150,"Lemony, calming. Caffeine-free."],
"herbal-blend":["Herbal blend / tisane",95,100,5,10,150,"Varies by blend. Caffeine-free; follow package guidance."],
"yerba-mate":["Yerba mate",70,80,3,5,150,"Earthy, stimulating. Traditionally in a gourd; resteep several times."],
"matcha":["Matcha (ceremonial)",70,80,0.25,0.25,60,"Whisked; no steep — drink immediately. Use 1-2 g per 60 ml."],
"matcha-culinary":["Matcha (culinary)",75,85,0.25,0.5,80,"For lattes and baking; slightly hotter and longer is fine."],
"jasmine-pearls":["Jasmine tea",80,90,2,3,120,"Floral green or white base; resteep 2-3 times."],
"darjeeling":["Darjeeling (first flush)",80,90,2,3,120,"Muscatel, delicate. Lower temp; resteep 2-3 times."],
"earl-grey":["Earl Grey",90,95,3,5,100,"Black tea with bergamot oil; milk optional."],
"chai-indian":["Masala chai",95,100,4,6,100,"Black tea with spices; simmer with milk and sugar traditionally."],
"lapsang-souchong":["Lapsang souchong",90,95,3,5,100,"Smoky black tea; pine-smoked leaves."],
"tieguanyin":["Tieguanyin (iron goddess)",85,95,1,2,100,"Oolong; floral; resteep 5-7 times."],
"da-hong-pao":["Da Hong Pao (big red robe)",95,100,0.5,1,100,"Dark roasted oolong; resteep 6-8 times."]
};
var teaEl=document.getElementById("in-tea"),unitEl=document.getElementById("in-unit"),err=document.getElementById("err"),out=document.getElementById("out");
var keys=Object.keys(TEAS);keys.sort(function(a,b){return TEAS[a][0].localeCompare(TEAS[b][0])});
keys.forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=TEAS[k][0];teaEl.appendChild(o)});
function cToF(c){return c*9/5+32}
function fmtTemp(lo,hi,u){if(u==="f")return rnd(cToF(lo),0)+"–"+rnd(cToF(hi),0)+" °F";return rnd(lo,0)+"–"+rnd(hi,0)+" °C"}
function fmtTime(lo,hi){
var f=function(t){var m=Math.floor(t),s=Math.round((t-m)*60);if(s===60){m++;s=0}if(m===0)return s+"s";return m+":"+("00"+s).slice(-2)};
return f(lo)+"–"+f(hi);
}
function calc(){
var K=teaEl.value,U=unitEl.value;
if(!K)return;
var d=TEAS[K];
err.textContent="";
var html='<div class="big">'+fmtTemp(d[1],d[2],U)+'</div>';
html+=row("Tea",d[0]);
html+=row("Water temperature",fmtTemp(d[1],d[2],U));
html+=row("Steep time",fmtTime(d[3],d[4]));
html+=row("Leaf ratio","1 g per "+d[5]+" ml (≈ "+rnd(100/d[5]*2,1)+" g per 200 ml cup)");
html+=row("Type family",familyOf(d[0]));
html+='<div class="note">'+d[6]+'</div>';
out.innerHTML=html;
}
function familyOf(n){
if(/black/i.test(n))return"Black";
if(/green|gyokuro|matcha|jasmine|darjeeling/i.test(n))return /oolong/i.test(n)?"Oolong":"Green";
if(/oolong|tieguanyin|da hong/i.test(n))return"Oolong";
if(/white|silver|pai mu/i.test(n))return"White";
if(/pu-erh|puerh/i.test(n))return"Pu-erh";
if(/yellow|junshan/i.test(n))return"Yellow";
if(/herbal|chamomile|peppermint|rooibos|hibiscus|lemon balm|tisane/i.test(n))return"Herbal / Tisane";
if(/mate/i.test(n))return"Yerba mate";
if(/chai|earl grey|lapsang/i.test(n))return"Black (flavoured)";
return"—";
}
[teaEl,unitEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
