<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Validator</h1>
<p class="subtitle">Validate JSON and get line-by-line error reporting. Shows type info and key counts. 100% client-side.</p>
<div class="input-section">
<label>Paste JSON</label>
<textarea id="input" rows="10" placeholder='{"key": "value"}' aria-label="Paste JSON"></textarea>
<button id="validate" class="primary-btn" type="button">Validate</button>
</div>
<div id="result" style="margin-top:1em;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('validate').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
try{
const obj=JSON.parse(input);
let keyCount=0;function countKeys(o){if(o&&typeof o==='object'){if(Array.isArray(o))o.forEach(countKeys);else{keyCount+=Object.keys(o).length;Object.values(o).forEach(countKeys);}}}
countKeys(obj);
const type=Array.isArray(obj)?'array':typeof obj;
const size=new Blob([input]).size;
document.getElementById('result').innerHTML=`<div style="color:#4caf50"><h3>✓ Valid JSON</h3><p><strong>Type:</strong> ${type}</p><p><strong>Size:</strong> ${size} bytes</p><p><strong>Keys (recursive):</strong> ${keyCount}</p>${type==='array'?`<p><strong>Items:</strong> ${obj.length}</p>`:''}</div>`;
}catch(e){
const msg=String(e.message);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const lineMatch=msg.match(/line (\d+)/);
const posMatch=msg.match(/position (\d+)/);
let line=lineMatch?` at line ${lineMatch[1]}`:'';
if(!lineMatch&&posMatch){const pos=parseInt(posMatch[1],10);let ln=1;for(let i=0;i<pos&&i<input.length;i++){if(input[i]==='\n')ln++;}line=` at line ${ln}`;}
document.getElementById('result').innerHTML=`<div style="color:#f44336"><h3>✗ Invalid JSON</h3><p>${esc(msg)}</p>${line}</div>`;
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
