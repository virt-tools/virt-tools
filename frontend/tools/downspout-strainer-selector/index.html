<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Downspout Strainer Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Downspout Strainer Selector</h1>
<p>Select downspout strainer size from gutter width and downspout diameter. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-gw">Gutter width</label><input type="text" id="in-gw" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-dd">Downspout dia</label><input type="text" id="in-dd" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var gwEl=document.getElementById("in-gw"),ddEl=document.getElementById("in-dd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var G=pn(gwEl.value),D=pn(ddEl.value);
if(G==null||D==null)return;
if(!isFinite(G)||!isFinite(D)||G<=0||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var strainerDia=Math.min(G,D+0.5);
var mesh=20;
if(G>=6)mesh=14;
var html='<div class="big">'+rnd(strainerDia,1)+' in</div>';
html+=row("Gutter width",rnd(G,1)+" in");
html+=row("Downspout dia",rnd(D,1)+" in");
html+=row("Strainer dia",rnd(strainerDia,1)+" in");
html+=row("Recommended mesh",mesh+" mesh");
out.innerHTML=html;
}
[gwEl,ddEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
