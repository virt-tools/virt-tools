<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hoop House Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hoop House Calculator</h1>
<p>Calculate hoop house poly covering, rib spacing, and PVC pipe needed from width, length, and rib spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rs">Rib spacing</label><input type="text" id="in-rs" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),rsEl=document.getElementById("in-rs"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),RS=pn(rsEl.value);
if(W==null||L==null||RS==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(RS)||W<=0||L<=0||RS<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var hoopLen=Math.PI*W/2;
var numRibs=Math.ceil(L/RS)+1;
var totalPipe=hoopLen*numRibs;
var polyArea=hoopLen*L*1.15;
var html='<div class="big">'+numRibs+' ribs</div>';
html+=row("Width",rnd(W,0)+' ft');
html+=row("Length",rnd(L,0)+' ft');
html+=row("Rib spacing",rnd(RS,1)+' ft');
html+=row("Hoop length",rnd(hoopLen,1)+' ft');
html+=row("Number of ribs",numRibs);
html+=row("Total PVC pipe",rnd(totalPipe,0)+' ft');
html+=row("Poly covering",rnd(polyArea,0)+' sq ft');
out.innerHTML=html;
}
[wEl,lEl,rsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
