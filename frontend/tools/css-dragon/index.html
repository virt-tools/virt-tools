<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Dragon Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#2a0a1a,#4a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🐉 CSS Dragon Generator</h1>
<p>Create CSS dragon with body, head, wings, tail. 3 types, adjustable color/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Dragon Type</label><select id="style" aria-label="Style"><option value="western">Western</option><option value="eastern">Eastern</option><option value="wyvern">Wyvern</option></select></div>
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#2e7d32" style="width:60px;height:36px" aria-label="Body Color"></div>
<div class="ctrl-row"><label>Wing Color</label><input type="color" id="wingColor" value="#1b5e20" style="width:60px;height:36px" aria-label="Wing Color"></div>
<div class="ctrl-row"><label>Eye Color</label><input type="color" id="eyeColor" value="#ff5722" style="width:60px;height:36px" aria-label="Eye Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="280" value="200" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var bc=document.getElementById('bodyColor').value;
var wc=document.getElementById('wingColor').value;
var ec=document.getElementById('eyeColor').value;
var sz=parseInt(document.getElementById('size').value);
var bw=sz*0.5,bh=sz*0.3,hd=sz*0.25;
var html='<div class="dragon d-'+st+'">\n  <div class="wing w-left"></div>\n  <div class="wing w-right"></div>\n  <div class="body"><div class="scale"></div></div>\n  <div class="head"><div class="eye"></div><div class="horn h-left"></div><div class="horn h-right"></div><div class="snout"></div></div>\n  <div class="tail"></div>\n</div>';
var css='.dragon{position:relative;display:flex;align-items:center;justify-content:center;transform:rotate(-5deg)}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:linear-gradient(180deg,'+bc+','+wc+');border-radius:50% 60% 50% 50%;position:relative;z-index:2;box-shadow:inset -10px -10px rgba(0,0,0,0.3)}\n';
css+='.scale{position:absolute;top:20%;left:30%;width:'+(bw*0.4)+'px;height:'+(bh*0.3)+'px;background:rgba(255,255,255,0.15);border-radius:50%}\n';
css+='.head{width:'+hd+'px;height:'+hd+'px;background:linear-gradient(135deg,'+bc+','+wc+');border-radius:50% 30% 30% 50%;position:absolute;left:-'+(hd*0.5)+'px;top:-'+(hd*0.2)+'px;z-index:3}\n';
css+='.eye{position:absolute;top:25%;right:20%;width:'+(hd*0.15)+'px;height:'+(hd*0.15)+'px;background:'+ec+';border-radius:50%;box-shadow:0 0 6px '+ec+'}\n';
css+='.horn{position:absolute;top:-'+(hd*0.3)+'px;width:'+(hd*0.1)+'px;height:'+(hd*0.4)+'px;background:'+wc+';clip-path:polygon(50% 0,0 100%,100% 100%)}\n';
css+='.h-left{left:25%}.h-right{right:25%}\n';
css+='.snout{position:absolute;left:-'+(hd*0.2)+'px;top:40%;width:'+(hd*0.3)+'px;height:'+(hd*0.2)+'px;background:'+bc+';border-radius:50% 0 0 50%}\n';
css+='.wing{position:absolute;width:'+(sz*0.4)+'px;height:'+(sz*0.35)+'px;background:linear-gradient(135deg,'+wc+','+bc+');z-index:1;clip-path:polygon(0 50%,50% 0,100% 30%,80% 100%,20% 80%)}\n';
css+='.w-left{left:-'+(sz*0.15)+'px;top:-'+(sz*0.15)+'px;transform:rotate(-20deg)}\n';
css+='.w-right{right:-'+(sz*0.15)+'px;top:-'+(sz*0.15)+'px;transform:rotate(20deg) scaleX(-1)}\n';
css+='.tail{position:absolute;right:-'+(sz*0.3)+'px;top:50%;width:'+(sz*0.35)+'px;height:'+(sz*0.08)+'px;background:'+bc+';clip-path:polygon(0 50%,80% 0,100% 50%,80% 100%);z-index:1}\n';
if(st==='eastern'){
css+='.dragon.d-eastern{transform:rotate(0)}\n.dragon.d-eastern .body{border-radius:30px}\n.dragon.d-eastern .wing{display:none}\n';
}else if(st==='wyvern'){
css+='.dragon.d-wyvern .w-left{display:none}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','bodyColor','wingColor','eyeColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
