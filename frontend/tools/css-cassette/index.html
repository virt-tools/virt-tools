<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Cassette Tape Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📼 CSS Cassette Tape Generator</h1>
<p>Create CSS animated retro cassette tape. Adjustable body/label colors, spinning reels. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#2c3e50" aria-label="Body Color"></div>
<div class="ctrl-row"><label>Label Color</label><input type="color" id="labelColor" value="#e74c3c" aria-label="Label Color"></div>
<div class="ctrl-row"><label>Reel Color</label><input type="color" id="reelColor" value="#ecf0f1" aria-label="Reel Color"></div>
<div class="ctrl-row"><label>Width</label><select id="width" aria-label="Width"><option value="300" selected>Medium</option><option value="240">Small</option><option value="400">Large</option></select></div>
<div class="ctrl-row"><label>Spin Speed (s)</label><input type="range" id="speed" min="0.5" max="5" step="0.1" value="2" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Tape Text</label><input type="text" id="tapeText" value="MIXTAPE VOL.1" style="width:200px" aria-label="Tape Text"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var bc=document.getElementById('bodyColor').value;
var lc=document.getElementById('labelColor').value;
var rc=document.getElementById('reelColor').value;
var w=parseInt(document.getElementById('width').value);
var speed=parseFloat(document.getElementById('speed').value);
var txt=document.getElementById('tapeText').value||'MIXTAPE';
var h=w*0.64;
var reelR=w*0.08;
var html='<div class="cassette" style="width:'+w+'px;height:'+h+'px;background:'+bc+'">\n';
html+='  <div class="cass-label" style="background:'+lc+'">'+txt+'</div>\n';
html+='  <div class="cass-reels">\n';
html+='    <div class="reel" style="width:'+(reelR*2)+'px;height:'+(reelR*2)+'px;background:'+rc+'"></div>\n';
html+='    <div class="reel" style="width:'+(reelR*2)+'px;height:'+(reelR*2)+'px;background:'+rc+'"></div>\n';
html+='  </div>\n';
html+='  <div class="cass-window"></div>\n';
html+='</div>';
var css='.cassette{border-radius:8px;padding:'+(w*0.04)+'px;display:flex;flex-direction:column;align-items:center;gap:'+(w*0.03)+'px;box-shadow:0 4px 20px rgba(0,0,0,.4);position:relative}\n';
css+='.cassette::before{content:"";position:absolute;top:'+(w*0.04)+'px;left:'+(w*0.04)+'px;right:'+(w*0.04)+'px;bottom:'+(w*0.04)+'px;border:2px solid rgba(255,255,255,.1);border-radius:6px}\n';
css+='.cass-label{width:'+(w*0.72)+'px;padding:'+(w*0.02)+'px;text-align:center;border-radius:4px;font-family:monospace;font-size:'+(w*0.05)+'px;font-weight:bold;color:#fff;z-index:1}\n';
css+='.cass-reels{display:flex;gap:'+(w*0.2)+'px;z-index:1}\n';
css+='.reel{border-radius:50%;animation:spin '+speed+'s linear infinite;position:relative}\n';
css+='.reel::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(reelR*0.4)+'px;height:'+(reelR*0.4)+'px;background:'+bc+';border-radius:50%}\n';
css+='.reel::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(reelR*0.8)+'px;height:2px;background:'+bc+';border-radius:1px}\n';
css+='.cass-window{width:'+(w*0.6)+'px;height:'+(w*0.05)+'px;background:rgba(0,0,0,.3);border-radius:2px;z-index:1}\n';
css+='@keyframes spin{to{transform:rotate(360deg)}}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['bodyColor','labelColor','reelColor','width','speed','tapeText'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
