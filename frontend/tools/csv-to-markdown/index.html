<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to Markdown Table — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to Markdown Table</h1>
<p class="subtitle">Convert CSV data to a GitHub-flavored Markdown table.</p>
<div class="input-section">
<label>CSV Input</label>
<textarea id="input" rows="8" placeholder="Name,Age,City&#10;Alice,30,NYC" aria-label="Name,Age,City&#10;Alice,30,Nyc"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);
if(rows.length<1){return;}
const headers=rows[0];
let md='| '+headers.join(' | ')+' |\n';
md+='| '+headers.map(()=>'---').join(' | ')+' |\n';
for(let i=1;i<rows.length;i++){
md+='| '+rows[i].map(c=>c||'').join(' | ')+' |\n';
}
const r=document.getElementById('result');
r.innerHTML='<textarea rows="10" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+md+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
