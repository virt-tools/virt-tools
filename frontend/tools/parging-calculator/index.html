<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Parging Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Parging Calculator</h1>
<p>Calculate mortar mix needed for parging a foundation wall based on area and coat thickness. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Wall area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-t">Coat thickness</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),T=pn(tEl.value);
if(A==null||T==null)return;
if(!isFinite(A)||A<=0||!isFinite(T)||T<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vol=A*(T/12)*1.2;
var bags=Math.ceil(vol/0.7);
var html='<div class="big">'+bags+' bags</div>';
html+=row("Mortar bags (80 lb)",bags);
html+=row("Mortar volume",rnd(vol,1)+' cu ft');
html+=row("Wall area",A+' sq ft');
html+=row("Coat thickness",T+' in');
out.innerHTML=html;
}
[aEl,tEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
