<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Waveform Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Waveform Viewer</h1>
<p class="subtitle">Visualize the amplitude waveform of any audio file. Zoom and scroll. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="load" class="primary-btn" type="button">Load</button>
</div>
<canvas id="canvas" width="800" height="300" style="width:100%;max-width:800px;border:1px solid #333;background:#111;"></canvas>
<div id="info"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
document.getElementById('load').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const data=buf.getChannelData(0);
const w=canvas.width,h=canvas.height;
ctx.clearRect(0,0,w,h);
ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
ctx.strokeStyle='#0f0';ctx.lineWidth=1;
ctx.beginPath();
const step=Math.ceil(data.length/w);
for(let x=0;x<w;x++){
let min=1,max=-1;
for(let j=0;j<step;j++){
const v=data[x*step+j]||0;
if(v<min)min=v;
if(v>max)max=v;
}
const yMin=(1-min)/2*h;
const yMax=(1-max)/2*h;
ctx.moveTo(x+0.5,yMin);
ctx.lineTo(x+0.5,yMax);
}
ctx.stroke();
ctx.strokeStyle='#080';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
document.getElementById('info').textContent=`Duration: ${buf.duration.toFixed(2)}s | Channels: ${buf.numberOfChannels} | Sample Rate: ${buf.sampleRate}Hz`;
audioCtx.close();
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
