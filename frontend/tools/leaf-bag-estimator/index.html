<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Leaf Bag Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Leaf Bag Estimator</h1>
<p>Estimate number of leaf bags needed from yard area, tree count, and bag volume. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Yard area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-trees">Tree count</label><input type="text" id="in-trees" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">trees</div></div>
<div class="field"><label class="f" for="in-bag">Bag volume</label><input type="text" id="in-bag" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">gal</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var areaEl=document.getElementById("in-area"),treesEl=document.getElementById("in-trees"),bagEl=document.getElementById("in-bag"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Area=pn(areaEl.value),Trees=pn(treesEl.value),Bag=pn(bagEl.value);
if(Area==null||Trees==null||Bag==null)return;
if(!isFinite(Area)||!isFinite(Trees)||!isFinite(Bag)||Area<=0||Trees<=0||Bag<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var leafCuFt=Area/100*0.5+Trees*8;
var bagCuFt=Bag/7.48;
var bags=Math.ceil(leafCuFt/bagCuFt);
var html='<div class="big">'+bags+' bags</div>';
html+=row("Yard area",rnd(Area,0)+' sq ft');
html+=row("Trees",rnd(Trees,0));
html+=row("Leaf volume",rnd(leafCuFt,1)+' cu ft');
html+=row("Bag volume",rnd(Bag,0)+' gal ('+rnd(bagCuFt,1)+' cu ft)');
html+=row("Bags needed",bags);
out.innerHTML=html;
}
[areaEl,treesEl,bagEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
