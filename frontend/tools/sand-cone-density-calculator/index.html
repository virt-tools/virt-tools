<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sand Cone Density Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sand Cone Density Calculator</h1>
<p>Calculate in-place wet density and dry density from sand cone test masses and calibrations. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sg">Sand density</label><input type="text" id="in-sg" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.60"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-sm">Sand mass used</label><input type="text" id="in-sm" inputmode="decimal" autocomplete="off" placeholder="e.g. 1200"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-smw">Wet soil mass</label><input type="text" id="in-smw" inputmode="decimal" autocomplete="off" placeholder="e.g. 1500"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-mc">Moisture content</label><input type="text" id="in-mc" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sgE=document.getElementById("in-sg"),smE=document.getElementById("in-sm"),smwE=document.getElementById("in-smw"),mcE=document.getElementById("in-mc"),err=document.getElementById("err"),out=document.getElementById("out");
var PH='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var sg=parseFloat(sgE.value),sm=parseFloat(smE.value),smw=parseFloat(smwE.value),mc=parseFloat(mcE.value);
if(isNaN(sg)||isNaN(sm)||isNaN(smw)){err.textContent="";return}
if(sg<=0||sm<=0||smw<=0||(!isNaN(mc)&&mc<0)){err.textContent="Enter valid values.";out.innerHTML=PH;return}
err.textContent="";
var vol=sm/sg;
var wd=smw/vol;
var dd=wd/(1+(isNaN(mc)?0:mc)/100);
var html='<div class="big">'+Math.round(dd*100)/100+' g/cm³</div>';
html+=row("Dry density",Math.round(dd*100)/100+' g/cm³');
html+=row("Wet density",Math.round(wd*100)/100+' g/cm³');
html+=row("Hole volume",Math.round(vol*100)/100+' cm³');
out.innerHTML=html;
}
[sgE,smE,smwE,mcE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
