<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Liquid Fill Text Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:250px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>💧 CSS Liquid Fill Text Generator</h1>
<p>Create CSS liquid/water fill text animation. Adjustable fill color, speed, text, font size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="FILL" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Liquid Color</label><input type="color" id="liquidColor" value="#00bfff" aria-label="Liquid Color"></div>
<div class="ctrl-row"><label>Outline Color</label><input type="color" id="outlineColor" value="#fff" aria-label="Outline Color"></div>
<div class="ctrl-row"><label>Fill Level (%)</label><input type="range" id="fillLevel" min="10" max="100" value="50" style="width:200px" aria-label="Fill Level"></div>
<div class="ctrl-row"><label>Wave Speed (s)</label><input type="range" id="speed" min="1" max="10" step="0.5" value="3" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Font Size (px)</label><input type="range" id="fontSize" min="40" max="200" value="120" style="width:200px" aria-label="Font Size"></div>
<div class="ctrl-row"><label>Wave Height</label><select id="waveHeight" aria-label="Wave Height"><option value="5px">Small</option><option value="15px" selected>Medium</option><option value="25px">Large</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var txt=document.getElementById('text').value||'FILL';
var lc=document.getElementById('liquidColor').value;
var oc=document.getElementById('outlineColor').value;
var fill=parseInt(document.getElementById('fillLevel').value);
var speed=parseFloat(document.getElementById('speed').value);
var fs=parseInt(document.getElementById('fontSize').value);
var wh=document.getElementById('waveHeight').value;
var html='<div class="liquid-text" style="--fs:'+fs+'px;--lc:'+lc+';--oc:'+oc+';--fill:'+fill+'%;--sp:'+speed+'s;--wh:'+wh+'">\n';
html+='  '+txt+'\n';
html+='  <div class="liquid"></div>\n';
html+='  <div class="wave"></div>\n';
html+='  <div class="wave wave2"></div>\n';
html+='</div>';
var css='.liquid-text{font-size:var(--fs);font-family:Impact,sans-serif;font-weight:bold;position:relative;color:var(--oc);-webkit-text-stroke:2px var(--oc);letter-spacing:4px;line-height:1}\n';
css+='.liquid-text>text,.liquid-text{display:inline-block}\n';
css+='.liquid{position:absolute;bottom:0;left:0;right:0;height:var(--fill);overflow:hidden;pointer-events:none}\n';
css+='.liquid-text{overflow:hidden}\n';
css+='.liquid-text .liquid{width:100%;height:100%;background:var(--lc);position:absolute;bottom:0;left:0;mix-blend-mode:multiply}\n';
css+='.liquid-text{position:relative;overflow:hidden}\n';
css+='.liquid-text{background:linear-gradient(var(--oc),var(--oc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n';
css+='.liquid-text .liquid{position:absolute;bottom:0;left:-50%;width:200%;height:var(--fill);background:var(--lc);border-radius:50% 50% 0 0/100% 100% 0 0;top:100%;transform:translateY(calc(var(--fill) - 100%));mix-blend-mode:screen}\n';
css+='.liquid-text .wave{position:absolute;bottom:0;left:-50%;width:200%;height:'+wh+';background:var(--lc);border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.6;animation:wave var(--sp) linear infinite;transform:translateY(calc(var(--fill) - 100%))}\n';
css+='.liquid-text .wave2{animation:wave2 calc(var(--sp)*1.5) linear infinite;opacity:.4}\n';
css+='@keyframes wave{from{transform:translateX(0) translateY(calc(var(--fill) - 100%))}to{transform:translateX(50%) translateY(calc(var(--fill) - 100%))}}\n';
css+='@keyframes wave2{from{transform:translateX(0) translateY(calc(var(--fill) - 100%))}to{transform:translateX(-50%) translateY(calc(var(--fill) - 100%))}}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','liquidColor','outlineColor','fillLevel','speed','fontSize','waveHeight'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
