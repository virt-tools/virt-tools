<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autokey Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ak{max-width:600px;margin:0 auto;padding:2rem 1rem}
.ak h1{font-size:2rem;margin-bottom:.5rem}
.ak .sub{color:#888;margin-bottom:1.5rem}
.ak textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.ak input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.ak .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.ak .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.ak .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.ak label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
.ak .row{display:flex;gap:8px;margin-top:1rem}
.ak .mode{padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:14px}
.ak .mode.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="ak">
<h1>🔑 Autokey Cipher</h1>
<p class="sub">A Vigenère variant where the key is the primer followed by the plaintext itself, avoiding repeating key patterns.</p>
<div class="row">
<button class="mode active" id="enc" onclick="setMode('enc')" type="button">Encrypt</button>
<button class="mode" id="dec" onclick="setMode('dec')" type="button">Decrypt</button>
</div>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">HELLO WORLD</textarea>
<label for="key">Primer key:</label>
<input type="text" id="key" value="KEY" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let mode='enc';
function setMode(m){mode=m;document.getElementById('enc').classList.toggle('active',m==='enc');document.getElementById('dec').classList.toggle('active',m==='dec');convert();}
function clean(t){return t.toUpperCase().replace(/[^A-Z]/g,'');}
function autokeyEnc(text,key){
  text=clean(text);key=clean(key);
  let fullKey=key+text;let result='';
  for(let i=0;i<text.length;i++){
    result+=String.fromCharCode((text.charCodeAt(i)-65+fullKey.charCodeAt(i)-65)%26+65);
  }
  return result;
}
function autokeyDec(text,key){
  text=clean(text);key=clean(key);
  let result='';let fullKey=key;
  for(let i=0;i<text.length;i++){
    const dec=((text.charCodeAt(i)-65)-(fullKey.charCodeAt(i)-65)+26)%26;
    const ch=String.fromCharCode(dec+65);
    result+=ch;fullKey+=ch;
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const key=document.getElementById('key').value;
  if(!key){document.getElementById('output').textContent='Enter a key';return;}
  const out=mode==='enc'?autokeyEnc(text,key):autokeyDec(text,key);
  document.getElementById('output').textContent=out;
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
