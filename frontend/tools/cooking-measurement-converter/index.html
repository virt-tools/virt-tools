<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking Measurement Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Cooking Measurement Converter</h1>
<p class="subtitle">Convert between cups, tablespoons, teaspoons, fluid ounces, grams, mL, and sticks of butter.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="236.588" selected>US Cup</option>
<option value="14.7868">US Tablespoon (tbsp)</option>
<option value="4.92892">US Teaspoon (tsp)</option>
<option value="29.5735">US Fluid Ounce (fl oz)</option>
<option value="240">Metric Cup</option>
<option value="15">Metric Tablespoon</option>
<option value="5">Metric Teaspoon</option>
<option value="28.4131">Imperial fl oz</option>
<option value="1">Milliliter (mL)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['US Cup',236.588],['Metric Cup',240],['US Tablespoon',14.7868],['Metric Tablespoon',15],['US Teaspoon',4.92892],['Metric Teaspoon',5],['US Fluid Ounce',29.5735],['Imperial fl oz',28.4131],['Milliliter (mL)',1],['Liter (L)',1000]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const ml=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=ml/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:6})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
