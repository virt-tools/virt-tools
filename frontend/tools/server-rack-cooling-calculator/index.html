<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Server Rack Cooling Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Server Rack Cooling Calculator</h1>
<p>Calculate required cooling BTU/h and CFM airflow from rack power draw and temperature rise target. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-kw">Rack power</label><input type="text" id="in-kw" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-dt">Temp rise target</label><input type="text" id="in-dt" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">°F</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var kwEl=document.getElementById("in-kw"),dtEl=document.getElementById("in-dt"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var KW=parseFloat(kwEl.value),DT=parseFloat(dtEl.value);
if(isNaN(KW)||isNaN(DT))return;
if(KW<=0||DT<=0){err.textContent="Values must be positive.";return}
err.textContent="";
var btuh=KW*3412; // 1 kW = 3412 BTU/h
var cfm=(KW*3160)/DT; // CFM = (kW × 3160) / ΔT(°F)
var tons=btuh/12000;
var html='<div class="big">'+Math.round(btuh)+' BTU/h</div>';
html+=row("Heat load",Math.round(btuh)+" BTU/h");
html+=row("Cooling tons",Math.round(tons*10)/10+" tons");
html+=row("Required airflow",Math.round(cfm)+" CFM");
html+=row("Temp rise",DT+" °F");
out.innerHTML=html;
}
[kwEl,dtEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
