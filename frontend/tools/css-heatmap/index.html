<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Heatmap/Activity Grid Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:900px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#0a0a1a;border-radius:12px;overflow:hidden;padding:20px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🗺️ CSS Heatmap/Activity Grid Generator</h1>
<p>Create CSS heatmap grid (like GitHub contribution graph). 5 color schemes, adjustable weeks/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Color Scheme</label><select id="scheme" aria-label="Scheme"><option value="github" selected>GitHub Green</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="heat">Heat</option><option value="rainbow">Rainbow</option></select></div>
<div class="ctrl-row"><label>Weeks</label><input type="number" id="weeks" value="20" min="5" max="52" style="width:80px" aria-label="Weeks"></div>
<div class="ctrl-row"><label>Cell Size</label><input type="number" id="cellSize" value="12" min="6" max="24" style="width:80px" aria-label="Cell Size"></div>
<div class="ctrl-row"><label>Gap</label><input type="number" id="gap" value="3" min="0" max="8" style="width:80px" aria-label="Gap"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function getColor(scheme,level){
var palettes={
github:['#1a1a2e','#0e4429','#006d32','#26a641','#39d353'],
blue:['#1a1a2e','#0d2a4e','#1a4a8e','#2196f3','#64b5f6'],
purple:['#1a1a2e','#2d1b4e','#4a2d8e','#8e24aa','#ce93d8'],
heat:['#1a1a2e','#3d0000','#8b0000','#ff4500','#ffcc00'],
rainbow:['#1a1a2e','#4caf50','#ffc107','#ff9800','#f44336']
};
var p=palettes[scheme]||palettes.github;
return p[level]||p[0];
}
function update(){
var scheme=document.getElementById('scheme').value;
var weeks=parseInt(document.getElementById('weeks').value);
var cs=parseInt(document.getElementById('cellSize').value);
var gap=parseInt(document.getElementById('gap').value);
var html='<div class="heatmap">\n';
for(var w=0;w<weeks;w++){
html+='  <div class="column">\n';
for(var d=0;d<7;d++){
var level=Math.floor(Math.random()*5);
html+='    <div class="cell level-'+level+'"></div>\n';
}
html+='  </div>\n';
}
html+='</div>';
var css='.heatmap{display:flex;gap:'+gap+'px}\n';
css+='.column{display:flex;flex-direction:column;gap:'+gap+'px}\n';
css+='.cell{width:'+cs+'px;height:'+cs+'px;border-radius:3px}\n';
for(var l=0;l<5;l++){
css+='.level-'+l+'{background:'+getColor(scheme,l)+'}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['scheme','weeks','cellSize','gap'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
