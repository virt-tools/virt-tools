<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humidity & Dew Point Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Humidity & Dew Point Calculator</h1>
<p class="subtitle">Calculate dew point, relative humidity, and absolute humidity from temperature.</p>
<div class="input-section">
<label>Temperature (°C)</label>
<input type="number" id="temp" value="25" step="0.1" aria-label="Temp">
<label>Relative Humidity (%)</label>
<input type="number" id="rh" value="50" min="0" max="100" step="0.1" aria-label="Rh">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const T=parseFloat(document.getElementById('temp').value)||0;
const RH=parseFloat(document.getElementById('rh').value)||0;
const a=17.27,b=237.7;
const alpha=(a*T)/(b+T)+Math.log(Math.max(RH,0.01)/100);
const dewP=(b*alpha)/(a-alpha);
const svp=6.112*Math.exp((17.67*T)/(T+243.5));
const avp=svp*(RH/100);
const absHum=(avp*100)/(8.314*(T+273.15))*2.165;
const Tf=T*9/5+32;
const dewF=dewP*9/5+32;
let comfort=T>20&&T<26&&RH>30&&RH<60?'<p class="ok">✓ Comfortable range</p>':T<20?'<p class="warning">⚠️ Cold — may feel chilly</p>':RH<30?'<p class="warning">⚠️ Dry — use a humidifier</p>':RH>60?'<p class="warning">⚠️ Humid — use a dehumidifier</p>':'';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Temperature:</span><span>${T.toFixed(1)}°C (${Tf.toFixed(1)}°F)</span></div>
<div class="result-row"><span>Relative Humidity:</span><span>${RH.toFixed(1)}%</span></div>
<div class="result-row"><span>Dew Point:</span><span>${dewP.toFixed(1)}°C (${dewF.toFixed(1)}°F)</span></div>
<div class="result-row"><span>Absolute Humidity:</span><span>${absHum.toFixed(2)} g/m³</span></div>
<div class="result-row"><span>Saturation Vapor Pressure:</span><span>${svp.toFixed(2)} hPa</span></div>
<div class="result-row"><span>Actual Vapor Pressure:</span><span>${avp.toFixed(2)} hPa</span></div>
${comfort}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
