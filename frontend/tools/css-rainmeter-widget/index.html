<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Rainmeter Widget Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>CSS Rainmeter Widget Generator</h1>
<p class="subtitle">Create a CSS desktop-style Rainmeter widget with clock, system stats, and weather. 4 themes, adjustable accent color. Copy HTML+CSS.</p>
<div class="tool-layout">
<div class="controls">
<label>Theme
<select id="theme">
<option value="dark">Dark</option>
<option value="light">Light</option>
<option value="neon">Neon</option>
<option value="paper">Paper</option>
</select></label>
<label>Accent Color <input type="color" id="accent" value="#00d4ff"></label>
<label>Widget Size <input type="range" id="wsize" min="200" max="400" value="280"></label>
<label>Show Clock <input type="checkbox" id="showClock" checked></label>
<label>Show Stats <input type="checkbox" id="showStats" checked></label>
<label>Show Weather <input type="checkbox" id="showWeather" checked></label>
<button id="copyBtn" class="btn" type="button">Copy HTML+CSS</button>
</div>
<div class="preview" id="preview"></div>
</div>
<div class="code-output"><h3>Generated Code</h3><textarea id="codeOutput" readonly rows="20" aria-label="Code Output"></textarea></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const preview=document.getElementById('preview'),codeOutput=document.getElementById('codeOutput');
const theme=document.getElementById('theme'),accent=document.getElementById('accent'),wsize=document.getElementById('wsize'),showClock=document.getElementById('showClock'),showStats=document.getElementById('showStats'),showWeather=document.getElementById('showWeather');
const themes={dark:{bg:'#1a1a2e',fg:'#e0e0e0',card:'rgba(255,255,255,.05)'},light:{bg:'#f5f5f5',fg:'#333',card:'rgba(0,0,0,.05)'},neon:{bg:'#0a0a1a',fg:'#ff00ff',card:'rgba(255,0,255,.1)'},paper:{bg:'#f4ecd8',fg:'#5c4a2a',card:'rgba(92,74,42,.08)'}};
function build(){
const t=themes[theme.value],ac=accent.value,ws=wsize.value;
let content='';
if(showClock.checked)content+='<div style="font-size:'+(ws*0.15)+'px;font-weight:bold;color:'+ac+';text-align:center;margin-bottom:.5rem;">12:34</div><div style="font-size:'+(ws*0.05)+'px;text-align:center;opacity:.7;margin-bottom:.75rem;">Mon, Jul 26</div>';
if(showStats.checked)content+='<div style="background:'+t.card+';border-radius:8px;padding:.5rem .75rem;margin-bottom:.5rem;font-size:'+(ws*0.045)+'px;"><div style="display:flex;justify-content:space-between;"><span>CPU</span><span style="color:'+ac+';">23%</span></div><div style="height:4px;background:rgba(128,128,128,.2);border-radius:2px;margin-top:.25rem;"><div style="width:23%;height:100%;background:'+ac+';border-radius:2px;"></div></div></div><div style="background:'+t.card+';border-radius:8px;padding:.5rem .75rem;margin-bottom:.5rem;font-size:'+(ws*0.045)+'px;"><div style="display:flex;justify-content:space-between;"><span>RAM</span><span style="color:'+ac+';">45%</span></div><div style="height:4px;background:rgba(128,128,128,.2);border-radius:2px;margin-top:.25rem;"><div style="width:45%;height:100%;background:'+ac+';border-radius:2px;"></div></div></div>';
if(showWeather.checked)content+='<div style="display:flex;align-items:center;gap:.5rem;background:'+t.card+';border-radius:8px;padding:.5rem .75rem;font-size:'+(ws*0.045)+'px;"><span style="font-size:'+(ws*0.08)+'px;">☀️</span><div><div>72°F Sunny</div><div style="opacity:.7;font-size:'+(ws*0.035)+'px;">Portland, OR</div></div></div>';
preview.innerHTML='<div style="width:'+ws+'px;background:'+t.bg+';color:'+t.fg+';border-radius:16px;padding:1rem;box-shadow:0 8px 32px rgba(0,0,0,.3);font-family:sans-serif;">'+content+'</div>';
codeOutput.value='<style>\n.widget{width:'+ws+'px;background:'+t.bg+';color:'+t.fg+';border-radius:16px;padding:1rem;box-shadow:0 8px 32px rgba(0,0,0,.3);font-family:sans-serif;}\n.widget .clock{font-size:'+(ws*0.15)+'px;font-weight:bold;color:'+ac+';text-align:center;margin-bottom:.5rem;}\n.widget .date{font-size:'+(ws*0.05)+'px;text-align:center;opacity:.7;margin-bottom:.75rem;}\n.widget .stat{background:'+t.card+';border-radius:8px;padding:.5rem .75rem;margin-bottom:.5rem;font-size:'+(ws*0.045)+'px;}\n.widget .bar{height:4px;background:rgba(128,128,128,.2);border-radius:2px;margin-top:.25rem;}\n.widget .bar > div{height:100%;background:'+ac+';border-radius:2px;}\n.widget .weather{display:flex;align-items:center;gap:.5rem;background:'+t.card+';border-radius:8px;padding:.5rem .75rem;font-size:'+(ws*0.045)+'px;}\n</style>\n\n<div class="widget">\n'+(showClock.checked?'  <div class="clock">12:34</div>\n  <div class="date">Mon, Jul 26</div>\n':'')+(showStats.checked?'  <div class="stat"><div style="display:flex;justify-content:space-between;"><span>CPU</span><span style="color:'+ac+';">23%</span></div><div class="bar"><div style="width:23%"></div></div></div>\n  <div class="stat"><div style="display:flex;justify-content:space-between;"><span>RAM</span><span style="color:'+ac+';">45%</span></div><div class="bar"><div style="width:45%"></div></div></div>\n':'')+(showWeather.checked?'  <div class="weather"><span style="font-size:'+(ws*0.08)+'px;">☀️</span><div><div>72°F Sunny</div><div style="opacity:.7;font-size:'+(ws*0.035)+'px;">Portland, OR</div></div></div>\n':'')+'</div>';
}
[theme,accent,wsize,showClock,showStats,showWeather].forEach(el=>el.addEventListener('input',build));
document.getElementById('copyBtn').addEventListener('click',function(){codeOutput.select();document.execCommand('copy');});
build();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:250px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.preview{flex:1;min-height:400px;display:flex;align-items:flex-start;justify-content:center;background:var(--bg-alt,#f0f0f0);border-radius:12px;padding:2rem;}
.code-output{margin-top:2rem;}
.code-output textarea{width:100%;font-family:monospace;font-size:13px;padding:1rem;border-radius:8px;border:1px solid #ddd;background:#fafafa;}
.btn{padding:.5rem 1rem;background:#00d4ff;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:1rem;}
</style>
</body>
</html>
