<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumber Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Lumber Calculator</h1>
<p class="subtitle">Estimate board feet and cost for any lumber project.</p>

<div class="input-section">
  <label>Pieces</label>
  <input type="number" id="qty" value="10" min="1" aria-label="Qty">
  <label>Thickness (in)</label>
  <input type="number" id="thk" value="1.5" min="0.1" step="0.0625" aria-label="Thk">
  <label>Width (in)</label>
  <input type="number" id="wdt" value="3.5" min="0.1" step="0.0625" aria-label="Wdt">
  <label>Length (ft)</label>
  <input type="number" id="len" value="8" min="0.1" step="0.5" aria-label="Len">
  <label>Price per board ft ($)</label>
  <input type="number" id="price" value="2.50" min="0" step="0.01" aria-label="Price">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const qty = parseFloat(document.getElementById('qty').value) || 0;
    const t = parseFloat(document.getElementById('thk').value) || 0;
    const w = parseFloat(document.getElementById('wdt').value) || 0;
    const l = parseFloat(document.getElementById('len').value) || 0;
    const price = parseFloat(document.getElementById('price').value) || 0;
    const bfPerPiece = (t * w * l) / 12;
    const totalBF = bfPerPiece * qty;
    const cost = totalBF * price;
    document.getElementById('bigResult').textContent = `${totalBF.toFixed(1)} board ft`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Board ft per piece:</span><span>${bfPerPiece.toFixed(2)}</span></div>
      <div class="result-row"><span>Pieces:</span><span>${qty}</span></div>
      <div class="result-row"><span>Total board feet:</span><span>${totalBF.toFixed(1)}</span></div>
      <div class="result-row"><span>Cost:</span><span>$${cost.toFixed(2)}</span></div>
      <div class="result-row"><span>Formula:</span><span>BF = (T × W × L) / 12</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
