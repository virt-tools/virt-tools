<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Frequency Analyzer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Frequency Analyzer</h1>
<p class="subtitle">Real-time FFT frequency analysis from microphone or audio file. Shows peak frequency and note name. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="play" class="primary-btn" type="button">Play & Analyze</button>
<button id="mic" class="primary-btn" type="button">Use Microphone</button>
<button id="stop" class="primary-btn" type="button">Stop</button>
</div>
<canvas id="canvas" width="800" height="300" style="width:100%;max-width:800px;border:1px solid #333;background:#111;"></canvas>
<div id="info"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const info=document.getElementById('info');
let audioCtx,analyser,src,raf;
function draw(){
const buf=new Uint8Array(analyser.frequencyBinCount);
analyser.getByteFrequencyData(buf);
const w=canvas.width,h=canvas.height;
ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
const bars=128;
const barW=w/bars;
for(let i=0;i<bars;i++){
const v=buf[Math.floor(i*buf.length/bars)]/255;
ctx.fillStyle=`hsl(${i/bars*360},100%,${30+v*40}%)`;
ctx.fillRect(i*barW,h-v*h,barW-1,v*h);
}
let peak=0,peakI=0;
for(let i=0;i<buf.length;i++){
if(buf[i]>peak){peak=buf[i];peakI=i;}
}
const freq=peakI*audioCtx.sampleRate/(analyser.fftSize*2);
const note=freqToNote(freq);
info.textContent=`Peak: ${freq.toFixed(1)} Hz ${note?'→ '+note:''}`;
raf=requestAnimationFrame(draw);
}
function freqToNote(f){
if(f<20)return null;
const notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const n=Math.round(12*Math.log2(f/440))+57;
return notes[((n%12)+12)%12]+(Math.floor(n/12)-1);
}
document.getElementById('play').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
stopAll();
audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
src=audioCtx.createBufferSource();src.buffer=buf;
analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
src.connect(analyser);analyser.connect(audioCtx.destination);
src.start();draw();
});
document.getElementById('mic').addEventListener('click',async()=>{
stopAll();
audioCtx=new AudioContext();
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
src=audioCtx.createMediaStreamSource(stream);
analyser=audioCtx.createAnalyser();analyser.fftSize=2048;
src.connect(analyser);draw();
});
document.getElementById('stop').addEventListener('click',stopAll);
function stopAll(){
if(raf)cancelAnimationFrame(raf);
if(src){try{src.stop&&src.stop();}catch(e){}src.disconnect&&src.disconnect();}
if(audioCtx){audioCtx.close();}
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
