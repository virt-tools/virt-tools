<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Crown Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>👑 CSS Crown Generator</h1>
<p>Create CSS royal crown with gems, 3 styles, adjustable color/size/gem count. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="classic">Classic</option><option value="queen">Queen</option><option value="simple">Simple</option></select></div>
<div class="ctrl-row"><label>Crown Color</label><input type="color" id="gold" value="#ffd700" style="width:60px;height:36px" aria-label="Gold"></div>
<div class="ctrl-row"><label>Gem Color</label><input type="color" id="gem" value="#e91e63" style="width:60px;height:36px" aria-label="Gem"></div>
<div class="ctrl-row"><label>Gems</label><input type="range" id="gems" min="3" max="7" step="1" value="5" style="width:200px" aria-label="Gems"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="100" max="240" step="5" value="160" style="width:200px" aria-label="Sz"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var gold=document.getElementById('gold').value;
var gem=document.getElementById('gem').value;
var gems=parseInt(document.getElementById('gems').value);
var sz=parseInt(document.getElementById('sz').value);
var peaks={classic:5,queen:3,simple:3};
var peaksCount=peaks[style];
var html='<div class="crown-wrap">\n  <div class="crown-body"></div>\n';
for(var i=0;i<gems;i++){html+='  <div class="gem gem-'+i+'"></div>\n'}
html+='  <div class="crown-base"></div>\n</div>';
var css='.crown-wrap{position:relative;width:'+sz+'px;height:'+(sz*0.7)+'px}\n';
css+='.crown-body{position:absolute;top:0;left:50%;transform:translateX(-50%);width:'+sz+'px;height:'+(sz*0.5)+'px;background:'+gold+';clip-path:polygon(';
var totalSegs=peaksCount*2;
for(var p=0;p<=totalSegs;p++){
var x=(p/totalSegs*100).toFixed(1);
var y=p%2===0?100:30;
css+=x+'% '+y+'%';
if(p<totalSegs)css+=',';
}
css+=');box-shadow:inset 0 -10px 20px rgba(0,0,0,0.2)}\n';
css+='.crown-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(sz*0.9)+'px;height:'+(sz*0.18)+'px;background:'+gold+';border-radius:4px 4px 8px 8px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}\n';
var gemSize=sz*0.06;
for(var i=0;i<gems;i++){
var pct=20+i*(60/(gems-1));
css+='.gem-'+i+'{position:absolute;top:'+(sz*0.15)+'px;left:'+pct.toFixed(1)+'%;width:'+gemSize+'px;height:'+gemSize+'px;background:'+gem+';border-radius:50%;box-shadow:0 0 6px '+gem+'aa,inset 1px 1px 2px rgba(255,255,255,0.5);z-index:2}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','gold','gem','gems','sz'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
