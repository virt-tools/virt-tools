<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Mud Weight Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Mud Weight Calculator</h1>
<p>Convert drilling mud weight between ppg, SG, psi/ft, and gradient pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-mw">Mud weight</label><input type="text" id="in-mw" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">lb/gal (ppg)</div></div>
<div class="field"><label class="f" for="in-tvd">True vertical depth</label><input type="text" id="in-tvd" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var mwE=document.getElementById("in-mw"),tvdE=document.getElementById("in-tvd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var mw=parseFloat(mwE.value),tvd=parseFloat(tvdE.value);
if(isNaN(mw))return;
err.textContent="";
var sg=mw/8.34;
var grad=mw*0.052;
var hydrostatic=isNaN(tvd)?0:grad*tvd;
var html='<div class="big">'+Math.round(sg*1000)/1000+' SG</div>';
html+=row("Specific gravity",Math.round(sg*1000)/1000);
html+=row("Pressure gradient",Math.round(grad*1000)/1000+' psi/ft');
if(!isNaN(tvd))html+=row("Hydrostatic pressure",Math.round(hydrostatic)+' psi');
out.innerHTML=html;
}
[mwE,tvdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
