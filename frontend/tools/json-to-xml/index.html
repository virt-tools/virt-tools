<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to XML Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON to XML Converter</h1>
<p class="subtitle">Convert JSON objects to XML with proper nesting and attribute handling.</p>
<div class="input-section">
<label>JSON Input</label>
<textarea id="input" rows="8" placeholder='{"person":{"name":"Alice","age":30}}' aria-label="{"></textarea>
<input id="root" value="root" style="width:120px;margin-top:8px;" placeholder="Root element" aria-label="Root Element">
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeTag(s){return String(s).replace(/[^a-zA-Z0-9_]/g,'_').replace(/^([0-9])/,'_$1')||'item';}
function toXML(obj,tag,indent){
tag=safeTag(tag);
if(obj===null){return indent+'<'+tag+' />\n';}
if(Array.isArray(obj)){
let xml='';
obj.forEach((v,i)=>{xml+=toXML(v,tag,indent);});
return xml;
}
if(typeof obj==='object'){
let xml=indent+'<'+tag+'>\n';
for(const[k,v]of Object.entries(obj)){xml+=toXML(v,k,indent+'  ');}
xml+=indent+'</'+tag+'>\n';
return xml;
}
return indent+'<'+tag+'>'+esc(obj)+'</'+tag+'>\n';
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
if(!text.trim()){return;}
try{
const data=JSON.parse(text);
const root=document.getElementById('root').value||'root';
let xml='<?xml version="1.0" encoding="UTF-8"?>\n';
xml+=toXML(data,root,'');
const r=document.getElementById('result');
r.innerHTML='<textarea rows="12" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+xml+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red;">Error: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
