<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Barricade Weight Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-ce7ea5a8.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Barricade Weight Calculator</h1>
<p>Calculate ballast weight needed to stabilize water-filled barricades against wind. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Wind speed</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">mph</div></div>
<div class="field"><label class="f" for="in-h">Barricade height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 42"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-l">Barricade length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 96"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),lEl=document.getElementById("in-l"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),L=pn(lEl.value);
if(W==null||H==null||L==null)return;
if(!isFinite(W)||W<=0||!isFinite(H)||H<=0||!isFinite(L)||L<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var areaSqFt=(H*L)/144;
var windPressure=0.00256*W*W;
var forceLbs=windPressure*areaSqFt;
var ballast=Math.ceil(forceLbs*1.5);
var html='<div class="big">'+ballast+' lbs ballast</div>';
html+=row("Wind force",rnd(forceLbs,1)+' lbs');
html+=row("Barricade area",rnd(areaSqFt,2)+' sq ft');
html+=row("Safety factor","1.5x");
html+=row("Min ballast",ballast+' lbs');
out.innerHTML=html;
}
[wEl,hEl,lEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
