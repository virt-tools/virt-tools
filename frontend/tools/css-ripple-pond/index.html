<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Ripple Pond Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#001122;border-radius:12px;overflow:hidden;height:300px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>💧 CSS Ripple Pond Generator</h1>
<p>Create CSS water ripple/pond drop animation effects. 4 presets, adjustable ripples/speed/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="pond" selected>Pond</option><option value="ocean">Ocean</option><option value="neon">Neon</option><option value="rain">Rain Ripples</option></select></div>
<div class="ctrl-row"><label>Ripple Count</label><input type="number" id="ripples" value="5" min="1" max="10" style="width:80px" aria-label="Ripples"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed" aria-label="Speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color1" value="#00aaff" style="width:60px;height:34px" aria-label="Color1"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#001122" style="width:60px;height:34px" aria-label="Bg Color"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var count=Math.min(10,Math.max(1,parseInt(document.getElementById('ripples').value,10)||1));
var speed=document.getElementById('speed').value;
var c1=document.getElementById('color1').value;
var bg=document.getElementById('bgColor').value;
var dur=speed==='slow'?'6s':speed==='fast'?'1.5s':'3s';
var html='<div class="pond">\n';
var css='.pond{width:100%;height:300px;background:'+bg+';position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}\n';
var positions=[[50,50],[30,40],[70,60],[40,70],[60,30],[20,55],[80,45],[35,25],[65,75],[50,15]];
for(var i=0;i<count;i++){
var pos=positions[i]||[50,50];
var delay=(i*parseFloat(dur)/count).toFixed(1)+'s';
html+='  <div class="ripple" style="top:'+pos[0]+'%;left:'+pos[1]+'%;animation-delay:-'+delay+'"></div>\n';
}
if(preset==='rain'){
for(var r=0;r<15;r++){
var rx=Math.floor(Math.random()*90+5);
var ry=Math.floor(Math.random()*90+5);
html+='  <div class="raindrop" style="top:'+ry+'%;left:'+rx+'%;animation-delay:-'+(Math.random()*3).toFixed(1)+'s"></div>\n';
}
css+='.raindrop{position:absolute;width:2px;height:2px;background:'+c1+';border-radius:50%;animation:raindrop '+dur+' ease-in infinite;opacity:0.5}\n';
css+='@keyframes raindrop{0%{transform:translateY(-20px);opacity:0}30%{opacity:0.6}100%{transform:translateY(0);opacity:0}}\n';
}
html+='</div>';
css+='.ripple{position:absolute;width:10px;height:10px;border:2px solid '+c1+';border-radius:50%;transform:translate(-50%,-50%);animation:ripple-expand '+dur+' ease-out infinite;opacity:0}\n';
css+='@keyframes ripple-expand{0%{width:0;height:0;opacity:'+(preset==='neon'?'0.9':'0.7')+'}100%{width:300px;height:300px;opacity:0}}\n';
if(preset==='neon'){css+='.ripple{box-shadow:0 0 10px '+c1+'}\n'}
if(preset==='ocean'){css+='.pond{background:linear-gradient(180deg,'+bg+',#002244)}\n'}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);navigator.clipboard.writeText(t.value).catch(function(){t.select();document.execCommand('copy')})}
['preset','ripples','speed','color1','bgColor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
