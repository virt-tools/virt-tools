<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polybius Square — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.polybius{max-width:700px;margin:0 auto;padding:2rem 1rem}
.polybius h1{font-size:2rem;margin-bottom:.5rem}
.polybius .sub{color:#888;margin-bottom:1.5rem}
.polybius textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.polybius input[type=text]{width:100%;font-size:15px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.polybius .row{display:flex;gap:1rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.polybius label{font-size:14px;white-space:nowrap}
.polybius select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.polybius .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.polybius .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.polybius .grid{margin-top:1rem;display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;max-width:320px}
.polybius .grid div{text-align:center;padding:10px;border:1px solid var(--border);border-radius:4px;font-family:monospace;font-weight:bold;font-size:14px}
.polybius .grid .hdr{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="polybius">
<h1>🔢 Polybius Square</h1>
<p class="sub">Encode and decode text using the Polybius square cipher — letters mapped to two-digit coordinates.</p>
<textarea id="input" placeholder="Enter text to encode or decode..." aria-label="Enter Text To Encode Or Decode..."></textarea>
<div class="row">
<label>Key:</label>
<input type="text" id="key" value="PHQGIUMEAYLNOO" style="flex:1" aria-label="Key">
<label>Mode:</label>
<select id="mode" aria-label="Mode"><option value="encode">Encode</option><option value="decode">Decode</option></select>
<button class="btn" id="run" type="button">Run</button>
</div>
<div class="output" id="output"></div>
<div class="grid" id="grid"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const keyEl=document.getElementById('key');
const mode=document.getElementById('mode');
const runBtn=document.getElementById('run');
const output=document.getElementById('output');
const grid=document.getElementById('grid');

function buildSquare(key){
  key=(key||'').toUpperCase().replace(/[^A-Z]/g,'');
  const seen=new Set();
  let chars='';
  for(const ch of key){if(!seen.has(ch)){seen.add(ch);chars+=ch;}}
  for(let c=65;c<=90;c++){
    const ch=String.fromCharCode(c);
    if(ch==='J')continue;
    if(!seen.has(ch)){seen.add(ch);chars+=ch;}}
  const sq=[];
  for(let i=0;i<5;i++)sq.push(chars.slice(i*5,i*5+5).split(''));
  return sq;
}

function encode(text,key){
  const sq=buildSquare(key);
  text=text.toUpperCase().replace(/J/g,'I').replace(/[^A-Z]/g,'');
  let result='';
  for(const ch of text){
    for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(sq[r][c]===ch){result+=(r+1)+''+(c+1)+' ';break;}
  }
  return result.trim();
}

function decode(text,key){
  const sq=buildSquare(key);
  const pairs=text.replace(/[^1-5]/g,'').match(/.{1,2}/g)||[];
  let result='';
  for(const p of pairs){
    const r=parseInt(p[0])-1,c=parseInt(p[1])-1;
    if(r>=0&&r<5&&c>=0&&c<5)result+=sq[r][c];
  }
  return result;
}

function renderGrid(sq){
  grid.innerHTML='';
  const corner=document.createElement('div');corner.className='hdr';corner.textContent='';grid.appendChild(corner);
  for(let c=0;c<5;c++){const h=document.createElement('div');h.className='hdr';h.textContent=c+1;grid.appendChild(h);}
  for(let r=0;r<5;r++){
    const h=document.createElement('div');h.className='hdr';h.textContent=r+1;grid.appendChild(h);
    for(let c=0;c<5;c++){const d=document.createElement('div');d.textContent=sq[r][c];grid.appendChild(d);}
  }
}

runBtn.addEventListener('click',()=>{
  const text=input.value;const key=keyEl.value;const m=mode.value;
  renderGrid(buildSquare(key));
  output.textContent=m==='encode'?encode(text,key):decode(text,key);
});
keyEl.addEventListener('input',()=>{renderGrid(buildSquare(keyEl.value));});
renderGrid(buildSquare(keyEl.value));
})();
</script>
</body>
</html>
