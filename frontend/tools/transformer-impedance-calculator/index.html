<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Transformer Impedance Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Transformer Impedance Calculator</h1>
<p>Calculate transformer percent impedance, per-unit impedance, and short-circuit current from nameplate data. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-mva">Rating</label><input type="text" id="in-mva" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">MVA</div></div>
<div class="field"><label class="f" for="in-volt">Rated voltage</label><input type="text" id="in-volt" inputmode="decimal" autocomplete="off" placeholder="e.g. 13800"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-z">Percent Z</label><input type="text" id="in-z" inputmode="decimal" autocomplete="off" placeholder="e.g. 5.5"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var mE=document.getElementById("in-mva"),vE=document.getElementById("in-volt"),zE=document.getElementById("in-z"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var m=pn(mE.value),v=pn(vE.value),z=pn(zE.value);
if(m==null||v==null||z==null)return;
if(!isFinite(m)||m<=0||!isFinite(v)||v<=0){err.textContent="Enter valid positive rating and voltage.";return}
if(!isFinite(z)||z<=0||z>100){err.textContent="Percent impedance must be between 0 and 100.";return}
err.textContent="";
var baseZ=v*v/(m*1e6);
var ohmZ=baseZ*z/100;
var scCurrent=m*1e6/(Math.sqrt(3)*v*z/100);
var html='<div class="big">'+(Math.round(ohmZ*100)/100)+' Ω</div>';
html+=row("Impedance (ohms)",Math.round(ohmZ*100)/100+' Ω');
html+=row("Base impedance",Math.round(baseZ*100)/100+' Ω');
html+=row("Short-circuit current",Math.round(scCurrent)+' A');
out.innerHTML=html;
}
[mE,vE,zE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
