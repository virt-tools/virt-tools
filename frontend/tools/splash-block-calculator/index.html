<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Splash Block Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Splash Block Calculator</h1>
<p>Calculate splash block dimensions and water spread area from downspout flow rate and spread angle. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-flow">Flow rate</label><input type="text" id="in-flow" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">L/s</div></div>
<div class="field"><label class="f" for="in-spread">Spread angle</label><input type="text" id="in-spread" inputmode="decimal" autocomplete="off" placeholder="e.g. 45"><div class="unit">degrees</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter flow rate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fEl=document.getElementById("in-flow"),sEl=document.getElementById("in-spread"),err=document.getElementById("err"),out=document.getElementById("out");
var ph='<span style="color:var(--text-dim,#9aa3b2)">Enter flow rate.</span>';
function calc(){
var F=pn(fEl.value),A=pn(sEl.value);
if(F==null){err.textContent="";out.innerHTML=ph;return}
A=A==null?45:A;
if(!isFinite(F)||!isFinite(A)||F<=0||A<=0){err.textContent="Enter valid positive values.";out.innerHTML=ph;return}
if(A>=180){err.textContent="Spread angle must be under 180 degrees.";out.innerHTML=ph;return}
err.textContent="";
var rad=A*Math.PI/180;
var spreadRad=F/Math.tan(rad/2)*2;
var spread=Math.max(spreadRad*100,30);
var blockLen=Math.max(spread/2,40);
var blockW=blockLen*0.6;
var html='<div class="big">'+rnd(blockLen,0)+' cm</div>';
html+=row("Flow rate",rnd(F,2)+" L/s");
html+=row("Spread angle",rnd(A,0)+"°");
html+=row("Water spread",rnd(spread,0)+" cm");
html+=row("Block length",rnd(blockLen,0)+" cm");
html+=row("Block width",rnd(blockW,0)+" cm");
out.innerHTML=html;
}
[fEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
