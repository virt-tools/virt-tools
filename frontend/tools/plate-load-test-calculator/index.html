<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Plate Load Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Plate Load Test Calculator</h1>
<p>Calculate subgrade reaction modulus and contact pressure from plate load test readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">kN</div></div>
<div class="field"><label class="f" for="in-set">Settlement</label><input type="text" id="in-set" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-dia">Plate diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lE=document.getElementById("in-load"),sE=document.getElementById("in-set"),dE=document.getElementById("in-dia"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=parseFloat(lE.value),S=parseFloat(sE.value),D=parseFloat(dE.value);
if(isNaN(L)||isNaN(S)||isNaN(D))return;
if(L<=0||S<=0||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=Math.PI*Math.pow(D/2,2)/1e6;
var q=L/area;
var ks=q/(S/1000);
if(!isFinite(q*10)||!isFinite(ks)||!isFinite(area*1e6)){err.textContent="Values are too large.";return}
var html='<div class="big">'+Math.round(ks)+' kPa/m</div>';
html+=row("Subgrade reaction ks",Math.round(ks)+' kPa/m');
html+=row("Contact pressure",Math.round(q*10)/10+' kPa');
html+=row("Plate area",Math.round(area*1e6)/100+' cm²');
out.innerHTML=html;
}
[lE,sE,dE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
