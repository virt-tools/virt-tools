<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Escape / Unescape — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
label{display:block;color:#8b949e;font-size:.85em;margin:10px 0 4px}
textarea,input{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px;width:100%;box-sizing:border-box;font-family:monospace;font-size:13px}
textarea{min-height:120px;resize:vertical}
select{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:6px;font-size:14px}
button{background:#1e3a5f;color:#c9d1d9;border:1px solid #58a6ff;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:.9em;margin-top:10px}
button:hover{background:#264f7d}
.row{display:flex;gap:10px;margin-top:10px;align-items:center}
.row label{margin:0}
.output{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-top:14px;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-all;min-height:60px}
.note{color:#8b949e;font-size:.8em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>String Escape / Unescape</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Escape or unescape strings for JS, JSON, HTML, URL, and regex. 100% client-side.</p>
<div class="row">
<label>Mode:</label>
<select id="mode" aria-label="Mode">
<option value="js-escape">JS Escape</option>
<option value="js-unescape">JS Unescape</option>
<option value="html-escape">HTML Escape</option>
<option value="html-unescape">HTML Unescape</option>
<option value="url-escape">URL Encode</option>
<option value="url-unescape">URL Decode</option>
<option value="regex-escape">Regex Escape</option>
</select>
</div>
<label>Input</label>
<textarea id="input" placeholder="Enter text..." aria-label="Enter Text..."></textarea>
<button onclick="convert()" type="button">Convert</button>
<label>Output</label>
<div class="output" id="output">—</div>
<button onclick="copyOut()" type="button">Copy Output</button>
<p class="note">All processing happens in your browser.</p>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function convert(){
  const v=document.getElementById('input').value;
  const mode=document.getElementById('mode').value;
  let out='';
  try{
    switch(mode){
      case 'js-escape':
        out=v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t').replace(/\0/g,'\\0');
        break;
      case 'js-unescape':
        out=v.replace(/\\(.)/g,(_,c)=>c==='n'?'\n':c==='r'?'\r':c==='t'?'\t':c==='0'?'\0':c);
        break;
      case 'html-escape':
        out=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        break;
      case 'html-unescape':
        out=v.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&#x27;/g,"'");
        break;
      case 'url-escape':
        out=encodeURIComponent(v);
        break;
      case 'url-unescape':
        out=decodeURIComponent(v);
        break;
      case 'regex-escape':
        out=v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        break;
    }
  }catch(e){out='Error: '+e.message;}
  document.getElementById('output').textContent=out;
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  navigator.clipboard.writeText(t).then(()=>{const b=event.target;b.textContent='Copied!';setTimeout(()=>b.textContent='Copy Output',1500);}).catch(()=>{});
}
</script>
</body>
</html>
