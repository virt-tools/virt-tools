<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking &amp; Recipe Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Cooking &amp; Recipe Converter</h1>
<p class="subtitle">Convert between cups, tablespoons, teaspoons, fluid ounces, milliliters, grams (for common ingredients), ounces, and pounds. Scale recipes up or down.</p>
<div class="tool-layout">
<div class="controls">
<h3>Convert</h3>
<label>Value <input type="number" id="val" value="1" step="0.01" min="0"></label>
<label>From Unit
<select id="from">
<option value="cup">Cup</option>
<option value="tbsp">Tablespoon</option>
<option value="tsp">Teaspoon</option>
<option value="floz">Fluid Ounce</option>
<option value="ml">Milliliter</option>
<option value="liter">Liter</option>
<option value="pint">Pint</option>
<option value="quart">Quart</option>
<option value="gallon">Gallon</option>
</select></label>
<label>To Unit
<select id="to">
<option value="cup">Cup</option>
<option value="tbsp">Tablespoon</option>
<option value="tsp">Teaspoon</option>
<option value="floz">Fluid Ounce</option>
<option value="ml" selected>Milliliter</option>
<option value="liter">Liter</option>
<option value="pint">Pint</option>
<option value="quart">Quart</option>
<option value="gallon">Gallon</option>
</select></label>
<hr>
<h3>Weight by Ingredient</h3>
<label>Ingredient
<select id="ingredient">
<option value="flour">All-Purpose Flour</option>
<option value="sugar">Granulated Sugar</option>
<option value="brown_sugar">Brown Sugar</option>
<option value="butter">Butter</option>
<option value="water">Water</option>
<option value="milk">Milk</option>
<option value="oil">Vegetable Oil</option>
<option value="honey">Honey</option>
<option value="salt">Salt</option>
<option value="rice">Rice</option>
<option value="cocoa">Cocoa Powder</option>
<option value="oats">Oats</option>
</select></label>
<label>Cups <input type="number" id="cups" value="1" step="0.25" min="0"></label>
<hr>
<h3>Recipe Scaler</h3>
<label>Original Servings <input type="number" id="origServings" value="4" min="1"></label>
<label>Desired Servings <input type="number" id="newServings" value="6" min="1"></label>
<label>Recipe (one ingredient per line)
<textarea id="recipe" rows="6">2 cups flour
1 cup sugar
1/2 cup butter
2 eggs
1 tsp vanilla</textarea></label>
</div>
<div class="results" id="results"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const val=document.getElementById('val'),from=document.getElementById('from'),to=document.getElementById('to');
const ingredient=document.getElementById('ingredient'),cups=document.getElementById('cups');
const origServings=document.getElementById('origServings'),newServings=document.getElementById('newServings'),recipe=document.getElementById('recipe');
const results=document.getElementById('results');
const toMl={cup:236.588,tbsp:14.787,tsp:4.929,floz:29.574,ml:1,liter:1000,pint:473.176,quart:946.353,gallon:3785.41};
const gPerCup={flour:120,sugar:200,brown_sugar:220,butter:227,water:236.588,milk:240,oil:218,honey:340,salt:273,rice:200,cocoa:85,oats:90};
const units=['cup','tbsp','tsp','floz','ml'];
function parseFrac(s){
s=s.trim();
if(s.includes('/')){const[s2]=s.split(/\s+/);const[n,d]=s.split('/');return parseFloat(n)/parseFloat(d);}
const parts=s.split(/\s+/);
if(parts.length===2&&parts[1].includes('/')){const[n,d]=parts[1].split('/');return parseFloat(parts[0])+parseFloat(n)/parseFloat(d);}
return parseFloat(s)||0;
}
function convert(){
const v=parseFloat(val.value)||0,f=from.value,t=to.value;
const ml=v*toMl[f];const result=ml/toMl[t];
results.innerHTML='<h3>Volume Conversion</h3>'+
'<div class="stat-row"><span>'+v+' '+f+'</span><span>= '+result.toFixed(3)+' '+t+'</span></div>'+
'<h3 style="margin-top:1.5rem;">Ingredient Weight</h3>'+
'<div class="stat-row"><span>'+cups.value+' cup '+ingredient.options[ingredient.selectedIndex].text+'</span><span>= '+((parseFloat(cups.value)||0)*gPerCup[ingredient.value]).toFixed(1)+' g</span></div>';
const scale=parseInt(newServings.value)/parseInt(origServings.value);
const lines=recipe.value.split('\n').filter(l=>l.trim());
let scaledHtml='<h3 style="margin-top:1.5rem;">Scaled Recipe ('+newServings.value+' servings, '+scale.toFixed(2)+'×)</h3>';
lines.forEach(line=>{
  const m=line.match(/^([\d\s\/]+)\s+(.*)/);
  if(m){
    const amt=parseFrac(m[1]);const scaled=amt*scale;
    let disp=scaled.toFixed(scaled<1?3:2);
    if(scaled%1===0)disp=scaled.toFixed(0);
    scaledHtml+='<div class="stat-row"><span>'+disp+'</span><span>'+m[2].trim()+'</span></div>';
  }else{
    scaledHtml+='<div class="stat-row"><span></span><span>'+line.trim()+'</span></div>';
  }
});
results.innerHTML+=scaledHtml;
}
[val,from,to,ingredient,cups,origServings,newServings,recipe].forEach(el=>el.addEventListener('input',convert));
convert();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:300px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.controls input,.controls select,.controls textarea{padding:.5rem;border:1px solid #ddd;border-radius:8px;font-size:1rem;}
.results{flex:1;min-width:300px;}
.stat-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #eee;}
hr{width:100%;border:none;border-top:1px solid #ddd;margin:.5rem 0;}
</style>
</body>
</html>
