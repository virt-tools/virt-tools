<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Rotating Text Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:3rem 1rem;min-height:150px;display:flex;align-items:center;justify-content:center;font-family:monospace}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔄 CSS Rotating Text Generator</h1>
<p>Create CSS rotating/cycling text animations. 4 styles, adjustable speed, colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="vertical">Vertical Slide</option><option value="fade">Fade</option><option value="flip">3D Flip</option><option value="typewriter">Typewriter</option></select></div>
<div class="ctrl-row"><label>Words (comma-sep)</label><input type="text" id="words" value="awesome,creative,beautiful,stunning" style="width:300px" aria-label="Words"></div>
<div class="ctrl-row"><label>Duration (s)</label><input type="range" id="dur" min="1" max="10" step="0.5" value="3" style="width:200px" aria-label="Dur"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="tcolor" value="#667eea" aria-label="Tcolor"></div>
<div class="ctrl-row"><label>Prefix Text</label><input type="text" id="prefix" value="virt.tools is " style="width:200px" aria-label="Prefix"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="14" max="48" value="32" style="width:200px" aria-label="Fsize"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var ws=document.getElementById('words').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
var dur=parseFloat(document.getElementById('dur').value);
var tc=document.getElementById('tcolor').value;
var pf=document.getElementById('prefix').value;
var fs=parseInt(document.getElementById('fsize').value);
var n=ws.length;
var totalDur=dur*n;
var html='<div class="rt-wrap"><span class="rt-prefix">'+pf+'</span><span class="rt-rotate">';
ws.forEach(function(w,i){html+='<span class="rt-word'+(i===0?' active':'')+'">'+w+'</span>'});
html+='</span></div>';
var css='.rt-wrap{font-size:'+fs+'px;font-family:sans-serif;font-weight:700;display:inline-flex;align-items:center}\n';
css+='.rt-prefix{color:#eee}\n';
css+='.rt-rotate{display:inline-block;position:relative;height:'+fs+'px;overflow:hidden;min-width:100px}\n';
css+='.rt-word{position:absolute;left:0;top:0;white-space:nowrap;color:'+tc+';opacity:0\n';
if(st==='vertical'){
css+=';animation:rt-vert '+totalDur+'s ease infinite}\n';
css+='@keyframes rt-vert{0%,5%{transform:translateY(100%);opacity:0}10%,25%{transform:translateY(0);opacity:1}30%,95%{transform:translateY(-100%);opacity:0}100%{transform:translateY(100%);opacity:0}}\n';
ws.forEach(function(w,i){var d=(i/n)*100;css+='.rt-word:nth-child('+(i+1)+'){animation-delay:'+(-totalDur+i*dur)+'s}\n'});
}else if(st==='fade'){
css+=';animation:rt-fade '+totalDur+'s ease infinite}\n';
css+='@keyframes rt-fade{0%,5%{opacity:0}10%,25%{opacity:1}30%,95%{opacity:0}100%{opacity:0}}\n';
ws.forEach(function(w,i){var d=(i/n)*100;css+='.rt-word:nth-child('+(i+1)+'){animation-delay:'+(-totalDur+i*dur)+'s}\n'});
}else if(st==='flip'){
css+=';transform-style:preserve-3d;animation:rt-flip '+totalDur+'s ease infinite}\n';
css+='@keyframes rt-flip{0%,5%{transform:rotateX(90deg);opacity:0}10%,25%{transform:rotateX(0);opacity:1}30%,95%{transform:rotateX(-90deg);opacity:0}100%{transform:rotateX(90deg);opacity:0}}\n';
ws.forEach(function(w,i){css+='.rt-word:nth-child('+(i+1)+'){animation-delay:'+(-totalDur+i*dur)+'s}\n'});
}else if(st==='typewriter'){
css+=';overflow:hidden;white-space:nowrap;border-right:2px solid '+tc+';animation:rt-type '+totalDur+'s steps(20) infinite,tw-blink 1s step-end infinite}\n';
ws.forEach(function(w,i){var d=(i/n)*100;var wlen=w.length;css+='.rt-word:nth-child('+(i+1)+'){animation-delay:'+(-totalDur+i*dur)+'s}\n'});
css+='@keyframes rt-type{0%{width:0}40%{width:100%}80%{width:100%}100%{width:0}}\n';
css+='@keyframes tw-blink{0%,100%{border-color:transparent}50%{border-color:'+tc+'}}\n';
}
css+='.rt-word.active{opacity:1}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','words','dur','tcolor','prefix','fsize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
