<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Wave Divider Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;border-radius:12px;overflow:hidden}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌊 CSS Wave Divider Generator</h1>
<p>Create CSS wave/liquid SVG divider sections. 5 wave types, adjustable height/color/flip. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Wave Type</label><select id="wtype"><option value="smooth" selected>Smooth</option><option value="sharp">Sharp</option><option value="double">Double</option><option value="triple">Triple</option><option value="curve">Curve</option></select></div>
<div class="ctrl-row"><label>Top Color</label><input type="color" id="topColor" value="#667eea" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Bottom Color</label><input type="color" id="botColor" value="#0a0a12" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Height (px)</label><input type="number" id="height" value="80" min="20" max="200" style="width:80px"></div>
<div class="ctrl-row"><label>Flip</label><select id="flip"><option value="no" selected>No</option><option value="yes">Yes</option></select></div>
<div class="ctrl-row"><label>Animated</label><select id="anim"><option value="no" selected>No</option><option value="yes">Yes</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function makePath(type,h){
var H=100;
if(type==='smooth')return 'M0,'+(H-h/2)+' C50,'+(H-h)+' 150,'+(H-h)+' 200,'+(H-h/2)+' C250,'+h+' 350,'+h+' 400,'+(H-h/2)+' L400,'+H+' L0,'+H+' Z';
if(type==='sharp')return 'M0,'+(H-h/2)+' L100,'+(H-h)+' L200,'+(H-h/2)+' L300,'+(H-h)+' L400,'+(H-h/2)+' L400,'+H+' L0,'+H+' Z';
if(type==='double')return 'M0,50 Q50,'+(50-h/2)+' 100,50 T200,50 T300,50 T400,50 L400,100 L0,100 Z';
if(type==='triple')return 'M0,60 Q40,'+(60-h/2)+' 80,60 T160,60 T240,60 T320,60 T400,60 L400,100 L0,100 Z';
if(type==='curve')return 'M0,80 Q200,'+(80-h)+' 400,80 L400,100 L0,100 Z';
return '';
}
function update(){
var type=document.getElementById('wtype').value;
var tc=document.getElementById('topColor').value;
var bc=document.getElementById('botColor').value;
var h=parseInt(document.getElementById('height').value);
var flip=document.getElementById('flip').value;
var anim=document.getElementById('anim').value;
var path=makePath(type,h);
var svgId='wave-'+type;
var animClass=anim==='yes'?' wave-anim':'';
var flipTransform=flip==='yes'?' transform="rotate(180 200 50)"':'';
var html='<div class="wave-divider'+animClass+'">\n  <svg viewBox="0 0 400 100" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block">\n    <path d="'+path+'" fill="'+tc+'"'+flipTransform+'/>\n  </svg>\n</div>';
var css='.wave-divider{position:relative;width:100%}\n.wave-anim svg{animation:wave-slide 8s linear infinite}\n@keyframes wave-slide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
var pv=document.getElementById('preview');
pv.innerHTML='<div style="background:'+bc+';padding:2rem;text-align:center;color:#fff">Section A</div><div class="wave-divider'+animClass+'"><svg viewBox="0 0 400 100" preserveAspectRatio="none" style="width:100%;height:'+h+'px;display:block"><path d="'+path+'" fill="'+tc+'"'+flipTransform+'/></svg></div><div style="background:'+tc+';padding:2rem;text-align:center;color:#fff">Section B</div>';
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['wtype','topColor','botColor','height','flip','anim'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
