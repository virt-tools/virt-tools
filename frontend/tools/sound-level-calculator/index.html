<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Level Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Sound Level (dB SPL) Calculator</h1>
<p class="subtitle">Add decibel levels, calculate distance attenuation, and compare noise sources.</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="add" selected>Add Multiple Sources</option>
<option value="distance">Distance Attenuation</option>
</select>
<div id="addSection">
<div id="sources">
<div class="src-row">
<input type="number" placeholder="dB SPL" class="dbval" value="80" step="0.1" aria-label="D B Spl">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
<div class="src-row">
<input type="number" placeholder="dB SPL" class="dbval" value="85" step="0.1" aria-label="D B Spl">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
</div>
<button id="addSrc" class="secondary-btn" type="button">+ Add Source</button>
</div>
<div id="distSection" style="display:none">
<label>Source Level (dB SPL)</label>
<input type="number" id="srcDb" value="100" step="0.1" aria-label="Src Db">
<label>Reference Distance (ft)</label>
<input type="number" id="refDist" value="1" min="0.1" step="any" aria-label="Ref Dist">
<label>New Distance (ft)</label>
<input type="number" id="newDist" value="10" min="0.1" step="any" aria-label="New Dist">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{
document.getElementById('addSection').style.display=mode.value==='add'?'':'none';
document.getElementById('distSection').style.display=mode.value==='distance'?'':'none';
});
document.getElementById('addSrc').addEventListener('click',()=>{
const row=document.createElement('div');
row.className='src-row';
row.innerHTML=`<input type="number" placeholder="dB SPL" class="dbval" step="0.1" aria-label="D B Spl">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>`;
document.getElementById('sources').appendChild(row);
});
document.getElementById('calc').addEventListener('click',()=>{
if(mode.value==='add'){
const rows=document.querySelectorAll('.dbval');
let total=0;
rows.forEach(r=>{const v=parseFloat(r.value);if(!isNaN(v))total+=Math.pow(10,v/10);});
const combined=10*Math.log10(total);
const ref=Math.max(...Array.from(rows).map(r=>parseFloat(r.value)||0));
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Number of Sources:</span><span>${rows.length}</span></div>
<div class="result-row"><span>Loudest Source:</span><span>${ref} dB SPL</span></div>
<div class="result-row"><span>Combined Level:</span><span>${combined.toFixed(1)} dB SPL</span></div>
<div class="result-row"><span>Increase Over Loudest:</span><span>+${(combined-ref).toFixed(1)} dB</span></div>`;
}else{
const src=parseFloat(document.getElementById('srcDb').value)||0;
const d1=parseFloat(document.getElementById('refDist').value)||1;
const d2=parseFloat(document.getElementById('newDist').value)||1;
const newDb=src-20*Math.log10(d2/d1);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Source Level:</span><span>${src} dB SPL at ${d1} ft</span></div>
<div class="result-row"><span>New Distance:</span><span>${d2} ft</span></div>
<div class="result-row"><span>Attenuation:</span><span>${(20*Math.log10(d2/d1)).toFixed(1)} dB</span></div>
<div class="result-row"><span>New Level:</span><span>${newDb.toFixed(1)} dB SPL</span></div>`;
}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
