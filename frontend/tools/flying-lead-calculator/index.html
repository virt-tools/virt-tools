<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Flying Lead Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Flying Lead Calculator</h1>
<p>Calculate subsea flying lead length, weight, and bend radius from connection distance and hose diameter. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dist">Connection distance</label><input type="text" id="in-dist" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-dia">Hose diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-count">Hose count</label><input type="text" id="in-count" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">count</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dist"),diaE=document.getElementById("in-dia"),cE=document.getElementById("in-count"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),dia=parseFloat(diaE.value),c=parseFloat(cE.value);
if(isNaN(d)||isNaN(dia)||isNaN(c))return;
var leadLen=d*1.3+15;
var weight=leadLen*c*dia*0.3;
var bendR=dia*10;
var html='<div class="big">'+(Math.round(leadLen*10)/10)+' ft</div>';
html+=row("Lead length",Math.round(leadLen*10)/10+' ft');
html+=row("Total weight",Math.round(weight).toLocaleString()+' lb');
html+=row("Min bend radius",bendR+' in');
out.innerHTML=html;
}
[dE,diaE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
