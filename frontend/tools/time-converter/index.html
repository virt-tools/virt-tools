<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Time Converter</h1>
<p class="subtitle">Convert between seconds, minutes, hours, days, weeks, months, years, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Second (s)</option>
<option value="0.001">Millisecond (ms)</option>
<option value="0.000001">Microsecond (µs)</option>
<option value="0.000000001">Nanosecond (ns)</option>
<option value="60">Minute (min)</option>
<option value="3600">Hour (h)</option>
<option value="86400">Day (d)</option>
<option value="604800">Week (wk)</option>
<option value="2629800">Month (avg)</option>
<option value="31557600">Year (yr)</option>
<option value="1209600">Fortnight</option>
<option value="7889400">Quarter</option>
<option value="15778800">Half-year</option>
<option value="29030400">Decade</option>
<option value="290304000">Century</option>
<option value="2903040000">Millennium</option>
<option value="5034240000">Jubilee (50 yr)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Second (s)',1],['Millisecond (ms)',0.001],['Microsecond (µs)',1e-6],['Nanosecond (ns)',1e-9],['Minute (min)',60],['Hour (h)',3600],['Day (d)',86400],['Week (wk)',604800],['Fortnight',1209600],['Month (avg)',2629800],['Quarter',7889400],['Year (365d)',31536000],['Year (Julian)',31557600],['Decade',315576000],['Century',3155760000],['Millennium',31557600000],['Jubilee (50yr)',1577880000]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const s=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=s/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
