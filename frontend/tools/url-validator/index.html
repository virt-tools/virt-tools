<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.url-validator{max-width:900px;margin:0 auto;padding:2rem 1rem}
.url-validator h1{font-size:2rem;margin-bottom:.5rem}
.url-validator .sub{color:#888;margin-bottom:1.5rem}
.url-validator textarea{width:100%;min-height:120px;font-family:monospace;font-size:14px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical}
.url-validator .btn{margin-top:1rem;padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.url-validator .btn:hover{opacity:.9}
.url-validator .results{margin-top:1.5rem}
.url-validator .result{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--card-bg)}
.url-validator .result .icon{font-size:1.2rem;flex-shrink:0}
.url-validator .result .info{flex:1;min-width:0}
.url-validator .result .url{font-family:monospace;font-size:13px;word-break:break-all}
.url-validator .result .meta{font-size:12px;color:#888;margin-top:4px}
.url-validator .valid{border-color:#4ade80}
.url-validator .invalid{border-color:#f87171}
.url-validator .stats{display:flex;gap:1rem;margin-top:1rem;font-size:14px}
.url-validator .stat{padding:8px 14px;border-radius:8px;background:var(--card-bg);border:1px solid var(--border)}
.url-validator .stat strong{display:block;font-size:1.5rem}
.url-validator .stat span{color:#888}
.url-validator .valid .icon{color:#4ade80}
.url-validator .invalid .icon{color:#f87171}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="url-validator">
<h1>🔗 URL Validator</h1>
<p class="sub">Validate URLs against RFC 3986. Checks scheme, authority, path, query, and fragment.</p>
<textarea id="input" placeholder="Paste URLs (one per line)...&#10;https://example.com/path?q=1#frag&#10;ftp://files.example.org&#10;not-a-url" aria-label="Paste Urls (One Per Line)...&#10;Https://Example.Com/Path?Q=1#Frag&#10;Ftp://Files.Example.Org&#10;Not A Url"></textarea>
<button class="btn" id="check" type="button">Validate URLs</button>
<div class="stats" id="stats" style="display:none">
<div class="stat"><strong id="validCount">0</strong><span>Valid</span></div>
<div class="stat"><strong id="invalidCount">0</strong><span>Invalid</span></div>
</div>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const checkBtn=document.getElementById('check');
const results=document.getElementById('results');
const stats=document.getElementById('stats');
const validCount=document.getElementById('validCount');
const invalidCount=document.getElementById('invalidCount');

function validateURL(url){
  try{
    const u=new URL(url);
    const parts=[];
    if(u.protocol)parts.push({k:'Scheme',v:u.protocol.replace(':','')});
    if(u.hostname)parts.push({k:'Host',v:u.hostname});
    if(u.port)parts.push({k:'Port',v:u.port});
    if(u.pathname&&u.pathname!=='/')parts.push({k:'Path',v:u.pathname});
    if(u.search)parts.push({k:'Query',v:u.search});
    if(u.hash)parts.push({k:'Fragment',v:u.hash});
    return{valid:true,parts};
  }catch(e){
    return{valid:false,error:e.message};
  }
}

checkBtn.addEventListener('click',()=>{
  const lines=input.value.trim().split('\n').filter(l=>l.trim());
  if(!lines.length){results.innerHTML='<p style="color:#888">Enter at least one URL.</p>';return;}
  let valid=0,invalid=0;
  results.innerHTML='';
  lines.forEach(line=>{
    const url=line.trim();
    const r=validateURL(url);
    const div=document.createElement('div');
    div.className='result '+(r.valid?'valid':'invalid');
    if(r.valid){
      valid++;
      const meta=r.parts.map(p=>p.k+': '+p.v).join(' · ');
      div.innerHTML='<span class="icon">✓</span><div class="info"><div class="url">'+url+'</div><div class="meta">'+meta+'</div></div>';
    }else{
      invalid++;
      div.innerHTML='<span class="icon">✗</span><div class="info"><div class="url">'+url+'</div><div class="meta">'+(r.error||'Invalid URL')+'</div></div>';
    }
    results.appendChild(div);
  });
  stats.style.display='flex';
  validCount.textContent=valid;
  invalidCount.textContent=invalid;
});
})();
</script>
</body>
</html>
