<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip Simulator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Coin Flip Simulator</h1>
<p class="subtitle">Flip coins and track statistics — heads, tails, streaks, and probability convergence.</p>
<div class="input-section">
<label>Number of Flips</label>
<input type="number" id="count" value="100" min="1" max="100000" step="1" aria-label="Count">
<button id="flip" class="primary-btn" type="button">Flip Coins</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('flip').addEventListener('click',()=>{
const n=parseInt(document.getElementById('count').value)||1;
let heads=0,tails=0,streak=0,maxStreak=0,currentSide=-1;
for(let i=0;i<n;i++){
const r=Math.random()<0.5?0:1;
if(r===0)heads++;else tails++;
if(r===currentSide){streak++;if(streak>maxStreak)maxStreak=streak;}
else{streak=1;currentSide=r;}
}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Total Flips:</span><span>${n.toLocaleString()}</span></div>
<div class="result-row"><span>Heads:</span><span>${heads.toLocaleString()} (${(heads/n*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>Tails:</span><span>${tails.toLocaleString()} (${(tails/n*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>Heads/Tails Ratio:</span><span>${(heads/Math.max(tails,1)).toFixed(4)}</span></div>
<div class="result-row"><span>Longest Streak:</span><span>${maxStreak} consecutive same-side flips</span></div>
<div class="result-row"><span>Expected (50/50):</span><span>${(n/2).toFixed(0)} each</span></div>
<div class="result-row"><span>Deviation from 50%:</span><span>${Math.abs(heads/n-0.5).toFixed(6)} (${(Math.abs(heads/n-0.5)*100).toFixed(4)}%)</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
