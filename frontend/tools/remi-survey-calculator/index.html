<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>ReMi Survey Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>ReMi Survey Calculator</h1>
<p>Calculate the frequency range, maximum wavelength, and minimum array length for ReMi (refraction microtremor) surveys. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vmin">Min Vs</label><input type="text" id="in-vmin" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m/s</div></div>
<div class="field"><label class="f" for="in-vmax">Max Vs</label><input type="text" id="in-vmax" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">m/s</div></div>
<div class="field"><label class="f" for="in-dmax">Max depth</label><input type="text" id="in-dmax" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vminE=document.getElementById("in-vmin"),vmaxE=document.getElementById("in-vmax"),dmaxE=document.getElementById("in-dmax"),err=document.getElementById("err"),out=document.getElementById("out");
var PH='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var vmin=parseFloat(vminE.value),vmax=parseFloat(vmaxE.value),dmax=parseFloat(dmaxE.value);
if(isNaN(vmin)||isNaN(vmax)||isNaN(dmax)){err.textContent="";return}
if(vmin<=0||vmax<=0||dmax<=0){err.textContent="Enter valid values.";out.innerHTML=PH;return}
err.textContent="";
var fmax=vmin/(dmax*2);
var fmin=vmax/(dmax*3);
var flo=Math.min(fmin,fmax),fhi=Math.max(fmin,fmax);
var lambdaMax=vmin/fmin;
var arrLen=lambdaMax;
var html='<div class="big">'+Math.round(arrLen)+' m</div>';
html+=row("Frequency range",Math.round(flo*100)/100+' – '+Math.round(fhi*100)/100+' Hz');
html+=row("Max wavelength",Math.round(lambdaMax)+' m');
html+=row("Min array length",Math.round(arrLen)+' m');
out.innerHTML=html;
}
[vminE,vmaxE,dmaxE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
