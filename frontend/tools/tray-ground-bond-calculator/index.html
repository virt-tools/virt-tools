<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tray Ground Bond Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tray Ground Bond Calculator</h1>
<p>Calculate number of bonding jumpers, conductor size, and bonding resistance for cable tray grounding. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-seg">Tray segments</label><input type="text" id="in-seg" inputmode="numeric" autocomplete="off" placeholder="e.g. 10"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-fault">Fault current</label><input type="text" id="in-fault" inputmode="numeric" autocomplete="off" placeholder="e.g. 5000"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-time">Clearing time</label><input type="text" id="in-time" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var segEl=document.getElementById("in-seg"),faultEl=document.getElementById("in-fault"),timeEl=document.getElementById("in-time"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var SEG=parseInt(segEl.value),FC=parseInt(faultEl.value),TM=parseFloat(timeEl.value);
if(isNaN(SEG)||isNaN(FC)||isNaN(TM))return;
if(SEG<=0||FC<=0||TM<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var jumpers=SEG-1;
var cmil=FC*Math.sqrt(TM)*29.7; // simplified thermodynamic equation
var awg=cmil>133100?"4/0":cmil>85173?"3/0":cmil>53400?"2/0":cmil>33180?"1/0":cmil>20815?"1":cmil>13093?"2":cmil>8234?"4":"6";
var html='<div class="big">'+jumpers+' jumpers</div>';
html+=row("Bonding jumpers",jumpers);
html+=row("Fault current",FC+" A");
html+=row("Clearing time",TM+" s");
html+=row("Required CM",Math.round(cmil)+" kcmil");
html+=row("Min conductor",awg+" AWG");
out.innerHTML=html;
}
[segEl,faultEl,timeEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
