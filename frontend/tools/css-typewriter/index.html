<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Typewriter & Cursor Blink Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:3rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center;font-family:monospace}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
.tw-preview{font-size:28px;font-weight:700;color:#667eea}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⌨️ CSS Typewriter & Cursor Blink Generator</h1>
<p>Create CSS typewriter text and blinking cursor animations. 5 styles, adjustable speed, cursor type, colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="type-loop">Type & Loop</option><option value="type-once">Type Once</option><option value="delete-loop">Type & Delete</option><option value="multi-line">Multi-Line</option><option value="blink-only">Blink Cursor Only</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="Hello, World!" style="width:300px"></div>
<div class="ctrl-row"><label>Cursor</label><select id="cursor"><option value="block">Block</option><option value="line">Line</option><option value="underscore">Underscore</option></select></div>
<div class="ctrl-row"><label>Type Speed (s)</label><input type="range" id="tspeed" min="0.5" max="10" step="0.5" value="3" style="width:200px"></div>
<div class="ctrl-row"><label>Blink Speed (s)</label><input type="range" id="bspeed" min="0.3" max="3" step="0.1" value="1" style="width:200px"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="tcolor" value="#667eea"></div>
<div class="ctrl-row"><label>Cursor Color</label><input type="color" id="ccolor" value="#667eea"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="14" max="48" value="28" style="width:200px"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var tx=document.getElementById('text').value;
var cur=document.getElementById('cursor').value;
var ts=parseFloat(document.getElementById('tspeed').value);
var bs=parseFloat(document.getElementById('bspeed').value);
var tc=document.getElementById('tcolor').value;
var cc=document.getElementById('ccolor').value;
var fs=parseInt(document.getElementById('fsize').value);
var ch=tx.length;
var curChar=cur==='block'?'\u2588':cur==='line'?'|':'_';
var html='<div class="tw-wrap"><span class="tw-text">'+tx+'</span><span class="tw-cursor">'+curChar+'</span></div>';
var css='.tw-wrap{font-size:'+fs+'px;font-family:monospace;font-weight:700;display:inline-flex}\n';
css+='.tw-text{color:'+tc+';overflow:hidden;white-space:nowrap;border-right:0\n';
var steps=ch+1;
if(st==='type-loop'){
css+=';animation:tw-type '+ts+'s steps('+steps+') forwards infinite,tw-blink '+bs+'s step-end infinite}\n';
css+='@keyframes tw-type{0%{width:0}80%{width:'+ch+'ch}100%{width:0}}\n';
css+='@keyframes tw-blink{0%,100%{border-color:transparent}50%{border-color:'+cc+'}}\n';
css+='.tw-cursor{color:'+cc+';animation:tw-blink '+bs+'s step-end infinite}\n';
}else if(st==='type-once'){
css+=';animation:tw-type '+ts+'s steps('+steps+') forwards,tw-blink '+bs+'s step-end infinite}\n';
css+='@keyframes tw-type{0%{width:0}100%{width:'+ch+'ch}}\n';
css+='@keyframes tw-blink{0%,100%{opacity:0}50%{opacity:1}}\n';
css+='.tw-cursor{color:'+cc+';animation:tw-blink '+bs+'s step-end infinite}\n';
}else if(st==='delete-loop'){
css+=';animation:tw-type-del '+(ts*2)+'s steps('+steps+') infinite,tw-blink '+bs+'s step-end infinite}\n';
css+='@keyframes tw-type-del{0%,40%{width:0}60%{width:'+ch+'ch}100%{width:0}}\n';
css+='@keyframes tw-blink{0%,100%{opacity:0}50%{opacity:1}}\n';
css+='.tw-cursor{color:'+cc+';animation:tw-blink '+bs+'s step-end infinite}\n';
}else if(st==='multi-line'){
html='<div class="tw-wrap">'+tx.split('\\n').map(function(l,i){return '<div><span class="tw-text" style="animation:tw-type-'+i+' '+ts+'s steps('+(l.length+1)+') forwards '+((i*ts)+0.5)+'s,tw-blink '+bs+'s step-end infinite">'+l+'</span></div>'}).join('')+'</div>';
css+='@keyframes tw-blink{0%,100%{opacity:0}50%{opacity:1}}\n';
css+='.tw-text{display:inline-block;overflow:hidden;white-space:nowrap;color:'+tc+';width:0}\n';
tx.split('\\n').forEach(function(l,i){css+='@keyframes tw-type-'+i+'{0%{width:0}100%{width:'+l.length+'ch}}\n'});
css+='.tw-cursor{display:none}\n';
}else if(st==='blink-only'){
html='<div class="tw-wrap"><span class="tw-cursor">'+curChar+'</span></div>';
css+='@keyframes tw-blink{0%,100%{opacity:0}50%{opacity:1}}\n';
css+='.tw-cursor{color:'+cc+';font-size:'+fs+'px;font-family:monospace;font-weight:700;animation:tw-blink '+bs+'s step-end infinite}\n';
css+='.tw-text{display:none}\n';
}
css+='.tw-cursor{color:'+cc+';font-weight:700}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','text','cursor','tspeed','bspeed','tcolor','ccolor','fsize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
