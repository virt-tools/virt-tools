<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Volume Converter</h1>
<p class="subtitle">Convert between liters, gallons, cups, pints, quarts, tablespoons, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="0.001" selected>Liter (L)</option>
<option value="1">Cubic Meter (m³)</option>
<option value="0.000001">Milliliter (mL)</option>
<option value="0.003785412">US Gallon</option>
<option value="0.00454609">UK Gallon</option>
<option value="0.000946353">US Quart</option>
<option value="0.001136523">UK Quart</option>
<option value="0.000473176">US Pint</option>
<option value="0.000568261">UK Pint</option>
<option value="0.000236588">US Cup</option>
<option value="0.000284131">UK Cup</option>
<option value="0.000014787">US Tablespoon</option>
<option value="0.000015">UK Tablespoon</option>
<option value="0.000004929">US Teaspoon</option>
<option value="0.000005919">UK Teaspoon</option>
<option value="0.000016387">Cubic Inch (in³)</option>
<option value="0.02831685">Cubic Foot (ft³)</option>
<option value="0.76455486">Cubic Yard (yd³)</option>
<option value="0.000029574">US Fluid Ounce</option>
<option value="0.001">Kiloliter (kL)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Cubic Meter (m³)',1],['Liter (L)',0.001],['Milliliter (mL)',1e-6],['Kiloliter (kL)',1],['US Gallon',0.003785412],['UK Gallon',0.00454609],['US Quart',0.000946353],['UK Quart',0.001136523],['US Pint',0.000473176],['UK Pint',0.000568261],['US Cup',0.000236588],['UK Cup',0.000284131],['US Tablespoon',1.4787e-5],['UK Tablespoon',1.5e-5],['US Teaspoon',4.929e-6],['UK Teaspoon',5.919e-6],['Cubic Inch (in³)',1.6387e-5],['Cubic Foot (ft³)',0.02831685],['US Fluid Ounce',2.9574e-5],['Cubic Yard (yd³)',0.76455486]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const m3=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=m3/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
