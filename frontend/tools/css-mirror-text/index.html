<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mirror/Reflect Text Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#222;border-radius:12px;overflow:hidden;position:relative;height:300px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🪞 CSS Mirror/Reflect Text Generator</h1>
<p>Create CSS mirrored text with reflection, flip, or water effect. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="virt.tools" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fs" min="20" max="80" step="1" value="48" style="width:200px" aria-label="Fs"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="tc" value="#667eea" aria-label="Tc"></div>
<div class="ctrl-row"><label>Mode</label><select id="mode" aria-label="Mode"><option value="reflect">Reflect (below)</option><option value="flip-x">Flip Horizontal</option><option value="flip-y">Flip Vertical</option><option value="water">Water Ripple</option></select></div>
<div class="ctrl-row"><label>Opacity</label><input type="range" id="op" min="0" max="100" step="1" value="40" style="width:200px" aria-label="Op"></div>
<div class="ctrl-row"><label>Distance</label><input type="range" id="dist" min="0" max="30" step="1" value="4" style="width:200px" aria-label="Dist"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var t=document.getElementById('text').value||' ';
var fs=document.getElementById('fs').value;
var tc=document.getElementById('tc').value;
var mode=document.getElementById('mode').value;
var op=parseInt(document.getElementById('op').value)/100;
var dist=document.getElementById('dist').value;
var html='<div class="mirror-wrap">\n  <div class="mirror-text">'+t+'</div>\n  <div class="mirror-reflection">'+t+'</div>\n</div>';
var transform='';
if(mode==='flip-x')transform='scaleX(-1)';
if(mode==='flip-y')transform='scaleY(-1)';
if(mode==='water')transform='scaleY(-1) skewX(10deg)';
var css='.mirror-wrap{text-align:center;font-size:'+fs+'px;font-weight:bold;color:'+tc+';font-family:Arial,sans-serif}\n';
css+='.mirror-text{text-shadow:0 0 20px '+tc+'88}\n';
css+='.mirror-reflection{transform:'+transform+';opacity:'+op+';margin-top:'+dist+'px';
if(mode==='reflect'){
css+=';mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0));-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,1),rgba(0,0,0,0))';
}
if(mode==='water'){
css+=';filter:blur(1px)';
}
css+='}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','fs','tc','mode','op','dist'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
