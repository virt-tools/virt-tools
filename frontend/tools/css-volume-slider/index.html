<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Volume Slider Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:180px;display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔊 CSS Volume Slider Generator</h1>
<p>Create CSS custom volume control sliders. 4 styles, adjustable colors/size/value, mute toggle. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="horizontal" selected>Horizontal</option><option value="vertical">Vertical</option><option value="knob">Knob</option><option value="waveform">Waveform</option></select></div>
<div class="ctrl-row"><label>Value</label><input type="range" id="value" value="60" min="0" max="100" style="width:200px"><span id="valueVal">60%</span></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option></select></div>
<div class="ctrl-row"><label>Track Color</label><input type="color" id="trackColor" value="#333" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Fill Color</label><input type="color" id="fillColor" value="#667eea" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Show Mute</label><input type="checkbox" id="showMute" checked></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var val=parseInt(document.getElementById('value').value);
document.getElementById('valueVal').textContent=val+'%';
var size=document.getElementById('size').value;
var tc=document.getElementById('trackColor').value;
var fc=document.getElementById('fillColor').value;
var mute=document.getElementById('showMute').checked;
var sz={sm:120,md:180,lg:240}[size];
var html='',css='';
if(style==='horizontal'){
html='<div class="vol-slider horizontal">\n'+(mute?'  <button class="vol-mute">🔇</button>\n':'')+'  <div class="vol-track">\n    <div class="vol-fill" style="width:'+val+'%"></div>\n    <div class="vol-knob" style="left:'+val+'%"></div>\n  </div>\n  <span class="vol-value">'+val+'%</span>\n</div>';
css='.vol-slider.horizontal{display:flex;align-items:center;gap:10px}\n.vol-track{position:relative;width:'+sz+'px;height:6px;background:'+tc+';border-radius:3px;cursor:pointer}\n.vol-fill{position:absolute;left:0;top:0;height:100%;background:'+fc+';border-radius:3px;transition:width .15s}\n.vol-knob{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:'+fc+';border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:left .15s}\n.vol-value{font-size:.85rem;color:#aaa;min-width:40px}\n.vol-mute{background:none;border:none;cursor:pointer;font-size:1.2rem}\n';
}else if(style==='vertical'){
html='<div class="vol-slider vertical">\n  <div class="vol-track">\n    <div class="vol-fill" style="height:'+val+'%"></div>\n    <div class="vol-knob" style="bottom:'+val+'%"></div>\n  </div>\n'+(mute?'  <button class="vol-mute">🔇</button>':'')+'\n</div>';
css='.vol-slider.vertical{display:flex;flex-direction:column;align-items:center;gap:10px}\n.vol-track{position:relative;width:6px;height:'+sz+'px;background:'+tc+';border-radius:3px;cursor:pointer}\n.vol-fill{position:absolute;bottom:0;left:0;width:100%;background:'+fc+';border-radius:3px;transition:height .15s}\n.vol-knob{position:absolute;left:50%;transform:translate(-50%,50%);width:16px;height:16px;background:'+fc+';border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:bottom .15s}\n.vol-mute{background:none;border:none;cursor:pointer;font-size:1.2rem}\n';
}else if(style==='knob'){
html='<div class="vol-slider knob">\n  <div class="vol-knob-control" style="--angle:'+(-135+val*2.7)+'deg">\n    <div class="vol-knob-inner"></div>\n  </div>\n  <span class="vol-value">'+val+'%</span>\n</div>';
css='.vol-slider.knob{display:flex;flex-direction:column;align-items:center;gap:8px}\n.vol-knob-control{width:'+sz*0.6+'px;height:'+sz*0.6+'px;border-radius:50%;background:'+tc+';border:3px solid '+fc+';position:relative;transform:rotate(var(--angle));cursor:grab}\n.vol-knob-inner{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:6px;height:20%;background:'+fc+';border-radius:3px}\n.vol-value{font-size:.85rem;color:#aaa}\n';
}else if(style==='waveform'){
html='<div class="vol-slider waveform">\n'+(mute?'  <button class="vol-mute">🔇</button>\n':'')+'  <div class="vol-wave">\n';
for(var i=0;i<12;i++)html+='    <div class="wave-bar'+(i<Math.round(val/100*12)?' active':'')+'" style="--delay:'+(i*0.05)+'s"></div>\n';
html+='  </div>\n  <span class="vol-value">'+val+'%</span>\n</div>';
css='.vol-slider.waveform{display:flex;align-items:center;gap:10px}\n.vol-wave{display:flex;align-items:center;gap:2px;height:32px}\n.wave-bar{width:3px;height:6px;background:'+tc+';border-radius:2px;transition:height .2s,background .2s;animation:wave-bounce 1s infinite alternate;animation-delay:var(--delay)}\n.wave-bar.active{background:'+fc+';height:24px}\n@keyframes wave-bounce{from{height:6px}to{height:28px}}\n.vol-value{font-size:.85rem;color:#aaa;min-width:40px}\n.vol-mute{background:none;border:none;cursor:pointer;font-size:1.2rem}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','value','size','trackColor','fillColor','showMute'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
