<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Impedance Compensation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Impedance Compensation Calculator</h1>
<p>Calculate compensated impedance for distance relays considering line mutual coupling and zero-sequence compensation. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-z1">Positive seq Z</label><input type="text" id="in-z1" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-z0">Zero seq Z</label><input type="text" id="in-z0" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-k0">K0 factor</label><input type="text" id="in-k0" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.0"><div class="unit">×</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var z1E=document.getElementById("in-z1"),z0E=document.getElementById("in-z0"),kE=document.getElementById("in-k0"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var z1=parseFloat(z1E.value),z0=parseFloat(z0E.value),k0=parseFloat(kE.value);
if(isNaN(z1)||isNaN(z0)||isNaN(k0))return;
if(z1<=0||z0<0){err.textContent="Positive-sequence impedance must be positive; zero-sequence must be non-negative.";return}
err.textContent="";
var k0c=(z0-z1)/(3*z1);
var zComp=z1*(1+k0c*k0);
var html='<div class="big">'+(Math.round(zComp*100)/100)+' Ω</div>';
html+=row("Compensated impedance",Math.round(zComp*100)/100+' Ω');
html+=row("K0 compensation factor",k0c.toFixed(3));
html+=row("Z0/Z1 ratio",(z0/z1).toFixed(2));
out.innerHTML=html;
}
[z1E,z0E,kE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
