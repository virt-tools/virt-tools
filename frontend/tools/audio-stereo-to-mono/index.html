<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stereo to Mono Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Stereo to Mono Converter</h1>
<p class="subtitle">Downmix stereo audio to mono with adjustable L/R balance. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="process" class="primary-btn" type="button">Convert & Download</button>
</div>
<div class="controls">
<label>L/R Balance: <input type="range" id="balance" min="0" max="1" value="0.5" step="0.05"><span id="bv">0.5</span></label>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const el=document.getElementById('balance');
const sp=document.getElementById('bv');
el.addEventListener('input',()=>sp.textContent=el.value);
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const sr=buf.sampleRate;
const balance=parseFloat(document.getElementById('balance').value);
const lGain=1-balance;
const rGain=balance;
const off=new OfflineAudioContext(1,buf.length,sr);
const nb=off.createBuffer(1,buf.length,sr);
const out=nb.getChannelData(0);
const l=buf.getChannelData(0);
const r=buf.numberOfChannels>1?buf.getChannelData(1):l;
for(let i=0;i<buf.length;i++)out[i]=l[i]*lGain+r[i]*rGain;
const src=off.createBufferSource();src.buffer=nb;
src.connect(off.destination);src.start();
const rendered=await off.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mono.wav';a.click();
st.textContent='Done! Downloaded as mono.wav';
audioCtx.close();
});
function audioBufferToWav(b){
const n=b.length,sr=b.sampleRate;
const data=b.getChannelData(0);
const buf=new ArrayBuffer(44+n*2);
const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,data[i]*32767)),true);
return buf;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
