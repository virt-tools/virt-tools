<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Downhole Seismic Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Downhole Seismic Calculator</h1>
<p>Calculate interval shear wave velocity from downhole seismic test depth interval and travel time difference. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d1">Depth 1</label><input type="text" id="in-d1" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-d2">Depth 2</label><input type="text" id="in-d2" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-t1">Travel time 1</label><input type="text" id="in-t1" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ms</div></div>
<div class="field"><label class="f" for="in-t2">Travel time 2</label><input type="text" id="in-t2" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">ms</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var d1E=document.getElementById("in-d1"),d2E=document.getElementById("in-d2"),t1E=document.getElementById("in-t1"),t2E=document.getElementById("in-t2"),err=document.getElementById("err"),out=document.getElementById("out");
var PROMPT='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var d1=parseFloat(d1E.value),d2=parseFloat(d2E.value),t1=parseFloat(t1E.value),t2=parseFloat(t2E.value);
if(isNaN(d1)||isNaN(d2)||isNaN(t1)||isNaN(t2)){err.textContent="";out.innerHTML=PROMPT;return}
var dd=d2-d1,dt=t2-t1;
if(dd<=0||dt<=0){err.textContent="Depth and time must increase.";out.innerHTML=PROMPT;return}
err.textContent="";
var vs=dd/(dt/1000);
var html='<div class="big">'+Math.round(vs)+' m/s</div>';
html+=row("Interval velocity Vs",Math.round(vs)+' m/s');
html+=row("Depth interval",Math.round(dd*100)/100+' m');
html+=row("Time interval",Math.round(dt*100)/100+' ms');
out.innerHTML=html;
}
[d1E,d2E,t1E,t2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
