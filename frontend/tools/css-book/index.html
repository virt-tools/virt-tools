<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Book Cover Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📖 CSS Book Cover Generator</h1>
<p>Create CSS book cover with spine, title, author, and 4 themes. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Theme</label><select id="theme" aria-label="Theme"><option value="classic">Classic</option><option value="vintage">Vintage</option><option value="modern">Modern</option><option value="fantasy">Fantasy</option></select></div>
<div class="ctrl-row"><label>Title</label><input type="text" id="title" value="The Lost Realm" style="width:300px" aria-label="Title"></div>
<div class="ctrl-row"><label>Author</label><input type="text" id="author" value="J. Author" style="width:300px" aria-label="Author"></div>
<div class="ctrl-row"><label>Width</label><input type="range" id="sz" min="120" max="280" step="5" value="180" style="width:200px" aria-label="Sz"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function escape(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function update(){
var theme=document.getElementById('theme').value;
var title=document.getElementById('title').value||'Title';
var author=document.getElementById('author').value||'Author';
var sz=parseInt(document.getElementById('sz').value);
var themes={classic:{cover:'#8B4513',spine:'#5C2E0A',text:'#FFD700',accent:'#DAA520'},vintage:{cover:'#4A5D23',spine:'#2E3D15',text:'#F5E6C8',accent:'#C0A062'},modern:{cover:'#2C3E50',spine:'#1A252F',text:'#ECF0F1',accent:'#3498DB'},fantasy:{cover:'#4A148C',spine:'#2E0E5A',text:'#E1BEE7',accent:'#FFD700'}};
var t=themes[theme];
var html='<div class="book">\n  <div class="spine"></div>\n  <div class="cover">\n    <div class="accent-line"></div>\n    <h3 class="book-title">'+escape(title)+'</h3>\n    <div class="accent-line bottom"></div>\n    <p class="book-author">'+escape(author)+'</p>\n  </div>\n</div>';
var css='.book{display:flex;position:relative;width:'+sz+'px;height:'+(sz*1.4)+'px;box-shadow:4px 4px 15px rgba(0,0,0,0.5)}\n';
css+='.spine{width:'+(sz*0.12)+'px;background:'+t.spine+';border-right:2px solid rgba(0,0,0,0.3);border-radius:2px 0 0 2px}\n';
css+='.cover{flex:1;background:'+t.cover+';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;border-radius:0 4px 4px 0;position:relative}\n';
css+='.accent-line{width:60%;height:2px;background:'+t.accent+';margin:0.5rem 0}\n';
css+='.accent-line.bottom{margin-top:auto}\n';
css+='.book-title{color:'+t.text+';font-family:Georgia,serif;font-size:'+(sz*0.12)+'px;text-align:center;margin:0.5rem 0;font-weight:bold}\n';
css+='.book-author{color:'+t.text+';font-size:'+(sz*0.07)+'px;text-align:center;opacity:0.8;margin:0.5rem 0}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['theme','title','author','sz'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
