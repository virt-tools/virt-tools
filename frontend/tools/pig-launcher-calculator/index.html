<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pig Launcher Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pig Launcher Calculator</h1>
<p>Calculate pig launcher barrel length, diameter, and volume from pipe size and pig length. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Pipe diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-piglen">Pig length</label><input type="text" id="in-piglen" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-press">Design pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 1440"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),pE=document.getElementById("in-piglen"),prE=document.getElementById("in-press"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),p=parseFloat(pE.value),pr=parseFloat(prE.value);
if(isNaN(d)||isNaN(p)||isNaN(pr))return;
var barrelD=d*1.5;
var barrelL=p*3+d*2;
var vol=Math.PI*barrelD*barrelD*barrelL/4/1728;
var html='<div class="big">'+(Math.round(barrelL*10)/10)+' in</div>';
html+=row("Barrel diameter",Math.round(barrelD*10)/10+' in');
html+=row("Barrel length",Math.round(barrelL*10)/10+' in');
html+=row("Barrel volume",Math.round(vol*10)/10+' ft³');
out.innerHTML=html;
}
[dE,pE,prE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
