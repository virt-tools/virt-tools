<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Castle Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(180deg,#1a1a4a,#2a3a6a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏰 CSS Castle Generator</h1>
<p>Create CSS castle with towers, walls, gate, and flags. 3 styles, adjustable colors/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Castle Style</label><select id="style" aria-label="Style"><option value="medieval">Medieval</option><option value="fantasy">Fantasy</option><option value="sand">Sand Castle</option></select></div>
<div class="ctrl-row"><label>Wall Color</label><input type="color" id="wallColor" value="#7a7a8a" style="width:60px;height:36px" aria-label="Wall Color"></div>
<div class="ctrl-row"><label>Roof Color</label><input type="color" id="roofColor" value="#c0392b" style="width:60px;height:36px" aria-label="Roof Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="280" value="180" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var wc=document.getElementById('wallColor').value;
var rc=document.getElementById('roofColor').value;
var sz=parseInt(document.getElementById('size').value);
var tw=sz*0.25,th=sz*0.6,wh=sz*0.45;
var html='<div class="castle c-'+st+'">\n  <div class="tower t-left"><div class="troof"></div><div class="flag"></div></div>\n  <div class="wall"><div class="gate"></div></div>\n  <div class="tower t-right"><div class="troof"></div><div class="flag"></div></div>\n</div>';
var css='.castle{position:relative;display:flex;align-items:flex-end;gap:0}\n';
css+='.tower{width:'+tw+'px;height:'+th+'px;background:'+wc+';position:relative;border-radius:4px 4px 0 0}\n';
css+='.troof{position:absolute;top:-'+(sz*0.18)+'px;left:-'+(tw*0.1)+'px;width:'+(tw*1.2)+'px;height:'+(sz*0.18)+'px;background:'+rc+';clip-path:polygon(0 100%,50% 0,100% 100%)}\n';
css+='.flag{position:absolute;top:-'+(sz*0.3)+'px;left:50%;width:'+(sz*0.1)+'px;height:'+(sz*0.12)+'px;background:'+rc+';clip-path:polygon(0 0,100% 0,100% 60%,0 100%);transform:translateX(-50%)}\n';
css+='.flag::before{content:"";position:absolute;bottom:-'+(sz*0.12)+'px;left:50%;width:2px;height:'+(sz*0.12)+'px;background:#333;transform:translateX(-50%)}\n';
css+='.wall{width:'+(sz*0.5)+'px;height:'+wh+'px;background:'+wc+';position:relative;border-radius:0}\n';
css+='.wall::before{content:"";position:absolute;top:-8px;left:0;right:0;height:12px;background:'+wc+';background:repeating-linear-gradient(90deg,'+wc+' 0,'+wc+' 12px,'+(st==='sand'?'#e8d5a0':wc==='var(--wc)'?'#6a6a7a':wc)+' 12px,18px)}\n';
css+='.gate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(sz*0.15)+'px;height:'+(sz*0.25)+'px;background:#2a2a2a;border-radius:50% 50% 0 0}\n';
if(st==='fantasy'){
css+='.castle.c-fantasy .troof{background:linear-gradient(135deg,'+rc+',#e67e22)}\n';
css+='.castle.c-fantasy .tower{background:linear-gradient(180deg,#fff,'+wc+')}\n';
}else if(st==='sand'){
css+='.castle.c-sand .tower,.castle.c-sand .wall{background:#e8d5a0;box-shadow:inset 0 -10px rgba(180,150,80,0.3)}\n';
css+='.castle.c-sand .troof{background:#d4a847}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','wallColor','roofColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
