<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Channel Capacity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Channel Capacity Calculator</h1>
<p>Calculate Shannon channel capacity from bandwidth and SNR. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-bw">Bandwidth</label><input type="text" id="in-bw" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">MHz</div></div>
<div class="field"><label class="f" for="in-snr">SNR</label><input type="text" id="in-snr" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">dB</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var bwE=document.getElementById("in-bw"),snrE=document.getElementById("in-snr"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var bw=parseFloat(bwE.value),snr=parseFloat(snrE.value);
err.textContent="";
if(isNaN(bw)||isNaN(snr)){reset();return}
if(!isFinite(bw)||!isFinite(snr)||bw<0){err.textContent="Bandwidth must be zero or positive, and SNR must be a finite number.";reset();return}
var linear=Math.pow(10,snr/10);
var capacity=bw*1e6*Math.log2(1+linear);
var capMbps=capacity/1e6;
var html='<div class="big">'+(Math.round(capMbps*100)/100)+' Mbps</div>';
html+=row("Channel capacity",Math.round(capMbps*100)/100+' Mbps');
html+=row("Bandwidth",bw+' MHz');
html+=row("SNR",snr+' dB');
html+=row("SNR (linear)",Math.round(linear*100)/100);
out.innerHTML=html;
}
[bwE,snrE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
