<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playfair Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.playfair{max-width:700px;margin:0 auto;padding:2rem 1rem}
.playfair h1{font-size:2rem;margin-bottom:.5rem}
.playfair .sub{color:#888;margin-bottom:1.5rem}
.playfair textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.playfair input[type=text]{width:100%;font-size:15px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.playfair .row{display:flex;gap:1rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.playfair label{font-size:14px;white-space:nowrap}
.playfair select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.playfair .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.playfair .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.playfair .matrix{margin-top:1rem;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px}
.playfair .matrix div{text-align:center;padding:10px;border:1px solid var(--border);border-radius:4px;font-family:monospace;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="playfair">
<h1>🔐 Playfair Cipher</h1>
<p class="sub">Encode and decode text using the Playfair cipher with a 5×5 key square.</p>
<textarea id="input" placeholder="Enter text to encode or decode..." aria-label="Enter Text To Encode Or Decode..."></textarea>
<div class="row">
<label>Key:</label>
<input type="text" id="key" value="KEYWORD" style="flex:1" aria-label="Key">
<label>Mode:</label>
<select id="mode" aria-label="Mode"><option value="encode">Encode</option><option value="decode">Decode</option></select>
<button class="btn" id="run" type="button">Run</button>
</div>
<div class="output" id="output"></div>
<div class="matrix" id="matrix"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const keyEl=document.getElementById('key');
const mode=document.getElementById('mode');
const runBtn=document.getElementById('run');
const output=document.getElementById('output');
const matrix=document.getElementById('matrix');

function buildSquare(key){
  key=(key||'').toUpperCase().replace(/J/g,'I').replace(/[^A-Z]/g,'');
  const seen=new Set();
  let chars='';
  for(const ch of key){if(!seen.has(ch)){seen.add(ch);chars+=ch;}}
  for(let c=65;c<=90;c++){
    const ch=String.fromCharCode(c);
    if(ch==='J')continue;
    if(!seen.has(ch)){seen.add(ch);chars+=ch;}
  }
  const sq=[];
  for(let i=0;i<5;i++)sq.push(chars.slice(i*5,i*5+5).split(''));
  return sq;
}

function findPos(sq,ch){
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(sq[r][c]===ch)return[r,c];
  return[0,0];
}

function prepare(text){
  text=text.toUpperCase().replace(/J/g,'I').replace(/[^A-Z]/g,'');
  let result='';
  for(let i=0;i<text.length;i++){
    if(i+1<text.length&&text[i]===text[i+1]){
      result+=text[i]+'X';
    }else{
      result+=text[i];
      if(i+1<text.length){result+=text[i+1];i++;}
    }
  }
  if(result.length%2)result+='X';
  return result;
}

function encode(text,key){
  const sq=buildSquare(key);
  const pt=prepare(text);
  let result='';
  for(let i=0;i<pt.length;i+=2){
    const[r1,c1]=findPos(sq,pt[i]);
    const[r2,c2]=findPos(sq,pt[i+1]);
    if(r1===r2){result+=sq[r1][(c1+1)%5]+sq[r2][(c2+1)%5];}
    else if(c1===c2){result+=sq[(r1+1)%5][c1]+sq[(r2+1)%5][c2];}
    else{result+=sq[r1][c2]+sq[r2][c1];}
  }
  return result;
}

function decode(text,key){
  const sq=buildSquare(key);
  const ct=text.toUpperCase().replace(/J/g,'I').replace(/[^A-Z]/g,'');
  let result='';
  for(let i=0;i<ct.length;i+=2){
    const[r1,c1]=findPos(sq,ct[i]);
    const[r2,c2]=findPos(sq,ct[i+1]);
    if(r1===r2){result+=sq[r1][(c1+4)%5]+sq[r2][(c2+4)%5];}
    else if(c1===c2){result+=sq[(r1+4)%5][c1]+sq[(r2+4)%5][c2];}
    else{result+=sq[r1][c2]+sq[r2][c1];}
  }
  return result;
}

function renderMatrix(sq){
  matrix.innerHTML='';
  sq.forEach(row=>row.forEach(ch=>{
    const d=document.createElement('div');
    d.textContent=ch;
    matrix.appendChild(d);
  }));
}

runBtn.addEventListener('click',()=>{
  const text=input.value;
  const key=keyEl.value;
  const m=mode.value;
  const sq=buildSquare(key);
  renderMatrix(sq);
  output.textContent=m==='encode'?encode(text,key):decode(text,key);
});
keyEl.addEventListener('input',()=>{renderMatrix(buildSquare(keyEl.value));});
renderMatrix(buildSquare(keyEl.value));
})();
</script>
</body>
</html>
