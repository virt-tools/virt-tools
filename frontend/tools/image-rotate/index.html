<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Rotator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Rotator</h1>
<p class="subtitle">Rotate or flip images. Export as PNG or JPEG. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
<button onclick="rotate(90)" type="button">Rotate 90°</button>
<button onclick="rotate(180)" type="button">Rotate 180°</button>
<button onclick="rotate(270)" type="button">Rotate 270°</button>
<button onclick="flip('h')" type="button">Flip H</button>
<button onclick="flip('v')" type="button">Flip V</button>
<button onclick="download()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img,currentCanvas;
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
img=new Image();img.onload=function(){
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
};img.src=URL.createObjectURL(f);
});
function rotate(deg){
var rad=deg*Math.PI/180;
var w=canvas.width,h=canvas.height;
if(deg==90||deg==270){var t=w;w=h;h=t;}
var c=document.createElement('canvas');c.width=w;c.height=h;
var cx=c.getContext('2d');cx.translate(w/2,h/2);cx.rotate(rad);
cx.drawImage(canvas,-canvas.width/2,-canvas.height/2);
canvas.width=w;canvas.height=h;ctx.drawImage(c,0,0);
}
function flip(dir){
var c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;
var cx=c.getContext('2d');
if(dir=='h'){cx.translate(c.width,0);cx.scale(-1,1);}
else{cx.translate(0,c.height);cx.scale(1,-1);}
cx.drawImage(canvas,0,0);
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(c,0,0);
}
function download(){
canvas.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rotated.png';a.click();});
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
