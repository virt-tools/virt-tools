<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Weather Widget Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:220px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌤️ CSS Weather Widget Generator</h1>
<p>Create CSS weather card/widget components. 4 styles, 8 conditions, adjustable temp/city. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="card" selected>Card</option><option value="mini">Mini</option><option value="detailed">Detailed</option><option value="glass">Glass</option></select></div>
<div class="ctrl-row"><label>Condition</label><select id="cond"><option value="sunny" selected>☀️ Sunny</option><option value="cloudy">☁️ Cloudy</option><option value="rainy">🌧️ Rainy</option><option value="stormy">⛈️ Stormy</option><option value="snowy">❄️ Snowy</option><option value="foggy">🌫️ Foggy</option><option value="windy">💨 Windy</option><option value="night">🌙 Night</option></select></div>
<div class="ctrl-row"><label>Temperature</label><input type="number" id="temp" value="22" style="width:80px"></div>
<div class="ctrl-row"><label>City</label><input type="text" id="city" value="San Francisco" style="width:180px"></div>
<div class="ctrl-row"><label>Unit</label><select id="unit"><option value="°C" selected>°C</option><option value="°F">°F</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var grads={sunny:'linear-gradient(135deg,#FF9A8B,#FF6A88)',cloudy:'linear-gradient(135deg,#8E9EAB,#636FA0)',rainy:'linear-gradient(135deg,#4B79A1,#283E51)',stormy:'linear-gradient(135deg,#232526,#414345)',snowy:'linear-gradient(135deg,#E6E9F0,#EEF1F5)',foggy:'linear-gradient(135deg,#757F9A,#D7DDE8)',windy:'linear-gradient(135deg,#485563,#29323C)',night:'linear-gradient(135deg,#0F2027,#203A43)'};
var icons={sunny:'☀️',cloudy:'☁️',rainy:'🌧️',stormy:'⛈️',snowy:'❄️',foggy:'🌫️',windy:'💨',night:'🌙'};
var textCol={sunny:'#fff',cloudy:'#fff',rainy:'#fff',stormy:'#fff',snowy:'#333',foggy:'#333',windy:'#fff',night:'#fff'};
function update(){
var style=document.getElementById('style').value;
var cond=document.getElementById('cond').value;
var temp=document.getElementById('temp').value;
var city=document.getElementById('city').value;
var unit=document.getElementById('unit').value;
var grad=grads[cond],icon=icons[cond],tc=textCol[cond];
var html='',css='';
if(style==='card'||style==='glass'){
html='<div class="weather-card">\n  <div class="weather-icon">'+icon+'</div>\n  <div class="weather-temp">'+temp+unit+'</div>\n  <div class="weather-city">'+city+'</div>\n  <div class="weather-cond">'+cond.charAt(0).toUpperCase()+cond.slice(1)+'</div>\n</div>';
css='.weather-card{background:'+(style==='glass'?'rgba(255,255,255,.15);backdrop-filter:blur(10px)':grad)+';border-radius:20px;padding:30px 40px;text-align:center;color:'+tc+';box-shadow:0 8px 32px rgba(0,0,0,.3);width:200px}\n';
css+='.weather-icon{font-size:64px;margin-bottom:10px}\n';
css+='.weather-temp{font-size:42px;font-weight:bold}\n';
css+='.weather-city{font-size:16px;margin-top:5px;opacity:.9}\n';
css+='.weather-cond{font-size:13px;margin-top:5px;opacity:.7}\n';
}else if(style==='mini'){
html='<div class="weather-mini">\n  <span class="weather-mini-icon">'+icon+'</span>\n  <span class="weather-mini-temp">'+temp+unit+'</span>\n  <span class="weather-mini-city">'+city+'</span>\n</div>';
css='.weather-mini{display:inline-flex;align-items:center;gap:8px;background:'+grad+';padding:10px 18px;border-radius:30px;color:'+tc+';font-size:14px;font-weight:600}\n';
css+='.weather-mini-icon{font-size:20px}\n';
css+='.weather-mini-temp{font-weight:bold}\n';
css+='.weather-mini-city{opacity:.8}\n';
}else if(style==='detailed'){
html='<div class="weather-detailed">\n  <div class="wd-top"><div class="wd-icon">'+icon+'</div><div><div class="wd-temp">'+temp+unit+'</div><div class="wd-city">'+city+'</div></div></div>\n  <div class="wd-stats"><div><span>💧 45%</span><span>Wind 12km/h</span></div><div><span>Feels 20'+unit+'</span><span>UV 3</span></div></div>\n  <div class="wd-forecast"><div><span>Mon</span><span>☀️</span><span>24°</span></div><div><span>Tue</span><span>☁️</span><span>21°</span></div><div><span>Wed</span><span>🌧️</span><span>18°</span></div></div>\n</div>';
css='.weather-detailed{background:'+grad+';border-radius:20px;padding:24px;color:'+tc+';width:300px;box-shadow:0 8px 32px rgba(0,0,0,.3)}\n';
css+='.wd-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}\n';
css+='.wd-icon{font-size:48px}\n';
css+='.wd-temp{font-size:32px;font-weight:bold}\n';
css+='.wd-city{font-size:14px;opacity:.8}\n';
css+='.wd-stats{display:flex;justify-content:space-between;margin-bottom:16px;font-size:13px;opacity:.9}\n';
css+='.wd-stats div{display:flex;flex-direction:column;gap:4px}\n';
css+='.wd-forecast{display:flex;justify-content:space-around;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}\n';
css+='.wd-forecast div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','cond','temp','city','unit'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
