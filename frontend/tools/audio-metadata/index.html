<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Metadata Viewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Metadata Viewer</h1>
<p class="subtitle">View technical metadata of any audio file — duration, sample rate, channels, bit depth. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
</div>
<div id="results" class="results"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const fileInput=document.getElementById('file');
const results=document.getElementById('results');
fileInput.addEventListener('change',async()=>{
const file=fileInput.files[0];
if(!file){results.innerHTML='';return;}
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const dur=(buf.duration/60).toFixed(2);
results.innerHTML=`
<table class="data-table">
<tr><th>File Name</th><td>${file.name}</td></tr>
<tr><th>File Size</th><td>${(file.size/1024).toFixed(2)} KB</td></tr>
<tr><th>MIME Type</th><td>${file.type||'unknown'}</td></tr>
<tr><th>Duration</th><td>${buf.duration.toFixed(3)} sec (${dur} min)</td></tr>
<tr><th>Sample Rate</th><td>${buf.sampleRate} Hz</td></tr>
<tr><th>Channels</th><td>${buf.numberOfChannels} (${buf.numberOfChannels===1?'mono':buf.numberOfChannels===2?'stereo':buf.numberOfChannels+'ch'})</td></tr>
<tr><th>Length (samples)</th><td>${buf.length.toLocaleString()}</td></tr>
<tr><th>Bit Depth</th><td>32-bit float (decoded)</td></tr>
</table>`;
audioCtx.close();
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
