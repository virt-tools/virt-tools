<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 3D Rotation Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:3rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center;perspective:600px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎲 CSS 3D Rotation Generator</h1>
<p>Create CSS 3D rotation animations for text and elements. 6 axes, adjustable speed, perspective. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Axis</label><select id="axis"><option value="rotateX">X (flip up)</option><option value="rotateY">Y (flip sideways)</option><option value="rotateZ">Z (spin)</option><option value="rotateXY">X+Y</option><option value="rotateXYZ">X+Y+Z</option><option value="rotateBook">Book flip</option></select></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="0.5" max="10" step="0.5" value="3" style="width:200px"></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="3D Text" style="width:200px"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#667eea"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="20" max="80" value="40" style="width:200px"></div>
<div class="ctrl-row"><label>Perspective</label><input type="range" id="persp" min="200" max="1200" value="600" style="width:200px"></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var ax=document.getElementById('axis').value;
var sp=parseFloat(document.getElementById('speed').value);
var tx=document.getElementById('text').value;
var cl=document.getElementById('color').value;
var fs=parseInt(document.getElementById('fsize').value);
var pe=parseInt(document.getElementById('persp').value);
var html='<div class="rot3d-wrap"><div class="rot3d">'+tx+'</div></div>';
var css='.rot3d-wrap{perspective:'+pe+'px;display:flex;align-items:center;justify-content:center}\n';
css+='.rot3d{font-size:'+fs+'px;font-weight:700;color:'+cl+';transform-style:preserve-3d;animation:rot3d '+sp+'s linear infinite}\n';
if(ax==='rotateX'){css+='@keyframes rot3d{from{transform:rotateX(0)}to{transform:rotateX(360deg)}}\n'}
else if(ax==='rotateY'){css+='@keyframes rot3d{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}\n'}
else if(ax==='rotateZ'){css+='@keyframes rot3d{from{transform:rotateZ(0)}to{transform:rotateZ(360deg)}}\n'}
else if(ax==='rotateXY'){css+='@keyframes rot3d{0%{transform:rotateX(0) rotateY(0)}100%{transform:rotateX(360deg) rotateY(360deg)}}\n'}
else if(ax==='rotateXYZ'){css+='@keyframes rot3d{0%{transform:rotateX(0) rotateY(0) rotateZ(0)}100%{transform:rotateX(360deg) rotateY(360deg) rotateZ(360deg)}}\n'}
else if(ax==='rotateBook'){css+='.rot3d{transform-origin:left center}\n@keyframes rot3d{0%{transform:rotateY(0)}50%{transform:rotateY(-180deg)}100%{transform:rotateY(-360deg)}}\n'}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['axis','speed','text','color','fsize','persp'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
