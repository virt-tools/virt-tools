<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series Sum Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Series Sum Calculator</h1>
<p class="subtitle">Calculate arithmetic and geometric series sums and identify convergence.</p>
<div class="input-section">
<label>Series Type</label>
<select id="type" aria-label="Type">
<option value="arithmetic" selected>Arithmetic</option>
<option value="geometric">Geometric</option>
<option value="custom">Custom (Σ f(x))</option>
</select>
<div id="arithSection">
<label>First Term (a₁)</label>
<input type="number" id="a1" value="1" step="any" aria-label="A1">
<label>Common Difference (d)</label>
<input type="number" id="d" value="2" step="any" aria-label="D">
<label>Number of Terms (n)</label>
<input type="number" id="n" value="10" min="1" step="1" aria-label="N">
</div>
<div id="geomSection" style="display:none">
<label>First Term (a)</label>
<input type="number" id="ga" value="1" step="any" aria-label="Ga">
<label>Common Ratio (r)</label>
<input type="number" id="gr" value="0.5" step="any" aria-label="Gr">
<label>Number of Terms (n)</label>
<input type="number" id="gn" value="10" min="1" step="1" aria-label="Gn">
</div>
<div id="customSection" style="display:none">
<label>f(x) =</label>
<input type="text" id="expr" value="x^2" style="width:100%;font-family:monospace" aria-label="Expr">
<label>From</label>
<input type="number" id="cf" value="1" step="1" aria-label="Cf">
<label>To</label>
<input type="number" id="ct" value="10" step="1" aria-label="Ct">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script src="/assets/math-expression.js"></script>
<script>
function finiteInput(id,label){const raw=document.getElementById(id).value.trim(),value=Number(raw);if(!raw||!Number.isFinite(value))throw new Error(label+' must be a finite number.');return value;}
function integerInput(id,label,min,max){const value=finiteInput(id,label);if(!Number.isInteger(value)||value<min||value>max)throw new Error(label+' must be an integer from '+min+' to '+max+'.');return value;}
document.addEventListener('DOMContentLoaded',()=>{
const type=document.getElementById('type');
type.addEventListener('change',()=>{['arithSection','geomSection','customSection'].forEach(s=>document.getElementById(s).style.display='none');document.getElementById({arithmetic:'arithSection',geometric:'geomSection',custom:'customSection'}[type.value]).style.display='';});
document.getElementById('calc').addEventListener('click',()=>{
let html;
const result=document.getElementById('result');
try{
if(type.value==='arithmetic'){
const a=finiteInput('a1','First term'),d=finiteInput('d','Common difference'),n=integerInput('n','Number of terms',1,1000000000);
const last=a+(n-1)*d;
const sum=n*(a+last)/2;
html=`<div class="result-row"><span>First term:</span><span>${a}</span></div><div class="result-row"><span>Common difference:</span><span>${d}</span></div><div class="result-row"><span>Number of terms:</span><span>${n}</span></div><div class="result-row"><span>Last term:</span><span>${last}</span></div><div class="result-row"><span>Sum (Sₙ):</span><span>${sum}</span></div>`;
}else if(type.value==='geometric'){
const a=finiteInput('ga','First term'),r=finiteInput('gr','Common ratio'),n=integerInput('gn','Number of terms',1,1000000000);
const sum=r===1?a*n:a*(Math.pow(r,n)-1)/(r-1);
const infSum=Math.abs(r)<1?a/(1-r):Infinity;
if(!Number.isFinite(sum))throw new Error('The finite series sum is outside the supported numeric range.');
html=`<div class="result-row"><span>First term:</span><span>${a}</span></div><div class="result-row"><span>Common ratio:</span><span>${r}</span></div><div class="result-row"><span>Sum (n=${n}):</span><span>${sum.toFixed(8)}</span></div>${Math.abs(r)<1?'<div class="result-row"><span>Infinite sum (a/(1-r)):</span><span>'+infSum.toFixed(8)+'</span></div>':'<p class="hint">Series diverges for |r| ≥ 1</p>'}`;
}else{
const expr=document.getElementById('expr').value;
const f=integerInput('cf','Start value',-1000000000,1000000000),t=integerInput('ct','End value',-1000000000,1000000000);
if(t<f)throw new Error('The end value must be greater than or equal to the start value.');
if(t-f+1>100000)throw new Error('Custom sums are limited to 100,000 terms.');
const evaluator=VTMathExpression.compile(expr,['x']);let sum=0;
for(let x=f;x<=t;x++){const value=evaluator({x});if(!Number.isFinite(value))throw new Error('Expression produced a non-finite term at x = '+x+'.');sum+=value;}
if(!Number.isFinite(sum))throw new Error('The sum is not finite.');
html=`<div class="result-row"><span>Custom sum from ${f} to ${t}:</span><span>${sum}</span></div><div class="result-row"><span>Terms:</span><span>${t-f+1}</span></div>`;
}
result.innerHTML=html;
}catch(e){result.textContent='Error: '+e.message;}
result.style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
