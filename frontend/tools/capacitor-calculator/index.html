<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacitor Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Capacitor Calculator</h1>
<p class="subtitle">Calculate series/parallel capacitance, charge, and energy stored.</p>
<div class="input-section">
<label>Configuration</label>
<select id="config" aria-label="Config">
<option value="series" selected>Series</option>
<option value="parallel">Parallel</option>
</select>
<div id="caps">
<div class="cap-row">
<input type="number" placeholder="Capacitance (µF)" class="val" value="10" step="any" aria-label="Capacitance (Μf)">
<select class="unit" aria-label="Select">
<option value="1" selected>µF</option>
<option value="1000">nF</option>
<option value="1000000">pF</option>
</select>
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
<div class="cap-row">
<input type="number" placeholder="Capacitance (µF)" class="val" value="22" step="any" aria-label="Capacitance (Μf)">
<select class="unit" aria-label="Select">
<option value="1" selected>µF</option>
<option value="1000">nF</option>
<option value="1000000">pF</option>
</select>
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
</div>
<button id="addRow" class="secondary-btn" type="button">+ Add Capacitor</button>
</div>
<label>Applied Voltage (V)</label>
<input type="number" id="voltage" value="12" min="0" step="0.1" aria-label="Voltage">
<button id="calc" class="primary-btn" type="button">Calculate</button>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('addRow').addEventListener('click',()=>{
const row=document.createElement('div');
row.className='cap-row';
row.innerHTML=`<input type="number" placeholder="Capacitance (µF)" class="val" step="any" aria-label="Capacitance (Μf)">
<select class="unit" aria-label="Select"><option value="1">µF</option><option value="1000">nF</option><option value="1000000">pF</option></select>
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>`;
document.getElementById('caps').appendChild(row);
});
document.getElementById('calc').addEventListener('click',()=>{
const config=document.getElementById('config').value;
const V=parseFloat(document.getElementById('voltage').value)||0;
const rows=document.querySelectorAll('.cap-row');
let values=[];
rows.forEach(r=>{
const v=parseFloat(r.querySelector('.val').value)||0;
const u=parseFloat(r.querySelector('.unit').value)||1;
values.push(v*u);
});
let total;
if(config==='series'){total=1/values.reduce((s,c)=>s+1/c,0);}
else{total=values.reduce((s,c)=>s+c,0);}
const charge=total*V/1e6;
const energy=0.5*total*V*V/1e12;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Configuration:</span><span>${config.charAt(0).toUpperCase()+config.slice(1)}</span></div>
<div class="result-row"><span>Number of Capacitors:</span><span>${values.length}</span></div>
<div class="result-row"><span>Total Capacitance:</span><span>${(total/1000).toFixed(4)} µF (${(total/1000000).toFixed(2)} nF)</span></div>
<div class="result-row"><span>At ${V}V:</span><span>${charge.toFixed(6)} C charge</span></div>
<div class="result-row"><span>Energy Stored:</span><span>${energy.toFixed(6)} J</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
