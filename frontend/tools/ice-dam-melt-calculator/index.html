<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Ice Dam Melt Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Ice Dam Melt Calculator</h1>
<p>Estimate ice dam thickness, melt time, and heat cable length needed from roof area and temperature differential. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Roof eave area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-thick">Ice thickness</label><input type="text" id="in-thick" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-temp">Temp differential</label><input type="text" id="in-temp" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">°C above 0</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter eave area.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-area"),tEl=document.getElementById("in-thick"),tdEl=document.getElementById("in-temp"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),T=pn(tEl.value),TD=pn(tdEl.value);
if(A==null){return}
T=T==null?0.05:T;TD=TD==null?5:TD;
if(!isFinite(A)||!isFinite(T)||A<=0||T<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var iceVol=A*T;
var iceMass=iceVol*917;
var heatNeeded=iceMass*334;
var meltTime=heatNeeded/(TD*50*A);
var cableLen=A/0.1;
var html='<div class="big">'+rnd(meltTime/3600,1)+' hrs</div>';
html+=row("Ice volume",rnd(iceVol,3)+" m³");
html+=row("Ice mass",rnd(iceMass,0)+" kg");
html+=row("Heat needed",rnd(heatNeeded/1000,0)+" kJ");
html+=row("Melt time (est.)",rnd(meltTime/3600,1)+" hrs");
html+=row("Heat cable length",rnd(cableLen,0)+" m");
out.innerHTML=html;
}
[aEl,tEl,tdEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
