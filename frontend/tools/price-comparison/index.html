<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Comparison — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.pc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.pc h1{font-size:2rem;margin-bottom:.5rem}
.pc .sub{color:#888;margin-bottom:1.5rem}
.pc .row{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:8px;align-items:end;margin-bottom:8px}
.pc .row label{font-size:12px;color:#888}
.pc .row input{width:100%;font-size:14px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.pc .row select{width:100%;font-size:14px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.pc .row .rm{background:none;border:none;color:#e74c3c;font-size:20px;cursor:pointer;padding:4px 8px}
.pc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.pc .results{margin-top:1.5rem}
.pc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.pc .best{border-color:#27ae60;border-width:2px}
.pc .best-badge{display:inline-block;background:#27ae60;color:#fff;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:8px}
.pc .big{font-size:1.8rem;font-weight:700;color:var(--accent)}
.pc .lbl{color:#888;font-size:13px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="pc">
<h1>🛒 Price Comparison Tool</h1>
<p class="sub">Compare prices across different package sizes to find the best deal.</p>
<div id="inputs"></div>
<button class="btn" onclick="addRow()" style="background:var(--bg);border:1px solid var(--border);color:var(--text)" type="button">+ Add item</button>
<button class="btn" onclick="compare()" type="button">Compare</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
const units={g:1,kg:1000,lb:453.592,oz:28.3495,ml:1,l:1000,fl_oz:29.5735,ea:1,count:1};
let items=[{price:5.99,size:500,unit:'g',name:'Brand A'},{price:8.99,size:1000,unit:'g',name:'Brand B'}];
function render(){
  const c=document.getElementById('inputs');
  c.innerHTML='';
  items.forEach((it,i)=>{
    const d=document.createElement('div');
    d.className='row';
    d.innerHTML='<div><label>Name</label><input value="'+(it.name||'')+'" oninput="items['+i+'].name=this.value" aria-label="Input"></div>'+
      '<div><label>Price ($)</label><input type="number" value="'+it.price+'" step="0.01" oninput="items['+i+'].price=parseFloat(this.value)||0" aria-label="Input"></div>'+
      '<div><label>Size</label><input type="number" value="'+it.size+'" oninput="items['+i+'].size=parseFloat(this.value)||0" aria-label="Input"></div>'+
      '<div><label>Unit</label><select onchange="items['+i+'].unit=this.value" aria-label="Select">'+
      Object.keys(units).map(u=>'<option value="'+u+'"'+(it.unit===u?' selected':'')+'>'+u+'</option>').join('')+
      '</select></div>'+
      (items.length>2?'<button class="rm" onclick="items.splice('+i+',1);render()" type="button">×</button>':'');
    c.appendChild(d);
  });
}
function addRow(){items.push({price:0,size:1,unit:'g',name:'Brand '+(items.length+1)});render();}
function compare(){
  const norm=items.map(it=>{
    const factor=units[it.unit]||1;
    const unitPrice=(it.price/(it.size*factor))*100;
    return{...it,unitPrice,normSize:it.size*factor};
  }).sort((a,b)=>a.unitPrice-b.unitPrice);
  const best=norm[0];
  let html='';
  norm.forEach(it=>{
    const isBest=it===best;
    html+='<div class="res-card'+(isBest?' best':'')+'">'+
      '<div class="lbl">'+(it.name||'Item')+(isBest?'<span class="best-badge">Best Deal</span>':'')+'</div>'+
      '<div class="big" style="'+(isBest?'color:#27ae60':'')+'">$'+it.unitPrice.toFixed(2)+'/100'+it.unit+'</div>'+
      '<div class="lbl">'+(it.size)+' '+it.unit+' at $'+it.price.toFixed(2)+'</div>'+
      (isBest?'':'<div class="lbl">'+((it.unitPrice/best.unitPrice-1)*100).toFixed(0)+'% more expensive</div>')+
      '</div>';
  });
  document.getElementById('results').innerHTML=html;
}
render();compare();
</script>
</body>
</html>
