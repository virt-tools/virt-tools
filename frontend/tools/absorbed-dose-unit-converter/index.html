<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Absorbed radiation dose Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Absorbed radiation dose Unit Converter</h1><p class="subtitle">Convert between all supported absorbed radiation dose units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Absorbed radiation dose","units":[{"slug":"grays","name":"Grays","symbol":"Gy","scale":1,"offset":0},{"slug":"milligrays","name":"Milligrays","symbol":"mGy","scale":0.001,"offset":0},{"slug":"micrograys","name":"Micrograys","symbol":"µGy","scale":1e-06,"offset":0},{"slug":"rads","name":"Rads","symbol":"rad","scale":0.01,"offset":0},{"slug":"millirads","name":"Millirads","symbol":"mrad","scale":1e-05,"offset":0},{"slug":"ergs-per-gram","name":"Ergs per gram","symbol":"erg/g","scale":0.0001,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script><script>
(function () {
  "use strict";
  const config = JSON.parse(document.getElementById("unit-config").textContent);
  const value = document.getElementById("unit-value");
  const from = document.getElementById("unit-from");
  const to = document.getElementById("unit-to");
  const result = document.getElementById("unit-result");
  const equation = document.getElementById("unit-equation");

  function showRangeError() {
    const number = Number(value.value);
    const source = config.units.find(unit => unit.slug === from.value);
    const target = config.units.find(unit => unit.slug === to.value);
    if (!source || !target || value.value.trim() === "" || !Number.isFinite(number)) return;
    const converted = (number * source.scale + source.offset - target.offset) / target.scale;
    if (!Number.isFinite(converted)) {
      result.textContent = "Value is outside the supported range";
      equation.textContent = "Enter a smaller magnitude and try again.";
    }
  }

  [value, from, to, document.getElementById("unit-swap")].forEach(control => {
    control.addEventListener(control === value ? "input" : control === document.getElementById("unit-swap") ? "click" : "change", showRangeError);
  });
  showRangeError();
})();
</script></body></html>
