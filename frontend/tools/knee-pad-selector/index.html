<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Knee Pad Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-83a92982.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Knee Pad Selector</h1>
<p>Choose the right knee pad type for your task — flooring, roofing, gardening, or welding. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Task</label><select id="in-t"><option value="">Select…</option><option value="flooring">Flooring / tiling</option><option value="roofing">Roofing</option><option value="gardening">Gardening / landscaping</option><option value="welding">Welding / hot work</option><option value="general">General construction</option></select><div class="unit">task</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Select a task to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var pads={
flooring:{type:"Gel knee pads with hard cap",notes:"Thick gel cushioning for hard floors, hard cap for sliding"},
roofing:{type:"Foam knee pads with non-slip surface",notes:"Lightweight, non-marring, won't damage shingles"},
gardening:{type:"Soft foam knee pads / kneeling pad",notes:"Water-resistant, wide base for soft ground"},
welding:{type:"Heat-resistant leather knee pads",notes:"Fire-resistant, leather construction for hot surfaces"},
general:{type:"Dual-density foam knee pads",notes:"Versatile, comfortable for multi-surface use"}
};
var tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var t=tEl.value;
if(!t)return;
err.textContent="";
var p=pads[t];
var html='<div class="big">'+p.type+'</div>';
html+='<div class="row"><span class="k">Notes</span><span class="v">'+p.notes+'</span></div>';
out.innerHTML=html;
}
tEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
