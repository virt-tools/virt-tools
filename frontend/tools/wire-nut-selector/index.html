<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wire Nut Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wire Nut Selector</h1>
<p>Select the correct wire nut (twist-on connector) size based on wire gauge and count. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-g1">Wire 1 AWG</label><input type="text" id="in-g1" inputmode="numeric" autocomplete="off" placeholder="e.g. 14"><div class="unit">AWG</div></div>
<div class="field"><label class="f" for="in-g2">Wire 2 AWG</label><input type="text" id="in-g2" inputmode="numeric" autocomplete="off" placeholder="e.g. 12"><div class="unit">AWG</div></div>
<div class="field"><label class="f" for="in-cnt">Wire count</label><input type="text" id="in-cnt" inputmode="numeric" autocomplete="off" placeholder="e.g. 3"><div class="unit">wires</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var g1El=document.getElementById("in-g1"),g2El=document.getElementById("in-g2"),cEl=document.getElementById("in-cnt"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var G1=pn(g1El.value),G2=pn(g2El.value),Ct=pn(cEl.value);
if(G1==null||G2==null||Ct==null)return;
if(!isFinite(G1)||G1<=0||!isFinite(G2)||G2<=0||!isFinite(Ct)||Ct<2){err.textContent="Enter valid AWG values and wire count (min 2).";return}
err.textContent="";
var minG=Math.min(G1,G2);
var nut;
if(minG<=18&&Ct<=3)nut="Yellow (B)";
else if(minG<=14&&Ct<=3)nut="Yellow or Orange (B/R)";
else if(minG<=12&&Ct<=4)nut="Red (R) or Wing-nut";
else if(minG<=10&&Ct<=3)nut="Red (R) large";
else if(minG<=8&&Ct<=2)nut="Blue (large) or Tap";
else nut="Split-bolt or Polaris lug";
var html='<div class="big">'+nut+'</div>';
html+=row("Recommended connector",nut);
html+=row("Smallest wire",minG+' AWG');
html+=row("Wire count",Ct);
html+=row("Largest wire",Math.max(G1,G2)+' AWG');
out.innerHTML=html;
}
[g1El,g2El,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
