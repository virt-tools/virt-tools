<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Voice Recorder</h1>
<p class="subtitle">Record audio from your microphone and download it as a WebM file. 100% client-side via MediaRecorder.</p>
<div class="input-section">
<button id="record" class="primary-btn" type="button">Start Recording</button>
<button id="stop" disabled type="button">Stop & Download</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
<audio id="player" controls style="display:none;margin-top:1em;width:100%;"></audio>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
let rec,chunks=[],stream;
const btnRec=document.getElementById('record');
const btnStop=document.getElementById('stop');
const status=document.getElementById('status');
const player=document.getElementById('player');
btnRec.addEventListener('click',async()=>{
stream=await navigator.mediaDevices.getUserMedia({audio:true});
rec=new MediaRecorder(stream);
chunks=[];
rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
rec.onstop=()=>{
const blob=new Blob(chunks,{type:'audio/webm'});
const url=URL.createObjectURL(blob);
player.src=url;player.style.display='block';
const a=document.createElement('a');
a.href=url;a.download='recording.webm';a.click();
};
rec.start();
btnRec.disabled=true;btnStop.disabled=false;
status.textContent='Recording...';
});
btnStop.addEventListener('click',()=>{
if(rec&&rec.state!=='inactive')rec.stop();
if(stream)stream.getTracks().forEach(t=>t.stop());
btnRec.disabled=false;btnStop.disabled=true;
status.textContent='Recording stopped. File downloaded.';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
