<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Thermometer Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:220px;display:flex;align-items:center;justify-content:center;gap:2rem}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌡️ CSS Thermometer Generator</h1>
<p>Create CSS thermometer/temperature gauge components. 4 styles, adjustable value/min/max. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="classic" selected>Classic</option><option value="bar">Bar</option><option value="circle">Circle</option><option value="digital">Digital</option></select></div>
<div class="ctrl-row"><label>Value</label><input type="number" id="value" value="22" style="width:80px" aria-label="Value"></div>
<div class="ctrl-row"><label>Min</label><input type="number" id="min" value="-10" style="width:80px" aria-label="Min"></div>
<div class="ctrl-row"><label>Max</label><input type="number" id="max" value="50" style="width:80px" aria-label="Max"></div>
<div class="ctrl-row"><label>Unit</label><select id="unit" aria-label="Unit"><option value="°C" selected>°C</option><option value="°F">°F</option><option value="K">K</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function tempColor(pct){if(pct<.2)return '#4488ff';if(pct<.4)return '#44ddff';if(pct<.6)return '#44dd88';if(pct<.8)return '#ffaa44';return '#ff4444'}
function update(){
var style=document.getElementById('style').value;
var val=parseFloat(document.getElementById('value').value)||0;
var min=parseFloat(document.getElementById('min').value)||0;
var max=parseFloat(document.getElementById('max').value)||100;
var unit=document.getElementById('unit').value;
var pct=Math.max(0,Math.min((val-min)/(max-min),1));
var col=tempColor(pct);
var html='',css='';
if(style==='classic'){
var fillH=Math.round(pct*200);
html='<div class="thermo">\n  <div class="thermo-tube"><div class="thermo-fill" style="height:'+fillH+'px"></div></div>\n  <div class="thermo-bulb"></div>\n  <div class="thermo-value">'+val+unit+'</div>\n</div>';
css='.thermo{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.thermo-tube{width:24px;height:200px;background:#1a1a2e;border-radius:12px 12px 0 0;border:2px solid #333;overflow:hidden;position:relative}\n';
css+='.thermo-fill{position:absolute;bottom:0;left:0;right:0;background:'+col+';border-radius:0;transition:height .3s,background .3s}\n';
css+='.thermo-bulb{width:50px;height:50px;border-radius:50%;background:'+col+';margin-top:-6px;border:2px solid #333;transition:background .3s}\n';
css+='.thermo-value{margin-top:10px;font-weight:bold;font-size:18px;color:'+col+'}\n';
}else if(style==='bar'){
html='<div class="thermo-bar-wrap">\n  <div class="thermo-bar-label">'+val+unit+'</div>\n  <div class="thermo-bar"><div class="thermo-bar-fill" style="width:'+Math.round(pct*100)+'%"></div></div>\n  <div class="thermo-bar-range"><span>'+min+'</span><span>'+max+'</span></div>\n</div>';
css='.thermo-bar-wrap{width:250px;text-align:center}\n';
css+='.thermo-bar-label{font-size:24px;font-weight:bold;color:'+col+';margin-bottom:8px}\n';
css+='.thermo-bar{width:100%;height:16px;background:#1a1a2e;border-radius:8px;overflow:hidden;border:1px solid #333}\n';
css+='.thermo-bar-fill{height:100%;background:linear-gradient(90deg,#4488ff,'+col+');border-radius:8px;transition:width .3s}\n';
css+='.thermo-bar-range{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:4px}\n';
}else if(style==='circle'){
html='<div class="thermo-circle">\n  <div class="thermo-circle-bg"></div>\n  <div class="thermo-circle-fill" style="clip-path:inset('+(100-pct*100)+'% 0 0 0)"></div>\n  <div class="thermo-circle-val">'+val+'<span>'+unit+'</span></div>\n</div>';
css='.thermo-circle{position:relative;width:120px;height:120px}\n';
css+='.thermo-circle-bg{position:absolute;width:100%;height:100%;border-radius:50%;background:#333;border:3px solid #444}\n';
css+='.thermo-circle-fill{position:absolute;width:100%;height:100%;border-radius:50%;background:'+col+';border:3px solid #444}\n';
css+='.thermo-circle-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:bold;color:#fff;text-align:center}\n';
css+='.thermo-circle-val span{display:block;font-size:12px;color:#aaa}\n';
}else if(style==='digital'){
html='<div class="thermo-digital">\n  <div class="thermo-digital-icon">🌡️</div>\n  <div class="thermo-digital-val">'+val+'</div>\n  <div class="thermo-digital-unit">'+unit+'</div>\n</div>';
css='.thermo-digital{text-align:center;padding:20px 30px;background:#0f0f1e;border-radius:12px;border:2px solid '+col+'\n';
css+='.thermo-digital-icon{font-size:36px}\n';
css+='.thermo-digital-val{font-size:48px;font-weight:bold;color:'+col+';font-family:monospace;line-height:1}\n';
css+='.thermo-digital-unit{font-size:18px;color:#888;margin-top:4px}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','value','min','max','unit'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
