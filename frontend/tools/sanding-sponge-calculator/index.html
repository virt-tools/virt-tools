<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sanding Sponge Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sanding Sponge Calculator</h1>
<p>Estimate sanding sponges needed from surface area, sponge grit, and sponge lifespan. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Surface area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-l">Sponge lifespan</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">sq ft/sponge</div></div>
<div class="field"><label class="f" for="in-g">Grit coarseness factor</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">multiplier</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),lEl=document.getElementById("in-l"),gEl=document.getElementById("in-g"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),L=pn(lEl.value),G=pn(gEl.value);
if(A==null||L==null||G==null)return;
if(!isFinite(A)||!isFinite(L)||!isFinite(G)||A<=0||L<=0||G<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var adj=A*G;
var sponges=Math.ceil(adj/L);
var html='<div class="big">'+rnd(sponges,0)+' sponges</div>';
html+=row("Surface area",rnd(A,0)+' sq ft');
html+=row("Sponge lifespan",rnd(L,0)+' sq ft/sponge');
html+=row("Grit factor",rnd(G,2)+'×');
html+=row("Adjusted area",rnd(adj,0)+' sq ft');
html+=row("Sponges needed",rnd(sponges,0)+' sponges');
out.innerHTML=html;
}
[aEl,lEl,gEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
