<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED Resistor Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>LED Resistor Calculator</h1>
<p class="subtitle">Calculate the current-limiting resistor needed for any LED.</p>
<div class="input-section">
<label>Supply Voltage (V)</label>
<input type="number" id="supply" value="12" min="0.1" step="0.1" aria-label="Supply">
<label>LED Forward Voltage (V)</label>
<input type="number" id="ledVf" value="2.2" min="0.1" step="0.1" aria-label="Led Vf">
<label>LED Forward Current (mA)</label>
<input type="number" id="ledIf" value="20" min="1" step="1" aria-label="Led If">
<label>Number of LEDs in Series</label>
<input type="number" id="numLed" value="1" min="1" aria-label="Num Led">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const Vs=parseFloat(document.getElementById('supply').value)||0;
const Vf=parseFloat(document.getElementById('ledVf').value)||0;
const If=parseFloat(document.getElementById('ledIf').value)||0;
const N=parseInt(document.getElementById('numLed').value)||1;
const totalVf=Vf*N;
const resVol=Vs-totalVf;
if(resVol<=0){document.getElementById('result').innerHTML='<p class="warning">⚠️ Supply voltage too low for '+N+' LED(s) in series. Need at least '+totalVf+'V.</p>';document.getElementById('result').style.display='block';return;}
const resistor=resVol/(If/1000);
const power=resVol*(If/1000);
const nextStd=[10,12,15,18,22,27,33,39,47,56,68,82,100,120,150,180,220,270,330,390,470,560,680,820,1000,1200,1500,1800,2200,2700,3300,4700,5600,6800,8200,10000];
const nearest=nextStd.reduce((p,c)=>Math.abs(c-resistor)<Math.abs(p-resistor)?c:p);
const actualIf=(resVol/nearest)*1000;
const actualPower=resVol*actualIf/1000;
const powerRating=actualPower*2;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Total LED Voltage:</span><span>${totalVf} V</span></div>
<div class="result-row"><span>Resistor Voltage Drop:</span><span>${resVol} V</span></div>
<div class="result-row"><span>Calculated Resistance:</span><span>${resistor.toFixed(1)} Ω</span></div>
<div class="result-row"><span>Nearest Standard:</span><span>${nearest} Ω</span></div>
<div class="result-row"><span>Actual Current:</span><span>${actualIf.toFixed(1)} mA</span></div>
<div class="result-row"><span>Power Dissipated:</span><span>${actualPower.toFixed(3)} W</span></div>
<div class="result-row"><span>Recommended Resistor Wattage:</span><span>${powerRating.toFixed(2)} W (min)</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
