<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Chart Maker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Chart Maker</h1>
<p class="subtitle">Create bar, line, or pie charts from CSV data. 100% client-side with SVG output.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="month,sales&#10;Jan,100&#10;Feb,150&#10;Mar,80" aria-label="Month,Sales&#10;Jan,100&#10;Feb,150&#10;Mar,80"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Labels:</label><select id="labelCol" aria-label="Label Col"></select>
<label>Values:</label><select id="valCol" aria-label="Val Col"></select>
<select id="chartType" aria-label="Chart Type"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option></select>
<button id="run" class="primary-btn" type="button">Chart</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
const input=document.getElementById('input');
const labelSel=document.getElementById('labelCol');
const valSel=document.getElementById('valCol');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){
const opts=rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join('');
labelSel.innerHTML=opts;valSel.innerHTML=opts;
}
});
document.getElementById('run').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const lIdx=parseInt(labelSel.value);
const vIdx=parseInt(valSel.value);
const type=document.getElementById('chartType').value;
const labels=[],values=[];
for(let i=1;i<rows.length;i++){labels.push(rows[i][lIdx]||'');values.push(parseFloat(rows[i][vIdx])||0);}
const max=Math.max(...values,1);
const W=600,H=400,pad=40;
let svg='<svg width="'+W+'" height="'+H+'" style="border:1px solid #ddd;">';
if(type==='bar'){
const bw=(W-2*pad)/values.length*0.8;
values.forEach((v,i)=>{
const x=pad+i*(W-2*pad)/values.length+bw*0.1;
const h=(H-2*pad)*v/max;
svg+='<rect x="'+x+'" y="'+(H-pad-h)+'" width="'+bw+'" height="'+h+'" fill="#4a90d9"/>';
svg+='<text x="'+(x+bw/2)+'" y="'+(H-pad+15)+'" font-size="10" text-anchor="middle">'+labels[i]+'</text>';
});
svg+='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#333"/>';
svg+='<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#333"/>';
}else if(type==='line'){
const pts=values.map((v,i)=>{
const x=pad+i*(W-2*pad)/Math.max(values.length-1,1);
const y=H-pad-(H-2*pad)*v/max;
return x+','+y;
}).join(' ');
svg+='<polyline points="'+pts+'" fill="none" stroke="#4a90d9" stroke-width="2"/>';
values.forEach((v,i)=>{
const x=pad+i*(W-2*pad)/Math.max(values.length-1,1);
const y=H-pad-(H-2*pad)*v/max;
svg+='<circle cx="'+x+'" cy="'+y+'" r="3" fill="#4a90d9"/>';
svg+='<text x="'+x+'" y="'+(H-pad+15)+'" font-size="10" text-anchor="middle">'+labels[i]+'</text>';
});
svg+='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#333"/>';
svg+='<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#333"/>';
}else if(type==='pie'){
const total=values.reduce((a,b)=>a+b,0)||1;
const cx=W/2,cy=H/2,r=150;
let angle=-90;
const colors=['#4a90d9','#e8463c','#f5a623','#7bc043','#9b59b6','#34995e','#e91e63','#00bcd4'];
values.forEach((v,i)=>{
const a1=angle*Math.PI/180;
const a2=(angle+360*v/total)*Math.PI/180;
const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
const x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
const large=(a2-a1)>Math.PI?1:0;
svg+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+large+' 1 '+x2+','+y2+' Z" fill="'+colors[i%colors.length]+'"/>';
angle+=360*v/total;
});
}
svg+='</svg>';
document.getElementById('result').innerHTML=svg;
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
