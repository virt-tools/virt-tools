<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Ice Melt Cable Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Ice Melt Cable Calculator</h1>
<p>Calculate heating cable length needed for roof edge ice dam prevention. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Roof eave length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-depth">Eave depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-pattern">Trace pattern</label><input type="text" id="in-pattern" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">loops/ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenEl=document.getElementById("in-len"),dEl=document.getElementById("in-depth"),pEl=document.getElementById("in-pattern"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lenEl.value),D=pn(dEl.value),P=pn(pEl.value);
if(L==null||D==null||P==null)return;
if(!isFinite(L)||!isFinite(D)||!isFinite(P)||L<=0||D<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var cable=L*(D*2)*P;
var watts=cable*9;
var html='<div class="big">'+rnd(cable,0)+' ft</div>';
html+=row("Cable length",rnd(cable,0)+" ft");
html+=row("Power estimate",rnd(watts,0)+" W");
html+=row("Eave length",rnd(L,0)+" ft");
html+=row("Loops per foot",rnd(P,1));
out.innerHTML=html;
}
[lenEl,dEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
