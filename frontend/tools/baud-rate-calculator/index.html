<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Baud Rate Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Baud Rate Calculator</h1>
<p>Calculate baud rate from bit rate and number of bits per symbol. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-br">Bit rate</label><input type="text" id="in-br" inputmode="decimal" autocomplete="off" placeholder="e.g. 9600"><div class="unit">bps</div></div>
<div class="field"><label class="f" for="in-bs">Bits per symbol</label><input type="text" id="in-bs" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">bits</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var brE=document.getElementById("in-br"),bsE=document.getElementById("in-bs"),out=document.getElementById("out");
function calc(){
var br=parseFloat(brE.value),bs=parseFloat(bsE.value);
if(isNaN(br)||isNaN(bs))return;
var baud=br/bs;
var html='<div class="big">'+(Math.round(baud*100)/100)+' baud</div>';
html+=row("Baud rate",Math.round(baud*100)/100+' baud');
html+=row("Bit rate",br+' bps');
html+=row("Bits per symbol",bs);
out.innerHTML=html;
}
[brE,bsE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
