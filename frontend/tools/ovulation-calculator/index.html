<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovulation & Fertility Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Ovulation & Fertility Calculator</h1>
<p class="subtitle">Estimate your fertile window and next period date.</p>

<div class="input-section">
  <label>First day of last period</label>
  <input type="date" id="lmp" aria-label="Lmp">

  <label>Average cycle length (days)</label>
  <input type="number" id="cycle" value="28" min="21" max="45" aria-label="Cycle">

  <label>Average period length (days)</label>
  <input type="number" id="period" value="5" min="2" max="10" aria-label="Period">

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="result-row"><span>Ovulation date:</span><span id="ovDate"></span></div>
  <div class="result-row"><span>Fertile window:</span><span id="fertile"></span></div>
  <div class="result-row"><span>Peak fertility:</span><span id="peak"></span></div>
  <div class="result-row"><span>Next period:</span><span id="nextPeriod"></span></div>
  <div class="result-row"><span>Pregnancy test day:</span><span id="testDay"></span></div>
  <div class="result-row"><span>Due date (if pregnant):</span><span id="dueDate"></span></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const lmpStr = document.getElementById('lmp').value;
    const cycle = parseInt(document.getElementById('cycle').value) || 28;
    const period = parseInt(document.getElementById('period').value) || 5;
    if (!lmpStr) return;

    const lmp = new Date(lmpStr);
    const ovDate = new Date(lmp);
    ovDate.setDate(lmp.getDate() + cycle - 14);

    const fertileStart = new Date(ovDate);
    fertileStart.setDate(ovDate.getDate() - 5);
    const fertileEnd = new Date(ovDate);
    fertileEnd.setDate(ovDate.getDate() + 1);

    const nextPeriod = new Date(lmp);
    nextPeriod.setDate(lmp.getDate() + cycle);

    const testDay = new Date(nextPeriod);
    testDay.setDate(nextPeriod.getDate() + 1);

    const dueDate = new Date(lmp);
    dueDate.setDate(lmp.getDate() + 280);

    const fmt = d => d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

    document.getElementById('ovDate').textContent = fmt(ovDate);
    document.getElementById('fertile').textContent = `${fmt(fertileStart)} — ${fmt(fertileEnd)}`;
    document.getElementById('peak').textContent = fmt(ovDate);
    document.getElementById('nextPeriod').textContent = fmt(nextPeriod);
    document.getElementById('testDay').textContent = fmt(testDay);
    document.getElementById('dueDate').textContent = fmt(dueDate);
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
