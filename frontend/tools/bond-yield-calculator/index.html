<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bond Yield Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.by{max-width:520px;margin:0 auto;padding:2rem 1rem}
.by h1{font-size:2rem;margin-bottom:.5rem}
.by .sub{color:#888;margin-bottom:1.5rem}
.by label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.by input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.by .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.by .results{margin-top:2rem}
.by .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.by .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.by .res-card .lbl{color:#888;font-size:13px}
.by .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="by">
<h1>🏦 Bond Yield Calculator</h1>
<p class="sub">Calculate current yield, yield to maturity (YTM), and coupon rate.</p>
<label for="face">Face value ($):</label>
<input type="number" id="face" value="1000" min="0" oninput="calc()">
<label for="price">Current price ($):</label>
<input type="number" id="price" value="950" min="0" oninput="calc()">
<label for="coupon">Annual coupon ($):</label>
<input type="number" id="coupon" value="50" min="0" oninput="calc()">
<label for="years">Years to maturity:</label>
<input type="number" id="years" value="5" min="1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const F=parseFloat(document.getElementById('face').value)||0;
  const P=parseFloat(document.getElementById('price').value)||0;
  const C=parseFloat(document.getElementById('coupon').value)||0;
  const n=parseInt(document.getElementById('years').value)||1;
  const couponRate=F===0?0:(C/F)*100;
  const currentYield=P===0?0:(C/P)*100;
  // Approximate YTM: (C + (F-P)/n) / ((F+P)/2)
  const ytm=P===0&&F===0?0:((C+(F-P)/n)/((F+P)/2))*100;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Coupon Rate</div><div class="big">'+couponRate.toFixed(2)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Current Yield</div><div class="big">'+currentYield.toFixed(2)+'%</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Yield to Maturity (approx.)</div><div class="big" style="color:#e67e22">'+ytm.toFixed(2)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Formula</div><div style="font-size:13px;margin-top:8px;color:#666">Current Yield = Annual Coupon / Price<br>YTM ≈ (C + (F−P)/n) / ((F+P)/2)</div></div>';
  const discount=F-P;
  html+='<div class="grid2"><div class="res-card"><div class="lbl">Discount/Premium</div><div class="big" style="font-size:1.5rem;color:'+(discount>=0?'#27ae60':'#e74c3c')+'">$'+discount.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Coupon</div><div class="big" style="font-size:1.5rem">$'+(C*n).toFixed(2)+'</div></div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
