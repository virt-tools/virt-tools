<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Tax Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
.note{font-size:.85rem;color:var(--text-muted);margin-top:.25rem}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Property Tax Calculator</h1>
<div class="calc-wrap">
<h2>Property Tax Calculator 🏠</h2>
<p>Estimate annual property tax based on assessed home value and local tax rate.</p>
<div class="input-group">
<label>Assessed home value ($)</label>
<input type="number" id="value" value="350000" min="0" aria-label="Value">
</div>
<div class="input-group">
<label>Property tax rate (% per year)</label>
<input type="number" id="rate" value="1.1" min="0" step="0.01" aria-label="Rate">
<div class="note">US average is ~1.1%. Enter your local rate.</div>
</div>
<div class="input-group">
<label>Exemptions/Homestead ($)</label>
<input type="number" id="exemption" value="0" min="0" aria-label="Exemption">
<div class="note">Deduct any homestead or senior exemptions.</div>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const homeValue=v('value'),ratePct=v('rate'),exemption=v('exemption');
  const taxable=Math.max(0,homeValue-exemption);
  const annual=taxable*(ratePct/100);
  const monthly=annual/12;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Property Tax Estimate</h3>'+
    '<div class="result-row"><span>Taxable value</span><span>$'+taxable.toLocaleString()+'</span></div>'+
    '<div class="result-row"><span>Annual property tax</span><span>$'+annual.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Monthly (in mortgage)</span><span>$'+monthly.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Effective rate</span><span>'+(annual/homeValue*100).toFixed(3)+'%</span></div>';
}
</script>
</body>
</html>
