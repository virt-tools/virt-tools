<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fence Material Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Fence Material Calculator</h1>
<p class="subtitle">Estimate posts, rails, pickets, and concrete for your fence project.</p>

<div class="input-section">
  <label>Fence length (ft)</label>
  <input type="number" id="length" value="100" min="1" aria-label="Length">
  <label>Post spacing (ft)</label>
  <input type="number" id="postSpacing" value="8" min="4" max="12" aria-label="Post Spacing">
  <label>Post height (ft)</label>
  <input type="number" id="postHeight" value="6" min="3" aria-label="Post Height">
  <label>Picket width (in)</label>
  <input type="number" id="picketWidth" value="6" min="2" max="12" aria-label="Picket Width">
  <label>Picket spacing (in)</label>
  <input type="number" id="picketSpacing" value="2" min="0" max="6" aria-label="Picket Spacing">
  <label>Rails per section</label>
  <input type="number" id="rails" value="2" min="1" max="4" aria-label="Rails">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const len = parseFloat(document.getElementById('length').value) || 0;
    const ps = parseFloat(document.getElementById('postSpacing').value) || 8;
    const ph = parseFloat(document.getElementById('postHeight').value) || 6;
    const pw = parseFloat(document.getElementById('picketWidth').value) || 6;
    const psp = parseFloat(document.getElementById('picketSpacing').value) || 2;
    const rails = parseInt(document.getElementById('rails').value) || 2;
    const posts = Math.ceil(len / ps) + 1;
    const sections = posts - 1;
    const totalRails = sections * rails;
    const railLen = sections * ps;
    const picketPitch = (pw + psp) / 12;
    const pickets = Math.ceil(len / picketPitch);
    const concreteBags = Math.ceil(posts * 2);
    document.getElementById('bigResult').textContent = `${posts} posts needed`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Sections:</span><span>${sections}</span></div>
      <div class="result-row"><span>Rails:</span><span>${totalRails} boards (${railLen.toFixed(0)} ft total)</span></div>
      <div class="result-row"><span>Pickets:</span><span>${pickets} (${pw}" wide, ${psp}" spacing)</span></div>
      <div class="result-row"><span>Concrete:</span><span>${concreteBags} bags (2 per post)</span></div>
      <div class="result-row"><span>Post height:</span><span>${ph} ft (add 1 ft for ground)</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
