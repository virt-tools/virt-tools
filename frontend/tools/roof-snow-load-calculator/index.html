<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Roof Snow Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Roof Snow Load Calculator</h1>
<p>Calculate roof snow load from snow depth, density, roof area, and pitch. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Snow depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-density">Snow density</label><input type="text" id="in-density" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">kg/m³</div></div>
<div class="field"><label class="f" for="in-area">Roof area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-pitch">Roof pitch</label><input type="text" id="in-pitch" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">degrees</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter snow depth.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-depth"),deEl=document.getElementById("in-density"),aEl=document.getElementById("in-area"),pEl=document.getElementById("in-pitch"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),DE=pn(deEl.value),A=pn(aEl.value),P=pn(pEl.value);
if(D==null){return}
DE=DE==null?200:DE;A=A==null?100:A;P=P==null?30:P;
if(!isFinite(D)||!isFinite(DE)||D<=0||DE<=0||A<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var pf=Math.cos(P*Math.PI/180);
var load=D*DE*pf;
var totalMass=D*DE*A*pf;
var html='<div class="big">'+rnd(load,0)+' Pa</div>';
html+=row("Snow depth",rnd(D*100,0)+" cm");
html+=row("Snow density",rnd(DE,0)+" kg/m³");
html+=row("Roof area",rnd(A,0)+" m²");
html+=row("Roof pitch",rnd(P,0)+"°");
html+=row("Snow load",rnd(load,0)+" Pa ("+rnd(load/9.81,1)+" kg/m²)");
html+=row("Total snow mass",rnd(totalMass,0)+" kg");
out.innerHTML=html;
}
[dEl,deEl,aEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
