<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Excavation Shoring Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select,.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Excavation Shoring Calculator</h1>
<p>Determine the required shoring type for an excavation based on depth and soil classification. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Excavation depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-s">Soil type</label><select id="in-s"><option value="">Select…</option><option value="stable">Type A — Stable</option><option value="less">Type B — Less stable</option><option value="unstable">Type C — Unstable</option></select><div class="unit">OSHA class</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),S=sEl.value;
if(D==null||!S)return;
if(!isFinite(D)||D<=0){err.textContent="Enter valid depth.";return}
err.textContent="";
var maxUnshored={stable:20,less:12,unstable:5};
var maxSloped={stable:20,less:12,unstable:5};
var needShoring=D>maxUnshored[S];
var shoringType=needShoring?"Required":"Not required";
var slopeRatio={stable:"1.5:1 (H:V)",less:"1:1 (H:V)",unstable:"1.5:1 (H:V)"};
var html='<div class="big">'+shoringType+'</div>';
html+=row("Shoring",shoringType);
html+=row("Max unshored depth",maxUnshored[S]+' ft');
if(needShoring){
  html+=row("Option: Sloping",slopeRatio[S]);
  html+=row("Option: Trench shield","Use rated box");
  html+=row("Option: Shoring","Hydraulic/aluminum");
}
html+=row("Excavation depth",D+' ft');
out.innerHTML=html;
}
[dEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
