<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibonacci Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Fibonacci Sequence Calculator</h1>
<p class="subtitle">Generate Fibonacci numbers, find the nth term, and check the golden ratio.</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="nth" selected>Find nth Fibonacci number</option>
<option value="range">Generate sequence up to n</option>
<option value="check">Check if a number is Fibonacci</option>
</select>
<label>n</label>
<input type="number" id="n" value="10" min="0" step="1" aria-label="N">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function fibNth(n){
let a=0n,b=1n;for(let i=0;i<n;i++){[a,b]=[b,a+b];}return a;
}
function fibUpTo(n){
let a=0n,b=1n,seq=[0];for(let i=0;i<n;i++){seq.push(Number(b));[a,b]=[b,a+b];}return seq;
}
function isFib(x){
let a=0n,b=1n;while(b<=BigInt(x)){if(b===BigInt(x))return true;[a,b]=[b,a+b];}return x===0;
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const n=parseInt(document.getElementById('n').value)||0;
const mode=document.getElementById('mode').value;
let html;
if(mode==='nth'){
const f=fibNth(n);
html=`<div class="result-row"><span>F(${n}) =</span><span>${f.toString()}</span></div>
<div class="result-row"><span>Digits:</span><span>${f.toString().length}</span></div>
<div class="result-row"><span>Approximate (φⁿ/√5):</span><span>${(Math.pow((1+Math.sqrt(5))/2,n)/Math.sqrt(5)).toExponential(6)}</span></div>`;
}else if(mode==='range'){
const seq=fibUpTo(n);
html=`<div class="result-row"><span>Sequence length:</span><span>${seq.length} terms</span></div>
<div class="result-row"><span>Last term:</span><span>${seq[seq.length-1]}</span></div>
<p class="hint">F(0)..F(${n}): ${seq.slice(0,30).join(', ')}${seq.length>30?'...':''}</p>`;
}else{
const x=parseInt(document.getElementById('n').value)||0;
html=`<div class="result-row"><span>${x}:</span><span>${isFib(x)?'✓ Is a Fibonacci number':'✗ Not a Fibonacci number'}</span></div>`;
}
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
