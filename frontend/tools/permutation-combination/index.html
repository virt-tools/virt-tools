<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permutation & Combination Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Permutation & Combination Calculator</h1>
<p class="subtitle">Calculate nPr (permutations) and nCr (combinations) with factorial.</p>
<div class="input-section">
<label>n (total items)</label>
<input type="number" id="n" value="10" min="0" step="1" aria-label="N">
<label>r (chosen items)</label>
<input type="number" id="r" value="3" min="0" step="1" aria-label="R">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;" aria-live="polite"></div>
<script>
function factorial(n){if(n<0)return NaN;if(n>170)return Infinity;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function permVal(n,r){let p=1;for(let i=n-r+1;i<=n;i++)p*=i;return p;}
function combVal(n,r){if(2*r>n)r=n-r;let c=1;for(let i=1;i<=r;i++)c=c*(n-r+i)/i;return c;}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const n=parseInt(document.getElementById('n').value)||0;
const r=parseInt(document.getElementById('r').value)||0;
if(n<0||r<0||r>n){document.getElementById('result').innerHTML='<p class="warning">Ensure n ≥ r ≥ 0.</p>';document.getElementById('result').style.display='block';return;}
if(n>100000){document.getElementById('result').innerHTML='<p class="warning">n must be at most 100,000.</p>';document.getElementById('result').style.display='block';return;}
const nfact=factorial(n);
const rfact=factorial(r);
const nrfact=factorial(n-r);
const perm=permVal(n,r);
const comb=combVal(n,r);
if(!Number.isFinite(perm)||!Number.isFinite(comb)){document.getElementById('result').innerHTML='<p class="warning">Result exceeds the supported numeric range.</p>';document.getElementById('result').style.display='block';return;}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>n!:</span><span>${n>170?'∞':nfact.toLocaleString()}</span></div>
<div class="result-row"><span>r!:</span><span>${r>170?'∞':rfact.toLocaleString()}</span></div>
<div class="result-row"><span>(n−r)!:</span><span>${(n-r)>170?'∞':nrfact.toLocaleString()}</span></div>
<div class="result-row"><span>P(n,r) = n!/(n−r)!:</span><span>${perm.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>
<div class="result-row"><span>C(n,r) = n!/(r!(n−r)!):</span><span>${comb.toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
