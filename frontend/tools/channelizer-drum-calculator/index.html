<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Channelizer Drum Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-4aca7a6b.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Channelizer Drum Calculator</h1>
<p>Calculate the number of channelizer drums needed for a lane shift or merge based on distance and speed. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Distance</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-s">Speed limit</label><select id="in-s"><option value="">Select…</option><option value="low">≤30 mph</option><option value="med">35-50 mph</option><option value="high">55+ mph</option></select><div class="unit">speed</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),S=sEl.value;
if(D==null||!S)return;
if(!isFinite(D)||D<=0){err.textContent="Enter valid distance.";return}
err.textContent="";
var spacing;
if(S==="low")spacing=40;
else if(S==="med")spacing=80;
else spacing=160;
var drums=Math.ceil(D/spacing)+2;
var html='<div class="big">'+drums+' drums</div>';
html+=row("Distance",rnd(D,0)+' ft');
html+=row("Drum spacing",spacing+' ft');
html+=row("Total drums",drums);
out.innerHTML=html;
}
[dEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
