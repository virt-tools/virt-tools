<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Notebook Page Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input,.ctrl-row textarea{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📓 CSS Notebook Page Generator</h1>
<p>Create CSS lined/grid/dot notebook page with red margin line. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="lined">Lined</option><option value="grid">Grid</option><option value="dot">Dot Grid</option><option value="ruled">Ruled (narrow)</option></select></div>
<div class="ctrl-row"><label>Page Color</label><input type="color" id="pc" value="#fefcf3"></div>
<div class="ctrl-row"><label>Line Color</label><input type="color" id="lc" value="#c8d4e0"></div>
<div class="ctrl-row"><label>Margin Line</label><select id="ml"><option value="yes">Yes (red)</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Width</label><input type="range" id="w" min="200" max="400" step="10" value="300" style="width:200px"></div>
<div class="ctrl-row"><label>Holes</label><select id="holes"><option value="yes">Yes (3-hole)</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var pc=document.getElementById('pc').value;
var lc=document.getElementById('lc').value;
var ml=document.getElementById('ml').value;
var w=document.getElementById('w').value;
var holes=document.getElementById('holes').value;
var html='<div class="notebook-page">\n  <div class="page-content"></div>\n</div>';
var css='.notebook-page{width:'+w+'px;min-height:300px;background:'+pc+';position:relative;box-shadow:2px 4px 12px rgba(0,0,0,0.15);';
var spacing=style==='ruled'?'20px':'28px';
if(style==='lined'||style==='ruled')css+='background-image:linear-gradient(to bottom,transparent '+spacing+', '+lc+' '+spacing+');background-size:100% '+spacing+'\n';
if(style==='grid')css+='background-image:linear-gradient('+lc+' 1px,transparent 1px),linear-gradient(90deg,'+lc+' 1px,transparent 1px);background-size:25px 25px\n';
if(style==='dot')css+='background-image:radial-gradient(circle,'+lc+' 1.5px,transparent 1.5px);background-size:25px 25px\n';
css+='}\n';
if(ml==='yes')css+='.notebook-page::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:#e53e3e;opacity:0.5}\n';
if(holes==='yes')css+='.notebook-page::after{content:"";position:absolute;right:20px;top:60px;width:12px;height:12px;border-radius:50%;background:#1a1a2e;box-shadow:0 80px 0 #1a1a2e,0 160px 0 #1a1a2e}\n';
css+='.page-content{padding:20px 20px 20px 60px;min-height:280px}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','pc','lc','ml','w','holes'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
