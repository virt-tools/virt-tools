<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Matrix Rain Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#000;border-radius:12px;overflow:hidden;position:relative;height:400px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🟢 CSS Matrix Rain Generator</h1>
<p>Create CSS Matrix digital rain animation. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Columns</label><input type="range" id="cols" min="5" max="40" step="1" value="20" style="width:200px"></div>
<div class="ctrl-row"><label>Speed</label><input type="range" id="speed" min="1" max="20" step="1" value="6" style="width:200px"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="10" max="30" step="1" value="16" style="width:200px"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#00ff00"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#000000"></div>
<div class="ctrl-row"><label>Chars</label><select id="chars"><option value="matrix">0110</option><option value="katakana">カタカナ</option><option value="binary">01</option><option value="hex">0xABCDEF</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var charsets={matrix:'01101001',katakana:'カタカナナニ',binary:'01',hex:'0123456789ABCDEF'};
function update(){
var cols=parseInt(document.getElementById('cols').value);
var sp=parseFloat(document.getElementById('speed').value);
var fs=parseInt(document.getElementById('fsize').value);
var color=document.getElementById('color').value;
var bg=document.getElementById('bgcolor').value;
var cset=document.getElementById('chars').value;
var chars=charsets[cset];
var html='<div class="matrix">\n';
for(var i=0;i<cols;i++){
html+='  <div class="col" style="--i:'+i+'">\n';
for(var j=0;j<12;j++){
html+='    <span style="opacity:'+(1-j/12)+'">'+chars[Math.floor(Math.random()*chars.length)]+'</span>\n';
}
html+='  </div>\n';
}
html+='</div>';
var css='.matrix{width:100%;height:100%;background:'+bg+';overflow:hidden;display:flex;font-family:monospace;font-size:'+fs+'px;color:'+color+';line-height:1}\n';
css+='.col{flex:1;display:flex;flex-direction:column;animation:matrix-fall '+(20/sp)+'s linear infinite;animation-delay:calc(var(--i) * 0.3s)}\n';
css+='.col span{text-align:center}\n';
css+='@keyframes matrix-fall{from{transform:translateY(-100%)}to{transform:translateY(400px)}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['cols','speed','fsize','color','bgcolor','chars'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
