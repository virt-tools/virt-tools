<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Access Control Reader Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Access Control Reader Calculator</h1>
<p>Calculate the number of card readers, controllers, and power supplies needed for an access control system. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-doors">Doors</label><input type="text" id="in-doors" inputmode="numeric" autocomplete="off" placeholder="e.g. 12"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-users">Users</label><input type="text" id="in-users" inputmode="numeric" autocomplete="off" placeholder="e.g. 200"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-doors"),uEl=document.getElementById("in-users"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),U=pn(uEl.value);
if(D==null||U==null)return;
if(!isFinite(D)||D<=0||!isFinite(U)||U<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var readers=D*2;
var controllers=Math.ceil(D/2);
var psu=Math.ceil(D/4);
var html='<div class="big">'+D+' doors / '+readers+' readers</div>';
html+=row("Card readers",readers);
html+=row("Door controllers",controllers);
html+=row("Power supplies",psu);
html+=row("User capacity",U);
out.innerHTML=html;
}
[dEl,uEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
