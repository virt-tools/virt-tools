<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Crystal Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>💎 CSS Crystal Generator</h1>
<p>Create CSS animated crystal/gemstone with facets, glow, and rotation. 4 gem types. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Gem Type</label><select id="gem" aria-label="Gem"><option value="diamond">Diamond</option><option value="ruby">Ruby</option><option value="emerald">Emerald</option><option value="amethyst">Amethyst</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="80" max="200" step="5" value="120" style="width:200px" aria-label="Sz"></div>
<div class="ctrl-row"><label>Rotation</label><select id="rot" aria-label="Rot"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Glow</label><select id="glow" aria-label="Glow"><option value="on">On</option><option value="off">Off</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var gem=document.getElementById('gem').value;
var sz=parseInt(document.getElementById('sz').value);
var rot=document.getElementById('rot').value;
var glow=document.getElementById('glow').value;
var colors={diamond:['#e0f0ff','#a0d0ff','#60b0ff','#ffffff'],ruby:['#ff4040','#cc2020','#aa1010','#ffaaaa'],emerald:['#40ff80','#20cc50','#10aa30','#aaffcc'],amethyst:['#cc60ff','#aa40dd','#8820bb','#ddaaff']};
var c=colors[gem];
var html='<div class="crystal-wrap">\n  <div class="crystal">\n    <div class="facet top"></div>\n    <div class="facet left"></div>\n    <div class="facet right"></div>\n    <div class="facet bottom"></div>\n  </div>\n</div>';
var css='.crystal-wrap{perspective:600px}\n';
css+='.crystal{width:'+sz+'px;height:'+(sz*1.3)+'px;position:relative;transform-style:preserve-3d'+(rot==='on'?'':'')+'}\n';
if(rot==='on')css+='.crystal{animation:spin 4s linear infinite}\n@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}\n';
var g=glow==='on'?'box-shadow:0 0 '+(sz*0.2)+'px '+c[0]+'88;':'';
css+='.facet.top{position:absolute;top:0;left:0;width:0;height:0;border-left:'+(sz*0.5)+'px solid transparent;border-right:'+(sz*0.5)+'px solid transparent;border-bottom:'+(sz*0.3)+'px solid '+c[3]+';filter:drop-shadow(0 0 '+(sz*0.05)+'px '+c[0]+')}\n';
css+='.facet.left{position:absolute;top:'+(sz*0.3)+'px;left:0;width:0;height:0;border-top:'+(sz*0.3)+'px solid '+c[3]+';border-left:'+(sz*0.5)+'px solid '+c[2]+';border-bottom:'+(sz*0.7)+'px solid transparent;border-right:'+(sz*0.5)+'px solid '+c[1]+'}\n';
css+='.facet.right{position:absolute;top:'+(sz*0.3)+'px;right:0;width:0;height:0;border-top:'+(sz*0.3)+'px solid '+c[3]+';border-left:'+(sz*0.5)+'px solid '+c[1]+';border-bottom:'+(sz*0.7)+'px solid transparent;border-right:'+(sz*0.5)+'px solid '+c[2]+'}\n';
css+='.facet.bottom{position:absolute;top:'+(sz*0.6)+'px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:'+(sz*0.5)+'px solid '+c[1]+';border-right:'+(sz*0.5)+'px solid '+c[2]+';border-top:'+(sz*0.7)+'px solid transparent;'+g+'}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['gem','sz','rot','glow'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
