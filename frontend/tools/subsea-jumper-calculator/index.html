<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Subsea Jumper Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Subsea Jumper Calculator</h1>
<p>Calculate subsea jumper length, M-shaped span, and wall thickness from hub spacing and water depth. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-spacing">Hub spacing</label><input type="text" id="in-spacing" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-depth">Water depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-press">Design pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sE=document.getElementById("in-spacing"),dE=document.getElementById("in-depth"),pE=document.getElementById("in-press"),out=document.getElementById("out");
function calc(){
var s=parseFloat(sE.value),d=parseFloat(dE.value),p=parseFloat(pE.value);
if(isNaN(s)||isNaN(d)||isNaN(p))return;
var jumperLen=s*1.5+10;
var span=s+5;
var dia=Math.sqrt(p/500)*2;
var html='<div class="big">'+(Math.round(jumperLen*10)/10)+' ft</div>';
html+=row("Jumper length",Math.round(jumperLen*10)/10+' ft');
html+=row("Span width",span+' ft');
html+=row("Pipe diameter",Math.round(dia*10)/10+' in');
out.innerHTML=html;
}
[sE,dE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
