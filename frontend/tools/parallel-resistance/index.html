<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallel Resistance Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Parallel & Series Resistance Calculator</h1>
<p class="subtitle">Calculate total resistance for resistors in series or parallel.</p>
<div class="input-section">
<label>Configuration</label>
<select id="config" aria-label="Config">
<option value="parallel" selected>Parallel</option>
<option value="series">Series</option>
</select>
<div id="resistors">
<div class="res-row">
<input type="number" placeholder="Resistance (Ω)" class="val" value="100" step="any" aria-label="Resistance (Ω)">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
<div class="res-row">
<input type="number" placeholder="Resistance (Ω)" class="val" value="200" step="any" aria-label="Resistance (Ω)">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
</div>
<button id="addRow" class="secondary-btn" type="button">+ Add Resistor</button>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('addRow').addEventListener('click',()=>{
const row=document.createElement('div');
row.className='res-row';
row.innerHTML=`<input type="number" placeholder="Resistance (Ω)" class="val" step="any" aria-label="Resistance (Ω)">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>`;
document.getElementById('resistors').appendChild(row);
});
document.getElementById('calc').addEventListener('click',()=>{
const config=document.getElementById('config').value;
const rows=document.querySelectorAll('.res-row .val');
let values=[];
rows.forEach(r=>{const v=parseFloat(r.value);if(!isNaN(v)&&v>0)values.push(v);});
let total;
if(config==='parallel'){total=1/values.reduce((s,c)=>s+1/c,0);}
else{total=values.reduce((s,c)=>s+c,0);}
const current=12/total;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Configuration:</span><span>${config.charAt(0).toUpperCase()+config.slice(1)}</span></div>
<div class="result-row"><span>Number of Resistors:</span><span>${values.length}</span></div>
<div class="result-row"><span>Total Resistance:</span><span>${total.toFixed(4)} Ω (${(total/1000).toFixed(6)} kΩ)</span></div>
<div class="result-row"><span>At 12V:</span><span>${current.toFixed(4)} A current draw</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
