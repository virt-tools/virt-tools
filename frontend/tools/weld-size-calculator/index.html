<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Weld Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Weld Size Calculator</h1>
<p>Calculate minimum fillet weld size and capacity based on plate thickness and electrode strength. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-t">Plate thickness</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-fw">Weld strength</label><input type="text" id="in-fw" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">MPa</div></div>
<div class="field"><label class="f" for="in-len">Weld length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter plate thickness.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var tEl=document.getElementById("in-t"),fwEl=document.getElementById("in-fw"),lEl=document.getElementById("in-len"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var T=pn(tEl.value),FW=pn(fwEl.value),L=pn(lEl.value);
if(T==null){return}
FW=FW==null?200:FW;L=L==null?100:L;
if(!isFinite(T)||!isFinite(FW)||!isFinite(L)||T<=0||FW<=0||L<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var minWeld=Math.max(3,T*0.5*Math.sqrt(2)/2);
var effThroat=minWeld*0.707;
var capacity=effThroat*FW*L/1000;
var html='<div class="big">'+rnd(minWeld,1)+' mm</div>';
html+=row("Plate thickness",rnd(T,1)+" mm");
html+=row("Min weld size",rnd(minWeld,1)+" mm");
html+=row("Effective throat",rnd(effThroat,2)+" mm");
html+=row("Weld length",rnd(L,0)+" mm");
html+=row("Capacity",rnd(capacity,1)+" kN");
out.innerHTML=html;
}
[tEl,fwEl,lEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
