<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Fade In/Out — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Fade In/Out</h1>
<p class="subtitle">Add fade-in and fade-out to audio. Export as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label style="display:block;margin-top:8px;">Fade in (s): <input type="number" id="fadeIn" value="2" min="0" step="0.5" style="width:80px;"></label>
<label style="display:block;margin-top:4px;">Fade out (s): <input type="number" id="fadeOut" value="3" min="0" step="0.5" style="width:80px;"></label>
<button id="process" class="primary-btn" style="margin-top:8px;" type="button">Process & Download</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
<audio id="player" controls style="display:none;margin-top:1em;width:100%;"></audio>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const status=document.getElementById('status');
const player=document.getElementById('player');
status.textContent='Processing...';
const arr=await file.arrayBuffer();
const ctx=new AudioContext();
const audio=await ctx.decodeAudioData(arr);
const fi=+document.getElementById('fadeIn').value||0;
const fo=+document.getElementById('fadeOut').value||0;
const offline=new OfflineAudioContext(audio.numberOfChannels,audio.length,audio.sampleRate);
const src=offline.createBufferSource();
src.buffer=audio;
const gn=offline.createGain();
const sr=audio.sampleRate;
const fiS=Math.min(fi*sr,audio.length);
const foS=Math.max(0,audio.length-fo*sr);
gn.gain.setValueAtTime(0,0);
gn.gain.linearRampToValueAtTime(1,fiS);
gn.gain.setValueAtTime(1,foS);
gn.gain.linearRampToValueAtTime(0,audio.length);
src.connect(gn);gn.connect(offline.destination);src.start();
const rendered=await offline.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const url=URL.createObjectURL(blob);
player.src=url;player.style.display='block';
const a=document.createElement('a');a.href=url;a.download='faded.wav';a.click();
status.textContent='Done! Faded audio downloaded.';
});
function audioBufferToWav(buffer){
const numCh=buffer.numberOfChannels;
const len=buffer.length*numCh*2+44;
const arr=new ArrayBuffer(len);
const view=new DataView(arr);
const chs=[];for(let i=0;i<numCh;i++)chs.push(buffer.getChannelData(i));
let off=0;
const writeStr=s=>{for(let j=0;j<s.length;j++)view.setUint8(off++,s.charCodeAt(j));};
writeStr('RIFF');view.setUint32(off,36+len-44,true);off+=4;writeStr('WAVE');
writeStr('fmt ');view.setUint32(off,16,true);off+=4;
view.setUint16(off,1,true);off+=2;view.setUint16(off,numCh,true);off+=2;
view.setUint32(off,buffer.sampleRate,true);off+=4;
view.setUint32(off,buffer.sampleRate*numCh*2,true);off+=4;
view.setUint16(off,numCh*2,true);off+=2;view.setUint16(off,16,true);off+=2;
writeStr('data');view.setUint32(off,len-44,true);off+=4;
for(let i=0;i<buffer.length;i++){
for(let c=0;c<numCh;c++){
let s=Math.max(-1,Math.min(1,chs[c][i]));
view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
}
}
return arr;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
