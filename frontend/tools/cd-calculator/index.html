<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.cd{max-width:500px;margin:0 auto;padding:2rem 1rem}
.cd h1{font-size:2rem;margin-bottom:.5rem}
.cd .sub{color:#888;margin-bottom:1.5rem}
.cd label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.cd input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.cd .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.cd .results{margin-top:2rem}
.cd .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.cd .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.cd .res-card .lbl{color:#888;font-size:13px}
.cd .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cd table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.cd th,.cd td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.cd th{text-align:left;color:#888;font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="cd">
<h1>🏦 CD Calculator</h1>
<p class="sub">Calculate Certificate of Deposit earnings and interest for any term.</p>
<label for="principal">Deposit amount ($):</label>
<input type="number" id="principal" value="10000" min="0" oninput="calc()">
<label for="rate">Annual interest rate (%):</label>
<input type="number" id="rate" value="4.5" min="0" step="0.01" oninput="calc()">
<label for="term">Term (months):</label>
<input type="number" id="term" value="12" min="1" oninput="calc()">
<label for="comp">Compounding frequency:</label>
<select id="comp" onchange="calc()" style="width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:4px">
<option value="1">Annually</option>
<option value="4">Quarterly</option>
<option value="12" selected>Monthly</option>
<option value="365">Daily</option>
</select>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const P=parseFloat(document.getElementById('principal').value)||0;
  const r=(parseFloat(document.getElementById('rate').value)||0)/100;
  const t=parseInt(document.getElementById('term').value)||1;
  const n=parseInt(document.getElementById('comp').value)||12;
  const years=t/12;
  const FV=P*Math.pow(1+r/n,n*years);
  const interest=FV-P;
  const apy=(Math.pow(1+r/n,n)-1)*100;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Final Value</div><div class="big" style="color:#27ae60">$'+FV.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Interest</div><div class="big" style="color:#27ae60">$'+interest.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='</div>';
  html+='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">APY</div><div class="big" style="color:#e67e22">'+apy.toFixed(3)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Term Length</div><div class="big">'+t+' mo</div></div>';
  html+='</div>';
  html+='<table><tr><th>Month</th><th>Balance</th><th>Interest</th></tr>';
  let bal=P;
  for(let m=1;m<=t;m++){
    if(m%n===0||m===t){
      const i=bal*(r/n);
      bal+=i;
      if(m%3===0||m===t)
        html+='<tr><td>'+m+'</td><td>$'+bal.toLocaleString(undefined,{maximumFractionDigits:2})+'</td><td>$'+i.toLocaleString(undefined,{maximumFractionDigits:2})+'</td></tr>';
    }
  }
  html+='</table>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
