<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Time Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Time Unit Converter</h1><p class="subtitle">Convert between all supported time units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Time","units":[{"slug":"nanoseconds","name":"Nanoseconds","symbol":"ns","scale":1e-09,"offset":0},{"slug":"microseconds","name":"Microseconds","symbol":"µs","scale":1e-06,"offset":0},{"slug":"milliseconds","name":"Milliseconds","symbol":"ms","scale":0.001,"offset":0},{"slug":"seconds","name":"Seconds","symbol":"s","scale":1,"offset":0},{"slug":"minutes","name":"Minutes","symbol":"min","scale":60,"offset":0},{"slug":"hours","name":"Hours","symbol":"h","scale":3600,"offset":0},{"slug":"days","name":"Days","symbol":"d","scale":86400,"offset":0},{"slug":"weeks","name":"Weeks","symbol":"wk","scale":604800,"offset":0},{"slug":"fortnights","name":"Fortnights","symbol":"fortnight","scale":1209600,"offset":0},{"slug":"julian-years","name":"Julian years","symbol":"a","scale":31557600,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
