<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Transpose — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Transpose</h1>
<p class="subtitle">Swap rows and columns in CSV data. Useful for pivoting tables. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV</label>
<textarea id="input" rows="10" placeholder="a,b,c&#10;1,2,3&#10;4,5,6" aria-label="A,B,C&#10;1,2,3&#10;4,5,6"></textarea>
<button id="convert" class="primary-btn" type="button">Transpose</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function transpose(rows){
const max=Math.max(...rows.map(r=>r.length));
const out=[];
for(let c=0;c<max;c++){out.push(rows.map(r=>r[c]||''));}
return out;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
document.getElementById('convert').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
const rows=parseCSV(input);
const transposed=transpose(rows);
const csvOut=toCSV(transposed);
const ta=document.createElement('textarea');ta.value=csvOut;ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
