<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Bounce Animation Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏀 CSS Bounce Animation Generator</h1>
<p>Create CSS bounce, jello, wobble, and elastic animations. 6 presets, adjustable distance, speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Animation</label><select id="anim" aria-label="Anim"><option value="bounce">Bounce</option><option value="jello">Jello</option><option value="wobble">Wobble</option><option value="elastic">Elastic</option><option value="rubber">Rubber Band</option><option value="pendulum">Pendulum</option></select></div>
<div class="ctrl-row"><label>Distance</label><input type="range" id="dist" min="10" max="80" value="40" style="width:200px" aria-label="Dist"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="0.3" max="3" step="0.1" value="1" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#667eea" aria-label="Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="30" max="100" value="60" style="width:200px" aria-label="Size"></div>
<div class="ctrl-row"><label>Loop</label><input type="checkbox" id="loop" checked aria-label="Loop"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var a=document.getElementById('anim').value;
var d=parseInt(document.getElementById('dist').value);
var sp=parseFloat(document.getElementById('speed').value);
var cl=document.getElementById('color').value;
var sz=parseInt(document.getElementById('size').value);
var lp=document.getElementById('loop').checked;
var it=lp?'infinite':'1';
var html='<div class="bounce-anim"></div>';
var css='.bounce-anim{width:'+sz+'px;height:'+sz+'px;background:'+cl+';border-radius:50%;animation:ba-'+a+' '+sp+'s ease-in-out '+it+'}\n';
if(a==='bounce'){
css+='@keyframes ba-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-'+d+'px)}}\n';
}else if(a==='jello'){
css+='@keyframes ba-jello{0%,100%{transform:skew(0,0)}30%{transform:skew(-'+(d/3)+'deg,0)}40%{transform:skew('+(d/3)+'deg,0)}50%{transform:skew(-'+(d/4)+'deg,0)}60%{transform:skew('+(d/4)+'deg,0)}}\n';
}else if(a==='wobble'){
css+='@keyframes ba-wobble{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-'+d+'px) rotate(-5deg)}30%{transform:translateX('+d+'px) rotate(3deg)}45%{transform:translateX(-'+d/2+'px) rotate(-3deg)}60%{transform:translateX('+d/2+'px) rotate(2deg)}}\n';
}else if(a==='elastic'){
css+='@keyframes ba-elastic{0%{transform:scale(0)}55%{transform:scale(1.'+(d/10)+')}70%{transform:scale(0.'+(10-d/10)+')}85%{transform:scale(1.0'+(d/20)+')}100%{transform:scale(1)}}\n';
}else if(a==='rubber'){
css+='@keyframes ba-rubber{0%,100%{transform:scale(1,1)}30%{transform:scale('+(1+d/100)+',0.8)}40%{transform:scale(0.8,'+(1+d/100)+')}50%{transform:scale('+(1+d/80)+',0.8)}65%{transform:scale(0.9,1.'+(d/20)+')}75%{transform:scale('+(1+d/200)+'px,0.95)}}\n';
}else if(a==='pendulum'){
css+='@keyframes ba-pendulum{0%,100%{transform:rotate(-'+d+'deg)}50%{transform:rotate('+d+'deg)}}\n';
css+='.bounce-anim{border-radius:50%;transform-origin:top center}\n';
}
var pv=document.getElementById('preview');
pv.innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['anim','dist','speed','color','size','loop'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
