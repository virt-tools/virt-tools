<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Frequency Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Frequency Unit Converter</h1><p class="subtitle">Convert between all supported frequency units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Frequency","units":[{"slug":"millihertz","name":"Millihertz","symbol":"mHz","scale":0.001,"offset":0},{"slug":"hertz","name":"Hertz","symbol":"Hz","scale":1,"offset":0},{"slug":"kilohertz","name":"Kilohertz","symbol":"kHz","scale":1000.0,"offset":0},{"slug":"megahertz","name":"Megahertz","symbol":"MHz","scale":1000000.0,"offset":0},{"slug":"gigahertz","name":"Gigahertz","symbol":"GHz","scale":1000000000.0,"offset":0},{"slug":"terahertz","name":"Terahertz","symbol":"THz","scale":1000000000000.0,"offset":0},{"slug":"revolutions-per-minute","name":"Revolutions per minute","symbol":"rpm","scale":0.016666666666666666,"offset":0},{"slug":"beats-per-minute","name":"Beats per minute","symbol":"bpm","scale":0.016666666666666666,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
