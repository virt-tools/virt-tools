<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gas Lift Design Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gas Lift Design Calculator</h1>
<p>Calculate gas lift injection rate, valve depth, and GLR optimization from well depth and production targets. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-depth">Well depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rate">Production rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-glr">Target GLR</label><input type="text" id="in-glr" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">scf/bbl</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-depth"),rE=document.getElementById("in-rate"),gE=document.getElementById("in-glr"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),r=parseFloat(rE.value),g=parseFloat(gE.value);
if(isNaN(d)||isNaN(r)||isNaN(g))return;
var natGLR=200;
var gasInj=(g-natGLR)*r;
var valveDepth=d*0.6;
var html='<div class="big">'+Math.round(gasInj).toLocaleString()+' scf/day</div>';
html+=row("Gas injection rate",Math.round(gasInj).toLocaleString()+' scf/day');
html+=row("First valve depth",Math.round(valveDepth)+' ft');
html+=row("Number of valves",Math.ceil(d/1000));
out.innerHTML=html;
}
[dE,rE,gE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
