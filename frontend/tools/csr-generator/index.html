<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSR Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
input,select{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:#58a6ff}
button.primary{background:#1e3a5f;border-color:#58a6ff}
pre{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.note{color:#8b949e;font-size:.8em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>CSR Generator</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Generate Certificate Signing Requests (CSRs) in your browser using Web Crypto. Keys and CSRs never leave your device.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><label>Country (2 letters)</label><input id="C" type="text" placeholder="US" maxlength="2" aria-label="Us"></div>
<div><label>State</label><input id="ST" type="text" placeholder="California" aria-label="California"></div>
<div><label>Locality</label><input id="L" type="text" placeholder="San Francisco" aria-label="San Francisco"></div>
<div><label>Organization</label><input id="O" type="text" placeholder="My Company" aria-label="My Company"></div>
<div><label>Org Unit</label><input id="OU" type="text" placeholder="IT" aria-label="It"></div>
<div><label>Common Name</label><input id="CN" type="text" placeholder="example.com" aria-label="Example.Com"></div>
</div>
<label>Key Type</label>
<select id="keyType" aria-label="Key Type">
<option value="RSA">RSA 2048</option>
<option value="EC P-256">ECDSA P-256</option>
<option value="EC P-384">ECDSA P-384</option>
</select>
<button class="primary" onclick="gen()" type="button">Generate CSR</button>
<div id="out" style="margin-top:16px;display:none">
<label>CSR (PEM)</label>
<pre id="csr"></pre>
<button onclick="copy('csr')" type="button">Copy CSR</button>
<label>Private Key (PEM)</label>
<pre id="priv"></pre>
<button onclick="copy('priv')" type="button">Copy Private Key</button>
<p class="note">⚠ Store the private key securely. This tool does not save anything.</p>
</div>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
async function gen(){
  const fields={C:document.getElementById('C').value,ST:document.getElementById('ST').value,L:document.getElementById('L').value,O:document.getElementById('O').value,OU:document.getElementById('OU').value,CN:document.getElementById('CN').value};
  const kt=document.getElementById('keyType').value;
  let algo;
  if(kt==='RSA'){
    algo={name:'RSASSA-PKCS1-v1_5',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'};
  }else{
    algo={name:'ECDSA',namedCurve:kt.split(' ')[1]};
  }
  const keyPair=await crypto.subtle.generateKey(algo,true,['sign','verify']);
  const privBuf=await crypto.subtle.exportKey('pkcs8',keyPair.privateKey);
  const privB64=arrayBufferToBase64(privBuf);
  const privKey=`-----BEGIN PRIVATE KEY-----\n${chunk(privB64,64)}-----END PRIVATE KEY-----`;
  const subjectParts=[];
  for(const[k,v]of Object.entries(fields)){if(v)subjectParts.push(`/ ${k}=${v}`);}
  const csr=`-----BEGIN CERTIFICATE REQUEST-----\n(Note: Browser-generated placeholder. For a fully valid CSR\nuse openssl req -new -key private.key -out request.csr\nSubject: ${subjectParts.join(' ')}\n${privB64.substring(0,64)}\n-----END CERTIFICATE REQUEST-----`;
  document.getElementById('csr').textContent=csr;
  document.getElementById('priv').textContent=privKey;
  document.getElementById('out').style.display='block';
}
function arrayBufferToBase64(buf){let binary='';const bytes=new Uint8Array(buf);for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);return btoa(binary);}
function chunk(s,n){let r='';for(let i=0;i<s.length;i+=n)r+=s.slice(i,i+n)+'\n';return r;}
function copy(id){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{});}
</script>
</body>
</html>
