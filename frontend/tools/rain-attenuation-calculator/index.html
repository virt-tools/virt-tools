<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rain Attenuation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:16px;font-family:inherit;padding:2px 0;outline:none}
.field select option{background:var(--bg-elev,#171a21);color:var(--text,#e6e6e6)}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rain Attenuation Calculator</h1>
<p>Estimate rain attenuation on a satellite link using the ITU-R P.838-3 model. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-f">Frequency</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">GHz</div></div>
<div class="field"><label class="f" for="in-r">Rain rate</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">mm/hr</div></div>
<div class="field"><label class="f" for="in-d">Path length</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">km</div></div>
<div class="field"><label class="f" for="in-pol">Polarization</label><select id="in-pol"><option value="C" selected>Circular</option><option value="H">Horizontal</option><option value="V">Vertical</option></select><div class="unit">polarization</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function msg(t){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">'+t+'</span>';}
var fE=document.getElementById("in-f"),rE=document.getElementById("in-r"),dE=document.getElementById("in-d"),pE=document.getElementById("in-pol"),out=document.getElementById("out");
// Curve-fit coefficients from Rec. ITU-R P.838-3 (2005), Tables 1-4
var KH={aj:[-5.33980,-0.35351,-0.23789,-0.94158],bj:[-0.10008,1.26970,0.86036,0.64552],cj:[1.13098,0.45400,0.15354,0.16817],m:-0.18961,c:0.71147};
var KV={aj:[-3.80595,-3.44965,-0.39902,0.50167],bj:[0.56934,-0.22911,0.73042,1.07319],cj:[0.81061,0.51059,0.11899,0.27195],m:-0.16398,c:0.63297};
var AH={aj:[-0.14318,0.29591,0.32177,-5.37610,16.1721],bj:[1.82442,0.77564,0.63773,-0.96230,-3.29980],cj:[-0.55187,0.19822,0.13164,1.47828,3.43990],m:0.67849,c:-1.95537};
var AV={aj:[-0.07771,0.56727,-0.20238,-48.2991,48.5833],bj:[2.33840,0.95545,1.14520,0.791669,0.791459],cj:[-0.76284,0.54039,0.26809,0.116226,0.116479],m:-0.053739,c:0.83433};
function fit(co,lg){var s=co.m*lg+co.c;for(var j=0;j<co.aj.length;j++){var t=(lg-co.bj[j])/co.cj[j];s+=co.aj[j]*Math.exp(-t*t);}return s;}
function calc(){
var f=parseFloat(fE.value),r=parseFloat(rE.value),d=parseFloat(dE.value),pol=pE.value;
if(isNaN(f)||isNaN(r)||isNaN(d)){msg("Enter values to calculate.");return;}
if(!isFinite(f)||!isFinite(r)||!isFinite(d)){msg("Values are too large.");return;}
if(f<1||f>1000){msg("The ITU-R P.838-3 model is valid for frequencies from 1 to 1000 GHz.");return;}
if(r<0){msg("Rain rate cannot be negative.");return;}
if(d<0){msg("Path length cannot be negative.");return;}
var lg=Math.log(f)/Math.LN10;
var kh=Math.pow(10,fit(KH,lg)),kv=Math.pow(10,fit(KV,lg));
var ah=fit(AH,lg),av=fit(AV,lg);
var k,a,plabel;
if(pol==="H"){k=kh;a=ah;plabel="Horizontal";}
else if(pol==="V"){k=kv;a=av;plabel="Vertical";}
else{k=(kh+kv)/2;a=(kh*ah+kv*av)/(kh+kv);plabel="Circular";}
var gamma=k*Math.pow(r,a);
var att=gamma*d;
if(!isFinite(gamma)||!isFinite(att)){msg("Values are too large.");return;}
var html='<div class="big">'+(Math.round(att*100)/100)+' dB</div>';
html+=row("Rain attenuation",Math.round(att*100)/100+' dB');
html+=row("Specific attenuation",Math.round(gamma*1000)/1000+' dB/km');
html+=row("Polarization",plabel);
html+=row("Frequency",f+' GHz');
html+=row("Rain rate",r+' mm/hr');
html+=row("Path length",d+' km');
out.innerHTML=html;
}
[fE,rE,dE,pE].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
