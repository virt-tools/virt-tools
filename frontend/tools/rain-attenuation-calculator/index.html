<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rain Attenuation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rain Attenuation Calculator</h1>
<p>Estimate rain attenuation on a satellite link using the ITU-R model. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-f">Frequency</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">GHz</div></div>
<div class="field"><label class="f" for="in-r">Rain rate</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">mm/hr</div></div>
<div class="field"><label class="f" for="in-d">Path length</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">km</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fE=document.getElementById("in-f"),rE=document.getElementById("in-r"),dE=document.getElementById("in-d"),out=document.getElementById("out");
function calc(){
var f=parseFloat(fE.value),r=parseFloat(rE.value),d=parseFloat(dE.value);
if(isNaN(f)||isNaN(r)||isNaN(d))return;
var a=0.01,b=1.0;
if(f<10){a=0.0088;b=1.26;}
else if(f<20){a=0.0095;b=1.15;}
else if(f<30){a=0.012;b=1.07;}
else{a=0.015;b=1.0;}
var gamma=a*Math.pow(r,b);
var att=gamma*d;
var html='<div class="big">'+(Math.round(att*100)/100)+' dB</div>';
html+=row("Rain attenuation",Math.round(att*100)/100+' dB');
html+=row("Specific attenuation",Math.round(gamma*1000)/1000+' dB/km');
html+=row("Frequency",f+' GHz');
html+=row("Rain rate",r+' mm/hr');
out.innerHTML=html;
}
[fE,rE,dE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
