<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Portable Toilet Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-4aca7a6b.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Portable Toilet Calculator</h1>
<p>Calculate the number of portable toilets needed for a job site based on crew size and work week length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-c">Crew size</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">workers</div></div>
<div class="field"><label class="f" for="in-d">Days per week</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">days</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-c"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(cEl.value),D=pn(dEl.value);
if(C==null||D==null)return;
if(!isFinite(C)||C<=0||!isFinite(D)||D<=0||D>7){err.textContent="Enter valid values (days ≤ 7).";return}
err.textContent="";
var base=Math.ceil(C/10);
var weeklyAdj=Math.ceil(base*(D/5));
var adaMin=Math.max(1,Math.ceil(weeklyAdj*0.05));
var total=weeklyAdj+adaMin;
var html='<div class="big">'+total+' units</div>';
html+=row("Standard units",weeklyAdj);
html+=row("ADA units",adaMin);
html+=row("Crew size",C);
html+=row("Days/week",D);
out.innerHTML=html;
}
[cEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
