<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ci{max-width:550px;margin:0 auto;padding:2rem 1rem}
.ci h1{font-size:2rem;margin-bottom:.5rem}
.ci .sub{color:var(--text-dim);margin-bottom:1.5rem}
.ci label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.ci input,.ci select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.ci .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;margin-top:1.5rem}
.ci .results{margin-top:2rem}
.ci .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.ci .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.ci .res-card .lbl{color:var(--text-dim);font-size:13px}
.ci .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1rem}
.ci table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.ci th,.ci td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.ci th{text-align:left;color:var(--text-dim);font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="ci">
<h1>📈 Compound Interest Calculator</h1>
<p class="sub">See how your money grows with compound interest.</p>
<label for="principal">Initial investment ($):</label>
<input type="number" id="principal" value="10000" min="0" oninput="calc()">
<label for="monthly">Monthly contribution ($):</label>
<input type="number" id="monthly" value="500" min="0" oninput="calc()">
<label for="rate">Annual interest rate (%):</label>
<input type="number" id="rate" value="7" min="0" step="0.01" oninput="calc()">
<label for="years">Years:</label>
<input type="number" id="years" value="30" min="1" oninput="calc()">
<label for="freq">Compounding frequency:</label>
<select id="freq" onchange="calc()">
<option value="1">Annually</option>
<option value="2">Semi-annually</option>
<option value="4">Quarterly</option>
<option value="12" selected>Monthly</option>
<option value="365">Daily</option>
</select>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results" aria-live="polite"></div>
<p class="note">Monthly deposits are made at month-end. The selected compounding rate is converted to an equivalent monthly rate. Assumes a constant return, before taxes, fees and inflation; actual investment returns vary.</p>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const output=document.getElementById('results');
  const raw=['principal','monthly','rate','years'].map(id=>document.getElementById(id).value);
  const [P,PMT,annual,years]=raw.map(Number);
  if(raw.some(v=>!v.trim())||![P,PMT,annual,years].every(Number.isFinite)||P<0||PMT<0||P>1e12||PMT>1e12||annual<0||annual>100||!Number.isInteger(years)||years<1||years>100){output.textContent='Enter non-negative amounts up to 1 trillion, a rate from 0 to 100%, and 1–100 whole years.';return;}
  const r=annual/100,n=Number(document.getElementById('freq').value);
  const totalContrib=P+PMT*12*years;
  const monthlyLog=n/12*Math.log1p(r/n),monthlyRate=Math.expm1(monthlyLog);
  function balance(y){const growth=Math.expm1(monthlyLog*12*y);return P*(1+growth)+PMT*(monthlyRate===0?12*y:growth/monthlyRate);}
  const FV=balance(years);
  if(!Number.isFinite(FV)||FV>Number.MAX_SAFE_INTEGER/100){output.textContent='Result exceeds the supported currency range. Reduce the amount, rate, or term.';return;}
  const interest=FV-totalContrib;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Final Balance</div><div class="big" style="color:var(--ok)">$'+FV.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Interest</div><div class="big" style="color:var(--ok)">$'+interest.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Total Contributions</div><div class="big">$'+totalContrib.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='<details><summary>View all '+years+' years</summary><table><tr><th>Year</th><th>Balance</th><th>Interest</th></tr>';
  for(let y=1;y<=years;y++){
    const bv=balance(y);
    const iv=bv-(P+PMT*12*y);
    html+='<tr><td>'+y+'</td><td>$'+bv.toLocaleString(undefined,{maximumFractionDigits:0})+'</td><td>$'+iv.toLocaleString(undefined,{maximumFractionDigits:0})+'</td></tr>';
  }
  html+='</table></details>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
