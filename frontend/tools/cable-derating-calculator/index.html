<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cable Derating Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cable Derating Calculator</h1>
<p>Calculate derated cable ampacity from base ampacity applying temperature, grouping, and burial derating factors. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-amp">Base ampacity</label><input type="text" id="in-amp" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-t">Temp factor</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.91"><div class="unit">×</div></div>
<div class="field"><label class="f" for="in-g">Grouping factor</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.8"><div class="unit">×</div></div>
<div class="field"><label class="f" for="in-b">Burial factor</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.95"><div class="unit">×</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var ampE=document.getElementById("in-amp"),tE=document.getElementById("in-t"),gE=document.getElementById("in-g"),bE=document.getElementById("in-b"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var amp=parseFloat(ampE.value),t=parseFloat(tE.value),g=parseFloat(gE.value),b=parseFloat(bE.value);
if(isNaN(amp)||isNaN(t)||isNaN(g)||isNaN(b))return;
if(amp<=0||t<=0||g<=0||b<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var derated=amp*t*g*b;
var html='<div class="big">'+(Math.round(derated*10)/10)+' A</div>';
html+=row("Derated ampacity",Math.round(derated*10)/10+' A');
html+=row("Total derating factor",(t*g*b).toFixed(3));
html+=row("Reduction",Math.round((amp-derated)*10)/10+' A');
out.innerHTML=html;
}
[ampE,tE,gE,bE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
