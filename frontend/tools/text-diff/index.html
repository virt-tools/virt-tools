<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Diff Checker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Text Diff Checker</h1>
<p class="subtitle">Compare two blocks of text line-by-line and highlight additions, deletions, and changes.</p>
<div class="input-section">
<label>Original Text</label>
<textarea id="original" rows="8" placeholder="Paste original text here..." aria-label="Paste Original Text Here..."></textarea>
<label>Modified Text</label>
<textarea id="modified" rows="8" placeholder="Paste modified text here..." aria-label="Paste Modified Text Here..."></textarea>
<button id="compare" class="primary-btn" type="button">Compare</button>
</div>
<div id="result" style="display:none;margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function diffLines(a,b){
const la=a.split('\n'),lb=b.split('\n');
const m=la.length,n=lb.length;
const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--){
dp[i][j]=la[i]===lb[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
}
const res=[];let i=0,j=0;
while(i<m&&j<n){
if(la[i]===lb[j]){res({type:'same',text:la[i]});i++;j++;}
else if(dp[i+1][j]>=dp[i][j+1]){res.push({type:'del',text:la[i]});i++;}
else{res.push({type:'add',text:lb[j]});j++;}
}
while(i<m){res.push({type:'del',text:la[i++]});}
while(j<n){res.push({type:'add',text:lb[j++]});}
return res;
}
document.getElementById('compare').addEventListener('click',()=>{
const d=diffLines(document.getElementById('original').value,document.getElementById('modified').value);
let html='<div style="font-family:monospace;white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:500px;overflow:auto">';
d.forEach(r=>{
const c=r.type==='add'?'#e6ffed':r.type==='del'?'#ffeef0':'#fff';
const m=r.type==='add'?'+':r.type==='del'?'-':' ';
const s=r.type==='add'?'color:#22863a':r.type==='del'?'color:#cb2431':'color:#999';
html+='<div style="background:'+c+';padding:2px 4px;border-radius:2px"><span style="'+s+'">'+m+'</span> '+r.text.replace(/</g,'&lt;')+'</div>';
});
html+='</div>';
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
