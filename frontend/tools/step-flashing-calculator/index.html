<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Step Flashing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Step Flashing Calculator</h1>
<p>Calculate step flashing count and material from wall length, exposure, and course height. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Wall length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-exp">Shingle exposure</label><input type="text" id="in-exp" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-ch">Course height</label><input type="text" id="in-ch" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-len"),eEl=document.getElementById("in-exp"),cEl=document.getElementById("in-ch"),err=document.getElementById("err"),out=document.getElementById("out");
var ph='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var L=pn(lEl.value),E=pn(eEl.value),C=pn(cEl.value);
if(L==null||E==null||C==null){err.textContent="";out.innerHTML=ph;return}
if(!isFinite(L)||!isFinite(E)||!isFinite(C)||L<=0||E<=0||C<=0){err.textContent="Enter valid positive values.";out.innerHTML=ph;return}
err.textContent="";
var pieces=Math.ceil(L/E);
var pieceLen=5;
var totalLen=pieces*pieceLen;
var area=totalLen*C/144;
var html='<div class="big">'+pieces+' pcs</div>';
html+=row("Wall length",rnd(L,0)+" in");
html+=row("Pieces needed",pieces);
html+=row("Total flashing length",rnd(totalLen,0)+" in");
html+=row("Flashing area",rnd(area,2)+" sq ft");
out.innerHTML=html;
}
[lEl,eEl,cEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
