<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Running Key Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.rk{max-width:600px;margin:0 auto;padding:2rem 1rem}
.rk h1{font-size:2rem;margin-bottom:.5rem}
.rk .sub{color:#888;margin-bottom:1.5rem}
.rk textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.rk .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.rk .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.rk .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.rk label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
.rk .mode{display:flex;gap:1rem;margin-top:1rem}
.rk .mode label{display:flex;align-items:center;gap:4px;font-size:14px;margin:0}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="rk">
<h1>🔑 Running Key Cipher</h1>
<p class="sub">A Vigenère variant using a long text (book, speech) as the key instead of a short repeating keyword.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">ATTACKATDAWN</textarea>
<label for="key">Running key (long text):</label>
<textarea id="key" placeholder="Paste a long text as the key..." oninput="convert()">THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG</textarea>
<div class="mode">
<label><input type="radio" name="mode" value="encrypt" checked onchange="convert()"> Encrypt</label>
<label><input type="radio" name="mode" value="decrypt" onchange="convert()"> Decrypt</label>
</div>
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function getMode(){return document.querySelector('input[name="mode"]:checked').value;}
function clean(t){return t.toUpperCase().replace(/[^A-Z]/g,'');}
function encrypt(text,key){
  text=clean(text);key=clean(key);let result='';
  for(let i=0;i<text.length;i++){
    result+=String.fromCharCode(((text.charCodeAt(i)-65)+(key.charCodeAt(i%key.length)-65))%26+65);
  }
  return result;
}
function decrypt(text,key){
  text=clean(text);key=clean(key);let result='';
  for(let i=0;i<text.length;i++){
    result+=String.fromCharCode(((text.charCodeAt(i)-65)-(key.charCodeAt(i%key.length)-65)+26)%26+65);
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const key=document.getElementById('key').value;
  if(!key){document.getElementById('output').textContent='Enter a running key';return;}
  const mode=getMode();
  document.getElementById('output').textContent=mode==='encrypt'?encrypt(text,key):decrypt(text,key);
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
