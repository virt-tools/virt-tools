<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atbash Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.atbash{max-width:600px;margin:0 auto;padding:2rem 1rem}
.atbash h1{font-size:2rem;margin-bottom:.5rem}
.atbash .sub{color:#888;margin-bottom:1.5rem}
.atbash textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.atbash .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.atbash .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.atbash .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="atbash">
<h1>🔄 Atbash Cipher</h1>
<p class="sub">Substitute each letter with its mirror in the alphabet (A↔Z, B↔Y, C↔X...). Self-inverse — applying twice restores original.</p>
<textarea id="input" placeholder="Enter text to convert..." oninput="convert()" aria-label="Enter Text To Convert...">Hello, World!</textarea>
<button class="btn" onclick="convert()" type="button">Convert</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function atbash(text){
  let result='';
  for(const ch of text){
    const code=ch.charCodeAt(0);
    if(code>=65&&code<=90)result+=String.fromCharCode(90-(code-65));
    else if(code>=97&&code<=122)result+=String.fromCharCode(122-(code-97));
    else result+=ch;
  }
  return result;
}
function convert(){
  document.getElementById('output').textContent=atbash(document.getElementById('input').value);
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
