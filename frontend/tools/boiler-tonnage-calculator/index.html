<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Boiler Tonnage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Boiler Tonnage Calculator</h1>
<p>Calculate required boiler BTU output from heat loss and efficiency. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-loss">Heat loss</label><input type="text" id="in-loss" inputmode="decimal" autocomplete="off" placeholder="e.g. 60000"><div class="unit">BTU/hr</div></div>
<div class="field"><label class="f" for="in-eff">Boiler efficiency</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.85"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lossEl=document.getElementById("in-loss"),effEl=document.getElementById("in-eff"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lossEl.value),E=pn(effEl.value);
if(L==null||E==null)return;
if(!isFinite(L)||!isFinite(E)||L<=0||E<=0||E>1){err.textContent="Enter valid values (efficiency 0–1).";return}
err.textContent="";
var inputBTU=L/E;
var hp=inputBTU/33475;
var tons=inputBTU/12000;
var html='<div class="big">'+rnd(inputBTU/1000,1)+' kBTU/hr</div>';
html+=row("Heat loss",rnd(L,0)+" BTU/hr");
html+=row("Input required",rnd(inputBTU,0)+" BTU/hr");
html+=row("Boiler HP",rnd(hp,1)+" hp");
html+=row("Equivalent tons",rnd(tons,1)+" tons");
out.innerHTML=html;
}
[lossEl,effEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
