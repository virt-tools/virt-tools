<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hydrometer Analysis Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hydrometer Analysis Calculator</h1>
<p>Calculate particle size from Stokes' law using hydrometer reading, time, specific gravity, and temperature. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Hydrometer reading</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.015"><div class="unit">R</div></div>
<div class="field"><label class="f" for="in-t">Time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">sec</div></div>
<div class="field"><label class="f" for="in-g">Specific gravity</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.65"><div class="unit">G</div></div>
<div class="field"><label class="f" for="in-tmp">Temperature</label><input type="text" id="in-tmp" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">°C</div></div>
<div class="field"><label class="f" for="in-h">Effective depth</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">cm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-r"),tE=document.getElementById("in-t"),gE=document.getElementById("in-g"),tmpE=document.getElementById("in-tmp"),hE=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=parseFloat(rE.value),T=parseFloat(tE.value),G=parseFloat(gE.value),TMP=parseFloat(tmpE.value),H=parseFloat(hE.value);
if(isNaN(R)||isNaN(T)||isNaN(G)||isNaN(TMP)||isNaN(H))return;
if(T<=0||G<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var eta=0.00001*(1.5+0.033*(TMP-20));
var gammaW=0.00981;
var D=Math.sqrt((18*eta*(H/Math.pow(10,2.65-G))/((G-1)*gammaW*T)));
var Dmm=D*10;
var html='<div class="big">'+Math.round(Dmm*10000)/10000+' mm</div>';
html+=row("Particle diameter D",Math.round(Dmm*10000)/10000+' mm');
html+=row("Hydrometer reading R",R);
html+=row("Elapsed time",T+' sec');
var cls=Dmm<0.002?"Clay":Dmm<0.075?"Silt":"Sand";
html+=row("Classification",cls);
out.innerHTML=html;
}
[rE,tE,gE,tmpE,hE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
