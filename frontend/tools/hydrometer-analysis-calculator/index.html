<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hydrometer Analysis Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hydrometer Analysis Calculator</h1>
<p>Calculate particle size from Stokes' law using hydrometer reading, time, specific gravity, and temperature. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Hydrometer reading</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.015"><div class="unit">R</div></div>
<div class="field"><label class="f" for="in-t">Time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">sec</div></div>
<div class="field"><label class="f" for="in-g">Specific gravity</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.65"><div class="unit">G</div></div>
<div class="field"><label class="f" for="in-tmp">Temperature</label><input type="text" id="in-tmp" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">°C</div></div>
<div class="field"><label class="f" for="in-h">Effective depth</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">cm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-r"),tE=document.getElementById("in-t"),gE=document.getElementById("in-g"),tmpE=document.getElementById("in-tmp"),hE=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=parseFloat(rE.value),T=parseFloat(tE.value),G=parseFloat(gE.value),TMP=parseFloat(tmpE.value),H=parseFloat(hE.value);
if(isNaN(R)||isNaN(T)||isNaN(G)||isNaN(TMP)||isNaN(H))return;
if(T<=0||G<=1||H<=0){err.textContent="Enter valid positive values (specific gravity must exceed 1).";return}
if(TMP<0||TMP>100){err.textContent="Temperature must be between 0 and 100 °C.";return}
err.textContent="";
var eta=1.78/(1+0.0337*TMP+0.000221*TMP*TMP);
var D=Math.sqrt((18*(eta/1000)*(H/100)/T)/((G-1)*9810));
var Dmm=D*1000;
var html='<div class="big">'+Math.round(Dmm*10000)/10000+' mm</div>';
html+=row("Particle diameter D",Math.round(Dmm*10000)/10000+' mm');
html+=row("Hydrometer reading R",R);
html+=row("Elapsed time",T+' sec');
var cls=Dmm<0.002?"Clay":Dmm<0.075?"Silt":"Sand";
html+=row("Classification",cls);
out.innerHTML=html;
}
[rE,tE,gE,tmpE,hE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
