<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Bus Bar Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Bus Bar Selector</h1>
<p>Select bus bar cross-section and material (copper or aluminum) based on continuous current and number of terminals. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cur">Continuous current</label><input type="text" id="in-cur" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">amps</div></div>
<div class="field"><label class="f" for="in-tc">Terminal count</label><input type="text" id="in-tc" inputmode="numeric" autocomplete="off" placeholder="e.g. 12"><div class="unit">terminals</div></div>
<div class="field"><label class="f" for="in-mat">Material (cu/al)</label><input type="text" id="in-mat" autocomplete="off" placeholder="cu or al"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-cur"),tEl=document.getElementById("in-tc"),mEl=document.getElementById("in-mat"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Cur=pn(cEl.value),Tc=pn(tEl.value),Mat=String(mEl.value).trim().toLowerCase();
if(Cur==null||Tc==null)return;
if(!isFinite(Cur)||Cur<=0||!isFinite(Tc)||Tc<=0){err.textContent="Enter valid positive values.";return}
if(Mat&&Mat!=="cu"&&Mat!=="al"){err.textContent="Enter 'cu' or 'al'.";return}
if(!Mat)return;
err.textContent="";
var density=Mat==="cu"?1.25:0.75;
var cross=Cur/density;
var width=Math.ceil(cross/4);
var height=Math.ceil(cross/width);
var len=Math.max(2,Tc*0.75);
var html='<div class="big">'+width+'×'+height+' mm</div>';
html+=row("Cross-section",width+'×'+height+' mm ('+rnd(cross,0)+' mm²)');
html+=row("Material",Mat==="cu"?"Copper":"Aluminum");
html+=row("Current density",density+' A/mm²');
html+=row("Min length",rnd(len,0)+' in');
html+=row("Terminals",Tc);
out.innerHTML=html;
}
[cEl,tEl,mEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
