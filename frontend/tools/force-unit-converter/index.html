<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Force Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Force Unit Converter</h1><p class="subtitle">Convert between all supported force units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Force","units":[{"slug":"newtons","name":"Newtons","symbol":"N","scale":1,"offset":0},{"slug":"kilonewtons","name":"Kilonewtons","symbol":"kN","scale":1000,"offset":0},{"slug":"meganewtons","name":"Meganewtons","symbol":"MN","scale":1000000.0,"offset":0},{"slug":"dynes","name":"Dynes","symbol":"dyn","scale":1e-05,"offset":0},{"slug":"pound-force","name":"Pound-force","symbol":"lbf","scale":4.4482216152605,"offset":0},{"slug":"ounce-force","name":"Ounce-force","symbol":"ozf","scale":0.2780138509537812,"offset":0},{"slug":"kilogram-force","name":"Kilogram-force","symbol":"kgf","scale":9.80665,"offset":0},{"slug":"ton-force-us","name":"US ton-force","symbol":"tonf","scale":8896.443230521,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
