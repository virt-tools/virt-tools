<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flywheel Energy Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Flywheel Energy Calculator</h1>
<p class="subtitle">Calculate kinetic energy, moment of inertia, and energy storage of a flywheel.</p>
<div class="input-section">
<label>Mass (kg)</label>
<input type="number" id="mass" value="20" min="0.001" step="0.1" aria-label="Mass">
<label>Outer Radius (m)</label>
<input type="number" id="rOut" value="0.5" min="0.001" step="0.01" aria-label="R Out">
<label>Inner Radius (m)</label>
<input type="number" id="rIn" value="0" min="0" step="0.01" aria-label="R In">
<label>Rotational Speed (RPM)</label>
<input type="number" id="rpm" value="3000" min="1" aria-label="Rpm">
<label>Shape</label>
<select id="shape" aria-label="Shape">
<option value="ring" selected>Hollow Ring</option>
<option value="solid">Solid Disk</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const m=parseFloat(document.getElementById('mass').value)||0;
const ro=parseFloat(document.getElementById('rOut').value)||0;
const ri=parseFloat(document.getElementById('rIn').value)||0;
const rpm=parseFloat(document.getElementById('rpm').value)||0;
const shape=document.getElementById('shape').value;
let I;
if(shape==='ring'){I=0.5*m*(ro*ro+ri*ri);}
else{I=0.5*m*ro*ro;}
const omega=rpm*2*Math.PI/60;
const KE=0.5*I*omega*omega;
const KWh=KE/3600000;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Mass:</span><span>${m} kg</span></div>
<div class="result-row"><span>Rotational Speed:</span><span>${rpm} rpm (${omega.toFixed(2)} rad/s)</span></div>
<div class="result-row"><span>Moment of Inertia:</span><span>${I.toFixed(4)} kg·m²</span></div>
<div class="result-row"><span>Kinetic Energy:</span><span>${(KE/1000).toFixed(2)} kJ</span></div>
<div class="result-row"><span>Energy:</span><span>${KWh.toFixed(6)} kWh</span></div>
<div class="result-row"><span>Tip Speed:</span><span>${(omega*ro).toFixed(2)} m/s</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
