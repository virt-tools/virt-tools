<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Lawn Aerator Plug Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Lawn Aerator Plug Calculator</h1>
<p>Calculate number of aeration plugs, plug spacing, and soil cores from lawn area and aerator tine spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Lawn width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Lawn length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-tine">Tine spacing</label><input type="text" id="in-tine" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-depth">Plug depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),tineEl=document.getElementById("in-tine"),depthEl=document.getElementById("in-depth"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),Tine=pn(tineEl.value),Depth=pn(depthEl.value);
if(W==null||L==null||Tine==null||Depth==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(Tine)||!isFinite(Depth)||W<=0||L<=0||Tine<=0||Depth<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var areaSqIn=W*144*L;
var plugsPerSqIn=1/(Tine*Tine);
var totalPlugs=areaSqIn*plugsPerSqIn;
var coreVol=Math.PI*0.5*0.5*Depth/1728*totalPlugs;
var html='<div class="big">'+rnd(totalPlugs,0)+'</div>';
html+=row("Lawn area",rnd(W*L,0)+' sq ft');
html+=row("Plug spacing",rnd(Tine,0)+' in');
html+=row("Total plugs",rnd(totalPlugs,0));
html+=row("Core volume",rnd(coreVol,2)+' cu ft');
html+=row("Core weight",rnd(coreVol*75,0)+' lbs');
out.innerHTML=html;
}
[wEl,lEl,tineEl,depthEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
