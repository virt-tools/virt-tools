<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>VAV Box Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>VAV Box Selector</h1>
<p>Select VAV box size from airflow and inlet pressure requirements. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cfm">Design airflow</label><input type="text" id="in-cfm" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-p">Max inlet pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">inWC</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cfmEl=document.getElementById("in-cfm"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CFM=pn(cfmEl.value),P=pn(pEl.value);
if(CFM==null||P==null)return;
if(!isFinite(CFM)||!isFinite(P)||CFM<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var dia=Math.sqrt(CFM/4000/Math.PI*4);
var sizes=[4,6,8,10,12,14,16,18,20];
var pick=sizes.filter(function(s){return s>=dia*12;})[0]||sizes[sizes.length-1];
var velocity=CFM/(Math.PI*Math.pow(pick/24,2));
var vp=Math.pow(velocity/4005,2); // velocity pressure in inWC: VP=(V/4005)^2 for standard air
var html='<div class="big">'+pick+'" inlet</div>';
html+=row("Design CFM",CFM);
html+=row("Min inlet dia",rnd(dia*12,1)+' in');
html+=row("Selected size",pick+' in');
html+=row("Inlet velocity",rnd(velocity,0)+' fpm');
html+=row("Velocity pressure",rnd(vp,2)+' inWC');
html+=row("Max inlet pressure",rnd(P,2)+' inWC');
html+=row("Pressure check",P>=vp?'OK':'Low — below velocity pressure at design flow');
html+=row("Noise class",velocity>2000?'High':'NC'+(velocity>1500?2:1));
out.innerHTML=html;
}
[cfmEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
