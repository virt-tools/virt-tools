<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Translator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Binary Translator</h1>
<p class="subtitle">Convert text to binary and binary to text. Supports 8-bit ASCII encoding.</p>
<div class="input-section">
<label>Input: <textarea id="input" rows="4" placeholder="Type text or binary (space-separated 8-bit groups)"></textarea></label>
<button id="toBin" class="primary-btn" type="button">Text → Binary</button>
<button id="fromBin" class="btn" type="button">Binary → Text</button>
<button id="copy" class="btn" type="button">Copy Result</button>
</div>
<div class="output-section">
<label>Result: <textarea id="result" rows="4" readonly></textarea></label>
</div>
<script>
document.getElementById('toBin').addEventListener('click',()=>{
const t=document.getElementById('input').value;
document.getElementById('result').value=[...t].map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');
});
document.getElementById('fromBin').addEventListener('click',()=>{
const t=document.getElementById('input').value.trim().split(/\s+/);
document.getElementById('result').value=t.map(b=>String.fromCharCode(parseInt(b,2))).join('');
});
document.getElementById('copy').addEventListener('click',()=>{
const r=document.getElementById('result');r.select();document.execCommand('copy');
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
