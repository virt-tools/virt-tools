<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Drawer Slide Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Drawer Slide Calculator</h1>
<p>Calculate recommended drawer slide length from drawer box depth and cabinet depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dbd">Drawer box depth</label><input type="text" id="in-dbd" inputmode="decimal" autocomplete="off" placeholder="e.g. 450"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-cd">Cabinet depth</label><input type="text" id="in-cd" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter depths.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dbdEl=document.getElementById("in-dbd"),cdEl=document.getElementById("in-cd"),err=document.getElementById("err"),out=document.getElementById("out");
var stdSizes=[150,200,250,300,350,400,450,500,550,600];
function calc(){
var DBD=pn(dbdEl.value),CD=pn(cdEl.value);
if(DBD==null){return}
CD=CD==null?500:CD;
if(!isFinite(DBD)||!isFinite(CD)||DBD<=0||CD<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var maxSlide=CD-10;
var recSlide=Math.min(DBD,maxSlide);
var std=stdSizes.filter(function(s){return s<=maxSlide}).pop()||stdSizes[0];
var html='<div class="big">'+rnd(std,0)+' mm</div>';
html+=row("Drawer box depth",rnd(DBD,0)+" mm");
html+=row("Cabinet depth",rnd(CD,0)+" mm");
html+=row("Max slide length",rnd(maxSlide,0)+" mm");
html+=row("Ideal slide length",rnd(recSlide,0)+" mm");
html+=row("Standard slide size",std+" mm");
out.innerHTML=html;
}
[dbdEl,cdEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
