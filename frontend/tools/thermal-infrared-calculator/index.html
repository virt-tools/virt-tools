<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Thermal Infrared Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Thermal Infrared Calculator</h1>
<p>Calculate radiometric temperature, NEΔT, and temperature resolution from thermal infrared sensor parameters. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rad">Radiance</label><input type="text" id="in-rad" inputmode="decimal" autocomplete="off" placeholder="e.g. 8.5"><div class="unit">W/m²/sr/μm</div></div>
<div class="field"><label class="f" for="in-wl">Wavelength</label><input type="text" id="in-wl" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">μm</div></div>
<div class="field"><label class="f" for="in-emis">Emissivity</label><input type="text" id="in-emis" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.98"><div class="unit">0–1</div></div>
<div class="field"><label class="f" for="in-nedt">NEΔT</label><input type="text" id="in-nedt" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">K</div></div>
<div class="field"><label class="f" for="in-amb">Ambient temp</label><input type="text" id="in-amb" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">K</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var radE=document.getElementById("in-rad"),wlE=document.getElementById("in-wl"),emisE=document.getElementById("in-emis"),nedtE=document.getElementById("in-nedt"),ambE=document.getElementById("in-amb"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var rad=parseFloat(radE.value),wl=parseFloat(wlE.value),emis=parseFloat(emisE.value),nedt=parseFloat(nedtE.value),amb=parseFloat(ambE.value);
if(isNaN(rad)||isNaN(wl)||isNaN(emis)||isNaN(amb))return;
if(emis<=0||emis>1){err.textContent="Emissivity must be 0–1.";return}
if(rad<=0||wl<=0){err.textContent="Radiance and wavelength must be positive.";return}
if(!isNaN(nedt)&&nedt<0){err.textContent="NEΔT cannot be negative.";return}
err.textContent="";
var correctedRad=rad/emis;
var brightnessT=14387.7/(wl*Math.log(1+1.191e8/(Math.pow(wl,5)*correctedRad)));
var tempRes=isNaN(nedt)?0.05:nedt;
var minDetectable=amb-tempRes;
var html='<div class="big">'+Math.round(brightnessT*10)/10+' K</div>';
html+=row("Brightness temperature",Math.round(brightnessT*10)/10+' K');
html+=row("Temperature resolution",Math.round(tempRes*1000)/1000+' K');
html+=row("Min detectable difference",Math.round(minDetectable*10)/10+' K');
out.innerHTML=html;
}
[radE,wlE,emisE,nedtE,ambE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
