<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Thermal Infrared Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Thermal Infrared Calculator</h1>
<p>Calculate radiometric temperature, NEΔT, and temperature resolution from thermal infrared sensor parameters. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rad">Radiance</label><input type="text" id="in-rad" inputmode="decimal" autocomplete="off" placeholder="e.g. 8.5"><div class="unit">W/m²/sr/μm</div></div>
<div class="field"><label class="f" for="in-emis">Emissivity</label><input type="text" id="in-emis" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.98"><div class="unit">0–1</div></div>
<div class="field"><label class="f" for="in-nedt">NEΔT</label><input type="text" id="in-nedt" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">K</div></div>
<div class="field"><label class="f" for="in-amb">Ambient temp</label><input type="text" id="in-amb" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">K</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var radE=document.getElementById("in-rad"),emisE=document.getElementById("in-emis"),nedtE=document.getElementById("in-nedt"),ambE=document.getElementById("in-amb"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var rad=parseFloat(radE.value),emis=parseFloat(emisE.value),nedt=parseFloat(nedtE.value),amb=parseFloat(ambE.value);
if(isNaN(rad)||isNaN(emis)||isNaN(amb))return;
if(emis<=0||emis>1){err.textContent="Emissivity must be 0–1.";return}
err.textContent="";
var correctedRad=rad/emis;
var brightnessT=Math.pow(correctedRad/(5.67e-8),0.25);
var tempRes=nedt||0.05;
var minDetectable=amb-tempRes;
var html='<div class="big">'+Math.round(brightnessT*10)/10+' K</div>';
html+=row("Brightness temperature",Math.round(brightnessT*10)/10+' K');
html+=row("Temperature resolution",Math.round(tempRes*1000)/1000+' K');
html+=row("Min detectable difference",Math.round(minDetectable*10)/10+' K');
out.innerHTML=html;
}
[radE,emisE,nedtE,ambE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
