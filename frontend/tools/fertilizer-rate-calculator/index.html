<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fertilizer Rate Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fertilizer Rate Calculator</h1>
<p>Calculate fertilizer amount from N-P-K ratio, desired nitrogen rate, and application area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n">% Nitrogen (N)</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-rate">N rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">lb N / 1000 sq ft</div></div>
<div class="field"><label class="f" for="in-area">Area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">sq ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nEl=document.getElementById("in-n"),rateEl=document.getElementById("in-rate"),areaEl=document.getElementById("in-area"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var N=pn(nEl.value),Rate=pn(rateEl.value),Area=pn(areaEl.value);
if(N==null||Rate==null||Area==null)return;
if(!isFinite(N)||!isFinite(Rate)||!isFinite(Area)||N<=0||Rate<=0||Area<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var fertPer1000=Rate/(N/100);
var totalFert=fertPer1000*Area/1000;
var html='<div class="big">'+rnd(totalFert,1)+' lb</div>';
html+=row("N content",N+'%');
html+=row("Fertilizer / 1000 sq ft",rnd(fertPer1000,1)+' lb');
html+=row("Total area",rnd(Area,0)+' sq ft');
html+=row("Total fertilizer",rnd(totalFert,1)+' lb');
out.innerHTML=html;
}
[nEl,rateEl,areaEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
