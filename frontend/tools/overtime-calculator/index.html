<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overtime Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input,.input-group select{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Overtime Calculator</h1>
<div class="calc-wrap">
<h2>Overtime Calculator ⏰</h2>
<p>Calculate overtime pay with configurable multiplier. US standard is 1.5× (time-and-a-half).</p>
<div class="input-group">
<label>Hourly rate ($)</label>
<input type="number" id="rate" value="20" min="0" step="0.01" aria-label="Rate">
</div>
<div class="input-group">
<label>Regular hours</label>
<input type="number" id="regHours" value="40" min="0" aria-label="Reg Hours">
</div>
<div class="input-group">
<label>Overtime hours</label>
<input type="number" id="otHours" value="10" min="0" aria-label="Ot Hours">
</div>
<div class="input-group">
<label>Overtime multiplier</label>
<select id="multiplier" aria-label="Multiplier">
<option value="1.5">1.5× (time-and-a-half)</option>
<option value="2">2× (double time)</option>
<option value="2.5">2.5× (double-and-a-half)</option>
<option value="1">1× (no bonus)</option>
</select>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const rate=v('rate'),reg=v('regHours'),ot=v('otHours');
  const mult=parseFloat(document.getElementById('multiplier').value);
  const regPay=rate*reg;
  const otPay=rate*mult*ot;
  const total=regPay+otPay;
  const otRate=rate*mult;
  const effRate=total/(reg+ot||1);
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Pay Breakdown</h3>'+
    '<div class="result-row"><span>Regular pay ('+reg+'h × $'+rate.toFixed(2)+')</span><span>$'+regPay.toFixed(2)+'</span></div>'+
    '<div class="result-row"><span>Overtime rate</span><span>$'+otRate.toFixed(2)+'/h</span></div>'+
    '<div class="result-row"><span>Overtime pay ('+ot+'h × $'+otRate.toFixed(2)+')</span><span>$'+otPay.toFixed(2)+'</span></div>'+
    '<div class="result-row"><span>Total hours</span><span>'+(reg+ot)+'</span></div>'+
    '<div class="result-row"><span>Effective hourly rate</span><span>$'+effRate.toFixed(2)+'</span></div>'+
    '<div class="result-row"><span>Total pay</span><span>$'+total.toFixed(2)+'</span></div>';
}
</script>
</body>
</html>
