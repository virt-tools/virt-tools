<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sort & Organize Lines — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Sort & Organize Lines</h1>
<p class="subtitle">Sort, reverse, shuffle, deduplicate, or randomize lines of text. Multiple sort modes.</p>

<div style="max-width:600px;margin:0 auto;display:grid;gap:1rem;">
  <textarea id="input" rows="8" style="width:100%;font-family:monospace;font-size:.9rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" placeholder="Paste lines here..." aria-label="Paste Lines Here..."></textarea>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
    <button data-action="az" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#2563eb;color:#fff;" type="button">A→Z</button>
    <button data-action="za" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#2563eb;color:#fff;" type="button">Z→A</button>
    <button data-action="num-asc" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#16a34a;color:#fff;" type="button">Num ↑</button>
    <button data-action="num-desc" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#16a34a;color:#fff;" type="button">Num ↓</button>
    <button data-action="length-asc" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#9333ea;color:#fff;" type="button">Short→Long</button>
    <button data-action="length-desc" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#9333ea;color:#fff;" type="button">Long→Short</button>
    <button data-action="reverse" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#ea580c;color:#fff;" type="button">Reverse</button>
    <button data-action="shuffle" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#ea580c;color:#fff;" type="button">Shuffle</button>
    <button data-action="dedupe" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#dc2626;color:#fff;" type="button">Dedupe</button>
    <button data-action="dedupe-case" style="padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;background:#dc2626;color:#fff;" type="button">Dedupe (case-insensitive)</button>
  </div>
  <div style="display:flex;gap:1rem;align-items:center;font-size:.85rem;">
    <label><input type="checkbox" id="trim"> Trim whitespace</label>
    <label><input type="checkbox" id="rmEmpty"> Remove empty lines</label>
    <label><input type="checkbox" id="ci"> Case-insensitive sort</label>
  </div>
  <textarea id="output" rows="8" style="width:100%;font-family:monospace;font-size:.9rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" readonly placeholder="Result..." aria-label="Result..."></textarea>
  <div style="display:flex;gap:.5rem;">
    <button id="copy" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Copy</button>
    <button id="clear" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Clear</button>
  </div>
  <div id="stats" style="font-size:.85rem;color:#666;"></div>
</div>

<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const output=document.getElementById('output');
const stats=document.getElementById('stats');

function getLines(){
  let lines=input.value.split('\n');
  if(document.getElementById('trim').checked)lines=lines.map(l=>l.trim());
  if(document.getElementById('rmEmpty').checked)lines=lines.filter(l=>l.trim()!=='');
  return lines;
}

function setOutput(lines){
  output.value=lines.join('\n');
  stats.textContent=lines.length+' lines.';
}

function sortAZ(a,b,ci){
  if(ci){return a.toLowerCase().localeCompare(b.toLowerCase());}
  return a.localeCompare(b);
}

function sortNum(a,b,desc){
  const na=parseFloat(a.replace(/[^0-9.\-]/g,''));
  const nb=parseFloat(b.replace(/[^0-9.\-]/g,''));
  const va=isNaN(na)?0:na,vb=isNaN(nb)?0:nb;
  return desc?vb-va:va-vb;
}

document.querySelectorAll('button[data-action]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    let lines=getLines();
    const ci=document.getElementById('ci').checked;
    switch(btn.dataset.action){
      case'az':lines.sort((a,b)=>sortAZ(a,b,ci));break;
      case'za':lines.sort((a,b)=>sortAZ(b,a,ci));break;
      case'num-asc':lines.sort((a,b)=>sortNum(a,b,false));break;
      case'num-desc':lines.sort((a,b)=>sortNum(a,b,true));break;
      case'length-asc':lines.sort((a,b)=>a.length-b.length);break;
      case'length-desc':lines.sort((a,b)=>b.length-a.length);break;
      case'reverse':lines.reverse();break;
      case'shuffle':lines.sort(()=>Math.random()-0.5);break;
      case'dedupe':lines=[...new Set(lines)];break;
      case'dedupe-case':lines=[...new Map(lines.map(l=>[l.toLowerCase(),l])).values()];break;
    }
    setOutput(lines);
  });
});

document.getElementById('copy').addEventListener('click',()=>{
  output.select();document.execCommand('copy');
  stats.textContent='Copied.';
});
document.getElementById('clear').addEventListener('click',()=>{
  input.value='';output.value='';stats.textContent='';
});
})();
</script>
</body>
</html>
