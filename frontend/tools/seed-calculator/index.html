<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seed Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Seed Calculator</h1>
<p class="subtitle">Estimate grass seed needed for your lawn area.</p>
<div class="input-section">
<label>Lawn Length (ft)</label>
<input type="number" id="len" value="50" min="0" aria-label="Len">
<label>Lawn Width (ft)</label>
<input type="number" id="wid" value="30" min="0" aria-label="Wid">
<label>Seed Rate (lbs/1000 sq ft)</label>
<input type="number" id="rate" value="4" min="0" step="0.5" aria-label="Rate">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const R=parseFloat(document.getElementById('rate').value)||0;
const area=L*W;
const lbs=(area/1000)*R;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Lawn Area:</span><span>${area.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>Seed Rate:</span><span>${R} lbs per 1000 sq ft</span></div>
<div class="result-row"><span>Seed Needed:</span><span>${lbs.toFixed(1)} lbs</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
