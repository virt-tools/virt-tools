<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wire Voltage Drop Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wire Voltage Drop Calculator</h1>
<p>Calculate voltage drop and percentage for copper wire runs based on current, wire gauge, distance, and system voltage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cur">Current</label><input type="text" id="in-cur" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">amps</div></div>
<div class="field"><label class="f" for="in-ga">AWG gauge</label><input type="text" id="in-ga" inputmode="numeric" autocomplete="off" placeholder="e.g. 10"><div class="unit">AWG</div></div>
<div class="field"><label class="f" for="in-len">One-way length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-sv">System voltage</label><input type="text" id="in-sv" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var awgRes={18:6.385,16:4.016,14:2.525,12:1.588,10:0.999,8:0.628,6:0.395,4:0.249,2:0.156,1:0.124,0:0.0983,"00":0.0779,"000":0.0618,"0000":0.049};
var cEl=document.getElementById("in-cur"),gEl=document.getElementById("in-ga"),lEl=document.getElementById("in-len"),sEl=document.getElementById("in-sv"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var I=pn(cEl.value),g=parseInt(gEl.value,10),L=pn(lEl.value),Sv=pn(sEl.value);
if(I==null||isNaN(g)||L==null||Sv==null)return;
if(!isFinite(I)||I<=0||g<=0||!isFinite(L)||L<=0||!isFinite(Sv)||Sv<=0){err.textContent="Enter valid positive values.";return}
var rPerFt=awgRes[g];
if(!rPerFt){err.textContent="AWG "+g+" not in table (8–18 common).";return}
err.textContent="";
var vDrop=2*I*rPerFt*L;
var pct=vDrop/Sv*100;
var vEnd=Sv-vDrop;
var status=pct<3?"OK":pct<5?"Borderline":"Excessive — use larger wire";
var html='<div class="big">'+rnd(vDrop,2)+' V drop</div>';
html+=row("Voltage drop",rnd(vDrop,2)+' V');
html+=row("Drop percentage",rnd(pct,2)+' %');
html+=row("Voltage at load",rnd(vEnd,2)+' V');
html+=row("Wire resistance",rnd(rPerFt*2*L,4)+' ohm (round)');
html+=row("Status",status);
out.innerHTML=html;
}
[cEl,gEl,lEl,sEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
