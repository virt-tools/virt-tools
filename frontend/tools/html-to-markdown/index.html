<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to Markdown Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>HTML to Markdown Converter</h1>
<p class="subtitle">Convert HTML to Markdown using DOMParser. Handles headings, lists, links, bold, italic, code.</p>
<div class="input-section">
<label for="input">HTML input</label>
<textarea id="input" rows="8" placeholder="&lt;h1&gt;Title&lt;/h1&gt;&lt;p&gt;Hello world&lt;/p&gt;"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function safeUrl(value){
const url=String(value||'').trim();
if(!url)return '';
if(/^(?:https?:|mailto:)/i.test(url)||/^(?:[#/?]|\.\.?\/)/.test(url))return url;
return '';
}
function renderOutput(value){
const result=document.getElementById('result');
const output=document.createElement('textarea');
output.rows=10;
output.style.cssText='width:100%;font-family:monospace;';
output.readOnly=true;
output.setAttribute('aria-label','Markdown output');
output.value=value;
const copy=document.createElement('button');
copy.type='button';
copy.textContent='Copy';
copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));
result.replaceChildren(output,copy);
}
function htmlToMd(node){
let md='';
for(let child of node.childNodes){
if(child.nodeType===3){md+=child.textContent;}
else if(child.nodeType===1){
const tag=child.tagName.toLowerCase();
switch(tag){
case'h1':md+='\n# '+child.textContent+'\n';break;
case'h2':md+='\n## '+child.textContent+'\n';break;
case'h3':md+='\n### '+child.textContent+'\n';break;
case'h4':md+='\n#### '+child.textContent+'\n';break;
case'h5':md+='\n##### '+child.textContent+'\n';break;
case'h6':md+='\n###### '+child.textContent+'\n';break;
case'p':md+='\n'+htmlToMd(child)+'\n';break;
case'strong':case'b':md+='**'+child.textContent+'**';break;
case'em':case'i':md+='*'+child.textContent+'*';break;
case'code':md+='`'+child.textContent+'`';break;
case'pre':md+='\n```\n'+child.textContent+'\n```\n';break;
case'a':md+='['+child.textContent+']('+safeUrl(child.getAttribute('href'))+')';break;
case'ul':for(let li of child.children)md+='\n- '+li.textContent;md+='\n';break;
case'ol':let i=1;for(let li of child.children)md+='\n'+(i++)+'. '+li.textContent;md+='\n';break;
case'br':md+='\n';break;
case'hr':md+='\n---\n';break;
case'blockquote':md+='\n> '+child.textContent+'\n';break;
case'img':md+='!['+(child.getAttribute('alt')||'')+']('+safeUrl(child.getAttribute('src'))+')';break;
default:md+=htmlToMd(child);
}
}
}
return md;
}
document.getElementById('run').addEventListener('click',()=>{
try{
const parser=new DOMParser();
const doc=parser.parseFromString(document.getElementById('input').value,'text/html');
const md=htmlToMd(doc.body).trim();
renderOutput(md);
}catch(e){const result=document.getElementById('result');const error=document.createElement('p');error.style.color='red';error.textContent='Error: '+e.message;result.replaceChildren(error);}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
