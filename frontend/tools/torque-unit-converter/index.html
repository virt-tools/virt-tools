<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Torque Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Torque Unit Converter</h1><p class="subtitle">Convert between all supported torque units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Torque","units":[{"slug":"newton-meters","name":"Newton-meters","symbol":"N·m","scale":1,"offset":0},{"slug":"newton-centimeters","name":"Newton-centimeters","symbol":"N·cm","scale":0.01,"offset":0},{"slug":"kilonewton-meters","name":"Kilonewton-meters","symbol":"kN·m","scale":1000,"offset":0},{"slug":"dyne-centimeters","name":"Dyne-centimeters","symbol":"dyn·cm","scale":1e-07,"offset":0},{"slug":"pound-feet","name":"Pound-feet","symbol":"lbf·ft","scale":1.3558179483314,"offset":0},{"slug":"pound-inches","name":"Pound-inches","symbol":"lbf·in","scale":0.1129848290276167,"offset":0},{"slug":"ounce-inches","name":"Ounce-inches","symbol":"ozf·in","scale":0.00706155181422604,"offset":0},{"slug":"kilogram-force-meters","name":"Kilogram-force meters","symbol":"kgf·m","scale":9.80665,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
