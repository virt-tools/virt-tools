<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Temporary Power Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-4aca7a6b.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Temporary Power Calculator</h1>
<p>Calculate the generator size needed for temporary construction site power based on total tool load and voltage. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Total tool wattage</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 15000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-v">Voltage</label><select id="in-v"><option value="">Select…</option><option value="120">120V</option><option value="240">240V</option><option value="480">480V</option></select><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),vEl=document.getElementById("in-v"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),V=vEl.value;
if(W==null||!V)return;
if(!isFinite(W)||W<=0){err.textContent="Enter valid wattage.";return}
err.textContent="";
var amps=W/Number(V);
var genKw=W*1.25/1000;
var html='<div class="big">'+rnd(genKw,1)+' kW</div>';
html+=row("Generator size",rnd(genKw,1)+' kW');
html+=row("Amperage",rnd(amps,0)+' A');
html+=row("Total load",W.toLocaleString()+' W');
html+=row("Voltage",V+' V');
out.innerHTML=html;
}
[wEl,vEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
