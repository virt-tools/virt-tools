<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Reverb Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Reverb Generator</h1>
<p class="subtitle">Add reverb to audio using a generated impulse response. Adjust room size and decay. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="process" class="primary-btn" type="button">Process & Download</button>
</div>
<div class="controls">
<label>Room Size: <input type="range" id="room" min="0.1" max="3" value="1" step="0.1"><span id="rv">1.0</span>s</label>
<label>Decay: <input type="range" id="decay" min="0.1" max="0.9" value="0.5" step="0.05"><span id="dv">0.5</span></label>
<label>Mix: <input type="range" id="mix" min="0" max="1" value="0.4" step="0.05"><span id="mv">0.4</span></label>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
['room','decay','mix'].forEach(id=>{
const el=document.getElementById(id);
const sp=document.getElementById(id[0]+'v');
el.addEventListener('input',()=>sp.textContent=el.value);
});
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const sr=buf.sampleRate;
const roomSize=parseFloat(document.getElementById('room').value);
const decay=parseFloat(document.getElementById('decay').value);
const mix=parseFloat(document.getElementById('mix').value);
const irLen=Math.floor(sr*roomSize);
const ir=audioCtx.createBuffer(2,irLen,sr);
for(let c=0;c<2;c++){
const d=ir.getChannelData(c);
for(let i=0;i<irLen;i++){
d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,1/(1-decay));
}
}
const conv=audioCtx.createConvolver();
conv.buffer=ir;
const off=new OfflineAudioContext(2,buf.length,sr);
const src=off.createBufferSource();src.buffer=buf;
const wet=off.createGain();wet.gain.value=mix;
const dry=off.createGain();dry.gain.value=1-mix;
const cn=off.createConvolver();cn.buffer=ir;
src.connect(dry);dry.connect(off.destination);
src.connect(cn);cn.connect(wet);wet.connect(off.destination);
src.start();
const rendered=await off.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reverb.wav';a.click();
st.textContent='Done! Downloaded as reverb.wav';
audioCtx.close();
});
function audioBufferToWav(b){
const n=b.length,sr=b.sampleRate,ch=b.numberOfChannels;
const buf=new ArrayBuffer(44+n*ch*2);
const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*ch*2,true);
for(let i=0;i<n;i++)for(let c=0;c<ch;c++){
const s=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));
v.setInt16(44+(i*ch+c)*2,s<0?s*32768:s*32767,true);
}
return buf;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
