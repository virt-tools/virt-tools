<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Stats — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pomodoro Stats Tracker</h1>
<p class="subtitle">Track your Pomodoro sessions with daily/weekly stats and streak tracking. Data stored locally.</p>
<div class="input-section">
<div class="btn-row">
<button id="start" class="primary-btn" type="button">Start (25 min)</button>
<button id="break" class="primary-btn" type="button">Short Break (5 min)</button>
<button id="lbreak" class="primary-btn" type="button">Long Break (15 min)</button>
<button id="reset" class="primary-btn" type="button">Reset Timer</button>
</div>
<div id="timer-display" style="font-size:3em;text-align:center;margin:0.5em 0;">25:00</div>
<div id="status" style="text-align:center;margin-bottom:1em;"></div>
</div>
<div class="stats-section">
<h2>Today's Stats</h2>
<div id="today-stats"></div>
<h2>This Week</h2>
<div id="week-stats"></div>
<h2>Streak</h2>
<div id="streak"></div>
<button id="clear" class="primary-btn" style="margin-top:1em;" type="button">Clear All Data</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
let mode='work',timeLeft=25*60,running=false,interval=null;
const display=document.getElementById('timer-display');
const status=document.getElementById('status');
const KEY='pomodoro_stats';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{sessions:[],lastDate:null,streak:0};}catch(e){return{sessions:[],lastDate:null,streak:0};}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d));}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function todayStr(){return new Date().toISOString().slice(0,10);}
function tick(){
timeLeft--;
if(timeLeft<=0){
running=false;clearInterval(interval);
if(mode==='work'){
const d=load();
const today=todayStr();
d.sessions.push({date:today,duration:25,ts:Date.now()});
if(d.lastDate===today){}else if(d.lastDate===new Date(Date.now()-86400000).toISOString().slice(0,10)){d.streak++;}else{d.streak=1;}
d.lastDate=today;
save(d);
status.textContent='Work session complete! Take a break.';
}
display.textContent='00:00';
renderStats();
return;
}
display.textContent=fmt(timeLeft);
}
document.getElementById('start').addEventListener('click',()=>{mode='work';timeLeft=25*60;display.textContent=fmt(timeLeft);if(!running){running=true;interval=setInterval(tick,1000);status.textContent='Working...';}});
document.getElementById('break').addEventListener('click',()=>{mode='break';timeLeft=5*60;display.textContent=fmt(timeLeft);if(!running){running=true;interval=setInterval(tick,1000);status.textContent='On break...';}});
document.getElementById('lbreak').addEventListener('click',()=>{mode='lbreak';timeLeft=15*60;display.textContent=fmt(timeLeft);if(!running){running=true;interval=setInterval(tick,1000);status.textContent='Long break...';}});
document.getElementById('reset').addEventListener('click',()=>{running=false;clearInterval(interval);mode='work';timeLeft=25*60;display.textContent=fmt(timeLeft);status.textContent='';});
document.getElementById('clear').addEventListener('click',()=>{if(confirm('Clear all stats?')){localStorage.removeItem(KEY);renderStats();}});
function renderStats(){
const d=load();const today=todayStr();
const todayCount=d.sessions.filter(s=>s.date===today).length;
const weekStart=new Date(Date.now()-6*86400000).toISOString().slice(0,10);
const weekCount=d.sessions.filter(s=>s.date>=weekStart).length;
const totalMin=d.sessions.reduce((a,s)=>a+s.duration,0);
document.getElementById('today-stats').innerHTML='<p>Sessions: <strong>'+todayCount+'</strong> | Focus time: <strong>'+(todayCount*25)+' min</strong></p>';
document.getElementById('week-stats').innerHTML='<p>Sessions: <strong>'+weekCount+'</strong> | Focus time: <strong>'+totalMin+' min</strong></p>';
document.getElementById('streak').innerHTML='<p>Current streak: <strong>'+d.streak+' day(s)</strong></p>';
}
renderStats();
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
