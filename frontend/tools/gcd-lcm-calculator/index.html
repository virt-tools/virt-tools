<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCD & LCM Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>GCD & LCM Calculator</h1>
<p class="subtitle">Find the Greatest Common Divisor and Least Common Multiple of any set of numbers.</p>
<div class="input-section">
<label>Numbers (comma separated)</label>
<input type="text" id="nums" value="12, 18, 24" style="width:100%" aria-label="Nums">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function gcd2(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function lcm2(a,b){return Math.abs(a*b)/gcd2(a,b);}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const nums=document.getElementById('nums').value.split(/[,\s]+/).map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)&&x>0);
if(nums.length<2){document.getElementById('result').innerHTML='<p class="warning">Enter at least 2 positive integers.</p>';document.getElementById('result').style.display='block';return;}
let gcd=nums.reduce(gcd2);
let lcm=nums.reduce(lcm2);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Numbers:</span><span>${nums.join(', ')}</span></div>
<div class="result-row"><span>GCD:</span><span>${gcd}</span></div>
<div class="result-row"><span>LCM:</span><span>${lcm}</span></div>
<div class="result-row"><span>Product:</span><span>${nums.reduce((a,b)=>a*b,1)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
