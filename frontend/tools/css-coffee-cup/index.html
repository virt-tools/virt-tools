<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Coffee Cup Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>☕ CSS Coffee Cup Generator</h1>
<p>Create CSS coffee cup with steam animation, 3 styles, adjustable color/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="mug">Mug</option><option value="espresso">Espresso</option><option value="to-go">To-Go</option></select></div>
<div class="ctrl-row"><label>Cup Color</label><input type="color" id="cup" value="#f5f0e8" style="width:60px;height:36px" aria-label="Cup"></div>
<div class="ctrl-row"><label>Liquid Color</label><input type="color" id="liquid" value="#3e2723" style="width:60px;height:36px" aria-label="Liquid"></div>
<div class="ctrl-row"><label>Steam</label><select id="steam" aria-label="Steam"><option value="yes">Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="100" max="220" step="5" value="150" style="width:200px" aria-label="Sz"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var cup=document.getElementById('cup').value;
var liquid=document.getElementById('liquid').value;
var steam=document.getElementById('steam').value;
var sz=parseInt(document.getElementById('sz').value);
var h=sz*1.1,w=sz*0.9;
var steamHTML=steam==='yes'?'<div class="steam"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>':'';
var handleW=sz*0.3,handleH=sz*0.4;
var handleCSS=style==='to-go'?'':'.cup-handle{position:absolute;top:30%;right:-'+(handleW*0.7)+'px;width:'+(handleW)+'px;height:'+(handleH)+'px;border:6px solid '+cup+';border-left:none;border-radius:0 '+(handleW/2)+'px '+(handleW/2)+'px 0;z-index:1}\n';
var html='<div class="cup-wrap">\n  '+steamHTML+'  <div class="cup-body">\n    <div class="cup-liquid"></div>\n  </div>\n  <div class="cup-handle"></div>\n</div>';
var css='.cup-wrap{position:relative;width:'+w+'px;height:'+h+'px;display:flex;align-items:flex-end;justify-content:center}\n';
css+=handleCSS;
css+='.cup-body{position:relative;width:'+(style==='espresso'?w*0.7:w)+'px;height:'+h+'px;background:'+cup+';border-radius:6px 6px '+(w*0.3)+'px '+(w*0.3)+'px;border-bottom:4px solid rgba(0,0,0,0.1);overflow:hidden;z-index:2}\n';
css+=''+(style==='to-go'?'':'');
css+='.cup-liquid{position:absolute;top:'+(h*0.08)+'px;left:0;right:0;height:'+(h*0.25)+'px;background:'+liquid+';border-radius:50% 50% 0 0;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.2)}\n';
if(style==='to-go'){css+='.cup-body{background:'+cup+';background-image:repeating-linear-gradient(0deg,'+cup+','+cup+' 8px,rgba(0,0,0,0.05) 8px,rgba(0,0,0,0.05) 16px)}\n'}
if(steam==='yes'){css+='.steam{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:'+(w*0.4)+'px;height:40px;z-index:3}\n';
css+='.steam div{position:absolute;width:'+(sz*0.05)+'px;height:'+(sz*0.2)+'px;background:rgba(255,255,255,0.3);border-radius:50%;animation:steam 2s infinite ease-in-out}\n';
css+='.s1{left:30%;animation-delay:0s}\n.s2{left:50%;animation-delay:.4s}\n.s3{left:70%;animation-delay:.8s}\n';
css+='@keyframes steam{0%{transform:translateY(20px) scale(1);opacity:0}30%{opacity:.6}100%{transform:translateY(-30px) scale(1.5);opacity:0}}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','cup','liquid','steam','sz'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
