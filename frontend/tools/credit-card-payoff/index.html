<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Payoff Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.cc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.cc h1{font-size:2rem;margin-bottom:.5rem}
.cc .sub{color:#888;margin-bottom:1.5rem}
.cc label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.cc input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.cc .row{display:flex;gap:1rem}
.cc .row>div{flex:1}
.cc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.cc .results{margin-top:2rem}
.cc .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.cc .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.cc .res-card .lbl{color:#888;font-size:13px}
.cc .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="cc">
<h1>💳 Credit Card Payoff Calculator</h1>
<p class="sub">See how long it takes to pay off your balance and how much interest you'll pay.</p>
<label for="balance">Current balance ($):</label>
<input type="number" id="balance" value="5000" min="0" oninput="calc()">
<div class="row">
<div><label for="apr">APR (%):</label>
<input type="number" id="apr" value="22.99" min="0" step="0.01" oninput="calc()"></div>
<div><label for="payment">Monthly payment ($):</label>
<input type="number" id="payment" value="200" min="0" oninput="calc()"></div>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const B=parseFloat(document.getElementById('balance').value)||0;
  const r=(parseFloat(document.getElementById('apr').value)||0)/100/12;
  const P=parseFloat(document.getElementById('payment').value)||0;
  if(P<=B*r&&B>0){
    document.getElementById('results').innerHTML='<div class="res-card"><div class="lbl">⚠️ Warning</div><div style="font-size:16px;margin-top:8px">Your monthly payment only covers interest. You will never pay off this balance. Increase your payment above $'+(B*r+1).toFixed(2)+'/month.</div></div>';
    return;
  }
  let bal=B,months=0,totalInt=0;
  while(bal>0&&months<600){
    const interest=bal*r;
    totalInt+=interest;
    bal+=interest-P;
    if(bal<0)bal=0;
    months++;
  }
  const totalPaid=B+totalInt;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Months to Pay Off</div><div class="big" style="color:#27ae60">'+months+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Years</div><div class="big" style="color:#27ae60">'+(months/12).toFixed(1)+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Total Interest Paid</div><div class="big" style="color:#e74c3c">$'+totalInt.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Paid</div><div class="big">$'+totalPaid.toFixed(2)+'</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
