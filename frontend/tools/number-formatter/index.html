<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Formatter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Number Formatter</h1>
<p class="subtitle">Format numbers with thousands separators, decimal precision, currency, and scientific notation.</p>
<div class="input-section">
<label>Number</label>
<input type="text" id="number" placeholder="Enter a number" value="1234567.891" aria-label="Enter A Number">
<label>Format</label>
<select id="format" aria-label="Format">
<option value="thousands">Thousands separator</option>
<option value="currency">Currency ($)</option>
<option value="euro">Currency (€)</option>
<option value="pound">Currency (£)</option>
<option value="scientific">Scientific notation</option>
<option value="percent">Percentage</option>
<option value="compact">Compact (1.2M)</option>
</select>
<label>Decimal places</label>
<input type="number" id="decimals" value="2" min="0" max="20" aria-label="Decimals">
<button id="format-btn" class="primary-btn" type="button">Format</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('format-btn').addEventListener('click',()=>{
const num=parseFloat(document.getElementById('number').value);
const fmt=document.getElementById('format').value;
const dec=parseInt(document.getElementById('decimals').value);
if(isNaN(num)){document.getElementById('result').innerHTML='<p>Invalid number</p>';document.getElementById('result').style.display='block';return;}
let result;
switch(fmt){
case 'thousands':result=num.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});break;
case 'currency':result=num.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:dec,maximumFractionDigits:dec});break;
case 'euro':result=num.toLocaleString('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:dec,maximumFractionDigits:dec});break;
case 'pound':result=num.toLocaleString('en-GB',{style:'currency',currency:'GBP',minimumFractionDigits:dec,maximumFractionDigits:dec});break;
case 'scientific':result=num.toExponential(dec);break;
case 'percent':result=(num*100).toFixed(dec)+'%';break;
case 'compact':result=num.toLocaleString('en-US',{notation:'compact',maximumFractionDigits:dec});break;
}
document.getElementById('result').innerHTML='<pre style="font-size:1.5em;padding:1em;border:1px solid #ccc">'+result+'</pre>';
document.getElementById('result').style.display='block';
window._result=result;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
