<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tubing Anchored Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tubing Anchored Calculator</h1>
<p>Calculate tubing elongation, anchor force, and helical buckling load for anchored tubing strings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Tubing length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-od">Tubing OD</label><input type="text" id="in-od" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.875"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-p">Pressure differential</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenE=document.getElementById("in-len"),odE=document.getElementById("in-od"),pE=document.getElementById("in-p"),out=document.getElementById("out");
function calc(){
var len=parseFloat(lenE.value),od=parseFloat(odE.value),p=parseFloat(pE.value);
if(isNaN(len)||isNaN(od)||isNaN(p))return;
var area=Math.PI*(Math.pow(od/2,2)-Math.pow(od/2-0.25,2));
var elongation=(p*area*len)/(3e7*area)*12;
var bucklingLoad=p*area;
var html='<div class="big">'+Math.round(bucklingLoad)+' lb</div>';
html+=row("Buckling load",Math.round(bucklingLoad).toLocaleString()+' lb');
html+=row("Elongation",Math.round(elongation*100)/100+' in');
html+=row("Cross-section area",Math.round(area*100)/100+' in²');
out.innerHTML=html;
}
[lenE,odE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
