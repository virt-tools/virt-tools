<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Grounding Conductor Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Grounding Conductor Selector</h1>
<p>Select the proper equipment grounding conductor size based on breaker rating per NEC Table 250.122. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-br">Breaker rating</label><input type="text" id="in-br" inputmode="numeric" autocomplete="off" placeholder="e.g. 100"><div class="unit">amps</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nec={15:"14 AWG",20:"12 AWG",30:"10 AWG",40:"10 AWG",60:"10 AWG",100:"8 AWG",200:"6 AWG",300:"4 AWG",400:"3 AWG",500:"2 AWG",600:"1 AWG",800:"0 AWG",1000:"00 AWG",1200:"000 AWG",1600:"0000 AWG",2000:"250 kcmil",2500:"350 kcmil",3000:"400 kcmil",4000:"500 kcmil",5000:"700 kcmil",6000:"800 kcmil"};
var bEl=document.getElementById("in-br"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Br=pn(bEl.value);
if(Br==null)return;
if(!isFinite(Br)||Br<=0){err.textContent="Enter a valid positive value.";return}
var keys=Object.keys(nec).map(Number).sort(function(a,b){return a-b});
var size="—";
for(var i=0;i<keys.length;i++){if(Br<=keys[i]){size=nec[keys[i]];break}}
if(size==="—")size="Consult NEC Table 250.122";
err.textContent="";
var html='<div class="big">'+size+'</div>';
html+=row("Breaker rating",Br+' A');
html+=row("EGC size (copper)",size);
html+=row("Reference","NEC 250.122");
out.innerHTML=html;
}
[bEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
