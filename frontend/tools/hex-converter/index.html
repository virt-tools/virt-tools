<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex ↔ Text Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Hex ↔ Text Converter</h1>
<p class="subtitle">Convert text to hexadecimal and back. Supports ASCII, UTF-8, and custom separators. 100% client-side.</p>

<div style="max-width:700px;margin:0 auto;display:grid;gap:1rem;">
  <div>
    <label style="font-weight:bold;display:block;margin-bottom:.3rem;">Text input</label>
    <textarea id="text" rows="4" style="width:100%;font-family:monospace;font-size:1rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" placeholder="Hello World" aria-label="Hello World">Hello World</textarea>
  </div>

  <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
    <button id="to-hex" style="padding:.6rem 1.2rem;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;" type="button">↓ Text → Hex</button>
    <button id="to-text" style="padding:.6rem 1.2rem;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;" type="button">↑ Hex → Text</button>
    <select id="sep" style="padding:.5rem;border:2px solid #ddd;border-radius:6px;font-size:.9rem;" aria-label="Sep">
      <option value="space">Space (48 65 6c)</option>
      <option value="0x">0x prefix (0x48 0x65)</option>
      <option value="none">No separator (48656c)</option>
      <option value="dash">Dash (48-65-6c)</option>
      <option value="colon">Colon (48:65:6c)</option>
    </select>
    <label style="font-size:.85rem;display:flex;align-items:center;gap:.3rem;"><input type="checkbox" id="upper" checked> Uppercase</label>
  </div>

  <div>
    <label style="font-weight:bold;display:block;margin-bottom:.3rem;">Hex output</label>
    <textarea id="hex" rows="4" style="width:100%;font-family:monospace;font-size:1rem;padding:.5rem;border:2px solid #ddd;border-radius:6px;resize:vertical;" placeholder="48656c6c6f20576f726c64" aria-label="48656C6C6F20576F726C64"></textarea>
  </div>

  <div style="display:flex;gap:.5rem;">
    <button id="copy" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Copy hex</button>
    <button id="clear" style="padding:.4rem .8rem;border:2px solid #ddd;border-radius:6px;cursor:pointer;background:#f9fafb;" type="button">Clear</button>
  </div>

  <div id="status" style="font-size:.85rem;color:#666;"></div>
</div>

<script src="/assets/app.js"></script>
<script>
(function(){
const text=document.getElementById('text');
const hex=document.getElementById('hex');
const sep=document.getElementById('sep');
const upper=document.getElementById('upper');
const status=document.getElementById('status');

function getSep(){
  switch(sep.value){
    case 'space':return ' ';
    case '0x':return '0x';
    case 'none':return '';
    case 'dash':return '-';
    case 'colon':return ':';
  }
  return ' ';
}

function textToHex(){
  const t=text.value;
  if(!t){status.textContent='';return;}
  const encoder=new TextEncoder();
  const bytes=encoder.encode(t);
  let h='';
  const s=getSep();
  bytes.forEach((b,i)=>{
    if(i>0&&s!=='0x')h+=s;
    if(s==='0x')h+='0x';
    h+=upper.checked?b.toString(16).toUpperCase().padStart(2,'0'):b.toString(16).padStart(2,'0');
  });
  hex.value=h;
  status.textContent=t.length+' chars → '+bytes.length+' bytes → '+(h.replace(/0x/g,'').length/2)+' hex digits';
}

function hexToText(){
  let h=hex.value.trim();
  if(!h){status.textContent='';return;}
  h=h.replace(/0x/g,'').replace(/[\s:-]/g,'');
  if(!/^[0-9a-fA-F]+$/.test(h)){
    status.textContent='Error: invalid hex (non-hex characters found)';
    text.value='';
    return;
  }
  if(h.length%2!==0){
    status.textContent='Error: hex length must be even (got '+h.length+')';
    return;
  }
  const bytes=new Uint8Array(h.length/2);
  for(let i=0;i<h.length;i+=2)bytes[i/2]=parseInt(h.substring(i,i+2),16);
  const decoder=new TextDecoder('utf-8');
  try{
    text.value=decoder.decode(bytes);
    status.textContent=bytes.length+' bytes → '+text.value.length+' chars';
  }catch(e){
    status.textContent='Error: '+e.message;
  }
}

document.getElementById('to-hex').addEventListener('click',textToHex);
document.getElementById('to-text').addEventListener('click',hexToText);
document.getElementById('copy').addEventListener('click',()=>{hex.select();document.execCommand('copy');status.textContent='Copied to clipboard';});
document.getElementById('clear').addEventListener('click',()=>{text.value='';hex.value='';status.textContent='';});
[sep,upper].forEach(el=>el.addEventListener('change',textToHex));
textToHex();
})();
</script>
</body>
</html>
