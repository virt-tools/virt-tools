<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Monitoring Tamper Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Monitoring Tamper Calculator</h1>
<p>Calculate the number of tamper switches and supervision modules needed for valve and device monitoring. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">Control valves</label><input type="text" id="in-v" inputmode="numeric" autocomplete="off" placeholder="e.g. 8"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-d">Door tamper devices</label><input type="text" id="in-d" inputmode="numeric" autocomplete="off" placeholder="e.g. 4"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vEl=document.getElementById("in-v"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(vEl.value),Dc=pn(dEl.value);
if(V==null||Dc==null)return;
if(!isFinite(V)||V<0||!isFinite(Dc)||Dc<0){err.textContent="Enter valid non-negative values.";return}
err.textContent="";
var total=V+Dc;
var modCount=Math.ceil(total/10);
var html='<div class="big">'+total+' tamper switches</div>';
html+=row("Valve tamper switches",V);
html+=row("Door tamper devices",Dc);
html+=row("Total tamper devices",total);
html+=row("Supervision modules",modCount);
out.innerHTML=html;
}
[vEl,dEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
