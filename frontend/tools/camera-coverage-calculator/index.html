<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Camera Coverage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Camera Coverage Calculator</h1>
<p>Calculate camera coverage area, blind spot, and number of cameras needed for a rectangular zone. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Camera range</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-a">Horizontal FOV</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 80"><div class="unit">degrees</div></div>
<div class="field"><label class="f" for="in-z">Zone length</label><input type="text" id="in-z" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-x">Zone width</label><input type="text" id="in-x" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rEl=document.getElementById("in-r"),aEl=document.getElementById("in-a"),zEl=document.getElementById("in-z"),xEl=document.getElementById("in-x"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=pn(rEl.value),A=pn(aEl.value),Z=pn(zEl.value),X=pn(xEl.value);
if(R==null||A==null||Z==null||X==null)return;
if(!isFinite(R)||R<=0||!isFinite(A)||A<=0||A>180||!isFinite(Z)||Z<=0||!isFinite(X)||X<=0){err.textContent="Range, FOV (1-180), zone must be positive.";return}
err.textContent="";
var halfA=A/2*Math.PI/180;
var triW=2*R*Math.tan(halfA);
var triArea=0.5*triW*R;
var zoneArea=Z*X;
var pct=Math.min(100,triArea/zoneArea*100);
var nCam=Math.ceil(zoneArea/triArea);
var html='<div class="big">'+nCam+' cameras</div>';
html+=row("Coverage per camera",rnd(triArea,1)+" m²");
html+=row("Coverage width at range",rnd(triW,1)+" m");
html+=row("Zone area",rnd(zoneArea,1)+" m²");
html+=row("Coverage of zone",rnd(pct,1)+" %");
html+=row("Cameras needed",nCam);
out.innerHTML=html;
}
[rEl,aEl,zEl,xEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
