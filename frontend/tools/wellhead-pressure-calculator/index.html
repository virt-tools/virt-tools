<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wellhead Pressure Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wellhead Pressure Calculator</h1>
<p>Calculate wellhead flowing pressure, bottomhole pressure, and hydrostatic head from reservoir pressure and fluid gradient. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rp">Reservoir pressure</label><input type="text" id="in-rp" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-grad">Fluid gradient</label><input type="text" id="in-grad" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.433"><div class="unit">psi/ft</div></div>
<div class="field"><label class="f" for="in-depth">Depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 6000"><div class="unit">ft</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rpE=document.getElementById("in-rp"),gradE=document.getElementById("in-grad"),depthE=document.getElementById("in-depth"),out=document.getElementById("out");
function calc(){
var rp=parseFloat(rpE.value),grad=parseFloat(gradE.value),depth=parseFloat(depthE.value);
if(isNaN(rp)||isNaN(grad)||isNaN(depth))return;
var hydro=grad*depth;
var whp=rp-hydro;
var html='<div class="big">'+Math.round(whp)+' psi</div>';
html+=row("Wellhead pressure",Math.round(whp)+' psi');
html+=row("Hydrostatic head",Math.round(hydro)+' psi');
html+=row("Bottomhole pressure",Math.round(rp)+' psi');
out.innerHTML=html;
}
[rpE,gradE,depthE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
