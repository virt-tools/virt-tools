<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Temperature Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Temperature Unit Converter</h1><p class="subtitle">Convert between all supported temperature units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Temperature","units":[{"slug":"celsius","name":"Degrees Celsius","symbol":"°C","scale":1,"offset":273.15},{"slug":"fahrenheit","name":"Degrees Fahrenheit","symbol":"°F","scale":0.5555555555555556,"offset":255.3722222222222},{"slug":"kelvin","name":"Kelvin","symbol":"K","scale":1,"offset":0},{"slug":"rankine","name":"Degrees Rankine","symbol":"°R","scale":0.5555555555555556,"offset":0},{"slug":"reaumur","name":"Degrees Réaumur","symbol":"°Ré","scale":1.25,"offset":273.15}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
