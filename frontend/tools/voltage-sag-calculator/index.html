<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Voltage Sag Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Voltage Sag Calculator</h1>
<p>Calculate voltage sag depth, duration category (IEEE 1159), and residual voltage from pre-sag and during-sag values. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v1">Nominal voltage</label><input type="text" id="in-v1" inputmode="decimal" autocomplete="off" placeholder="e.g. 480"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-v2">Sag voltage</label><input type="text" id="in-v2" inputmode="decimal" autocomplete="off" placeholder="e.g. 350"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-d">Duration</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.2"><div class="unit">s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var v1E=document.getElementById("in-v1"),v2E=document.getElementById("in-v2"),dE=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var v1=pn(v1E.value),v2=pn(v2E.value),d=pn(dE.value);
if(v1==null||v2==null||d==null)return;
if(!isFinite(v1)||v1<=0||!isFinite(v2)||v2<0||!isFinite(d)||d<0){err.textContent="Enter valid non-negative values (nominal voltage must be positive).";return}
if(v2>v1){err.textContent="Sag voltage exceeds nominal voltage — that is a swell, not a sag.";return}
err.textContent="";
var sagPct=((v1-v2)/v1)*100;
var residual=(v2/v1)*100;
var cat=d<0.5?"Instantaneous":d<3?"Momentary":"Temporary";
var html='<div class="big">'+(Math.round(sagPct*10)/10)+'%</div>';
html+=row("Sag depth",Math.round(sagPct*10)/10+'%');
html+=row("Residual voltage",Math.round(residual*10)/10+'%');
html+=row("Duration category",cat);
out.innerHTML=html;
}
[v1E,v2E,dE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
