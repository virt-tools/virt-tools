<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Frame Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Picture Frame & Mat Calculator</h1>
<p class="subtitle">Calculate mat opening, border widths, and frame dimensions for custom framing.</p>
<div class="input-section">
<label>Artwork Width (inches)</label>
<input type="number" id="artW" value="16" min="1" step="0.0625" aria-label="Art W">
<label>Artwork Height (inches)</label>
<input type="number" id="artH" value="20" min="1" step="0.0625" aria-label="Art H">
<label>Mat Border Width (inches)</label>
<input type="number" id="border" value="3" min="0.5" step="0.0625" aria-label="Border">
<label>Mat Overlap (inches)</label>
<input type="number" id="overlap" value="0.25" min="0" max="1" step="0.0625" aria-label="Overlap">
<label>Frame Width (inches)</label>
<input type="number" id="frameW" value="1.5" min="0.5" step="0.0625" aria-label="Frame W">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const aW=parseFloat(document.getElementById('artW').value)||0;
const aH=parseFloat(document.getElementById('artH').value)||0;
const b=parseFloat(document.getElementById('border').value)||0;
const o=parseFloat(document.getElementById('overlap').value)||0;
const fW=parseFloat(document.getElementById('frameW').value)||0;
const matOpeningW=aW-o*2;
const matOpeningH=aH-o*2;
const matOuterW=aW+b*2;
const matOuterH=aH+b*2;
const frameInnerW=matOuterW;
const frameInnerH=matOuterH;
const frameOuterW=matOuterW+fW*2;
const frameOuterH=matOuterH+fW*2;
const glassW=matOuterW;
const glassH=matOuterH;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Artwork Size:</span><span>${aW}" × ${aH}"</span></div>
<div class="result-row"><span>Mat Opening (visible):</span><span>${matOpeningW.toFixed(2)}" × ${matOpeningH.toFixed(2)}"</span></div>
<div class="result-row"><span>Mat Outer Size:</span><span>${matOuterW.toFixed(2)}" × ${matOuterH.toFixed(2)}"</span></div>
<div class="result-row"><span>Glass Size:</span><span>${glassW.toFixed(2)}" × ${glassH.toFixed(2)}"</span></div>
<div class="result-row"><span>Frame Outer Size:</span><span>${frameOuterW.toFixed(2)}" × ${frameOuterH.toFixed(2)}"</span></div>
<div class="result-row"><span>Frame Molding Length:</span><span>${(frameOuterW*2+frameOuterH*2).toFixed(2)}" total</span></div>
<p class="hint">Mat overlap: ${o}" on each side to hold artwork in place.</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
