<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitwise Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Bitwise Calculator</h1>
<p class="subtitle">Perform bitwise operations (AND, OR, XOR, NOT, shift left/right) on integers. View results in binary, hex, octal, and decimal simultaneously.</p>
<div class="tool-layout">
<div class="controls">
<label>Input A <input type="text" id="inputA" value="255" style="font-family:monospace;"></label>
<label>Input B <input type="text" id="inputB" value="170" style="font-family:monospace;"></label>
<label>Base
<select id="baseA">
<option value="10">Decimal</option>
<option value="2">Binary</option>
<option value="16">Hex</option>
<option value="8">Octal</option>
</select></label>
<div class="ops">
<button class="op-btn" data-op="AND" type="button">A &amp; B</button>
<button class="op-btn" data-op="OR" type="button">A | B</button>
<button class="op-btn" data-op="XOR" type="button">A ^ B</button>
<button class="op-btn" data-op="NOT" type="button">~ A</button>
<button class="op-btn" data-op="SHL" type="button">A &lt;&lt; B</button>
<button class="op-btn" data-op="SHR" type="button">A &gt;&gt; B</button>
<button class="op-btn" data-op="USHR" type="button">A &gt;&gt;&gt; B</button>
</div>
<div class="conversions" id="conversions"></div>
</div>
<div class="results" id="results"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const inputA=document.getElementById('inputA');
const inputB=document.getElementById('inputB');
const baseA=document.getElementById('baseA');
const results=document.getElementById('results');
const conversions=document.getElementById('conversions');
function parseVal(v, base) {
  v = v.trim();
  if (!v) return 0;
  if (base === 2) return parseInt(v.replace(/0b/i, ''), 2);
  if (base === 16) return parseInt(v.replace(/0x/i, ''), 16);
  if (base === 8) return parseInt(v.replace(/0o/i, ''), 8);
  return parseInt(v, 10);
}
function toBinary(n) {
  if (n < 0) n = (n >>> 0);
  return n.toString(2);
}
function toHex(n) {
  if (n < 0) n = (n >>> 0);
  return '0x' + n.toString(16).toUpperCase();
}
function toOctal(n) {
  if (n < 0) n = (n >>> 0);
  return '0o' + n.toString(8);
}
function toDec(n) {
  return (n >>> 0).toString(10);
}
function showConversions() {
  const a = parseVal(inputA.value, parseInt(baseA.value));
  conversions.innerHTML = '<h3>Input A Conversions</h3>' +
    '<div class="conv-row"><span>Decimal</span><span>' + toDec(a) + '</span></div>' +
    '<div class="conv-row"><span>Binary</span><span class="mono">' + toBinary(a) + '</span></div>' +
    '<div class="conv-row"><span>Hex</span><span class="mono">' + toHex(a) + '</span></div>' +
    '<div class="conv-row"><span>Octal</span><span class="mono">' + toOctal(a) + '</span></div>';
  const b = parseVal(inputB.value, parseInt(baseA.value));
  conversions.innerHTML += '<h3 style="margin-top:1rem;">Input B Conversions</h3>' +
    '<div class="conv-row"><span>Decimal</span><span>' + toDec(b) + '</span></div>' +
    '<div class="conv-row"><span>Binary</span><span class="mono">' + toBinary(b) + '</span></div>' +
    '<div class="conv-row"><span>Hex</span><span class="mono">' + toHex(b) + '</span></div>' +
    '<div class="conv-row"><span>Octal</span><span class="mono">' + toOctal(b) + '</span></div>';
}
function compute(op) {
  const a = parseVal(inputA.value, parseInt(baseA.value));
  const b = parseVal(inputB.value, parseInt(baseA.value));
  let result;
  let expr;
  switch(op) {
    case 'AND': result = a & b; expr = a + ' & ' + b; break;
    case 'OR': result = a | b; expr = a + ' | ' + b; break;
    case 'XOR': result = a ^ b; expr = a + ' ^ ' + b; break;
    case 'NOT': result = ~a; expr = '~' + a; break;
    case 'SHL': result = a << b; expr = a + ' << ' + b; break;
    case 'SHR': result = a >> b; expr = a + ' >> ' + b; break;
    case 'USHR': result = a >>> b; expr = a + ' >>> ' + b; break;
  }
  results.innerHTML = '<h3>Result</h3>' +
    '<div class="expr">' + expr + ' = </div>' +
    '<div class="big-result">' + toDec(result) + '</div>' +
    '<div class="conv-row"><span>Binary</span><span class="mono">' + toBinary(result) + '</span></div>' +
    '<div class="conv-row"><span>Hex</span><span class="mono">' + toHex(result) + '</span></div>' +
    '<div class="conv-row"><span>Octal</span><span class="mono">' + toOctal(result) + '</span></div>' +
    '<div class="conv-row"><span>Binary (32-bit)</span><span class="mono">' + (result >>> 0).toString(2).padStart(32, '0') + '</span></div>';
}
document.querySelectorAll('.op-btn').forEach(btn => {
  btn.addEventListener('click', () => compute(btn.dataset.op));
});
[inputA, inputB, baseA].forEach(el => el.addEventListener('input', showConversions));
showConversions();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:280px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.controls input,.controls select{padding:.5rem;border:1px solid #ddd;border-radius:8px;font-size:.95rem;}
.ops{display:flex;flex-wrap:wrap;gap:.5rem;}
.op-btn{padding:.5rem 1rem;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-family:monospace;font-weight:600;font-size:.9rem;}
.op-btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
.results{flex:1;min-width:300px;}
.conv-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #eee;font-size:.9rem;}
.mono{font-family:monospace;word-break:break-all;}
.expr{font-family:monospace;font-size:1.1rem;opacity:.7;margin-bottom:.5rem;}
.big-result{font-size:2rem;font-family:monospace;font-weight:700;margin-bottom:1rem;word-break:break-all;}
h3{margin-top:1rem;}
</style>
</body>
</html>
