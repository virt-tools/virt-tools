<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Subsea Isolation Valve Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Subsea Isolation Valve Selector</h1>
<p>Select subsea isolation valve size, pressure rating, and actuator type from flow rate and operating pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Flow rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-press">Operating pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-temp">Temperature</label><input type="text" id="in-temp" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">°F</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rate"),pE=document.getElementById("in-press"),tE=document.getElementById("in-temp"),out=document.getElementById("out");
function calc(){
var r=parseFloat(rE.value),p=parseFloat(pE.value),t=parseFloat(tE.value);
if(isNaN(r)||isNaN(p)||isNaN(t))return;
var dia=Math.sqrt(r/500)*2;
var rating=p>5000?10000:p>3000?5000:3000;
var actuator=t>200?"ROV":"Hydraulic";
var html='<div class="big">'+(Math.round(dia*10)/10)+' in</div>';
html+=row("Valve size",Math.round(dia*10)/10+' in');
html+=row("Pressure rating",rating.toLocaleString()+' psi');
html+=row("Actuator type",actuator);
out.innerHTML=html;
}
[rE,pE,tE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
