<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Compass Rose Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:400px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🧭 CSS Compass Rose Generator</h1>
<p>Create CSS compass rose / wind rose with cardinal points and rotating needle. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="classic">Classic</option><option value="mariner">Mariner</option><option value="star">Star</option><option value="modern">Modern</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="200" max="350" step="10" value="280" style="width:200px"></div>
<div class="ctrl-row"><label>Rotate Speed</label><input type="range" id="speed" min="0" max="30" step="1" value="0" style="width:200px"></div>
<div class="ctrl-row"><label>Needle Color</label><input type="color" id="needle" value="#ff4444"></div>
<div class="ctrl-row"><label>Face Color</label><input type="color" id="face" value="#f0e68c"></div>
<div class="ctrl-row"><label>Border Color</label><input type="color" id="border" value="#b8860b"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#1a1a2e"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var sz=parseInt(document.getElementById('size').value);
var sp=parseFloat(document.getElementById('speed').value);
var needle=document.getElementById('needle').value;
var face=document.getElementById('face').value;
var border=document.getElementById('border').value;
var bg=document.getElementById('bgcolor').value;
var dirs=['N','NE','E','SE','S','SW','W','NW'];
var html='<div class="compass">\n  <div class="compass-face">\n';
dirs.forEach(function(d,i){
var ang=i*45;
html+='    <span class="dir" style="transform:rotate('+ang+'deg)">'+(d.length===1?'<b>'+d+'</b>':d)+'</span>\n';
});
html+='    <div class="compass-needle"></div>\n    <div class="compass-center"></div>\n  </div>\n</div>';
var css='.compass{width:'+sz+'px;height:'+sz+'px;position:relative;background:'+bg+';border-radius:50%;border:3px solid '+border+';display:flex;align-items:center;justify-content:center}\n';
css+='.compass-face{width:85%;height:85%;position:relative}\n';
css+='.dir{position:absolute;top:50%;left:50%;transform-origin:0 0;font-size:'+(sz/20)+'px;color:'+face+';font-weight:bold}\n';
css+='.dir b{font-size:'+(sz/14)+'px}\n';
css+='.compass-needle{position:absolute;top:50%;left:50%;width:'+(sz/30)+'px;height:'+(sz*0.4)+'px;transform-origin:center bottom;background:linear-gradient(to top,transparent 50%,'+needle+' 50%);transform:translate(-50%,-100%)'+(sp>0?' rotate(0deg)':'')+';clip-path:polygon(50% 0,100% 100%,0 100%)'+(sp>0?';animation:compass-spin '+sp+'s linear infinite':'')+'}\n';
css+='.compass-center{position:absolute;top:50%;left:50%;width:'+(sz/25)+'px;height:'+(sz/25)+'px;border-radius:50%;background:'+border+';transform:translate(-50%,-50%)}\n';
if(sp>0)css+='@keyframes compass-spin{from{transform:translate(-50%,-100%) rotate(0deg)}to{transform:translate(-50%,-100%) rotate(360deg)}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','size','speed','needle','face','border','bgcolor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
