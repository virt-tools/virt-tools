<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projector Throw Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Projector Throw Calculator</h1>
<p class="subtitle">Calculate projector distance, image size, and throw ratio.</p>
<div class="input-section">
<label>Throw Ratio</label>
<input type="number" id="ratio" value="1.5" min="0.3" max="5" step="0.1" aria-label="Ratio">
<label>Desired Image Width (inches)</label>
<input type="number" id="imgWidth" value="120" min="10" aria-label="Img Width">
<label>Projector Brightness (lumens)</label>
<input type="number" id="lumens" value="2500" min="100" step="100" aria-label="Lumens">
<label>Screen Gain</label>
<input type="number" id="gain" value="1" min="0.3" max="10" step="0.1" aria-label="Gain">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const R=parseFloat(document.getElementById('ratio').value)||1;
const W=parseFloat(document.getElementById('imgWidth').value)||0;
const L=parseFloat(document.getElementById('lumens').value)||0;
const G=parseFloat(document.getElementById('gain').value)||1;
const throwDist=R*W;
const imgHeight=W*9/16;
const imgDiag=Math.sqrt(W*W+imgHeight*imgHeight);
const ftL=(L/(W*imgHeight))/G;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Throw Ratio:</span><span>${R}:1</span></div>
<div class="result-row"><span>Throw Distance:</span><span>${throwDist.toFixed(1)}" (${(throwDist/12).toFixed(2)} ft)</span></div>
<div class="result-row"><span>Image Width:</span><span>${W}"</span></div>
<div class="result-row"><span>Image Height (16:9):</span><span>${imgHeight.toFixed(1)}"</span></div>
<div class="result-row"><span>Image Diagonal:</span><span>${imgDiag.toFixed(1)}"</span></div>
<div class="result-row"><span>Brightness on Screen:</span><span>${ftL.toFixed(1)} ftL (foot-lamberts)</span></div>
${ftL>=12?'<p class="ok">✓ Brightness adequate for home theater</p>':ftL>=5?'<p class="warning">⚠️ Dim for dark scenes — brighter projector or higher gain recommended</p>':'<p class="warning">⚠️ Too dim — upgrade projector or screen</p>'}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
