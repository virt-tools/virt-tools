<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cable Tray Support Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cable Tray Support Calculator</h1>
<p>Calculate the number of supports, spacing, and load per support for cable tray runs. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-run">Run length</label><input type="text" id="in-run" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-sp">Max support spacing</label><input type="text" id="in-sp" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-load">Cable load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">lb/ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var runEl=document.getElementById("in-run"),spEl=document.getElementById("in-sp"),loadEl=document.getElementById("in-load"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RUN=parseFloat(runEl.value),SP=parseFloat(spEl.value),LD=parseFloat(loadEl.value);
if(isNaN(RUN)||isNaN(SP)||isNaN(LD))return;
if(RUN<=0||SP<=0||LD<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var supports=Math.ceil(RUN/SP)+1;
var actualSpacing=RUN/(supports-1);
var loadPerSupport=actualSpacing*LD;
var totalLoad=RUN*LD;
var html='<div class="big">'+supports+' supports</div>';
html+=row("Supports needed",supports);
html+=row("Actual spacing",Math.round(actualSpacing*100)/100+" ft");
html+=row("Load per support",Math.round(loadPerSupport)+" lb");
html+=row("Total cable load",Math.round(totalLoad)+" lb");
out.innerHTML=html;
}
[runEl,spEl,loadEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
