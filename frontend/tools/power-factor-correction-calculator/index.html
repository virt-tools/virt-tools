<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Power Factor Correction Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Power Factor Correction Calculator</h1>
<p>Calculate required capacitor kVAR to improve power factor from current to target value. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-kw">Real power</label><input type="text" id="in-kw" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-pf1">Current PF</label><input type="text" id="in-pf1" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">cos φ</div></div>
<div class="field"><label class="f" for="in-pf2">Target PF</label><input type="text" id="in-pf2" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.95"><div class="unit">cos φ</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var kwE=document.getElementById("in-kw"),pf1E=document.getElementById("in-pf1"),pf2E=document.getElementById("in-pf2"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var kw=parseFloat(kwE.value),pf1=parseFloat(pf1E.value),pf2=parseFloat(pf2E.value);
if(isNaN(kw)||isNaN(pf1)||isNaN(pf2))return;
if(kw<=0||pf1<=0||pf1>1||pf2<=0||pf2>1){err.textContent="Power factor must be between 0 and 1; power must be positive.";return}
var kvar=kw*(Math.tan(Math.acos(pf1))-Math.tan(Math.acos(pf2)));
if(kvar<0){err.textContent="Target power factor must be greater than or equal to current power factor.";return}
err.textContent="";
var kvaBefore=kw/pf1;
var kvaAfter=kw/pf2;
var html='<div class="big">'+(Math.round(kvar*10)/10)+' kVAR</div>';
html+=row("Required capacitor",Math.round(kvar*10)/10+' kVAR');
html+=row("Apparent power before",Math.round(kvaBefore*10)/10+' kVA');
html+=row("Apparent power after",Math.round(kvaAfter*10)/10+' kVA');
html+=row("Reduction",Math.round((kvaBefore-kvaAfter)*10)/10+' kVA');
out.innerHTML=html;
}
[kwE,pf1E,pf2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
