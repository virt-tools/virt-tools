<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Speed Converter</h1>
<p class="subtitle">Convert between m/s, km/h, mph, knots, fps, Mach, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="100" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Meter/second (m/s)</option>
<option value="0.277778">Kilometer/hour (km/h)</option>
<option value="0.44704">Mile/hour (mph)</option>
<option value="0.514444">Knot (kn)</option>
<option value="0.3048">Foot/second (ft/s)</option>
<option value="0.00277778">Kilometer/minute</option>
<option value="0.00508">Foot/minute</option>
<option value="343">Mach (sea level)</option>
<option value="299792458">Speed of Light (c)</option>
<option value="0.01">Centimeter/second (cm/s)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['m/s',1],['km/h',0.277778],['mph',0.44704],['Knot (kn)',0.514444],['ft/s',0.3048],['ft/min',0.00508],['km/min',0.0166667],['Mach',343],['Speed of Light (c)',299792458],['cm/s',0.01],['in/s',0.0254],['yard/s',0.9144]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const ms=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=ms/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
