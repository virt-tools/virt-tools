<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to ASCII Art — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image to ASCII Art</h1>
<p class="subtitle">Convert images to ASCII art with adjustable character density. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
<label>Width: <input type="number" id="width" value="120" min="10" max="400" style="width:80px"></label>
<button onclick="convert()" type="button">Convert</button>
</div>
<pre id="output" style="font-family:monospace;font-size:10px;line-height:10px;white-space:pre;overflow:auto;margin-top:10px;max-height:500px;background:#111;padding:10px;border-radius:6px;color:#0f0"></pre>
<script>
function convert(){
var f=document.getElementById('file').files[0];if(!f)return;
var w=parseInt(document.getElementById('width').value)||120;
var chars=' .:-=+*#%@';
var img=new Image();
img.onload=function(){
var ratio=img.naturalHeight/img.naturalWidth*0.5;
var h=Math.round(w*ratio);
var c=document.createElement('canvas');c.width=w;c.height=h;
var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
var d=ctx.getImageData(0,0,w,h).data;
var out='';
for(var y=0;y<h;y++){
for(var x=0;x<w;x++){
var i=(y*w+x)*4;
var lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
var ci=Math.floor(lum/256*chars.length);
out+=chars[chars.length-1-ci]||chars[0];
}
out+='\n';
}
document.getElementById('output').textContent=out;
};
img.src=URL.createObjectURL(f);
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
