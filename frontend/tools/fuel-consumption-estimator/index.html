<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fuel Consumption Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Fuel Consumption Estimator</h1>
<p>Estimate generator fuel consumption from load and run time. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Generator load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-rate">Fuel rate at full load</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">gal/hr</div></div>
<div class="field"><label class="f" for="in-hrs">Run time</label><input type="text" id="in-hrs" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">hours</div></div>
<div class="field"><label class="f" for="in-cap">Rated watts</label><input type="text" id="in-cap" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">watts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter load, fuel rate, run time, and rated watts.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var loadEl=document.getElementById("in-load"),rateEl=document.getElementById("in-rate"),hrsEl=document.getElementById("in-hrs"),capEl=document.getElementById("in-cap"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(loadEl.value),R=pn(rateEl.value),H=pn(hrsEl.value),C=pn(capEl.value);
if(L==null||R==null||H==null||C==null)return;
if(!isFinite(L)||!isFinite(R)||!isFinite(H)||!isFinite(C)||L<0||R<=0||H<0||C<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var loadPct=L/C;
var adjRate=R*(0.5+0.5*loadPct);
var fuel=adjRate*H;
var html='<div class="big">'+rnd(fuel,2)+' gal</div>';
html+=row("Generator load",rnd(L,0)+" W");
html+=row("Rated watts",rnd(C,0)+" W");
html+=row("Load factor",rnd(loadPct*100,0)+"%");
html+=row("Full-load rate",rnd(R,3)+" gal/hr");
html+=row("Adjusted rate",rnd(adjRate,3)+" gal/hr");
html+=row("Run time",rnd(H,1)+" hr");
html+=row("Total fuel",rnd(fuel,2)+" gal");
out.innerHTML=html;
}
[loadEl,rateEl,hrsEl,capEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
