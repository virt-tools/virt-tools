<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Playset Lumber Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Playset Lumber Calculator</h1>
<p>Calculate lumber needed for an A-frame playset from tower height and swing beam length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Tower height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-b">Swing beam length</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),B=pn(bEl.value);
if(H==null||B==null)return;
if(!isFinite(H)||!isFinite(B)||H<=0||B<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var posts=4*H;
var beam=B;
var deck=2*B;
var aframe=2*Math.sqrt(H*H+B*B/4);
var total=posts+beam+deck+aframe;
var html='<div class="big">'+rnd(total,0)+' ft</div>';
html+=row("Tower posts (4)",rnd(posts,0)+' ft');
html+=row("Swing beam",rnd(beam,0)+' ft');
html+=row("Deck framing",rnd(deck,0)+' ft');
html+=row("A-frame legs",rnd(aframe,0)+' ft');
html+=row("Total lumber",rnd(total,0)+' ft');
out.innerHTML=html;
}
[hEl,bEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
