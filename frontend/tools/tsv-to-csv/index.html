<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSV to CSV Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>TSV to CSV Converter</h1>
<p class="subtitle">Convert tab-separated values to comma-separated values with proper quoting.</p>
<div class="input-section">
<label>TSV Input</label>
<textarea id="input" rows="8" placeholder="col1&#9;col2&#10;val1&#9;val2" aria-label="Col1&#9;Col2&#10;Val1&#9;Val2"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const lines=text.split('\n').filter(l=>l.length>0);
const rows=lines.map(l=>l.split('\t'));
const csv=toCSV(rows);
const r=document.getElementById('result');
r.innerHTML='<textarea rows="8" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+csv+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
