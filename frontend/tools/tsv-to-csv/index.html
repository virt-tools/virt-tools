<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSV to CSV Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>TSV to CSV Converter</h1>
<p class="subtitle">Convert tab-separated values to comma-separated values with proper quoting.</p>
<div class="input-section">
<label for="input">TSV Input</label>
<textarea id="input" rows="8" placeholder="col1&#9;col2&#10;val1&#9;val2"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value){
const result=document.getElementById('result');
const output=document.createElement('textarea');
output.rows=8;
output.style.cssText='width:100%;font-family:monospace;';
output.readOnly=true;
output.setAttribute('aria-label','CSV output');
output.value=value;
const copy=document.createElement('button');
copy.type='button';
copy.textContent='Copy';
copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));
result.replaceChildren(output,copy);
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n')||v.includes('\r'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
const result=document.getElementById('result');
if(!text.trim()){result.textContent='Enter TSV data above, then press Convert.';return;}
const lines=text.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.length>0);
if(!lines.length){result.textContent='No rows found in the input.';return;}
const rows=lines.map(l=>l.split('\t'));
const csv=toCSV(rows);
renderOutput(csv);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
