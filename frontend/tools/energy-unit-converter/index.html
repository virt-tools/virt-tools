<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Energy Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Energy Unit Converter</h1><p class="subtitle">Convert between all supported energy units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Energy","units":[{"slug":"joules","name":"Joules","symbol":"J","scale":1,"offset":0},{"slug":"kilojoules","name":"Kilojoules","symbol":"kJ","scale":1000,"offset":0},{"slug":"megajoules","name":"Megajoules","symbol":"MJ","scale":1000000.0,"offset":0},{"slug":"watt-hours","name":"Watt-hours","symbol":"Wh","scale":3600,"offset":0},{"slug":"kilowatt-hours","name":"Kilowatt-hours","symbol":"kWh","scale":3600000.0,"offset":0},{"slug":"calories","name":"Thermochemical calories","symbol":"cal","scale":4.184,"offset":0},{"slug":"kilocalories","name":"Kilocalories","symbol":"kcal","scale":4184,"offset":0},{"slug":"btu","name":"British thermal units","symbol":"BTU","scale":1055.05585262,"offset":0},{"slug":"foot-pounds","name":"Foot-pounds","symbol":"ft·lbf","scale":1.3558179483314,"offset":0},{"slug":"electronvolts","name":"Electronvolts","symbol":"eV","scale":1.602176634e-19,"offset":0},{"slug":"therms-us","name":"US therms","symbol":"therm","scale":105480400,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
