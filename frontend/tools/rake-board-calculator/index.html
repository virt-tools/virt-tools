<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Rake Board Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Rake Board Calculator</h1>
<p>Calculate rake board length and material from gable width and roof pitch. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Gable width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-p">Roof pitch</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in/12</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),P=pn(pEl.value);
if(W==null||P==null)return;
if(!isFinite(W)||!isFinite(P)||W<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var half=W/2;
var rise=half*P/12;
var rakedLen=Math.sqrt(half*half+rise*rise);
var total=rakedLen*2*1.1;
var html='<div class="big">'+rnd(total,0)+' ft</div>';
html+=row("Gable width",rnd(W,0)+" ft");
html+=row("Roof pitch",P+"/12");
html+=row("Rake length (one side)",rnd(rakedLen,1)+" ft");
html+=row("Total w/ 10% waste",rnd(total,0)+" ft");
out.innerHTML=html;
}
[wEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
