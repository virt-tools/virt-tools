<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logarithm Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Logarithm Calculator</h1>
<p class="subtitle">Calculate log base 10, natural log, log base N, and antilog.</p>
<div class="input-section">
<label>Value (x)</label>
<input type="number" id="x" value="100" min="0.001" step="any" aria-label="X">
<label>Base (b)</label>
<input type="number" id="base" value="10" min="0.001" step="any" aria-label="Base">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const x=parseFloat(document.getElementById('x').value)||0;
const b=parseFloat(document.getElementById('base').value)||10;
if(x<=0){document.getElementById('result').innerHTML='<p class="warning">Value must be positive.</p>';document.getElementById('result').style.display='block';return;}
const logB=Math.log(x)/Math.log(b);
const log10=Math.log10(x);
const ln=Math.log(x);
const log2=Math.log2(x);
const antilogB=Math.pow(b,x);
const antilog10=Math.pow(10,x);
const exp=Math.exp(x);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>log${b}(${x}):</span><span>${logB.toFixed(8)}</span></div>
<div class="result-row"><span>log₁₀(${x}):</span><span>${log10.toFixed(8)}</span></div>
<div class="result-row"><span>ln(${x}):</span><span>${ln.toFixed(8)}</span></div>
<div class="result-row"><span>log₂(${x}):</span><span>${log2.toFixed(8)}</span></div>
<div class="result-row"><span>${b}^${x} (antilog base ${b}):</span><span>${antilogB.toExponential(6)}</span></div>
<div class="result-row"><span>10^${x} (antilog base 10):</span><span>${antilog10.toExponential(6)}</span></div>
<div class="result-row"><span>e^${x} (exponential):</span><span>${exp.toExponential(6)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
