<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Chimney Flashing Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Chimney Flashing Estimator</h1>
<p>Estimate step and counter flashing material from chimney dimensions and roof slope. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Chimney width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-h">Chimney height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-s">Roof slope</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in/12</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),S=pn(sEl.value);
if(W==null||H==null||S==null)return;
if(!isFinite(W)||!isFinite(H)||!isFinite(S)||W<=0||H<=0||S<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var stepH=4;
var steps=Math.ceil(H/stepH);
var slopeF=Math.sqrt(1+(S/12)*(S/12));
var stepLen=W+12*slopeF;
var stepArea=steps*stepLen*4/144;
var counterArea=(W+12)*4/144;
var total=stepArea+counterArea;
var html='<div class="big">'+rnd(total,2)+' sq ft</div>';
html+=row("Chimney size",rnd(W,0)+"×"+rnd(H,0)+" in");
html+=row("Roof slope",S+" in/12");
html+=row("Step flashing",rnd(stepArea,2)+" sq ft");
html+=row("Counter flashing",rnd(counterArea,2)+" sq ft");
html+=row("Total flashing",rnd(total,2)+" sq ft");
out.innerHTML=html;
}
[wEl,hEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
