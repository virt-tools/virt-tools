<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS CRT Screen Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📺 CSS CRT Screen Generator</h1>
<p>Create CSS retro CRT TV screen effect with scanlines, flicker, and screen curvature. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="RETRO TV" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="crt">CRT</option><option value="vhs">VHS</option><option value="static">Static</option><option value="green">Green Phosphor</option></select></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="20" max="100" step="2" value="50" style="width:200px" aria-label="Fsize"></div>
<div class="ctrl-row"><label>Flicker</label><input type="range" id="flicker" min="0" max="10" step="1" value="3" style="width:200px" aria-label="Flicker"></div>
<div class="ctrl-row"><label>Curvature</label><input type="range" id="curve" min="0" max="20" step="1" value="8" style="width:200px" aria-label="Curve"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#00ff66" aria-label="Color"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var text=document.getElementById('text').value;
var preset=document.getElementById('preset').value;
var fs=parseInt(document.getElementById('fsize').value);
var fl=parseInt(document.getElementById('flicker').value);
var cv=parseInt(document.getElementById('curve').value);
var color=document.getElementById('color').value;
var html='<div class="crt">\n  <div class="crt-screen">\n    <div class="crt-text">'+text+'</div>\n    <div class="crt-scan"></div>\n  </div>\n</div>';
var css='.crt{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}\n';
css+='.crt-screen{position:relative;width:90%;height:80%;background:#0a0a0a;border-radius:'+(cv*2)+'px;overflow:hidden;box-shadow:inset 0 0 '+(cv*5)+'px rgba(0,0,0,0.8)';
if(cv>0)css+=';transform:perspective(800px)';
css+='}\n';
var txtStyle='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:'+fs+'px;font-weight:bold;color:'+color+';text-shadow:0 0 8px '+color+',0 0 16px '+color+';z-index:2;font-family:monospace';
if(preset==='green')txtStyle+=';letter-spacing:.05em';
if(preset==='vhs')txtStyle+=';filter:blur(.5px)';
css+='.crt-text{'+txtStyle+'}\n';
if(fl>0)css+='.crt-text{animation:crt-flicker '+(10/fl)+'s ease-in-out infinite}\n@keyframes crt-flicker{0%,100%{opacity:1}50%{opacity:.92}}\n';
var scanBg='repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,0.3) 2px,rgba(0,0,0,0.3) 4px)';
if(preset==='static')scanBg='repeating-linear-gradient(0deg,transparent 0,transparent 1px,rgba(255,255,255,0.05) 1px,rgba(255,255,255,0.05) 2px)';
css+='.crt-scan{position:absolute;top:0;left:0;width:100%;height:100%;background:'+scanBg+';z-index:3;animation:crt-scroll 8s linear infinite}\n';
css+='@keyframes crt-scroll{from{background-position:0 0}to{background-position:0 100px}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','preset','fsize','flicker','curve','color'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
