<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Neon Flicker Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:3rem 2rem;background:#0a0a12;border-radius:12px;display:flex;justify-content:center;align-items:center;min-height:200px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔆 CSS Neon Flicker Generator</h1>
<p>Create CSS neon sign flicker animation effects. 5 presets, adjustable color/intensity/speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="steady" selected>Steady Flicker</option><option value="broken">Broken Sign</option><option value="warmup">Warm-up</option><option value="storm">Storm</option><option value="club">Club Sign</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="NEON" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#ff00ff" style="width:60px;height:36px" aria-label="Color"></div>
<div class="ctrl-row"><label>Font Size (px)</label><input type="number" id="fontSize" value="60" min="20" max="120" style="width:80px" aria-label="Font Size"></div>
<div class="ctrl-row"><label>Glow Intensity</label><input type="range" id="glow" min="1" max="30" value="10" style="width:150px" aria-label="Glow"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed" aria-label="Speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var text=document.getElementById('text').value;
var color=document.getElementById('color').value;
var fontSize=parseInt(document.getElementById('fontSize').value);
var glow=parseInt(document.getElementById('glow').value);
var speed=document.getElementById('speed').value;
var dur=speed==='slow'?'3s':speed==='fast'?'0.5s':'1.5s';
var html='<div class="neon-sign" style="--neon-color:'+color+';--neon-glow:'+glow+'px;--neon-size:'+fontSize+'px">'+text+'</div>';
var keyframes='';
if(preset==='steady'){
keyframes='@keyframes neon-flicker{0%,100%{opacity:1;text-shadow:0 0 var(--neon-glow) var(--neon-color),0 0 calc(var(--neon-glow)*2) var(--neon-color)}80%{opacity:1}82%{opacity:0.4}84%{opacity:1}}';
}else if(preset==='broken'){
keyframes='@keyframes neon-flicker{0%,100%{opacity:1;text-shadow:0 0 var(--neon-glow) var(--neon-color)}40%{opacity:1}41%{opacity:0}42%{opacity:1}43%{opacity:0}44%{opacity:1}60%{opacity:1}61%{opacity:0.3}62%{opacity:1}}';
}else if(preset==='warmup'){
keyframes='@keyframes neon-flicker{0%{opacity:0;text-shadow:none}10%{opacity:0.3}15%{opacity:0}20%{opacity:0.5}25%{opacity:0}30%{opacity:0.7}35%{opacity:0}40%{opacity:0.9}100%{opacity:1;text-shadow:0 0 var(--neon-glow) var(--neon-color),0 0 calc(var(--neon-glow)*2) var(--neon-color)}}';
}else if(preset==='storm'){
keyframes='@keyframes neon-flicker{0%,100%{opacity:1;text-shadow:0 0 var(--neon-glow) var(--neon-color)}50%{opacity:1}51%{opacity:0.2}52%{opacity:1}53%{opacity:0.5}54%{opacity:1}}';
}else{
keyframes='@keyframes neon-flicker{0%,100%{opacity:1;text-shadow:0 0 var(--neon-glow) var(--neon-color),0 0 calc(var(--neon-glow)*2) var(--neon-color)}30%{opacity:0.8}32%{opacity:0.4}34%{opacity:0.9}70%{opacity:0.7}72%{opacity:0.3}74%{opacity:1}}';
}
var css=':root{--neon-color:'+color+';--neon-glow:'+glow+'px;--neon-size:'+fontSize+'px}\n.neon-sign{font-family:"Arial Black",sans-serif;font-size:var(--neon-size);color:var(--neon-color);text-shadow:0 0 var(--neon-glow) var(--neon-color),0 0 calc(var(--neon-glow)*2) var(--neon-color);animation:neon-flicker '+dur+' infinite alternate}\n'+keyframes;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
var pv=document.getElementById('preview');
pv.innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','text','color','fontSize','glow','speed'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
