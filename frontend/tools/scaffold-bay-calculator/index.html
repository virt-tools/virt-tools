<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Scaffold Bay Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Scaffold Bay Calculator</h1>
<p>Calculate the number of scaffold bays, frames, and planks needed for a wall based on length and height. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Wall length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 80"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-h">Wall height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">feet</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),H=pn(hEl.value);
if(L==null||H==null)return;
if(!isFinite(L)||L<=0||!isFinite(H)||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var bayWidth=8,frameHeight=5;
var bays=Math.ceil(L/bayWidth);
var tiers=Math.ceil(H/frameHeight);
var frames=bays*2*tiers;
var planks=bays*tiers;
var html='<div class="big">'+bays+' bays</div>';
html+=row("Bays",bays);
html+=row("Tiers",tiers);
html+=row("Frames",frames);
html+=row("Planks",planks);
out.innerHTML=html;
}
[lEl,hEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
