<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Humidifier Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Humidifier Size Calculator</h1>
<p>Calculate required humidifier capacity from room volume and desired humidity increase. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Room area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-h">Ceiling height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rh">Humidity increase</label><input type="text" id="in-rh" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var areaEl=document.getElementById("in-area"),hEl=document.getElementById("in-h"),rhEl=document.getElementById("in-rh"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(areaEl.value),H=pn(hEl.value),RH=pn(rhEl.value);
if(A==null||H==null||RH==null)return;
if(!isFinite(A)||!isFinite(H)||!isFinite(RH)||A<=0||H<=0||RH<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vol=A*H;
var dailyNeed=vol*RH*0.00004;
var moistureNeed=dailyNeed/24;
var html='<div class="big">'+rnd(dailyNeed,1)+' gal/day</div>';
html+=row("Room volume",rnd(vol,0)+" cu ft");
html+=row("Moisture per hour",rnd(moistureNeed,2)+" gal/hr");
html+=row("Daily capacity",rnd(dailyNeed,1)+" gal/day");
html+=row("Recommended size",rnd(dailyNeed*1.3,1)+" gal/day (30% safety)");
out.innerHTML=html;
}
[areaEl,hEl,rhEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
