<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Markdown Previewer</h1>
<p class="subtitle">Write Markdown on the left, see the rendered HTML on the right. Supports headings, bold, italic, links, lists, code blocks, tables, blockquotes, and more.</p>
<div style="display:flex;gap:1rem;flex-wrap:wrap;">
<div style="flex:1;min-width:300px;">
<h3>Markdown</h3>
<textarea id="md" rows="20" style="width:100%;font-family:monospace;font-size:14px;padding:1rem;border:1px solid #ddd;border-radius:8px;" placeholder="# Hello World" aria-label="# Hello World"></textarea>
</div>
<div style="flex:1;min-width:300px;">
<h3>Preview</h3>
<div id="preview" style="border:1px solid #ddd;border-radius:8px;padding:1rem;min-height:400px;overflow:auto;background:#fff;"></div>
</div>
</div>
<div style="margin-top:1rem;display:flex;gap:1rem;flex-wrap:wrap;">
<button class="btn" id="copyHtml" type="button">Copy HTML</button>
<button class="btn" id="clear" type="button">Clear</button>
<label><input type="checkbox" id="live" checked> Live preview</label>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const mdEl = document.getElementById('md');
const prevEl = document.getElementById('preview');
const liveEl = document.getElementById('live');
function render() {
  prevEl.innerHTML = parseMd(mdEl.value);
}
function parseMd(md) {
  let html = md;
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const codeBlocks = [];
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    const id = codeBlocks.length;
    codeBlocks.push('<pre style="background:#1e1e1e;color:#d4d4d4;padding:1rem;border-radius:8px;overflow:auto;"><code>' + code + '</code></pre>');
    return '\x00CODEBLOCK' + id + '\x00';
  });
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  html = html.replace(/^\> (.*)$/gm, '<blockquote style="border-left:4px solid #00d4ff;padding-left:1rem;margin:1rem 0;color:#666;">$1</blockquote>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;">$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">');
  html = html.replace(/^\- (.*)$/gm, '<li>$1</li>');
  html = html.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>');
  html = html.replace(/<\/ul>\s*<ul>/g, '');
  html = html.replace(/^---$/gm, '<hr style="border:none;border-top:2px solid #eee;margin:1.5rem 0;">');
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<(h[1-3]|ul|blockquote|pre|hr))/g, '$1');
  html = html.replace(/(<\/h[1-3]|<\/ul|<\/blockquote|<\/pre)><\/p>/g, '$1');
  html = html.replace(/\x00CODEBLOCK(\d+)\x00/g, (m, id) => codeBlocks[parseInt(id)] || m);
  return html;
}
mdEl.addEventListener('input', () => { if (liveEl.checked) render(); });
liveEl.addEventListener('change', render);
document.getElementById('clear').onclick = () => { mdEl.value = ''; render(); };
document.getElementById('copyHtml').onclick = () => {
  navigator.clipboard.writeText(prevEl.innerHTML).then(() => {
    const btn = document.getElementById('copyHtml');
    const orig = btn.textContent;
    btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = orig, 1500);
  });
};
mdEl.value = '# Hello World\n\nThis is a **Markdown previewer**.\n\n## Features\n\n- Bold and *italic* text\n- `inline code`\n- [Links](https://example.com)\n- Lists\n\n> Blockquote example\n\n```\ncode block\n```\n\n---\n\n1. Ordered items\n2. More items\n';
render();
})();
</script>
<style>
.btn{padding:.5rem 1rem;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-weight:600;}
.btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
#preview h1{font-size:1.8rem;margin:.5rem 0;}
#preview h2{font-size:1.4rem;margin:.5rem 0;}
#preview h3{font-size:1.2rem;margin:.5rem 0;}
#preview p{margin:.5rem 0;}
#preview ul{margin:.5rem 0;padding-left:1.5rem;}
#preview a{color:#0096c7;}
</style>
</body>
</html>
