<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpet Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Carpet Calculator</h1>
<p class="subtitle">Estimate carpet squares, padding, and cost for any room.</p>
<div class="input-section">
<label>Room Length (ft)</label>
<input type="number" id="len" value="15" min="0" aria-label="Room length">
<label>Room Width (ft)</label>
<input type="number" id="wid" value="12" min="0" aria-label="Room width">
<label>Carpet Width (ft)</label>
<select id="cwidth" aria-label="Carpet width"><option value="12">12 ft</option><option value="15">15 ft</option></select>
<label>Price per sq yd ($)</label>
<input type="number" id="price" value="20" min="0" step="0.01" aria-label="Price">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const CW=parseFloat(document.getElementById('cwidth').value)||12;
const P=parseFloat(document.getElementById('price').value)||0;
const result=document.getElementById('result');
if(!(L>0)||!(W>0)||P<0){
result.innerHTML='<div class="result-row"><span>Error:</span><span>Room length and width must be positive, and price cannot be negative.</span></div>';
result.style.display='block';
return;
}
const area=L*W;
const sqYards=area/9;
const rollLen=Math.ceil(Math.max(L,W)/CW)*Math.min(L,W);
const rollArea=rollLen*Math.min(L,W);
const cost=sqYards*P;
const padding=Math.ceil(area/9);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Room Area:</span><span>${area.toFixed(1)} sq ft (${sqYards.toFixed(1)} sq yd)</span></div>
<div class="result-row"><span>Carpet Cost:</span><span>$${cost.toFixed(2)}</span></div>
<div class="result-row"><span>Padding Needed:</span><span>${padding} sq yd</span></div>
<div class="result-row"><span>Waste (10%):</span><span>${(area*0.1).toFixed(1)} sq ft</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
