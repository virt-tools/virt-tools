<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Harness Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Harness Size Selector</h1>
<p>Find your fall protection harness size from chest, waist, and thigh measurements. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-c">Chest</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 42"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-w">Waist</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 34"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-t">Thigh</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function size(v){
if(v<34)return"XS";
if(v<38)return"S";
if(v<42)return"M";
if(v<46)return"L";
if(v<50)return"XL";
if(v<54)return"XXL";
return"XXXL";
}
var cEl=document.getElementById("in-c"),wEl=document.getElementById("in-w"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(cEl.value),W=pn(wEl.value),T=pn(tEl.value);
if(C==null||W==null||T==null)return;
if(!isFinite(C)||!isFinite(W)||!isFinite(T)||C<=0||W<=0||T<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var sC=size(C),sW=size(W),sT=size(T);
var order=["XS","S","M","L","XL","XXL","XXXL"];
var idx=Math.max(order.indexOf(sC),order.indexOf(sW),order.indexOf(sT));
var rec=order[idx];
var html='<div class="big">'+rec+'</div>';
html+=row("Chest",rnd(C,0)+' in → '+sC);
html+=row("Waist",rnd(W,0)+' in → '+sW);
html+=row("Thigh",rnd(T,0)+' in → '+sT);
html+=row("Recommended size",rec);
out.innerHTML=html;
}
[cEl,wEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
