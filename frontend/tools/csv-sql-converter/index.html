<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to SQL Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to SQL Converter</h1>
<p class="subtitle">Convert CSV data to SQL INSERT statements. Auto-detects column types and handles escaping. 100% client-side.</p>
<div class="input-section">
<label>Table name</label>
<input id="table" value="my_table" style="margin-bottom:8px" aria-label="Table">
<label>Paste CSV (first row = headers)</label>
<textarea id="input" rows="10" placeholder="id,name,age&#10;1,Alice,30&#10;2,Bob,25" aria-label="Id,Name,Age&#10;1,Alice,30&#10;2,Bob,25"></textarea>
<button id="convert" class="primary-btn" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQuotes=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQuotes){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQuotes=false;}
else{field+=c;}
}else{
if(c==='"'){inQuotes=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function escapeSQL(val){
if(val===''||val===null)return 'NULL';
if(/^-?\d+(\.\d+)?$/.test(val))return val;
return "'"+val.replace(/'/g,"''")+"'";
}
document.getElementById('convert').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
const table=document.getElementById('table').value||'my_table';
const rows=parseCSV(input);
if(rows.length<2){document.getElementById('result').innerHTML='<p style="color:#ff9800">Need at least a header row and one data row.</p>';return;}
const headers=rows[0];
let sql='';
for(let i=1;i<rows.length;i++){
const vals=rows[i].map(escapeSQL);
sql+=`INSERT INTO ${table} (${headers.join(', ')}) VALUES (${vals.join(', ')});\n`;
}
const ta=document.createElement('textarea');ta.value=sql;ta.rows=12;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
