<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Wormhole/Portal Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:400px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🕳️ CSS Wormhole/Portal Generator</h1>
<p>Create CSS animated wormhole/portal tunnel effects with perspective depth. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="tunnel">Tunnel</option><option value="portal">Portal</option><option value="vortex">Vortex</option><option value="hyperspace">Hyperspace</option></select></div>
<div class="ctrl-row"><label>Rings</label><input type="range" id="rings" min="5" max="40" step="1" value="20" style="width:200px"></div>
<div class="ctrl-row"><label>Speed</label><input type="range" id="speed" min="1" max="20" step="1" value="8" style="width:200px"></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="c1" value="#8a2be2"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="c2" value="#00ffff"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#000011"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var rings=parseInt(document.getElementById('rings').value);
var sp=parseFloat(document.getElementById('speed').value);
var c1=document.getElementById('c1').value;
var c2=document.getElementById('c2').value;
var bg=document.getElementById('bgcolor').value;
var html='<div class="wormhole">\n';
for(var i=0;i<rings;i++){
html+='  <div class="ring" style="--i:'+i+'"></div>\n';
}
html+='</div>';
var css='.wormhole{width:100%;height:100%;position:relative;perspective:300px;perspective-origin:center;background:'+bg+';overflow:hidden;transform-style:preserve-3d}\n';
css+='.ring{position:absolute;top:50%;left:50%;width:'+(preset==='portal'?'60%':'80%')+';height:'+(preset==='portal'?'60%':'80%')+';border-radius:50%;border:3px solid '+c1+';transform:translate(-50%,-50%);animation:ring-z '+sp+'s linear infinite;animation-delay:calc(var(--i) * '+(-sp/rings)+'s)}\n';
css+='@keyframes ring-z{0%{transform:translate(-50%,-50%) translateZ(-300px) scale(0.3);opacity:0;border-color:'+c1+'}10%{opacity:1}50%{border-color:'+c2+'}100%{transform:translate(-50%,-50%) translateZ(200px) scale(2);opacity:0;border-color:'+c1+'}}';
if(preset==='vortex')css+='.wormhole{animation:wh-rotate '+(sp*2)+'s linear infinite}\n@keyframes wh-rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}';
if(preset==='hyperspace'){css+='.ring{border-width:1px;animation-duration:'+(sp*0.5)+'s}';}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','rings','speed','c1','c2','bgcolor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
