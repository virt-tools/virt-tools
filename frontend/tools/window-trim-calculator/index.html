<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Window Trim Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Window Trim Calculator</h1>
<p>Calculate window trim linear footage and material from width, height, and number of windows. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Window width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 36"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-h">Window height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-n">Number of windows</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),nEl=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),N=pn(nEl.value);
var idle='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
if(W==null||H==null||N==null){err.textContent="";out.innerHTML=idle;return}
if(!isFinite(W)||!isFinite(H)||!isFinite(N)||W<=0||H<=0||N<=0){err.textContent="Enter valid positive values.";out.innerHTML=idle;return}
err.textContent="";
var perWin=(2*W+2*H)/12;
var total=perWin*N*1.15;
var html='<div class="big">'+rnd(total,0)+' ft</div>';
html+=row("Per window",rnd(perWin,1)+" ft");
html+=row("Windows",rnd(N,0));
html+=row("Total w/ 15% waste",rnd(total,0)+" ft");
out.innerHTML=html;
}
[wEl,hEl,nEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
