<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resistor Color Code Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Resistor Color Code Calculator</h1>
<p class="subtitle">Decode resistor values from color bands or find colors for a target value.</p>
<div class="input-section">
<label>Number of Bands</label>
<select id="bands" aria-label="Bands">
<option value="4">4-Band</option>
<option value="5" selected>5-Band</option>
</select>
<div id="bandSelectors" style="margin:20px 0"></div>
<button id="calc" class="primary-btn" type="button">Calculate Value</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const COLORS=[
{name:'Black',val:0,mult:1,tol:null,color:'#000'},
{name:'Brown',val:1,mult:10,tol:1,color:'#8B4513'},
{name:'Red',val:2,mult:100,tol:2,color:'#FF0000'},
{name:'Orange',val:3,mult:1000,tol:null,color:'#FFA500'},
{name:'Yellow',val:4,mult:10000,tol:null,color:'#FFFF00'},
{name:'Green',val:5,mult:100000,tol:0.5,color:'#008000'},
{name:'Blue',val:6,mult:1000000,tol:0.25,color:'#0000FF'},
{name:'Violet',val:7,mult:10000000,tol:0.1,color:'#8A2BE2'},
{name:'Gray',val:8,mult:100000000,tol:0.05,color:'#808080'},
{name:'White',val:9,mult:1000000000,tol:null,color:'#FFFFFF'},
{name:'Gold',val:-1,mult:0.1,tol:5,color:'#FFD700'},
{name:'Silver',val:-1,mult:0.01,tol:10,color:'#C0C0C0'}
];
function buildSelectors(){
const n=parseInt(document.getElementById('bands').value);
const c=document.getElementById('bandSelectors');
c.innerHTML='';
const labels=n===4?['Band 1','Band 2','Multiplier','Tolerance']:['Band 1','Band 2','Band 3','Multiplier','Tolerance'];
for(let i=0;i<n;i++){
const isTol=i===n-1;
const isMult=i===n-2;
const opts=COLORS.filter(c=>isTol?c.tol!==null:isMult?c.val!==-1||c.mult<1:true);
c.innerHTML+=`<label>${labels[i]}</label><select id="band${i}" aria-label="Band${I}">${opts.map((o,j)=>`<option value="${o.name}">${o.name}</option>`).join('')}</select>`;
}
}
document.addEventListener('DOMContentLoaded',()=>{
buildSelectors();
document.getElementById('bands').addEventListener('change',buildSelectors);
document.getElementById('calc').addEventListener('click',()=>{
const n=parseInt(document.getElementById('bands').value);
const vals=[];
for(let i=0;i<n;i++){
vals.push(document.getElementById('band'+i).value);
}
let digits='';
for(let i=0;i<n-2;i++){digits+=COLORS.find(c=>c.name===vals[i]).val;}
const mult=COLORS.find(c=>c.name===vals[n-2]).mult;
const tol=COLORS.find(c=>c.name===vals[n-1]).tol;
const ohms=parseInt(digits)*mult;
const fmt=ohms>=1e6?(ohms/1e6)+' MΩ':ohms>=1e3?(ohms/1e3)+' kΩ':ohms+' Ω';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Resistance:</span><span>${fmt}</span></div>
<div class="result-row"><span>Tolerance:</span><span>±${tol}%</span></div>
<div class="result-row"><span>Range:</span><span>${(ohms*(1-tol/100)).toFixed(2)} — ${(ohms*(1+tol/100)).toFixed(2)} Ω</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
