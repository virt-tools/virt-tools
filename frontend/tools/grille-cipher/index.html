<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardano Grille Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.gr{max-width:600px;margin:0 auto;padding:2rem 1rem}
.gr h1{font-size:2rem;margin-bottom:.5rem}
.gr .sub{color:#888;margin-bottom:1.5rem}
.gr textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:60px;resize:vertical}
.gr input{width:100px;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.gr .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.gr .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.gr .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.gr label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="gr">
<h1>🔓 Cardano Grille Cipher</h1>
<p class="sub">Transposition cipher using a grid with holes — only cells under the grille openings are read/written.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">MEETATMIDNIGHTBRIDGE</textarea>
<label for="size">Grid size:</label>
<input type="number" id="size" value="4" min="2" max="10" oninput="convert()">
<label for="holes">Number of holes:</label>
<input type="number" id="holes" value="4" min="1" max="20" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Generate Grille</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function convert(){
  const text=document.getElementById('input').value.toUpperCase().replace(/[^A-Z]/g,'');
  const n=parseInt(document.getElementById('size').value)||4;
  const holes=parseInt(document.getElementById('holes').value)||4;
  const grid=[];
  for(let i=0;i<n*n;i++)grid[i]=text[i]||'X';
  const positions=[];
  while(positions.length<Math.min(holes,n*n)){
    const p=Math.floor(Math.random()*n*n);
    if(!positions.includes(p))positions.push(p);
  }
  positions.sort((a,b)=>a-b);
  let result='';
  positions.forEach(p=>{result+=grid[p];});
  let display='Grille positions: '+positions.map(p=>'('+Math.floor(p/n)+','+(p%n)+')').join(' ')+'\n\n';
  display+='Extracted: '+result;
  document.getElementById('output').textContent=display;
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
