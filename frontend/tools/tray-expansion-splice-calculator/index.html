<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tray Expansion Splice Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tray Expansion Splice Calculator</h1>
<p>Calculate thermal expansion, expansion splice count, and gap setting for cable tray runs from temperature range. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-run">Run length</label><input type="text" id="in-run" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-t1">Min temp</label><input type="text" id="in-t1" inputmode="numeric" autocomplete="off" placeholder="e.g. 20"><div class="unit">°F</div></div>
<div class="field"><label class="f" for="in-t2">Max temp</label><input type="text" id="in-t2" inputmode="numeric" autocomplete="off" placeholder="e.g. 120"><div class="unit">°F</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var runEl=document.getElementById("in-run"),t1El=document.getElementById("in-t1"),t2El=document.getElementById("in-t2"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var RUN=parseFloat(runEl.value),T1=parseInt(t1El.value),T2=parseInt(t2El.value);
if(isNaN(RUN)||isNaN(T1)||isNaN(T2))return;
if(RUN<=0||T2<=T1){err.textContent="Run must be positive and max temp must exceed min temp.";return}
err.textContent="";
var deltaT=T2-T1;
var expansion=RUN*deltaT*6.5e-6*12; // steel coefficient, in inches
var spliceSpacing=60; // ft between expansion splices
var spliceCount=Math.floor(RUN/spliceSpacing);
var gapSetting=expansion/(spliceCount||1);
var html='<div class="big">'+Math.round(expansion*100)/100+'"</div>';
html+=row("Temp delta",deltaT+" °F");
html+=row("Total expansion",Math.round(expansion*100)/100+' in');
html+=row("Expansion splices",spliceCount);
html+=row("Gap per splice",Math.round(gapSetting*100)/100+' in');
out.innerHTML=html;
}
[runEl,t1El,t2El].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
