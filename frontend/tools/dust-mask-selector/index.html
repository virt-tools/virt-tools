<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Dust Mask Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Dust Mask Selector</h1>
<p>Choose the right dust mask rating for your task — from light dust to fine particulates and fumes. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-task">Task</label><select id="in-task"><option value="">Select…</option><option value="light">Light household dust</option><option value="sawdust">Sawdust / woodworking</option><option value="drywall">Drywall sanding</option><option value="masonry">Masonry / concrete dust</option><option value="fumes">Paint fumes / VOCs</option><option value="fine">Fine particulates / silica</option></select><div class="unit">task type</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Select a task to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var masks={
light:{rating:"N95 / FFP1",use:"Light dust, non-toxic particles",notes:"Basic filtering, comfortable for short tasks"},
sawdust:{rating:"N95 / FFP2",use:"Woodworking, sawdust",notes:"Filters 95% of particles 0.3µm+"},
drywall:{rating:"N95 / FFP2",use:"Drywall sanding, gypsum dust",notes:"Valved mask recommended for comfort"},
masonry:{rating:"P100 / FFP3",use:"Masonry, concrete dust",notes:"Oil-proof layer, HEPA-level filtration"},
fumes:{rating:"Organic vapor cartridge",use:"Paint fumes, solvents, VOCs",notes:"Use half-face respirator with OV cartridges"},
fine:{rating:"P100 / FFP3 + OV",use:"Silica, fine particulates, fumes",notes:"Half-face or full-face respirator required"}
};
var tEl=document.getElementById("in-task"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var t=tEl.value;
if(!t)return;
err.textContent="";
var m=masks[t];
var html='<div class="big">'+m.rating+'</div>';
html+='<div class="row"><span class="k">Best for</span><span class="v">'+m.use+'</span></div>';
html+='<div class="row"><span class="k">Notes</span><span class="v">'+m.notes+'</span></div>';
out.innerHTML=html;
}
tEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
