<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Tile Calculator</h1>
<p class="subtitle">Estimate how many tiles you need for your floor or wall project.</p>

<div class="input-section">
  <label>Room length (ft)</label>
  <input type="number" id="length" value="12" min="0" step="0.5" aria-label="Length">
  <label>Room width (ft)</label>
  <input type="number" id="width" value="10" min="0" step="0.5" aria-label="Width">
  <label>Tile length (in)</label>
  <input type="number" id="tileL" value="12" min="1" aria-label="Tile L">
  <label>Tile width (in)</label>
  <input type="number" id="tileW" value="12" min="1" aria-label="Tile W">
  <label>Grout gap (in)</label>
  <input type="number" id="grout" value="0.125" min="0" step="0.0625" aria-label="Grout">
  <label>Waste %</label>
  <input type="number" id="waste" value="10" min="0" max="50" aria-label="Waste">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const l = parseFloat(document.getElementById('length').value) || 0;
    const w = parseFloat(document.getElementById('width').value) || 0;
    const tl = (parseFloat(document.getElementById('tileL').value) || 0) / 12;
    const tw = (parseFloat(document.getElementById('tileW').value) || 0) / 12;
    const g = (parseFloat(document.getElementById('grout').value) || 0) / 12;
    const waste = (parseFloat(document.getElementById('waste').value) || 0) / 100;
    const area = l * w;
    const tileArea = (tl + g) * (tw + g);
    const tilesNeeded = Math.ceil(area / tileArea);
    const withWaste = Math.ceil(tilesNeeded * (1 + waste));
    const boxes = Math.ceil(withWaste / 10);
    document.getElementById('bigResult').textContent = `${withWaste} tiles needed`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Room area:</span><span>${area.toFixed(1)} sq ft</span></div>
      <div class="result-row"><span>Tile size:</span><span>${(tl*12).toFixed(1)}" × ${(tw*12).toFixed(1)}" (${(tileArea*144).toFixed(1)} sq in each)</span></div>
      <div class="result-row"><span>Base tiles:</span><span>${tilesNeeded}</span></div>
      <div class="result-row"><span>With ${(waste*100).toFixed(0)}% waste:</span><span>${withWaste}</span></div>
      <div class="result-row"><span>Boxes (10 per):</span><span>${boxes}</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
