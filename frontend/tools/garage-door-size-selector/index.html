<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Garage Door Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Garage Door Size Selector</h1>
<p>Find the right garage door size from opening width and height. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Opening width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 192"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-h">Opening height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 84"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value);
if(W==null||H==null)return;
if(!isFinite(W)||!isFinite(H)||W<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var doorW=W-2,doorH=H-1;
if(doorW<=0||doorH<=0){err.textContent="Opening is too small for a standard door size.";return}
var type=W>=144?"Double car":"Single car";
var html='<div class="big">'+rnd(doorW,0)+'×'+rnd(doorH,0)+' in</div>';
html+=row("Door size",rnd(doorW,0)+'" × '+rnd(doorH,0)+'"');
html+=row("Type",type);
out.innerHTML=html;
}
[wEl,hEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
