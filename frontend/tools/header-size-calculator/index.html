<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Header Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Header Size Calculator</h1>
<p>Estimate required header beam depth for an opening span based on span length and load factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-span">Opening span</label><input type="text" id="in-span" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-load">Load factor</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">multiplier</div></div>
<div class="field"><label class="f" for="in-width">Header width</label><input type="text" id="in-width" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter opening span.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sEl=document.getElementById("in-span"),lEl=document.getElementById("in-load"),wEl=document.getElementById("in-width"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var S=pn(sEl.value),L=pn(lEl.value),W=pn(wEl.value);
if(S==null){return}
L=L==null?1.2:L;W=W==null?50:W;
if(!isFinite(S)||!isFinite(L)||S<=0||L<=0||W<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var depth=S*1000*0.06*L;
var plies=Math.ceil(depth/50);
var totalDepth=plies*50;
var html='<div class="big">'+rnd(totalDepth,0)+' mm</div>';
html+=row("Opening span",rnd(S,2)+" m");
html+=row("Load factor",rnd(L,2));
html+=row("Header width",rnd(W,0)+" mm");
html+=row("Required depth",rnd(depth,0)+" mm");
html+=row("Plies (2×)",rnd(plies,0));
html+=row("Built-up depth",rnd(totalDepth,0)+" mm");
out.innerHTML=html;
}
[sEl,lEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
