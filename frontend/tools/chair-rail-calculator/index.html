<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Chair Rail Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Chair Rail Calculator</h1>
<p>Calculate chair rail height, length needed, and miter cuts for a room perimeter. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cl">Room length</label><input type="text" id="in-cl" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-cw">Room width</label><input type="text" id="in-cw" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-ch">Ceiling height</label><input type="text" id="in-ch" inputmode="decimal" autocomplete="off" placeholder="e.g. 2700"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter room dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var clEl=document.getElementById("in-cl"),cwEl=document.getElementById("in-cw"),chEl=document.getElementById("in-ch"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CL=pn(clEl.value),CW=pn(cwEl.value),CH=pn(chEl.value);
if(CL==null||CW==null){return}
CH=CH==null?2700:CH;
if(!isFinite(CL)||!isFinite(CW)||!isFinite(CH)||CL<=0||CW<=0||CH<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var perim=2*(CL+CW);
var railHeight=Math.round(CH/3);
var waste=Math.ceil(perim*0.1);
var total=perim+waste;
var lf=total/304.8;
var html='<div class="big">'+rnd(lf,1)+' ft</div>';
html+=row("Perimeter",rnd(perim,0)+" mm");
html+=row("Recommended rail height",rnd(railHeight,0)+" mm");
html+=row("10% waste",rnd(waste,0)+" mm");
html+=row("Total to buy",rnd(total,0)+" mm");
html+=row("Linear feet",rnd(lf,1)+" ft");
out.innerHTML=html;
}
[clEl,cwEl,chEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
