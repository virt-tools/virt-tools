<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Load Tap Changer Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Load Tap Changer Selector</h1>
<p>Select load tap changer tap range, step size, and current rating from transformer rating and voltage regulation needs. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-mva">Transformer rating</label><input type="text" id="in-mva" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">MVA</div></div>
<div class="field"><label class="f" for="in-volt">Secondary voltage</label><input type="text" id="in-volt" inputmode="decimal" autocomplete="off" placeholder="e.g. 13800"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-reg">Regulation range</label><input type="text" id="in-reg" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var mE=document.getElementById("in-mva"),vE=document.getElementById("in-volt"),rE=document.getElementById("in-reg"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var m=parseFloat(mE.value),v=parseFloat(vE.value),r=parseFloat(rE.value);
if(isNaN(m)||isNaN(v)||isNaN(r))return;
if(m<=0||v<=0||r<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var current=m*1e6/(Math.sqrt(3)*v);
var steps=32;
var stepSize=r/steps*2;
var html='<div class="big">'+(Math.round(current))+' A</div>';
html+=row("LTC current rating",Math.round(current)+' A');
html+=row("Tap range","±"+r+"%");
html+=row("Step size",Math.round(stepSize*100)/100+"%");
out.innerHTML=html;
}
[mE,vE,rE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
