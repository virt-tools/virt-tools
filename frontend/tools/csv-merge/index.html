<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Merger — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Merger</h1>
<p class="subtitle">Merge multiple CSV files into one. Combines rows from all inputs with unified headers.</p>
<div class="input-section">
<label>CSV 1 (with headers)</label>
<textarea id="csv1" rows="5" placeholder="name,age&#10;Alice,30" aria-label="Name,Age&#10;Alice,30"></textarea>
<label>CSV 2 (with headers)</label>
<textarea id="csv2" rows="5" placeholder="name,age&#10;Bob,25" aria-label="Name,Age&#10;Bob,25"></textarea>
<label>CSV 3 (optional)</label>
<textarea id="csv3" rows="5" placeholder="" aria-label="Csv3"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Merge</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value,rowCount){const result=document.getElementById('result'),summary=document.createElement('p'),output=document.createElement('textarea'),copy=document.createElement('button');summary.textContent='Merged '+rowCount+' rows ('+Math.max(0,rowCount-1)+' data rows).';output.rows=8;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label','Merged CSV output');output.value=value;copy.type='button';copy.textContent='Copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));result.replaceChildren(summary,output,copy);}
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
document.getElementById('run').addEventListener('click',()=>{
const inputs=['csv1','csv2','csv3'].map(id=>document.getElementById(id).value).filter(t=>t.trim());
if(inputs.length<2){return;}
const allRows=[];let header=null;
inputs.forEach(text=>{
const rows=parseCSV(text);
if(!rows.length)return;
if(!header){header=rows[0];allRows.push(rows[0]);}
allRows.push(...rows.slice(1));
});
renderOutput(toCSV(allRows),allRows.length);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
