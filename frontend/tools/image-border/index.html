<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Border Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Border Generator</h1>
<p class="subtitle">Add borders to images with adjustable width, color, and radius. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Width: <input type="number" id="bw" value="20" min="0" max="200" style="width:60px">px</label>
<label>Color: <input type="color" id="bc" value="#333333"></label>
<label>Radius: <input type="number" id="br" value="0" min="0" max="100" style="width:60px">px</label>
<button onclick="render()" type="button">Apply</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){img=new Image();img.src=URL.createObjectURL(this.files[0]);img.onload=render;});
function render(){
if(!img)return;var bw=parseInt(document.getElementById('bw').value),br=parseInt(document.getElementById('br').value);
var cv=document.getElementById('canvas');cv.width=img.naturalWidth+bw*2;cv.height=img.naturalHeight+bw*2;
var ctx=cv.getContext('2d');
ctx.fillStyle=document.getElementById('bc').value;
if(br>0){ctx.beginPath();ctx.roundRect(0,0,cv.width,cv.height,br);ctx.fill();}
else{ctx.fillRect(0,0,cv.width,cv.height);}
ctx.save();ctx.beginPath();if(br>0){ctx.roundRect(bw,bw,img.naturalWidth,img.naturalHeight,Math.max(0,br-bw));}else{ctx.rect(bw,bw,img.naturalWidth,img.naturalHeight);}ctx.clip();ctx.drawImage(img,bw,bw);ctx.restore();
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='bordered.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
