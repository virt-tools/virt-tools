<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drywall Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Drywall Calculator</h1>
<p class="subtitle">Estimate drywall sheets, screws, mud, and tape for any room.</p>
<div class="input-section">
<label>Room Length (ft)</label>
<input type="number" id="len" value="12" min="0" aria-label="Len">
<label>Room Width (ft)</label>
<input type="number" id="wid" value="10" min="0" aria-label="Wid">
<label>Wall Height (ft)</label>
<input type="number" id="hei" value="8" min="0" aria-label="Hei">
<label>Number of Doors</label>
<input type="number" id="doors" value="1" min="0" aria-label="Doors">
<label>Number of Windows</label>
<input type="number" id="windows" value="2" min="0" aria-label="Windows">
<label>Include Ceiling?</label>
<select id="ceil" aria-label="Ceil"><option value="1">Yes</option><option value="0">No</option></select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const H=parseFloat(document.getElementById('hei').value)||0;
const D=parseInt(document.getElementById('doors').value)||0;
const WN=parseInt(document.getElementById('windows').value)||0;
const C=parseInt(document.getElementById('ceil').value);
const wallArea=2*(L+W)*H;
const ceilingArea=C?L*W:0;
const doorArea=D*21;
const windowArea=WN*15;
const total=wallArea+ceilingArea-doorArea-windowArea;
const sheetArea=4*8;
const sheets=Math.ceil(total/sheetArea);
const screws=Math.ceil(total*12);
const mud=Math.ceil(total/100);
const tape=Math.ceil(total*1.25);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Total Area:</span><span>${total.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>Drywall Sheets (4×8):</span><span>${sheets}</span></div>
<div class="result-row"><span>Screws:</span><span>~${screws}</span></div>
<div class="result-row"><span>Joint Compound (gal):</span><span>~${mud}</span></div>
<div class="result-row"><span>Tape (ft):</span><span>~${tape}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
