<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinds Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Blinds & Shades Calculator</h1>
<p class="subtitle">Calculate blinds dimensions, slat count, and cost for your windows.</p>
<div class="input-section">
<label>Window Width (inches)</label>
<input type="number" id="winW" value="36" min="1" step="0.125" aria-label="Win W">
<label>Window Height (inches)</label>
<input type="number" id="winH" value="60" min="1" step="0.125" aria-label="Win H">
<label>Mount Type</label>
<select id="mount" aria-label="Mount">
<option value="inside">Inside Mount</option>
<option value="outside">Outside Mount</option>
</select>
<label>Deduction (inches, per side)</label>
<input type="number" id="deduct" value="0.25" min="0" max="1" step="0.0625" aria-label="Deduct">
<label>Slat Size (inches)</label>
<select id="slat" aria-label="Slat">
<option value="1">1" Mini</option>
<option value="2" selected>2" Standard</option>
<option value="2.5">2.5" Large</option>
</select>
<label>Price per sq ft ($)</label>
<input type="number" id="price" value="8" min="0" step="0.5" aria-label="Price">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const wW=parseFloat(document.getElementById('winW').value)||0;
const wH=parseFloat(document.getElementById('winH').value)||0;
const mount=document.getElementById('mount').value;
const d=parseFloat(document.getElementById('deduct').value)||0;
const slat=parseFloat(document.getElementById('slat').value);
const price=parseFloat(document.getElementById('price').value)||0;
let blindW,blindH;
if(mount==='inside'){blindW=wW-d*2;blindH=wH-d;}
else{blindW=wW+4;blindH=wH+4;}
const area=(blindW*blindH)/144;
const slatCount=Math.floor(blindH/(slat));
const cost=area*price;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Mount Type:</span><span>${mount==='inside'?'Inside':'Outside'}</span></div>
<div class="result-row"><span>Blind Width:</span><span>${blindW.toFixed(2)}"</span></div>
<div class="result-row"><span>Blind Height:</span><span>${blindH.toFixed(2)}"</span></div>
<div class="result-row"><span>Slat Size:</span><span>${slat}"</span></div>
<div class="result-row"><span>Approximate Slat Count:</span><span>${slatCount} slats</span></div>
<div class="result-row"><span>Area:</span><span>${area.toFixed(2)} sq ft</span></div>
<div class="result-row"><span>Estimated Cost:</span><span>$${cost.toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
