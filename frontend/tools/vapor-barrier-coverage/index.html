<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Vapor Barrier Coverage — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Vapor Barrier Coverage</h1>
<p>Calculate the number of vapor barrier rolls needed from floor/wall area and roll dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Area to cover</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-rw">Roll width</label><input type="text" id="in-rw" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-rl">Roll length</label><input type="text" id="in-rl" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-ol">Overlap %</label><input type="text" id="in-ol" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% overlap</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter area and roll size.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),rwEl=document.getElementById("in-rw"),rlEl=document.getElementById("in-rl"),olEl=document.getElementById("in-ol"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),RW=pn(rwEl.value),RL=pn(rlEl.value),OL=pn(olEl.value);
if(A==null||RW==null||RL==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter area and roll size.</span>';return}
if(!isFinite(A)||!isFinite(RW)||!isFinite(RL)||A<=0||RW<=0||RL<=0){err.textContent="All values must be positive.";return}
OL=OL==null?10:OL;
if(!isFinite(OL)||OL<0){err.textContent="Overlap must be non-negative.";return}
if(OL>=100){err.textContent="Overlap must be less than 100%.";return}
err.textContent="";
var rollArea=RW*RL;
var effArea=rollArea*(1-OL/100);
var rolls=Math.ceil(A/effArea);
var totalArea=rolls*rollArea;
var html='<div class="big">'+rolls+' rolls</div>';
html+=row("Area to cover",rnd(A,1)+" m²");
html+=row("Roll size",rnd(RW,1)+" × "+rnd(RL,1)+" m");
html+=row("Effective area/roll",rnd(effArea,1)+" m²");
html+=row("Rolls needed (with "+rnd(OL,0)+"% overlap)",rolls);
html+=row("Total material",rnd(totalArea,1)+" m²");
out.innerHTML=html;
}
[aEl,rwEl,rlEl,olEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
