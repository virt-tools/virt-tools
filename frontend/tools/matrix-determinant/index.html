<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Determinant Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Matrix Determinant Calculator</h1>
<p class="subtitle">Calculate the determinant of 2×2, 3×3, and 4×4 matrices.</p>
<div class="input-section">
<label>Matrix Size</label>
<select id="size" aria-label="Size">
<option value="2" selected>2×2</option>
<option value="3">3×3</option>
<option value="4">4×4</option>
</select>
<div id="grid" style="margin:15px 0"></div>
<button id="calc" class="primary-btn" type="button">Calculate Determinant</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function buildGrid(){
const n=parseInt(document.getElementById('size').value);
const g=document.getElementById('grid');
g.innerHTML='';
for(let i=0;i<n;i++){
let row='<div style="display:flex;gap:5px;margin:3px 0">';
for(let j=0;j<n;j++){
const v=i===j?1:0;
row+=`<input type="number" id="m${i}${j}" value="${v}" style="width:50px" step="any" aria-label="M${I}${J}">`;
}
row+='</div>';
g.innerHTML+=row;
}
}
function getMatrix(){
const n=parseInt(document.getElementById('size').value);
let m=[];
for(let i=0;i<n;i++){let row=[];for(let j=0;j<n;j++)row.push(parseFloat(document.getElementById('m'+i+j).value)||0);m.push(row);}
return m;
}
function det(m){
const n=m.length;
if(n===1)return m[0][0];
if(n===2)return m[0][0]*m[1][1]-m[0][1]*m[1][0];
let d=0;
for(let j=0;j<n;j++){
let sub=[];
for(let i=1;i<n;i++){let row=[];for(let k=0;k<n;k++)if(k!==j)row.push(m[i][k]);sub.push(row);}
d+=(j%2===0?1:-1)*m[0][j]*det(sub);
}
return d;
}
document.addEventListener('DOMContentLoaded',()=>{
buildGrid();
document.getElementById('size').addEventListener('change',buildGrid);
document.getElementById('calc').addEventListener('click',()=>{
const m=getMatrix();
const d=det(m);
document.getElementById('result').innerHTML=`<div class="result-row"><span>Matrix Size:</span><span>${m.length}×${m.length}</span></div><div class="result-row"><span>Determinant:</span><span>${d.toFixed(6)}</span></div>${d===0?'<p class="hint">Singular matrix (non-invertible)</p>':'<p class="hint">Non-singular matrix (invertible)</p>'}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
