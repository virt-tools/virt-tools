<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Refraction Seismic Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Refraction Seismic Calculator</h1>
<p>Calculate layer velocity and critical angle from seismic refraction first-arrival slope and intercept time. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-x1">Distance 1</label><input type="text" id="in-x1" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-t1">Time 1</label><input type="text" id="in-t1" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ms</div></div>
<div class="field"><label class="f" for="in-x2">Distance 2</label><input type="text" id="in-x2" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-t2">Time 2</label><input type="text" id="in-t2" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ms</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var x1E=document.getElementById("in-x1"),t1E=document.getElementById("in-t1"),x2E=document.getElementById("in-x2"),t2E=document.getElementById("in-t2"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var x1=parseFloat(x1E.value),t1=parseFloat(t1E.value),x2=parseFloat(x2E.value),t2=parseFloat(t2E.value);
if(isNaN(x1)||isNaN(t1)||isNaN(x2)||isNaN(t2))return;
var dx=x2-x1,dt=t2-t1;
if(dx<=0||dt<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var v2=dx/(dt/1000);
var intercept=t1-(dt/dx)*x1;
var depth=intercept/2*Math.sqrt(1/(1000/v2*1000/v2)-1/(v2*v2));
var html='<div class="big">'+Math.round(v2)+' m/s</div>';
html+=row("Layer 2 velocity V2",Math.round(v2)+' m/s');
html+=row("Intercept time",Math.round(intercept*100)/100+' ms');
out.innerHTML=html;
}
[x1E,t1E,x2E,t2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
