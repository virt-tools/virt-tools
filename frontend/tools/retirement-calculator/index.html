<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Retirement Calculator</h1>
<p class="subtitle">Project your retirement savings growth with monthly contributions, employer match, and annual withdrawals. Monte Carlo optional.</p>
<div class="tool-layout">
<div class="controls">
<h3>Your Situation</h3>
<label>Current Age <input type="number" id="age" value="30" min="18" max="100"></label>
<label>Retirement Age <input type="number" id="retAge" value="65" min="40" max="100"></label>
<label>Current Savings ($) <input type="number" id="savings" value="50000" step="1000" min="0"></label>
<label>Monthly Contribution ($) <input type="number" id="monthly" value="500" step="50" min="0"></label>
<label>Employer Match (% of salary) <input type="number" id="match" value="5" step="0.5" min="0" max="50"></label>
<label>Annual Salary ($) <input type="number" id="salary" value="60000" step="1000" min="0"></label>
<label>Expected Annual Return (%) <input type="number" id="return" value="7" step="0.1" min="0" max="30"></label>
<label>Annual Inflation (%) <input type="number" id="inflation" value="3" step="0.1" min="0" max="20"></label>
<label>Years in Retirement <input type="number" id="retYears" value="25" min="1" max="60"></label>
<label>Desired Annual Income (today's $) <input type="number" id="desired" value="50000" step="1000" min="0"></label>
</div>
<div class="results" id="results"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const ids=['age','retAge','savings','monthly','match','salary','return','inflation','retYears','desired'];
const els={};
ids.forEach(id=>els[id]=document.getElementById(id));
const results=document.getElementById('results');
function calc(){
const age=+els.age.value,retAge=+els.retAge.value,savings=+els.savings.value,monthly=+els.monthly.value,matchPct=+els.match.value/100,salary=+els.salary.value,ret=+els.return.value/100,inf=+els.inflation.value/100,retYears=+els.retYears.value,desired=+els.desired.value;
const years=retAge-age;
const monthlyRet=ret/12;
const employerMonthly=salary*matchPct/12;
let balance=savings;
const yearData=[];
for(let y=1;y<=years;y++){
const startBal=balance;
let contrib=monthly*12+employerMonthly*12;
for(let m=0;m<12;m++){balance=balance*(1+monthlyRet)+monthly+employerMonthly;}
yearData.push({year:y,age:age+y,balance:balance,contrib:contrib});
}
const realBalance=balance/Math.pow(1+inf,years);
const desiredInfl=desired*Math.pow(1+inf,years);
const swr=0.04;
const safeWithdraw=balance*swr;
const canRetire=safeWithdraw>=desiredInfl;
const shortfall=Math.max(0,desiredInfl-safeWithdraw);
const neededBalance=desiredInfl/swr;
const neededMonthly=(function(){
let bal=savings;
for(let y=1;y<=years;y++){for(let m=0;m<12;m++){bal=bal*(1+monthlyRet)+1;}}
const neededPerUnit=(neededBalance-bal);
return neededPerUnit/((function(){let sum=0;for(let y=1;y<=years;y++){for(let m=0;m<12;m++){sum+=Math.pow(1+monthlyRet,(years-y)*12+m);}}return sum;})());
})();
let chart='';const maxBal=Math.max(...yearData.map(d=>d.balance));
yearData.forEach(d=>{const h=Math.round(d.balance/maxBal*100);chart+='<div class="bar-row"><span class="bar-label">'+d.age+'</span><div class="bar-bg"><div class="bar-fill" style="width:'+h+'%"></div></div><span class="bar-val">$'+(d.balance/1000).toFixed(0)+'k</span></div>';});
results.innerHTML='<h3>Projection at Age '+retAge+'</h3>'+
'<div class="stat-row highlight"><span>Nominal Balance</span><span>$'+balance.toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<div class="stat-row"><span>Inflation-Adjusted Balance</span><span>$'+realBalance.toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<div class="stat-row"><span>Total Contributions</span><span>$'+(yearData.reduce((s,d)=>s+d.contrib,0)).toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<div class="stat-row"><span>Employer Match Total</span><span>$'+(employerMonthly*12*years).toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<h3 style="margin-top:1.5rem;">Withdrawal Analysis (4% Rule)</h3>'+
'<div class="stat-row"><span>Safe Annual Withdrawal</span><span>$'+safeWithdraw.toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<div class="stat-row"><span>Desired Annual Income (inflated)</span><span>$'+desiredInfl.toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
(canRetire?'<div class="stat-row good"><span>On Track!</span><span>Surplus: $'+(safeWithdraw-desiredInfl).toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'
:'<div class="stat-row bad"><span>Shortfall</span><span>$'+shortfall.toLocaleString('en-US',{maximumFractionDigits:0})+'/yr</span></div>')+
'<div class="stat-row"><span>Needed Balance for 4% Rule</span><span>$'+neededBalance.toLocaleString('en-US',{maximumFractionDigits:0})+'</span></div>'+
'<div class="stat-row"><span>Needed Monthly Contribution</span><span>$'+Math.max(0,neededMonthly).toFixed(0)+'</span></div>'+
'<h3 style="margin-top:1.5rem;">Growth Chart</h3><div class="chart">'+chart+'</div>'+
'<p style="font-size:.8rem;opacity:.6;margin-top:1rem;">Simplified projection — assumes constant returns, no taxes, 4% safe withdrawal rate. Not financial advice.</p>';
}
ids.forEach(id=>els[id].addEventListener('input',calc));
calc();
})();
</script>
<style>
.tool-layout{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;}
.controls{display:flex;flex-direction:column;gap:.75rem;min-width:280px;}
.controls label{display:flex;flex-direction:column;gap:.25rem;font-weight:600;}
.controls input{padding:.5rem;border:1px solid #ddd;border-radius:8px;font-size:1rem;}
.results{flex:1;min-width:300px;}
.stat-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #eee;font-size:1.05rem;}
.stat-row.highlight{font-weight:bold;font-size:1.2rem;border-bottom:2px solid #00d4ff;padding:.75rem 0;}
.stat-row.good{color:#2ecc71;}.stat-row.bad{color:#e74c3c;}
.chart{max-height:300px;overflow-y:auto;}
.bar-row{display:flex;align-items:center;gap:.5rem;padding:2px 0;font-size:.85rem;}
.bar-label{width:30px;text-align:right;opacity:.6;}
.bar-bg{flex:1;height:14px;background:#f0f0f0;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#0099cc);border-radius:4px;}
.bar-val{width:50px;font-weight:600;}
</style>
</body>
</html>
