<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Electric charge Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Electric charge Unit Converter</h1><p class="subtitle">Convert between all supported electric charge units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Electric charge","units":[{"slug":"coulombs","name":"Coulombs","symbol":"C","scale":1,"offset":0},{"slug":"millicoulombs","name":"Millicoulombs","symbol":"mC","scale":0.001,"offset":0},{"slug":"microcoulombs","name":"Microcoulombs","symbol":"µC","scale":1e-06,"offset":0},{"slug":"nanocoulombs","name":"Nanocoulombs","symbol":"nC","scale":1e-09,"offset":0},{"slug":"ampere-hours","name":"Ampere-hours","symbol":"Ah","scale":3600,"offset":0},{"slug":"milliampere-hours","name":"Milliampere-hours","symbol":"mAh","scale":3.6,"offset":0},{"slug":"elementary-charges","name":"Elementary charges","symbol":"e","scale":1.602176634e-19,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
