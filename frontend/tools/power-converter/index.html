<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Power Converter</h1>
<p class="subtitle">Convert between watts, horsepower, BTU/hr, tons, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Watt (W)</option>
<option value="1000">Kilowatt (kW)</option>
<option value="1000000">Megawatt (MW)</option>
<option value="745.699872">Horsepower (hp, mechanical)</option>
<option value="735.49875">Horsepower (metric)</option>
<option value="745.43">Boiler Horsepower</option>
<option value="1055.05585">BTU/hr</option>
<option value="3516.853">Ton of Refrigeration</option>
<option value="0.01">Erg/s</option>
<option value="0.29307107">BTU/hr (IT)</option>
<option value="0.0041868">Calorie/s</option>
<option value="4184">Calorie/min</option>
<option value="1.355817959">ft·lbf/s</option>
<option value="1.34102209e-7">hp (electric)</option>
<option value="3.6e6">Joule/hour</option>
<option value="1e-7">Microwatt (µW)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Watt (W)',1],['Kilowatt (kW)',1000],['Megawatt (MW)',1e6],['Horsepower (mech)',745.699872],['Horsepower (metric)',735.49875],['BTU/hr',1055.05585],['Ton of Refrigeration',3516.853],['Calorie/s',4.184],['Calorie/min',69.733],['ft·lbf/s',1.355817959],['Erg/s',1e-7],['Microwatt (µW)',1e-6],['Milliwatt (mW)',0.001],['Boiler HP',9809.5],['Gigawatt (GW)',1e9]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const w=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=w/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
