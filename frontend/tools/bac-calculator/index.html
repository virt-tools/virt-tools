<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAC Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>BAC Calculator</h1>
<p class="subtitle">Estimate Blood Alcohol Concentration (for educational purposes only — not a sobriety test).</p>

<div class="input-section">
  <label>Gender</label>
  <select id="gender" aria-label="Gender"><option value="0.68">Male</option><option value="0.55">Female</option></select>

  <label>Body weight</label>
  <div style="display:flex;gap:8px;">
    <input type="number" id="weight" value="70" step="0.5" style="flex:1;" aria-label="Weight">
    <select id="unit" aria-label="Unit"><option value="kg">kg</option><option value="lb">lb</option></select>
  </div>

  <label>Number of drinks</label>
  <input type="number" id="drinks" value="2" step="1" min="0" aria-label="Drinks">

  <label>ABV %</label>
  <input type="number" id="abv" value="5" step="0.1" min="0" aria-label="Abv">

  <label>Ounces per drink</label>
  <input type="number" id="ounces" value="12" step="0.5" min="0" aria-label="Ounces">

  <label>Hours drinking</label>
  <input type="number" id="hours" value="1" step="0.5" min="0" aria-label="Hours">

  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bac"></div>
  <div class="result-row"><span>Status:</span><span id="status"></span></div>
  <div class="result-row"><span>Alcohol consumed:</span><span id="alcohol"></span></div>
  <div class="result-row"><span>Time to sober (est.):</span><span id="sober"></span></div>
</div>

<style>
.big-result { font-size:2em; font-weight:bold; color:var(--accent); text-align:center; padding:12px; }
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.warning { color:#e74c3c; font-style:italic; text-align:center; padding:8px; }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const r = parseFloat(document.getElementById('gender').value);
    let weight = parseFloat(document.getElementById('weight').value) || 0;
    const unit = document.getElementById('unit').value;
    const drinks = parseFloat(document.getElementById('drinks').value) || 0;
    const abv = parseFloat(document.getElementById('abv').value) || 0;
    const oz = parseFloat(document.getElementById('ounces').value) || 0;
    const hours = parseFloat(document.getElementById('hours').value) || 0;

    if (unit === 'lb') weight = weight * 0.453592;
    if (weight <= 0) return;

    const totalOz = drinks * oz * (abv / 100);
    const totalAlcoholGrams = totalOz * 23.36;
    const bodyWater = weight * 1000 * r;
    const bacGramsPerMl = totalAlcoholGrams / bodyWater;
    const bac = (bacGramsPerMl * 100) - (hours * 0.015);

    const finalBac = Math.max(0, bac);
    document.getElementById('bac').textContent = finalBac.toFixed(3) + '%';
    document.getElementById('alcohol').textContent = totalAlcoholGrams.toFixed(1) + ' g';

    let status;
    if (finalBac < 0.02) status = 'Likely unimpaired';
    else if (finalBac < 0.05) status = 'Mild impairment';
    else if (finalBac < 0.08) status = 'Moderate — do not drive';
    else if (finalBac < 0.15) status = 'Significant — danger';
    else status = 'Severe — medical risk';
    document.getElementById('status').textContent = status;

    const hoursToSober = finalBac / 0.015;
    const h = Math.floor(hoursToSober);
    const m = Math.round((hoursToSober - h) * 60);
    document.getElementById('sober').textContent = finalBac <= 0 ? 'Sober now' : `${h}h ${m}m`;

    document.getElementById('result').style.display = 'block';
  });
});
</script>
<p class="warning">⚠️ For educational purposes only. Never use to decide whether you can drive.</p>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
