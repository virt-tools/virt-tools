<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Seed Spread Rate Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Seed Spread Rate Calculator</h1>
<p>Calculate total seed needed from spread rate per 1000 sq ft, lawn area, and spreader passes. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Rate per 1000 sq ft</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-area">Lawn area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-pass">Passes</label><input type="text" id="in-pass" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">passes</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rateEl=document.getElementById("in-rate"),areaEl=document.getElementById("in-area"),passEl=document.getElementById("in-pass"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Rate=pn(rateEl.value),Area=pn(areaEl.value),Pass=pn(passEl.value);
if(Rate==null||Area==null||Pass==null)return;
if(!isFinite(Rate)||!isFinite(Area)||!isFinite(Pass)||Rate<=0||Area<=0||Pass<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var perPass=Rate*Area/1000;
var total=perPass*Pass;
var html='<div class="big">'+rnd(total,1)+' lb</div>';
html+=row("Rate",rnd(Rate,1)+' lb / 1000 sq ft');
html+=row("Per pass",rnd(perPass,1)+' lb');
html+=row("Passes",rnd(Pass,0));
html+=row("Total seed",rnd(total,1)+' lb');
out.innerHTML=html;
}
[rateEl,areaEl,passEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
