<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mono to Stereo Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Mono to Stereo Converter</h1>
<p class="subtitle">Convert mono audio to stereo with adjustable stereo width. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="process" class="primary-btn" type="button">Convert & Download</button>
</div>
<div class="controls">
<label>Stereo Width: <input type="range" id="width" min="0" max="1" value="0.5" step="0.05"><span id="wv">0.5</span></label>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const el=document.getElementById('width');
const sp=document.getElementById('wv');
el.addEventListener('input',()=>sp.textContent=el.value);
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const sr=buf.sampleRate;
const ch=buf.getChannelData(0);
const width=parseFloat(document.getElementById('width').value);
const off=new OfflineAudioContext(2,ch.length,sr);
const nb=off.createBuffer(2,ch.length,sr);
const left=nb.getChannelData(0);
const right=nb.getChannelData(1);
for(let i=0;i<ch.length;i++){
const mono=ch[i];
const diff=(Math.sin(i*0.001)*width)*mono*0.3;
left[i]=mono+diff;
right[i]=mono-diff;
}
const src=off.createBufferSource();src.buffer=nb;
src.connect(off.destination);src.start();
const rendered=await off.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stereo.wav';a.click();
st.textContent='Done! Downloaded as stereo.wav';
audioCtx.close();
});
function audioBufferToWav(b){
const n=b.length,sr=b.sampleRate,nc=b.numberOfChannels;
const data=[];
for(let c=0;c<nc;c++)data.push(b.getChannelData(c));
const buf=new ArrayBuffer(44+n*nc*2);
const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*nc*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*nc*2,true);v.setUint16(32,nc*2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*nc*2,true);
for(let i=0;i<n;i++)for(let c=0;c<nc;c++)v.setInt16(44+(i*nc+c)*2,Math.max(-32768,Math.min(32767,data[c][i]*32767)),true);
return buf;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
