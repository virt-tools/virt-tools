<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roof Pitch Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Roof Pitch Calculator</h1>
<p class="subtitle">Calculate roof pitch, angle, and actual roof area from horizontal measurements.</p>
<div class="input-section">
<label>Rise (inches)</label>
<input type="number" id="rise" value="6" min="0" step="0.125" aria-label="Rise">
<label>Run (inches)</label>
<input type="number" id="run" value="12" min="1" step="0.125" aria-label="Run">
<label>Building Width (feet)</label>
<input type="number" id="width" value="40" min="1" aria-label="Width">
<label>Building Length (feet)</label>
<input type="number" id="length" value="60" min="1" aria-label="Length">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const r=parseFloat(document.getElementById('rise').value)||0;
const u=parseFloat(document.getElementById('run').value)||12;
const w=parseFloat(document.getElementById('width').value)||0;
const l=parseFloat(document.getElementById('length').value)||0;
const ratio=r/u;
const angle=Math.atan(ratio)*180/Math.PI;
const pitchStr=`${r}:${u}`;
const slope=Math.sqrt(1+ratio*ratio);
const halfWidth=w/2;
const rafterLen=halfWidth*slope;
const roofArea=2*rafterLen*l;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Pitch Ratio:</span><span>${pitchStr}</span></div>
<div class="result-row"><span>Angle:</span><span>${angle.toFixed(2)}°</span></div>
<div class="result-row"><span>Slope Factor:</span><span>${slope.toFixed(4)}</span></div>
<div class="result-row"><span>Rafter Length (one side):</span><span>${rafterLen.toFixed(2)} ft</span></div>
<div class="result-row"><span>Total Roof Area:</span><span>${roofArea.toFixed(0)} sq ft</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
