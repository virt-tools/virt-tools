<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Beautifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>SQL Beautifier</h1>
<p class="subtitle">Format SQL queries with proper indentation, keyword uppercasing, and readable spacing.</p>
<div class="input-section">
<label>SQL Input</label>
<textarea id="input" rows="10" placeholder="select * from users where id = 1 order by name" aria-label="Select * From Users Where Id = 1 Order By Name"></textarea>
<button id="format" class="primary-btn" type="button">Format</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const keywords=['SELECT','FROM','WHERE','AND','OR','ORDER BY','GROUP BY','HAVING','INSERT INTO','VALUES','UPDATE','SET','DELETE','CREATE TABLE','ALTER TABLE','DROP TABLE','JOIN','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN','ON','UNION','UNION ALL','LIMIT','OFFSET','DISTINCT','AS','IN','NOT IN','LIKE','BETWEEN','IS NULL','IS NOT NULL','CASE','WHEN','THEN','ELSE','END','COUNT','SUM','AVG','MIN','MAX'];
document.getElementById('format').addEventListener('click',()=>{
let sql=document.getElementById('input').value.trim();
if(!sql){return;}
keywords.forEach(kw=>{const re=new RegExp('\\b'+kw.replace(/ /g,'\\s+')+'\\b','gi');sql=sql.replace(re,kw);});
const breaks=['SELECT','FROM','WHERE','ORDER BY','GROUP BY','HAVING','VALUES','SET','JOIN','LEFT JOIN','RIGHT JOIN','INNER JOIN','OUTER JOIN','UNION','UNION ALL','LIMIT','OFFSET'];
breaks.forEach(kw=>{const re=new RegExp('\\s+'+kw.replace(/ /g,'\\s+')+'\\b','g');sql=sql.replace(re,'\n'+kw);});
sql=sql.replace(/,\s*/g,',\n    ');
sql=sql.replace(/\bAND\b/g,'\n  AND');
sql=sql.replace(/\bOR\b/g,'\n  OR');
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+sql.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';window._result=sql;
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
