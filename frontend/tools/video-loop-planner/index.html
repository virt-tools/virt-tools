<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Video Loop Planner — Virtual Tools</title>
<meta name="description" content="Plan complete video loops and the final partial pass needed to fill a target runtime, using exact whole-frame arithmetic.">
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool{max-width:820px;margin:auto}.panel{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--bg-panel)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0}.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px;min-width:0}.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field input{box-sizing:border-box;width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text,#e6e6e6);font:18px ui-monospace,monospace;padding:2px 0}.unit{font-size:11px;color:var(--text-dim,#9aa3b2);margin-top:4px}.hint{font-size:13px;color:var(--text-dim,#9aa3b2);margin:10px 0 0}
.err{color:var(--bad,#f87171);font-size:13px;margin:8px 0;min-height:1.2em}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 2px}.actions button{font:inherit;font-weight:650;padding:10px 20px;border-radius:8px;border:1px solid var(--accent,#6ea8fe);background:var(--accent,#6ea8fe);color:#0b1017;cursor:pointer;min-height:44px}.actions button.secondary{background:transparent;color:var(--text,#e6e6e6)}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions button:focus-visible,.summary:focus-visible{outline:3px solid var(--accent,#6ea8fe);outline-offset:2px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:16px 0 12px}.big{font-size:clamp(1.65rem,6vw,2.3rem);font-weight:800;font-family:ui-monospace,monospace;text-align:center;overflow-wrap:anywhere}.sub{text-align:center;color:var(--text-dim,#9aa3b2);font-size:13px;margin:6px 0 12px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}.row:last-child{border-bottom:0}.row .k{color:var(--text-dim,#9aa3b2)}.row .v{font-family:ui-monospace,monospace;font-weight:700;text-align:right;overflow-wrap:anywhere;color:var(--accent,#6ea8fe)}
.summary{box-sizing:border-box;width:100%;resize:vertical;min-height:126px;padding:10px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:12px/1.5 ui-monospace,monospace;margin:0 0 10px}.copy-status{display:inline-block;min-height:1.2em;font-size:13px;color:var(--text-dim,#9aa3b2)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:14px}.row{gap:8px}}@media(max-width:380px){.row{display:block}.row .v{display:block;text-align:left;margin-top:2px}.actions button{flex:1}.copy-status{flex-basis:100%}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header"><a class="back" href="/">← All tools</a><h1>Video Loop Planner</h1><p>Fill a target runtime with complete clip repeats and one precisely trimmed final pass.</p></div>
<div class="tool panel">
<form id="loop-form" novalidate>
<div class="grid">
<div class="field"><label for="in-clip">Clip duration</label><input id="in-clip" type="text" inputmode="decimal" autocomplete="off" value="7"><div class="unit">seconds</div></div>
<div class="field"><label for="in-target">Target runtime</label><input id="in-target" type="text" inputmode="decimal" autocomplete="off" value="60"><div class="unit">seconds</div></div>
<div class="field"><label for="in-fps">Frame rate</label><input id="in-fps" type="text" inputmode="decimal" autocomplete="off" value="30"><div class="unit">frames per second</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="actions"><button type="submit">Plan loops</button></div>
<p class="hint">Durations are rounded to the nearest whole frame. A target shorter than the clip uses one partial pass.</p>
</form>
<section class="out" id="out" aria-live="polite" aria-atomic="true" aria-label="Loop plan"></section>
<label class="field" for="summary"><span style="display:block;margin-bottom:6px;font-size:13px;font-weight:650">Copyable edit plan</span><textarea class="summary" id="summary" readonly spellcheck="false"></textarea></label>
<div class="actions"><button class="secondary" id="copy" type="button" disabled>Copy plan</button><span class="copy-status" id="copy-status" role="status" aria-live="polite"></span></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
/* video-loop-core:start */
var VideoLoopCore = (function(){
  "use strict";
  var SCALE = 1000;
  var MIN_DURATION = 0.001;
  var MAX_DURATION = 86400;
  var MIN_FPS = 1;
  var MAX_FPS = 240;

  function fail(message){ throw new Error(message); }
  function limit(value){ return Number(value).toLocaleString("en-US", {maximumFractionDigits:3}); }
  function decimal(value, label, minimum, maximum, unit){
    var raw = String(value == null ? "" : value).trim();
    var range = limit(minimum) + " and " + limit(maximum) + " " + unit;
    if (!raw) fail(label + " is required.");
    if (!/^(?:\d+(?:\.\d{1,3})?|\.\d{1,3})$/.test(raw)) fail(label + " must be a number between " + range + ".");
    var parsed = Number(raw);
    if (!isFinite(parsed)) fail(label + " must be a number between " + range + ".");
    if (parsed < minimum || parsed > maximum) fail(label + " must be between " + range + ".");
    return {value:parsed, scaled:Math.round(parsed * SCALE)};
  }
  function frames(duration, fps, label){
    var count = Math.round(duration.scaled * fps.scaled / (SCALE * SCALE));
    if (count < 1) fail(label + " is shorter than half a frame at this frame rate.");
    return count;
  }
  function calculate(options){
    var input = options || {};
    var clip = decimal(input.clip == null ? 7 : input.clip, "Clip duration", MIN_DURATION, MAX_DURATION, "seconds");
    var target = decimal(input.target == null ? 60 : input.target, "Target runtime", MIN_DURATION, MAX_DURATION, "seconds");
    var fps = decimal(input.fps == null ? 30 : input.fps, "Frame rate", MIN_FPS, MAX_FPS, "fps");
    var clipFrames = frames(clip, fps, "Clip duration");
    var targetFrames = frames(target, fps, "Target runtime");
    var completeLoops = Math.floor(targetFrames / clipFrames);
    var finalFrames = targetFrames % clipFrames;
    var totalPasses = completeLoops + (finalFrames ? 1 : 0);
    return {
      clipSeconds:clip.value,
      targetSeconds:target.value,
      fps:fps.value,
      clipFrames:clipFrames,
      targetFrames:targetFrames,
      exactClipFrames:clip.value * fps.value,
      exactTargetFrames:target.value * fps.value,
      effectiveClipSeconds:clipFrames / fps.value,
      effectiveTargetSeconds:targetFrames / fps.value,
      completeLoops:completeLoops,
      completeFrames:completeLoops * clipFrames,
      completeSeconds:completeLoops * clipFrames / fps.value,
      finalFrames:finalFrames,
      finalSeconds:finalFrames / fps.value,
      totalPasses:totalPasses,
      exactBoundary:finalFrames === 0
    };
  }
  function clock(seconds){
    var ms = Math.round(seconds * 1000);
    var hours = Math.floor(ms / 3600000); ms -= hours * 3600000;
    var minutes = Math.floor(ms / 60000); ms -= minutes * 60000;
    var secs = Math.floor(ms / 1000); ms -= secs * 1000;
    function pad(value, width){ var text = String(value); while (text.length < width) text = "0" + text; return text; }
    return (hours ? hours + ":" + pad(minutes, 2) : pad(minutes, 2)) + ":" + pad(secs, 2) + "." + pad(ms, 3);
  }
  function seconds(value){
    return Number(value.toFixed(3)).toLocaleString("en-US", {maximumFractionDigits:3}) + " s";
  }
  function count(value){ return Number(value).toLocaleString("en-US"); }
  function summary(result){
    var lines = [
      "Video loop plan",
      "Clip: " + seconds(result.clipSeconds) + " → " + count(result.clipFrames) + " frames at " + limit(result.fps) + " fps",
      "Target: " + seconds(result.targetSeconds) + " → " + count(result.targetFrames) + " frames",
      "Complete loops: " + count(result.completeLoops) + " (" + count(result.completeFrames) + " frames; " + seconds(result.completeSeconds) + ")"
    ];
    if (result.finalFrames){
      lines.push("Final pass: use 00:00.000–" + clock(result.finalSeconds) + " of the clip (" + count(result.finalFrames) + " frames; " + seconds(result.finalSeconds) + ")");
    } else {
      lines.push("Final pass: none; the target ends on a loop boundary");
    }
    lines.push("Total passes: " + count(result.totalPasses));
    lines.push("Frame-rounded runtime: " + seconds(result.effectiveTargetSeconds));
    return lines.join("\n");
  }
  return {calculate:calculate, clock:clock, seconds:seconds, count:count, summary:summary};
})();
/* video-loop-core:end */
(function(){
  "use strict";
  var els = {
    clip:document.getElementById("in-clip"), target:document.getElementById("in-target"), fps:document.getElementById("in-fps"),
    err:document.getElementById("err"), out:document.getElementById("out"), summary:document.getElementById("summary"),
    copy:document.getElementById("copy"), copyStatus:document.getElementById("copy-status")
  };
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function row(label, value){
    var line = document.createElement("div"); line.className = "row";
    var key = document.createElement("span"); key.className = "k"; key.textContent = label;
    var val = document.createElement("span"); val.className = "v"; val.textContent = value;
    line.appendChild(key); line.appendChild(val); els.out.appendChild(line);
  }
  function placeholder(message){ var span = document.createElement("span"); span.textContent = message; els.out.appendChild(span); }
  function update(){
    els.err.textContent = ""; els.copyStatus.textContent = ""; els.copy.disabled = true; els.summary.value = "";
    try {
      var result = VideoLoopCore.calculate({clip:els.clip.value, target:els.target.value, fps:els.fps.value});
      clear(els.out);
      var big = document.createElement("div"); big.className = "big";
      big.textContent = result.finalFrames
        ? VideoLoopCore.count(result.completeLoops) + " full loops + " + VideoLoopCore.seconds(result.finalSeconds)
        : VideoLoopCore.count(result.completeLoops) + " full loops";
      var sub = document.createElement("div"); sub.className = "sub";
      sub.textContent = VideoLoopCore.count(result.totalPasses) + (result.totalPasses === 1 ? " pass" : " passes") + " · " + VideoLoopCore.count(result.targetFrames) + " timeline frames";
      els.out.appendChild(big); els.out.appendChild(sub);
      row("Each complete loop", VideoLoopCore.count(result.clipFrames) + " frames · " + VideoLoopCore.seconds(result.effectiveClipSeconds));
      row("Complete-loop runtime", VideoLoopCore.count(result.completeFrames) + " frames · " + VideoLoopCore.seconds(result.completeSeconds));
      row("Final source segment", result.finalFrames ? "00:00.000–" + VideoLoopCore.clock(result.finalSeconds) + " · " + VideoLoopCore.count(result.finalFrames) + " frames" : "None — exact loop boundary");
      row("Frame-rounded target", VideoLoopCore.seconds(result.effectiveTargetSeconds) + " at " + result.fps + " fps");
      els.summary.value = VideoLoopCore.summary(result); els.copy.disabled = false;
    } catch (error) {
      clear(els.out); placeholder("Enter valid clip, target and frame-rate values to see the loop plan."); els.err.textContent = error.message;
    }
  }
  document.getElementById("loop-form").addEventListener("submit", function(event){ event.preventDefault(); update(); });
  els.copy.addEventListener("click", function(){
    var text = els.summary.value;
    function done(){ els.copyStatus.textContent = "Plan copied."; }
    function fallback(){
      els.summary.focus(); els.summary.select();
      var copied = false;
      try { copied = document.execCommand("copy"); } catch (ignore) { copied = false; }
      els.copyStatus.textContent = copied ? "Plan copied." : "Select the plan and copy it manually.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });
  update();
})();
</script>
</body>
</html>
