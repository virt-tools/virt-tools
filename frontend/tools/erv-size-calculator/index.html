<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>ERV Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>ERV Size Calculator</h1>
<p>Calculate required Energy Recovery Ventilator (ERV) CFM from occupant count and floor area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-occ">Occupants</label><input type="text" id="in-occ" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">people</div></div>
<div class="field"><label class="f" for="in-area">Floor area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-ach">Ventilation rate</label><input type="text" id="in-ach" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.35"><div class="unit">ACH</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var occEl=document.getElementById("in-occ"),areaEl=document.getElementById("in-area"),achEl=document.getElementById("in-ach"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var O=pn(occEl.value),A=pn(areaEl.value),ACH=pn(achEl.value);
if(O==null||A==null||ACH==null)return;
if(!isFinite(O)||!isFinite(A)||!isFinite(ACH)||O<=0||A<=0||ACH<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var cfmOcc=O*7.5;
var cfmArea=A*8*ACH/60;
var cfm=Math.max(cfmOcc,cfmArea);
var html='<div class="big">'+rnd(cfm,0)+' CFM</div>';
html+=row("Occupant-based CFM",rnd(cfmOcc,0));
html+=row("Area-based CFM",rnd(cfmArea,0));
html+=row("Required ERV CFM",rnd(cfm,0));
html+=row("Recommended ERV",rnd(cfm*1.15,0)+" CFM (15% safety)");
out.innerHTML=html;
}
[occEl,areaEl,achEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
