<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Compressor</h1>
<p class="subtitle">Compress JPEG images by adjusting quality. Shows file size comparison. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<label>Quality: <input type="range" id="quality" min="10" max="100" value="60" oninput="document.getElementById('qval').textContent=this.value+'%'"></label>
<span id="qval">60%</span>
<button onclick="compress()" type="button">Compress</button>
<button onclick="download()" type="button">Download</button>
</div>
<div id="info" style="margin-top:10px"></div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img,originalSize;
var canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
document.getElementById('file').addEventListener('change',function(){
var f=this.files[0];if(!f)return;
originalSize=f.size;
img=new Image();img.onload=function(){
canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
ctx.drawImage(img,0,0);
document.getElementById('info').innerHTML='<p>Original: '+(originalSize/1024).toFixed(1)+' KB ('+img.naturalWidth+'x'+img.naturalHeight+')</p>';
};img.src=URL.createObjectURL(f);
});
function compress(){
if(!img)return;
var q=parseInt(document.getElementById('quality').value)/100;
canvas.toBlob(function(b){
ctx.clearRect(0,0,canvas.width,canvas.height);
var i=new Image();i.onload=function(){ctx.drawImage(i,0,0);};
i.src=URL.createObjectURL(b);
var pct=((b.size/originalSize)*100).toFixed(0);
document.getElementById('info').innerHTML='<p>Original: '+(originalSize/1024).toFixed(1)+' KB → Compressed: '+(b.size/1024).toFixed(1)+' KB ('+pct+'%)</p>';
window._compBlob=b;
},'image/jpeg',q);
}
function download(){
if(window._compBlob){var a=document.createElement('a');a.href=URL.createObjectURL(window._compBlob);a.download='compressed.jpg';a.click();}
else{canvas.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='compressed.jpg';a.click();},'image/jpeg',0.6);}
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
