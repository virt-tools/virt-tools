<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rail Fence Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.rail-fence{max-width:700px;margin:0 auto;padding:2rem 1rem}
.rail-fence h1{font-size:2rem;margin-bottom:.5rem}
.rail-fence .sub{color:#888;margin-bottom:1.5rem}
.rail-fence textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:100px;resize:vertical}
.rail-fence .row{display:flex;gap:1rem;align-items:center;margin-top:1rem}
.rail-fence label{font-size:14px;white-space:nowrap}
.rail-fence input[type=number]{width:80px;font-size:15px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.rail-fence select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.rail-fence .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.rail-fence .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:80px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.rail-fence .viz{margin-top:1rem;overflow-x:auto}
.rail-fence .viz table{border-collapse:collapse}
.rail-fence .viz td{width:28px;height:28px;text-align:center;border:1px solid var(--border);font-family:monospace;font-size:13px}
.rail-fence .viz td.active{background:var(--accent);color:#fff;font-weight:bold}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="rail-fence">
<h1>🚂 Rail Fence Cipher</h1>
<p class="sub">Encode and decode text using the Rail Fence transposition cipher.</p>
<textarea id="input" placeholder="Enter text to encode or decode..." aria-label="Enter Text To Encode Or Decode..."></textarea>
<div class="row">
<label>Rails:</label>
<input type="number" id="rails" value="3" min="2" max="10" aria-label="Rails">
<label>Mode:</label>
<select id="mode" aria-label="Mode"><option value="encode">Encode</option><option value="decode">Decode</option></select>
<button class="btn" id="run" type="button">Run</button>
</div>
<div class="output" id="output"></div>
<div class="viz" id="viz"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const rails=document.getElementById('rails');
const mode=document.getElementById('mode');
const runBtn=document.getElementById('run');
const output=document.getElementById('output');
const viz=document.getElementById('viz');

function encode(text,numRails){
  if(numRails<2||!text)return'';
  const fence=[];
  for(let i=0;i<numRails;i++)fence.push([]);
  let rail=0,dir=1;
  for(const ch of text){
    fence[rail].push(ch);
    if(rail===0)dir=1;
    else if(rail===numRails-1)dir=-1;
    rail+=dir;
  }
  return fence.map(r=>r.join('')).join('');
}

function decode(text,numRails){
  if(numRails<2||!text)return'';
  const len=text.length;
  const pattern=[];
  for(let i=0;i<numRails;i++)pattern.push([]);
  let rail=0,dir=1;
  for(let i=0;i<len;i++){
    pattern[rail].push(i);
    if(rail===0)dir=1;
    else if(rail===numRails-1)dir=-1;
    rail+=dir;
  }
  const result=new Array(len);
  let idx=0;
  for(let r=0;r<numRails;r++){
    for(const pos of pattern[r]){
      result[pos]=text[idx++];
    }
  }
  return result.join('');
}

function visualize(text,numRails){
  if(!text||numRails<2)return'';
  const len=text.length;
  const grid=[];
  for(let i=0;i<numRails;i++)grid.push(new Array(len).fill(''));
  let rail=0,dir=1;
  for(let i=0;i<len;i++){
    grid[rail][i]=text[i];
    if(rail===0)dir=1;
    else if(rail===numRails-1)dir=-1;
    rail+=dir;
  }
  let html='<table>';
  for(let r=0;r<numRails;r++){
    html+='<tr>';
    for(let c=0;c<len;c++){
      const cls=grid[r][c]!==''?'active':'';
      html+='<td class="'+cls+'">'+grid[r][c]+'</td>';
    }
    html+='</tr>';
  }
  html+='</table>';
  return html;
}

runBtn.addEventListener('click',()=>{
  const text=input.value;
  const r=parseInt(rails.value)||3;
  const m=mode.value;
  let result;
  if(m==='encode')result=encode(text,r);
  else result=decode(text,r);
  output.textContent=result;
  viz.innerHTML=visualize(m==='encode'?text:result,r);
});
input.addEventListener('input',()=>{if(mode.value==='encode')runBtn.click();});
})();
</script>
</body>
</html>
