<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Cheatsheet — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>SQL Cheatsheet</h1>
<p class="subtitle">Quick reference for SQL syntax, searchable by category or keyword.</p>
<input type="text" id="search" placeholder="Search SQL commands..." style="width:100%;max-width:600px;margin-top:1.5rem;padding:.6rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;" aria-label="Search Sql Commands...">
<div id="cats" style="display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;"></div>
<div id="cmds" style="margin-top:1rem;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const groups=[
{cat:'SELECT',color:'#4caf50',items:[
 {cmd:'SELECT * FROM table',desc:'All columns from a table'},
 {cmd:'SELECT col1, col2 FROM table',desc:'Specific columns'},
 {cmd:'SELECT col1 AS alias FROM table',desc:'Column alias'},
 {cmd:'SELECT DISTINCT col FROM table',desc:'Unique values only'},
 {cmd:'SELECT col FROM table LIMIT n',desc:'Limit rows returned'},
 {cmd:'SELECT col FROM table LIMIT n OFFSET m',desc:'Pagination'},
 {cmd:'SELECT col FROM table ORDER BY col ASC|DESC',desc:'Sort results'},
 {cmd:'SELECT col FROM table WHERE condition',desc:'Filter rows'},
 {cmd:'SELECT COUNT(*) FROM table',desc:'Count rows'},
]},
{cat:'JOIN',color:'#2196f3',items:[
 {cmd:'SELECT a.*, b.* FROM a INNER JOIN b ON a.id=b.aid',desc:'Inner join (matching rows)'},
 {cmd:'SELECT a.*, b.* FROM a LEFT JOIN b ON a.id=b.aid',desc:'Left join (all from a)'},
 {cmd:'SELECT a.*, b.* FROM a RIGHT JOIN b ON a.id=b.aid',desc:'Right join (all from b)'},
 {cmd:'SELECT a.*, b.* FROM a FULL OUTER JOIN b ON a.id=b.aid',desc:'Full outer join'},
 {cmd:'SELECT a.* FROM a CROSS JOIN b',desc:'Cartesian product'},
 {cmd:'SELECT a.* FROM a LEFT JOIN b ON a.id=b.aid WHERE b.id IS NULL',desc:'Anti-join (rows in a not in b)'},
 {cmd:'SELECT t1.col FROM table t1 JOIN table t2 ON t1.id=t2.pid',desc:'Self-join'},
]},
{cat:'WHERE & Filters',color:'#ff9800',items:[
 {cmd:'WHERE col = val',desc:'Equality'},
 {cmd:'WHERE col != val',desc:'Inequality'},
 {cmd:'WHERE col > val AND col2 < val2',desc:'Multiple conditions'},
 {cmd:'WHERE col IN (v1, v2, v3)',desc:'Match any of a set'},
 {cmd:'WHERE col NOT IN (v1, v2)',desc:'Exclude a set'},
 {cmd:'WHERE col BETWEEN v1 AND v2',desc:'Range (inclusive)'},
 {cmd:'WHERE col LIKE "pattern%"',desc:'Pattern match (% = any, _ = one)'},
 {cmd:'WHERE col IS NULL',desc:'Check for NULL'},
 {cmd:'WHERE col IS NOT NULL',desc:'Check for non-NULL'},
 {cmd:'WHERE EXISTS (subquery)',desc:'Existence check'},
 {cmd:'WHERE col = ANY (subquery)',desc:'Any match'},
 {cmd:'WHERE col = ALL (subquery)',desc:'All match'},
]},
{cat:'Aggregation',color:'#9c27b0',items:[
 {cmd:'SELECT col, COUNT(*) FROM table GROUP BY col',desc:'Group + count'},
 {cmd:'SELECT col, SUM(amount) FROM table GROUP BY col',desc:'Group + sum'},
 {cmd:'SELECT col, AVG(price) FROM table GROUP BY col',desc:'Group + average'},
 {cmd:'SELECT col, MIN(col2), MAX(col2) FROM table GROUP BY col',desc:'Min and max per group'},
 {cmd:'SELECT col, COUNT(*) FROM table GROUP BY col HAVING COUNT(*) > 1',desc:'Filter groups'},
 {cmd:'SELECT col, GROUP_CONCAT(col2) FROM table GROUP BY col',desc:'Concatenate values (MySQL/SQLite)'},
 {cmd:'SELECT col, STRING_AGG(col2, ",") FROM table GROUP BY col',desc:'Concatenate (Postgres)'},
]},
{cat:'INSERT/UPDATE/DELETE',color:'#f44336',items:[
 {cmd:'INSERT INTO table (c1, c2) VALUES (v1, v2)',desc:'Insert a row'},
 {cmd:'INSERT INTO table VALUES (v1, v2, ...)',desc:'Insert all columns'},
 {cmd:'INSERT INTO table (c1, c2) SELECT c1, c2 FROM other',desc:'Insert from query'},
 {cmd:'INSERT INTO table (c1, c2) VALUES (v1, v2) ON CONFLICT DO NOTHING',desc:'Insert or ignore (UPSERT)'},
 {cmd:'INSERT INTO table (c1, c2) VALUES (v1, v2) ON CONFLICT(c1) DO UPDATE SET c2=EXCLUDED.c2',desc:'UPSERT (Postgres)'},
 {cmd:'UPDATE table SET col=val WHERE condition',desc:'Update rows'},
 {cmd:'UPDATE table SET col1=val1, col2=val2 WHERE condition',desc:'Update multiple columns'},
 {cmd:'DELETE FROM table WHERE condition',desc:'Delete rows'},
 {cmd:'DELETE FROM table',desc:'Delete all rows (danger!)'},
 {cmd:'TRUNCATE TABLE table',desc:'Empty table fast (no rollback)'},
]},
{cat:'DDL',color:'#607d8b',items:[
 {cmd:'CREATE TABLE t (id INT PRIMARY KEY, name VARCHAR(255))',desc:'Create table'},
 {cmd:'CREATE TABLE t (id INT AUTO_INCREMENT PRIMARY KEY)',desc:'Auto-increment (MySQL)'},
 {cmd:'CREATE TABLE t (id SERIAL PRIMARY KEY)',desc:'Auto-increment (Postgres)'},
 {cmd:'CREATE TABLE t (id INTEGER PRIMARY KEY AUTOINCREMENT)',desc:'Auto-increment (SQLite)'},
 {cmd:'CREATE TABLE t (id INT, FOREIGN KEY (id) REFERENCES other(id))',desc:'With foreign key'},
 {cmd:'CREATE TABLE t (id INT, UNIQUE(id))',desc:'With unique constraint'},
 {cmd:'ALTER TABLE t ADD COLUMN col VARCHAR(100)',desc:'Add column'},
 {cmd:'ALTER TABLE t DROP COLUMN col',desc:'Drop column'},
 {cmd:'ALTER TABLE t RENAME COLUMN old TO new',desc:'Rename column'},
 {cmd:'ALTER TABLE t ADD CONSTRAINT chk CHECK (col > 0)',desc:'Add check constraint'},
 {cmd:'DROP TABLE t',desc:'Delete table'},
 {cmd:'CREATE INDEX idx ON table(col)',desc:'Create index'},
 {cmd:'CREATE UNIQUE INDEX idx ON table(col)',desc:'Unique index'},
]},
{cat:'Advanced',color:'#e91e63',items:[
 {cmd:'WITH cte AS (SELECT ...) SELECT * FROM cte',desc:'Common table expression'},
 {cmd:'WITH RECURSIVE cte AS (...) SELECT * FROM cte',desc:'Recursive CTE'},
 {cmd:'SELECT col, ROW_NUMBER() OVER (ORDER BY col) FROM t',desc:'Window function'},
 {cmd:'SELECT col, RANK() OVER (PARTITION BY g ORDER BY col) FROM t',desc:'Rank with partition'},
 {cmd:'SELECT col, LAG(col) OVER (ORDER BY col) FROM t',desc:'Access previous row'},
 {cmd:'SELECT col, LEAD(col) OVER (ORDER BY col) FROM t',desc:'Access next row'},
 {cmd:'SELECT col, FIRST_VALUE(col) OVER (PARTITION BY g) FROM t',desc:'First value in partition'},
 {cmd:'SELECT CASE WHEN c1 THEN v1 ELSE v2 END FROM t',desc:'Conditional expression'},
 {cmd:'SELECT COALESCE(col1, col2, default) FROM t',desc:'First non-NULL value'},
 {cmd:'SELECT * FROM t WHERE EXISTS (SELECT 1 FROM t2 WHERE t2.id=t.id)',desc:'Correlated subquery'},
 {cmd:'MERGE INTO target USING source ON condition WHEN MATCHED THEN UPDATE ...',desc:'Merge (UPSERT in one statement)'},
]},
{cat:'Transactions',color:'#795548',items:[
 {cmd:'BEGIN TRANSACTION',desc:'Start transaction'},
 {cmd:'COMMIT',desc:'Save changes'},
 {cmd:'ROLLBACK',desc:'Undo changes'},
 {cmd:'SAVEPOINT name',desc:'Create savepoint'},
 {cmd:'ROLLBACK TO name',desc:'Rollback to savepoint'},
 {cmd:'SET TRANSACTION ISOLATION LEVEL READ COMMITTED',desc:'Set isolation level'},
 {cmd:'SET TRANSACTION ISOLATION LEVEL SERIALIZABLE',desc:'Highest isolation'},
]},
];
const search=document.getElementById('search');
const catsEl=document.getElementById('cats');
const cmdsEl=document.getElementById('cmds');
let activeCat='All';
const allCats=['All',...groups.map(g=>g.cat)];
function renderCats(){
  catsEl.innerHTML=allCats.map(c=>'<button data-cat="'+c+'" style="padding:.3rem .8rem;border:1px solid '+(c===activeCat?'#333':'#ddd')+';border-radius:20px;background:'+(c===activeCat?'#333':'#fff')+';color:'+(c===activeCat?'#fff':'#333')+';cursor:pointer;font-size:.85rem;" type="button">'+c+'</button>').join('');
  catsEl.querySelectorAll('button').forEach(b=>b.onclick=function(){activeCat=b.dataset.cat;renderCats();render();});
}
function render(){
  const q=search.value.toLowerCase();
  const filtered=groups.filter(g=>activeCat==='All'||g.cat===activeCat).map(g=>{const items=g.items.filter(i=>!q||i.cmd.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q));return{...g,items};}).filter(g=>g.items.length>0);
  if(!filtered.length){cmdsEl.innerHTML='<p style="color:#999;">No matching commands.</p>';return;}
  cmdsEl.innerHTML=filtered.map(g=>(
    '<h3 style="color:'+g.color+';margin-top:1.5rem;margin-bottom:.5rem;font-size:1rem;">'+g.cat+'</h3>'+
    g.items.map(i=>(
      '<div style="display:flex;gap:1rem;padding:.5rem 1rem;border:1px solid #eee;border-radius:6px;margin-bottom:.3rem;align-items:center;">'+
      '<code style="flex:1;font-family:monospace;font-size:.85rem;background:#f5f5f5;padding:.3rem .5rem;border-radius:4px;cursor:pointer;" onclick="navigator.clipboard.writeText(this.textContent)">'+i.cmd+'</code>'+
      '<span style="font-size:.85rem;color:#666;min-width:250px;">'+i.desc+'</span>'+
      '</div>'
    )).join('')
  )).join('');
}
search.addEventListener('input',render);
renderCats();
render();
})();
</script>
</body>
</html>
