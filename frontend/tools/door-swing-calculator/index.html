<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Door Swing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Door Swing Calculator</h1>
<p>Calculate door swing clearance arc and required wall space for a hinged door. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dw">Door width</label><input type="text" id="in-dw" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-dh">Door height</label><input type="text" id="in-dh" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter door dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dwEl=document.getElementById("in-dw"),dhEl=document.getElementById("in-dh"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var DW=pn(dwEl.value),DH=pn(dhEl.value);
if(DW==null){return}
DH=DH==null?2000:DH;
if(!isFinite(DW)||!isFinite(DH)||DW<=0||DH<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var sweepArea=Math.PI*DW*DW/4;
var clearRadius=DW;
var minWallSpace=DW+50;
var html='<div class="big">'+rnd(sweepArea/1000000,3)+' m²</div>';
html+=row("Door width",rnd(DW,0)+" mm");
html+=row("Door height",rnd(DH,0)+" mm");
html+=row("Sweep arc radius",rnd(clearRadius,0)+" mm");
html+=row("Sweep area",rnd(sweepArea/1000000,3)+" m²");
html+=row("Min wall clearance",rnd(minWallSpace,0)+" mm");
out.innerHTML=html;
}
[dwEl,dhEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
