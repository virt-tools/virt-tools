<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Mud Pump Output Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Mud Pump Output Calculator</h1>
<p>Calculate mud pump output in GPM from liner diameter, stroke length, strokes per minute, and volumetric efficiency. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ld">Liner diameter</label><input type="text" id="in-ld" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-sl">Stroke length</label><input type="text" id="in-sl" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-spm">Strokes/min</label><input type="text" id="in-spm" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">SPM</div></div>
<div class="field"><label class="f" for="in-eff">Efficiency</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.9"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var ldE=document.getElementById("in-ld"),slE=document.getElementById("in-sl"),spmE=document.getElementById("in-spm"),effE=document.getElementById("in-eff"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var ld=parseFloat(ldE.value),sl=parseFloat(slE.value),spm=parseFloat(spmE.value),eff=parseFloat(effE.value);
if(isNaN(ld)||isNaN(sl)||isNaN(spm)||isNaN(eff))return;
err.textContent="";
var displPerStroke=0.7854*ld*ld*sl*3*(1/231);
var gpm=displPerStroke*spm*eff;
var html='<div class="big">'+Math.round(gpm)+' gpm</div>';
html+=row("Pump output",Math.round(gpm)+' gpm');
html+=row("Displacement per stroke",Math.round(displPerStroke*100)/100+' gal/stroke');
html+=row("Efficiency",Math.round(eff*100)+'%');
out.innerHTML=html;
}
[ldE,slE,spmE,effE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
