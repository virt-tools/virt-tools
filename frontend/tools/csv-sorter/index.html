<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Sorter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Sorter</h1>
<p class="subtitle">Sort CSV data by any column — ascending or descending, numeric or text. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="name,age&#10;Alice,30&#10;Bob,25&#10;Charlie,35" aria-label="Name,Age&#10;Alice,30&#10;Bob,25&#10;Charlie,35"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Sort by:</label><select id="sortCol" aria-label="Sort Col"></select>
<label>Order:</label><select id="sortOrder" aria-label="Sort Order"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
<label>Type:</label><select id="sortType" aria-label="Sort Type"><option value="auto">Auto</option><option value="num">Numeric</option><option value="text">Text</option></select>
<button id="run" class="primary-btn" type="button">Sort</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
const input=document.getElementById('input');
const sortCol=document.getElementById('sortCol');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){sortCol.innerHTML=rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join(' ');}
});
document.getElementById('run').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];
const col=parseInt(sortCol.value);
const order=document.getElementById('sortOrder').value;
const type=document.getElementById('sortType').value;
const data=rows.slice(1);
const isNum=type==='num'||(type==='auto'&&data.every(r=>!isNaN(parseFloat(r[col]))&&isFinite(r[col])));
data.sort((a,b)=>{
let va=a[col]||'',vb=b[col]||'';
if(isNum){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
if(va<vb)return order==='asc'?-1:1;
if(va>vb)return order==='asc'?1:-1;
return 0;
});
const out=[header,...data];
const ta=document.createElement('textarea');ta.value=toCSV(out);ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>Sorted '+(out.length-1)+' rows by '+header[col]+' ('+order+', '+(isNum?'numeric':'text')+').</p>';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
