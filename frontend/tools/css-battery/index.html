<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Battery Indicator Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:180px;position:relative;display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔋 CSS Battery Indicator Generator</h1>
<p>Create CSS battery level/charging indicators. 4 styles, 4 sizes, charging animation. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="horizontal" selected>Horizontal</option><option value="vertical">Vertical</option><option value="circle">Circle</option><option value="pixel">Pixel</option></select></div>
<div class="ctrl-row"><label>Level</label><input type="range" id="level" value="75" min="0" max="100" style="width:200px" aria-label="Level"><span id="levelVal">75%</span></div>
<div class="ctrl-row"><label>Size</label><select id="size" aria-label="Size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option><option value="xl">Extra Large</option></select></div>
<div class="ctrl-row"><label>Charging</label><input type="checkbox" id="charging" aria-label="Charging"></div>
<div class="ctrl-row"><label>Low Color</label><input type="color" id="lowColor" value="#ff4444" style="width:60px;height:34px" aria-label="Low Color"></div>
<div class="ctrl-row"><label>Mid Color</label><input type="color" id="midColor" value="#ffaa00" style="width:60px;height:34px" aria-label="Mid Color"></div>
<div class="ctrl-row"><label>High Color</label><input type="color" id="highColor" value="#44ff44" style="width:60px;height:34px" aria-label="High Color"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var level=parseInt(document.getElementById('level').value);
document.getElementById('levelVal').textContent=level+'%';
var size=document.getElementById('size').value;
var charging=document.getElementById('charging').checked;
var low=document.getElementById('lowColor').value;
var mid=document.getElementById('midColor').value;
var high=document.getElementById('highColor').value;
var color=level<=20?low:level<=50?mid:high;
var sz={sm:{w:40,h:20,b:3},md:{w:60,h:30,b:4},lg:{w:80,h:40,b:5},xl:{w:120,h:60,b:6}}[size];
var html='<div class="battery battery-'+style+'">\n';
if(style==='horizontal'){
html+='  <div class="battery-body" style="--level:'+level+'%;--color:'+color+';--w:'+sz.w+'px;--h:'+sz.h+'px;--b:'+sz.b+'px">\n';
html+='    <div class="battery-fill"></div>\n';
if(charging)html+='    <span class="battery-bolt">⚡</span>\n';
html+='  </div>\n  <div class="battery-cap" style="--b:'+sz.b+'px;--h:'+sz.h+'px"></div>\n';
}else if(style==='vertical'){
html+='  <div class="battery-body battery-vertical" style="--level:'+level+'%;--color:'+color+';--w:'+sz.h+'px;--h:'+sz.w+'px;--b:'+sz.b+'px">\n';
html+='    <div class="battery-fill"></div>\n';
if(charging)html+='    <span class="battery-bolt">⚡</span>\n';
html+='  </div>\n  <div class="battery-cap battery-cap-bottom" style="--b:'+sz.b+'px;--w:'+sz.h+'px"></div>\n';
}else if(style==='circle'){
html+='  <div class="battery-circle" style="--level:'+level+'%;--color:'+color+';--sz:'+(sz.w*1.5)+'px">\n';
html+='    <span>'+(charging?'⚡':level+'%')+'</span>\n  </div>\n';
}else if(style==='pixel'){
var cells=10;
var filled=Math.round(level/10);
html+='  <div class="battery-pixel">\n';
for(var i=0;i<cells;i++)html+='    <div class="pixel-cell'+(i<filled?' filled':'')+'" style="--color:'+(i<2?low:i<5?mid:high)+'"></div>\n';
html+='  </div>\n';
}
html+='</div>';
var css='.battery{display:inline-flex;align-items:center;gap:2px}\n';
css+='.battery-body{position:relative;width:var(--w);height:var(--h);border:var(--b) solid #555;border-radius:4px;overflow:hidden;background:#1a1a2e}\n';
css+='.battery-fill{position:absolute;bottom:0;left:0;width:var(--level);height:100%;background:var(--color);transition:width .5s ease}\n';
css+='.battery-cap{width:4px;height:calc(var(--h)*0.4);background:#555;border-radius:0 2px 2px 0;border:var(--b) solid #555;border-left:none}\n';
css+='.battery-bolt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--h)*0.5);animation:bolt-pulse 1s infinite}\n';
css+='.battery-vertical{flex-direction:column}\n';
css+='.battery-vertical .battery-fill{width:100%;height:var(--level);bottom:0;left:0}\n';
css+='.battery-cap-bottom{height:4px;width:calc(var(--w)*0.4);border:var(--b) solid #555;border-top:none;border-radius:0 0 2px 2px}\n';
css+='.battery-circle{width:var(--sz);height:var(--sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*0.25);font-weight:bold;color:#fff;background:conic-gradient(var(--color) calc(var(--level)*1%),#333 0);position:relative}\n';
css+='.battery-circle::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#1a1a2e}\n';
css+='.battery-circle span{position:relative;z-index:1}\n';
css+='.battery-pixel{display:flex;gap:2px}\n';
css+='.pixel-cell{width:10px;height:24px;border:1px solid #444;border-radius:2px;background:#222}\n';
css+='.pixel-cell.filled{background:var(--color);box-shadow:0 0 4px var(--color)}\n';
css+='@keyframes bolt-pulse{0%,100%{opacity:.6}50%{opacity:1}}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','level','size','charging','lowColor','midColor','highColor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
