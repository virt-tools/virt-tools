<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Curtain/Blinds Reveal Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:220px;position:relative;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🪟 CSS Curtain/Blinds Reveal Generator</h1>
<p>Create CSS curtain/blinds open-reveal animation effects. 4 styles, adjustable panels/speed/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="curtain" selected>Curtain (horizontal)</option><option value="blinds">Blinds (vertical strips)</option><option value="doors">Double doors</option><option value="shutter">Shutter roll-up</option></select></div>
<div class="ctrl-row"><label>Panels</label><input type="number" id="panels" value="6" min="2" max="16" style="width:80px" aria-label="Panels"></div>
<div class="ctrl-row"><label>Width</label><input type="number" id="width" value="400" min="200" max="800" style="width:80px" aria-label="Width">px</div>
<div class="ctrl-row"><label>Height</label><input type="number" id="height" value="160" min="80" max="400" style="width:80px" aria-label="Height">px</div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color1" value="#667eea" style="width:60px;height:34px" aria-label="Color1"></div>
<div class="ctrl-row"><label>Duration</label><input type="number" id="duration" value="1.5" min="0.3" max="5" step="0.1" style="width:80px" aria-label="Duration">s</div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview (hover to reveal)</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var panels=parseInt(document.getElementById('panels').value);
var w=parseInt(document.getElementById('width').value);
var h=parseInt(document.getElementById('height').value);
var c=document.getElementById('color1').value;
var dur=parseFloat(document.getElementById('duration').value);
var html='<div class="reveal-wrap">\n';
html+='  <div class="reveal-content">Hello!</div>\n';
for(var i=0;i<panels;i++)html+='  <div class="reveal-panel p'+(i+1)+'"></div>\n';
html+='</div>';
var css='.reveal-wrap{position:relative;width:'+w+'px;height:'+h+'px;overflow:hidden;border-radius:8px;cursor:pointer}\n';
css+='.reveal-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold;color:#fff;background:linear-gradient(135deg,#222,#444)}\n';
css+='.reveal-panel{position:absolute;background:'+c+';opacity:.95}\n';
if(style==='curtain'){
var pw=w/panels;
for(var i=0;i<panels;i++){
css+='.p'+(i+1)+'{left:'+(i*pw)+'px;width:'+pw+'px;height:'+h+'px;transform-origin:top;transform:scaleY(1);transition:transform '+dur+'s ease;transition-delay:'+(i*0.05)+'s}\n';
}
css+='.reveal-wrap:hover .reveal-panel{transform:scaleY(0)}\n';
}else if(style==='blinds'){
var ph=h/panels;
for(var i=0;i<panels;i++){
css+='.p'+(i+1)+'{top:'+(i*ph)+'px;width:'+w+'px;height:'+ph+'px;transform-origin:left;transform:scaleX(1);transition:transform '+dur+'s ease;transition-delay:'+(i*0.05)+'s}\n';
}
css+='.reveal-wrap:hover .reveal-panel{transform:scaleX(0)}\n';
}else if(style==='doors'){
var pw=w/2;
css+='.p1{left:0;width:'+pw+'px;height:'+h+'px;transform-origin:left;transition:transform '+dur+'s ease}\n';
css+='.p2{right:0;width:'+pw+'px;height:'+h+'px;transform-origin:right;transition:transform '+dur+'s ease}\n';
for(var i=2;i<panels;i++)css+='.p'+(i+1)+'{display:none}\n';
css+='.reveal-wrap:hover .p1{transform:perspective(800px) rotateY(-80deg)}\n';
css+='.reveal-wrap:hover .p2{transform:perspective(800px) rotateY(80deg)}\n';
}else if(style==='shutter'){
var ph=h/panels;
for(var i=0;i<panels;i++){
css+='.p'+(i+1)+'{top:'+(i*ph)+'px;width:'+w+'px;height:'+ph+'px;transform-origin:top;transform:translateY(0);transition:transform '+dur+'s ease;transition-delay:'+(i*0.03)+'s}\n';
}
css+='.reveal-wrap:hover .reveal-panel{transform:translateY(-100%)}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','panels','width','height','color1','duration'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
