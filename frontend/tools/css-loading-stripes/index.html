<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Loading Stripes Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#0a0a1a;border-radius:12px;padding:2rem;display:flex;flex-direction:column;gap:1.5rem;align-items:center;justify-content:center;min-height:200px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📊 CSS Loading Stripes Generator</h1>
<p>Create CSS animated striped/bar loading indicators. 6 styles, adjustable colors/speed/width. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="barber" selected>Barber Pole</option><option value="candy">Candy Cane</option><option value="diagonal">Diagonal Slide</option><option value="pulse">Pulse Stripes</option><option value="gradient">Gradient Slide</option><option value="zebra">Zebra Scroll</option></select></div>
<div class="ctrl-row"><label>Width</label><input type="number" id="width" value="300" min="100" max="600" style="width:80px">px</div>
<div class="ctrl-row"><label>Height</label><input type="number" id="height" value="30" min="10" max="80" style="width:80px">px</div>
<div class="ctrl-row"><label>Speed</label><input type="number" id="speed" value="1" min="0.2" max="5" step="0.2" style="width:80px">s</div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="color1" value="#667eea" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="color2" value="#1a1a2e" style="width:60px;height:34px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var w=document.getElementById('width').value;
var h=document.getElementById('height').value;
var speed=document.getElementById('speed').value;
var c1=document.getElementById('color1').value;
var c2=document.getElementById('color2').value;
var html='<div class="loading-stripes"></div>';
var stripeSize=20;
var bg='',anim='',direction='background-position';
if(style==='barber'){bg='repeating-linear-gradient(45deg,'+c1+' 0,'+c1+' '+stripeSize+'px,'+c2+' '+stripeSize+'px,'+c2+' '+(stripeSize*2)+'px)';anim='@keyframes stripes-barber{from{background-position:0 0}to{background-position:'+(stripeSize*2)+'px 0}}\n.stripes{animation:stripes-barber '+speed+'s linear infinite}'}
else if(style==='candy'){bg='repeating-linear-gradient(-45deg,'+c1+' 0,'+c1+' '+stripeSize+'px,'+c2+' '+stripeSize+'px,'+c2+' '+(stripeSize*2)+'px)';anim='@keyframes stripes-candy{from{background-position:0 0}to{background-position:'+(stripeSize*2)+'px 0}}\n.stripes{animation:stripes-candy '+speed+'s linear infinite}'}
else if(style==='diagonal'){bg='repeating-linear-gradient(90deg,'+c1+' 0,'+c1+' '+(stripeSize*1.5)+'px,'+c2+' '+(stripeSize*1.5)+'px,'+c2+' '+(stripeSize*3)+'px)';anim='@keyframes stripes-diag{from{background-position:0 0}to{background-position:'+(stripeSize*3)+'px 0}}\n.stripes{animation:stripes-diag '+speed+'s linear infinite}'}
else if(style==='pulse'){bg='repeating-linear-gradient(90deg,'+c1+' 0,'+c1+' '+stripeSize+'px,'+c2+' '+stripeSize+'px,'+c2+' '+(stripeSize*2)+'px)';anim='@keyframes stripes-pulse{0%,100%{opacity:1}50%{opacity:0.4}}\n.stripes{animation:stripes-pulse '+speed+'s ease-in-out infinite}'}
else if(style==='gradient'){bg='linear-gradient(90deg,'+c1+','+c2+','+c1+')';bg='background-size:200% 100%;background:'+bg;anim='@keyframes stripes-grad{from{background-position:0% 0}to{background-position:200% 0}}\n.stripes{background-size:200% 100%!important;animation:stripes-grad '+speed+'s linear infinite}'}
else if(style==='zebra'){bg='repeating-linear-gradient(0deg,'+c1+' 0,'+c1+' '+(h/2)+'px,'+c2+' '+(h/2)+'px,'+c2+' '+h+'px)';anim='@keyframes stripes-zebra{from{background-position:0 0}to{background-position:0 '+h+'px}}\n.stripes{animation:stripes-zebra '+speed+'s linear infinite}'}
var css='.stripes{width:'+w+'px;height:'+h+'px;border-radius:6px;background:'+bg+';'+(anim?'':'')+'}\n'+anim;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','width','height','speed','color1','color2'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
