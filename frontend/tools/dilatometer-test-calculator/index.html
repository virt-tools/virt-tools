<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Dilatometer Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Dilatometer Test Calculator</h1>
<p>Calculate material index, horizontal stress index, and dilatometer modulus from DMT readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p0">P0 pressure</label><input type="text" id="in-p0" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-p1">P1 pressure</label><input type="text" id="in-p1" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-u">Pore pressure u0</label><input type="text" id="in-u" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">kPa</div></div>
<div class="field"><label class="f" for="in-sv">Effective vertical stress σv0'</label><input type="text" id="in-sv" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var p0E=document.getElementById("in-p0"),p1E=document.getElementById("in-p1"),uE=document.getElementById("in-u"),svE=document.getElementById("in-sv"),err=document.getElementById("err"),out=document.getElementById("out");
var PROMPT='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
function calc(){
var p0=parseFloat(p0E.value),p1=parseFloat(p1E.value),u=parseFloat(uE.value),sv=parseFloat(svE.value);
if(isNaN(p0)||isNaN(p1)||isNaN(u)){err.textContent="";out.innerHTML=PROMPT;return}
if(isNaN(sv)||sv<=0){err.textContent="Enter the effective vertical stress σv0' (a positive value in kPa).";out.innerHTML=PROMPT;return}
if(p0-u<=0){err.textContent="P0 must exceed the pore pressure u0 (ID and KD are undefined otherwise).";out.innerHTML=PROMPT;return}
err.textContent="";
var ID=(p1-p0)/(p0-u);
var KD=(p0-u)/sv;
var ED=34.7*(p1-p0);
var html='<div class="big">ID='+Math.round(ID*100)/100+'</div>';
html+=row("Material index ID",Math.round(ID*100)/100);
html+=row("Horizontal stress index KD",Math.round(KD*100)/100);
html+=row("Dilatometer modulus ED",Math.round(ED)+' kPa');
out.innerHTML=html;
}
[p0E,p1E,uE,svE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
