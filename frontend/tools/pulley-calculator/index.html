<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulley Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pulley Calculator</h1>
<p class="subtitle">Calculate pulley ratios, RPM, and belt length for two-pulley systems.</p>
<div class="input-section">
<label>Driver Pulley Diameter (inches)</label>
<input type="number" id="d1" value="6" min="0.5" step="0.125" aria-label="D1">
<label>Driven Pulley Diameter (inches)</label>
<input type="number" id="d2" value="3" min="0.5" step="0.125" aria-label="D2">
<label>Driver RPM</label>
<input type="number" id="rpm1" value="1750" min="1" aria-label="Rpm1">
<label>Center Distance (inches)</label>
<input type="number" id="center" value="12" min="1" step="0.125" aria-label="Center">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const D1=parseFloat(document.getElementById('d1').value)||0;
const D2=parseFloat(document.getElementById('d2').value)||0;
const R1=parseFloat(document.getElementById('rpm1').value)||0;
const C=parseFloat(document.getElementById('center').value)||0;
const ratio=D1/D2;
const rpm2=R1*ratio;
const beltLen=(Math.PI/2)*(D1+D2)+2*C+((D1-D2)**2)/(4*C);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Pulley Ratio:</span><span>${ratio.toFixed(3)}:1</span></div>
<div class="result-row"><span>Driven RPM:</span><span>${rpm2.toFixed(0)} rpm</span></div>
<div class="result-row"><span>Speed Change:</span><span>${(ratio>1?'Increase':'Decrease')} (${((ratio-1)*100).toFixed(1)}%)</span></div>
<div class="result-row"><span>Driver Pulley:</span><span>${D1}" @ ${R1} rpm</span></div>
<div class="result-row"><span>Driven Pulley:</span><span>${D2}" @ ${rpm2.toFixed(0)} rpm</span></div>
<div class="result-row"><span>Estimated Belt Length:</span><span>${beltLen.toFixed(1)}" (${(beltLen/12).toFixed(1)} ft)</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
