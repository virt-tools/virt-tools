<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Speech — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Text to Speech</h1>
<p class="subtitle">Read text aloud using the Web Speech API. Choose voice, rate, and pitch. 100% client-side.</p>
<div class="input-section">
<label>Text</label>
<textarea id="text" rows="6" placeholder="Type something to read aloud..." aria-label="Type Something To Read Aloud..."></textarea>
<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
<select id="voice" aria-label="Voice"></select>
<label>Rate: <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"></label>
<label>Pitch: <input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></label>
</div>
<button id="play" class="primary-btn" style="margin-top:8px;" type="button">Speak</button>
<button id="stop" style="margin-top:8px;" type="button">Stop</button>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const v=document.getElementById('voice');
const rate=document.getElementById('rate');
const pitch=document.getElementById('pitch');
function loadVoices(){
v.innerHTML='';
speechSynthesis.getVoices().forEach((voice,i)=>{
const opt=document.createElement('option');
opt.value=i;opt.textContent=voice.name+' ('+voice.lang+')';
v.appendChild(opt);
});
}
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;
document.getElementById('play').addEventListener('click',()=>{
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(document.getElementById('text').value);
const voices=speechSynthesis.getVoices();
if(voices.length)u.voice=voices[parseInt(v.value)];
u.rate=parseFloat(rate.value);u.pitch=parseFloat(pitch.value);
speechSynthesis.speak(u);
});
document.getElementById('stop').addEventListener('click',()=>speechSynthesis.cancel());
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
