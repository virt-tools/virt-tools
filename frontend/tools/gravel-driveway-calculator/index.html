<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gravel Driveway Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Gravel Driveway Calculator</h1>
<p>Estimate the volume and tonnage of gravel needed for a driveway from length, width, and depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Driveway length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-w">Driveway width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-d">Gravel depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter driveway dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value),WS=pn(wsEl.value);
if(L==null||W==null||D==null){return}
if(!isFinite(L)||!isFinite(W)||!isFinite(D)||L<=0||W<=0||D<=0){err.textContent="Dimensions must be positive.";return}
WS=WS==null?10:WS;
if(!isFinite(WS)||WS<0){err.textContent="Waste must be non-negative.";return}
err.textContent="";
var area=L*W;
var vol=area*D;
var totalVol=vol*(1+WS/100);
var tonnes=totalVol*1.5;
var html='<div class="big">'+rnd(tonnes,1)+' t</div>';
html+=row("Area",rnd(area,2)+" m²");
html+=row("Volume",rnd(vol,3)+" m³");
html+=row("With "+rnd(WS,0)+"% waste",rnd(totalVol,3)+" m³");
html+=row("Estimated tonnage",rnd(tonnes,1)+" t");
out.innerHTML=html;
}
[lEl,wEl,dEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
