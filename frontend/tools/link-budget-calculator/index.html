<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Link Budget Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Link Budget Calculator</h1>
<p>Calculate received signal strength from TX power, TX/RX antenna gain, and path loss. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-tx">TX power</label><input type="text" id="in-tx" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">dBm</div></div>
<div class="field"><label class="f" for="in-tg">TX antenna gain</label><input type="text" id="in-tg" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dBi</div></div>
<div class="field"><label class="f" for="in-rg">RX antenna gain</label><input type="text" id="in-rg" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dBi</div></div>
<div class="field"><label class="f" for="in-pl">Path loss</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">dB</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var txE=document.getElementById("in-tx"),tgE=document.getElementById("in-tg"),rgE=document.getElementById("in-rg"),plE=document.getElementById("in-pl"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var tx=parseFloat(txE.value),tg=parseFloat(tgE.value),rg=parseFloat(rgE.value),pl=parseFloat(plE.value);
err.textContent="";
if(isNaN(tx)||isNaN(tg)||isNaN(rg)||isNaN(pl)){reset();return}
if(!isFinite(tx)||!isFinite(tg)||!isFinite(rg)||!isFinite(pl)){err.textContent="Enter valid numeric values.";reset();return}
var rx=tx+tg+rg-pl;
var html='<div class="big">'+(Math.round(rx*100)/100)+' dBm</div>';
html+=row("Received power",Math.round(rx*100)/100+' dBm');
html+=row("EIRP",(tx+tg)+' dBm');
html+=row("Total gain",(tg+rg)+' dBi');
out.innerHTML=html;
}
[txE,tgE,rgE,plE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
