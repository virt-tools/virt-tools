<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Link Budget Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Link Budget Calculator</h1>
<p>Calculate received signal strength from TX power, TX/RX antenna gain, and path loss. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-tx">TX power</label><input type="text" id="in-tx" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">dBm</div></div>
<div class="field"><label class="f" for="in-tg">TX antenna gain</label><input type="text" id="in-tg" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dBi</div></div>
<div class="field"><label class="f" for="in-rg">RX antenna gain</label><input type="text" id="in-rg" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">dBi</div></div>
<div class="field"><label class="f" for="in-pl">Path loss</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">dB</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var txE=document.getElementById("in-tx"),tgE=document.getElementById("in-tg"),rgE=document.getElementById("in-rg"),plE=document.getElementById("in-pl"),out=document.getElementById("out");
function calc(){
var tx=parseFloat(txE.value),tg=parseFloat(tgE.value),rg=parseFloat(rgE.value),pl=parseFloat(plE.value);
if(isNaN(tx)||isNaN(tg)||isNaN(rg)||isNaN(pl))return;
var rx=tx+tg+rg-pl;
var html='<div class="big">'+(Math.round(rx*100)/100)+' dBm</div>';
html+=row("Received power",Math.round(rx*100)/100+' dBm');
html+=row("EIRP",(tx+tg)+' dBm');
html+=row("Total gain",(tg+rg)+' dBi');
out.innerHTML=html;
}
[txE,tgE,rgE,plE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
