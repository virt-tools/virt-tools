<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Lawn Topdress Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Lawn Topdress Calculator</h1>
<p>Calculate compost or topsoil needed for lawn topdressing from area and desired depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Lawn width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Lawn length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-depth">Depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),depthEl=document.getElementById("in-depth"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),Depth=pn(depthEl.value);
if(W==null||L==null||Depth==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(Depth)||W<=0||L<=0||Depth<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=W*L;
var cuFt=area*Depth/12;
var cuYd=cuFt/27;
var bags=Math.ceil(cuFt/1.5);
var tons=cuYd*0.8;
var html='<div class="big">'+rnd(cuYd,1)+' cu yd</div>';
html+=row("Lawn area",rnd(area,0)+' sq ft');
html+=row("Compost needed",rnd(cuFt,0)+' cu ft');
html+=row("In cubic yards",rnd(cuYd,1)+' cu yd');
html+=row("1.5 cu ft bags",rnd(bags,0)+' bags');
html+=row("Weight (est.)",rnd(tons,1)+' tons');
out.innerHTML=html;
}
[wEl,lEl,depthEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
