<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOML to JSON Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>TOML to JSON Converter</h1>
<p class="subtitle">Parse TOML and convert to JSON. Handles tables, arrays, inline tables, and basic types.</p>
<div class="input-section">
<label>TOML Input</label>
<textarea id="input" rows="8" placeholder='[owner]\nname = "Alice"\nage = 30' aria-label="[Owner]\Nname ="></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseTOML(text){
const result={};
let current=result;
const lines=text.split('\n');
for(let line of lines){
line=line.trim();
if(!line||line.startsWith('#'))continue;
if(line.startsWith('[')){
const tablePath=line.replace(/[\[\]]/g,'').split('.').map(s=>s.trim());
let obj=result;
for(const p of tablePath){obj[p]=obj[p]||{};obj=obj[p];}
current=obj;
continue;
}
const eqIdx=line.indexOf('=');
if(eqIdx===-1)continue;
const key=line.slice(0,eqIdx).trim().replace(/^"|"$/g,'');
let val=line.slice(eqIdx+1).trim();
if(val.startsWith('"')){val=val.match(/^"([^"]*)"/);current[key]=val?val[1]:'';}
else if(val.startsWith("'")){val=val.match(/^'([^']*)'/);current[key]=val?val[1]:'';}
else if(val==='true')current[key]=true;
else if(val==='false')current[key]=false;
else if(val.startsWith('[')){try{current[key]=JSON.parse(val.replace(/'/g,'"'));}catch(e){current[key]=[];}}
else if(!isNaN(val))current[key]=Number(val);
else current[key]=val;
}
return result;
}
document.getElementById('run').addEventListener('click',()=>{
try{
const data=parseTOML(document.getElementById('input').value);
document.getElementById('result').innerHTML='<textarea rows="12" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+JSON.stringify(data,null,2)+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red;">Error: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
