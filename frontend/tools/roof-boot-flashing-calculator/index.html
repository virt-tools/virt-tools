<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Roof Boot Flashing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Roof Boot Flashing Calculator</h1>
<p>Calculate roof boot flashing size from pipe diameter. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Pipe diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value);
if(D==null)return;
if(!isFinite(D)||D<=0){err.textContent="Enter a valid positive pipe diameter.";return}
err.textContent="";
var bootD=D+4;
var skirt=Math.max(8,bootD+2);
var area=Math.PI*skirt*skirt/4/144;
var html='<div class="big">'+rnd(skirt,0)+' in</div>';
html+=row("Pipe diameter",rnd(D,1)+" in");
html+=row("Boot opening",rnd(bootD,0)+" in");
html+=row("Skirt diameter",rnd(skirt,0)+" in");
html+=row("Flashing area",rnd(area,2)+" sq ft");
out.innerHTML=html;
}
[dEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
