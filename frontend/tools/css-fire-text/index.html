<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Fire Text Effect Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:3rem 2rem;background:#0a0a12;border-radius:12px;display:flex;justify-content:center;align-items:center;min-height:200px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔥 CSS Fire Text Effect Generator</h1>
<p>Create CSS fire/flame text animation effects. 4 presets, adjustable intensity/speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="classic" selected>Classic Fire</option><option value="inferno">Inferno</option><option value="embers">Embers</option><option value="blue">Blue Flame</option></select></div>
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="FIRE" style="width:200px"></div>
<div class="ctrl-row"><label>Font Size (px)</label><input type="number" id="fontSize" value="60" min="20" max="120" style="width:80px"></div>
<div class="ctrl-row"><label>Intensity</label><input type="range" id="intensity" min="1" max="20" value="8" style="width:150px"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var text=document.getElementById('text').value;
var fontSize=parseInt(document.getElementById('fontSize').value);
var intensity=parseInt(document.getElementById('intensity').value);
var speed=document.getElementById('speed').value;
var dur=speed==='slow'?'2s':speed==='fast'?'0.4s':'1s';
var c1,c2,c3;
if(preset==='classic'){c1='#ff0000';c2='#ff8800';c3='#ffff00'}
else if(preset==='inferno'){c1='#cc0000';c2='#ff4400';c3='#ffaa00'}
else if(preset==='embers'){c1='#aa0000';c2='#ff6600';c3='#ffcc00'}
else{c1='#0033cc';c2='#0066ff';c3='#00ccff'}
var html='<div class="fire-text">'+text+'</div>';
var css='.fire-text{font-family:"Arial Black",sans-serif;font-size:'+fontSize+'px;font-weight:900;color:'+c3+';text-shadow:0 0 '+intensity+'px '+c3+',0 0 '+(intensity*2)+'px '+c2+',0 0 '+(intensity*3)+'px '+c2+',0 0 '+(intensity*4)+'px '+c1+',0 0 '+(intensity*5)+'px '+c1+';animation:fire-flicker '+dur+' infinite alternate}\n@keyframes fire-flicker{0%,100%{text-shadow:0 0 '+intensity+'px '+c3+',0 0 '+(intensity*2)+'px '+c2+',0 0 '+(intensity*3)+'px '+c2+',0 0 '+(intensity*4)+'px '+c1+',0 0 '+(intensity*5)+'px '+c1+'}50%{text-shadow:0 0 '+(intensity*0.7)+'px '+c3+',0 0 '+(intensity*1.5)+'px '+c2+',0 0 '+(intensity*2.5)+'px '+c2+',0 0 '+(intensity*3.5)+'px '+c1+',0 0 '+(intensity*4.5)+'px '+c1+'}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','text','fontSize','intensity','speed'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
