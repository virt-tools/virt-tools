<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paver Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Paver Calculator</h1>
<p class="subtitle">Estimate pavers needed for patios and walkways with waste allowance.</p>
<div class="input-section">
<label>Patio Length (ft)</label>
<input type="number" id="len" value="20" min="0" aria-label="Len">
<label>Patio Width (ft)</label>
<input type="number" id="wid" value="15" min="0" aria-label="Wid">
<label>Paver Length (in)</label>
<input type="number" id="plen" value="8" min="1" aria-label="Plen">
<label>Paver Width (in)</label>
<input type="number" id="pwid" value="4" min="1" aria-label="Pwid">
<label>Waste (%)</label>
<input type="number" id="waste" value="10" min="0" max="50" aria-label="Waste">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const pl=parseFloat(document.getElementById('plen').value)||0;
const pw=parseFloat(document.getElementById('pwid').value)||0;
const ws=parseFloat(document.getElementById('waste').value)||0;
const area=L*W;
const paverArea=(pl/12)*(pw/12);
const needed=area/paverArea;
const total=Math.ceil(needed*(1+ws/100));
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Patio Area:</span><span>${area.toFixed(1)} sq ft</span></div>
<div class="result-row"><span>Paver Area:</span><span>${paverArea.toFixed(3)} sq ft</span></div>
<div class="result-row"><span>Pavers Needed:</span><span>${Math.ceil(needed)}</span></div>
<div class="result-row"><span>With ${ws}% Waste:</span><span>${total} pavers</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
