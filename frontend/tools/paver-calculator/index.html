<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme-init.js"></script>
  <title>Paver Calculator — Virtual Tools</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
    label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
    .field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
    .field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
    .field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
    .field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
    .out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
    .out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
    .out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
    .out .row:last-child{border-bottom:none}
    .out .row .k{color:var(--text-dim,#9aa3b2)}
    .out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
    .err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="tool-header">
      <a class="back" href="/">← All tools</a>
      <h1>Paver Calculator</h1>
      <p>Estimate pavers needed for patios and walkways with adjustable waste allowance. Runs locally in your browser.</p>
    </div>
    <div class="panel">
      <div class="grid2">
        <div class="field"><label class="f" for="in-al">Area length</label><input type="text" id="in-al" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">m</div></div>
        <div class="field"><label class="f" for="in-aw">Area width</label><input type="text" id="in-aw" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">m</div></div>
        <div class="field"><label class="f" for="in-pl">Paver length</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.2"><div class="unit">m</div></div>
        <div class="field"><label class="f" for="in-pw">Paver width</label><input type="text" id="in-pw" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">m</div></div>
        <div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">% extra</div></div>
      </div>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
      <div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter dimensions to estimate pavers.</span></div>
      <p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
    </div>
  </main>
  <script src="/assets/app.js"></script>
  <script>
  (function(){
    function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
    function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
    function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
    var alEl=document.getElementById("in-al"),awEl=document.getElementById("in-aw"),plEl=document.getElementById("in-pl"),pwEl=document.getElementById("in-pw"),wEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
    function calc(){
      var AL=pn(alEl.value),AW=pn(awEl.value),PL=pn(plEl.value),PW=pn(pwEl.value),WS=pn(wEl.value);
      if(AL==null||AW==null){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter area dimensions.</span>';err.textContent="";return}
      if(!isFinite(AL)||!isFinite(AW)||AL<=0||AW<=0){err.textContent="Area must be positive.";return}
      if(PL==null||PW==null){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter paver dimensions.</span>';return}
      if(!isFinite(PL)||!isFinite(PW)||PL<=0||PW<=0){err.textContent="Paver size must be positive.";return}
      WS=WS==null?10:WS;
      if(!isFinite(WS)||WS<0){err.textContent="Waste must be non-negative.";return}
      err.textContent="";
      var area=AL*AW;
      var paverArea=PL*PW;
      var baseCount=Math.ceil(area/paverArea);
      var total=Math.ceil(baseCount*(1+WS/100));
      var html='<div class="big">'+total+' pavers</div>';
      html+=row("Area",rnd(area,2)+" m²");
      html+=row("Paver size",PL+" × "+PW+" m");
      html+=row("Base count",baseCount);
      html+=row("With "+rnd(WS,0)+"% waste",total+" pavers");
      out.innerHTML=html;
    }
    [alEl,awEl,plEl,pwEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
    calc();
  })();
  </script>
</body>
</html>
