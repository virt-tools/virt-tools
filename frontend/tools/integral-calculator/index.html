<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integral Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Numerical Integral Calculator</h1>
<p class="subtitle">Estimate definite integrals using Simpson's rule with n subdivisions.</p>
<div class="input-section">
<label>f(x) =</label>
<input type="text" id="expr" value="x^2" style="width:100%;font-family:monospace" aria-label="Expr">
<label>From a =</label>
<input type="number" id="a" value="0" step="any" aria-label="A">
<label>To b =</label>
<input type="number" id="b" value="1" step="any" aria-label="B">
<label>Subdivisions (n, even)</label>
<input type="number" id="n" value="1000" min="2" step="2" aria-label="N">
<button id="calc" class="primary-btn" type="button">Calculate Integral</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function evalExpr(expr,x){
try{expr=expr.replace(/\^/g,'**').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/exp\(/g,'Math.exp(').replace(/pi/g,'Math.PI');return Function('"use strict";x=arguments[0];return '+expr)(x);}catch(e){return NaN;}}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const a=parseFloat(document.getElementById('a').value)||0;
const b=parseFloat(document.getElementById('b').value)||0;
let n=parseInt(document.getElementById('n').value)||100;
if(n%2!==0)n++;
const h=(b-a)/n;
let sum=evalExpr(expr,a)+evalExpr(expr,b);
for(let i=1;i<n;i++){
const x=a+i*h;
sum+=(i%2===0?2:4)*evalExpr(expr,x);
}
const integral=(h/3)*sum;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>∫ from ${a} to ${b} of ${expr} dx</span><span></span></div>
<div class="result-row"><span>Method:</span><span>Simpson's Rule</span></div>
<div class="result-row"><span>Subdivisions:</span><span>${n}</span></div>
<div class="result-row"><span>Step size (h):</span><span>${h.toExponential(4)}</span></div>
<div class="result-row"><span>Result:</span><span>${integral.toFixed(10)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
