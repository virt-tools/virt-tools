<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integral Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Numerical Integral Calculator</h1>
<p class="subtitle">Estimate definite integrals using Simpson's rule with n subdivisions.</p>
<div class="input-section">
<label>f(x) =</label>
<input type="text" id="expr" value="x^2" style="width:100%;font-family:monospace" aria-label="Expr">
<label>From a =</label>
<input type="number" id="a" value="0" step="any" aria-label="A">
<label>To b =</label>
<input type="number" id="b" value="1" step="any" aria-label="B">
<label>Subdivisions (n, even)</label>
<input type="number" id="n" value="1000" min="2" step="2" aria-label="N">
<button id="calc" class="primary-btn" type="button">Calculate Integral</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script src="/assets/math-expression.js"></script>
<script>
function finiteInput(id,label){const raw=document.getElementById(id).value.trim(),value=Number(raw);if(!raw||!Number.isFinite(value))throw new Error(label+' must be a finite number.');return value;}
function subdivisions(){const value=finiteInput('n','Subdivisions');if(!Number.isInteger(value)||value<2||value>100000)throw new Error('Subdivisions must be an integer from 2 to 100,000.');return value%2?value+1:value;}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const result=document.getElementById('result');
try{
const a=finiteInput('a','Lower bound'),b=finiteInput('b','Upper bound'),n=subdivisions();
const evaluator=VTMathExpression.compile(expr,['x']);
const h=(b-a)/n;
let sum=evaluator({x:a})+evaluator({x:b});
for(let i=1;i<n;i++){
const x=a+i*h;
sum+=(i%2===0?2:4)*evaluator({x});
}
const integral=(h/3)*sum;
if(!Number.isFinite(integral))throw new Error('Expression produced a non-finite result in the interval.');
result.innerHTML=`
<div class="result-row"><span>Integral from ${a} to ${b}</span><span></span></div>
<div class="result-row"><span>Method:</span><span>Simpson's Rule</span></div>
<div class="result-row"><span>Subdivisions:</span><span>${n}</span></div>
<div class="result-row"><span>Step size (h):</span><span>${h.toExponential(4)}</span></div>
<div class="result-row"><span>Result:</span><span>${integral.toFixed(10)}</span></div>`;
}catch(e){result.textContent='Error: '+e.message;}
result.style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
