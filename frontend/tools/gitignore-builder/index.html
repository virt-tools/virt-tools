<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/assets/theme-init.js"></script>
  <title>.gitignore Builder — Virtual Tools</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .builder-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,1.15fr);gap:20px;align-items:start}.template-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:420px;overflow:auto;padding:4px}.template-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.template-item input{margin-top:3px;flex:0 0 auto}.template-item label{cursor:pointer;line-height:1.25}.template-item small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.preview{min-height:430px;max-height:650px;overflow:auto;white-space:pre;tab-size:2;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.count{color:var(--muted);font-size:.9rem}.warning{padding:10px 12px;border-left:4px solid #d97706;background:color-mix(in srgb,#d97706 12%,var(--surface));border-radius:6px}.hidden{display:none!important}@media(max-width:800px){.builder-grid{grid-template-columns:1fr}.template-list{grid-template-columns:1fr;max-height:360px}.preview{min-height:300px}}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="tool-header">
      <a class="back" href="/">← All tools</a>
      <h1>.gitignore Builder</h1>
      <p>Combine curated templates with your own rules. Everything runs locally in your browser.</p>
    </div>

    <div class="builder-grid">
      <section class="panel" aria-labelledby="templates-heading">
        <h2 id="templates-heading">Choose templates</h2>
        <div class="field">
          <label for="search">Search templates</label>
          <input id="search" type="search" placeholder="Try Python, macOS, JetBrains…" autocomplete="off" maxlength="80">
        </div>
        <div class="actions">
          <button id="select-common" type="button" class="secondary">Select common</button>
          <button id="clear-selection" type="button" class="secondary">Clear selection</button>
          <span id="selection-count" class="count" aria-live="polite">0 selected</span>
        </div>
        <div class="spacer"></div>
        <div id="template-list" class="template-list" role="group" aria-label="Gitignore templates"></div>
        <p id="no-results" class="note hidden">No templates match your search.</p>

        <div class="spacer"></div>
        <div class="field">
          <label for="custom">Custom patterns <span class="count">(one per line, max 300)</span></label>
          <textarea id="custom" rows="8" maxlength="12000" spellcheck="false" placeholder="# Project-specific files&#10;.env.local&#10;!/example.env"></textarea>
          <p class="note">Rules stay in the order entered. Blank lines and comments are preserved.</p>
        </div>
        <div id="warnings" class="warning hidden" role="alert"></div>
      </section>

      <section class="panel" aria-labelledby="preview-heading">
        <div class="row" style="justify-content:space-between;align-items:center">
          <h2 id="preview-heading" style="margin:0">Preview</h2>
          <span id="line-count" class="count">0 lines</span>
        </div>
        <pre id="preview" class="output preview" tabindex="0" aria-label="Generated gitignore file"></pre>
        <div class="spacer"></div>
        <div class="actions">
          <button id="copy" type="button">Copy</button>
          <button id="download" type="button" class="secondary">Download .gitignore</button>
          <button id="reset" type="button" class="secondary">Reset</button>
        </div>
        <p id="status" class="note" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
  (function () {
    "use strict";
    var templates = [
      {id:"windows",name:"Windows",group:"OS",common:true,lines:["Thumbs.db","Thumbs.db:encryptable","ehthumbs.db","Desktop.ini","$RECYCLE.BIN/","*.lnk"]},
      {id:"macos",name:"macOS",group:"OS",common:true,lines:[".DS_Store",".AppleDouble",".LSOverride","Icon?","._*",".Spotlight-V100",".Trashes"]},
      {id:"linux",name:"Linux",group:"OS",lines:["*~",".fuse_hidden*",".directory",".Trash-*",".nfs*"]},
      {id:"vscode",name:"Visual Studio Code",group:"Editor",common:true,lines:[".vscode/*","!.vscode/settings.json","!.vscode/tasks.json","!.vscode/launch.json","!.vscode/extensions.json","*.code-workspace"]},
      {id:"jetbrains",name:"JetBrains IDEs",group:"Editor",lines:[".idea/","*.iml","*.ipr","*.iws","out/"]},
      {id:"vim",name:"Vim",group:"Editor",lines:["[._]*.s[a-v][a-z]","[._]*.sw[a-p]","[._]s[a-rt-v][a-z]","[._]ss[a-gi-z]","[._]sw[a-p]","Session.vim",".netrwhist","*~"]},
      {id:"emacs",name:"Emacs",group:"Editor",lines:["*~","\\#*\\#","/.emacs.desktop","/.emacs.desktop.lock","*.elc","auto-save-list/",".projectile"]},
      {id:"node",name:"Node.js",group:"Language",common:true,lines:["node_modules/","npm-debug.log*","yarn-debug.log*","yarn-error.log*","pnpm-debug.log*",".npm/",".yarn/cache/",".yarn/unplugged/",".pnp.*","coverage/","dist/",".env",".env.*","!.env.example"]},
      {id:"python",name:"Python",group:"Language",lines:["__pycache__/","*.py[cod]","*$py.class","*.so",".Python","build/","dist/","*.egg-info/",".venv/","venv/",".pytest_cache/",".mypy_cache/",".coverage","htmlcov/",".env"]},
      {id:"java",name:"Java",group:"Language",lines:["*.class","*.jar","*.war","*.ear","hs_err_pid*","replay_pid*","target/",".gradle/","build/"]},
      {id:"dotnet",name:".NET / C#",group:"Language",lines:["[Bb]in/","[Oo]bj/","[Ll]og/","*.user","*.suo","*.userosscache","*.sln.docstates",".vs/","TestResults/","packages/"]},
      {id:"go",name:"Go",group:"Language",lines:["*.exe","*.exe~","*.dll","*.so","*.dylib","*.test","*.out","go.work"]},
      {id:"rust",name:"Rust",group:"Language",lines:["target/","Cargo.lock","**/*.rs.bk"]},
      {id:"ruby",name:"Ruby",group:"Language",lines:["*.gem","*.rbc","/.config","/coverage/","/InstalledFiles","/pkg/","/spec/reports/","/tmp/",".bundle/","vendor/bundle",".ruby-version",".env"]},
      {id:"php",name:"PHP / Composer",group:"Language",lines:["vendor/","composer.phar",".phpunit.result.cache",".phpunit.cache/",".env","auth.json"]},
      {id:"swift",name:"Swift",group:"Language",lines:[".build/","DerivedData/","*.xcworkspace/xcuserdata/","*.xcodeproj/xcuserdata/","*.xcuserstate",".swiftpm/"]},
      {id:"flutter",name:"Dart / Flutter",group:"Framework",lines:[".dart_tool/",".packages","build/",".flutter-plugins",".flutter-plugins-dependencies",".pub-cache/",".pub/","*.lock"]},
      {id:"next",name:"Next.js",group:"Framework",lines:[".next/","out/",".vercel/","next-env.d.ts","*.tsbuildinfo"]},
      {id:"vue",name:"Vue / Vite",group:"Framework",lines:["node_modules/","dist/","dist-ssr/","*.local",".vite/",".env",".env.*","!.env.example"]},
      {id:"angular",name:"Angular",group:"Framework",lines:["/.angular/cache","/dist","/tmp","/out-tsc","/bazel-out","node_modules/","npm-debug.log",".env"]},
      {id:"reactnative",name:"React Native",group:"Framework",lines:["node_modules/","*.jsbundle","ios/Pods/","ios/build/","android/.gradle/","android/app/build/","*.keystore","!debug.keystore"]},
      {id:"unity",name:"Unity",group:"Engine",lines:["/[Ll]ibrary/","/[Tt]emp/","/[Oo]bj/","/[Bb]uild/","/[Bb]uilds/","/[Ll]ogs/","/[Uu]ser[Ss]ettings/","*.csproj","*.sln","*.user"]},
      {id:"unreal",name:"Unreal Engine",group:"Engine",lines:["Binaries/","DerivedDataCache/","Intermediate/","Saved/",".vs/","*.VC.db","*.sln"]},
      {id:"terraform",name:"Terraform",group:"DevOps",lines:["**/.terraform/*","*.tfstate","*.tfstate.*","crash.log","crash.*.log","*.tfvars","*.tfvars.json","override.tf","override.tf.json","*_override.tf","*_override.tf.json",".terraformrc","terraform.rc"]},
      {id:"docker",name:"Docker projects",group:"DevOps",lines:[".dockerignore","docker-compose.override.yml","*.pid","*.log",".env",".env.*","!.env.example"]},
      {id:"logs",name:"Logs & runtime",group:"General",common:true,lines:["logs/","*.log","*.pid","*.seed","*.pid.lock","pids/","*.stackdump"]},
      {id:"archives",name:"Archives",group:"General",lines:["*.7z","*.gz","*.rar","*.tar","*.zip"]},
      {id:"secrets",name:"Secrets & credentials",group:"Security",common:true,lines:[".env",".env.*","!.env.example","*.pem","*.key","*.p12","*.pfx","credentials.json","secrets.yml",".secrets/"]}
    ];
    var selected = new Set();
    var list = document.getElementById("template-list");
    var search = document.getElementById("search");
    var custom = document.getElementById("custom");
    var preview = document.getElementById("preview");
    var status = document.getElementById("status");
    var warnings = document.getElementById("warnings");

    function renderList() {
      var query = search.value.trim().toLowerCase();
      list.textContent = "";
      var shown = 0;
      templates.forEach(function (item) {
        if (query && (item.name + " " + item.group).toLowerCase().indexOf(query) < 0) return;
        shown++;
        var box = document.createElement("div"); box.className = "template-item";
        var input = document.createElement("input"); input.type = "checkbox"; input.id = "tpl-" + item.id; input.checked = selected.has(item.id);
        var label = document.createElement("label"); label.htmlFor = input.id; label.appendChild(document.createTextNode(item.name));
        var small = document.createElement("small"); small.textContent = item.group + " · " + item.lines.length + " rules"; label.appendChild(small);
        input.addEventListener("change", function () { if (input.checked) selected.add(item.id); else selected.delete(item.id); build(); });
        box.appendChild(input); box.appendChild(label); list.appendChild(box);
      });
      document.getElementById("no-results").classList.toggle("hidden", shown !== 0);
    }

    function safeCustomLines() {
      return custom.value.replace(/\r/g, "").split("\n").slice(0, 300).map(function (line) { return line.slice(0, 500); });
    }

    function dedupeAdjacent(lines) {
      var out = [];
      lines.forEach(function (line) { if (!out.length || line !== out[out.length - 1]) out.push(line); });
      return out;
    }

    function build() {
      var sections = [];
      templates.forEach(function (item) {
        if (!selected.has(item.id)) return;
        sections.push(["# " + item.name].concat(dedupeAdjacent(item.lines)).join("\n"));
      });
      var customLines = safeCustomLines();
      while (customLines.length && !customLines[customLines.length - 1]) customLines.pop();
      if (customLines.some(function (line) { return line.length; })) sections.push(["# Custom rules"].concat(dedupeAdjacent(customLines)).join("\n"));
      var output = sections.join("\n\n");
      if (output) output += "\n";
      preview.textContent = output;
      var lineCount = output ? output.replace(/\n$/, "").split("\n").length : 0;
      document.getElementById("line-count").textContent = lineCount + (lineCount === 1 ? " line" : " lines");
      document.getElementById("selection-count").textContent = selected.size + " selected";
      showWarnings(customLines);
      status.textContent = "";
    }

    function showWarnings(lines) {
      var risks = [];
      lines.forEach(function (raw) {
        var line = raw.trim();
        if (!line || line.charAt(0) === "#" || line.charAt(0) === "!") return;
        if (["*","**","/*","/**","/"].indexOf(line) >= 0) risks.push("a rule that can ignore nearly the entire repository (" + line + ")");
        if (/^(\.env\.example|example\.env|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Cargo\.lock)$/.test(line)) risks.push("a commonly committed reproducibility/example file (" + line + ")");
      });
      if (selected.has("secrets")) risks.push("credential patterns; already-tracked secrets must still be removed from Git and rotated");
      var unique = risks.filter(function (value, index, all) { return all.indexOf(value) === index; }).slice(0, 5);
      warnings.textContent = unique.length ? "Review before saving: " + unique.join("; ") + "." : "";
      warnings.classList.toggle("hidden", !unique.length);
    }

    function copyText() {
      var text = preview.textContent;
      if (!text) { status.textContent = "Choose a template or add a custom rule first."; return; }
      function done() { status.textContent = "Copied .gitignore to the clipboard."; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallbackCopy);
      else fallbackCopy();
      function fallbackCopy() {
        var area = document.createElement("textarea"); area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
        document.body.appendChild(area); area.select();
        try { if (document.execCommand("copy")) done(); else status.textContent = "Copy failed. Select the preview and copy it manually."; }
        catch (error) { status.textContent = "Copy failed. Select the preview and copy it manually."; }
        area.remove();
      }
    }

    search.addEventListener("input", renderList);
    custom.addEventListener("input", build);
    document.getElementById("select-common").addEventListener("click", function () { templates.forEach(function (item) { if (item.common) selected.add(item.id); }); renderList(); build(); });
    document.getElementById("clear-selection").addEventListener("click", function () { selected.clear(); renderList(); build(); });
    document.getElementById("copy").addEventListener("click", copyText);
    document.getElementById("download").addEventListener("click", function () {
      var text = preview.textContent;
      if (!text) { status.textContent = "Choose a template or add a custom rule first."; return; }
      var url = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
      var link = document.createElement("a"); link.href = url; link.download = ".gitignore"; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
      status.textContent = "Downloaded .gitignore.";
    });
    document.getElementById("reset").addEventListener("click", function () { selected.clear(); custom.value = ""; search.value = ""; renderList(); build(); search.focus(); });
    renderList(); build();
  }());
  </script>
</body>
</html>
