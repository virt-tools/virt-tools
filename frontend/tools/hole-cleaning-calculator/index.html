<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hole Cleaning Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hole Cleaning Calculator</h1>
<p>Estimate hole cleaning efficiency from annular velocity, cuttings concentration, and ROP. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-av">Annular velocity</label><input type="text" id="in-av" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">ft/min</div></div>
<div class="field"><label class="f" for="in-cc">Cuttings concentration</label><input type="text" id="in-cc" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-rop">ROP</label><input type="text" id="in-rop" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft/hr</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var avE=document.getElementById("in-av"),ccE=document.getElementById("in-cc"),ropE=document.getElementById("in-rop"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var av=parseFloat(avE.value),cc=parseFloat(ccE.value),rop=parseFloat(ropE.value);
if(isNaN(av)||isNaN(cc)||isNaN(rop))return;
err.textContent="";
var efficiency=Math.min(100,(av/(rop*0.5+50))*100);
var rating=efficiency>=80?"Good":efficiency>=50?"Fair":"Poor";
var html='<div class="big">'+Math.round(efficiency)+'%</div>';
html+=row("Cleaning efficiency",Math.round(efficiency)+'%');
html+=row("Rating",rating);
html+=row("Annular velocity",av+' ft/min');
out.innerHTML=html;
}
[avE,ccE,ropE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
