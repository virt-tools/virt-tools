<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Mood Ring Indicator Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:180px;display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>😌 CSS Mood Ring Indicator Generator</h1>
<p>Create CSS mood/emotion ring indicators with color transitions. 8 moods, 3 styles, adjustable size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Mood</label><select id="mood"><option value="happy" selected>Happy 😊</option><option value="calm">Calm 😌</option><option value="excited">Excited 🤩</option><option value="sad">Sad 😢</option><option value="angry">Angry 😠</option><option value="love">Love ❤️</option><option value="tired">Tired 😴</option><option value="neutral">Neutral 😐</option></select></div>
<div class="ctrl-row"><label>Style</label><select id="style"><option value="ring" selected>Ring</option><option value="emoji">Emoji Circle</option><option value="gradient">Gradient Ring</option></select></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option></select></div>
<div class="ctrl-row"><label>Animated</label><input type="checkbox" id="animated" checked></div>
<div class="ctrl-row"><label>Label</label><input type="text" id="label" value="Happy" style="width:200px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var moods={happy:{color:'#ffdd44',emoji:'😊',glow:'rgba(255,221,68,.5)'},calm:{color:'#44ddff',emoji:'😌',glow:'rgba(68,221,255,.5)'},excited:{color:'#ff66aa',emoji:'🤩',glow:'rgba(255,102,170,.5)'},sad:{color:'#5588cc',emoji:'😢',glow:'rgba(85,136,204,.5)'},angry:{color:'#ff4444',emoji:'😠',glow:'rgba(255,68,68,.5)'},love:{color:'#ff6699',emoji:'❤️',glow:'rgba(255,102,153,.5)'},tired:{color:'#aa88cc',emoji:'😴',glow:'rgba(170,136,204,.5)'},neutral:{color:'#aaa',emoji:'😐',glow:'rgba(170,170,170,.5)'}};
function update(){
var moodKey=document.getElementById('mood').value;
var mood=moods[moodKey];
var style=document.getElementById('style').value;
var size=document.getElementById('size').value;
var animated=document.getElementById('animated').checked;
var label=document.getElementById('label').value;
var sz={sm:60,md:100,lg:140}[size];
var html='',css='';
if(style==='ring'){
html='<div class="mood-ring '+moodKey+'">\n  <div class="mood-ring-inner"></div>\n</div>'+(label?'<div class="mood-label">'+label+'</div>':'');
css='.mood-ring{width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+mood.color+';display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px '+mood.glow+'';
if(animated)css+=';animation:mood-pulse 2s ease-in-out infinite';
css+='}\n.mood-ring-inner{width:60%;height:60%;border-radius:50%;background:rgba(255,255,255,.15)}\n.mood-label{text-align:center;margin-top:10px;font-weight:bold;color:'+mood.color+';font-size:'+Math.round(sz*0.15)+'px}\n';
if(animated)css+='@keyframes mood-pulse{0%,100%{transform:scale(1);box-shadow:0 0 30px '+mood.glow+'}50%{transform:scale(1.05);box-shadow:0 0 50px '+mood.glow+'}}\n';
}else if(style==='emoji'){
html='<div class="mood-emoji-circle '+moodKey+'">'+mood.emoji+'</div>'+(label?'<div class="mood-label">'+label+'</div>':'');
css='.mood-emoji-circle{width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+mood.color+';display:flex;align-items:center;justify-content:center;font-size:'+Math.round(sz*0.5)+'px;box-shadow:0 0 30px '+mood.glow;
if(animated)css+=';animation:mood-pulse 2s ease-in-out infinite';
css+='}\n.mood-label{text-align:center;margin-top:10px;font-weight:bold;color:'+mood.color+';font-size:'+Math.round(sz*0.15)+'px}\n';
if(animated)css+='@keyframes mood-pulse{0%,100%{transform:scale(1);box-shadow:0 0 30px '+mood.glow+'}50%{transform:scale(1.05);box-shadow:0 0 50px '+mood.glow+'}}\n';
}else if(style==='gradient'){
html='<div class="mood-gradient-ring '+moodKey+'">\n  <div class="mgr-inner">'+mood.emoji+'</div>\n</div>'+(label?'<div class="mood-label">'+label+'</div>':'');
css='.mood-gradient-ring{width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:conic-gradient(from 0deg,'+mood.color+',rgba(255,255,255,.3),'+mood.color+');display:flex;align-items:center;justify-content:center;padding:4px';
if(animated)css+=';animation:mood-rotate 4s linear infinite';
css+='}\n.mgr-inner{width:80%;height:80%;border-radius:50%;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:'+Math.round(sz*0.3)+'px}\n.mood-label{text-align:center;margin-top:10px;font-weight:bold;color:'+mood.color+';font-size:'+Math.round(sz*0.15)+'px}\n';
if(animated)css+='@keyframes mood-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style><div style="display:flex;flex-direction:column;align-items:center">'+html+'</div>';
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['mood','style','size','animated','label'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
