<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Annular Velocity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Annular Velocity Calculator</h1>
<p>Calculate annular velocity and circulation time from flow rate, hole diameter, and pipe OD. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-q">Flow rate</label><input type="text" id="in-q" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">gpm</div></div>
<div class="field"><label class="f" for="in-dh">Hole diameter</label><input type="text" id="in-dh" inputmode="decimal" autocomplete="off" placeholder="e.g. 8.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-dp">Pipe OD</label><input type="text" id="in-dp" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-tvd">Well depth</label><input type="text" id="in-tvd" inputmode="decimal" autocomplete="off" placeholder="e.g. 8000"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var qE=document.getElementById("in-q"),dhE=document.getElementById("in-dh"),dpE=document.getElementById("in-dp"),tvdE=document.getElementById("in-tvd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var q=parseFloat(qE.value),dh=parseFloat(dhE.value),dp=parseFloat(dpE.value),tvd=parseFloat(tvdE.value);
if(isNaN(q)||isNaN(dh)||isNaN(dp))return;
if(dh<=dp){err.textContent="Hole diameter must exceed pipe OD.";return}
err.textContent="";
var annularArea=0.7854*(dh*dh-dp*dp);
var av=q*24.5/annularArea;
var html='<div class="big">'+Math.round(av*10)/10+' ft/min</div>';
html+=row("Annular velocity",Math.round(av*10)/10+' ft/min');
html+=row("Annular area",Math.round(annularArea*100)/100+' in²');
if(!isNaN(tvd)&&av>0){
var cycTime=tvd/av;
html+=row("Bottoms-up time",Math.round(cycTime)+' min');
}
out.innerHTML=html;
}
[qE,dhE,dpE,tvdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
