<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Screw Pullout Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Screw Pullout Calculator</h1>
<p>Estimate pullout resistance of a wood screw based on root diameter, thread engagement, and wood specific gravity. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Root diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-l">Thread engagement</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-g">Specific gravity</label><input type="text" id="in-g" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">G</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter root diameter.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),gEl=document.getElementById("in-g"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),L=pn(lEl.value),G=pn(gEl.value);
if(D==null){return}
L=L==null?25:L;G=G==null?0.5:G;
if(!isFinite(D)||!isFinite(L)||!isFinite(G)||D<=0||L<=0||G<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var W=92*Math.pow(G,2)*D*L/25.4*4.448;
var html='<div class="big">'+rnd(W,1)+' N</div>';
html+=row("Root diameter",rnd(D,2)+" mm");
html+=row("Thread engagement",rnd(L,0)+" mm");
html+=row("Specific gravity",rnd(G,2));
html+=row("Pullout resistance",rnd(W,1)+" N");
out.innerHTML=html;
}
[dEl,lEl,gEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
