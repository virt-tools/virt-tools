<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Security Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Social Security Calculator</h1>
<div class="calc-wrap">
<h2>Social Security Benefits Calculator 🇺🇸</h2>
<p>Estimate monthly Social Security benefits based on 35 highest-earning years.</p>
<div class="input-group">
<label>Average annual earnings (35 best years, $)</label>
<input type="number" id="earnings" value="60000" min="0" aria-label="Earnings">
</div>
<div class="input-group">
<label>Retirement age</label>
<input type="number" id="retireAge" value="67" min="62" max="70" aria-label="Retire Age">
</div>
<div class="input-group">
<label>Full retirement age</label>
<input type="number" id="fra" value="67" min="65" max="67" step="0.1" aria-label="Fra">
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const earnings=v('earnings'),retireAge=v('retireAge'),fra=v('fra');
  const awi=60000;
  const monthlyEarnings=earnings/12;
  const pia=Math.min(monthlyEarnings*0.9,826)+Math.max(0,Math.min(monthlyEarnings,4980)-826)*0.32+Math.max(0,monthlyEarnings-4980)*0.15;
  let benefit= pia;
  const diff=retireAge-fra;
  if(diff<0){const months=Math.round(Math.abs(diff)*12);const penalty=months*(5/900);benefit=pia*(1-penalty)}
  else if(diff>0){const months=Math.round(diff*12);benefit=pia*(1+months*(8/900))}
  const annual=benefit*12;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Estimated Social Security</h3>'+
    '<div class="result-row"><span>AIME (monthly indexed earnings)</span><span>$'+monthlyEarnings.toLocaleString(undefined,{maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>PIA (full retirement benefit)</span><span>$'+pia.toLocaleString(undefined,{maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Age adjustment</span><span>'+(diff<0?'Penalty':diff>0?'Bonus':'None')+'</span></div>'+
    '<div class="result-row"><span>Monthly benefit</span><span>$'+benefit.toLocaleString(undefined,{maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Annual benefit</span><span>$'+annual.toLocaleString(undefined,{maximumFractionDigits:2})+'</span></div>'+
    '<p style="font-size:.8rem;color:var(--text-muted);margin-top:1rem">Simplified estimate. Actual SSA uses 35 years of indexed earnings.</p>';
}
</script>
</body>
</html>
