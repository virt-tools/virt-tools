<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Gravitational Force — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.note{color:var(--text-dim,#9aa3b2);font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">&#8592; All tools</a>
<h1>Gravitational Force</h1>
<p>Newtonian gravitational attraction between two masses separated by a distance.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-m1">Mass 1</label><input type="text" id="in-m1" inputmode="decimal" autocomplete="off" placeholder="e.g. 5.972e24"><div class="unit">kg</div></div>
<div class="field"><label class="f" for="in-m2">Mass 2</label><input type="text" id="in-m2" inputmode="decimal" autocomplete="off" placeholder="e.g. 7.342e22"><div class="unit">kg</div></div>
<div class="field"><label class="f" for="in-r">Distance</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 3.844e8"><div class="unit">m</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">F = G m1m2/r².</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function fmt(x){if(typeof x==='boolean')return x?'Yes':'No';if(!isFinite(x))return '—';var r=Math.round(x*1e6)/1e6;return ''+r;}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
var m1E=document.getElementById('in-m1');var m2E=document.getElementById('in-m2');var rE=document.getElementById('in-r');var out=document.getElementById('out');
function calc(){
var m1=parseFloat(m1E.value);var m2=parseFloat(m2E.value);var r=parseFloat(rE.value);
if([m1,m2,r].some(function(v){return isNaN(v);})){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return;}
var r0=6.674e-11*m1*m2/(r*r);
var html='<div class="big">'+fmt(r0)+" N"+'</div>';

out.innerHTML=html;
}
[m1E,m2E,rE].forEach(function(el){el.addEventListener('input',calc)});
calc();
})();
</script>
</body>
</html>
