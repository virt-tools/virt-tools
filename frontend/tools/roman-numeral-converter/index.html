<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Numeral Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Roman Numeral Converter</h1>
<p class="subtitle">Convert between Arabic numbers and Roman numerals (1–3999).</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="toRoman" selected>Number → Roman</option>
<option value="fromRoman">Roman → Number</option>
</select>
<div id="numInput">
<label>Number (1–3999)</label>
<input type="number" id="number" value="2024" min="1" max="3999" aria-label="Number">
</div>
<div id="romanInput" style="display:none">
<label>Roman Numeral</label>
<input type="text" id="roman" value="MMXXIV" maxlength="15" aria-label="Roman">
</div>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const VALS=[['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
function toRoman(n){
let r='';
for(const[s,v]of VALS){while(n>=v){r+=s;n-=v;}}
return r;
}
function fromRoman(str){
str=str.toUpperCase();
let total=0,i=0;
for(const[s,v]of VALS){while(str.substr(i,s.length)===s){total+=v;i+=s.length;}}
return total;
}
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{
document.getElementById('numInput').style.display=mode.value==='toRoman'?'':'none';
document.getElementById('romanInput').style.display=mode.value==='fromRoman'?'':'none';
});
document.getElementById('calc').addEventListener('click',()=>{
if(mode.value==='toRoman'){
const n=parseInt(document.getElementById('number').value)||0;
if(n<1||n>3999){document.getElementById('result').innerHTML='<p class="warning">Enter a number between 1 and 3999.</p>';document.getElementById('result').style.display='block';return;}
const r=toRoman(n);
document.getElementById('result').innerHTML=`<div class="result-row"><span>Arabic:</span><span>${n}</span></div><div class="result-row"><span>Roman:</span><span>${r}</span></div>`;
}else{
const r=document.getElementById('roman').value||'';
const n=fromRoman(r);
document.getElementById('result').innerHTML=`<div class="result-row"><span>Roman:</span><span>${r.toUpperCase()}</span></div><div class="result-row"><span>Arabic:</span><span>${n}</span></div>`;
}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
