<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retirement Savings (401k) Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Retirement Savings (401k) Calculator</h1>
<div class="calc-wrap">
<h2>401(k) Retirement Calculator 🏦</h2>
<p>Project your 401(k) balance at retirement with employer match and compound growth.</p>
<div class="input-group">
<label>Current age</label>
<input type="number" id="age" value="30" min="18" max="80" aria-label="Age">
</div>
<div class="input-group">
<label>Retirement age</label>
<input type="number" id="retire" value="65" min="40" max="90" aria-label="Retire">
</div>
<div class="input-group">
<label>Current 401(k) balance ($)</label>
<input type="number" id="current" value="10000" min="0" aria-label="Current">
</div>
<div class="input-group">
<label>Annual contribution ($)</label>
<input type="number" id="contrib" value="6000" min="0" aria-label="Contrib">
</div>
<div class="input-group">
<label>Employer match (% of salary)</label>
<input type="number" id="match" value="3" min="0" max="10" step="0.5" aria-label="Match">
</div>
<div class="input-group">
<label>Annual salary ($)</label>
<input type="number" id="salary" value="60000" min="0" aria-label="Salary">
</div>
<div class="input-group">
<label>Expected annual return (%)</label>
<input type="number" id="return" value="7" min="0" max="20" step="0.1" aria-label="Return">
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const age=v('age'),retire=v('retire'),current=v('current'),contrib=v('contrib'),matchPct=v('match'),salary=v('salary'),ret=v('return');
  const years=Math.max(0,retire-age);
  const employerMatch=salary*(match/100);
  const totalAnnual=contrib+employerMatch;
  let balance=current;
  for(let i=0;i<years;i++){balance=balance*(1+ret/100)+totalAnnual}
  const personalContrib=contrib*years;
  const employerTotal=employerMatch*years;
  const growth=balance-personalContrib-employerTotal-current;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Projected 401(k) at Age '+retire+'</h3>'+
    '<div class="result-row"><span>Years to grow</span><span>'+years+'</span></div>'+
    '<div class="result-row"><span>Your total contributions</span><span>$'+personalContrib.toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>'+
    '<div class="result-row"><span>Employer match total</span><span>$'+employerTotal.toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>'+
    '<div class="result-row"><span>Investment growth</span><span>$'+growth.toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>'+
    '<div class="result-row"><span>Projected balance</span><span>$'+balance.toLocaleString(undefined,{maximumFractionDigits:0})+'</span></div>';
}
</script>
</body>
</html>
