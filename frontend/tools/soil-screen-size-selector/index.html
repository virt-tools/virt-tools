<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Screen Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Screen Size Selector</h1>
<p>Recommend soil sieve/screen mesh size for desired soil use from largest particle size and application type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-max">Max particle</label><input type="text" id="in-max" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-use">Use: 1=potting,2=bed,3=fill</label><input type="text" id="in-use" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit"></div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var maxEl=document.getElementById("in-max"),useEl=document.getElementById("in-use"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Max=pn(maxEl.value),Use=pn(useEl.value);
if(Max==null||Use==null)return;
if(!isFinite(Max)||!isFinite(Use)||Max<=0||Use<1||Use>3){err.textContent="Enter valid values.";return}
err.textContent="";
var mesh=Use===1?Math.min(Max,0.25):Use===2?Math.min(Max,0.5):Max;
var meshN=Math.round(1/mesh*25.4);
var html='<div class="big">'+rnd(meshN,0)+' mesh</div>';
html+=row("Max particle",rnd(Max,2)+' in ('+rnd(Max*25.4,1)+' mm)');
html+=row("Use type",Use===1?"Potting":Use===2?"Bed":"Fill");
html+=row("Screen opening",rnd(mesh,3)+' in ('+rnd(mesh*25.4,1)+' mm)');
html+=row("Approx mesh #",meshN+" mesh");
html+=row("Pass-through %",Use===1?"~95%":Use===2?"~85%":"~75%");
out.innerHTML=html;
}
[maxEl,useEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
