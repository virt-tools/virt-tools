<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Splice Connector Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Splice Connector Selector</h1>
<p>Select the correct splice connector type (heat shrink, crimp, split-bolt) based on wire size and environment. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-awg">Wire AWG</label><input type="text" id="in-awg" inputmode="numeric" autocomplete="off" placeholder="e.g. 12"><div class="unit">AWG</div></div>
<div class="field"><label class="f" for="in-env">Environment</label><input type="text" id="in-env" autocomplete="off" placeholder="dry or wet"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-awg"),eEl=document.getElementById("in-env"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Aw=pn(aEl.value),Ev=String(eEl.value).trim().toLowerCase();
if(Aw==null)return;
if(!isFinite(Aw)||Aw<=0){err.textContent="Enter a valid AWG.";return}
if(Ev&&Ev!=="dry"&&Ev!=="wet"){err.textContent="Enter 'dry' or 'wet'.";return}
if(!Ev)return;
err.textContent="";
var type;
if(Aw>=14&&Ev==="dry")type="Heat-shrink crimp splice";
else if(Aw>=14&&Ev==="wet")type="Sealed heat-shrink (adhesive-lined)";
else if(Aw>=8&&Ev==="dry")type="Crimp barrel splice ( uninsulated )";
else if(Aw>=8&&Ev==="wet")type="Sealed Polaris connector";
else if(Aw<8)type="Split-bolt or Polaris lug (sealed if wet)";
else type="Butt-splice connector";
var html='<div class="big">'+type+'</div>';
html+=row("Recommended splice",type);
html+=row("Wire size",Aw+' AWG');
html+=row("Environment",Ev);
out.innerHTML=html;
}
[aEl,eEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
