<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Solar System Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:0;background:#000011;border-radius:12px;overflow:hidden;height:400px;position:relative;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌍 CSS Solar System Generator</h1>
<p>Create CSS animated solar system with orbiting planets. Adjustable planets/speed/sizes. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Planet Count</label><input type="number" id="planets" value="6" min="2" max="8" style="width:80px"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Sun Color</label><input type="color" id="sunColor" value="#ffaa00" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Orbit Color</label><input type="color" id="orbitColor" value="#333355" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Show Orbits</label><select id="showOrbits"><option value="yes" selected>Yes</option><option value="no">No</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var planetData=[
{name:'Mercury',color:'#aaa',size:6},{name:'Venus',color:'#e8a',size:10},
{name:'Earth',color:'#4af',size:11},{name:'Mars',color:'#e72',size:8},
{name:'Jupiter',color:'#da6',size:20},{name:'Saturn',color:'#fc4',size:18},
{name:'Uranus',color:'#8df',size:14},{name:'Neptune',color:'#48f',size:13}
];
function update(){
var count=parseInt(document.getElementById('planets').value);
var speed=document.getElementById('speed').value;
var sunColor=document.getElementById('sunColor').value;
var orbitColor=document.getElementById('orbitColor').value;
var showOrbits=document.getElementById('showOrbits').value;
var baseDur=speed==='slow'?'20s':speed==='fast'?'5s':'10s';
var html='<div class="solar-system">\n  <div class="sun"></div>\n';
var css='.solar-system{width:100%;height:400px;background:radial-gradient(ellipse at center,#000033,#000011);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}\n';
css+='.sun{position:absolute;width:40px;height:40px;background:'+sunColor+';border-radius:50%;box-shadow:0 0 40px 10px '+sunColor+';z-index:10}\n';
for(var i=0;i<count;i++){
var p=planetData[i];
var orbitSize=80+i*45;
var dur=Math.floor(parseFloat(baseDur)*(i+1)*0.8)+'s';
var orbitCSS=showOrbits==='yes'?'border:1px solid '+orbitColor:'';
html+='  <div class="orbit" style="width:'+orbitSize+'px;height:'+orbitSize+'px;'+orbitCSS+';animation:orbit-'+i+' '+dur+' linear infinite">\n';
html+='    <div class="planet" style="background:'+p.color+';width:'+p.size+'px;height:'+p.size+'px"></div>\n';
html+='  </div>\n';
css+='.orbit{position:absolute;border-radius:50%}\n';
css+='@keyframes orbit-'+i+'{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n';
}
css+='.planet{position:absolute;top:-'+ (planetData[0].size/2) +'px;left:50%;transform:translateX(-50%);border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,0.3)}\n';
html+='</div>';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['planets','speed','sunColor','orbitColor','showOrbits'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
