<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Unicorn Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#1a0a3a,#4a2a6a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🦄 CSS Unicorn Generator</h1>
<p>Create CSS unicorn with body, horn, mane, tail. Adjustable colors and rainbow mane. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Body Color</label><input type="color" id="bodyColor" value="#f8bbd0" style="width:60px;height:36px" aria-label="Body Color"></div>
<div class="ctrl-row"><label>Horn Color</label><input type="color" id="hornColor" value="#ffd700" style="width:60px;height:36px" aria-label="Horn Color"></div>
<div class="ctrl-row"><label>Mane</label><select id="mane" aria-label="Mane"><option value="rainbow">Rainbow</option><option value="solid">Solid</option><option value="none">None</option></select></div>
<div class="ctrl-row"><label>Mane Color</label><input type="color" id="maneColor" value="#e040fb" style="width:60px;height:36px" aria-label="Mane Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="180" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var bc=document.getElementById('bodyColor').value;
var hc=document.getElementById('hornColor').value;
var mane=document.getElementById('mane').value;
var mc=document.getElementById('maneColor').value;
var sz=parseInt(document.getElementById('size').value);
var bw=sz*0.55,bh=sz*0.35,hd=sz*0.28;
var html='<div class="unicorn">\n  <div class="horn"></div>\n  <div class="head"><div class="eye"></div><div class="ear"></div></div>\n  <div class="body"></div>\n  <div class="leg l-front"></div><div class="leg l-back"></div>\n  <div class="leg r-front"></div><div class="leg r-back"></div>\n  <div class="tail"></div>'+(mane!=='none'?'\n  <div class="mane"></div>':'')+'\n</div>';
var css='.unicorn{position:relative;width:'+bw+'px;height:'+(bh*1.7)+'px}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:'+bc+';border-radius:50% 60% 40% 50%;position:relative;z-index:2;box-shadow:inset -8px -8px rgba(0,0,0,0.15)}\n';
css+='.head{width:'+hd+'px;height:'+(hd*0.9)+'px;background:'+bc+';border-radius:50% 30% 40% 50%;position:absolute;left:-'+(hd*0.4)+'px;top:-'+(hd*0.3)+'px;z-index:3}\n';
css+='.eye{position:absolute;top:30%;right:25%;width:'+(hd*0.12)+'px;height:'+(hd*0.12)+'px;background:#333;border-radius:50%}\n';
css+='.ear{position:absolute;top:-'+(hd*0.15)+'px;right:30%;width:'+(hd*0.15)+'px;height:'+(hd*0.25)+'px;background:'+bc+';border-radius:50% 50% 0 0;transform:rotate(-15deg)}\n';
css+='.horn{position:absolute;left:-'+(hd*0.5)+'px;top:-'+(hd*0.8)+'px;width:'+(hd*0.15)+'px;height:'+(hd*0.6)+'px;background:linear-gradient(180deg,'+hc+',#b8860b);clip-path:polygon(50% 0,0 100%,100% 100%);z-index:4}\n';
css+='.leg{position:absolute;width:'+(bw*0.08)+'px;height:'+(bh*0.8)+'px;background:'+bc+';border-radius:4px;bottom:-'+(bh*0.7)+'px;z-index:1}\n';
css+='.l-front{left:'+(bw*0.15)+'px}.l-back{left:'+(bw*0.05)+'px}.r-front{right:'+(bw*0.15)+'px}.r-back{right:'+(bw*0.05)+'px}\n';
css+='.tail{position:absolute;right:-'+(sz*0.08)+'px;top:5%;width:'+(sz*0.15)+'px;height:'+(sz*0.12)+'px;background:'+bc+';border-radius:50% 0 0 50%;z-index:1}\n';
if(mane==='rainbow'){
css+='.mane{position:absolute;left:-'+(hd*0.1)+'px;top:-'+(hd*0.2)+'px;width:'+(hd*0.5)+'px;height:'+(hd*0.8)+'px;background:linear-gradient(180deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f);border-radius:50% 10% 10% 50%;z-index:2;opacity:0.8}\n';
}else if(mane==='solid'){
css+='.mane{position:absolute;left:-'+(hd*0.1)+'px;top:-'+(hd*0.2)+'px;width:'+(hd*0.5)+'px;height:'+(hd*0.8)+'px;background:'+mc+';border-radius:50% 10% 10% 50%;z-index:2;opacity:0.8}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);navigator.clipboard.writeText(t.value).catch(function(){t.select();document.execCommand('copy')})}
['bodyColor','hornColor','mane','maneColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
