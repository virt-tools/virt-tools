<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Shelby Tube Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Shelby Tube Calculator</h1>
<p>Calculate sample volume, recovery ratio, and area ratio for Shelby tube undisturbed samples. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-od">Outside diameter</label><input type="text" id="in-od" inputmode="decimal" autocomplete="off" placeholder="e.g. 76.2"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-id">Inside diameter</label><input type="text" id="in-id" inputmode="decimal" autocomplete="off" placeholder="e.g. 73"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-len">Sample length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 600"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var odE=document.getElementById("in-od"),idE=document.getElementById("in-id"),lenE=document.getElementById("in-len"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var od=parseFloat(odE.value),id=parseFloat(idE.value),len=parseFloat(lenE.value);
if(isNaN(od)||isNaN(id)||isNaN(len))return;
if(id<=0||od<=0||len<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var area=Math.PI*Math.pow(id/2,2);
var vol=area*len/1000;
var ar=(od*od-id*id)/(id*id)*100;
var html='<div class="big">'+Math.round(vol*10)/10+' cm³</div>';
html+=row("Sample volume",Math.round(vol*10)/10+' cm³');
html+=row("Cross-section area",Math.round(area*100)/100+' mm²');
html+=row("Area ratio",Math.round(ar*10)/10+'%');
out.innerHTML=html;
}
[odE,idE,lenE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
