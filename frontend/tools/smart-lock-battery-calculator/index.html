<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Smart Lock Battery Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Smart Lock Battery Calculator</h1>
<p>Estimate smart lock battery life based on daily lock/unlock cycles and battery capacity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-c">Cycles per day</label><input type="text" id="in-c" inputmode="numeric" autocomplete="off" placeholder="e.g. 10"><div class="unit">lock/unlock</div></div>
<div class="field"><label class="f" for="in-m">mAh per cycle</label><input type="text" id="in-m" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.5"><div class="unit">mAh</div></div>
<div class="field"><label class="f" for="in-b">Battery capacity</label><input type="text" id="in-b" inputmode="numeric" autocomplete="off" placeholder="e.g. 1800"><div class="unit">mAh</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-c"),mEl=document.getElementById("in-m"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(cEl.value),M=pn(mEl.value),B=pn(bEl.value);
if(C==null||M==null||B==null)return;
if(!isFinite(C)||C<=0||!isFinite(M)||M<=0||!isFinite(B)||B<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var dailyMA=C*M+5;
var days=B/dailyMA;
var months=days/30;
var html='<div class="big">'+rnd(months,1)+' months</div>';
html+=row("Battery life",rnd(days,0)+" days");
html+=row("In months",rnd(months,1)+" months");
html+=row("Daily consumption",rnd(dailyMA,1)+" mAh/day");
html+=row("Battery capacity",B+" mAh");
out.innerHTML=html;
}
[cEl,mEl,bEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
