<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tone Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Tone Generator</h1>
<p class="subtitle">Generate sine, square, sawtooth, and triangle wave tones at any frequency and duration. Download as WAV.</p>
<div class="input-section">
<label>Frequency (Hz): <input type="number" id="freq" value="440" min="20" max="20000"></label>
<label>Duration (s): <input type="number" id="dur" value="2" min="0.1" step="0.1"></label>
<label>Wave: <select id="wave"><option value="sine">Sine</option><option value="square">Square</option><option value="sawtooth">Sawtooth</option><option value="triangle">Triangle</option></select></label>
<label>Volume: <input type="range" id="vol" min="0" max="100" value="50"></label>
<button id="play" class="primary-btn" type="button">Play</button>
<button id="download" class="btn" type="button">Download WAV</button>
</div>
<div id="status"></div>
<script>
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new AudioContext();return audioCtx;}
document.getElementById('play').addEventListener('click',()=>{
const ctx=getCtx();const o=ctx.createOscillator();const g=ctx.createGain();
o.type=document.getElementById('wave').value;
o.frequency.value=parseFloat(document.getElementById('freq').value);
g.gain.value=parseFloat(document.getElementById('vol').value)/100*0.3;
o.connect(g);g.connect(ctx.destination);
o.start();o.stop(ctx.currentTime+parseFloat(document.getElementById('dur').value));
});
document.getElementById('download').addEventListener('click',()=>{
const ctx=getCtx();const dur=parseFloat(document.getElementById('dur').value);
const sr=ctx.sampleRate,n=Math.round(sr*dur);
const buf=ctx.createBuffer(1,n,sr);const d=buf.getChannelData(0);
const f=parseFloat(document.getElementById('freq').value);
const vol=parseFloat(document.getElementById('vol').value)/100*0.3;
const wt=document.getElementById('wave').value;
for(let i=0;i<n;i++){const t=i/sr;let v;
if(wt==='sine')v=Math.sin(2*Math.PI*f*t);
else if(wt==='square')v=Math.sin(2*Math.PI*f*t)>0?1:-1;
else if(wt==='sawtooth')v=2*(t*f-Math.floor(t*f+0.5));
else v=2*Math.abs(2*(t*f-Math.floor(t*f+0.5))-1);
d[i]=v*vol;}
const wav=toWav(buf);const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tone.wav';a.click();
});
function toWav(b){const n=b.length,sr=b.sampleRate,nc=1;
const buf=new ArrayBuffer(44+n*2);const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*2,true);
const d=b.getChannelData(0);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,d[i]*32767)),true);
return buf;}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
