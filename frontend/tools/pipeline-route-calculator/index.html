<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pipeline Route Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pipeline Route Calculator</h1>
<p>Calculate pipeline route length, seabed roughness allowance, and material quantity from start/end coordinates. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dist">Straight distance</label><input type="text" id="in-dist" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">km</div></div>
<div class="field"><label class="f" for="in-rough">Seabed roughness</label><input type="text" id="in-rough" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-dia">Pipe diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">in</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dist"),rE=document.getElementById("in-rough"),diaE=document.getElementById("in-dia"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),r=parseFloat(rE.value),dia=parseFloat(diaE.value);
if(isNaN(d)||isNaN(r)||isNaN(dia))return;
var routeLen=d*(1+r/100);
var pipeWeight=routeLen*dia*dia*0.025;
var coating=routeLen*dia*0.05;
var html='<div class="big">'+(Math.round(routeLen*10)/10)+' km</div>';
html+=row("Route length",Math.round(routeLen*10)/10+' km');
html+=row("Pipe steel weight",Math.round(pipeWeight).toLocaleString()+' tonnes');
html+=row("Coating weight",Math.round(coating).toLocaleString()+' tonnes');
out.innerHTML=html;
}
[dE,rE,diaE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
