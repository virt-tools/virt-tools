<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Knob/Dial Control Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:250px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎛️ CSS Knob/Dial Control Generator</h1>
<p>Create CSS rotary knob/dial control components. 4 styles, adjustable value/size/color. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="classic" selected>Classic</option><option value="minimal">Minimal</option><option value="led">LED</option><option value="gradient">Gradient</option></select></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="120" selected>Medium</option><option value="80">Small</option><option value="180">Large</option></select></div>
<div class="ctrl-row"><label>Value</label><input type="range" id="value" min="0" max="100" value="65" style="width:200px"></div>
<div class="ctrl-row"><label>Min Angle</label><input type="number" id="minAng" value="-135" style="width:80px"></div>
<div class="ctrl-row"><label>Max Angle</label><input type="number" id="maxAng" value="135" style="width:80px"></div>
<div class="ctrl-row"><label>Accent Color</label><input type="color" id="accent" value="#667eea" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Show Ticks</label><select id="ticks"><option value="1" selected>Yes</option><option value="0">No</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var size=parseInt(document.getElementById('size').value);
var val=parseInt(document.getElementById('value').value);
var minA=parseInt(document.getElementById('minAng').value);
var maxA=parseInt(document.getElementById('maxAng').value);
var accent=document.getElementById('accent').value;
var ticks=document.getElementById('ticks').value==='1';
var range=maxA-minA;
var angle=minA+(val/100)*range;
var tickHtml='';
if(ticks){for(var i=0;i<=10;i++){var ta=minA+(i/10)*range;var rad=ta*Math.PI/180;var r=size*0.46;var x=Math.sin(rad)*r+size/2;var y=-Math.cos(rad)*r+size/2;tickHtml+='\n  <div class="knob-tick" style="left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px;transform:translate(-50%,-50%) rotate('+ta+'deg)"></div>'}}
var bg='#2a2a3e',border='#444',indicator='#fff',glow='';
if(style==='minimal'){bg='#f5f5f5';border='#ddd';indicator='#333'}
else if(style==='led'){bg='#0a0a1a';border=accent;indicator=accent;glow='box-shadow:0 0 15px '+accent+';'}
else if(style==='gradient'){bg='linear-gradient(135deg,'+accent+',#333)';border='transparent';indicator='#fff'}
var html='<div class="knob-wrap" style="width:'+size+'px;height:'+size+'px">\n  <div class="knob-track"></div>'+tickHtml+'\n  <div class="knob-body" style="transform:rotate('+angle+'deg)">\n    <div class="knob-indicator"></div>\n  </div>\n  <div class="knob-value">'+val+'</div>\n</div>';
var css='.knob-wrap{position:relative;display:flex;align-items:center;justify-content:center}\n';
css+='.knob-track{position:absolute;width:100%;height:100%;border-radius:50%;border:2px dashed rgba(128,128,128,.3)}\n';
if(ticks){css+='.knob-tick{position:absolute;width:2px;height:'+(size*0.05)+'px;background:'+border+';border-radius:1px}\n'}
css+='.knob-body{position:absolute;width:'+(size*0.7)+'px;height:'+(size*0.7)+'px;border-radius:50%;background:'+bg+';border:'+(size*0.03)+'px solid '+border+';'+glow+'display:flex;justify-content:center;align-items:flex-start;transition:transform .3s ease;cursor:grab}\n';
css+='.knob-indicator{width:'+(size*0.04)+'px;height:'+(size*0.15)+'px;background:'+indicator+';border-radius:'+(size*0.02)+'px;margin-top:'+(size*0.04)+'px}\n';
css+='.knob-value{position:absolute;bottom:-30px;font-size:'+(size*0.1)+'px;font-weight:bold;color:'+accent+'}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','size','value','minAng','maxAng','accent','ticks'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
