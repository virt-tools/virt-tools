<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Firewood Volume Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Firewood Volume Calculator</h1>
<p>Calculate the volume of a firewood stack (face cord or full cord) from log length, stack height, and width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h">Stack height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.2"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-w">Stack width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-ll">Log length</label><input type="text" id="in-ll" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.45"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter stack dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var hEl=document.getElementById("in-h"),wEl=document.getElementById("in-w"),llEl=document.getElementById("in-ll"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H=pn(hEl.value),W=pn(wEl.value),LL=pn(llEl.value);
if(H==null||W==null||LL==null){return}
if(!isFinite(H)||!isFinite(W)||!isFinite(LL)||H<=0||W<=0||LL<=0){err.textContent="All dimensions must be positive.";return}
err.textContent="";
var vol=H*W*LL;
var faceCords=vol/1.207;
var fullCords=vol/3.62;
var html='<div class="big">'+rnd(vol,3)+' m³</div>';
html+=row("Stack volume",rnd(vol,3)+" m³");
html+=row("Face cords",rnd(faceCords,2));
html+=row("Full cords",rnd(fullCords,3));
html+=row("Log length",rnd(LL,2)+" m");
out.innerHTML=html;
}
[hEl,wEl,llEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
