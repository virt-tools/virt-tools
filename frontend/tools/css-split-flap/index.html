<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Split-Flap Display Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🛄 CSS Split-Flap Display Generator</h1>
<p>Create CSS split-flap/departure board display. Adjustable text, colors, size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Display Text</label><input type="text" id="text" value="DEPARTURE" style="width:200px"></div>
<div class="ctrl-row"><label>Flap Color</label><input type="color" id="flapColor" value="#1a1a1a"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="textColor" value="#f5a623"></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="40">Small</option><option value="60" selected>Medium</option><option value="80">Large</option></select></div>
<div class="ctrl-row"><label>Flip Speed (s)</label><input type="range" id="speed" min="0.1" max="2" step="0.1" value="0.3" style="width:200px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var txt=(document.getElementById('text').value||'DEPARTURE').toUpperCase();
var fc=document.getElementById('flapColor').value;
var tc=document.getElementById('textColor').value;
var sz=parseInt(document.getElementById('size').value);
var sp=parseFloat(document.getElementById('speed').value);
var chars=txt.split('');
var html='<div class="split-flap" style="--fs:'+sz+'px;--fc:'+fc+';--tc:'+tc+';--sp:'+sp+'s">\n';
chars.forEach(function(c,i){
html+='  <div class="flap" style="animation-delay:'+(i*sp*0.15)+'s"><span>'+c+'</span></div>\n';
});
html+='</div>';
var css='.split-flap{display:flex;gap:4px;font-family:monospace}\n';
css+='.flap{width:var(--fs);height:var(--fs);background:var(--fc);border:2px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--tc);font-size:calc(var(--fs)*0.6);font-weight:bold;position:relative;overflow:hidden;animation:flap var(--sp) ease-in-out;animation-iteration-count:1;box-shadow:inset 0 var(--fs) 0 -calc(var(--fs)/2) rgba(255,255,255,.05),inset 0 -2px 4px rgba(0,0,0,.5)}\n';
css+='.flap::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(0,0,0,.4)}\n';
css+='@keyframes flap{0%{transform:rotateX(0)}15%{transform:rotateX(90deg)}30%{transform:rotateX(0)}100%{transform:rotateX(0)}}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','flapColor','textColor','size','speed'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
