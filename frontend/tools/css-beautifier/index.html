<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Beautifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSS Beautifier</h1>
<p class="subtitle">Format and indent CSS for readability. Also minify CSS to reduce file size.</p>
<div class="input-section">
<label>CSS Input</label>
<textarea id="input" rows="10" placeholder=".foo{color:red;background:#fff}" aria-label=".Foo{Color:Red;Background:#Fff}"></textarea>
<button id="beautify" class="primary-btn" type="button">Beautify</button>
<button id="minify" class="primary-btn" type="button">Minify</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function beautify(css){css=css.replace(/\s*{\s*/g,' {\n  ');css=css.replace(/;\s*/g,';\n  ');css=css.replace(/\s*}\s*/g,'\n}\n');css=css.replace(/\n  \n/g,'\n  ');css=css.replace(/\n}\n/g,'\n}\n');return css.trim()+'\n';}
function minify(css){return css.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}:;,])\s*/g,'$1').replace(/;}/g,'}').trim();}
document.getElementById('beautify').addEventListener('click',()=>{const r=beautify(document.getElementById('input').value);show(r);});
document.getElementById('minify').addEventListener('click',()=>{const r=minify(document.getElementById('input').value);show(r);});
function show(r){document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+r.replace(/</g,'&lt;')+'</pre>';document.getElementById('result').style.display='block';window._result=r;}
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
