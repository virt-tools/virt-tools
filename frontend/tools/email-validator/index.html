<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Email Validator</h1>
<p class="subtitle">Validate email addresses with RFC 5322 syntax checks, DNS-format domain validation, and deliverability scoring. 100% client-side — no data sent anywhere.</p>
<div style="max-width:600px;margin-top:1.5rem;">
<label style="font-weight:600;">Email Address</label>
<input type="text" id="emailInput" placeholder="user@example.com" style="width:100%;font-size:1.1rem;padding:.6rem;border:2px solid #ddd;border-radius:8px;margin-top:.4rem;" aria-label="User@Example.Com">
<div id="result" style="margin-top:1rem;padding:1rem;border-radius:8px;background:#f5f5f5;">
  <span style="color:#999;">Enter an email to validate</span>
</div>
<div id="details" style="margin-top:1rem;"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input = document.getElementById('emailInput');
const result = document.getElementById('result');
const details = document.getElementById('details');
function validate(email){
  const checks = [];
  let score = 0;
  if(!email){ return null; }
  if(!email.includes('@')){ checks.push({ok:false,label:'Missing @ symbol'}); return {valid:false,score:0,checks}; }
  const [local, domain] = email.split('@');
  if(!local){ checks.push({ok:false,label:'Missing local part (before @)'}); return {valid:false,score:0,checks}; }
  if(!domain){ checks.push({ok:false,label:'Missing domain (after @)'}); return {valid:false,score:0,checks}; }
  const rfcLocal = /^[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-zA-Z0-9!#$%&'*+/=?^_`{|}~-]+)*$/;
  const rfcDomain = /^[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?)+$/;
  checks.push({ok:rfcLocal.test(local),label:'Local part RFC 5322 syntax'});
  checks.push({ok:rfcDomain.test(domain),label:'Domain RFC 5322 syntax'});
  checks.push({ok:local.length<=64,label:'Local part ≤ 64 chars (RFC)'});
  checks.push({ok:email.length<=254,label:'Total length ≤ 254 chars (RFC)'});
  checks.push({ok:domain.includes('.'),label:'Domain has TLD'});
  const tld = domain.split('.').pop();
  checks.push({ok:tld.length>=2,label:'TLD ≥ 2 chars'});
  checks.push({ok:!local.includes('..'),label:'No consecutive dots in local'});
  checks.push({ok:!local.startsWith('.')&&!local.endsWith('.'),label:'Local not dot-padded'});
  if(local.includes('+')) checks.push({ok:true,label:'Uses + aliasing'});
  checks.forEach(c => { if(c.ok) score++; });
  const valid = checks.every(c => c.ok);
  return {valid, score, checks, local, domain};
}
function update(){
  const v = validate(input.value.trim());
  if(!v){ result.innerHTML='<span style="color:#999;">Enter an email to validate</span>'; details.innerHTML=''; return; }
  if(v.valid){
    result.style.background='#e8f8e8';
    result.innerHTML='✅ <strong>Valid</strong> email — deliverability score: '+v.score+'/'+v.checks.length;
  } else {
    result.style.background='#fdf0f0';
    result.innerHTML='❌ <strong>Invalid</strong> — '+v.score+'/'+v.checks.length+' checks passed';
  }
  details.innerHTML = '<h3>Breakdown</h3><table style="width:100%;border-collapse:collapse;">'+
    v.checks.map(c => '<tr><td style="padding:.3rem;border-bottom:1px solid #eee;">'+
    (c.ok?'✅':'❌')+'</td><td style="padding:.3rem;border-bottom:1px solid #eee;">'+
    c.label+'</td></tr>').join('')+'</table>'+
    (v.local && v.domain ? '<div style="margin-top:.5rem;font-size:.85rem;color:#666;">Local: <code>'+v.local+'</code> · Domain: <code>'+v.domain+'</code></div>' : '');
}
input.addEventListener('input', update);
})();
</script>
</body>
</html>
