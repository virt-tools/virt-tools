<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Transfer Switch Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Transfer Switch Selector</h1>
<p>Select a generator transfer switch type and amperage based on generator size and service panel rating. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-gw">Generator wattage</label><input type="text" id="in-gw" inputmode="decimal" autocomplete="off" placeholder="e.g. 22000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-sv">Service voltage</label><input type="text" id="in-sv" inputmode="decimal" autocomplete="off" placeholder="e.g. 240"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var gEl=document.getElementById("in-gw"),sEl=document.getElementById("in-sv"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Gw=pn(gEl.value),Sv=pn(sEl.value);
if(Gw==null||Sv==null)return;
if(!isFinite(Gw)||Gw<=0||!isFinite(Sv)||Sv<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var amps=Gw/Sv;
var swAmps=Math.ceil(amps/25)*25;
var type=amps>100?"Automatic (ATS)":"Manual (MTS)";
var html='<div class="big">'+swAmps+' A switch</div>';
html+=row("Generator current",rnd(amps,0)+' A');
html+=row("Switch amperage",swAmps+' A');
html+=row("Switch type",type);
html+=row("Generator size",rnd(Gw/1000,1)+' kW');
html+=row("Service voltage",Sv+' V');
out.innerHTML=html;
}
[gEl,sEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
