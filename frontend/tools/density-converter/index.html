<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Density Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Density Converter</h1>
<p class="subtitle">Convert between kg/m³, g/cm³, lb/ft³, lb/in³, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1000" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>kg/m³</option>
<option value="1000">g/cm³</option>
<option value="1e6">kg/L</option>
<option value="16.018463">lb/ft³</option>
<option value="27679.90471">lb/in³</option>
<option value="1000">t/m³</option>
<option value="0.8826">slug/ft³</option>
<option value="1000000">g/mL</option>
<option value="1">kg/m³</option>
<option value="0.001">g/L</option>
<option value="1.68555">lb/yd³</option>
<option value="0.1335265">oz/gal (US)</option>
<option value="0.00016036">grain/ft³</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['kg/m³',1],['g/cm³',1000],['kg/L',1000],['t/m³',1000],['g/L',1],['g/mL',1000],['lb/ft³',16.018463],['lb/in³',27679.90471],['lb/yd³',0.593276],['slug/ft³',515.379],['oz/gal (US)',7.489152],['grain/ft³',0.002288],['oz/in³',1729.994]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const kg=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=kg/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
