<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Phase Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Moon Phase Calculator</h1>
<p class="subtitle">Calculate the moon phase for any date and see the next full and new moons.</p>
<div class="input-section">
<label>Date</label>
<input type="date" id="date" aria-label="Date">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const PHASES=['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
const EMOJIS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
function moonPhase(date){
const synodic=29.53058867;
const known=new Date('2000-01-06T18:14:00Z');
const days=(date-known)/86400000;
let phase=((days%synodic)+synodic)%synodic;
const fraction=phase/synodic;
const idx=Math.floor(fraction*8)%8;
return{phase:phase,fraction:fraction,index:idx,name:PHASES[idx],emoji:EMOJIS[idx],illumination:Math.round((1-Math.cos(fraction*2*Math.PI))/2*100)};
}
function nextPhase(date,target){
let d=new Date(date);
for(let i=0;i<60;i++){
const m=moonPhase(d);
if(m.fraction<0.02||m.fraction>0.98){if(target==='full'&&m.fraction>0.48)return d;if(target==='new'&&m.fraction<0.02)return d;}
d.setDate(d.getDate()+1);
}
return null;
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('date').value=new Date().toISOString().split('T')[0];
document.getElementById('calc').addEventListener('click',()=>{
const d=new Date(document.getElementById('date').value+'T12:00:00');
const m=moonPhase(d);
let nextFull=new Date(d);nextFull.setDate(nextFull.getDate()+Math.round((0.5-m.fraction)*29.53));
let nextNew=new Date(d);nextNew.setDate(nextNew.getDate()+Math.round((1-m.fraction)*29.53));
document.getElementById('result').innerHTML=`
<div style="text-align:center;font-size:5rem;margin:20px 0">${m.emoji}</div>
<div class="result-row"><span>Date:</span><span>${d.toDateString()}</span></div>
<div class="result-row"><span>Moon Phase:</span><span>${m.name}</span></div>
<div class="result-row"><span>Phase Age:</span><span>${m.phase.toFixed(1)} days</span></div>
<div class="result-row"><span>Illumination:</span><span>${m.illumination}%</span></div>
<div class="result-row"><span>Cycle Progress:</span><span>${(m.fraction*100).toFixed(1)}%</span></div>
<div class="result-row"><span>Next Full Moon:</span><span>~${nextFull.toDateString()}</span></div>
<div class="result-row"><span>Next New Moon:</span><span>~${nextNew.toDateString()}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
