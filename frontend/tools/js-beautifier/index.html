<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS Beautifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JS Beautifier</h1>
<p class="subtitle">Format JavaScript with proper indentation or minify it to reduce size.</p>
<div class="input-section">
<label>JavaScript Input</label>
<textarea id="input" rows="10" placeholder="function foo(){return bar;}" aria-label="Function Foo(){Return Bar;}"></textarea>
<button id="beautify" class="primary-btn" type="button">Beautify</button>
<button id="minify" class="primary-btn" type="button">Minify</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function beautify(code){
let out='',indent=0,i=0,str=false,quote='';
while(i<code.length){
let c=code[i];
if(str){out+=c;if(c==='\\'){out+=code[i+1]||'';i+=2;continue;}if(c===quote){str=false;}i++;continue;}
if(c==='"'||c==="'"||c==='`'){str=true;quote=c;out+=c;i++;continue;}
if(c==='{'||c==='['||c==='('){out+=c;indent++;out+='\n'+'  '.repeat(indent);i++;continue;}
if(c==='}'||c===']'||c===')'){indent=Math.max(0,indent-1);out=out.trimEnd()+'\n'+'  '.repeat(indent)+c;i++;continue;}
if(c==';'){out+=';\n'+'  '.repeat(indent);i++;while(code[i]===' '||code[i]==='\n'||code[i]==='\t')i++;continue;}
out+=c;i++;}
return out.replace(/\n\s*\n/g,'\n').trim()+'\n';}
function minify(code){return code.replace(/\/\/.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{}();,:=<>+\-*/&|!])\s*/g,'$1').trim();}
document.getElementById('beautify').addEventListener('click',()=>{show(beautify(document.getElementById('input').value));});
document.getElementById('minify').addEventListener('click',()=>{show(minify(document.getElementById('input').value));});
function show(r){document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+r.replace(/</g,'&lt;')+'</pre>';document.getElementById('result').style.display='block';window._result=r;}
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
