<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Trophy Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:280px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏆 CSS Trophy Generator</h1>
<p>Create CSS trophy/cup with medal, adjustable color/size/style. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Trophy Color</label><input type="color" id="tc" value="#ffd700"></div>
<div class="ctrl-row"><label>Base Color</label><input type="color" id="bc" value="#8b4513"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="80" max="160" step="5" value="110" style="width:200px"></div>
<div class="ctrl-row"><label>Style</label><select id="style"><option value="cup">Cup</option><option value="star">Star</option><option value="medal">Medal</option></select></div>
<div class="ctrl-row"><label>Engraving</label><input type="text" id="eng" value="1ST" maxlength="5"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var tc=document.getElementById('tc').value;
var bc=document.getElementById('bc').value;
var sz=document.getElementById('sz').value;
var style=document.getElementById('style').value;
var eng=document.getElementById('eng').value;
var cupW=sz*0.6,cupH=sz*0.5,baseW=sz*0.3,baseH=sz*0.15;
var html='<div class="trophy">\n  <div class="cup">'+(style==='medal'?'':'<span class="eng">'+eng+'</span>')+'</div>\n  <div class="stem"></div>\n  <div class="base"></div>\n</div>';
var css='.trophy{display:flex;flex-direction:column;align-items:center}\n';
css+='.cup{width:'+(style==='medal'?sz:cupW)+'px;height:'+(style==='medal'?sz:cupH)+'px;background:radial-gradient(circle at 30% 30%,'+tc+'ee,'+tc+' 80%);border-radius:'+(style==='cup'?'0 0 50% 50% / 0 0 30% 30%':'50%')+';position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 8px rgba(0,0,0,0.3),inset 0 2px 4px rgba(255,255,255,0.3),0 4px 8px rgba(0,0,0,0.2)}\n';
if(style==='cup')css+='.cup::before{content:"";position:absolute;top:-'+sz*0.1+'px;left:-'+sz*0.15+'px;width:'+sz*0.3+'px;height:'+sz*0.3+'px;border:4px solid '+tc+';border-right:none;border-bottom:none;border-radius:50%}\n.cup::after{content:"";position:absolute;top:-'+sz*0.1+'px;right:-'+sz*0.15+'px;width:'+sz*0.3+'px;height:'+sz*0.3+'px;border:4px solid '+tc+';border-left:none;border-bottom:none;border-radius:50%}\n';
if(style==='star')css+='.cup{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}\n';
css+='.eng{color:'+bc+';font-weight:bold;font-family:Georgia,serif;font-size:'+(sz*0.15)+'px}\n';
css+='.stem{width:'+(sz*0.08)+'px;height:'+(sz*0.15)+'px;background:'+bc+';margin:0}\n';
css+='.base{width:'+baseW+'px;height:'+baseH+'px;background:'+bc+';border-radius:4px;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.3)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['tc','bc','sz','style','eng'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
