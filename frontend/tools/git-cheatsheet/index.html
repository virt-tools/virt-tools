<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Cheatsheet — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Git Cheatsheet</h1>
<p class="subtitle">Quick reference for common Git commands, searchable by category or keyword.</p>
<input type="text" id="search" placeholder="Search commands..." style="width:100%;max-width:600px;margin-top:1.5rem;padding:.6rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;" aria-label="Search Commands...">
<div id="cats" style="display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap;"></div>
<div id="cmds" style="margin-top:1rem;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const groups = [
{cat:'Setup',color:'#4caf50',items:[
 {cmd:'git config --global user.name "Name"',desc:'Set global username'},
 {cmd:'git config --global user.email "email"',desc:'Set global email'},
 {cmd:'git config --list',desc:'Show all config'},
 {cmd:'git init',desc:'Create a new local repository'},
 {cmd:'git clone <url>',desc:'Clone a remote repository'},
 {cmd:'git clone <url> <dir>',desc:'Clone into specific directory'},
 {cmd:'git config --global core.editor <editor>',desc:'Set default editor'},
]},
{cat:'Basic',color:'#2196f3',items:[
 {cmd:'git status',desc:'Show working tree status'},
 {cmd:'git add <file>',desc:'Add file to staging'},
 {cmd:'git add .',desc:'Add all changes to staging'},
 {cmd:'git commit -m "msg"',desc:'Commit staged changes with message'},
 {cmd:'git commit --amend',desc:'Modify last commit'},
 {cmd:'git push origin <branch>',desc:'Push to remote branch'},
 {cmd:'git pull origin <branch>',desc:'Pull from remote branch'},
 {cmd:'git fetch',desc:'Fetch from remote without merging'},
 {cmd:'git merge <branch>',desc:'Merge branch into current'},
 {cmd:'git rebase <branch>',desc:'Rebase current onto branch'},
]},
{cat:'Branching',color:'#ff9800',items:[
 {cmd:'git branch',desc:'List local branches'},
 {cmd:'git branch -a',desc:'List all branches (incl. remote)'},
 {cmd:'git branch <name>',desc:'Create new branch'},
 {cmd:'git checkout <branch>',desc:'Switch to branch'},
 {cmd:'git checkout -b <name>',desc:'Create and switch to new branch'},
 {cmd:'git switch <branch>',desc:'Switch branches (modern syntax)'},
 {cmd:'git switch -c <name>',desc:'Create and switch (modern)'},
 {cmd:'git branch -d <name>',desc:'Delete local branch (safe)'},
 {cmd:'git branch -D <name>',desc:'Force delete local branch'},
 {cmd:'git push origin --delete <name>',desc:'Delete remote branch'},
]},
{cat:'Inspection',color:'#9c27b0',items:[
 {cmd:'git log',desc:'Show commit history'},
 {cmd:'git log --oneline --graph',desc:'Compact graph log'},
 {cmd:'git log --stat',desc:'Log with file stats'},
 {cmd:'git diff',desc:'Show unstaged changes'},
 {cmd:'git diff --staged',desc:'Show staged changes'},
 {cmd:'git diff <a>..<b>',desc:'Show diff between two commits'},
 {cmd:'git show <commit>',desc:'Show details of a commit'},
 {cmd:'git blame <file>',desc:'Show who changed each line'},
 {cmd:'git reflog',desc:'Show reference log (history of HEAD)'},
]},
{cat:'Undo',color:'#f44336',items:[
 {cmd:'git restore <file>',desc:'Discard local changes to file'},
 {cmd:'git restore --staged <file>',desc:'Unstage a file'},
 {cmd:'git reset --soft HEAD~1',desc:'Undo last commit, keep changes staged'},
 {cmd:'git reset --mixed HEAD~1',desc:'Undo last commit, keep changes unstaged'},
 {cmd:'git reset --hard HEAD~1',desc:'Undo last commit, discard changes'},
 {cmd:'git revert <commit>',desc:'Create a commit that undoes a commit'},
 {cmd:'git clean -fd',desc:'Remove untracked files and directories'},
 {cmd:'git checkout -- <file>',desc:'Discard changes (legacy syntax)'},
]},
{cat:'Stash',color:'#607d8b',items:[
 {cmd:'git stash',desc:'Save changes without committing'},
 {cmd:'git stash push -m "msg"',desc:'Stash with message'},
 {cmd:'git stash list',desc:'List stashes'},
 {cmd:'git stash pop',desc:'Apply latest stash and remove it'},
 {cmd:'git stash apply',desc:'Apply latest stash, keep it'},
 {cmd:'git stash drop',desc:'Discard latest stash'},
 {cmd:'git stash clear',desc:'Remove all stashes'},
]},
{cat:'Remote',color:'#009688',items:[
 {cmd:'git remote -v',desc:'List remote repositories'},
 {cmd:'git remote add origin <url>',desc:'Add a remote'},
 {cmd:'git remote set-url origin <url>',desc:'Change remote URL'},
 {cmd:'git remote remove origin',desc:'Remove a remote'},
 {cmd:'git push -u origin <branch>',desc:'Push and set upstream'},
 {cmd:'git push --force-with-lease',desc:'Force push safely (checks remote)'},
]},
{cat:'Tags',color:'#795548',items:[
 {cmd:'git tag',desc:'List tags'},
 {cmd:'git tag v1.0.0',desc:'Create lightweight tag'},
 {cmd:'git tag -a v1.0.0 -m "msg"',desc:'Create annotated tag'},
 {cmd:'git push origin v1.0.0',desc:'Push tag to remote'},
 {cmd:'git push --tags',desc:'Push all tags'},
 {cmd:'git tag -d v1.0.0',desc:'Delete local tag'},
 {cmd:'git push origin --delete v1.0.0',desc:'Delete remote tag'},
]},
{cat:'Advanced',color:'#e91e63',items:[
 {cmd:'git cherry-pick <commit>',desc:'Apply a commit from another branch'},
 {cmd:'git bisect start',desc:'Begin binary search for a bug'},
 {cmd:'git bisect bad',desc:'Mark current commit as bad'},
 {cmd:'git bisect good <commit>',desc:'Mark a commit as good'},
 {cmd:'git worktree add <dir> <branch>',desc:'Create a linked working tree'},
 {cmd:'git submodule add <url>',desc:'Add a submodule'},
 {cmd:'git submodule update --init',desc:'Initialize and update submodules'},
 {cmd:'git archive --format=tar HEAD > repo.tar',desc:'Export repo as archive'},
 {cmd:'git filter-branch --tree-filter "cmd" -- --all',desc:'Rewrite history (dangerous)'},
]},
];
const search = document.getElementById('search');
const catsEl = document.getElementById('cats');
const cmdsEl = document.getElementById('cmds');
let activeCat = 'All';
const allCats = ['All', ...groups.map(g=>g.cat)];
function renderCats(){
  catsEl.innerHTML = allCats.map(c => '<button data-cat="'+c+'" style="padding:.3rem .8rem;border:1px solid '+(c===activeCat?'#333':'#ddd')+';border-radius:20px;background:'+(c===activeCat?'#333':'#fff')+';color:'+(c===activeCat?'#fff':'#333')+';cursor:pointer;font-size:.85rem;" type="button">'+c+'</button>').join('');
  catsEl.querySelectorAll('button').forEach(b => b.onclick = function(){ activeCat = b.dataset.cat; renderCats(); render(); });
}
function render(){
  const q = search.value.toLowerCase();
  const filtered = groups.filter(g => activeCat === 'All' || g.cat === activeCat).map(g => {
    const items = g.items.filter(i => !q || i.cmd.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q));
    return {...g, items};
  }).filter(g => g.items.length > 0);
  if(!filtered.length){ cmdsEl.innerHTML = '<p style="color:#999;">No matching commands.</p>'; return; }
  cmdsEl.innerHTML = filtered.map(g => (
    '<h3 style="color:'+g.color+';margin-top:1.5rem;margin-bottom:.5rem;font-size:1rem;">'+g.cat+'</h3>'+
    g.items.map(i => (
      '<div style="display:flex;gap:1rem;padding:.5rem 1rem;border:1px solid #eee;border-radius:6px;margin-bottom:.3rem;align-items:center;">'+
      '<code style="flex:1;font-family:monospace;font-size:.85rem;background:#f5f5f5;padding:.3rem .5rem;border-radius:4px;cursor:pointer;" onclick="navigator.clipboard.writeText(this.textContent)">'+i.cmd+'</code>'+
      '<span style="font-size:.85rem;color:#666;min-width:250px;">'+i.desc+'</span>'+
      '</div>'
    )).join('')
  )).join('');
}
search.addEventListener('input', render);
renderCats();
render();
})();
</script>
</body>
</html>
