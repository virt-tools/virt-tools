<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Camera Power Supply Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Camera Power Supply Calculator</h1>
<p>Calculate the total power supply amperage needed for N cameras drawing a given current, with safety margin. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n">Number of cameras</label><input type="text" id="in-n" inputmode="numeric" autocomplete="off" placeholder="e.g. 8"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-a">Current per camera</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-v">System voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">V DC</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var nEl=document.getElementById("in-n"),aEl=document.getElementById("in-a"),vEl=document.getElementById("in-v"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var N=pn(nEl.value),A=pn(aEl.value),V=pn(vEl.value);
if(N==null||A==null||V==null)return;
if(!isFinite(N)||N<=0||!isFinite(A)||A<=0||!isFinite(V)||V<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var totalA=N*A;
var safetyA=totalA*1.3;
var wattage=safetyA*V;
var html='<div class="big">'+rnd(safetyA,1)+' A</div>';
html+=row("Total current (no margin)",rnd(totalA,2)+" A");
html+=row("Recommended supply (30% margin)",rnd(safetyA,2)+" A");
html+=row("Total wattage",rnd(wattage,1)+" W");
html+=row("Voltage",V+" V DC");
html+=row("Cameras",N);
out.innerHTML=html;
}
[nEl,aEl,vEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
