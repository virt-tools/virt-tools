<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Thermometer Placement — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Thermometer Placement</h1>
<p>Recommend soil thermometer probe depth, placement count, and reading interval from crop type and bed size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ct">Crop type 1-4</label><input type="text" id="in-ct" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit"></div></div>
<div class="field"><label class="f" for="in-ba">Bed area</label><input type="text" id="in-ba" inputmode="decimal" autocomplete="off" placeholder="e.g. 32"><div class="unit">sq ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var ctEl=document.getElementById("in-ct"),baEl=document.getElementById("in-ba"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CT=pn(ctEl.value),BA=pn(baEl.value);
if(CT==null||BA==null)return;
if(!isFinite(CT)||!isFinite(BA)||CT<1||CT>4||BA<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var depth=CT===1?2:CT===2?4:CT===3?6:8;
var cropName=CT===1?"Seedling":CT===2?"Leafy green":CT===3?"Root crop":"Fruiting";
var probes=Math.max(2,Math.ceil(BA/16));
var interval=CT>=3?180:120;
var html='<div class="big">'+depth+' in</div>';
html+=row("Crop type",cropName);
html+=row("Probe depth",depth+' in ('+rnd(depth*2.54,0)+' cm)');
html+=row("Bed area",rnd(BA,0)+' sq ft');
html+=row("Probes needed",probes);
html+=row("Read interval",rnd(interval/60,1)+' hr');
html+=row("Best time","6-8 AM");
out.innerHTML=html;
}
[ctEl,baEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
