<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Scaler — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Recipe Scaler</h1>
<p class="subtitle">Scale recipe ingredients up or down for any number of servings.</p>
<div class="input-section">
<label>Original Servings</label>
<input type="number" id="orig" value="4" min="1" aria-label="Orig">
<label>Desired Servings</label>
<input type="number" id="desired" value="8" min="1" aria-label="Desired">
</div>
<div class="input-section">
<h3>Ingredients</h3>
<div id="ingredients">
<div class="ingredient-row">
<input type="number" placeholder="Amount" class="amount" value="2" step="any" aria-label="Amount">
<input type="text" placeholder="Unit (cups, tbsp, etc.)" class="unit" value="cups" aria-label="Unit (Cups, Tbsp, Etc.)">
<input type="text" placeholder="Ingredient name" class="name" value="flour" aria-label="Ingredient Name">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>
</div>
</div>
<button id="addRow" class="secondary-btn" type="button">+ Add Ingredient</button>
</div>
<button id="calc" class="primary-btn" type="button">Scale Recipe</button>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('addRow').addEventListener('click',()=>{
const row=document.createElement('div');
row.className='ingredient-row';
row.innerHTML=`<input type="number" placeholder="Amount" class="amount" step="any" aria-label="Amount">
<input type="text" placeholder="Unit" class="unit" aria-label="Unit">
<input type="text" placeholder="Ingredient name" class="name" aria-label="Ingredient Name">
<button class="remove-btn" onclick="this.parentElement.remove()" type="button">✕</button>`;
document.getElementById('ingredients').appendChild(row);
});
document.getElementById('calc').addEventListener('click',()=>{
const orig=parseFloat(document.getElementById('orig').value)||1;
const desired=parseFloat(document.getElementById('desired').value)||1;
const factor=desired/orig;
const rows=document.querySelectorAll('.ingredient-row');
let html=`<h3>Scaled Recipe (${desired} servings)</h3><p class="hint">Scale factor: ${factor.toFixed(3)}×</p><table class="result-table"><tr><th>Amount</th><th>Unit</th><th>Ingredient</th></tr>`;
rows.forEach(r=>{
const amt=parseFloat(r.querySelector('.amount').value)||0;
const unit=r.querySelector('.unit').value||'';
const name=r.querySelector('.name').value||'';
const scaled=amt*factor;
html+=`<tr><td>${scaled.toFixed(3).replace(/\.?0+$/,'')}</td><td>${unit}</td><td>${name}</td></tr>`;
});
html+='</table>';
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
