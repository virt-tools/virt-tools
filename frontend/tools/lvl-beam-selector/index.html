<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>LVL Beam Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>LVL Beam Selector</h1>
<p>Select minimum LVL beam size for a given span, load, and stress rating. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-span">Span</label><input type="text" id="in-span" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-load">Load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">kN/m</div></div>
<div class="field"><label class="f" for="in-fb">Bending stress</label><input type="text" id="in-fb" inputmode="decimal" autocomplete="off" placeholder="e.g. 19"><div class="unit">MPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter span.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var spanEl=document.getElementById("in-span"),loadEl=document.getElementById("in-load"),fbEl=document.getElementById("in-fb"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(spanEl.value),W=pn(loadEl.value),FB=pn(fbEl.value);
if(L==null){return}
W=W==null?5:W;FB=FB==null?19:FB;
if(!isFinite(L)||!isFinite(W)||!isFinite(FB)||L<=0||W<=0||FB<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var M=W*L*L/8000;
var Sreq=M*1e6/FB;
var depths=[80,120,160,200,240,280,320,360,400,440,480];
var b=45;
var d=depths[0];
for(var i=0;i<depths.length;i++){if(b*depths[i]*depths[i]/6>=Sreq){d=depths[i];break}}
var Sact=b*d*d/6;
var Mr=FB*Sact/1e6;
var html='<div class="big">45×'+d+' mm</div>';
html+=row("Span",rnd(L,0)+" mm");
html+=row("Load",rnd(W,1)+" kN/m");
html+=row("Max moment",rnd(M,1)+" kN·m");
html+=row("Required S",rnd(Sreq,0)+" mm³");
html+=row("Selected size",b+"×"+d+" mm");
html+=row("Moment capacity",rnd(Mr,1)+" kN·m");
out.innerHTML=html;
}
[spanEl,loadEl,fbEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
