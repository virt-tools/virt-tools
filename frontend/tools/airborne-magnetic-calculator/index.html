<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Airborne Magnetic Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Airborne Magnetic Calculator</h1>
<p>Calculate terrain clearance, line spacing, and data density for airborne magnetic surveys from flight parameters. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-alt">Survey altitude</label><input type="text" id="in-alt" inputmode="decimal" autocomplete="off" placeholder="e.g. 80"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-speed">Flight speed</label><input type="text" id="in-speed" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">m/s</div></div>
<div class="field"><label class="f" for="in-rate">Sample rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">Hz</div></div>
<div class="field"><label class="f" for="in-line">Line spacing</label><input type="text" id="in-line" inputmode="decimal" autocomplete="off" placeholder="e.g. 250"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var altE=document.getElementById("in-alt"),speedE=document.getElementById("in-speed"),rateE=document.getElementById("in-rate"),lineE=document.getElementById("in-line"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var alt=parseFloat(altE.value),speed=parseFloat(speedE.value),rate=parseFloat(rateE.value),line=parseFloat(lineE.value);
if(isNaN(alt)||isNaN(speed)||isNaN(rate)||isNaN(line))return;
if(speed<=0||rate<=0||line<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var sampleInterval=speed/rate;
var alongDensity=1/sampleInterval;
var crossDensity=1/line;
var resolution=Math.sqrt(sampleInterval*line);
var html='<div class="big">'+Math.round(resolution)+' m</div>';
html+=row("Sample interval",Math.round(sampleInterval*100)/100+' m');
html+=row("Along-line density",Math.round(alongDensity*100)/100+' /m');
html+=row("Cross-line density",Math.round(crossDensity*10000)/10000+' /m');
html+=row("Equivalent grid resolution",Math.round(resolution)+' m');
out.innerHTML=html;
}
[altE,speedE,rateE,lineE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
