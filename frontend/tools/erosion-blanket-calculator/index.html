<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Erosion Blanket Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Erosion Blanket Calculator</h1>
<p>Calculate erosion control blanket rolls needed from slope area, roll width, and roll length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Slope area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-rw">Roll width</label><input type="text" id="in-rw" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-rl">Roll length</label><input type="text" id="in-rl" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter slope area.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),rwEl=document.getElementById("in-rw"),rlEl=document.getElementById("in-rl"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),RW=pn(rwEl.value),RL=pn(rlEl.value),WS=pn(wsEl.value);
if(A==null){return}
RW=RW==null?2:RW;RL=RL==null?25:RL;WS=WS==null?10:WS;
if(!isFinite(A)||!isFinite(RW)||!isFinite(RL)||!isFinite(WS)||A<=0||RW<=0||RL<=0||WS<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var rollArea=RW*RL;
var totalArea=A*(1+WS/100);
var rolls=Math.ceil(totalArea/rollArea);
var html='<div class="big">'+rolls+' rolls</div>';
html+=row("Slope area",rnd(A,1)+" m²");
html+=row("Roll size",rnd(RW,1)+" × "+rnd(RL,1)+" m");
html+=row("Roll coverage",rnd(rollArea,1)+" m²");
html+=row("Total area (+"+rnd(WS,0)+"% waste)",rnd(totalArea,1)+" m²");
html+=row("Rolls needed",rolls);
out.innerHTML=html;
}
[aEl,rwEl,rlEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
