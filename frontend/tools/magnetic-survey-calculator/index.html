<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Magnetic Survey Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Magnetic Survey Calculator</h1>
<p>Calculate magnetic anomaly amplitude and diurnal correction from base station and field readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-base">Base station reading</label><input type="text" id="in-base" inputmode="decimal" autocomplete="off" placeholder="e.g. 50000"><div class="unit">nT</div></div>
<div class="field"><label class="f" for="in-base2">Base station repeat</label><input type="text" id="in-base2" inputmode="decimal" autocomplete="off" placeholder="e.g. 50010"><div class="unit">nT</div></div>
<div class="field"><label class="f" for="in-field">Field reading</label><input type="text" id="in-field" inputmode="decimal" autocomplete="off" placeholder="e.g. 50200"><div class="unit">nT</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var baseE=document.getElementById("in-base"),base2E=document.getElementById("in-base2"),fieldE=document.getElementById("in-field"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var base=parseFloat(baseE.value),base2=parseFloat(base2E.value),field=parseFloat(fieldE.value);
if(isNaN(base)||isNaN(base2)||isNaN(field))return;
err.textContent="";
var drift=(base2-base)/2;
var corrected=field-base-drift;
var html='<div class="big">'+Math.round(corrected)+' nT</div>';
html+=row("Diurnal drift correction",Math.round(drift)+' nT');
html+=row("Corrected anomaly",Math.round(corrected)+' nT');
out.innerHTML=html;
}
[baseE,base2E,fieldE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
