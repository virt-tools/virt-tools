<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Raised Bed Waterer — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Raised Bed Waterer</h1>
<p>Calculate water volume, soak time, and emitter count for a raised bed from bed dimensions and soil type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Bed width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Bed length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-d">Soil depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-st">Soil type 1-3</label><input type="text" id="in-st" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit"></div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),dEl=document.getElementById("in-d"),stEl=document.getElementById("in-st"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),D=pn(dEl.value),ST=pn(stEl.value);
if(W==null||L==null||D==null||ST==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(D)||!isFinite(ST)||W<=0||L<=0||D<=0||ST<1||ST>3){err.textContent="Enter valid values.";return}
err.textContent="";
var bedVol=W*L*D/12;
var waterPerSqFt=ST===1?0.5:ST===2?0.75:1.0;
var waterGal=W*L*waterPerSqFt*7.48;
var emitterRate=1;
var soakMin=Math.ceil(waterGal/emitterRate/2);
var emitters=Math.ceil(W*L/4);
var html='<div class="big">'+rnd(waterGal,0)+' gal</div>';
html+=row("Bed area",rnd(W*L,0)+' sq ft');
html+=row("Soil volume",rnd(bedVol,1)+' cu ft');
html+=row("Soil type",ST===1?"Sandy":ST===2?"Loam":"Clay");
html+=row("Water needed",rnd(waterGal,0)+' gal');
html+=row("Emitters",emitters);
html+=row("Soak time",soakMin+' min');
out.innerHTML=html;
}
[wEl,lEl,dEl,stEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
