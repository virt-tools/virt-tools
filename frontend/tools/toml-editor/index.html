<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOML Editor & Validator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>TOML Editor & Validator</h1>
<p class="subtitle">Validate TOML syntax, parse to JSON, and detect common syntax errors. 100% client-side.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem;">
<div>
<label style="font-weight:bold;">TOML Input</label>
<textarea id="input" rows="20" style="width:100%;font-family:monospace;font-size:.85rem;padding:.5rem;border:2px solid #ddd;border-radius:8px;" placeholder='[package]
name = "myapp"
version = "1.0.0"

[dependencies]
serde = "1.0"
tokio = { version = "1", features = ["full"] }' aria-label="[Package]
Name ="></textarea>
<button id="validate" style="margin-top:.5rem;padding:.5rem 1.5rem;border:none;border-radius:8px;cursor:pointer;font-weight:bold;background:#2563eb;color:#fff;" type="button">Validate & Parse</button>
</div>
<div>
<label style="font-weight:bold;">Output</label>
<div id="status" style="margin-bottom:.5rem;padding:.5rem;border-radius:8px;font-weight:bold;display:none;"></div>
<textarea id="output" rows="20" readonly style="width:100%;font-family:monospace;font-size:.85rem;padding:.5rem;border:2px solid #ddd;border-radius:8px;background:#f9fafb;" placeholder="Results..." aria-label="Results..."></textarea>
<button id="copy" style="margin-top:.5rem;padding:.5rem 1.5rem;border:none;border-radius:8px;cursor:pointer;font-weight:bold;background:#10b981;color:#fff;display:none;" type="button">Copy JSON</button>
</div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const output=document.getElementById('output');
const status=document.getElementById('status');
const copyBtn=document.getElementById('copy');

function parseTOML(text){
  const result={};
  let current=result;
  const lines=text.split('\n');
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trim();
    if(!line||line.startsWith('#'))continue;
    if(line.startsWith('[')&&line.endsWith(']')){
      const sectionPath=line.substring(1,line.length-1).trim().split('.').map(s=>s.trim());
      let target=result;
      for(const sec of sectionPath){
        if(!target[sec])target[sec]={};
        target=target[sec];
      }
      current=target;
      continue;
    }
    if(line.startsWith('[[')&&line.endsWith(']]')){
      const arrKey=line.substring(2,line.length-2).trim();
      if(!current[arrKey])current[arrKey]=[];
      current[arrKey].push({});
      current=current[arrKey][current[arrKey].length-1];
      continue;
    }
    const eqIdx=line.indexOf('=');
    if(eqIdx===-1)throw new Error('Line '+(li+1)+': Missing = sign');
    const key=line.substring(0,eqIdx).trim().replace(/^["']|["']$/g,'');
    let val=line.substring(eqIdx+1).trim();
    current[key]=parseVal(val,li+1);
  }
  return result;
}

function parseVal(val,line){
  if(val.startsWith('"')&&val.endsWith('"'))return val.substring(1,val.length-1);
  if(val.startsWith("'")&&val.endsWith("'"))return val.substring(1,val.length-1);
  if(val==='true'||val==='false')return val==='true';
  if(val.startsWith('[')&&val.endsWith(']')){
    return val.substring(1,val.length-1).split(',').map(s=>parseVal(s.trim(),line));
  }
  if(val.startsWith('{')&&val.endsWith('}')){
    const obj={};
    const pairs=val.substring(1,val.length-1).split(',');
    for(const p of pairs){
      const [k,v]=p.split('=').map(s=>s.trim());
      if(k&&v)obj[k.replace(/^["']|["']$/g,'')]=parseVal(v,line);
    }
    return obj;
  }
  if(!isNaN(val)&&val!=='')return Number(val);
  return val;
}

document.getElementById('validate').addEventListener('click',function(){
  try{
    const toml=input.value;
    if(!toml.trim()){showStatus('Please enter TOML.','error');return;}
    const parsed=parseTOML(toml);
    output.value=JSON.stringify(parsed,null,2);
    showStatus('Valid TOML! Parsed to JSON.','ok');
    copyBtn.style.display='inline-block';
  }catch(e){
    showStatus(e.message,'error');
    output.value='';
    copyBtn.style.display='none';
  }
});

copyBtn.addEventListener('click',function(){navigator.clipboard.writeText(output.value);});

function showStatus(msg,type){
  status.textContent=msg;
  status.style.display='block';
  if(type==='ok'){status.style.background='#dcfce7';status.style.color='#166534';}
  else{status.style.background='#fee2e2';status.style.color='#991b1b';}
}
})();
</script>
</body>
</html>
