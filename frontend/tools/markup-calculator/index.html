<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markup Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.mk{max-width:520px;margin:0 auto;padding:2rem 1rem}
.mk h1{font-size:2rem;margin-bottom:.5rem}
.mk .sub{color:#888;margin-bottom:1.5rem}
.mk label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.mk input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.mk select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.mk .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.mk .results{margin-top:2rem}
.mk .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.mk .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.mk .res-card .lbl{color:#888;font-size:13px}
.mk .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="mk">
<h1>📊 Markup & Margin Calculator</h1>
<p class="sub">Calculate markup, gross margin, selling price, and profit from cost and desired percentage.</p>
<label for="cost">Cost ($):</label>
<input type="number" id="cost" value="50" min="0" step="0.01" oninput="calc()">
<label for="pct">Percentage:</label>
<input type="number" id="pct" value="40" min="0" step="0.01" oninput="calc()">
<label for="mode">Mode:</label>
<select id="mode" onchange="calc()">
<option value="markup">Markup on cost</option>
<option value="margin">Gross margin on price</option>
</select>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const cost=parseFloat(document.getElementById('cost').value)||0;
  const pct=parseFloat(document.getElementById('pct').value)||0;
  const mode=document.getElementById('mode').value;
  let price, profit, markupPct, marginPct;
  if(mode==='markup'){
    profit=cost*(pct/100);
    price=cost+profit;
    markupPct=pct;
    marginPct=price===0?0:(profit/price)*100;
  }else{
    price=cost/(1-pct/100);
    profit=price-cost;
    marginPct=pct;
    markupPct=cost===0?0:(profit/cost)*100;
  }
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Selling Price</div><div class="big">$'+price.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Profit</div><div class="big" style="color:#27ae60">$'+profit.toFixed(2)+'</div></div>';
  html+='</div>';
  html+='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Markup</div><div class="big" style="font-size:1.5rem;color:#e67e22">'+markupPct.toFixed(2)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Gross Margin</div><div class="big" style="font-size:1.5rem;color:#3498db">'+marginPct.toFixed(2)+'%</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Key difference</div><div style="font-size:13px;margin-top:8px;color:#666">Markup = (Price − Cost) / Cost<br>Margin = (Price − Cost) / Price<br>A 40% markup ≠ 40% margin. Same $ profit, different base.</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
