<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Bandwidth Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Bandwidth Calculator</h1>
<p>Calculate required bandwidth from data rate and modulation scheme. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dr">Data rate</label><input type="text" id="in-dr" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">Mbps</div></div>
<div class="field"><label class="f" for="in-bps">Bits per symbol</label><input type="text" id="in-bps" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">bits</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var drE=document.getElementById("in-dr"),bpsE=document.getElementById("in-bps"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var dr=parseFloat(drE.value),bps=parseFloat(bpsE.value);
err.textContent="";
if(isNaN(dr)||isNaN(bps)){reset();return}
if(!isFinite(dr)||!isFinite(bps)||dr<0||bps<=0){err.textContent="Data rate must be zero or positive, and bits per symbol must be greater than zero.";reset();return}
var bw=dr/(2*bps);
var html='<div class="big">'+(Math.round(bw*100)/100)+' MHz</div>';
html+=row("Bandwidth",Math.round(bw*100)/100+' MHz');
html+=row("Symbol rate",Math.round((dr/bps)*100)/100+' Msym/s');
html+=row("Data rate",dr+' Mbps');
out.innerHTML=html;
}
[drE,bpsE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
