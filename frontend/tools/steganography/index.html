<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steganography Tool — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Steganography</h1>
<p class="subtitle">Hide and reveal secret text messages in images using LSB encoding. 100% client-side.</p>
<div class="input-section">
<label>Choose Image</label>
<input type="file" id="file" accept="image/png,image/bmp" aria-label="File">
<br>
<label>Secret Message</label>
<textarea id="message" rows="4" placeholder="Enter secret message to hide..." aria-label="Enter Secret Message To Hide..."></textarea>
<div class="btn-row">
<button id="encode" class="primary-btn" type="button">Encode Message</button>
<button id="decode" class="primary-btn" type="button">Decode Message</button>
</div>
</div>
<div id="preview" style="margin-top:1em;"></div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
let img=null;
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');
document.getElementById('file').addEventListener('change',e=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>{img=new Image();img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);};img.src=ev.target.result;};
r.readAsDataURL(f);
});
document.getElementById('encode').addEventListener('click',()=>{
if(!img)return alert('Please select an image first.');
const msg=document.getElementById('message').value;
const bits=[];
for(let i=0;i<msg.length;i++){for(let b=7;b>=0;b--)bits.push((msg.charCodeAt(i)>>b)&1);}
bits.push(0,0,0,0,0,0,0,0);
const data=ctx.getImageData(0,0,canvas.width,canvas.height);
if(bits.length>data.data.length/4*3)return alert('Message too long for this image.');
for(let i=0;i<bits.length;i++){
const pi=Math.floor(i/3),ci=i%3;
data.data[pi*4+ci]=(data.data[pi*4+ci]&0xFE)|bits[i];
}
ctx.putImageData(data,0,0);
const url=canvas.toDataURL('image/png');
const prev=document.getElementById('preview');
prev.innerHTML='<img src="'+url+'" style="max-width:400px;border:1px solid #ccc"><br><a href="'+url+'" download="stego.png" class="primary-btn">Download Stego Image</a>';
});
document.getElementById('decode').addEventListener('click',()=>{
if(!img)return alert('Please select an image first.');
const data=ctx.getImageData(0,0,canvas.width,canvas.height);
const bits=[];
for(let i=0;i<data.data.length/4*3;i++){
const pi=Math.floor(i/3),ci=i%3;
bits.push(data.data[pi*4+ci]&1);
}
let msg='',code=0;
for(let i=0;i<bits.length;i++){
code=(code<<1)|bits[i];
if((i+1)%8===0){
if(code===0){document.getElementById('result').innerHTML='<p><strong>Decoded:</strong> '+msg.replace(/</g,'&lt;')+'</p>';return;}
msg+=String.fromCharCode(code);code=0;
}
}
alert('No hidden message found.');
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
