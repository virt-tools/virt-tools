<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cleanout Spacer — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cleanout Spacer</h1>
<p>Calculate the number and placement of plumbing cleanouts from pipe length and required spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Pipe length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-sp">Spacing</label><input type="text" id="in-sp" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">m between</div></div>
<div class="field"><label class="f" for="in-turns">Direction changes</label><input type="text" id="in-turns" inputmode="decimal" autocomplete="off" placeholder="0"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter pipe length.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),spEl=document.getElementById("in-sp"),tEl=document.getElementById("in-turns"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),SP=pn(spEl.value),T=pn(tEl.value);
if(L==null){return}
SP=SP==null?15:SP;T=T==null?0:T;
if(!isFinite(L)||!isFinite(SP)||!isFinite(T)||L<=0||SP<=0||T<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var straight=Math.floor(L/SP)+1;
var total=straight+T;
var html='<div class="big">'+total+' cleanouts</div>';
html+=row("Pipe length",rnd(L,1)+" m");
html+=row("Spacing",rnd(SP,1)+" m");
html+=row("Straight-run cleanouts",straight);
html+=row("Direction-change cleanouts",T);
html+=row("Total cleanouts",total);
out.innerHTML=html;
}
[lEl,spEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
