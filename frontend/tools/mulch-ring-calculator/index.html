<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Mulch Ring Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Mulch Ring Calculator</h1>
<p>Calculate mulch volume and tree ring area from trunk diameter, ring radius, and mulch depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-trunk">Trunk diameter</label><input type="text" id="in-trunk" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-ring">Ring radius</label><input type="text" id="in-ring" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-depth">Mulch depth</label><input type="text" id="in-depth" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var trunkEl=document.getElementById("in-trunk"),ringEl=document.getElementById("in-ring"),depthEl=document.getElementById("in-depth"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Trunk=pn(trunkEl.value),Ring=pn(ringEl.value),Depth=pn(depthEl.value);
if(Trunk==null||Ring==null||Depth==null)return;
if(!isFinite(Trunk)||!isFinite(Ring)||!isFinite(Depth)||Trunk<=0||Ring<=0||Depth<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var trunkRadius=Trunk/2/12;
var ringArea=Math.PI*(Math.pow(Ring,2)-Math.pow(trunkRadius,2));
var mulchVol=ringArea*(Depth/12);
var mulchBags=Math.ceil(mulchVol/2);
var html='<div class="big">'+rnd(mulchVol,1)+' cu ft</div>';
html+=row("Ring area",rnd(ringArea,0)+' sq ft');
html+=row("Mulch volume",rnd(mulchVol,1)+' cu ft');
html+=row("Mulch bags (2 cu ft)",mulchBags);
out.innerHTML=html;
}
[trunkEl,ringEl,depthEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
