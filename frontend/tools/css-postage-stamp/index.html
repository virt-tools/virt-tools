<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Postage Stamp Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#222;border-radius:12px;overflow:hidden;position:relative;height:350px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📮 CSS Postage Stamp Generator</h1>
<p>Create CSS postage stamp with perforated edges, denomination, and country label. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Country</label><input type="text" id="country" value="virt.tools" style="width:150px" aria-label="Country"></div>
<div class="ctrl-row"><label>Denomination</label><input type="text" id="denom" value="50c" style="width:80px" aria-label="Denom"></div>
<div class="ctrl-row"><label>Stamp Color</label><input type="color" id="scolor" value="#3182ce" aria-label="Scolor"></div>
<div class="ctrl-row"><label>Border Color</label><input type="color" id="bcolor" value="#1a1a1a" aria-label="Bcolor"></div>
<div class="ctrl-row"><label>Rotation</label><input type="range" id="rot" min="-10" max="10" step="1" value="2" style="width:200px" aria-label="Rot"></div>
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="classic">Classic</option><option value="vintage">Vintage</option><option value="modern">Modern</option><option value="airmail">Airmail</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var c=document.getElementById('country').value;
var d=document.getElementById('denom').value;
var sc=document.getElementById('scolor').value;
var bc=document.getElementById('bcolor').value;
var rot=parseInt(document.getElementById('rot').value);
var style=document.getElementById('style').value;
var html='<div class="stamp">\n  <div class="stamp-inner">\n    <div class="stamp-country">'+c+'</div>\n    <div class="stamp-img"></div>\n    <div class="stamp-denom">'+d+'</div>\n  </div>\n</div>';
var filter='none';
var borderStyle='solid';
if(style==='vintage')filter='sepia(.5) contrast(1.1)';
if(style==='airmail')borderStyle='dashed';
var css='.stamp{width:160px;height:200px;background:'+sc+';padding:6px;filter:'+filter+';transform:rotate('+rot+'deg);box-shadow:0 2px 8px rgba(0,0,0,0.3)}\n';
css+='.stamp-inner{width:100%;height:100%;border:3px '+borderStyle+' '+bc+';display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px;position:relative}\n';
css+='.stamp-country{font-size:10px;font-weight:bold;color:'+bc+';text-transform:uppercase;letter-spacing:1px}\n';
css+='.stamp-img{width:80px;height:80px;border-radius:50%;background:'+bc+';opacity:.8}\n';
css+='.stamp-denom{font-size:18px;font-weight:bold;color:'+bc+'}\n';
if(style==='airmail'){
css+='.stamp{background:repeating-linear-gradient(45deg,#e53e3e 0,#e53e3e 10px,#fff 10px,#fff 20px)}\n';
css+='.stamp-inner{background:#fff}\n';
css+='.stamp-country,.stamp-denom{color:#e53e3e}\n';
}
if(style==='modern'){
css+='.stamp-img{border-radius:0;width:100px;height:70px;background:linear-gradient(135deg,'+bc+','+sc+')}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['country','denom','scolor','bcolor','rot','style'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
