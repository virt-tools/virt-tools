<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Network Port Labeler — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-2824399c.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Network Port Labeler</h1>
<p>Generate structured port labels from rack number, switch U position, and port count. Useful for patch panel documentation. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Rack number</label><input type="text" id="in-r" inputmode="numeric" autocomplete="off" placeholder="e.g. 3"><div class="unit">number</div></div>
<div class="field"><label class="f" for="in-u">U position</label><input type="text" id="in-u" inputmode="numeric" autocomplete="off" placeholder="e.g. 24"><div class="unit">U</div></div>
<div class="field"><label class="f" for="in-p">Ports</label><input type="text" id="in-p" inputmode="numeric" autocomplete="off" placeholder="e.g. 48"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var rEl=document.getElementById("in-r"),uEl=document.getElementById("in-u"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=parseInt(rEl.value),U=parseInt(uEl.value),P=parseInt(pEl.value);
if(isNaN(R)||isNaN(U)||isNaN(P))return;
if(R<=0||U<=0||P<=0){err.textContent="All values must be positive integers.";return}
err.textContent="";
var prefix="R"+R+"-U"+U;
var labels=[];
for(var i=1;i<=Math.min(P,12);i++){labels.push(prefix+"-P"+String(i).padStart(2,"0"))}
var html='<div class="big">'+prefix+'</div>';
html+='<div class="row"><span class="k">Label prefix</span><span class="v">'+prefix+'</span></div>';
html+='<div class="row"><span class="k">Total ports</span><span class="v">'+P+'</span></div>';
html+='<div class="row"><span class="k">Label format</span><span class="v">'+prefix+'-P##</span></div>';
html+='<div style="margin-top:8px;font-size:12px;color:var(--text-dim,#9aa3b2)">First 12 labels:</div>';
html+='<div style="font-family:ui-monospace,monospace;font-size:13px;margin-top:4px">'+labels.join("<br>")+'</div>';
if(P>12)html+='<div style="margin-top:4px;font-size:12px;color:var(--text-dim,#9aa3b2)">... and '+(P-12)+' more</div>';
out.innerHTML=html;
}
[rEl,uEl,pEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
