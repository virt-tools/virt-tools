<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Heartbeat Pulse Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>💓 CSS Heartbeat Pulse Generator</h1>
<p>Create CSS heartbeat pulse / ECG animation. 4 styles, adjustable speed, color, size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style"><option value="heart">Heart</option><option value="ecg">ECG Line</option><option value="ring">Pulse Ring</option><option value="bars">Heartbeat Bars</option></select></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#ff4444"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="0.5" max="3" step="0.1" value="1" style="width:200px"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="30" max="120" value="60" style="width:200px"></div>
<div class="ctrl-row"><label>Glow</label><input type="checkbox" id="glow" checked></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var cl=document.getElementById('color').value;
var sp=parseFloat(document.getElementById('speed').value);
var sz=parseInt(document.getElementById('size').value);
var gl=document.getElementById('glow').checked;
var glow=gl?'0 0 20px '+cl:'none';
var html='',css='';
if(st==='heart'){
html='<div class="heartbeat-heart"></div>';
css='.heartbeat-heart{width:'+sz+'px;height:'+sz+'px;background:'+cl+';position:relative;transform:rotate(-45deg);animation:hb-beat '+sp+'s ease-in-out infinite;box-shadow:'+glow+'}\n';
css+='.heartbeat-heart:before,.heartbeat-heart:after{content:"";position:absolute;width:'+sz+'px;height:'+sz+'px;background:'+cl+';border-radius:50%}\n';
css+='.heartbeat-heart:before{top:-'+sz/2+'px;left:0}\n';
css+='.heartbeat-heart:after{top:0;left:'+sz/2+'px}\n';
css+='@keyframes hb-beat{0%,100%{transform:rotate(-45deg) scale(1)}15%{transform:rotate(-45deg) scale(1.25)}30%{transform:rotate(-45deg) scale(1)}45%{transform:rotate(-45deg) scale(1.15)}}\n';
}else if(st==='ecg'){
html='<div class="heartbeat-ecg"><svg width="300" height="100"><polyline class="ecg-line" points="0,50 60,50 70,50 75,20 80,80 85,30 90,50 100,50 110,50 120,50 130,50 135,50 300,50" fill="none" stroke="'+cl+'" stroke-width="3"/></svg></div>';
css='.heartbeat-ecg svg{filter:drop-shadow('+glow+')}\n';
css+'.ecg-line{stroke-dasharray:400;stroke-dashoffset:400;animation:hb-ecg '+sp+'s linear infinite}\n';
css+='@keyframes hb-ecg{0%{stroke-dashoffset:400}100%{stroke-dashoffset:0}}\n';
}else if(st==='ring'){
html='<div class="heartbeat-ring"></div>';
css='.heartbeat-ring{width:'+sz+'px;height:'+sz+'px;border:3px solid '+cl+';border-radius:50%;animation:hb-ring '+sp+'s ease-out infinite;box-shadow:'+glow+'}\n';
css+='@keyframes hb-ring{0%{transform:scale(0.5);opacity:1}100%{transform:scale(2);opacity:0}}\n';
}else if(st==='bars'){
html='<div class="heartbeat-bars"></div>';
css='.heartbeat-bars{display:flex;align-items:center;gap:4px;height:'+(sz+20)+'px}\n';
css+='.heartbeat-bars .bar{width:'+(sz/6)+'px;background:'+cl+';border-radius:2px;box-shadow:'+glow+';animation:hb-bars '+sp+'s ease-in-out infinite}\n';
css+='@keyframes hb-bars{0%,100%{height:20%}50%{height:100%}}\n';
}
var pv=document.getElementById('preview');
pv.innerHTML='<style>'+css+'</style>'+html;
if(st==='bars'){
var bb=pv.querySelector('.heartbeat-bars');
for(var i=0;i<8;i++){var b=document.createElement('div');b.className='bar';b.style.animationDelay=(i*0.1)+'s';bb.appendChild(b)}
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','color','speed','size','glow'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
