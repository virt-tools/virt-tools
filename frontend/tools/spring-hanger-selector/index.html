<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Spring Hanger Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Spring Hanger Selector</h1>
<p>Select spring hanger size, calculate spring rate, and movement from operating load and thermal expansion. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Operating load</label><input type="text" id="in-load" inputmode="numeric" autocomplete="off" placeholder="e.g. 500"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-mov">Thermal movement</label><input type="text" id="in-mov" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-tol">Load tolerance</label><input type="text" id="in-tol" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var loadEl=document.getElementById("in-load"),movEl=document.getElementById("in-mov"),tolEl=document.getElementById("in-tol"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var LOAD=parseInt(loadEl.value),MOV=parseFloat(movEl.value),TOL=parseFloat(tolEl.value);
if(isNaN(LOAD)||isNaN(MOV)||isNaN(TOL))return;
if(LOAD<=0||MOV<=0||TOL<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var maxRate=(LOAD*TOL)/MOV;
var coldLoad=LOAD-(MOV*maxRate);
var springType=maxRate<50?"Low load":maxRate<200?"Medium load":maxRate<1000?"High load":"Variable spring";
var html='<div class="big">'+Math.round(maxRate)+' lb/in</div>';
html+=row("Max spring rate",Math.round(maxRate)+" lb/in");
html+=row("Cold load",Math.round(coldLoad)+" lb");
html+=row("Hot load",LOAD+" lb");
html+=row("Load variation",Math.round(TOL*100)+"%");
html+=row("Spring type",springType);
out.innerHTML=html;
}
[loadEl,movEl,tolEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
