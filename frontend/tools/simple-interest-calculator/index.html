<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Interest Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.si{max-width:600px;margin:0 auto;padding:2rem 1rem}
.si h1{font-size:2rem;margin-bottom:.5rem}
.si .sub{color:#888;margin-bottom:1.5rem}
.si label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.si input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.si .row{display:flex;gap:1rem}
.si .row>div{flex:1}
.si .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.si .results{margin-top:2rem}
.si .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.si .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.si .res-card .lbl{color:#888;font-size:13px}
.si .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="si">
<h1>💵 Simple Interest Calculator</h1>
<p class="sub">Calculate simple interest (I = P × r × t) and total amount owed.</p>
<label for="p">Principal ($):</label>
<input type="number" id="p" value="10000" min="0" oninput="calc()">
<div class="row">
<div><label for="r">Annual rate (%):</label>
<input type="number" id="r" value="5" min="0" step="0.01" oninput="calc()"></div>
<div><label for="t">Time (years):</label>
<input type="number" id="t" value="3" min="0" step="0.01" oninput="calc()"></div>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const P=parseFloat(document.getElementById('p').value)||0;
  const r=(parseFloat(document.getElementById('r').value)||0)/100;
  const t=parseFloat(document.getElementById('t').value)||0;
  const I=P*r*t;
  const total=P+I;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Interest</div><div class="big" style="color:#e74c3c">$'+I.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Total Amount</div><div class="big" style="color:#27ae60">$'+total.toFixed(2)+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Formula</div><div style="font-size:15px;margin-top:4px">I = P × r × t = '+P.toFixed(2)+' × '+(r*100).toFixed(2)+'% × '+t+'</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
