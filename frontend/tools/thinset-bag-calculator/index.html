<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Thinset Bag Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Thinset Bag Calculator</h1>
<p>Calculate thinset mortar bags needed from tile area, trowel notch size, and bag coverage. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Tile area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-n">Trowel notch</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-c">Bag coverage</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 75"><div class="unit">sq ft/bag</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),nEl=document.getElementById("in-n"),cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),N=pn(nEl.value),C=pn(cEl.value);
if(A==null||N==null||C==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return;}
if(!isFinite(A)||!isFinite(N)||!isFinite(C)||A<=0||N<=0||C<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var factor=1+N*0.8;
var adj=A*factor;
var bags=Math.ceil(adj/C);
var html='<div class="big">'+rnd(bags,0)+' bags</div>';
html+=row("Tile area",rnd(A,0)+' sq ft');
html+=row("Trowel notch",rnd(N,2)+' in');
html+=row("Adjusted area",rnd(adj,0)+' sq ft');
html+=row("Bag coverage",rnd(C,0)+' sq ft/bag');
html+=row("Bags needed",rnd(bags,0)+' bags');
out.innerHTML=html;
}
[aEl,nEl,cEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
