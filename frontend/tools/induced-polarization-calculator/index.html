<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Induced Polarization Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Induced Polarization Calculator</h1>
<p>Calculate chargeability and apparent resistivity from IP survey on-time, off-time voltages, and Wenner geometry. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-von">On-time voltage</label><input type="text" id="in-von" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-voff">Off-time voltage</label><input type="text" id="in-voff" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-i">Current</label><input type="text" id="in-i" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-a">Electrode spacing</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vonE=document.getElementById("in-von"),voffE=document.getElementById("in-voff"),iE=document.getElementById("in-i"),aE=document.getElementById("in-a"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Von=parseFloat(vonE.value),Voff=parseFloat(voffE.value),I=parseFloat(iE.value),a=parseFloat(aE.value);
if(isNaN(Von)||isNaN(Voff)||isNaN(I)||isNaN(a))return;
if(Von<=0||I<=0||a<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var rho=2*Math.PI*a*Von/I;
var M=Voff/Von*100;
var html='<div class="big">'+Math.round(M*100)/100+' %</div>';
html+=row("Chargeability M",Math.round(M*100)/100+' %');
html+=row("Apparent resistivity",Math.round(rho)+' Ω·m');
out.innerHTML=html;
}
[vonE,voffE,iE,aE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
