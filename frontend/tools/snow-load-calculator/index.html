<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Load Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Snow Load Calculator</h1>
<p class="subtitle">Estimate the weight of snow on a roof to prevent structural issues.</p>
<div class="input-section">
<label>Roof Area (sq ft)</label>
<input type="number" id="area" value="2000" min="0" aria-label="Area">
<label>Snow Depth (inches)</label>
<input type="number" id="depth" value="12" min="0" step="0.5" aria-label="Depth">
<label>Snow Density (pcf)</label>
<select id="density" aria-label="Density">
<option value="6.25">Light & Fluffy (6.25 pcf)</option>
<option value="12.5" selected>Average (12.5 pcf)</option>
<option value="25">Wet & Heavy (25 pcf)</option>
<option value="31.25">Packed/Wet (31.25 pcf)</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const A=parseFloat(document.getElementById('area').value)||0;
const D=parseFloat(document.getElementById('depth').value)||0;
const P=parseFloat(document.getElementById('density').value);
const depthFt=D/12;
const totalWeight=A*depthFt*P;
const psf=depthFt*P;
let warn=totalWeight>20000?'<p class="warning">⚠️ Heavy load — consider removal</p>':totalWeight>10000?'<p class="warning">⚠️ Moderate load — monitor closely</p>':'<p class="ok">✓ Load is within safe range</p>';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Roof Area:</span><span>${A.toLocaleString()} sq ft</span></div>
<div class="result-row"><span>Snow Depth:</span><span>${D} inches</span></div>
<div class="result-row"><span>Weight per sq ft:</span><span>${psf.toFixed(1)} psf</span></div>
<div class="result-row"><span>Total Snow Weight:</span><span>${totalWeight.toLocaleString(undefined,{maximumFractionDigits:0})} lbs</span></div>
${warn}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
