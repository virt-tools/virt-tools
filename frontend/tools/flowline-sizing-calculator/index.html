<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Flowline Sizing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Flowline Sizing Calculator</h1>
<p>Size subsea flowline diameter from production rate, fluid velocity, and API gravity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Production rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-vel">Target velocity</label><input type="text" id="in-vel" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">ft/s</div></div>
<div class="field"><label class="f" for="in-api">API gravity</label><input type="text" id="in-api" inputmode="decimal" autocomplete="off" placeholder="e.g. 35"><div class="unit">°API</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rate"),vE=document.getElementById("in-vel"),aE=document.getElementById("in-api"),out=document.getElementById("out");
function calc(){
var r=parseFloat(rE.value),v=parseFloat(vE.value),a=parseFloat(aE.value);
if(isNaN(r)||isNaN(v)||isNaN(a))return;
var bpdToCfs=r*5.615/86400;
var area=bpdToCfs/v;
var dia=Math.sqrt(area/(Math.PI/4))*12;
var html='<div class="big">'+(Math.round(dia*10)/10)+' in</div>';
html+=row("Flowline diameter",Math.round(dia*10)/10+' in');
html+=row("Cross-section area",Math.round(area*10000)/10000+' ft²');
out.innerHTML=html;
}
[rE,vE,aE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
