<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Subsea Compression Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Subsea Compression Selector</h1>
<p>Select subsea gas compression unit power, discharge pressure, and motor rating from gas flow rate and inlet pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Gas flow rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">MMscfd</div></div>
<div class="field"><label class="f" for="in-inlet">Inlet pressure</label><input type="text" id="in-inlet" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">psi</div></div>
<div class="field"><label class="f" for="in-ratio">Compression ratio</label><input type="text" id="in-ratio" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ratio</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rate"),iE=document.getElementById("in-inlet"),raE=document.getElementById("in-ratio"),out=document.getElementById("out");
function calc(){
var r=parseFloat(rE.value),i=parseFloat(iE.value),ra=parseFloat(raE.value);
if(isNaN(r)||isNaN(i)||isNaN(ra))return;
var power=r*ra*50;
var discharge=i*ra;
var motor=power*1.15;
var html='<div class="big">'+(Math.round(power))+' kW</div>';
html+=row("Compressor power",Math.round(power)+' kW');
html+=row("Discharge pressure",Math.round(discharge)+' psi');
html+=row("Motor rating",Math.round(motor)+' kW');
out.innerHTML=html;
}
[rE,iE,raE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
