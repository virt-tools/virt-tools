<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Free Space Path Loss Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Free Space Path Loss Calculator</h1>
<p>Calculate FSPL in dB from frequency and distance using the Friis equation. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-f">Frequency</label><input type="text" id="in-f" inputmode="decimal" autocomplete="off" placeholder="e.g. 2400"><div class="unit">MHz</div></div>
<div class="field"><label class="f" for="in-d">Distance</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">km</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fE=document.getElementById("in-f"),dE=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var f=parseFloat(fE.value),d=parseFloat(dE.value);
err.textContent="";
if(isNaN(f)||isNaN(d)){reset();return}
if(!isFinite(f)||!isFinite(d)||f<=0||d<=0){err.textContent="Frequency and distance must be positive numbers.";reset();return}
var fspl=20*Math.log10(d*1000)+20*Math.log10(f)-27.55;
var html='<div class="big">'+(Math.round(fspl*100)/100)+' dB</div>';
html+=row("FSPL",Math.round(fspl*100)/100+' dB');
html+=row("Frequency",f+' MHz');
html+=row("Distance",d+' km');
out.innerHTML=html;
}
[fE,dE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
