<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Speedometer Gauge Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:220px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🏃 CSS Speedometer Gauge Generator</h1>
<p>Create CSS speedometer dashboard gauges. 4 styles, adjustable value/max/size/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="semi" selected>Semicircle</option><option value="full">Full Circle</option><option value="digital">Digital</option><option value="dual">Dual Arc</option></select></div>
<div class="ctrl-row"><label>Value</label><input type="number" id="value" value="65" min="0" max="180" style="width:80px" aria-label="Value"></div>
<div class="ctrl-row"><label>Max</label><input type="number" id="max" value="120" min="10" max="300" style="width:80px" aria-label="Max"></div>
<div class="ctrl-row"><label>Size</label><select id="size" aria-label="Size"><option value="sm">Small</option><option value="md" selected>Medium</option><option value="lg">Large</option></select></div>
<div class="ctrl-row"><label>Accent</label><input type="color" id="accent" value="#667eea" style="width:50px;height:36px" aria-label="Accent"></div>
<div class="ctrl-row"><label>Unit</label><input type="text" id="unit" value="km/h" style="width:100px" aria-label="Unit"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var style=document.getElementById('style').value;
var val=parseFloat(document.getElementById('value').value)||0;
var max=parseFloat(document.getElementById('max').value)||100;
var size=document.getElementById('size').value;
var accent=document.getElementById('accent').value;
var unit=document.getElementById('unit').value;
var sz={sm:150,md:220,lg:300}[size];
var pct=Math.min(val/max,1);
var deg=pct*270-135;
var html='',css='';
if(style==='semi'||style==='dual'){
html='<div class="speedo">\n  <div class="speedo-arc"></div>\n  '+(style==='dual'?'<div class="speedo-arc2"></div>\n  ':'')+'<div class="speedo-needle"></div>\n  <div class="speedo-center">'+val+'<span>'+unit+'</span></div>\n</div>';
css='.speedo{position:relative;width:'+sz+'px;height:'+(sz*0.6)+'px;overflow:hidden}\n';
css+='.speedo-arc{position:absolute;width:'+sz+'px;height:'+sz+'px;border:'+(sz*0.05)+'px solid #333;border-radius:50%;border-bottom-color:transparent;border-left-color:transparent;clip-path:polygon(0 0,100% 0,100% 50%,0 50%)}\n';
css+='.speedo-arc{border-top-color:'+accent+';border-right-color:'+accent+'}\n';
if(style==='dual'){
css+='.speedo-arc2{position:absolute;width:'+sz+'px;height:'+sz+'px;border:'+(sz*0.03)+'px solid rgba(255,255,255,.1);border-radius:50%;border-bottom-color:transparent;border-left-color:transparent;clip-path:polygon(0 0,100% 0,100% 50%,0 50%);top:3px;left:3px;width:'+(sz-6)+'px;height:'+(sz-6)+'px}\n';
}
css+='.speedo-needle{position:absolute;width:2px;height:'+(sz*0.38)+'px;background:'+accent+';left:50%;bottom:0;transform-origin:bottom center;transform:translateX(-50%) rotate('+deg+'deg);border-radius:2px;transition:transform .3s}\n';
css+='.speedo-needle::after{content:"";position:absolute;bottom:-'+(sz*0.03)+'px;left:50%;width:'+(sz*0.06)+'px;height:'+(sz*0.06)+'px;background:'+accent+';border-radius:50%;transform:translateX(-50%)}\n';
css+='.speedo-center{position:absolute;bottom:'+(sz*0.08)+'px;left:50%;transform:translateX(-50%);font-size:'+(sz*0.1)+'px;font-weight:bold;color:#eee;text-align:center}\n';
css+='.speedo-center span{display:block;font-size:'+(sz*0.05)+'px;font-weight:normal;color:#888}\n';
}else if(style==='full'){
html='<div class="speedo-full">\n  <div class="speedo-ring"></div>\n  <div class="speedo-progress"></div>\n  <div class="speedo-center-full">'+val+'<span>'+unit+'</span></div>\n</div>';
var circ=2*Math.PI*(sz*0.42);
var dash=circ*pct;
css='.speedo-full{position:relative;width:'+sz+'px;height:'+sz+'px}\n';
css+='.speedo-ring{position:absolute;width:'+(sz*0.84)+'px;height:'+(sz*0.84)+'px;border-radius:50%;border:'+(sz*0.04)+'px solid #333;top:8%;left:8%}\n';
css+='.speedo-progress{position:absolute;width:'+(sz*0.84)+'px;height:'+(sz*0.84)+'px;border-radius:50%;border:'+(sz*0.04)+'px solid '+accent+';border-top-color:transparent;border-right-color:transparent;border-bottom-color:transparent;top:8%;left:8%;transform:rotate(-90deg);clip-path:inset(0 0 '+(100-pct*100)+'% 0)}\n';
css+='.speedo-center-full{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:'+(sz*0.12)+'px;font-weight:bold;color:#eee;text-align:center}\n';
css+='.speedo-center-full span{display:block;font-size:'+(sz*0.05)+'px;font-weight:normal;color:#888}\n';
}else if(style==='digital'){
html='<div class="speedo-digital">\n  <div class="speedo-bars"></div>\n  <div class="speedo-digital-value">'+val+'<span>'+unit+'</span></div>\n</div>';
css='.speedo-digital{text-align:center;width:'+sz+'px}\n';
var bars=Math.round(sz/12);
css+='.speedo-bars{display:flex;gap:2px;justify-content:center;margin-bottom:10px;height:'+(sz*0.3)+'px;align-items:flex-end}\n';
css+='.speedo-bars div{width:'+(sz/bars*0.6)+'px;height:100%;background:';
var barHtml='';
for(var i=0;i<bars;i++){
var active=i/bars<pct;
var col=active?(i/bars<0.5?accent:i/bars<0.8?'#ffaa44':'#ff4444'):'#333';
barHtml+='<div style="height:'+(50+50*(i/bars))+'%;background:'+col+';border-radius:2px"></div>';
}
css+='#333;border-radius:2px}\n';
html=html.replace('<div class="speedo-bars"></div>','<div class="speedo-bars">'+barHtml+'</div>');
css+='.speedo-digital-value{font-size:'+(sz*0.15)+'px;font-weight:bold;color:'+accent+';font-family:monospace}\n';
css+='.speedo-digital-value span{font-size:'+(sz*0.06)+'px;color:#888;margin-left:5px}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','value','max','size','accent','unit'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
