<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Viking Character Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#1a2a3a,#0a1a2a);border-radius:12px;overflow:hidden;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🪓 CSS Viking Character Generator</h1>
<p>Create CSS viking character with horned helmet, beard, shield, and axe. 4 helmet colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Helmet Color</label><select id="helmetColor"><option value="#9e9e9e">Steel</option><option value="#ffd54f">Gold</option><option value="#37474f">Iron</option><option value="#8d6e63">Bronze</option></select></div>
<div class="ctrl-row"><label>Horn Color</label><input type="color" id="hornColor" value="#ffe0b2" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Beard</label><select id="beard"><option value="long">Long</option><option value="short">Short</option><option value="none">None</option></select></div>
<div class="ctrl-row"><label>Beard Color</label><input type="color" id="beardColor" value="#ff6f00" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Shield</label><select id="shield"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Axe</label><select id="axe"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="190" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var hc=document.getElementById('helmetColor').value;
var hnc=document.getElementById('hornColor').value;
var bd=document.getElementById('beard').value;
var bc=document.getElementById('beardColor').value;
var sh=document.getElementById('shield').value;
var ax=document.getElementById('axe').value;
var sz=parseInt(document.getElementById('size').value);
var hd=sz*0.15,bw=sz*0.26,bh=sz*0.26;
var html='<div class="viking">\n  <div class="head">\n    <div class="helmet"><div class="horn h-left"></div><div class="horn h-right"></div></div>\n    <div class="face"></div>\n'+(bd!=='none'?'    <div class="beard '+bd+'"></div>\n':'')+'  </div>\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="leg l-left"></div>\n  <div class="leg l-right"></div>\n'+(sh==='on'?'  <div class="shield"></div>\n':'')+(ax==='on'?'  <div class="axe"><div class="handle"></div><div class="head"></div></div>\n':'')+'</div>';
var css='.viking{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.head{position:relative;width:'+hd+'px;height:'+(hd*1.1)+'px;z-index:3}\n';
css+='.helmet{position:absolute;top:0;left:50%;transform:translateX(-50%);width:'+(hd*0.85)+'px;height:'+(hd*0.55)+'px;background:linear-gradient(180deg,'+hc+','+hc+' 70%,rgba(0,0,0,0.3));border-radius:50% 50% 10% 10%;z-index:2}\n';
css+='.horn{position:absolute;top:-'+(hd*0.05)+'px;width:'+(hd*0.18)+'px;height:'+(hd*0.35)+'px;background:'+hnc+';border-radius:80% 20% 50% 50%;z-index:1}\n';
css+='.h-left{left:-'+(hd*0.08)+'px;transform:rotate(-25deg)}.h-right{right:-'+(hd*0.08)+'px;transform:rotate(25deg);border-radius:20% 80% 50% 50%}\n';
css+='.face{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:'+(hd*0.6)+'px;height:'+(hd*0.5)+'px;background:#ffcc80;border-radius:0 0 40% 40%;z-index:1}\n';
if(bd==='long'){css+='.beard.long{position:absolute;bottom:-'+(hd*0.4)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.5)+'px;height:'+(hd*0.5)+'px;background:'+bc+';border-radius:0 0 40% 40%;z-index:0}\n'}
if(bd==='short'){css+='.beard.short{position:absolute;bottom:-'+(hd*0.15)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.45)+'px;height:'+(hd*0.2)+'px;background:'+bc+';border-radius:0 0 50% 50%;z-index:0}\n'}
css+='.body{width:'+bw+'px;height:'+bh+'px;background:#455a64;border-radius:15% 15% 5% 5%;z-index:2;margin-top:-2px}\n';
css+='.arm{position:absolute;width:'+(bw*0.22)+'px;height:'+(bh*0.8)+'px;background:#455a64;border-radius:50%;z-index:1;top:'+(sz*0.2)+'px}\n';
css+='.a-left{left:-'+(bw*0.12)+'px;transform:rotate(-15deg)}.a-right{right:-'+(bw*0.12)+'px;transform:rotate(15deg)}\n';
css+='.leg{position:absolute;width:'+(bw*0.22)+'px;height:'+(bh*0.5)+'px;background:#37474f;border-radius:10% 10% 30% 30%;z-index:0;bottom:-'+(bh*0.4)+'px}\n';
css+='.l-left{left:'+(bw*0.15)+'px}.l-right{right:'+(bw*0.15)+'px}\n';
if(sh==='on'){
css+='.shield{position:absolute;left:-'+(sz*0.14)+'px;top:'+(sz*0.22)+'px;width:'+(sz*0.14)+'px;height:'+(sz*0.18)+'px;background:radial-gradient(circle,'+hc+','+hc+' 60%,rgba(0,0,0,0.4));border-radius:50%;border:3px solid rgba(0,0,0,0.4);z-index:5;transform:rotate(-5deg)}\n';
css+='.shield::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(sz*0.03)+'px;height:'+(sz*0.03)+'px;background:rgba(0,0,0,0.5);border-radius:50%}\n';
}
if(ax==='on'){
css+='.axe{position:absolute;right:-'+(sz*0.2)+'px;top:'+(sz*0.1)+'px;transform:rotate(15deg);z-index:6}\n';
css+='.handle{width:'+(sz*0.02)+'px;height:'+(sz*0.2)+'px;background:#5d4037;border-radius:2px}\n';
css+='.head{position:absolute;top:-'+(sz*0.02)+'px;left:-'+(sz*0.04)+'px;width:'+(sz*0.06)+'px;height:'+(sz*0.08)+'px;background:'+hc+';border-radius:50% 50% 50% 50%;clip-path:polygon(0 30%,70% 0,100% 50%,70% 100%,0 70%)}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['helmetColor','hornColor','beard','beardColor','shield','axe','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
