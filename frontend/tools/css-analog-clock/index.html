<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Analog Clock Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);border-radius:12px;padding:2rem 1rem;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🕐 CSS Analog Clock Generator</h1>
<p>Create CSS analog clock face with animated hands. 4 themes, 3 sizes, 12/24 hour markers. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Theme</label><select id="theme"><option value="light" selected>Light</option><option value="dark">Dark</option><option value="neon">Neon</option><option value="wood">Wood</option></select></div>
<div class="ctrl-row"><label>Size</label><select id="size"><option value="200" selected>Medium</option><option value="150">Small</option><option value="300">Large</option></select></div>
<div class="ctrl-row"><label>Hour</label><input type="number" id="hour" value="10" style="width:60px"></div>
<div class="ctrl-row"><label>Minute</label><input type="number" id="minute" value="10" style="width:60px"></div>
<div class="ctrl-row"><label>Second</label><input type="number" id="second" value="30" style="width:60px"></div>
<div class="ctrl-row"><label>Show Numbers</label><select id="numbers"><option value="1" selected>Yes</option><option value="0">No</option></select></div>
<div class="ctrl-row"><label>Smooth Seconds</label><select id="smooth"><option value="1" selected>Yes</option><option value="0">No</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var theme=document.getElementById('theme').value;
var size=parseInt(document.getElementById('size').value);
var h=parseInt(document.getElementById('hour').value)||0;
var m=parseInt(document.getElementById('minute').value)||0;
var s=parseInt(document.getElementById('second').value)||0;
var nums=document.getElementById('numbers').value==='1';
var smooth=document.getElementById('smooth').value==='1';
var hDeg=(h%12)*30+m*0.5;
var mDeg=m*6+s*0.1;
var sDeg=smooth?s*6:Math.floor(s)*6;
var themes={light:{face:'#f5f5f5',border:'#333',mark:'#333',hand:'#222',sechand:'#e74c3c',center:'#333'},dark:{face:'#1a1a2e',border:'#444',mark:'#aaa',hand:'#eee',sechand:'#e74c3c',center:'#888'},neon:{face:'#0a0a1a',border:'#0f0',mark:'#0f0',hand:'#0ff',sechand:'#f0f',center:'#0f0'},wood:{face:'#deb887',border:'#8b4513',mark:'#5d3317',hand:'#3e1f0f',sechand:'#8b0000',center:'#5d3317'}};
var t=themes[theme];
var numHtml='';
if(nums){for(var i=1;i<=12;i++){var ang=i*30;var rad=ang*Math.PI/180;var r=size*0.38;var x=Math.sin(rad)*r+size/2;var y=-Math.cos(rad)*r+size/2;numHtml+='\n  <div class="clock-num" style="left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px">'+i+'</div>'}}
var html='<div class="clock" style="width:'+size+'px;height:'+size+'px">\n  <div class="clock-face"></div>'+numHtml+'\n  <div class="clock-hand hour" style="transform:translate(-50%,-100%) rotate('+hDeg+'deg)"></div>\n  <div class="clock-hand minute" style="transform:translate(-50%,-100%) rotate('+mDeg+'deg)"></div>\n  <div class="clock-hand second" style="transform:translate(-50%,-85%) rotate('+sDeg+'deg)"></div>\n  <div class="clock-center"></div>\n</div>';
var css='.clock{position:relative;border-radius:50%;background:'+t.face+';border:'+(size*0.04)+'px solid '+t.border+';box-shadow:0 4px 20px rgba(0,0,0,.2)}\n';
css+='.clock-face{position:absolute;width:100%;height:100%;border-radius:50%}\n';
if(nums){css+='.clock-num{position:absolute;font-size:'+(size*0.08)+'px;font-weight:bold;color:'+t.mark+';transform:translate(-50%,-50%);pointer-events:none}\n'}
css+='.clock-hand{position:absolute;left:50%;top:50%;transform-origin:bottom center;transition:'+(smooth?'transform 1s ease':'none')+';border-radius:4px}\n';
css+='.clock-hand.hour{width:'+(size*0.03)+'px;height:'+(size*0.28)+'px;background:'+t.hand+'}\n';
css+='.clock-hand.minute{width:'+(size*0.02)+'px;height:'+(size*0.38)+'px;background:'+t.hand+'}\n';
css+='.clock-hand.second{width:'+(size*0.012)+'px;height:'+(size*0.42)+'px;background:'+t.sechand+'}\n';
css+='.clock-center{position:absolute;left:50%;top:50%;width:'+(size*0.06)+'px;height:'+(size*0.06)+'px;border-radius:50%;background:'+t.center+';transform:translate(-50%,-50%)}\n';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['theme','size','hour','minute','second','numbers','smooth'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
