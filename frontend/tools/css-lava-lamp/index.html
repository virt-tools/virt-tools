<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Lava Lamp Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:2rem;background:#0a0a12;border-radius:12px;display:flex;justify-content:center;align-items:center;min-height:300px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌋 CSS Lava Lamp Generator</h1>
<p>Create CSS lava lamp animation effects. 5 color presets, adjustable blob count/speed/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="classic" selected>Classic</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option><option value="neon">Neon</option><option value="rainbow">Rainbow</option></select></div>
<div class="ctrl-row"><label>Blob Count</label><input type="number" id="blobCount" value="4" min="2" max="8" style="width:80px" aria-label="Blob Count"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed" aria-label="Speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Width (px)</label><input type="number" id="width" value="150" min="80" max="300" style="width:80px" aria-label="Width"></div>
<div class="ctrl-row"><label>Height (px)</label><input type="number" id="height" value="300" min="150" max="500" style="width:80px" aria-label="Height"></div>
<div class="ctrl-row"><label>Blob Size (px)</label><input type="number" id="blobSize" value="60" min="30" max="120" style="width:80px" aria-label="Blob Size"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var count=parseInt(document.getElementById('blobCount').value);
var speed=document.getElementById('speed').value;
var w=parseInt(document.getElementById('width').value);
var h=parseInt(document.getElementById('height').value);
var bs=parseInt(document.getElementById('blobSize').value);
var dur=speed==='slow'?'8s':speed==='fast'?'3s':'5s';
var colors;
if(preset==='classic'){colors=['#ff6600','#ff9900','#ffcc00','#ff4400']}
else if(preset==='sunset'){colors=['#ff0066','#ff3399','#ff66cc','#cc0044']}
else if(preset==='ocean'){colors=['#0066ff','#00ccff','#003399','#0099cc']}
else if(preset==='neon'){colors=['#ff00ff','#00ffff','#ff0099','#9900ff']}
else{colors=['#ff0000','#ff8800','#ffcc00','#00ff00','#00ccff','#9900ff','#ff00ff']}
var blobs='';
var cssBlobs='';
for(var i=0;i<count;i++){
var c=colors[i%colors.length];
var left=20+Math.floor(Math.random()*60);
var delay=(i*0.8)+'s';
var dur2=(parseFloat(dur)+i*0.5)+'s';
blobs+='<div class="lava-blob" style="background:'+c+';animation-duration:'+dur2+';animation-delay:'+delay+'"></div>';
cssBlobs+='.lava-blob:nth-child('+(i+1)+'){left:'+left+'%}\n';
}
var html='<div class="lava-lamp">\n'+blobs+'\n</div>';
var css='.lava-lamp{width:'+w+'px;height:'+h+'px;background:#1a1a2e;border-radius:'+Math.floor(w/2)+'px;position:relative;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,0.5),0 0 20px rgba(255,100,0,0.2)}\n.lava-blob{position:absolute;bottom:-'+bs+'px;width:'+bs+'px;height:'+bs+'px;border-radius:50%;filter:blur(8px);opacity:0.8;animation:lava-rise '+dur+' infinite ease-in-out\n'+cssBlobs+'\n@keyframes lava-rise{0%{bottom:-'+bs+'px;transform:translateX(0) scale(1)}25%{transform:translateX(20px) scale(1.2)}50%{bottom:'+(h-bs*2)+'px;transform:translateX(-15px) scale(0.8)}75%{transform:translateX(10px) scale(1.1)}100%{bottom:-'+bs+'px;transform:translateX(0) scale(1)}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','blobCount','speed','width','height','blobSize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
