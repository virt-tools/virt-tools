<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Liquid Limit Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Liquid Limit Calculator</h1>
<p>Calculate liquid limit from Casagrande cup test blows and moisture contents using the flow curve method. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-b1">Blows trial 1</label><input type="text" id="in-b1" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">blows</div></div>
<div class="field"><label class="f" for="in-m1">Moisture 1</label><input type="text" id="in-m1" inputmode="decimal" autocomplete="off" placeholder="e.g. 45"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-b2">Blows trial 2</label><input type="text" id="in-b2" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">blows</div></div>
<div class="field"><label class="f" for="in-m2">Moisture 2</label><input type="text" id="in-m2" inputmode="decimal" autocomplete="off" placeholder="e.g. 38"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-b3">Blows trial 3</label><input type="text" id="in-b3" inputmode="decimal" autocomplete="off" placeholder="e.g. 35"><div class="unit">blows</div></div>
<div class="field"><label class="f" for="in-m3">Moisture 3</label><input type="text" id="in-m3" inputmode="decimal" autocomplete="off" placeholder="e.g. 33"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var b1E=document.getElementById("in-b1"),m1E=document.getElementById("in-m1"),b2E=document.getElementById("in-b2"),m2E=document.getElementById("in-m2"),b3E=document.getElementById("in-b3"),m3E=document.getElementById("in-m3"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var pts=[];
[{b:b1E,m:m1E},{b:b2E,m:m2E},{b:b3E,m:m3E}].forEach(function(p){
var B=parseFloat(p.b.value),M=parseFloat(p.m.value);
if(!isNaN(B)&&!isNaN(M)&&B>0) pts.push({logN:Math.log(B),M:M});
});
if(pts.length<2)return;
err.textContent="";
var n=pts.length,sumX=0,sumY=0,sumXY=0,sumX2=0;
pts.forEach(function(p){sumX+=p.logN;sumY+=p.M;sumXY+=p.logN*p.M;sumX2+=p.logN*p.logN});
var slope=(n*sumXY-sumX*sumY)/(n*sumX2-sumX*sumX);
var intercept=(sumY-slope*sumX)/n;
var ll=intercept+slope*Math.log(25);
var html='<div class="big">'+Math.round(ll*10)/10+'%</div>';
html+=row("Liquid limit (LL)",Math.round(ll*10)/10+'%');
html+=row("Flow curve slope",Math.round(slope*1000)/1000);
html+=row("Flow curve intercept",Math.round(intercept*10)/10+'%');
out.innerHTML=html;
}
[b1E,m1E,b2E,m2E,b3E,m3E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
