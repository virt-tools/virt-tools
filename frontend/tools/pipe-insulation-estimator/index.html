<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pipe Insulation Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pipe Insulation Estimator</h1>
<p>Calculate the length of pipe insulation needed from pipe length, number of pipes, and waste factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-pl">Pipe length</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-np">Number of pipes</label><input type="text" id="in-np" inputmode="decimal" autocomplete="off" placeholder="1"><div class="unit">pipes</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter pipe length.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var plEl=document.getElementById("in-pl"),npEl=document.getElementById("in-np"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var PL=pn(plEl.value),NP=pn(npEl.value),WS=pn(wsEl.value);
if(PL==null){return}
NP=NP==null?1:NP;WS=WS==null?10:WS;
if(!isFinite(PL)||!isFinite(NP)||!isFinite(WS)||PL<=0||NP<=0||WS<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var total=PL*NP*(1+WS/100);
var html='<div class="big">'+rnd(total,1)+' m</div>';
html+=row("Pipe length",rnd(PL,1)+" m");
html+=row("Number of pipes",NP);
html+=row("Waste",rnd(WS,0)+"%");
html+=row("Insulation needed",rnd(total,1)+" m");
out.innerHTML=html;
}
[plEl,npEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
