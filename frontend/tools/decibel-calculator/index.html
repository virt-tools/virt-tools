<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decibel Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Decibel (dB) Calculator</h1>
<p class="subtitle">Convert between decibels, power ratios, and voltage ratios.</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="db2ratio" selected>dB → Ratio</option>
<option value="ratio2db">Ratio → dB</option>
</select>
<div id="dbInput">
<label>Decibels (dB)</label>
<input type="number" id="db" value="20" step="any" aria-label="Db">
</div>
<div id="ratioInput" style="display:none">
<label>Power Ratio (Pout/Pin)</label>
<input type="number" id="powerRatio" value="100" min="0" step="any" aria-label="Power Ratio">
<label>Voltage Ratio (Vout/Vin)</label>
<input type="number" id="voltageRatio" value="10" min="0" step="any" aria-label="Voltage Ratio">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{
document.getElementById('dbInput').style.display=mode.value==='db2ratio'?'':'none';
document.getElementById('ratioInput').style.display=mode.value==='ratio2db'?'':'none';
});
document.getElementById('calc').addEventListener('click',()=>{
if(mode.value==='db2ratio'){
const db=parseFloat(document.getElementById('db').value)||0;
const powerRatio=Math.pow(10,db/10);
const voltageRatio=Math.pow(10,db/20);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Decibels:</span><span>${db} dB</span></div>
<div class="result-row"><span>Power Ratio:</span><span>${powerRatio.toExponential(4)}</span></div>
<div class="result-row"><span>Voltage Ratio:</span><span>${voltageRatio.toExponential(4)}</span></div>
<div class="result-row"><span>Gain (power):</span><span>${(10*Math.log10(powerRatio)).toFixed(2)} dB</span></div>`;
}else{
const pr=parseFloat(document.getElementById('powerRatio').value)||1;
const vr=parseFloat(document.getElementById('voltageRatio').value)||1;
const dbP=10*Math.log10(pr);
const dbV=20*Math.log10(vr);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Power Ratio:</span><span>${pr}</span></div>
<div class="result-row"><span>Power Gain:</span><span>${dbP.toFixed(2)} dB</span></div>
<div class="result-row"><span>Voltage Ratio:</span><span>${vr}</span></div>
<div class="result-row"><span>Voltage Gain:</span><span>${dbV.toFixed(2)} dB</span></div>`;
}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
