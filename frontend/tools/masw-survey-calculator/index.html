<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>MASW Survey Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>MASW Survey Calculator</h1>
<p>Calculate optimum receiver spacing and minimum survey length for MASW (multichannel analysis of surface waves). Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dmax">Max depth</label><input type="text" id="in-dmax" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-dmin">Min depth</label><input type="text" id="in-dmin" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-n">Number of receivers</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">channels</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dmaxE=document.getElementById("in-dmax"),dminE=document.getElementById("in-dmin"),nE=document.getElementById("in-n"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var dmax=parseFloat(dmaxE.value),dmin=parseFloat(dminE.value),n=parseFloat(nE.value);
if(isNaN(dmax)||isNaN(dmin)||isNaN(n))return;
if(dmax<=0||dmin<=0||n<2){err.textContent="Enter valid values.";return}
err.textContent="";
var dx=dmin;
var surveyLen=2*dmax;
var totalLen=surveyLen+(n-1)*dx;
var html='<div class="big">'+Math.round(surveyLen)+' m</div>';
html+=row("Receiver spacing Δx",Math.round(dx*100)/100+' m');
html+=row("Min survey length",Math.round(surveyLen)+' m');
html+=row("Total spread length",Math.round(totalLen)+' m');
out.innerHTML=html;
}
[dmaxE,dminE,nE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
