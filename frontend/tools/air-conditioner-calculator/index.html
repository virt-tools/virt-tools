<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Size Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ac-form { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; }
.field input, .field select { width: 100%; }
.ac-form .primary-btn, .form-note, .error-message { grid-column: 1 / -1; }
.form-note { margin: 0; color: var(--text-dim); font-size: .9rem; }
.error-message { margin: 0; color: var(--bad); font-weight: 600; }
.result-row.total { margin-top: 4px; padding-top: 14px; font-weight: 700; color: var(--accent); }
.result-note { margin: 16px 0 0; color: var(--text-dim); font-size: .9rem; }
@media (max-width: 580px) {
  .ac-form { grid-template-columns: 1fr; }
  .result-row { align-items: flex-start; flex-direction: column; gap: 2px; }
  .result-row > :last-child { text-align: left; }
}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Air Conditioner Size Calculator</h1>
<p class="subtitle">Estimate the cooling capacity a room needs from its area, ceiling height, sun exposure, occupants, and kitchen use.</p>
<form class="input-section ac-form" id="ac-form" novalidate>
<div class="field">
<label for="area">Room area (sq ft)</label>
<input type="number" id="area" value="400" min="50" max="5000" step="1" inputmode="decimal" required>
</div>
<div class="field">
<label for="height">Ceiling height (ft)</label>
<input type="number" id="height" value="8" min="7" max="30" step="0.5" inputmode="decimal" required>
</div>
<div class="field">
<label for="sun">Sun exposure</label>
<select id="sun">
<option value="0.9">Shaded</option>
<option value="1" selected>Average</option>
<option value="1.15">Very Sunny</option>
</select>
</div>
<div class="field">
<label for="people">Number of occupants</label>
<input type="number" id="people" value="2" min="0" max="100" step="1" inputmode="numeric" required>
</div>
<div class="field">
<label for="kitchen">Kitchen in room?</label>
<select id="kitchen">
<option value="0">No</option>
<option value="4000">Yes</option>
</select>
</div>
<p class="form-note">For a single enclosed room. This estimate does not account for climate, insulation, windows, or duct losses.</p>
<p class="error-message" id="error" role="alert" hidden></p>
<button id="calc" class="primary-btn" type="submit">Calculate capacity</button>
</form>
<section class="result-section" id="result" aria-live="polite" aria-atomic="true" hidden></section>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const form=document.getElementById('ac-form');
const result=document.getElementById('result');
const error=document.getElementById('error');
const readNumber=id=>Number(document.getElementById(id).value);
form.addEventListener('submit',event=>{
event.preventDefault();
const A=readNumber('area');
const H=readNumber('height');
const sun=parseFloat(document.getElementById('sun').value);
const P=readNumber('people');
const K=parseFloat(document.getElementById('kitchen').value);
error.hidden=true;
result.hidden=true;
if(!Number.isFinite(A)||A<50||A>5000){
error.textContent='Enter a room area from 50 to 5,000 square feet.';
document.getElementById('area').focus();
error.hidden=false;
return;
}
if(!Number.isFinite(H)||H<7||H>30){
error.textContent='Enter a ceiling height from 7 to 30 feet.';
document.getElementById('height').focus();
error.hidden=false;
return;
}
if(!Number.isInteger(P)||P<0||P>100){
error.textContent='Enter a whole number of occupants from 0 to 100.';
document.getElementById('people').focus();
error.hidden=false;
return;
}
const heightAdj=H/8;
const baseBTU=Math.max(5000,A*20*heightAdj*sun);
const peopleBTU=Math.max(0,P-2)*600;
const totalBTU=baseBTU+peopleBTU+K;
const tons=totalBTU/12000;
const standardSizes=[5000,6000,8000,10000,12000,14000,18000,24000,30000,36000,42000,48000,60000,72000,90000,120000];
const recommended=standardSizes.find(size=>size>=totalBTU)||Math.ceil(totalBTU/12000)*12000;
result.innerHTML=`
<div class="result-row"><span>Room Area:</span><span>${A} sq ft</span></div>
<div class="result-row"><span>Base BTU:</span><span>${baseBTU.toFixed(0)} BTU/hr</span></div>
<div class="result-row"><span>Occupant Bonus:</span><span>${peopleBTU} BTU/hr</span></div>
<div class="result-row"><span>Kitchen Bonus:</span><span>${K} BTU/hr</span></div>
<div class="result-row total"><span>Estimated load:</span><span>${Math.round(totalBTU).toLocaleString()} BTU/hr (${tons.toFixed(2)} tons)</span></div>
<div class="result-row"><span>Suggested standard capacity:</span><span>${recommended.toLocaleString()} BTU/hr</span></div>
<p class="result-note">Sizing is approximate. Ask an HVAC professional to perform a Manual J load calculation before purchasing central equipment.</p>`;
result.hidden=false;
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
