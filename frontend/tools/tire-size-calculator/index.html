<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tire Size Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Tire Size Calculator</h1>
<p class="subtitle">Compare tire sizes — diameter, width, sidewall, and revolutions per mile.</p>
<div class="input-section">
<h3>Current Tire</h3>
<label>Width (mm)</label>
<input type="number" id="w1" value="225" min="100" step="5" aria-label="W1">
<label>Aspect Ratio (%)</label>
<input type="number" id="ar1" value="55" min="20" max="90" aria-label="Ar1">
<label>Wheel Diameter (inches)</label>
<input type="number" id="d1" value="17" min="10" max="30" aria-label="D1">
</div>
<div class="input-section">
<h3>New Tire</h3>
<label>Width (mm)</label>
<input type="number" id="w2" value="235" min="100" step="5" aria-label="W2">
<label>Aspect Ratio (%)</label>
<input type="number" id="ar2" value="60" min="20" max="90" aria-label="Ar2">
<label>Wheel Diameter (inches)</label>
<input type="number" id="d2" value="17" min="10" max="30" aria-label="D2">
<button id="calc" class="primary-btn" type="button">Compare</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function tireInfo(w,ar,d){
const sidewallMm=w*ar/100;
const sidewallIn=sidewallMm/25.4;
const diameterIn=d+sidewallIn*2;
const circumferenceIn=diameterIn*Math.PI;
const revPerMile=63360/circumferenceIn;
return{diameter:diameterIn,sidewall:sidewallIn,circumference:circumferenceIn,rev:revPerMile,widthIn:w/25.4};
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const w1=parseFloat(document.getElementById('w1').value)||0;
const ar1=parseFloat(document.getElementById('ar1').value)||0;
const d1=parseFloat(document.getElementById('d1').value)||0;
const w2=parseFloat(document.getElementById('w2').value)||0;
const ar2=parseFloat(document.getElementById('ar2').value)||0;
const d2=parseFloat(document.getElementById('d2').value)||0;
const t1=tireInfo(w1,ar1,d1);
const t2=tireInfo(w2,ar2,d2);
const diaDiff=((t2.diameter-t1.diameter)/t1.diameter*100).toFixed(1);
const speedoDiff=(t2.diameter/t1.diameter*100-100).toFixed(1);
document.getElementById('result').innerHTML=`
<h3>Comparison</h3>
<table class="result-table">
<tr><th>Metric</th><th>Current</th><th>New</th><th>Diff</th></tr>
<tr><td>Diameter</td><td>${t1.diameter.toFixed(2)}"</td><td>${t2.diameter.toFixed(2)}"</td><td>${(t2.diameter-t1.diameter).toFixed(2)}"</td></tr>
<tr><td>Width</td><td>${t1.widthIn.toFixed(2)}"</td><td>${t2.widthIn.toFixed(2)}"</td><td>${(t2.widthIn-t1.widthIn).toFixed(2)}"</td></tr>
<tr><td>Sidewall</td><td>${t1.sidewall.toFixed(2)}"</td><td>${t2.sidewall.toFixed(2)}"</td><td>${(t2.sidewall-t1.sidewall).toFixed(2)}"</td></tr>
<tr><td>Circumference</td><td>${t1.circumference.toFixed(1)}"</td><td>${t2.circumference.toFixed(1)}"</td><td>${(t2.circumference-t1.circumference).toFixed(1)}"</td></tr>
<tr><td>Revs/Mile</td><td>${t1.rev.toFixed(1)}</td><td>${t2.rev.toFixed(1)}</td><td>${(t2.rev-t1.rev).toFixed(1)}</td></tr>
</table>
<p class="hint">Diameter change: ${diaDiff}% | Speedometer will read ${Math.abs(speedoDiff)}% ${speedoDiff>0?'low':'high'} at same actual speed.</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
