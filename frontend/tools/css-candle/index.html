<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Candle Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🕯️ CSS Candle Generator</h1>
<p>Create CSS candle with wax, wick, flame, glow. Adjustable size/color. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Wax Color</label><input type="color" id="waxColor" value="#f5e6d3" style="width:60px;height:36px" aria-label="Wax Color"></div>
<div class="ctrl-row"><label>Height</label><input type="range" id="height" min="80" max="200" value="140" style="width:200px" aria-label="Height"></div>
<div class="ctrl-row"><label>Width</label><input type="range" id="width" min="30" max="80" value="50" style="width:200px" aria-label="Width"></div>
<div class="ctrl-row"><label>Flame Color</label><input type="color" id="flameColor" value="#ff9900" style="width:60px;height:36px" aria-label="Flame Color"></div>
<div class="ctrl-row"><label>Glow</label><select id="glow" aria-label="Glow"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var wc=document.getElementById('waxColor').value;
var h=parseInt(document.getElementById('height').value);
var w=parseInt(document.getElementById('width').value);
var fc=document.getElementById('flameColor').value;
var glow=document.getElementById('glow').value;
var html='<div class="candle-scene">\n  <div class="flame"></div>\n  <div class="wick"></div>\n  <div class="wax"></div>\n  <div class="holder"></div>\n</div>';
var css='.candle-scene{display:flex;flex-direction:column;align-items:center;position:relative}\n';
css+='.wax{width:'+w+'px;height:'+h+'px;background:linear-gradient(90deg,'+wc+' 0%,rgba(0,0,0,0.1) 50%,'+wc+' 100%);border-radius:4px 4px 8px 8px;box-shadow:inset 0 -8px 12px rgba(0,0,0,0.1)}\n';
css+='.wick{width:3px;height:12px;background:#222;margin-bottom:-2px;z-index:2}\n';
css+='.flame{width:14px;height:24px;background:radial-gradient(ellipse at center bottom,#fff 0%,'+fc+' 50%,#ff4400 100%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-bottom:-2px;z-index:3;box-shadow:0 0 6px '+fc+'}\n';
if(glow==='yes'){
  css+='.flame{box-shadow:0 0 20px '+fc+',0 0 40px rgba(255,150,0,0.5)}\n';
  css+='@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg);opacity:1}50%{transform:scale(0.95,1.05) rotate(1deg);opacity:0.9}}\n';
  css+='.flame{animation:flicker 1s ease-in-out infinite}\n';
}
css+='.holder{width:'+(w+20)+'px;height:10px;background:linear-gradient(90deg,#888,#bbb,#888);border-radius:4px}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['waxColor','height','width','flameColor','glow'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
