<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Skylight Flashing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Skylight Flashing Calculator</h1>
<p>Calculate skylight flashing material from curb dimensions and roof slope. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Curb width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 24"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-l">Curb length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-s">Roof slope</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in/12</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),S=pn(sEl.value);
if(W==null||L==null||S==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(S)||W<=0||L<=0||S<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var perim=2*(W+L)+24;
var area=perim*6/144;
var html='<div class="big">'+rnd(area,2)+' sq ft</div>';
html+=row("Curb size",rnd(W,0)+"×"+rnd(L,0)+" in");
html+=row("Flashing perimeter",rnd(perim,0)+" in");
html+=row("Flashing area",rnd(area,2)+" sq ft");
html+=row("Pieces (6in×10ft)",Math.ceil(perim/120));
out.innerHTML=html;
}
[wEl,lEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
