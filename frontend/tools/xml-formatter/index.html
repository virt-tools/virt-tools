<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML Formatter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>XML Formatter & Minifier</h1>
<p class="subtitle">Format XML with proper indentation or minify it to reduce size. 100% client-side.</p>
<div class="input-section">
<label>Paste XML</label>
<textarea id="input" rows="10" placeholder="<root aria-label="<Root>"><item>value</item></root>"></textarea>
<div style="margin-top:8px">
<button id="format" class="primary-btn" type="button">Format</button>
<button id="minify" class="primary-btn" type="button">Minify</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function formatXML(xml){
let formatted='';let indent='';let inTag=false;let inContent=false;
for(let i=0;i<xml.length;i++){
const c=xml[i];
if(c==='<'){
if(inContent&&formatted){formatted=formatted.replace(/\s+$/,'');}
formatted+='\n'+indent;
inTag=true;
}
formatted+=c;
if(c==='>'){
inTag=false;
inContent=true;
if(xml[i-1]==='/'){
indent=indent.slice(2);
}
}
if(c==='>'&&!inTag){
const next=xml.slice(i+1).trimStart();
if(next.startsWith('</')){
indent=indent.slice(2);
}
if(!next.startsWith('</')&&!next.startsWith('<')&&next){
indent+='  ';
}
}
}
return formatted.trim();
}
function minifyXML(xml){return xml.replace(/>\s+</g,'><').replace(/\s{2,}/g,' ').trim();}
function showResult(text){
const ta=document.createElement('textarea');ta.value=text;ta.rows=12;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const size=document.createElement('p');size.textContent=`Size: ${new Blob([text]).size} bytes`;
const r=document.getElementById('result');r.innerHTML='';r.appendChild(size);r.appendChild(ta);r.appendChild(btn);
}
document.getElementById('format').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
try{showResult(formatXML(input));}catch(e){document.getElementById('result').innerHTML=`<p style="color:#f44336">Error: ${e.message}</p>`;}
});
document.getElementById('minify').addEventListener('click',()=>{
const input=document.getElementById('input').value;
if(!input.trim()){document.getElementById('result').innerHTML='<p style="color:#ff9800">No input.</p>';return;}
showResult(minifyXML(input));
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
