<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Smart Speaker Pairing Guide — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-2824399c.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Smart Speaker Pairing Guide</h1>
<p>Determine optimal stereo speaker placement: separation angle, distance from wall, and listening position for best imaging. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Distance to listener</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-w">Speaker width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.18"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(v,d){var m=Math.pow(10,d);return Math.round(v*m)/m}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),W=pn(wEl.value);
if(D==null||W==null)return;
if(!isFinite(D)||D<=0||!isFinite(W)||W<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var separation=D; // equilateral triangle: speaker separation = distance to each speaker
var fromWall=W*1.5;
var angle=30;
var tweeterHeight=1.2;
var html='<div class="big">Equilateral triangle</div>';
html+=row("Speaker separation",rnd(separation,2)+" m");
html+=row("Angle from listener",angle+"° each");
html+=row("Distance from wall",rnd(fromWall,2)+" m (min)");
html+=row("Tweeter height",tweeterHeight+" m (ear level)");
html+=row("Listening distance",D+" m");
out.innerHTML=html;
}
[dEl,wEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
