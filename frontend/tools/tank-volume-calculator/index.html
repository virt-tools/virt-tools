<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tank Volume Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Tank Volume Calculator</h1>
<p class="subtitle">Calculate the volume of aquariums, tanks, and cylinders.</p>
<div class="input-section">
<label>Tank Shape</label>
<select id="shape" aria-label="Shape">
<option value="rect">Rectangular</option>
<option value="cyl">Cylindrical</option>
<option value="bow">Bow Front</option>
</select>
<label>Length (inches)</label>
<input type="number" id="len" value="48" min="0" step="0.5" aria-label="Len">
<label>Width (inches)</label>
<input type="number" id="wid" value="18" min="0" step="0.5" aria-label="Wid">
<label>Height (inches)</label>
<input type="number" id="hgt" value="20" min="0" step="0.5" aria-label="Hgt">
<label>Diameter (inches) — cylindrical only</label>
<input type="number" id="dia" value="24" min="0" step="0.5" aria-label="Dia">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const s=document.getElementById('shape').value;
const L=parseFloat(document.getElementById('len').value)||0;
const W=parseFloat(document.getElementById('wid').value)||0;
const H=parseFloat(document.getElementById('hgt').value)||0;
const D=parseFloat(document.getElementById('dia').value)||0;
let cuIn;
const valid=s==='cyl'?D>0&&H>0:L>0&&W>0&&H>0;
if(!valid){document.getElementById('result').innerHTML='<div class="result-row"><span>Error:</span><span>Enter positive dimensions.</span></div>';document.getElementById('result').style.display='block';return;}
if(s==='rect')cuIn=L*W*H;
else if(s==='cyl')cuIn=Math.PI*(D/2)**2*H;
else cuIn=(L*W+(Math.PI*(W/2)**2)/2)*H; // bow front approximation
const galUS=cuIn/231;
const galUK=cuIn/277.4;
const liters=cuIn*0.0163871;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Volume (US gal):</span><span>${galUS.toFixed(2)} gal</span></div>
<div class="result-row"><span>Volume (UK gal):</span><span>${galUK.toFixed(2)} gal</span></div>
<div class="result-row"><span>Volume (liters):</span><span>${liters.toFixed(2)} L</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
