<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Fireworks Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#000;border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎆 CSS Fireworks Generator</h1>
<p>Create CSS animated fireworks explosion. 4 color schemes, adjustable particles/speed/size. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Scheme</label><select id="scheme" aria-label="Scheme"><option value="rainbow">Rainbow</option><option value="gold">Gold</option><option value="red-blue">Red & Blue</option><option value="green-purple">Green & Purple</option></select></div>
<div class="ctrl-row"><label>Particles</label><input type="range" id="part" min="8" max="40" step="2" value="16" style="width:200px" aria-label="Part"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="100" max="300" step="10" value="200" style="width:200px" aria-label="Sz"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="sp" min="1" max="5" step="0.5" value="2" style="width:200px" aria-label="Sp"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var scheme=document.getElementById('scheme').value;
var part=parseInt(document.getElementById('part').value);
var sz=parseInt(document.getElementById('sz').value);
var sp=parseFloat(document.getElementById('sp').value);
var colors=scheme==='rainbow'?['#ff0000','#ff8800','#ffff00','#00ff00','#0088ff','#8800ff','#ff0088']:scheme==='gold'?['#ffd700','#ffcc00','#ffaa00','#ff9500','#fff8dc','#ffdd44']:scheme==='red-blue'?['#ff3333','#ff6666','#3333ff','#6666ff','#cc44cc','#ffcccc']:['#00ff44','#44ff88','#aa44ff','#cc66ff','#88ffcc','#dd88ff'];
var partHTML='';
for(var i=0;i<part;i++){
  var ang=(360/part)*i;
  var dist=sz*0.45;
  var col=colors[i%colors.length];
  var dx=(Math.cos(ang*Math.PI/180)*dist).toFixed(1);
  var dy=(Math.sin(ang*Math.PI/180)*dist).toFixed(1);
  partHTML+='<div class="p" style="--dx:'+dx+'px;--dy:'+dy+'px;background:'+col+';animation-delay:'+(i*0.02).toFixed(2)+'s"></div>';
}
var html='<div class="fireworks">\n  '+partHTML+'\n</div>';
var css='.fireworks{position:relative;width:'+sz+'px;height:'+sz+'px}\n';
css+='.p{position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;transform:translate(-50%,-50%);animation:burst '+sp+'s ease-out infinite;box-shadow:0 0 6px currentColor}\n';
css+='@keyframes burst{0%{transform:translate(-50%,-50%);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['scheme','part','sz','sp'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
