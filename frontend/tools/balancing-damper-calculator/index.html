<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Balancing Damper Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Balancing Damper Calculator</h1>
<p>Calculate required damper blade angle for airflow balancing from design and measured CFM. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-des">Design CFM</label><input type="text" id="in-des" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-meas">Measured CFM</label><input type="text" id="in-meas" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">CFM</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var desEl=document.getElementById("in-des"),measEl=document.getElementById("in-meas"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(desEl.value),M=pn(measEl.value);
if(D==null||M==null)return;
if(!isFinite(D)||!isFinite(M)||D<=0||M<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var ratio=M/D;
var angle=Math.acos(D/M)*180/Math.PI;
if(!isFinite(angle)||angle<0)angle=0;
if(angle>90)angle=90;
var html='<div class="big">'+rnd(angle,1)+'°</div>';
html+=row("Design CFM",D);
html+=row("Measured CFM",M);
html+=row("Flow ratio",rnd(ratio,2));
html+=row("Required damper angle",rnd(angle,1)+"°");
html+=row("Percent open",rnd(100-angle/90*100,0)+"%");
out.innerHTML=html;
}
[desEl,measEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
