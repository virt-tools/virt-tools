<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XML to JSON Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>XML to JSON Converter</h1>
<p class="subtitle">Parse XML and convert to JSON using DOMParser. Handles attributes, text nodes, and nesting.</p>
<div class="input-section">
<label>XML Input</label>
<textarea id="input" rows="8" placeholder='<root aria-label="<Root>"><item id="1">Hello</item></root>'></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function xmlToJson(node){
const obj={};
if(node.attributes&&node.attributes.length>0){
for(let i=0;i<node.attributes.length;i++){obj['@'+node.attributes[i].nodeName]=node.attributes[i].nodeValue;}
}
if(node.hasChildNodes()){
for(let child of node.childNodes){
if(child.nodeType===3){const t=child.nodeValue.trim();if(t){obj['#text']=t;}}
else if(child.nodeType===1){
const childObj=xmlToJson(child);
if(obj[child.nodeName]){if(!Array.isArray(obj[child.nodeName]))obj[child.nodeName]=[obj[child.nodeName]];obj[child.nodeName].push(childObj);}
else obj[child.nodeName]=childObj;
}
}
}
return obj;
}
document.getElementById('run').addEventListener('click',()=>{
try{
const parser=new DOMParser();
const doc=parser.parseFromString(document.getElementById('input').value,'text/xml');
const err=doc.querySelector('parsererror');
if(err)throw new Error(err.textContent.split('\n')[0]);
const data=xmlToJson(doc.documentElement);
document.getElementById('result').innerHTML='<textarea rows="12" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+JSON.stringify(data,null,2)+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red;">Error: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
