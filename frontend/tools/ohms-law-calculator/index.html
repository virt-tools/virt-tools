<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohm's Law Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Ohm's Law Calculator</h1>
<p class="subtitle">Calculate voltage, current, resistance, and power using Ohm's Law.</p>
<div class="input-section">
<label>Enter any two values (leave others blank):</label>
<label>Voltage (V)</label>
<input type="number" id="voltage" value="12" min="0" step="any" aria-label="Voltage">
<label>Current (A)</label>
<input type="number" id="current" placeholder="Leave blank" step="any" aria-label="Leave Blank">
<label>Resistance (Ω)</label>
<input type="number" id="resistance" placeholder="Leave blank" step="any" aria-label="Leave Blank">
<label>Power (W)</label>
<input type="number" id="power" placeholder="Leave blank" step="any" aria-label="Leave Blank">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
let V=document.getElementById('voltage').value;
let I=document.getElementById('current').value;
let R=document.getElementById('resistance').value;
let P=document.getElementById('power').value;
V=V===''?null:parseFloat(V);
I=I===''?null:parseFloat(I);
R=R===''?null:parseFloat(R);
P=P===''?null:parseFloat(P);
const known=[V,I,R,P].filter(x=>x!==null).length;
if(known<2){document.getElementById('result').innerHTML='<p class="warning">Please enter at least 2 values.</p>';document.getElementById('result').style.display='block';return;}
if(V===null&&I!==null&&R!==null)V=I*R;
else if(I===null&&V!==null&&R!==null)I=V/R;
else if(R===null&&V!==null&&I!==null)R=V/I;
else if(V===null&&I!==null&&P!==null)V=P/I;
else if(I===null&&V!==null&&P!==null)I=P/V;
else if(R===null&&V!==null&&P!==null)R=V*V/P;
else if(P===null&&V!==null&&I!==null)P=V*I;
else if(P===null&&I!==null&&R!==null)P=I*I*R;
else if(P===null&&V!==null&&R!==null)P=V*V/R;
else if(V===null&&R!==null&&P!==null)V=Math.sqrt(P*R);
else if(I===null&&R!==null&&P!==null)I=Math.sqrt(P/R);
else if(R===null&&I!==null&&P!==null)R=P/(I*I);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Voltage (V):</span><span>${V.toFixed(4)} V</span></div>
<div class="result-row"><span>Current (I):</span><span>${I.toFixed(4)} A</span></div>
<div class="result-row"><span>Resistance (R):</span><span>${R.toFixed(4)} Ω</span></div>
<div class="result-row"><span>Power (P):</span><span>${P.toFixed(4)} W</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
