<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soil Moisture Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soil Moisture Estimator</h1>
<p>Estimate soil moisture deficit from field capacity, current moisture, and root depth to determine irrigation need. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-fc">Field capacity</label><input type="text" id="in-fc" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-cur">Current moisture</label><input type="text" id="in-cur" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-root">Root depth</label><input type="text" id="in-root" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fcEl=document.getElementById("in-fc"),curEl=document.getElementById("in-cur"),rootEl=document.getElementById("in-root"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Fc=pn(fcEl.value),Cur=pn(curEl.value),Root=pn(rootEl.value);
if(Fc==null||Cur==null||Root==null)return;
if(!isFinite(Fc)||!isFinite(Cur)||!isFinite(Root)||Fc<=0||Root<=0){err.textContent="Enter valid positive values.";return}
if(Cur>Fc){err.textContent="Current moisture exceeds field capacity.";return}
err.textContent="";
var deficit=Fc-Cur;
var waterIn=deficit*Root*0.8/100;
var galSqFt=waterIn*0.623;
var html='<div class="big">'+rnd(deficit,1)+'%</div>';
html+=row("Field capacity",rnd(Fc,1)+'%');
html+=row("Current moisture",rnd(Cur,1)+'%');
html+=row("Moisture deficit",rnd(deficit,1)+'%');
html+=row("Water needed",rnd(galSqFt,2)+' gal / sq ft');
html+=row("Per 100 sq ft",rnd(galSqFt*100,0)+' gal');
out.innerHTML=html;
}
[fcEl,curEl,rootEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
