<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Soffit Area Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Soffit Area Calculator</h1>
<p>Calculate soffit area and panels from perimeter length and soffit width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-p">Perimeter length</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Soffit width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-p"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var P=pn(pEl.value),W=pn(wEl.value);
if(P==null||W==null)return;
if(!isFinite(P)||!isFinite(W)||P<=0||W<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=P*W;
var panels=Math.ceil(area/16);
var html='<div class="big">'+rnd(area,0)+' sq ft</div>';
html+=row("Perimeter",rnd(P,0)+" ft");
html+=row("Soffit width",rnd(W,1)+" ft");
html+=row("Soffit area",rnd(area,0)+" sq ft");
html+=row("Panels (4×4)",panels);
out.innerHTML=html;
}
[pEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
