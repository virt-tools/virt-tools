<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Frost Depth Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Frost Depth Estimator</h1>
<p>Estimate the frost penetration depth in soil based on air freezing index and soil type. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-fi">Freezing index</label><input type="text" id="in-fi" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">°C·days</div></div>
<div class="field"><label class="f" for="in-soil">Soil type</label><select id="in-soil" style="width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;outline:none"><option value="sand">Sand</option><option value="silt">Silt</option><option value="clay">Clay</option><option value="gravel">Gravel</option></select></div>
<div class="field"><label class="f" for="in-moist">Moisture</label><select id="in-moist" style="width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;outline:none"><option value="dry">Dry</option><option value="moist">Moist</option><option value="wet">Wet</option></select></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter freezing index.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fiEl=document.getElementById("in-fi"),sEl=document.getElementById("in-soil"),mEl=document.getElementById("in-moist"),err=document.getElementById("err"),out=document.getElementById("out");
var kMap={sand:{dry:2.0,moist:1.5,wet:1.2},silt:{dry:1.8,moist:1.3,wet:1.0},clay:{dry:1.6,moist:1.1,wet:0.8},gravel:{dry:2.2,moist:1.7,wet:1.4}};
function calc(){
var FI=pn(fiEl.value);
if(FI==null){return}
if(!isFinite(FI)||FI<=0){err.textContent="Freezing index must be positive.";return}
err.textContent="";
var k=kMap[sEl.value][mEl.value];
var depth=k*Math.sqrt(FI);
var html='<div class="big">'+rnd(depth,2)+' m</div>';
html+=row("Estimated frost depth",rnd(depth,2)+" m");
html+=row("Freezing index",rnd(FI,0)+" °C·days");
html+=row("Soil thermal cond.",k+" m/√(°C·d)");
html+=row("Soil type",sEl.value+" / "+mEl.value);
out.innerHTML=html;
}
[fiEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
sEl.addEventListener("change",calc);mEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
