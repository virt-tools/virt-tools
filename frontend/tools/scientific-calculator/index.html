<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Scientific Calculator</h1>
<p class="subtitle">Full scientific calculator with trig, log, exponential, and memory functions.</p>
<div class="input-section">
<label>Expression</label>
<input type="text" id="expr" value="sin(pi/4) * sqrt(2)" style="width:100%;font-family:monospace;font-size:18px" aria-label="Expr">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div id="keypad" style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:15px 0"></div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const KEYS=['7','8','9','/','sin(','(',')','4','5','6','*','cos(','pi','sqrt(','1','2','3','-','tan(','e','^','0','.','+','log(','ln(','abs('];
document.addEventListener('DOMContentLoaded',()=>{
const kp=document.getElementById('keypad');
KEYS.forEach(k=>{
const b=document.createElement('button');
b.textContent=k;b.className='secondary-btn';b.style.fontSize='14px';
b.onclick=()=>{document.getElementById('expr').value+=k;};
kp.appendChild(b);
});
document.getElementById('calc').addEventListener('click',()=>{
let expr=document.getElementById('expr').value;
try{
expr=expr.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
.replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(')
.replace(/abs\(/g,'Math.abs(').replace(/pi/g,'Math.PI').replace(/e(?!\w)/g,'Math.E')
.replace(/\^/g,'**');
const result=Function('"use strict";return '+expr)();
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Expression:</span><span>${document.getElementById('expr').value}</span></div>
<div class="result-row"><span>Result:</span><span>${result}</span></div>`;
document.getElementById('result').style.display='block';
}catch(e){
document.getElementById('result').innerHTML='<p class="warning">Error: Invalid expression</p>';
document.getElementById('result').style.display='block';
}
});
document.getElementById('expr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('calc').click();}});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
