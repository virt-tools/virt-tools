<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Scientific Calculator</h1>
<p class="subtitle">Full scientific calculator with trig, log, exponential, and memory functions.</p>
<div class="input-section">
<label>Expression</label>
<input type="text" id="expr" value="sin(pi/4) * sqrt(2)" style="width:100%;font-family:monospace;font-size:18px" aria-label="Expr">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div id="keypad" style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:15px 0"></div>
<div class="result-section" id="result" style="display:none;"></div>
<script src="/assets/math-expression.js"></script>
<script>
const KEYS=['7','8','9','/','sin(','(',')','4','5','6','*','cos(','pi','sqrt(','1','2','3','-','tan(','e','^','0','.','+','log10(','ln(','abs('];
document.addEventListener('DOMContentLoaded',()=>{
const kp=document.getElementById('keypad');
KEYS.forEach(k=>{
const b=document.createElement('button');
b.textContent=k;b.className='secondary-btn';b.style.fontSize='14px';
b.onclick=()=>{document.getElementById('expr').value+=k;};
kp.appendChild(b);
});
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const resultEl=document.getElementById('result');
try{
const result=VTMathExpression.compile(expr)({});
if(!Number.isFinite(result))throw new Error('Result is not finite.');
resultEl.replaceChildren();
[['Expression:',expr],['Result:',String(result)]].forEach(([label,value])=>{const row=document.createElement('div');row.className='result-row';const left=document.createElement('span');left.textContent=label;const right=document.createElement('span');right.textContent=value;row.append(left,right);resultEl.append(row)});
}catch(e){
resultEl.replaceChildren();const warning=document.createElement('p');warning.className='warning';warning.textContent='Error: '+e.message;resultEl.append(warning);
}
resultEl.style.display='block';
});
document.getElementById('expr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('calc').click();}});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
