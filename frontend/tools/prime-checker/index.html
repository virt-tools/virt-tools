<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Number Checker — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Prime Number Checker</h1>
<p class="subtitle">Check primality, find prime factors, and generate primes in a range.</p>
<div class="input-section">
<label>Mode</label>
<select id="mode" aria-label="Mode">
<option value="check" selected>Check Single Number</option>
<option value="factor">Prime Factorization</option>
<option value="range">Primes in Range</option>
</select>
<div id="singleInput">
<label>Number</label>
<input type="number" id="num" value="97" min="0" step="1" aria-label="Num">
</div>
<div id="rangeInput" style="display:none">
<label>From</label>
<input type="number" id="from" value="1" min="0" step="1" aria-label="From">
<label>To</label>
<input type="number" id="to" value="100" min="0" step="1" aria-label="To">
</div>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function isPrime(n){
if(n<2)return false;if(n<4)return true;if(n%2===0)return false;
for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;return true;
}
function factorize(n){
const factors=[];for(let d=2;d*d<=n;d++){while(n%d===0){factors.push(d);n/=d;}}if(n>1)factors.push(n);return factors;
}
function primesInRange(a,b){
const sieve=new Uint8Array(b+1);const primes=[];
for(let i=2;i<=b;i++){if(!sieve[i]){if(i>=a)primes.push(i);for(let j=i*i;j<=b;j+=i)sieve[j]=1;}}
return primes;
}
document.addEventListener('DOMContentLoaded',()=>{
const mode=document.getElementById('mode');
mode.addEventListener('change',()=>{document.getElementById('singleInput').style.display=mode.value==='range'?'none':'';document.getElementById('rangeInput').style.display=mode.value==='range'?'':'none';});
document.getElementById('calc').addEventListener('click',()=>{
if(mode.value==='check'){
const n=parseInt(document.getElementById('num').value)||0;
document.getElementById('result').innerHTML=`<div class="result-row"><span>${n}:</span><span>${isPrime(n)?'✓ Prime':'✗ Not prime'}</span></div>${isPrime(n)?'':'<p class="hint">Smallest factor: '+factorize(n)[0]+'</p>'}`;
}else if(mode.value==='factor'){
const n=parseInt(document.getElementById('num').value)||0;
const f=factorize(n);
document.getElementById('result').innerHTML=`<div class="result-row"><span>${n} =</span><span>${f.join(' × ')||n}</span></div><div class="result-row"><span>Number of prime factors:</span><span>${f.length}</span></div>`;
}else{
const a=parseInt(document.getElementById('from').value)||0;
const b=parseInt(document.getElementById('to').value)||100;
const primes=primesInRange(a,Math.min(b,1000000));
document.getElementById('result').innerHTML=`<div class="result-row"><span>Count:</span><span>${primes.length} primes in [${a}, ${b}]</span></div>${primes.length>0?'<p class="hint">First: '+primes[0]+' | Last: '+primes[primes.length-1]+'</p>':''}<p class="hint">${primes.slice(0,50).join(', ')}${primes.length>50?'...':''}</p>`;
}
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
