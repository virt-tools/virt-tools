<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sanding Disc Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sanding Disc Calculator</h1>
<p>Estimate sanding discs needed from surface area, disc diameter, and disc lifespan. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Surface area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-d">Disc diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-l">Disc lifespan</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">sq ft/disc</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),D=pn(dEl.value),L=pn(lEl.value);
if(A==null||D==null||L==null)return;
if(!isFinite(A)||!isFinite(D)||!isFinite(L)||A<=0||D<=0||L<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var discArea=Math.PI*Math.pow(D/2,2)/144;
var discs=Math.ceil(A/L);
var html='<div class="big">'+rnd(discs,0)+' discs</div>';
html+=row("Surface area",rnd(A,0)+' sq ft');
html+=row("Disc diameter",rnd(D,1)+' in');
html+=row("Disc area",rnd(discArea,3)+' sq ft');
html+=row("Disc lifespan",rnd(L,0)+' sq ft/disc');
html+=row("Discs needed",rnd(discs,0)+' discs');
out.innerHTML=html;
}
[aEl,dEl,lEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
