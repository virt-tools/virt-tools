<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Bit Depth Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Bit Depth Converter</h1>
<p class="subtitle">Convert audio between 8-bit, 16-bit, and 24-bit WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Target Bit Depth: <select id="depth">
<option value="8">8-bit</option>
<option value="16" selected>16-bit</option>
<option value="24">24-bit</option>
</select></label>
<button id="process" class="primary-btn" type="button">Convert & Download</button>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const bitDepth=parseInt(document.getElementById('depth').value);
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const wav=audioBufferToWav(buf,bitDepth);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='converted-'+bitDepth+'bit.wav';a.click();
st.textContent='Done! Downloaded as '+bitDepth+'-bit WAV';
audioCtx.close();
});
function audioBufferToWav(b,bd){
const n=b.length,sr=b.sampleRate,nc=b.numberOfChannels;
const data=[];for(let c=0;c<nc;c++)data.push(b.getChannelData(c));
const bytesPerSample=bd/8;
const buf=new ArrayBuffer(44+n*nc*bytesPerSample);
const v=new DataView(buf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*nc*bytesPerSample,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*nc*bytesPerSample,true);
v.setUint16(32,nc*bytesPerSample,true);v.setUint16(34,bd,true);
ws(36,'data');v.setUint32(40,n*nc*bytesPerSample,true);
if(bd===8){
for(let i=0;i<n;i++)for(let c=0;c<nc;c++)v.setUint8(44+(i*nc+c),Math.round((data[c][i]*0.5+0.5)*255));
}else if(bd===16){
for(let i=0;i<n;i++)for(let c=0;c<nc;c++)v.setInt16(44+(i*nc+c)*2,Math.max(-32768,Math.min(32767,data[c][i]*32767)),true);
}else if(bd===24){
for(let i=0;i<n;i++)for(let c=0;c<nc;c++){
const s=Math.max(-8388608,Math.min(8388607,Math.round(data[c][i]*8388607)));
const off=44+(i*nc+c)*3;
v.setUint8(off,s&0xFF);v.setUint8(off+1,(s>>8)&0xFF);v.setUint8(off+2,(s>>16)&0xFF);
}
}
return buf;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
