<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Trimmer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Trimmer</h1>
<p class="subtitle">Trim and crop audio files by setting start and end times. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<div style="margin-top:8px;">
<label>Start (s): <input type="number" id="start" value="0" min="0" step="0.1" style="width:80px;"></label>
<label style="margin-left:12px;">End (s): <input type="number" id="end" value="10" min="0" step="0.1" style="width:80px;"></label>
</div>
<button id="trim" class="primary-btn" style="margin-top:8px;" type="button">Trim & Download</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
<audio id="player" controls style="display:none;margin-top:1em;width:100%;"></audio>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('trim').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const start=parseFloat(document.getElementById('start').value)||0;
const end=parseFloat(document.getElementById('end').value)||10;
const status=document.getElementById('status');
const player=document.getElementById('player');
status.textContent='Processing...';
const arr=await file.arrayBuffer();
const ctx=new AudioContext();
const audio=await ctx.decodeAudioData(arr);
const sr=audio.sampleRate;
const startS=Math.floor(start*sr);
const endS=Math.min(Math.floor(end*sr),audio.length);
const len=endS-startS;
const offline=new OfflineAudioContext(audio.numberOfChannels,len,sr);
const src=offline.createBufferSource();
src.buffer=audio;src.connect(offline.destination);
src.start(0,startS/sr,(endS-startS)/sr);
const rendered=await offline.startRendering();
const wav=audioBufferToWav(rendered);
const blob=new Blob([wav],{type:'audio/wav'});
const url=URL.createObjectURL(blob);
player.src=url;player.style.display='block';
const a=document.createElement('a');a.href=url;a.download='trimmed.wav';a.click();
status.textContent='Done! Trimmed audio downloaded.';
});
function audioBufferToWav(buffer){
const numCh=buffer.numberOfChannels;
const len=buffer.length*numCh*2+44;
const arr=new ArrayBuffer(len);
const view=new DataView(arr);
const chs=[];for(let i=0;i<numCh;i++)chs.push(buffer.getChannelData(i));
let off=0;
const writeStr=s=>{for(let j=0;j<s.length;j++)view.setUint8(off++,s.charCodeAt(j));};
writeStr('RIFF');view.setUint32(off,36+len-44,true);off+=4;writeStr('WAVE');
writeStr('fmt ');view.setUint32(off,16,true);off+=4;
view.setUint16(off,1,true);off+=2;view.setUint16(off,numCh,true);off+=2;
view.setUint32(off,buffer.sampleRate,true);off+=4;
view.setUint32(off,buffer.sampleRate*numCh*2,true);off+=4;
view.setUint16(off,numCh*2,true);off+=2;view.setUint16(off,16,true);off+=2;
writeStr('data');view.setUint32(off,len-44,true);off+=4;
for(let i=0;i<buffer.length;i++){
for(let c=0;c<numCh;c++){
let s=Math.max(-1,Math.min(1,chs[c][i]));
view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
}
}
return arr;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
