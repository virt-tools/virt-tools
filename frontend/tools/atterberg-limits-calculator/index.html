<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Atterberg Limits Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Atterberg Limits Calculator</h1>
<p>Calculate plasticity index, liquidity index, and soil classification from liquid limit and plastic limit. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ll">Liquid limit (LL)</label><input type="text" id="in-ll" inputmode="decimal" autocomplete="off" placeholder="e.g. 45"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-pl">Plastic limit (PL)</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-mc">Natural moisture</label><input type="text" id="in-mc" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var llE=document.getElementById("in-ll"),plE=document.getElementById("in-pl"),mcE=document.getElementById("in-mc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var LL=parseFloat(llE.value),PL=parseFloat(plE.value),MC=parseFloat(mcE.value);
if(isNaN(LL)||isNaN(PL))return;
if(LL<=0||PL<0||PL>LL){err.textContent="LL must be >= PL.";return}
err.textContent="";
var PI=LL-PL;
var cls=PI>=50?"High plasticity (CH/OH)":PI>=20?"Medium plasticity (CL/OL)":"Low plasticity (CL/ML)";
var html='<div class="big">'+Math.round(PI*10)/10+'%</div>';
html+=row("Plasticity index (PI)",Math.round(PI*10)/10+'%');
html+=row("Soil class",cls);
if(!isNaN(MC)){
  var LI=(MC-PL)/PI;
  html+=row("Liquidity index (LI)",Math.round(LI*1000)/1000);
  var state=LI<=0?"Semi-solid":LI>=1?"Liquid":"Plastic";
  html+=row("State",state);
}
out.innerHTML=html;
}
[llE,plE,mcE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
