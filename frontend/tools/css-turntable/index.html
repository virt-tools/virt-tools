<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Vinyl Turntable Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:350px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎵 CSS Vinyl Turntable Generator</h1>
<p>Create CSS animated vinyl record turntable. Adjustable size/color/speed, tonearm animation. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Vinyl Color</label><input type="color" id="vinylColor" value="#1a1a1a" aria-label="Vinyl Color"></div>
<div class="ctrl-row"><label>Label Color</label><input type="color" id="labelColor" value="#e74c3c" aria-label="Label Color"></div>
<div class="ctrl-row"><label>Size</label><select id="size" aria-label="Size"><option value="250" selected>Medium</option><option value="180">Small</option><option value="350">Large</option></select></div>
<div class="ctrl-row"><label>Spin Speed (s)</label><input type="range" id="speed" min="1" max="10" step="0.5" value="3" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Tonearm</label><select id="tonearm" aria-label="Tonearm"><option value="on" selected>On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Grooves</label><input type="range" id="grooves" min="3" max="20" value="8" style="width:200px" aria-label="Grooves"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var vc=document.getElementById('vinylColor').value;
var lc=document.getElementById('labelColor').value;
var size=parseInt(document.getElementById('size').value);
var speed=parseFloat(document.getElementById('speed').value);
var tonearm=document.getElementById('tonearm').value==='on';
var grooves=parseInt(document.getElementById('grooves').value);
var labelR=size*0.28;
var html='<div class="turntable" style="width:'+size+'px;height:'+size+'px">\n';
html+='  <div class="vinyl" style="width:'+size+'px;height:'+size+'px;background:'+vc+'">\n';
for(var i=0;i<grooves;i++){
var gr=size*0.35+i*(size*0.32/grooves);
html+='    <div class="groove" style="width:'+(gr*2)+'px;height:'+(gr*2)+'px"></div>\n';
}
html+='    <div class="label" style="width:'+(labelR*2)+'px;height:'+(labelR*2)+'px;background:'+lc+'"></div>\n';
html+='    <div class="spindle"></div>\n';
html+='  </div>\n';
if(tonearm){html+='  <div class="tonearm"></div>\n'}
html+='</div>';
var css='.turntable{position:relative;display:flex;align-items:center;justify-content:center}\n';
css+='.vinyl{border-radius:50%;display:flex;align-items:center;justify-content:center;animation:spin '+speed+'s linear infinite;box-shadow:0 4px 20px rgba(0,0,0,.5)}\n';
css+='.groove{position:absolute;border:1px solid rgba(255,255,255,.06);border-radius:50%}\n';
css+='.label{position:absolute;border-radius:50%;z-index:2;box-shadow:0 0 10px rgba(0,0,0,.3)}\n';
css+='.spindle{position:absolute;width:6px;height:6px;background:#888;border-radius:50%;z-index:3}\n';
css+='@keyframes spin{to{transform:rotate(360deg)}}\n';
if(tonearm){
css+='.tonearm{position:absolute;top:5%;right:-5%;width:'+(size*0.55)+'px;height:6px;background:linear-gradient(to right,#aaa,#ccc,#999);border-radius:3px;transform-origin:right center;transform:rotate(25deg);z-index:5}\n';
css+='.tonearm::after{content:"";position:absolute;left:-12px;top:-8px;width:18px;height:22px;background:#666;border-radius:4px}\n';
}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['vinylColor','labelColor','size','speed','tonearm','grooves'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
