<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bash Cheatsheet — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Bash Cheatsheet</h1>
<p class="subtitle">Searchable reference for common Bash commands and syntax — navigation, text, processes, networking, scripting.</p>
<input id="search" type="search" placeholder="Search commands..." style="width:100%;padding:.75rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;margin-bottom:1rem;" aria-label="Search Commands...">
<div id="cats" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;"></div>
<div id="list"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const CMDS=[
{cat:'Navigation',name:'pwd',desc:'Print working directory',ex:'pwd'},
{cat:'Navigation',name:'ls',desc:'List directory contents',ex:'ls -lah'},
{cat:'Navigation',name:'cd',desc:'Change directory',ex:'cd ~/projects'},
{cat:'Navigation',name:'pushd',desc:'Push directory onto stack',ex:'pushd /var/log'},
{cat:'Navigation',name:'popd',desc:'Pop directory from stack',ex:'popd'},
{cat:'Navigation',name:'dirs',desc:'Show directory stack',ex:'dirs -v'},
{cat:'File',name:'cp',desc:'Copy files',ex:'cp -r src/ dest/'},
{cat:'File',name:'mv',desc:'Move/rename files',ex:'mv old.txt new.txt'},
{cat:'File',name:'rm',desc:'Remove files',ex:'rm -rf build/'},
{cat:'File',name:'ln',desc:'Create symlink',ex:'ln -s /opt/app /usr/local/bin/app'},
{cat:'File',name:'chmod',desc:'Change permissions',ex:'chmod 755 script.sh'},
{cat:'File',name:'chown',desc:'Change ownership',ex:'chown user:group file'},
{cat:'File',name:'stat',desc:'File statistics',ex:'stat -c "%s %n" *'},
{cat:'File',name:'find',desc:'Find files',ex:'find . -name "*.js" -type f'},
{cat:'File',name:'locate',desc:'Quick file search',ex:'locate nginx.conf'},
{cat:'File',name:'touch',desc:'Create empty file',ex:'touch newfile.txt'},
{cat:'File',name:'mkdir',desc:'Create directories',ex:'mkdir -p path/to/dir'},
{cat:'File',name:'tree',desc:'Directory tree',ex:'tree -L 2 --dirsfirst'},
{cat:'Text',name:'grep',desc:'Search text',ex:'grep -rn "TODO" --include=*.js'},
{cat:'Text',name:'sed',desc:'Stream editor',ex:'sed -i "s/old/new/g" file.txt'},
{cat:'Text',name:'awk',desc:'Pattern processing',ex:"awk '{print $1}' access.log"},
{cat:'Text',name:'cut',desc:'Cut fields',ex:'cut -d, -f1 data.csv'},
{cat:'Text',name:'tr',desc:'Translate chars',ex:'echo "Hello" | tr a-z A-Z'},
{cat:'Text',name:'sort',desc:'Sort lines',ex:'sort -t, -k2 -n file.csv'},
{cat:'Text',name:'uniq',desc:'Unique lines',ex:'sort file | uniq -c'},
{cat:'Text',name:'wc',desc:'Count lines/words',ex:'wc -l *.js'},
{cat:'Text',name:'head',desc:'First lines',ex:'head -20 access.log'},
{cat:'Text',name:'tail',desc:'Last lines',ex:'tail -f /var/log/syslog'},
{cat:'Text',name:'less',desc:'Pager',ex:'less +F /var/log/syslog'},
{cat:'Text',name:'tee',desc:'Tee output',ex:'cmd | tee out.log'},
{cat:'Text',name:'diff',desc:'Compare files',ex:'diff -u old.txt new.txt'},
{cat:'Text',name:'cat',desc:'Concatenate files',ex:'cat file1 file2 > combined'},
{cat:'Text',name:'paste',desc:'Merge lines',ex:'paste -d, file1 file2'},
{cat:'Text',name:'column',desc:'Column format',ex:'column -t -s, data.csv'},
{cat:'Text',name:'rev',desc:'Reverse lines',ex:'echo "abc" | rev'},
{cat:'Text',name:'fold',desc:'Wrap text',ex:'fold -w 80 file.txt'},
{cat:'Process',name:'ps',desc:'List processes',ex:'ps aux | grep node'},
{cat:'Process',name:'top',desc:'Activity monitor',ex:'top -o %MEM'},
{cat:'Process',name:'kill',desc:'Kill by PID',ex:'kill -9 1234'},
{cat:'Process',name:'killall',desc:'Kill by name',ex:'killall -USR1 node'},
{cat:'Process',name:'htop',desc:'Interactive top',ex:'htop -p 1234'},
{cat:'Process',name:'nohup',desc:'No hangup',ex:'nohup ./server.sh &'},
{cat:'Process',name:'jobs',desc:'Background jobs',ex:'jobs -l'},
{cat:'Process',name:'fg',desc:'Foreground job',ex:'fg %1'},
{cat:'Process',name:'bg',desc:'Background job',ex:'bg %2'},
{cat:'Process',name:'screen',desc:'Terminal multiplexer',ex:'screen -S dev'},
{cat:'Process',name:'tmux',desc:'Terminal multiplexer',ex:'tmux new -s dev'},
{cat:'Process',name:'xargs',desc:'Build command from stdin',ex:'find . -name "*.tmp" | xargs rm'},
{cat:'Process',name:'timeout',desc:'Limit execution time',ex:'timeout 30 ./script.sh'},
{cat:'Process',name:'watch',desc:'Repeat command',ex:'watch -n 1 date'},
{cat:'Process',name:'disown',desc:'Detach job',ex:'disown -h %1'},
{cat:'Process',name:'lsof',desc:'Open files',ex:'lsof -i :8080'},
{cat:'Process',name:'pgrep',desc:'Find by name',ex:'pgrep -f "node server"'},
{cat:'Process',name:'pkill',desc:'Kill by name',ex:'pkill -f "node server"'},
{cat:'Networking',name:'curl',desc:'HTTP client',ex:'curl -sL https://api.example.com | jq'},
{cat:'Networking',name:'wget',desc:'Download file',ex:'wget -c https://example.com/file.zip'},
{cat:'Networking',name:'ssh',desc:'Remote login',ex:'ssh -p 2222 user@host -L 8080:localhost:80'},
{cat:'Networking',name:'scp',desc:'Secure copy',ex:'scp -P 22 file.txt user@host:~/'},
{cat:'Networking',name:'rsync',desc:'Sync files',ex:'rsync -avz --delete src/ user@host:dst/'},
{cat:'Networking',name:'nc',desc:'Netcat',ex:'echo "GET / HTTP/1.0\n\n" | nc host 80'},
{cat:'Networking',name:'ip',desc:'Network config',ex:'ip addr show'},
{cat:'Networking',name:'ifconfig',desc:'Legacy network config',ex:'ifconfig eth0'},
{cat:'Networking',name:'ping',desc:'Ping host',ex:'ping -c 4 example.com'},
{cat:'Networking',name:'traceroute',desc:'Trace route',ex:'traceroute -m 30 example.com'},
{cat:'Networking',name:'dig',desc:'DNS lookup',ex:'dig +short A example.com'},
{cat:'Networking',name:'nslookup',desc:'Legacy DNS',ex:'nslookup example.com 8.8.8.8'},
{cat:'Networking',name:'hostname',desc:'Show hostname',ex:'hostname -I'},
{cat:'Networking',name:'netstat',desc:'Network stats',ex:'netstat -tulpn'},
{cat:'Networking',name:'ss',desc:'Socket stats',ex:'ss -tulpn'},
{cat:'Networking',name:'ssh-keygen',desc:'Generate SSH keys',ex:'ssh-keygen -t ed25519 -C "email"'},
{cat:'Networking',name:'ssh-copy-id',desc:'Copy SSH key',ex:'ssh-copy-id user@host'},
{cat:'Networking',name:'iptables',desc:'Firewall rules',ex:'iptables -L -n -v'},
{cat:'Networking',name:'tcpdump',desc:'Packet capture',ex:'tcpdump -i eth0 port 80'},
{cat:'Networking',name:'sshd',desc:'SSH daemon config',ex:'sshd -T'},
{cat:'System',name:'df',desc:'Disk usage',ex:'df -h'},
{cat:'System',name:'du',desc:'Directory size',ex:'du -sh *'},
{cat:'System',name:'free',desc:'Memory usage',ex:'free -h'},
{cat:'System',name:'uname',desc:'System info',ex:'uname -a'},
{cat:'System',name:'uptime',desc:'System uptime',ex:'uptime -p'},
{cat:'System',name:'whoami',desc:'Current user',ex:'whoami'},
{cat:'System',name:'id',desc:'User ID info',ex:'id -Gn'},
{cat:'System',name:'date',desc:'Date/time',ex:'date "+%Y-%m-%d %H:%M:%S"'},
{cat:'System',name:'cal',desc:'Calendar',ex:'cal -3'},
{cat:'System',name:'which',desc:'Find binary',ex:'which node'},
{cat:'System',name:'whereis',desc:'Binary locations',ex:'whereis python3'},
{cat:'System',name:'type',desc:'Command type',ex:'type -a ls'},
{cat:'System',name:'alias',desc:'Create alias',ex:'alias ll="ls -lah"'},
{cat:'System',name:'export',desc:'Set variable',ex:'export PATH=$PATH:/opt/bin'},
{cat:'System',name:'env',desc:'Show environment',ex:'env | grep NODE'},
{cat:'System',name:'set',desc:'Shell settings',ex:'set -euo pipefail'},
{cat:'System',name:'trap',desc:'Catch signals',ex:'trap "echo bye" EXIT'},
{cat:'System',name:'systemctl',desc:'Service manager',ex:'systemctl status nginx'},
{cat:'System',name:'journalctl',desc:'System logs',ex:'journalctl -u nginx -f'},
{cat:'System',name:'crontab',desc:'Cron jobs',ex:'crontab -e'},
{cat:'System',name:'at',desc:'One-time job',ex:'echo "cmd" | at 2am'},
{cat:'System',name:'timedatectl',desc:'Time settings',ex:'timedatectl set-timezone UTC'},
{cat:'System',name:'hostnamectl',desc:'Set hostname',ex:'hostnamectl set-hostname web1'},
{cat:'System',name:'dmidecode',desc:'Hardware info',ex:'dmidecode -t memory'},
{cat:'System',name:'lspci',desc:'PCI devices',ex:'lspci -v'},
{cat:'System',name:'lsusb',desc:'USB devices',ex:'lsusb -t'},
{cat:'System',name:'mount',desc:'Mount filesystem',ex:'mount -t ext4 /dev/sda1 /mnt'},
{cat:'System',name:'umount',desc:'Unmount',ex:'umount /mnt'},
{cat:'System',name:'fdisk',desc:'Disk partitions',ex:'fdisk -l'},
{cat:'System',name:'mkfs',desc:'Format disk',ex:'mkfs.ext4 /dev/sda1'},
{cat:'System',name:'dd',desc:'Copy data',ex:'dd if=input.iso of=/dev/sdb bs=4M'},
{cat:'System',name:'tar',desc:'Archive files',ex:'tar czf arch.tar.gz dir/'},
{cat:'System',name:'zip',desc:'Zip files',ex:'zip -r arch.zip dir/'},
{cat:'System',name:'gzip',desc:'Gzip compress',ex:'gzip -k file.txt'},
{cat:'System',name:'xz',desc:'XZ compress',ex:'xz -9 file.txt'},
{cat:'System',name:'md5sum',desc:'File checksum',ex:'md5sum file.iso'},
{cat:'System',name:'sha256sum',desc:'SHA256 checksum',ex:'sha256sum file.iso'},
{cat:'System',name:'gpg',desc:'Encryption',ex:'gpg --encrypt --recipient user file.txt'},
{cat:'System',name:'openssl',desc:'TLS/crypto',ex:'openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes'},
{cat:'Scripting',name:'echo',desc:'Print text',ex:'echo -e "Line1\\nLine2"'},
{cat:'Scripting',name:'printf',desc:'Formatted print',ex:'printf "%-10s %5d\\n" "Name" 42'},
{cat:'Scripting',name:'test',desc:'Test conditions',ex:'[ -f file.txt ] && echo exists'},
{cat:'Scripting',name:'read',desc:'Read input',ex:'read -p "Name: " name'},
{cat:'Scripting',name:'declare',desc:'Declare variable',ex:'declare -i num=10'},
{cat:'Scripting',name:'local',desc:'Local variable',ex:'local result=0'},
{cat:'Scripting',name:'return',desc:'Function return',ex:'return 1'},
{cat:'Scripting',name:'exit',desc:'Exit script',ex:'exit 1'},
{cat:'Scripting',name:'source',desc:'Source file',ex:'source ~/.bashrc'},
{cat:'Scripting',name:'eval',desc:'Evaluate string',ex:'eval "$cmd"'},
{cat:'Scripting',name:'exec',desc:'Replace process',ex:'exec > output.log 2>&1'},
{cat:'Scripting',name:'$()',desc:'Command substitution',ex:'FILES=$(find . -name "*.js")'},
{cat:'Scripting',name:'${var}',desc:'Variable expansion',ex:'echo ${PATH//bin/BIN}'},
{cat:'Scripting',name:'$((expr))',desc:'Arithmetic',ex:'echo $((2 + 3 * 4))'},
{cat:'Scripting',name:'[[]]',desc:'Test expression',ex:'[[ -d dir && -w dir ]] && echo ok'},
{cat:'Scripting',name:'()',desc:'Subshell',ex:'(cd /tmp && make)'},
{cat:'Scripting',name:'{}',desc:'Brace expansion',ex:'cp file{,.bak}'},
{cat:'Scripting',name:'|',desc:'Pipe',ex:'cat file | grep pattern'},
{cat:'Scripting',name:'&&',desc:'AND',ex:'mkdir dir && cd dir'},
{cat:'Scripting',name:'||',desc:'OR',ex:'[ -f file ] || touch file'},
{cat:'Scripting',name:';',desc:'Sequential',ex:'cmd1 ; cmd2'},
{cat:'Scripting',name:'&',desc:'Background',ex:'./server.sh &'},
{cat:'Scripting',name:'>',desc:'Redirect output',ex:'cmd > out.txt'},
{cat:'Scripting',name:'>>',desc:'Append output',ex:'cmd >> out.txt'},
{cat:'Scripting',name:'2>',desc:'Redirect stderr',ex:'cmd 2> err.txt'},
{cat:'Scripting',name:'2>&1',desc:'Stderr to stdout',ex:'cmd > all.txt 2>&1'},
{cat:'Scripting',name:'<',desc:'Redirect input',ex:'while read line; do echo $line; done < file.txt'},
{cat:'Scripting',name:'<<',desc:'Heredoc',ex:'cat << EOF\\nLine1\\nEOF'},
{cat:'Scripting',name:'<<<',desc:'Here string',ex:'grep pattern <<< "$var"'},
{cat:'Scripting',name:'if',desc:'Conditional',ex:'if [ "$1" = "--help" ]; then echo help; fi'},
{cat:'Scripting',name:'case',desc:'Case statement',ex:'case $1 in\\nstart) cmd ;;\\nesac'},
{cat:'Scripting',name:'for',desc:'For loop',ex:'for f in *.txt; do echo $f; done'},
{cat:'Scripting',name:'while',desc:'While loop',ex:'while read line; do echo $line; done < file'},
{cat:'Scripting',name:'until',desc:'Until loop',ex:'until [ -f done ]; do sleep 1; done'},
{cat:'Scripting',name:'select',desc:'Menu',ex:'select opt in "Yes" "No"; do break; done'},
{cat:'Scripting',name:'break',desc:'Break loop',ex:'break 2'},
{cat:'Scripting',name:'continue',desc:'Continue loop',ex:'continue'},
{cat:'Scripting',name:'shift',desc:'Shift args',ex:'shift 2'},
{cat:'Scripting',name:'getopts',desc:'Parse options',ex:'while getopts "f:v" opt; do ... done'},
];

const cats=[...new Set(CMDS.map(c=>c.cat))];
let activeCat='All';
const search=document.getElementById('search');
const list=document.getElementById('list');
const catDiv=document.getElementById('cats');

function renderCats(){
  catDiv.innerHTML=['<button class="cat-btn '+(activeCat==='All'?'active':'')+'" data-cat="All" style="padding:.4rem .8rem;border:'+(activeCat==='All'?'2px solid #2563eb':'2px solid #ddd')+';border-radius:6px;cursor:pointer;background:'+(activeCat==='All'?'#2563eb':'#fff')+';color:'+(activeCat==='All'?'#fff':'#333')+';font-weight:bold;font-size:.85rem;" type="button">All</button>'].concat(cats.map(c=>'<button class="cat-btn '+(activeCat===c?'active':'')+'" data-cat="'+c+'" style="padding:.4rem .8rem;border:'+(activeCat===c?'2px solid #2563eb':'2px solid #ddd')+';border-radius:6px;cursor:pointer;background:'+(activeCat===c?'#2563eb':'#fff')+';color:'+(activeCat===c?'#fff':'#333')+';font-weight:bold;font-size:.85rem;" type="button">'+c+'</button>')).join('');
  catDiv.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{activeCat=b.dataset.cat;render();}));
}
function render(){
  const q=search.value.toLowerCase();
  const filtered=CMDS.filter(c=>{
    if(activeCat!=='All'&&c.cat!==activeCat)return false;
    if(!q)return true;
    return c.name.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||c.cat.toLowerCase().includes(q);
  });
  if(filtered.length===0){list.innerHTML='<p style="text-align:center;color:#999;padding:2rem;">No results found.</p>';return;}
  list.innerHTML=filtered.map(c=>'<div style="display:flex;align-items:start;gap:1rem;padding:.75rem;border-bottom:1px solid #eee;"><div style="flex:1;"><div style="font-weight:bold;color:#2563eb;font-family:monospace;font-size:1.1rem;">'+c.name+'<span style="font-size:.7rem;color:#999;font-weight:normal;margin-left:.5rem;">'+c.cat+'</span></div><div style="color:#555;font-size:.9rem;margin-top:.2rem;">'+c.desc+'</div><div style="margin-top:.4rem;padding:.4rem .6rem;background:#1e1e2e;color:#a6e3a1;border-radius:6px;font-family:monospace;font-size:.85rem;overflow-x:auto;">$ '+c.ex+'</div></div></div>').join('');
}
function render_(){renderCats();render();}
renderCats();
render();
search.addEventListener('input',render);
})();
</script>
</body>
</html>
