<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>PT Fuse Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>PT Fuse Selector</h1>
<p>Select PT (potential transformer) primary and secondary fuse ratings from system voltage and PT burden. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">System voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 13800"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-burden">PT burden</label><input type="text" id="in-burden" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">VA</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vE=document.getElementById("in-v"),bE=document.getElementById("in-burden"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var v=parseFloat(vE.value),b=parseFloat(bE.value);
if(isNaN(v)||isNaN(b))return;
if(v<=0||b<=0){err.textContent="All values must be positive numbers.";return}
err.textContent="";
var secI=b/115;
var secFuse=Math.ceil(secI/0.5)*0.5;
var primI=b/v;
var primFuse=Math.ceil(primI/0.1)*0.1;
var html='<div class="big">'+secFuse+' A</div>';
html+=row("Secondary fuse",secFuse+' A');
html+=row("Primary fuse",primFuse+' A');
out.innerHTML=html;
}
[vE,bE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
