<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Settlement Plate Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Settlement Plate Calculator</h1>
<p>Calculate total and differential settlement from initial elevation, current elevation readings, and plate spacing. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-i1">Initial reading plate 1</label><input type="text" id="in-i1" inputmode="decimal" autocomplete="off" placeholder="e.g. 100.000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-c1">Current reading plate 1</label><input type="text" id="in-c1" inputmode="decimal" autocomplete="off" placeholder="e.g. 99.950"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-i2">Initial reading plate 2</label><input type="text" id="in-i2" inputmode="decimal" autocomplete="off" placeholder="e.g. 100.000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-c2">Current reading plate 2</label><input type="text" id="in-c2" inputmode="decimal" autocomplete="off" placeholder="e.g. 99.980"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-s">Plate spacing</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var i1El=document.getElementById("in-i1"),c1El=document.getElementById("in-c1"),i2El=document.getElementById("in-i2"),c2El=document.getElementById("in-c2"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var I1=parseFloat(i1El.value),C1=parseFloat(c1El.value),I2=parseFloat(i2El.value),C2=parseFloat(c2El.value),S=parseFloat(sEl.value);
if(isNaN(I1)||isNaN(C1)||isNaN(I2)||isNaN(C2)||isNaN(S))return;
if(S<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var s1=I1-C1, s2=I2-C2;
var diff=Math.abs(s1-s2);
var ang=diff/S;
var html='<div class="big">'+(Math.round(s1*1000)/1000)+' ft</div>';
html+=row("Settlement plate 1",Math.round(s1*1000)/1000+' ft');
html+=row("Settlement plate 2",Math.round(s2*1000)/1000+' ft');
html+=row("Differential",Math.round(diff*1000)/1000+' ft');
html+=row("Angular distortion","1/"+Math.round(S/diff));
out.innerHTML=html;
}
[i1El,c1El,i2El,c2El,sEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
