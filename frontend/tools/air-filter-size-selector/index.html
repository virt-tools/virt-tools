<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Air Filter Size Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Air Filter Size Selector</h1>
<p>Find the right HVAC air filter from nominal and actual dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Nominal width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 16"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-hgt">Nominal height</label><input type="text" id="in-hgt" inputmode="decimal" autocomplete="off" placeholder="e.g. 25"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-d">Depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hgtEl=document.getElementById("in-hgt"),dEl=document.getElementById("in-d"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hgtEl.value),D=pn(dEl.value);
if(W==null||H==null||D==null)return;
if(!isFinite(W)||!isFinite(H)||!isFinite(D)||W<=0||H<=0||D<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var actualW=W-0.5,actualH=H-0.5;
var mervRec=D>=4?"MERV 13–16 (deep pleat)":D>=2?"MERV 11–13":"MERV 8–11";
var html='<div class="big">'+rnd(actualW,2)+' × '+rnd(actualH,2)+' × '+D+'</div>';
html+=row("Nominal size",W+' × '+H+' × '+D+' in');
html+=row("Typical actual size",rnd(actualW,2)+' × '+rnd(actualH,2)+' × '+D+' in (check the size printed on your current filter)');
html+=row("Filter area",rnd(actualW*actualH,1)+' sq in');
html+=row("Recommended MERV",mervRec);
out.innerHTML=html;
}
[wEl,hgtEl,dEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
