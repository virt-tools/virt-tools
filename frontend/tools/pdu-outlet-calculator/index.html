<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>PDU Outlet Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>PDU Outlet Calculator</h1>
<p>Calculate the number of PDUs needed and the per-outlet power budget from total outlets required, PDU amperage, and voltage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-o">Outlets needed</label><input type="text" id="in-o" inputmode="numeric" autocomplete="off" placeholder="e.g. 24"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-a">PDU amperage</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 16"><div class="unit">amps</div></div>
<div class="field"><label class="f" for="in-v">Voltage</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var oEl=document.getElementById("in-o"),aEl=document.getElementById("in-a"),vEl=document.getElementById("in-v"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var O=parseInt(oEl.value),A=parseFloat(aEl.value),V=parseFloat(vEl.value);
if(isNaN(O)||isNaN(A)||isNaN(V))return;
if(O<=0||A<=0||V<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var capacity=A*V; // VA
var outletsPerPDU=Math.min(O,24); // typical 24-outlet PDU
var pdus=Math.ceil(O/outletsPerPDU);
var perOutlet=capacity/O;
var derated=capacity*0.8;
var html='<div class="big">'+pdus+' PDU'+(pdus>1?"s":"")+'</div>';
html+=row("PDUs needed",pdus);
html+=row("Outlets per PDU",outletsPerPDU);
html+=row("Total capacity",Math.round(capacity)+" VA");
html+=row("Derated (80%)",Math.round(derated)+" VA");
html+=row("Per-outlet budget",Math.round(perOutlet)+" VA");
out.innerHTML=html;
}
[oEl,aEl,vEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
