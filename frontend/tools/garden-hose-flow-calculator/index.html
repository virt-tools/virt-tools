<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Garden Hose Flow Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Garden Hose Flow Calculator</h1>
<p>Calculate garden hose flow rate (GPM) from hose diameter, length, and water pressure. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Hose diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-l">Hose length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-p">Water pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">psi</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),L=pn(lEl.value),P=pn(pEl.value);
if(D==null||L==null||P==null)return;
if(!isFinite(D)||!isFinite(L)||!isFinite(P)||D<=0||L<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var head=P*2.31;
var S=head/L;
var gpm=0.285*140*Math.pow(D,2.63)*Math.pow(S,0.54);
var vel=gpm*0.4085/(D*D);
var html='<div class="big">'+rnd(gpm,1)+' gpm</div>';
html+=row("Hose diameter",rnd(D,2)+' in');
html+=row("Velocity",rnd(vel,1)+' ft/s');
html+=row("Flow rate",rnd(gpm,1)+' gpm');
html+=row("Fill 5 gal bucket",rnd(60/gpm*5,0)+' sec');
out.innerHTML=html;
}
[dEl,lEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
