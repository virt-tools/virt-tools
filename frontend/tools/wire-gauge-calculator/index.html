<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wire Gauge Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Wire Gauge Calculator</h1>
<p class="subtitle">Find AWG wire size, diameter, and resistance for electrical projects.</p>
<div class="input-section">
<label>Select AWG Size</label>
<select id="awg" aria-label="Awg">
<option value="0">0000 (4/0)</option>
<option value="1">000 (3/0)</option>
<option value="2">00 (2/0)</option>
<option value="3">0 (1/0)</option>
<option value="4">4 AWG</option>
<option value="6">6 AWG</option>
<option value="8" selected>8 AWG</option>
<option value="10">10 AWG</option>
<option value="12">12 AWG</option>
<option value="14">14 AWG</option>
<option value="16">16 AWG</option>
<option value="18">18 AWG</option>
<option value="20">20 AWG</option>
<option value="22">22 AWG</option>
<option value="24">24 AWG</option>
</select>
<label>Wire Length (feet, one-way)</label>
<input type="number" id="length" value="50" min="1" aria-label="Length">
<label>Current (amps)</label>
<input type="number" id="current" value="15" min="0" step="0.5" aria-label="Current">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const AWG={
0:{d:0.46,r:0.0000506,amp:260},1:{d:0.4096,r:0.0000639,amp:211},
2:{d:0.3648,r:0.0000807,amp:181},3:{d:0.3249,r:0.0001018,amp:158},
4:{d:0.2893,r:0.0001284,amp:135},6:{d:0.2043,r:0.0002043,amp:101},
8:{d:0.1620,r:0.0003243,amp:74},10:{d:0.1285,r:0.0005152,amp:55},
12:{d:0.1020,r:0.0008192,amp:41},14:{d:0.0808,r:0.001301,amp:32},
16:{d:0.0641,r:0.002067,amp:22},18:{d:0.0508,r:0.003284,amp:16},
20:{d:0.0403,r:0.005219,amp:11},22:{d:0.0320,r:0.008286,amp:7},
24:{d:0.0254,r:0.01316,amp:3.5}
};
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const awgKey=parseInt(document.getElementById('awg').value);
const L=parseFloat(document.getElementById('length').value)||0;
const I=parseFloat(document.getElementById('current').value)||0;
const data=AWG[awgKey];
const roundTrip=L*2;
const resistance=data.r*roundTrip;
const voltageDrop=I*resistance;
const percentDrop=(voltageDrop/120)*100;
let safe=data.amp>=I?'<p class="ok">✓ Ampacity OK (rated '+data.amp+'A)</p>':'<p class="warning">⚠️ Exceeds ampacity ('+data.amp+'A) — use larger wire</p>';
document.getElementById('result').innerHTML=`
<div class="result-row"><span>AWG Size:</span><span>${document.getElementById('awg').selectedOptions[0].text}</span></div>
<div class="result-row"><span>Diameter:</span><span>${data.d.toFixed(4)}"</span></div>
<div class="result-row"><span>Round-trip Resistance:</span><span>${resistance.toFixed(4)} Ω</span></div>
<div class="result-row"><span>Voltage Drop:</span><span>${voltageDrop.toFixed(2)} V (${percentDrop.toFixed(2)}%)</span></div>
<div class="result-row"><span>Ampacity:</span><span>${data.amp} A</span></div>
${safe}`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
