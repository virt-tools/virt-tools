<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Swell Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Swell Test Calculator</h1>
<p>Calculate swell pressure and swell percentage from free swell test measurements. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-h0">Initial height</label><input type="text" id="in-h0" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-h1">Final height</label><input type="text" id="in-h1" inputmode="decimal" autocomplete="off" placeholder="e.g. 21.5"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-p">Surcharge pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">kPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var h0E=document.getElementById("in-h0"),h1E=document.getElementById("in-h1"),pE=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var H0=parseFloat(h0E.value),H1=parseFloat(h1E.value),P=parseFloat(pE.value);
if(isNaN(H0)||isNaN(H1))return;
if(H0<=0||H1<=0){err.textContent="Enter valid heights.";return}
err.textContent="";
var swell=(H1-H0)/H0*100;
var html='<div class="big">'+Math.round(swell*10)/10+'%</div>';
html+=row("Swell percentage",Math.round(swell*10)/10+'%');
if(!isNaN(P)&&P>0){
  var sp=P*(1+swell/100);
  html+=row("Est. swell pressure",Math.round(sp*10)/10+' kPa');
}
html+=row("Height change",Math.round((H1-H0)*100)/100+' mm');
out.innerHTML=html;
}
[h0E,h1E,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
