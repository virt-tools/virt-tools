<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Lawn Overseed Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Lawn Overseed Calculator</h1>
<p>Calculate grass seed needed for overseeding from lawn area, seed rate, and seed mix. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Lawn width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Lawn length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-rate">Seed rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">lb / 1000 sqft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),rateEl=document.getElementById("in-rate"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value),Rate=pn(rateEl.value);
if(W==null||L==null||Rate==null)return;
if(!isFinite(W)||!isFinite(L)||!isFinite(Rate)||W<=0||L<=0||Rate<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=W*L;
var lbs=area/1000*Rate;
var bags=Math.ceil(lbs/5);
var html='<div class="big">'+rnd(lbs,1)+' lbs</div>';
html+=row("Lawn area",rnd(area,0)+' sq ft');
html+=row("Seed rate",rnd(Rate,1)+' lb / 1000 sqft');
html+=row("Seed needed",rnd(lbs,1)+' lbs');
html+=row("5 lb bags",bags+' bags');
out.innerHTML=html;
}
[wEl,lEl,rateEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
