<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Beautifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>HTML Beautifier</h1>
<p class="subtitle">Format HTML with proper nesting indentation. Also minify HTML to reduce size.</p>
<div class="input-section">
<label>HTML Input</label>
<textarea id="input" rows="10" placeholder="<div aria-label="<Div>"><p>Hello</p></div>"></textarea>
<button id="beautify" class="primary-btn" type="button">Beautify</button>
<button id="minify" class="primary-btn" type="button">Minify</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const voids=['area','base','br','col','embed','hr','img','input','link','meta','source','track','wbr'];
function beautify(html){
let indent=0,out='',i=0,tokens=[],re=/<[^>]+>|[^<]+/g;let m;
while((m=re.exec(html))){tokens.push(m[0]);}
for(let t of tokens){
t=t.trim();if(!t)continue;
if(t.startsWith('</')){indent=Math.max(0,indent-1);out+='  '.repeat(indent)+t+'\n';}
else if(t.startsWith('<')&&!t.endsWith('/>')&&!t.startsWith('<!')&&!t.startsWith('<?')){
let tag=t.match(/^<(\w+)/);let tagname=tag?tag[1].toLowerCase():'';if(voids.includes(tagname)){out+='  '.repeat(indent)+t+'\n';}
else{out+='  '.repeat(indent)+t+'\n';indent++;}}else{out+='  '.repeat(indent)+t+'\n';}}
return out.trim()+'\n';}
function minify(html){return html.replace(/<!--[\s\S]*?-->/g,'').replace(/\s+/g,' ').replace(/>\s+</g,'><').trim();}
document.getElementById('beautify').addEventListener('click',()=>{show(beautify(document.getElementById('input').value));});
document.getElementById('minify').addEventListener('click',()=>{show(minify(document.getElementById('input').value));});
function show(r){document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+r.replace(/</g,'&lt;')+'</pre>';document.getElementById('result').style.display='block';window._result=r;}
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
