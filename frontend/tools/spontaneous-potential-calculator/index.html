<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Spontaneous Potential Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Spontaneous Potential Calculator</h1>
<p>Calculate SP anomaly gradient and static potential from two electrode readings and their distance. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sp1">SP reading 1</label><input type="text" id="in-sp1" inputmode="decimal" autocomplete="off" placeholder="e.g. -50"><div class="unit">mV</div></div>
<div class="field"><label class="f" for="in-sp2">SP reading 2</label><input type="text" id="in-sp2" inputmode="decimal" autocomplete="off" placeholder="e.g. -20"><div class="unit">mV</div></div>
<div class="field"><label class="f" for="in-dx">Distance between</label><input type="text" id="in-dx" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var sp1E=document.getElementById("in-sp1"),sp2E=document.getElementById("in-sp2"),dxE=document.getElementById("in-dx"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var sp1=parseFloat(sp1E.value),sp2=parseFloat(sp2E.value),dx=parseFloat(dxE.value);
if(isNaN(sp1)||isNaN(sp2)||isNaN(dx))return;
if(dx<=0){err.textContent="Enter valid distance.";return}
err.textContent="";
var gradient=(sp2-sp1)/dx;
var avg=(sp1+sp2)/2;
var html='<div class="big">'+Math.round(gradient*100)/100+' mV/m</div>';
html+=row("SP gradient",Math.round(gradient*100)/100+' mV/m');
html+=row("Average SP",Math.round(avg)+' mV');
out.innerHTML=html;
}
[sp1E,sp2E,dxE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
