<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capital Gains Tax Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:600px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input,.input-group select{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.radio-group{display:flex;gap:1rem;margin:.5rem 0}
.radio-group label{display:flex;align-items:center;gap:.25rem;cursor:pointer}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
.formula{font-size:.85rem;color:var(--text-muted);margin-top:.25rem}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Capital Gains Tax Calculator</h1>
<div class="calc-wrap">
<h2>Capital Gains Tax Calculator 📊</h2>
<p>Estimate US capital gains tax for 2024 tax year. Long-term rates: 0%, 15%, or 20%. Short-term = ordinary income.</p>
<div class="input-group">
<label>Purchase price ($)</label>
<input type="number" id="purchase" value="10000" min="0" aria-label="Purchase">
</div>
<div class="input-group">
<label>Sale price ($)</label>
<input type="number" id="sale" value="15000" min="0" aria-label="Sale">
</div>
<div class="input-group">
<label>Holding period</label>
<div class="radio-group">
<label><input type="radio" name="term" value="short" checked> Short-term (&lt;1 year)</label>
<label><input type="radio" name="term" value="long"> Long-term (&gt;1 year)</label>
</div>
</div>
<div class="input-group">
<label>Filing status</label>
<select id="status" aria-label="Status">
<option value="single">Single</option>
<option value="married">Married filing jointly</option>
<option value="head">Head of household</option>
</select>
</div>
<div class="input-group">
<label>Taxable income (excluding this gain, $)</label>
<input type="number" id="income" value="75000" min="0" aria-label="Income">
<div class="formula">Your other income — used to determine which long-term bracket applies.</div>
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const pur=v('purchase'),sale=v('sale');
  const gain=sale-pur;
  const term=document.querySelector('input[name=term]:checked').value;
  const status=document.getElementById('status').value;
  const income=v('income');
  if(gain<=0){
    const r=document.getElementById('result');
    r.style.display='';
    r.innerHTML='<h3>No taxable gain</h3><p>You sold at a loss. No capital gains tax owed.</p>';
    return;
  }
  let rate,tax,bracket;
  const brackets={
    single:{zero:44625,fifteen:552850},
    married:{zero:89250,fifteen:552850},
    head:{zero:59750,fifteen:523050}
  };
  const b=brackets[status];
  if(term==='long'){
    const total=income+gain;
    if(total<=b.zero){rate=0;tax=0;bracket='0%'}
    else if(total<=b.fifteen){rate=0.15;tax=gain*0.15;bracket='15%'}
    else{rate=0.20;tax=gain*0.20;bracket='20%'}
  }else{
    if(income+gain<=11000){rate=0.10;tax=gain*0.10;bracket='10%'}
    else if(income+gain<=44725){rate=0.12;tax=gain*0.12;bracket='12%'}
    else if(income+gain<=95375){rate=0.22;tax=gain*0.22;bracket='22%'}
    else if(income+gain<=182100){rate=0.24;tax=gain*0.24;bracket='24%'}
    else if(income+gain<=231250){rate=0.32;tax=gain*0.32;bracket='32%'}
    else if(income+gain<=578125){rate=0.35;tax=gain*0.35;bracket='35%'}
    else{rate=0.37;tax=gain*0.37;bracket='37%'}
  }
  const net=sale-pur-tax;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Results</h3>'+
    '<div class="result-row"><span>Capital gain</span><span>$'+gain.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</span></div>'+
    '<div class="result-row"><span>Type</span><span>'+(term==='long'?'Long-term':'Short-term')+'</span></div>'+
    '<div class="result-row"><span>Tax bracket</span><span>'+bracket+'</span></div>'+
    '<div class="result-row"><span>Estimated tax</span><span>$'+tax.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</span></div>'+
    '<div class="result-row"><span>Net after tax</span><span>$'+net.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'</span></div>';
}
</script>
</body>
</html>
