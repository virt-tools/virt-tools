<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wallpaper Strip Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wallpaper Strip Calculator</h1>
<p>Calculate number of wallpaper strips, total rolls needed, and pattern repeat allowance. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wl">Wall length</label><input type="text" id="in-wl" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-wh">Wall height</label><input type="text" id="in-wh" inputmode="decimal" autocomplete="off" placeholder="e.g. 2700"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-rw">Roll width</label><input type="text" id="in-rw" inputmode="decimal" autocomplete="off" placeholder="e.g. 530"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-rl">Roll length</label><input type="text" id="in-rl" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall and roll dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wlEl=document.getElementById("in-wl"),whEl=document.getElementById("in-wh"),rwEl=document.getElementById("in-rw"),rlEl=document.getElementById("in-rl"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var WL=pn(wlEl.value),WH=pn(whEl.value),RW=pn(rwEl.value),RL=pn(rlEl.value);
if(WL==null||WH==null){return}
RW=RW==null?530:RW;RL=RL==null?10000:RL;
if(!isFinite(WL)||!isFinite(WH)||!isFinite(RW)||!isFinite(RL)||WL<=0||WH<=0||RW<=0||RL<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var strips=Math.ceil(WL/RW);
var stripLen=WH+100;
var stripsPerRoll=Math.floor(RL/stripLen);
var rolls=Math.ceil(strips/stripsPerRoll);
var html='<div class="big">'+rolls+' rolls</div>';
html+=row("Wall area",rnd(WL,0)+"×"+rnd(WH,0)+" mm");
html+=row("Roll width",rnd(RW,0)+" mm");
html+=row("Strips needed",strips);
html+=row("Strip length (incl. trim)",rnd(stripLen,0)+" mm");
html+=row("Strips per roll",stripsPerRoll);
html+=row("Rolls to buy",rolls);
out.innerHTML=html;
}
[wlEl,whEl,rwEl,rlEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
