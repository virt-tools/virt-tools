<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derivative Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Numerical Derivative Calculator</h1>
<p class="subtitle">Estimate the derivative of a function at a point using the central difference method.</p>
<div class="input-section">
<label>f(x) =</label>
<input type="text" id="expr" value="x^3 + 2*x^2 - 5*x + 1" style="width:100%;font-family:monospace" aria-label="Expr">
<label>at x =</label>
<input type="number" id="xval" value="2" step="any" aria-label="Xval">
<button id="calc" class="primary-btn" type="button">Calculate Derivative</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script src="/assets/math-expression.js"></script>
<script>
function finiteInput(id,label){const raw=document.getElementById(id).value.trim(),value=Number(raw);if(!raw||!Number.isFinite(value))throw new Error(label+' must be a finite number.');return value;}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const h=1e-6;
const result=document.getElementById('result');
try{
const x=finiteInput('xval','x');
const evaluator=VTMathExpression.compile(expr,['x']);
const fPlus=evaluator({x:x+h});
const fMinus=evaluator({x:x-h});
const fAt=evaluator({x});
const deriv=(fPlus-fMinus)/(2*h);
const secondDeriv=(fPlus-2*fAt+fMinus)/(h*h);
if(![fPlus,fMinus,fAt,deriv,secondDeriv].every(Number.isFinite))throw new Error('Expression produced a non-finite result near x.');
result.innerHTML=`
<div class="result-row"><span>f(${x}):</span><span>${fAt.toFixed(8)}</span></div>
<div class="result-row"><span>f'(${x}) (first derivative):</span><span>${deriv.toFixed(8)}</span></div>
<div class="result-row"><span>f''(${x}) (second derivative):</span><span>${secondDeriv.toFixed(8)}</span></div>
<div class="result-row"><span>Method:</span><span>Central difference (h = ${h})</span></div>`;
}catch(e){result.textContent='Error: '+e.message;}
result.style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
