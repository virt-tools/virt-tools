<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derivative Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Numerical Derivative Calculator</h1>
<p class="subtitle">Estimate the derivative of a function at a point using the central difference method.</p>
<div class="input-section">
<label>f(x) =</label>
<input type="text" id="expr" value="x^3 + 2*x^2 - 5*x + 1" style="width:100%;font-family:monospace" aria-label="Expr">
<label>at x =</label>
<input type="number" id="xval" value="2" step="any" aria-label="Xval">
<button id="calc" class="primary-btn" type="button">Calculate Derivative</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function evalExpr(expr,x){
try{expr=expr.replace(/\^/g,'**').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(').replace(/abs\(/g,'Math.abs(').replace(/exp\(/g,'Math.exp(').replace(/pi/g,'Math.PI');return Function('"use strict";x=arguments[0];return '+expr)(x);}catch(e){return NaN;}}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const expr=document.getElementById('expr').value;
const x=parseFloat(document.getElementById('xval').value)||0;
const h=1e-6;
const fPlus=evalExpr(expr,x+h);
const fMinus=evalExpr(expr,x-h);
const fAt=evalExpr(expr,x);
const deriv=(fPlus-fMinus)/(2*h);
const secondDeriv=(fPlus-2*fAt+fMinus)/(h*h);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>f(${x}):</span><span>${fAt.toFixed(8)}</span></div>
<div class="result-row"><span>f'(${x}) (first derivative):</span><span>${deriv.toFixed(8)}</span></div>
<div class="result-row"><span>f''(${x}) (second derivative):</span><span>${secondDeriv.toFixed(8)}</span></div>
<div class="result-row"><span>Method:</span><span>Central difference (h = ${h})</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
