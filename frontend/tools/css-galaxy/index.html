<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Galaxy Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:400px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌌 CSS Galaxy Generator</h1>
<p>Create CSS animated galaxy / spiral nebula background effects. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="spiral">Spiral</option><option value="barred">Barred</option><option value="elliptical">Elliptical</option><option value="nebula">Nebula</option></select></div>
<div class="ctrl-row"><label>Stars</label><input type="range" id="stars" min="50" max="300" step="10" value="150" style="width:200px"></div>
<div class="ctrl-row"><label>Spiral Arms</label><input type="range" id="arms" min="2" max="8" step="1" value="4" style="width:200px"></div>
<div class="ctrl-row"><label>Rotation Speed</label><input type="range" id="speed" min="10" max="120" step="5" value="60" style="width:200px"></div>
<div class="ctrl-row"><label>Core Color</label><input type="color" id="core" value="#ffd700"></div>
<div class="ctrl-row"><label>Arm Color</label><input type="color" id="arm" value="#7b68ee"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#0a0a1a"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var n=parseInt(document.getElementById('stars').value);
var arms=parseInt(document.getElementById('arms').value);
var sp=parseFloat(document.getElementById('speed').value);
var core=document.getElementById('core').value;
var arm=document.getElementById('arm').value;
var bg=document.getElementById('bgcolor').value;
var html='<div class="galaxy">\n  <div class="galaxy-core"></div>\n';
var step=360/n*arms;
for(var i=0;i<n;i++){
var ang=(i*step)%360;var dist=Math.sqrt(i/n)*48;
var delay=-((i/n)*sp);
html+='  <div class="galaxy-star" style="--a:'+ang+'deg;--d:'+dist+'%;animation-delay:'+delay+'s"></div>\n';
}
html+='</div>';
var css='.galaxy{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:'+bg+';overflow:hidden;animation:galaxy-rotate '+sp+'s linear infinite}\n';
css+='.galaxy-core{width:30%;height:30%;border-radius:50%;background:radial-gradient(circle,'+core+' 0%,transparent 70%);position:absolute;box-shadow:0 0 40px '+core+'}\n';
css+='.galaxy-star{position:absolute;width:2px;height:2px;background:'+arm+';border-radius:50%;transform:rotate(var(--a)) translateX(var(--d));opacity:.6;box-shadow:0 0 4px '+arm+'}\n';
if(preset==='spiral')css+='.galaxy-star{animation:galaxy-pulse 3s ease-in-out infinite}\n';
else if(preset==='barred')css+='.galaxy{animation-name:galaxy-rotate-bar}\n@keyframes galaxy-rotate-bar{from{transform:rotate(0) scaleX(1.6)}to{transform:rotate(360deg) scaleX(1.6)}}\n';
else if(preset==='elliptical')css+='.galaxy{animation-name:galaxy-rotate-ell}\n@keyframes galaxy-rotate-ell{from{transform:rotate(0) scaleY(1.5) scaleX(.7)}to{transform:rotate(360deg) scaleY(1.5) scaleX(.7)}}\n';
else if(preset==='nebula')css+='.galaxy-star{width:3px;height:3px;opacity:.4;filter:blur(1px)}\n';
css+='@keyframes galaxy-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}\n';
css+='@keyframes galaxy-pulse{0%,100%{opacity:.3}50%{opacity:.8}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','stars','arms','speed','core','arm','bgcolor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
