<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proportion Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Proportion Calculator</h1>
<p class="subtitle">Solve proportions: a/b = c/d. Enter any 3 values to find the 4th.</p>
<div class="input-section">
<label style="font-size:20px;margin:10px 0">a : b = c : d</label>
<label>a</label>
<input type="number" id="a" value="3" step="any" aria-label="A">
<label>b</label>
<input type="number" id="b" value="4" step="any" aria-label="B">
<label>c</label>
<input type="number" id="c" value="6" step="any" aria-label="C">
<label>d (leave blank to solve)</label>
<input type="number" id="d" placeholder="blank" step="any" aria-label="Blank">
<button id="calc" class="primary-btn" type="button">Solve</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
let a=document.getElementById('a').value;
let b=document.getElementById('b').value;
let c=document.getElementById('c').value;
let d=document.getElementById('d').value;
a=a===''?null:parseFloat(a);
b=b===''?null:parseFloat(b);
c=c===''?null:parseFloat(c);
d=d===''?null:parseFloat(d);
const known=[a,b,c,d].filter(x=>x!==null).length;
if(known<3){document.getElementById('result').innerHTML='<p class="warning">Enter at least 3 values.</p>';document.getElementById('result').style.display='block';return;}
let solution=null,which='';
if(a===null){a=b*c/d;which='a';}
else if(b===null){b=a*d/c;which='b';}
else if(c===null){c=a*d/b;which='c';}
else if(d===null){d=b*c/a;which='d';}
const ratio=a/b;
const isDirect=Math.abs(a/b-c/d)<0.0001;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Solved for:</span><span>${which} = ${[a,b,c,d].find(x=>[a,b,c,d].indexOf(x)===['a','b','c','d'].indexOf(which))}</span></div>
<div class="result-row"><span>Full proportion:</span><span>${a} : ${b} = ${c} : ${d}</span></div>
<div class="result-row"><span>Ratio:</span><span>${ratio.toFixed(6)}:1</span></div>
<div class="result-row"><span>Direct proportion:</span><span>${isDirect?'✓ Yes':'✗ No'}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
