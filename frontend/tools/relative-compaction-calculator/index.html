<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Relative Compaction Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Relative Compaction Calculator</h1>
<p>Calculate relative compaction and relative density from field dry density and maximum/minimum laboratory densities. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-fd">Field dry density</label><input type="text" id="in-fd" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.75"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-md">Max dry density</label><input type="text" id="in-md" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.90"><div class="unit">g/cm³</div></div>
<div class="field"><label class="f" for="in-mind">Min dry density</label><input type="text" id="in-mind" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.40"><div class="unit">g/cm³</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fdE=document.getElementById("in-fd"),mdE=document.getElementById("in-md"),mindE=document.getElementById("in-mind"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var fd=parseFloat(fdE.value),md=parseFloat(mdE.value),mind=parseFloat(mindE.value);
if(isNaN(fd)||isNaN(md))return;
if(md<=0){err.textContent="Enter valid density.";return}
err.textContent="";
var rc=fd/md*100;
var html='<div class="big">'+Math.round(rc*10)/10+'%</div>';
html+=row("Relative compaction",Math.round(rc*10)/10+'%');
if(!isNaN(mind)&&mind>0&&fd>mind){
  var rd=(fd-mind)/(md-mind)*md/mind;
  html+=row("Relative density (Dr)",Math.round(rd*10)/10+'%');
}
out.innerHTML=html;
}
[fdE,mdE,mindE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
