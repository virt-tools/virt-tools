<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fertilizer Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Fertilizer Calculator</h1>
<p class="subtitle">Calculate fertilizer amounts based on N-P-K ratio and lawn area.</p>
<div class="input-section">
<label>Lawn Area (sq ft)</label>
<input type="number" id="area" value="5000" min="0" aria-label="Area">
<label>Nitrogen (N%)</label>
<input type="number" id="nitrogen" value="20" min="0" max="100" aria-label="Nitrogen">
<label>Target N Rate (lbs/1000 sq ft)</label>
<input type="number" id="targetN" value="1" min="0" step="0.1" aria-label="Target N">
<label>Bag Weight (lbs)</label>
<input type="number" id="bagWeight" value="50" min="1" aria-label="Bag Weight">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const A=parseFloat(document.getElementById('area').value)||0;
const Npct=parseFloat(document.getElementById('nitrogen').value)||0;
const target=parseFloat(document.getElementById('targetN').value)||0;
const bagWt=parseFloat(document.getElementById('bagWeight').value)||1;
const totalNneeded=(A/1000)*target;
const fertLbs=totalNneeded/(Npct/100);
const bags=(fertLbs/bagWt).toFixed(1);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Lawn Area:</span><span>${A} sq ft</span></div>
<div class="result-row"><span>Total N Needed:</span><span>${totalNneeded.toFixed(2)} lbs</span></div>
<div class="result-row"><span>Fertilizer Needed:</span><span>${fertLbs.toFixed(1)} lbs</span></div>
<div class="result-row"><span>Bags Needed:</span><span>${bags} bags (${bagWt} lb each)</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
