<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Cabinet Toe Kick Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Cabinet Toe Kick Calculator</h1>
<p>Calculate toe kick height and recess depth for kitchen or vanity cabinets. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-ch">Cabinet height</label><input type="text" id="in-ch" inputmode="decimal" autocomplete="off" placeholder="e.g. 900"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-tk">Toe kick height</label><input type="text" id="in-tk" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-tr">Toe kick recess</label><input type="text" id="in-tr" inputmode="decimal" autocomplete="off" placeholder="e.g. 75"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter cabinet height.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var chEl=document.getElementById("in-ch"),tkEl=document.getElementById("in-tk"),trEl=document.getElementById("in-tr"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CH=pn(chEl.value),TK=pn(tkEl.value),TR=pn(trEl.value);
if(CH==null){return}
TK=TK==null?100:TK;TR=TR==null?75:TR;
if(!isFinite(CH)||!isFinite(TK)||!isFinite(TR)||CH<=0||TK<0||TR<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var usableH=CH-TK;
var html='<div class="big">'+rnd(usableH,0)+' mm</div>';
html+=row("Cabinet height",rnd(CH,0)+" mm");
html+=row("Toe kick height",rnd(TK,0)+" mm");
html+=row("Toe kick recess",rnd(TR,0)+" mm");
html+=row("Usable cabinet height",rnd(usableH,0)+" mm");
out.innerHTML=html;
}
[chEl,tkEl,trEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
