<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Hologram Text Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#000;border-radius:12px;overflow:hidden;position:relative;height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔮 CSS Hologram Text Generator</h1>
<p>Create CSS holographic text with scan lines, glow, and chromatic aberration. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="HOLOGRAM" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="classic">Classic</option><option value="cyber">Cyber</option><option value="glitch">Glitch</option><option value="ghost">Ghost</option></select></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="20" max="120" step="2" value="60" style="width:200px" aria-label="Fsize"></div>
<div class="ctrl-row"><label>Scan Speed</label><input type="range" id="speed" min="1" max="10" step="1" value="4" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Color</label><input type="color" id="color" value="#00ffff" aria-label="Color"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#000011" aria-label="Bgcolor"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var text=document.getElementById('text').value;
var preset=document.getElementById('preset').value;
var fs=parseInt(document.getElementById('fsize').value);
var sp=parseFloat(document.getElementById('speed').value);
var color=document.getElementById('color').value;
var bg=document.getElementById('bgcolor').value;
var html='<div class="holo">\n  <div class="holo-scan"></div>\n  <div class="holo-text">'+text+'</div>\n</div>';
var css='.holo{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:'+bg+';overflow:hidden}\n';
css+='.holo-text{font-size:'+fs+'px;font-weight:bold;letter-spacing:.1em;color:'+color+';text-shadow:0 0 10px '+color+',0 0 20px '+color+',0 0 40px '+color+';position:relative;z-index:2';
if(preset==='cyber')css+=';font-family:monospace;text-transform:uppercase';
if(preset==='glitch')css+=';animation:holo-glitch 0.3s infinite';
if(preset==='ghost')css+=';opacity:.7;animation:holo-fade '+(sp)+'s ease-in-out infinite';
css+='}\n';
css+='.holo-scan{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba('+hex2rgb(color)+',0.08) 3px,rgba('+hex2rgb(color)+',0.08) 4px);z-index:1;animation:holo-scan '+(10/sp)+'s linear infinite}\n';
css+='@keyframes holo-scan{from{background-position:0 0}to{background-position:0 100px}}\n';
if(preset==='glitch')css+='@keyframes holo-glitch{0%,100%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}}\n';
css+='@keyframes holo-fade{0%,100%{opacity:.3}50%{opacity:.8}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function hex2rgb(h){h=h.replace('#','');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return r+','+g+','+b}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','preset','fsize','speed','color','bgcolor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
