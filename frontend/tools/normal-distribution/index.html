<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal Distribution Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Normal Distribution Calculator</h1>
<p class="subtitle">Calculate z-scores, cumulative probabilities, and percentiles for the normal distribution.</p>
<div class="input-section">
<label>Mean (μ)</label>
<input type="number" id="mean" value="100" step="any" aria-label="Mean">
<label>Std Dev (σ)</label>
<input type="number" id="std" value="15" min="0.001" step="any" aria-label="Std">
<label>X Value</label>
<input type="number" id="x" value="120" step="any" aria-label="X">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function erf(x){
const t=1/(1+0.3275911*Math.abs(x));
const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
return x>=0?y:-y;
}
function cdf(x,mu,sigma){return 0.5*(1+erf((x-mu)/(sigma*Math.SQRT2)));}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const mu=parseFloat(document.getElementById('mean').value)||0;
const sigma=parseFloat(document.getElementById('std').value)||1;
const x=parseFloat(document.getElementById('x').value)||0;
const z=(x-mu)/sigma;
const pLess=cdf(x,mu,sigma);
const pGreater=1-pLess;
const pTwoTail=2*Math.min(pLess,pGreater);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Z-Score:</span><span>${z.toFixed(4)}</span></div>
<div class="result-row"><span>P(X < ${x}):</span><span>${pLess.toFixed(6)} (${(pLess*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>P(X > ${x}):</span><span>${pGreater.toFixed(6)} (${(pGreater*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>P(X ≠ ${x}) (two-tailed):</span><span>${pTwoTail.toFixed(6)} (${(pTwoTail*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>Percentile:</span><span>${(pLess*100).toFixed(2)}th</span></div>
<div class="result-row"><span>95% CI:</span><span>${(mu-1.96*sigma).toFixed(2)} to ${(mu+1.96*sigma).toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
