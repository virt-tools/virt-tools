<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impedance Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>AC Impedance Calculator</h1>
<p class="subtitle">Calculate impedance, phase angle, and admittance for RLC circuits.</p>
<div class="input-section">
<label>Resistance (Ω)</label>
<input type="number" id="R" value="100" min="0" step="any" aria-label="R">
<label>Inductance (mH)</label>
<input type="number" id="L" value="10" min="0" step="any" aria-label="L">
<label>Capacitance (µF)</label>
<input type="number" id="C" value="100" min="0" step="any" aria-label="C">
<label>Frequency (Hz)</label>
<input type="number" id="f" value="60" min="0.1" step="any" aria-label="F">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const R=parseFloat(document.getElementById('R').value)||0;
const L=parseFloat(document.getElementById('L').value)||0;
const C=parseFloat(document.getElementById('C').value)||0;
const f=parseFloat(document.getElementById('f').value)||0;
const omega=2*Math.PI*f;
const XL=omega*L/1000;
const XC=1/(omega*C/1e6);
const X=XL-XC;
const Z=Math.sqrt(R*R+X*X);
const phase=Math.atan2(X,R)*180/Math.PI;
const admittance=1/Z;
const powerFactor=Math.cos(phase*Math.PI/180);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Frequency:</span><span>${f} Hz</span></div>
<div class="result-row"><span>Angular Frequency:</span><span>${omega.toFixed(2)} rad/s</span></div>
<div class="result-row"><span>Inductive Reactance (XL):</span><span>${XL.toFixed(2)} Ω</span></div>
<div class="result-row"><span>Capacitive Reactance (XC):</span><span>${XC.toFixed(2)} Ω</span></div>
<div class="result-row"><span>Net Reactance (X):</span><span>${X.toFixed(2)} Ω ${X>0?'(inductive)':'(capacitive)'}</span></div>
<div class="result-row"><span>Impedance |Z|:</span><span>${Z.toFixed(2)} Ω</span></div>
<div class="result-row"><span>Phase Angle:</span><span>${phase.toFixed(2)}°</span></div>
<div class="result-row"><span>Power Factor:</span><span>${powerFactor.toFixed(4)}</span></div>
<div class="result-row"><span>Admittance |Y|:</span><span>${admittance.toFixed(6)} S</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
