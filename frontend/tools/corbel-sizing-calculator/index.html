<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Corbel Sizing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Corbel Sizing Calculator</h1>
<p>Estimate required corbel projection depth and shear check for a given applied load. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-load">Applied load</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">kN</div></div>
<div class="field"><label class="f" for="in-proj">Projection</label><input type="text" id="in-proj" inputmode="decimal" autocomplete="off" placeholder="e.g. 150"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-fv">Shear stress</label><input type="text" id="in-fv" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">MPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter applied load.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-load"),pEl=document.getElementById("in-proj"),fEl=document.getElementById("in-fv"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),P=pn(pEl.value),F=pn(fEl.value);
if(L==null){return}
P=P==null?150:P;F=F==null?2:F;
if(!isFinite(L)||!isFinite(P)||!isFinite(F)||L<=0||P<=0||F<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var moment=L*1000*P/1000;
var reqDepth=Math.sqrt(6*moment/(F*1000));
var shearOK=L*1000/(reqDepth*1000);
var html='<div class="big">'+rnd(reqDepth,0)+' mm</div>';
html+=row("Applied load",rnd(L,1)+" kN");
html+=row("Projection",rnd(P,0)+" mm");
html+=row("Moment",rnd(moment,1)+" kN·mm");
html+=row("Required depth",rnd(reqDepth,0)+" mm");
html+=row("Shear check",rnd(shearOK,2)+" MPa");
out.innerHTML=html;
}
[lEl,pEl,fEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
