<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck Material Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Deck Material Calculator</h1>
<p class="subtitle">Estimate deck boards, joists, posts, and hardware for your deck project.</p>
<div class="input-section">
<label>Deck Length (ft)</label>
<input type="number" id="deckLen" value="16" min="1" aria-label="Deck Len">
<label>Deck Width (ft)</label>
<input type="number" id="deckWid" value="12" min="1" aria-label="Deck Wid">
<label>Board Width (inches)</label>
<select id="boardW" aria-label="Board W">
<option value="5.5" selected>2×6 (5.5")</option>
<option value="3.5">2×4 (3.5")</option>
<option value="5.25">5/4×6 (5.25")</option>
</select>
<label>Joist Spacing (inches)</label>
<select id="joistSp" aria-label="Joist Sp">
<option value="16" selected>16" OC</option>
<option value="24">24" OC</option>
<option value="12">12" OC</option>
</select>
<label>Board Length (ft)</label>
<input type="number" id="boardLen" value="12" min="1" aria-label="Board Len">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const L=parseFloat(document.getElementById('deckLen').value)||0;
const W=parseFloat(document.getElementById('deckWid').value)||0;
const bw=parseFloat(document.getElementById('boardW').value);
const js=parseFloat(document.getElementById('joistSp').value);
const bl=parseFloat(document.getElementById('boardLen').value)||0;
const area=L*W;
const gap=0.125;
const effWidth=bw+gap;
const numBoards=Math.ceil((W*12)/effWidth);
const boardFt=numBoards*L;
const numJoists=Math.ceil((L*12)/js)+1;
const linearFt=numBoards*L;
const waste=Math.ceil(linearFt*0.1);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Deck Area:</span><span>${area} sq ft</span></div>
<div class="result-row"><span>Deck Boards (${bw}" wide):</span><span>${numBoards} boards</span></div>
<div class="result-row"><span>Board Linear Feet:</span><span>${linearFt.toFixed(0)} ft</span></div>
<div class="result-row"><span>With 10% Waste:</span><span>${(linearFt+waste).toFixed(0)} ft</span></div>
<div class="result-row"><span>Joists (${js}" OC):</span><span>${numJoists} joists</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
