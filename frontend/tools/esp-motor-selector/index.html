<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>ESP Motor Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>ESP Motor Selector</h1>
<p>Calculate ESP motor power, voltage, and amperage from pump load, depth, and fluid conditions. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Production rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-head">Total dynamic head</label><input type="text" id="in-head" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-eff">Pump efficiency</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">%</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rate"),hE=document.getElementById("in-head"),eE=document.getElementById("in-eff"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var r=parseFloat(rE.value),h=parseFloat(hE.value),e=parseFloat(eE.value);
if(isNaN(r)||isNaN(h)||isNaN(e))return;
if(r<=0||h<=0||e<=0||e>100){err.textContent="Rate and head must be positive; efficiency must be 1–100%.";return}
err.textContent="";
var hp=(r*h*0.00000737)/(e/100);
var volt=hp>100?4160:hp>50?2400:1200;
var amp=(hp*746)/(volt*Math.sqrt(3)*0.9);
var html='<div class="big">'+Math.round(hp)+' HP</div>';
html+=row("Motor power",Math.round(hp)+' HP');
html+=row("Voltage",volt+' V');
html+=row("Amperage",Math.round(amp)+' A');
out.innerHTML=html;
}
[rE,hE,eE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
