<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Standard Penetration Test Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Standard Penetration Test Calculator</h1>
<p>Calculate N-value, corrected SPT blow count, and friction angle from SPT field data. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-n1">Blows 1st 6"</label><input type="text" id="in-n1" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-n2">Blows 2nd 6"</label><input type="text" id="in-n2" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-n3">Blows 3rd 6"</label><input type="text" id="in-n3" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-eff">Effective stress</label><input type="text" id="in-eff" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">kPa</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var n1E=document.getElementById("in-n1"),n2E=document.getElementById("in-n2"),n3E=document.getElementById("in-n3"),effE=document.getElementById("in-eff"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var n1=parseFloat(n1E.value),n2=parseFloat(n2E.value),n3=parseFloat(n3E.value),eff=parseFloat(effE.value);
if(isNaN(n1)||isNaN(n2)||isNaN(n3))return;
if(n1<0||n2<0||n3<0){err.textContent="Blow counts cannot be negative.";return}
err.textContent="";
var N=n2+n3;
var CN=isNaN(eff)||eff<=0?1:Math.min(1.7,Math.sqrt(100/eff));
var N60=N*CN;
var phi=0;phi=Math.min(45,20+Math.sqrt(N60)*3.2);
var html='<div class="big">N='+N+'</div>';
html+=row("N-value (field)",N);
html+=row("Corrected N60",Math.round(N60*10)/10);
if(!isNaN(eff))html+=row("CN factor",Math.round(CN*100)/100);
html+=row("Est. friction angle",Math.round(phi*10)/10+'°');
out.innerHTML=html;
}
[n1E,n2E,n3E,effE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
