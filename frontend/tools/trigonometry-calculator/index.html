<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigonometry Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Trigonometry Calculator</h1>
<p class="subtitle">Calculate sin, cos, tan, and inverse functions in degrees or radians.</p>
<div class="input-section">
<label>Angle</label>
<input type="number" id="angle" value="45" step="any" aria-label="Angle">
<label>Unit</label>
<select id="unit" aria-label="Unit">
<option value="deg" selected>Degrees</option>
<option value="rad">Radians</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('angle').value)||0;
const unit=document.getElementById('unit').value;
const rad=unit==='deg'?v*Math.PI/180:v;
const deg=unit==='rad'?v*180/Math.PI:v;
const sin=Math.sin(rad),cos=Math.cos(rad),tan=Math.tan(rad);
const csc=sin!==0?1/sin:Infinity,sec=cos!==0?1/cos:Infinity,cot=tan!==0?1/tan:Infinity;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Angle:</span><span>${deg.toFixed(6)}° / ${rad.toFixed(6)} rad</span></div>
<div class="result-row"><span>sin:</span><span>${sin.toFixed(8)}</span></div>
<div class="result-row"><span>cos:</span><span>${cos.toFixed(8)}</span></div>
<div class="result-row"><span>tan:</span><span>${Math.abs(tan)>1e10?'∞':tan.toFixed(8)}</span></div>
<div class="result-row"><span>csc:</span><span>${Math.abs(csc)>1e10?'∞':csc.toFixed(8)}</span></div>
<div class="result-row"><span>sec:</span><span>${Math.abs(sec)>1e10?'∞':sec.toFixed(8)}</span></div>
<div class="result-row"><span>cot:</span><span>${Math.abs(cot)>1e10?'∞':cot.toFixed(8)}</span></div>
<div class="result-row"><span>asin:</span><span>${(Math.asin(sin)*180/Math.PI).toFixed(6)}°</span></div>
<div class="result-row"><span>acos:</span><span>${(Math.acos(cos)*180/Math.PI).toFixed(6)}°</span></div>
<div class="result-row"><span>atan:</span><span>${(Math.atan(tan)*180/Math.PI).toFixed(6)}°</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
