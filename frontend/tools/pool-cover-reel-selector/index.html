<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pool Cover Reel Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pool Cover Reel Selector</h1>
<p>Calculate solar cover dimensions, reel size, energy savings, and evaporation reduction from pool dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Pool length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Pool width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-season">Season length</label><input type="text" id="in-season" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">months</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),sEl=document.getElementById("in-season"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),S=pn(sEl.value);
if(L==null||W==null)return;
if(!isFinite(L)||!isFinite(W)||L<=0||W<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var season=S==null?5:S;
var coverArea=L*W;
var reelSize=L*1.1;
var evapRed=coverArea*0.7*30*season;
var heatSavings=coverArea*0.5*100*season/12;
var html='<div class="big">'+rnd(reelSize,1)+' ft reel</div>';
html+=row("Pool dimensions",rnd(L,0)+' x '+rnd(W,0)+' ft');
html+=row("Cover area",rnd(coverArea,0)+' sq ft');
html+=row("Cover thickness",rnd(coverArea/200,1)+' mil');
html+=row("Reel width needed",rnd(reelSize,1)+' ft');
html+=row("Evaporation saved",rnd(evapRed,0)+' gal/season');
html+=row("Heat savings",'$'+rnd(heatSavings,0)+'/season');
out.innerHTML=html;
}
[lEl,wEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
