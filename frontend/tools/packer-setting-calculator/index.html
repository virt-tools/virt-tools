<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Packer Setting Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Packer Setting Calculator</h1>
<p>Calculate packer setting force, differential pressure, and element compression from packer depth and weight. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Slack-off weight</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 20000"><div class="unit">lb</div></div>
<div class="field"><label class="f" for="in-d">Packer depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 6000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-p">Differential pressure</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 2500"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wE=document.getElementById("in-w"),dE=document.getElementById("in-d"),pE=document.getElementById("in-p"),out=document.getElementById("out");
function calc(){
var w=parseFloat(wE.value),d=parseFloat(dE.value),p=parseFloat(pE.value);
if(isNaN(w)||isNaN(d)||isNaN(p))return;
var hydroP=d*0.433;
var totalP=p+hydroP;
var settingForce=w*0.5;
var html='<div class="big">'+Math.round(settingForce).toLocaleString()+' lb</div>';
html+=row("Element compression force",Math.round(settingForce).toLocaleString()+' lb');
html+=row("Hydrostatic pressure",Math.round(hydroP)+' psi');
html+=row("Total pressure rating",Math.round(totalP)+' psi');
out.innerHTML=html;
}
[wE,dE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
