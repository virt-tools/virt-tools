<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/assets/theme-init.js"></script>
<title>JavaScript Minifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:var(--bg,#0d1117);color:var(--text,#c9d1d9);font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:var(--accent,#58a6ff);font-size:1.6em}
.back{color:var(--text-dim,#8b949e);text-decoration:none;font-size:.85em}
.back:hover{color:var(--accent,#58a6ff)}
textarea{background:var(--bg-elev,#161b22);color:var(--text,#c9d1d9);border:1px solid var(--border,#30363d);border-radius:6px;padding:12px;font-family:monospace;font-size:13px;width:100%;box-sizing:border-box;resize:vertical}
label{display:block;color:var(--text-dim,#8b949e);font-size:.85em;margin:12px 0 4px}
.stats{color:var(--text-dim,#8b949e);font-size:.8em;margin:6px 0}
.stats .s{color:var(--accent,#58a6ff);font-weight:600}
button{background:var(--bg-elev-2,#21262d);color:var(--text,#c9d1d9);border:1px solid var(--border,#30363d);border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:var(--accent,#58a6ff)}
button.primary{background:var(--card,#1e3a5f);border-color:var(--accent,#58a6ff)}
.opts{display:flex;gap:16px;align-items:center;margin:8px 0;color:var(--text-dim,#8b949e);font-size:.85em}
.opts label{display:flex;align-items:center;gap:4px;margin:0}
.err{color:var(--bad,#f85149);font-size:.85em;margin:4px 0;font-family:monospace}
.hint{color:var(--text-dim,#8b949e);font-size:.75em;margin:6px 0 0}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>JavaScript Minifier</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:var(--text-dim,#8b949e);font-size:.9em">Minify JavaScript by removing comments, whitespace, and line breaks. 100% client-side.</p>
<label for="input">Input JavaScript</label>
<textarea id="input" rows="10" placeholder="Paste your JS here..." aria-label="JavaScript input">// Example:
function greet(name) {
  // say hello
  console.log("Hello, " + name + "!");
}

greet("World");</textarea>
<div class="opts">
<label><input type="checkbox" id="rmComments" checked> Remove comments</label>
<label><input type="checkbox" id="rmWhitespace" checked> Remove whitespace</label>
<label><input type="checkbox" id="rmNewlines" checked> Remove newlines</label>
</div>
<button class="primary" onclick="minify()" type="button">Minify</button>
<button onclick="copy()" type="button">Copy result</button>
<div id="err" class="err" role="alert"></div>
<div class="stats" id="stats" role="status" aria-live="polite"></div>
<label for="output">Minified output</label>
<textarea id="output" rows="6" readonly aria-label="Minified output"></textarea>
<p class="hint">Removing line breaks joins statements onto one line; code that relies on automatic semicolon insertion may need explicit semicolons.</p>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function minify(){
  const input=document.getElementById('input').value;
  const rmC=document.getElementById('rmComments').checked;
  const rmW=document.getElementById('rmWhitespace').checked;
  const rmN=document.getElementById('rmNewlines').checked;
  const err=document.getElementById('err');
  err.textContent='';
  const origLen=input.length;
  let out='';
  try{
    const code=input,n=code.length;
    const lastCh=function(){for(let j=out.length-1;j>=0;j--){if(!/\s/.test(out[j]))return out[j];}return '';};
    const REGEX_KEYWORD=/(?:return|typeof|instanceof|in|of|new|delete|void|case|do|else|yield|await)$/;
    let i=0;
    while(i<n){
      const ch=code[i],next=code[i+1];
      if(ch==='"'||ch==="'"||ch==='`'){ // string / template literal: copy verbatim
        const quote=ch;out+=ch;i++;
        let depth=0; // ${...} nesting inside templates
        while(i<n){
          let c=code[i];
          if(c==='\\'){out+=c+(code[i+1]||'');i+=2;continue;}
          if(quote==='`'&&c==='$'&&code[i+1]==='{'){out+='${';i+=2;depth++;continue;}
          if(quote==='`'&&c==='}'&&depth>0){out+=c;i++;depth--;continue;}
          out+=c;i++;
          if(depth===0&&c===quote){break;}
        }
        continue;
      }
      if(ch==='/'&&next==='/'){ // line comment
        const nl=code.indexOf('\n',i+2);
        if(rmC){i=nl<0?n:nl;continue;}
        if(nl<0){out+=code.slice(i);i=n;}
        else if(rmN){out+=code.slice(i,nl)+'\n';i=nl+1;} // keep the newline: without it the comment would swallow the next line
        else{out+=code.slice(i,nl);i=nl;}
        continue;
      }
      if(ch==='/'&&next==='*'){ // block comment
        const close=code.indexOf('*/',i+2),end=close<0?n:close+2;
        out+=rmC?' ':code.slice(i,end);i=end;continue;
      }
      if(ch==='/'){ // regex literal or division
        const last=lastCh(),tail=(out.match(/[A-Za-z0-9_$]*$/)||[''])[0];
        const isRegex=last===''||'([{,;=:!&|?+-*%~^<>'.indexOf(last)>=0||REGEX_KEYWORD.test(tail);
        if(isRegex){ // copy the regex verbatim, escapes and char classes intact
          out+=ch;i++;
          let inCls=false;
          while(i<n){
            const c=code[i];
            if(c==='\\'){out+=c+(code[i+1]||'');i+=2;continue;}
            if(c==='[')inCls=true;else if(c===']')inCls=false;
            out+=c;i++;
            if(c==='/'&&!inCls){break;}
          }
          while(i<n&&/[dgimsuy]/.test(code[i])){out+=code[i];i++;}
          continue;
        }
        out+=ch;i++;continue;
      }
      if(/\s/.test(ch)){
        let j=i;while(j<n&&/\s/.test(code[j]))j++;
        if(!rmW&&!rmN){out+=code.slice(i,j);}
        else if(!rmN&&/[\n\r]/.test(code.slice(i,j))){out+='\n';}
        else{ // collapse; keep one space only between word-ish tokens
          const last=lastCh(),nxt=code[j]||'';
          out+=(/[A-Za-z0-9_$]/.test(last)&&/[A-Za-z0-9_$]/.test(nxt))?' ':'';
        }
        i=j;continue;
      }
      out+=ch;i++;
    }
    out=out.trim();
    const saved=origLen-out.length;
    const pct=origLen>0?((saved/origLen)*100).toFixed(1):0;
    document.getElementById('stats').innerHTML='Original: <span class="s">'+origLen+'</span> bytes → Minified: <span class="s">'+out.length+'</span> bytes (saved <span class="s">'+pct+'%</span>)';
    document.getElementById('output').value=out;
  }catch(e){err.textContent='Error: '+e.message;}
}
function copy(){
  const out=document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value);
}
minify();
</script>
</body>
</html>
