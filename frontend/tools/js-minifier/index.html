<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Minifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
textarea{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:12px;font-family:monospace;font-size:13px;width:100%;box-sizing:border-box;resize:vertical}
label{display:block;color:#8b949e;font-size:.85em;margin:12px 0 4px}
.stats{color:#8b949e;font-size:.8em;margin:6px 0}
.stats .s{color:#58a6ff;font-weight:600}
button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:.85em;margin-top:8px;margin-right:6px}
button:hover{border-color:#58a6ff}
button.primary{background:#1e3a5f;border-color:#58a6ff}
.opts{display:flex;gap:16px;align-items:center;margin:8px 0;color:#8b949e;font-size:.85em}
.opts label{display:flex;align-items:center;gap:4px;margin:0}
.err{color:#f85149;font-size:.85em;margin:4px 0;font-family:monospace}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>JavaScript Minifier</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Minify JavaScript by removing comments, whitespace, and line breaks. 100% client-side.</p>
<label>Input JavaScript</label>
<textarea id="input" rows="10" placeholder="Paste your JS here..." aria-label="Paste Your Js Here...">// Example:
function greet(name) {
  // say hello
  console.log("Hello, " + name + "!");
}

greet("World");</textarea>
<div class="opts">
<label><input type="checkbox" id="rmComments" checked> Remove comments</label>
<label><input type="checkbox" id="rmWhitespace" checked> Remove whitespace</label>
<label><input type="checkbox" id="rmNewlines" checked> Remove newlines</label>
</div>
<button class="primary" onclick="minify()" type="button">Minify</button>
<button onclick="copy()" type="button">Copy result</button>
<div id="err" class="err"></div>
<div class="stats" id="stats"></div>
<label>Minified output</label>
<textarea id="output" rows="6" readonly aria-label="Output"></textarea>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
function minify(){
  const input=document.getElementById('input').value;
  const rmC=document.getElementById('rmComments').checked;
  const rmW=document.getElementById('rmWhitespace').checked;
  const rmN=document.getElementById('rmNewlines').checked;
  const err=document.getElementById('err');
  err.textContent='';
  let out=input;
  const origLen=input.length;
  try{
    if(rmC){
      out=out.replace(/\/\*[\s\S]*?\*\//g,'');
      out=out.replace(/(^|[^:])\/\/.*$/gm,'$1');
    }
    if(rmW){
      out=out.replace(/\s+/g,' ');
      out=out.replace(/\s*([=+\-*/%&|^!<>?:;,(){}\[\]])\s*/g,'$1');
      out=out.replace(/\s+/g,' ');
    }
    if(rmN){
      out=out.replace(/\n/g,'');
    }
    out=out.trim();
    const saved=origLen-out.length;
    const pct=origLen>0?((saved/origLen)*100).toFixed(1):0;
    document.getElementById('stats').innerHTML='Original: <span class="s">'+origLen+'</span> bytes → Minified: <span class="s">'+out.length+'</span> bytes (saved <span class="s">'+pct+'%</span>)';
    document.getElementById('output').value=out;
  }catch(e){err.textContent='Error: '+e.message;}
}
function copy(){
  const out=document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value);
}
minify();
</script>
</body>
</html>
