<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Breaker Coordination Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Breaker Coordination Calculator</h1>
<p>Calculate coordination time interval (CTI), upstream breaker time delay, and selective coordination margin. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-down">Downstream trip time</label><input type="text" id="in-down" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">s</div></div>
<div class="field"><label class="f" for="in-cti">CTI margin</label><input type="text" id="in-cti" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">s</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-down"),cE=document.getElementById("in-cti"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),c=parseFloat(cE.value);
if(isNaN(d)||isNaN(c)){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter downstream trip time and CTI margin.</span>';return}
if(d<=0||c<0){out.innerHTML='<span style="color:var(--bad,#f87171)">Enter a positive downstream trip time and a non-negative CTI margin.</span>';return}
var upTime=d+c;
var margin=(c/d*100);
var html='<div class="big">'+(Math.round(upTime*100)/100)+' s</div>';
html+=row("Upstream breaker delay",Math.round(upTime*100)/100+' s');
html+=row("Coordination interval",c+' s');
html+=row("Margin over downstream",Math.round(margin)+'%');
out.innerHTML=html;
}
[dE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
