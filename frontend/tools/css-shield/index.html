<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Shield Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🛡️ CSS Shield Generator</h1>
<p>Create CSS heraldic shield with 4 shapes, customizable field/border/charge colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Shape</label><select id="shape"><option value="classic">Classic</option><option value="heater">Heater</option><option value="round">Round</option><option value="kite">Kite</option></select></div>
<div class="ctrl-row"><label>Field Color</label><input type="color" id="field" value="#1a4d8f" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Border Color</label><input type="color" id="border" value="#ffd700" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Charge</label><select id="charge"><option value="cross">Cross</option><option value="star">Star</option><option value="eagle">Eagle</option><option value="none">None</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="120" max="280" step="5" value="180" style="width:200px"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var shape=document.getElementById('shape').value;
var field=document.getElementById('field').value;
var border=document.getElementById('border').value;
var charge=document.getElementById('charge').value;
var sz=parseInt(document.getElementById('sz').value);
var clips={classic:'polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)',heater:'polygon(0 0,100% 0,100% 50%,75% 100%,25% 100%,0 50%)',round:'ellipse(50% 50% at 50% 50%)',kite:'polygon(0 0,100% 0,100% 65%,50% 100%,0 65%)'};
var chargeHTML={cross:'<div class="charge-cross"></div>',star:'<div class="charge-star">★</div>',eagle:'<div class="charge-eagle">🦅</div>',none:''};
var html='<div class="shield">\n  <div class="shield-charge">'+chargeHTML[charge]+'</div>\n</div>';
var css='.shield{width:'+sz+'px;height:'+(sz*1.2)+'px;background:'+field+';clip-path:'+clips[shape]+';position:relative;display:flex;align-items:center;justify-content:center;border:3px solid '+border+';box-shadow:0 4px 15px rgba(0,0,0,0.4)}\n';
css+='.shield-charge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}\n';
css+='.charge-cross{width:'+(sz*0.12)+'px;height:'+(sz*0.4)+'px;background:'+border+';position:relative}\n';
css+='.charge-cross::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(sz*0.4)+'px;height:'+(sz*0.12)+'px;background:'+border+'}\n';
css+='.charge-star{font-size:'+(sz*0.35)+'px;color:'+border+';line-height:1}\n';
css+='.charge-eagle{font-size:'+(sz*0.35)+'px}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['shape','field','border','charge','sz'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
