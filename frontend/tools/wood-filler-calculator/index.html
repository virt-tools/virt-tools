<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wood Filler Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wood Filler Calculator</h1>
<p>Estimate wood filler needed from defect volume, number of repairs, and shrinkage factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-v">Defect volume</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">cubic in</div></div>
<div class="field"><label class="f" for="in-n">Number of repairs</label><input type="text" id="in-n" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">repairs</div></div>
<div class="field"><label class="f" for="in-s">Shrinkage factor</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.3"><div class="unit">multiplier</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vEl=document.getElementById("in-v"),nEl=document.getElementById("in-n"),sEl=document.getElementById("in-s"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var V=pn(vEl.value),N=pn(nEl.value),S=pn(sEl.value);
var idle='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';
if(V==null||N==null||S==null){err.textContent="";out.innerHTML=idle;return}
if(!isFinite(V)||!isFinite(N)||!isFinite(S)||V<=0||N<=0||S<=0){err.textContent="Enter valid values.";out.innerHTML=idle;return}
err.textContent="";
var total=V*N*S;
var tubes=Math.ceil(total/4);
var html='<div class="big">'+rnd(tubes,0)+' tubes</div>';
html+=row("Defect volume",rnd(V,2)+' cu in');
html+=row("Repairs",rnd(N,0));
html+=row("Shrinkage factor",rnd(S,2)+'×');
html+=row("Total volume",rnd(total,2)+' cu in');
html+=row("Tubes needed (4 cu in)",rnd(tubes,0)+' tubes');
out.innerHTML=html;
}
[vEl,nEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
