<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Busbar Sizing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Busbar Sizing Calculator</h1>
<p>Calculate required copper busbar cross-section for a given current density and load current. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-i">Load current</label><input type="text" id="in-i" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-j">Current density</label><input type="text" id="in-j" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">A/mm²</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var iE=document.getElementById("in-i"),jE=document.getElementById("in-j"),out=document.getElementById("out");
function calc(){
var i=parseFloat(iE.value),j=parseFloat(jE.value);
if(isNaN(i)||isNaN(j)){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter load current and current density.</span>';return}
if(i<=0||j<=0){out.innerHTML='<span style="color:var(--bad,#f87171)">Enter a positive load current and current density.</span>';return}
var area=i/j;
var html='<div class="big">'+(Math.round(area*10)/10)+' mm²</div>';
html+=row("Required cross-section",Math.round(area*10)/10+' mm²');
html+=row("Load current",i+' A');
html+=row("Current density",j+' A/mm²');
out.innerHTML=html;
}
[iE,jE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
