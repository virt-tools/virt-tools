<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to YAML Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV to YAML Converter</h1>
<p class="subtitle">Convert CSV data to YAML format with header detection and nested key support.</p>
<div class="input-section">
<label>CSV Input</label>
<textarea id="input" rows="10" placeholder="name,age,city&#10;Alice,30,NYC&#10;Bob,25,LA" aria-label="Name,Age,City&#10;Alice,30,Nyc&#10;Bob,25,La"></textarea>
<button id="convert" class="primary-btn" type="button">Convert</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function parseCSV(text){const lines=text.trim().split('\n');if(lines.length<2)return[];
const headers=lines[0].split(',').map(h=>h.trim());const rows=[];
for(let i=1;i<lines.length;i++){const vals=lines[i].split(',');const obj={};
headers.forEach((h,j)=>{let v=vals[j]?vals[j].trim():'';if(v && !isNaN(v))v=Number(v);obj[h]=v;});rows.push(obj);}
return rows;}
function toYAML(arr,indent=0){let out='';const pad=' '.repeat(indent);
arr.forEach((item,idx)=>{out+=pad+'- ';
const keys=Object.keys(item);keys.forEach((k,i)=>{const v=item[k];
if(i>0)out+=pad+'  ';if(typeof v==='string'&&v.includes(':'))out+=k+': "'+v+'"\n';else out+=k+': '+v+'\n';if(i<keys.length-1);});});
return out;}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('convert').addEventListener('click',()=>{
try{const data=parseCSV(document.getElementById('input').value);
if(data.length===0){document.getElementById('result').innerHTML='<p style="color:red">No data rows found</p>';document.getElementById('result').style.display='block';return;}
const yaml=toYAML(data);document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em;max-height:400px;overflow:auto">'+yaml.replace(/</g,'&lt;')+'</pre>';document.getElementById('result').style.display='block';window._result=yaml;
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Error: '+e.message+'</p>';document.getElementById('result').style.display='block';}
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
