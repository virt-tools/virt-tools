<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Lug Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Lug Selector</h1>
<p>Select cable lug type and size based on wire AWG/kcmil, stud size, and environment. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-awg">Wire size</label><input type="text" id="in-awg" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">AWG or kcmil</div></div>
<div class="field"><label class="f" for="in-stud">Stud size</label><input type="text" id="in-stud" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-env">Environment</label><input type="text" id="in-env" autocomplete="off" placeholder="dry or wet"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-awg"),sEl=document.getElementById("in-stud"),eEl=document.getElementById("in-env"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Aw=pn(aEl.value),St=pn(sEl.value),Ev=String(eEl.value).trim().toLowerCase();
if(Aw==null||St==null)return;
if(!isFinite(Aw)||Aw<=0||!isFinite(St)||St<=0){err.textContent="Enter valid positive values.";return}
if(Ev&&Ev!=="dry"&&Ev!=="wet"){err.textContent="Enter 'dry' or 'wet'.";return}
if(!Ev)return;
err.textContent="";
var type;
if(Aw<=10)type="Copper ring tongue lug";
else if(Aw<=2)type="Copper compression lug (one-hole)";
else if(Aw<=211.6)type="Copper compression lug (two-hole)";
else type="Long-barrel compression lug (two-hole)";
var seal=Ev==="wet"?"Sealed (adhesive-lined heat-shrink required)":"Standard";
var html='<div class="big">'+type+'</div>';
html+=row("Lug type",type);
html+=row("Stud size",St+'"');
html+=row("Sealing",seal);
html+=row("Wire size",Aw+(Aw<=30?' AWG':' kcmil'));
out.innerHTML=html;
}
[aEl,sEl,eEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
