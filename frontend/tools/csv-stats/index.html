<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Statistics — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Statistics</h1>
<p class="subtitle">Get descriptive statistics for numeric columns in CSV data — count, sum, mean, median, min, max, stdev.</p>
<div class="input-section">
<label>Paste CSV (with headers)</label>
<textarea id="input" rows="8" placeholder="name,score,age&#10;Alice,85,30&#10;Bob,92,25" aria-label="Name,Score,Age&#10;Alice,85,30&#10;Bob,92,25"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Analyze</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function stats(vals){
const n=vals.length;if(!n)return null;
const sum=vals.reduce((a,b)=>a+b,0);
const mean=sum/n;
const sorted=[...vals].sort((a,b)=>a-b);
const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
const min=sorted[0],max=sorted[n-1];
const variance=vals.reduce((a,b)=>a+(b-mean)**2,0)/n;
const stdev=Math.sqrt(variance);
return {count:n,sum:sum.toFixed(2),mean:mean.toFixed(2),median:median.toFixed(2),min:min,max:max,stdev:stdev.toFixed(2)};
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;if(!text.trim()){return;}
const rows=parseCSV(text);if(rows.length<2){return;}
const header=rows[0];
const data=rows.slice(1);
const numericCols=[];
header.forEach((h,i)=>{
const vals=data.map(r=>parseFloat(r[i])).filter(v=>!isNaN(v)&&isFinite(v));
if(vals.length>=2)numericCols.push({name:h,idx:i,vals});
});
const r=document.getElementById('result');
if(!numericCols.length){r.innerHTML='<p>No numeric columns found.</p>';return;}
let html='<table style="width:100%;border-collapse:collapse;"><thead><tr><th style="text-align:left;padding:4px 8px;">Column</th><th>Count</th><th>Sum</th><th>Mean</th><th>Median</th><th>Min</th><th>Max</th><th>StDev</th></tr></thead><tbody>';
numericCols.forEach(c=>{
const s=stats(c.vals);
html+='<tr style="border-top:1px solid #eee;"><td style="padding:4px 8px;font-weight:bold;">'+c.name+'</td><td style="text-align:center;">'+s.count+'</td><td style="text-align:center;">'+s.sum+'</td><td style="text-align:center;">'+s.mean+'</td><td style="text-align:center;">'+s.median+'</td><td style="text-align:center;">'+s.min+'</td><td style="text-align:center;">'+s.max+'</td><td style="text-align:center;">'+s.stdev+'</td></tr>';
});
html+='</tbody></table>';
r.innerHTML=html;
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
