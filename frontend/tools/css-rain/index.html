<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Rain Animation Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:0;background:#0a0a12;border-radius:12px;overflow:hidden;height:300px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌧️ CSS Rain Animation Generator</h1>
<p>Create CSS rain/rainfall animation effects. 4 presets, adjustable density/speed/color. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="rain" selected>Rain</option><option value="storm">Storm</option><option value="snow">Snow</option><option value="code">Code Rain</option></select></div>
<div class="ctrl-row"><label>Drops</label><input type="number" id="drops" value="40" min="10" max="100" style="width:80px"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Drop Color</label><input type="color" id="color" value="#88ccff" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#0a0a1a" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Drop Height (px)</label><input type="number" id="dropHeight" value="20" min="5" max="80" style="width:80px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var drops=parseInt(document.getElementById('drops').value);
var speed=document.getElementById('speed').value;
var color=document.getElementById('color').value;
var bgColor=document.getElementById('bgColor').value;
var dh=parseInt(document.getElementById('dropHeight').value);
var dur=speed==='slow'?'2s':speed==='fast'?'0.5s':'1s';
var dropCSS,sizeCSS,animName;
if(preset==='snow'){sizeCSS='width:4px;height:4px;border-radius:50%';animName='snowfall';dur=speed==='slow'?'6s':speed==='fast'?'2s':'4s'}
else if(preset==='code'){sizeCSS='width:12px;height:'+(dh*2)+'px;font-family:monospace;font-size:10px';animName='codefall';color='#00ff00'}
else if(preset==='storm'){sizeCSS='width:2px;height:'+(dh*1.5)+'px';animName='rainfall';dur=speed==='slow'?'1s':speed==='fast'?'0.3s':'0.6s'}
else{sizeCSS='width:1.5px;height:'+dh+'px';animName='rainfall'}
var html='<div class="rain-container">\n';
var css='.rain-container{width:100%;height:300px;background:'+bgColor+';position:relative;overflow:hidden}\n.rain-drop{position:absolute;top:-'+(dh+10)+'px;background:'+color+';'+sizeCSS+';animation:'+animName+' '+dur+' linear infinite}\n';
for(var i=0;i<drops;i++){
var left=Math.floor(Math.random()*100);
var delay=(Math.random()*2).toFixed(2)+'s';
var chars='';
if(preset==='code'){var codeChars='01';chars=codeChars.charAt(Math.floor(Math.random()*2))}
html+='<div class="rain-drop" style="left:'+left+'%;animation-delay:'+delay+'">'+chars+'</div>\n';
css+='.rain-drop:nth-child('+(i+1)+'){left:'+left+'%;animation-delay:'+delay+';animation-duration:'+(parseFloat(dur)+Math.random()*0.3).toFixed(2)+'s}\n';
}
html+='</div>';
if(preset==='snow'){css+='@keyframes '+animName+'{to{transform:translateY(330px) rotate(360deg);opacity:0.3}}'}
else{css+='@keyframes '+animName+'{to{transform:translateY(330px);opacity:0.5}}'}
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','drops','speed','color','bgColor','dropHeight'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
