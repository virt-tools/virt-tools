<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Caulk Tube Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Caulk Tube Calculator</h1>
<p>Calculate caulk tube count and linear feet covered from joint length, bead width, and tube size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Joint length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Bead width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.25"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-t">Tube size</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">oz</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),tEl=document.getElementById("in-t"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),T=pn(tEl.value);
if(L==null||W==null||T==null)return;
if(!isFinite(L)||!isFinite(W)||!isFinite(T)||L<=0||W<=0||T<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var lfPerOz=29.5/(W*0.5);
var lfPerTube=lfPerOz*T;
var tubes=Math.ceil(L*12/(lfPerTube*12));
var html='<div class="big">'+rnd(tubes,0)+' tubes</div>';
html+=row("Joint length",rnd(L,0)+' ft');
html+=row("Bead width",rnd(W,3)+' in');
html+=row("Tube size",rnd(T,0)+' oz');
html+=row("LF per tube",rnd(lfPerTube,0)+' ft');
html+=row("Tubes needed",rnd(tubes,0)+' tubes');
out.innerHTML=html;
}
[lEl,wEl,tEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
