<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>CT Saturation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>CT Saturation Calculator</h1>
<p>Calculate CT saturation point, accuracy limiting factor, and knee-point voltage from CT parameters. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rct">CT secondary resistance</label><input type="text" id="in-rct" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-rb">Burden</label><input type="text" id="in-rb" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-alf">ALF</label><input type="text" id="in-alf" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">×</div></div>
<div class="field"><label class="f" for="in-in">Rated secondary</label><input type="text" id="in-in" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">A</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rct"),bE=document.getElementById("in-rb"),aE=document.getElementById("in-alf"),nE=document.getElementById("in-in"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var r=parseFloat(rE.value),b=parseFloat(bE.value),a=parseFloat(aE.value),n=parseFloat(nE.value);
if(isNaN(r)||isNaN(b)||isNaN(a)||isNaN(n))return;
if(r<0||b<0||a<=0||n<=0){err.textContent="Resistances must be non-negative; ALF and current must be positive.";return}
err.textContent="";
var vk=a*n*(r+b);
var html='<div class="big">'+(Math.round(vk*10)/10)+' V</div>';
html+=row("Knee-point voltage (Ek)",Math.round(vk*10)/10+' V');
html+=row("Accuracy limiting factor",a+'×');
html+=row("Total burden",(r+b)+' Ω');
out.innerHTML=html;
}
[rE,bE,aE,nE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
