<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Subsea Pipeline Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Subsea Pipeline Calculator</h1>
<p>Calculate subsea pipeline wall thickness, pressure drop, and flow capacity from diameter, length, and operating pressure. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-len">Length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 50000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-press">Operating pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),lE=document.getElementById("in-len"),pE=document.getElementById("in-press"),out=document.getElementById("out");
function calc(){
var d=parseFloat(dE.value),l=parseFloat(lE.value),p=parseFloat(pE.value);
if(isNaN(d)||isNaN(l)||isNaN(p))return;
var wt=(p*d)/(2*52000*0.72);
var flow=Math.PI*Math.pow(d/24,2)*5*86400/5.615;
var drop=0.0001*l*p/(d*100);
var html='<div class="big">'+(Math.round(wt*100)/100)+' in</div>';
html+=row("Wall thickness",Math.round(wt*100)/100+' in');
html+=row("Flow capacity",Math.round(flow)+' bbl/day');
html+=row("Pressure drop",Math.round(drop)+' psi');
out.innerHTML=html;
}
[dE,lE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
