<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Electric current Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Electric current Unit Converter</h1><p class="subtitle">Convert between all supported electric current units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Electric current","units":[{"slug":"nanoamperes","name":"Nanoamperes","symbol":"nA","scale":1e-09,"offset":0},{"slug":"microamperes","name":"Microamperes","symbol":"µA","scale":1e-06,"offset":0},{"slug":"milliamperes","name":"Milliamperes","symbol":"mA","scale":0.001,"offset":0},{"slug":"amperes","name":"Amperes","symbol":"A","scale":1,"offset":0},{"slug":"kiloamperes","name":"Kiloamperes","symbol":"kA","scale":1000.0,"offset":0},{"slug":"megaamperes","name":"Megaamperes","symbol":"MA","scale":1000000.0,"offset":0},{"slug":"abamperes","name":"Abamperes","symbol":"abA","scale":10,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
