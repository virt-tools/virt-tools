<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Join — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Join</h1>
<p class="subtitle">Join two CSV tables on a common column — inner, left, right, or full outer join. 100% client-side.</p>
<div class="input-section">
<label>CSV 1 (left)</label>
<textarea id="input1" rows="6" placeholder="id,name&#10;1,Alice&#10;2,Bob" aria-label="Id,Name&#10;1,Alice&#10;2,Bob"></textarea>
<label>CSV 2 (right)</label>
<textarea id="input2" rows="6" placeholder="id,city&#10;1,NYC&#10;3,LA" aria-label="Id,City&#10;1,Nyc&#10;3,La"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<label>Join col (CSV1):</label><select id="col1" aria-label="Col1"></select>
<label>Join col (CSV2):</label><select id="col2" aria-label="Col2"></select>
<select id="joinType" aria-label="Join Type"><option value="inner">Inner</option><option value="left">Left</option><option value="right">Right</option><option value="full">Full Outer</option></select>
<button id="run" class="primary-btn" type="button">Join</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v==null)return '';
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
function updateCols(text,sel){
const rows=parseCSV(text);
if(rows.length){sel.innerHTML=rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join('');}
}
const i1=document.getElementById('input1'),i2=document.getElementById('input2');
const c1=document.getElementById('col1'),c2=document.getElementById('col2');
i1.addEventListener('input',()=>updateCols(i1.value,c1));
i2.addEventListener('input',()=>updateCols(i2.value,c2));
document.getElementById('run').addEventListener('click',()=>{
const t1=i1.value,t2=i2.value;if(!t1.trim()||!t2.trim()){return;}
const r1=parseCSV(t1),r2=parseCSV(t2);
if(r1.length<2||r2.length<2){return;}
const h1=r1[0],h2=r2[0];
const j1=parseInt(c1.value),j2=parseInt(c2.value);
const type=document.getElementById('joinType').value;
const map2={};
for(let i=1;i<r2.length;i++){const k=r2[i][j2];if(!map2[k])map2[k]=[];map2[k].push(r2[i]);}
const matched2=new Set();
const out=[h1.concat(h2.filter((_,i)=>i!==j2))];
for(let i=1;i<r1.length;i++){
const k=r1[i][j1];
if(map2[k]){
matched2.add(k);
map2[k].forEach(r2row=>{out.push(r1[i].concat(r2row.filter((_,i)=>i!==j2)));});
}else if(type==='left'||type==='full'){
out.push(r1[i].concat(h2.filter((_,i)=>i!==j2).map(()=>'')));
}
}
if(type==='right'||type==='full'){
for(let i=1;i<r2.length;i++){
const k=r2[i][j2];
if(!matched2.has(k)){
out.push(h1.map(()=>'').concat(r2[i].filter((_,i)=>i!==j2)));
}
}
}
const ta=document.createElement('textarea');ta.value=toCSV(out);ta.rows=10;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>'+(out.length-1)+' rows.</p>';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
