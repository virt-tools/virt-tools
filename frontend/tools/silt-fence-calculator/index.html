<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Silt Fence Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Silt Fence Calculator</h1>
<p>Calculate silt fence length and fabric needed from perimeter, fence height, and waste factor. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-per">Perimeter</label><input type="text" id="in-per" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-h">Fence height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.6"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="10"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter perimeter.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var perEl=document.getElementById("in-per"),hEl=document.getElementById("in-h"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var P=pn(perEl.value),H=pn(hEl.value),WS=pn(wsEl.value);
if(P==null){return}
H=H==null?0.6:H;WS=WS==null?10:WS;
if(!isFinite(P)||!isFinite(H)||!isFinite(WS)||P<=0||H<=0||WS<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var fabric=P*H*(1+WS/100);
var total=P*(1+WS/100);
var html='<div class="big">'+rnd(total,1)+' m</div>';
html+=row("Perimeter",rnd(P,1)+" m");
html+=row("Fence height",rnd(H,2)+" m");
html+=row("Fence length (+"+rnd(WS,0)+"% waste)",rnd(total,1)+" m");
html+=row("Fabric area",rnd(fabric,1)+" m²");
out.innerHTML=html;
}
[perEl,hEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
