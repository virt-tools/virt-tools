<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Video Transition Timeline Planner — Virtual Tools</title>
<meta name="description" content="Calculate a video sequence's runtime and clip edit points from clip durations and transition overlaps, using exact whole-frame arithmetic.">
<link rel="stylesheet" href="/assets/style.css">
<style>
[hidden]{display:none !important}
.tool{max-width:820px;margin:auto}.panel{padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--bg-panel)}
.fps-field{max-width:220px;margin-bottom:14px}.field{min-width:0}.field label,.label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}.field input,.field textarea{box-sizing:border-box;width:100%;min-width:0;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:16px ui-monospace,monospace;padding:10px}.field input{min-height:44px}.field textarea{min-height:142px;resize:vertical;line-height:1.55}.field input:focus,.field textarea:focus{outline:3px solid color-mix(in srgb,var(--accent,#6ea8fe) 30%,transparent);border-color:var(--accent,#6ea8fe)}.field [aria-invalid="true"]{border-color:var(--bad,#f87171);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad,#f87171) 20%,transparent)}
.input-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hint{font-size:12px;line-height:1.5;color:var(--text-dim,#9aa3b2);margin:6px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 2px}.actions button{font:inherit;font-weight:650;padding:10px 20px;border-radius:8px;border:1px solid var(--accent,#6ea8fe);background:var(--accent,#6ea8fe);color:#0b1017;cursor:pointer;min-height:44px}.actions button.secondary{background:transparent;color:var(--text,#e6e6e6);border-color:var(--border,#2a2f3a)}.actions button:disabled{opacity:.5;cursor:not-allowed}.actions button:focus-visible{outline:3px solid var(--accent,#6ea8fe);outline-offset:2px}.err{color:var(--bad,#f87171);font-size:13px;line-height:1.5;margin:10px 0 0;min-height:1.4em}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:16px 0 12px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.metric{min-width:0;text-align:center;padding:10px 6px;border:1px solid var(--border,#2a2f3a);border-radius:8px}.metric strong{display:block;color:var(--accent,#6ea8fe);font:750 1.25rem ui-monospace,monospace;overflow-wrap:anywhere}.metric span{display:block;margin-top:4px;color:var(--text-dim,#9aa3b2);font-size:11px}.clip{padding:10px 0;border-top:1px solid var(--border,#2a2f3a)}.clip-main{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.clip-name{font-weight:700;min-width:0;overflow-wrap:anywhere}.clip-range{font:700 13px ui-monospace,monospace;white-space:nowrap}.clip-detail{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:4px;line-height:1.5}.placeholder{color:var(--text-dim,#9aa3b2);font-size:14px;line-height:1.5}.summary{box-sizing:border-box;width:100%;resize:vertical;min-height:170px;padding:10px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:12px/1.5 ui-monospace,monospace;margin:0}.copy-status{min-height:1.2em;font-size:13px;color:var(--text-dim,#9aa3b2)}
@media(max-width:600px){.input-grid{grid-template-columns:1fr}.panel{padding:14px}.fps-field{max-width:none}}@media(max-width:420px){.metrics{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;align-items:baseline;text-align:left;gap:8px}.metric span{margin:0;text-align:right}.clip-main{display:block}.clip-range{display:block;margin-top:4px;white-space:normal;overflow-wrap:anywhere}.actions button{flex:1 1 auto}.copy-status{flex-basis:100%}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header"><a class="back" href="/">← All tools</a><h1>Video Transition Timeline Planner</h1><p>Turn clip lengths and crossfade overlaps into a frame-aligned runtime and edit-point list.</p></div>
<div class="tool panel">
<form id="timeline-form" novalidate>
<div class="field fps-field"><label for="fps">Frame rate</label><input id="fps" type="text" inputmode="decimal" autocomplete="off" value="30" required><p class="hint">Frames per second; 1–240</p></div>
<div class="input-grid">
<div class="field"><label for="clips">Clip durations</label><textarea id="clips" spellcheck="false" required>5 | Opening
8 | Interview
6 | Closing</textarea><p class="hint">One per line: seconds or mm:ss, then <strong>| label</strong> if wanted.</p></div>
<div class="field"><label for="transitions">Transition overlaps</label><textarea id="transitions" spellcheck="false">1
0.5</textarea><p class="hint">One per gap between clips. Use 0 for a straight cut.</p></div>
</div>
<p class="err" id="err" role="alert" aria-live="polite"></p>
<div class="actions"><button type="submit">Build timeline</button><button class="secondary" id="restore" type="button">Restore example</button></div>
</form>
<section class="out" id="out" aria-live="polite" aria-label="Transition timeline"></section>
<div class="field"><label for="summary">Copyable edit plan</label><textarea class="summary" id="summary" readonly spellcheck="false"></textarea></div>
<div class="actions"><button class="secondary" id="copy" type="button" disabled>Copy plan</button><span class="copy-status" id="copy-status" role="status" aria-live="polite"></span></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
/* video-transition-timeline-core:start */
var VideoTransitionTimelineCore = (function(){
  "use strict";
  var SCALE = 1000;
  var MAX_DURATION = 86400;
  var MAX_CLIPS = 100;

  function fail(message){ throw new Error(message); }
  function limit(value){ return Number(value).toLocaleString("en-US", {maximumFractionDigits:3}); }
  function decimal(value, label, minimum, maximum, unit){
    var raw = String(value == null ? "" : value).trim();
    var range = limit(minimum) + " and " + limit(maximum) + " " + unit;
    if (!raw) fail(label + " is required.");
    if (!/^(?:\d+(?:\.\d{1,3})?|\.\d{1,3})$/.test(raw)) fail(label + " must be a number between " + range + ".");
    var parsed = Number(raw);
    if (!isFinite(parsed) || parsed < minimum || parsed > maximum) fail(label + " must be between " + range + ".");
    return {value:parsed, scaled:Math.round(parsed * SCALE)};
  }
  function duration(value, label, allowZero){
    var raw = String(value == null ? "" : value).trim();
    if (!raw) fail(label + " is required.");
    var milliseconds;
    var match;
    if ((match = /^(\d+):([0-5]\d(?:\.\d{1,3})?)$/.exec(raw))){
      milliseconds = (Number(match[1]) * 60 + Number(match[2])) * SCALE;
    } else if ((match = /^(\d+):([0-5]\d):([0-5]\d(?:\.\d{1,3})?)$/.exec(raw))){
      milliseconds = (Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3])) * SCALE;
    } else if (/^(?:\d+(?:\.\d{1,3})?|\.\d{1,3})$/.test(raw)) {
      milliseconds = Math.round(Number(raw) * SCALE);
    } else {
      fail(label + " must be seconds, mm:ss or hh:mm:ss, with at most three decimal places.");
    }
    if (!isFinite(milliseconds) || milliseconds < 0 || milliseconds > MAX_DURATION * SCALE || (!allowZero && milliseconds === 0)){
      fail(label + " must be " + (allowZero ? "between 0 and 86,400" : "between 0.001 and 86,400") + " seconds.");
    }
    return {value:milliseconds / SCALE, milliseconds:milliseconds};
  }
  function frameCount(parsed, fps){
    return Math.round(parsed.milliseconds * fps.scaled / (SCALE * SCALE));
  }
  function parseClips(text, fps){
    var lines = String(text == null ? "" : text).replace(/\r\n?/g, "\n").split("\n");
    var clips = [];
    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;
      if (clips.length >= MAX_CLIPS) fail("Enter no more than 100 clips.");
      var number = clips.length + 1;
      var parts = line.split("|");
      if (parts.length > 2) fail("Clip " + number + " must contain one duration and at most one | label separator.");
      var parsed = duration(parts[0], "Clip " + number + " duration", false);
      var frames = frameCount(parsed, fps);
      if (frames < 1) fail("Clip " + number + " is shorter than half a frame at this frame rate.");
      var label = parts.length === 2 ? parts[1].trim().replace(/\s+/g, " ") : "";
      if (label.length > 80) fail("Clip " + number + " label must be no more than 80 characters.");
      clips.push({label:label || "Clip " + number, durationFrames:frames, inputSeconds:parsed.value});
    }
    if (!clips.length) fail("Enter at least one clip duration.");
    return clips;
  }
  function parseTransitions(text, count, fps){
    var raw = String(text == null ? "" : text).replace(/\r\n?/g, "\n");
    var lines = raw.split("\n");
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!raw.trim()) lines = [];
    if (lines.length !== count){
      if (count === 0 && lines.length === 0) return [];
      fail("Enter exactly " + count + " transition " + (count === 1 ? "duration" : "durations") + ", one per gap; use 0 for a cut.");
    }
    return lines.map(function(line, index){
      var label = "Transition " + (index + 1);
      var parsed = line.trim() ? duration(line, label, true) : {value:0, milliseconds:0};
      return {afterClip:index + 1, frames:frameCount(parsed, fps), inputSeconds:parsed.value};
    });
  }
  function calculate(input){
    var source = input || {};
    var fps = decimal(source.fps == null ? 30 : source.fps, "Frame rate", 1, 240, "fps");
    var clips = parseClips(source.clips == null ? "5 | Opening\n8 | Interview\n6 | Closing" : source.clips, fps);
    var transitions = parseTransitions(source.transitions == null ? "1\n0.5" : source.transitions, clips.length - 1, fps);
    var totalClipFrames = 0;
    var totalOverlapFrames = 0;
    var cursor = 0;
    for (var i = 0; i < clips.length; i++){
      totalClipFrames += clips[i].durationFrames;
      var incoming = i ? transitions[i - 1].frames : 0;
      var outgoing = i + 1 < clips.length ? transitions[i].frames : 0;
      if (outgoing && outgoing >= clips[i].durationFrames) fail("Transition " + (i + 1) + " must be shorter than both adjacent clips.");
      if (incoming && incoming >= clips[i].durationFrames) fail("Transition " + i + " must be shorter than both adjacent clips.");
      if (incoming + outgoing >= clips[i].durationFrames && (incoming || outgoing)) fail("Clip " + (i + 1) + " must be longer than its incoming and outgoing transitions combined.");
      if (i) cursor -= incoming;
      clips[i].startFrame = cursor;
      clips[i].inTransitionFrames = incoming;
      clips[i].outTransitionFrames = outgoing;
      cursor += clips[i].durationFrames;
      clips[i].endFrame = cursor;
    }
    for (var j = 0; j < transitions.length; j++) totalOverlapFrames += transitions[j].frames;
    return {
      fps:fps.value,
      fpsScaled:fps.scaled,
      clips:clips,
      transitions:transitions,
      totalClipFrames:totalClipFrames,
      totalOverlapFrames:totalOverlapFrames,
      totalFrames:totalClipFrames - totalOverlapFrames,
      clipCount:clips.length
    };
  }
  function clockFrames(frames, fpsScaled){
    var ms = Math.round(frames * SCALE * SCALE / fpsScaled);
    var hours = Math.floor(ms / 3600000); ms -= hours * 3600000;
    var minutes = Math.floor(ms / 60000); ms -= minutes * 60000;
    var secs = Math.floor(ms / 1000); ms -= secs * 1000;
    function pad(value, width){ var text = String(value); while (text.length < width) text = "0" + text; return text; }
    return (hours ? hours + ":" + pad(minutes, 2) : pad(minutes, 2)) + ":" + pad(secs, 2) + "." + pad(ms, 3);
  }
  function seconds(frames, fps){
    return Number((frames / fps).toFixed(3)).toLocaleString("en-US", {maximumFractionDigits:3}) + " s";
  }
  function count(value){ return Number(value).toLocaleString("en-US"); }
  function summary(result){
    var lines = ["Video transition timeline", "Frame rate: " + limit(result.fps) + " fps"];
    result.clips.forEach(function(clip, index){
      lines.push((index + 1) + ". " + clip.label + " | " + clockFrames(clip.startFrame, result.fpsScaled) + "–" + clockFrames(clip.endFrame, result.fpsScaled) + " | " + count(clip.durationFrames) + " frames");
      if (clip.outTransitionFrames) lines.push("   Outgoing overlap: " + count(clip.outTransitionFrames) + " frames");
    });
    lines.push("Clip runtime before overlaps: " + seconds(result.totalClipFrames, result.fps));
    lines.push("Total transition overlap: " + seconds(result.totalOverlapFrames, result.fps));
    lines.push("Finished runtime: " + clockFrames(result.totalFrames, result.fpsScaled) + " (" + count(result.totalFrames) + " frames; " + seconds(result.totalFrames, result.fps) + ")");
    return lines.join("\n");
  }
  return {calculate:calculate, clockFrames:clockFrames, seconds:seconds, count:count, summary:summary};
})();
/* video-transition-timeline-core:end */
(function(){
  "use strict";
  var els = {
    fps:document.getElementById("fps"), clips:document.getElementById("clips"), transitions:document.getElementById("transitions"),
    err:document.getElementById("err"), out:document.getElementById("out"), summary:document.getElementById("summary"),
    copy:document.getElementById("copy"), copyStatus:document.getElementById("copy-status")
  };
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function element(tag, className, text){ var node = document.createElement(tag); if (className) node.className = className; if (text != null) node.textContent = text; return node; }
  function metric(label, value){
    var box = element("div", "metric"); box.appendChild(element("strong", "", value)); box.appendChild(element("span", "", label)); return box;
  }
  function clearInvalid(){ els.fps.removeAttribute("aria-invalid"); els.clips.removeAttribute("aria-invalid"); els.transitions.removeAttribute("aria-invalid"); }
  function placeholder(message){ els.out.appendChild(element("span", "placeholder", message)); }
  function update(){
    clearInvalid(); clear(els.out); els.err.textContent = ""; els.copyStatus.textContent = ""; els.copy.disabled = true; els.summary.value = "";
    try {
      var result = VideoTransitionTimelineCore.calculate({fps:els.fps.value, clips:els.clips.value, transitions:els.transitions.value});
      var metrics = element("div", "metrics");
      metrics.appendChild(metric("finished runtime", VideoTransitionTimelineCore.clockFrames(result.totalFrames, result.fpsScaled)));
      metrics.appendChild(metric("timeline frames", VideoTransitionTimelineCore.count(result.totalFrames)));
      metrics.appendChild(metric("overlap removed", VideoTransitionTimelineCore.seconds(result.totalOverlapFrames, result.fps)));
      els.out.appendChild(metrics);
      result.clips.forEach(function(clip, index){
        var row = element("div", "clip");
        var main = element("div", "clip-main");
        main.appendChild(element("span", "clip-name", (index + 1) + ". " + clip.label));
        main.appendChild(element("span", "clip-range", VideoTransitionTimelineCore.clockFrames(clip.startFrame, result.fpsScaled) + "–" + VideoTransitionTimelineCore.clockFrames(clip.endFrame, result.fpsScaled)));
        row.appendChild(main);
        var detail = VideoTransitionTimelineCore.count(clip.durationFrames) + " frames · " + VideoTransitionTimelineCore.seconds(clip.durationFrames, result.fps);
        if (clip.inTransitionFrames || clip.outTransitionFrames) detail += " · overlap in " + clip.inTransitionFrames + " / out " + clip.outTransitionFrames + " frames";
        row.appendChild(element("div", "clip-detail", detail));
        els.out.appendChild(row);
      });
      els.summary.value = VideoTransitionTimelineCore.summary(result); els.copy.disabled = false;
    } catch (error) {
      if (/^Frame rate/.test(error.message)) els.fps.setAttribute("aria-invalid", "true");
      else if (/^Transition|^Enter exactly/.test(error.message)) els.transitions.setAttribute("aria-invalid", "true");
      else els.clips.setAttribute("aria-invalid", "true");
      placeholder("Enter valid clip durations and one transition overlap per gap to see the timeline."); els.err.textContent = error.message;
    }
  }
  document.getElementById("timeline-form").addEventListener("submit", function(event){ event.preventDefault(); update(); });
  document.getElementById("restore").addEventListener("click", function(){
    els.fps.value = "30"; els.clips.value = "5 | Opening\n8 | Interview\n6 | Closing"; els.transitions.value = "1\n0.5"; update(); els.clips.focus();
  });
  els.copy.addEventListener("click", function(){
    var text = els.summary.value;
    function done(){ els.copyStatus.textContent = "Plan copied."; }
    function fallback(){
      els.summary.focus(); els.summary.select(); var copied = false;
      try { copied = document.execCommand("copy"); } catch (ignore) { copied = false; }
      els.copyStatus.textContent = copied ? "Plan copied." : "Select the plan and copy it manually.";
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  });
  update();
})();
</script>
</body>
</html>
