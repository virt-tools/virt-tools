<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Fairy Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#1a3a2a,#0a1a1a);border-radius:12px;overflow:hidden;position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🧚 CSS Fairy Generator</h1>
<p>Create CSS fairy with body, wings, wand, and sparkle glow. 3 wing styles. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Dress Color</label><input type="color" id="dressColor" value="#ce93d8" style="width:60px;height:36px" aria-label="Dress Color"></div>
<div class="ctrl-row"><label>Wing Style</label><select id="wingStyle" aria-label="Wing Style"><option value="butterfly">Butterfly</option><option value="dragonfly">Dragonfly</option><option value="round">Round</option></select></div>
<div class="ctrl-row"><label>Wing Color</label><input type="color" id="wingColor" value="#b2ebf2" style="width:60px;height:36px" aria-label="Wing Color"></div>
<div class="ctrl-row"><label>Sparkles</label><select id="sparkles" aria-label="Sparkles"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="180" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var dc=document.getElementById('dressColor').value;
var ws=document.getElementById('wingStyle').value;
var wc=document.getElementById('wingColor').value;
var sp=document.getElementById('sparkles').value;
var sz=parseInt(document.getElementById('size').value);
var hd=sz*0.15,bw=sz*0.25,bh=sz*0.2;
var html='<div class="fairy">\n  <div class="wing w-left w-'+ws+'"></div>\n  <div class="wing w-right w-'+ws+'"></div>\n  <div class="head"><div class="eye"></div><div class="hair"></div></div>\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="wand"></div>'+(sp==='on'?'\n  <div class="sparkle s1"></div><div class="sparkle s2"></div><div class="sparkle s3"></div>':'')+'\n</div>';
var css='.fairy{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.head{width:'+hd+'px;height:'+hd+'px;background:#ffcc80;border-radius:50%;position:relative;z-index:3}\n';
css+='.eye{position:absolute;top:40%;right:30%;width:'+(hd*0.15)+'px;height:'+(hd*0.15)+'px;background:#333;border-radius:50%}\n';
css+='.hair{position:absolute;top:-'+(hd*0.2)+'px;left:-'+(hd*0.05)+'px;width:'+(hd*1.1)+'px;height:'+(hd*0.6)+'px;background:#8d6e63;border-radius:50% 50% 20% 20%;z-index:-1}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:'+dc+';border-radius:40% 40% 30% 30%;position:relative;z-index:2}\n';
css+='.arm{position:absolute;width:'+(bw*0.25)+'px;height:'+(bh*0.7)+'px;background:#ffcc80;border-radius:50%;z-index:1;top:'+(bh*0.1)+'px}\n';
css+='.a-left{left:-'+(bw*0.15)+'px;transform:rotate(-25deg)}.a-right{right:-'+(bw*0.15)+'px;transform:rotate(25deg)}\n';
css+='.wand{position:absolute;right:-'+(sz*0.12)+'px;top:'+(sz*0.05)+'px;width:'+(sz*0.04)+'px;height:'+(sz*0.15)+'px;background:#ffd700;z-index:4;transform:rotate(20deg)}\n';
css+='.wand::before{content:"";position:absolute;top:-'+(sz*0.03)+'px;left:-'+(sz*0.02)+'px;width:'+(sz*0.08)+'px;height:'+(sz*0.08)+'px;background:radial-gradient(circle,#fff,#ffd700);border-radius:50%}\n';
var wingW=sz*0.4,wingH=sz*0.3;
css+='.wing{position:absolute;width:'+wingW+'px;height:'+wingH+'px;z-index:0;opacity:0.6}\n';
if(ws==='butterfly'){
css+='.w-butterfly{background:radial-gradient(ellipse,'+wc+',transparent);border-radius:50% 80% 20% 50%}\n';
css+='.w-left.w-butterfly{left:-'+(wingW*0.3)+'px;top:'+(sz*0.1)+'px;transform:rotate(-20deg)}.w-right.w-butterfly{right:-'+(wingW*0.3)+'px;top:'+(sz*0.1)+'px;transform:rotate(20deg) scaleX(-1)}\n';
}else if(ws==='dragonfly'){
css+='.w-dragonfly{width:'+(wingW*0.7)+'px;height:'+(wingH*0.5)+'px;background:'+wc+';border-radius:50%}\n';
css+='.w-left.w-dragonfly{left:-'+(wingW*0.2)+'px;top:'+(sz*0.08)+'px;transform:rotate(-15deg)}.w-right.w-dragonfly{right:-'+(wingW*0.2)+'px;top:'+(sz*0.08)+'px;transform:rotate(15deg) scaleX(-1)}\n';
}else{
css+='.w-round{background:radial-gradient(circle,'+wc+',transparent);border-radius:50%}\n';
css+='.w-left.w-round{left:-'+(wingW*0.3)+'px;top:'+(sz*0.05)+'px;transform:rotate(-10deg)}.w-right.w-round{right:-'+(wingW*0.3)+'px;top:'+(sz*0.05)+'px;transform:rotate(10deg) scaleX(-1)}\n';
}
if(sp==='on'){
css+='.sparkle{position:absolute;width:'+(sz*0.04)+'px;height:'+(sz*0.04)+'px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff}\n';
css+='.s1{left:-'+(sz*0.15)+'px;top:0}.s2{right:-'+(sz*0.15)+'px;top:'+(sz*0.2)+'px}.s3{left:0;top:-'+(sz*0.1)+'px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['dressColor','wingStyle','wingColor','sparkles','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
