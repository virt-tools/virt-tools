<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Speed Unit Converter — virt.tools</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header id="site-header"></header><main class="tool-container"><h1>Speed Unit Converter</h1><p class="subtitle">Convert between all supported speed units in either direction. Calculations stay in your browser.</p>
<div class="input-section"><label for="unit-value">Value</label><input id="unit-value" type="number" value="1" step="any" inputmode="decimal"><label for="unit-from">From</label><select id="unit-from"></select><label for="unit-to">To</label><select id="unit-to"></select><button id="unit-swap" type="button" class="primary-btn">Swap direction</button></div>
<section class="result-section" aria-live="polite"><div class="result-row"><span>Result</span><strong id="unit-result"></strong></div><p id="unit-equation"></p></section>
<script id="unit-config" type="application/json">{"quantity":"Speed","units":[{"slug":"meters-per-second","name":"Meters per second","symbol":"m/s","scale":1,"offset":0},{"slug":"kilometers-per-hour","name":"Kilometers per hour","symbol":"km/h","scale":0.2777777777777778,"offset":0},{"slug":"miles-per-hour","name":"Miles per hour","symbol":"mph","scale":0.44704,"offset":0},{"slug":"feet-per-second","name":"Feet per second","symbol":"ft/s","scale":0.3048,"offset":0},{"slug":"knots","name":"Knots","symbol":"kn","scale":0.5144444444444445,"offset":0},{"slug":"mach","name":"Mach (standard atmosphere)","symbol":"Mach","scale":340.29,"offset":0},{"slug":"centimeters-per-second","name":"Centimeters per second","symbol":"cm/s","scale":0.01,"offset":0},{"slug":"kilometers-per-second","name":"Kilometers per second","symbol":"km/s","scale":1000,"offset":0}]}</script></main><script src="/assets/app.js"></script><script src="/assets/unit-converter.js"></script></body></html>
