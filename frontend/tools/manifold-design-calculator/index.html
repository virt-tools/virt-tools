<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Manifold Design Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Manifold Design Calculator</h1>
<p>Calculate subsea manifold header size, valve count, and pressure rating from well count and flow rates. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wells">Number of wells</label><input type="text" id="in-wells" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-rate">Rate per well</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">bbl/day</div></div>
<div class="field"><label class="f" for="in-press">Design pressure</label><input type="text" id="in-press" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">psi</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wE=document.getElementById("in-wells"),rE=document.getElementById("in-rate"),pE=document.getElementById("in-press"),out=document.getElementById("out");
function calc(){
var w=parseFloat(wE.value),r=parseFloat(rE.value),p=parseFloat(pE.value);
if(isNaN(w)||isNaN(r)||isNaN(p))return;
var totalRate=w*r;
var headerDia=Math.sqrt(totalRate/1000)*3;
var valveCount=w*2+2;
var html='<div class="big">'+(Math.round(headerDia*10)/10)+' in</div>';
html+=row("Header diameter",Math.round(headerDia*10)/10+' in');
html+=row("Total flow",totalRate.toLocaleString()+' bbl/day');
html+=row("Valve count",valveCount);
out.innerHTML=html;
}
[wE,rE,pE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
