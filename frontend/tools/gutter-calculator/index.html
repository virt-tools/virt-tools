<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutter Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Gutter & Downspout Calculator</h1>
<p class="subtitle">Size gutters and downspouts based on roof area and rainfall intensity.</p>
<div class="input-section">
<label>Roof Area (sq ft)</label>
<input type="number" id="roofArea" value="2000" min="0" aria-label="Roof Area">
<label>Rainfall Intensity (in/hr)</label>
<input type="number" id="rainfall" value="1" min="0.1" step="0.1" aria-label="Rainfall">
<label>Roof Pitch</label>
<select id="pitch" aria-label="Pitch">
<option value="1">Flat (up to 3:12)</option>
<option value="1.05" selected>Low (4:12 to 5:12)</option>
<option value="1.1">Medium (6:12 to 9:12)</option>
<option value="1.2">Steep (10:12+)</option>
</select>
<label>Gutter Size</label>
<select id="gutterSize" aria-label="Gutter Size">
<option value="5" selected>5-inch</option>
<option value="6">6-inch</option>
</select>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const A=parseFloat(document.getElementById('roofArea').value)||0;
const R=parseFloat(document.getElementById('rainfall').value)||0;
const P=parseFloat(document.getElementById('pitch').value);
const G=parseFloat(document.getElementById('gutterSize').value);
const adjArea=A*P;
const gallonsPerMin=(adjArea*R)/96;
const capacity5=1.2, capacity6=2.2;
const cap=G===5?capacity5:capacity6;
const downspouts=Math.ceil(gallonsPerMin/cap);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Adjusted Roof Area:</span><span>${adjArea.toFixed(0)} sq ft</span></div>
<div class="result-row"><span>Water Volume:</span><span>${gallonsPerMin.toFixed(1)} gal/min</span></div>
<div class="result-row"><span>Gutter Capacity (${G}-inch):</span><span>${cap} gal/min per downspout</span></div>
<div class="result-row"><span>Downspouts Needed:</span><span>${downspouts}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
