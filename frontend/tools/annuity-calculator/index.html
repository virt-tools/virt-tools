<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuity Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.an{max-width:500px;margin:0 auto;padding:2rem 1rem}
.an h1{font-size:2rem;margin-bottom:.5rem}
.an .sub{color:#888;margin-bottom:1.5rem}
.an label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.an input,.an select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.an .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.an .results{margin-top:2rem}
.an .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.an .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.an .res-card .lbl{color:#888;font-size:13px}
.an .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="an">
<h1>📅 Annuity Calculator</h1>
<p class="sub">Calculate the future or present value of an ordinary annuity.</p>
<label for="pmt">Payment amount ($):</label>
<input type="number" id="pmt" value="500" min="0" oninput="calc()">
<label for="rate">Interest rate per period (%):</label>
<input type="number" id="rate" value="6" min="0" step="0.1" oninput="calc()">
<label for="n">Number of periods:</label>
<input type="number" id="n" value="20" min="1" oninput="calc()">
<label for="mode">Type:</label>
<select id="mode" onchange="calc()" style="margin-top:4px">
<option value="fva">Future Value (Ordinary)</option>
<option value="fvd">Future Value (Due)</option>
<option value="pva">Present Value (Ordinary)</option>
<option value="pvd">Present Value (Due)</option>
</select>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const PMT=parseFloat(document.getElementById('pmt').value)||0;
  const r=(parseFloat(document.getElementById('rate').value)||0)/100;
  const n=parseInt(document.getElementById('n').value)||1;
  const mode=document.getElementById('mode').value;
  let val,formula;
  if(mode==='fva'){
    val=r===0?PMT*n:PMT*((Math.pow(1+r,n)-1)/r);
    formula='FV = PMT × ((1+r)ⁿ − 1) / r';
  }else if(mode==='fvd'){
    val=r===0?PMT*n:PMT*((Math.pow(1+r,n)-1)/r)*(1+r);
    formula='FV(due) = PMT × ((1+r)ⁿ − 1) / r × (1+r)';
  }else if(mode==='pva'){
    val=r===0?PMT*n:PMT*((1-Math.pow(1+r,-n))/r);
    formula='PV = PMT × (1 − (1+r)⁻ⁿ) / r';
  }else{
    val=r===0?PMT*n:PMT*((1-Math.pow(1+r,-n))/r)*(1+r);
    formula='PV(due) = PMT × (1 − (1+r)⁻ⁿ) / r × (1+r)';
  }
  let html='<div class="res-card"><div class="lbl">Value</div><div class="big" style="color:#27ae60">$'+val.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Formula Used</div><div style="font-size:14px;margin-top:8px;color:#666">'+formula+'</div></div>';
  html+='<div class="grid2"><div class="res-card"><div class="lbl">Total Payments</div><div class="big">$'+(PMT*n).toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  const int=val-PMT*n;
  html+='<div class="res-card"><div class="lbl">Interest</div><div class="big" style="color:#e67e22">$'+(int>0?int:0).toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
