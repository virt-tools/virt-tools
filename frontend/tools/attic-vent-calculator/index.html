<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Attic Vent Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Attic Vent Calculator</h1>
<p>Calculate required attic ventilation area (intake and exhaust) from attic floor area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-area">Attic floor area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-ratio">Vent ratio</label><input type="text" id="in-ratio" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">1:X ratio</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter attic area.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-area"),rEl=document.getElementById("in-ratio"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),R=pn(rEl.value);
if(A==null){return}
R=R==null?300:R;
if(!isFinite(A)||!isFinite(R)||A<=0||R<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var total=A/R*10000;
var intake=total*0.5;
var exhaust=total*0.5;
var html='<div class="big">'+rnd(total,0)+' cm²</div>';
html+=row("Attic floor area",rnd(A,0)+" m²");
html+=row("Vent ratio","1:"+rnd(R,0));
html+=row("Total vent area",rnd(total,0)+" cm²");
html+=row("Intake (soffit)",rnd(intake,0)+" cm²");
html+=row("Exhaust (ridge)",rnd(exhaust,0)+" cm²");
out.innerHTML=html;
}
[aEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
