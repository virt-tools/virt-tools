<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Visualizer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Visualizer</h1>
<p class="subtitle">Real-time frequency spectrum and waveform visualization from your microphone or audio file. 100% client-side.</p>
<div class="input-section">
<button id="mic" class="primary-btn" type="button">Use Microphone</button>
<input type="file" id="file" accept="audio/*" style="margin:0 1em;" aria-label="File">
<button id="play" class="primary-btn" type="button">Play File</button>
<button id="stop" class="primary-btn" style="background:#666;" type="button">Stop</button>
</div>
<canvas id="canvas" width="800" height="300" style="width:100%;max-width:800px;margin-top:1em;background:#111;border-radius:8px;"></canvas>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('canvas');
const ctx2=canvas.getContext('2d');
let audioCtx,analyser,source,raf,mode='bars';
function draw(){
const w=canvas.width,h=canvas.height;
ctx2.fillStyle='#111';ctx2.fillRect(0,0,w,h);
const bufLen=analyser.frequencyBinCount;
const data=new Uint8Array(bufLen);
analyser.getByteFrequencyData(data);
const barW=w/bufLen;
for(let i=0;i<bufLen;i++){
const barH=(data[i]/255)*h;
const hue=i/bufLen*360;
ctx2.fillStyle='hsl('+hue+',100%,50%)';
ctx2.fillRect(i*barW,h-barH,barW-1,barH);
}
raf=requestAnimationFrame(draw);
}
function start(){
if(raf)cancelAnimationFrame(raf);
draw();
}
document.getElementById('mic').addEventListener('click',async()=>{
audioCtx=new AudioContext();
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
source=audioCtx.createMediaStreamSource(stream);
analyser=audioCtx.createAnalyser();
analyser.fftSize=256;
source.connect(analyser);
start();
});
document.getElementById('play').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
audioCtx=new AudioContext();
const arr=await file.arrayBuffer();
const buf=await audioCtx.decodeAudioData(arr);
source=audioCtx.createBufferSource();
source.buffer=buf;
analyser=audioCtx.createAnalyser();
analyser.fftSize=256;
source.connect(analyser);
analyser.connect(audioCtx.destination);
source.start();
start();
});
document.getElementById('stop').addEventListener('click',()=>{
if(raf)cancelAnimationFrame(raf);
if(source)try{source.stop();}catch(e){}
if(audioCtx)audioCtx.close();
ctx2.fillStyle='#111';ctx2.fillRect(0,0,canvas.width,canvas.height);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
