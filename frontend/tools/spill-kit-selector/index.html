<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Spill Kit Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select,.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Spill Kit Selector</h1>
<p>Choose the right spill kit type and capacity based on spill material and maximum spill volume. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-m">Spill material</label><select id="in-m"><option value="">Select…</option><option value="oil">Oil / hydrocarbon</option><option value="chem">Chemical / hazmat</option><option value="universal">Universal (coolant, water-based)</option><option value="solvent">Solvent / paint</option></select><div class="unit">material</div></div>
<div class="field"><label class="f" for="in-v">Max spill volume</label><input type="text" id="in-v" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">gallons</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var mEl=document.getElementById("in-m"),vEl=document.getElementById("in-v"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var M=mEl.value,V=pn(vEl.value);
if(!M||V==null)return;
if(!isFinite(V)||V<=0){err.textContent="Enter valid volume.";return}
err.textContent="";
var type,capacity;
if(M==="oil"){type="Oil-only spill kit (white)";capacity=V<=5?"20 gal":V<=20?"50 gal":V<=50?"95 gal":"150+ gal"}
else if(M==="chem"){type="Hazmat/chemical spill kit (yellow)";capacity=V<=5?"20 gal":V<=20?"50 gal":V<=50?"95 gal":"150+ gal"}
else if(M==="universal"){type="Universal spill kit (gray)";capacity=V<=5?"20 gal":V<=20?"50 gal":V<=50?"95 gal":"150+ gal"}
else{type="Solvent/paint spill kit";capacity=V<=5?"10 gal":V<=20?"25 gal":V<=50?"65 gal":"100+ gal"}
var html='<div class="big">'+type+'</div>';
html+=row("Capacity",capacity);
html+=row("Max spill",V+' gal');
out.innerHTML=html;
}
[mEl,vEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
