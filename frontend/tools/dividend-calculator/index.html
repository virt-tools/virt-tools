<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dividend Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.div{max-width:520px;margin:0 auto;padding:2rem 1rem}
.div h1{font-size:2rem;margin-bottom:.5rem}
.div .sub{color:#888;margin-bottom:1.5rem}
.div label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.div input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.div .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.div .results{margin-top:2rem}
.div .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.div .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.div .res-card .lbl{color:#888;font-size:13px}
.div .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.div table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.div th,.div td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.div th{text-align:left;color:#888;font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="div">
<h1>💰 Dividend Calculator</h1>
<p class="sub">Calculate dividend yield, annual income, and DRIP growth over time.</p>
<label for="shares">Number of shares:</label>
<input type="number" id="shares" value="100" min="0" oninput="calc()">
<label for="price">Share price ($):</label>
<input type="number" id="price" value="50" min="0" oninput="calc()">
<label for="annual">Annual dividend per share ($):</label>
<input type="number" id="annual" value="2" min="0" step="0.01" oninput="calc()">
<label for="years">Years to project:</label>
<input type="number" id="years" value="10" min="1" oninput="calc()">
<label for="drip">DRIP (reinvest)?</label>
<select id="drip" style="width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box" onchange="calc()">
<option value="no">No — take cash</option>
<option value="yes">Yes — reinvest</option>
</select>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const s=parseFloat(document.getElementById('shares').value)||0;
  const p=parseFloat(document.getElementById('price').value)||0;
  const d=parseFloat(document.getElementById('annual').value)||0;
  const yrs=parseInt(document.getElementById('years').value)||1;
  const drip=document.getElementById('drip').value==='yes';
  const annualIncome=s*d;
  const yieldPct=p===0?0:(d/p)*100;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Annual Income</div><div class="big">$'+annualIncome.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Dividend Yield</div><div class="big">'+yieldPct.toFixed(2)+'%</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Total Income over '+yrs+' years</div><div class="big" style="color:#27ae60">$'+(annualIncome*yrs).toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  if(drip&&p>0&&d>0){
    let shares=s;
    let totalDiv=0;
    let rows='';
    for(let y=1;y<=Math.min(yrs,10);y++){
      const inc=shares*d;
      const newShares=inc/p;
      shares+=newShares;
      totalDiv+=inc;
      rows+='<tr><td>'+y+'</td><td>'+shares.toFixed(2)+'</td><td>$'+inc.toFixed(2)+'</td></tr>';
    }
    html+='<div class="res-card"><div class="lbl">DRIP Projection (shares grow each year)</div><table><tr><th>Year</th><th>Shares</th><th>Income</th></tr>'+rows+'</table>';
    if(yrs>10)html+='<p style="font-size:12px;color:#888;margin-top:4px">Showing first 10 years</p>';
    html+='</div>';
    html+='<div class="res-card"><div class="lbl">Final share count</div><div class="big" style="font-size:1.5rem">'+shares.toFixed(2)+'</div></div>';
  }
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
