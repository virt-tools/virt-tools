<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Knight Character Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#2a1a1a,#1a0a0a);border-radius:12px;overflow:hidden;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⚔️ CSS Knight Character Generator</h1>
<p>Create CSS knight character with helmet, visor slit, armor body, shield, and sword. 4 armor colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Armor Color</label><select id="armorColor"><option value="#9e9e9e">Steel</option><option value="#ffe082">Gold</option><option value="#37474f">Dark Iron</option><option value="#b71c1c">Crimson</option></select></div>
<div class="ctrl-row"><label>Plume Color</label><input type="color" id="plumeColor" value="#d32f2f" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Shield</label><select id="shield"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Shield Emblem</label><select id="emblem"><option value="cross">Cross</option><option value="star">Star</option><option value="none">None</option></select></div>
<div class="ctrl-row"><label>Sword</label><select id="sword"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="260" value="190" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var ac=document.getElementById('armorColor').value;
var pc=document.getElementById('plumeColor').value;
var sh=document.getElementById('shield').value;
var em=document.getElementById('emblem').value;
var sw=document.getElementById('sword').value;
var sz=parseInt(document.getElementById('size').value);
var hd=sz*0.15,bw=sz*0.26,bh=sz*0.26;
var html='<div class="knight">\n  <div class="helmet"><div class="plume"></div><div class="visor"></div></div>\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="leg l-left"></div>\n  <div class="leg l-right"></div>\n'+(sh==='on'?'  <div class="shield'+(em!=='none'?' '+em:'')+'"></div>\n':'')+(sw==='on'?'  <div class="sword"><div class="blade"></div><div class="crossguard"></div><div class="hilt"></div><div class="pommel"></div></div>\n':'')+'</div>';
var css='.knight{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.helmet{position:relative;width:'+hd+'px;height:'+(hd*1.1)+'px;background:linear-gradient(180deg,'+ac+','+ac+' 60%,rgba(0,0,0,0.3));border-radius:40% 40% 15% 15%;z-index:3}\n';
css+='.plume{position:absolute;top:-'+(hd*0.3)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.2)+'px;height:'+(hd*0.4)+'px;background:'+pc+';border-radius:50% 50% 10% 10%}\n';
css+='.visor{position:absolute;top:'+(hd*0.35)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.4)+'px;height:'+(hd*0.08)+'px;background:#1a1a1a;border-radius:2px;box-shadow:inset 0 1px 2px rgba(255,255,255,0.2)}\n';
css+='.body{width:'+bw+'px;height:'+bh+'px;background:linear-gradient(180deg,'+ac+','+ac+' 70%,rgba(0,0,0,0.4));border-radius:15% 15% 5% 5%;z-index:2;margin-top:-2px}\n';
css+='.arm{position:absolute;width:'+(bw*0.22)+'px;height:'+(bh*0.8)+'px;background:'+ac+';border-radius:50%;z-index:1;top:'+(sz*0.2)+'px}\n';
css+='.a-left{left:-'+(bw*0.12)+'px;transform:rotate(-15deg)}.a-right{right:-'+(bw*0.12)+'px;transform:rotate(15deg)}\n';
css+='.leg{position:absolute;width:'+(bw*0.22)+'px;height:'+(bh*0.5)+'px;background:'+ac+';border-radius:10% 10% 30% 30%;z-index:0;bottom:-'+(bh*0.4)+'px}\n';
css+='.l-left{left:'+(bw*0.15)+'px}.l-right{right:'+(bw*0.15)+'px}\n';
if(sh==='on'){
css+='.shield{position:absolute;left:-'+(sz*0.12)+'px;top:'+(sz*0.2)+'px;width:'+(sz*0.14)+'px;height:'+(sz*0.18)+'px;background:linear-gradient(180deg,'+ac+','+ac+' 70%,rgba(0,0,0,0.3));border-radius:50% 50% 10% 10%;border:2px solid rgba(0,0,0,0.3);z-index:5;transform:rotate(-5deg)}\n';
if(em==='cross'){css+='.shield.cross::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(sz*0.02)+'px;height:'+(sz*0.08)+'px;background:#ffd54f;box-shadow:0 -'+(sz*0.025)+'px 0 0 #ffd54f,0 '+(sz*0.025)+'px 0 0 #ffd54f;-webkit-box-shadow:0 0 0 '+(sz*0.012)+'px transparent,0 -'+(sz*0.03)+'px 0 0 #ffd54f,0 '+(sz*0.03)+'px 0 0 #ffd54f;clip-path:polygon(30% 0,70% 0,70% 40%,100% 40%,100% 60%,70% 60%,70% 100%,30% 100%,30% 60%,0 60%,0 40%,30% 40%)}\n'}
if(em==='star'){css+='.shield.star::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:'+(sz*0.04)+'px;height:'+(sz*0.04)+'px;background:#ffd54f;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}\n'}
}
if(sw==='on'){
css+='.sword{position:absolute;right:-'+(sz*0.18)+'px;top:'+(sz*0.05)+'px;transform:rotate(20deg);z-index:6}\n';
css+='.blade{width:'+(sz*0.025)+'px;height:'+(sz*0.25)+'px;background:linear-gradient(180deg,#e0e0e0,#bdbdbd);border-radius:2px 2px 50% 50%}\n';
css+='.crossguard{width:'+(sz*0.08)+'px;height:'+(sz*0.02)+'px;background:'+ac+';margin-left:-'+(sz*0.027)+'px;margin-top:-2px;border-radius:2px}\n';
css+='.hilt{width:'+(sz*0.02)+'px;height:'+(sz*0.04)+'px;background:#5d4037;margin-left:-'+(sz*0.002)+'px}\n';
css+='.pommel{width:'+(sz*0.025)+'px;height:'+(sz*0.025)+'px;background:'+ac+';border-radius:50%;margin-left:-'+(sz*0.01)+'px}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['armorColor','plumeColor','shield','emblem','sword','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
