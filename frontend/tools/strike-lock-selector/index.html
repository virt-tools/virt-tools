<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Strike Lock Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Strike Lock Selector</h1>
<p>Select an electric strike lock type (fail-safe vs fail-secure) and duty rating based on door usage and voltage. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-fail">Fail mode</label><input type="text" id="in-fail" inputmode="numeric" autocomplete="off" placeholder="1=safe, 2=secure"><div class="unit">1 or 2</div></div>
<div class="field"><label class="f" for="in-cyc">Cycles/day</label><input type="text" id="in-cyc" inputmode="numeric" autocomplete="off" placeholder="e.g. 500"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var fEl=document.getElementById("in-fail"),cEl=document.getElementById("in-cyc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var F=pn(fEl.value),C=pn(cEl.value);
if(F==null||C==null)return;
if(!isFinite(F)||F<1||F>2||!isFinite(C)||C<=0){err.textContent="Fail mode: 1 or 2. Cycles: positive number.";return}
err.textContent="";
var mode=F==1?"Fail-safe (unlocked on power loss)":"Fail-secure (locked on power loss)";
var duty=C>1000?"Continuous duty":"Intermittent duty";
var voltage="12 or 24 VDC";
var html='<div class="big">'+duty+'</div>';
html+=row("Fail mode",mode);
html+=row("Duty rating",duty);
html+=row("Voltage",voltage);
html+=row("Cycles/day",C);
out.innerHTML=html;
}
[fEl,cEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
