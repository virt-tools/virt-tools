<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Stud Spacing Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Stud Spacing Calculator</h1>
<p>Calculate the number of wall studs needed and their on-center spacing for a given wall length. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">Wall length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-oc">On-center spacing</label><input type="text" id="in-oc" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.6"><div class="unit">m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter wall length.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-len"),oEl=document.getElementById("in-oc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),O=pn(oEl.value);
if(L==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter wall length.</span>';return}
O=O==null?0.6:O;
if(!isFinite(L)||!isFinite(O)||L<=0||O<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var studs=Math.ceil(L/O)+1;
var actualCount=studs;
var html='<div class="big">'+rnd(actualCount,0)+' studs</div>';
html+=row("Wall length",rnd(L,2)+" m");
html+=row("On-center spacing",rnd(O*100,0)+" cm");
html+=row("Studs needed",rnd(actualCount,0));
out.innerHTML=html;
}
[lEl,oEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
