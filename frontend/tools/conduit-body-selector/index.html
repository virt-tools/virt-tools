<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Conduit Body Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Conduit Body Selector</h1>
<p>Select conduit body type (C, LB, LL, LR, T) and trade size based on conduit size and wire pull direction. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cs">Conduit size</label><input type="text" id="in-cs" inputmode="numeric" autocomplete="off" placeholder="e.g. 1"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-ang">Pull direction</label><input type="text" id="in-ang" inputmode="numeric" autocomplete="off" placeholder="90 or 180"><div class="unit">degrees</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-cs"),aEl=document.getElementById("in-ang"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Cs=pn(cEl.value),Ang=pn(aEl.value);
if(Cs==null||Ang==null)return;
if(!isFinite(Cs)||Cs<=0||!isFinite(Ang)||(Ang!==90&&Ang!==180)){err.textContent="Enter conduit size and direction (90 or 180).";return}
err.textContent="";
var type=Ang===90?"LB (90° with back outlet)":"T (straight-through)";
var tradeSize=Math.ceil(Cs*2)/2;
var html='<div class="big">'+type+'</div>';
html+=row("Conduit body type",type);
html+=row("Trade size",tradeSize+'"');
html+=row("Conduit size",Cs+'"');
html+=row("Pull direction",Ang+'°');
out.innerHTML=html;
}
[cEl,aEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
