<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hand Wash Station Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hand Wash Station Calculator</h1>
<p>Calculate the number of hand wash stations needed for a job site based on crew size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-c">Crew size</label><input type="text" id="in-c" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">workers</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-c"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var C=pn(cEl.value);
if(C==null)return;
if(!isFinite(C)||C<=0){err.textContent="Enter valid crew size.";return}
err.textContent="";
var stations=Math.max(1,Math.ceil(C/15));
var html='<div class="big">'+stations+' stations</div>';
html+=row("Crew size",C);
html+=row("Stations (1 per 15)",stations);
out.innerHTML=html;
}
cEl.addEventListener("input",calc);
calc();
})();
</script>
</body>
</html>
