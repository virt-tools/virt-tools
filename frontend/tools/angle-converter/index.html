<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Angle Converter</h1>
<p class="subtitle">Convert between degrees, radians, gradians, turns, arcminutes, arcseconds, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="90" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Degree (°)</option>
<option value="57.2957795">Radian (rad)</option>
<option value="0.9">Gradian (grad)</option>
<option value="360">Turn (rev)</option>
<option value="0.016667">Arcminute (')</option>
<option value="0.000278">Arcsecond (")</option>
<option value="30">Sign</option>
<option value="60">Octant</option>
<option value="45">Compass Point</option>
<option value="22.5">Point (32)</option>
<option value="0.05625">Mil (NATO)</option>
<option value="0.004072">Mil (Warsaw Pact)</option>
<option value="1.01859136">Brassard</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Degree (°)',1],['Radian (rad)',57.2957795],['Gradian (grad)',0.9],['Turn (rev)',360],['Arcminute (\')',0.01666667],['Arcsecond (")',0.00027778],['Sign',30],['Octant',45],['Compass Point',11.25],['Point (32)',11.25],['Mil (NATO)',0.05625],['Mil (Swedish)',0.063662],['Quadrant',90],['Sextant',60]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const deg=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=deg/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
