<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>UUID Generator</h1>
<p class="subtitle">Generate RFC 4122 v4 UUIDs entirely in-browser using Web Crypto.</p>
<div class="input-section">
<label>How Many</label>
<input type="number" id="count" value="5" min="1" max="10000" step="1" aria-label="Count">
<label>Format</label>
<select id="format" aria-label="Format">
<option value="standard" selected>Standard (8-4-4-4-12)</option>
<option value="uppercase">Uppercase</option>
<option value="braces">{Brace-wrapped}</option>
<option value="urn">URN (urn:uuid:...)</option>
<option value="nohyphen">No hyphens</option>
</select>
<button id="gen" class="primary-btn" type="button">Generate</button>
<button id="copy" class="secondary-btn" type="button">Copy All</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function uuidv4(){
return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>
(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
}
function formatUUID(id,fmt){
switch(fmt){
case 'uppercase':return id.toUpperCase();
case 'braces':return '{'+id+'}';
case 'urn':return 'urn:uuid:'+id;
case 'nohyphen':return id.replace(/-/g,'');
default:return id;
}
}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('gen').addEventListener('click',()=>{
const n=Math.min(parseInt(document.getElementById('count').value)||1,10000);
const fmt=document.getElementById('format').value;
let ids=[];
for(let i=0;i<n;i++)ids.push(formatUUID(uuidv4(),fmt));
document.getElementById('result').innerHTML=`<pre style="white-space:pre-wrap;word-wrap:break-word">${ids.join('\n')}</pre>`;
document.getElementById('result').style.display='block';
window._uuids=ids;
});
document.getElementById('copy').addEventListener('click',()=>{
if(window._uuids)navigator.clipboard.writeText(window._uuids.join('\n'));
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
