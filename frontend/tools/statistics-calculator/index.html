<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Statistics Calculator</h1>
<p class="subtitle">Calculate mean, median, mode, range, variance, and standard deviation.</p>
<div class="input-section">
<label for="data">Enter numbers (comma or space separated)</label>
<textarea id="data" rows="4" maxlength="200000" style="width:100%;font-family:monospace">2, 4, 4, 4, 5, 5, 7, 9</textarea>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" role="status" style="display:none;"></div>
<p class="note">Up to 10,000 finite numbers. Quartiles use linear interpolation between ranked values (R type 7). Sample standard deviation requires at least two values.</p>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('data').addEventListener('input',()=>{document.getElementById('result').replaceChildren();document.getElementById('result').style.display='none';});
document.getElementById('calc').addEventListener('click',()=>{
const input=document.getElementById('data').value;
const tokens=input.trim().split(/[,\s]+/).filter(Boolean);
const nums=tokens.map(Number);
if(input.length>200000||nums.length>10000||tokens.some(x=>!(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(x)))||!nums.every(Number.isFinite)){document.getElementById('result').textContent='Enter up to 10,000 finite numbers. Remove invalid values; they are not ignored.';document.getElementById('result').style.display='block';return;}
if(nums.length===0){document.getElementById('result').innerHTML='<p class="warning">Enter at least one number.</p>';document.getElementById('result').style.display='block';return;}
const n=nums.length;
const sum=nums.reduce((a,b)=>a+b,0);
const mean=sum/n;
const sorted=[...nums].sort((a,b)=>a-b);
const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
const counts={};nums.forEach(x=>counts[x]=(counts[x]||0)+1);
const maxCount=Math.max(...Object.values(counts));
const modes=Object.entries(counts).filter(([k,c])=>c===maxCount).map(([k])=>parseFloat(k));
const range=sorted[n-1]-sorted[0];
const variance=nums.reduce((s,x)=>s+(x-mean)**2,0)/(n);
const stdDev=Math.sqrt(variance);
const sampleStd=n>1?Math.sqrt(variance*n/(n-1)):null;
function quantile(p){const index=(n-1)*p,lower=Math.floor(index),fraction=index-lower;return sorted[lower]*(1-fraction)+sorted[Math.min(lower+1,n-1)]*fraction;}
const q1=quantile(0.25),q3=quantile(0.75);
if(![sum,mean,median,range,variance,stdDev,q1,q3,...(sampleStd===null?[]:[sampleStd])].every(Number.isFinite)){document.getElementById('result').textContent='Results exceed the supported numeric range.';document.getElementById('result').style.display='block';return;}
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Count (n):</span><span>${n}</span></div>
<div class="result-row"><span>Sum:</span><span>${sum.toFixed(6)}</span></div>
<div class="result-row"><span>Mean (μ):</span><span>${mean.toFixed(6)}</span></div>
<div class="result-row"><span>Median:</span><span>${median.toFixed(6)}</span></div>
<div class="result-row"><span>Mode:</span><span>${maxCount===1?'No repeated value':modes.join(', ')+' ('+maxCount+'× each)'}</span></div>
<div class="result-row"><span>Range:</span><span>${range.toFixed(6)}</span></div>
<div class="result-row"><span>Q1:</span><span>${q1}</span></div>
<div class="result-row"><span>Q3:</span><span>${q3}</span></div>
<div class="result-row"><span>Population Variance:</span><span>${variance.toFixed(6)}</span></div>
<div class="result-row"><span>Population Std Dev:</span><span>${stdDev.toFixed(6)}</span></div>
<div class="result-row"><span>Sample Std Dev:</span><span>${sampleStd===null?'Requires at least two values':sampleStd.toFixed(6)}</span></div>
<div class="result-row"><span>Min / Max:</span><span>${sorted[0]} / ${sorted[n-1]}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
