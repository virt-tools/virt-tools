<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Statistics Calculator</h1>
<p class="subtitle">Calculate mean, median, mode, range, variance, and standard deviation.</p>
<div class="input-section">
<label>Enter numbers (comma or space separated)</label>
<textarea id="data" rows="4" style="width:100%;font-family:monospace" aria-label="Data">2, 4, 4, 4, 5, 5, 7, 9</textarea>
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const input=document.getElementById('data').value;
const nums=input.split(/[,\s]+/).map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
if(nums.length===0){document.getElementById('result').innerHTML='<p class="warning">Enter at least one number.</p>';document.getElementById('result').style.display='block';return;}
const n=nums.length;
const sum=nums.reduce((a,b)=>a+b,0);
const mean=sum/n;
const sorted=[...nums].sort((a,b)=>a-b);
const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[Math.floor(n/2)];
const counts={};nums.forEach(x=>counts[x]=(counts[x]||0)+1);
const maxCount=Math.max(...Object.values(counts));
const modes=Object.entries(counts).filter(([k,c])=>c===maxCount).map(([k])=>parseFloat(k));
const range=sorted[n-1]-sorted[0];
const variance=nums.reduce((s,x)=>s+(x-mean)**2,0)/(n);
const stdDev=Math.sqrt(variance);
const sampleVar=nums.reduce((s,x)=>s+(x-mean)**2,0)/(n-1);
const sampleStd=Math.sqrt(sampleVar);
const q1=sorted[Math.floor(n*0.25)];
const q3=sorted[Math.ceil(n*0.75)];
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Count (n):</span><span>${n}</span></div>
<div class="result-row"><span>Sum:</span><span>${sum.toFixed(6)}</span></div>
<div class="result-row"><span>Mean (μ):</span><span>${mean.toFixed(6)}</span></div>
<div class="result-row"><span>Median:</span><span>${median.toFixed(6)}</span></div>
<div class="result-row"><span>Mode:</span><span>${modes.join(', ')} (${maxCount}× each)</span></div>
<div class="result-row"><span>Range:</span><span>${range.toFixed(6)}</span></div>
<div class="result-row"><span>Q1:</span><span>${q1}</span></div>
<div class="result-row"><span>Q3:</span><span>${q3}</span></div>
<div class="result-row"><span>Population Variance:</span><span>${variance.toFixed(6)}</span></div>
<div class="result-row"><span>Population Std Dev:</span><span>${stdDev.toFixed(6)}</span></div>
<div class="result-row"><span>Sample Std Dev:</span><span>${sampleStd.toFixed(6)}</span></div>
<div class="result-row"><span>Min / Max:</span><span>${sorted[0]} / ${sorted[n-1]}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
