<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Shrinkage Compensation Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Shrinkage Compensation Calculator</h1>
<p>Estimate concrete shrinkage based on slab length, mix shrinkage coefficient, and joint spacing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Slab length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">feet</div></div>
<div class="field"><label class="f" for="in-s">Shrinkage strain</label><input type="text" id="in-s" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.0004"><div class="unit">in/in</div></div>
<div class="field"><label class="f" for="in-j">Joint spacing</label><input type="text" id="in-j" inputmode="decimal" autocomplete="off" placeholder="e.g. 15"><div class="unit">feet</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),sEl=document.getElementById("in-s"),jEl=document.getElementById("in-j"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),S=pn(sEl.value),J=pn(jEl.value);
if(L==null||S==null||J==null)return;
if(!isFinite(L)||L<=0||!isFinite(S)||S<=0||!isFinite(J)||J<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var totalShrink=L*12*S;
var shrinkPerPanel=J*12*S;
var numPanels=Math.ceil(L/J);
var html='<div class="big">'+rnd(totalShrink,2)+' in</div>';
html+=row("Total shrinkage",rnd(totalShrink,2)+' in');
html+=row("Shrinkage per panel",rnd(shrinkPerPanel,3)+' in');
html+=row("Number of panels",numPanels);
html+=row("Joint spacing",J+' ft');
html+=row("Shrinkage strain",S+' in/in');
out.innerHTML=html;
}
[lEl,sEl,jEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
