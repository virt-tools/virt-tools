<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wind Turbine Power Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wind Turbine Power Calculator</h1>
<p>Calculate wind turbine power output from rotor diameter, wind speed, and air density. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-dia">Rotor diameter</label><input type="text" id="in-dia" inputmode="decimal" autocomplete="off" placeholder="e.g. 90"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-spd">Wind speed</label><input type="text" id="in-spd" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">m/s</div></div>
<div class="field"><label class="f" for="in-cp">Power coefficient</label><input type="text" id="in-cp" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.4"><div class="unit">0–0.59</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dE=document.getElementById("in-dia"),sE=document.getElementById("in-spd"),cE=document.getElementById("in-cp"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var d=pn(dE.value),s=pn(sE.value),c=pn(cE.value);
if(d==null||s==null||c==null)return;
if(!isFinite(d)||d<=0||!isFinite(s)||s<0){err.textContent="Enter a valid rotor diameter and wind speed.";return}
if(!isFinite(c)||c<=0||c>0.59){err.textContent="Power coefficient must be between 0 and the Betz limit (0.59).";return}
err.textContent="";
var area=Math.PI*d*d/4;
var power=0.5*1.225*area*Math.pow(s,3)*c/1000;
var annual=power*8760*0.35/1000;
var html='<div class="big">'+(Math.round(power))+' kW</div>';
html+=row("Power output",Math.round(power)+' kW');
html+=row("Swept area",Math.round(area)+' m²');
html+=row("Annual energy",Math.round(annual).toLocaleString()+' MWh');
out.innerHTML=html;
}
[dE,sE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
