<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Counticut Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Counticut Calculator</h1>
<p>Calculate how many cut pieces you can get from a stock length given piece length and blade kerf. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sl">Stock length</label><input type="text" id="in-sl" inputmode="decimal" autocomplete="off" placeholder="e.g. 2440"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-pl">Piece length</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-k">Blade kerf</label><input type="text" id="in-k" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter stock length.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var slEl=document.getElementById("in-sl"),plEl=document.getElementById("in-pl"),kEl=document.getElementById("in-k"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var SL=pn(slEl.value),PL=pn(plEl.value),K=pn(kEl.value);
if(SL==null||PL==null){return}
K=K==null?3:K;
if(!isFinite(SL)||!isFinite(PL)||!isFinite(K)||SL<=0||PL<=0||K<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var count=Math.floor(SL/(PL+K));
var used=count*(PL+K);
var waste=SL-used;
var html='<div class="big">'+count+'</div>';
html+=row("Stock length",rnd(SL,0)+" mm");
html+=row("Piece length",rnd(PL,0)+" mm");
html+=row("Blade kerf",rnd(K,1)+" mm");
html+=row("Cut count",count);
html+=row("Material used",rnd(used,0)+" mm");
html+=row("Waste",rnd(waste,0)+" mm");
out.innerHTML=html;
}
[slEl,plEl,kEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
