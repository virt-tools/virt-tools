<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Back Support Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-2824399c.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Back Support Selector</h1>
<p>Calculate recommended back support belt width and type from your waist measurement and lift weight. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Waist measurement</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 34"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-l">Typical lift weight</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">lbs</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
function size(w){
if(w<28)return"XS";
if(w<32)return"S";
if(w<36)return"M";
if(w<40)return"L";
if(w<44)return"XL";
if(w<48)return"XXL";
return"XXXL";
}
var wEl=document.getElementById("in-w"),lEl=document.getElementById("in-l"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),L=pn(lEl.value);
if(W==null||L==null)return;
if(!isFinite(W)||!isFinite(L)||W<=0||L<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var sz=size(W);
var width=L>=50?"Wide (6–8 in)":L>=25?"Medium (4–6 in)":"Standard (3–4 in)";
var susp=L>=50?"Suspender-style recommended":L>=25?"Elastic suspenders optional":"Belt-style adequate";
var html='<div class="big">'+sz+'</div>';
html+=row("Waist",rnd(W,1)+' in');
html+=row("Belt size",sz);
html+=row("Belt width",width);
html+=row("Suspender type",susp);
out.innerHTML=html;
}
[wEl,lEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
