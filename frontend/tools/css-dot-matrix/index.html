<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Dot Matrix Display Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:2rem 1rem;min-height:200px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⚫ CSS Dot Matrix Display Generator</h1>
<p>Create CSS dot matrix LED text display. Adjustable dot size, colors, glow. Copy HTML+CSS+JS.</p>
<div class="controls">
<div class="ctrl-row"><label>Text</label><input type="text" id="text" value="HELLO" style="width:200px" aria-label="Text"></div>
<div class="ctrl-row"><label>Dot Color</label><input type="color" id="dotColor" value="#ff3333" aria-label="Dot Color"></div>
<div class="ctrl-row"><label>Background</label><input type="color" id="bgColor" value="#1a0a0a" aria-label="Bg Color"></div>
<div class="ctrl-row"><label>Dot Size (px)</label><input type="range" id="dotSize" min="3" max="12" value="6" style="width:200px" aria-label="Dot Size"></div>
<div class="ctrl-row"><label>Gap (px)</label><input type="range" id="gap" min="1" max="6" value="2" style="width:200px" aria-label="Gap"></div>
<div class="ctrl-row"><label>Glow</label><select id="glow" aria-label="Glow"><option value="0">None</option><option value="2">Low</option><option value="5" selected>Medium</option><option value="10">High</option></select></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
<h2>JS</h2><div class="output-block"><textarea id="jsOut" readonly aria-label="Js Out"></textarea><button class="copy-btn" onclick="copyText('jsOut')" type="button">Copy JS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var FONT={
'A':['01110','10001','10001','11111','10001','10001','10001'],
'B':['11110','10001','10001','11110','10001','10001','11110'],
'C':['01111','10000','10000','10000','10000','10000','01111'],
'D':['11110','10001','10001','10001','10001','10001','11110'],
'E':['11111','10000','10000','11110','10000','10000','11111'],
'F':['11111','10000','10000','11110','10000','10000','10000'],
'G':['01111','10000','10000','10011','10001','10001','01111'],
'H':['10001','10001','10001','11111','10001','10001','10001'],
'I':['11111','00100','00100','00100','00100','00100','11111'],
'J':['00111','00010','00010','00010','00010','10010','01100'],
'K':['10001','10010','10100','11000','10100','10010','10001'],
'L':['10000','10000','10000','10000','10000','10000','11111'],
'M':['10001','11011','10101','10101','10001','10001','10001'],
'N':['10001','11001','10101','10011','10001','10001','10001'],
'O':['01110','10001','10001','10001','10001','10001','01110'],
'P':['11110','10001','10001','11110','10000','10000','10000'],
'Q':['01110','10001','10001','10001','10101','10010','01101'],
'R':['11110','10001','10001','11110','10100','10010','10001'],
'S':['01111','10000','10000','01110','00001','00001','11110'],
'T':['11111','00100','00100','00100','00100','00100','00100'],
'U':['10001','10001','10001','10001','10001','10001','01110'],
'V':['10001','10001','10001','10001','10001','01010','00100'],
'W':['10001','10001','10001','10101','10101','10101','01010'],
'X':['10001','10001','01010','00100','01010','10001','10001'],
'Y':['10001','10001','01010','00100','00100','00100','00100'],
'Z':['11111','00001','00010','00100','01000','10000','11111'],
' ':['00000','00000','00000','00000','00000','00000','00000'],
'!':['00100','00100','00100','00100','00100','00000','00100'],
'?':['01110','10001','00010','00100','00100','00000','00100'],
'.':['00000','00000','00000','00000','00000','00000','00100'],
'-':['00000','00000','00000','11111','00000','00000','00000']
};
function update(){
var txt=(document.getElementById('text').value||'HELLO').toUpperCase();
var dc=document.getElementById('dotColor').value;
var bc=document.getElementById('bgColor').value;
var ds=parseInt(document.getElementById('dotSize').value);
var gp=parseInt(document.getElementById('gap').value);
var gl=parseInt(document.getElementById('glow').value);
var rows=7;
var html='<div class="dot-matrix" id="dm"></div>';
var css='.dot-matrix{display:grid;grid-auto-flow:column;gap:'+gp+'px;background:'+bc+';padding:'+(ds*2)+'px;border-radius:8px}\n';
css+='.dm-row{display:grid;grid-template-columns:repeat(5,1fr);gap:'+gp+'px;margin-bottom:'+gp+'px}\n';
css+='.dm-dot{width:'+ds+'px;height:'+ds+'px;border-radius:50%;background:'+dc+';';
if(gl>0)css+='box-shadow:0 0 '+(ds*gl/3)+'px '+dc+';';
css+='opacity:1}\n';
css+='.dm-dot.off{opacity:0.08}\n';
var js='var FONT='+JSON.stringify(FONT)+';\n';
js+='var txt='+JSON.stringify(txt)+';\n';
js+='var dm=document.getElementById("dm");\n';
js+='txt.split("").forEach(function(ch){\n';
js+='  var pat=FONT[ch]||FONT["?"];\n';
js+='  for(var r=0;r<7;r++){\n';
js+='    var row=document.createElement("div");\n';
js+='    row.className="dm-row";\n';
js+='    for(var c=0;c<5;c++){\n';
js+='      var d=document.createElement("div");\n';
js+='      d.className="dm-dot"+(pat[r][c]==="1"?"":" off");\n';
js+='      row.appendChild(d);\n';
js+='    }\n';
js+='    dm.appendChild(row);\n';
js+='  }\n';
js+='});';
// render preview
var dm=document.getElementById('preview');
dm.innerHTML='<style>'+css+'</style><div class="dot-matrix" id="dm"></div>';
txt.split('').forEach(function(ch){
var pat=FONT[ch]||FONT['?'];
for(var r=0;r<7;r++){
var row=document.createElement('div');row.className='dm-row';
for(var c=0;c<5;c++){
var d=document.createElement('div');
d.className='dm-dot'+(pat[r][c]==='1'?'':' off');
row.appendChild(d);
}
dm.querySelector('#dm').appendChild(row);
}
});
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('jsOut').value=js;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['text','dotColor','bgColor','dotSize','gap','glow'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
