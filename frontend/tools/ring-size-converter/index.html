<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Size Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Ring Size Converter</h1>
<p class="subtitle">Convert between US, UK, EU, and ISO ring sizes from inner circumference.</p>
<div class="input-section">
<label>Ring Diameter (mm)</label>
<input type="number" id="dia" value="18" min="1" step="0.1" aria-label="Dia">
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const d=parseFloat(document.getElementById('dia').value)||0;
const circ=d*Math.PI;
const usSize=Math.max(0,(circ-36.5)/2.5+1.5);
const ukSize=Math.max('A',String.fromCharCode(65+Math.round((circ-37)/1.25)));
const euSize=circ.toFixed(0);
const isoSize=circ.toFixed(2);
const hkSize=Math.max(1,(d-8)/0.3+1);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Inner Circumference:</span><span>${circ.toFixed(2)} mm</span></div>
<div class="result-row"><span>Inner Diameter:</span><span>${d.toFixed(2)} mm</span></div>
<div class="result-row"><span>US Size:</span><span>${usSize.toFixed(2)} (size ${Math.round(usSize*2)/2})</span></div>
<div class="result-row"><span>UK/AU Size:</span><span>${ukSize}</span></div>
<div class="result-row"><span>EU Size:</span><span>${euSize}</span></div>
<div class="result-row"><span>ISO Size:</span><span>${isoSize} mm circumference</span></div>
<div class="result-row"><span>HK Size:</span><span>${hkSize.toFixed(0)}</span></div>
<div class="result-row"><span>Japan Size:</span><span>${Math.round((d-13)*4+1)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
