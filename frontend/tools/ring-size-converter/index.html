<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Size Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Ring Size Converter</h1>
<p class="subtitle">Estimate ring size from an existing ring's inner diameter.</p>
<div class="input-section">
<label for="dia">Inner diameter (mm)</label>
<input type="number" id="dia" value="18" min="14.1" max="22.2" step="any">
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" role="status" style="display:none;"></div>
<p class="note">Nearest half US size from the <a href="https://4cs.gia.edu/en-us/blog/how-to-determine-ring-size-tips-and-ring-size-chart/">GIA size chart</a>, covering 14.1–22.2 mm. Charts and brands differ; confirm fit with a jeweler. This is not a guaranteed fit or a standards certification.</p>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const chart=[[14.1,3,'F',4],[14.5,3.5,'G',null],[14.9,4,'H',7],[15.3,4.5,'I',8],[15.7,5,'J',9],[16.1,5.5,'K',10],[16.5,6,'L',11],[16.9,6.5,'M',13],[17.3,7,'N',14],[17.7,7.5,'O',15],[18.1,8,'P',16],[18.5,8.5,'Q',17],[19,9,'R',18],[19.4,9.5,'S',19],[19.8,10,'T',20],[20.2,10.5,'U',22],[20.6,11,'V',23],[21,11.5,'W',24],[21.4,12,'X',25],[21.8,12.5,'Y',26],[22.2,13,'Z½',27]];
const input=document.getElementById('dia'),result=document.getElementById('result');
input.addEventListener('input',()=>{result.replaceChildren();result.style.display='none';});
document.getElementById('calc').addEventListener('click',()=>{
const d=Number(input.value);
result.replaceChildren();result.style.display='block';
if(!input.value.trim()||!Number.isFinite(d)||d<14.1||d>22.2){result.textContent='Enter a diameter from 14.1 to 22.2 mm, within the reference chart.';return;}
const circ=d*Math.PI;
const nearest=chart.reduce((best,row)=>Math.abs(row[0]-d)<=Math.abs(best[0]-d)+1e-12?row:best);
[['Inner circumference',circ.toFixed(2)+' mm'],['Inner diameter',d.toFixed(2)+' mm'],['Nearest chart diameter',nearest[0]+' mm'],['US / Canada',nearest[1]],['UK / Australia',nearest[2]],['Circumference-based size (mm)',Math.round(circ)],['Asia (GIA reference)',nearest[3]??'Not listed for this chart row']].forEach(([name,value])=>{const row=document.createElement('div');row.className='result-row';const label=document.createElement('span'),output=document.createElement('span');label.textContent=name;output.textContent=value;row.append(label,output);result.append(row);});
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
