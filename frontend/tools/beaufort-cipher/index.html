<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beaufort Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.bc{max-width:600px;margin:0 auto;padding:2rem 1rem}
.bc h1{font-size:2rem;margin-bottom:.5rem}
.bc .sub{color:#888;margin-bottom:1.5rem}
.bc textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.bc input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.bc .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.bc .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.bc .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.bc label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="bc">
<h1>🔐 Beaufort Cipher</h1>
<p class="sub">A Vigenère variant where the operation is: C = (K - P) mod 26. Self-inverse — encrypt and decrypt are the same operation.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">HELLO WORLD</textarea>
<label for="key">Key:</label>
<input type="text" id="key" value="KEY" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function clean(t){return t.toUpperCase().replace(/[^A-Z]/g,'');}
function beaufort(text,key){
  text=clean(text);key=clean(key);
  let result='';
  for(let i=0;i<text.length;i++){
    const ki=i%key.length;
    result+=String.fromCharCode(((key.charCodeAt(ki)-65)-(text.charCodeAt(i)-65)+26)%26+65);
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const key=document.getElementById('key').value;
  if(!key){document.getElementById('output').textContent='Enter a key';return;}
  document.getElementById('output').textContent=beaufort(text,key);
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
