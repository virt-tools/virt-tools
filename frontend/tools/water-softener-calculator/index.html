<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Softener Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Water Softener Calculator</h1>
<p class="subtitle">Size a water softener based on hardness and daily water usage.</p>
<div class="input-section">
<label>Water Hardness (grains/gallon)</label>
<input type="number" id="hardness" value="10" min="1" step="0.5" aria-label="Hardness">
<label>People in Household</label>
<input type="number" id="people" value="4" min="1" aria-label="People">
<label>Gallons per Person/Day</label>
<input type="number" id="gpd" value="75" min="1" aria-label="Gpd">
<label>Regeneration Every (days)</label>
<input type="number" id="regen" value="7" min="1" aria-label="Regen">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const H=parseFloat(document.getElementById('hardness').value)||0;
const P=parseInt(document.getElementById('people').value)||1;
const G=parseFloat(document.getElementById('gpd').value)||0;
const R=parseInt(document.getElementById('regen').value)||1;
const dailyGrains=H*P*G;
const totalGrains=dailyGrains*R;
const softenerSize=Math.ceil(totalGrains/1000)*1000;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Daily Grains:</span><span>${dailyGrains.toLocaleString(undefined,{maximumFractionDigits:0})} grains/day</span></div>
<div class="result-row"><span>Grains Between Regen:</span><span>${totalGrains.toLocaleString(undefined,{maximumFractionDigits:0})} grains</span></div>
<div class="result-row"><span>Recommended Size:</span><span>${softenerSize.toLocaleString()} grain softener</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
