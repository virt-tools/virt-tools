<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Steel Wool Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Steel Wool Selector</h1>
<p>Choose the right steel wool grade for your task — from coarse stripping to fine polishing. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-task">Task</label><select id="in-task"><option value="">Select…</option><option value="strip">Paint/varnish stripping</option><option value="rust">Rust removal</option><option value="clean">General cleaning</option><option value="prep">Surface prep between coats</option><option value="polish">Fine polishing</option><option value="wood">Wood finishing</option></select><div class="unit">task type</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Select a task to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
var grades={
strip:{grade:"#3 (coarse)",use:"Heavy paint and varnish stripping",grit:"~80 grit equivalent"},
rust:{grade:"#2 (medium-coarse)",use:"Rust removal and heavy cleaning",grit:"~100 grit equivalent"},
clean:{grade:"#0 (medium)",use:"General cleaning and scuffing",grit:"~120 grit equivalent"},
prep:{grade:"#00 (fine)",use:"Surface prep between finish coats",grit:"~180 grit equivalent"},
polish:{grade:"#0000 (super fine)",use:"Final polishing and buffing",grit:"~400+ grit equivalent"},
wood:{grade:"#000 (very fine)",use:"Wood finishing and applying wax",grit:"~240 grit equivalent"}
};
var tEl=document.getElementById("in-task"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var t=tEl.value;
if(!t)return;
err.textContent="";
var g=grades[t];
var html='<div class="big">'+g.grade+'</div>';
html+='<div class="row"><span class="k">Best for</span><span class="v">'+g.use+'</span></div>';
html+='<div class="row"><span class="k">Grit equivalent</span><span class="v">'+g.grit+'</span></div>';
out.innerHTML=html;
}
tEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
