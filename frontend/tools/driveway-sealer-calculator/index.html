<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Driveway Sealer Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Driveway Sealer Calculator</h1>
<p>Calculate the amount of driveway sealer needed based on driveway area and coverage rate. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Driveway length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-w">Driveway width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-coats">Number of coats</label><input type="text" id="in-coats" inputmode="decimal" autocomplete="off" placeholder="2"><div class="unit">coats</div></div>
<div class="field"><label class="f" for="in-rate">Coverage rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="4"><div class="unit">m²/L per coat</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter driveway dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),coatsEl=document.getElementById("in-coats"),rateEl=document.getElementById("in-rate"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),C=pn(coatsEl.value),R=pn(rateEl.value);
if(L==null||W==null){return}
C=C==null?2:C;R=R==null?4:R;
if(!isFinite(L)||!isFinite(W)||!isFinite(C)||!isFinite(R)||L<=0||W<=0||C<=0||R<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var area=L*W;
var totalArea=area*C;
var liters=totalArea/R;
var gallons=liters*0.264172;
var html='<div class="big">'+rnd(liters,1)+' L</div>';
html+=row("Driveway area",rnd(area,1)+" m²");
html+=row("Coats",C);
html+=row("Total coverage",rnd(totalArea,1)+" m²");
html+=row("Sealer needed",rnd(liters,1)+" L ("+rnd(gallons,1)+" gal)");
out.innerHTML=html;
}
[lEl,wEl,coatsEl,rateEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
