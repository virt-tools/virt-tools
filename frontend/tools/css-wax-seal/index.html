<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Wax Seal Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:250px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🔴 CSS Wax Seal Generator</h1>
<p>Create CSS wax seal stamp with initials, adjustable color/size/shape. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Seal Color</label><input type="color" id="sc" value="#8b0000" aria-label="Sc"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="60" max="140" step="5" value="80" style="width:200px" aria-label="Sz"></div>
<div class="ctrl-row"><label>Shape</label><select id="shape" aria-label="Shape"><option value="circle">Circle</option><option value="octagon">Octagon</option><option value="star">Star</option></select></div>
<div class="ctrl-row"><label>Initials</label><input type="text" id="init" value="VS" maxlength="3" aria-label="Init"></div>
<div class="ctrl-row"><label>Font Color</label><input type="color" id="fc" value="#ffd700" aria-label="Fc"></div>
<div class="ctrl-row"><label>3D Depth</label><input type="range" id="depth" min="2" max="10" step="1" value="5" style="width:200px" aria-label="Depth"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var sc=document.getElementById('sc').value;
var sz=document.getElementById('sz').value;
var shape=document.getElementById('shape').value;
var init=document.getElementById('init').value;
var fc=document.getElementById('fc').value;
var depth=parseInt(document.getElementById('depth').value);
var clip=shape==='circle'?'circle(50%)':shape==='octagon'?'polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)':'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';
var html='<div class="wax-seal">\n  <span class="seal-text">'+init+'</span>\n</div>';
var css='.wax-seal{width:'+sz+'px;height:'+sz+'px;background:radial-gradient(circle at 30% 30%,'+sc+'ee,'+sc+' 70%);border-radius:'+(shape==='circle'?'50%':'12px')+';clip-path:'+clip+';display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -'+depth+'px '+depth*2+'px rgba(0,0,0,0.4),inset 0 '+depth+'px '+depth*2+'px rgba(255,255,255,0.15),0 4px 8px rgba(0,0,0,0.3);position:relative}\n';
css+='.seal-text{color:'+fc+';font-family:Georgia,serif;font-weight:bold;font-size:'+(sz*0.3)+'px;text-shadow:1px 1px 2px rgba(0,0,0,0.5);letter-spacing:2px;text-transform:uppercase}\n';
css+='.wax-seal::after{content:"";position:absolute;inset:8px;border:2px solid '+fc+'44;border-radius:'+(shape==='circle'?'50%':'8px')+';clip-path:'+clip+'}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['sc','sz','shape','init','fc','depth'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
