<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Asphalt Tonnage Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Asphalt Tonnage Calculator</h1>
<p>Calculate asphalt tonnage from area, thickness, and density. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">m²</div></div>
<div class="field"><label class="f" for="in-t">Thickness</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-d">Density</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="2400"><div class="unit">kg/m³</div></div>
<div class="field"><label class="f" for="in-waste">Waste %</label><input type="text" id="in-waste" inputmode="decimal" autocomplete="off" placeholder="5"><div class="unit">% extra</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter area and thickness.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),tEl=document.getElementById("in-t"),dEl=document.getElementById("in-d"),wsEl=document.getElementById("in-waste"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),T=pn(tEl.value),D=pn(dEl.value),WS=pn(wsEl.value);
if(A==null||T==null){return}
D=D==null?2400:D;WS=WS==null?5:WS;
if(!isFinite(A)||!isFinite(T)||!isFinite(D)||!isFinite(WS)||A<=0||T<=0||D<=0||WS<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vol=A*T;
var mass=vol*D;
var total=mass*(1+WS/100);
var tons=total/1000;
var html='<div class="big">'+rnd(tons,1)+' t</div>';
html+=row("Area",rnd(A,1)+" m²");
html+=row("Thickness",rnd(T,3)+" m");
html+=row("Volume",rnd(vol,2)+" m³");
html+=row("Density",rnd(D,0)+" kg/m³");
html+=row("Mass (+"+rnd(WS,0)+"% waste)",rnd(tons,1)+" tonnes");
out.innerHTML=html;
}
[aEl,tEl,dEl,wsEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
