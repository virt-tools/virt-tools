<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to YAML Front Matter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Markdown to YAML Front Matter</h1>
<p class="subtitle">Extract YAML front matter from Markdown files and convert between them.</p>
<div class="input-section">
<label>Markdown Input</label>
<textarea id="input" rows="8" placeholder='---\ntitle: Hello\n---\n# Content' aria-label="\Ntitle: Hello\N   \N# Content"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Extract</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function section(title,value){const wrap=document.createDocumentFragment(),heading=document.createElement('h3'),output=document.createElement('textarea');heading.textContent=title;output.rows=6;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label',title);output.value=value;wrap.append(heading,output);return wrap;}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
if(m){
document.getElementById('result').replaceChildren(section('YAML Front Matter',m[1]),section('Body',m[2]));
}else{
const note=document.createElement('p');note.style.color='orange';note.textContent='No YAML front matter found (--- delimited block at start).';document.getElementById('result').replaceChildren(note);
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
