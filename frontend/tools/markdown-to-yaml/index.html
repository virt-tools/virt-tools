<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to YAML Front Matter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Markdown to YAML Front Matter</h1>
<p class="subtitle">Extract YAML front matter from Markdown files and convert between them.</p>
<div class="input-section">
<label>Markdown Input</label>
<textarea id="input" rows="8" placeholder='---\ntitle: Hello\n---\n# Content' aria-label="\Ntitle: Hello\N   \N# Content"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Extract</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
if(m){
document.getElementById('result').innerHTML='<h3>YAML Front Matter</h3><textarea rows="6" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+m[1]+'</textarea><h3>Body</h3><textarea rows="6" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+m[2]+'</textarea>';
}else{
document.getElementById('result').innerHTML='<p style="color:orange;">No YAML front matter found (--- delimited block at start).</p>';
}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
