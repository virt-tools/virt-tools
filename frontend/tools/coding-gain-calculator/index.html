<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Coding Gain Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Coding Gain Calculator</h1>
<p>Estimate coding gain in dB as the difference between the SNR an uncoded system needs and the SNR a coded system needs at the same target error rate. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-unc">Uncoded SNR</label><input type="text" id="in-unc" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">dB</div></div>
<div class="field"><label class="f" for="in-cod">Coded SNR</label><input type="text" id="in-cod" inputmode="decimal" autocomplete="off" placeholder="e.g. 7"><div class="unit">dB</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var uE=document.getElementById("in-unc"),cE=document.getElementById("in-cod"),err=document.getElementById("err"),out=document.getElementById("out");
function reset(){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>'}
function calc(){
var u=parseFloat(uE.value),c=parseFloat(cE.value);
err.textContent="";
if(isNaN(u)||isNaN(c)){reset();return}
if(!isFinite(u)||!isFinite(c)){err.textContent="Enter valid numeric SNR values.";reset();return}
var gain=u-c;
var html='<div class="big">'+(Math.round(gain*100)/100)+' dB</div>';
html+=row("Coding gain",Math.round(gain*100)/100+' dB');
html+=row("Uncoded SNR",u+' dB');
html+=row("Coded SNR",c+' dB');
var quality=gain>3?"Strong":gain>1?"Moderate":"Minimal";
html+=row("Coding strength",quality);
out.innerHTML=html;
}
[uE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
