<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Neutral Bar Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Neutral Bar Selector</h1>
<p>Calculate the minimum neutral bar terminal count for a panel based on branch circuit count and service configuration. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cc">Circuit count</label><input type="text" id="in-cc" inputmode="numeric" autocomplete="off" placeholder="e.g. 40"><div class="unit">circuits</div></div>
<div class="field"><label class="f" for="in-ph">Phase</label><input type="text" id="in-ph" inputmode="numeric" autocomplete="off" placeholder="1 or 3"><div class="unit">phase</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cEl=document.getElementById("in-cc"),pEl=document.getElementById("in-ph"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Cc=pn(cEl.value),Ph=pn(pEl.value);
if(Cc==null||Ph==null)return;
if(!isFinite(Cc)||Cc<=0||!isFinite(Ph)||(Ph!==1&&Ph!==3)){err.textContent="Enter circuit count and phase (1 or 3).";return}
err.textContent="";
var neutralCount=Math.ceil(Cc*(Ph===3?0.4:0.5));
var spare=Math.ceil(neutralCount*0.2);
var total=neutralCount+spare;
var html='<div class="big">'+total+' terminals</div>';
html+=row("Neutral terminals needed",neutralCount);
html+=row("Spare terminals (20%)",spare);
html+=row("Total terminals",total);
html+=row("Circuit count",Cc);
html+=row("Phase",Ph+(Ph===1?" (single)":" (three)"));
out.innerHTML=html;
}
[cEl,pEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
