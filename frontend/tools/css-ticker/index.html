<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS News Ticker Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#1a1a2e;border-radius:12px;padding:1rem;min-height:80px;overflow:hidden}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>📰 CSS News Ticker Generator</h1>
<p>Create CSS news ticker / scrolling text bar. 4 styles, adjustable speed, direction, colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Style</label><select id="style" aria-label="Style"><option value="breaking">Breaking News</option><option value="simple">Simple Scroll</option><option value="boxed">Boxed Items</option><option value="dual">Dual Direction</option></select></div>
<div class="ctrl-row"><label>Items (|)</label><input type="text" id="items" value="Breaking: New tool added|Weather: Sunny 72F|Sports: Team wins 3-1|Tech: New release v2.0" style="width:350px" aria-label="Items"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="5" max="60" step="1" value="20" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Direction</label><select id="dir" aria-label="Dir"><option value="left">Left</option><option value="right">Right</option></select></div>
<div class="ctrl-row"><label>Label Text</label><input type="text" id="label" value="BREAKING" style="width:150px" aria-label="Label"></div>
<div class="ctrl-row"><label>Label Color</label><input type="color" id="lcolor" value="#e74c3c" aria-label="Lcolor"></div>
<div class="ctrl-row"><label>Text Color</label><input type="color" id="tcolor" value="#ffffff" aria-label="Tcolor"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#1a1a2e" aria-label="Bgcolor"></div>
<div class="ctrl-row"><label>Font Size</label><input type="range" id="fsize" min="12" max="32" value="18" style="width:200px" aria-label="Fsize"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var st=document.getElementById('style').value;
var items=document.getElementById('items').value.split('|').map(function(s){return s.trim()}).filter(Boolean);
var sp=parseFloat(document.getElementById('speed').value);
var dr=document.getElementById('dir').value;
var lb=document.getElementById('label').value;
var lc=document.getElementById('lcolor').value;
var tc=document.getElementById('tcolor').value;
var bg=document.getElementById('bgcolor').value;
var fs=parseInt(document.getElementById('fsize').value);
var itemsHTML=items.map(function(it){return '<span class="tk-item">'+it+'</span><span class="tk-sep">•</span>'}).join('');
var html='<div class="tk-bar"><span class="tk-label">'+lb+'</span><div class="tk-scroll"><div class="tk-track">'+itemsHTML+itemsHTML+'</div></div></div>';
var css='.tk-bar{display:flex;align-items:center;background:'+bg+';border-radius:8px;overflow:hidden;font-size:'+fs+'px;font-family:sans-serif}\n';
css+='.tk-label{background:'+lc+';color:#fff;font-weight:700;padding:.5rem 1rem;white-space:nowrap;text-transform:uppercase;letter-spacing:1px;font-size:'+(fs-2)+'px}\n';
css+='.tk-scroll{overflow:hidden;flex:1;position:relative}\n';
css+='.tk-track{display:inline-flex;align-items:center;white-space:nowrap;animation:tk-scroll '+sp+'s linear infinite}\n';
css+='@keyframes tk-scroll{0%{transform:translateX('+(dr==='left'?'0':'-50%')+')}100%{transform:translateX('+(dr==='left'?'-50%':'0')+')}}\n';
css+='.tk-item{color:'+tc+';padding:0 1rem;display:inline-block}\n';
css+='.tk-sep{color:'+lc+';opacity:.6}\n';
if(st==='simple'){
html='<div class="tk-bar"><div class="tk-scroll"><div class="tk-track">'+itemsHTML+itemsHTML+'</div></div></div>';
css='.tk-bar{display:flex;background:'+bg+';border-radius:8px;overflow:hidden;font-size:'+fs+'px;font-family:sans-serif;padding:.3rem 0}\n';
css+='.tk-scroll{overflow:hidden;flex:1;position:relative}\n';
css+='.tk-track{display:inline-flex;align-items:center;white-space:nowrap;animation:tk-scroll '+sp+'s linear infinite}\n';
css+='@keyframes tk-scroll{0%{transform:translateX('+(dr==='left'?'0':'-50%')+')}100%{transform:translateX('+(dr==='left'?'-50%':'0')+')}}\n';
css+='.tk-item{color:'+tc+';padding:0 1rem;display:inline-block}\n';
css+='.tk-sep{color:'+lc+';opacity:.4}\n';
}else if(st==='boxed'){
html='<div class="tk-bar"><span class="tk-label">'+lb+'</span><div class="tk-scroll"><div class="tk-track">'+items.map(function(it){return '<span class="tk-box">'+it+'</span>'}).join('')+items.map(function(it){return '<span class="tk-box">'+it+'</span>'}).join('')+'</div></div></div>';
css='.tk-bar{display:flex;align-items:center;background:'+bg+';border-radius:8px;overflow:hidden;font-size:'+fs+'px;font-family:sans-serif;padding:.3rem}\n';
css+='.tk-label{background:'+lc+';color:#fff;font-weight:700;padding:.5rem 1rem;border-radius:6px;white-space:nowrap;text-transform:uppercase;font-size:'+(fs-2)+'px;margin-right:.5rem}\n';
css+='.tk-scroll{overflow:hidden;flex:1;position:relative}\n';
css+='.tk-track{display:inline-flex;gap:.8rem;white-space:nowrap;animation:tk-scroll '+sp+'s linear infinite}\n';
css+='@keyframes tk-scroll{0%{transform:translateX('+(dr==='left'?'0':'-50%')+')}100%{transform:translateX('+(dr==='left'?'-50%':'0')+')}}\n';
css+='.tk-box{color:'+tc+';padding:.3rem .8rem;border:1px solid '+lc+';border-radius:6px;display:inline-block}\n';
}else if(st==='dual'){
html='<div class="tk-bar"><div class="tk-scroll"><div class="tk-track tk-l">'+itemsHTML+itemsHTML+'</div></div><div class="tk-scroll"><div class="tk-track tk-r">'+itemsHTML+itemsHTML+'</div></div></div>';
css='.tk-bar{display:flex;flex-direction:column;gap:.2rem;background:'+bg+';border-radius:8px;overflow:hidden;font-size:'+fs+'px;font-family:sans-serif;padding:.3rem}\n';
css+='.tk-scroll{overflow:hidden;flex:1;position:relative}\n';
css+='.tk-track{display:inline-flex;align-items:center;white-space:nowrap}\n';
css+='.tk-l{animation:tk-l '+sp+'s linear infinite}\n';
css+='.tk-r{animation:tk-r '+(sp*1.3)+'s linear infinite}\n';
css+='@keyframes tk-l{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}\n';
css+='@keyframes tk-r{0%{transform:translateX(-50%)}100%{transform:translateX(0)}}\n';
css+='.tk-item{color:'+tc+';padding:0 1rem;display:inline-block}\n';
css+='.tk-sep{color:'+lc+';opacity:.4}\n';
}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['style','items','speed','dir','label','lcolor','tcolor','bgcolor','fsize'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
