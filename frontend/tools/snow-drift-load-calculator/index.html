<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Snow Drift Load Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Snow Drift Load Calculator</h1>
<p>Calculate snow drift surcharge, drift height, and total snow load on lower roofs from ground snow load and height difference. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-pg">Ground snow load</label><input type="text" id="in-pg" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">psf</div></div>
<div class="field"><label class="f" for="in-hd">Height difference</label><input type="text" id="in-hd" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-lu">Upper roof length</label><input type="text" id="in-lu" inputmode="numeric" autocomplete="off" placeholder="e.g. 50"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pgEl=document.getElementById("in-pg"),hdEl=document.getElementById("in-hd"),luEl=document.getElementById("in-lu"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var PG=parseFloat(pgEl.value),HD=parseFloat(hdEl.value),LU=parseInt(luEl.value);
if(isNaN(PG)||isNaN(HD)||isNaN(LU))return;
if(PG<=0||HD<=0||LU<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var pf=0.7*PG;
var gamma=0.13*PG+14;
var hd=Math.min(HD,0.75*Math.sqrt(LU));
var driftHd=gamma*hd/(pf);
var ws=0.5*driftHd;
var pd=pf+driftHd*gamma/Math.max(ws,1);
var html='<div class="big">'+Math.round(pd*10)/10+' psf</div>';
html+=row("Flat roof load pf",Math.round(pf*10)/10+' psf');
html+=row("Snow density",Math.round(gamma*10)/10+' pcf');
html+=row("Drift height",Math.round(driftHd*100)/100+' ft');
html+=row("Drift width",Math.round(ws*10)/10+' ft');
html+=row("Peak drift load",Math.round(pd*10)/10+' psf');
out.innerHTML=html;
}
[pgEl,hdEl,luEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
