<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text ↔ Binary Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Text ↔ Binary Converter</h1>
<p class="subtitle">Convert text to binary (8-bit ASCII), hex, octal, and decimal representations. Convert binary back to text. Toggle separator and encoding options.</p>
<div class="controls" style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
<label>Separator <select id="sep"><option value=" ">Space</option><option value="">None</option><option value="\n">Newline</option><option value="-">Dash</option></select></label>
<label><input type="checkbox" id="prefix0b"> 0b prefix</label>
<label><input type="checkbox" id="uppercase"> Uppercase hex</label>
</div>
<div style="display:flex;gap:2rem;flex-wrap:wrap;">
<div style="flex:1;min-width:300px;">
<label><strong>Text Input</strong></label>
<textarea id="textInput" rows="6" style="width:100%;font-family:monospace;" placeholder="Type text here..." aria-label="Type Text Here...">Hello World</textarea>
</div>
<div style="flex:1;min-width:300px;">
<label><strong>Binary Input</strong></label>
<textarea id="binaryInput" rows="6" style="width:100%;font-family:monospace;" placeholder="Paste binary here..." aria-label="Paste Binary Here..."></textarea>
</div>
</div>
<div style="margin-top:1rem;">
<button class="btn" id="toBinary" type="button">Text → Binary</button>
<button class="btn" id="toHex" type="button">Text → Hex</button>
<button class="btn" id="toOctal" type="button">Text → Octal</button>
<button class="btn" id="toDecimal" type="button">Text → Decimal</button>
<button class="btn" id="toText" type="button">Binary → Text</button>
</div>
<div id="output" style="margin-top:1.5rem;"></div>
<div id="error" style="color:red;margin-top:1rem;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const textInput = document.getElementById('textInput');
const binaryInput = document.getElementById('binaryInput');
const output = document.getElementById('output');
const errorEl = document.getElementById('error');
const sepEl = document.getElementById('sep');
const prefix0b = document.getElementById('prefix0b');
const uppercase = document.getElementById('uppercase');
function getSep() {
  const v = sepEl.value;
  if (v === '\\n') return '\n';
  return v;
}
function textToBase(text, radix, padLen) {
  const sep = getSep();
  const prefix = prefix0b.checked ? '0b' : '';
  return text.split('').map(ch => {
    const code = ch.charCodeAt(0);
    let str = code.toString(radix).padStart(padLen, '0');
    if (radix === 16 && uppercase.checked) str = str.toUpperCase();
    return prefix + str;
  }).join(sep);
}
function binaryToText(input) {
  const sep = getSep();
  const cleaned = input.replace(/0b/gi, '').trim();
  const parts = sep ? cleaned.split(sep) : cleaned.match(/.{1,8}/g) || [];
  let result = '';
  for (const part of parts) {
    const code = parseInt(part.trim(), 2);
    if (isNaN(code)) throw new Error('Invalid binary: ' + part);
    result += String.fromCharCode(code);
  }
  return result;
}
document.getElementById('toBinary').onclick = () => {
  errorEl.textContent = '';
  output.innerHTML = '<h3>Binary</h3><pre class="result-box">' + textToBase(textInput.value, 2, 8) + '</pre>';
};
document.getElementById('toHex').onclick = () => {
  errorEl.textContent = '';
  output.innerHTML = '<h3>Hexadecimal</h3><pre class="result-box">' + textToBase(textInput.value, 16, 2) + '</pre>';
};
document.getElementById('toOctal').onclick = () => {
  errorEl.textContent = '';
  output.innerHTML = '<h3>Octal</h3><pre class="result-box">' + textToBase(textInput.value, 8, 3) + '</pre>';
};
document.getElementById('toDecimal').onclick = () => {
  errorEl.textContent = '';
  output.innerHTML = '<h3>Decimal</h3><pre class="result-box">' + textToBase(textInput.value, 10, 3) + '</pre>';
};
document.getElementById('toText').onclick = () => {
  errorEl.textContent = '';
  try {
    output.innerHTML = '<h3>Text</h3><pre class="result-box">' + binaryToText(binaryInput.value).replace(/</g,'&lt;') + '</pre>';
  } catch(e) {
    errorEl.textContent = e.message;
  }
};
})();
</script>
<style>
.btn{padding:.5rem 1rem;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;cursor:pointer;font-weight:600;margin-right:.5rem;}
.btn:hover{background:#00d4ff;color:#fff;border-color:#00d4ff;}
.result-box{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:1rem;font-family:monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all;overflow-x:auto;}
.controls label{display:inline-flex;align-items:center;gap:.25rem;font-size:.9rem;}
</style>
</body>
</html>
