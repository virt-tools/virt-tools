<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>SWR Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>SWR Calculator</h1>
<p>Calculate Standing Wave Ratio from forward and reflected power. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-pf">Forward power</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-pr">Reflected power</label><input type="text" id="in-pr" inputmode="decimal" autocomplete="off" placeholder="e.g. 5"><div class="unit">watts</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pfE=document.getElementById("in-pf"),prE=document.getElementById("in-pr"),out=document.getElementById("out");
function msg(t){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">'+t+'</span>';}
function calc(){
var pf=parseFloat(pfE.value),pr=parseFloat(prE.value);
if(isNaN(pf)||isNaN(pr)){msg("Enter forward and reflected power.");return;}
if(!isFinite(pf)||!isFinite(pr)){msg("Values are too large.");return;}
if(pf<=0){msg("Forward power must be greater than zero.");return;}
if(pr<0){msg("Reflected power cannot be negative.");return;}
if(pr>pf){msg("Reflected power cannot exceed forward power.");return;}
if(pr===pf){msg("Total reflection: the SWR is infinite.");return;}
var gamma=Math.sqrt(pr/pf);
var swr=(1+gamma)/(1-gamma);
var rlTxt=gamma===0?'∞ dB':(Math.round(Math.abs(20*Math.log(gamma)/Math.log(10))*100)/100)+' dB';
var html='<div class="big">'+(Math.round(swr*100)/100)+':1</div>';
html+=row("SWR",Math.round(swr*100)/100+':1');
html+=row("Reflection coefficient",Math.round(gamma*1000)/1000);
html+=row("Return loss",rlTxt);
html+=row("Forward power",pf+' W');
html+=row("Reflected power",pr+' W');
out.innerHTML=html;
}
[pfE,prE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
