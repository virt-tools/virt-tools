<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Clock — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Binary Clock</h1>
<p class="subtitle">Live binary-coded clock with LED-style display. Toggle BCD vs pure binary mode, 12/24-hour format, and dot/number display.</p>
<div class="controls" style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;">
<label><input type="radio" name="mode" value="bcd" checked> BCD (per-digit)</label>
<label><input type="radio" name="mode" value="pure"> Pure Binary</label>
<label><input type="radio" name="fmt" value="24" checked> 24-hour</label>
<label><input type="radio" name="fmt" value="12"> 12-hour</label>
<label><input type="checkbox" id="showNums"> Show numbers</label>
</div>
<div id="clock"></div>
<div id="digitalTime" style="font-family:monospace;font-size:2rem;margin-top:2rem;text-align:center;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const clockEl = document.getElementById('clock');
const digitalEl = document.getElementById('digitalTime');
function buildClock() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  let html = '';
  if (mode === 'bcd') {
    const labels = ['Hours', 'Minutes', 'Seconds'];
    for (let col = 0; col < 3; col++) {
      html += '<div class="clock-col"><div class="col-label">' + labels[col] + '</div>';
      for (let digit = 0; digit < 2; digit++) {
        html += '<div class="digit-group">';
        for (let bit = 3; bit >= 0; bit--) {
          html += '<div class="bit-row" id="bcd-' + col + '-' + digit + '-' + bit + '"><div class="bit-led"></div><span class="bit-val">' + (1 << bit) + '</span></div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
  } else {
    const labels = ['Hours', 'Minutes', 'Seconds'];
    const bits = [5, 6, 6];
    for (let col = 0; col < 3; col++) {
      html += '<div class="clock-col"><div class="col-label">' + labels[col] + '</div>';
      html += '<div class="digit-group pure">';
      for (let bit = bits[col] - 1; bit >= 0; bit--) {
        html += '<div class="bit-row" id="pure-' + col + '-' + bit + '"><div class="bit-led"></div><span class="bit-val">' + (1 << bit) + '</span></div>';
      }
      html += '</div></div>';
    }
  }
  clockEl.innerHTML = html;
}
function update() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  let h12 = h;
  let ampm = 'AM';
  if (document.querySelector('input[name="fmt"]:checked').value === '12') {
    ampm = h >= 12 ? 'PM' : 'AM';
    h12 = h % 12 || 12;
  } else {
    h12 = h;
  }
  const showNums = document.getElementById('showNums').checked;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  if (mode === 'bcd') {
    const vals = [h12, m, s];
    for (let col = 0; col < 3; col++) {
      const v = vals[col];
      const d0 = Math.floor(v / 10);
      const d1 = v % 10;
      for (let bit = 0; bit < 4; bit++) {
        const r0 = document.getElementById('bcd-' + col + '-0-' + bit);
        const r1 = document.getElementById('bcd-' + col + '-1-' + bit);
        if (r0) {
          const on = (d0 >> bit) & 1;
          r0.querySelector('.bit-led').className = 'bit-led' + (on ? ' on' : '');
          r0.querySelector('.bit-val').style.opacity = showNums ? '1' : '0';
        }
        if (r1) {
          const on = (d1 >> bit) & 1;
          r1.querySelector('.bit-led').className = 'bit-led' + (on ? ' on' : '');
          r1.querySelector('.bit-val').style.opacity = showNums ? '1' : '0';
        }
      }
    }
  } else {
    const vals = [h12, m, s];
    const bits = [5, 6, 6];
    for (let col = 0; col < 3; col++) {
      const v = vals[col];
      for (let bit = 0; bit < bits[col]; bit++) {
        const r = document.getElementById('pure-' + col + '-' + bit);
        if (r) {
          const on = (v >> bit) & 1;
          r.querySelector('.bit-led').className = 'bit-led' + (on ? ' on' : '');
          r.querySelector('.bit-val').style.opacity = showNums ? '1' : '0';
        }
      }
    }
  }
  digitalEl.textContent = String(h12).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + (document.querySelector('input[name="fmt"]:checked').value === '12' ? ' ' + ampm : '');
}
buildClock();
update();
setInterval(update, 1000);
document.querySelectorAll('input').forEach(el => el.addEventListener('change', () => { buildClock(); update(); }));
})();
</script>
<style>
.clock-col{display:inline-block;margin:0 1rem;vertical-align:top;}
.col-label{text-align:center;font-weight:700;margin-bottom:.5rem;font-size:.9rem;opacity:.7;}
.digit-group{display:inline-block;margin:0 .25rem;}
.bit-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;}
.bit-led{width:24px;height:24px;border-radius:50%;background:#1a1a2e;border:2px solid #333;transition:all .2s;box-shadow:inset 0 0 4px rgba(0,0,0,.5);}
.bit-led.on{background:#00ff41;box-shadow:0 0 12px #00ff41, inset 0 0 4px rgba(0,255,65,.5);border-color:#00ff41;}
.bit-val{font-family:monospace;font-size:.75rem;opacity:0;transition:opacity .2s;width:2ch;text-align:right;}
.controls{font-size:.9rem;}
.controls label{cursor:pointer;display:inline-flex;align-items:center;gap:.25rem;}
#clock{text-align:center;padding:1.5rem;}
</style>
</body>
</html>
