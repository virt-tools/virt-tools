<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Pile Capacity Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Pile Capacity Calculator</h1>
<p>Calculate ultimate axial capacity of a single pile from shaft friction, end bearing, pile diameter, and embedment length. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Pile diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.5"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-l">Embedment length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-fs">Shaft friction</label><input type="text" id="in-fs" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">psf</div></div>
<div class="field"><label class="f" for="in-qb">End bearing</label><input type="text" id="in-qb" inputmode="numeric" autocomplete="off" placeholder="e.g. 10000"><div class="unit">psf</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),lEl=document.getElementById("in-l"),fsEl=document.getElementById("in-fs"),qbEl=document.getElementById("in-qb"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=parseFloat(dEl.value),L=parseFloat(lEl.value),FS=parseFloat(fsEl.value),QB=parseInt(qbEl.value);
if(isNaN(D)||isNaN(L)||isNaN(FS)||isNaN(QB))return;
if(D<=0||L<=0||FS<0||QB<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=Math.PI*D*D/4;
var Qs=FS*Math.PI*D*L;
var Qb=QB*area;
var Qu=Qs+Qb;
var Qa=Qu/2;
var html='<div class="big">'+Math.round(Qa/1000*10)/10+' kips</div>';
html+=row("Shaft resistance Qs",Math.round(Qs/1000*10)/10+' kips');
html+=row("End bearing Qb",Math.round(Qb/1000*10)/10+' kips');
html+=row("Ultimate capacity Qu",Math.round(Qu/1000*10)/10+' kips');
html+=row("Allowable (FS=2)",Math.round(Qa/1000*10)/10+' kips');
out.innerHTML=html;
}
[dEl,lEl,fsEl,qbEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
