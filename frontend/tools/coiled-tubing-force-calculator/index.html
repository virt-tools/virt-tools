<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Coiled Tubing Force Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-7afe1a35.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Coiled Tubing Force Calculator</h1>
<p>Calculate coiled tubing axial force, helical buckling threshold, and lock-up depth from tubing size and wellbore deviation. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-od">Tubing OD</label><input type="text" id="in-od" inputmode="decimal" autocomplete="off" placeholder="e.g. 1.75"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-wt">Wall thickness</label><input type="text" id="in-wt" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.134"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-dep">Depth</label><input type="text" id="in-dep" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">ft</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var odE=document.getElementById("in-od"),wtE=document.getElementById("in-wt"),depE=document.getElementById("in-dep"),out=document.getElementById("out");
function calc(){
var od=parseFloat(odE.value),wt=parseFloat(wtE.value),dep=parseFloat(depE.value);
if(isNaN(od)||isNaN(wt)||isNaN(dep))return;
var id=od-2*wt;
var area=Math.PI*(Math.pow(od/2,2)-Math.pow(id/2,2));
var weight=area*0.283*12;
var axialForce=weight*dep;
var bucklingThresh=Math.PI*Math.sqrt(3e7*0.0625*Math.pow(od,4)/(2*weight));
var html='<div class="big">'+Math.round(axialForce).toLocaleString()+' lb</div>';
html+=row("Axial force at depth",Math.round(axialForce).toLocaleString()+' lb');
html+=row("Buckling threshold",Math.round(bucklingThresh).toLocaleString()+' lb');
html+=row("Tubing weight",Math.round(weight*100)/100+' lb/ft');
out.innerHTML=html;
}
[odE,wtE,depE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
