<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Load Flow Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Load Flow Calculator</h1>
<p>Simple two-bus load flow: calculate receiving end voltage, line loss, and efficiency from sending voltage, line impedance, and load. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vs">Sending voltage</label><input type="text" id="in-vs" inputmode="decimal" autocomplete="off" placeholder="e.g. 12000"><div class="unit">V</div></div>
<div class="field"><label class="f" for="in-r">Line resistance</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-x">Line reactance</label><input type="text" id="in-x" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">Ω</div></div>
<div class="field"><label class="f" for="in-pl">Load power</label><input type="text" id="in-pl" inputmode="decimal" autocomplete="off" placeholder="e.g. 1000"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-pf">Load PF</label><input type="text" id="in-pf" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.9"><div class="unit">cos φ</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var vsE=document.getElementById("in-vs"),rE=document.getElementById("in-r"),xE=document.getElementById("in-x"),plE=document.getElementById("in-pl"),pfE=document.getElementById("in-pf"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var vs=parseFloat(vsE.value),r=parseFloat(rE.value),x=parseFloat(xE.value),pl=parseFloat(plE.value),pf=parseFloat(pfE.value);
if(isNaN(vs)||isNaN(r)||isNaN(x)||isNaN(pl)||isNaN(pf))return;
if(vs<=0||pl<=0||r<0||x<0||pf<=0||pf>1){err.textContent="Voltage, power, and PF must be positive (PF ≤ 1); impedances must be non-negative.";return}
err.textContent="";
var plW=pl*1000;
var q=plW*Math.tan(Math.acos(pf));
var s=Math.sqrt(plW*plW+q*q);
var i=s/vs;
var loss=i*i*r;
var eff=plW/(plW+loss)*100;
var phi=Math.acos(pf);
var vr=vs-i*(r*Math.cos(phi)+x*Math.sin(phi));
var html='<div class="big">'+(Math.round(vr)/1000).toFixed(2)+' kV</div>';
html+=row("Receiving voltage",Math.round(vr)+' V');
html+=row("Line current",Math.round(i*10)/10+' A');
html+=row("Line loss",Math.round(loss)+' W');
html+=row("Efficiency",Math.round(eff*100)/100+'%');
out.innerHTML=html;
}
[vsE,rE,xE,plE,pfE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
