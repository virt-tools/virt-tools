<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Minifier — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Minifier</h1>
<p class="subtitle">Minify JSON by removing whitespace. Also shows size reduction percentage.</p>
<div class="input-section">
<label>Input JSON</label>
<textarea id="input" rows="10" placeholder='{"key": "value"}' aria-label="{"></textarea>
<button id="minify" class="primary-btn" type="button">Minify</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div id="stats" style="display:none;margin-bottom:1em;"></div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('minify').addEventListener('click',()=>{
const input=document.getElementById('input').value;
try{const parsed=JSON.parse(input);const minified=JSON.stringify(parsed);
const origSize=new Blob([input]).size;const minSize=new Blob([minified]).size;
const saved=((1-minSize/origSize)*100).toFixed(1);
document.getElementById('stats').innerHTML='<p>Original: '+origSize+' bytes → Minified: '+minSize+' bytes ('+saved+'% smaller)</p>';
document.getElementById('stats').style.display='block';
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;word-break:break-all;border:1px solid #ccc;padding:1em;max-height:300px;overflow:auto">'+minified.replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=minified;
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Error: '+e.message+'</p>';document.getElementById('result').style.display='block';document.getElementById('stats').style.display='none';}
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
