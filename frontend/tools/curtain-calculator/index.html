<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curtain Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Curtain & Drapery Calculator</h1>
<p class="subtitle">Calculate fabric needed, pleats, and rod width for custom curtains.</p>
<div class="input-section">
<label>Window Width (inches)</label>
<input type="number" id="winW" value="48" min="1" aria-label="Win W">
<label>Window Height (inches)</label>
<input type="number" id="winH" value="60" min="1" aria-label="Win H">
<label>Fullness Ratio</label>
<select id="fullness" aria-label="Fullness">
<option value="1.5">1.5× (Sheer)</option>
<option value="2" selected>2× (Standard)</option>
<option value="2.5">2.5× (Luxurious)</option>
<option value="3">3× (Pencil Pleat)</option>
</select>
<label>Header Type</label>
<select id="header" aria-label="Header">
<option value="4">Rod Pocket (4" header)</option>
<option value="6" selected>Grommet (6" header)</option>
<option value="8">Pinch Pleat (8" header)</option>
</select>
<label>Fabric Width (inches)</label>
<input type="number" id="fabW" value="54" min="20" aria-label="Fab W">
<label>Hem Allowance (inches)</label>
<input type="number" id="hem" value="4" min="1" step="0.5" aria-label="Hem">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const wW=parseFloat(document.getElementById('winW').value)||0;
const wH=parseFloat(document.getElementById('winH').value)||0;
const F=parseFloat(document.getElementById('fullness').value);
const H=parseFloat(document.getElementById('header').value);
const fW=parseFloat(document.getElementById('fabW').value)||0;
const hem=parseFloat(document.getElementById('hem').value)||0;
const rodW=wW+12;
const totalFabricW=rodW*F;
const panels=Math.ceil(totalFabricW/fW);
const cutLength=wH+H+hem*2;
const totalYards=(panels*cutLength)/36;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Window Size:</span><span>${wW}" × ${wH}"</span></div>
<div class="result-row"><span>Recommended Rod Width:</span><span>${rodW}" (${(rodW/12).toFixed(1)} ft)</span></div>
<div class="result-row"><span>Fullness:</span><span>${F}×</span></div>
<div class="result-row"><span>Total Fabric Width Needed:</span><span>${totalFabricW.toFixed(0)}"</span></div>
<div class="result-row"><span>Number of Panels:</span><span>${panels}</span></div>
<div class="result-row"><span>Cut Length per Panel:</span><span>${cutLength.toFixed(0)}"</span></div>
<div class="result-row"><span>Total Fabric:</span><span>${totalYards.toFixed(1)} yards</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
