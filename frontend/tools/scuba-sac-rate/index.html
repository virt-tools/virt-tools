<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Scuba SAC Rate — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.note{color:var(--text-dim,#9aa3b2);font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">&#8592; All tools</a>
<h1>Scuba SAC Rate</h1>
<p>Surface air consumption rate from gas used, depth, and bottom time.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-used">Gas used</label><input type="text" id="in-used" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">bar</div></div>
<div class="field"><label class="f" for="in-vol">Tank volume</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 11.1"><div class="unit">L</div></div>
<div class="field"><label class="f" for="in-d">Depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-t">Time</label><input type="text" id="in-t" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">min</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">SAC = used · tank / (pressure · time).</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function fmt(x){if(typeof x==='boolean')return x?'Yes':'No';if(!isFinite(x))return '—';var r=Math.round(x*1e6)/1e6;return ''+r;}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
var usedE=document.getElementById('in-used');var volE=document.getElementById('in-vol');var dE=document.getElementById('in-d');var tE=document.getElementById('in-t');var out=document.getElementById('out');
function calc(){
var used=parseFloat(usedE.value);var vol=parseFloat(volE.value);var d=parseFloat(dE.value);var t=parseFloat(tE.value);
if([used,vol,d,t].some(function(v){return isNaN(v);})){out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span>';return;}
var r0=used*vol/((1+d/10)*t);
var html='<div class="big">'+fmt(r0)+" L/min"+'</div>';

out.innerHTML=html;
}
[usedE,volE,dE,tE].forEach(function(el){el.addEventListener('input',calc)});
calc();
})();
</script>
</body>
</html>
