<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to PDF — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Markdown to PDF</h1>
<p class="subtitle">Convert Markdown to a printable PDF using your browser's print dialog. 100% client-side.</p>
<div class="input-section">
<label>Markdown Input</label>
<textarea id="input" rows="12" placeholder="# Hello World&#10;&#10;This is **bold** and *italic*." aria-label="# Hello World&#10;&#10;This Is **Bold** And *Italic*."></textarea>
<div class="btn-row">
<button id="preview" class="primary-btn" type="button">Preview</button>
<button id="print" class="primary-btn" type="button">Print / Save as PDF</button>
</div>
</div>
<div id="preview-area" style="display:none;margin-top:1em;padding:1em;border:1px solid #ccc;min-height:200px;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function escapeAttr(value){return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeUrl(value){const url=String(value||'').trim();return /^(?:https?:|mailto:)/i.test(url)||/^(?:[#/?]|\.\.?\/)/.test(url)?url:'#';}
function mdToHtml(md){
return md
.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
.replace(/^### (.+)$/gm,'<h3>$1</h3>')
.replace(/^## (.+)$/gm,'<h2>$1</h2>')
.replace(/^# (.+)$/gm,'<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`(.+?)`/g,'<code>$1</code>')
.replace(/^\- (.+)$/gm,'<li>$1</li>')
.replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
.replace(/\[(.+?)\]\((.+?)\)/g,(match,label,url)=>'<a href="'+escapeAttr(safeUrl(url))+'" rel="noopener noreferrer">'+label+'</a>')
.replace(/\n\n/g,'</p><p>')
.replace(/\n/g,'<br>');
}
document.getElementById('preview').addEventListener('click',()=>{
const html=mdToHtml(document.getElementById('input').value);
const area=document.getElementById('preview-area');
const frame=document.createElement('iframe');frame.title='Sandboxed printable Markdown preview';frame.setAttribute('sandbox','');frame.referrerPolicy='no-referrer';frame.style.cssText='width:100%;min-height:250px;border:0;background:white;';frame.srcdoc='<!doctype html><meta charset="utf-8"><style>body{font:16px/1.6 system-ui,sans-serif;color:#111;padding:1rem}</style><p>'+html+'</p>';area.replaceChildren(frame);area.style.display='block';
});
document.getElementById('print').addEventListener('click',()=>{
const html=mdToHtml(document.getElementById('input').value);
const page='<!doctype html><html><head><meta charset="utf-8"><title>Markdown PDF</title><style>body{font-family:sans-serif;max-width:800px;margin:2em auto;line-height:1.6;}h1,h2,h3{margin-top:1em;}code{background:#f4f4f4;padding:2px 4px;border-radius:3px;}li{margin:4px 0;}</style></head><body><p>'+html+'</p></body></html>';
const url=URL.createObjectURL(new Blob([page],{type:'text/html'}));
const w=window.open(url,'_blank','noopener,noreferrer');
if(w)w.addEventListener('load',()=>w.print(),{once:true});
setTimeout(()=>URL.revokeObjectURL(url),60000);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
