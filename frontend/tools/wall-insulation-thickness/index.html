<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Wall Insulation Thickness Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Wall Insulation Thickness Calculator</h1>
<p>Calculate required insulation thickness for a target R-value based on material thermal conductivity. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-r">Target R-value</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">m²·K/W</div></div>
<div class="field"><label class="f" for="in-k">Material conductivity</label><input type="text" id="in-k" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.04"><div class="unit">W/m·K</div></div>
<div class="field"><label class="f" for="in-area">Wall area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">m²</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter target R-value.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rEl=document.getElementById("in-r"),kEl=document.getElementById("in-k"),aEl=document.getElementById("in-area"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var R=pn(rEl.value),K=pn(kEl.value),A=pn(aEl.value);
if(R==null){err.textContent="";out.innerHTML='<span style="color:var(--text-dim,#9aa3b2)">Enter target R-value.</span>';return}
K=K==null?0.04:K;A=A==null?50:A;
if(!isFinite(R)||!isFinite(K)||R<=0||K<=0||A<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var thickness=R*K;
var vol=thickness*A;
var html='<div class="big">'+rnd(thickness*100,1)+' cm</div>';
html+=row("Target R-value",rnd(R,1)+" m²·K/W");
html+=row("Material conductivity",rnd(K,3)+" W/m·K");
html+=row("Required thickness",rnd(thickness*100,1)+" cm");
html+=row("Wall area",rnd(A,0)+" m²");
html+=row("Insulation volume",rnd(vol,3)+" m³");
out.innerHTML=html;
}
[rEl,kEl,aEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
