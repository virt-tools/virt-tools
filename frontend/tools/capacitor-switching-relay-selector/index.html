<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Capacitor Switching Relay Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Capacitor Switching Relay Selector</h1>
<p>Calculate capacitor bank switching relay steps, target power factor, and required kVAR from load and PF values. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-kw">Load</label><input type="text" id="in-kw" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-pf1">Current PF</label><input type="text" id="in-pf1" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">cos φ</div></div>
<div class="field"><label class="f" for="in-pf2">Target PF</label><input type="text" id="in-pf2" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.95"><div class="unit">cos φ</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var kE=document.getElementById("in-kw"),p1E=document.getElementById("in-pf1"),p2E=document.getElementById("in-pf2"),out=document.getElementById("out");
function calc(){
var kw=parseFloat(kE.value),pf1=parseFloat(p1E.value),pf2=parseFloat(p2E.value);
if(isNaN(kw)||isNaN(pf1)||isNaN(pf2))return;
var kvar=kw*(Math.tan(Math.acos(pf1))-Math.tan(Math.acos(pf2)));
var steps=Math.ceil(kvar/25);
var stepSize=Math.ceil(kvar/steps/5)*5;
var html='<div class="big">'+(Math.round(kvar*10)/10)+' kVAR</div>';
html+=row("Required kVAR",Math.round(kvar*10)/10+' kVAR');
html+=row("Number of steps",steps);
html+=row("Step size",stepSize+' kVAR');
out.innerHTML=html;
}
[kE,p1E,p2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
