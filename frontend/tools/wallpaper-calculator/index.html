<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Wallpaper Calculator</h1>
<p class="subtitle">Estimate rolls of wallpaper needed for any room.</p>

<div class="input-section">
  <label>Wall length (ft)</label>
  <input type="number" id="length" value="20" min="0" step="0.5" aria-label="Length">
  <label>Wall height (ft)</label>
  <input type="number" id="height" value="8" min="0" step="0.5" aria-label="Height">
  <label>Roll width (in)</label>
  <input type="number" id="rollW" value="21" min="1" aria-label="Roll W">
  <label>Roll length (ft)</label>
  <input type="number" id="rollL" value="33" min="1" aria-label="Roll L">
  <label>Pattern repeat (in)</label>
  <input type="number" id="repeat" value="0" min="0" step="0.5" aria-label="Repeat">
  <label>Doors/windows area (sq ft)</label>
  <input type="number" id="openings" value="40" min="0" aria-label="Openings">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const l = parseFloat(document.getElementById('length').value) || 0;
    const h = parseFloat(document.getElementById('height').value) || 0;
    const rw = (parseFloat(document.getElementById('rollW').value) || 0) / 12;
    const rl = parseFloat(document.getElementById('rollL').value) || 0;
    const rpt = (parseFloat(document.getElementById('repeat').value) || 0) / 12;
    const openings = parseFloat(document.getElementById('openings').value) || 0;
    const wallArea = l * h - openings;
    const effH = h + rpt;
    const stripsPerRoll = Math.floor(rl / effH);
    const stripW = rw;
    const stripsNeeded = Math.ceil(l / stripW);
    const rolls = Math.ceil(stripsNeeded / stripsPerRoll);
    document.getElementById('bigResult').textContent = `${rolls} rolls needed`;
    document.getElementById('extras').innerHTML = `
      <div class="result-row"><span>Wall area:</span><span>${wallArea.toFixed(1)} sq ft (after openings)</span></div>
      <div class="result-row"><span>Strips needed:</span><span>${stripsNeeded} (${stripW.toFixed(2)} ft wide)</span></div>
      <div class="result-row"><span>Strips per roll:</span><span>${stripsPerRoll} (effective height ${effH.toFixed(2)} ft)</span></div>
      <div class="result-row"><span>Pattern repeat:</span><span>${(rpt*12).toFixed(1)} in</span></div>
      <div class="result-row"><span>Tip:</span><span>Buy 1 extra roll for future repairs</span></div>
    `;
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
