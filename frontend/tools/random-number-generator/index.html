<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Number Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Random Number Generator</h1>
<p class="subtitle">Generate random numbers with customizable range, count, and distribution.</p>
<div class="input-section">
<label>Minimum</label>
<input type="number" id="min" value="1" step="any" aria-label="Min">
<label>Maximum</label>
<input type="number" id="max" value="100" step="any" aria-label="Max">
<label>How Many</label>
<input type="number" id="count" value="10" min="1" max="10000" step="1" aria-label="Count">
<label>Type</label>
<select id="type" aria-label="Type">
<option value="int" selected>Integer</option>
<option value="float">Decimal</option>
<option value="unique">Unique Integers (no repeats)</option>
</select>
<label>Sort Results</label>
<select id="sort" aria-label="Sort">
<option value="no" selected>No</option>
<option value="asc">Ascending</option>
<option value="desc">Descending</option>
</select>
<button id="gen" class="primary-btn" type="button">Generate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('gen').addEventListener('click',()=>{
const min=parseFloat(document.getElementById('min').value)||0;
const max=parseFloat(document.getElementById('max').value)||1;
const count=Math.min(parseInt(document.getElementById('count').value)||1,10000);
const type=document.getElementById('type').value;
const sort=document.getElementById('sort').value;
let nums=[];
if(type==='unique'){
const range=max-min+1;
if(count>range){document.getElementById('result').innerHTML='<p class="warning">Cannot generate '+count+' unique numbers from a range of '+range+'.</p>';document.getElementById('result').style.display='block';return;}
const pool=[];
for(let i=min;i<=max;i++)pool.push(i);
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
nums=pool.slice(0,count);
}else{
for(let i=0;i<count;i++){
if(type==='int')nums.push(Math.floor(Math.random()*(max-min+1))+min);
else nums.push(Math.random()*(max-min)+min);
}
}
if(sort==='asc')nums.sort((a,b)=>a-b);
else if(sort==='desc')nums.sort((a,b)=>b-a);
const sum=nums.reduce((a,b)=>a+b,0);
const avg=sum/nums.length;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Count:</span><span>${nums.length}</span></div>
<div class="result-row"><span>Range:</span><span>${min} to ${max}</span></div>
<div class="result-row"><span>Sum:</span><span>${sum.toFixed(4)}</span></div>
<div class="result-row"><span>Mean:</span><span>${avg.toFixed(4)}</span></div>
<div class="result-row"><span>Min / Max:</span><span>${Math.min(...nums)} / ${Math.max(...nums)}</span></div>
<h3>Numbers</h3>
<p style="font-family:monospace;word-wrap:break-word">${nums.join(', ')}</p>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
