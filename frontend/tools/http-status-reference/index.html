<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTP Status Code Reference — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>HTTP Status Code Reference</h1>
<p class="subtitle">Searchable reference for all official and common HTTP status codes. Includes category, category color, description, and common usage examples.</p>
<div style="margin-top:1.5rem;">
<input type="text" id="search" placeholder="Search status code or meaning..." style="width:100%;max-width:500px;padding:.6rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;" aria-label="Search Status Code Or Meaning...">
<div style="margin-top:.6rem;">
<button class="cat-btn" data-cat="all" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">All</button>
<button class="cat-btn" data-cat="1xx" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">1xx Informational</button>
<button class="cat-btn" data-cat="2xx" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">2xx Success</button>
<button class="cat-btn" data-cat="3xx" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">3xx Redirect</button>
<button class="cat-btn" data-cat="4xx" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">4xx Client Error</button>
<button class="cat-btn" data-cat="5xx" style="padding:.3rem .8rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;background:#fff;" type="button">5xx Server Error</button>
</div>
</div>
<div id="codes" style="margin-top:1rem;"></div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const statuses = [
{code:100,cat:'1xx',name:'Continue',desc:'Initial part of request received; client should proceed with the rest.',usage:'Used with the Expect: 100-continue header'},
{code:101,cat:'1xx',name:'Switching Protocols',desc:'Server is switching protocols as requested by client.',usage:'WebSocket upgrade handshake'},
{code:102,cat:'1xx',name:'Processing',desc:'Server received and is processing the request, no response yet.',usage:'WebDAV operations'},
{code:103,cat:'1xx',name:'Early Hints',desc:'Allows preloading resources before final response.',usage:'Preconnect/preload hints'},
{code:200,cat:'2xx',name:'OK',desc:'Request succeeded.',usage:'Standard success response for GET/POST'},
{code:201,cat:'2xx',name:'Created',desc:'Request succeeded and a new resource was created.',usage:'POST that creates a new record'},
{code:202,cat:'2xx',name:'Accepted',desc:'Request accepted for processing, not yet complete.',usage:'Async batch job submission'},
{code:203,cat:'2xx',name:'Non-Authoritative Information',desc:'Returned info is from a local or third-party copy, not origin.',usage:'Proxy-modified responses'},
{code:204,cat:'2xx',name:'No Content',desc:'Request succeeded but no content to return.',usage:'DELETE or PUT with no response body'},
{code:205,cat:'2xx',name:'Reset Content',desc:'Client should reset the document that sent this request.',usage:'Form reset after submission'},
{code:206,cat:'2xx',name:'Partial Content',desc:'Server is delivering only part of the resource.',usage:'Range requests / video streaming'},
{code:207,cat:'2xx',name:'Multi-Status',desc:'XML body contains multiple status codes for multiple resources.',usage:'WebDAV operations'},
{code:208,cat:'2xx',name:'Already Reported',desc:'Members of a DAV binding already enumerated.',usage:'WebDAV BIND'},
{code:226,cat:'2xx',name:'IM Used',desc:'Server fulfilled GET with instance-manipulation.',usage:'Delta encoding'},
{code:300,cat:'3xx',name:'Multiple Choices',desc:'Multiple options for the resource, client chooses.',usage:'Content negotiation'},
{code:301,cat:'3xx',name:'Moved Permanently',desc:'Resource permanently moved to new URL.',usage:'Domain redirect /www to non-www'},
{code:302,cat:'3xx',name:'Found',desc:'Resource temporarily under different URL.',usage:'Post-login redirect'},
{code:303,cat:'3xx',name:'See Other',desc:'Redirect to GET a different resource.',usage:'Redirect after POST to show result'},
{code:304,cat:'3xx',name:'Not Modified',desc:'Cached version is still valid.',usage:'Conditional GET with If-Modified-Since'},
{code:307,cat:'3xx',name:'Temporary Redirect',desc:'Same method redirected, temporary.',usage:'Preserve POST method on redirect'},
{code:308,cat:'3xx',name:'Permanent Redirect',desc:'Same method redirected, permanent.',usage:'Permanent redirect preserving method'},
{code:400,cat:'4xx',name:'Bad Request',desc:'Server cannot process due to malformed syntax.',usage:'Missing required fields / invalid JSON'},
{code:401,cat:'4xx',name:'Unauthorized',desc:'Authentication required and not provided.',usage:'Missing or invalid auth token'},
{code:402,cat:'4xx',name:'Payment Required',desc:'Payment required to access resource.',usage:'Reserved for future use / paywall'},
{code:403,cat:'4xx',name:'Forbidden',desc:'Server understood but refuses to authorize.',usage:'Insufficient permissions'},
{code:404,cat:'4xx',name:'Not Found',desc:'Requested resource does not exist.',usage:'Unknown URL path'},
{code:405,cat:'4xx',name:'Method Not Allowed',desc:'HTTP method not allowed for this resource.',usage:'POST to a read-only endpoint'},
{code:406,cat:'4xx',name:'Not Acceptable',desc:'No acceptable response per Accept headers.',usage:'Content negotiation failure'},
{code:407,cat:'4xx',name:'Proxy Authentication Required',desc:'Client must authenticate with proxy.',usage:'Corporate proxy access'},
{code:408,cat:'4xx',name:'Request Timeout',desc:'Server timed out waiting for request.',usage:'Client too slow'},
{code:409,cat:'4xx',name:'Conflict',desc:'Request conflicts with current server state.',usage:'Duplicate resource / edit conflict'},
{code:410,cat:'4xx',name:'Gone',desc:'Resource permanently removed, no forwarding address.',usage:'Deleted content / deprecated API'},
{code:411,cat:'4xx',name:'Length Required',desc:'Content-Length header required.',usage:'Missing Content-Length'},
{code:412,cat:'4xx',name:'Precondition Failed',desc:'Conditional headers not met.',usage:'If-Match for optimistic locking'},
{code:413,cat:'4xx',name:'Content Too Large',desc:'Request body exceeds server limit.',usage:'Upload too large'},
{code:414,cat:'4xx',name:'URI Too Long',desc:'Requested URI exceeds server limit.',usage:'Query string too long'},
{code:415,cat:'4xx',name:'Unsupported Media Type',desc:'Media format not supported.',usage:'Wrong Content-Type header'},
{code:416,cat:'4xx',name:'Range Not Satisfiable',desc:'Range header cannot be satisfied.',usage:'Invalid byte range request'},
{code:417,cat:'4xx',name:'Expectation Failed',desc:'Expect header cannot be met.',usage:'Expect: 100-continue rejected'},
{code:418,cat:'4xx',name:"I'm a Teapot",desc:'I cannot brew coffee, I am a teapot.',usage:'April Fools joke / RFC 2324'},
{code:421,cat:'4xx',name:'Misdirected Request',desc:'Request sent to wrong server.',usage:'HTTP/2 connection coalescing'},
{code:422,cat:'4xx',name:'Unprocessable Content',desc:'Well-formed but semantically invalid.',usage:'Validation errors / bad data'},
{code:423,cat:'4xx',name:'Locked',desc:'Resource is locked.',usage:'WebDAV lock'},
{code:424,cat:'4xx',name:'Failed Dependency',desc:'Dependent request failed.',usage:'WebDAV / transaction rollback'},
{code:425,cat:'4xx',name:'Too Early',desc:'Server unwilling to risk replaying request.',usage:'Early data in TLS 1.3'},
{code:426,cat:'4xx',name:'Upgrade Required',desc:'Client must upgrade protocol.',usage:'Require TLS 1.2+'},
{code:428,cat:'4xx',name:'Precondition Required',desc:'Server requires conditional headers.',usage:'If-Match required for PUT'},
{code:429,cat:'4xx',name:'Too Many Requests',desc:'Rate limit exceeded.',usage:'API throttling'},
{code:431,cat:'4xx',name:'Request Header Fields Too Large',desc:'Headers exceed server limit.',usage:'Cookie too large'},
{code:451,cat:'4xx',name:'Unavailable For Legal Reasons',desc:'Resource unavailable due to legal demand.',usage:'Government censorship / DMCA'},
{code:500,cat:'5xx',name:'Internal Server Error',desc:'Generic server-side error.',usage:'Unhandled exception'},
{code:501,cat:'5xx',name:'Not Implemented',desc:'Server does not support this functionality.',usage:'Unknown HTTP method'},
{code:502,cat:'5xx',name:'Bad Gateway',desc:'Invalid response from upstream server.',usage:'Upstream crash / timeout'},
{code:503,cat:'5xx',name:'Service Unavailable',desc:'Server temporarily overloaded or down.',usage:'Maintenance mode / rate limit'},
{code:504,cat:'5xx',name:'Gateway Timeout',desc:'Upstream server did not respond in time.',usage:'Reverse proxy timeout'},
{code:505,cat:'5xx',name:'HTTP Version Not Supported',desc:'HTTP version in request not supported.',usage:'HTTP/0.9 request'},
{code:506,cat:'5xx',name:'Variant Also Negotiates',desc:'Transparent content negotiation error.',usage:'Server config error'},
{code:507,cat:'5xx',name:'Insufficient Storage',desc:'Server out of storage space.',usage:'WebDAV PUT when disk full'},
{code:508,cat:'5xx',name:'Loop Detected',desc:'Infinite loop detected in server.',usage:'WebDAV binding loop'},
{code:510,cat:'5xx',name:'Not Extended',desc:'Extension required but not supported.',usage:'HTTP extension framework'},
{code:511,cat:'5xx',name:'Network Authentication Required',desc:'Network access requires authentication.',usage:'Captive portal login'}
];
const colors = {'1xx':'#4a90d9','2xx':'#4caf50','3xx':'#ff9800','4xx':'#f44336','5xx':'#9c27b0'};
const container = document.getElementById('codes');
const search = document.getElementById('search');
let activeCat = 'all';
function render(){
  const q = search.value.toLowerCase();
  const filtered = statuses.filter(s=>{
    if(activeCat !== 'all' && s.cat !== activeCat) return false;
    if(!q) return true;
    return s.code.toString().includes(q) || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q);
  });
  if(!filtered.length){ container.innerHTML='<p style="color:#999;">No matching status codes.</p>'; return; }
  container.innerHTML = filtered.map(s=>(
    '<div style="display:flex;gap:1rem;padding:.8rem 1rem;border:1px solid #eee;border-radius:8px;margin-bottom:.5rem;align-items:flex-start;">'+
      '<div style="min-width:60px;font-size:1.4rem;font-weight:800;color:'+colors[s.cat]+';">'+s.code+'</div>'+
      '<div>'+
        '<div style="font-weight:700;">'+s.name+'</div>'+
        '<div style="font-size:.9rem;color:#666;margin-top:.2rem;">'+s.desc+'</div>'+
        '<div style="font-size:.8rem;color:#999;margin-top:.3rem;">💡 '+s.usage+'</div>'+
      '</div>'+
    '</div>'
  )).join('');
}
search.addEventListener('input', render);
document.querySelectorAll('.cat-btn').forEach(b=>{
  b.addEventListener('click', function(){
    document.querySelectorAll('.cat-btn').forEach(x=>x.style.background='#fff');
    this.style.background='#e8e8e8';
    activeCat = this.dataset.cat;
    render();
  });
});
document.querySelector('.cat-btn[data-cat="all"]').click();
})();
</script>
</body>
</html>
