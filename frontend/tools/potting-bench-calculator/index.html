<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Potting Bench Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Potting Bench Calculator</h1>
<p>Calculate ideal potting bench height, shelf depth, and lumber needed from user height and workspace width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-uh">User height</label><input type="text" id="in-uh" inputmode="decimal" autocomplete="off" placeholder="e.g. 66"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-ww">Workspace width</label><input type="text" id="in-ww" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var uhEl=document.getElementById("in-uh"),wwEl=document.getElementById("in-ww"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var UH=pn(uhEl.value),WW=pn(wwEl.value);
if(UH==null||WW==null)return;
if(!isFinite(UH)||!isFinite(WW)||UH<=0||WW<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var benchH=Math.round(UH*0.57/0.5)*0.5;
var shelfD=18;
var topArea=WW*shelfD/144;
var lumberFt=Math.ceil((WW*2+shelfD*4+48)/12);
var html='<div class="big">'+rnd(benchH,1)+' in</div>';
html+=row("User height",rnd(UH,0)+' in');
html+=row("Bench height",rnd(benchH,1)+' in');
html+=row("Workspace width",rnd(WW,0)+' in');
html+=row("Shelf depth",shelfD+' in');
html+=row("Top area",rnd(topArea,1)+' sq ft');
html+=row("Lumber needed",lumberFt+' ft');
out.innerHTML=html;
}
[uhEl,wwEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
