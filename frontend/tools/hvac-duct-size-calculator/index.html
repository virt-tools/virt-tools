<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>HVAC Duct Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>HVAC Duct Size Calculator</h1>
<p>Calculate round duct diameter from airflow and target velocity. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cfm">Airflow</label><input type="text" id="in-cfm" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-vel">Target velocity</label><input type="text" id="in-vel" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">fpm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter airflow and velocity.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cfmEl=document.getElementById("in-cfm"),velEl=document.getElementById("in-vel"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CFM=pn(cfmEl.value),V=pn(velEl.value);
if(CFM==null||V==null){return}
if(!isFinite(CFM)||!isFinite(V)||CFM<=0||V<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var area=CFM/V*144;
var d=Math.sqrt(4*area/Math.PI);
var html='<div class="big">'+rnd(d,2)+' in</div>';
html+=row("Airflow",rnd(CFM,0)+" CFM");
html+=row("Target velocity",rnd(V,0)+" fpm");
html+=row("Duct area",rnd(area,2)+" in²");
html+=row("Round duct diameter",rnd(d,2)+'"');
html+=row("Equivalent rectangular (W×H)",""+rnd(d,1)+'×'+rnd(d*0.7,1)+'"');
out.innerHTML=html;
}
[cfmEl,velEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
