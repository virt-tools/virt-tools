<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fire Blanket Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field select{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fire Blanket Selector</h1>
<p>Choose the right fire blanket material and size for your kitchen, lab, or workshop. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-u">Use case</label><select id="in-u"><option value="">Select…</option><option value="kitchen">Kitchen / home</option><option value="lab">Laboratory</option><option value="workshop">Workshop / welding</option><option value="industrial">Industrial</option></select><div class="unit">use case</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Select a use case to get a recommendation.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var uEl=document.getElementById("in-u"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var U=uEl.value;
if(!U)return;
err.textContent="";
var mat,size,notes;
if(U==="kitchen"){mat="Fiberglass fabric";size="1.0 m × 1.0 m (39×39 in)";notes="Lightweight, smothering grease fires"}
else if(U==="lab"){mat="Fiberglass with silicone coating";size="1.8 m × 1.8 m (71×71 in)";notes="Chemical resistant, large enough for body wrap"}
else if(U==="workshop"){mat="Wool / fiberglass felt";size="1.5 m × 1.8 m (59×71 in)";notes:"Welding spark protection, heat resistant to 1000°F"}
else{mat="Heavy-duty fiberglass with Kevlar trim";size="2.0 m × 2.0 m (79×79 in)";notes="Industrial grade, high-temperature, chemical resistant"}
var html='<div class="big">'+mat+'</div>';
html+=row("Size",size);
html+=row("Notes",notes);
out.innerHTML=html;
}
uEl.addEventListener("change",calc);
calc();
})();
</script>
</body>
</html>
