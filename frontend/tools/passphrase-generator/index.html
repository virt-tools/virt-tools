<div id="site-header"></div>

<div class="container">
<h1>Passphrase Generator</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Generate memorable passphrases using the EFF wordlists. Stronger than random passwords and easy to remember.</p>
<label>Number of words</label>
<input type="number" id="numWords" value="5" min="3" max="10" aria-label="Num Words">
<label>Separator</label>
<select id="separator" aria-label="Separator">
<option value="-">Hyphen (-)</option>
<option value=".">Dot (.)</option>
<option value="_">Underscore (_)</option>
<option value=" ">Space ( )</option>
<option value="">None</option>
<option value="-cap-">Hyphen + Capitalize</option>
</select>
<div style="margin:12px 0">
<span class="toggle"><label><input type="checkbox" id="addNum"> Add number</label></span>
<span class="toggle"><label><input type="checkbox" id="addSymbol"> Add symbol</label></span>
<span class="toggle"><label><input type="checkbox" id="capitalize"> Capitalize</label></span>
</div>
<button class="primary" onclick="gen()" type="button">Generate</button>
<button onclick="copy()" type="button">Copy</button>
<div class="output" id="result">Click "Generate" to create a passphrase</div>
<div class="stats" id="stats"></div>
<p class="note">Uses EFF's Diceware short word list (1296 words). 100% client-side — no network requests.</p>
</div>
<script src="/assets/tools.js"></script>
</main>

function gen(){
  const nw=parseInt(document.getElementById('numWords').value);
  const sep=document.getElementById('separator').value;
  const addNum=document.getElementById('addNum').checked;
  const addSym=document.getElementById('addSymbol').checked;
  const cap=document.getElementById('capitalize').checked;
  const syms="!@#$%^&*-_+=?";
  let words=[];
  for(let i=0;i<nw;i++){
    let w=WORDS[Math.floor(Math.random()*WORDS.length)];
    if(cap)w=w.charAt(0).toUpperCase()+w.slice(1);
    words.push(w);
  }
  let pw=words.join(sep==='-cap-'?'-':sep);
  if(addNum)pw+=sep!==''&&sep!=='-cap-'?sep:'-'+Math.floor(Math.random()*10);
  if(addSym)pw+=syms[Math.floor(Math.random()*syms.length)];
  document.getElementById('result').textContent=pw;
  const bits=Math.floor(Math.log2(WORDS.length)*nw);
  document.getElementById('stats').textContent=`~${bits} bits of entropy (${nw} words from ${WORDS.length}-word list)`;
}
function copy(){navigator.clipboard.writeText(document.getElementById('result').textContent).then(()=>{});}
