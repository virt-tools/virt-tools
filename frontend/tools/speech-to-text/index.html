<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speech to Text — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Speech to Text</h1>
<p class="subtitle">Transcribe speech using the Web Speech API. Live results, interim and final. 100% client-side.</p>
<div class="input-section">
<button id="start" class="primary-btn" type="button">Start Listening</button>
<button id="stop" type="button">Stop</button>
<button id="clear" type="button">Clear</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
</div>
<textarea id="output" rows="10" style="width:100%;margin-top:1em;font-family:monospace;" placeholder="Transcribed text will appear here..." aria-label="Transcribed Text Will Appear Here..."></textarea>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){document.getElementById('status').textContent='Speech recognition not supported in this browser.';return;}
const rec=new SR();
rec.continuous=true;rec.interimResults=true;
let listening=false;
const out=document.getElementById('output');
const status=document.getElementById('status');
rec.onstart=()=>{listening=true;status.textContent='Listening...';};
rec.onend=()=>{listening=false;status.textContent='Stopped.';};
rec.onerror=(e)=>{status.textContent='Error: '+e.error;};
rec.onresult=(e)=>{
let interim='',final='';
for(let i=e.resultIndex;i<e.results.length;i++){
if(e.results[i].isFinal)final+=e.results[i][0].transcript;
else interim+=e.results[i][0].transcript;
}
if(final)out.value+=final;
if(interim)status.textContent='Interim: '+interim;
};
document.getElementById('start').addEventListener('click',()=>{if(!listening)rec.start();});
document.getElementById('stop').addEventListener('click',()=>{if(listening)rec.stop();});
document.getElementById('clear').addEventListener('click',()=>{out.value='';});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
