<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sectionalizer Coordination Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sectionalizer Coordination Calculator</h1>
<p>Calculate sectionalizer count settings for coordination with upstream recloser operations. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rc">Recloser operations</label><input type="text" id="in-rc" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-fu">Downstream fuse</label><input type="text" id="in-fu" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">A</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rE=document.getElementById("in-rc"),fE=document.getElementById("in-fu"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var r=parseFloat(rE.value),f=parseFloat(fE.value);
if(isNaN(r)||isNaN(f))return;
if(r<1||f<=0){err.textContent="Recloser operations must be at least 1; fuse rating must be positive.";return}
err.textContent="";
var sectCount=r-1;
var html='<div class="big">'+sectCount+'</div>';
html+=row("Sectionalizer count setting",sectCount);
html+=row("Recloser operations",r);
html+=row("Min fault current",f*2+' A');
out.innerHTML=html;
}
[rE,fE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
