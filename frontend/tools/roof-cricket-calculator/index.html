<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Roof Cricket Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Roof Cricket Calculator</h1>
<p>Calculate cricket/saddle dimensions and flashing area for chimney diversion. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cw">Chimney width</label><input type="text" id="in-cw" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-slope">Roof slope</label><input type="text" id="in-slope" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">in/12</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cwEl=document.getElementById("in-cw"),sEl=document.getElementById("in-slope"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(cwEl.value),S=pn(sEl.value);
if(W==null||S==null)return;
if(!isFinite(W)||!isFinite(S)||W<=0||S<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var rise=W*S/12/2;
var rafter=Math.sqrt(rise*rise+(W/2)*(W/2));
var area=W/2*rafter;
var html='<div class="big">'+rnd(rise,1)+' in</div>';
html+=row("Chimney width",rnd(W,0)+" in");
html+=row("Crick rise",rnd(rise,1)+" in");
html+=row("Crick rafter",rnd(rafter,1)+" in");
html+=row("Flashing area",rnd(area/144,2)+" sq ft");
out.innerHTML=html;
}
[cwEl,sEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
