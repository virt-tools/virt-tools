<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Static Pressure Drop Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Static Pressure Drop Calculator</h1>
<p>Calculate pressure drop across a filter or coil from airflow and face area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cfm">Airflow</label><input type="text" id="in-cfm" inputmode="decimal" autocomplete="off" placeholder="e.g. 2000"><div class="unit">CFM</div></div>
<div class="field"><label class="f" for="in-area">Face area</label><input type="text" id="in-area" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-r">Resistance</label><input type="text" id="in-r" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">inWC at 500 fpm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cfmEl=document.getElementById("in-cfm"),areaEl=document.getElementById("in-area"),rEl=document.getElementById("in-r"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CFM=pn(cfmEl.value),A=pn(areaEl.value),R=pn(rEl.value);
if(CFM==null||A==null||R==null)return;
if(!isFinite(CFM)||!isFinite(A)||!isFinite(R)||CFM<=0||A<=0||R<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var vel=CFM/A;
var drop=R*vel/500;
var html='<div class="big">'+rnd(drop,3)+' inWC</div>';
html+=row("Face velocity",rnd(vel,0)+" fpm");
html+=row("Pressure drop",rnd(drop,3)+" inWC");
html+=row("Velocity pressure",rnd((vel/4005)*(vel/4005),4)+" inWC");
out.innerHTML=html;
}
[cfmEl,areaEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
