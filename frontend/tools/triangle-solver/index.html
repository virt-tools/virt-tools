<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triangle Solver — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Triangle Solver</h1>
<p class="subtitle">Solve triangles using the Law of Sines and Law of Cosines. Enter any 3 values.</p>
<div class="input-section">
<p class="hint">Enter at least 3 values (including at least 1 side). Angles in degrees.</p>
<label>Side a</label>
<input type="number" id="a" value="3" step="any" placeholder="blank" aria-label="Blank">
<label>Side b</label>
<input type="number" id="b" value="4" step="any" placeholder="blank" aria-label="Blank">
<label>Side c</label>
<input type="number" id="c" placeholder="blank" step="any" aria-label="Blank">
<label>Angle A (°)</label>
<input type="number" id="A" placeholder="blank" step="any" aria-label="Blank">
<label>Angle B (°)</label>
<input type="number" id="B" placeholder="blank" step="any" aria-label="Blank">
<label>Angle C (°)</label>
<input type="number" id="C" placeholder="blank" step="any" aria-label="Blank">
<button id="calc" class="primary-btn" type="button">Solve Triangle</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const D2R=Math.PI/180,R2D=180/Math.PI;
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
let a=document.getElementById('a').value,b=document.getElementById('b').value,c=document.getElementById('c').value;
let A=document.getElementById('A').value,B=document.getElementById('B').value,C=document.getElementById('C').value;
a=a===''?null:parseFloat(a);b=b===''?null:parseFloat(b);c=c===''?null:parseFloat(c);
A=A===''?null:parseFloat(A)*D2R;B=B===''?null:parseFloat(B)*D2R;C=C===''?null:parseFloat(C)*D2R;
const sides=[a,b,c].filter(x=>x).length;
const angles=[A,B,C].filter(x=>x).length;
if(sides+angles<3){document.getElementById('result').innerHTML='<p class="warning">Enter at least 3 values.</p>';document.getElementById('result').style.display='block';return;}
if(a&&b&&A&&!C){const sinB=b*Math.sin(A)/a;B=Math.asin(Math.min(1,sinB));C=Math.PI-A-B;c=a*Math.sin(C)/Math.sin(A);}
else if(a&&b&&c){
A=Math.acos((b*b+c*c-a*a)/(2*b*c));
B=Math.acos((a*a+c*c-b*b)/(2*a*c));
C=Math.PI-A-B;
}
else if(A&&B&&a){C=Math.PI-A-B;b=a*Math.sin(B)/Math.sin(A);c=a*Math.sin(C)/Math.sin(A);}
else if(a&&A&&B){C=Math.PI-A-B;b=a*Math.sin(B)/Math.sin(A);c=a*Math.sin(C)/Math.sin(A);}
const area=0.5*a*b*Math.sin(C);
const perim=a+b+c;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Side a:</span><span>${a?a.toFixed(4):'?'}</span></div>
<div class="result-row"><span>Side b:</span><span>${b?b.toFixed(4):'?'}</span></div>
<div class="result-row"><span>Side c:</span><span>${c?c.toFixed(4):'?'}</span></div>
<div class="result-row"><span>Angle A:</span><span>${A?(A*R2D).toFixed(2):'?'}°</span></div>
<div class="result-row"><span>Angle B:</span><span>${B?(B*R2D).toFixed(2):'?'}°</span></div>
<div class="result-row"><span>Angle C:</span><span>${C?(C*R2D).toFixed(2):'?'}°</span></div>
<div class="result-row"><span>Area:</span><span>${area.toFixed(4)}</span></div>
<div class="result-row"><span>Perimeter:</span><span>${perim.toFixed(4)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
