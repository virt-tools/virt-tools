<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Countertop Overhang Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Countertop Overhang Calculator</h1>
<p>Calculate countertop dimensions including overhang for seating and base cabinet width. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-bw">Base width</label><input type="text" id="in-bw" inputmode="decimal" autocomplete="off" placeholder="e.g. 600"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-seating">Seating overhang</label><input type="text" id="in-seating" inputmode="decimal" autocomplete="off" placeholder="e.g. 300"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-std">Standard overhang</label><input type="text" id="in-std" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter base width.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var bwEl=document.getElementById("in-bw"),sEl=document.getElementById("in-seating"),stEl=document.getElementById("in-std"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var BW=pn(bwEl.value),S=pn(sEl.value),ST=pn(stEl.value);
if(BW==null){return}
S=S==null?0:S;ST=ST==null?20:ST;
if(!isFinite(BW)||!isFinite(S)||!isFinite(ST)||BW<=0||S<0||ST<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var total=BW+S+2*ST;
var html='<div class="big">'+rnd(total,0)+' mm</div>';
html+=row("Base cabinet width",rnd(BW,0)+" mm");
html+=row("Seating overhang",rnd(S,0)+" mm");
html+=row("Standard overhang (each side)",rnd(ST,0)+" mm");
html+=row("Total countertop width",rnd(total,0)+" mm");
out.innerHTML=html;
}
[bwEl,sEl,stEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
