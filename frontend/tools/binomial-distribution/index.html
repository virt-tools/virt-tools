<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binomial Distribution Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Binomial Distribution Calculator</h1>
<p class="subtitle">Calculate binomial probability mass, cumulative, mean, and variance.</p>
<div class="input-section">
<label>n (trials)</label>
<input type="number" id="n" value="10" min="1" step="1" aria-label="N">
<label>p (success probability)</label>
<input type="number" id="p" value="0.5" min="0" max="1" step="0.01" aria-label="P">
<label>k (target successes)</label>
<input type="number" id="k" value="5" min="0" step="1" aria-label="K">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
function fact(n){if(n<=1)return 1;let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function comb(n,r){return fact(n)/(fact(r)*fact(n-r));}
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const n=parseInt(document.getElementById('n').value)||1;
const p=parseFloat(document.getElementById('p').value)||0;
const k=parseInt(document.getElementById('k').value)||0;
const q=1-p;
const pmf=comb(n,k)*Math.pow(p,k)*Math.pow(q,n-k);
let cdf=0;
for(let i=0;i<=k;i++)cdf+=comb(n,i)*Math.pow(p,i)*Math.pow(q,n-i);
const mean=n*p;
const variance=n*p*q;
const stdDev=Math.sqrt(variance);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>P(X = ${k}):</span><span>${pmf.toFixed(6)} (${(pmf*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>P(X ≤ ${k}):</span><span>${cdf.toFixed(6)} (${(cdf*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>P(X ≥ ${k}):</span><span>${(1-cdf+pmf).toFixed(6)} (${((1-cdf+pmf)*100).toFixed(2)}%)</span></div>
<div class="result-row"><span>Mean (np):</span><span>${mean.toFixed(4)}</span></div>
<div class="result-row"><span>Variance (npq):</span><span>${variance.toFixed(4)}</span></div>
<div class="result-row"><span>Std Dev:</span><span>${stdDev.toFixed(4)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
