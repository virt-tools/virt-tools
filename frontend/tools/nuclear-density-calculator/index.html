<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Nuclear Density Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Nuclear Density Calculator</h1>
<p>Calculate wet density, dry density, and moisture content from nuclear gauge field readings. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wd">Wet density</label><input type="text" id="in-wd" inputmode="decimal" autocomplete="off" placeholder="e.g. 120"><div class="unit">pcf</div></div>
<div class="field"><label class="f" for="in-mc">Moisture content</label><input type="text" id="in-mc" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">%</div></div>
<div class="field"><label class="f" for="in-md">Max dry density</label><input type="text" id="in-md" inputmode="decimal" autocomplete="off" placeholder="e.g. 115"><div class="unit">pcf</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wdE=document.getElementById("in-wd"),mcE=document.getElementById("in-mc"),mdE=document.getElementById("in-md"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var wd=parseFloat(wdE.value),mc=parseFloat(mcE.value),md=parseFloat(mdE.value);
if(isNaN(wd)||isNaN(mc))return;
if(wd<=0){err.textContent="Enter valid density.";return}
if(mc<0){err.textContent="Enter valid moisture content.";return}
err.textContent="";
var dd=wd/(1+mc/100);
if(!isFinite(dd*10)){err.textContent="Values are too large.";return}
var html='<div class="big">'+Math.round(dd*10)/10+' pcf</div>';
html+=row("Dry density",Math.round(dd*10)/10+' pcf');
if(!isNaN(md)&&md>0){
  var rc=dd/md*100;
  if(!isFinite(rc*10)){err.textContent="Values are too large.";return}
  html+=row("Relative compaction",Math.round(rc*10)/10+'%');
}
out.innerHTML=html;
}
[wdE,mcE,mdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
