<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Palette Extractor — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Color Palette Extractor</h1>
<p class="subtitle">Extract dominant colors from any image using a simple color quantization algorithm. 100% client-side.</p>
<div class="input-section">
<label>Upload Image: <input type="file" id="file" accept="image/*"></label>
<label>Colors: <input type="number" id="numColors" value="8" min="2" max="32" style="width:60px"></label>
<button onclick="extract()" type="button">Extract</button>
</div>
<div id="palette" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:15px"></div>
<script>
function extract(){
var f=document.getElementById('file').files[0];if(!f)return;
var n=parseInt(document.getElementById('numColors').value)||8;
var img=new Image();
img.onload=function(){
var c=document.createElement('canvas');c.width=Math.min(img.naturalWidth,100);c.height=Math.min(img.naturalHeight,100);
var ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
var d=ctx.getImageData(0,0,c.width,c.height).data;
var buckets={};
for(var i=0;i<d.length;i+=4){
var r=d[i]&0xF0,g=d[i+1]&0xF0,b=d[i+2]&0xF0;
var key=r+','+g+','+b;
buckets[key]=(buckets[key]||0)+1;
}
var sorted=Object.keys(buckets).sort(function(a,b){return buckets[b]-buckets[a];}).slice(0,n);
var pal=document.getElementById('palette');pal.innerHTML='';
sorted.forEach(function(k){
var parts=k.split(',');var hex='#'+((1<<24)+(parseInt(parts[0])<<16)+(parseInt(parts[1])<<8)+parseInt(parts[2])).toString(16).slice(1);
var div=document.createElement('div');
div.style.cssText='background:'+hex+';width:80px;height:80px;border-radius:8px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-family:monospace;font-size:11px;padding:4px;text-shadow:1px 1px 2px #000';
div.textContent=hex.toUpperCase();
div.onclick=function(){navigator.clipboard.writeText(hex);};
pal.appendChild(div);
});
};
img.src=URL.createObjectURL(f);
}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
