<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ic{max-width:550px;margin:0 auto;padding:2rem 1rem}
.ic h1{font-size:2rem;margin-bottom:.5rem}
.ic .sub{color:#888;margin-bottom:1.5rem}
.ic label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.ic input,.ic select{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.ic .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.ic .results{margin-top:2rem}
.ic .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.ic .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.ic .res-card .lbl{color:#888;font-size:13px}
.ic .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ic table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.ic th,.ic td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.ic th{text-align:left;color:#888;font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="ic">
<h1>📊 Investment Calculator</h1>
<p class="sub">Project investment growth with initial amount, regular contributions, and expected return.</p>
<label for="principal">Initial investment ($):</label>
<input type="number" id="principal" value="5000" min="0" oninput="calc()">
<label for="monthly">Monthly contribution ($):</label>
<input type="number" id="monthly" value="300" min="0" oninput="calc()">
<label for="rate">Expected annual return (%):</label>
<input type="number" id="rate" value="8" min="0" step="0.1" oninput="calc()">
<label for="years">Investment period (years):</label>
<input type="number" id="years" value="25" min="1" oninput="calc()">
<label for="inflation">Inflation rate (%):</label>
<input type="number" id="inflation" value="3" min="0" step="0.1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const P=parseFloat(document.getElementById('principal').value)||0;
  const PMT=parseFloat(document.getElementById('monthly').value)||0;
  const r=(parseFloat(document.getElementById('rate').value)||0)/100/12;
  const years=parseInt(document.getElementById('years').value)||1;
  const infl=(parseFloat(document.getElementById('inflation').value)||0)/100;
  const months=years*12;
  const totalContrib=P+PMT*months;
  let FV;
  if(r===0){FV=P+PMT*months}
  else{FV=P*Math.pow(1+r,months)+PMT*((Math.pow(1+r,months)-1)/r)}
  const gain=FV-totalContrib;
  const realFV=FV/Math.pow(1+infl,years);
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Future Value</div><div class="big" style="color:#27ae60">$'+FV.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Investment Gains</div><div class="big" style="color:#27ae60">$'+gain.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='</div>';
  html+='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Total Contributed</div><div class="big">$'+totalContrib.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Inflation-Adjusted</div><div class="big" style="color:#e67e22">$'+realFV.toLocaleString(undefined,{maximumFractionDigits:0})+'</div></div>';
  html+='</div>';
  html+='<table><tr><th>Year</th><th>Balance</th><th>Real Value</th></tr>';
  for(let y=1;y<=years&&y<=30;y++){
    const m=y*12;
    let bv;
    if(r===0){bv=P+PMT*m}
    else{bv=P*Math.pow(1+r,m)+PMT*((Math.pow(1+r,m)-1)/r)}
    const rv=bv/Math.pow(1+infl,y);
    html+='<tr><td>'+y+'</td><td>$'+bv.toLocaleString(undefined,{maximumFractionDigits:0})+'</td><td>$'+rv.toLocaleString(undefined,{maximumFractionDigits:0})+'</td></tr>';
  }
  html+='</table>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
