<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Pay Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.calc-wrap{max-width:550px;margin:1rem auto;padding:1.5rem}
.input-group{margin:.75rem 0}
.input-group label{display:block;margin-bottom:.25rem;font-weight:600}
.input-group input{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:1rem;box-sizing:border-box}
.result-box{margin:1.5rem 0;padding:1.5rem;background:var(--card-bg);border-radius:12px;border:2px solid var(--accent)}
.result-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)}
.result-row:last-child{border:none;font-weight:bold;font-size:1.15rem;color:var(--accent)}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<h1>Vacation Pay Calculator</h1>
<div class="calc-wrap">
<h2>Vacation Pay Calculator 🏖️</h2>
<p>Calculate vacation pay owed based on accrual rate and time worked.</p>
<div class="input-group">
<label>Annual salary ($)</label>
<input type="number" id="salary" value="50000" min="0" aria-label="Salary">
</div>
<div class="input-group">
<label>Vacation days earned per year</label>
<input type="number" id="days" value="10" min="0" step="0.5" aria-label="Days">
</div>
<div class="input-group">
<label>Days taken so far</label>
<input type="number" id="taken" value="2" min="0" step="0.5" aria-label="Taken">
</div>
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="result-box" id="result" style="display:none"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function v(id){return parseFloat(document.getElementById(id).value)||0}
function calc(){
  const salary=v('salary'),days=v('days'),taken=v('taken');
  const daily=salary/260;
  const perPaycheck=daily*days/26;
  const remaining=Math.max(0,days-taken);
  const payValue=daily*remaining;
  const r=document.getElementById('result');
  r.style.display='';
  r.innerHTML='<h3>Vacation Pay</h3>'+
    '<div class="result-row"><span>Daily rate</span><span>$'+daily.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Days earned per year</span><span>'+days+'</span></div>'+
    '<div class="result-row"><span>Days remaining</span><span>'+remaining+'</span></div>'+
    '<div class="result-row"><span>Accrual per paycheck</span><span>$'+perPaycheck.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>'+
    '<div class="result-row"><span>Payout value (if cashed out)</span><span>$'+payValue.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+'</span></div>';
}
</script>
</body>
</html>
