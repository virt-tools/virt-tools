<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Noise Generator</h1>
<p class="subtitle">Generate white, pink, and brown noise for focus, sleep, or testing. Play or download as WAV.</p>
<div class="input-section">
<label>Type: <select id="type"><option value="white">White</option><option value="pink">Pink</option><option value="brown">Brown</option></select></label>
<label>Duration (s): <input type="number" id="dur" value="10" min="1" max="300"></label>
<button id="play" class="primary-btn" type="button">Play</button>
<button id="download" class="btn" type="button">Download WAV</button>
</div>
<div id="status"></div>
<script>
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new AudioContext();return audioCtx;}
function genNoise(type,n){const d=new Float32Array(n);if(type==='white'){for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}
else if(type==='pink'){let b0,b1,b2,b3,b4,b5,b6;b0=b1=b2=b3=b4=b5=b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b7?void 0:b7=0;b6=w*0.115926;}}
else{let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}}
return d;}
document.getElementById('play').addEventListener('click',()=>{
const ctx=getCtx();const dur=parseFloat(document.getElementById('dur').value);
const n=Math.round(ctx.sampleRate*dur);
const buf=ctx.createBuffer(1,n,ctx.sampleRate);
buf.getChannelData(0).set(genNoise(document.getElementById('type').value,n));
const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();
});
document.getElementById('download').addEventListener('click',()=>{
const ctx=getCtx();const dur=parseFloat(document.getElementById('dur').value);
const sr=ctx.sampleRate,n=Math.round(sr*dur);
const data=genNoise(document.getElementById('type').value,n);
const wav=new ArrayBuffer(44+n*2);const v=new DataView(wav);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*2,true);
for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,data[i]*32767)),true);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='noise.wav';a.click();
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
