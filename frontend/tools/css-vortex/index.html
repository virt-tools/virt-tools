<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Vortex Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:0;background:#0a0a12;border-radius:12px;overflow:hidden;height:320px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌀 CSS Vortex Generator</h1>
<p>Create CSS vortex/tunnel spinning animation effects. 4 presets, adjustable rings/speed/colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset"><option value="tunnel" selected>Tunnel</option><option value="galaxy">Galaxy</option><option value="blackhole">Black Hole</option><option value="rainbow">Rainbow</option></select></div>
<div class="ctrl-row"><label>Ring Count</label><input type="number" id="rings" value="12" min="3" max="20" style="width:80px"></div>
<div class="ctrl-row"><label>Speed</label><select id="speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="color1" value="#6633ff" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="color2" value="#00ddff" style="width:60px;height:34px"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#000011" style="width:60px;height:34px"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var rings=parseInt(document.getElementById('rings').value);
var speed=document.getElementById('speed').value;
var c1=document.getElementById('color1').value;
var c2=document.getElementById('color2').value;
var bg=document.getElementById('bgColor').value;
var dur=speed==='slow'?'12s':speed==='fast'?'4s':'8s';
var html='<div class="vortex">\n';
var css='.vortex{width:100%;height:320px;background:'+bg+';position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;perspective:300px}\n';
css+='.vortex-ring{position:absolute;border:2px solid;border-radius:50%;animation:spin '+dur+' linear infinite}\n';
for(var i=0;i<rings;i++){
var pct=i/rings;
var size=Math.floor(40+pct*250);
var c1c=preset==='rainbow'?'hsl('+Math.floor(pct*360)+',80%,60%)':i%2===0?c1:c2;
var opacity=(1-pct*0.6).toFixed(2);
var delay=(pct*parseFloat(dur)).toFixed(2)+'s';
var extra='width:'+size+'px;height:'+size+'px;border-color:'+c1c+';opacity:'+opacity+';animation-delay:-'+delay;
if(preset==='tunnel'){extra+=';transform:translateZ('+Math.floor((1-pct)*200)+'px)'}
html+='<div class="vortex-ring" style="'+extra+'"></div>\n';
}
if(preset==='blackhole'){css+='.vortex-ring{box-shadow:0 0 20px inset rgba(0,0,0,0.8)}\n.vortex::after{content:"";position:absolute;width:40px;height:40px;background:#000;border-radius:50%;box-shadow:0 0 40px 10px '+c1+'}\n'}
html+='</div>';
css+='@keyframes spin{0%{transform:rotateZ(0) '+ (preset==='tunnel'?'translateZ(0)':'') +'}100%{transform:rotateZ(360deg) '+ (preset==='tunnel'?'translateZ(0)':'') +'}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','rings','speed','color1','color2','bgColor'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
