<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupon Savings Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Coupon Savings Calculator</h1>
<p class="subtitle">Stack multiple coupons and discounts to see your final price and total savings.</p>

<div class="input-section">
  <label>Original Price ($)</label>
  <input type="number" id="price" value="100" step="0.01" min="0" aria-label="Price">

  <div id="coupons">
    <div class="coupon-row" style="display:flex;gap:8px;align-items:center;margin:6px 0;">
      <select class="ctype" aria-label="Select">
        <option value="percent">Percent Off</option>
        <option value="fixed">Fixed Amount Off</option>
        <option value="bogo">BOGO (Buy One Get One Free)</option>
      </select>
      <input type="number" class="cval" value="20" step="0.01" placeholder="Value" aria-label="Value">
      <button class="remove-coupon" style="padding:4px 8px;" type="button">✕</button>
    </div>
  </div>
  <button id="add-coupon" style="margin:8px 0;" type="button">+ Add Coupon</button>
  <button id="calculate" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="result-row"><span>Original Price:</span><span id="orig-price"></span></div>
  <div class="result-row"><span>Total Savings:</span><span id="total-savings"></span></div>
  <div class="result-row final"><span>Final Price:</span><span id="final-price"></span></div>
  <div class="result-row"><span>Savings %:</span><span id="savings-pct"></span></div>
</div>

<style>
.coupon-row { gap: 8px; }
.result-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.result-row.final { font-size:1.2em; font-weight:bold; color:var(--accent); }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const couponsDiv = document.getElementById('coupons');

  document.getElementById('add-coupon').addEventListener('click', () => {
    const row = document.createElement('div');
    row.className = 'coupon-row';
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin:6px 0;';
    row.innerHTML = `
      <select class="ctype" aria-label="Select">
        <option value="percent">Percent Off</option>
        <option value="fixed">Fixed Amount Off</option>
        <option value="bogo">BOGO (Buy One Get One Free)</option>
      </select>
      <input type="number" class="cval" value="10" step="0.01" placeholder="Value" aria-label="Value">
      <button class="remove-coupon" style="padding:4px 8px;" type="button">✕</button>
    `;
    row.querySelector('.remove-coupon').addEventListener('click', () => row.remove());
    couponsDiv.appendChild(row);
  });

  couponsDiv.querySelector('.remove-coupon').addEventListener('click', (e) => {
    if (couponsDiv.children.length > 1) e.target.parentElement.remove();
  });

  document.getElementById('calculate').addEventListener('click', () => {
    const price = parseFloat(document.getElementById('price').value) || 0;
    let current = price;

    document.querySelectorAll('.coupon-row').forEach(row => {
      const type = row.querySelector('.ctype').value;
      const val = parseFloat(row.querySelector('.cval').value) || 0;
      if (type === 'percent') {
        current -= current * (val / 100);
      } else if (type === 'fixed') {
        current -= val;
      } else if (type === 'bogo') {
        current = current / 2;
      }
      if (current < 0) current = 0;
    });

    const savings = price - current;
    const pct = price > 0 ? (savings / price * 100).toFixed(1) : 0;

    document.getElementById('orig-price').textContent = '$' + price.toFixed(2);
    document.getElementById('total-savings').textContent = '$' + savings.toFixed(2);
    document.getElementById('final-price').textContent = '$' + current.toFixed(2);
    document.getElementById('savings-pct').textContent = pct + '%';
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
