<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoe Size Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Shoe Size Converter</h1>
<p class="subtitle">Convert between US, UK, EU, and Mondopoint shoe sizes for men, women, and children.</p>
<div class="input-section">
<label>Gender</label>
<select id="gender" aria-label="Gender">
<option value="men" selected>Men</option>
<option value="women">Women</option>
</select>
<label>Size</label>
<input type="number" id="size" value="10" step="0.5" aria-label="Size">
<label>From System</label>
<select id="from" aria-label="From">
<option value="us" selected>US</option>
<option value="uk">UK</option>
<option value="eu">EU</option>
<option value="cm">CM (Mondopoint)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const g=document.getElementById('gender').value;
const s=parseFloat(document.getElementById('size').value)||0;
const f=document.getElementById('from').value;
let cm;
if(f==='us')cm=g==='men'?s*1.0833+18.5:s*1.0833+17.5;
else if(f==='uk')cm=s*1.0833+18.5;
else if(f==='eu')cm=(s+1.5)*0.6667;
else cm=s;
const usMen=(cm-18.5)/1.0833;
const usWomen=(cm-17.5)/1.0833;
const uk=(cm-18.5)/1.0833;
const eu=(cm/0.6667)-1.5;
const jp=cm*1.5;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Foot Length:</span><span>${cm.toFixed(1)} cm (${(cm/2.54).toFixed(1)} in)</span></div>
<div class="result-row"><span>US (Men):</span><span>${usMen.toFixed(1)}</span></div>
<div class="result-row"><span>US (Women):</span><span>${usWomen.toFixed(1)}</span></div>
<div class="result-row"><span>UK:</span><span>${uk.toFixed(1)}</span></div>
<div class="result-row"><span>EU:</span><span>${eu.toFixed(1)}</span></div>
<div class="result-row"><span>CM (Mondopoint):</span><span>${cm.toFixed(1)} cm</span></div>
<div class="result-row"><span>Japan (JP):</span><span>${jp.toFixed(0)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
