<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Hot Tub Volume Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Hot Tub Volume Calculator</h1>
<p>Calculate hot tub water volume, fill time, and heating energy from dimensions and seat count. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 7"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-w">Width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 7"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-d">Depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-sc">Seats</label><input type="text" id="in-sc" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">count</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-d"),scEl=document.getElementById("in-sc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value),SC=pn(scEl.value);
if(L==null||W==null||D==null)return;
if(!isFinite(L)||!isFinite(W)||!isFinite(D)||L<=0||W<=0||D<=0){err.textContent="Enter valid values.";return}
err.textContent="";
var seats=SC==null?0:SC;
var seatVol=seats*1.5;
var raw=L*W*D*7.481;
var vol=Math.max(50,raw-seatVol*7.481);
var fillMin=vol/10;
var heatBTU=vol*8.34*40;
var html='<div class="big">'+rnd(vol,0)+' gal</div>';
html+=row("Raw volume",rnd(raw,0)+' gal');
html+=row("Seat displacement",rnd(seatVol,1)+' cu ft');
html+=row("Usable volume",rnd(vol,0)+' gal ('+rnd(vol*3.785,0)+' L)');
html+=row("Fill time @10 gpm",rnd(fillMin,0)+' min');
html+=row("Heat energy (40F rise)",rnd(heatBTU/1000,1)+' kBTU');
out.innerHTML=html;
}
[lEl,wEl,dEl,scEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
