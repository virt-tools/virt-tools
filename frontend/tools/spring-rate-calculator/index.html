<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Rate Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Spring Rate Calculator</h1>
<p class="subtitle">Calculate coil spring rate, load, and deflection for mechanical springs.</p>
<div class="input-section">
<label>Wire Diameter (inches)</label>
<input type="number" id="wireD" value="0.5" min="0.01" step="0.001" aria-label="Wire D">
<label>Coil Diameter (inches, outer)</label>
<input type="number" id="coilD" value="3" min="0.1" step="0.001" aria-label="Coil D">
<label>Active Coils</label>
<input type="number" id="coils" value="8" min="1" aria-label="Coils">
<label>Material</label>
<select id="material" aria-label="Material">
<option value="11400000" selected>Music Wire (A228)</option>
<option value="11200000">Hard Drawn (A227)</option>
<option value="10750000">Stainless (A313)</option>
<option value="10500000">Chrome Vanadium (A231)</option>
</select>
<label>Applied Load (lbs)</label>
<input type="number" id="load" value="500" min="0" aria-label="Load">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const dw=parseFloat(document.getElementById('wireD').value)||0;
const dc=parseFloat(document.getElementById('coilD').value)||0;
const n=parseFloat(document.getElementById('coils').value)||1;
const G=parseFloat(document.getElementById('material').value);
const L=parseFloat(document.getElementById('load').value)||0;
const dm=(dc-dw);
const rate=(G*dw**4)/(8*dm**3*n);
const deflection=L/rate;
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Wire Diameter:</span><span>${dw}"</span></div>
<div class="result-row"><span>Mean Diameter:</span><span>${dm.toFixed(3)}"</span></div>
<div class="result-row"><span>Active Coils:</span><span>${n}</span></div>
<div class="result-row"><span>Spring Rate:</span><span>${rate.toFixed(2)} lb/in</span></div>
<div class="result-row"><span>At ${L} lb load:</span><span>${deflection.toFixed(3)}" deflection</span></div>
<div class="result-row"><span>Spring Index:</span><span>${(dm/dw).toFixed(2)}</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
