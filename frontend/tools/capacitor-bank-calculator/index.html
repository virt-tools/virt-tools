<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Capacitor Bank Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Capacitor Bank Calculator</h1>
<p>Calculate capacitor bank size for power factor correction from real power, current PF, and target PF. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-kw">Real power</label><input type="text" id="in-kw" inputmode="decimal" autocomplete="off" placeholder="e.g. 500"><div class="unit">kW</div></div>
<div class="field"><label class="f" for="in-pf1">Current power factor</label><input type="text" id="in-pf1" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.75"><div class="unit">0–1</div></div>
<div class="field"><label class="f" for="in-pf2">Target power factor</label><input type="text" id="in-pf2" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.95"><div class="unit">0–1</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var kE=document.getElementById("in-kw"),p1E=document.getElementById("in-pf1"),p2E=document.getElementById("in-pf2"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var kw=parseFloat(kE.value),pf1=parseFloat(p1E.value),pf2=parseFloat(p2E.value);
if(isNaN(kw)||isNaN(pf1)||isNaN(pf2))return;
if(kw<=0||pf1<=0||pf1>1||pf2<=0||pf2>1){err.textContent="Power factor must be between 0 and 1; power must be positive.";return}
var theta1=Math.acos(pf1),theta2=Math.acos(pf2);
var kvar=kw*(Math.tan(theta1)-Math.tan(theta2));
if(kvar<0){err.textContent="Target power factor must be greater than or equal to current power factor.";return}
err.textContent="";
var kvaBefore=kw/pf1;
var kvaAfter=kw/pf2;
var reduction=(1-kvaAfter/kvaBefore)*100;
var html='<div class="big">'+(Math.round(kvar))+' kVAR</div>';
html+=row("Capacitor bank size",Math.round(kvar)+' kVAR');
html+=row("kVA before",Math.round(kvaBefore)+' kVA');
html+=row("kVA reduction",Math.round(reduction)+'%');
out.innerHTML=html;
}
[kE,p1E,p2E].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
