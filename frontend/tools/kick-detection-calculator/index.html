<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Kick Detection Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Kick Detection Calculator</h1>
<p>Estimate kick severity from pit gain, hole volume, and original mud weight to determine influx type and severity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-pg">Pit gain</label><input type="text" id="in-pg" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">bbl</div></div>
<div class="field"><label class="f" for="in-mw">Original mud weight</label><input type="text" id="in-mw" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">ppg</div></div>
<div class="field"><label class="f" for="in-tvd">Well TVD</label><input type="text" id="in-tvd" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pgE=document.getElementById("in-pg"),mwE=document.getElementById("in-mw"),tvdE=document.getElementById("in-tvd"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var pg=parseFloat(pgE.value),mw=parseFloat(mwE.value),tvd=parseFloat(tvdE.value);
if(isNaN(pg)||isNaN(mw)||isNaN(tvd))return;
err.textContent="";
var sidpp=pg*1440/(0.052*tvd);
var influxType=pg<5?"Gas kick":pg<20?"Oil kick":"Saltwater kick";
var severity=pg<5?"Minor":pg<20?"Moderate":"Severe";
var html='<div class="big">'+severity+'</div>';
html+=row("Estimated severity",severity);
html+=row("Likely influx type",influxType);
html+=row("Pit gain",pg+' bbl');
out.innerHTML=html;
}
[pgE,mwE,tvdE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
