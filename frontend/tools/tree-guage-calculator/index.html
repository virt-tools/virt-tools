<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tree Gauge Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tree Gauge Calculator</h1>
<p>Estimate tree diameter at breast height (DBH), circumference, and biomass from a trunk circumference measurement. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-circ">Circumference</label><input type="text" id="in-circ" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">in</div></div>
<div class="field"><label class="f" for="in-h">Tree height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var circEl=document.getElementById("in-circ"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Circ=pn(circEl.value),H=pn(hEl.value);
if(Circ==null||H==null)return;
if(!isFinite(Circ)||!isFinite(H)||Circ<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var dbh=Circ/Math.PI;
var radius=dbh/2;
var basalArea=Math.PI*radius*radius/144;
var biomass=0.0557*Math.pow(dbh,2.4)*H;
var html='<div class="big">'+rnd(dbh,1)+' in</div>';
html+=row("Circumference",rnd(Circ,1)+' in');
html+=row("DBH",rnd(dbh,1)+' in ('+rnd(dbh*2.54,1)+' cm)');
html+=row("Tree height",rnd(H,0)+' ft');
html+=row("Basal area",rnd(basalArea,2)+' sq ft');
html+=row("Est. biomass",rnd(biomass,0)+' lb');
out.innerHTML=html;
}
[circEl,hEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
