<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Aurora Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#000;border-radius:12px;overflow:hidden;position:relative;height:400px}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌌 CSS Aurora Generator</h1>
<p>Create CSS aurora borealis / northern lights animated background. 5 presets, adjustable colors, speed, intensity. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="classic">Classic Green</option><option value="sunset">Sunset</option><option value="ocean">Ocean Blue</option><option value="neon">Neon Purple</option><option value="rainbow">Rainbow</option></select></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="c1" value="#00ff88" aria-label="C1"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="c2" value="#0088ff" aria-label="C2"></div>
<div class="ctrl-row"><label>Color 3</label><input type="color" id="c3" value="#8800ff" aria-label="C3"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="3" max="30" step="1" value="10" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Blobs</label><input type="range" id="blobs" min="3" max="8" step="1" value="5" style="width:200px" aria-label="Blobs"></div>
<div class="ctrl-row"><label>Blur</label><input type="range" id="blur" min="20" max="120" step="5" value="60" style="width:200px" aria-label="Blur"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#000011" aria-label="Bgcolor"></div>
<div class="ctrl-row"><label>Stars</label><select id="stars" aria-label="Stars"><option value="yes">Yes</option><option value="no">No</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
var presets={classic:['#00ff88','#0088ff','#004422'],sunset:['#ff0088','#ff8800','#882200'],ocean:['#0088ff','#00ffff','#004488'],neon:['#8800ff','#ff00ff','#440088'],rainbow:['#ff0088','#00ff88','#8800ff']};
function update(){
var p=document.getElementById('preset').value;
var c1=document.getElementById('c1').value;var c2=document.getElementById('c2').value;var c3=document.getElementById('c3').value;
var sp=parseFloat(document.getElementById('speed').value);
var nb=parseInt(document.getElementById('blobs').value);
var bl=parseInt(document.getElementById('blur').value);
var bg=document.getElementById('bgcolor').value;
var st=document.getElementById('stars').value;
var cols=[c1,c2,c3];
if(presets[p]){cols=presets[p];document.getElementById('c1').value=cols[0];document.getElementById('c2').value=cols[1];document.getElementById('c3').value=cols[2]}
var blobHTML='';
for(var i=0;i<nb;i++){
var c=cols[i%3];
var x=10+Math.random()*80;var y=10+Math.random()*60;var w=200+Math.random()*300;var dur=sp+Math.random()*sp*0.6;
blobHTML+='<div class="aurora-blob" style="background:'+c+';left:'+x+'%;top:'+y+'%;width:'+w+'px;height:'+w+'px;animation-duration:'+dur+'s;animation-delay:-'+(Math.random()*sp)+'s"></div>';
}
var starHTML='';
if(st==='yes'){for(var i=0;i<60;i++){starHTML+='<div class="aur-star" style="left:'+Math.random()*100+'%;top:'+Math.random()*70+'%;animation-delay:-'+(Math.random()*3)+'s"></div>'}}
var html='<div class="aurora">\n'+blobHTML+'\n'+starHTML+'\n</div>';
var css='.aurora{position:relative;width:100%;height:400px;background:'+bg+';border-radius:12px;overflow:hidden}\n';
css+='.aurora-blob{position:absolute;border-radius:50%;filter:blur('+bl+'px);opacity:.6;animation:aurora-move '+sp+'s ease-in-out infinite alternate}\n';
css+='@keyframes aurora-move{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.3)}100%{transform:translate(-20px,30px) scale(.8)}}\n';
css+='.aur-star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.8;animation:aur-twinkle 2s ease-in-out infinite}\n';
css+='@keyframes aur-twinkle{0%,100%{opacity:.2}50%{opacity:1}}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','c1','c2','c3','speed','blobs','blur','bgcolor','stars'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
