<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Digital Line Coding Visualizer — Virtual Tools</title>
<meta name="description" content="Turn binary data into NRZ-L, NRZ-I, Manchester, differential Manchester and bipolar AMI waveforms with transition and mean-level summaries.">
<link rel="stylesheet" href="/assets/style.css">
<style>
[hidden]{display:none!important}.visualizer{max-width:900px;margin:0 auto}.form-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.field{min-width:0}.field label,.field-label{display:block;font-size:13px;font-weight:650;margin:0 0 5px}.field select,.field textarea{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:inherit}.field textarea{min-height:88px;resize:vertical;font:700 1rem/1.55 ui-monospace,monospace}.field select:focus,.field textarea:focus{outline:3px solid color-mix(in srgb,var(--accent,#6ea8fe) 35%,transparent);border-color:var(--accent,#6ea8fe)}.field small{display:block;color:var(--text-dim,#9aa3b2);font-size:11px;margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.actions button{min-height:44px;padding:9px 18px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:transparent;color:var(--text,#e6e6e6);font:inherit;font-weight:650;cursor:pointer}.actions button.primary{border-color:var(--accent,#6ea8fe);background:var(--accent,#6ea8fe);color:#0b1017}.actions button:hover{filter:brightness(1.08)}.actions button:focus-visible{outline:3px solid var(--accent,#6ea8fe);outline-offset:2px}.actions button:disabled{opacity:.5;cursor:default}.status{min-height:1.5em;margin:12px 0 0;font-size:13px;color:var(--text-dim,#9aa3b2)}.status.error{color:var(--bad,#f87171)}.out{margin-top:18px}.out h2{font-size:16px;margin:0 0 12px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:9px;margin-bottom:16px}.metric{padding:10px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);min-width:0}.metric strong{display:block;font:700 1rem ui-monospace,monospace;overflow-wrap:anywhere}.metric span{display:block;margin-top:3px;color:var(--text-dim,#9aa3b2);font-size:11px}.waveform-scroll{box-sizing:border-box;max-width:100%;overflow-x:auto;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);margin-bottom:12px}.waveform{display:block;width:100%;height:auto;min-height:220px}.grid-line{stroke:var(--border,#2a2f3a);stroke-width:1}.bit-divider{stroke:var(--border,#2a2f3a);stroke-width:1;stroke-dasharray:3 5}.axis-label,.bit-label{fill:var(--text-dim,#9aa3b2);font:12px ui-monospace,monospace}.bit-label{text-anchor:middle;fill:var(--text,#e6e6e6);font-weight:700}.signal{fill:none;stroke:var(--accent,#6ea8fe);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.convention{color:var(--text-dim,#9aa3b2);font-size:12px;line-height:1.5;margin:0 0 14px}.copy-text{box-sizing:border-box;width:100%;min-height:128px;resize:vertical;padding:10px 12px;border:1px solid var(--border,#2a2f3a);border-radius:8px;background:var(--bg,#14181f);color:var(--text,#e6e6e6);font:12px/1.55 ui-monospace,monospace}.empty{color:var(--text-dim,#9aa3b2);margin:0 0 14px}@media(min-width:680px){.form-grid{grid-template-columns:minmax(12rem,.7fr) minmax(0,1.3fr)}}@media(max-width:420px){.actions button{flex:1 1 100%}.metric{padding:9px}.out{margin-top:14px}}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header"><a class="back" href="/">← All tools</a><h1>Digital Line Coding Visualizer</h1><p>Turn bits into line-code waveforms and inspect their transitions.</p></div>
<section class="panel visualizer" aria-label="Line coding settings">
<form id="line-coding-form" novalidate>
<div class="form-grid">
<div class="field"><label for="scheme">Line code</label><select id="scheme" name="scheme"><option value="nrz-l">NRZ-L</option><option value="nrz-i">NRZ-I</option><option value="manchester">Manchester (IEEE 802.3)</option><option value="differential-manchester">Differential Manchester</option><option value="ami">Bipolar AMI</option></select><small id="scheme-note">0 = low (−1); 1 = high (+1)</small></div>
<div class="field"><label for="bits">Binary sequence</label><textarea id="bits" name="bits" rows="3" maxlength="160" spellcheck="false" autocomplete="off" required>10110010</textarea><small>0 and 1 only; spaces and line breaks are optional</small></div>
</div>
<div class="actions"><button class="primary" type="submit">Draw waveform</button><button id="example" type="button">Load example</button><button id="copy" type="button" disabled>Copy levels</button></div>
<p id="status" class="status" role="status" aria-live="polite">Enter up to 64 binary digits.</p>
</form>
</section>
<section class="panel visualizer out" aria-labelledby="result-title">
<h2 id="result-title">Encoded waveform</h2>
<div id="result" aria-live="polite" aria-atomic="true"><p class="empty">Your waveform and signal statistics will appear here.</p></div>
<label class="field" for="timeline"><span class="field-label">Copyable half-bit levels</span></label><textarea class="copy-text" id="timeline" readonly rows="6" aria-label="Generated half-bit signal levels"></textarea>
</section>
</main>
<script src="/assets/app.js"></script>
<script>
/* line-coding-core:start */
var LineCodingCore = (function(){
  "use strict";
  var SCHEMES = {
    "nrz-l":{name:"NRZ-L",example:"10110010",convention:"0 = low (−1); 1 = high (+1)"},
    "nrz-i":{name:"NRZ-I",example:"01011001",convention:"1 causes a transition at the bit boundary; 0 keeps the prior level; starts low (−1)"},
    "manchester":{name:"Manchester",example:"01011001",convention:"IEEE 802.3: 0 = low-to-high; 1 = high-to-low; every bit has a mid-bit transition"},
    "differential-manchester":{name:"Differential Manchester",example:"01011001",convention:"Every bit has a mid-bit transition; 0 adds a start-bit transition; 1 keeps the prior level; starts low (−1)"},
    "ami":{name:"Bipolar AMI",example:"11010110",convention:"0 = zero level; each 1 uses alternating positive and negative pulses, starting positive (+1)"}
  };
  var MAX_BITS = 64;
  function fail(message){ throw new Error(message); }
  function schemeFor(value){
    var key = value == null ? "nrz-l" : String(value).toLowerCase();
    if (!Object.prototype.hasOwnProperty.call(SCHEMES,key)) fail("Choose a supported line-coding scheme.");
    return key;
  }
  function levelsFor(bits,key){
    var cells = [];
    var previous = -1;
    var pulse = 1;
    for (var index=0;index<bits.length;index+=1){
      var bit = bits[index];
      if (key === "nrz-i"){
        if (bit === "1") previous = -previous;
        cells.push({index:index+1,bit:bit,levels:[previous,previous]});
      } else if (key === "manchester"){
        var halves = bit === "1" ? [1,-1] : [-1,1];
        cells.push({index:index+1,bit:bit,levels:halves});
      } else if (key === "differential-manchester"){
        var start = bit === "0" ? -previous : previous;
        cells.push({index:index+1,bit:bit,levels:[start,-start]});
        previous = -start;
      } else if (key === "ami"){
        var amiLevel = bit === "1" ? pulse : 0;
        cells.push({index:index+1,bit:bit,levels:[amiLevel,amiLevel]});
        if (bit === "1") pulse = -pulse;
      } else {
        var level = bit === "1" ? 1 : -1;
        cells.push({index:index+1,bit:bit,levels:[level,level]});
      }
    }
    return cells;
  }
  function formatLevel(value){ return value > 0 ? "+1" : value < 0 ? "-1" : "0"; }
  function formatMean(value){ return String(Number(value.toFixed(3))); }
  function encode(input){
    var source = input || {};
    var key = schemeFor(source.scheme);
    var config = SCHEMES[key];
    var raw = String(source.bits == null ? config.example : source.bits);
    var bits = raw.replace(/\s/g,"");
    if (!bits) fail("Enter at least one binary digit.");
    if (!/^[01]+$/.test(bits)) fail("Binary sequence can contain only 0, 1 and whitespace.");
    if (bits.length > MAX_BITS) fail("Use at most 64 binary digits.");
    var cells = levelsFor(bits,key);
    var flat = [];
    cells.forEach(function(cell){ flat.push(cell.levels[0],cell.levels[1]); });
    var transitions = 0;
    var sum = 0;
    flat.forEach(function(level,index){ sum += level; if(index && level !== flat[index-1]) transitions += 1; });
    var mean = sum/flat.length;
    var lines = cells.map(function(cell){ return cell.index + ". " + cell.bit + "  " + formatLevel(cell.levels[0]) + " → " + formatLevel(cell.levels[1]); });
    return {scheme:key,name:config.name,convention:config.convention,bits:bits,bitCount:bits.length,cells:cells,transitionCount:transitions,meanLevel:mean,copyText:config.name + " — " + bits.length + " bits, " + transitions + " transitions, mean level " + formatMean(mean) + "\n" + lines.join("\n")};
  }
  return {encode:encode};
})();
/* line-coding-core:end */
(function(){
"use strict";
var SVG_NS = "http://www.w3.org/2000/svg";
var form = document.getElementById("line-coding-form");
var schemeEl = document.getElementById("scheme");
var bitsEl = document.getElementById("bits");
var schemeNoteEl = document.getElementById("scheme-note");
var resultEl = document.getElementById("result");
var timelineEl = document.getElementById("timeline");
var copyButton = document.getElementById("copy");
var exampleButton = document.getElementById("example");
var statusEl = document.getElementById("status");
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function node(tag,className,text){ var element=document.createElement(tag); if(className) element.className=className; if(text!=null) element.textContent=text; return element; }
function svgNode(tag,attributes,text){ var element=document.createElementNS(SVG_NS,tag); Object.keys(attributes||{}).forEach(function(key){ element.setAttribute(key,attributes[key]); }); if(text!=null) element.textContent=text; return element; }
function metric(label,value){ var item=node("div","metric"); item.appendChild(node("strong",null,value)); item.appendChild(node("span",null,label)); return item; }
function drawWaveform(result){
  var width=Math.max(680,result.bitCount*56+64),left=48,right=width-16,bitWidth=(right-left)/result.bitCount,halfWidth=bitWidth/2;
  var svg=svgNode("svg",{id:"waveform",class:"waveform",viewBox:"0 0 "+width+" 240",role:"img","aria-labelledby":"waveform-title"});
  svg.style.width=width+"px";
  svg.appendChild(svgNode("title",{id:"waveform-title"},result.name+" waveform for "+result.bits));
  var levelY=function(level){ return level>0?60:level<0?200:130; };
  [[60,"+1"],[130,"0"],[200,"−1"]].forEach(function(row){
    svg.appendChild(svgNode("line",{x1:36,y1:row[0],x2:right,y2:row[0],class:"grid-line"}));
    svg.appendChild(svgNode("text",{x:8,y:row[0]+4,class:"axis-label"},row[1]));
  });
  result.cells.forEach(function(cell,index){
    var x=left+index*bitWidth;
    if(index) svg.appendChild(svgNode("line",{x1:x,y1:38,x2:x,y2:214,class:"bit-divider"}));
    svg.appendChild(svgNode("text",{x:x+halfWidth,y:27,class:"bit-label"},cell.bit));
  });
  var path="",currentY=null;
  result.cells.forEach(function(cell,index){
    cell.levels.forEach(function(level,half){
      var segment=index*2+half,xStart=left+segment*halfWidth,xEnd=xStart+halfWidth,y=levelY(level);
      if(!path){ path="M "+xStart+" "+y; } else if(y!==currentY){ path+=" L "+xStart+" "+y; }
      path+=" L "+xEnd+" "+y;
      currentY=y;
    });
  });
  svg.appendChild(svgNode("path",{d:path,class:"signal"}));
  return svg;
}
function render(result){
  clear(resultEl);
  var metrics=node("div","metrics");
  metrics.appendChild(metric("binary digits",String(result.bitCount)));
  metrics.appendChild(metric("signal transitions",String(result.transitionCount)));
  metrics.appendChild(metric("mean signal level",String(Number(result.meanLevel.toFixed(3)))));
  resultEl.appendChild(metrics);
  var scroll=node("div","waveform-scroll"); scroll.appendChild(drawWaveform(result)); resultEl.appendChild(scroll);
  resultEl.appendChild(node("p","convention",result.convention));
  timelineEl.value=result.copyText;
  copyButton.disabled=false;
  schemeNoteEl.textContent=result.convention;
  statusEl.classList.remove("error");
  statusEl.textContent=result.name+" waveform generated locally.";
}
function calculate(){
  try { render(LineCodingCore.encode({scheme:schemeEl.value,bits:bitsEl.value})); }
  catch(error){
    clear(resultEl); resultEl.appendChild(node("p","empty","Enter a valid binary sequence to draw the waveform."));
    timelineEl.value=""; copyButton.disabled=true;
    statusEl.classList.add("error"); statusEl.textContent=error.message;
  }
}
form.addEventListener("submit",function(event){ event.preventDefault(); calculate(); });
form.addEventListener("input",calculate); form.addEventListener("change",calculate);
exampleButton.addEventListener("click",function(){ bitsEl.value="10110010"; calculate(); });
copyButton.addEventListener("click",function(){
  if(!timelineEl.value) return;
  navigator.clipboard.writeText(timelineEl.value).then(function(){ statusEl.textContent="Half-bit levels copied."; },function(){ timelineEl.focus(); timelineEl.select(); statusEl.textContent="Select and copy the highlighted levels."; });
});
calculate();
})();
</script>
</body>
</html>
