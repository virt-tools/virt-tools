<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Charge Controller Selector — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Charge Controller Selector</h1>
<p>Size a solar charge controller based on array wattage and battery bank voltage. Recommends PWM or MPPT. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-pw">Array wattage</label><input type="text" id="in-pw" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">watts</div></div>
<div class="field"><label class="f" for="in-bv">Battery voltage</label><input type="text" id="in-bv" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">volts</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var pEl=document.getElementById("in-pw"),bEl=document.getElementById("in-bv"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Pw=pn(pEl.value),Bv=pn(bEl.value);
if(Pw==null||Bv==null)return;
if(!isFinite(Pw)||Pw<=0||!isFinite(Bv)||Bv<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var imp=Pw/Bv;
var minA=imp*1.25;
var type=Pw>200?"MPPT":"PWM";
var html='<div class="big">'+rnd(minA,0)+' A controller</div>';
html+=row("Array current",rnd(imp,1)+' A');
html+=row("Min controller rating (1.25×)",rnd(minA,0)+' A');
html+=row("Recommended type",type);
html+=row("Array wattage",rnd(Pw,0)+' W');
html+=row("Battery voltage",rnd(Bv,0)+' V');
out.innerHTML=html;
}
[pEl,bEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
