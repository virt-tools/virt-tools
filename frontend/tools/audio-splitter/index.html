<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Splitter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Splitter</h1>
<p class="subtitle">Split audio into equal segments by duration. Download each as WAV. 100% client-side via Web Audio API.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label style="display:block;margin-top:8px;">Segment length (s): <input type="number" id="segLen" value="30" min="1" step="1" style="width:80px;"></label>
<button id="process" class="primary-btn" style="margin-top:8px;" type="button">Split & Download</button>
<p id="status" style="margin-top:8px;font-style:italic;"></p>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Please select an audio file.');return;}
const status=document.getElementById('status');
status.textContent='Processing...';
const arr=await file.arrayBuffer();
const ctx=new AudioContext();
const audio=await ctx.decodeAudioData(arr);
const segLen=+document.getElementById('segLen').value||30;
const sr=audio.sampleRate;
const samplesPerSeg=Math.floor(segLen*sr);
const numSegs=Math.ceil(audio.length/samplesPerSeg);
const numCh=audio.numberOfChannels;
for(let s=0;s<numSegs;s++){
const start=s*samplesPerSeg;
const end=Math.min(start+samplesPerSeg,audio.length);
const len=end-start;
const buf=ctx.createBuffer(numCh,len,sr);
for(let c=0;c<numCh;c++){
const data=audio.getChannelData(c).subarray(start,end);
buf.copyToChannel(data,c);
}
const wav=audioBufferToWav(buf);
const blob=new Blob([wav],{type:'audio/wav'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='segment_'+(s+1)+'.wav';
a.click();
}
status.textContent='Done! '+numSegs+' segments downloaded.';
});
function audioBufferToWav(buffer){
const numCh=buffer.numberOfChannels;
const len=buffer.length*numCh*2+44;
const arr=new ArrayBuffer(len);
const view=new DataView(arr);
const chs=[];for(let i=0;i<numCh;i++)chs.push(buffer.getChannelData(i));
let off=0;
const writeStr=s=>{for(let j=0;j<s.length;j++)view.setUint8(off++,s.charCodeAt(j));};
writeStr('RIFF');view.setUint32(off,36+len-44,true);off+=4;writeStr('WAVE');
writeStr('fmt ');view.setUint32(off,16,true);off+=4;
view.setUint16(off,1,true);off+=2;view.setUint16(off,numCh,true);off+=2;
view.setUint32(off,buffer.sampleRate,true);off+=4;
view.setUint32(off,buffer.sampleRate*numCh*2,true);off+=4;
view.setUint16(off,numCh*2,true);off+=2;view.setUint16(off,16,true);off+=2;
writeStr('data');view.setUint32(off,len-44,true);off+=4;
for(let i=0;i<buffer.length;i++){
for(let c=0;c<numCh;c++){
let s=Math.max(-1,Math.min(1,chs[c][i]));
view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;
}
}
return arr;
}
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
