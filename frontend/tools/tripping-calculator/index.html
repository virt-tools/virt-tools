<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Tripping Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Tripping Calculator</h1>
<p>Calculate trip time, displacement volume, and surge/swab pressure from string length and tripping speed. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-len">String length</label><input type="text" id="in-len" inputmode="decimal" autocomplete="off" placeholder="e.g. 10000"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-spd">Trip speed</label><input type="text" id="in-spd" inputmode="decimal" autocomplete="off" placeholder="e.g. 60"><div class="unit">ft/min</div></div>
<div class="field"><label class="f" for="in-disp">Displacement per stand</label><input type="text" id="in-disp" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">bbl/stand</div></div>
<div class="field"><label class="f" for="in-spl">Stand length</label><input type="text" id="in-spl" inputmode="decimal" autocomplete="off" placeholder="e.g. 90"><div class="unit">ft/stand</div></div>
</div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lenE=document.getElementById("in-len"),spdE=document.getElementById("in-spd"),dispE=document.getElementById("in-disp"),splE=document.getElementById("in-spl"),out=document.getElementById("out");
function calc(){
var len=parseFloat(lenE.value),spd=parseFloat(spdE.value),disp=parseFloat(dispE.value),spl=parseFloat(splE.value);
if(isNaN(len)||isNaN(spd)||isNaN(disp)||isNaN(spl))return;
var stands=len/spl;
var tripTime=len/spd;
var totalDisp=stands*disp;
var html='<div class="big">'+Math.round(tripTime*10)/10+' min</div>';
html+=row("Trip time",Math.round(tripTime*10)/10+' min ('+Math.round(tripTime/60*100)/100+' hr)');
html+=row("Total stands",Math.round(stands));
html+=row("Displacement volume",Math.round(totalDisp*10)/10+' bbl');
out.innerHTML=html;
}
[lenE,spdE,dispE,splE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
