<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Rate Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Flow Rate Converter</h1>
<p class="subtitle">Convert between GPM, L/s, m³/h, CFM, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Liter/second (L/s)</option>
<option value="0.0166667">Liter/minute (L/min)</option>
<option value="0.0002778">L/hour (L/h)</option>
<option value="0.001">m³/second (m³/s)</option>
<option value="0.0166667">m³/minute</option>
<option value="277.778">m³/hour (m³/h)</option>
<option value="0.0630902">US GPM</option>
<option value="0.00378541">US GPH</option>
<option value="0.0757682">UK GPM</option>
<option value="471.947">CFM (ft³/min)</option>
<option value="0.0283168">ft³/second</option>
<option value="4.71947">ft³/hour</option>
<option value="0.000471947">MMSCFD</option>
<option value="0.000378541">ML/day</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['L/s',1],['L/min',0.0166667],['L/hour',0.00027778],['m³/s',1000],['m³/min',16.6667],['m³/hour',0.27778],['US GPM',0.0630902],['US GPH',0.0010515],['UK GPM',0.075768],['CFM (ft³/min)',0.471947],['ft³/second',28.3168],['ft³/hour',0.0078667],['gal/day (US)',7.578e-5],['ML/day',0.011574]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const lps=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=lps/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
