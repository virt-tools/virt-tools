<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silence Trimmer — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Silence Trimmer</h1>
<p class="subtitle">Remove silence from start and end of audio. Adjustable threshold. Export as WAV. 100% client-side.</p>
<div class="input-section">
<input type="file" id="file" accept="audio/*" aria-label="File">
<label>Threshold (dB): <input type="number" id="threshold" value="-40" step="5"></label>
<button id="process" class="primary-btn" type="button">Trim & Download</button>
</div>
<div id="status"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('process').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
const st=document.getElementById('status');st.textContent='Processing...';
const threshold=parseFloat(document.getElementById('threshold').value);
const audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
const data=buf.getChannelData(0);
const linThresh=Math.pow(10,threshold/20);
let start=0,end=data.length;
for(let i=0;i<data.length;i++){if(Math.abs(data[i])>linThresh){start=i;break;}}
for(let i=data.length-1;i>=0;i--){if(Math.abs(data[i])>linThresh){end=i+1;break;}}
if(start>=end){st.textContent='No non-silent audio found.';audioCtx.close();return;}
const n=end-start,nc=buf.numberOfChannels,sr=buf.sampleRate;
const wavBuf=new ArrayBuffer(44+n*nc*2);
const v=new DataView(wavBuf);
const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
ws(0,'RIFF');v.setUint32(4,36+n*nc*2,true);ws(8,'WAVE');ws(12,'fmt ');
v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);
v.setUint32(24,sr,true);v.setUint32(28,sr*nc*2,true);v.setUint16(32,nc*2,true);v.setUint16(34,16,true);
ws(36,'data');v.setUint32(40,n*nc*2,true);
for(let i=0;i<n;i++)for(let c=0;c<nc;c++)v.setInt16(44+(i*nc+c)*2,Math.max(-32768,Math.min(32767,buf.getChannelData(c)[start+i]*32767)),true);
const blob=new Blob([wavBuf],{type:'audio/wav'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trimmed.wav';a.click();
st.textContent='Done! Trimmed '+start+' to '+end+' ('+((end-start)/sr).toFixed(2)+'s)';
audioCtx.close();
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
