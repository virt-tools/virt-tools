<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIME Type Reference — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>MIME Type Reference</h1>
<p class="subtitle">Searchable reference for common MIME types (content types) with file extensions, descriptions, and category filtering.</p>
<div style="margin-top:1.5rem;">
<input type="text" id="search" placeholder="Search MIME type or extension..." style="width:100%;max-width:500px;padding:.6rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;" aria-label="Search Mime Type Or Extension...">
<div id="mimes" style="margin-top:1rem;"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const types = [
{mime:'text/html',ext:'.html/.htm',cat:'Text',desc:'HyperText Markup Language'},
{mime:'text/css',ext:'.css',cat:'Text',desc:'Cascading Style Sheets'},
{mime:'text/javascript',ext:'.js/.mjs',cat:'Text',desc:'JavaScript (official RFC 4329)'},
{mime:'text/plain',ext:'.txt',cat:'Text',desc:'Plain text, default for unknown types'},
{mime:'text/xml',ext:'.xml',cat:'Text',desc:'eXtensible Markup Language'},
{mime:'text/csv',ext:'.csv',cat:'Text',desc:'Comma-Separated Values'},
{mime:'text/markdown',ext:'.md/.markdown',cat:'Text',desc:'Markdown text format'},
{mime:'text/yaml',ext:'.yaml/.yml',cat:'Text',desc:'YAML Ain\'t Markup Language'},
{mime:'text/tab-separated-values',ext:'.tsv',cat:'Text',desc:'Tab-Separated Values'},
{mime:'text/calendar',ext:'.ics',cat:'Text',desc:'iCalendar format'},
{mime:'application/json',ext:'.json',cat:'Application',desc:'JavaScript Object Notation'},
{mime:'application/xml',ext:'.xml',cat:'Application',desc:'XML (application variant)'},
{mime:'application/yaml',ext:'.yaml/.yml',cat:'Application',desc:'YAML (application variant)'},
{mime:'application/octet-stream',ext:'.*',cat:'Application',desc:'Binary data, unknown type'},
{mime:'application/pdf',ext:'.pdf',cat:'Application',desc:'Portable Document Format'},
{mime:'application/zip',ext:'.zip',cat:'Application',desc:'ZIP archive'},
{mime:'application/gzip',ext:'.gz',cat:'Application',desc:'Gzip compressed file'},
{mime:'application/x-tar',ext:'.tar',cat:'Application',desc:'Tar archive'},
{mime:'application/x-7z-compressed',ext:'.7z',cat:'Application',desc:'7-Zip archive'},
{mime:'application/x-rar-compressed',ext:'.rar',cat:'Application',desc:'RAR archive'},
{mime:'application/x-bzip2',ext:'.bz2',cat:'Application',desc:'Bzip2 compressed file'},
{mime:'application/x-xz',ext:'.xz',cat:'Application',desc:'XZ compressed file'},
{mime:'application/x-shockwave-flash',ext:'.swf',cat:'Application',desc:'Adobe Flash'},
{mime:'application/wasm',ext:'.wasm',cat:'Application',desc:'WebAssembly binary'},
{mime:'application/manifest+json',ext:'.webmanifest',cat:'Application',desc:'Web App Manifest'},
{mime:'application/ld+json',ext:'.jsonld',cat:'Application',desc:'JSON-LD linked data'},
{mime:'application/graphql',ext:'.graphql',cat:'Application',desc:'GraphQL query/response'},
{mime:'application/x-www-form-urlencoded',ext:'N/A',cat:'Application',desc:'URL-encoded form data'},
{mime:'application/x-www-form-urlencoded',ext:'N/A',cat:'Application',desc:'Form POST default encoding'},
{mime:'multipart/form-data',ext:'N/A',cat:'Application',desc:'Multipart form for file uploads'},
{mime:'application/sql',ext:'.sql',cat:'Application',desc:'SQL script'},
{mime:'application/x-sqlite3',ext:'.sqlite/.db',cat:'Application',desc:'SQLite database'},
{mime:'application/pgp-signature',ext:'.asc/.sig',cat:'Application',desc:'PGP signature'},
{mime:'application/pgp-encrypted',ext:'.pgp',cat:'Application',desc:'PGP encrypted message'},
{mime:'image/jpeg',ext:'.jpg/.jpeg',cat:'Image',desc:'JPEG image'},
{mime:'image/png',ext:'.png',cat:'Image',desc:'Portable Network Graphics'},
{mime:'image/gif',ext:'.gif',cat:'Image',desc:'Graphics Interchange Format'},
{mime:'image/webp',ext:'.webp',cat:'Image',desc:'WebP image'},
{mime:'image/svg+xml',ext:'.svg',cat:'Image',desc:'Scalable Vector Graphics'},
{mime:'image/bmp',ext:'.bmp',cat:'Image',desc:'Bitmap image'},
{mime:'image/x-icon',ext:'.ico',cat:'Image',desc:'Windows icon'},
{mime:'image/tiff',ext:'.tif/.tiff',cat:'Image',desc:'Tagged Image File Format'},
{mime:'image/avif',ext:'.avif',cat:'Image',desc:'AV1 Image File Format'},
{mime:'image/heic',ext:'.heic',cat:'Image',desc:'High Efficiency Image Container'},
{mime:'image/apng',ext:'.apng',cat:'Image',desc:'Animated PNG'},
{mime:'audio/mpeg',ext:'.mp3',cat:'Audio',desc:'MP3 audio'},
{mime:'audio/ogg',ext:'.ogg/.oga',cat:'Audio',desc:'Ogg Vorbis audio'},
{mime:'audio/wav',ext:'.wav',cat:'Audio',desc:'Waveform Audio'},
{mime:'audio/webm',ext:'.weba',cat:'Audio',desc:'WebM audio'},
{mime:'audio/aac',ext:'.aac',cat:'Audio',desc:'Advanced Audio Coding'},
{mime:'audio/flac',ext:'.flac',cat:'Audio',desc:'Free Lossless Audio Codec'},
{mime:'audio/midi',ext:'.mid/.midi',cat:'Audio',desc:'Musical Instrument Digital Interface'},
{mime:'audio/x-m4a',ext:'.m4a',cat:'Audio',desc:'MPEG-4 audio'},
{mime:'video/mp4',ext:'.mp4',cat:'Video',desc:'MPEG-4 video'},
{mime:'video/webm',ext:'.webm',cat:'Video',desc:'WebM video'},
{mime:'video/ogg',ext:'.ogv',cat:'Video',desc:'Ogg video'},
{mime:'video/x-msvideo',ext:'.avi',cat:'Video',desc:'AVI video'},
{mime:'video/quicktime',ext:'.mov',cat:'Video',desc:'QuickTime video'},
{mime:'video/x-matroska',ext:'.mkv',cat:'Video',desc:'Matroska video'},
{mime:'video/mpeg',ext:'.mpeg/.mpg',cat:'Video',desc:'MPEG video'},
{mime:'font/woff',ext:'.woff',cat:'Font',desc:'Web Open Font Format 1.0'},
{mime:'font/woff2',ext:'.woff2',cat:'Font',desc:'Web Open Font Format 2.0'},
{mime:'font/ttf',ext:'.ttf',cat:'Font',desc:'TrueType Font'},
{mime:'font/otf',ext:'.otf',cat:'Font',desc:'OpenType Font'},
{mime:'application/font-woff',ext:'.woff',cat:'Font',desc:'WOFF (legacy, use font/woff)'},
];
const catColors = {'Text':'#4a90d9','Application':'#9c27b0','Image':'#4caf50','Audio':'#ff9800','Video':'#f44336','Font':'#795548'};
const container = document.getElementById('mimes');
const search = document.getElementById('search');
function render(){
  const q = search.value.toLowerCase();
  const filtered = q ? types.filter(t=>t.mime.toLowerCase().includes(q)||t.ext.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)) : types;
  if(!filtered.length){ container.innerHTML='<p style="color:#999;">No matching MIME types.</p>'; return; }
  container.innerHTML = filtered.map(t=>(
    '<div style="display:flex;gap:1rem;padding:.7rem 1rem;border:1px solid #eee;border-radius:8px;margin-bottom:.4rem;align-items:center;">'+
      '<span style="min-width:60px;padding:.2rem .5rem;border-radius:4px;background:'+catColors[t.cat]+'22;color:'+catColors[t.cat]+';font-size:.8rem;font-weight:600;">'+t.cat+'</span>'+
      '<div style="flex:1;">'+
        '<div style="font-family:monospace;font-weight:600;">'+t.mime+'</div>'+
        '<div style="font-size:.85rem;color:#666;">'+t.desc+'</div>'+
      '</div>'+
      '<span style="font-family:monospace;font-size:.85rem;color:#999;">'+t.ext+'</span>'+
    '</div>'
  )).join('');
}
search.addEventListener('input', render);
render();
})();
</script>
</body>
</html>
