<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.roi{max-width:500px;margin:0 auto;padding:2rem 1rem}
.roi h1{font-size:2rem;margin-bottom:.5rem}
.roi .sub{color:#888;margin-bottom:1.5rem}
.roi label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.roi input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.roi .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.roi .results{margin-top:2rem}
.roi .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.roi .res-card .big{font-size:2rem;font-weight:700}
.roi .res-card .lbl{color:#888;font-size:13px}
.roi .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.roi table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.roi th,.roi td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.roi th{text-align:left;color:#888;font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="roi">
<h1>📈 ROI Calculator</h1>
<p class="sub">Calculate Return on Investment, annualized ROI, and net profit.</p>
<label for="initial">Initial investment ($):</label>
<input type="number" id="initial" value="10000" min="0" oninput="calc()">
<label for="final">Final value ($):</label>
<input type="number" id="final" value="15000" min="0" oninput="calc()">
<label for="years">Holding period (years):</label>
<input type="number" id="years" value="3" min="0.1" step="0.1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const init=parseFloat(document.getElementById('initial').value)||0;
  const fin=parseFloat(document.getElementById('final').value)||0;
  const yrs=parseFloat(document.getElementById('years').value)||1;
  const netProfit=fin-init;
  const roi=init===0?0:(netProfit/init)*100;
  const annualized=(init<=0||yrs<=0)?0:(Math.pow(fin/init,1/yrs)-1)*100;
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Net Profit</div><div class="big" style="color:'+(netProfit>=0?'#27ae60':'#e74c3c')+'">$'+netProfit.toLocaleString(undefined,{maximumFractionDigits:2})+'</div></div>';
  html+='<div class="res-card"><div class="lbl">ROI</div><div class="big" style="color:'+(roi>=0?'#27ae60':'#e74c3c')+'">'+roi.toFixed(2)+'%</div></div>';
  html+='</div>';
  html+='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Annualized Return</div><div class="big" style="color:'+(annualized>=0?'#27ae60':'#e74c3c')+'">'+annualized.toFixed(2)+'%</div></div>';
  html+='<div class="res-card"><div class="lbl">Holding Period</div><div class="big">'+yrs+' yr</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Formula</div><div style="font-size:13px;margin-top:8px;color:#666">ROI = (Final − Initial) / Initial × 100%<br>Annualized = (Final/Initial)^(1/years) − 1</div></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
