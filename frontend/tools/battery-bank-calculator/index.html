<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Battery Bank Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Battery Bank Calculator</h1>
<p>Calculate number of batteries needed in series and parallel for desired system voltage and total Ah capacity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-bv">Battery voltage</label><input type="text" id="in-bv" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">volts</div></div>
<div class="field"><label class="f" for="in-bah">Battery Ah</label><input type="text" id="in-bah" inputmode="decimal" autocomplete="off" placeholder="e.g. 100"><div class="unit">Ah</div></div>
<div class="field"><label class="f" for="in-sv">System voltage</label><input type="text" id="in-sv" inputmode="decimal" autocomplete="off" placeholder="e.g. 48"><div class="unit">volts</div></div>
<div class="field"><label class="f" for="in-tah">Total Ah needed</label><input type="text" id="in-tah" inputmode="decimal" autocomplete="off" placeholder="e.g. 400"><div class="unit">Ah</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var bEl=document.getElementById("in-bv"),aEl=document.getElementById("in-bah"),sEl=document.getElementById("in-sv"),tEl=document.getElementById("in-tah"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Bv=pn(bEl.value),Bah=pn(aEl.value),Sv=pn(sEl.value),Tah=pn(tEl.value);
if(Bv==null||Bah==null||Sv==null||Tah==null)return;
if(!isFinite(Bv)||Bv<=0||!isFinite(Bah)||Bah<=0||!isFinite(Sv)||Sv<=0||!isFinite(Tah)||Tah<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var series=Math.max(1,Math.ceil(Sv/Bv));
var parallel=Math.ceil(Tah/Bah);
var total=series*parallel;
var totalAh=parallel*Bah;
var totalV=series*Bv;
var totalWh=totalAh*totalV;
var html='<div class="big">'+total+' batteries</div>';
html+=row("Series count",series);
html+=row("Parallel count",parallel);
html+=row("Total batteries",total);
html+=row("Bank voltage",rnd(totalV,0)+' V');
html+=row("Bank capacity",rnd(totalAh,0)+' Ah');
html+=row("Bank energy",rnd(totalWh/1000,2)+' kWh');
out.innerHTML=html;
}
[bEl,aEl,sEl,tEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
