<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Water Content Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Water Content Calculator</h1>
<p>Calculate moisture content and saturation from wet mass, dry mass, and specific gravity. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-wm">Wet mass</label><input type="text" id="in-wm" inputmode="decimal" autocomplete="off" placeholder="e.g. 180"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-dm">Dry mass</label><input type="text" id="in-dm" inputmode="decimal" autocomplete="off" placeholder="e.g. 160"><div class="unit">g</div></div>
<div class="field"><label class="f" for="in-sg">Specific gravity</label><input type="text" id="in-sg" inputmode="decimal" autocomplete="off" placeholder="e.g. 2.65"><div class="unit">—</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wmE=document.getElementById("in-wm"),dmE=document.getElementById("in-dm"),sgE=document.getElementById("in-sg"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var wm=parseFloat(wmE.value),dm=parseFloat(dmE.value),sg=parseFloat(sgE.value);
if(isNaN(wm)||isNaN(dm))return;
if(dm<=0){err.textContent="Enter valid mass.";return}
err.textContent="";
var w=(wm-dm)/dm*100;
var html='<div class="big">'+Math.round(w*10)/10+'%</div>';
html+=row("Moisture content",Math.round(w*10)/10+'%');
html+=row("Water mass",Math.round((wm-dm)*100)/100+' g');
if(!isNaN(sg)&&sg>0){
  var e=w/100*sg;
  html+=row("Void ratio (approx)",Math.round(e*1000)/1000);
}
out.innerHTML=html;
}
[wmE,dmE,sgE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
