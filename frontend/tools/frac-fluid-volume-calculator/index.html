<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Frac Fluid Volume Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Frac Fluid Volume Calculator</h1>
<p>Calculate fracturing fluid volume from stage length, perforation clusters, and fluid rate per cluster. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-sl">Stage length</label><input type="text" id="in-sl" inputmode="decimal" autocomplete="off" placeholder="e.g. 250"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-nc">Clusters per stage</label><input type="text" id="in-nc" inputmode="decimal" autocomplete="off" placeholder="e.g. 10"><div class="unit">—</div></div>
<div class="field"><label class="f" for="in-vpc">Volume per cluster</label><input type="text" id="in-vpc" inputmode="decimal" autocomplete="off" placeholder="e.g. 1500"><div class="unit">bbl</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var slE=document.getElementById("in-sl"),ncE=document.getElementById("in-nc"),vpcE=document.getElementById("in-vpc"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var sl=parseFloat(slE.value),nc=parseFloat(ncE.value),vpc=parseFloat(vpcE.value);
if(isNaN(sl)||isNaN(nc)||isNaN(vpc))return;
err.textContent="";
var totalVol=nc*vpc;
var volPerFt=totalVol/sl;
var html='<div class="big">'+Math.round(totalVol)+' bbl</div>';
html+=row("Total fluid volume",Math.round(totalVol)+' bbl');
html+=row("Volume per stage ft",Math.round(volPerFt*10)/10+' bbl/ft');
html+=row("Fluid per cluster",Math.round(vpc)+' bbl');
out.innerHTML=html;
}
[slE,ncE,vpcE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
