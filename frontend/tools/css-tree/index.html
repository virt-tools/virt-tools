<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Tree Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);border-radius:12px;overflow:hidden;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌲 CSS Tree Generator</h1>
<p>Create CSS tree with triangle foliage and trunk. 4 tree types. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Tree Type</label><select id="type" aria-label="Type"><option value="pine">Pine</option><option value="oak">Oak</option><option value="palm">Palm</option><option value="christmas">Christmas</option></select></div>
<div class="ctrl-row"><label>Leaf Color</label><input type="color" id="leafColor" value="#2e7d32" style="width:60px;height:36px" aria-label="Leaf Color"></div>
<div class="ctrl-row"><label>Trunk Color</label><input type="color" id="trunkColor" value="#6d4c41" style="width:60px;height:36px" aria-label="Trunk Color"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="80" max="240" value="160" style="width:200px" aria-label="Size"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var t=document.getElementById('type').value;
var lc=document.getElementById('leafColor').value;
var tc=document.getElementById('trunkColor').value;
var sz=parseInt(document.getElementById('size').value);
var html='<div class="tree t-'+t+'">\n  <div class="trunk"></div>\n</div>';
var css='.tree{display:flex;flex-direction:column;align-items:center;position:relative}\n';
if(t==='pine'||t==='christmas'){
  var layers=3;
  var lw=sz;
  html='';
  for(var i=0;i<layers;i++){
    html+='  <div class="layer l'+i+'"></div>\n';
  }
  html+='  <div class="trunk"></div>\n</div>';
  css+='.tree.t-'+t+'{display:flex;flex-direction:column;align-items:center}\n';
  for(var i=0;i<layers;i++){
    var w=sz*(1-i*0.2);
    var h=sz*0.35;
    css+='.tree .layer.l'+i+'{width:'+w+'px;height:'+h+'px;clip-path:polygon(50% 0,100% 100%,0 100%);background:'+lc+';margin-bottom:-'+(h*0.15)+'px;'+(t==='christmas'?'box-shadow:0 0 8px rgba(255,255,255,0.3)':'')+'}\n';
  }
  css+='.tree .trunk{width:'+(sz*0.12)+'px;height:'+(sz*0.25)+'px;background:'+tc+'}\n';
}else if(t==='oak'){
  css+='.tree.t-oak::before{content:"";width:'+sz+'px;height:'+sz+'px;background:radial-gradient(circle,'+lc+' 40%,rgba(0,0,0,0.1) 100%);border-radius:50%;position:absolute;bottom:'+(sz*0.3)+'px}\n';
  css+='.tree .trunk{width:'+(sz*0.15)+'px;height:'+(sz*0.4)+'px;background:'+tc+';border-radius:4px;z-index:1}\n';
}else if(t==='palm'){
  css+='.tree.t-palm{position:relative}\n';
  css+='.tree.t-palm .trunk{width:'+(sz*0.08)+'px;height:'+(sz*0.5)+'px;background:'+tc+';border-radius:8px 8px 0 0;position:relative}\n';
  for(var i=0;i<6;i++){
    css+='.tree.t-palm .trunk::before,.tree.t-palm .trunk::after{content:""}\n';
  }
  css+='.tree.t-palm .trunk::before{content:"";position:absolute;top:-'+(sz*0.1)+'px;left:50%;width:'+sz+'px;height:'+(sz*0.3)+'px;background:'+lc+';border-radius:50% 0 50% 0;transform:translateX(-50%) rotate(-20deg);transform-origin:center}\n';
  css+='.tree.t-palm .trunk::after{content:"";position:absolute;top:-'+(sz*0.1)+'px;left:50%;width:'+sz+'px;height:'+(sz*0.3)+'px;background:'+lc+';border-radius:0 50% 0 50%;transform:translateX(-50%) rotate(20deg);transform-origin:center}\n';
  css+='.tree.t-palm{width:'+sz+'px}\n';
}
css+='.tree{width:'+sz+'px}\n';
html='<div class="tree t-'+t+'">\n  <div class="trunk"></div>\n</div>';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['type','leafColor','trunkColor','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
