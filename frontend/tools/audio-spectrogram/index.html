<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Spectrogram — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Audio Spectrogram</h1>
<p class="subtitle">Visualize the frequency spectrum of audio over time. Microphone or file input. 100% client-side.</p>
<div class="input-section">
<button id="mic" class="primary-btn" type="button">Start Microphone</button>
<input type="file" id="file" accept="audio/*" aria-label="File">
<button id="play" class="primary-btn" type="button">Play File</button>
<button id="stop" class="secondary-btn" type="button">Stop</button>
</div>
<canvas id="canvas" width="800" height="400" style="width:100%;max-width:800px;border:1px solid #333;background:#000;"></canvas>
<script>
document.addEventListener('DOMContentLoaded',()=>{
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let audioCtx,analyser,source,rafId;
function draw(){
const w=canvas.width,h=canvas.height;
const bins=analyser.frequencyBinCount;
const data=new Uint8Array(bins);
analyser.getByteFrequencyData(data);
ctx.fillStyle='rgba(0,0,0,0.05)';
ctx.fillRect(0,0,w,h);
const barW=w/bins;
for(let i=0;i<bins;i++){
const v=data[i]/255;
const hue=i/bins*280;
ctx.fillStyle=`hsl(${hue},100%,${v*60+20}%)`;
ctx.fillRect(i*barW,h-v*h,barW-0.5,v*h);
}
rafId=requestAnimationFrame(draw);
}
document.getElementById('mic').addEventListener('click',async()=>{
audioCtx=new AudioContext();
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
source=audioCtx.createMediaStreamSource(stream);
analyser=audioCtx.createAnalyser();
analyser.fftSize=2048;
source.connect(analyser);
draw();
});
document.getElementById('play').addEventListener('click',async()=>{
const file=document.getElementById('file').files[0];
if(!file){alert('Select a file first.');return;}
audioCtx=new AudioContext();
const buf=await audioCtx.decodeAudioData(await file.arrayBuffer());
source=audioCtx.createBufferSource();
source.buffer=buf;
analyser=audioCtx.createAnalyser();
analyser.fftSize=2048;
source.connect(analyser);
analyser.connect(audioCtx.destination);
source.start();
draw();
});
document.getElementById('stop').addEventListener('click',()=>{
if(rafId)cancelAnimationFrame(rafId);
if(source){try{source.stop();}catch(e){}}
if(audioCtx){audioCtx.close();}
ctx.clearRect(0,0,canvas.width,canvas.height);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
