<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Jack-o-Lantern Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#2a2a3e;border-radius:12px;overflow:hidden;position:relative;min-height:300px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🎃 CSS Jack-o-Lantern Generator</h1>
<p>Create CSS Jack-o-Lantern with glowing face, adjustable pumpkin color, glow intensity, flicker animation. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Pumpkin Color</label><input type="color" id="pc" value="#ff7518"></div>
<div class="ctrl-row"><label>Glow Color</label><input type="color" id="gc" value="#ffaa00"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="sz" min="80" max="200" step="5" value="120" style="width:200px"></div>
<div class="ctrl-row"><label>Face</label><select id="face"><option value="classic">Classic</option><option value="happy">Happy</option><option value="scary">Scary</option><option value="angry">Angry</option></select></div>
<div class="ctrl-row"><label>Flicker</label><select id="flicker"><option value="on">On</option><option value="off">Off</option></select></div>
</div>
<h2>Preview</h2>
<div class="preview-box" style="background:#111"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var pc=document.getElementById('pc').value;
var gc=document.getElementById('gc').value;
var sz=document.getElementById('sz').value;
var face=document.getElementById('face').value;
var flicker=document.getElementById('flicker').value;
var html='<div class="jack">\n  <div class="stem"></div>\n  <div class="body">\n    <div class="eyes '+face+'"></div>\n    <div class="nose"></div>\n    <div class="mouth '+face+'"></div>\n  </div>\n</div>';
var css='.jack{display:flex;flex-direction:column;align-items:center}\n';
css+='.stem{width:'+(sz*0.08)+'px;height:'+(sz*0.12)+'px;background:#4a7c2e;border-radius:50% 50% 30% 30%;margin-bottom:-'+(sz*0.04)+'px;z-index:1;transform:rotate(-5deg)}\n';
css+='.body{width:'+sz+'px;height:'+(sz*0.85)+'px;background:radial-gradient(ellipse at 30% 30%,'+pc+'ee,'+pc+' 60%,#c46510 100%);border-radius:50%;position:relative;box-shadow:inset -'+(sz*0.05)+'px 0 '+ (sz*0.1)+'px rgba(0,0,0,0.3),inset '+(sz*0.03)+'px 0 '+(sz*0.08)+'px rgba(255,255,255,0.1)}\n';
var glow=(flicker==='on'?'animation:flick 0.15s infinite alternate;':'');
css+='@keyframes flick{0%{opacity:0.85}100%{opacity:1}}\n';
css+='.eyes.classic::before,.eyes.classic::after{content:"";position:absolute;top:'+(sz*0.2)+'px;width:'+(sz*0.12)+'px;height:'+(sz*0.1)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.05)+'px '+gc+';'+glow+';clip-path:polygon(0 0,100% 0,50% 100%)}\n.eyes.classic::before{left:'+(sz*0.15)+'px}.eyes.classic::after{right:'+(sz*0.15)+'px}\n';
css+='.eyes.happy::before,.eyes.happy::after{content:"";position:absolute;top:'+(sz*0.2)+'px;width:'+(sz*0.12)+'px;height:'+(sz*0.08)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.05)+'px '+gc+';'+glow+';border-radius:0 100% 100% 0;clip-path:polygon(0 0,100% 0,100% 100%)}\n.eyes.happy::before{left:'+(sz*0.15)+'px;transform:scaleX(-1)}.eyes.happy::after{right:'+(sz*0.15)+'px}\n';
css+='.eyes.scary::before,.eyes.scary::after{content:"";position:absolute;top:'+(sz*0.18)+'px;width:'+(sz*0.1)+'px;height:'+(sz*0.14)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.06)+'px '+gc+';'+glow+';clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}\n.eyes.scary::before{left:'+(sz*0.16)+'px}.eyes.scary::after{right:'+(sz*0.16)+'px}\n';
css+='.eyes.angry::before,.eyes.angry::after{content:"";position:absolute;top:'+(sz*0.18)+'px;width:'+(sz*0.13)+'px;height:'+(sz*0.1)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.05)+'px '+gc+';'+glow+';clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}\n.eyes.angry::before{left:'+(sz*0.14)+'px;transform:rotate(-15deg)}.eyes.angry::after{right:'+(sz*0.14)+'px;transform:rotate(15deg)}\n';
css+='.nose{position:absolute;top:'+(sz*0.35)+'px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:'+(sz*0.04)+'px solid transparent;border-right:'+(sz*0.04)+'px solid transparent;border-top:'+(sz*0.08)+'px solid '+gc+';filter:drop-shadow(0 0 '+(sz*0.03)+'px '+gc+')'+(flicker==='on'?' drop-shadow(0 0 '+(sz*0.03)+'px '+gc+')':'')+'}\n';
css+='.mouth.classic{position:absolute;bottom:'+(sz*0.15)+'px;left:50%;transform:translateX(-50%);width:'+(sz*0.5)+'px;height:'+(sz*0.15)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.06)+'px '+gc+';'+glow+';clip-path:polygon(0 0,15% 30%,25% 0,40% 30%,50% 0,60% 30%,75% 0,85% 30%,100% 0,100% 100%,0 100%)}\n';
css+='.mouth.happy{position:absolute;bottom:'+(sz*0.15)+'px;left:50%;transform:translateX(-50%);width:'+(sz*0.4)+'px;height:'+(sz*0.18)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.06)+'px '+gc+';'+glow+';border-radius:0 0 50% 50%}\n';
css+='.mouth.scary{position:absolute;bottom:'+(sz*0.1)+'px;left:50%;transform:translateX(-50%);width:'+(sz*0.5)+'px;height:'+(sz*0.25)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.06)+'px '+gc+';'+glow+';clip-path:polygon(0 0,100% 0,100% 100%,80% 50%,60% 100%,40% 50%,20% 100%,0 50%)}\n';
css+='.mouth.angry{position:absolute;bottom:'+(sz*0.12)+'px;left:50%;transform:translateX(-50%);width:'+(sz*0.45)+'px;height:'+(sz*0.12)+'px;background:'+gc+';box-shadow:0 0 '+(sz*0.06)+'px '+gc+';'+glow+';clip-path:polygon(0 100%,20% 0,40% 100%,60% 0,80% 100%,100% 0,100% 100%)}\n';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['pc','gc','sz','face','flicker'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
