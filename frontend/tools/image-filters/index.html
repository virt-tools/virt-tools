<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Filters — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Image Filters</h1>
<p class="subtitle">Apply CSS-like filters to images — brightness, contrast, saturate, grayscale, sepia, blur, hue-rotate, invert. Download as PNG. 100% client-side.</p>
<div class="input-section">
<label>Image: <input type="file" id="file" accept="image/*"></label>
</div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
<label>Brightness: <input type="range" id="br" value="100" min="0" max="200" style="width:70px"></label>
<label>Contrast: <input type="range" id="ct" value="100" min="0" max="200" style="width:70px"></label>
<label>Saturate: <input type="range" id="sa" value="100" min="0" max="200" style="width:70px"></label>
<label>Grayscale: <input type="range" id="gr" value="0" min="0" max="100" style="width:70px"></label>
<label>Sepia: <input type="range" id="se" value="0" min="0" max="100" style="width:70px"></label>
<label>Blur: <input type="range" id="bl" value="0" min="0" max="20" style="width:70px"></label>
<label>Hue: <input type="range" id="hu" value="0" min="0" max="360" style="width:70px"></label>
<label>Invert: <input type="range" id="iv" value="0" min="0" max="100" style="width:70px"></label>
<button onclick="render()" type="button">Apply</button>
<button onclick="dl()" type="button">Download</button>
</div>
<canvas id="canvas" style="max-width:100%;margin-top:10px;border:1px solid #444;border-radius:6px"></canvas>
<script>
var img;
document.getElementById('file').addEventListener('change',function(){img=new Image();img.src=URL.createObjectURL(this.files[0]);img.onload=render;});
['br','ct','sa','gr','se','bl','hu','iv'].forEach(function(id){document.getElementById(id).addEventListener('input',render);});
function buildFilter(){return 'brightness('+document.getElementById('br').value+'%) contrast('+document.getElementById('ct').value+'%) saturate('+document.getElementById('sa').value+'%) grayscale('+document.getElementById('gr').value+'%) sepia('+document.getElementById('se').value+'%) blur('+document.getElementById('bl').value+'px) hue-rotate('+document.getElementById('hu').value+'deg) invert('+document.getElementById('iv').value+'%)';}
function render(){
if(!img)return;var cv=document.getElementById('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;
var ctx=cv.getContext('2d');ctx.filter=buildFilter();ctx.drawImage(img,0,0);ctx.filter='none';
}
function dl(){var cv=document.getElementById('canvas');var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='filtered.png';a.click();}
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
