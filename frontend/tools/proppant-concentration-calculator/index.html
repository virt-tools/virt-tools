<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Proppant Concentration Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Proppant Concentration Calculator</h1>
<p>Calculate proppant concentration and total proppant mass from fluid volume and proppant loading rate. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-vol">Fluid volume</label><input type="text" id="in-vol" inputmode="decimal" autocomplete="off" placeholder="e.g. 15000"><div class="unit">bbl</div></div>
<div class="field"><label class="f" for="in-rate">Proppant loading</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">lb/gal</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var volE=document.getElementById("in-vol"),rateE=document.getElementById("in-rate"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var vol=parseFloat(volE.value),rate=parseFloat(rateE.value);
if(isNaN(vol)||isNaN(rate))return;
err.textContent="";
var gal=vol*42;
var totalLbs=rate*gal;
var html='<div class="big">'+Math.round(totalLbs).toLocaleString()+' lb</div>';
html+=row("Total proppant mass",Math.round(totalLbs).toLocaleString()+' lb');
html+=row("Fluid volume",vol+' bbl ('+Math.round(gal).toLocaleString()+' gal)');
html+=row("Proppant loading",rate+' lb/gal');
out.innerHTML=html;
}
[volE,rateE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
