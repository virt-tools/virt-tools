<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spray Paint Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Spray Paint Calculator</h1>
<p class="subtitle">Estimate cans of spray paint needed for any project.</p>
<div class="input-section">
<label>Surface Area (sq ft)</label>
<input type="number" id="area" value="50" min="0" aria-label="Area">
<label>Coverage per Can (sq ft)</label>
<input type="number" id="cov" value="25" min="1" aria-label="Cov">
<label>Number of Coats</label>
<input type="number" id="coats" value="2" min="1" aria-label="Coats">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const A=parseFloat(document.getElementById('area').value)||0;
const C=parseFloat(document.getElementById('cov').value)||1;
const N=parseInt(document.getElementById('coats').value)||1;
const total=A*N;
const cans=Math.ceil(total/C);
document.getElementById('result').innerHTML=`
<div class="result-row"><span>Surface Area:</span><span>${A} sq ft</span></div>
<div class="result-row"><span>With ${N} coats:</span><span>${total} sq ft total</span></div>
<div class="result-row"><span>Cans Needed:</span><span>${cans} cans</span></div>`;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
