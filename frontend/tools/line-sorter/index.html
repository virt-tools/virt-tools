<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Sorter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Line Sorter</h1>
<p class="subtitle">Sort lines alphabetically, numerically, by length, or in reverse. Remove empties and duplicates.</p>
<div class="input-section">
<label>Enter lines to sort</label>
<textarea id="input" rows="12" placeholder="banana&#10;apple&#10;cherry" aria-label="Banana&#10;Apple&#10;Cherry"></textarea>
<label>Sort by</label>
<select id="mode" aria-label="Mode">
<option value="alpha">Alphabetical (A→Z)</option>
<option value="alpha-rev">Alphabetical (Z→A)</option>
<option value="numeric">Numeric</option>
<option value="length">By length (shortest first)</option>
<option value="length-rev">By length (longest first)</option>
<option value="shuffle">Random shuffle</option>
<option value="reverse">Reverse order</option>
</select>
<label><input type="checkbox" id="ci"> Case-insensitive</label>
<label><input type="checkbox" id="rmempty"> Remove empty lines</label>
<label><input type="checkbox" id="rmdup"> Remove duplicates</label>
<button id="sort" class="primary-btn" type="button">Sort</button>
<button id="copy" class="secondary-btn" type="button">Copy Result</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('sort').addEventListener('click',()=>{
let lines=document.getElementById('input').value.split('\n');
if(document.getElementById('rmempty').checked)lines=lines.filter(l=>l.trim().length>0);
if(document.getElementById('rmdup').checked){const s=new Set();lines=lines.filter(l=>{const k=document.getElementById('ci').checked?l.toLowerCase():l;if(s.has(k))return false;s.add(k);return true;});}
const mode=document.getElementById('mode').value;
const ci=document.getElementById('ci').checked;
if(mode==='alpha')lines.sort((a,b)=>ci?a.toLowerCase().localeCompare(b.toLowerCase()):a.localeCompare(b));
else if(mode==='alpha-rev')lines.sort((a,b)=>ci?b.toLowerCase().localeCompare(a.toLowerCase()):b.localeCompare(a));
else if(mode==='numeric')lines.sort((a,b)=>parseFloat(a)-parseFloat(b));
else if(mode==='length')lines.sort((a,b)=>a.length-b.length);
else if(mode==='length-rev')lines.sort((a,b)=>b.length-a.length);
else if(mode==='shuffle'){for(let i=lines.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[lines[i],lines[j]]=[lines[j],lines[i]];}}
else if(mode==='reverse')lines.reverse();
document.getElementById('result').innerHTML='<pre style="white-space:pre-wrap;border:1px solid #ccc;padding:1em">'+lines.join('\n').replace(/</g,'&lt;')+'</pre>';
document.getElementById('result').style.display='block';
window._result=lines.join('\n');
});
document.getElementById('copy').addEventListener('click',()=>{if(window._result)navigator.clipboard.writeText(window._result);});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
