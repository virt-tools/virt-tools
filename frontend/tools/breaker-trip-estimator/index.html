<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Breaker Trip Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">All tools</a>
<h1>Breaker Trip Estimator</h1>
<p>Estimate thermal-magnetic breaker trip time for a given overload current. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-rate">Breaker rating</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 20"><div class="unit">amps</div></div>
<div class="field"><label class="f" for="in-load">Overload current</label><input type="text" id="in-load" inputmode="decimal" autocomplete="off" placeholder="e.g. 40"><div class="unit">amps</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter breaker rating and overload current.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var rateEl=document.getElementById("in-rate"),loadEl=document.getElementById("in-load"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var Ir=pn(rateEl.value),Il=pn(loadEl.value);
if(Ir==null||Il==null)return;
if(!isFinite(Ir)||!isFinite(Il)||Ir<=0||Il<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var ratio=Il/Ir;
var tripTime;
if(ratio<=1.0){tripTime="No trip (within rating)"}
else if(ratio<=1.35){tripTime=rnd(3600/Math.pow(ratio-1,2),0)+" s (approx)"}
else if(ratio<=8){tripTime=rnd(100/Math.pow(ratio-1,1.5),1)+" s (approx)"}
else{tripTime="Instant magnetic trip"}
var html='<div class="big">'+(ratio<=1?"OK":rnd(ratio,2)+"×")+'</div>';
html+=row("Breaker rating",rnd(Ir,0)+" A");
html+=row("Load current",rnd(Il,0)+" A");
html+=row("Overload ratio",rnd(ratio,2)+"×");
html+=row("Trip mode",ratio<=1?"No trip":(ratio<=8?"Thermal":"Magnetic"));
html+=row("Est. trip time",tripTime);
out.innerHTML=html;
}
[rateEl,loadEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
