<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Order Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Pizza Order Calculator</h1>
<p class="subtitle">Compare pizza sizes and find the best value per square inch.</p>

<div class="input-section">
  <label>Number of people</label>
  <input type="number" id="people" value="4" min="1" max="50" aria-label="People">
  <label>Slices per person</label>
  <input type="number" id="slices" value="3" min="1" max="10" aria-label="Slices">
  <button id="calc" class="primary-btn" type="button">Calculate</button>
</div>

<div class="result-section" id="result" style="display:none;">
  <div class="big-result" id="bigResult"></div>
  <div id="extras"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('calc').addEventListener('click', () => {
    const people = parseInt(document.getElementById('people').value) || 1;
    const slicesPer = parseInt(document.getElementById('slices').value) || 1;
    const totalSlices = people * slicesPer;

    const sizes = [
      {name:'Small', diameter:10, slices:6, price:8},
      {name:'Medium', diameter:12, slices:8, price:10},
      {name:'Large', diameter:14, slices:10, price:12},
      {name:'X-Large', diameter:16, slices:12, price:14},
      {name:'XX-Large', diameter:18, slices:12, price:16},
    ];

    const best = sizes.map(s => {
      const area = Math.PI * (s.diameter/2)**2;
      const slicesNeeded = totalSlices;
      const pizzasNeeded = Math.ceil(slicesNeeded / s.slices);
      const totalCost = pizzasNeeded * s.price;
      const costPerSqIn = totalCost / (pizzasNeeded * area);
      return {...s, area, pizzasNeeded, totalCost, costPerSqIn};
    }).sort((a,b) => a.totalCost - b.totalCost);

    const cheapest = best[0];
    document.getElementById('bigResult').textContent = `${cheapest.pizzasNeeded} × ${cheapest.name} ($${cheapest.totalCost})`;
    document.getElementById('extras').innerHTML = best.map(s => `
      <div class="result-row">
        <span>${s.pizzasNeeded} × ${s.name} (${s.diameter}")</span>
        <span>$${s.totalCost} · $${s.costPerSqIn.toFixed(2)}/in²</span>
      </div>
    `).join('');
    document.getElementById('result').style.display = 'block';
  });
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
