<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bacon's Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.bacon{max-width:700px;margin:0 auto;padding:2rem 1rem}
.bacon h1{font-size:2rem;margin-bottom:.5rem}
.bacon .sub{color:#888;margin-bottom:1.5rem}
.bacon textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.bacon .row{display:flex;gap:1rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.bacon select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.bacon .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.bacon .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.bacon table{margin-top:1rem;width:100%;border-collapse:collapse;font-size:13px}
.bacon th,.bacon td{border:1px solid var(--border);padding:6px 10px;text-align:center}
.bacon th{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="bacon">
<h1>🥓 Bacon's Cipher</h1>
<p class="sub">Encode and decode text using Bacon's cipher — each letter represented by a 5-bit binary sequence (A/B).</p>
<textarea id="input" placeholder="Enter text to encode or decode..." aria-label="Enter Text To Encode Or Decode..."></textarea>
<div class="row">
<label>Mode:</label>
<select id="mode" aria-label="Mode"><option value="encode">Encode</option><option value="decode">Decode</option></select>
<button class="btn" id="run" type="button">Run</button>
</div>
<div class="output" id="output"></div>
<table id="table"></table>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input=document.getElementById('input');
const mode=document.getElementById('mode');
const runBtn=document.getElementById('run');
const output=document.getElementById('output');
const table=document.getElementById('table');
const CIPHER='AAAAABBBBBABBAABABAAABBABBABAAABAABBABABABBABAABBAB'.replace(/ /g,'');

function encode(text){
  text=text.toUpperCase().replace(/[^A-Z]/g,'');
  let result='';
  for(const ch of text){
    const idx=ch.charCodeAt(0)-65;
    if(idx>=0&&idx<26){
      const bits=CIPHER.substr(idx*5,5);
      result+=bits.split('').map(b=>b==='A'?'A':'B').join('')+' ';
    }
  }
  return result.trim();
}

function decode(text){
  text=text.toUpperCase().replace(/[^AB]/g,'');
  let result='';
  for(let i=0;i+5<=text.length;i+=5){
    const group=text.substr(i,5).replace(/A/g,'0').replace(/B/g,'1');
    const idx=parseInt(group,2);
    if(idx<26)result+=String.fromCharCode(65+idx);
  }
  return result;
}

function renderTable(){
  let html='<tr><th>Letter</th><th>Binary</th><th>Bacon</th></tr>';
  for(let i=0;i<26;i++){
    const ch=String.fromCharCode(65+i);
    const bits=CIPHER.substr(i*5,5);
    const bin=bits.replace(/A/g,'0').replace(/B/g,'1');
    html+='<tr><td>'+ch+'</td><td>'+bin+'</td><td>'+bits+'</td></tr>';
  }
  table.innerHTML=html;
}

runBtn.addEventListener('click',()=>{
  const text=input.value;const m=mode.value;
  output.textContent=m==='encode'?encode(text):decode(text);
});
renderTable();
})();
</script>
</body>
</html>
