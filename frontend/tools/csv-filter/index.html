<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Filter & Search — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>CSV Filter & Search</h1>
<p class="subtitle">Filter CSV rows by column value, numeric range, or text search. 100% client-side.</p>
<div class="input-section">
<label>Paste CSV</label>
<textarea id="input" rows="8" placeholder="name,age,city&#10;Alice,30,NYC&#10;Bob,25,LA" aria-label="Name,Age,City&#10;Alice,30,Nyc&#10;Bob,25,La"></textarea>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
<select id="col" aria-label="Col"><option value="-1">All columns</option></select>
<select id="mode" aria-label="Mode"><option value="contains">Contains</option><option value="equals">Equals</option><option value="gt">Greater than</option><option value="lt">Less than</option></select>
<input id="val" type="text" placeholder="Filter value" style="flex:1;min-width:120px;" aria-label="Filter Value">
<button id="filter" class="primary-btn" type="button">Filter</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseCSV(text){
const rows=[];let row=[];let field='';let inQ=false;
for(let i=0;i<text.length;i++){
const c=text[i];
if(inQ){
if(c==='"'&&text[i+1]==='"'){field+='"';i++;}
else if(c==='"'){inQ=false;}
else{field+=c;}
}else{
if(c==='"'){inQ=true;}
else if(c===','){row.push(field);field='';}
else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
else if(c==='\r'){continue;}
else{field+=c;}
}
}
if(field||row.length){row.push(field);rows.push(row);}
return rows;
}
function toCSV(rows){
return rows.map(r=>r.map(v=>{
if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';
return v;
}).join(',')).join('\n');
}
const input=document.getElementById('input');
const colSel=document.getElementById('col');
input.addEventListener('input',()=>{
const rows=parseCSV(input.value);
if(rows.length){colSel.innerHTML='<option value="-1">All columns</option>'+rows[0].map((h,i)=>'<option value="'+i+'">'+h+'</option>').join('');}
});
document.getElementById('filter').addEventListener('click',()=>{
const text=input.value;if(!text.trim()){return;}
const rows=parseCSV(text);if(!rows.length){return;}
const header=rows[0];const data=rows.slice(1);
const colIdx=parseInt(colSel.value);
const mode=colSel.value;const op=document.getElementById('mode').value;
const val=document.getElementById('val').value.toLowerCase();
const filtered=data.filter(r=>{
if(colIdx<0){return r.some(c=>c.toLowerCase().includes(val));}
const cell=r[colIdx]||'';
if(op==='contains')return cell.toLowerCase().includes(val);
if(op==='equals')return cell.toLowerCase()===val;
if(op==='gt')return parseFloat(cell)>parseFloat(val);
if(op==='lt')return parseFloat(cell)<parseFloat(val);
return true;
});
const out=[header,...filtered];
const ta=document.createElement('textarea');ta.value=toCSV(out);ta.rows=8;ta.style.width='100%';
const btn=document.createElement('button');btn.textContent='Copy';btn.className='primary-btn';btn.style.marginTop='4px';
btn.addEventListener('click',()=>{ta.select();document.execCommand('copy');btn.textContent='Copied!';});
const r=document.getElementById('result');r.innerHTML='<p>'+filtered.length+' rows matched.</p>';r.appendChild(ta);r.appendChild(btn);
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
