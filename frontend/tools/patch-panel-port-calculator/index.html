<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Patch Panel Port Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Patch Panel Port Calculator</h1>
<p>Calculate the number of patch panels, rack units needed, and port utilization from cable count and ports per panel. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-cb">Cables</label><input type="text" id="in-cb" inputmode="numeric" autocomplete="off" placeholder="e.g. 96"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-pp">Ports per panel</label><input type="text" id="in-pp" inputmode="numeric" autocomplete="off" placeholder="e.g. 24"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-ru">RU per panel</label><input type="text" id="in-ru" inputmode="numeric" autocomplete="off" placeholder="e.g. 1"><div class="unit">RU</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var cbEl=document.getElementById("in-cb"),ppEl=document.getElementById("in-pp"),ruEl=document.getElementById("in-ru"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var CB=parseInt(cbEl.value),PP=parseInt(ppEl.value),RU=parseInt(ruEl.value);
if(isNaN(CB)||isNaN(PP)||isNaN(RU))return;
if(CB<=0||PP<=0||RU<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var panelsNeeded=Math.ceil(CB/PP);
var totalPorts=panelsNeeded*PP;
var totalRU=panelsNeeded*RU;
var utilization=Math.round((CB/totalPorts)*100);
var html='<div class="big">'+panelsNeeded+' panel'+(panelsNeeded>1?"s":"")+'</div>';
html+=row("Panels needed",panelsNeeded);
html+=row("Total ports",totalPorts);
html+=row("Total rack units",totalRU+" RU");
html+=row("Port utilization",utilization+"%");
html+=row("Spare ports",totalPorts-CB);
out.innerHTML=html;
}
[cbEl,ppEl,ruEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
