<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Spirograph Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:#111;border-radius:12px;overflow:hidden;position:relative;height:400px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🌀 CSS Spirograph Generator</h1>
<p>Create CSS spirograph / geometric rotating pattern animations. Adjustable petals, colors, speed. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Petals</label><input type="range" id="petals" min="3" max="24" step="1" value="6" style="width:200px" aria-label="Petals"></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="100" max="300" step="10" value="200" style="width:200px" aria-label="Size"></div>
<div class="ctrl-row"><label>Speed (s)</label><input type="range" id="speed" min="3" max="30" step="1" value="10" style="width:200px" aria-label="Speed"></div>
<div class="ctrl-row"><label>Color 1</label><input type="color" id="c1" value="#ff0088" aria-label="C1"></div>
<div class="ctrl-row"><label>Color 2</label><input type="color" id="c2" value="#0088ff" aria-label="C2"></div>
<div class="ctrl-row"><label>Color 3</label><input type="color" id="c3" value="#00ff88" aria-label="C3"></div>
<div class="ctrl-row"><label>BG Color</label><input type="color" id="bgcolor" value="#111" aria-label="Bgcolor"></div>
<div class="ctrl-row"><label>Border Width</label><input type="range" id="bw" min="1" max="10" step="1" value="3" style="width:200px" aria-label="Bw"></div>
</div>
<h2>Preview</h2>
<div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var n=parseInt(document.getElementById('petals').value);
var sz=parseInt(document.getElementById('size').value);
var sp=parseFloat(document.getElementById('speed').value);
var c1=document.getElementById('c1').value;var c2=document.getElementById('c2').value;var c3=document.getElementById('c3').value;
var bg=document.getElementById('bgcolor').value;var bw=parseInt(document.getElementById('bw').value);
var cols=[c1,c2,c3];
var html='<div class="spiro">\n';
for(var i=0;i<n;i++){
var ang=(360/n)*i;var c=cols[i%3];
html+='<div class="spiro-petal" style="border-color:'+c+';transform:rotate('+ang+'deg) translate('+sz/3+'px);border-width:'+bw+'px;animation-delay:-'+(i*(sp/n))+'s"></div>';
}
html+='</div>';
var css='.spiro{position:relative;width:'+sz+'px;height:'+sz+'px;display:flex;align-items:center;justify-content:center}\n';
css+='.spiro-petal{position:absolute;width:'+(sz*0.8)+'px;height:'+(sz*0.8)+'px;border:'+bw+'px solid;border-radius:50%;opacity:.5;transform-origin:center;animation:spiro-rot '+sp+'s linear infinite}\n';
css+='@keyframes spiro-rot{from{transform:rotate(var(--r,0deg)) translate('+(sz/3)+'px) rotate(0deg)}to{transform:rotate(var(--r,0deg)) translate('+(sz/3)+'px) rotate(360deg)}}';
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['petals','size','speed','c1','c2','c3','bgcolor','bw'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
