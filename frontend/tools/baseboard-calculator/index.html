<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Baseboard Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Baseboard Calculator</h1>
<p>Calculate linear feet of baseboard needed for a room, accounting for doors and waste. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-l">Room length</label><input type="text" id="in-l" inputmode="decimal" autocomplete="off" placeholder="e.g. 4000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-w">Room width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-doors">Door openings</label><input type="text" id="in-doors" inputmode="decimal" autocomplete="off" placeholder="e.g. 1"><div class="unit">count</div></div>
<div class="field"><label class="f" for="in-dw">Door width</label><input type="text" id="in-dw" inputmode="decimal" autocomplete="off" placeholder="e.g. 800"><div class="unit">mm</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter room dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var lEl=document.getElementById("in-l"),wEl=document.getElementById("in-w"),dEl=document.getElementById("in-doors"),dwEl=document.getElementById("in-dw"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var L=pn(lEl.value),W=pn(wEl.value),D=pn(dEl.value),DW=pn(dwEl.value);
if(L==null||W==null){return}
D=D==null?1:D;DW=DW==null?800:DW;
if(!isFinite(L)||!isFinite(W)||!isFinite(D)||!isFinite(DW)||L<=0||W<=0||D<0||DW<0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var perim=2*(L+W);
var net=perim-D*DW;
var waste=Math.ceil(net*0.1);
var total=net+waste;
var lf=total/304.8;
var html='<div class="big">'+rnd(lf,1)+' ft</div>';
html+=row("Perimeter",rnd(perim,0)+" mm");
html+=row("Door deductions",rnd(D*DW,0)+" mm");
html+=row("Net length",rnd(net,0)+" mm");
html+=row("10% waste",rnd(waste,0)+" mm");
html+=row("Total to buy",rnd(total,0)+" mm");
html+=row("Linear feet",rnd(lf,1)+" ft");
out.innerHTML=html;
}
[lEl,wEl,dEl,dwEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
