<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Compost Thermometer Placement — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Compost Thermometer Placement</h1>
<p>Calculate probe insertion depth and hot zone height for a compost pile from pile dimensions. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Pile width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 3"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-h">Pile height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 4"><div class="unit">ft</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value);
if(W==null||H==null)return;
if(!isFinite(W)||!isFinite(H)||W<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var hotZone=H*0.6;
var probeDepth=H*0.5;
var minTemp=H<2?"80-110":H<4?"110-140":"131+";
var html='<div class="big">'+rnd(probeDepth,1)+' ft</div>';
html+=row("Pile width",rnd(W,1)+' ft');
html+=row("Pile height",rnd(H,1)+' ft');
html+=row("Hot zone height",rnd(hotZone,1)+' ft');
html+=row("Probe depth",rnd(probeDepth,1)+' ft');
html+=row("Expected temp",minTemp+' F');
out.innerHTML=html;
}
[wEl,hEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
