<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Lightning Effect Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;padding:0;background:#0a0a12;border-radius:12px;overflow:hidden;height:300px;position:relative}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>⚡ CSS Lightning Effect Generator</h1>
<p>Create CSS lightning bolt and electric flash animations. 4 presets, adjustable color/speed/intensity. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Preset</label><select id="preset" aria-label="Preset"><option value="classic" selected>Classic</option><option value="storm">Storm</option><option value="plasma">Plasma</option><option value="neon">Neon</option></select></div>
<div class="ctrl-row"><label>Speed</label><select id="speed" aria-label="Speed"><option value="slow">Slow</option><option value="normal" selected>Normal</option><option value="fast">Fast</option></select></div>
<div class="ctrl-row"><label>Bolt Color</label><input type="color" id="color" value="#ffffff" style="width:60px;height:34px" aria-label="Color"></div>
<div class="ctrl-row"><label>Glow Color</label><input type="color" id="glowColor" value="#88ccff" style="width:60px;height:34px" aria-label="Glow Color"></div>
<div class="ctrl-row"><label>Bg Color</label><input type="color" id="bgColor" value="#0a0a1a" style="width:60px;height:34px" aria-label="Bg Color"></div>
<div class="ctrl-row"><label>Intensity</label><input type="range" id="intensity" value="3" min="1" max="6" style="width:120px" aria-label="Intensity"></div>
<div class="ctrl-row"><button class="copy-btn" onclick="update()" type="button">Update</button></div>
</div>
<h2>Preview</h2>
<div class="preview-box" id="preview"></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly aria-label="Html Out"></textarea><button class="copy-btn" onclick="copyText('htmlOut')" type="button">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly aria-label="Css Out"></textarea><button class="copy-btn" onclick="copyText('cssOut')" type="button">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var preset=document.getElementById('preset').value;
var speed=document.getElementById('speed').value;
var color=document.getElementById('color').value;
var glowColor=document.getElementById('glowColor').value;
var bgColor=document.getElementById('bgColor').value;
var intensity=parseInt(document.getElementById('intensity').value);
var dur=speed==='slow'?'6s':speed==='fast'?'2s':'4s';
var glowSize=intensity*4;
var html='<div class="lightning-scene">\n  <div class="flash"></div>\n  <div class="bolt"></div>\n</div>';
var css='.lightning-scene{width:100%;height:300px;background:'+bgColor+';position:relative;overflow:hidden}\n';
css+='.flash{position:absolute;inset:0;background:'+glowColor+';opacity:0;animation:flash-anim '+dur+' ease-out infinite}\n';
css+='.bolt{position:absolute;left:50%;top:0;width:'+(intensity*2)+'px;height:100%;background:linear-gradient(to bottom,'+color+' 0%,'+color+' 48%,transparent 48%,'+color+' 52%,'+color+' 100%);filter:drop-shadow(0 0 '+glowSize+'px '+glowColor+');clip-path:polygon(40% 0%,60% 0%,55% 20%,65% 20%,55% 40%,70% 40%,50% 60%,65% 60%,45% 80%,60% 80%,40% 100%,35% 80%,50% 80%,30% 60%,45% 60%,35% 40%,50% 40%,40% 20%,45% 20%);opacity:0;animation:bolt-anim '+dur+' ease-out infinite}\n';
if(preset==='storm'){css+='.flash{animation-duration:'+(parseFloat(dur)*0.7)+'s}\n'}
if(preset==='plasma'){css+='.bolt{filter:drop-shadow(0 0 '+glowSize+'px '+color+') drop-shadow(0 0 '+(glowSize*2)+'px '+glowColor+')}\n'}
if(preset==='neon'){css+='.bolt{filter:drop-shadow(0 0 '+glowSize+'px '+color+') drop-shadow(0 0 '+(glowSize*3)+'px '+color+')}\n.flash{background:'+color+'}\n'}
css+='@keyframes flash-anim{0%,90%,100%{opacity:0}2%{opacity:0.6}4%{opacity:0.1}6%{opacity:0.4}8%{opacity:0}}\n';
css+='@keyframes bolt-anim{0%,90%,100%{opacity:0;transform:scaleX(1)}2%{opacity:1;transform:scaleX(1)}4%{opacity:0.3}6%{opacity:0.9;transform:scaleX(1.2)}8%{opacity:0}}';
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['preset','speed','color','glowColor','bgColor','intensity'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
