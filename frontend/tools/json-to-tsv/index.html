<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to TSV Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON to TSV Converter</h1>
<p class="subtitle">Convert JSON array of objects to tab-separated values. Auto-detects columns.</p>
<div class="input-section">
<label>JSON Input</label>
<textarea id="input" rows="8" placeholder='[{"name":"Alice","age":30}]' aria-label="[{"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value){const result=document.getElementById('result'),output=document.createElement('textarea'),copy=document.createElement('button');output.rows=10;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label','TSV output');output.value=value;copy.type='button';copy.textContent='Copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));result.replaceChildren(output,copy);}
function renderError(message){const error=document.createElement('p');error.style.color='red';error.textContent='Error: '+message;document.getElementById('result').replaceChildren(error);}
function escTab(s){return String(s).replace(/\t/g,'\\t').replace(/\n/g,'\\n');}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
if(!text.trim()){return;}
try{
const data=JSON.parse(text);
if(!Array.isArray(data)||data.length===0){throw new Error('Need a non-empty array of objects');}
const cols=[];
data.forEach(o=>{if(typeof o==='object'&&o){Object.keys(o).forEach(k=>{if(!cols.includes(k))cols.push(k);});}});
let tsv=cols.join('\t')+'\n';
data.forEach(o=>{
tsv+=cols.map(c=>escTab(o&&o[c]!==undefined?o[c]:'')).join('\t')+'\n';
});
renderOutput(tsv);
}catch(e){renderError(e.message);}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
