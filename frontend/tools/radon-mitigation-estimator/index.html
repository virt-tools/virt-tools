<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Radon Mitigation Estimator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Radon Mitigation Estimator</h1>
<p>Estimate pipe size and fan capacity for a sub-slab radon mitigation system from slab area. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-a">Slab area</label><input type="text" id="in-a" inputmode="decimal" autocomplete="off" placeholder="e.g. 1200"><div class="unit">sq ft</div></div>
<div class="field"><label class="f" for="in-p">Pit depth</label><input type="text" id="in-p" inputmode="decimal" autocomplete="off" placeholder="e.g. 6"><div class="unit">in</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var aEl=document.getElementById("in-a"),pEl=document.getElementById("in-p"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var A=pn(aEl.value),P=pn(pEl.value);
if(A==null||P==null)return;
if(!isFinite(A)||!isFinite(P)||A<=0||P<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var pipeDia=A>2000?4:3;
var pitVol=A*P/144;
var fanCFM=Math.ceil(A/100)*20;
var html='<div class="big">'+pipeDia+'" pipe</div>';
html+=row("Slab area",rnd(A,0)+' sq ft');
html+=row("Pipe diameter",pipeDia+'"');
html+=row("Pit volume",rnd(pitVol,1)+' cu ft');
html+=row("Fan capacity",fanCFM+' CFM');
out.innerHTML=html;
}
[aEl,pEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
