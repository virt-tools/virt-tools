<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Beam Camber Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Beam Camber Calculator</h1>
<p>Calculate required camber, deflection under load, and camber percentage for steel beams from span and uniform load. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-span">Span</label><input type="text" id="in-span" inputmode="decimal" autocomplete="off" placeholder="e.g. 30"><div class="unit">ft</div></div>
<div class="field"><label class="f" for="in-load">Uniform load</label><input type="text" id="in-load" inputmode="numeric" autocomplete="off" placeholder="e.g. 1000"><div class="unit">lb/ft</div></div>
<div class="field"><label class="f" for="in-i">Moment of inertia</label><input type="text" id="in-i" inputmode="numeric" autocomplete="off" placeholder="e.g. 100"><div class="unit">in⁴</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var spanEl=document.getElementById("in-span"),loadEl=document.getElementById("in-load"),iEl=document.getElementById("in-i"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var SP=parseFloat(spanEl.value),LD=parseInt(loadEl.value),I=parseInt(iEl.value);
if(isNaN(SP)||isNaN(LD)||isNaN(I))return;
if(SP<=0||LD<=0||I<=0){err.textContent="All values must be positive.";return}
err.textContent="";
var E=29e6;
var L=SP*12;
var deflection=(5*LD*L*L*L*L)/(384*E*I);
var camber=deflection*0.8;
var camberPct=(camber/L)*100;
var html='<div class="big">'+Math.round(camber*1000)/1000+'" camber</div>';
html+=row("Max deflection",Math.round(deflection*1000)/1000+' in');
html+=row("Required camber",Math.round(camber*1000)/1000+' in (80%)');
html+=row("Camber ratio",Math.round(camberPct*100)/100+"%");
html+=row("Span-to-depth",Math.round(SP*12/(I/12))*10/10);
out.innerHTML=html;
}
[spanEl,loadEl,iEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
