<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Name Lookup — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:sans-serif;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto}
h1{color:#58a6ff;font-size:1.6em}
.back{color:#8b949e;text-decoration:none;font-size:.85em}
.back:hover{color:#58a6ff}
input[type="color"]{width:80px;height:80px;border:1px solid #30363d;border-radius:8px;cursor:pointer;background:none;vertical-align:middle}
input[type="text"]{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:monospace;font-size:1em;width:120px}
.result{margin-top:15px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:15px}
.swatch{display:inline-block;width:60px;height:60px;border-radius:8px;vertical-align:middle;margin-right:15px;border:1px solid #30363d}
table{width:100%;border-collapse:collapse;margin-top:10px}
td{padding:6px 10px;border-bottom:1px solid #21262d;font-size:.9em}
td:first-child{color:#8b949e;width:35%}
td:last-child{color:#c9d1d9;font-family:monospace}
.match-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #21262d}
.match-swatch{width:30px;height:30px;border-radius:6px;border:1px solid #30363d;flex-shrink:0}
.match-info{flex-grow:1}
.match-name{color:#c9d1d9;font-weight:500}
.match-hex{color:#8b949e;font-size:.85em;font-family:monospace}
.match-dist{color:#f0883e;font-size:.85em}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="tool-container">
<div class="container">
<h1>Color Name Lookup</h1>
<a class="back" href="/">← Back to all tools</a>
<p style="color:#8b949e;font-size:.9em">Find the nearest named color for any hex value. Uses CSS named colors + extended set.</p>
<div style="margin:15px 0;display:flex;align-items:center;gap:15px">
<input type="color" id="colorPicker" value="#58a6ff" oninput="updateFromPicker()" aria-label="Color Picker">
<input type="text" id="hexInput" value="#58a6ff" oninput="updateFromHex()" placeholder="#rrggbb" aria-label="#Rrggbb">
</div>
<div id="result" class="result"></div>
</div>
<script src="/assets/tools.js"></script>
</main>
<script src="/assets/app.js"></script>
<script>
const COLORS = [
["AliceBlue","#f0f8ff"],["AntiqueWhite","#faebd7"],["Aqua","#00ffff"],["Aquamarine","#7fffd4"],["Azure","#f0ffff"],
["Beige","#f5f5dc"],["Bisque","#ffe4c4"],["Black","#000000"],["BlanchedAlmond","#ffebcd"],["Blue","#0000ff"],
["BlueViolet","#8a2be2"],["Brown","#a52a2a"],["BurlyWood","#deb887"],["CadetBlue","#5f9ea0"],["Chartreuse","#7fff00"],
["Chocolate","#d2691e"],["Coral","#ff7f50"],["CornflowerBlue","#6495ed"],["Cornsilk","#fff8dc"],["Crimson","#dc143c"],
["Cyan","#00ffff"],["DarkBlue","#00008b"],["DarkCyan","#008b8b"],["DarkGoldenRod","#b8860b"],["DarkGray","#a9a9a9"],
["DarkGreen","#006400"],["DarkKhaki","#bdb76b"],["DarkMagenta","#8b008b"],["DarkOliveGreen","#556b2f"],["DarkOrange","#ff8c00"],
["DarkOrchid","#9932cc"],["DarkRed","#8b0000"],["DarkSalmon","#e9967a"],["DarkSeaGreen","#8fbc8f"],["DarkSlateBlue","#483d8b"],
["DarkSlateGray","#2f4f4f"],["DarkTurquoise","#00ced1"],["DarkViolet","#9400d3"],["DeepPink","#ff1493"],["DeepSkyBlue","#00bfff"],
["DimGray","#696969"],["DodgerBlue","#1e90ff"],["FireBrick","#b22222"],["FloralWhite","#fffaf0"],["ForestGreen","#228b22"],
["Fuchsia","#ff00ff"],["Gainsboro","#dcdcdc"],["GhostWhite","#f8f8ff"],["Gold","#ffd700"],["GoldenRod","#daa520"],
["Gray","#808080"],["Green","#008000"],["GreenYellow","#adff2f"],["HoneyDew","#f0fff0"],["HotPink","#ff69b4"],
["IndianRed","#cd5c5c"],["Indigo","#4b0082"],["Ivory","#fffff0"],["Khaki","#f0e68c"],["Lavender","#e6e6fa"],
["LavenderBlush","#fff0f5"],["LawnGreen","#7cfc00"],["LemonChiffon","#fffacd"],["LightBlue","#add8e6"],["LightCoral","#f08080"],
["LightCyan","#e0ffff"],["LightGoldenRodYellow","#fafad2"],["LightGray","#d3d3d3"],["LightGreen","#90ee90"],["LightPink","#ffb6c1"],
["LightSalmon","#ffa07a"],["LightSeaGreen","#20b2aa"],["LightSkyBlue","#87cefa"],["LightSlateGray","#778899"],["LightSteelBlue","#b0c4de"],
["LightYellow","#ffffe0"],["Lime","#00ff00"],["LimeGreen","#32cd32"],["Linen","#faf0e6"],["Magenta","#ff00ff"],
["Maroon","#800000"],["MediumAquaMarine","#66cdaa"],["MediumBlue","#0000cd"],["MediumOrchid","#ba55d3"],["MediumPurple","#9370db"],
["MediumSeaGreen","#3cb371"],["MediumSlateBlue","#7b68ee"],["MediumSpringGreen","#00fa9a"],["MediumTurquoise","#48d1cc"],["MediumVioletRed","#c71585"],
["MidnightBlue","#191970"],["MintCream","#f5fffa"],["MistyRose","#ffe4e1"],["Moccasin","#ffe4b5"],["NavajoWhite","#ffdead"],
["Navy","#000080"],["OldLace","#fdf5e6"],["Olive","#808000"],["OliveDrab","#6b8e23"],["Orange","#ffa500"],
["OrangeRed","#ff4500"],["Orchid","#da70d6"],["PaleGoldenRod","#eee8aa"],["PaleGreen","#98fb98"],["PaleTurquoise","#afeeee"],
["PaleVioletRed","#db7093"],["PapayaWhip","#ffefd5"],["PeachPuff","#ffdab9"],["Peru","#cd853f"],["Pink","#ffc0cb"],
["Plum","#dda0dd"],["PowderBlue","#b0e0e6"],["Purple","#800080"],["RebeccaPurple","#663399"],["Red","#ff0000"],
["RosyBrown","#bc8f8f"],["RoyalBlue","#4169e1"],["SaddleBrown","#8b4513"],["Salmon","#fa8072"],["SandyBrown","#f4a460"],
["SeaGreen","#2e8b57"],["SeaShell","#fff5ee"],["Sienna","#a0522d"],["Silver","#c0c0c0"],["SkyBlue","#87ceeb"],
["SlateBlue","#6a5acd"],["SlateGray","#708090"],["Snow","#fffafa"],["SpringGreen","#00ff7f"],["SteelBlue","#4682b4"],
["Tan","#d2b48c"],["Teal","#008080"],["Thistle","#d8bfd8"],["Tomato","#ff6347"],["Turquoise","#40e0d0"],
["Violet","#ee82ee"],["Wheat","#f5deb3"],["White","#ffffff"],["WhiteSmoke","#f5f5f5"],["Yellow","#ffff00"],["YellowGreen","#9acd32"]
];
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.substring(0,2),16),parseInt(h.substring(2,4),16),parseInt(h.substring(4,6),16)];}
function dist(a,b){return Math.sqrt(Math.pow(a[0]-b[0],2)+Math.pow(a[1]-b[1],2)+Math.pow(a[2]-b[2],2));}
function findMatch(hex){
  const rgb=hexToRgb(hex);if(!rgb)return null;
  const matches=COLORS.map(([name,h])=>({name,h,d:dist(rgb,hexToRgb(h))})).sort((a,b)=>a.d-b.d);
  return matches;
}
function updateFromPicker(){
  document.getElementById('hexInput').value=document.getElementById('colorPicker').value;
  showResult();
}
function updateFromHex(){
  let v=document.getElementById('hexInput').value;
  if(!v.startsWith('#'))v='#'+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){document.getElementById('colorPicker').value=v;showResult();}
}
function showResult(){
  const hex=document.getElementById('hexInput').value;
  const matches=findMatch(hex);if(!matches)return;
  const top=matches.slice(0,5);
  let html='<div style="display:flex;align-items:center;margin-bottom:15px"><div class="swatch" style="background:'+hex+'"></div><div><div style="font-size:1.2em;color:#c9d1d9">'+top[0].name+'</div><div style="color:#8b949e;font-family:monospace;font-size:.9em">'+top[0].h+'</div></div></div>';
  html+='<div style="color:#8b949e;font-size:.85em;margin-bottom:8px">Top 5 nearest named colors:</div>';
  top.forEach((m,i)=>{
    html+='<div class="match-row"><div class="match-swatch" style="background:'+m.h+'"></div><div class="match-info"><div class="match-name">'+(i+1)+'. '+m.name+'</div><div class="match-hex">'+m.h+'</div></div><div class="match-dist">Δ'+m.d.toFixed(0)+'</div></div>';
  });
  document.getElementById('result').innerHTML=html;
}
showResult();
</script>
</body>
</html>
