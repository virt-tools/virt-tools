<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heating BTU Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Heating BTU Calculator</h1>
<p class="subtitle">Estimate BTU capacity needed to heat a room based on insulation and climate.</p>
<div class="input-section">
<label>Room Area (sq ft)</label>
<input type="number" id="area" value="300" min="50" aria-label="Area">
<label>Ceiling Height (ft)</label>
<input type="number" id="height" value="8" min="7" step="0.5" aria-label="Height">
<label>Insulation Quality</label>
<select id="insul" aria-label="Insul">
<option value="0.045">Excellent (R-30+ walls, R-50+ attic)</option>
<option value="0.07" selected>Average</option>
<option value="0.12">Poor (old home, drafty)</option>
<option value="0.20">Very Poor (no insulation)</option>
</select>
<label>Outside Design Temp (°F)</label>
<input type="number" id="outside" value="20" step="1" aria-label="Outside">
<label>Inside Target Temp (°F)</label>
<input type="number" id="inside" value="70" step="1" aria-label="Inside">
<label>Number of Exterior Walls</label>
<input type="number" id="walls" value="2" min="1" max="4" aria-label="Walls">
<button id="calc" class="primary-btn" type="button">Calculate</button>
</div>
<div class="result-section" id="result" style="display:none;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const result=document.getElementById('result');
const A=parseFloat(document.getElementById('area').value)||0;
const H=parseFloat(document.getElementById('height').value)||8;
const U=parseFloat(document.getElementById('insul').value);
const oT=parseFloat(document.getElementById('outside').value)||0;
const iT=parseFloat(document.getElementById('inside').value)||70;
const W=parseInt(document.getElementById('walls').value)||1;
if(A<=0||H<=0){result.textContent='Enter a positive room area and ceiling height.';result.style.display='block';return;}
const deltaT=iT-oT;
if(deltaT<=0){result.textContent='Inside temperature must be warmer than outside temperature.';result.style.display='block';return;}
const vol=A*H;
// Envelope model (ASHRAE-style): heat loss = U x envelope area x dT, plus air
// infiltration. Envelope = exterior walls (W of 4, square-room approximation)
// + ceiling. Infiltration = 0.018 BTU/(cu ft F) x volume x dT, scaled by the
// same insulation quality (tight homes leak less, drafty ones more).
const extWallArea=W*H*Math.sqrt(A);
const envelopeArea=extWallArea+A;
const heatLoss=U*envelopeArea*deltaT;
const infiltration=0.018*vol*deltaT*(U/0.07);
const btu=heatLoss+infiltration;
result.innerHTML=`
<div class="result-row"><span>Room Volume:</span><span>${vol.toFixed(0)} cu ft</span></div>
<div class="result-row"><span>Temperature Difference:</span><span>${deltaT.toFixed(1)}°F</span></div>
<div class="result-row"><span>Overall U-value:</span><span>${U} BTU/(hr·sq ft·°F)</span></div>
<div class="result-row"><span>Envelope Heat Loss:</span><span>${Math.round(heatLoss)} BTU/hr</span></div>
<div class="result-row"><span>Infiltration Loss:</span><span>${Math.round(infiltration)} BTU/hr</span></div>
<div class="result-row"><span>Estimated Heating Need:</span><span>${Math.round(btu)} BTU/hr</span></div>
<div class="result-row"><span>Recommended Heater:</span><span>~${Math.ceil(btu/1000)*1000} BTU/hr</span></div>`;
result.style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
