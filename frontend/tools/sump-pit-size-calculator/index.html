<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Sump Pit Size Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:10px 0}
label.f{font-size:13px;opacity:.85;display:block;margin-bottom:4px}
.field{background:var(--bg,#14181f);border:1px solid var(--border,#2a2f3a);border-radius:8px;padding:10px}
.field:focus-within{border-color:var(--accent,#6ea8fe);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,#6ea8fe) 18%,transparent)}
.field input{box-sizing:border-box;width:100%;background:transparent;color:var(--text,#e6e6e6);border:none;font-size:18px;font-family:ui-monospace,monospace;padding:2px 0;outline:none}
.field .unit{font-size:12px;color:var(--text-dim,#9aa3b2);margin-top:6px}
.out{background:var(--bg-elev,#171a21);border:1px solid var(--border,#2a2f3a);border-radius:10px;padding:16px;margin:12px 0}
.out .big{font-size:2rem;font-weight:800;font-family:ui-monospace,monospace;text-align:center;padding:4px 0 8px}
.out .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border,#2a2f3a);font-size:14px}
.out .row:last-child{border-bottom:none}
.out .row .k{color:var(--text-dim,#9aa3b2)}
.out .row .v{font-family:ui-monospace,monospace;font-weight:700;color:var(--accent,#6ea8fe)}
.err{color:var(--bad,#f87171);font-size:13px;margin:6px 0;min-height:1em}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Sump Pit Size Calculator</h1>
<p>Calculate sump pit volume and capacity from pit diameter and depth. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-d">Diameter</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.6"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-h">Depth</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.9"><div class="unit">m</div></div>
<div class="field"><label class="f" for="in-rate">Inflow rate</label><input type="text" id="in-rate" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.5"><div class="unit">L/s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter pit dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var dEl=document.getElementById("in-d"),hEl=document.getElementById("in-h"),rEl=document.getElementById("in-rate"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var D=pn(dEl.value),H=pn(hEl.value),R=pn(rEl.value);
if(D==null||H==null){return}
if(!isFinite(D)||!isFinite(H)||D<=0||H<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var r=D/2;
var vol=Math.PI*r*r*H;
var volL=vol*1000;
var html='<div class="big">'+rnd(volL,0)+' L</div>';
html+=row("Pit diameter",rnd(D,2)+" m");
html+=row("Pit depth",rnd(H,2)+" m");
html+=row("Pit volume",rnd(volL,0)+" L");
if(R!=null&&isFinite(R)&&R>0){
  var fillTime=volL/R;
  html+=row("Inflow rate",rnd(R,2)+" L/s");
  html+=row("Fill time",rnd(fillTime,0)+" s");
}
out.innerHTML=html;
}
[dEl,hEl,rEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
