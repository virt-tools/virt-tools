<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mass & Weight Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Mass & Weight Converter</h1>
<p class="subtitle">Convert between any mass/weight units — metric, imperial, troy, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Kilogram (kg)</option>
<option value="0.001">Gram (g)</option>
<option value="0.000001">Milligram (mg)</option>
<option value="0.000000001">Microgram (µg)</option>
<option value="1000">Metric Ton (t)</option>
<option value="0.45359237">Pound (lb)</option>
<option value="0.02834952">Ounce (oz)</option>
<option value="0.01459390">Stone (st)</option>
<option value="0.0002">Carat (ct)</option>
<option value="0.06479891">Grain (gr)</option>
<option value="907.18474">Short Ton (US)</option>
<option value="1016.0469">Long Ton (UK)</option>
<option value="0.03110348">Troy Ounce (oz t)</option>
<option value="0.3732417">Troy Pound (lb t)</option>
<option value="5080.2345">Kip (kip)</option>
<option value="2.8349523e-5">Dram (dr)</option>
<option value="6.02214e26">Dalton (Da)</option>
<option value="1.99e30">Solar Mass (M☉)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Kilogram (kg)',1],['Gram (g)',0.001],['Milligram (mg)',0.000001],['Metric Ton (t)',1000],['Pound (lb)',0.45359237],['Ounce (oz)',0.02834952],['Stone (st)',6.35029],['Carat (ct)',0.0002],['Grain (gr)',0.00006479891],['Short Ton (US)',907.18474],['Long Ton (UK)',1016.0469],['Troy Ounce (oz t)',0.03110348],['Troy Pound (lb t)',0.3732417],['Slug',14.5939],['Newton (N)',9.80665],['Kip (kip)',453.59237],['Dram (dr)',0.00177185],['Solar Mass (M☉)',1.989e30]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const kg=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=kg/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
