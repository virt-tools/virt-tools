<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML to JSON Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>YAML to JSON Converter</h1>
<p class="subtitle">Parse YAML and convert to JSON. Handles nested maps, lists, scalars, and inline values.</p>
<div class="input-section">
<label>YAML Input</label>
<textarea id="input" rows="8" placeholder='name: Alice\nage: 30\nitems:\n  - apple\n  - banana' aria-label="Name: Alice\Nage: 30\Nitems:\N    Apple\N    Banana"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function parseYAML(text){
const lines=text.split('\n');
const root={};
let stack=[{indent:-1,obj:root}];
for(let raw of lines){
let line=raw.replace(/\s+$/,'');
if(!line.trim()||line.trim().startsWith('#'))continue;
const indent=line.match(/^(\s*)/)[1].length;
const content=line.trim();
while(stack.length>1&&stack[stack.length-1].indent>=indent)stack.pop();
const parent=stack[stack.length-1].obj;
if(content.startsWith('- ')){
const val=content.slice(2).trim();
const key=parent.__listKey;
if(key){if(!parent[key])parent[key]=[];parent[key].push(parseVal(val));}
else{if(!parent.__rootList)parent.__rootList=[];parent.__rootList.push(parseVal(val));}
continue;
}
const colonIdx=content.indexOf(':');
if(colonIdx===-1)continue;
const key=content.slice(0,colonIdx).trim().replace(/^"|"$/g,'');
let val=content.slice(colonIdx+1).trim();
if(val){parent[key]=parseVal(val);}
else{parent[key]={};stack.push({indent,obj:parent[key]});}
}
return root.__rootList||root;
}
function parseVal(v){
if(v.startsWith('"')&&v.endsWith('"'))return v.slice(1,-1);
if(v.startsWith("'")&&v.endsWith("'"))return v.slice(1,-1);
if(v==='true')return true;
if(v==='false')return false;
if(v==='null'||v==='~')return null;
if(v.startsWith('[')){try{return JSON.parse(v.replace(/'/g,'"'));}catch(e){return [];}}
if(!isNaN(v))return Number(v);
return v;
}
document.getElementById('run').addEventListener('click',()=>{
try{
const data=parseYAML(document.getElementById('input').value);
document.getElementById('result').innerHTML='<textarea rows="12" style="width:100%;font-family:monospace;"readonly aria-label="Textarea">'+JSON.stringify(data,null,2)+'</textarea><button onclick="navigator.clipboard.writeText(this.previousElementSibling.value)" type="button">Copy</button>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red;">Error: '+e.message+'</p>';}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
