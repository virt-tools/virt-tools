<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML to JSON Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>YAML to JSON Converter</h1>
<p class="subtitle">Parse YAML and convert to JSON. Handles nested maps, lists, scalars, and inline values.</p>
<div class="input-section">
<label for="input">YAML Input</label>
<textarea id="input" rows="8" placeholder="name: Alice&#10;age: 30&#10;items:&#10;  - apple&#10;  - banana"></textarea>
<button id="run" class="primary-btn" style="margin-top:8px;" type="button">Convert</button>
</div>
<div id="result" style="margin-top:1em;" aria-live="polite"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function renderOutput(value){const result=document.getElementById('result'),output=document.createElement('textarea'),copy=document.createElement('button');output.rows=12;output.style.cssText='width:100%;font-family:monospace;';output.readOnly=true;output.setAttribute('aria-label','JSON output');output.value=value;copy.type='button';copy.textContent='Copy';copy.addEventListener('click',()=>navigator.clipboard.writeText(output.value));result.replaceChildren(output,copy);}
function renderError(message){const error=document.createElement('p');error.style.color='var(--bad)';error.textContent='Error: '+message;document.getElementById('result').replaceChildren(error);}
function findColon(s){
for(let k=0;k<s.length;k++){
if(s[k]==='"'||s[k]==="'")return -1;
if(s[k]===':')return(k===s.length-1||s[k+1]===' ')?k:-1;
}
return -1;
}
function stripComment(v){
if(v.startsWith('"')||v.startsWith("'")){
const q=v[0],end=v.indexOf(q,1);
if(end>-1)return v.slice(0,end+1);
return v;
}
return v.replace(/\s+#.*$/,'');
}
function parseVal(v){
v=v.trim();
if(v.startsWith('"')&&v.endsWith('"'))return v.slice(1,-1);
if(v.startsWith("'")&&v.endsWith("'"))return v.slice(1,-1);
if(v==='true')return true;
if(v==='false')return false;
if(v==='null'||v==='~')return null;
if(v.startsWith('[')){try{return JSON.parse(v.replace(/'/g,'"'));}catch(e){return [];}}
if(v.startsWith('{')){try{return JSON.parse(v.replace(/'/g,'"'));}catch(e){return {};}}
if(!isNaN(v)&&v!=='')return Number(v);
return v;
}
function parseYAML(text){
const lines=[];
for(let raw of text.split('\n')){
const line=raw.replace(/\s+$/,'');
if(!line.trim()||line.trim().startsWith('#'))continue;
lines.push({indent:line.match(/^\s*/)[0].length,content:line.trim()});
}
let i=0;
function isItem(l){return l.content==='-'||l.content.startsWith('- ');}
function parseBlock(){
const first=lines[i];
if(isItem(first))return parseList(first.indent);
if(findColon(first.content)>0)return parseMap(first.indent,first.content);
i++;
return parseVal(stripComment(first.content));
}
function parseList(indent){
const arr=[];
while(i<lines.length&&lines[i].indent===indent&&isItem(lines[i])){
const rest=lines[i].content==='-'?'':lines[i].content.slice(2).trim();
i++;
if(!rest){
if(i<lines.length&&lines[i].indent>indent)arr.push(parseBlock());
else arr.push(null);
}else if(findColon(rest)>0){
arr.push(parseMap(indent+2,rest));
}else{
arr.push(parseVal(stripComment(rest)));
}
}
return arr;
}
function parseMap(indent,firstContent){
const obj={};
let content=firstContent;
for(;;){
const ci=findColon(content);
const key=content.slice(0,ci).trim().replace(/^"|"$/g,'');
const val=content.slice(ci+1).trim();
if(val){
obj[key]=parseVal(stripComment(val));
}else if(i<lines.length&&lines[i].indent>indent){
obj[key]=parseBlock();
}else if(i<lines.length&&lines[i].indent===indent&&isItem(lines[i])){
obj[key]=parseList(indent);
}else{
obj[key]={};
}
if(i<lines.length&&lines[i].indent===indent&&findColon(lines[i].content)>0){content=lines[i].content;i++;continue;}
break;
}
return obj;
}
if(!lines.length)return {};
const data=parseBlock();
if(i<lines.length)throw new Error('Could not parse line: "'+lines[i].content+'"');
return data;
}
document.getElementById('run').addEventListener('click',()=>{
const text=document.getElementById('input').value;
if(!text.trim()){renderError('Enter YAML above, then press Convert.');return;}
try{
const data=parseYAML(text);
renderOutput(JSON.stringify(data,null,2));
}catch(e){renderError(e.message);}
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
