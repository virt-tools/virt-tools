<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four-Square Cipher — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.fs{max-width:600px;margin:0 auto;padding:2rem 1rem}
.fs h1{font-size:2rem;margin-bottom:.5rem}
.fs .sub{color:#888;margin-bottom:1.5rem}
.fs textarea{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;min-height:80px;resize:vertical}
.fs input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box;margin-top:1rem}
.fs .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1rem}
.fs .copy{padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;margin-left:8px}
.fs .output{margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;word-break:break-all}
.fs label{font-size:14px;display:block;margin-top:1rem;margin-bottom:4px}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="fs">
<h1>🔐 Four-Square Cipher</h1>
<p class="sub">Encrypt and decrypt using the Four-Square cipher — four 5×5 squares (two plain, two keyed) for stronger digraph substitution.</p>
<label for="input">Input text:</label>
<textarea id="input" placeholder="Enter text..." oninput="convert()">HELLO WORLD</textarea>
<label for="key1">Key 1:</label>
<input type="text" id="key1" value="EXAMPLE" oninput="convert()">
<label for="key2">Key 2:</label>
<input type="text" id="key2" value="KEYWORD" oninput="convert()">
<button class="btn" onclick="convert()" type="button">Run</button>
<button class="copy" onclick="copyOut()" type="button">Copy</button>
<div class="output" id="output"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function clean(t){return t.toUpperCase().replace(/[^A-Z]/g,'').replace('J','I');}
function makeSquare(key){
  key=clean(key);const seen=new Set();let sq='';
  for(const c of key){if(!seen.has(c)){seen.add(c);sq+=c;}}
  for(let i=65;i<=90;i++){const c=String.fromCharCode(i);if(c==='J')continue;if(!seen.has(c)){seen.add(c);sq+=c;}}
  return sq;
}
const PLAIN='ABCDEFGHIKLMNOPQRSTUVWXYZ';
function findPos(sq,c){const idx=sq.indexOf(c);return[Math.floor(idx/5),idx%5];}
function encPair(sq1,sq2,p1,p2){
  const[a1,b1]=findPos(PLAIN,p1);const[a2,b2]=findPos(PLAIN,p2);
  return[sq1[a1*5+b2],sq2[a2*5+b1]];
}
function decPair(sq1,sq2,c1,c2){
  const[a1,b1]=findPos(sq1,c1);const[a2,b2]=findPos(sq2,c2);
  return[PLAIN[a1*5+b2],PLAIN[a2*5+b1]];
}
function fourSquare(text,k1,k2,decrypt){
  text=clean(text);if(text.length%2)text+='X';
  const sq1=makeSquare(k1),sq2=makeSquare(k2);
  let result='';
  for(let i=0;i<text.length;i+=2){
    const[a,b]=decrypt?decPair(sq1,sq2,text[i],text[i+1]):encPair(sq1,sq2,text[i],text[i+1]);
    result+=a+b;
  }
  return result;
}
function convert(){
  const text=document.getElementById('input').value;
  const k1=document.getElementById('key1').value;
  const k2=document.getElementById('key2').value;
  if(!k1||!k2){document.getElementById('output').textContent='Enter both keys';return;}
  document.getElementById('output').textContent=fourSquare(text,k1,k2,false);
}
function copyOut(){
  const t=document.getElementById('output').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
}
convert();
</script>
</body>
</html>
