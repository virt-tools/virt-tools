<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Merger — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>JSON Merger</h1>
<p class="subtitle">Deep-merge multiple JSON objects. Deep mode recurses into nested objects; shallow mode overwrites. 100% client-side.</p>
<div class="input-section">
<label>JSON A</label>
<textarea id="a" rows="5" placeholder='{"a":1,"b":{"x":1}}' aria-label="{"></textarea>
<label>JSON B</label>
<textarea id="b" rows="5" placeholder='{"b":{"y":2},"c":3}' aria-label="{"></textarea>
<div class="btn-row">
<button id="deep" class="primary-btn" type="button">Deep Merge</button>
<button id="shallow" class="primary-btn" type="button">Shallow Merge</button>
</div>
</div>
<div id="result" style="margin-top:1em;"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
function deepMerge(a,b){
const r=Array.isArray(a)?[...a]:{...a};
for(const k in b){
if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))r[k]=deepMerge(a[k],b[k]);
else r[k]=b[k];
}
return r;
}
function shallowMerge(a,b){return{...a,...b};}
function show(fn){
try{
const a=JSON.parse(document.getElementById('a').value);
const b=JSON.parse(document.getElementById('b').value);
const r=fn(a,b);
document.getElementById('result').innerHTML='<h3>Merged:</h3><pre>'+JSON.stringify(r,null,2).replace(/</g,'&lt;')+'</pre>';
}catch(e){document.getElementById('result').innerHTML='<p style="color:red">Invalid JSON: '+e.message+'</p>';}
}
document.getElementById('deep').addEventListener('click',()=>show(deepMerge));
document.getElementById('shallow').addEventListener('click',()=>show(shallowMerge));
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
