<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Glass Block Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Glass Block Calculator</h1>
<p>Calculate number of glass blocks needed for a window or wall opening based on dimensions and block size. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-w">Opening width</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 32"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-h">Opening height</label><input type="text" id="in-h" inputmode="decimal" autocomplete="off" placeholder="e.g. 32"><div class="unit">inches</div></div>
<div class="field"><label class="f" for="in-b">Block size</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 8"><div class="unit">inches</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var wEl=document.getElementById("in-w"),hEl=document.getElementById("in-h"),bEl=document.getElementById("in-b"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var W=pn(wEl.value),H=pn(hEl.value),B=pn(bEl.value);
if(W==null||H==null||B==null)return;
if(!isFinite(W)||W<=0||!isFinite(H)||H<=0||!isFinite(B)||B<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var cols=Math.floor(W/B);
var rows=Math.floor(H/B);
var blocks=cols*rows;
var wasteFactor=1.05;
var totalBlocks=Math.ceil(blocks*wasteFactor);
var html='<div class="big">'+totalBlocks+' blocks</div>';
html+=row("Glass blocks needed",totalBlocks);
html+=row("Columns",cols);
html+=row("Rows",rows);
html+=row("Base count",blocks+' blocks');
html+=row("Waste factor","5%");
out.innerHTML=html;
}
[wEl,hEl,bEl].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
