<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Number Validator & Formatter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<h1>Phone Number Validator & Formatter</h1>
<p class="subtitle">Parse and validate phone numbers in E.164, national, and international formats. Format to (XXX) XXX-XXXX, +CC XXX..., and RFC 3966 tel: URI. 100% client-side.</p>
<div style="max-width:600px;margin-top:1.5rem;">
<label style="font-weight:600;">Phone Number</label>
<input type="text" id="phoneInput" placeholder="+1 (555) 123-4567" style="width:100%;font-size:1.1rem;padding:.6rem;border:2px solid #ddd;border-radius:8px;margin-top:.4rem;" aria-label="+1 (555) 123 4567">
<div id="result" style="margin-top:1rem;padding:1rem;border-radius:8px;background:#f5f5f5;">
  <span style="color:#999;">Enter a phone number</span>
</div>
<div id="details" style="margin-top:1rem;"></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
const input = document.getElementById('phoneInput');
const result = document.getElementById('result');
const details = document.getElementById('details');
const CC = {
  '1':'US/CA','7':'RU/KZ','20':'EG','27':'ZA','30':'GR','31':'NL','32':'BE','33':'FR','34':'ES','36':'HU','39':'IT','40':'RO','41':'CH','43':'AT','44':'GB','45':'DK','46':'SE','47':'NO','48':'PL','49':'DE','51':'PE','52':'MX','53':'CU','54':'AR','55':'BR','56':'CL','57':'CO','58':'VE','60':'MY','61':'AU','62':'ID','63':'PH','64':'NZ','65':'SG','66':'TH','81':'JP','82':'KR','84':'VN','86':'CN','90':'TR','91':'IN','92':'PK','93':'AF','94':'LK','95':'MM','98':'IR','212':'MA','213':'DZ','234':'NG','254':'KE','255':'TZ','256':'UG','263':'ZW','351':'PT','352':'LU','353':'IE','354':'IS','358':'FI','359':'BG','370':'LT','371':'LV','372':'EE','374':'AM','375':'BY','376':'AD','380':'UA','381':'RS','385':'HR','386':'SI','420':'CZ','421':'SK','880':'BD','962':'JO','963':'SY','964':'IQ','965':'KW','966':'SA','971':'AE','972':'IL','974':'QA','977':'NP','994':'AZ','995':'GE','998':'UZ'
};
function parsePhone(raw){
  let s = raw.replace(/[\s\-\.\(\)]/g,'');
  if(!s) return null;
  if(!s.startsWith('+')){
    s = '+' + s.replace(/^00/,'');
  }
  if(!/^\+\d{7,15}$/.test(s)) return {valid:false,reason:'Invalid length or non-digit characters'};
  let cc = '', rest = '';
  for(let len=3; len>=1; len--){
    const tryCC = s.slice(1,1+len);
    if(CC[tryCC]){ cc = tryCC; rest = s.slice(1+len); break; }
  }
  if(!cc){ cc = s.slice(1,2); rest = s.slice(3); }
  if(rest.length < 3) return {valid:false,reason:'Number too short after country code'};
  const national = rest;
  let formattedNational = national;
  if(cc === '1' && national.length === 10){
    formattedNational = '('+national.slice(0,3)+') '+national.slice(3,6)+'-'+national.slice(6);
  } else if(national.length > 4){
    const g = Math.ceil(national.length/3);
    formattedNational = national.replace(new RegExp('(.{1,'+Math.min(4,national.length/2|0)+'})','g'),'$1 ').trim();
  }
  return {
    valid:true, e164: s, cc, country: CC[cc]||'Unknown',
    national, formattedNational,
    international: '+'+cc+' '+formattedNational,
    telUri: 'tel:'+s
  };
}
function update(){
  const v = parsePhone(input.value.trim());
  if(!v){ result.innerHTML='<span style="color:#999;">Enter a phone number</span>'; details.innerHTML=''; return; }
  if(!v.valid){
    result.style.background='#fdf0f0';
    result.innerHTML='❌ <strong>Invalid</strong> — '+v.reason;
    details.innerHTML=''; return;
  }
  result.style.background='#e8f8e8';
  result.innerHTML='✅ <strong>Valid</strong> — '+v.country;
  details.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:.9rem;">'+
    [['E.164',v.e164],['International',v.international],['National',v.formattedNational],['Country Code','+'+v.cc+' ('+v.country+')'],['tel: URI',v.telUri]]
    .map(([k,val])=>'<tr><td style="padding:.4rem;border-bottom:1px solid #eee;font-weight:600;">'+k+'</td><td style="padding:.4rem;border-bottom:1px solid #eee;font-family:monospace;">'+val+'</td></tr>').join('')+
    '</table>';
  details.innerHTML += '<div style="margin-top:.5rem;"><button onclick="navigator.clipboard.writeText(\''+v.e164+'\')" style="padding:.3rem .6rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;" type="button">Copy E.164</button></div>';
}
input.addEventListener('input', update);
})();
</script>
</body>
</html>
