<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inflation Calculator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.ic{max-width:520px;margin:0 auto;padding:2rem 1rem}
.ic h1{font-size:2rem;margin-bottom:.5rem}
.ic .sub{color:#888;margin-bottom:1.5rem}
.ic label{font-size:14px;display:block;margin-bottom:4px;margin-top:1rem}
.ic input{width:100%;font-size:15px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);box-sizing:border-box}
.ic .btn{padding:10px 22px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:1.5rem}
.ic .results{margin-top:2rem}
.ic .res-card{padding:1.2rem;border:1px solid var(--border);border-radius:12px;margin-bottom:1rem;background:var(--bg)}
.ic .res-card .big{font-size:2rem;font-weight:700;color:var(--accent)}
.ic .res-card .lbl{color:#888;font-size:13px}
.ic .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.ic table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:13px}
.ic th,.ic td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.ic th{color:#888;font-weight:600}
</style>
</head>
<body>
<header id="site-header"></header>
<main class="ic">
<h1>📉 Inflation Calculator</h1>
<p class="sub">See how purchasing power changes over time with inflation.</p>
<label for="amount">Amount ($):</label>
<input type="number" id="amount" value="1000" min="0" step="0.01" oninput="calc()">
<label for="rate">Annual Inflation Rate (%):</label>
<input type="number" id="rate" value="3" min="0" step="0.1" oninput="calc()">
<label for="years">Years:</label>
<input type="number" id="years" value="10" min="1" max="100" step="1" oninput="calc()">
<button class="btn" onclick="calc()" type="button">Calculate</button>
<div class="results" id="results"></div>
</main>
<script src="/assets/app.js"></script>
<script>
function calc(){
  const amt=parseFloat(document.getElementById('amount').value)||0;
  const rate=parseFloat(document.getElementById('rate').value)||0;
  const yrs=parseInt(document.getElementById('years').value)||1;
  const futureCost=amt*Math.pow(1+rate/100,yrs);
  const lostPurchasing=amt-futureCost/(1+rate/100);
  let html='<div class="grid2">';
  html+='<div class="res-card"><div class="lbl">Future Cost (same goods)</div><div class="big">$'+futureCost.toFixed(2)+'</div></div>';
  html+='<div class="res-card"><div class="lbl">Real Value Today</div><div class="big" style="color:#e74c3c">$'+(amt/Math.pow(1+rate/100,yrs)).toFixed(2)+'</div></div>';
  html+='</div>';
  html+='<div class="res-card"><div class="lbl">Purchasing Power Lost</div><div class="big" style="color:#e67e22;font-size:1.5rem">$'+(amt-amt/Math.pow(1+rate/100,yrs)).toFixed(2)+'</div>';
  html+='<div class="lbl">'+((1-1/Math.pow(1+rate/100,yrs))*100).toFixed(1)+'% of purchasing power eroded over '+yrs+' years</div></div>';
  html+='<div class="res-card"><div class="lbl">Year-by-year breakdown</div>';
  html+='<table><tr><th>Year</th><th>Equivalent Cost</th><th>Real Value</th></tr>';
  for(let y=1;y<=Math.min(yrs,20);y++){
    const fc=amt*Math.pow(1+rate/100,y);
    const rv=amt/Math.pow(1+rate/100,y);
    html+='<tr><td>'+y+'</td><td>$'+fc.toFixed(2)+'</td><td>$'+rv.toFixed(2)+'</td></tr>';
  }
  if(yrs>20)html+='<tr><td colspan=3>... '+yrs+' years total</td></tr>';
  html+='</table></div>';
  document.getElementById('results').innerHTML=html;
}
calc();
</script>
</body>
</html>
