<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Recloser Coordination Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Recloser Coordination Calculator</h1>
<p>Calculate recloser fast and slow curve timing intervals for coordination with downstream fuses and upstream relays. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-if">Fault current</label><input type="text" id="in-if" inputmode="decimal" autocomplete="off" placeholder="e.g. 5000"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-ci">Coordination interval</label><input type="text" id="in-ci" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.3"><div class="unit">s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var iE=document.getElementById("in-if"),cE=document.getElementById("in-ci"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var i=parseFloat(iE.value),c=parseFloat(cE.value);
if(isNaN(i)||isNaN(c))return;
if(i<=0||c<0){err.textContent="Fault current must be positive; interval must be non-negative.";return}
err.textContent="";
var fastTime=0.05+0.2*Math.log10(i/100);
var slowTime=fastTime+c;
var html='<div class="big">'+(Math.round(slowTime*1000)/1000)+' s</div>';
html+=row("Fast curve trip",Math.round(fastTime*1000)/1000+' s');
html+=row("Slow curve trip",Math.round(slowTime*1000)/1000+' s');
html+=row("Coordination margin",c+' s');
out.innerHTML=html;
}
[iE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
