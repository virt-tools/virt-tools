<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Timber Span Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Timber Span Calculator</h1>
<p>Estimate allowable span for timber beams based on width, depth, grade stress, and load. Runs locally in your browser.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-b">Width</label><input type="text" id="in-b" inputmode="decimal" autocomplete="off" placeholder="e.g. 50"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-d">Depth</label><input type="text" id="in-d" inputmode="decimal" autocomplete="off" placeholder="e.g. 200"><div class="unit">mm</div></div>
<div class="field"><label class="f" for="in-fb">Bending stress</label><input type="text" id="in-fb" inputmode="decimal" autocomplete="off" placeholder="e.g. 12"><div class="unit">MPa</div></div>
<div class="field"><label class="f" for="in-w">Load</label><input type="text" id="in-w" inputmode="decimal" autocomplete="off" placeholder="e.g. 2"><div class="unit">kN/m</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter beam dimensions.</span></div>
<p class="note">All calculations run locally in your browser — nothing leaves your device.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function pn(s){if(s==null)return null;s=String(s).trim();if(!s)return null;if(!/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;var v=Number(s);return isFinite(v)?v:NaN}
function rnd(x,n){if(!isFinite(x))return"—";var p=Math.pow(10,n);return Math.round(x*p)/p}
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var bEl=document.getElementById("in-b"),dEl=document.getElementById("in-d"),fbEl=document.getElementById("in-fb"),wEl=document.getElementById("in-w"),err=document.getElementById("err"),out=document.getElementById("out");
function calc(){
var B=pn(bEl.value),D=pn(dEl.value),FB=pn(fbEl.value),W=pn(wEl.value);
if(B==null||D==null){return}
FB=FB==null?12:FB;W=W==null?2:W;
if(!isFinite(B)||!isFinite(D)||!isFinite(FB)||!isFinite(W)||B<=0||D<=0||FB<=0||W<=0){err.textContent="Enter valid positive values.";return}
err.textContent="";
var S=B*D*D/6;
var M=FB*S/1000;
var L=Math.sqrt(8*M/W)*1000;
var deflLimit=L/360;
var E=9000;
var I=B*D*D*D/12;
var defl=5*W*L*L*L/(384*E*I)*1e9;
var html='<div class="big">'+rnd(L,0)+' mm</div>';
html+=row("Width",rnd(B,0)+" mm");
html+=row("Depth",rnd(D,0)+" mm");
html+=row("Section modulus",rnd(S,0)+" mm³");
html+=row("Allowable span",rnd(L,0)+" mm");
html+=row("Deflection limit",rnd(deflLimit,1)+" mm");
out.innerHTML=html;
}
[bEl,dEl,fbEl,wEl].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
calc();
})();
</script>
</body>
</html>
