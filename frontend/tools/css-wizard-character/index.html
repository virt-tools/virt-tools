<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Wizard Generator — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
.tool-area{max-width:800px;margin:2rem auto;padding:0 1rem}
.controls{display:grid;gap:.8rem;margin:1.5rem 0;padding:1.5rem;background:#1a1a2e;border-radius:12px}
.ctrl-row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ctrl-row label{font-weight:600;font-size:.9rem;min-width:120px}
.ctrl-row select,.ctrl-row input{padding:.5rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee}
.preview-box{margin:1.5rem 0;background:radial-gradient(circle at center,#1a1a4a,#0a0a2a);border-radius:12px;overflow:hidden;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center}
.output-block{margin:1.5rem 0}
.output-block textarea{width:100%;min-height:120px;font-family:monospace;font-size:.85rem;padding:1rem;border-radius:8px;border:1px solid #444;background:#0f0f1e;color:#eee;resize:vertical}
.copy-btn{padding:.6rem 1.2rem;border:none;border-radius:8px;background:#667eea;color:#fff;cursor:pointer;font-size:.9rem;margin-top:.5rem}
h2{margin-top:2rem;font-size:1.2rem}
</style>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="tool-area">
<h1>🧙 CSS Wizard Generator</h1>
<p>Create CSS wizard with pointy hat, robe, staff with glowing orb, and beard. 3 hat colors. Copy HTML+CSS.</p>
<div class="controls">
<div class="ctrl-row"><label>Robe Color</label><input type="color" id="robeColor" value="#3f51b5" style="width:60px;height:36px"></div>
<div class="ctrl-row"><label>Hat Color</label><select id="hatColor"><option value="#3949ab">Indigo</option><option value="#1b5e20">Forest</option><option value="#4a148c">Purple</option><option value="#bf360c">Crimson</option></select></div>
<div class="ctrl-row"><label>Beard</label><select id="beard"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Staff Glow</label><select id="staffGlow"><option value="on">On</option><option value="off">Off</option></select></div>
<div class="ctrl-row"><label>Size</label><input type="range" id="size" min="120" max="280" value="200" style="width:200px"></div>
</div>
<h2>Preview</h2><div class="preview-box"><div id="preview"></div></div>
<h2>HTML</h2><div class="output-block"><textarea id="htmlOut" readonly></textarea><button class="copy-btn" onclick="copyText('htmlOut')">Copy HTML</button></div>
<h2>CSS</h2><div class="output-block"><textarea id="cssOut" readonly></textarea><button class="copy-btn" onclick="copyText('cssOut')">Copy CSS</button></div>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
function update(){
var rc=document.getElementById('robeColor').value;
var hc=document.getElementById('hatColor').value;
var bd=document.getElementById('beard').value;
var sg=document.getElementById('staffGlow').value;
var sz=parseInt(document.getElementById('size').value);
var hd=sz*0.15,bw=sz*0.25,bh=sz*0.25;
var html='<div class="wizard">\n  <div class="hat"><div class="hat-tip"></div><div class="hat-brim"></div></div>\n  <div class="head"></div>'+(bd==='on'?'\n  <div class="beard"></div>':'')+'\n  <div class="body"></div>\n  <div class="arm a-left"></div>\n  <div class="arm a-right"></div>\n  <div class="staff"><div class="orb"></div></div>\n</div>';
var css='.wizard{position:relative;display:flex;flex-direction:column;align-items:center}\n';
css+='.hat{position:relative;z-index:4;width:'+(hd*1.4)+'px;margin-bottom:-'+(hd*0.1)+'px}\n';
css+='.hat-tip{width:0;height:0;border-left:'+(hd*0.7)+'px solid transparent;border-right:'+(hd*0.7)+'px solid transparent;border-bottom:'+(sz*0.2)+'px solid '+hc+';margin:0 auto}\n';
css+='.hat-brim{width:'+(hd*1.6)+'px;height:'+(hd*0.2)+'px;background:'+hc+';border-radius:50%;margin-top:-'+(hd*0.05)+'px}\n';
css+='.head{width:'+hd+'px;height:'+hd+'px;background:#ffcc80;border-radius:50%;z-index:3;position:relative}\n';
if(bd==='on'){css+='.beard{position:absolute;bottom:-'+(hd*0.1)+'px;left:50%;transform:translateX(-50%);width:'+(hd*0.8)+'px;height:'+(hd*0.7)+'px;background:#e0e0e0;border-radius:30% 30% 50% 50%;z-index:2}\n'}
css+='.body{width:'+bw+'px;height:'+bh+'px;background:linear-gradient(180deg,'+rc+','+rc+' 80%,rgba(0,0,0,0.3));border-radius:20% 20% 10% 10%;position:relative;z-index:2}\n';
css+='.arm{position:absolute;width:'+(bw*0.25)+'px;height:'+(bh*0.7)+'px;background:'+rc+';border-radius:50%;z-index:1;top:'+(bh*0.1)+'px}\n';
css+='.a-left{left:-'+(bw*0.15)+'px;transform:rotate(-15deg)}.a-right{right:-'+(bw*0.15)+'px;transform:rotate(30deg)}\n';
css+='.staff{position:absolute;right:-'+(sz*0.18)+'px;top:0;width:'+(sz*0.04)+'px;height:'+(sz*0.35)+'px;background:#8d6e63;z-index:5;transform:rotate(10deg)}\n';
css+='.orb{position:absolute;top:-'+(sz*0.04)+'px;left:-'+(sz*0.015)+'px;width:'+(sz*0.07)+'px;height:'+(sz*0.07)+'px;background:radial-gradient(circle,#e1f5fe,#42a5f5);border-radius:50%}\n';
if(sg==='on'){css+='.orb{box-shadow:0 0 15px #42a5f5,0 0 30px #42a5f5}\n'}
document.getElementById('preview').innerHTML='<style>'+css+'</style>'+html;
document.getElementById('htmlOut').value=html;
document.getElementById('cssOut').value=css;
}
function copyText(id){var t=document.getElementById(id);t.select();document.execCommand('copy')}
['robeColor','hatColor','beard','staffGlow','size'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',update);el.addEventListener('change',update)});
update();
</script>
</body>
</html>
