<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Converter — virt.tools</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="tool-container">
<h1>Energy Converter</h1>
<p class="subtitle">Convert between joules, calories, kWh, BTU, eV, and more.</p>
<div class="input-section">
<label>Value</label>
<input type="number" id="value" value="1" step="any" aria-label="Value">
<label>From Unit</label>
<select id="from" aria-label="From">
<option value="1" selected>Joule (J)</option>
<option value="4.184">Calorie (cal)</option>
<option value="4184">Kilocalorie (kcal)</option>
<option value="3600000">Kilowatt-hour (kWh)</option>
<option value="1055.05585">BTU</option>
<option value="1.602176634e-19">Electronvolt (eV)</option>
<option value="0.01">Erg</option>
<option value="9.80665">kgf·m</option>
<option value="1.355817959">ft·lbf</option>
<option value="1000">Kilojoule (kJ)</option>
<option value="1000000">Megajoule (MJ)</option>
<option value="4184">Thermie (th)</option>
<option value="105480400">Therm (US)</option>
<option value="120">Ton of TNT (tTNT)</option>
<option value="8.9875518e16">Atomic mass unit (u·c²)</option>
<option value="1.5e24">Hartree (Eh)</option>
</select>
<button id="calc" class="primary-btn" type="button">Convert</button>
</div>
<div class="result-section" id="result" style="display:none;"></div>
<script>
const UNITS=[['Joule (J)',1],['Kilojoule (kJ)',1000],['Megajoule (MJ)',1e6],['Calorie (cal)',4.184],['Kilocalorie (kcal)',4184],['Kilowatt-hour (kWh)',3.6e6],['BTU',1055.05585],['Electronvolt (eV)',1.602176634e-19],['Erg',1e-7],['kgf·m',9.80665],['ft·lbf',1.355817959],['Thermie (th)',4184],['Therm (US)',1.0548e8],['Ton of TNT',4.184e9],['Hartree (Eh)',4.3597e-18],['ft·pdl',0.04214011]];
document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('calc').addEventListener('click',()=>{
const v=parseFloat(document.getElementById('value').value)||0;
const f=parseFloat(document.getElementById('from').value);
const j=v*f;
let html='';
UNITS.forEach(([name,factor])=>{
const r=j/factor;
html+=`<div class="result-row"><span>${name}:</span><span>${r.toLocaleString(undefined,{maximumFractionDigits:8})}</span></div>`;
});
document.getElementById('result').innerHTML=html;
document.getElementById('result').style.display='block';
});
});
</script>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
