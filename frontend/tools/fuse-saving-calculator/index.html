<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/assets/theme-init.js"></script>
<title>Fuse Saving Calculator — Virtual Tools</title>
<link rel="stylesheet" href="/assets/style.css">

  <link rel="stylesheet" href="/assets/tool-css/tool-form-93adeb96.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="tool-header">
<a class="back" href="/">← All tools</a>
<h1>Fuse Saving Calculator</h1>
<p>Determine if fuse saving is feasible by comparing recloser fast curve clearing time with fuse minimum melt time. Runs locally.</p>
</div>
<div class="panel">
<div class="grid2">
<div class="field"><label class="f" for="in-if">Fault current</label><input type="text" id="in-if" inputmode="decimal" autocomplete="off" placeholder="e.g. 3000"><div class="unit">A</div></div>
<div class="field"><label class="f" for="in-mm">Fuse min melt time</label><input type="text" id="in-mm" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.1"><div class="unit">s</div></div>
<div class="field"><label class="f" for="in-ct">Recloser clearing time</label><input type="text" id="in-ct" inputmode="decimal" autocomplete="off" placeholder="e.g. 0.05"><div class="unit">s</div></div>
</div>
<div class="err" id="err" role="alert" aria-live="polite"></div>
<div class="out" id="out" aria-live="polite" aria-atomic="true"><span style="color:var(--text-dim,#9aa3b2)">Enter values to calculate.</span></div>
<p class="note">All calculations run locally in your browser.</p>
</div>
</main>
<script src="/assets/app.js"></script>
<script>
(function(){
function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'}
var iE=document.getElementById("in-if"),mE=document.getElementById("in-mm"),cE=document.getElementById("in-ct"),out=document.getElementById("out"),err=document.getElementById("err");
function calc(){
var i=parseFloat(iE.value),m=parseFloat(mE.value),c=parseFloat(cE.value);
if(isNaN(i)||isNaN(m)||isNaN(c))return;
if(i<=0||m<=0||c<0){err.textContent="Currents must be positive; melt time must be greater than zero.";return}
err.textContent="";
var feasible=c<m;
var margin=m-c;
var html='<div class="big">'+(feasible?"Yes":"No")+'</div>';
html+=row("Fuse saving feasible",feasible?"Yes":"No");
html+=row("Safety margin",Math.round(margin*1000)/1000+' s');
html+=row("Ratio (clear/melt)",(c/m).toFixed(2));
out.innerHTML=html;
}
[iE,mE,cE].forEach(function(el){el.addEventListener("input",calc)});
calc();
})();
</script>
</body>
</html>
