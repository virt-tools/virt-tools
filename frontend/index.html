<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="assets/theme-init.js"></script>
  <title>Virtual Tools — free, private, browser-based utilities</title>
  <meta name="description" content="A collection of free browser-based tools that run locally and preserve your privacy.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#171a21">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="hero">
      <h1>Virtual Tools</h1>
      <p>Free tools for everyday tasks. Your inputs stay in your browser.</p>
      <div class="search-box">
        <label for="tool-search">Find a tool</label>
        <input type="search" id="tool-search" placeholder="Try “JSON”, “mortgage”, or “colour contrast”…" autocomplete="off" spellcheck="false">
      </div>
      <p class="hero-privacy"><a href="privacy/">Privacy &amp; local data</a></p>
    </div>
    <section class="catalog-toolbar" aria-label="Browse tools">
      <div class="view-tabs" role="tablist" aria-label="Catalog view">
        <button class="view-tab active" type="button" role="tab" aria-selected="true" aria-controls="tool-catalog" data-view="all">All tools</button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="tool-catalog" data-view="favorites">Favorites</button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="tool-catalog" data-view="recently-used">Recent</button>
      </div>
      <div class="catalog-sort">
        <label for="catalog-sort">Sort</label>
        <select id="catalog-sort">
          <option value="name">Name</option>
          <option value="newest">Recently added</option>
          <option value="used">Your most used</option>
        </select>
      </div>
    </section>
    <details class="catalog-filters" id="catalog-filters">
      <summary id="catalog-filter-label">Filters</summary>
      <div class="catalog-controls">
        <div class="catalog-filter">
          <label for="category-filter">Category</label>
          <select id="category-filter"><option value="">All categories</option></select>
        </div>
        <div class="catalog-filter">
          <label for="maturity-filter">Review status</label>
          <select id="maturity-filter"><option value="">All statuses</option></select>
        </div>
        <button class="secondary catalog-reset" id="catalog-reset" type="button">Reset filters</button>
      </div>
    </details>
    <section id="catalog-start" class="catalog-start" aria-label="Quick access"></section>
    <div class="catalog-results-heading">
      <p class="tool-count" id="tool-count" role="status" aria-live="polite"></p>
      <button class="link-btn" id="catalog-search-all" type="button" hidden>Search all tools</button>
    </div>
    <p class="note" id="search-empty" hidden>No tools match your search.</p>
    <div id="tool-catalog" role="tabpanel" aria-label="All tools"></div>
    <div class="catalog-more"><button class="secondary" id="catalog-load-more" type="button" hidden>Show more tools</button></div>
    <noscript><p class="panel">JavaScript is required to search and browse the catalog.</p></noscript>
  </main>
  <script src="assets/tools.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
