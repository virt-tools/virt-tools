<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="assets/theme-init.js"></script>
  <title>Virtual Tools — free, private, browser-based utilities</title>
  <meta name="description" content="A collection of free browser-based tools that run locally and preserve your privacy.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4ef">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f0e">
</head>
<body>
  <div id="site-header"></div>
  <main>
    <section class="catalog-masthead">
      <p class="catalog-eyebrow">Browser tools</p>
      <h1>All tools</h1>
      <p class="catalog-lede">Private utilities that run on your device. No accounts, no uploads, no tracking.</p>
    </section>

    <div class="catalog-search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <label class="sr-only" for="tool-search">Search tools</label>
      <input type="search" id="tool-search" placeholder="Search tools" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </div>

    <div class="catalog-chips" id="category-chips" role="group" aria-label="Filter by category"></div>

    <div class="catalog-listbar">
      <p id="tool-count" role="status" aria-live="polite"></p>
      <div class="right">
        <button class="catalog-saved" id="saved-filter" type="button" aria-pressed="false">
          <span class="star-glyph" aria-hidden="true">★</span> Saved
        </button>
        <div class="catalog-sort" role="group" aria-label="Sort order">
          <span class="catalog-sort-label">Sort</span>
          <button class="catalog-sort-btn" type="button" data-sort="name" aria-pressed="true">A–Z</button>
          <span class="sep" aria-hidden="true">·</span>
          <button class="catalog-sort-btn" type="button" data-sort="newest" aria-pressed="false">Recent</button>
        </div>
      </div>
    </div>

    <p class="catalog-empty" id="search-empty" hidden>No tools match your search.</p>
    <div id="tool-catalog" role="region" aria-label="All tools"></div>
    <div class="catalog-more"><button class="secondary" id="catalog-load-more" type="button" hidden>Show more tools</button></div>
    <noscript><p class="panel">JavaScript is required to search and browse the catalog.</p></noscript>
  </main>
  <script src="assets/tools.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
