<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="virt.tools — client-side calculators, converters and planners">
  <title>virt.tools</title>
  <desc>2,000+ client-side tools that never leave the browser: no accounts, no uploads, no tracking.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6a5c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d6a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6a5c"/>
      <stop offset="1" stop-color="#0b5a4e"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="#f4f4ef"/>
  <circle cx="1210" cy="40" r="300" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" fill="none" stroke="#dddfd7"/>

  <!-- Wordmark -->
  <rect x="64" y="96" width="14" height="14" rx="4" fill="url(#mark)"/>
  <text x="90" y="140" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.8" fill="#14171a">virt.tools</text>

  <text x="66" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" fill="#5d636b">Calculators, converters and planners that run entirely in your browser.</text>

  <!-- Claims -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="14" fill="#0b5a4e" letter-spacing="0.2">
    <g text-anchor="middle">
      <rect x="66" y="204" width="116" height="30" rx="15" fill="#0d6a5c" fill-opacity="0.09"/>
      <text x="124" y="224">no accounts</text>
      <rect x="190" y="204" width="112" height="30" rx="15" fill="#0d6a5c" fill-opacity="0.09"/>
      <text x="246" y="224">no uploads</text>
      <rect x="310" y="204" width="114" height="30" rx="15" fill="#0d6a5c" fill-opacity="0.09"/>
      <text x="367" y="224">no tracking</text>
    </g>
  </g>

  <text x="66" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" fill="#5d636b" letter-spacing="0.3">2,000+ tools &#183; 34 categories &#183; open source &#183; static files and one small API</text>

  <!-- Tool grid motif -->
  <g transform="translate(790 60)">
    <g fill="#ffffff" stroke="#dddfd7">
      <rect x="0" y="0" width="56" height="56" rx="12"/>
      <rect x="72" y="0" width="56" height="56" rx="12"/>
      <rect x="144" y="0" width="56" height="56" rx="12"/>
      <rect x="216" y="0" width="56" height="56" rx="12"/>
      <rect x="288" y="0" width="56" height="56" rx="12"/>
      <rect x="0" y="72" width="56" height="56" rx="12"/>
      <rect x="72" y="72" width="56" height="56" rx="12"/>
      <rect x="216" y="72" width="56" height="56" rx="12"/>
      <rect x="288" y="72" width="56" height="56" rx="12"/>
      <rect x="0" y="144" width="56" height="56" rx="12"/>
      <rect x="72" y="144" width="56" height="56" rx="12"/>
      <rect x="144" y="144" width="56" height="56" rx="12"/>
      <rect x="216" y="144" width="56" height="56" rx="12"/>
      <rect x="288" y="144" width="56" height="56" rx="12"/>
    </g>
    <g fill="url(#mark)">
      <rect x="144" y="72" width="56" height="56" rx="12"/>
      <rect x="216" y="72" width="56" height="56" rx="12"/>
      <rect x="144" y="0" width="56" height="56" rx="12"/>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
       font-size="22" fill="#0b5a4e" text-anchor="middle">
      <text x="28" y="37">&#8721;</text>
      <text x="100" y="37">&#37;</text>
      <text x="172" y="37" fill="#f4f4ef">&#8644;</text>
      <text x="244" y="37" fill="#f4f4ef">&#177;</text>
      <text x="316" y="37">&#9633;</text>
      <text x="28" y="109">&#8776;</text>
      <text x="100" y="109">&#8801;</text>
      <text x="172" y="109" fill="#f4f4ef">&#215;</text>
      <text x="244" y="109" fill="#f4f4ef">&#247;</text>
      <text x="316" y="109">&#9679;</text>
      <text x="28" y="181">&#8734;</text>
      <text x="100" y="181">&#8730;</text>
      <text x="172" y="181">&#176;</text>
      <text x="244" y="181">&#916;</text>
      <text x="316" y="181">&#960;</text>
    </g>
  </g>
</svg>
