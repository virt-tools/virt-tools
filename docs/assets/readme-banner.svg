<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" width="1120" height="290" role="img" aria-label="virt.tools — calculators, converters and planners that run entirely in your browser">
  <title>virt.tools</title>
  <desc>Client-side calculators, converters and planners: no accounts, no uploads, no tracking.</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6a5c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d6a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6a5c"/>
      <stop offset="1" stop-color="#0b5a4e"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="290" fill="#f4f4ef"/>
  <circle cx="1050" cy="20" r="250" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1119" height="289" fill="none" stroke="#dddfd7"/>

  <!-- Wordmark -->
  <rect x="56" y="74" width="14" height="14" rx="4" fill="url(#mark)"/>
  <text x="82" y="117" font-family="Instrument Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.8" fill="#14171a">virt.tools</text>

  <text x="58" y="161" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#5d636b">Calculators, converters and planners that run in your browser.</text>

  <!-- Claims -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="15" fill="#0b5a4e" letter-spacing="0.2" text-anchor="middle">
    <rect x="57" y="183" width="122" height="32" rx="16" fill="#0d6a5c" fill-opacity="0.09"/>
    <text x="118" y="204">no accounts</text>
    <rect x="189" y="183" width="116" height="32" rx="16" fill="#0d6a5c" fill-opacity="0.09"/>
    <text x="247" y="204">no uploads</text>
    <rect x="315" y="183" width="118" height="32" rx="16" fill="#0d6a5c" fill-opacity="0.09"/>
    <text x="374" y="204">no tracking</text>
  </g>

  <!-- Tool grid motif -->
  <g transform="translate(752 54)">
    <g fill="#ffffff" stroke="#dddfd7">
      <rect x="0" y="0" width="52" height="52" rx="11"/>
      <rect x="65" y="0" width="52" height="52" rx="11"/>
      <rect x="195" y="0" width="52" height="52" rx="11"/>
      <rect x="260" y="0" width="52" height="52" rx="11"/>
      <rect x="0" y="65" width="52" height="52" rx="11"/>
      <rect x="65" y="65" width="52" height="52" rx="11"/>
      <rect x="195" y="65" width="52" height="52" rx="11"/>
      <rect x="260" y="65" width="52" height="52" rx="11"/>
      <rect x="0" y="130" width="52" height="52" rx="11"/>
      <rect x="65" y="130" width="52" height="52" rx="11"/>
      <rect x="130" y="130" width="52" height="52" rx="11"/>
      <rect x="195" y="130" width="52" height="52" rx="11"/>
      <rect x="260" y="130" width="52" height="52" rx="11"/>
    </g>
    <g fill="url(#mark)">
      <rect x="130" y="0" width="52" height="52" rx="11"/>
      <rect x="130" y="65" width="52" height="52" rx="11"/>
      <rect x="195" y="65" width="52" height="52" rx="11"/>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
       font-size="21" fill="#0b5a4e" text-anchor="middle">
      <text x="26" y="34">&#8721;</text>
      <text x="91" y="34">&#37;</text>
      <text x="156" y="34" fill="#f4f4ef">&#8644;</text>
      <text x="221" y="34" fill="#f4f4ef">&#177;</text>
      <text x="286" y="34">&#9633;</text>
      <text x="26" y="99">&#8776;</text>
      <text x="91" y="99">&#8801;</text>
      <text x="156" y="99" fill="#f4f4ef">&#215;</text>
      <text x="221" y="99" fill="#f4f4ef">&#247;</text>
      <text x="286" y="99">&#9679;</text>
      <text x="26" y="164">&#8734;</text>
      <text x="91" y="164">&#8730;</text>
      <text x="156" y="164">&#176;</text>
      <text x="221" y="164">&#916;</text>
      <text x="286" y="164">&#960;</text>
    </g>
  </g>
</svg>
