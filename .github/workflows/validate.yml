name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned API dependencies
        run: python -m pip install --requirement api/requirements.txt
      - name: Validate generated catalog
        run: python scripts/generate_tool_catalog.py frontend --check
      - name: Validate generated formula workbenches
        run: |
          python scripts/generate_formula_workbenches.py --check
          python scripts/validate_formula_workbenches.py .
      - name: Validate routes and local assets
        run: python scripts/validate_tools.py frontend
      - name: Validate generated conversions
        run: python scripts/validate_generated_conversions.py .
      - name: Validate design and accessibility baseline
        run: python scripts/validate_tool_design.py frontend
      - name: Validate risk quarantine and audit coverage
        run: python scripts/validate_risk_policy.py .
      - name: Validate browser injection defenses
        run: python scripts/validate_browser_security.py
      - name: Validate operational controls
        run: python scripts/validate_operations.py
      - name: Parse all browser JavaScript
        run: node scripts/validate_javascript.mjs frontend
      - name: Execute generated formula functions
        run: node scripts/validate_formula_workbenches.mjs .
      - name: Test safe math expression interpreter
        run: node tests/security/math-expression.test.cjs
      - name: Run API and backup tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
