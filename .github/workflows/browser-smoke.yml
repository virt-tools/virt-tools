name: Browser smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Generate production tool metadata
        run: python scripts/generate_seo.py frontend https://virt.tools
      - name: Start static server
        run: python -m http.server 4173 --bind 127.0.0.1 --directory frontend >/tmp/virt-tools-http.log 2>&1 &
      - name: Exercise homepage and representative tools
        run: |
          node tests/browser_smoke.mjs
          node tests/ui_smoke.mjs
